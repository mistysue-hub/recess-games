<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video clip</title>
<style>
  :root { --bg:#f4f1ea; --ink:#2b2b2b; --muted:#6b6b6b; --card:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1d1f; --ink:#f2f2f2; --muted:#a8a8a8; --card:#2a2a2d; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  .frame { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .card { background:var(--card); border-radius:12px; padding:12px 16px; margin-top:12px; }
  .title { font-weight:600; margin:0; }
  .meta { color:var(--muted); margin:4px 0 0; font-size:14px; }
  .error { padding:24px; text-align:center; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  // Usage: index.html?v=<11-char YouTube id>&start=<seconds>&end=<seconds>&t=<optional title>
  // The video plays from YouTube in YouTube's own player; nothing is copied or stored here.
  (function () {
    var p = new URLSearchParams(location.search);
    var v = p.get('v') || '';
    var start = p.get('start') || '0';
    var end = p.get('end') || '';
    var title = p.get('t') || 'Video lesson';
    var app = document.getElementById('app');
    var ok = /^[A-Za-z0-9_-]{11}$/.test(v) && /^\d+$/.test(start) && (end === '' || /^\d+$/.test(end));
    if (!ok) { app.innerHTML = '<div class="card error">This clip link is missing something. Let a grown-up know.</div>'; return; }
    function mmss(s) { s = parseInt(s, 10); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
    var src = 'https://www.youtube-nocookie.com/embed/' + v +
      '?rel=0&modestbranding=1&playsinline=1&start=' + start + (end ? '&end=' + end : '');
    var frame = document.createElement('div'); frame.className = 'frame';
    var ifr = document.createElement('iframe');
    ifr.src = src; ifr.title = title;
    ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    ifr.allowFullscreen = true; ifr.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.appendChild(ifr);
    var card = document.createElement('div'); card.className = 'card';
    var h = document.createElement('p'); h.className = 'title'; h.textContent = title;
    var m = document.createElement('p'); m.className = 'meta';
    m.textContent = 'Plays ' + mmss(start) + (end ? ' to ' + mmss(end) + ', then stops' : '') + '. Video by The Amazing Flec on YouTube.';
    card.appendChild(h); card.appendChild(m);
    app.appendChild(frame); app.appendChild(card);
  })();
</script>
</body>
</html>
