<script>
const STORY={"start": "Start", "startup": ["Init"], "header": ["Shift Bar"], "passages": {"Init": "(set: $days to (a:))(set: $miss to 0)", "Shift Bar": "<div class=\"casebar\">🛠️ Workdays done: (print: $days's length) / 8 · [[Work schedule->Shop]] · [[Toolbox->Toolbox]]</div>", "Start": "# Keycap & Co.\n## Computer Care 101 · Unit 2: Keep It Healthy\n\n*The bell over the door jingles. The Inspector looks up from a disassembled game controller and slides a new name tag across the counter. It doesn't say TRAINEE anymore. It says* **TECHNICIAN.**\n\n\"Unit 1 taught you to name things and clean them. That was the easy part. This unit is about *why* computers get sick: heat, dust, power problems, moisture, and bumps. It's also about how to stop them before they start.\"\n\n\"Eight workdays. We start with a refresher, so shake off the rust. Then the customers get trickier, and the problems have more than one cause. Same deal as always: miss twice and I'll walk you through it. Every day you finish adds a tool to your kit.\"\n\n<div class=\"warn\">**Shop rule:** Anything involving liquids, batteries, wall power, opening a case, or someone else's device needs a grown-up's OK in real life. Look for these red boxes.</div>\n\n[[Clock in->Shop]]", "Shop": "# 📋 Work Schedule\n*Unit 2: Keep It Healthy.* Each day unlocks when you finish the one before it.\n\n(if: $days contains \"1\")[✅ ](else:)[📋 ][[Day 1: Back at the Bench->D1 Start]]\n(if: $days's length >= 1)[(if: $days contains \"2\")[✅ ](else:)[📋 ][[Day 2: Screens, Cases & Hinges->D2 Start]]](else:)[🔒 Day 2: Screens, Cases & Hinges]\n(if: $days's length >= 2)[(if: $days contains \"3\")[✅ ](else:)[📋 ][[Day 3: Airflow & Heat->D3 Start]]](else:)[🔒 Day 3: Airflow & Heat]\n(if: $days's length >= 3)[(if: $days contains \"4\")[✅ ](else:)[📋 ][[Day 4: Cords, Cables & Power->D4 Start]]](else:)[🔒 Day 4: Cords, Cables & Power]\n(if: $days's length >= 4)[(if: $days contains \"5\")[✅ ](else:)[📋 ][[Day 5: Batteries & Charging->D5 Start]]](else:)[🔒 Day 5: Batteries & Charging]\n(if: $days's length >= 5)[(if: $days contains \"6\")[✅ ](else:)[📋 ][[Day 6: Other Everyday Gear->D6 Start]]](else:)[🔒 Day 6: Other Everyday Gear]\n(if: $days's length >= 6)[(if: $days contains \"7\")[✅ ](else:)[📋 ][[Day 7: Household Hazards->D7 Start]]](else:)[🔒 Day 7: Household Hazards]\n(if: $days's length >= 7)[(if: $days contains \"8\")[✅ ](else:)[📋 ][[Day 8: On the Move->D8 Start]]](else:)[🔒 Day 8: On the Move]\n\n---\n(if: $days's length >= 8)[🎓 [[The Inspector's Unit 2 Exam->Exam Start]]](else:)[🔒 The Inspector's Unit 2 Exam: *finish all 8 days to unlock*]", "Toolbox": "# 🧰 Your Toolbox\nEach day you finish earns a tool.\n\n(if: $days contains \"1\")[📒 **Tech Notebook**: Day 1, Back at the Bench](else:)[▫️ *Earned on Day 1*]\n(if: $days contains \"2\")[🖥️ **Screen Kit**: Day 2, Screens, Cases & Hinges](else:)[▫️ *Earned on Day 2*]\n(if: $days contains \"3\")[🌡️ **Heat Detector**: Day 3, Airflow & Heat](else:)[▫️ *Earned on Day 3*]\n(if: $days contains \"4\")[🔌 **Cable Kit**: Day 4, Cords, Cables & Power](else:)[▫️ *Earned on Day 4*]\n(if: $days contains \"5\")[🔋 **Battery Tester**: Day 5, Batteries & Charging](else:)[▫️ *Earned on Day 5*]\n(if: $days contains \"6\")[🎧 **Gear Bag**: Day 6, Other Everyday Gear](else:)[▫️ *Earned on Day 6*]\n(if: $days contains \"7\")[🐾 **Hazard Map**: Day 7, Household Hazards](else:)[▫️ *Earned on Day 7*]\n(if: $days contains \"8\")[🎒 **Travel Case**: Day 8, On the Move](else:)[▫️ *Earned on Day 8*]\n\n[[Back to the work schedule->Shop]]", "D1 Start": "(set: $miss to 0)# Day 1: Back at the Bench\n\n*The Inspector is waiting at the counter with a small box. Inside is a name badge. It says **TECHNICIAN**.*\n\n\"Don't let it go to your head. You earned it. You named machines, cleaned keyboards, rescued spilled laptops, and fixed more than one sore neck. As of today, you're not a trainee anymore.\"\n\n\"Here's what changes. Trainees learn *what* to do. Technicians learn *why* it works, so they can handle the problems nobody wrote a rule for. The customers get harder, too. Their problems rarely come one at a time.\"\n\n\"So before the real work starts, a fast review. Then I'll introduce you to the five enemies we'll be fighting all unit. Grab a notebook. A good tech writes things down.\"\n\n\n[[Open the shop->D1 L1]]", "D1 L1": "## 📘 The Inspector's lesson: Unit 1 in Five Minutes\n\n*The Inspector talks fast and ticks items off on her fingers.*\n\n### Machines and ports\n* **Four types:** a **laptop** (all in one folding case, with a battery), a **desktop** (the computer is the **tower**; the monitor is just a screen), an **all-in-one** (the computer hides in the back of the monitor, which has its own vents and power cord), and a **Chromebook** (a laptop running ChromeOS).\n* **USB-A** is a flat rectangle that fits one way up. **USB-C** is a small oval that fits either way and can carry power, data, and often video. Newer laptops may have *only* USB-C, so USB-A gear needs an **adapter** or **hub**.\n* **HDMI** has two slanted corners. **DisplayPort** has one. Both carry video. **Ethernet** is the square port for wired internet.\n* Plugs go in **straight and gently**. If it doesn't fit, check the shape instead of pushing harder.\n\n### The golden rule and the kit\n* **Golden rule: power off and unplug before cleaning.** For an all-in-one, that means the cord on the back of the screen.\n* **Liquid goes on the cloth, never on the device.** Damp means *barely* damp.\n* **The kit:** microfiber cloth, soft brush, cotton swabs, compressed air (upright, short bursts), 70% isopropyl alcohol (a grown-up handles it), distilled water.\n* **The trouble bin:** paper towels, window cleaner with ammonia, bleach, scrubby pads, and household vacuums (strong suction and static electricity).\n\n### Keyboards\n* **Membrane** (rubber domes), **scissor-switch** (most laptops), **mechanical** (a switch under each key), **butterfly** (older ultra-flat MacBooks).\n* **Weekly clean:** unplug, flip and tap, compressed air, then a barely damp wipe.\n* **Mechanical keycaps** come off with a puller (photo of the layout first). A sticky switch gets a swab with a little alcohol. **Laptop keys stay on**, because their scissor clips snap.\n* **Spills:** power off and unplug, flip it over (laptops in a tent shape), blot, and dry at least 24 to 48 hours. **No rice.** Sugary drinks leave residue that often needs a **professional cleaning**.\n\n### Mice\n* **Optical and laser** sensors need surface texture, so clear glass makes the cursor jump. A mouse pad fixes it.\n* **Service:** power off, wipe the shell with a little alcohol, and clean the **sensor window with only a puff of air or a dry swab**. On a **trackball**, the gunk hides on the little **support dots** under the ball.\n* A wireless mouse that gets **laggier every day** usually needs a battery change or charge.\n\n### Comfort\n* Top of the screen **at or a little below eye level**, about an arm's length away. Laptops need a **stand plus a separate keyboard and mouse**.\n* **20-20-20:** every 20 minutes, look 20 feet away for 20 seconds. Light from the side.\n* Wrists straight, feet flat (or on a footrest), and **get up and move about once an hour**.\n\n\"Good. Now let's see if you can juggle two of those at once.\"\n\n\n[[Got it. Send in the next customer->D1 J2]]", "D1 J2": "**Jayden** sets his slim laptop on the counter. It has only small oval ports. \"I spilled soda on it yesterday,\" he says. \"I shut it off, tented it, blotted it, and waited two days. It works, but the J key is sticky. Can I pop it off and scrub it? And can I use my old keyboard with the flat plug until it's fixed?\"\n\n**What's the best plan?**\n\n* [[Pop the J key off and scrub under it; plug the keyboard straight in->D1 J2 W]]\n* [[Leave the key on and rinse the soda out with distilled water->D1 J2 W]]\n* [[Leave the key on, book a pro cleaning, and use a USB-C adapter->D1 J2 R]]\n* [[Put the laptop in rice for two days, then reconnect everything->D1 J2 W]]", "D1 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Soda is sugary, so the leftover residue needs a **professional cleaning**. **Laptop keys stay on**, because their scissor clips snap. His laptop is **USB-C only**, and his keyboard is **USB-A**, so he needs an **adapter or hub** in the meantime.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two ideas here: what kind of keys does a laptop have, and what kind of ports does his have?\"\n\n[[Try again->D1 J2]]]", "D1 J2 R": "(set: $miss to 0)## ✅ Job done\n**Leave the key on, get a pro cleaning, and bridge USB-A to USB-C with an adapter.** Jayden handled the spill perfectly, but sugar keeps causing stickiness and can corrode parts inside. Prying a laptop key risks snapping its scissor clip.\n\n[[Next customer->D1 J3]]", "D1 J3": "**Mr. Chen** is back with his all-in-one. \"I want to wipe the screen, so I unplugged my keyboard and mouse. That's the golden rule, right?\" The screen is still glowing.\n\n**What else does he need to do?**\n\n* [[Shut it down and unplug the power cord on the screen->D1 J3 R]]\n* [[Nothing else, since the keyboard and mouse are unplugged->D1 J3 W]]\n* [[Find the tower under his desk and switch that off too->D1 J3 W]]\n* [[Turn the brightness all the way down, then start wiping->D1 J3 W]]", "D1 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The whole computer is inside the back of that monitor. **Shut it down and unplug the power cord on the back of the screen.** Unplugging the keyboard and mouse doesn't cut the power.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"On an all-in-one, where does the computer actually live?\"\n\n[[Try again->D1 J3]]]", "D1 J3 R": "(set: $miss to 0)## ✅ Job done\n**Shut down and unplug the screen's own power cord.** On an all-in-one, the monitor *is* the computer, so it has its own power cord and vents. There's no tower to switch off.\n\n[[Next customer->D1 J4]]", "D1 J4": "**Dev** got a shiny new glass desk. Now his gaming mouse cursor jumps around. \"I figured the sensor was dirty,\" he says, \"so I scrubbed it with an alcohol-soaked swab. Still jumpy.\"\n\n**What's really going on, and what's the right fix?**\n\n* [[The alcohol fogged the sensor, so it needs a replacement lens->D1 J4 W]]\n* [[Glass blocks the wireless signal, so he needs a longer cable->D1 J4 W]]\n* [[The glass has no texture for the sensor; use a mouse pad->D1 J4 R]]\n* [[The mouse needs higher DPI to see through the glass desk->D1 J4 W]]", "D1 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Optical sensors track **surface texture**, and clear glass doesn't have any. A **mouse pad** fixes it. And next time, the sensor window gets **a puff of air or a dry swab**, not a soaked one.\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How does an optical sensor know it's moving? And what's the only thing that touches the sensor window?\"\n\n[[Try again->D1 J4]]]", "D1 J4 R": "(set: $miss to 0)## ✅ Job done\n**A mouse pad.** The sensor needs texture to track, and clear glass has none. The sensor window is like a tiny camera lens: clean it with air or a dry swab only.\n\n[[Next customer->D1 J5]]", "D1 J5": "**Grandpa Leo** brings in his mechanical keyboard, packed with crumbs and Biscuit's fur. \"I'm going to run the house vacuum over it. That'll suck the dog hair right out.\"\n\n**What's a better plan?**\n\n* [[Use the vacuum, but on its lowest setting and only over the keys->D1 J5 W]]\n* [[Pull the caps with a puller, then use compressed air->D1 J5 R]]\n* [[Rinse the whole keyboard in the sink, since dog hair floats out->D1 J5 W]]\n* [[Pry the keys off with a butter knife, then vacuum underneath->D1 J5 W]]", "D1 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Vacuums can rip off small parts and build up **static**. On a **mechanical** keyboard, he can photo the layout, **pull the caps with a puller**, and blow out the fur with **compressed air**.\"\n\n[[Got it->D1 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Why is the vacuum in the trouble bin? And what's special about mechanical keycaps?\"\n\n[[Try again->D1 J5]]]", "D1 J5 R": "(set: $miss to 0)## ✅ Job done\n**Puller, then compressed air.** Take a photo of the layout first so the caps go back in the right places. Household vacuums can zap electronics with static, and the keyboard itself never gets rinsed.\n\n[[Next customer->D1 J6]]", "D1 J6": "**Nora** keeps getting a sore neck from looking down at her laptop. She's borrowing her uncle's old monitor. Its video cable has **one** slanted corner on the plug.\n\n**Which port does that cable use, and where should the monitor go?**\n\n* [[HDMI; the top of the screen level with her chin->D1 J6 W]]\n* [[Ethernet; the top of the screen right at eye level->D1 J6 W]]\n* [[HDMI; the top of the screen a little above her head->D1 J6 W]]\n* [[DisplayPort; top at or a little below eye level->D1 J6 R]]", "D1 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"One slanted corner means **DisplayPort**. HDMI has two. And the **top of the screen goes at or a little below eye level**, so she isn't bending her neck.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Count the slanted corners. Then think about where I said the top of the screen goes.\"\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**DisplayPort, with the top of the screen at or a little below eye level.** HDMI has two slanted corners, and Ethernet is for wired internet, not video. A separate keyboard and mouse finish the setup.\n\n[[Next customer->D1 J7]]", "D1 J7": "**Mr. Patel's** wireless trackball has started skipping and sticking. \"I already put in fresh batteries,\" he says. \"Same problem.\"\n\n**What should he check next?**\n\n* [[Order a new trackball, since fresh batteries didn't help->D1 J7 W]]\n* [[Pop out the ball and clean the support dots underneath->D1 J7 R]]\n* [[Soak the whole trackball in warm, soapy water overnight->D1 J7 W]]\n* [[Spray alcohol into the hole until the skipping stops->D1 J7 W]]", "D1 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Fresh batteries rule out the power problem. Next suspect: gunk on the **little support dots** the ball rests on. Pop out the ball and clean them with a barely damp alcohol swab.\"\n\n[[Got it->D1 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"He's ruled out the battery. Where did I say the gunk hides on a trackball?\"\n\n[[Try again->D1 J7]]]", "D1 J7 R": "(set: $miss to 0)## ✅ Job done\n**Clean the support dots.** Good troubleshooting means ruling out one cause at a time. Batteries are done, so the next most likely cause is grime where the ball rests. Remember: liquid on the swab, never sprayed in.\n\n[[The Inspector has something to show you->D1 L8]]", "D1 L8": "## 📘 The Inspector's lesson: Why Computers Get Sick\n\n*The Inspector writes five words on the whiteboard.*\n\n\"Unit 1 was about keeping things clean. Unit 2 is about keeping them **healthy**. Almost every sick machine I see was hurt by one of these five enemies. Learn how each one does its damage, and you'll know how to stop it.\"\n\n1. **Heat.** Electronics make heat as they work, and fans push it out through the vents. When heat builds up, parts wear out faster, and batteries age faster too. To protect itself, the processor (the computer's main chip, its \"brain\") does **thermal throttling**: it slows itself down to cool off. That's why a hot laptop suddenly feels sluggish. If it gets hot enough, it shuts off.\n2. **Dust.** Dust and pet hair build up on fans and vents like a fuzzy blanket. That **traps heat** inside. So dust is sneaky: it causes trouble by helping enemy number one.\n3. **Power problems.** A **power surge** is a sudden spike of extra voltage, from a lightning storm or the power coming back after an outage. It can fry parts in an instant. **Frayed or bent cables** are a danger too: damaged wires can stop charging, spark, or even start a fire.\n4. **Moisture.** Water carries electricity where it shouldn't go, causing a **short circuit** (power taking a wrong shortcut). Even slow dampness, like a humid basement, causes **corrosion**: metal contacts slowly turn crusty, often green or white, and stop connecting.\n5. **Bumps and pressure.** Drops crack screens. So does squeezing, like a laptop crammed into a full backpack or sat on. Bumps and tugs also **loosen connections**, like a cable that only works at a certain angle.\n\n<div class=\"warn\">**Grown-up needed:** A frayed cable, a burning smell, or a device that's too hot to hold means stop using it and tell a grown-up. Never try to tape up or fix a damaged power cord yourself.</div>\n\n\"Now, detective work. Tell me which enemy did it.\"\n\n\n[[Got it. Send in the next customer->D1 J9]]", "D1 J9": "**Kai's** laptop runs fine at his desk. When he games on his bed with it sitting on a pillow, it gets hot and slows to a crawl after ten minutes, then speeds up again once he sets it on the desk.\n\n**Which enemy is at work?**\n\n* [[Moisture, from the fabric of the pillow->D1 J9 W]]\n* [[Power, from a weak charger on the bed->D1 J9 W]]\n* [[Pressure, from the pillow pushing on it->D1 J9 W]]\n* [[Heat, causing the chip to throttle->D1 J9 R]]", "D1 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Heat.** The pillow blocks the vents, the heat builds up, and the processor **throttles**, slowing itself down to cool off. On the desk, the vents can breathe again.\"\n\n[[Got it->D1 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"It gets hot, then slow, and recovers when it cools. What did I call the processor slowing itself down?\"\n\n[[Try again->D1 J9]]]", "D1 J9 R": "(set: $miss to 0)## ✅ Job done\n**Heat, causing thermal throttling.** The pillow blocks the vents. The slowdown is the processor protecting itself. A hard surface or lap desk lets the air flow.\n\n[[Next customer->D1 J10]]", "D1 J10": "**Ms. Rivera's** desktop was plugged straight into the wall. Last night a thunderstorm knocked the power out for a minute. When the lights came back on, the computer wouldn't start at all.\n\n**Which enemy is the most likely culprit?**\n\n* [[A power surge when the power came back->D1 J10 R]]\n* [[Dust, since storms stir up dust inside->D1 J10 W]]\n* [[Moisture, from rain in the storm clouds->D1 J10 W]]\n* [[Heat, from the fans spinning too fast->D1 J10 W]]", "D1 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **power surge**, a sudden spike of extra voltage. Storms and the power coming back on after an outage are classic causes, and a spike can fry parts in an instant.\"\n\n[[Got it->D1 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say can happen when the power comes back after an outage?\"\n\n[[Try again->D1 J10]]]", "D1 J10 R": "(set: $miss to 0)## ✅ Job done\n**A power surge.** That sudden spike of extra voltage can damage parts in an instant. A computer plugged straight into the wall has nothing between it and that spike.\n\n[[Next customer->D1 J11]]", "D1 J11": "**Tasha** stored an old laptop in her family's damp basement for a year. When she pulls it out, the metal inside the USB port has crusty green spots, and nothing plugged in there works.\n\n**Which enemy did this?**\n\n* [[Bumps, from the laptop sitting on a shelf->D1 J11 W]]\n* [[Heat, from the furnace in the basement->D1 J11 W]]\n* [[Moisture, which corroded the metal->D1 J11 R]]\n* [[Dust, which turned green over time->D1 J11 W]]", "D1 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Moisture.** Damp air slowly **corrodes** metal contacts. They turn crusty, often green or white, and stop connecting.\"\n\n[[Got it->D1 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Crusty, green metal contacts. Which enemy works slowly, even without a spill?\"\n\n[[Try again->D1 J11]]]", "D1 J11 R": "(set: $miss to 0)(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]## ✅ Job done\n**Moisture, through corrosion.** No spill needed: a humid basement is enough over time. Store electronics somewhere dry, like a closet inside the main house.\n\n[[Close up shop->D1 Done]]", "D1 Done": "(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]# Day 1 complete!\n\n<div class=\"tool\">📒 **New tool earned: Tech Notebook**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Start your **Tech Notebook**. Walk through your home and list every device **you** use: computers, tablets, phones, game consoles, keyboards, and mice. For each one, write **what type it is** (for example: laptop, all-in-one, mechanical keyboard, optical mouse) and **one care habit** from Unit 1 that fits it. Bonus: next to each device, write which of the five enemies it faces most. Keep the notebook. You'll add to it all unit.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Unit 1 in Five Minutes\n### Machines and ports\n* **Four types:** a **laptop** (all in one folding case, with a battery), a **desktop** (the computer is the **tower**; the monitor is just a screen), an **all-in-one** (the computer hides in the back of the monitor, which has its own vents and power cord), and a **Chromebook** (a laptop running ChromeOS).\n* **USB-A** is a flat rectangle that fits one way up. **USB-C** is a small oval that fits either way and can carry power, data, and often video. Newer laptops may have *only* USB-C, so USB-A gear needs an **adapter** or **hub**.\n* **HDMI** has two slanted corners. **DisplayPort** has one. Both carry video. **Ethernet** is the square port for wired internet.\n* Plugs go in **straight and gently**. If it doesn't fit, check the shape instead of pushing harder.\n\n### The golden rule and the kit\n* **Golden rule: power off and unplug before cleaning.** For an all-in-one, that means the cord on the back of the screen.\n* **Liquid goes on the cloth, never on the device.** Damp means *barely* damp.\n* **The kit:** microfiber cloth, soft brush, cotton swabs, compressed air (upright, short bursts), 70% isopropyl alcohol (a grown-up handles it), distilled water.\n* **The trouble bin:** paper towels, window cleaner with ammonia, bleach, scrubby pads, and household vacuums (strong suction and static electricity).\n\n### Keyboards\n* **Membrane** (rubber domes), **scissor-switch** (most laptops), **mechanical** (a switch under each key), **butterfly** (older ultra-flat MacBooks).\n* **Weekly clean:** unplug, flip and tap, compressed air, then a barely damp wipe.\n* **Mechanical keycaps** come off with a puller (photo of the layout first). A sticky switch gets a swab with a little alcohol. **Laptop keys stay on**, because their scissor clips snap.\n* **Spills:** power off and unplug, flip it over (laptops in a tent shape), blot, and dry at least 24 to 48 hours. **No rice.** Sugary drinks leave residue that often needs a **professional cleaning**.\n\n### Mice\n* **Optical and laser** sensors need surface texture, so clear glass makes the cursor jump. A mouse pad fixes it.\n* **Service:** power off, wipe the shell with a little alcohol, and clean the **sensor window with only a puff of air or a dry swab**. On a **trackball**, the gunk hides on the little **support dots** under the ball.\n* A wireless mouse that gets **laggier every day** usually needs a battery change or charge.\n\n### Comfort\n* Top of the screen **at or a little below eye level**, about an arm's length away. Laptops need a **stand plus a separate keyboard and mouse**.\n* **20-20-20:** every 20 minutes, look 20 feet away for 20 seconds. Light from the side.\n* Wrists straight, feet flat (or on a footrest), and **get up and move about once an hour**.\n\n\"Good. Now let's see if you can juggle two of those at once.\"\n\n### Why Computers Get Sick\n\"Unit 1 was about keeping things clean. Unit 2 is about keeping them **healthy**. Almost every sick machine I see was hurt by one of these five enemies. Learn how each one does its damage, and you'll know how to stop it.\"\n\n1. **Heat.** Electronics make heat as they work, and fans push it out through the vents. When heat builds up, parts wear out faster, and batteries age faster too. To protect itself, the processor (the computer's main chip, its \"brain\") does **thermal throttling**: it slows itself down to cool off. That's why a hot laptop suddenly feels sluggish. If it gets hot enough, it shuts off.\n2. **Dust.** Dust and pet hair build up on fans and vents like a fuzzy blanket. That **traps heat** inside. So dust is sneaky: it causes trouble by helping enemy number one.\n3. **Power problems.** A **power surge** is a sudden spike of extra voltage, from a lightning storm or the power coming back after an outage. It can fry parts in an instant. **Frayed or bent cables** are a danger too: damaged wires can stop charging, spark, or even start a fire.\n4. **Moisture.** Water carries electricity where it shouldn't go, causing a **short circuit** (power taking a wrong shortcut). Even slow dampness, like a humid basement, causes **corrosion**: metal contacts slowly turn crusty, often green or white, and stop connecting.\n5. **Bumps and pressure.** Drops crack screens. So does squeezing, like a laptop crammed into a full backpack or sat on. Bumps and tugs also **loosen connections**, like a cable that only works at a certain angle.\n\n<div class=\"warn\">**Grown-up needed:** A frayed cable, a burning smell, or a device that's too hot to hold means stop using it and tell a grown-up. Never try to tape up or fix a damaged power cord yourself.</div>\n\n\"Now, detective work. Tell me which enemy did it.\"\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 2->D2 Start]]", "D2 Start": "(set: $miss to 0)# Day 2: Screens, Cases & Hinges\n\n*The Inspector holds a laptop up to the light and tilts it. A faint rectangle glows on the screen where nothing should be.*\n\n\"See that? Somebody closed this laptop on a sticky note pad. The screen is the most expensive part of most laptops, and also one of the easiest to hurt.\"\n\n\"Today you'll learn how screens are built, because once you know what's inside, the care rules make sense. Then cleaning, done the technician way. Then the part everyone forgets: the case and the hinges that hold it all together.\"\n\n\n[[Open the shop->D2 L1]]", "D2 L1": "## 📘 The Inspector's lesson: How Screens Are Built\n\n\"Most screens you'll see are one of two kinds.\"\n\n* **LCD** (liquid crystal display): a **backlight** shines from behind, through a thin layer of **liquid crystals** that twist to let more or less light through each pixel. Most laptops and monitors use LCDs.\n* **OLED** (organic light-emitting diode): there's **no backlight**. Each pixel **makes its own light**, so black pixels can switch fully off. Many phones, some TVs, and some laptops and monitors use OLED.\n\n\"Each kind has its own weak spot.\"\n\n* **Pressure:** the layers in an LCD are thin and tightly packed. Pressing hard with a fingernail, pen, or knuckle can squeeze them, leaving a **pressure mark**: a bright, dark, or rainbow-colored blotch. Light pressure for a moment usually fades. Hard or repeated pressure can damage the pixels for good. **Touch screens are made for taps, not jabs.**\n* **Burn-in:** because OLED pixels make their own light, they **wear out a little with use**. If the same bright, unchanging image sits in one spot for many hours, like a game's **HUD** (the health bar, map, or score that never moves), those pixels wear faster than their neighbors. A faint ghost of the image can stay behind. A short-lived ghost is called **image retention** and fades. Permanent ghosting is **burn-in**.\n* **Avoiding burn-in:** use auto-brightness or lower brightness, let the screen turn off when idle, and avoid leaving the same static image up at full brightness for hours. Many games let you shrink or hide the HUD.\n\n### Glossy or matte?\n* **Glossy** screens have a smooth, shiny surface. Colors look rich, but they **reflect** lamps and windows like a mirror.\n* **Matte** or **anti-glare** screens have a special **coating** that scatters reflections, so glare is softer.\n* With either kind, **position matters**: keep bright windows and lamps off to the **side**, not behind you, where they bounce off the screen.\n\n\"Those coatings are delicate. That's why the trouble bin matters. **Ammonia**, found in many window cleaners, can strip them. **Alcohol-heavy cleaners** can damage some coatings too. Makers disagree on alcohol, so **follow the manufacturer's guidance** for that exact screen. Dell, for example, says no alcohol on its monitors.\"\n\n\n[[Got it. Send in the next customer->D2 J2]]", "D2 J2": "**Ms. Abara** points at her laptop screen with her fingernail when she explains things to her team. Now there's a small rainbow-colored blotch right where she always taps, and it shows even on a plain white page.\n\n**What's happening?**\n\n* [[Fingernail pressure is squeezing the LCD layers->D2 J2 R]]\n* [[Her screen has OLED burn-in from a static image->D2 J2 W]]\n* [[Skin oil soaked in and is staining the pixels->D2 J2 W]]\n* [[The anti-glare coating is reflecting the room->D2 J2 W]]", "D2 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **pressure mark**. Her fingernail keeps squeezing the thin, tightly packed **LCD layers** in the same spot. Light, brief pressure can fade, but repeated jabs can damage pixels for good.\"\n\n[[Got it->D2 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about what's inside an LCD and what a fingernail does to it.\"\n\n[[Try again->D2 J2]]]", "D2 J2 R": "(set: $miss to 0)## ✅ Job done\n**Pressure on the LCD layers.** It's not burn-in, because it's caused by force, not by a static image. She should point with the mouse cursor instead. If the blotch stays, it may be permanent.\n\n[[Next customer->D2 J3]]", "D2 J3": "**Ava** plays the same game for hours on her OLED TV. Now, even while she watches movies, she can see a faint ghost of the game's health bar and mini-map in the corners.\n\n**What's happening, and what helps prevent it?**\n\n* [[Pressure marks, so she should stop tapping the TV->D2 J3 W]]\n* [[Dust on the screen, so she should wipe the corners->D2 J3 W]]\n* [[Too-low brightness, so she should turn it all the way up->D2 J3 W]]\n* [[Burn-in; lower brightness and shrink or hide the HUD->D2 J3 R]]", "D2 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **burn-in**. The pixels under that HUD shone the same bright image for hours, so they wore faster than their neighbors. **Lower brightness**, **shrinking or hiding the HUD**, and **mixing in other content** all help.\"\n\n[[Got it->D2 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"OLED pixels make their own light. What happens to pixels that show the same thing for hours?\"\n\n[[Try again->D2 J3]]]", "D2 J3 R": "(set: $miss to 0)## ✅ Job done\n**Burn-in from a static HUD.** OLED pixels wear a little with use, and pixels that always show the same bright image wear fastest. If the ghost fades after a while, it was only image retention. If it stays, it's burn-in.\n\n[[Next customer->D2 J4]]", "D2 J4": "**Ms. Doyle** moved her laptop to a desk facing a sliding glass door. Its glossy screen now shows a bright reflection of the door, and she squints through it all afternoon.\n\n**What's the best fix?**\n\n* [[Turn the screen brightness all the way down->D2 J4 W]]\n* [[Wipe the screen with window cleaner to cut glare->D2 J4 W]]\n* [[Turn the desk so the door is off to the side->D2 J4 R]]\n* [[Press the screen flat so it reflects less light->D2 J4 W]]", "D2 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A glossy screen reflects whatever is in front of it, including that bright door. **Turn the desk so the door is to the side.** Then there's nothing bright for the screen to mirror.\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Glossy screens act like mirrors. Where should bright light come from?\"\n\n[[Try again->D2 J4]]]", "D2 J4 R": "(set: $miss to 0)## ✅ Job done\n**Turn the desk so the light comes from the side.** Lowering brightness makes the reflection *harder* to see past, window cleaner can damage the screen, and pressing it causes pressure marks.\n\n[[The Inspector has something to show you->D2 L5]]", "D2 L5": "## 📘 The Inspector's lesson: Cleaning a Screen, Technician Style\n\n\"You know the kit. Here's the exact routine for screens, in order.\"\n\n1. **Power off and unplug.** Smudges are easier to see on a dark screen, and nothing can short out.\n2. **Dry microfiber first.** Wipe gently with light pressure. Most dust and many smudges come off dry, with no liquid at all.\n3. **Only if needed, go barely damp.** Put a little **distilled water** on the cloth, never on the screen. Apple, Dell, and Microsoft all say **never spray directly on a screen**: drips can run into the edges and get inside.\n4. **Wipe gently**, in one direction or in small strokes. No pressing, no scrubbing.\n5. **Dry it** with a clean, dry part of the cloth, and let it air-dry fully before turning it back on.\n\n\"Notice what's missing: window cleaner, paper towels, and pressure. And always check the manufacturer's guide for your screen. Some special finishes, like Apple's nano-texture glass, have their own rules and their own special cloth.\"\n\n<div class=\"warn\">**Grown-up needed:** Get a grown-up's OK before cleaning any screen, and use only a barely damp cloth, never a spray bottle.</div>\n\n\n[[Got it. Send in the next customer->D2 J6]]", "D2 J6": "**Theo** wiped his matte laptop screen with a blue window cleaner. Now there are cloudy, uneven patches that won't wipe off, even with a dry cloth.\n\n**What should he do from now on?**\n\n* [[Use more window cleaner to even the patches out->D2 J6 W]]\n* [[Scrub the patches with a scrubby pad to blend them->D2 J6 W]]\n* [[Switch to dish soap, since it's milder than glass spray->D2 J6 W]]\n* [[Dry microfiber, then barely damp distilled water->D2 J6 R]]", "D2 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Many window cleaners contain **ammonia**, which can strip **anti-glare coatings**. That cloudy damage is usually permanent. From now on: **dry microfiber first, then a barely damp cloth with distilled water.**\"\n\n[[Got it->D2 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's in many window cleaners, and what does it do to coatings?\"\n\n[[Try again->D2 J6]]]", "D2 J6 R": "(set: $miss to 0)## ✅ Job done\n**Dry microfiber, then barely damp distilled water.** Ammonia can strip anti-glare coatings, and the damage usually can't be undone. Scrubbing would only add scratches. Dell even notes that cleaning damage like this isn't covered by its warranty.\n\n[[Next customer->D2 J7]]", "D2 J7": "**Nora** is in a hurry. Her laptop is on, and she's about to spritz distilled water straight onto the screen, then wipe it hard with a microfiber cloth.\n\n**What should she change?**\n\n* [[Use tap water, since it's cleaner than distilled->D2 J7 W]]\n* [[Power off, wipe dry first, damp cloth not screen->D2 J7 R]]\n* [[Leave it on so she can see the smudges better->D2 J7 W]]\n* [[Spray from farther away so the mist is lighter->D2 J7 W]]", "D2 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Three problems. **Power off first.** **Start with a dry cloth.** And if she needs water, it goes **on the cloth, not the screen**, with a gentle wipe, not a hard one.\"\n\n[[Got it->D2 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Walk through my five steps. Which ones is she skipping?\"\n\n[[Try again->D2 J7]]]", "D2 J7 R": "(set: $miss to 0)## ✅ Job done\n**Power off, dry wipe first, then a barely damp cloth, gently.** Spraying lets drips run into the screen's edges, and hard wiping risks pressure marks. Distilled water was the one thing she got right.\n\n[[The Inspector has something to show you->D2 L8]]", "D2 L8": "## 📘 The Inspector's lesson: Cases and Hinges\n\n*The Inspector opens a laptop slowly, with one hand in the middle of the lid.*\n\n\"The **hinges** are the joints that connect the screen to the base. They take a beating every time the lid moves.\"\n\n* **Open from the center of the lid**, not one corner. Pulling on a corner twists the whole lid and puts the strain on **one hinge**. Over time that hinge loosens, the screen wobbles or flops back, and the screen's frame can crack.\n* **Don't lift or carry a laptop by its screen.** Hold the **base**, closed if you're walking around.\n* **Nothing on the keyboard when you close the lid.** A laptop closes with very little space between keys and screen. A pen, earbuds, or even crumbs get pressed into the screen and can **crack it** or leave pressure marks. Even with nothing in the way, the keys can touch the screen in a closed laptop, leaving a **keyboard-shaped pattern** of skin oil on it. Clean hands and a clean keyboard help.\n* **Camera covers:** Apple warns that closing a MacBook with a camera cover **thicker than about 0.1 mm** (about the thickness of printer paper) can damage the display. Thin laptops leave almost no room. Most laptops have a **camera light** that shows when the camera is on.\n* **Stickers and skins** are fine on the lid, but **never over vents**. Blocked vents mean heat, enemy number one.\n* **Wiping the case:** power off, then use a cloth barely damp with water or a little alcohol, as long as the manufacturer allows it. Keep moisture out of ports, vents, and seams.\n\n\n[[Got it. Send in the next customer->D2 J9]]", "D2 J9": "**Jordan** finished his homework, set his pen on the keyboard, and snapped his laptop shut. The next morning there's a long crack across the screen, right where the pen was.\n\n**What happened?**\n\n* [[The hinge snapped and dropped the screen hard->D2 J9 W]]\n* [[The closing lid pressed the pen into the screen->D2 J9 R]]\n* [[Overnight heat built up and cracked the glass->D2 J9 W]]\n* [[The screen's coating dried out and split overnight->D2 J9 W]]", "D2 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Almost none. **The lid pressed the pen right into the screen.** Always check the keyboard is clear before closing.\"\n\n[[Got it->D2 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How much space is there between the keys and the screen in a closed laptop?\"\n\n[[Try again->D2 J9]]]", "D2 J9 R": "(set: $miss to 0)## ✅ Job done\n**The pen was pressed into the screen.** Laptops close with very little room to spare. Pens, earbuds, and crumbs can all crack a screen or leave pressure marks. That's enemy number five: pressure.\n\n[[Next customer->D2 J10]]", "D2 J10": "**Mia's** laptop screen used to stay put. Now it wobbles and flops backward, and only the left hinge feels loose. \"I always open it by flicking up the left corner with one finger,\" she says.\n\n**Why is only one hinge loose?**\n\n* [[Corner-opening twists the lid, straining one hinge->D2 J10 R]]\n* [[The left hinge was made cheaper than the right one->D2 J10 W]]\n* [[Heat from the left vent softened that hinge's metal->D2 J10 W]]\n* [[Dust built up inside that hinge and pushed it loose->D2 J10 W]]", "D2 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Opening from one corner **twists the lid** and puts all the strain on **that one hinge**. Over time, it loosens. Open from the **center of the lid**.\"\n\n[[Got it->D2 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where should you hold the lid to open it, and why?\"\n\n[[Try again->D2 J10]]]", "D2 J10 R": "(set: $miss to 0)## ✅ Job done\n**Corner-flicking strained one hinge.** Opening from the center spreads the force across both hinges. A wobbly hinge needs a repair shop: keep using it and the screen's frame or cables can get damaged.\n\n[[Next customer->D2 J11]]", "D2 J11": "**Mr. Okoye** cleans his screen every week, but every time he opens his laptop there's a faint grid of little rectangles on it, in the exact pattern of his keys.\n\n**Where is that pattern coming from?**\n\n* [[The screen is burning in an image of the keyboard->D2 J11 W]]\n* [[The anti-glare coating is wearing off in a grid->D2 J11 W]]\n* [[Keys touch the screen when shut, leaving skin oil->D2 J11 R]]\n* [[His screen is reflecting the keyboard when it's open->D2 J11 W]]", "D2 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"When the lid is closed, **the keys touch the screen**, and the oil from his fingers transfers onto it. Clean hands and a clean keyboard help, along with his normal screen cleaning.\"\n\n[[Got it->D2 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"In a closed laptop, what is the screen right up against?\"\n\n[[Try again->D2 J11]]]", "D2 J11 R": "(set: $miss to 0)## ✅ Job done\n**Skin oil from the keys.** It's not burn-in, since that comes from a static image on an OLED. Wipe the keyboard during the weekly clean and wash hands before typing, and the pattern fades.\n\n[[Next customer->D2 J12]]", "D2 J12": "**Gabe** stuck a chunky plastic webcam cover, about as thick as a coin, onto his ultra-thin laptop for privacy. Now the lid won't quite close flat, and he presses it shut anyway.\n\n**What's the risk, and what's a safer choice?**\n\n* [[No risk, since covers are designed to be pressed shut->D2 J12 W]]\n* [[The cover could block the vents and overheat it->D2 J12 W]]\n* [[Only a risk on OLED screens; LCDs are flexible enough->D2 J12 W]]\n* [[It can crack the screen; use the camera light instead->D2 J12 R]]", "D2 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Thin laptops close with almost no room. Apple warns that covers **thicker than about 0.1 mm** can **damage the display**. A coin-thick cover acts like that pen. He can use the **camera light** and app permissions to know when the camera is on.\"\n\n[[Got it->D2 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How thin did I say a camera cover can be? And what tells you the camera is on?\"\n\n[[Try again->D2 J12]]]", "D2 J12 R": "(set: $miss to 0)(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]## ✅ Job done\n**It can crack the screen.** Covers thicker than about 0.1 mm (printer-paper thin) can press into the display when the lid closes. If he wants a cover, it should be paper-thin, or he can check the camera light instead.\n\n[[Close up shop->D2 Done]]", "D2 Done": "(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]# Day 2 complete!\n\n<div class=\"tool\">🖥️ **New tool earned: Screen Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **With a grown-up's OK**, clean one screen at home the technician way: power off and unplug, dry microfiber first, then (only if needed) a cloth barely damp with distilled water, gentle strokes, and dry it off. Check the maker's cleaning guide first if you can find it. Then **check your hinge habits** for a week: open from the center, carry by the base, and look at the keyboard before closing. In your **Tech Notebook**, write which screens in your home are LCD or OLED, glossy or matte, and one habit you changed.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### How Screens Are Built\n\"Most screens you'll see are one of two kinds.\"\n\n* **LCD** (liquid crystal display): a **backlight** shines from behind, through a thin layer of **liquid crystals** that twist to let more or less light through each pixel. Most laptops and monitors use LCDs.\n* **OLED** (organic light-emitting diode): there's **no backlight**. Each pixel **makes its own light**, so black pixels can switch fully off. Many phones, some TVs, and some laptops and monitors use OLED.\n\n\"Each kind has its own weak spot.\"\n\n* **Pressure:** the layers in an LCD are thin and tightly packed. Pressing hard with a fingernail, pen, or knuckle can squeeze them, leaving a **pressure mark**: a bright, dark, or rainbow-colored blotch. Light pressure for a moment usually fades. Hard or repeated pressure can damage the pixels for good. **Touch screens are made for taps, not jabs.**\n* **Burn-in:** because OLED pixels make their own light, they **wear out a little with use**. If the same bright, unchanging image sits in one spot for many hours, like a game's **HUD** (the health bar, map, or score that never moves), those pixels wear faster than their neighbors. A faint ghost of the image can stay behind. A short-lived ghost is called **image retention** and fades. Permanent ghosting is **burn-in**.\n* **Avoiding burn-in:** use auto-brightness or lower brightness, let the screen turn off when idle, and avoid leaving the same static image up at full brightness for hours. Many games let you shrink or hide the HUD.\n\n### Glossy or matte?\n* **Glossy** screens have a smooth, shiny surface. Colors look rich, but they **reflect** lamps and windows like a mirror.\n* **Matte** or **anti-glare** screens have a special **coating** that scatters reflections, so glare is softer.\n* With either kind, **position matters**: keep bright windows and lamps off to the **side**, not behind you, where they bounce off the screen.\n\n\"Those coatings are delicate. That's why the trouble bin matters. **Ammonia**, found in many window cleaners, can strip them. **Alcohol-heavy cleaners** can damage some coatings too. Makers disagree on alcohol, so **follow the manufacturer's guidance** for that exact screen. Dell, for example, says no alcohol on its monitors.\"\n\n### Cleaning a Screen, Technician Style\n\"You know the kit. Here's the exact routine for screens, in order.\"\n\n1. **Power off and unplug.** Smudges are easier to see on a dark screen, and nothing can short out.\n2. **Dry microfiber first.** Wipe gently with light pressure. Most dust and many smudges come off dry, with no liquid at all.\n3. **Only if needed, go barely damp.** Put a little **distilled water** on the cloth, never on the screen. Apple, Dell, and Microsoft all say **never spray directly on a screen**: drips can run into the edges and get inside.\n4. **Wipe gently**, in one direction or in small strokes. No pressing, no scrubbing.\n5. **Dry it** with a clean, dry part of the cloth, and let it air-dry fully before turning it back on.\n\n\"Notice what's missing: window cleaner, paper towels, and pressure. And always check the manufacturer's guide for your screen. Some special finishes, like Apple's nano-texture glass, have their own rules and their own special cloth.\"\n\n<div class=\"warn\">**Grown-up needed:** Get a grown-up's OK before cleaning any screen, and use only a barely damp cloth, never a spray bottle.</div>\n\n### Cases and Hinges\n\"The **hinges** are the joints that connect the screen to the base. They take a beating every time the lid moves.\"\n\n* **Open from the center of the lid**, not one corner. Pulling on a corner twists the whole lid and puts the strain on **one hinge**. Over time that hinge loosens, the screen wobbles or flops back, and the screen's frame can crack.\n* **Don't lift or carry a laptop by its screen.** Hold the **base**, closed if you're walking around.\n* **Nothing on the keyboard when you close the lid.** A laptop closes with very little space between keys and screen. A pen, earbuds, or even crumbs get pressed into the screen and can **crack it** or leave pressure marks. Even with nothing in the way, the keys can touch the screen in a closed laptop, leaving a **keyboard-shaped pattern** of skin oil on it. Clean hands and a clean keyboard help.\n* **Camera covers:** Apple warns that closing a MacBook with a camera cover **thicker than about 0.1 mm** (about the thickness of printer paper) can damage the display. Thin laptops leave almost no room. Most laptops have a **camera light** that shows when the camera is on.\n* **Stickers and skins** are fine on the lid, but **never over vents**. Blocked vents mean heat, enemy number one.\n* **Wiping the case:** power off, then use a cloth barely damp with water or a little alcohol, as long as the manufacturer allows it. Keep moisture out of ports, vents, and seams.\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 3->D3 Start]]", "D3 Start": "(set: $miss to 0)# Day 3: Airflow & Heat\n\n*The Inspector holds her palm a few inches behind a laptop that has been running a game demo all morning. She pulls her hand back and shakes it.*\n\n\"Every computer turns some of its electricity into heat. That isn't a defect. That's physics. The trouble starts when the heat can't get *out*. A computer that can't breathe gets slow, then loud, then cranky, and in the worst case it switches itself off in the middle of your work.\"\n\n\"Today you learn where the heat comes from, which way it's supposed to flow, and what blocks it. By closing time you should be able to diagnose a hot machine from across the room.\"\n\n\n[[Open the shop->D3 L1]]", "D3 L1": "## 📘 The Inspector's lesson: Where the Heat Comes From\n\n\"Two chips do most of the hard thinking, so they make most of the heat.\"\n\n* **CPU** (central processing unit, also called the **processor**): the main brain. It runs every program.\n* **GPU** (graphics processing unit, the **graphics chip**): it draws everything you see. Games and video editing make it work hardest.\n\n\"That heat has to travel a path to escape.\"\n\n1. The chip passes its heat into a **heat sink**, a block of metal with thin fins that spreads the heat out. A thin layer of **thermal paste** fills the tiny gaps between the chip and the heat sink so heat flows across smoothly.\n2. A **fan** pushes air across those fins and carries the heat away.\n3. The hot air leaves through the **vents**, the slots and grilles in the case.\n\n### Intake and exhaust\n* **Intake vents** pull cool room air *in*. On laptops they are often on the bottom. On desktops, usually the front, bottom, or side.\n* **Exhaust vents** push hot air *out*, often at the back or side, or near the hinge on many laptops. When the computer is working hard, the air coming out of an exhaust vent feels warm.\n\n\"Block either one and the whole path backs up, like a traffic jam on a one-lane road.\"\n\n### When it gets too hot\n* **Thermal throttling** (the processor slowing itself down to cool off): the chip cuts its own power and speed. Your game stutters, but the chip stays safe.\n* **Emergency shutdown:** if throttling isn't enough, the computer switches itself off to prevent permanent damage. No warning, no chance to save.\n\n### Signs of overheating\n* Fans roaring, even during light work\n* A hot underside or keyboard\n* Slowdowns and stuttering, especially in games or videos\n* Sudden shutdowns\n\n\"Here's the good news. Throttling and shutdown are *safety features*. The computer is protecting itself. Your job is to figure out why it had to.\"\n\n\n[[Got it. Send in the next customer->D3 J2]]", "D3 J2": "**Ava** (you may remember her from your trainee days) thunks her gaming laptop onto the counter. \"Twenty minutes into a match, my game turns into a slideshow. The fans scream and the bottom gets hot enough to warm a sandwich. Then I quit, and everything's fine again.\"\n\n**What's most likely happening?**\n\n* [[The game has a virus that only runs during matches->D3 J2 W]]\n* [[The chips are throttling themselves to cool off->D3 J2 R]]\n* [[The fans spin so fast that they slow the game->D3 J2 W]]\n* [[The graphics chip has run out of memory for good->D3 J2 W]]", "D3 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **thermal throttling**. The processor and graphics chip are cutting their own speed so they don't overheat. The screaming fans are a symptom, not the cause.\"\n\n[[Got it->D3 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Loud fans, hot bottom, slows down under a heavy load, fine afterward. Which safety feature did I just describe?\"\n\n[[Try again->D3 J2]]]", "D3 J2 R": "(set: $miss to 0)## ✅ Job done\n**Thermal throttling: the chips slow down to cool off.** Gaming works the CPU and GPU harder than almost anything, so they make the most heat. When the heat can't escape fast enough, the chips slow themselves down. Next step: find out *why* the heat is stuck.\n\n[[Next customer->D3 J3]]", "D3 J3": "**Mr. Patel** sets his laptop on the bench. Underneath are rows of small slots. Near the hinge there's another grille, and when he runs his giant budget spreadsheet you can feel warm air pouring out of it. He plans to stack his folders tight against that grille to keep his desk tidy.\n\n**What is the grille by the hinge, and is the folder plan a good idea?**\n\n* [[It's an intake, so folders will keep dust out of it->D3 J3 W]]\n* [[It's a speaker grille, so folders will only muffle it->D3 J3 W]]\n* [[It's decoration, so folders won't change anything->D3 J3 W]]\n* [[It's the exhaust, so folders will trap the hot air->D3 J3 R]]", "D3 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Warm air coming out means **exhaust**. Pile folders against it and the hot air has nowhere to go, so the laptop ends up pulling some of it right back in.\"\n\n[[Got it->D3 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which kind of vent breathes *out* the warm air?\"\n\n[[Try again->D3 J3]]]", "D3 J3 R": "(set: $miss to 0)## ✅ Job done\n**Warm air out means exhaust.** The slots underneath are most likely intake, pulling cool air in. Both need open space, so the folders can live a few inches away.\n\n[[The Inspector has something to show you->D3 L4]]", "D3 L4": "## 📘 The Inspector's lesson: Where It Sits Matters\n\n*The Inspector sets a laptop on a fluffy pillow, then on the bare bench, and taps the bottom of it.* \"Most of the overheating I see isn't broken hardware. It's a computer sitting in the wrong place.\"\n\n* **Hard, flat surfaces:** a desk or table (or a hard floor, for a tower) lets air reach the intake vents. A laptop's little rubber feet lift it just enough to leave an air gap underneath.\n* **No beds, pillows, blankets, or couch cushions:** soft things sink around the laptop and smother its intake vents. A laptop on your lap with a blanket over your legs has the same problem. Apple's own guidance says not to use a laptop on a bed, on a pillow, or under bedding.\n* **Lap desks and laptop stands:** a lap desk gives a laptop a hard, flat base on the couch or in bed. A stand raises it so air flows underneath (and your neck says thank you).\n* **Clearance:** leave a few inches of open space around the vents. A desktop tower needs room behind it too. Shut a tower inside a cabinet with the door closed and it just breathes its own hot air over and over.\n* **Sun and heaters:** direct sunlight through a window, or a spot next to a heater or radiator, heats the case before the computer even starts working.\n* **Room temperature:** a computer can only cool itself with the air around it. Apple, for example, says to use its laptops where the room is between 50° and 95°F (10° and 35°C). A hot room means hot intake air, so the fans work harder.\n* **Carpet and pet hair:** a tower on thick carpet can have its bottom intake smothered, and carpets and pets shed fibers and fur that get pulled into the vents. A hard floor, a small board, or a stand under the tower helps.\n\n\"Pets love warm vents. Pets do not care about your frame rate.\"\n\n\n[[Got it. Send in the next customer->D3 J5]]", "D3 J5": "**Jayden** was doing homework in bed with his laptop resting on his thick comforter. Twice this week the screen went black with no warning. Each time, the bottom of the laptop was hot and the comforter was bunched up around it.\n\n**What's going on?**\n\n* [[Its vents were smothered, so it shut down to protect itself->D3 J5 R]]\n* [[Its battery is wearing out, so it can't run without a charger->D3 J5 W]]\n* [[The comforter built up static, which switched the laptop off->D3 J5 W]]\n* [[A sleep setting kicks in whenever it sits still too long->D3 J5 W]]", "D3 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The comforter smothered the **intake vents**. The heat built up until the laptop did an **emergency shutdown**. A lap desk or a real desk fixes it.\"\n\n[[Got it->D3 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Soft bedding and a hot underside. What did I say happens when throttling isn't enough?\"\n\n[[Try again->D3 J5]]]", "D3 J5 R": "(set: $miss to 0)## ✅ Job done\n**Blocked vents led to an emergency shutdown.** Soft bedding wraps around the bottom of a laptop and seals off the intakes. A lap desk gives it a hard, flat base, even in bed.\n\n[[Next customer->D3 J6]]", "D3 J6": "**Grandpa Leo** had a beautiful wooden cabinet built for his desktop tower, with a door that closes so the room looks tidy. Since then, the fans roar all afternoon and the computer has gotten sluggish. Biscuit has started napping against the cabinet door because it's warm.\n\n**What's the best advice for Grandpa Leo?**\n\n* [[Put a small desk fan inside the cabinet, aimed at the tower->D3 J6 W]]\n* [[Turn the tower so its vents face the back of the cabinet->D3 J6 W]]\n* [[Keep the door open and give the tower inches of space->D3 J6 R]]\n* [[Shut the tower down for an hour every afternoon->D3 J6 W]]", "D3 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"With the door closed, the tower breathes out hot air and then breathes it right back in. **Leave the door open, or move the tower out**, and give it a few inches of space around the vents.\"\n\n[[Got it->D3 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"With the door shut, where does the exhaust go?\"\n\n[[Try again->D3 J6]]]", "D3 J6 R": "(set: $miss to 0)## ✅ Job done\n**A closed cabinet traps the exhaust.** The tower keeps pulling in its own hot air, so the fans run harder and the chips throttle. Open the door (or take it off), or move the tower somewhere with a few inches of breathing room. Biscuit will have to find a new heater.\n\n[[Next customer->D3 J7]]", "D3 J7": "**Ms. Rivera** moved her laptop to a desk right by a big sunny window so she could enjoy the view. Every afternoon, when the sunbeam reaches the desk, the laptop feels hot before she's even opened a program, and the fans start roaring.\n\n**What should she change?**\n\n* [[Turn the screen brightness all the way down->D3 J7 W]]\n* [[Prop it up on a stand, right where it sits now->D3 J7 W]]\n* [[Keep it out of direct sun, even on that desk->D3 J7 R]]\n* [[Lay a cool, damp cloth over the closed lid->D3 J7 W]]", "D3 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Direct sunlight** heats the case all by itself. Slide the laptop into the shade, close the blinds in the afternoon, or move the desk back from the window.\"\n\n[[Got it->D3 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's heating the case before the computer even starts working?\"\n\n[[Try again->D3 J7]]]", "D3 J7 R": "(set: $miss to 0)## ✅ Job done\n**Keep computers out of direct sun.** The sun heats the case and the air around it, so the fans are fighting the weather before they fight her work. A stand helps airflow, but not in a sunbeam. And nothing damp ever goes on a computer.\n\n[[Next customer->D3 J8]]", "D3 J8": "**Tasha's** cat, Pickles, has found the best spot in the house: on top of the desktop tower, curled right over the grille where warm air comes out. The tower has gotten much louder lately, and a gray mat of cat fur is stuck to that grille.\n\n**What should Tasha do?**\n\n* [[Keep Pickles off the vent and clear the fur from it->D3 J8 R]]\n* [[Let Pickles stay, since her fur filters out the dust->D3 J8 W]]\n* [[Lay a folded towel on the vent so Pickles is comfy->D3 J8 W]]\n* [[Turn the fans down so the noise won't bother Pickles->D3 J8 W]]", "D3 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pickles is **blocking the exhaust**, and her fur is getting pulled into the grille. Gently move her, give her a warm bed of her own away from the computer, and clear the fur with the computer off and unplugged.\"\n\n[[Got it->D3 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does a cat-shaped blanket do to an exhaust vent?\"\n\n[[Try again->D3 J8]]]", "D3 J8 R": "(set: $miss to 0)## ✅ Job done\n**A cat on a vent is a furry blockage.** She traps the hot air and sheds hair into the airflow path. A cozy cat bed nearby, away from the vents, usually wins the argument.\n\n[[The Inspector has something to show you->D3 L9]]", "D3 L9": "## 📘 The Inspector's lesson: Clearing the Airflow Path\n\n*The Inspector holds up a laptop fan wrapped in a gray felt of dust.* \"This is a dust bunny. It used to be a fan.\"\n\n\"Dust collects on intake vents, filters, fan blades, and heat-sink fins, and it works like a blanket. Here's how to clear it.\"\n\n1. **Power off and unplug.** Shut it down all the way (not sleep) and unplug the charger or power cord.\n2. **Short bursts of compressed air** through the vents. Hold the can upright and a few inches away. If you can, blow out through the exhaust so dust leaves instead of getting packed deeper.\n3. **Hold the fan still** while you blow, with a toothpick or a fingertip. A blast of air can spin a fan much faster than its motor ever does, and **over-spinning can damage the fan's bearing** (the tiny part the fan spins on). A damaged bearing whines, grinds, or rattles.\n4. **Clean the dust filters.** Many desktops have a removable mesh filter over the intake, often on the front or bottom. Pop it off, take it away from the computer, brush or blow it clean, and snap it back. Check it more often if you have pets or carpet.\n5. **Never use a vacuum.** Household vacuums can build up static electricity that can zap the parts inside, and the suction can grab small parts.\n\n### Inside a desktop\n<div class=\"warn\">**Grown-up needed:** Opening a desktop case is a grown-up job. Unplug the power cord first, touch bare metal on the case to discharge static from your body, and don't touch the circuit boards.</div>\n\n* Static from your body can damage chips without you ever feeling a spark. Touching bare metal on the case first lets it drain away.\n* Use short bursts of air on the fans and heat-sink fins, holding each fan still. Hands off the boards and chips.\n\n### Professionals only\n* **Thermal paste** dries out over the years. Replacing it means removing the heat sink. That's a job for a professional.\n* **Opening a laptop** means tiny screws, fragile ribbon cables, and a battery inside. That's a repair-shop trip, not a kitchen-table project.\n\n\n[[Got it. Send in the next customer->D3 J10]]", "D3 J10": "**Dev** (yes, gaming-mouse Dev, now with a gaming desktop) says his tower has been getting hotter and louder for months. You look at the front. Behind a mesh panel is a gray, fuzzy layer of dust so thick you can't see through it.\n\n**What's the right first fix?**\n\n* [[Drape a cloth over the front so dust can't land there->D3 J10 W]]\n* [[Vacuum the mesh panel while the tower is still running->D3 J10 W]]\n* [[Set the fans to full speed so they pull air through->D3 J10 W]]\n* [[Power off, unplug, and pop off the filter to clean it->D3 J10 R]]", "D3 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a clogged **intake filter**. **Power off, unplug, pop it off**, and brush or blow it clean away from the computer. No vacuums.\"\n\n[[Got it->D3 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about removable dust filters, and what comes before any cleaning?\"\n\n[[Try again->D3 J10]]]", "D3 J10 R": "(set: $miss to 0)## ✅ Job done\n**Clean the intake filter (off and unplugged).** A clogged filter starves the whole tower of cool air, so everything inside runs hot. Check it regularly, and more often if you have pets or carpet.\n\n[[Next customer->D3 J11]]", "D3 J11": "**Kenji**, a ninth grader, cleaned his laptop vents yesterday. He held down the nozzle of the compressed air for a long blast, and the fan spun up like a jet engine. Today the fan makes a high-pitched whine it never made before.\n\n**What most likely happened?**\n\n* [[Some of the dust melted onto the fan blades->D3 J11 W]]\n* [[Over-spinning damaged the fan's bearing->D3 J11 R]]\n* [[The blast made the fan start spinning backward->D3 J11 W]]\n* [[Now too much clean air rushes through the vent->D3 J11 W]]", "D3 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The long blast spun the fan far faster than its motor ever would, and that can damage the **bearing**. Next time, **hold the fan still** and use short bursts. If the whine stays, the fan may need replacing, and that's a repair-shop job on a laptop.\"\n\n[[Got it->D3 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I tell you to do with a fan while you blow air at it?\"\n\n[[Try again->D3 J11]]]", "D3 J11 R": "(set: $miss to 0)## ✅ Job done\n**Over-spinning can damage a fan's bearing.** Hold fans still with a toothpick or fingertip and use short bursts. Replacing a laptop fan means opening the laptop, so that goes to a professional.\n\n[[Next customer->D3 J12]]", "D3 J12": "**Mr. Okoye** wants to clean inside his desktop tower. A grown-up has already helped him take off the side panel, and he's holding the family vacuum with its skinny crevice nozzle. \"Dust is dust,\" he says. \"The vacuum gets it all.\"\n\n**What's the safer plan?**\n\n* [[Unplug, touch bare metal on the case, then use air->D3 J12 R]]\n* [[Vacuum, but only on the lowest suction setting->D3 J12 W]]\n* [[Keep it plugged in so it stays grounded, then vacuum->D3 J12 W]]\n* [[Wipe the dusty circuit boards with a damp cloth->D3 J12 W]]", "D3 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No vacuums: they can build up **static** and grab small parts. **Unplug it, touch bare metal on the case** to discharge your static, then use short bursts of air while holding the fans still. And hands off the circuit boards.\"\n\n[[Got it->D3 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two things I said about vacuums, and one about the static on your own body.\"\n\n[[Try again->D3 J12]]]", "D3 J12 R": "(set: $miss to 0)(if: $days does not contain \"3\")[(set: $days to it + (a: \"3\"))]## ✅ Job done\n**Unplug, discharge static, then use air.** Touching bare metal on the case drains static from your body. Vacuums can create static of their own. Inside a desktop is a grown-up job, and the boards stay untouched.\n\n[[Close up shop->D3 Done]]", "D3 Done": "(if: $days does not contain \"3\")[(set: $days to it + (a: \"3\"))]# Day 3 complete!\n\n<div class=\"tool\">🌡️ **New tool earned: Heat Detector**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **Vent detective.** Find every vent on the computer you use most. While it's doing something demanding (a video or a game), hold your hand a few inches from each vent. Warm air coming out means **exhaust**. Vents with no warm air, often on the bottom or front, are probably **intake**. Draw a quick map of your computer with arrows showing air in and air out. Then look at where you usually use it. Is anything blocking a vent: a blanket, a wall, a cabinet door, a pile of books, a cat? Fix one thing you find. Ask a grown-up before moving a desktop tower or reaching behind it near power cords.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Where the Heat Comes From\n\"Two chips do most of the hard thinking, so they make most of the heat.\"\n\n* **CPU** (central processing unit, also called the **processor**): the main brain. It runs every program.\n* **GPU** (graphics processing unit, the **graphics chip**): it draws everything you see. Games and video editing make it work hardest.\n\n\"That heat has to travel a path to escape.\"\n\n1. The chip passes its heat into a **heat sink**, a block of metal with thin fins that spreads the heat out. A thin layer of **thermal paste** fills the tiny gaps between the chip and the heat sink so heat flows across smoothly.\n2. A **fan** pushes air across those fins and carries the heat away.\n3. The hot air leaves through the **vents**, the slots and grilles in the case.\n\n### Intake and exhaust\n* **Intake vents** pull cool room air *in*. On laptops they are often on the bottom. On desktops, usually the front, bottom, or side.\n* **Exhaust vents** push hot air *out*, often at the back or side, or near the hinge on many laptops. When the computer is working hard, the air coming out of an exhaust vent feels warm.\n\n\"Block either one and the whole path backs up, like a traffic jam on a one-lane road.\"\n\n### When it gets too hot\n* **Thermal throttling** (the processor slowing itself down to cool off): the chip cuts its own power and speed. Your game stutters, but the chip stays safe.\n* **Emergency shutdown:** if throttling isn't enough, the computer switches itself off to prevent permanent damage. No warning, no chance to save.\n\n### Signs of overheating\n* Fans roaring, even during light work\n* A hot underside or keyboard\n* Slowdowns and stuttering, especially in games or videos\n* Sudden shutdowns\n\n\"Here's the good news. Throttling and shutdown are *safety features*. The computer is protecting itself. Your job is to figure out why it had to.\"\n\n### Where It Sits Matters\n* **Hard, flat surfaces:** a desk or table (or a hard floor, for a tower) lets air reach the intake vents. A laptop's little rubber feet lift it just enough to leave an air gap underneath.\n* **No beds, pillows, blankets, or couch cushions:** soft things sink around the laptop and smother its intake vents. A laptop on your lap with a blanket over your legs has the same problem. Apple's own guidance says not to use a laptop on a bed, on a pillow, or under bedding.\n* **Lap desks and laptop stands:** a lap desk gives a laptop a hard, flat base on the couch or in bed. A stand raises it so air flows underneath (and your neck says thank you).\n* **Clearance:** leave a few inches of open space around the vents. A desktop tower needs room behind it too. Shut a tower inside a cabinet with the door closed and it just breathes its own hot air over and over.\n* **Sun and heaters:** direct sunlight through a window, or a spot next to a heater or radiator, heats the case before the computer even starts working.\n* **Room temperature:** a computer can only cool itself with the air around it. Apple, for example, says to use its laptops where the room is between 50° and 95°F (10° and 35°C). A hot room means hot intake air, so the fans work harder.\n* **Carpet and pet hair:** a tower on thick carpet can have its bottom intake smothered, and carpets and pets shed fibers and fur that get pulled into the vents. A hard floor, a small board, or a stand under the tower helps.\n\n\"Pets love warm vents. Pets do not care about your frame rate.\"\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 4->D4 Start]]", "D4 Start": "(set: $miss to 0)# Day 4: Cords, Cables & Power\n\n*The Inspector drops a tangle of cables on the bench. One is frayed, one has a scorched plug, and one is wound so tightly around its charger that it looks like a mummy.*\n\n\"Yesterday was heat. Today is power: the cords, cables, chargers, and power strips that feed every machine in this shop. Most of them die from the same few habits, and a few of those habits are real fire risks.\"\n\n\"One rule before everything else. **If a cord or charger looks damaged, smells like burning, or gets too hot to hold, stop using it.** You don't fix a damaged power cord with tape. You replace it.\"\n\n\n[[Open the shop->D4 L1]]", "D4 L1": "## 📘 The Inspector's lesson: Cable Care\n\n\"Cables are tougher than they look in the middle, and weaker than they look at the ends.\"\n\n* **Pull the plug, not the cord.** Grip the hard plug and pull it straight out. Yanking the cord tugs on the thin wires where they join the plug.\n* **Strain relief:** the thick, bendy collar where a cable meets its plug or charger. It spreads a bend out over a longer stretch so the wires inside don't fold at one sharp point. Bend a cable hard right at that spot, again and again, and the tiny wires crack and the outer jacket splits. Techs call this fraying \"at the neck.\"\n* **Coil loosely with the over-under method.** Wrapping a cord tightly around its charger brick bends it sharply right at the strain relief. Instead, make one normal loop (*over*), then give the cable a small twist the other way so the next loop forms underneath (*under*), and repeat. Stage and sound crews use this because the twists cancel out and the cable uncoils flat, with no kinks. Hand-sized loose loops with a reusable tie work too.\n* **Stop signs:** frayed or split jackets, exposed wires, scorch marks, or melted or bubbled plastic. **Stop using it and replace it.** Tape is not a repair.\n* **Pets:** a chewed cable can shock a pet and ruin the cable. Use **cord protectors** (plastic sleeves or covers), run cables out of reach, and unplug chargers that aren't in use.\n* **Lint in ports:** pocket lint packs into the bottom of USB-C and Lightning ports, so the plug can't push all the way in. The connection gets wobbly or charges on and off. The fix: power the device off, then gently scoop it out with a **wooden or plastic toothpick**. **Never metal.** Paperclips and pins can scratch the contacts or short them out.\n\n<div class=\"warn\">**Grown-up needed:** If a cord or charger is scorched, melted, or has exposed wires, let a grown-up unplug it by the plug and take it out of use.</div>\n\n\n[[Got it. Send in the next customer->D4 J2]]", "D4 J2": "**Nora** hands you her laptop charger. Every night she winds the cord as tightly as she can around the charger brick so it fits in her backpack. Now the cord has split right where it leaves the brick, and you can see thin wires peeking out.\n\n**What should Nora do?**\n\n* [[Wrap the split in electrical tape and keep using it->D4 J2 W]]\n* [[Wind it even tighter so the split stays pressed shut->D4 J2 W]]\n* [[Stop using it, replace it, and coil the next one loosely->D4 J2 R]]\n* [[Keep using it, but only while the laptop is fully turned off->D4 J2 W]]", "D4 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Exposed wires mean **stop using it and replace it**. Tight wrapping bent the cord sharply at the **strain relief**, night after night, until the wires broke through. Coil the new one loosely, over-under style.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Exposed wires. What did I say about tape?\"\n\n[[Try again->D4 J2]]]", "D4 J2 R": "(set: $miss to 0)## ✅ Job done\n**A damaged cord gets replaced, not taped.** Winding tightly around the brick puts a sharp bend right at the strain relief. Loose loops, or the over-under method, let the cord curve gently.\n\n[[Next customer->D4 J3]]", "D4 J3": "**Mr. Patel's** tablet only charges if he holds the cable at just the right angle. The plug never seems to click all the way in. He carries the tablet in his coat pocket on his morning walks.\n\n**What should you try first?**\n\n* [[Power it off and pick out lint with a wooden toothpick->D4 J3 R]]\n* [[Scrape out the port with the end of a straightened paperclip->D4 J3 W]]\n* [[Push the plug in harder until it finally clicks into place->D4 J3 W]]\n* [[Put a drop of rubbing alcohol in the port, then plug it in->D4 J3 W]]", "D4 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pocket **lint** packs into the bottom of the port so the plug can't go all the way in. **Power it off, then gently scoop with a wooden or plastic toothpick.** Never metal.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Coat pocket. What packs into ports? And what did I say never to poke in there?\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**Lint in the port blocks the plug.** A wooden or plastic toothpick scoops it out without scratching or shorting the co
