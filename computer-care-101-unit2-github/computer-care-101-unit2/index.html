ze=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">left (quiet)</text><text x=\"255\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">right (sounds fine)</text></svg><div class=\"cap\">Ava's earbuds, up close. Look at the mesh screen on each one.</div></div>\n\n**Ava's** left earbud sounds quiet and muffled. The little mesh screen has a yellow-brown coating.\n\n**Right fix?**\n\n* [[Soak the earbud in alcohol overnight->D6 J2 W]]\n* [[Poke the mesh holes open with a pin->D6 J2 W]]\n* [[Brush the mesh with a dry, soft brush->D6 J2 R]]\n* [[Run warm water through the mesh holes->D6 J2 W]]", "D6 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **earwax**. A **dry, soft brush** loosens it. Liquid and pins push it deeper.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the mesh card again. Wet or dry?\"\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**A dry, soft brush.** Never soak an earbud or poke into the openings.\n\n[[Next customer->D6 J3]]", "D6 J3": "<div class=\"scene\">🫧 <svg viewBox=\"0 0 44 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"earbud\"><rect x=\"22\" y=\"26\" width=\"13\" height=\"32\" rx=\"6.5\" fill=\"#e9ecef\"/><ellipse cx=\"20\" cy=\"22\" rx=\"18\" ry=\"17\" fill=\"#e9ecef\"/><circle cx=\"15\" cy=\"19\" r=\"8\" fill=\"#4a525b\"/></svg> 🚌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Straight from the sink to the earbud.\"><path d=\"M50 30 q40 -14 80 0 q8 26 -10 44 h-60 q-18 -18 -10 -44 Z\" fill=\"#9aa4ae\"/><rect x=\"74\" y=\"74\" width=\"32\" height=\"12\" rx=\"3\" fill=\"#6b747d\"/><path d=\"M64 84 C70.0 92.0 70.0 98.0 64 98.0 C58.0 98.0 58.0 92.0 64 84 Z\" fill=\"#7fd1ff\"/><path d=\"M96 92 C102.0 100.0 102.0 106.0 96 106.0 C90.0 106.0 90.0 10  the mesh.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the ear tips card again.\"\n\n[[Try again->D6 J3]]]", "D6 J3 R": "(set: $miss to 0)## ✅ Job done\n**Dry completely first.** Washing tips is fine. Trapped water is not.\n\n[[Next customer->D6 J4]]", "D6 J4": "<div class=\"scene\"><svg viewBox=\"0 0 44 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"earbud\"><rect x=\"22\" y=\"26\" width=\"13\" height=\"32\" rx=\"6.5\" fill=\"#e9ecef\"/><ellipse cx=\"20\" cy=\"22\" rx=\"18\" ry=\"17\" fill=\"#e9ecef\"/><circle cx=\"15\" cy=\"19\" r=\"8\" fill=\"#4a525b\"/></svg> 🏊 ❓</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Read the code on her box.\"><rect x=\"20\" y=\"14\" width=\"130\" height=\"96\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><ellipse cx=\"62\" cy=\"50\" rx=\"20\" ry=\"17\" fill=\"#e9ecef\"/><rect x=\"68\" y=\"58\" width=\"10\" height=\"28\" rx=\"5\" fill=\"#e9ecef\"/><circle cx=\"57\" cy=\"47\" r=\"9\" fill=\"#4a525b\"/><circle cx=\"53\" cy=\"43\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"53\" cy=\"47\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"53\" cy=\"51\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"57\" cy=\"43\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"57\" cy=\"47\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"57\" cy=\"51\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"61\" cy=\"43\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"61\" cy=\"47\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"61\" cy=\"51\" r=\"1.2\" fill=\"#1b1f24\"/><rect x=\"94\" y=\"36\" width=\"48\" height=\"28\" rx=\"5\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><text x=\"118\" y=\"56\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">IPX4</text><text x=\"85\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-wei or raises an eyebrow.* \"Look at the IPX4 side of the rating picture.\"\n\n[[Try again->D6 J4]]]", "D6 J4 R": "(set: $miss to 0)## ✅ Job done\n**Splashes only.** And water resistance wears off as earbuds age.\n\n[[Next customer->D6 J5]]", "D6 J5": "<div class=\"scene\">🎧 🔊 ⏰</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"His volume setting, and how long he listens.\"><polygon points=\"22,44 34,44 50,30 50,82 34,68 22,68\" fill=\"#e9ecef\"/><path d=\"M58 44 q8 12 0 24\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M66 39 q11 17 0 34\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 34 q14 22 0 44\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"96\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"108\" y=\"74\" width=\"9\" height=\"14\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"120\" y=\"68\" width=\"9\" height=\"20\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"132\" y=\"62\" width=\"9\" height=\"26\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"144\" y=\"56\" width=\"9\" height=\"32\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"156\" y=\"50\" width=\"9\" height=\"38\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"168\" y=\"44\" width=\"9\" height=\"44\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"180\" y=\"38\" width=\"9\" height=\"50\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"192\" y=\"32\" width=\"9\" height=\"56\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"204\" y=\"26\" width=\"9\" height=\"62\" rx=\"2\" fill=\"#ffb347\"/><text x=\"150\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his volume</text><circle cx=\"285\" cy=\"56\" r=\"34\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"285\" y1=\"56\" x2=\"285\" y2=\"32.2\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"285\" y1=\"56\" x2=\"302.0\" y2=\"56\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"285\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">3 to 4 hours a day</text></svg><div class=\"cap\">His volume setting, and how long he listens.</div></div>\n\n**Theo** plays his headphones at max volume for 3 to 4 hours every afternoon. \"If it hurt, I'd notice.\"\n\n**Best advice?**\n\n* [[Max is fine if the music isn't too bassy->D6 J5 W]]\n* [[Use the 60/60 rule and take ear breaks->D6 J5 R]]\n* [[Switch ears every hour to rest each one->D6 J5 W]]\n* [[Use earbuds, since they're always quieter->D6 J5 W]]", "D6 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Try the **60/60 rule**: about 60% volume, about 60 minutes, then a break. Hair cells never grow back.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 60/60 picture. Does the damage hurt?\"\n\n[[Try again->D6 J5]]]", "D6 J5 R": "(set: $miss to 0)## ✅ Job done\n**The 60/60 rule.** Hearing damage builds quietly. You won't feel it.\n\n[[The Inspector has something to show you->D6 L6]]", "D6 L6": "## 📘 The Inspector's lesson: Game Controllers\n\n\"Cheese dust. The natural enemy of the A button.\"\n\n**Sticky button:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"><ellipse cx=\"26.9\" cy=\"53.370000000000005\" rx=\"11.9\" ry=\"17.710000000000004\" fill=\"#5c6670\"/><ellipse cx=\"73.1\" cy=\"53.370000000000005\" rx=\"11.9\" ry=\"17.710000000000004\" fill=\"#5c6670\"/><rect x=\"15\" y=\"26\" width=\"70\" height=\"32.2\" rx=\"14.490000000000002\" fill=\"#5c6670\"/><rect x=\"24.8\" y=\"39.524\" width=\"11.200000000000001\" height=\"5.152\" fill=\"#1b1f24\"/><rect x=\"28.3\" y=\"34.372\" width=\"4.2\" height=\"15.456000000000001\" fill=\"#1b1f24\"/><circle cx=\"69.6\" cy=\"35.66\" r=\"2.45\" fill D6 J11]]]", "D6 J11 R": "(set: $miss to 0)## ✅ Job done\n**Clean the lens with microfiber.** Tissues can scratch, and window cleaner can harm coatings.\n\n[[Next customer->D6 J12]]", "D6 J12": "<div class=\"scene\">💻 📷 😬</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the gap when the lid closes.\"><rect x=\"30\" y=\"94\" width=\"300\" height=\"14\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"270\" y=\"72\" width=\"40\" height=\"22\" rx=\"4\" fill=\"#ffb347\"/><polygon points=\"30,94 30,84 330,58 330,70\" fill=\"#8a96a3\"/><polygon points=\"36,90 36,86 322,61 322,65\" fill=\"#7fd1ff\" opacity=\"0.4\"/><line x1=\"170\" y1=\"22\" x2=\"170\" y2=\"64\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"170,64 166.2,57.0 173.8,57.0\" fill=\"#e9ecef\"/><text x=\"196\" y=\"34\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">closing</text><text x=\"296\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">her camera cover</text><text x=\"105\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Nora's laptop, side view</text></svg><div class=\"cap\">Look at the gap when the lid closes.</div></div>\n\n**Nora** stuck a chunky camera cover on her laptop webcam. Now the lid creaks when she closes it.\n\n**What should she do?**\n\n* [[Close the lid more gently from now on->D6 J12 W]]\n* [[Ignore it, since the hinge is settling->D6 J12 W]]\n* [[Add a second cover to balance the lid->D6 J12 W]]\n* [[Remove it; use a thin shutter or none->D6 J12 R]]", "D6 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A thick cover can crack the screen.** Take it off. Use a very thin shutter or none.\"\n\n[[Got it->D6 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the closed-laptop picture.\"\n\n[[Try again->D6 J12]]]", "D6 J12 R": "(set: $miss to 0)(if: $days does not contain \"6\")[(set: $days to it + (a: \"6\"))]## ✅ Job done\n**Take off the thick cover.** Apple warns against covers thicker than about 0.1 mm.\n\n[[Close up shop->D6 Done]]", "D6 Done": "(if: $days does not contain \"6\")[(set: $days to it + (a: \"6\"))]# Day 6 complete!\n\n<div class=\"tool\">🎧 **New tool earned: Gear Bag**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **Gear clean-up.** Clean one gadget (earbuds, a controller, or a phone) with today's steps. Power it off first. Ask a grown-up before using alcohol or cleaning a charging port. Note in your Tech Notebook what changed.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Earbuds and Headphones\n\"That little metal screen is the **mesh**. Keep it dry.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Mesh: dry brush\"><ellipse cx=\"36\" cy=\"30\" rx=\"20\" ry=\"17\" fill=\"#e9ecef\"/><rect x=\"42\" y=\"38\" width=\"10\" height=\"28\" rx=\"5\" fill=\"#e9ecef\"/><circle cx=\"31\" cy=\"27\" r=\"9\" fill=\"#4a525b\"/><circle cx=\"27\" cy=\"23\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"27\" cy=\"27\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"27\" cy=\"31\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"31\" cy=\"23\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"31\" cy=\"27\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"31\" cy=\"31\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"35\" cy=\"23\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"35\" cy=\"27\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"35\" cy=\"31\" r=\"1.2\" fill=\"#1b1f24\"/><path d=\"M24 24 q4 -6 9 -3 q5 -4 8 2 q-3 7 -9 6 q-6 2 >Look at what's around her laptop.</div></div>\n\n**Nora's** laptop sits on a windowsill next to the radiator. The bottom is hot, the fan never stops, and calls freeze.\n\n**Best fix?**\n\n* [[Move it away from the radiator and sun->D7 J9 R]]\n* [[Prop up the back so air gets underneath it->D7 J9 W]]\n* [[Turn the radiator down to the lowest notch->D7 J9 W]]\n* [[Close extra browser tabs so it works less->D7 J9 W]]", "D7 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The radiator **heats it from outside**, so it throttles. **Move it away from the heat**, and out of the sun.\"\n\n[[Got it->D7 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the bedroom on the hazard map.\"\n\n[[Try again->D7 J9]]]", "D7 J9 R": "(set: $miss to 0)## ✅ Job done\n**A laptop can't cool itself when the air around it is already hot.**\n\n[[Next customer->D7 J10]]", "D7 J10": "<div class=\"scene\"><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg> 🐠 〰️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look at the shelf, and at what's underneath it.\"><rect x=\"4\" y=\"4\" width=\"8\" height=\"132\" fill=\"#9aa4ae\" opacity=\"0.5\"/><polygon points=\"12,58 196,64 196,71 12,66\" fill=\"#8a7a66\"/><rect x=\"16\" y=\"66\" width=\"7\" height=\"18\" fill=\"#8a7a66\"/><rect x=\"128\" y=\"10\" width=\"40\" height=\"54\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\" transform=\"rotate(4 148 62)\"/><circle cx=\"149\" cy=\"36\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><path d=\"M204 60 q4 -6 0 -12\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M212 60 q4 -6 0 -12\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"88\" width=\"190\" height=\"46\" rx=\"4\" fill=\"#7fd1ff\" opacity=\"0.45\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><path d=\"M96 112 q10 -8 20 0 q-10 8 -20 0 z M116 112 l8 -6 v12 z\" fill=\"#ffb347\"/><path d=\"M166 120 q8 -6 16 0 q-8 6 -16 0 z M182 120 l6 -5 v10 z\" fill=\"#ff8c69\"/><circle cx=\"140\" cy=\"104\" r=\"3\" fill=\"none\" stroke=\"#cfd6dd\" stroke-width=\"1.5\"/><circle cx=\"144\" cy=\"96\" r=\"3\" fill=\"none\" stroke=\"#cfd6dd\" stroke-width=\"1.5\"/><circle cx=\"138\" cy=\"92\" r=\"3\" fill=\"none\" stroke=\"#cfd6dd\" stroke-width=\"1.5\"/><text x=\"296\" y=\"40\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Dev's narrow shelf</text><text x=\"296\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">and his gaming PC</text><text x=\"296\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">fish tank below</text></svg><div class=\"cap\">Look at the shelf, and at what's underneath it.</div></div>\n\n**Dev** put his gaming PC on a narrow, wobbly shelf. Right below it is his fish tank. \"Saves space!\"\n\n**What should Dev do?**\n\n* [[Add a rubber mat so the tower stops sliding->D7 J10 W]]\n* [[Put a lid on the fish tank and keep it there->D7 J10 W]]\n* [[Push the tower to the very back of the shelf->D7 J10 W]]\n* [[Move it to a sturdy desk, away from the tank->D7 J10 R]]", "D7 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Wobbly shelf plus water below. **Move it to a sturdy surface, away from the water.** A lid fixes only half.\"\n\n[[Got it->D7 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the living room on the map. Two hazards.\"\n\n[[Try again->D7 J10]]]", "D7 J10 R": "(set: $miss to 0)## ✅ Job done\n**Sturdy surface, no water nearby, for the computer and the fish.**\n\n[[Next customer->D7 J11]]", "D7 J11": "<div class=\"scene\">🚿 💻 💧</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Ava's laptop sits in the bathroom while the shower runs.\"><rect x=\"8\" y=\"8\" width=\"110\" height=\"108\" rx=\"4\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/><path d=\"M30 10 v10 h22\" stroke=\"#9aa4ae\" stroke-width=\"5\" fill=\"none\"/><rect x=\"50\" y=\"16\" width=\"20\" height=\"8\" rx=\"3\" fill=\"#9aa4ae\"/><line x1=\"52\" y1=\"30\" x2=\"48\" y2=\"110\" stroke=\"#7fd1ff\" stroke-width=\"1.5\" opacity=\"0.6\"/><line x1=\"56\" y1=\"30\" x2=\"54\" y2=\"110\" stroke=\"#7fd1ff\" stroke-width=\"1.5\" opacity=\"0.6\"/><line x1=\"60\" y1=\"30\" x2=\"60\" y2=\"110\" stroke=\"#7fd1ff\" stroke-width=\"1.5\" opacity=\"0.6\"/><line x1=\"64\" y1=\"30\" x2=\"66\" y2=\"110\" stroke=\"#7fd1ff\" stroke-width=\"1.5\" opacity=\"0.6\"/><path d=\"M100 70 q8 -8 0 -16 q-8 -8 0 -16\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.85\"/><path d=\"M130 56 q8 -8 0 -16 q-8 -8 0 -16\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.85\"/><path d=\"M160 64 q8 -8 0 -16 q-8 -8 0 -16\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.85\"/><path d=\"M186 48 q8 -8 0 -16 q-8 -8 0 -16\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\" opacity=\"0.85\"/><rect x=\"150\" y=\"96\" width=\"202\" height=\"10\" fill=\"#cfd6dd\"/><ellipse cx=\"320\" cy=\"96\" rx=\"24\" ry=\"6\" fill=\"#9aa4ae\"/><rect x=\"200\" y=\"85\" width=\"76\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"267,85 276,85 302,13 293,13\" fill=\"#8a96a3\"/><polygon points=\"271,81 294,19 296,19 273,81\" fill=\"#7fd1ff\" opacity=\"0.5\"/><text x=\"63\" y=\"134\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">hot shower</text><text x=\"250\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Ava's laptop on the counter</text></svg><div class=\"cap\">Ava's laptop sits in the bathroom while the shower runs.</div></div>\n\n**Ava** props her laptop on the bathroom counter during long, hot showers. Now the keys feel tacky and the trackpad glitches.\n\n**What's going on?**\n\n* [[Steam turns to water inside; keep it out->D7 J11 R]]\n* [[The heat softened the keys; let them cool->D7 J11 W]]\n* [[The trackpad needs a driver update to work->D7 J11 W]]\n* [[Fog is on the screen; wipe it after showers->D7 J11 W]]", "D7 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Steam **condenses** into water on the parts inside, and that means corrosion. **Keep laptops out of steamy bathrooms.**\"\n\n[[Got it->D7 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the steam picture again.\"\n\n[[Try again->D7 J11]]]", "D7 J11 R": "(set: $miss to 0)## ✅ Job done\n**Moisture on circuits causes corrosion and glitches.**\n\n[[Next customer->D7 J12]]", "D7 J12": "<div class=\"scene\">🔌 🚶 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Gray footprints show where people walk at night.\"><text x=\"180\" y=\"16\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Jayden's hallway, from above</text><line x1=\"8\" y1=\"28\" x2=\"352\" y2=\"28\" stroke=\"#9aa4ae\" stroke-width=\"5\"/><line x1=\"8\" y1=\"98\" x2=\"244\" y2=\"98\" stroke=\"#9aa4ae\" stroke-width=\"5\"/><line x1=\"312\" y1=\"98\" x2=\"352\" y2=\"98\" stroke=\"#9aa4ae\" stroke-width=\"5\"/><rect x=\"42\" y=\"30\" width=\"22\" height=\"12\" rx=\"2\" fill=\"#eef1f4\"/><path d=\"M53 40 C 90 70, 220 60, 278 112\" stroke=\"#ffb347\" stroke-width=\"3\" fill=\"none\"/><rect x=\"262\" y=\"110\" width=\"34\" height=\"22\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"262\" y=\"106\" width=\"34\" height=\"5\" rx=\"1\" fill=\"#7fd1ff\" opacity=\"0.7\"/><ellipse cx=\"100\" cy=\"54\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"126\" cy=\"70\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"152\" cy=\"54\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"178\" cy=\"70\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"204\" cy=\"54\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"230\" cy=\"70\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><text x=\"53\" y=\"58\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">outlet</text><text x=\"250\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">laptop</text></svg><div class=\"cap\">Gray footprints show where people walk at night.</div></div>\n\n**Jayden's** charger cord stretches across the hallway. His mom tripped on it in the dark, and the laptop nearly fell.\n\n**Best fix?**\n\n* [[Hide the cord under the hallway rug->D7 J12 W]]\n* [[Get a longer cable to lie loose on the floor->D7 J12 W]]\n* [[Charge where the cord runs along the wall->D7 J12 R]]\n* [[Only charge it in the daytime with lights on->D7 J12 W]]", "D7 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Cords don't cross walkways. **Charge where the cord runs along the wall.** Never under a rug: it traps heat.\"\n\n[[Got it->D7 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three cord pictures again.\"\n\n[[Try again->D7 J12]]]", "D7 J12 R": "(set: $miss to 0)(if: $days does not contain \"7\")[(set: $days to it + (a: \"7\"))]## ✅ Job done\n**Keep cords out of walkways and out from under rugs.**\n\n[[Close up shop->D7 Done]]", "D7 Done": "(if: $days does not contain \"7\")[(set: $days to it + (a: \"7\"))]# Day 7 complete!\n\n<div class=\"tool\">🐾 **New tool earned: Hazard Map**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **Hazard map.** Draw your computer room from above. Mark drinks, pets, heaters, edges, and cords across walkways in red. Fix **one** hazard. Moving plugs, cords, or a power strip? Do it with a grown-up.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Fur, Paws, and Teeth\n<div class=\"pic\"><svg viewBox=\"0 0 400 140\" role=\"img\" aria-label=\"Fur blocks the vents. Clean them with short bursts of air and a soft brush, <b>off and unplugged</b>.\"><path d=\"M16 38 q6 -10 12 0 q6 -10 12 0\" stroke=\"#e0a95a\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M20 44 q5 -8 10 0\" stroke=\"#e0a95a\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M50 56 q6 -10 12 0 q6 -10 12 0\" stroke=\"#9aa4ae\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M54 62 q5 -8 10 0\" stroke=\"#9aa4ae\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M22 72 q6 -10 12 0 q6 -10 12 0\" stroke=\"#e0a95a\ \"50\" rx=\"4\" fill=\"#6b5a8e\"/><path d=\"M145 61 L232 61 L232 50\" stroke=\"#ffb347\" stroke-width=\"3\" fill=\"none\" stroke-dasharray=\"6 4\"/><line x1=\"183\" y1=\"91\" x2=\"197\" y2=\"105\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"183\" y1=\"105\" x2=\"197\" y2=\"91\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><rect x=\"272\" y=\"10\" width=\"120\" height=\"100\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"272\" y=\"56\" width=\"5\" height=\"10\" fill=\"#ffb347\"/><rect x=\"360\" y=\"20\" width=\"26\" height=\"30\" rx=\"3\" fill=\"#4a3f33\"/><text x=\"332\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Along the wall</text><text x=\"332\" y=\"150\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">out of the way</text><path d=\"M277 61 L280 61 L280 104 L384 104 L384 50\" stroke=\"#ffb347\" stroke-width=\"3\" fill=\"none\"/><path d=\"M323 76 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><div class=\"cap\">Cords go along walls or behind furniture, never across a walkway.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🧱</span><b>✅ Sturdy and flat</b>not a wobbly shelf</div><div class=\"card ok\"><span class=\"big\">📏</span><b>✅ Away from edges</b>nothing hanging off</div><div class=\"card no\"><span class=\"big\">🐠</span><b>❌ Over water</b>fish tank or sink</div><div class=\"card \"><span class=\"big\">🧦</span><b>Winter zap</b>touch metal first</div></div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 8->D8 Start]]", "D8 Start": "(set: $miss to 0)# Day 8: On the Move\n\n<div class=\"scene\">🎒 💥 💻</div>\n\n*The Inspector drops a backpack. It lands with a crunch.* \"Devices are built to travel, not to be tossed, baked, frozen, or soaked. A few ten-second habits stop most travel damage.\"\n\n\n[[Open the shop->D8 L1]]", "D8 L1": "## 📘 The Inspector's lesson: Packing and Carrying\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Laptop screens are thin glass. Pressure cracks them, even with no drop.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Book on top</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Padded sleeve</text><line x1=\"60\" y1=\"26\" x2=\"60\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"60,40 56.2,33.0 63.8,33.0\" fill=\"#ff6b6b\"/><line x1=\"100\" y1=\"26\" x2=\"100\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"100,40 96.2,33.0 103.8,33.0\" fill=\"#ff6b6b\"/><line x1=\"140\" y1=\"26\" x2=\"140\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"140,40 136.2,33.0 143.8,33.0\" fill=\"#ff6b6b\"/><rect x=\"35\" y=\"42\" width=\"130\" height=\"26\" rx=\"3\" fill=\"#6b5a8e\"/><rect x=\"35\" y=\"42\" width=\"10\" height=\"26\" fill=\"#55477a\"/><text x=\"105\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Textbook</text><rect x=\"40\" y=\"70\" width=\"120\" height=\"8\" rx=\"2\" fill=\"#5f8fb3\"/><rect x=\"40\" y=\"78\" width=\"120\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polyline points=\"70,70 80,77 90,71 100,78 110,70 120,77\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\"/><text x=\"100\" y=\"115\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">presses the screen</text><text x=\"100\" y=\"133\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">into the keys</text><rect x=\"230\" y=\"40\" width=\"140\" height=\"56\" rx=\"16\" fill=\"#3d4a5c\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><rect x=\"248\" y=\"58\" width=\"104\" height=\"8\" rx=\"2\" fill=\"#5f8fb3\"/><rect x=\"248\" y=\"66\" width=\"104\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><text x=\"300\" y=\"115\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">padding spreads</text><text x=\"300\" y=\"133\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">out the bumps</text></svg><div class=\"cap\">Laptop screens are thin glass. Pressure cracks them, even with no drop.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🛡️</span><b>✅ Padded sleeve</b>or laptop pocket</div><div class=\"card ok\"><span class=\"big\">✏️</span><b>✅ Clear the keys</b>pencils, earbuds, clips</div><div class=\"card no\"><span class=\"big\">📚</span><b>❌ Books on the lid</b>pressure cracks glass</div><div class=\"card no\"><span class=\"big\">💥</span><b>❌ Tossing the bag</b>a drop is still a drop</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Hinges and screens aren't built to hold the laptop's weight.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">By the screen</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">By the base</text><rect x=\"30\" y=\"120\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"131,120 140,120 166,48 157,48\" fill=\"#8a96a3\"/><polygon points=\"135,116 158,54 160,54 137,116\" fill=\"#7fd1ff\" opacity=\"0.5\"/><ellipse cx=\"166\" cy=\"52\" rx=\"13\" ry=\"9\" fill=\"#e0b38a\"/><ellipse cx=\"157\" cy=\"46\" rx=\"5\" ry=\"4\" fill=\"#e0b38a\"/><line x1=\"50\" y1=\"65\" x2=\"70\" y2=\"85\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"85\" x2=\"70\" y2=\"65\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"137\" y1=\"92\" x2=\"137\" y2=\"112\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"137,112 133.2,105.0 140.8,105.0\" fill=\"#ff6b6b\"/><text x=\"100\" y=\"158\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">hinges take the strain</text><rect x=\"240\" y=\"106\" width=\"120\" height=\"8\" rx=\"2\" fill=\"#5f8fb3\"/><rect x=\"240\" y=\"114\" width=\"120\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><ellipse cx=\"262\" cy=\"132\" rx=\"13\" ry=\"9\" fill=\"#e0b38a\"/><ellipse cx=\"253\" cy=\"126\" rx=\"5\" ry=\"4\" fill=\"#e0b38a\"/><ellipse cx=\"342\" cy=\"132\" rx=\"13\" ry=\"9\" fill=\"#e0b38a\"/><ellipse cx=\"333\" cy=\"126\" rx=\"5\" ry=\"4\" fill=\"#e0b38a\"/><path d=\"M291 75 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"158\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">closed, both hands</text></svg><div class=\"cap\">Hinges and screens aren't built to hold the laptop's weight.</div></div>\n\n**Before you bag it:**\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"Updates or open programs can keep it awake. A laptop running in a bag gets <b>hot and drained</b>.\"><rect x=\"8\" y=\"55\" width=\"96\" height=\"50\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"56\" y=\"77\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Close</text><text x=\"56\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">the lid</text><line x1=\"106\" y1=\"80\" x2=\"134\" y2=\"80\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"134,80 127.0,83.8 127.0,76.2\" fill=\"#9aa4ae\"/><rect x=\"138\" y=\"45\" width=\"120\" height=\"70\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><text x=\"198\" y=\"74\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Quiet</text><text x=\"198\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">and cool?</text><line x1=\"260\" y1=\"66\" x2=\"288\" y2=\"36\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"288,36 286.0,43.7 280.4,38.5\" fill=\"#6fe3b5\"/><text x=\"276\" y=\"40\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"end\" font-weight=\"normal\">yes</text><line x1=\"260\" y1=\"94\" x2=\"288\" y2=\"124\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"288,124 280.4,121.5 286.0,116.3\" fill=\"#ff6b6b\"/><text x=\"276\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"normal\">no</text><rect x=\"292\" y=\"12\" width=\"104\" height=\"44\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"344\" y=\"40\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Bag it</text><rect x=\"292\" y=\"104\" width=\"104\" height=\"44\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><text x=\"344\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Shut it down</text></svg><div class=\"cap\">Updates or open programs can keep it awake. A laptop running in a bag gets <b>hot and drained</b>.</div></div>\n\n[[Got it. Send in the next customer->D8 J2]]", "D8 J2": "<div class=\"scene\">🎒 🔥 🪫</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"He closed the lid at 8 a.m. By 3 p.m. it's hot and dead.\"><path d=\"M66.0 22 Q90.0 2 114.0 22\" stroke=\"#5a7fa8\" stroke-width=\"6\" fill=\"none\"/><rect x=\"30\" y=\"18\" width=\"120\" height=\"100\" rx=\"22\" fill=\"#5a7fa8\"/><rect x=\"44\" y=\"30\" width=\"92\" height=\"80\" rx=\"12\" fill=\"#1b1f24\"/><rect x=\"62\" y=\"36\" width=\"14\" height=\"70\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"80\" y=\"36\" width=\"10\" height=\"70\" rx=\"3\" fill=\"#6b5a8e\"/><text x=\"113\" y=\"76\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">lid</text><text x=\"113\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">closed</text><circle cx=\"215\" cy=\"58\" r=\"30\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"215\" y1=\"58\" x2=\"215\" y2=\"36\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"215\" y1=\"58\" x2=\"233\" y2=\"58\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"276\" y=\"40\" width=\"62\" height=\"34\" rx=\"5\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"338\" y=\"50\" width=\"7\" height=\"14\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"281\" y=\"45\" width=\"5\" height=\"24\" rx=\"2\" fill=\"#ff6b6b\"/><text x=\"90\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Dev's backpack, inside</text><text x=\"215\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">3 p.m.</text><text x=\"310\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">hot, battery</text><text x=\"310\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">at 0%</text></svg><div class=\"cap\">He closed the lid at 8 a.m. By 3 p.m. it's hot and dead.</div></div>\n\n**Dev** closed the lid and stuffed his laptop in his backpack. At 3 p.m. it's hot, and the battery is dead.\n\n**What happened?**\n\n* [[The sun on his walk baked the whole backpack->D8 J2 W]]\n* [[Closing the lid overcharged the battery->D8 J2 W]]\n* [[It never slept and ran all day in the bag->D8 J2 R]]\n* [[The old battery just gave out during school->D8 J2 W]]", "D8 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"It **never went to sleep**. It ran all day in a closed bag. Shut it down, or check that it's really asleep.\"\n\n[[Got it->D8 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Quiet and cool? chart again.\"\n\n[[Try again->D8 J2]]]", "D8 J2 R": "(set: $miss to 0)## ✅ Job done\n**It kept running in the bag.** Trapped heat plus nonstop running drained the battery.\n\n[[Next customer->D8 J3]]", "D8 J3": "<div class=\"scene\">📚 💻 💥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 148\" role=\"img\" aria-label=\"The crack spreads out from the middle of the screen.\"><rect x=\"95.0\" y=\"8\" width=\"170\" height=\"92\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"102.0\" y=\"15\" width=\"156\" height=\"78\" rx=\"2\" fill=\"#2c4a66\"/><polygon points=\"91.0,102 269.0,102 283.0,120 77.0,120\" fill=\"#8a96a3\"/><polyline points=\"180,52 162,38 130,30\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 167,62 142,78\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 187,34 186,22\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 205,37 226,28\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 207,59 232,72\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 188,64 190,82\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 158,51 122,56\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 198,64 210,82\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><circle cx=\"180\" cy=\"52\" r=\"16\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.2\"/><text x=\"180\" y=\"142\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Kai's laptop: no dents, no drop marks</text></svg><div class=\"cap\">The crack spreads out from the middle of the screen.</div></div>\n\n**Kai** carried his laptop all week with his textbook stacked on top. Now the screen has a spiderweb crack. He never dropped it.\n\n**What cracked it?**\n\n* [[The book's weight; pad it, nothing on top->D8 J3 R]]\n* [[A loose hinge; tighten the screws himself->D8 J3 W]]\n* [[Cold weather; keep it warm all winter long->D8 J3 W]]\n* [[A bright screen; turn the brightness down->D8 J3 W]]", "D8 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Every bump pushed the book onto the lid. **Pressure cracks screens.** Padded sleeve, and **nothing heavy on top**.\"\n\n[[Got it->D8 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Book on top picture again.\"\n\n[[Try again->D8 J3]]]", "D8 J3 R": "(set: $miss to 0)## ✅ Job done\n**Heavy things on the lid crack screens.** The glass gets squeezed against the keys.\n\n[[Next customer->D8 J4]]", "D8 J4": "<div class=\"scene\">🚶 💻 ✋</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"He holds it by the top corner of the screen.\"><rect x=\"110\" y=\"100\" width=\"120\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"221,100 230,100 256,28 247,28\" fill=\"#8a96a3\"/><polygon points=\"225,96 248,34 250,34 227,96\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"120\" y=\"110\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"208\" y=\"110\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><ellipse cx=\"258\" cy=\"30\" rx=\"13\" ry=\"9\" fill=\"#e0b38a\"/><ellipse cx=\"249\" cy=\"24\" rx=\"5\" ry=\"4\" fill=\"#e0b38a\"/><text x=\"180\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">how Jayden carries it, open, walking</text></svg><div class=\"cap\">He holds it by the top corner of the screen.</div></div>\n\n**Jayden** walks between classes holding his open laptop by the top corner of the screen. \"It's faster!\"\n\n**What should he do?**\n\n* [[Keep holding the screen, but with two hands->D8 J4 W]]\n* [[Close it and carry it by the base instead->D8 J4 R]]\n* [[Carry it open with the screen tilted back->D8 J4 W]]\n* [[Hold one corner of the keyboard to balance->D8 J4 W]]", "D8 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The screen and hinges can't hold the whole laptop. **Carry it closed, by the base.**\"\n\n[[Got it->D8 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the By the base picture again.\"\n\n[[Try again->D8 J4]]]", "D8 J4 R": "(set: $miss to 0)## ✅ Job done\n**Carry it by the base, not the screen.** That's how hinges loosen and screens crack.\n\n[[The Inspector has something to show you->D8 L5]]", "D8 L5": "## 📘 The Inspector's lesson: Heat, Cold, and Rain\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 180\" role=\"img\" aria-label=\"A parked car gets much hotter than outside. Over about 95°F can <b>permanently</b> shrink the battery.\"><circle cx=\"38\" cy=\"32\" r=\"15\" fill=\"#ffb347\"/><line x1=\"58.0\" y1=\"32.0\" x2=\"65. =\"20\" height=\"112\" rx=\"10\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><circle cx=\"362\" cy=\"140\" r=\"14\" fill=\"#ff6b6b\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"357\" y=\"28\" width=\"10\" height=\"108\" fill=\"#ff6b6b\"/><line x1=\"262\" y1=\"58\" x2=\"385\" y2=\"58\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"258\" y=\"56\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"bold\">95°F</text><text x=\"258\" y=\"74\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"normal\">35°C</text><text x=\"282\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Outside</text><text x=\"362\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">In the car</text></svg><div class=\"cap\">A parked car gets much hotter than outside. Over about 95°F can <b>permanently</b> shrink the battery.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 140\" role=\"img\" aria-label=\"Like glasses fogging up, but inside too. After a freezing night: <b>an hour or more</b>.\"><line x1=\"39.0\" y1=\"24.0\" x2=\"61.0\" y2=\"24.0\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"44.5\" y1=\"14.4\" x2=\"55.5\" y2=\"33.6\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"55.5\" y1=\"14.4\" x2=\"44.5\" y2=\"33.6\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"20\" y=\"46\" width=\"60\" height=\"14\" rx=\"3\" fill=\"#5f8fb3\"/><line x1=\"86\" y1=\"53\" x2=\"112\" y2=\"53\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"112,53 105.0,56.8 105.0,49.2\" fill=\"#9aa4ae\"/><path d=\"M135 14 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"120\" y=\"46\" width=\"60\" height=\"14\" rx=\"3\" fill=\"#8a96a3\"/><circle cx=\"126\" cy=\"38\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"142\" cy=\"32\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"160\" cy=\"38\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"176\" cy=\"31\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"132\" cy=\"68\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"152\" cy=\"72\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"171\" cy=\"67\" r=\"3.5\" fill=\"#7fd1ff\"/><line x1=\"186\" y1=\"53\" x2=\"212\" y2=\"53\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"212,53 205.0,56.8 205.0,49.2\" fill=\"#9aa4ae\"/><circle cx=\"250\" cy=\"45\" r=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"250\" y1=\"45\" x2=\"250\" y2=\"29\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"250\" y1=\"45\" x2=\"262\" y2=\"51\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"286\" y1=\"53\" x2=\"312\" y2=\"53\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"312,53 305.0,56.8 305.0,49.2\" fill=\"#9aa4ae\"/><path d=\"M341.0 38.0 A15 15 0 1 0 359.0 38.0\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"350\" y1=\"32\" x2=\"350\" y2=\"50\" stroke=\"#6fe3b5\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">1. Cold</text><text x=\"50\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">from the car</text><text x=\"150\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">2. Warm room</text><text x=\"150\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">water forms</text><text x=\"250\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Wait</text><text x=\"250\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">closed + off</text><text x=\"350\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">4. Turn on</text><text x=\"350\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">at room temp</text></svg><div class=\"cap\">Like glasses fogging up, but inside too. After a freezing night: <b>an hour or more</b>.</div></div>\n\n**If it gets wet:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"><rect x=\"36\" y=\"6\" width=\"28\" height=\"52\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"28\" cy=\"14\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"25\" cy=\"40\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"75\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/><path d=\"M44.6 26.8 A9 9 0 1 0 55.4 26.8\" stroke=\"#6fe3b5\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"34\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>1. Power off</b>right away</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Dry it off\"><rect x=\"36\" y=\"6\" width=\"28\" height=\"52\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><path d=\"M24 40 Q50 32 76 40 L72 66 Q50 60 28 66 Z\" fill=\"#6b5a8e\"/><circle cx=\"28\" cy=\"14\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"25\" cy=\"40\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"75\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/></svg><b>2. Dry it off</b>just the outside</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Don't charge\"><rect x=\"30\" y=\"22\" width=\"26\" height=\"26\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"56\" y=\"27\" width=\"12\" height=\"4\" fill=\"#9aa4ae\"/><rect x=\"56\" y=\"39\" width=\"12\" height=\"4\" fill=\"#9aa4ae\"/><line x1=\"30\" y1=\"35\" x2=\"14\" y2=\"35\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"34\" y1=\"19\" x2=\"66\" y2=\"51\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"34\" y1=\"51\" x2=\"66\" y2=\"19\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>3. Don't charge</b>until fully dry</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Wait\"><circle cx=\"50\" cy=\"35\" r=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"50\" y1=\"35\" x2=\"50\" y2=\"19\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"35\" x2=\"62\" y2=\"41\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>4. Wait</b>a grown-up says when</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🌳</span><b>✅ Cool, shady spot</b>let it cool on its own</div><div class=\"card ok\"><span class=\"big\">🎒</span><b>✅ Inside pocket</b>or a zip-top bag</div><div class=\"card no\"><span class=\"big\">🧊</span><b>❌ Freezer or fridge</b>too sudden: condensation</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Hair dryer, heater</b>fast heat = more water</div><div class=\"card no\"><span class=\"big\">🍚</span><b>❌ Rice</b>doesn't work, clogs ports</div><div class=\"card no\"><span class=\"big\">🌧️</span><b>❌ Outside pocket</b>bags aren't waterproof</div></div>\n\n<div class=\"warn\">**Grown-up needed:** If a device got soaked, a grown-up decides when it's dry enough to charge. Charging a wet device can damage it or cause a short circuit.</div>\n\n[[Got it. Send in the next customer->D8 J6]]", "D8 J6": "<div class=\"scene\">🚗 ☀️ <svg viewBox=\"0 0 46 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"tablet\"><rect x=\"3\" y=\"3\" width=\"40\" height=\"54\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"8\" y=\"9\" width=\"30\" height=\"40\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.6\"/><circle cx=\"23\" cy=\"53\" r=\"2\" fill=\"#9aa4ae\"/></svg></div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"The tablet is showing a heat warning and won't work.\"><circle cx=\"150\" cy=\"22\" r=\"11\" fill=\"#ffb347\"/><path d=\"M172 14 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M172 22 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M14 96 L28 26 Q30 16 42 18 L48 20 L40 96 Z\" fill=\"#6b5a5a\"/><rect x=\"32\" y=\"90\" width=\"140\" height=\"26\" rx=\"10\" fill=\"#7a6767\"/><rect x=\"70\" y=\"80\" width=\"80\" height=\"10\" rx=\"3\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"232\" y=\"10\" width=\"86\" height=\"106\" rx=\"9\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"239\" y=\"18\" width=\"72\" height=\"88\" rx=\"3\" fill=\"#1b1f24\"/><rect x=\"270\" y=\"30\" width=\"10\" height=\"38\" rx=\"5\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><circle cx=\"275\" cy=\"72\" r=\"9\" fill=\"#ff6b6b\"/><rect x=\"273\" y=\"44\" width=\"4\" height=\"26\" fill=\"#ff6b6b\"/><text x=\"275\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">too hot</text><text x=\"100\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">left on the car seat, July</text><text x=\"275\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her tablet now</text></svg><div class=\"cap\">The tablet is showing a heat warning and won't work.</div></div>\n\n**Ms. Rivera** left her tablet on the car seat during a July errand. Now it shows a heat warning and won't work.\n\n**What now?**\n\n* [[Pop it in the freezer to cool it off fast->D8 J6 W]]\n* [[Plug it in, since the heat drained it->D8 J6 W]]\n* [[Keep tapping until the warning goes away->D8 J6 W]]\n* [[Move it somewhere cool and let it rest->D8 J6 R]]", "D8 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Let it cool down on its own** somewhere cool. A freezer is too sudden. And no more parked cars.\"\n\n[[Got it->D8 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Cool, shady spot and Freezer cards again.\"\n\n[[Try again->D8 J6]]]", "D8 J6 R": "(set: $miss to 0)## ✅ Job done\n**Cool it slowly.** The warning is the tablet protecting itself from heat.\n\n[[Next customer->D8 J7]]", "D8 J7": "<div class=\"scene\">❄️ 🚗 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 148\" role=\"img\" aria-label=\"Look at the edges of the screen.\"><rect x=\"95.0\" y=\"8\" width=\"170\" height=\"92\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"102.0\" y=\"15\" width=\"156\" height=\"78\" rx=\"2\" fill=\"#3a6a96\"/><polygon points=\"91.0,102 269.0,102 283.0,120 77.0,120\" fill=\"#8a96a3\"/><rect x=\"102\" y=\"15\" width=\"156\" height=\"78\" rx=\"2\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"16\" opacity=\"0.6\"/><circle cx=\"161\" cy=\"88\" r=\"1.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"119\" cy=\"19\" r=\"3.0\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"165\" cy=\"91\" r=\"2.2\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"253\" cy=\"32\" r=\"2.7\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"178\" cy=\"22\" r=\"2.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"253\" cy=\"83\" r=\"2.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"105\" cy=\"76\" r=\"2.1\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"255\" cy=\"23\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"180\" cy=\"22\" r=\"2.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"196\" cy=\"87\" r=\"1.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"128\" cy=\"85\" r=\"2.2\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"254\" cy=\"44\" r=\"2.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"129\" cy=\"87\" r=\"2.3\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"109\" cy=\"85\" r=\"2.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"152\" cy=\"89\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"226\" cy=\"23\" r=\"2.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"157\" cy=\"85\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"145\" cy=\"88\" r=\"2.1\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"255\" cy=\"47\" r=\"1.7\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"136\" cy=\"22\" r=\"2.0\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"224\" cy=\"20\" r=\"2.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"250\" cy=\"29\" r=\"2.3\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"253\" cy=\"60\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"111\" cy=\"22\" r=\"2.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"105\" cy=\"85\" r=\"2.2\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"251\" cy=\"91\" r=\"1.5\" fill=\"#ffffff\" opacity=\"0.8\"/><text x=\"180\" y=\"142\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Patel's screen, just turned on</text></svg><div class=\"cap\">Look at the edges of the screen.</div></div>\n\n**Mr. Patel's** laptop sat in the car on a January night. Inside, he turned it on right away. The screen edges look foggy.\n\n**What should he have done?**\n\n* [[Turned it on so its own heat dries it out->D8 J7 W]]\n* [[Warmed it fast with a hair dryer on low->D8 J7 W]]\n* [[Set it by the heater vent to warm it up->D8 J7 W]]\n* [[Kept it closed and off until room temp->D8 J7 R]]", "D8 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Warm air **condenses** on cold parts, inside too. **Closed and off until room temperature**, an hour or more.\"\n\n[[Got it->D8 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 3 in the cold-to-warm picture.\"\n\n[[Try again->D8 J7]]]", "D8 J7 R": "(set: $miss to 0)## ✅ Job done\n**Let it warm up slowly, closed and off.** Water plus power can short out circuits.\n\n[[Next customer->D8 J8]]", "D8 J8": "<div class=\"scene\">🌧️ 🎒 📱</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Her phone rode home in the outside pocket.\"><line x1=\"20\" y1=\"8\" x2=\"14\" y2=\"22\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"18\" x2=\"54\" y2=\"32\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"100\" y1=\"4\" x2=\"94\" y2=\"18\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"14\" x2=\"144\" y2=\"28\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"6\" x2=\"194\" y2=\"20\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"20\" x2=\"234\" y2=\"34\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"300\" y1=\"8\" x2=\"294\" y2=\"22\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"340\" y1=\"16\" x2=\"334\" y2=\"30\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"180\" y1=\"30\" x2=\"174\" y2=\"44\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"40\" x2=\"34\" y2=\"54\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M76.0 34 Q100.0 14 124.0 34\" stroke=\"#5a7fa8\" stroke-width=\"6\" fill=\"none\"/><rect x=\"40\" y=\"30\" width=\"120\" height=\"84\" rx=\"22\" fill=\"#5a7fa8\"/><rect x=\"60\" y=\"72\" width=\"80\" height=\"36\" rx=\"10\" fill=\"#4a6f98\" stroke=\"#3d5f85\" stroke-width=\"2\"/><rect x=\"84\" y=\"44\" width=\"32\" height=\"44\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"88\" y=\"49\" width=\"24\" height=\"22\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.8\"/><rect x=\"60\" y=\"72\" width=\"80\" height=\"36\" rx=\"10\" fill=\"#4a6f98\" opacity=\"0.9\"/><circle cx=\"80\" cy=\"58\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"120\" cy=\"64\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"76\" cy=\"50\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"122\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/><rect x=\"210\" y=\"22\" width=\"56\" height=\"96\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"216\" y=\"30\" width=\"44\" height=\"76\" rx=\"3\" fill=\"#7fd1ff\" opacity=\"0.8\"/><circle cx=\"204\" cy=\"40\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"272\" cy=\"52\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"230\" cy=\"60\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"250\" cy=\"90\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"206\" cy=\"96\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"272\" cy=\"108\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"238\" cy=\"116\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"100\" y=\"133\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the outside pocket</text><text x=\"318\" y=\"64\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">still on,</text><text x=\"318\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">wet all</text><text x=\"318\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">over</text></svg><div class=\"cap\">Her phone rode home in the outside pocket.</div></div>\n\n**Nora** walked home in a downpour with her phone in the outside pocket. It's still on and wet all over.\n\n**What should she do?**\n\n* [[Plug it in now so it doesn't die wet->D8 J8 W]]\n* [[Power off, dry it, don't charge it yet->D8 J8 R]]\n* [[Bury it in a bowl of rice overnight->D8 J8 W]]\n* [[Blow-dry the charging port on high heat->D8 J8 W]]", "D8 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Power off, dry the outside, don't charge** until it's fully dry. No rice, no hair dryer.\"\n\n[[Got it->D8 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three wet-phone cards again.\"\n\n[[Try again->D8 J8]]]", "D8 J8 R": "(set: $miss to 0)## ✅ Job done\n**Off, dry, no charging yet.** Next rainy day, use an inside pocket or a zip-top bag.\n\n[[The Inspector has something to show you->D8 L9]]", "D8 L9": "## 📘 The Inspector's lesson: Storage and Accidents\n\n**Long naps (like summer break):**\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.\"><rect x=\"25\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"109\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"29\" y=\"24\" width=\"5\" height=\"32\" rx=\"3\" fill=\"#ff6b6b\"/><rect x=\"155\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"239\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"159\" y=\"24\" width=\"38\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><rect x=\"285\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"369\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"289\" y=\"24\" width=\"76\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"70\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">0%</text><text x=\"70\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">may never</text><text x=\"70\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">charge again</text><text x=\"200\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">About 50%</text><text x=\"200\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">just right</text><text x=\"330\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">100%</text><text x=\"330\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">wears it out</text><text x=\"330\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">faster</text><line x1=\"62\" y1=\"137\" x2=\"78\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"62\" y1=\"153\" x2=\"78\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M191 145 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"322\" y1=\"137\" x2=\"338\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"153\" x2=\"338\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><div class=\"cap\">Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🗄️</span><b>✅ Cool, dry room</b>a closet or shelf</div><div class=\"card no\"><span class=\"big\">🏚️</span><b>❌ Hot attic</b>an oven in summer</div><div class=\"card no\"><span class=\"big\">🏠</span><b>❌ Garage</b>hot in summer</div><div class=\"card no\"><span class=\"big\">🚗</span><b>❌ Car trunk</b>way too hot</div></div>\n\n**After a drop, stop for any of these:**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">👃</span><b>❌ Burning smell</b>or a chemical smell</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Sparks</b>any at all</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Smoke</b>any at all</div><div class=\"card no\"><span class=\"big\">🎈</span><b>❌ Bulging battery</b>case or trackpad pushed up</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.\"><rect x=\"6\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><text x=\"101\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Danger sign?</text><text x=\"20\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Power off</text><text x=\"20\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Don't charge</text><text x=\"20\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Keep it away from</text><text x=\"36\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">things that burn</text><text x=\"20\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Get a pro</text><rect x=\"204\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"299\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">No signs?</text><text x=\"218\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Check for cracks</text><text x=\"218\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Test the hinge</text><text x=\"218\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Back up files</text><text x=\"218\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Watch for days</text><text x=\"299\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">loose cables can act</text><text x=\"299\" y=\"199\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">up days later</text></svg><div class=\"cap\">Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.</div></div>\n\n<div class=\"warn\">**Grown-up needed:** A swollen battery, a burning smell, or sparks means a grown-up takes over. Don't press on the swelling, don't charge it, and get it to a professional or a battery recycler.</div>\n\n[[Got it. Send in the next customer->D8 J10]]", "D8 J10": "<div class=\"scene\"><svg viewBox=\"0 0 60 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"stairs\"><path d=\"M2 58 V46 H16 V34 H30 V22 H44 V10 H58 V58 Z\" fill=\"#a07850\" stroke=\"#e9ecef\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg> 💻 😅</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"No smell, no sparks, nothing bulging.\"><path d=\"M10 120 V100 H50 V80 H90 V60 H130 V40 H170 V120 Z\" fill=\"#a07850\"/><line x1=\"150\" y1=\"26\" x2=\"230\" y2=\"70\" stroke=\"#9aa4ae\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"230,70 222.0,70.0 225.7,63.3\" fill=\"#9aa4ae\"/><rect x=\"231.0\" y=\"30\" width=\"110\" height=\"62\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"238.0\" y=\"37\" width=\"96\" height=\"48\" rx=\"2\" fill=\"#3a6a96\"/><polygon points=\"227.0,94 345.0,94 359.0,112 213.0,112\" fill=\"#8a96a3\"/><text x=\"286\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">it turns on fine</text><text x=\"90\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">half a flight</text></svg><div class=\"cap\">No smell, no sparks, nothing bulging.</div></div>\n\n**Ava** dropped her laptop down half a flight of stairs. It turns on fine. No smell, no sparks, nothing bulging.\n\n**What now?**\n\n* [[Check for cracks, back up, and watch it->D8 J10 R]]\n* [[Nothing, since it turned on just fine->D8 J10 W]]\n* [[Open the bottom case to find loose parts->D8 J10 W]]\n* [[Drop it from a lower step to test it->D8 J10 W]]", "D8 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lucky Ava. Now **check cracks and the hinge, back up, and watch** for days.\"\n\n[[Got it->D8 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the No signs? box again.\"\n\n[[Try again->D8 J10]]]", "D8 J10 R": "(set: $miss to 0)## ✅ Job done\n**Check, back up, watch.** A loose cable inside may not act up until later.\n\n[[Next customer->D8 J11]]", "D8 J11": "<div class=\"scene\">🛋️ 💻 🎈</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 142\" role=\"img\" aria-label=\"The trackpad is pushed up and the bottom is puffy.\"><rect x=\"20\" y=\"62\" width=\"130\" height=\"12\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"20\" y=\"54\" width=\"130\" height=\"7\" rx=\"2\" fill=\"#5f8fb3\"/><text x=\"85\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">a normal laptop</text><text x=\"85\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">(closed, from the side)</text><path d=\"M200 60 L270 60 Q290 46 310 60 L340 60 L340 66 Q300 96 260 76 Q230 84 200 74 Z\" fill=\"#8a96a3\"/><path d=\"M200 54 L270 54 Q290 40 310 54 L340 54 L340 60 L310 60 Q290 46 270 60 L200 60 Z\" fill=\"#5f8fb3\"/><line x1=\"290\" y1=\"24\" x2=\"290\" y2=\"40\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"290,40 286.2,33.0 293.8,33.0\" fill=\"#ffb347\"/><line x1=\"296\" y1=\"104\" x2=\"296\" y2=\"90\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"296,90 299.8,97.0 292.2,97.0\" fill=\"#ffb347\"/><text x=\"270\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">Grandpa Leo's laptop</text><text x=\"270\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">smells like chemicals</text></svg><div class=\"cap\">The trackpad is pushed up and the bottom is puffy.</div></div>\n\n**Grandpa Leo's** laptop fell off the couch. A day later the trackpad is pushed up, the bottom is puffy, and it smells like chemicals.\n\n**What should happen?**\n\n* [[Press the trackpad back down and keep going->D8 J11 W]]\n* [[Charge it overnight so the battery settles->D8 J11 W]]\n* [[Power off, no charging, get it to a pro->D8 J11 R]]\n* [[Keep using it, but only on a hard table->D8 J11 W]]", "D8 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **swollen battery**. **Power off, don't charge, don't press it.** A grown-up gets it to a pro.\"\n\n[[Got it->D8 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Bulging battery card again.\"\n\n[[Try again->D8 J11]]]", "D8 J11 R": "(set: $miss to 0)## ✅ Job done\n**Swollen battery: stop using it.** Pressing or charging it can even start a fire.\n\n[[Next customer->D8 J12]]", "D8 J12": "<div class=\"scene\">🏖️ 💻 🏠</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"His plan for summer break.\"><rect x=\"20\" y=\"40\" width=\"96\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"116\" y=\"53\" width=\"9\" height=\"18\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"25\" y=\"45\" width=\"86\" height=\"34\" rx=\"3\" fill=\"#ffb347\"/><text x=\"72\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">1. charge to 100%</text><line x1=\"140\" y1=\"62\" x2=\"180\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"180,62 173.0,65.8 173.0,58.2\" fill=\"#9aa4ae\"/><polygon points=\"196,52 268,18 340,52\" fill=\"#6b5a5a\"/><rect x=\"204\" y=\"52\" width=\"128\" height=\"62\" fill=\"#4a535d\"/><line x1=\"218\" y1=\"66\" x2=\"318\" y2=\"66\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"218\" y1=\"78\" x2=\"318\" y2=\"78\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"218\" y1=\"90\" x2=\"318\" y2=\"90\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"218\" y1=\"102\" x2=\"318\" y2=\"102\" stroke=\"#3a4250\" stroke-width=\"3\"/><rect x=\"218\" y=\"60\" width=\"100\" height=\"54\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><text x=\"268\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">2. into the garage</text></svg><div class=\"cap\">His plan for summer break.</div></div>\n\n**Ms. Abara's** son is putting his school laptop away for summer. \"I'll charge it to 100% and stick it in the garage.\"\n\n**Right way to store it?**\n\n* [[Charge to 100% and leave it plugged in->D8 J12 W]]\n* [[Let it run down to 0% so it can rest->D8 J12 W]]\n* [[Charge to half, power off, keep it cool->D8 J12 R]]\n* [[Charge it full and garage it in its sleeve->D8 J12 W]]", "D8 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**About half, powered off, cool and dry.** A garage in July is an oven.\"\n\n[[Got it->D8 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three batteries again.\"\n\n[[Try again->D8 J12]]]", "D8 J12 R": "(set: $miss to 0)(if: $days does not contain \"8\")[(set: $days to it + (a: \"8\"))]## ✅ Job done\n**About 50%, off, cool and dry.** Over six months? Top it back up to half.\n\n[[Close up shop->D8 Done]]", "D8 Done": "(if: $days does not contain \"8\")[(set: $days to it + (a: \"8\"))]# Day 8 complete!\n\n<div class=\"tool\">🎒 **New tool earned: Travel Case**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Pack your bag the right way: shut it down, clear the keys, use a padded sleeve, and keep books off the lid. Then write a **\"Before I Travel\" checklist** of six steps in your **Tech Notebook**, including hot cars, cold cars, and rain. Ask a grown-up to read it and add one thing.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Packing and Carrying\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Laptop screens are thin glass. Pressure cracks them, even with no drop.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Book on top</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Padded sleeve</text><line x1=\"60\" y1=\"26\" x2=\"60\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"60,40 56.2,33.0 63.8,33.0\" fill=\"#ff6b6b\"/><line x1=\"100\" y1=\"26\" x2=\"100\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"100,40 96.2,33.0 103.8,33.0\" fill=\"#ff6b6b\"/><line x1=\"140\" y1=\"26\" x2=\"140\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"140,40 136.2,33.0 143.8,33.0\" fill=\"#ff6b6b\"/><rect x=\"35\" y=\"42\" width=\"130\" height=\"26\" rx=\"3\" fill=\"#6b5a8e\"/><rect x=\"35\" y=\"42\" width=\"10\" height=\"26\" fill=\"#55477a\"/><text x=\"105\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Textbook</text><rect x=\"40\" y=\"70\" width=\"120\" height=\"8\" rx=\"2\" fill=\"#5f8fb3\"/><rect x=\"40\" y=\"78\" width=\"120\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polyline points=\"70,70 80,77 90,71 100,78 110,70 120,77\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\"/><text x=\"100\" y=\"115\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">presses the screen</text><text x=\"100\" y=\"133\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">into the keys</text><rect x=\"230\" y=\"40\" width=\"140\" height=\"56\" rx=\"16\" fill=\"#3d4a5c\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><rect x=\"248\" y=\"58\" width=\"104\" height=\"8\" rx=\"2\" fill=\"#5f8fb3\"/><rect x=\"248\" y=\"66\" width=\"104\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><text x=\"300\" y=\"115\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">padding spreads</text><text x=\"300\" y=\"133\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">out the bumps</text></svg><div class=\"cap\">Laptop screens are thin glass. Pressure cracks them, even with no drop.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🛡️</span><b>✅ Padded sleeve</b>or laptop pocket</div><div class=\"card ok\"><span class=\"big\">✏️</span><b>✅ Clear the keys</b>pencils, earbuds, clips</div><div class=\"card no\"><span class=\"big\">📚</span><b>❌ Books on the lid</b>pressure cracks glass</div><div class=\"card no\"><span class=\"big\">💥</span><b>❌ Tossing the bag</b>a drop is still a drop</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Hinges and screens aren't built to hold the laptop's weight.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">By the screen</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">By the base</text><rect x=\"30\" y=\"120\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a9
