=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"normal\">(underneath)</text><path d=\"M292 88 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M292 98 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M292 108 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"292\" y1=\"122\" x2=\"352\" y2=\"122\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"352,122 345.0,125.8 345.0,118.2\" fill=\"#ff6b6b\"/><text x=\"356\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"bold\">Hot air OUT</text><text x=\"356\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"normal\">(by the hinge)</text></svg><div class=\"cap\">Air in, air out. Put your hand by a vent: warm air means <b>exhaust</b>.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 420 120\" role=\"img\" aria-label=\"Slowing down and shutting off are <b>safety features</b>. Your job: find out why it got hot.\"><defs><linearGradient id=\"u2hot\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#7fd1ff\"/><stop offset=\"0.5\" stop-color=\"#ffb347\"/><stop offset=\"1\" stop-color=\"#ff6b6b\"/></linearGradient></defs><rect x=\"20\" y=\"16\" width=\"380\" height=\"18\" rx=\"9\" fill=\"url(#u2hot)\"/><circle cx=\"60\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"360\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><text x=\"60\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">Cool</text><text x=\"60\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">quiet</text><text x=\"160\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Warm</text><text x=\"160\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">loud fans</text><text x=\"260\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff9a5a\" text-anchor=\"middle\" font-weight=\"bold\">Hot</text><text x=\"260\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">slows down</text><text x=\"260\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff9a5a\" text-anchor=\"middle\" font-weight=\"normal\">(throttling)</text><text x=\"360\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Too hot</text><text x=\"360\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">shuts off</text><text x=\"360\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">(shutdown)</text></svg><div class=\"cap\">Slowing down and shutting off are <b>safety features</b>. Your job: find out why it got hot.</div></div>\n\n**No fan?** Thin laptops like the MacBook Air have none. Their metal body is the heat sink, so it needs open air all around. Warm air out of a grille is **exhaust**: never block it.\n\n**Signs it's too hot:**\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🌀</span><b>Roaring fans</b>even on easy jobs</div><div class=\"card \"><span class=\"big\">🔥</span><b>Hot underside</b>or hot keyboard</div><div class=\"card \"><span class=\"big\">🐢</span><b>Stutters</b>games and videos lag</div><div class=\"card \"><span class=\"big\">⚫</span><b>Sudden shutoff</b>no warning</div></div>\n\n[[Got it. Send in the next customer->D3 J2]]", "D3 J2": "<div class=\"scene\">🎮 🔥 🐢</div>\n\n**Ava's** gaming laptop gets choppy 20 minutes into a match. The fans scream and the bottom gets hot. After the game, it's fine.\n\n**What's happening?**\n\n* [[A virus that only runs during games->D3 J2 W1]]\n* [[The chips are slowing down to cool off->D3 J2 R]]\n* [[The fans spin so fast they slow the game->D3 J2 W3]]\n* [[Her Wi-Fi is lagging, not the laptop->D3 J2 W4]]", "D3 J2 W1": "(set: $m3 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **throttling**. The chips slow down so they don't overheat.\"\n\n[[Got it->D3 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Loud, hot, and slow. Look at the heat scale again.\"\n\n[[Try again->D3 J2]]]", "D3 J2 W3": "(set: $m3 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **throttling**. The chips slow down so they don't overheat.\"\n\n[[Got it->D3 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Loud, hot, and slow. Look at the heat scale again.\"\n\n[[Try again->D3 J2]]]", "D3 J2 W4": "(set: $m3 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **throttling**. The chips slow down so they don't overheat.\"\n\n[[Got it->D3 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Loud, hot, and slow. Look at the heat scale again.\"\n\n[[Try again->D3 J2]]]", "D3 J2 R": "(set: $miss to 0)## ✅ Job done\n**Throttling.** The heat can't get out fast enough, so the chips slow down. Next: find out why.\n\n[[The Inspector has something to show you->D3 L3]]", "D3 L3": "## 📘 The Inspector's lesson: Where It Sits Matters\n\n<div class=\"pic\"><svg viewBox=\"0 0 420 170\" role=\"img\" aria-label=\"Soft things swallow the vents. Hard, flat things leave room to breathe.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">On a pillow</text><text x=\"315\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">On a desk</text><ellipse cx=\"100\" cy=\"130\" rx=\"92\" ry=\"28\" fill=\"#6b5a8e\"/><rect x=\"35\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"136,110 145,110 171,38 162,38\" fill=\"#8a96a3\"/><polygon points=\"140,106 163,44 165,44 142,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><ellipse cx=\"30\" cy=\"117\" rx=\"24\" ry=\"14\" fill=\"#6b5a8e\"/><ellipse cx=\"150\" cy=\"119\" rx=\"20\" ry=\"12\" fill=\"#6b5a8e\"/><line x1=\"12\" y1=\"107\" x2=\"32\" y2=\"127\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"12\" y1=\"127\" x2=\"32\" y2=\"107\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">vents smothered</text><line x1=\"225\" y1=\"138\" x2=\"418\" y2=\"138\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"250\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"351,110 360,110 386,38 377,38\" fill=\"#8a96a3\"/><polygon points=\"355,106 378,44 380,44 357,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"260\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"338\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><line x1=\"226\" y1=\"132\" x2=\"320\" y2=\"132\" stroke=\"#7fd1ff\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"320,132 313.0,135.8 313.0,128.2\" fill=\"#7fd1ff\"/><text x=\"315\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">air gap under it</text></svg><div class=\"cap\">Soft things swallow the vents. Hard, flat things leave room to breathe.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🪑</span><b>✅ Desk or table</b>hard and flat</div><div class=\"card ok\"><span class=\"big\">🛋️</span><b>✅ Lap desk</b>for the couch or bed</div><div class=\"card ok\"><span class=\"big\">📐</span><b>✅ Laptop stand</b>air flows under it</div><div class=\"card ok\"><span class=\"big\">📏</span><b>✅ A few inches</b>of space around vents</div><div class=\"card no\"><span class=\"big\">🛏️</span><b>❌ Bed or blanket</b>smothers the vents</div><div class=\"card no\"><span class=\"big\">🚪</span><b>❌ Closed cabinet</b>breathes its own hot air</div><div class=\"card no\"><span class=\"big\">☀️</span><b>❌ Sun or heater</b>hot before it even starts</div><div class=\"card no\"><span class=\"big\">🐈</span><b>❌ Pets on vents</b>fur blocks the air</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 420 80\" role=\"img\" aria-label=\"From Apple's guide for its laptops. A hot room means hot air going in.\"><rect x=\"20\" y=\"30\" width=\"380\" height=\"16\" rx=\"8\" fill=\"#2a2f36\"/><rect x=\"100\" y=\"30\" width=\"220\" height=\"16\" rx=\"8\" fill=\"#6fe3b5\"/><text x=\"210\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Comfortable room = happy laptop</text><text x=\"100\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">50°F / 10°C</text><text x=\"320\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">95°F / 35°C</text><text x=\"40\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"normal\">cold</text><text x=\"385\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">hot</text></svg><div class=\"cap\">From Apple's guide for its laptops. A hot room means hot air going in.</div></div>\n\n[[Got it. Send in the next customer->D3 J4]]", "D3 J4": "<div class=\"scene\">🛏️ 💻 ⚫</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at what the bottom of the laptop is sitting in.\"><path d=\"M10 120 Q30 72 80 82 Q130 66 180 80 Q230 64 280 80 Q330 70 350 120 Z\" fill=\"#6b5a8e\"/><path d=\"M40 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M100 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M160 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M220 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M280 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><rect x=\"110\" y=\"74\" width=\"130\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"231,74 240,74 266,2 257,2\" fill=\"#8a96a3\"/><polygon points=\"235,70 258,8 260,8 237,70\" fill=\"#7fd1ff\" opacity=\"0.5\"/><path d=\"M84 100 Q100 76 130 81 Q170 77 200 81 Q232 76 262 96 Q250 108 84 104 Z\" fill=\"#6b5a8e\"/><path d=\"M120 104 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M205 104 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"175\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Jayden's laptop</text><text x=\"180\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#c7b6e8\" text-anchor=\"middle\" font-weight=\"normal\">his thick comforter</text></svg><div class=\"cap\">Look at what the bottom of the laptop is sitting in.</div></div>\n\n**Jayden** does homework in bed with his laptop on a thick comforter. Twice it went black with no warning. The bottom was hot.\n\n**Why did it black out?**\n\n* [[Smothered vents forced a heat shutdown->D3 J4 R]]\n* [[The battery is old and drops to zero->D3 J4 W2]]\n* [[A sleep setting kicks in after a while->D3 J4 W3]]\n* [[A software bug that the next update fixes->D3 J4 W4]]", "D3 J4 W2": "(set: $m3 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The comforter **smothered the vents**, so it did an **emergency shutdown**.\"\n\n[[Got it->D3 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Soft bedding plus a hot bottom. What happens at the far end of the heat scale?\"\n\n[[Try again->D3 J4]]]", "D3 J4 W3": "(set: $m3 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The comforter **smothered the vents**, so it did an **emergency shutdown**.\"\n\n[[Got it->D3 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Soft bedding plus a hot bottom. What happens at the far end of the heat scale?\"\n\n[[Try again->D3 J4]]]", "D3 J4 W4": "(set: $m3 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The comforter **smothered the vents**, so it did an **emergency shutdown**.\"\n\n[[Got it->D3 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Soft bedding plus a hot bottom. What happens at the far end of the heat scale?\"\n\n[[Try again->D3 J4]]]", "D3 J4 R": "(set: $miss to 0)## ✅ Job done\n**Smothered vents, then shutdown.** Soft things swallow vents. A lap desk or a stand fixes it, even in bed.\n\n[[Next customer->D3 J5]]", "D3 J5": "<div class=\"scene\"><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg> 🚪 🔥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Grandpa Leo's cabinet, shut and with the door cut away.\"><rect x=\"20\" y=\"16\" width=\"130\" height=\"104\" rx=\"4\" fill=\"#8b5e3c\" stroke=\"#5e3d26\" stroke-width=\"3\"/><line x1=\"85\" y1=\"20\" x2=\"85\" y2=\"116\" stroke=\"#5e3d26\" stroke-width=\"2.5\"/><circle cx=\"77\" cy=\"68\" r=\"4\" fill=\"#e8c27a\"/><circle cx=\"93\" cy=\"68\" r=\"4\" fill=\"#e8c27a\"/><text x=\"85\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">door shut</text><rect x=\"200\" y=\"16\" width=\"130\" height=\"104\" rx=\"4\" fill=\"#5e3d26\" stroke=\"#8b5e3c\" stroke-width=\"5\"/><rect x=\"235\" y=\"22\" width=\"60\" height=\"94\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"265.0\" cy=\"38\" r=\"5\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><line x1=\"245\" y1=\"86\" x2=\"285\" y2=\"86\" stroke=\"#5b6573\" stroke-width=\"2.5\"/><line x1=\"245\" y1=\"93\" x2=\"285\" y2=\"93\" stroke=\"#5b6573\" stroke-width=\"2.5\"/><line x1=\"245\" y1=\"100\" x2=\"285\" y2=\"100\" stroke=\"#5b6573\" stroke-width=\"2.5\"/><text x=\"265\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">inside the cabinet</text></svg><div class=\"cap\">Grandpa Leo's cabinet, shut and with the door cut away.</div></div>\n\n**Grandpa Leo's** tower has lived in that wooden cabinet for three years, door shut. Now the fans roar all afternoon. Biscuit naps in front of it.\n\n**Best advice?**\n\n* [[Add a small desk fan inside the closed cabinet, door shut->D3 J5 W1]]\n* [[Turn the tower so the vents face the back->D3 J5 W2]]\n* [[Open the door and give it a few inches->D3 J5 R]]\n* [[Shut it down for an hour each afternoon->D3 J5 W4]]", "D3 J5 W1": "(set: $m3 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Biscuit approves. The fan just stirs the same hot air around a shut box.</div>\n\n## Let me show you\n*The Inspector leans over.* \"It breathes out hot air, then **breathes it back in**. Open the door or move the tower.\"\n\n[[Got it->D3 J5 R]]](else:)[<div class=\"oops\">Biscuit approves. The fan just stirs the same hot air around a shut box.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Door shut. Where does the hot air go?\"\n\n[[Try again->D3 J5]]]", "D3 J5 W2": "(set: $m3 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"It breathes out hot air, then **breathes it back in**. Open the door or move the tower.\"\n\n[[Got it->D3 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Door shut. Where does the hot air go?\"\n\n[[Try again->D3 J5]]]", "D3 J5 W4": "(set: $m3 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"It breathes out hot air, then **breathes it back in**. Open the door or move the tower.\"\n\n[[Got it->D3 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Door shut. Where does the hot air go?\"\n\n[[Try again->D3 J5]]]", "D3 J5 R": "(set: $miss to 0)## ✅ Job done\n**A closed cabinet traps the exhaust.** Give the tower open air and a few inches of space. That cabinet has seen things.\n\n[[Next customer->D3 J6]]", "D3 J6": "<div class=\"scene\">☀️ 🪟 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at where the light lands.\"><circle cx=\"34\" cy=\"26\" r=\"16\" fill=\"#ffd166\"/><rect x=\"64\" y=\"12\" width=\"70\" height=\"86\" fill=\"#1e3a52\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"99\" y1=\"12\" x2=\"99\" y2=\"98\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"64\" y1=\"55\" x2=\"134\" y2=\"55\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><polygon points=\"70,18 130,18 330,108 230,108\" fill=\"#ffd166\" opacity=\"0.28\"/><rect x=\"170\" y=\"110\" width=\"180\" height=\"8\" fill=\"#8b5e3c\"/><rect x=\"215\" y=\"99\" width=\"95\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"301,99 310,99 336,27 327,27\" fill=\"#8a96a3\"/><polygon points=\"305,95 328,33 330,33 307,95\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"225\" y=\"109\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"288\" y=\"109\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><path d=\"M232 76 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M232 83 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"99\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">window</text><text x=\"260\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Ms. Rivera's laptop</text></svg><div class=\"cap\">Look at where the light lands.</div></div>\n\n**Ms. Rivera's** laptop sits in a sunbeam by the window. It's hot before she even opens a program.\n\n**What should she change?**\n\n* [[Turn the screen brightness all the way down->D3 J6 W1]]\n* [[Put it on a stand right where it is now->D3 J6 W2]]\n* [[Keep it out of direct sun on that desk->D3 J6 R]]\n* [[Lay a cool, damp cloth on the closed lid->D3 J6 W4]]", "D3 J6 W1": "(set: $m3 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Direct sun** heats the case. Move it into the shade or close the blinds.\"\n\n[[Got it->D3 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's heating it before it even starts working?\"\n\n[[Try again->D3 J6]]]", "D3 J6 W2": "(set: $m3 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Direct sun** heats the case. Move it into the shade or close the blinds.\"\n\n[[Got it->D3 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's heating it before it even starts working?\"\n\n[[Try again->D3 J6]]]", "D3 J6 W4": "(set: $m3 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. A wet cloth on a hot, plugged-in laptop is not cooling, it's a short circuit waiting.</div>\n\n## Let me show you\n*The Inspector leans over.* \"**Direct sun** heats the case. Move it into the shade or close the blinds.\"\n\n[[Got it->D3 J6 R]]](else:)[<div class=\"oops\">That's Kiosk advice. A wet cloth on a hot, plugged-in laptop is not cooling, it's a short circuit waiting.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"What's heating it before it even starts working?\"\n\n[[Try again->D3 J6]]]", "D3 J6 R": "(set: $miss to 0)## ✅ Job done\n**Keep it out of the sun.** A stand helps the bottom breathe, but the sun is heating the top. And never put a wet cloth on a hot computer.\n\n[[Next customer->D3 J7]]", "D3 J7": "<div class=\"scene\">🐈 <svg viewBox=\" -6 16 0 t14 2\" stroke=\"#e0a56e\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"65\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Tasha's tower</text><text x=\"255\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the top grille, up close</text></svg><div class=\"cap\">Look at where the cat sleeps, and what is stuck to the grille.</div></div>\n\n**Tasha's** cat naps on top of the tower, right over the warm grille. It's loud now, and fur is stuck to the grille.\n\n**What should Tasha do?**\n\n* [[Keep the cat off and clear the fur->D3 J7 R]]\n* [[Let the cat stay, since fur filters dust->D3 J7 W2]]\n* [[Put a towel on the vent so it's comfy->D3 J7 W3]]\n* [[Turn the fans down so they're quieter->D3 J7 W4]]", "D3 J7 W2": "(set: $m3 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The cat is **blocking the exhaust**. Give her a warm bed somewhere else. Clear the fur with the PC off and unplugged.\"\n\n[[Got it->D3 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does a cat-shaped blanket do to an exhaust vent?\"\n\n[[Try again->D3 J7]]]", "D3 J7 W3": "(set: $m3 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's a cat bed, not a vent cover. The towel traps even more heat.</div>\n\n## Let me show you\n*The Inspector leans over.* \"The cat is **blocking the exhaust**. Give her a warm bed somewhere else. Clear the fur with the PC off and unplugged.\"\n\n[[Got it->D3 J7 R]]](else:)[<div class=\"oops\">That's a cat bed, not a vent cover. The towel traps even more heat.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"What does a cat-shaped blanket do to an exhaust vent?\"\n\n[[Try again->D3 J7]]]", "D3 J7 W4": "(set: $m3 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The cat is **blocking the exhaust**. Give her a warm bed somewhere else. Clear the fur with the PC off and unplugged.\"\n\n[[Got it->D3 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does a cat-shaped blanket do to an exhaust vent?\"\n\n[[Try again->D3 J7]]]", "D3 J7 R": "(set: $miss to 0)## ✅ Job done\n**A cat on a vent is a furry blockage.** A cozy cat bed nearby usually wins.\n\n[[Next customer->D3 S1]]", "D3 S1": "## 🎲 Helps or Blocks? (1 of 8)\n\nThe Inspector tests your airflow instincts.\n\n*The Inspector holds up:*\n\n### A laptop stand with air under it\n\n* [[🌬️ Helps airflow->D3 S1 R]]\n* [[🚫 Blocks airflow->D3 S1 W]]", "D3 S1 R": "## ✅ Right: it keeps air moving and heat leaving\n**A laptop stand with air under it.** A gap lets cool air in and hot air out.\n\n[[Next one->D3 S2]]", "D3 S1 W": "## ❌ Not this time: it keeps air moving and heat leaving\n**A laptop stand with air under it.** A gap lets cool air in and hot air out.\n\n[[Next one->D3 S2]]", "D3 S2": "## 🎲 Helps or Blocks? (2 of 8)\n\n*The Inspector holds up:*\n\n### Folders stacked against the exhaust grille\n\n* [[🌬️ Helps airflow->D3 S2 W]]\n* [[🚫 Blocks airflow->D3 S2 R]]", "D3 S2 R": "## ✅ Right: it traps heat\n**Folders stacked against the exhaust grille.** Warm air out means exhaust. Blocking it traps heat.\n\n[[Next one->D3 S3]]", "D3 S2 W": "## ❌ Not this time: it traps heat\n**Folders stacked against the exhaust grille.** Warm air out means exhaust. Blocking it traps heat.\n\n[[Next one->D3 S3]]", "D3 S3": "## 🎲 Helps or Blocks? (3 of 8)\n\n*The Inspector holds up:*\n\n### A few inches of space behind the tower\n\n* [[🌬️ Helps airflow->D3 S3 R]]\n* [[🚫 Blocks airflow->D3 S3 W]]", "D3 S3 R": "## ✅ Right: it keeps air moving and heat leaving\n**A few inches of space behind the tower.** Fans and vents need room to breathe.\n\n[[Next one->D3 S4]]", "D3 S3 W": "## ❌ Not this time: it keeps air moving and heat leaving\n**A few inches of space behind the tower.** Fans and vents need room to breathe.\n\n[[Next one->D3 S4]]", "D3 S4": "## 🎲 Helps or Blocks? (4 of 8)\n\n*The Inspector holds up:*\n\n### A pillow under the laptop\n\n* [[🌬️ Helps airflow->D3 S4 W]]\n* [[🚫 Blocks airflow->D3 S4 R]]", "D3 S4 R": "## ✅ Right: it traps heat\n**A pillow under the laptop.** Soft things swallow the vents.\n\n[[Next one->D3 S5]]", "D3 S4 W": "## ❌ Not this time: it traps heat\n**A pillow under the laptop.** Soft things swallow the vents.\n\n[[Next one->D3 S5]]", "D3 S5": "## 🎲 Helps or Blocks? (5 of 8)\n\n*The Inspector holds up:*\n\n### A dust filter cleaned this month\n\n* [[🌬️ Helps airflow->D3 S5 R]]\n* [[🚫 Blocks airflow->D3 S5 W]]", "D3 S5 R": "## ✅ Right: it keeps air moving and heat leaving\n**A dust filter cleaned this month.** No dust blanket, so air flows freely.\n\n[[Next one->D3 S6]]", "D3 S5 W": "## ❌ Not this time: it keeps air moving and heat leaving\n**A dust filter cleaned this month.** No dust blanket, so air flows freely.\n\n[[Next one->D3 S6]]", "D3 S6": "## 🎲 Helps or Blocks? (6 of 8)\n\n*The Inspector holds up:*\n\n### A tower in a closed cabinet\n\n* [[🌬️ Helps airflow->D3 S6 W]]\n* [[🚫 Blocks airflow->D3 S6 R]]", "D3 S6 R": "## ✅ Right: it traps heat\n**A tower in a closed cabinet.** It breathes its own hot air.\n\n[[Next one->D3 S7]]", "D3 S6 W": "## ❌ Not this time: it traps heat\n**A tower in a closed cabinet.** It breathes its own hot air.\n\n[[Next one->D3 S7]]", "D3 S7": "## 🎲 Helps or Blocks? (7 of 8)\n\n*The Inspector holds up:*\n\n### A lap desk on the couch\n\n* [[🌬️ Helps airflow->D3 S7 R]]\n* [[🚫 Blocks airflow->D3 S7 W]]", "D3 S7 R": "## ✅ Right: it keeps air moving and heat leaving\n**A lap desk on the couch.** Hard and flat keeps the vents clear.\n\n[[Next one->D3 S8]]", "D3 S7 W": "## ❌ Not this time: it keeps air moving and heat leaving\n**A lap desk on the couch.** Hard and flat keeps the vents clear.\n\n[[Next one->D3 S8]]", "D3 S8": "## 🎲 Helps or Blocks? (8 of 8)\n\n*The Inspector holds up:*\n\n### Cat fur packed on the grille\n\n* [[🌬️ Helps airflow->D3 S8 W]]\n* [[🚫 Blocks airflow->D3 S8 R]]", "D3 S8 R": "## ✅ Right: it traps heat\n**Cat fur packed on the grille.** Fur is a blanket for the fan.\n\n[[The Inspector has something to show you->D3 L9]]", "D3 S8 W": "## ❌ Not this time: it traps heat\n**Cat fur packed on the grille.** Fur is a blanket for the fan.\n\n[[The Inspector has something to show you->D3 L9]]", "D3 L9": "## 📘 The Inspector's lesson: Clearing the Airflow Path\n\n<div class=\"scene\">🌫️ 🌀</div>\n\n\"Dust is a blanket. Here's how to take it off.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Off + unplug\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"41\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"10\" y1=\"36\" x2=\"0\" y2=\"36\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"60\" y=\"14\" width=\"34\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"70\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"81\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/></svg><b>1. Off + unplug</b>not just asleep</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Short bursts\"><rect x=\"30\" y=\"20\" width=\"24\" height=\"48\" rx=\"5\" fill=\"#7fd1ff\"/><rect x=\"37\" y=\"11\" width=\"10\" height=\"9\" fill=\"#9aa4ae\"/><line x1=\"47\" y1=\"14\" x2=\"68\" y2=\"6\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"75\" cy=\"6\" r=\"4\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"84\" cy=\"9\" r=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"93\" cy=\"12\" r=\"2\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/></svg><b>2. Short bursts</b>if your maker allows</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Hold fan still\"><circle cx=\"48\" cy=\"38\" r=\"27\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><ellipse cx=\"48\" cy=\"24.5\" rx=\"5.94\" ry=\"12.15\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(0 48 38)\"/><ellipse cx=\"48\" cy=\"24.5\" rx=\"5.94\" ry=\"12.15\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(90 48 38)\"/><ellipse cx=\"48\" cy=\"24.5\" rx=\"5.94\" ry=\"12.15\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(180 48 38)\"/><ellipse cx=\"48\" cy=\"24.5\" rx=\"5.94\" ry=\"12.15\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(270 48 38)\"/><circle cx=\"48\" cy=\"38\" r=\"5.4\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"80\" y1=\"4\" x2=\"56\" y2=\"28\" stroke=\"#e8c27a\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>3. Hold fan still</b>desktop, grown-up job</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Clean filter\"><rect x=\"18\" y=\"8\" width=\"64\" height=\"56\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><line x1=\"27\" y1=\"10\" x2=\"27\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"37\" y1=\"10\" x2=\"37\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"47\" y1=\"10\" x2=\"47\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"57\" y1=\"10\" x2=\"57\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"67\" y1=\"10\" x2=\"67\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"77\" y1=\"10\" x2=\"77\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"20\" y1=\"19\" x2=\"80\" y2=\"19\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"20\" y1=\"29\" x2=\"80\" y2=\"29\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"20\" y1=\"39\" x2=\"80\" y2=\"39\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"20\" y1=\"49\" x2=\"80\" y2=\"49\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><line x1=\"20\" y1=\"59\" x2=\"80\" y2=\"59\" stroke=\"#9aa4ae\" stroke-width=\"1\"/><path d=\"M22 16 q9 -8 18 0 t18 0 t18 0\" stroke=\"#bbb\" stroke-width=\"6\" fill=\"none\" opacity=\"0.7\"/></svg><b>4. Clean filter</b>away from the PC</div></div>\n<div class=\"cap\"><b>Check your maker on compressed air.</b> Apple uses it on MacBook keyboards but says no for iPhones. Many PC makers allow short bursts. <b>Why hold the fan?</b> Air can spin it way too fast and wreck its <b>bearing</b> (the part it spins on), and then it whines. <b>How?</b> Only on an opened desktop, and a grown-up does it: steady one blade with a cotton swab. The fan in a laptop is sealed inside, so skip the can and brush the vent with a soft dry brush.</div>\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🧹</span><b>❌ No vacuums</b>moving air and plastic build static that zaps parts</div><div class=\"card no\"><span class=\"big\">💧</span><b>❌ No wet cloths</b>inside the case</div><div class=\"card no\"><span class=\"big\">🧴</span><b>❌ Thermal paste</b>gray goo between chip and heat sink: pro job</div><div class=\"card no\"><span class=\"big\">💻</span><b>❌ Opening a laptop</b>pro job: glued parts, warranty, battery that can puncture</div></div>\n\n<div class=\"warn\">**Grown-up needed** to open a desktop. Unplug it, then hold the power button for 5 seconds to drain leftover power. Touch bare metal on the case so you and the case match charge and nothing zaps the boards.</div>\n\n[[Got it. Send in the next customer->D3 J10]]", "D3 J10": "<div class=\"scene\"><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" text x=\"356\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"bold\">Hot air OUT</text><text x=\"356\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"normal\">(by the hinge)</text></svg><div class=\"cap\">Air in, air out. Put your hand by a vent: warm air means <b>exhaust</b>.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 420 120\" role=\"img\" aria-label=\"Slowing down and shutting off are <b>safety features</b>. Your job: find out why it got hot.\"><defs><linearGradient id=\"u2hot\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#7fd1ff\"/><stop offset=\"0.5\" stop-color=\"#ffb347\"/><stop offset=\"1\" stop-color=\"#ff6b6b\"/></linearGradient></defs><rect x=\"20\" y=\"16\" width=\"380\" height=\"18\" rx=\"9\" fill=\"url(#u2hot)\"/><circle cx=\"60\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"360\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><text x=\"60\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">Cool</text><text x=\"60\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">quiet</text><text x=\"160\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Warm</text><text x=\"160\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">loud fans</text><text x=\"260\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff9a5a\" text-anchor=\"middle\" font-weight=\"bold\">Hot</text><text x=\"260\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">slows down</text><text x=\"260\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff9a5a\" text-anchor=\"middle\" font-weight=\"normal\">(throttling)</text><text x=\"360\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Too hot</text><text x=\"360\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">shuts off</text><text x=\"360\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">(shutdown)</text></svg><div class=\"cap\">Slowing down and shutting off are <b>safety features</b>. Your job: find out why it got hot.</div></div>\n\n**No fan?** Thin laptops like the MacBook Air have none. Their metal body is the heat sink, so it needs open air all around. Warm air out of a grille is **exhaust**: never block it.\n\n**Signs it's too hot:**\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🌀</span><b>Roaring fans</b>even on easy jobs</div><div class=\"card \"><span class=\"big\">🔥</span><b>Hot underside</b>or hot keyboard</div><div class=\"card \"><span class=\"big\">🐢</span><b>Stutters</b>games and videos lag</div><div class=\"card \"><span class=\"big\">⚫</span><b>Sudden shutoff</b>no warning</div></div>\n\n### Where It Sits Matters\n<div class=\"pic\"><svg viewBox=\"0 0 420 170\" role=\"img\" aria-label=\"Soft things swallow the vents. Hard, flat things leave room to breathe.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">On a pillow</text><text x=\"315\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">On a desk</text><ellipse cx=\"100\" cy=\"130\" rx=\"92\" ry=\"28\" fill=\"#6b5a8e\"/><rect x=\"35\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"136,110 145,110 171,38 162,38\" fill=\"#8a96a3\"/><polygon points=\"140,106 163,44 165,44 142,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><ellipse cx=\"30\" cy=\"117\" rx=\"24\" ry=\"14\" fill=\"#6b5a8e\"/><ellipse cx=\"150\" cy=\"119\" rx=\"20\" ry=\"12\" fill=\"#6b5a8e\"/><line x1=\"12\" y1=\"107\" x2=\"32\" y2=\"127\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"12\" y1=\"127\" x2=\"32\" y2=\"107\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">vents smothered</text><line x1=\"225\" y1=\"138\" x2=\"418\" y2=\"138\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"250\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"351,110 360,110 386,38 377,38\" fill=\"#8a96a3\"/><polygon points=\"355,106 378,44 380,44 357,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"260\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"338\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><line x1=\"226\" y1=\"132\" x2=\"320\" y2=\"132\" stroke=\"#7fd1ff\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"320,132 313.0,135.8 313.0,128.2\" fill=\"#7fd1ff\"/><text x=\"315\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">air gap under it</text></svg><div class=\"cap\">Soft things swallow the vents. Hard, flat things leave room to breathe.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🪑</span><b>✅ Desk or table</b>hard and flat</div><div class=\"card ok\"><span class=\"big\">🛋️</span><b>✅ Lap desk</b>for the couch or bed</div><div class=\"card ok\"><span class=\"big\">📐</span><b>✅ Laptop stand</b>air flows under it</div><div class=\"card ok\"><span class=\"big\">📏</span><b>✅ A few inches</b>of space around vents</div><div class=\"card no\"><span class=\"big\">🛏️</span><b>❌ Bed or blanket</b>smothers the vents</div><div class=\"card no\"><span class=\"big\">🚪</span><b>❌ Closed cabinet</b>breathes its own hot air</div><div class=\"card no\"><span class=\"big\">☀️</span><b>❌ Sun or heater</b>hot before it even starts</div><div class=\"card no\"><span class=\"big\">🐈</span><b>❌ Pets on vents</b>fur blocks the air</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 420 80\" role=\"img\" aria-label=\"From Apple's guide for its laptops. A hot room means hot air going in.\"><rect x=\"20\" y=\"30\" width=\"380\" height=\"16\" rx=\"8\" fill=\"#2a2f36\"/><rect x=\"100\" y=\"30\" width=\"220\" height=\"16\" rx=\"8\" fill=\"#6fe3b5\"/><text x=\"210\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Comfortable room = happy laptop</text><text x=\"100\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">50°F / 10°C</text><text x=\"320\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">95°F / 35°C</text><text x=\"40\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"normal\">cold</text><text x=\"385\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">hot</text></svg><div class=\"cap\">From Apple's guide for its laptops. A hot room means hot air going in.</div></div>\n\n---\n\n🌙 *That's today's workday. Day 4 opens next time.*\n\n[[Back to the work schedule->Shop]]", "D4 Start": "(set: $miss to 0)(set: $m4 to (a:))# Day 4: Cords, Cables & Power\n\n<div class=\"scene\">🔌 🧶 🔥</div>\n\n*A hand-lettered sign over the bench reads: **Days since last preventable disaster: 3.** The Inspector drops a tangle of cables beneath it.* \"Today is power. If a cord or charger looks damaged, smells like burning, or gets too hot to hold, **stop using it.** Tape is not a fix.\"\n\n\n[[Open the shop->D4 L1]]", "D4 L1": "## 📘 The Inspector's lesson: Cable Care\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Pull the <b>plug</b>, not the cord. Sharp bends at the neck crack the wires inside.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Gentle curve</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Sharp bend</text><rect x=\"18\" y=\"56\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"18\" y=\"70\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"30\" y=\"50\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#9aa4ae\"/><polygon points=\"70,54 100,60 100,70 70,76\" fill=\"#5d6670\" stroke=\"#ffb347\" stroke-width=\"2\"/><path d=\"M100 65 q55 0 70 60\" stroke=\"#e9ecef\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M161 50 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"218\" y=\"56\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"218\" y=\"70\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"230\" y=\"50\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#9aa4ae\"/><polygon points=\"270,54 300,60 300,70 270,76\" fill=\"#5d6670\" stroke=\"#ffb347\" stroke-width=\"2\"/><path d=\"M300 65 l12 0 l0 65\" stroke=\"#e9ecef\" stroke-width=\"6\" fill=\"none\" stroke-linejoin=\"miter\"/><pa ke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"38\" x2=\"75\" y2=\"40\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"47\" x2=\"75\" y2=\"49\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"56\" x2=\"75\" y2=\"58\" stroke=\"#e9ecef\" stroke-width=\"3\"/><path d=\"M75 20 l8 0 l0 -14\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\"/><line x1=\"7\" y1=\"7\" x2=\"21\" y2=\"21\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"7\" y1=\"21\" x2=\"21\" y2=\"7\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>❌ Tight wrap</b>sharp bend at the brick</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Over-under\"><ellipse cx=\"46\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"50\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/><ellipse cx=\"54\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"58\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/></svg><b>✅ Over-under</b>twist, flip, repeat: no kinks</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Loose loops\"><ellipse cx=\"48\" cy=\"35\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"51\" cy=\"37\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"54\" cy=\"39\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><rect x=\"42\" y=\"6\" width=\"14\" height=\"60\" rx=\"4\" fill=\"#ffb347\"/></svg><b>✅ Loose loops</b>hand-sized, reusable tie</div></div>\n\n**Stop signs: replace it. Tape is not a repair.**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🧶</span><b>❌ Frayed jacket</b>split or fuzzy</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Bare wires</b>showing through</div><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ Scorch marks</b>brown or black</div><div class=\"card no\"><span class=\"big\">🫧</span><b>❌ Melted plastic</b>bubbled or warped</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Lint packs into ports. Power it off, brush first, then pick gently.\"><line x1=\"40\" y1=\"40\" x2=\"170\" y2=\"40\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"40\" y1=\"90\" x2=\"170\" y2=\"90\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"170\" y1=\"38\" x2=\"170\" y2=\"92\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><circle cx=\"158\" cy=\"52\" r=\"8\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"160\" cy=\"66\" r=\"9\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"157\" cy=\"80\" r=\"8\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"148\" cy=\"60\" r=\"6\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"148\" cy=\"75\" r=\"6\" fill=\"#c9c9c9\" opacity=\"0.9\"/><rect x=\"8\" y=\"52\" width=\"122\" height=\"26\" rx=\"5\" fill=\"#7fd1ff\"/><text x=\"158\" y=\"28\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"bold\">lint</text><text x=\"95\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Plug can't go</text><text x=\"95\" y=\"138\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">all the way in</text><line x1=\"230\" y1=\"30\" x2=\"330\" y2=\"58\" stroke=\"#e8c27a\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M361 44 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"74\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Soft brush first,</text><text x=\"300\" y=\"89\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">then wood or plastic</text><path d=\"M232 112 h80 a10 10 0 0 0 0 -16 h-70 a8 8 0 0 0 0 12 h60\" stroke=\"#9aa4ae\" stroke-width=\"3\" fill=\"none\"/><line x1=\"361\" y1=\"97\" x2=\"379\" y2=\"115\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"361\" y1=\"115\" x2=\"379\" y2=\"97\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"300\" y=\"150\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Never metal</text></svg><div class=\"cap\">Lint packs into ports. Power it off, brush first, then pick gently.</div></div>\n\nOn a Mac, iPhone or iPad, Apple says the same: a **soft dry brush** for port lint, and nothing sharp.\n\nPets chew cords. Use **cord protectors** and unplug spare chargers.\n\n<div class=\"warn\">**Grown-up needed:** If a cord, charger or outlet is scorched, melted, or has bare wires, a grown-up unplugs it by the plug and takes it out of use.</div>\n\n[[Got it. Send in the next customer->D4 J2]]", "D4 J2": "<div class=\"scene\">🎒 🔌 ⚡</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look at the cord right where it leaves the brick.\"><rect x=\"16\" y=\"34\" width=\"66\" height=\"52\" rx=\"8\" fill=\"#4a535d\"/><line x1=\"10\" y1=\"42\" x2=\"88\" y2=\"44\" stroke=\"#2b3138\" stroke-width=\"5\"/><line x1=\"10\" y1=\"51\" x2=\"88\" y2=\"53\" stroke=\"#2b3138\" stroke-width=\"5\"/><line x1=\"10\" y1=\"60\" x2=\"88\" y2=\"62\" stroke=\"#2b3138\" stroke-width=\"5\"/><line x1=\"10\" y1=\"69\" x2=\"88\" y2=\"71\" stroke=\"#2b3138\" stroke-width=\"5\"/><line x1=\"10\" y1=\"78\" x2=\"88\" y2=\"80\" stroke=\"#2b3138\" stroke-width=\"5\"/><path d=\"M88 44 l10 0 l0 -20\" stroke=\"#2b3138\" stroke-width=\"5\" fill=\"none\"/><circle cx=\"98\" cy=\"40\" r=\"13\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><line x1=\"111\" y1=\"40\" x2=\"146\" y2=\"52\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><rect x=\"150\" y=\"26\" width=\"60\" height=\"56\" rx=\"7\" fill=\"#4a535d\"/><polygon points=\"210,36 238,44 238,64 210,72\" fill=\"#5d6670\"/><rect x=\"238\" y=\"44\" width=\"16\" height=\"20\" fill=\"#2b3138\"/><rect x=\"306\" y=\"44\" width=\"50\" height=\"20\" fill=\"#2b3138\"/><polygon points=\"254,44 262,36 270,46 278,37 286,46 294,36 306,44 306,64 296,72 288,62 278,72 270,62 262,72 254,64\" fill=\"none\" stroke=\"#2b3138\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M254 49 C 272 40, 288 58, 306 49\" stroke=\"#ffb347\" stroke-width=\"3\" fill=\"none\"/><path d=\"M254 54 C 272 62, 288 46, 306 54\" stroke=\"#d9a35b\" stroke-width=\"3\" fill=\"none\"/><path d=\"M254 59 C 270 52, 290 66, 306 59\" stroke=\"#ff6b6b\" stroke-width=\"3\" fill=\"none\"/><text x=\"54\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Nora's</text><text x=\"54\" y=\"129\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">charger brick</text><text x=\"252\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">where the cord leaves</text><text x=\"252\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the brick, up close</text></svg><div class=\"cap\">Look at the cord right where it leaves the brick.</div></div>\n\n**Nora** winds her laptop cord tight around the brick every night. Now it's split where it leaves the brick. Thin wires show.\n\n**What should Nora do?**\n\n* [[Wrap the split in electrical tape->D4 J2 W1]]\n* [[Keep it, but coil it looser from now on->D4 J2 W2]]\n* [[Replace the cord with a new one->D4 J2 R]]\n* [[Use it only while the laptop is off->D4 J2 W4]]", "D4 J2 W1": "(set: $m4 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Tape slips, and the wires underneath are still bare.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Bare wires mean **stop and replace**. The tight wrap bent the cord at the **strain relief** every night. Coil the new one loosely.\"\n\n[[Got it->D4 J2 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Tape slips, and the wires underneath are still bare.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards: what do bare wires mean? Then check the tight-wrap card.\"\n\n[[Try again->D4 J2]]]", "D4 J2 W2": "(set: $m4 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Bare wires mean **stop and replace**. The tight wrap bent the cord at the **strain relief** every night. Coil the new one loosely.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards: what do bare wires mean? Then check the tight-wrap card.\"\n\n[[Try again->D4 J2]]]", "D4 J2 W4": "(set: $m4 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Bare wires mean **stop and replace**. The tight wrap bent the cord at the **strain relief** every night. Coil the new one loosely.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards: what do bare wires mean? Then check the tight-wrap card.\"\n\n[[Try again->D4 J2]]]", "D4 J2 R": "(set: $miss to 0)## ✅ Job done\n**Replace a damaged cord, never tape it, and coil the next one loosely.**\n\n[[Next customer->D4 J3]]", "D4 J3": "<div class=\"scene\">🧥 📱 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Look at what's inside the port, past the end of the plug.\"><rect x=\"196\" y=\"24\" width=\"150\" height=\"84\" rx=\"10\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"200\" y=\"42\" width=\"110\" height=\"34\" rx=\"17\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><circle cx=\"272\" cy=\"54\" r=\"7\" fill=\"#d8d8d8\"/><circle cx=\"284\" cy=\"50\" r=\"6\" fill=\"#d8d8d8\"/><circle cx=\"294\" cy=\"60\" r=\"8\" fill=\"#d8d8d8\"/><circle cx=\"280\" cy=\"66\" r=\"8\" fill=\"#d8d8d8\"/><circle cx=\"266\" cy=\"66\" r=\"6\" fill=\"#d8d8d8\"/><circle cx=\"290\" cy=\"70\" r=\"5\" fill=\"#d8d8d8\"/><circle cx=\"300\" cy=\"52\" r=\"5\" fill=\"#d8d8d8\"/><line x1=\"262\" y1=\"50\" x2=\"256\" y2=\"46\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"72\" x2=\"306\" y2=\"76\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><line x1=\"286\" y1=\"46\" x2=\"290\" y2=\"40\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><line x1=\"264\" y1=\"70\" x2=\"258\" y2=\"74\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><path d=\"M8 59 H120\" stroke=\"#5b6573\" stroke-width=\"10\" stroke-linecap=\"round\"/><rect x=\"116\" y=\"44\" width=\"54\" height=\"30\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"170\" y=\"49\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#c9d1d9\"/><rect x=\"182\" y=\"56\" width=\"50\" height=\"6\" rx=\"3\" fill=\"#8a96a3\"/><line x1=\"240\" y1=\"22\" x2=\"240\" y2=\"84\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><text x=\"70\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his charging plug</text><text x=\"272\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his tablet's port, up close</text><text x=\"240\" y=\"16\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">plug stops here</text></svg><div class=\"cap\">Look at what's inside the port, past the end of the plug.</div></div>\n\n**Mr. Patel's** tablet only charges at just the right angle. The plug never clicks all the way in. It rides in his coat pocket.\n\n**What should you try first?**\n\n* [[Soft dry brush first, then a wooden pick->D4 J3 R]]\n* [[Scrape the port with a straight paperclip->D4 J3 W2]]\n* [[Push the plug in harder until it clicks->D4 J3 W3]]\n* [[Squirt a little rubbing alcohol in the port->D4 J3 W4]]", "D4 J3 W2": "(set: $m4 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Metal scratches the contacts. Then it never charges at any angle.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Pocket **lint** is blocking the plug. Power off, then a **soft dry brush** first. If it is packed, a **wooden or plastic pick**, very gently. Never metal.\"\n\n[[Got it->D4 J3 R]]](else:)[<div class=\"oops\">Metal scratches the contacts. Then it never charges at any angle.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the port picture: what is packed in there, and what is it safe to dig with?\"\n\n[[Try again->D4 J3]]]", "D4 J3 W3": "(set: $m4 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pocket **lint** is blocking the plug. Power off, then a **soft dry brush** first. If it is packed, a **wooden or plastic pick**, very gently. Never metal.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the port picture: what is packed in there, and what is it safe to dig with?\"\n\n[[Try again->D4 J3]]]", "D4 J3 W4": "(set: $m4 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pocket **lint** is blocking the plug. Power off, then a **soft dry brush** first. If it is packed, a **wooden or plastic pick**, very gently. Never metal.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the port picture: what is packed in there, and what is it safe to dig with?\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**Brush first, then a wooden or plastic pick.** Metal can scratch the contacts.\n\n[[Next customer->D4 J4]]", "D4 J4": "<div class=\"scene\">🔌 🟫 😟</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Look at the prong and at the outlet cover.\"><path d=\"M10 70 H60\" stroke=\"#5b6573\" stroke-width=\"8\" stroke-linecap=\"round\"/><rect x=\"60\" y=\"44\" width=\"62\" height=\"52\" rx=\"6\" fill=\"#e9ecef\"/><rect x=\"122\" y=\"50\" width=\"56\" height=\"12\" fill=\"#c9d1d9\"/><rect x=\"122\" y=\"78\" width=\"56\" height=\"12\" fill=\"#c9d1d9\"/><ellipse cx=\"160\" cy=\"56\" rx=\"20\" ry=\"8\" fill=\"#6b3e1e\"/><ellipse cx=\"166\" cy=\"56\" rx=\"10\" ry=\"5\" fill=\"#2a1a10\"/><rect x=\"230\" y=\"18\" width=\"80\" height=\"94\" rx=\"8\" fill=\"#f1efe6\"/><ellipse cx=\"262\" cy=\"52\" rx=\"16\" ry=\"18\" fill=\"#a0703a\" opacity=\"0.55\"/><rect x=\"258\" y=\"40\" width=\"5\" height=\"18\" fill=\"#1b1f24\"/><rect x=\"278\" y=\"40\" width=\"5\" height=\"20\" fill=\"#1b1f24\"/><path d=\"M265 76 a5 5 0 0 1 10 0 v4 h-10 z\" fill=\"#1b1f24\"/><text x=\"110\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her charger's prongs</text><text x=\"270\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the outlet</text></svg><div class=\"cap\">Look at the prong and at the outlet cover.</div></div>\n\n**Ms. Rivera's** charger has a brown scorch mark on one prong. The outlet cover is discolored and warm, and the plug feels loose in it. \"It still charges fine!\"\n\n**What's the right move?**\n\n* [[Keep using it, since it still charges->D4 J4 W1]]\n* [[Rub the mark off with rubbing alcohol->D4 J4 W2]]\n* [[Try another outlet and keep watch on it->D4 J4 W3]]\n* [[Stop using it and get a grown-up->D4 J4 R]]", "D4 J4 W1": "(set: $m4 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Scorched means it got **hot enough to burn**. A bad plug fit, or a surge when the power came back (even a lightning-induced one), can start that. **Stop using it.** A grown-up should get an electrician to check the outlet.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards: scorch marks are on the list. What made the mark?\"\n\n[[Try again->D4 J4]]]", "D4 J4 W2": "(set: $m4 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. A clean prong doesn't cool the outlet behind it.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Scorched means it got **hot enough to burn**. A bad plug fit, or a surge when the power came back (even a lightning-induced one), can start that. **Stop using it.** A grown-up should get an electrician to check the outlet.\"\n\n[[Got it->D4 J4 R]]](else:)[<div class=\"oops\">That's Kiosk advice. A clean prong doesn't cool the outlet behind it.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards: scorch marks are on the list. What made the mark?\"\n\n[[Try again->D4 J4]]]", "D4 J4 W3": "(set: $m4 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Scorched means it got **hot enough to burn**. A bad plug fit, or a surge when the power came back (even a lightning-induced one), can start that. **Stop using it.** A grown-up should get an electrician to check the outlet.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards: scorch marks are on the list. What made the mark?\"\n\n[[Try again->D4 J4]]]", "D4 J4 R": "(set: $miss to 0)## ✅ Job done\n**\"Still works\" does not mean \"still safe.\"** Ms. Rivera is calling an electrician. We'll see what he finds.\n\n[[The Inspector has something to show you->D4 L5]]", "D4 L5": "## 📘 The Inspector's lesson: Strips, Surges, and Storms\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"They look like twins. Only one soaks up <b>voltage spikes</b>.\"><polyline points=\"8,60 30,60 38,26 46,60 68,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"60\" x2=\"92\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"92,60 85.0,63.8 85.0,56.2\" fill=\"#ff6b6b\"/><rect x=\"96\" y=\"38\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"171\" y=\"65\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Power strip</text><line x1=\"250\" y1=\"60\" x2=\"268\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"268,60 261.0,63.8 261.0,56.2\" fill=\"#ff6b6b\"/><polyline points=\"272,60 294,60 302,26 310,60 332,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"366\" y1=\"37\" x2=\"384\" y2=\"55\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"366\" y1=\"55\" x2=\"384\" y2=\"37\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"302\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">gets through</text><polyline points=\"8,150 30,150 38,116 46,150 68,150\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"150\" x2=\"92\" y2=\"150\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"92,150 85.0,153.8 85.0,146.2\" fill=\"#ff6b6b\"/><rect x=\"96\" y=\"128\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"166\" y=\"155\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Surge protector</text><circle cx=\"236\" cy=\"137\" r=\"4\" fill=\"#6fe3b5\"/><line x1=\"250\" y1=\"150\" x2=\"268\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"268,150 261.0,153.8 261.0,146.2\" fill=\"#6fe3b5\"/><line x1=\"272\" y1=\"150\" x2=\"332\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\"/><path d=\"M366 146 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"302\" y=\"190\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">soaked up</text></svg><div class=\"cap\">They look like twins. Only one soaks up <b>voltage spikes</b>.</div></div>\n\nA **surge** is a sudden spike in **voltage**, the push behind electricity. Nearby lightning or power flickering back on can cause one.\n\n**Read the label:** a **joule** rating is how much spike it can soak up before it wears out.\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🏷️</span><b>✅ Surge wording</b>like \"surge protector\", UL 1449</div><div class=\"card ok\"><span class=\"big\">🧪</span><b>✅ UL or ETL listed</b>a safety lab tested it</div><div class=\"card ok\"><span class=\"big\">🔢</span><b>✅ Joule rating</b>spike-soaking power; higher is better</div><div class=\"card ok\"><span class=\"big\">🟢</span><b>✅ Protected light</b>off? replace it</div><div class=\"card no\"><span class=\"big\">🤷</span><b>❌ \"Meets UL standards\"</b>vague, not a listing</div><div class=\"card no\"><span class=\"big\">🚫</span><b>❌ No joule rating</b>just a power strip</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Strips plugged into strips overload the first one. It can overheat and start a fire.\"><text x=\"100\" y=\"18\" font-family=\"Segoe U
