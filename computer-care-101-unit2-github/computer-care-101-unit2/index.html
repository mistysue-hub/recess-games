Strips plugged into strips overload the first one. It can overheat and start a fire.</div></div>\n\nLightning is too big for any surge protector. Weather experts say it this way:\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">📡</span><b>✅ Storm watch posted</b>no thunder yet: act now</div><div class=\"card \"><span class=\"big\">💾</span><b>1. Save, 2. Shut down</b>all the way off</div><div class=\"card ok\"><span class=\"big\">🔌</span><b>✅ 3. Unplug early</b>from the wall, while it is calm</div><div class=\"card no\"><span class=\"big\">⛈️</span><b>❌ Thunder heard?</b>stay away from cords and the computer</div></div>\n\nUnplug early, **with dry hands**. Once you hear thunder, the storm is close enough to strike, so leave the cords alone.\n\n[[Got it. Send in the next customer->D4 J6]]", "D4 J6": "<div class=\"scene\">👴 🔌 🔥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Follow the cords from the wall to each thing Grandpa Leo plugged in.\"><rect x=\"8\" y=\"30\" width=\"34\" height=\"60\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"17\" y=\"48\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"29\" y=\"48\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M21 71 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><path d=\"M30 52 q24 0 26 38\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"92\" width=\"80\" height=\"16\" rx=\"4\" fill=\"#ffc8a0\"/><rect x=\"50\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"65\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"80\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"95\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M54 72 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M116 98 q20 0 24 -40\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"124\" y=\"42\" width=\"80\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"134\" y=\"46\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"149\" y=\"46\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"164\" y=\"46\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"179\" y=\"46\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M200 48 q20 0 24 40\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"208\" y=\"92\" width=\"80\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"218\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"233\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"248\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"263\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M64 92 V80\" stroke=\"#c0c7ce\" stroke-width=\"3\"/><path d=\"M154 42 V30\" stroke=\"#c0c7ce\" stroke-width=\"3\"/><path d=\"M236 92 V80\" stroke=\"#c0c7ce\" stroke-width=\"3\"/><path d=\"M266 92 V80\" stroke=\"#c0c7ce\" stroke-width=\"3\"/><rect x=\"52\" y=\"48\" width=\"22\" height=\"34\" rx=\"3\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><circle cx=\"63\" cy=\"68\" r=\"4\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><rect x=\"138\" y=\"10\" width=\"30\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"144\" y=\"2\" width=\"18\" height=\"10\" fill=\"#e9ecef\"/><polygon points=\"226,64 246,64 241,50 231,50\" fill=\"#ffb347\"/><rect x=\"234\" y=\"64\" width=\"4\" height=\"14\" fill=\"#9aa4ae\"/><rect x=\"227\" y=\"78\" width=\"18\" height=\"4\" fill=\"#9aa4ae\"/><ellipse cx=\"264\" cy=\"74\" rx=\"18\" ry=\"9\" fill=\"#a0703a\"/><ellipse cx=\"264\" cy=\"71\" rx=\"12\" ry=\"5\" fill=\"#d8b48a\"/><text x=\"25\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">wall</text><text x=\"80\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">first strip</text><text x=\"164\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">strip 2</text><text x=\"248\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">strip 3</text><text x=\"326\" y=\"64\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Biscuit's</text><text x=\"326\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">heated bed</text></svg><div class=\"cap\">Follow the cords from the wall to each thing Grandpa Leo plugged in.</div></div>\n\n**Grandpa Leo** plugged a strip into a strip into a strip for his computer, printer, lamp, and Biscuit's heated dog bed. The first strip feels warm.\n\n**What should he do?**\n\n* [[Add a fourth strip to spread the load->D4 J6 W1]]\n* [[Plug each strip into the wall instead->D4 J6 R]]\n* [[Tape the switches on so none get bumped->D4 J6 W3]]\n* [[Swap the order so the warm one is last->D4 J6 W4]]", "D4 J6 W1": "(set: $m4 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **daisy-chaining**. Everything, heated bed included, squeezes through the first strip and its one cord. Plug each one **straight into the wall**.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the daisy chain picture: where does all the power flow through?\"\n\n[[Try again->D4 J6]]]", "D4 J6 W3": "(set: $m4 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Now nothing can be switched off, and the first strip keeps getting warmer.</div>\n\n## Let me show you\n*The Inspector leans over.* \"That's **daisy-chaining**. Everything, heated bed included, squeezes through the first strip and its one cord. Plug each one **straight into the wall**.\"\n\n[[Got it->D4 J6 R]]](else:)[<div class=\"oops\">Now nothing can be switched off, and the first strip keeps getting warmer.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the daisy chain picture: where does all the power flow through?\"\n\n[[Try again->D4 J6]]]", "D4 J6 W4": "(set: $m4 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **daisy-chaining**. Everything, heated bed included, squeezes through the first strip and its one cord. Plug each one **straight into the wall**.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the daisy chain picture: where does all the power flow through?\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**Never daisy-chain strips.** The first one can overheat and start a fire. The Inspector sighs: \"Grandpa Leo's.\"\n\n[[Next customer->D4 S1]]", "D4 S1": "## 🎲 Surge protector or just a strip? (1 of 7)\n\nDev says his new gaming PC is on a \"protected\" strip. Read each label feature.\n\n*The Inspector holds up a label feature:*\n\n### Says \"surge protector\" and lists UL 1449\n\n* [[🛡️ Surge protector->D4 S1 R]]\n* [[🔌 Just a power strip->D4 S1 W]]", "D4 S1 R": "## ✅ Right: it soaks up voltage spikes\n**Says \"surge protector\" and lists UL 1449.** UL 1449 is the surge-protector safety standard.\n\n[[Next one->D4 S2]]", "D4 S1 W": "## ❌ Not this time: it soaks up voltage spikes\n**Says \"surge protector\" and lists UL 1449.** UL 1449 is the surge-protector safety standard.\n\n[[Next one->D4 S2]]", "D4 S2": "## 🎲 Surge protector or just a strip? (2 of 7)\n\n*The Inspector holds up a label feature:*\n\n### Rated 1,200 joules, UL or ETL listed\n\n* [[🛡️ Surge protector->D4 S2 R]]\n* [[🔌 Just a power strip->D4 S2 W]]", "D4 S2 R": "## ✅ Right: it soaks up voltage spikes\n**Rated 1,200 joules, UL or ETL listed.** Joules show how big a spike it can soak up.\n\n[[Next one->D4 S3]]", "D4 S2 W": "## ❌ Not this time: it soaks up voltage spikes\n**Rated 1,200 joules, UL or ETL listed.** Joules show how big a spike it can soak up.\n\n[[Next one->D4 S3]]", "D4 S3": "## 🎲 Surge protector or just a strip? (3 of 7)\n\n*The Inspector holds up a label feature:*\n\n### A \"protected\" light that glows green\n\n* [[🛡️ Surge protector->D4 S3 R]]\n* [[🔌 Just a power strip->D4 S3 W]]", "D4 S3 R": "## ✅ Right: it soaks up voltage spikes\n**A \"protected\" light that glows green.** It means the surge parts still work. Off means replace it.\n\n[[Next one->D4 S4]]", "D4 S3 W": "## ❌ Not this time: it soaks up voltage spikes\n**A \"protected\" light that glows green.** It means the surge parts still work. Off means replace it.\n\n[[Next one->D4 S4]]", "D4 S4": "## 🎲 Surge protector or just a strip? (4 of 7)\n\n*The Inspector holds up a label feature:*\n\n### Six outlets and an on/off switch, nothing else\n\n* [[🛡️ Surge protector->D4 S4 W]]\n* [[🔌 Just a power strip->D4 S4 R]]", "D4 S4 R": "## ✅ Right: it only adds outlets\n**Six outlets and an on/off switch, nothing else.** A switch and outlets do not stop spikes. That is Dev's.\n\n[[Next one->D4 S5]]", "D4 S4 W": "## ❌ Not this time: it only adds outlets\n**Six outlets and an on/off switch, nothing else.** A switch and outlets do not stop spikes. That is Dev's.\n\n[[Next one->D4 S5]]", "D4 S5": "## 🎲 Surge protector or just a strip? (5 of 7)\n\n*The Inspector holds up a label feature:*\n\n### Box says \"meets UL standards\", no joules\n\n* [[🛡️ Surge protector->D4 S5 W]]\n* [[🔌 Just a power strip->D4 S5 R]]", "D4 S5 R": "## ✅ Right: it only adds outlets\n**Box says \"meets UL standards\", no joules.** Vague words are not a real listing. No joules, no protection.\n\n[[Next one->D4 S6]]", "D4 S5 W": "## ❌ Not this time: it only adds outlets\n**Box says \"meets UL standards\", no joules.** Vague words are not a real listing. No joules, no protection.\n\n[[Next one->D4 S6]]", "D4 S6": "## 🎲 Surge protector or just a strip? (6 of 7)\n\n*The Inspector holds up a label feature:*\n\n### 15A, 125V, 1875W MAX and nothing about surges\n\n* [[🛡️ Surge protector->D4 S6 W]]\n* [[🔌 Just a power strip->D4 S6 R]]", "D4 S6 R": "## ✅ Right: it only adds outlets\n**15A, 125V, 1875W MAX and nothing about surges.** That is how much it can carry, not a surge shield.\n\n[[Next one->D4 S7]]", "D4 S6 W": "## ❌ Not this time: it only adds outlets\n**15A, 125V, 1875W MAX and nothing about surges.** That is how much it can carry, not a surge shield.\n\n[[Next one->D4 S7]]", "D4 S7": "## 🎲 Surge protector or just a strip? (7 of 7)\n\n*The Inspector holds up a label feature:*\n\n### Protected light is off\n\n* [[🛡️ Surge protector->D4 S7 W]]\n* [[🔌 Just a power strip->D4 S7 R]]", "D4 S7 R": "## ✅ Right: it only adds outlets\n**Protected light is off.** The surge parts are used up. Now it is a plain strip. Replace it.\n\n[[Next customer->D4 J8]]", "D4 S7 W": "## ❌ Not this time: it only adds outlets\n**Protected light is off.** The surge parts are used up. Now it is a plain strip. Replace it.\n\n[[Next customer->D4 J8]]", "D4 J8": "<div class=\"scene\">⛈️ 🖥️ 📱</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"The sky is quiet for now. His PC is still plugged in.\"><rect x=\"12\" y=\"10\" width=\"64\" height=\"112\" rx=\"10\" fill=\"#2b3138\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"18\" y=\"38\" width=\"52\" height=\"38\" rx=\"5\" fill=\"#ffb347\"/><text x=\"44\" y=\"54\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">Storm</text><text x=\"44\" y=\"69\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">watch</text><rect x=\"112\" y=\"40\" width=\"70\" height=\"48\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"118\" y=\"46\" width=\"58\" height=\"36\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"140\" y=\"88\" width=\"14\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"196\" y=\"40\" width=\"30\" height=\"58\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><path d=\"M211 98 V112 H120\" stroke=\"#c0c7ce\" stroke-width=\"3\" fill=\"none\"/><rect x=\"88\" y=\"106\" width=\"60\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"98\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"108\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"118\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"128\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M88 114 H82 V126\" stroke=\"#c0c7ce\" stroke-width=\"3\" fill=\"none\"/><path d=\"M268 44 q-4 -18 14 -20 q6 -16 26 -10 q16 -8 26 8 q16 2 12 22 z\" fill=\"#5b6573\"/><text x=\"160\" y=\"26\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Jayden's PC</text><text x=\"306\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">later tonight</text></svg><div class=\"cap\">The sky is quiet for now. His PC is still plugged in.</div></div>\n\n**Jayden** is finishing a slideshow. His phone says a **storm watch** is posted for tonight. The sky is quiet and there's no thunder yet. The PC is on a surge protector.\n\n**What's the smartest move?**\n\n* [[Keep working, since surge protectors stop lightning->D4 J8 W1]]\n* [[Wait for the first thunder, then unplug->D4 J8 W2]]\n* [[Turn off the monitor, leave the tower on->D4 J8 W3]]\n* [[Save, shut down, and unplug now->D4 J8 R]]", "D4 J8 W1": "(set: $m4 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lightning is too big for a surge protector. While a watch is posted and it is still quiet, **save, shut down, and unplug**. Weather experts say once you hear thunder, **stay away from cords and the computer**.\"\n\n[[Got it->D4 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the storm cards: what do you do while it is still calm, and what changes once thunder starts?\"\n\n[[Try again->D4 J8]]]", "D4 J8 W2": "(set: $m4 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Too late. Once thunder is audible, stay away from cords and the computer.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Lightning is too big for a surge protector. While a watch is posted and it is still quiet, **save, shut down, and unplug**. Weather experts say once you hear thunder, **stay away from cords and the computer**.\"\n\n[[Got it->D4 J8 R]]](else:)[<div class=\"oops\">Too late. Once thunder is audible, stay away from cords and the computer.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the storm cards: what do you do while it is still calm, and what changes once thunder starts?\"\n\n[[Try again->D4 J8]]]", "D4 J8 W3": "(set: $m4 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lightning is too big for a surge protector. While a watch is posted and it is still quiet, **save, shut down, and unplug**. Weather experts say once you hear thunder, **stay away from cords and the computer**.\"\n\n[[Got it->D4 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the storm cards: what do you do while it is still calm, and what changes once thunder starts?\"\n\n[[Try again->D4 J8]]]", "D4 J8 R": "(set: $miss to 0)## ✅ Job done\n**Unplug before the storm arrives.** Once thunder is audible, leave cords alone.\n\n[[The Inspector has something to show you->D4 L9]]", "D4 L9": "## 📘 The Inspector's lesson: Chargers\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"Watts (W) = how much power a charger can give. USB-C chargers <b>agree on a safe amount</b> first.\"><rect x=\"12\" y=\"24\" width=\"64\" height=\"44\" rx=\"6\" fill=\"#9aa4ae\"/><text x=\"44\" y=\"52\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">High W</text><line x1=\"84\" y1=\"46\" x2=\"238\" y2=\"46\" stroke=\"#6fe3b5\" stroke-width=\"5\" stroke-linecap=\"round\"/><polygon points=\"238,46 231.0,49.8 231.0,42.2\" fill=\"#6fe3b5\"/><text x=\"160\" y=\"32\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">normal speed</text><rect x=\"254\" y=\"22\" width=\"70\" height=\"43\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"259\" y=\"27\" width=\"60\" height=\"33\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"246,73 332,73 324,65 254,65\" fill=\"#8a96a3\"/><rect x=\"346\" y=\"34\" width=\"38\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"384\" y=\"40\" width=\"4\" height=\"8\" fill=\"#e9ecef\"/><rect x=\"349\" y=\"37\" width=\"29\" height=\"14\" rx=\"1\" fill=\"#6fe3b5\"/><rect x=\"26\" y=\"122\" width=\"36\" height=\"30\" rx=\"5\" fill=\"#9aa4ae\"/><text x=\"44\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Low W</text><line x1=\"70\" y1=\"137\" x2=\"238\" y2=\"137\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"238,137 231.0,140.8 231.0,133.2\" fill=\"#ffb347\"/><text x=\"160\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">slow, not dangerous</text><rect x=\"254\" y=\"112\" width=\"70\" height=\"43\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"259\" y=\"117\" width=\"60\" height=\"33\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"246,163 332,163 324,155 254,155\" fill=\"#8a96a3\"/><rect x=\"346\" y=\"126\" width=\"38\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"384\" y=\"132\" width=\"4\" height=\"8\" fill=\"#e9ecef\"/><rect x=\"349\" y=\"129\" width=\"8\" height=\"14\" rx=\"1\" fill=\"#ffb347\"/></svg><div class=\"cap\">Watts (W) = how much power a charger can give. USB-C chargers <b>agree on a safe amount</b> first.</div></div>\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"USB-C PD\"><rect x=\"10\" y=\"22\" width=\"44\" height=\"26\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"54\" y=\"27\" width=\"34\" height=\"16\" rx=\"8\" fill=\"#c0c7ce\"/><rect x=\"60\" y=\"33\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#1b1f24\"/></svg><b>USB-C PD</b>talks first, agrees on power</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Barrel plug\"><rect x=\"10\" y=\"22\" width=\"44\" height=\"26\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"54\" y=\"28\" width=\"32\" height=\"14\" fill=\"#c0c7ce\"/><circle cx=\"86\" cy=\"35\" r=\"7\" fill=\"#c0c7ce\"/><circle cx=\"86\" cy=\"35\" r=\"3\" fill=\"#1b1f24\"/></svg><b>Barrel plug</b>needs its own matching charger</div></div>\n\n**Warm is normal. Hot, noisy, or smelly is not.**\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">♨️</span><b>✅ Warm</b>normal</div><div class=\"card ok\"><span class=\"big\">🏬</span><b>✅ Maker or known brand</b>UL or ETL listed</div><div class=\"card ok\"><span class=\"big\">🪑</span><b>✅ Out on a desk</b>air can reach it</div><div class=\"card no\"><span class=\"big\">🥵</span><b>❌ Too hot to hold</b>stop using it</div><div class=\"card no\"><span class=\"big\">🐝</span><b>❌ Buzzing</b>or crackling</div><div class=\"card no\"><span class=\"big\">👃</span><b>❌ Burning smell</b>or scorch marks</div><div class=\"card no\"><span class=\"big\">💸</span><b>❌ No-name knockoff</b>may skip safety parts</div><div class=\"card no\"><span class=\"big\">🛏️</span><b>❌ Bed, couch, pillow</b>traps the heat</div></div>\n\nA MacBook, iPhone or Chromebook is happiest on its maker's charger, or a listed one. A **bigger** charger is safe too: the device and charger agree on power first.\n\n<div class=\"warn\">**Grown-up needed:** If a charger is too hot to hold, buzzing, smells like burning, or is scorched, a grown-up unplugs it. Stop using it.</div>\n\n[[Got it. Send in the next customer->D4 J10]]", "D4 J10": "<div class=\"scene\">📱 🔌 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Compare the two numbers: 100W and 45W.\"><rect x=\"8\" y=\"24\" width=\"34\" height=\"70\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"17\" y=\"47\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"29\" y=\"47\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M21 70 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><rect x=\"14\" y=\"40\" width=\"40\" height=\"40\" rx=\"7\" fill=\"#e9ecef\"/><rect x=\"25\" y=\"66\" width=\"18\" height=\"7\" rx=\"3.5\" fill=\"#1b1f24\"/><text x=\"34\" y=\"66\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">100W</text><path d=\"M34 80 q0 30 60 30 H200\" stroke=\"#e9ecef\" stroke-width=\"4\" fill=\"none\"/><rect x=\"206\" y=\"40\" width=\"80\" height=\"50\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"211\" y=\"45\" width=\"70\" height=\"40\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"198,98 294,98 286,90 206,90\" fill=\"#8a96a3\"/><text x=\"322\" y=\"56\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her laptop</text><text x=\"322\" y=\"72\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">came with</text><text x=\"322\" y=\"88\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">a 45W one</text><text x=\"130\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Her brother's big charger</text></svg><div class=\"cap\">Compare the two numbers: 100W and 45W.</div></div>\n\n**Tasha** lost her 45W laptop charger. Her brother lends her his big 100W USB-C one. \"Won't that much power fry my battery?\"\n\n**What do you tell her?**\n\n* [[Yes, extra watts will burn out the battery->D4 J10 W1]]\n* [[It's safe: they agree on power first->D4 J10 R]]\n* [[Only if she charges it overnight->D4 J10 W3]]\n* [[Only if the laptop is turned off->D4 J10 W4]]", "D4 J10 W1": "(set: $m4 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A bigger charger is safe: the **laptop only takes what it needs**, because the device and charger **agree on power first** (USB-C). A smaller one just charges slowly.\"\n\n[[Got it->D4 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the watts picture: who decides how much power flows, the charger or the laptop?\"\n\n[[Try again->D4 J10]]]", "D4 J10 W3": "(set: $m4 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A bigger charger is safe: the **laptop only takes what it needs**, because the device and charger **agree on power first** (USB-C). A smaller one just charges slowly.\"\n\n[[Got it->D4 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the watts picture: who decides how much power flows, the charger or the laptop?\"\n\n[[Try again->D4 J10]]]", "D4 J10 W4": "(set: $m4 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A bigger charger is safe: the **laptop only takes what it needs**, because the device and charger **agree on power first** (USB-C). A smaller one just charges slowly.\"\n\n[[Got it->D4 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the watts picture: who decides how much power flows, the charger or the laptop?\"\n\n[[Try again->D4 J10]]]", "D4 J10 R": "(set: $miss to 0)## ✅ Job done\n**Watts are what a charger can give, not what it forces.**\n\n[[Next customer->D4 J11]]", "D4 J11": "<div class=\"scene\">⛽ 🔌 🥵</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Listen, sniff, and touch (carefully). What do you notice?\"><rect x=\"140\" y=\"20\" width=\"34\" height=\"76\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"149\" y=\"46\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"161\" y=\"46\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M153 69 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><rect x=\"146\" y=\"36\" width=\"44\" height=\"50\" rx=\"7\" fill=\"#f4f4f4\"/><rect x=\"159\" y=\"72\" width=\"18\" height=\"7\" rx=\"3.5\" fill=\"#1b1f24\"/><line x1=\"146\" y1=\"60\" x2=\"190\" y2=\"60\" stroke=\"#b8b8b8\" stroke-width=\"1.5\"/><path d=\"M110 30 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M110 39 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M110 48 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 30 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 39 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 48 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"76\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">bzzz</text><text x=\"276\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">bzzz</text><path d=\"M160 18 q-5 -6 0 -12 q5 -6 0 -12\" stroke=\"#b07a4a\" stroke-width=\"2\" fill=\"none\" transform=\"translate(0 4)\"/><path d=\"M176 18 q-5 -6 0 -12 q5 -6 0 -12\" stroke=\"#b07a4a\" stroke-width=\"2\" fill=\"none\" transform=\"translate(0 4)\"/><rect x=\"252\" y=\"30\" width=\"56\" height=\"28\" rx=\"4\" fill=\"#f4f1e8\"/><text x=\"280\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">$3</text><text x=\"168\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Kenji's charger: no brand, no listing mark</text></svg><div class=\"cap\">Listen, sniff, and touch (carefully). What do you notice?</div></div>\n\n**Kenji's** $3 no-name gas-station charger is buzzing. It smells like hot plastic and is too hot to touch.\n\n**What should he do?**\n\n* [[Keep using it, since all chargers get warm->D4 J11 W1]]\n* [[Set it on an ice pack to cool it down->D4 J11 W2]]\n* [[Stop using it and buy a listed one->D4 J11 R]]\n* [[Use it only when someone is in the room->D4 J11 W4]]", "D4 J11 W1": "(set: $m4 to it + (a: \"Kenji\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Buzzing, a hot-plastic smell, too hot to hold: all **stop signs**. A grown-up **unplugs it** if it is too hot to touch, and he buys a charger with a **UL or ETL listing**.\"\n\n[[Got it->D4 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the red charger cards: how many of them does Kenji's match?\"\n\n[[Try again->D4 J11]]]", "D4 J11 W2": "(set: $m4 to it + (a: \"Kenji\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Ice packs drip. A buzzing charger needs to be unplugged, not chilled.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Buzzing, a hot-plastic smell, too hot to hold: all **stop signs**. A grown-up **unplugs it** if it is too hot to touch, and he buys a charger with a **UL or ETL listing**.\"\n\n[[Got it->D4 J11 R]]](else:)[<div class=\"oops\">Ice packs drip. A buzzing charger needs to be unplugged, not chilled.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the red charger cards: how many of them does Kenji's match?\"\n\n[[Try again->D4 J11]]]", "D4 J11 W4": "(set: $m4 to it + (a: \"Kenji\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Buzzing, a hot-plastic smell, too hot to hold: all **stop signs**. A grown-up **unplugs it** if it is too hot to touch, and he buys a charger with a **UL or ETL listing**.\"\n\n[[Got it->D4 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the red charger cards: how many of them does Kenji's match?\"\n\n[[Try again->D4 J11]]]", "D4 J11 R": "(set: $miss to 0)## ✅ Job done\n**Knockoffs can skip safety parts.** Warm is fine. Hot and buzzing is not.\n\n[[Next customer->D4 J12]]", "D4 J12": "<div class=\"scene\">💻 ☕ 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Her charger after a long video call.\"><rect x=\"4\" y=\"96\" width=\"352\" height=\"10\" rx=\"3\" fill=\"#8a6a4a\"/><rect x=\"30\" y=\"38\" width=\"90\" height=\"56\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"35\" y=\"43\" width=\"80\" height=\"46\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"22,102 128,102 120,94 30,94\" fill=\"#8a96a3\"/><path d=\"M130 92 q30 0 60 -2\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\"/><rect x=\"190\" y=\"76\" width=\"64\" height=\"20\" rx=\"5\" fill=\"#4a535d\"/><rect x=\"214\" y=\"83\" width=\"16\" height=\"5\" rx=\"2\" fill=\"#8a96a3\"/><path d=\"M206 58 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M254 86 q40 0 60 -30 V20\" stroke=\"#5b6573\" stroke-width=\"3\" fill=\"none\"/><rect x=\"300\" y=\"4\" width=\"34\" height=\"40\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"309\" y=\"12\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"321\" y=\"12\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M313 35 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><text x=\"222\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her original charger, on the desk</text></svg><div class=\"cap\">Her charger after a long video call.</div></div>\n\n**Ms. Abara's** original charger feels warm after video calls, like a mug of tea that's cooled a bit. It's on her desk, silent, with no smell.\n\n**What do you tell her?**\n\n* [[It's overheating, so replace it today->D4 J12 W1]]\n* [[Unplug it because warm means danger->D4 J12 W2]]\n* [[Keep the laptop closed while it charges->D4 J12 W3]]\n* [[Warm is normal, not a warning sign->D4 J12 R]]", "D4 J12 W1": "(set: $m4 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Warm is normal.** Too hot to hold, buzzing, or a burning smell would be different. Unplugging when you're done is a fine habit, but warm alone is not danger.\"\n\n[[Got it->D4 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check what she noticed: silent, no smell, only warm. Which stop signs are missing?\"\n\n[[Try again->D4 J12]]]", "D4 J12 W2": "(set: $m4 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Warm is normal.** Too hot to hold, buzzing, or a burning smell would be different. Unplugging when you're done is a fine habit, but warm alone is not danger.\"\n\n[[Got it->D4 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check what she noticed: silent, no smell, only warm. Which stop signs are missing?\"\n\n[[Try again->D4 J12]]]", "D4 J12 W3": "(set: $m4 to >\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Cable Care\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Pull the <b>plug</b>, not the cord. Sharp bends at the neck crack the wires inside.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Gentle curve</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Sharp bend</text><rect x=\"18\" y=\"56\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"18\" y=\"70\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"30\" y=\"50\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#9aa4ae\"/><polygon points=\"70,54 100,60 100,70 70,76\" fill=\"#5d6670\" stroke=\"#ffb347\" stroke-width=\"2\"/><path d=\"M100 65 q55 0 70 60\" stroke=\"#e9ecef\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M161 50 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"218\" y=\"56\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"218\" y=\"70\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"230\" y=\"50\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#9aa4ae\"/><polygon points=\"270,54 300,60 300,70 270,76\" fill=\"#5d6670\" stroke=\"#ffb347\" stroke-width=\"2\"/><path d=\"M300 65 l12 0 l0 65\" stroke=\"#e9ecef\" stroke-width=\"6\" fill=\"none\" stroke-linejoin=\"miter\"/><path d=\"M318 58 l6 6 l-6 6 l6 6\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\"/><line x1=\"361\" y1=\"41\" x2=\"379\" y2=\"59\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"361\" y1=\"59\" x2=\"379\" y2=\"41\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"85\" y1=\"132\" x2=\"85\" y2=\"84\" stroke=\"#ffb347\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"85,84 88.8,91.0 81.2,91.0\" fill=\"#ffb347\"/><text x=\"85\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">strain relief</text><text x=\"312\" y=\"155\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">wires crack here</text></svg><div class=\"cap\">Pull the <b>plug</b>, not the cord. Sharp bends at the neck crack the wires inside.</div></div>\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Pull the plug\"><rect x=\"70\" y=\"12\" width=\"26\" height=\"46\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"78\" y=\"24\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"86\" y=\"24\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"42\" y=\"26\" width=\"24\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><line x1=\"2\" y1=\"35\" x2=\"42\" y2=\"35\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"58\" y1=\"14\" x2=\"26\" y2=\"14\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"26,14 33.0,10.2 33.0,17.8\" fill=\"#6fe3b5\"/></svg><b>✅ Pull the plug</b>grip the hard end</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"❌ Tight wrap\"><rect x=\"30\" y=\"12\" width=\"40\" height=\"48\" rx=\"5\" fill=\"#9aa4ae\"/><line x1=\"25\" y1=\"20\" x2=\"75\" y2=\"22\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"29\" x2=\"75\" y2=\"31\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"38\" x2=\"75\" y2=\"40\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"47\" x2=\"75\" y2=\"49\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"56\" x2=\"75\" y2=\"58\" stroke=\"#e9ecef\" stroke-width=\"3\"/><path d=\"M75 20 l8 0 l0 -14\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\"/><line x1=\"7\" y1=\"7\" x2=\"21\" y2=\"21\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"7\" y1=\"21\" x2=\"21\" y2=\"7\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>❌ Tight wrap</b>sharp bend at the brick</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Over-under\"><ellipse cx=\"46\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"50\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/><ellipse cx=\"54\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"58\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/></svg><b>✅ Over-under</b>twist, flip, repeat: no kinks</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Loose loops\"><ellipse cx=\"48\" cy=\"35\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"51\" cy=\"37\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"54\" cy=\"39\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><rect x=\"42\" y=\"6\" width=\"14\" height=\"60\" rx=\"4\" fill=\"#ffb347\"/></svg><b>✅ Loose loops</b>hand-sized, reusable tie</div></div>\n\n**Stop signs: replace it. Tape is not a repair.**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🧶</span><b>❌ Frayed jacket</b>split or fuzzy</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Bare wires</b>showing through</div><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ Scorch marks</b>brown or black</div><div class=\"card no\"><span class=\"big\">🫧</span><b>❌ Melted plastic</b>bubbled or warped</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Lint packs into ports. Power it off, brush first, then pick gently.\"><line x1=\"40\" y1=\"40\" x2=\"170\" y2=\"40\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"40\" y1=\"90\" x2=\"170\" y2=\"90\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"170\" y1=\"38\" x2=\"170\" y2=\"92\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><circle cx=\"158\" cy=\"52\" r=\"8\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"160\" cy=\"66\" r=\"9\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"157\" cy=\"80\" r=\"8\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"148\" cy=\"60\" r=\"6\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"148\" cy=\"75\" r=\"6\" fill=\"#c9c9c9\" opacity=\"0.9\"/><rect x=\"8\" y=\"52\" width=\"122\" height=\"26\" rx=\"5\" fill=\"#7fd1ff\"/><text x=\"158\" y=\"28\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"bold\">lint</text><text x=\"95\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Plug can't go</text><text x=\"95\" y=\"138\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">all the way in</text><line x1=\"230\" y1=\"30\" x2=\"330\" y2=\"58\" stroke=\"#e8c27a\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M361 44 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"74\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Soft brush first,</text><text x=\"300\" y=\"89\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">then wood or plastic</text><path d=\"M232 112 h80 a10 10 0 0 0 0 -16 h-70 a8 8 0 0 0 0 12 h60\" stroke=\"#9aa4ae\" stroke-width=\"3\" fill=\"none\"/><line x1=\"361\" y1=\"97\" x2=\"379\" y2=\"115\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"361\" y1=\"115\" x2=\"379\" y2=\"97\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"300\" y=\"150\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Never metal</text></svg><div class=\"cap\">Lint packs into ports. Power it off, brush first, then pick gently.</div></div>\n\nOn a Mac, iPhone or iPad, Apple says the same: a **soft dry brush** for port lint, and nothing sharp.\n\nPets chew cords. Use **cord protectors** and unplug spare chargers.\n\n<div class=\"warn\">**Grown-up needed:** If a cord, charger or outlet is scorched, melted, or has bare wires, a grown-up unplugs it by the plug and takes it out of use.</div>\n\n### Strips, Surges, and Storms\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"They look like twins. Only one soaks up <b>voltage spikes</b>.\"><polyline points=\"8,60 30,60 38,26 46,60 68,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"60\" x2=\"92\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"92,60 85.0,63.8 85.0,56.2\" fill=\"#ff6b6b\"/><rect x=\"96\" y=\"38\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"171\" y=\"65\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Power strip</text><line x1=\"250\" y1=\"60\" x2=\"268\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"268,60 261.0,63.8 261.0,56.2\" fill=\"#ff6b6b\"/><polyline points=\"272,60 294,60 302,26 310,60 332,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"366\" y1=\"37\" x2=\"384\" y2=\"55\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"366\" y1=\"55\" x2=\"384\" y2=\"37\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"302\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">gets through</text><polyline points=\"8,150 30,150 38,116 46,150 68,150\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"150\" x2=\"92\" y2=\"150\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"92,150 85.0,153.8 85.0,146.2\" fill=\"#ff6b6b\"/><rect x=\"96\" y=\"128\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"166\" y=\"155\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Surge protector</text><circle cx=\"236\" cy=\"137\" r=\"4\" fill=\"#6fe3b5\"/><line x1=\"250\" y1=\"150\" x2=\"268\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"268,150 261.0,153.8 261.0,146.2\" fill=\"#6fe3b5\"/><line x1=\"272\" y1=\"150\" x2=\"332\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\"/><path d=\"M366 146 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"302\" y=\"190\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">soaked up</text></svg><div class=\"cap\">They look like twins. Only one soaks up <b>voltage spikes</b>.</div></div>\n\nA **surge** is a sudden spike in **voltage**, the push behind electricity. Nearby lightning or power flickering back on can cause one.\n\n**Read the label:** a **joule** rating is how much spike it can soak up before it wears out.\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🏷️</span><b>✅ Surge wording</b>like \"surge protector\", UL 1449</div><div class=\"card ok\"><span class=\"big\">🧪</span><b>✅ UL or ETL listed</b>a safety lab tested it</div><div class=\"card ok\"><span class=\"big\">🔢</span><b>✅ Joule rating</b>spike-soaking power; higher is better</div><div class=\"card ok\"><span class=\"big\">🟢</span><b>✅ Protected light</b>off? replace it</div><div class=\"card no\"><span class=\"big\">🤷</span><b>❌ \"Meets UL standards\"</b>vague, not a listing</div><div class=\"card no\"><span class=\"big\">🚫</span><b>❌ No joule rating</b>just a power strip</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Strips plugged into strips overload the first one. It can overheat and start a fire.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Daisy chain</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Each into the wall</text><path d=\"M38 62 q20 0 22 14\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M70 128 q-22 -8 -8 -28 l13 -8\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M85 168 q-22 -8 -8 -24 l13 -8\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"8\" y=\"40\" width=\"30\" height=\"44\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"16\" y=\"50\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"26\" y=\"50\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"55\" y=\"76\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#ffc8a0\"/><rect x=\"65\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"82\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"100\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"118\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M80 62 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M110 62 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"70\" y=\"120\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"80\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"98\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"115\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"132\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"85\" y=\"160\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"95\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"112\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"130\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"148\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><line x1=\"171\" y1=\"41\" x2=\"189\" y2=\"59\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"171\" y1=\"59\" x2=\"189\" y2=\"41\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M248 66 q16 0 29 6\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M248 126 q16 0 29 6\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"222\" y=\"40\" width=\"30\" height=\"120\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"230\" y=\"60\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"240\" y=\"60\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"230\" y=\"120\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"240\" y=\"120\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"277\" y=\"64\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"287\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"304\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"322\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"340\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"277\" y=\"124\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"287\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"304\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"322\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"340\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M379 100 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><div class=\"cap\">Strips plugged into strips overload the first one. It can overheat and start a fire.</div></div>\n\nLightning is too big for any surge protector. Weather experts say it this way:\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">📡</span><b>✅ Storm watch posted</b>no thunder yet: act now</div><div class=\"card \"><span class=\"big\">💾</span><b>1. Save, 2. Shut down</b>all the way off</div><div class=\"card ok\"><span class=\"big\">🔌</span><b>✅ 3. Unplug early</b>from the wall, while it is calm</div><div class=\"card no\"><span class=\"big\">⛈️</span><b>❌ Thunder heard?</b>stay away from cords and the computer</div></div>\n\nUnplug early, **with dry hands**. Once you hear thunder, the storm is close enough to strike, so leave the cords alone.\n\n---\n\n🌙 *That's today's workday. Day 5 opens next time.*\n\n[[Back to the work schedule->Shop]]", "D5 Start": "(set: $miss to 0)(set: $m5 to (a:))# Day 5: Batteries & Charging\n\n<div class=\"scene\">🔋 📦 🔥</div>\n\nMs. Rivera called back. The electrician found the outlet melted inside the wall. \"It still charges fine\" was true right up until it wasn't.\n\n*The sign by the door has changed:* **Days since last preventable disaster: 4**\n\n*The Inspector sets down a box of bagged, taped-up old batteries.* \"Every phone and laptop here runs on **lithium-ion**. They wear out a little every day. And a damaged one can be a **fire**.\"\n\n\n[[Open the shop->D5 L1]]", "D5 L1": "## 📘 The Inspector's lesson: How Batteries Age\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>Capacity fading</b> is normal. Apple designs Mac laptop batteries to keep up to 80% after 1,000 cycles.\"><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"132\" x2=\"385\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"62\" x2=\"360\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"64\" y=\"37\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">100%</text><text x=\"64\" y=\"67\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">80%</text><text x=\"64\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">0%</text><path d=\"M70 32 C 160 36, 260 48, 360 62\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"70\" cy=\"32\" r=\"6\" fill=\"#6fe3b5\"/><circle cx=\"360\" cy=\"62\" r=\"6\" fill=\"#ffb347\"/><text x=\"215\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Capacity slowly fades</text><text x=\"80\" y=\"156\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">new</text><text x=\"385\" y=\"156\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"end\" font-weight=\"bold\">1,000 cycles</text></svg><div class=\"cap\"><b>Capacity fading</b> is normal. Apple designs Mac laptop batteries to keep up to 80% after 1,000 cycles.</div></div>\n\nA **charge cycle** is 100% of battery used in total, even across two days. Wear is normal. These speed it up, or slow it down:\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ Heat over 35°C (95°F)</b>hot cars, pillows, hot rooms</div><div class=\"card no\"><span class=\"big\">📅</span><b>❌ Full or empty</b>for weeks or months</div><div class=\"card ok\"><span class=\"big\">🔄</span><b>✅ Partial charges</b>30% to 80% is fine</div><div class=\"card ok\"><span class=\"big\">🧠</span><b>✅ No memory effect</b>draining to 0% trains nothing</div></div>\n\n**Why 80%?** A full battery sits at high **voltage** (the electrical push inside it), and that wears it faster. Staying below full is gentler.\n\n**Let the device do it for you:**\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🌙</span><b>✅ Optimized / Adaptive</b>waits at 80% until you usually unplug</div><div class=\"card ok\"><span class=\"big\">📱</span><b>✅ iPhone 15 and newer</b>Settings → Battery → Charging</div><div class=\"card ok\"><span class=\"big\">💻</span><b>✅ Newer Macs</b>Settings → Battery → Charging</div><div class=\"card ok\"><span class=\"big\">🪟</span><b>✅ Windows</b>varies by maker. Look in its app</div></div>\n\n**Checking battery health** (your field task today): the menu for each device is on the done screen.\n\n[[Got it. Send in the next customer->D5 J2]]", "D5 J2": "<div class=\"scene\">💻 ⏳ 😟</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Ms. Rivera's laptop at full charge, then and now\"><rect x=\"30\" y=\"14\" width=\"120\" height=\"76\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"37\" y=\"21\" width=\"106\" height=\"62\" rx=\"3\" fill=\"#2f4a5c\"/><polygon points=\"20,90 160,90 170,102 10,102\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"56\" y=\"38\" width=\"52\" height=\"24\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"108\" y=\"45\" width=\"6\" height=\"10\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"60\" y=\"42\" width=\"44\" height=\"16\" rx=\"3\" fill=\"#6fe3b5\"/><text x=\"90\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">9 hr left</text><rect x=\"212\" y=\"14\" width=\"120\" height=\"76\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"219\" y=\"21\" width=\"106\" height=\"62\" rx=\"3\" fill=\"#2f4a5c\"/><polygon points=\"202,90 342,90 352,102 192,102\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"238\" y=\"38\" width=\"52\" height=\"24\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"290\" y=\"45\" width=\"6\" height=\"10\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"242\" y=\"42\" width=\"44\" height=\"16\" rx=\"3\" fill=\"#6fe3b5\"/><text x=\"272\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">1 hr left</text><text x=\"90\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">when it was new</text><text x=\"272\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">now, 4 years later</text></svg><div class=\"cap\">Same full charge, much less time.</div></div>\n\n**Ms. Rivera's** laptop is four years old. It used to last all day. Now it lasts about an hour.\n\n**What's your first step?**\n\n* [[Buy a new charger, since the old one is worn->D5 J2 W1]]\n* [[Check the battery health report->D5 J2 R]]\n* [[Reinstall the operating system to reset power use->D5 J2 W3]]\n* [[Leave it plugged in for a full day->D5 J2 W4]]", "D5 J2 W1": "(set: $m5 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Four years of cycles means fading. **Check the battery health report**: design vs full charge capacity on Windows, Maximum Capacity on Mac and iPhone.\"\n\n[[Got it->D5 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about which card measures how much the battery can still hold.\"\n\n[[Try again->D5 J2]]]", "D5 J2 W3": "(set: $m5 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Reinstalling eats an afternoon and fixes nothing. The old part is the battery.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Four years of cycles means fading. **Check the battery health report**: design vs full charge capacity on Windows, Maximum Capacity on Mac and iPhone.\"\n\n[[Got it->D5 J2 R]]](else:)[<div class=\"oops\">Reinstalling eats an afternoon and fixes nothing. The old part is the battery.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Think about which card measures how much the battery can still hold.\"\n\n[[Try again->D5 J2]]]", "D5 J2 W4": "(set: $m5 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Four years of cycles means fading. **Check the battery health report**: design vs full charge capacity on Windows, Maximum Capacity on Mac and iPhone.\"\n\n[[Got it->D5 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about which card measures how much the battery can still hold.\"\n\n[[Try again->D5 J2]]]", "D5 J2 R": "(set: $miss to 0)## ✅ Job done\n**The report shows how much capacity is left.** A new charger can't fix a worn battery.\n\n[[Next customer->D5 J3]]", "D5 J3": "<div class=\"scene\"><svg viewBox=\"0 0 48 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"tablet\"><rect x=\"3\" y=\"3\" width=\"42\" height=\"54\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"8\" y=\"9\" width=\"32\" height=\"42\" rx=\"2\" fill=\"#2f4a5c\"/><circle cx=\"24\" cy=\"54\" r=\"1.6\" fill=\"#9aa4ae\"/></svg> 🪫 😴</div>\n\n<div class=\"pic\"><svg view below. **Stop using it, unplug it, don't charge or press it, and tell a grown-up.**\"\n\n[[Got it->D5 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Trackpad lifts card. What is pushing it up from underneath?\"\n\n[[Try again->D5 J10]]]", "D5 J10 W4": "(set: $m5 to it + (a: \"Ollie\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **swollen battery** is pushing up from below. **Stop using it, unplug it, don't charge or press it, and tell a grown-up.**\"\n\n[[Got it->D5 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Trackpad lifts card. What is pushing it up from underneath?\"\n\n[[Try again->D5 J10]]]", "D5 J10 R": "(set: $miss to 0)## ✅ Job done\n**A lifting trackpad often means a swelling battery.** Never press, poke or freeze one.\n\n[[Next customer->D5 J11]]", "D5 J11": "<div class=\"scene\">🗑️ 🎧 🤷</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"A dead earbuds case with a battery inside, headed for the regular trash.\"><rect x=\"34\" y=\"40\" width=\"84\" height=\"56\" rx=\"26\" fill=\"#5b6573\" stroke=\"#c9d1d9\" stroke-width=\"2\"/><line x1=\"34\" y1=\"62\" x2=\"118\" y2=\"62\" stroke=\"#c9d1d9\" stroke-width=\"2\"/><circle cx=\"76\" cy=\"80\" r=\"4\" fill=\"#ff6b6b\"/><line x1=\"132\" y1=\"68\" x2=\"196\" y2=\"68\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"196,68 189.0,71.8 189.0,64.2\" fill=\"#9aa4ae\"/><rect x=\"212\" y=\"30\" width=\"110\" height=\"10\" rx=\"3\" fill=\"#9aa4ae\"/><polygon points=\"220,40 314,40 304,116 230,116\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"245\" y1=\"50\" x2=\"247\" y2=\"106\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"267\" y1=\"50\" x2=\"267\" y2=\"106\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"289\" y1=\"50\" x2=\"287\" y2=\"106\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><text x=\"76\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his old earbuds case</text><text x=\"267\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the kitchen trash</text></svg><div class=\"cap\">A dead earbuds case with a battery inside, headed for the regular trash.</div></div>\n\n**Mr. Patel** is about to toss his dead old earbuds case in the kitchen trash. \"There's nothing left in it.\"\n\n**What should he do instead?**\n\n* [[Put it in the curbside recycling bin->D5 J11 W1]]\n* [[Wrap it in a paper towel, then bin it->D5 J11 W2]]\n* [[Take it to a battery drop-off->D5 J11 R]]\n* [[Bin it once it won't turn on->D5 J11 W4]]", "D5 J11 W1": "(set: $m5 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Crushed batteries start fires in recycling trucks. Don't.</div>\n\n## Let me show you\n*The Inspector leans over.* \"A battery inside can still spark when crushed in a truck. Take it to a **battery drop-off**. Many electronics stores have one.\"\n\n[[Got it->D5 J11 R]]](else:)[<div class=\"oops\">Crushed batteries start fires in recycling trucks. Don't.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the NEVER and DO THIS picture. Where do batteries go?\"\n\n[[Try again->D5 J11]]]", "D5 J11 W2": "(set: $m5 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A battery inside can still spark when crushed in a truck. Take it to a **battery drop-off**. Many electronics stores have one.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the NEVER and DO THIS picture. Where do batteries go?\"\n\n[[Try again->D5 J11]]]", "D5 J11 W4": "(set: $m5 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A battery inside can still spark when crushed in a truck. Take it to a **battery drop-off**. Many electronics stores have one.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the NEVER and DO THIS picture. Where do batteries go?\"\n\n[[Try again->D5 J11]]]", "D5 J11 R": "(set: $miss to 0)## ✅ Job done\n**Drop-offs keep fires out of trucks.** The sign stays at 4. For today.\n\n[[Next customer->D5 S1]]", "D5 S1": "## 🎲 Myth or Fact? (1 of 7)\n\nSeven battery claims. Which are facts, and which are myths?\n\n*The Inspector reads a claim off a sticky note:*\n\n### You should drain a battery to 0% to keep it healthy\n\n* [[✅ Fact->D5 S1 W]]\n* [[⛔ Myth->D5 S1 R]]", "D5 S1 R": "## ✅ Right: a myth\n**You should drain a battery to 0% to keep it healthy.** No memory effect. Deep drains just add wear.\n\n[[Next one->D5 S2]]", "D5 S1 W": "## ❌ Not this time: a myth\n**You should drain a battery to 0% to keep it healthy.** No memory effect. Deep drains just add wear.\n\n[[Next one->D5 S2]]", "D5 S2": "## 🎲 Myth or Fact? (2 of 7)\n\n*The Inspector reads a claim off a sticky note:*\n\n### Heat is a battery's biggest enemy\n\n* [[✅ Fact->D5 S2 R]]\n* [[⛔ Myth->D5 S2 W]]", "D5 S2 R": "## ✅ Right: a fact\n**Heat is a battery's biggest enemy.** A hot car or pillow wears it for good.\n\n[[Next one->D5 S3]]", "D5 S2 W": "## ❌ Not this time: a fact\n**Heat is a battery's biggest enemy.** A hot car or pillow wears it for good.\n\n[[Next one->D5 S3]]", "D5 S3": "## 🎲 Myth or Fact? (3 of 7)\n\n*The Inspector reads a claim off a sticky note:*\n\n### Putting a dead phone in the freezer revives it\n\n* [[✅ Fact->D5 S3 W]]\n* [[⛔ Myth->D5 S3 R]]", "D5 S3 R": "## ✅ Right: a myth\n**Putting a dead phone in the freezer revives it.** That's Kiosk advice. Cold doesn't repair a battery.\n\n[[Next one->D5 S4]]", "D5 S3 W": "## ❌ Not this time: a myth\n**Putting a dead phone in the freezer revives it.** That's Kiosk advice. Cold doesn't repair a battery.\n\n[[Next one->D5 S4]]", "D5 S4": "## 🎲 Myth or Fact? (4 of 7)\n\n*The Inspector reads a claim off a sticky note:*\n\n### Charging overnight is fine on a modern device\n\n* [[✅ Fact->D5 S4 R]]\n* [[⛔ Myth->D5 S4 W]]", "D5 S4 R": "## ✅ Right: a fact\n**Charging overnight is fine on a modern device.** Chargers stop when it's full. Keep it off pillows.\n\n[[Next one->D5 S5]]", "D5 S4 W": "## ❌ Not this time: a fact\n**Charging overnight is fine on a modern device.** Chargers stop when it's full. Keep it off pillows.\n\n[[Next one->D5 S5]]", "D5 S5": "## 🎲 Myth or Fact? (5 of 7)\n\n*The Inspector reads a claim off a sticky note:*\n\n### A swollen battery is OK if the device still works\n\n* [[✅ Fact->D5 S5 W]]\n* [[⛔ Myth->D5 S5 R]]", "D5 S5 R": "## ✅ Right: a myth\n**A swollen battery is OK if the device still works.** A swollen battery can catch fire. Stop using it.\n\n[[Next one->D5 S6]]", "D5 S5 W": "## ❌ Not this time: a myth\n**A swollen battery is OK if the device still works.** A swollen battery can catch fire. Stop using it.\n\n[[Next one->D5 S6]]", "D5 S6": "## 🎲 Myth or Fact? (6 of 7)\n\n*The Inspector reads a claim off a sticky note:*\n\n### Stored batteries should sit near half charge\n\n* [[✅ Fact->D5 S6 R]]\n* [[⛔ Myth->D5 S6 W]]", "D5 S6 R": "## ✅ Right: a fact\n**Stored batteries should sit near half charge.** Empty can kill it. Full ages it.\n\n[[Next one->D5 S7]]", "D5 S6 W": "## ❌ Not this time: a fact\n**Stored batteries should sit near half charge.** Empty can kill it. Full ages it.\n\n[[Next one->D5 S7]]", "D5 S7": "## 🎲 Myth or Fact? (7 of 7)\n\n*The Inspector reads a claim off a sticky note:*\n\n### Partial charges, like 30% to 80%, hurt the battery\n\n* [[✅ Fact->D5 S7 W]]\n* [[⛔ Myth->D5 S7 R]]", "D5 S7 R": "## ✅ Right: a myth\n**Partial charges, like 30% to 80%, hurt the battery.** Partial charges are gentle on it.\n\n[[Close up shop->D5 Done]]", "D5 S7 W": "## ❌ Not this time: a myth\n**Partial charges, like 30% to 80%, hurt the battery.** Partial charges are gentle on it.\n\n[[Close up shop->D5 Done]]", "D5 Done": "(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]# Day 5 complete!\n\n<div class=\"tool\">🔋 **New tool earned: Battery Tester**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **Battery check.** Windows: powercfg /batteryreport in Command Prompt, then open battery-report.html. Mac: Settings → Battery → Battery Health. iPhone: Settings → Battery → Battery Health & Charging. Chromebook/Android: search Settings for battery. Note the health % and whether a charge limit is on.</div>\n\n<div class=\"rocky\"><button type=\"button\" class=\"rocky-copy\" data-key=\"m5\" data-total=\"8\" data-none=\"nobody\" data-msg=\"Computer Care 101 Sr · Day 5 complete! Tool earned: 🔋 Battery Tester. Right on the first try: {first} of 8 customers. Needed help with: {missed}. Field assignment: Battery check. Windows: powercfg /batteryreport in Command Prompt, then open battery-report.html. Mac: Settings → Battery → Battery Health. iPhone: Settings → Battery → Battery Health &amp; Charging. Chromebook/Android: search Settings for battery. Note the health % and whether a charge limit is on.\">📋 Copy my results for Rocky</button><div class=\"rocky-box\" hidden></div><div class=\"rocky-ok\">Then paste them into your chat with Rocky. 💬</div></div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### How Batteries Age\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>Capacity fading</b> is normal. Apple designs Mac laptop batteries to keep up to 80% after 1,000 cycles.\"><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"132\" x2=\"385\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"62\" x2=\"360\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"64\" y=\"37\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">100%</text><text x=\"64\" y=\"67\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">80%</text><text x=\"64\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">0%</text><path d=\"M70 32 C 160 36, 260 48, 360 62\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"70\" cy=\"32\" r=\"6\" fill=\"#6fe3b5\"/><circle cx=\"360\" cy=\"62\" r=\"6\" fill=\"#ffb347\"/><text x=\"215\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Capacity slowly fades</text><text x=\"80\" y=\"156\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">new</text><text x=\"385\" y=\"156\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"end\" font-weight=\"bold\">1,000 cycles</text></svg><div class=\"cap\"><b>Capacity fading</b> is normal. Apple designs Mac laptop batteries to keep up to 80% after 1,000 cycles.</div></div>\n\nA **charge cycle** is 100% of battery used in total, even across two days. Wear is normal. These speed it up, or slow it down:\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ Heat over 35°C (95°F)</b>hot cars, pillows, hot rooms</div><div class=\"card no\"><span class=\"big\">📅</span><b>❌ Full or empty</b>for weeks or months</div><div class=\"card ok\"><span class=\"big\">🔄</span><b>✅ Partial charges</b>30% to 80% is fine</div><div class=\"card ok\"><span class=\"big\">🧠</span><b>✅ No memory effect</b>draining to 0% trains nothing</div></div>\n\n**Why 80%?** A full battery sits at high **voltage** (the electrical push inside it), and that wears it faster. Staying below full is gentler.\n\n**Let the device do it for you:**\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🌙</span><b>✅ Optimized / Adaptive</b>waits at 80% until you usually unplug</div><div class=\"card ok\"><span class=\"big\">📱</span><b>✅ iPhone 15 and newer</b>Settings → Battery → Charging</div><div class=\"card ok\"><span class=\"big\">💻</span><b>✅ Newer Macs</b>Settings → Battery → Charging</div><div class=\"card ok\"><span class=\"big\">🪟</span><b>✅ Windows</b>varies by maker. Look in its app</div></div>\n\n**Checking battery health** (your field task today): the menu for each device is on the done screen.\n\n### Long-Term Storage\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Batteries lose charge even when off. Never put one away dead.\"><text x=\"60\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">0%</text><text x=\"200\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">About 50%</text><text x=\"340\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">100%</text><rect x=\"15\" y=\"32\" width=\"86\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"101\" y=\"44\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><line x1=\"48\" y1=\"42\" x2=\"68\" y2=\"62\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"48\" y1=\"62\" x2=\"68\" y2=\"42\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><rect x=\"155\" y=\"32\" width=\"86\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"241\" y=\"44\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"159\" y=\"36\" width=\"39\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><path d=\"M257 52 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"295\" y=\"32\" width=\"86\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"381\" y=\"44\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"299\" y=\"36\" width=\"78\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"60\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Deep discharge</text><text x=\"60\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">may never charge</text><text x=\"200\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Store here</text><text x=\"200\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">40% to 60%</text><text x=\"340\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Ages faster</text><text x=\"340\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">in storage</text></svg><div class=\"cap\">Batteries lose charge even when off. Never put one away dead.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🚪</span><b>✅ Indoor closet</b>cool and dry</div><div class=\"card ok\"><span class=\"big\">🌡️</span><b>✅ Below 32°C</b>90°F (Apple)</div><div class=\"card no\"><span class=\"big\">🏚️</span><b>❌ Hot garage</b>or attic</div><div class=\"card no\"><span class=\"big\">🚗</span><b>❌ Parked car</b>bakes in summer</div></div>\n\n**Power it off, leave it near 50%, and keep it cool and dry.** A device that is only asleep keeps sipping power. Every few months, wake it and top it back up to about 50%.\n\n\"Like a houseplant on vacation: not soaked, not dried out, and somebody checks on it.\"\n\n\n**Check battery health** (today's field task): every device keeps a report.\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🪟</span><b>Windows</b>In Command Prompt: powercfg /batteryreport. It saves battery-report.html. Open it, compare design vs full charge capacity.</div><div class=\"card \"><span class=\"big\">💻</span><b>Mac</b>System Settings → Battery → Battery Health. Cycle count: System Report → Power.</div><div class=\"card \"><span class=\"big\">📱</span><b>iPhone</b>Settings → Battery → Battery Health & Charging</div><div class=\"card \"><span class=\"big\">🤖</span><b>Chromebook / Android</b>Menus differ. Search Settings for battery</div></div>\n\n---\n\n🌙 *That's today's workday. Day 6 opens next time.*\n\n[[Back to the work schedule->Shop]]", "D6 Start": "(set: $miss to 0)(set: $m6 to (a:))# Day 6: Other Everyday Gear\n\n<div class=\"scene\">🎧 🎮 📱 📷</div>\n\n*A sign on the wall reads: \"Days since last preventable disaster: 5.\"*\n\n*The Inspector dumps a bag of earbuds, a cheesy controller, a phone and a webcam.* \"People carry this stuff all day, so it gets dirty fast. Golden rule: **power off, and liquid goes on the cloth, never on the device.**\"\n\n\n[[Open the shop->D6 L1]]", "D6 L1": "## 📘 The Inspector's lesson: Earbuds and Headphones\n\n\"That little metal screen is the **mesh**. Keep it dry.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Mesh: dry brush\"><ellipse cx=\"36\" cy=\"30\" rx=\"20\" ry=\"17\" fill=\"#e9ecef\"/><rect x=\"42\" y=\"38\" width=\"10\" height=\"28\" rx=\"5\" fill=\"#e9ecef\"/><circle cx=\"31\" cy=\"27\" r=\"9\" fill=\"#4a525b\"/><circle cx=\"27\" cy=\"23\" r=\"1.2\" fill=\"#1b1f24\"/><circle cx=\"27\" cy=\"2 y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">60 minutes</text><line x1=\"282\" y1=\"70\" x2=\"318\" y2=\"70\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"318,70 311.0,73.8 311.0,66.2\" fill=\"#e9ecef\"/><path d=\"M345 52 q22 0 22 26 q0 14 -12 16 q-6 1 -6 10 q0 9 -11 9\" stroke=\"#7fd1ff\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"350\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">then a break</text></svg><div class=\"cap\">The <b>60/60 rule</b>. Loud sound kills tiny <b>hair cells</b> in your inner ear. They never grow back.</div></div>\n\n**60% on one device is not 60% on another**, so treat 60/60 as a rule of thumb. The better test: **if you can't hear someone talking next to you, it's too loud.** On an iPhone, Control Center's **Hearing** meter (add it in Settings > Control Center) shows the live dB. Stay out of its \"Loud\" zone.\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 215\" role=\"img\" aria-label=\"Water resistance <b>wears off</b>. Old seals, soap, sunscreen and lotion weaken it.\"><rect x=\"115\" y=\"8\" width=\"54\" height=\"50\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><text x=\"142\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"22\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">IP</text><rect x=\"174\" y=\"8\" width=\"54\" height=\"50\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><text x=\"201\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"24\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">X</text><rect x=\"233\" y=\"8\" width=\"54\" height=\"50\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><text x=\"260\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"24\" fill=\"#7fd1f iquid and pins push it deeper.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the mesh card again. Wet or dry?\"\n\n[[Try again->D6 J2]]]", "D6 J2 W4": "(set: $m6 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **earwax**. A **dry, soft brush** loosens it. Liquid and pins push it deeper.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the mesh card again. Wet or dry?\"\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**A dry, soft brush.** Water and pins push wax into the speaker.\n\n[[Next customer->D6 J3]]", "D6 J3": "<div class=\"scene\">🫧 <svg viewBox=\"0 0 44 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"earbud\"><rect x=\"22\" y=\"26\" width=\"13\" height=\"32\" rx=\"6.5\" fill=\"#e9ecef\"/><ellipse cx=\"20\" cy=\"22\" rx=\"18\" ry=\"17\" fill=\"#e9ecef\"/><circle cx=\"15\" cy=\"19\" r=\"8\" fill=\"#4a525b\"/></svg> 🚌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Straight from the sink to the earbud.\"><path d=\"M50 30 q40 -14 80 0 q8 26 -10 44 h-60 q-18 -18 -10 -44 Z\" fill=\"#9aa4ae\"/><rect x=\"74\" y=\"74\" width=\"32\" height=\"12\" rx=\"3\" fill=\"#6b747d\"/><path d=\"M64 84 C70.0 92.0 70.0 98.0 64 98.0 C58.0 98.0 58.0 92.0 64 84 Z\" fill=\"#7fd1ff\"/><path d=\"M96 92 C102.0 100.0 102.0 106.0 96 106.0 C90.0 106.0 90.0 100.0 96 92 Z\" fill=\"#7fd1ff\"/><path d=\"M120 80 C126.0 88.0 126.0 94.0 120 94.0 C114.0 94.0 114.0 88.0 120 80 Z\" fill=\"#7fd1ff\"/><path d=\"M80 100 C84.8 106.4 84.8 111.2 80 111.2 C75.2 111.2 75.2 106.4 80 100 Z\" fill=\"#7fd1ff\"/><ellipse cx=\"60\" cy=\"40\" rx=\"3\" ry=\"2\" fill=\"#7fd1ff\" opacity=\"0.8\"/><ellipse cx=\"100\" cy=\"30\" rx=\"3\" ry=\"2\" fill=\"#7fd1ff\" opacity=\"0.8\"/><ellipse cx=\"118\" cy=\"50\" rx=\"3\" ry=\"2\" fill=\"#7fd1ff\" opacity=\"0.8\"/><ellipse
