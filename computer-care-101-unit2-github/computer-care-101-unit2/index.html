"#8a96a3\"/><circle cx=\"126\" cy=\"38\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"142\" cy=\"32\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"160\" cy=\"38\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"176\" cy=\"31\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"132\" cy=\"68\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"152\" cy=\"72\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"171\" cy=\"67\" r=\"3.5\" fill=\"#7fd1ff\"/><line x1=\"186\" y1=\"53\" x2=\"212\" y2=\"53\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"212,53 205.0,56.8 205.0,49.2\" fill=\"#9aa4ae\"/><circle cx=\"250\" cy=\"45\" r=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"250\" y1=\"45\" x2=\"250\" y2=\"29\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"250\" y1=\"45\" x2=\"262\" y2=\"51\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"286\" y1=\"53\" x2=\"312\" y2=\"53\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"312,53 305.0,56.8 305.0,49.2\" fill=\"#9aa4ae\"/><path d=\"M341.0 38.0 A15 15 0 1 0 359.0 38.0\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"350\" y1=\"32\" x2=\"350\" y2=\"50\" stroke=\"#6fe3b5\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">1. Cold</text><text x=\"50\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">from the car</text><text x=\"150\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">2. Warm room</text><text x=\"150\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">water forms</text><text x=\"250\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Wait</text><text x=\"250\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">closed + off</text><text x=\"350\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">4. Turn on</text><text x=\"350\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">at room temp</text></svg><div class=\"cap\">Like glasses fogging up, but inside too. <b>Laptops:</b> wait until it feels room temperature, often an hour.</div></div>\n\nThat wait is for **laptops**. A phone that rides in a cold coat pocket is fine.\n\n**Rain and spills:** most current phones are **water-resistant** (IP67 or IP68 means tested for dunking in fresh water). Rain alone won't hurt them. The real rule is **never charge with a wet port.** An iPhone shows a \"Liquid Detected\" alert, and many Androids say \"Moisture detected.\" Laptops and older phones aren't rated, so use the steps:\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"><rect x=\"36\" y=\"6\" width=\"28\" height=\"52\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"28\" cy=\"14\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"25\" cy=\"40\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"75\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/><path d=\"M44.6 26.8 A9 9 0 1 0 55.4 26.8\" stroke=\"#6fe3b5\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"34\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>1. Power off</b>right away</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Dry it off\"><rect x=\"36\" y=\"6\" width=\"28\" height=\"52\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><path d=\"M24 40 Q50 32 76 40 L72 66 Q50 60 28 66 Z\" fill=\"#6b5a8e\"/><circle cx=\"28\" cy=\"14\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"25\" cy=\"40\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"75\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/></svg><b>2. Dry it off</b>just the outside</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Don't charge\"><rect x=\"30\" y=\"22\" width=\"26\" height=\"26\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"56\" y=\"27\" width=\"12\" height=\"4\" fill=\"#9aa4ae\"/><rect x=\"56\" y=\"39\" width=\"12\" height=\"4\" fill=\"#9aa4ae\"/><line x1=\"30\" y1=\"35\" x2=\"14\" y2=\"35\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"34\" y1=\"19\" x2=\"66\" y2=\"51\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"34\" y1=\"51\" x2=\"66\" y2=\"19\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>3. Don't charge</b>until fully dry</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Wait\"><circle cx=\"50\" cy=\"35\" r=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"50\" y1=\"35\" x2=\"50\" y2=\"19\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"35\" x2=\"62\" y2=\"41\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>4. Wait</b>at least a day</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🌳</span><b>✅ Cool, shady spot</b>let it cool on its own</div><div class=\"card ok\"><span class=\"big\">🎒</span><b>✅ Inside pocket</b>or a zip-top bag</div><div class=\"card no\"><span class=\"big\">🧊</span><b>❌ Freezer or fridge</b>too sudden: condensation</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Hair dryer, heater</b>fast heat = more water</div><div class=\"card no\"><span class=\"big\">🍚</span><b>❌ Rice</b>doesn't work, clogs ports</div><div class=\"card no\"><span class=\"big\">🌧️</span><b>❌ Outside pocket</b>bags aren't waterproof</div></div>\n\n### Storage and Accidents\n**Long naps (like summer break):**\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.\"><rect x=\"25\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"109\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"29\" y=\"24\" width=\"5\" height=\"32\" rx=\"3\" fill=\"#ff6b6b\"/><rect x=\"155\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"239\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"159\" y=\"24\" width=\"38\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><rect x=\"285\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"369\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"289\" y=\"24\" width=\"76\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"70\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">0%</text><text x=\"70\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">may never</text><text x=\"70\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">charge again</text><text x=\"200\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">About 50%</text><text x=\"200\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">just right</text><text x=\"330\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">100%</text><text x=\"330\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">wears it out</text><text x=\"330\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">faster</text><line x1=\"62\" y1=\"137\" x2=\"78\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"62\" y1=\"153\" x2=\"78\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M191 145 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"322\" y1=\"137\" x2=\"338\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"153\" x2=\"338\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><div class=\"cap\">Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🗄️</span><b>✅ Cool, dry room</b>a closet or shelf</div><div class=\"card no\"><span class=\"big\">🏚️</span><b>❌ Hot attic</b>an oven in summer</div><div class=\"card no\"><span class=\"big\">🏠</span><b>❌ Garage</b>hot in summer</div><div class=\"card no\"><span class=\"big\">🚗</span><b>❌ Car trunk</b>way too hot</div></div>\n\n**After a drop, stop for any of these:**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">👃</span><b>❌ Burning smell</b>or a chemical smell</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Sparks</b>any at all</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Smoke</b>any at all</div><div class=\"card no\"><span class=\"big\">🎈</span><b>❌ Bulging battery</b>case or trackpad pushed up</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.\"><rect x=\"6\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><text x=\"101\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Danger sign?</text><text x=\"20\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Power off</text><text x=\"20\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Don't charge</text><text x=\"20\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Keep it away from</text><text x=\"36\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">things that burn</text><text x=\"20\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Get a pro</text><rect x=\"204\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"299\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">No signs?</text><text x=\"218\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Check for cracks</text><text x=\"218\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Test the hinge</text><text x=\"218\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Back up files</text><text x=\"218\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Watch for days</text><text x=\"299\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">loose cables can act</text><text x=\"299\" y=\"199\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">up days later</text></svg><div class=\"cap\">Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.</div></div>\n\n<div class=\"warn\">**Grown-up needed:** A swollen battery, a burning smell, sparks, or a popped-open case means a grown-up takes over. Don't press, don't pry, don't charge. Get it to a professional or a battery recycler.</div>\n\n---\n\n🌙 *That's the last workday. The exam opens next time.*\n\n[[Back to the work schedule->Shop]]", "Exam Start": "(set: $miss to 0)(set: $mx to (a:))# 🎓 The Inspector's Final Exam\n\n<div class=\"scene\">📋 🎓</div>\n\n*The Inspector sets down a clipboard. Behind her, the wall sign still reads* **Days since last preventable disaster: 0.** *Courtesy of Leo's last visit.*\n\n\"Sixteen questions, two from each day. A few familiar faces will turn up. Read carefully. Miss twice and I'll show you.\"\n\n[[Begin->X1]]", "X1": "<div class=\"scene\">🔌 💥 💻</div>\n\n**Question 1 of 16.** **Kenji's** laptop only charges when he holds the plug tilted up. It worked fine until it slid off his desk last week and landed on the plug side.\n\n**Which of the five enemies is the best suspect?**\n\n* [[Dust, since lint is packed into the port->X1 W1]]\n* [[Moisture, since the port has corroded->X1 W2]]\n* [[Bumps, since the fall loosened it->X1 R]]\n* [[Power, since the charger is quietly failing->X1 W4]]", "X1 W1": "(set: $mx to it + (a: \"question 1\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Bumps.** That means drops, knocks and squeezing. The fall jarred the connection loose, which is why it only works at one angle.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the clue cards: what does 'works at one angle' point to? And what happened last week?\"\n\n[[Try again->X1]]]", "X1 W2": "(set: $mx to it + (a: \"question 1\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Bumps.** That means drops, knocks and squeezing. The fall jarred the connection loose, which is why it only works at one angle.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the clue cards: what does 'works at one angle' point to? And what happened last week?\"\n\n[[Try again->X1]]]", "X1 W4": "(set: $mx to it + (a: \"question 1\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Bumps.** That means drops, knocks and squeezing. The fall jarred the connection loose, which is why it only works at one angle.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the clue cards: what does 'works at one angle' point to? And what happened last week?\"\n\n[[Try again->X1]]]", "X1 R": "(set: $miss to 0)## ✅ Job done\n**Bumps.** Drops, knocks and squeezing loosen connections, and 'works at one angle' is the classic sign.\n\n[[Next question->X2]]", "X2": "<div class=\"scene\">📱 🌬️ 🚫</div>\n\n**Question 2 of 16.** **Ava's** iPhone speaker grille looks fuzzy and the sound is muffled. She grabs a can of compressed air, because it worked on her brother's MacBook keyboard.\n\n**What's the best move?**\n\n* [[Skip the can, since Apple says no->X2 R]]\n* [[Short bursts from the side, like on a MacBook->X2 W2]]\n* [[Hold the can upside down for stronger air->X2 W3]]\n* [[Blow into the grille with her mouth->X2 W4]]", "X2 W2": "(set: $mx to it + (a: \"question 2\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Apple OKs compressed air for MacBook keyboards but says no for iPhones. A soft dry brush is the safer tool. **Check your maker** for every device.\"\n\n[[Got it->X2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Day 1 rule: Apple OKs the can for one device and says no for another. Which one is this?\"\n\n[[Try again->X2]]]", "X2 W3": "(set: $mx to it + (a: \"question 2\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Apple OKs compressed air for MacBook keyboards but says no for iPhones. A soft dry brush is the safer tool. **Check your maker** for every device.\"\n\n[[Got it->X2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Day 1 rule: Apple OKs the can for one device and says no for another. Which one is this?\"\n\n[[Try again->X2]]]", "X2 W4": "(set: $mx to it + (a: \"question 2\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Breath is damp. The grille now holds lint and a little spit.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Apple OKs compressed air for MacBook keyboards but says no for iPhones. A soft dry brush is the safer tool. **Check your maker** for every device.\"\n\n[[Got it->X2 R]]](else:)[<div class=\"oops\">Breath is damp. The grille now holds lint and a little spit.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Day 1 rule: Apple OKs the can for one device and says no for another. Which one is this?\"\n\n[[Try again->X2]]]", "X2 R": "(set: $miss to 0)## ✅ Job done\n**Skip the can on an iPhone.** Apple says no there, so check your maker before every device.\n\n[[Next question->X3]]", "X3": "<div class=\"scene\">💻 👻 ⏱️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look closely at the movie.\"><rect x=\"105\" y=\"8\" width=\"150\" height=\"92\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"112\" y=\"15\" width=\"136\" height=\"78\" rx=\"2\" fill=\"#1b2a38\"/><rect x=\"112\" y=\"15\" width=\"136\" height=\"78\" fill=\"#3d6f9e\"/><polygon points=\"112,93 160,50 192,78 222,56 248,93\" fill=\"#3f7a4f\"/><circle cx=\"224\" cy=\"34\" r=\"8\" fill=\"#ffd45e\"/><line x1=\"112\" y1=\"30\" x2=\"248\" y2=\"30\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><line x1=\"112\" y1=\"46\" x2=\"248\" y2=\"46\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><line x1=\"112\" y1=\"62\" x2=\"248\" y2=\"62\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><line x1=\"112\" y1=\"78\" x2=\"248\" y2=\"78\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><line x1=\"140\" y1=\"15\" x2=\"140\" y2=\"93\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><line x1=\"170\" y1=\"15\" x2=\"170\" y2=\"93\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><line x1=\"200\" y1=\"15\" x2=\"200\" y2=\"93\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><line x1=\"230\" y1=\"15\" x2=\"230\" y2=\"93\" stroke=\"#ffffff\" stroke-width=\"1.5\" opacity=\"0.22\"/><polygon points=\"93,114 267,114 255,100 105,100\" fill=\"#8a96a3\"/><text x=\"180\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Gabe's laptop, about ten seconds after the switch</text></svg><div class=\"cap\">Look closely at the movie.</div></div>\n\n**Question 3 of 16.** **Gabe** switched his OLED laptop from a spreadsheet to a movie. A faint ghost of the grid showed for about a minute, then faded away.\n\n**What is it?**\n\n* [[Burn-in, so the panel is ruined->X3 W1]]\n* [[A pressure mark from the closed lid->X3 W2]]\n* [[Dead pixels spreading across the screen->X3 W3]]\n* [[Image retention, which fades on its own->X3 R]]", "X3 W1": "(set: $mx to it + (a: \"question 3\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A ghost that **fades** is **image retention**. Burn-in is the one that stays. His faded in a minute, so nothing is damaged.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A ghost that fades is one thing. A ghost that stays is another. Which did Gabe see?\"\n\n[[Try again->X3]]]", "X3 W2": "(set: $mx to it + (a: \"question 3\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A ghost that **fades** is **image retention**. Burn-in is the one that stays. His faded in a minute, so nothing is damaged.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A ghost that fades is one thing. A ghost that stays is another. Which did Gabe see?\"\n\n[[Try again->X3]]]", "X3 W3": "(set: $mx to it + (a: \"question 3\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A ghost that **fades** is **image retention**. Burn-in is the one that stays. His faded in a minute, so nothing is damaged.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A ghost that fades is one thing. A ghost that stays is another. Which did Gabe see?\"\n\n[[Try again->X3]]]", "X3 R": "(set: $miss to 0)## ✅ Job done\n**Image retention.** It fades. Burn-in is the ghost that stays, and a dimmer screen with a smaller HUD slows it.\n\n[[Next question->X4]]", "X4": "<div class=\"scene\">🎧 💻 💥</div>\n\n**Question 4 of 16.** **Ollie** coils his wired earbuds on the keyboard and shuts the lid. \"Saves a pocket.\"\n\n**What's the risk?**\n\n* [[Static from the wires fries the keyboard->X4 W1]]\n* [[The lid presses them into the screen->X4 R]]\n* [[The lid sensor never lets the laptop sleep->X4 W3]]\n* [[The wires drain the battery overnight->X4 W4]]", "X4 W1": "(set: $mx to it + (a: \"question 4\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A shut laptop has almost no gap, so the lid **presses the earbuds into the glass**. Pens, clips and crumbs do the same.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How much space is there between the keys and the screen when a laptop is shut?\"\n\n[[Try again->X4]]]", "X4 W3": "(set: $mx to it + (a: \"question 4\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A shut laptop has almost no gap, so the lid **presses the earbuds into the glass**. Pens, clips and crumbs do the same.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How much space is there between the keys and the screen when a laptop is shut?\"\n\n[[Try again->X4]]]", "X4 W4": "(set: $mx to it + (a: \"question 4\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A shut laptop has almost no gap, so the lid **presses the earbuds into the glass**. Pens, clips and crumbs do the same.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How much space is there between the keys and the screen when a laptop is shut?\"\n\n[[Try again->X4]]]", "X4 R": "(set: $miss to 0)## ✅ Job done\n**Clear the keys before closing.** The lid squeezes whatever is on them into the screen.\n\n[[Next question->X5]]", "X5": "<div class=\"scene\">💻 🏷️ 🔥</div>\n\n**Question 5 of 16.** **Mia** covered her whole laptop in stickers, including the strip of vent slots by the hinge. Now it runs hot and the fans roar.\n\n**What should she peel off first?**\n\n* [[Every sticker, since paper holds heat->X5 W1]]\n* [[Only the stickers over the vent slots->X5 R]]\n* [[The lid stickers, since the screen makes heat->X5 W3]]\n* [[Nothing, since stickers sit on the outside->X5 W4]]", "X5 W1": "(set: $mx to it + (a: \"question 5\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The vents are the **exhaust**. Stickers over them trap the heat, so the chip throttles. Lid stickers elsewhere are fine.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm air out of a grille is exhaust. Which stickers are sitting on it?\"\n\n[[Try again->X5]]]", "X5 W3": "(set: $mx to it + (a: \"question 5\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The vents are the **exhaust**. Stickers over them trap the heat, so the chip throttles. Lid stickers elsewhere are fine.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm air out of a grille is exhaust. Which stickers are sitting on it?\"\n\n[[Try again->X5]]]", "X5 W4": "(set: $mx to it + (a: \"question 5\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The vents are the **exhaust**. Stickers over them trap the heat, so the chip throttles. Lid stickers elsewhere are fine.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm air out of a grille is exhaust. Which stickers are sitting on it?\"\n\n[[Try again->X5]]]", "X5 R": "(set: $miss to 0)## ✅ Job done\n**Never cover a vent.** Stickers on the lid are fine, but the vent slots need open air.\n\n[[Next question->X6]]", "X6": "<div class=\"scene\">🍎 💻 🌡️</div>\n\n**Question 6 of 16.** The Inspector squints at the order slip. \"Priya again.\" Her MacBook Air has no fan and no vent slots. \"So it can't overheat, right?\"\n\n**What do you tell her?**\n\n* [[Right, with no fan there's no heat to remove->X6 W1]]\n* [[A hidden fan runs inside and needs cleaning->X6 W2]]\n* [[It only overheats if the screen is bright->X6 W3]]\n* [[Its metal body sheds heat, so give it air->X6 R]]", "X6 W1": "(set: $mx to it + (a: \"question 6\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No fan doesn't mean no heat. The aluminum body is the **heat sink**, so it needs open air all around, or it throttles.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Thin laptops like the MacBook Air skip the fan. What does the metal body do instead?\"\n\n[[Try again->X6]]]", "X6 W2": "(set: $mx to it + (a: \"question 6\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No fan doesn't mean no heat. The aluminum body is the **heat sink**, so it needs open air all around, or it throttles.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Thin laptops like the MacBook Air skip the fan. What does the metal body do instead?\"\n\n[[Try again->X6]]]", "X6 W3": "(set: $mx to it + (a: \"question 6\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No fan doesn't mean no heat. The aluminum body is the **heat sink**, so it needs open air all around, or it throttles.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Thin laptops like the MacBook Air skip the fan. What does the metal body do instead?\"\n\n[[Try again->X6]]]", "X6 R": "(set: $miss to 0)## ✅ Job done\n**Fanless means the body is the heat sink.** Give the metal open air on every side.\n\n[[Next question->X7]]", "X7": "<div class=\"scene\">🔌 🛡️</div>\n\n**Question 7 of 16.** The electrician fixed **Ms. Rivera's** outlet, and she's buying a new strip for her desktop. This time she wants one that really blocks surges.\n\n**Which label proves it's a surge protector?**\n\n* [[A UL 1449 listing and a joule rating->X7 R]]\n* [[Six outlets and a glowing on/off switch->X7 W2]]\n* [[Says \"meets UL standards\" in big print->X7 W3]]\n* [[15A, 125V, 1875W MAX in bold->X7 W4]]", "X7 W2": "(set: $mx to it + (a: \"question 7\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **surge protector** lists UL 1449 and a **joule** rating, which is how big a spike it can soak up. Outlets, switches and amp numbers describe a plain strip.\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which label talks about spikes, not just how much power the strip can carry?\"\n\n[[Try again->X7]]]", "X7 W3": "(set: $mx to it + (a: \"question 7\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **surge protector** lists UL 1449 and a **joule** rating, which is how big a spike it can soak up. Outlets, switches and amp numbers describe a plain strip.\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which label talks about spikes, not just how much power the strip can carry?\"\n\n[[Try again->X7]]]", "X7 W4": "(set: $mx to it + (a: \"question 7\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **surge protector** lists UL 1449 and a **joule** rating, which is how big a spike it can soak up. Outlets, switches and amp numbers describe a plain strip.\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which label talks about spikes, not just how much power the strip can carry?\"\n\n[[Try again->X7]]]", "X7 R": "(set: $miss to 0)## ✅ Job done\n**UL 1449 plus a joule rating.** Vague wording, a switch or amp numbers do not stop spikes. Ms. Rivera now owns a better strip than most shops.\n\n[[Next question->X8]]", "X8": "<div class=\"scene\">🔌 🧶</div>\n\n**Question 8 of 16.** **Kai's** roommate unplugs the laptop charger by tugging the cord from across the room. The cord still works. \"So far,\" says the Inspector.\n\n**What's the right habit?**\n\n* [[Tug the cord, since it's built to take it->X8 W1]]\n* [[Wiggle the cord loose, then pull->X8 W2]]\n* [[Grip the hard plug end and pull straight->X8 R]]\n* [[Switch off the outlet, then yank the cord->X8 W4]]", "X8 W1": "(set: $mx to it + (a: \"question 8\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pull the **plug**, not the cord. Tugging bends the wires at the neck until they crack inside.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which end of a cable is built to be gripped?\"\n\n[[Try again->X8]]]", "X8 W2": "(set: $mx to it + (a: \"question 8\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pull the **plug**, not the cord. Tugging bends the wires at the neck until they crack inside.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which end of a cable is built to be gripped?\"\n\n[[Try again->X8]]]", "X8 W4": "(set: $mx to it + (a: \"question 8\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pull the **plug**, not the cord. Tugging bends the wires at the neck until they crack inside.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which end of a cable is built to be gripped?\"\n\n[[Try again->X8]]]", "X8 R": "(set: $miss to 0)## ✅ Job done\n**Pull the plug, not the cord.** A sharp bend at the neck cracks the wires, and a cracked cord is a stop sign.\n\n[[Next question->X9]]", "X9": "<div class=\"scene\">💻 🔋 📉</div>\n\n**Question 9 of 16.** **Theo's** four-year-old MacBook shows 80% Maximum Capacity and about 1,000 charge cycles. He thinks the battery is defective.\n\n**What do you tell him?**\n\n* [[It's normal wear for that many cycles->X9 R]]\n* [[It's defective, since it should always read 100%->X9 W2]]\n* [[Drain it to 0% once to recalibrate it->X9 W3]]\n* [[Normal, but only if he stops charging overnight->X9 W4]]", "X9 W2": "(set: $mx to it + (a: \"question 9\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Apple designs Mac batteries to keep up to 80% after 1,000 cycles, so this is **normal fading**. Battery Health shows it.\"\n\n[[Got it->X9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Capacity fading is normal. Apple designs Mac batteries to keep how much after 1,000 cycles?\"\n\n[[Try again->X9]]]", "X9 W3": "(set: $mx to it + (a: \"question 9\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's the memory-effect myth. Lithium-ion remembers nothing, and deep drains only add wear.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Apple designs Mac batteries to keep up to 80% after 1,000 cycles, so this is **normal fading**. Battery Health shows it.\"\n\n[[Got it->X9 R]]](else:)[<div class=\"oops\">That's the memory-effect myth. Lithium-ion remembers nothing, and deep drains only add wear.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Capacity fading is normal. Apple designs Mac batteries to keep how much after 1,000 cycles?\"\n\n[[Try again->X9]]]", "X9 W4": "(set: $mx to it + (a: \"question 9\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Apple designs Mac batteries to keep up to 80% after 1,000 cycles, so this is **normal fading**. Battery Health shows it.\"\n\n[[Got it->X9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Capacity fading is normal. Apple designs Mac batteries to keep how much after 1,000 cycles?\"\n\n[[Try again->X9]]]", "X9 R": "(set: $miss to 0)## ✅ Job done\n**Normal wear.** Fading is expected. Heat and sitting full or empty for weeks speed it up.\n\n[[Next question->X10]]", "X10": "<div class=\"scene\">🔋 🎈</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"Look at the shape of the case.\"><rect x=\"20\" y=\"96\" width=\"320\" height=\"10\" rx=\"3\" fill=\"#8a96a3\"/><path d=\"M110 96 C 106 74, 120 58, 180 56 C 240 58, 254 74, 250 96 Z\" fill=\"#cfd6dd\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"150\" y=\"66\" width=\"60\" height=\"14\" rx=\"3\" fill=\"#5b6573\"/><line x1=\"180\" y1=\"22\" x2=\"180\" y2=\"50\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"180,50 176.2,43.0 183.8,43.0\" fill=\"#ffb347\"/><text x=\"180\" y=\"16\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">the middle of the case</text><text x=\"180\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Jordan's old power bank, from the side</text></svg><div class=\"cap\">Look at the shape of the case.</div></div>\n\n**Question 10 of 16.** **Jordan's** old power bank from the bottom of his gym bag has puffed up like a small pillow and rocks on the desk. He wants to squeeze it flat to fit his pocket.\n\n**What should happen?**\n\n* [[Press it flat once, then charge it normally->X10 W1]]\n* [[Run it to empty so nothing is left inside->X10 W2]]\n* [[Stop using it and tell a grown-up->X10 R]]\n* [[Keep it, but only charge it in the daytime->X10 W4]]", "X10 W1": "(set: $mx to it + (a: \"question 10\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Pressing a swollen battery can puncture it. That's how fires start.</div>\n\n## Let me show you\n*The Inspector leans over.* \"A puffed case means **gas** built up inside. Pressing, charging or poking it can start a fire. Stop, keep it on a hard surface away from paper, and tell a grown-up.\"\n\n[[Got it->X10 R]]](else:)[<div class=\"oops\">Pressing a swollen battery can puncture it. That's how fires start.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"The puff is gas inside. Check the No press or poke card: what could squeezing do?\"\n\n[[Try again->X10]]]", "X10 W2": "(set: $mx to it + (a: \"question 10\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A puffed case means **gas** built up inside. Pressing, charging or poking it can start a fire. Stop, keep it on a hard surface away from paper, and tell a grown-up.\"\n\n[[Got it->X10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The puff is gas inside. Check the No press or poke card: what could squeezing do?\"\n\n[[Try again->X10]]]", "X10 W4": "(set: $mx to it + (a: \"question 10\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A puffed case means **gas** built up inside. Pressing, charging or poking it can start a fire. Stop, keep it on a hard surface away from paper, and tell a grown-up.\"\n\n[[Got it->X10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The puff is gas inside. Check the No press or poke card: what could squeezing do?\"\n\n[[Try again->X10]]]", "X10 R": "(set: $miss to 0)## ✅ Job done\n**Stop and tell a grown-up.** A swollen battery is the same hazard in a power bank as in a laptop. Then it goes to a battery drop-off.\n\n[[Next question->X11]]", "X11": "<div class=\"scene\">📱 🎧 🔊</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 110\" role=\"img\" aria-label=\"Where the pointer sits.\"><rect x=\"40\" y=\"38\" width=\"280\" height=\"26\" rx=\"13\" fill=\"#2b323b\" stroke=\"#5b6573\" stroke-width=\"2\"/><rect x=\"44\" y=\"42\" width=\"100\" height=\"18\" rx=\"9\" fill=\"#3fa77a\"/><rect x=\"144\" y=\"42\" width=\"70\" height=\"18\" fill=\"#e6c34a\"/><rect x=\"214\" y=\"42\" width=\"102\" height=\"18\" rx=\"9\" fill=\"#e07a3c\"/><polygon points=\"180,32 172,16 188,16\" fill=\"#e9ecef\"/><text x=\"94\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">OK</text><text x=\"180\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Loud</text><text x=\"266\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Very loud</text><text x=\"180\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">the Hearing meter on Marcus's iPhone</text></svg><div class=\"cap\">Where the pointer sits.</div></div>\n\n**Question 11 of 16.** **Marcus** opens Control Center on his iPhone. The Hearing meter sits deep in the Loud zone while his earbuds play.\n\n**What does that tell him?**\n\n* [[His earbuds need cleaning to sound clear->X11 W1]]\n* [[Turn it down before it harms his hearing->X11 R]]\n* [[It only counts after four hours of listening->X11 W3]]\n* [[Headphones are always quieter, so switch->X11 W4]]", "X11 W1": "(set: $mx to it + (a: \"question 11\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The meter shows the live dB. Loud means too loud, and the **hair cells** in your inner ear never grow back. Turn it down.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 60/60 idea: what does loud sound do to the tiny hair cells in your ear?\"\n\n[[Try again->X11]]]", "X11 W3": "(set: $mx to it + (a: \"question 11\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The meter shows the live dB. Loud means too loud, and the **hair cells** in your inner ear never grow back. Turn it down.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 60/60 idea: what does loud sound do to the tiny hair cells in your ear?\"\n\n[[Try again->X11]]]", "X11 W4": "(set: $mx to it + (a: \"question 11\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The meter shows the live dB. Loud means too loud, and the **hair cells** in your inner ear never grow back. Turn it down.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 60/60 idea: what does loud sound do to the tiny hair cells in your ear?\"\n\n[[Try again->X11]]]", "X11 R": "(set: $miss to 0)## ✅ Job done\n**Stay out of the Loud zone.** And the simple test works anywhere: if you can't hear someone beside you, it's too loud.\n\n[[Next question->X12]]", "X12": "<div class=\"scene\">🎮 ⬅️ 🛠️</div>\n\n**Question 12 of 16.** **Dev's** controller still drifts after short air bursts and a calibration. It's six months old. A video says to pry the stick cap off and scrub inside.\n\n**What's the next step?**\n\n* [[Pry the cap off and scrub the base->X12 W1]]\n* [[Calibrate again until it behaves->X12 W2]]\n* [[Smack the side of the controller->X12 W3]]\n* [[Send it in under warranty->X12 R]]", "X12 W1": "(set: $mx to it + (a: \"question 12\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Air and calibration come first. Still drifting means worn parts, so **check the warranty** and get it repaired. Opening it yourself can void the warranty and break more.\"\n\n[[Got it->X12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The lesson's steps: air, calibrate, then what? And who opens the controller?\"\n\n[[Try again->X12]]]", "X12 W2": "(set: $mx to it + (a: \"question 12\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Air and calibration come first. Still drifting means worn parts, so **check the warranty** and get it repaired. Opening it yourself can void the warranty and break more.\"\n\n[[Got it->X12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The lesson's steps: air, calibrate, then what? And who opens the controller?\"\n\n[[Try again->X12]]]", "X12 W3": "(set: $mx to it + (a: \"question 12\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Hitting it adds a crack. The stick keeps drifting, now with attitude.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Air and calibration come first. Still drifting means worn parts, so **check the warranty** and get it repaired. Opening it yourself can void the warranty and break more.\"\n\n[[Got it->X12 R]]](else:)[<div class=\"oops\">Hitting it adds a crack. The stick keeps drifting, now with attitude.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"The lesson's steps: air, calibrate, then what? And who opens the controller?\"\n\n[[Try again->X12]]]", "X12 R": "(set: $miss to 0)## ✅ Job done\n**Warranty, then repair.** Opening it yourself risks breaking more than the stick.\n\n[[Next question->X13]]", "X13": "<div class=\"scene\">🐈 ⌨️ 🔒</div>\n\n**Question 13 of 16.** Noodle is back. Priya's school gave her a Chromebook, and he has chosen it as his new bed. She's about to grab a snack.\n\n**Which shortcut locks a Chromebook?**\n\n* [[Windows + L->X13 W1]]\n* [[Control + Command + Q->X13 W2]]\n* [[Ctrl + Shift + Q->X13 W3]]\n* [[Search + L->X13 R]]", "X13 W1": "(set: $mx to it + (a: \"question 13\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Chromebook: **Search + L**. Windows is Windows + L. Mac is Control + Command + Q. A phone or tablet locks with the side button.\"\n\n[[Got it->X13 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Each computer has its own lock shortcut. Check the three lock cards: which one shows the Search key?\"\n\n[[Try again->X13]]]", "X13 W2": "(set: $mx to it + (a: \"question 13\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Chromebook: **Search + L**. Windows is Windows + L. Mac is Control + Command + Q. A phone or tablet locks with the side button.\"\n\n[[Got it->X13 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Each computer has its own lock shortcut. Check the three lock cards: which one shows the Search key?\"\n\n[[Try again->X13]]]", "X13 W3": "(set: $mx to it + (a: \"question 13\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Chromebook: **Search + L**. Windows is Windows + L. Mac is Control + Command + Q. A phone or tablet locks with the side button.\"\n\n[[Got it->X13 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Each computer has its own lock shortcut. Check the three lock cards: which one shows the Search key?\"\n\n[[Try again->X13]]]", "X13 R": "(set: $miss to 0)## ✅ Job done\n**Search + L locks a Chromebook.** Noodle remains undefeated against everything except a locked screen.\n\n[[Next question->X14]]", "X14": "<div class=\"scene\">🧦 ⚡ 🚪</div>\n\n**Question 14 of 16.** **Gabe** shuffles across the carpet in wool socks on a dry January day, then reaches to plug in his laptop.\n\n**What should he do first?**\n\n* [[Plug it in quickly before the static builds->X14 W1]]\n* [[Touch a metal doorknob or desk leg->X14 R]]\n* [[Tap the metal ports to drain it first->X14 W3]]\n* [[Wipe his hands on his sleeve first->X14 W4]]", "X14 W1": "(set: $mx to it + (a: \"question 14\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Dry winter air builds static in your socks and sleeves. **Touch a metal doorknob or desk leg first**, so the spark jumps there and not into the ports.\"\n\n[[Got it->X14 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Static jumps to the first metal it touches. Where do you want the spark to go?\"\n\n[[Try again->X14]]]", "X14 W3": "(set: $mx to it + (a: \"question 14\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Dry winter air builds static in your socks and sleeves. **Touch a metal doorknob or desk leg first**, so the spark jumps there and not into the ports.\"\n\n[[Got it->X14 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Static jumps to the first metal it touches. Where do you want the spark to go?\"\n\n[[Try again->X14]]]", "X14 W4": "(set: $mx to it + (a: \"question 14\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Dry winter air builds static in your socks and sleeves. **Touch a metal doorknob or desk leg first**, so the spark jumps there and not into the ports.\"\n\n[[Got it->X14 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Static jumps to the first metal it touches. Where do you want the spark to go?\"\n\n[[Try again->X14]]]", "X14 R": "(set: $miss to 0)## ✅ Job done\n**Discharge on something harmless first.** (Opening a tower is different: touch the unplugged case.)\n\n[[Next question->X15]]", "X15": "<div class=\"scene\">🎒 💻 🌀</div>\n\n**Question 15 of 16.** **Theo** closes his laptop to run for the bus. Ten seconds later the fans are still faintly humming and the lid feels warm.\n\n**What now, before it goes in the bag?**\n\n* [[Bag it, since closing the lid means sleep->X15 W1]]\n* [[Open the lid a crack so it can breathe->X15 W2]]\n* [[Shut it down, then bag it->X15 R]]\n* [[Turn the brightness down, then bag it->X15 W4]]", "X15 W1": "(set: $mx to it + (a: \"question 15\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Humming fans and a warm lid mean it's still awake, maybe on a download or update. Shut in a bag it **overheats and drains**. **Shut it down** (Mac: Apple menu, Shut Down).\"\n\n[[Got it->X15 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The checks after closing: light, fans, lid. Which ones failed?\"\n\n[[Try again->X15]]]", "X15 W2": "(set: $mx to it + (a: \"question 15\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Humming fans and a warm lid mean it's still awake, maybe on a download or update. Shut in a bag it **overheats and drains**. **Shut it down** (Mac: Apple menu, Shut Down).\"\n\n[[Got it->X15 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The checks after closing: light, fans, lid. Which ones failed?\"\n\n[[Try again->X15]]]", "X15 W4": "(set: $mx to it + (a: \"question 15\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Humming fans and a warm lid mean it's still awake, maybe on a download or update. Shut in a bag it **overheats and drains**. **Shut it down** (Mac: Apple menu, Shut Down).\"\n\n[[Got it->X15 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The checks after closing: light, fans, lid. Which ones failed?\"\n\n[[Try again->X15]]]", "X15 R": "(set: $miss to 0)## ✅ Job done\n**Shut it down when the checks fail.** A laptop awake in a closed bag has nowhere to send its heat.\n\n[[Next question->X16]]", "X16": "<div class=\"scene\">🐕 💧 💻</div>\n\n**Question 16 of 16.** Leo's back. Different laptop. Same dog. Biscuit knocked a water bottle onto it. Leo powered it off, dried the outside and left the charger unplugged. The Inspector looks for the catch. There isn't one.\n\n**How long should Leo wait before charging it?**\n\n* [[At least a day, until fully dry->X16 R]]\n* [[Until the outside feels dry to touch->X16 W2]]\n* [[One night in a bowl of rice->X16 W3]]\n* [[An hour near a heater vent->X16 W4]]", "X16 W2": "(set: $mx to it + (a: \"question 16\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Step 4: wait **at least a day**. Water hides inside long after the outside feels dry, and charging early can short it.\"\n\n[[Got it->X16 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 4 of the wet-device cards. The outside dries fast. Does the inside?\"\n\n[[Try again->X16]]]", "X16 W3": "(set: $mx to it + (a: \"question 16\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Rice dries nothing and leaves dust in the ports.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Step 4: wait **at least a day**. Water hides inside long after the outside feels dry, and charging early can short it.\"\n\n[[Got it->X16 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Rice dries nothing and leaves dust in the ports.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 4 of the wet-device cards. The outside dries fast. Does the inside?\"\n\n[[Try again->X16]]]", "X16 W4": "(set: $mx to it + (a: \"question 16\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Step 4: wait **at least a day**. Water hides inside long after the outside feels dry, and charging early can short it.\"\n\n[[Got it->X16 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 4 of the wet-device cards. The outside dries fast. Does the inside?\"\n\n[[Try again->X16]]]", "X16 R": "(set: $miss to 0)## ✅ Job done\n**At least a day.** Leo did every step right. The Inspector is filing it under a clerical error in the universe.\n\n[[See your results->Certificate]]", "Certificate": "# 🏅 Senior Technician: Computer Care 101 Sr Complete\n\n<div class=\"scene\">🏅 🎉 🛠️</div>\n\n*The Inspector hands you a heavier badge.* \"Heat, dust, power, moisture, bumps. You know the five enemies, and you know *why*. That's a technician.\"\n\n*She walks to the wall and changes the sign:* **Days since last preventable disaster: 1.** \"Nobody touch it.\"\n\n**Your Sr kit:** 📒 Tech Notebook · 🖥️ Screen Kit · 🌡️ Heat Detector · 🔌 Cable Kit · 🔋 Battery Tester · 🎧 Gear Bag · 🐾 Hazard Map · 🎒 Travel Case\n\n<div class=\"rocky\"><button type=\"button\" class=\"rocky-copy\" data-key=\"mx\" data-total=\"16\" data-none=\"none\" data-msg=\"Computer Care 101 Sr · Exam complete! Badge: Senior Technician. Right on the first try: {first} of 16 questions. Needed help with: {missed}.\">📋 Copy my results for Rocky</button><div class=\"rocky-box\" hidden></div><div class=\"rocky-ok\">Then paste them into your chat with Rocky. 💬</div></div>\n\n[[Back to the work schedule->Shop]]"}};
(function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  // "Copy my results for Rocky": fills in the learner's first-try score and who they needed help with, copies it, and shows it
  out.addEventListener('click',e=>{const b=e.target.closest('.rocky-copy');if(!b)return;
    const miss=[...new Set(S[b.dataset.key]||[])];const tot=+b.dataset.total;
    const msg=b.dataset.msg.replace('{first}',String(Math.max(0,tot-miss.length))).replace('{missed}',miss.length?miss.join(', '):(b.dataset.none||'nobody'));
    const wrap=b.parentNode,box=wrap.querySelector('.rocky-box'),ok=wrap.querySelector('.rocky-ok');box.hidden=false;box.textContent=msg;
    const done=y=>{ok.textContent=y?'✅ Copied! Now paste it into your chat with Rocky.':'Copy the words above, then paste them into your chat with Rocky.';};
    const fallback=()=>{try{const r=document.createRange();r.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);done(document.execCommand('copy'));}catch(_){done(false);}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(()=>done(true),fallback);else fallback();}catch(_){fallback();}
  });
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly, unlocks the days before it, and lets the schedule open day N today ($open)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),...Object.keys(STORY.passages).map(k=>(k.match(/^D(\d+) Start$/)||[])[1]).filter(Boolean)]));S.open=99;show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];S.open=n;show('D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
