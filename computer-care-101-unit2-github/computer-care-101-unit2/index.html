roke=\"#6fe3b5\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">1. Cold</text><text x=\"50\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">from the car</text><text x=\"150\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">2. Warm room</text><text x=\"150\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">water forms</text><text x=\"250\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Wait</text><text x=\"250\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">closed + off</text><text x=\"350\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">4. Turn on</text><text x=\"350\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">at room temp</text></svg><div class=\"cap\">Like glasses fogging up, but inside too. After a freezing night: <b>an hour or more</b>.</div></div>\n\n**If it gets wet:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"><rect x=\"36\" y=\"6\" width=\"28\" height=\"52\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"28\" cy=\"14\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"25\" cy=\"40\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"75\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/><path d=\"M44.6 26.8 A9 9 0 1 cool on its own</div><div class=\"card ok\"><span class=\"big\">🎒</span><b>✅ Inside pocket</b>or a zip-top bag</div><div class=\"card no\"><span class=\"big\">🧊</span><b>❌ Freezer or fridge</b>too sudden: condensation</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Hair dryer, heater</b>fast heat = more water</div><div class=\"card no\"><span class=\"big\">🍚</span><b>❌ Rice</b>doesn't work, clogs ports</div><div class=\"card no\"><span class=\"big\">🌧️</span><b>❌ Outside pocket</b>bags aren't waterproof</div></div>\n\n<div class=\"warn\">**Grown-up needed:** If a device got soaked, a grown-up decides when it's dry enough to charge. Charging a wet device can damage it or cause a short circuit.</div>\n\n### Storage and Accidents\n**Long naps (like summer break):**\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.\"><rect x=\"25\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"109\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"29\" y=\"24\" width=\"5\" height=\"32\" rx=\"3\" fill=\"#ff6b6b\"/><rect x=\"155\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"239\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"159\" y=\"24\" width=\"38\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><rect x=\"285\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"369\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"289\" y=\"24\" width=\"76\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"70\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">0%</text><text x=\"70\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">may never</text><text x=\"70\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">charge again</text><text x=\"200\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">About 50%</text><text x=\"200\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">just right</text><text x=\"330\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">100%</text><text x=\"330\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">wears it out</text><text x=\"330\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">faster</text><line x1=\"62\" y1=\"137\" x2=\"78\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"62\" y1=\"153\" x2=\"78\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M191 145 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"322\" y1=\"137\" x2=\"338\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"153\" x2=\"338\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><div class=\"cap\">Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🗄️</span><b>✅ Cool, dry room</b>a closet or shelf</div><div class=\"card no\"><span class=\"big\">🏚️</span><b>❌ Hot attic</b>an oven in summer</div><div class=\"card no\"><span class=\"big\">🏠</span><b>❌ Garage</b>hot in summer</div><div class=\"card no\"><span class=\"big\">🚗</span><b>❌ Car trunk</b>way too hot</div></div>\n\n**After a drop, stop for any of these:**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">👃</span><b>❌ Burning smell</b>or a chemical smell</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Sparks</b>any at all</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Smoke</b>any at all</div><div class=\"card no\"><span class=\"big\">🎈</span><b>❌ Bulging battery</b>case or trackpad pushed up</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.\"><rect x=\"6\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><text x=\"101\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Danger sign?</text><text x=\"20\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Power off</text><text x=\"20\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Don't charge</text><text x=\"20\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Keep it away from</text><text x=\"36\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">things that burn</text><text x=\"20\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Get a pro</text><rect x=\"204\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"299\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">No signs?</text><text x=\"218\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Check for cracks</text><text x=\"218\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Test the hinge</text><text x=\"218\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Back up files</text><text x=\"218\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Watch for days</text><text x=\"299\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">loose cables can act</text><text x=\"299\" y=\"199\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">up days later</text></svg><div class=\"cap\">Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.</div></div>\n\n<div class=\"warn\">**Grown-up needed:** A swollen battery, a burning smell, or sparks means a grown-up takes over. Don't press on the swelling, don't charge it, and get it to a professional or a battery recycler.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Take the Unit 2 Exam->Exam Start]]", "Exam Start": "(set: $miss to 0)# 🎓 The Inspector's Unit 2 Exam\n\n<div class=\"scene\">📋 🎓</div>\n\n*The Inspector sets down a clipboard.* \"Sixteen questions, two from each day. Read carefully. Miss twice and I'll show you.\"\n\n[[Begin->X1]]", "X1": "<div class=\"scene\">💻 💥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Look at the screen.\"><rect x=\"105\" y=\" n hotter->X2 R]]\n* [[Dust drains the battery while it sleeps overnight->X2 W]]\n* [[Dust slows down the Wi-Fi signal->X2 W]]", "X2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Dust **traps heat**. It coats parts and clogs vents and fans, so everything runs hotter.\"\n\n[[Got it->X2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about what dust does to the airflow path.\"\n\n[[Try again->X2]]]", "X2 R": "(set: $miss to 0)## ✅ Job done\n**Dust traps heat.** It blankets parts and blocks airflow, and heat is what wears electronics out.\n\n[[Next question->X3]]", "X3": "<div class=\"scene\">📺 👻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look at the top-left corner of the screen.\"><rect x=\"50\" y=\"6\" width=\"260\" height=\"104\" rx=\"6\" fill=\"#111\" stroke=\"#5b6573\" stroke-width=\"3\"/><rect x=\"58\" y=\"14\" width=\"244\" height=\"88\" fill=\"#3d6f9e\"/><circle cx=\"262\" cy=\"36\" r=\"12\" fill=\"#ffd45e\"/><polygon points=\"58,102 120,46 168,88 214,52 302,102\" fill=\"#3f7a4f\"/><g opacity=\"0.35\"><path d=\"M70 22 c-4 -5 -11 0 -6 6 l6 6 l6 -6 c5 -6 -2 -11 -6 -6 z\" fill=\"#ffffff\"/><rect x=\"82\" y=\"22\" width=\"80\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\"/><rect x=\"84\" y=\"24\" width=\"56\" height=\"8\" fill=\"#ffffff\"/></g><rect x=\"160\" y=\"110\" width=\"40\" height=\"8\" fill=\"#5b6573\"/><text x=\"180\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the TV, playing a nature show</text></svg><div class=\"cap\">Look at the top-left corner of the screen.</div></div>\n\n**Question 3 of 16.** A customer's OLED TV shows a faint ghost of a game's health bar, even on other shows.\n\n**What caused it?**\n\n* [[A weak or loose HDMI cable->X3 W]]\n* [[Fingerprints and smudges on the screen's coating->X3 W]]\n* [[A static image left on screen for a long time->X3 R]]\n* [[Glare from a window behind the couch->X3 W]]", "X3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"OLED pixels light themselves, and pixels that show the **same image for a long time** wear unevenly. That's burn-in.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's special about how OLED pixels work?\"\n\n[[Try again->X3]]]", "X3 R": "(set: $miss to 0)## ✅ Job done\n**A static image shown for a long time.** OLED pixels age with use, so a health bar that never moves can leave a ghost behind.\n\n[[Next question->X4]]", "X4": "<div class=\"scene\">💻 👐</div>\n\n**Question 4 of 16.** You're teaching a new trainee how to open a laptop lid.\n\n**What's the right way?**\n\n* [[Open it from the center of the lid->X4 R]]\n* [[Flip it open by grabbing one corner->X4 W]]\n* [[Lift it by the edge of the screen->X4 W]]\n* [[Pry it open with a fingernail->X4 W]]", "X4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Open from the **center of the lid**. One corner twists the screen and wears out one hinge.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about hinges and corners?\"\n\n[[Try again->X4]]]", "X4 R": "(set: $miss to 0)## ✅ Job done\n**From the center of the lid.** Opening by one corner twists the screen and strains one hinge.\n\n[[Next question->X5]]", "X5": "<div class=\"scene\">💻 💨 🐢</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"The game was smooth a minute ago.\"><rect x=\"105\" y=\"10\" width=\"150\" height=\"90\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"112\" y=\"17\" width=\"136\" height=\"76\" rx=\"2\" fill=\"#1b2a38\"/><rect x=\"112\" y=\"17\" width=\"136\" height=\"76\" fill=\"#2f4a3a\"/><circle cx=\"150\" cy=\"56\" r=\"7\" fill=\"#ffd45e\"/><line x1=\"150\" y1=\"63\" x2=\"150\ ises an eyebrow.* \"Loud fans plus a sudden slowdown. What does a hot processor do to protect itself?\"\n\n[[Try again->X5]]]", "X5 R": "(set: $miss to 0)## ✅ Job done\n**Thermal throttling.** When the processor gets too hot, it slows itself to make less heat.\n\n[[Next question->X6]]", "X6": "<div class=\"scene\">💨 🌀</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"The air is about to blow into the vent.\"><rect x=\"20\" y=\"50\" width=\"320\" height=\"56\" rx=\"8\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"200\" cy=\"78\" r=\"22\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><ellipse cx=\"200\" cy=\"67.0\" rx=\"4.84\" ry=\"9.9\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(0 200 78)\"/><ellipse cx=\"200\" cy=\"67.0\" rx=\"4.84\" ry=\"9.9\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(90 200 78)\"/><ellipse cx=\"200\" cy=\"67.0\" rx=\"4.84\" ry=\"9.9\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(180 200 78)\"/><ellipse cx=\"200\" cy=\"67.0\" rx=\"4.84\" ry=\"9.9\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(270 200 78)\"/><circle cx=\"200\" cy=\"78\" r=\"4.4\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"150\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"162\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"174\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"186\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"198\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"210\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"222\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"234\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"246\" y=\"56\" width=\"6\" height=\"44\" fill=\"#1b1f24\" opacity=\"0.55\"/><rect x=\"22\" y=\"6\" width=\"34\" height=\"40\" rx=\"6\" fill=\"#e05a5a\"/><rect x=\"30\" y=\"0\" width=\"18\" height=\"8\" rx=\"2\" fill=\"#9aa4ae\"/><line x1=\"56\" y1=\"32\" x2=\"150\" y2=\"64\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"66\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">compressed air</text><text x=\"180\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the vent, with the fan behind it</text></svg><div class=\"cap\">The air is about to blow into the vent.</div></div>\n\n**Question 6 of 16.** You're blowing dust out of a laptop's vent with compressed air.\n\n**What should you do with the fan?**\n\n* [[Let it spin as fast as the air can push it->X6 W]]\n* [[Spray the fan with alcohol first->X6 W]]\n* [[Pull the fan out of the laptop->X6 W]]\n* [[Hold it still so it can't over-spin->X6 R]]", "X6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Hold the fan still** with a toothpick so the air can't over-spin it and damage the bearing.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What happens to a fan's bearing when air spins it way too fast?\"\n\n[[Try again->X6]]]", "X6 R": "(set: $miss to 0)## ✅ Job done\n**Hold it still.** An over-spun fan can damage its bearing and start to whine.\n\n[[Next question->X7]]", "X7": "<div class=\"scene\">🔌 ⚡</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 120\" role=\"img\" aria-label=\"Their strip, with its on/off switch.\"><path d=\"M6 100 C 20 100, 20 70, 40 70\" stroke=\"#5b6573\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"38\" y=\"44\" width=\"300\" height=\"52\" rx=\"10\" fill=\"#e9ecef\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"52\" y=\"55\" width=\"40\" height=\"30\" rx=\"6\" fill=\"#1b1f24\"/><rect x=\"63\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><rect x=\"77\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><circle cx=\"72\" cy=\"78\" r=\"3.5\" fill=\"#e9ecef\"/><rect x=\"104\" y=\"55\" width=\"40\" height=\"30\" rx=\"6\" fill=\"#1b1f24\"/><rect x=\"115\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><rect x=\"129\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><circle cx=\"124\" cy=\"78\" r=\"3.5\" fill=\"#e9ecef\"/><rect x=\"156\" y=\"55\" width=\"40\" height=\"30\" rx=\"6\" fill=\"#1b1f24\"/><rect x=\"167\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><rect x=\"181\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><circle cx=\"176\" cy=\"78\" r=\"3.5\" fill=\"#e9ecef\"/><rect x=\"208\" y=\"55\" width=\"40\" height=\"30\" rx=\"6\" fill=\"#1b1f24\"/><rect x=\"219\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><rect x=\"233\" y=\"61\" width=\"4\" height=\"11\" fill=\"#e9ecef\"/><circle cx=\"228\" cy=\"78\" r=\"3.5\" fill=\"#e9ecef\"/><rect x=\"270\" y=\"54\" width=\"52\" height=\"32\" rx=\"5\" fill=\"#e05a5a\"/><rect x=\"274\" y=\"58\" width=\"22\" height=\"24\" rx=\"3\" fill=\"#ff8a8a\"/><text x=\"190\" y=\"30\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">their power strip</text></svg><div class=\"cap\">Their strip, with its on/off switch.</div></div>\n\n**Question 7 of 16.** Someone says, \"My power strip protects my PC from power surges.\"\n\n**What do you tell them?**\n\n* [[A plain strip just adds outlets; a surge protector absorbs spikes->X7 R]]\n* [[Correct, every power strip with an on/off switch blocks all surges->X7 W]]\n* [[Surges only matter for TVs, not computers->X7 W]]\n* [[Any strip works if it's plugged in upside down->X7 W]]", "X7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A plain **power strip just adds outlets**. A **surge protector** has parts inside that absorb voltage spikes.\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Is every power strip a surge protector?\"\n\n[[Try again->X7]]]", "X7 R": "(set: $miss to 0)## ✅ Job done\n**A power strip only adds outlets.** A surge protector absorbs spikes. Look for a UL listing and a joule rating.\n\n[[Next question->X8]]", "X8": "<div class=\"scene\">🔌 🐢</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"It is charging, just slowly.\"><rect x=\"20\" y=\"52\" width=\"46\" height=\"46\" rx=\"7\" fill=\"#e9ecef\"/><rect x=\"30\" y=\"40\" width=\"5\" height=\"13\" fill=\"#9aa4ae\"/><rect x=\"51\" y=\"40\" width=\"5\" height=\"13\" fill=\"#9aa4ae\"/><path d=\"M43 98 C 43 118, 120 118, 150 92 S 196 86, 196 86\" stroke=\"#e9ecef\" stroke-width=\"4\" fill=\"none\"/><rect x=\"200\" y=\"14\" width=\"130\" height=\"76\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"207\" y=\"21\" width=\"116\" height=\"62\" rx=\"2\" fill=\"#1b2a38\"/><rect x=\"242\" y=\"38\" width=\"40\" height=\"22\" rx=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"282\" y=\"45\" width=\"4\" height=\"8\" fill=\"#e9ecef\"/><rect x=\"245\" y=\"41\" width=\"12\" height=\"16\" fill=\"#6fe3b5\"/><polygon points=\"266,40 258,51 264,51 260,60 270,47 264,47\" fill=\"#ffd45e\"/><polygon points=\"188,104 342,104 330,90 200,90\" fill=\"#8a96a3\"/><text x=\"70\" y=\"30\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">small phone charger</text><text x=\"265\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the laptop, charging</text></svg><div class=\"cap\">It is charging, just slowly.</div></div>\n\n**Question 8 of 16.** A laptop charges very slowly on a small phone charger, but it does charge.\n\n**What's going on?**\n\n* [[The charger is overheating and about to explode->X8 W]]\n* [[The laptop battery is swollen->X8 W]]\n* [[The lower-watt charger just charges slowly->X8 R]]\n* [[The cable is frayed at the neck->X8 W]]", "X8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **lower-watt charger charges slowly**. USB-C devices agree on how much power to use.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does a lower-watt USB-C charger do to charging speed?\"\n\n[[Try again->X8]]]", "X8 R": "(set: $miss to 0)## ✅ Job done\n**Lower watts means slower charging.** It isn't dangerous, but the right charger is faster.\n\n[[Next question->X9]]", "X9": "<div class=\"scene\">💻 🚪 🔋</div>\n\n**Question 9 of 16.** A family is putting a spare laptop in a closet for six months.\n\n**How charged should the battery be?**\n\n* [[Totally dead, at 0%->X9 W]]\n* [[About half charged->X9 R]]\n* [[Full, at 100%->X9 W]]\n* [[It doesn't matter at all->X9 W]]", "X9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Store it at **about half charge**, somewhere cool and dry.\"\n\n[[Got it->X9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Very full and very empty both add wear while a battery sits.\"\n\n[[Try again->X9]]]", "X9 R": "(set: $miss to 0)## ✅ Job done\n**About half.** Very full or fully dead both stress a battery that sits for months.\n\n[[Next question->X10]]", "X10": "<div class=\"scene\">💻 🎈 ⚠️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"Look at the trackpad's edge.\"><polygon points=\"40,84 52,84 34,10 24,10\" fill=\"#8a96a3\"/><rect x=\"40\" y=\"82\" width=\"290\" height=\"20\" rx=\"4\" fill=\"#8a96a3\"/><polygon points=\"178,83 286,83 286,66\" fill=\"#1b1f24\"/><polygon points=\"176,82 288,64 290,70 178,86\" fill=\"#cfd6dd\" stroke=\"#e9ecef\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"46\" x2=\"289\" y2=\"62\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"289,62 289.8,54.0 296.1,58.4\" fill=\"#ffb347\"/><text x=\"300\" y=\"40\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">the trackpad</text><text x=\"180\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the laptop, from the side</text></svg><div class=\"cap\">Look at the trackpad's edge.</div></div>\n\n**Question 10 of 16.** A laptop's trackpad has started lifting up and clicking oddly.\n\n**What should happen first?**\n\n* [[Press the trackpad down until it stays flat->X10 W]]\n* [[Keep charging it to see if the bump goes away on its own->X10 W]]\n* [[Poke a small hole to let the air out->X10 W]]\n* [[Stop using it, unplug it, and tell a grown-up->X10 R]]", "X10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a likely **swollen battery**. **Stop using it, unplug it, and tell a grown-up.** Never press or puncture it.\"\n\n[[Got it->X10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A lifting trackpad is a warning sign of what?\"\n\n[[Try again->X10]]]", "X10 R": "(set: $miss to 0)## ✅ Job done\n**Stop, unplug, tell a grown-up.** A swollen battery can catch fire if pressed, punctured, or charged.\n\n[[Next question->X11]]", "X11": "<div class=\"scene\"><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"earbud\"><circle cx=\"20\" cy=\"18\" r=\"14\" fill=\"#e9ecef\"/><circle cx=\"13\" cy=\"16\" r=\"6\" fill=\"#5b6573\"/><rect x=\"22\" y=\"22\" width=\"10\" height=\"34\" rx=\"5\" fill=\"#e9ecef\"/></svg> 🏊</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"Look at the label on the box.\"><rect x=\"70\" y=\"10\" width=\"220\" height=\"96\" rx=\"10\" fill=\"#2f6f9e\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"118\" cy=\"48\" r=\"16\" fill=\"#e9ecef\"/><circle cx=\"111\" cy=\"46\" r=\"7\" fill=\"#5b6573\"/><rect x=\"122\" y=\"54\" width=\"11\" height=\"38\" rx=\"5.5\" fill=\"#e9ecef\"/><circle cx=\"168\" cy=\"48\" r=\"16\" fill=\"#e9ecef\"/><circle cx=\"175\" cy=\"46\" r=\"7\" fill=\"#5b6573\"/><rect x=\"153\" y=\"54\" width=\"11\" height=\"38\" rx=\"5.5\" fill=\"#e9ecef\"/><rect x=\"208\" y=\"40\" width=\"68\" height=\"34\" rx=\"6\" fill=\"#ffd45e\"/><text x=\"242\" y=\"64\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">IPX4</text><text x=\"180\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the earbuds' box</text></svg><div class=\"cap\">Look at the label on the box.</div></div>\n\n**Question 11 of 16.** A friend wants to go swimming with earbuds rated IPX4.\n\n**What does IPX4 mean?**\n\n* [[Fully waterproof for swimming laps in a pool->X11 W]]\n* [[Safe for diving up to 4 meters->X11 W]]\n* [[Protected from splashes, not swimming->X11 R]]\n* [[Waterproof for exactly 4 hours->X11 W]]", "X11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**IPX4 means splashes**, like sweat or light rain, not swimming.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say IPX4 covers?\"\n\n[[Try again->X11]]]", "X11 R": "(set: $miss to 0)## ✅ Job done\n**Splashes, not swimming.** And water resistance can wear down over time.\n\n[[Next question->X12]]", "X12": "<div class=\"scene\">🎮 ↖️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Hands off the controller, and the character still moves.\"><path d=\"M20 50 Q30 26 70 30 H130 Q170 26 180 50 L190 92 Q188 106 172 100 L150 80 H50 L28 100 Q12 106 10 92 Z\" fill=\"#4a535d\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><circle cx=\"62\" cy=\"58\" r=\"12\" fill=\"#1b1f24\" stroke=\"#cfd6dd\" stroke-width=\"2\"/><circle cx=\"62\" cy=\"58\" r=\"5\" fill=\"#cfd6dd\"/><circle cx=\"124\" cy=\"70\" r=\"10\" fill=\"#1b1f24\" stroke=\"#cfd6dd\" stroke-width=\"2\"/><circle cx=\"124\" cy=\"70\" r=\"4\" fill=\"#cfd6dd\"/><circle cx=\"150\" cy=\"46\" r=\"5\" fill=\"#6fe3b5\"/><circle cx=\"162\" cy=\"56\" r=\"5\" fill=\"#ff6b6b\"/><circle cx=\"138\" cy=\"56\" r=\"5\" fill=\"#7fd1ff\"/><circle cx=\"150\" cy=\"66\" r=\"5\" fill=\"#ffb347\"/><rect x=\"220\" y=\"10\" width=\"130\" height=\"90\" rx=\"4\" fill=\"#1b2a38\" stroke=\"#5b6573\" stroke-width=\"3\"/><circle cx=\"285\" cy=\"62\" r=\"6\" fill=\"#ffd45e\"/><line x1=\"285\" y1=\"68\" x2=\"285\" y2=\"84\" stroke=\"#ffd45e\" stroke-width=\"3\"/><line x1=\"285\" y1=\"84\" x2=\"278\" y2=\"94\" stroke=\"#ffd45e\" stroke-width=\"3\"/><line x1=\"285\" y1=\"84\" x2=\"292\" y2=\"94\" stroke=\"#ffd45e\" stroke-width=\"3\"/><line x1=\"285\" y1=\"52\" x2=\"285\" y2=\"24\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"285,24 288.8,31.0 281.2,31.0\" fill=\"#6fe3b5\"/><text x=\"100\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">nobody touching it</text><text x=\"285\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">on screen</text></svg><div class=\"cap\">Hands off the controller, and the character still moves.</div></div>\n\n**Question 12 of 16.** A gamer's character keeps slowly walking forward even when nobody touches the controller.\n\n**What is this called?**\n\n* [[Stick drift->X12 R]]\n* [[Input lag->X12 W]]\n* [[Button ghosting->X12 W]]\n* [[Screen tearing->X12 W]]", "X12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **stick drift**: the thumbstick reports movement when it's untouched.\"\n\n[[Got it->X12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The thumbstick reports movement that isn't happening...\"\n\n[[Try again->X12]]]", "X12 R": "(set: $miss to 0)## ✅ Job done\n**Stick drift.** It's often worn parts or dust in the stick. Clean, calibrate, then check the warranty.\n\n[[Next question->X13]]", "X13": "<div class=\"scene\">🐈 ⌨️</div>\n\n**Question 13 of 16.** A cat walked across a keyboard while its owner was getting a snack and typed nonsense into an essay.\n\n**What's the best habit to prevent it?**\n\n* [[Turn the brightness all the way down->X13 W]]\n* [[Lock the screen when stepping away->X13 R]]\n* [[Leave a heavy book on the keyboard->X13 W]]\n* [[Unplug the mouse before leaving->X13 W]]", "X13 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Lock the screen** when you step away. Windows key + L works on Windows.\"\n\n[[Got it->X13 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What shortcut did I show you for stepping away?\"\n\n[[Try again->X13]]]", "X13 R": "(set: $miss to 0)## ✅ Job done\n**Lock the screen.** Paws can't type into a locked computer. (And never pile books on a laptop!)\n\n[[Next question->X14]]", "X14": "<div class=\"scene\">🚿 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Where the laptop sits during a shower.\"><rect x=\"14\" y=\"8\" width=\"96\" height=\"104\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"34\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><circle cx=\"40\" cy=\"38\" r=\"7\" fill=\"#9aa4ae\"/><path d=\"M70 80 q-8 -12 0 -24 t0 -24 t0 -20\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" opacity=\"0.7\"/><path d=\"M84 80 q-8 -12 0 -24 t0 -24 t0 -20\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" opacity=\"0.7\"/><path d=\"M98 80 q-8 -12 0 -24 t0 -24 t0 -20\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" opacity=\"0.7\"/><path d=\"M112 80 q-8 -12 0 -24 t0 -24 t0 -20\" stroke=\"#cfd6dd\" stroke-width=\"3\" fill=\"none\" opacity=\"0.7\"/><rect x=\"150\" y=\"92\" width=\"200\" height=\"20\" rx=\"3\" fill=\"#b8b0a2\"/><rect x=\"198\" y=\"28\" width=\"100\" height=\"56\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"205\" y=\"35\" width=\"86\" height=\"42\" rx=\"2\" fill=\"#1b2a38\"/><polygon points=\"186,98 310,98 298,84 198,84\" fill=\"#8a96a3\"/><text x=\"62\" y=\"127\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">hot shower</text><text x=\"250\" y=\"127\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the laptop on the counter</text></svg><div class=\"cap\">Where the laptop sits during a shower.</div></div>\n\n**Question 14 of 16.** Someone keeps their laptop on the bathroom counter during hot showers.\n\n**Why is that a problem?**\n\n* [[The mirror reflects too much light->X14 W]]\n* [[Bathrooms block the Wi-Fi signal->X14 W]]\n* [[The sound of water drains the battery->X14 W]]\n* [[Steam condenses into water inside it->X14 R]]", "X14 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Steam condenses** into tiny water drops, inside the laptop too.\"\n\n[[Got it->X14 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does steam turn into when it touches something cooler?\"\n\n[[Try again->X14]]]", "X14 R": "(set: $miss to 0)## ✅ Job done\n**Steam condenses inside.** Moisture causes shorts and corrosion over time.\n\n[[Next question->X15]]", "X15": "<div class=\"scene\">🚗 ❄️ 💻</div>\n\n**Question 15 of 16.** A laptop rode home in a freezing car and feels icy cold.\n\n**What should you do before turning it on?**\n\n* [[Turn it on right away to warm it up->X15 W]]\n* [[Put it near a heater to speed things up->X15 W]]\n* [[Wait until it reaches room temperature->X15 R]]\n* [[Put it in the fridge to keep it steady->X15 W]]", "X15 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Wait until it's room temperature.** Condensation can form inside a cold device, and you don't want power on that.\"\n\n[[Got it->X15 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What forms on cold things in a warm room?\"\n\n[[Try again->X15]]]", "X15 R": "(set: $miss to 0)## ✅ Job done\n**Let it warm up on its own first.** Condensation inside plus power can cause damage.\n\n[[Next question->X16]]", "X16": "<div class=\"scene\">🎒 💻</div>\n\n**Question 16 of 16.** You're about to slide your laptop into your backpack between classes.\n\n**What should you do first?**\n\n* [[Shut it down or make sure it's asleep->X16 R]]\n* [[Turn the brightness all the way up->X16 W]]\n* [[Leave a game running to save time->X16 W]]\n* [[Open the lid a little so it can breathe->X16 W]]", "X16 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Shut it down or make sure it's really asleep.** A laptop running in a bag overheats.\"\n\n[[Got it->X16 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What happens to a laptop that keeps running in a closed bag?\"\n\n[[Try again->X16]]]", "X16 R": "(set: $miss to 0)## ✅ Job done\n**Shut down or sleep first.** A running laptop in a closed bag has nowhere to send its heat.\n\n[[See your results->Certificate]]", "Certificate": "# 🏅 Senior Technician: Unit 2 Complete\n\n<div class=\"scene\">🏅 🎉 🛠️</div>\n\n*The Inspector hands you a heavier badge.* \"Heat, dust, power, moisture, bumps. You know the five enemies, and you know *why*. That's a technician.\"\n\n**Your Unit 2 kit:** 📒 Tech Notebook · 🖥️ Screen Kit · 🌡️ Heat Detector · 🔌 Cable Kit · 🔋 Battery Tester · 🎧 Gear Bag · 🐾 Hazard Map · 🎒 Travel Case\n\n*Unit 3: When Things Go Wrong, coming soon.*\n\n[[Back to the work schedule->Shop]]"}};
(function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly and unlocks the days before it (for links from course modules)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),...Object.keys(STORY.passages).map(k=>(k.match(/^D(\d+) Start$/)||[])[1]).filter(Boolean)]));show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];show('D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
