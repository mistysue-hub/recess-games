ging chargers** when you're not using them.\n* A cable with chewed insulation (the rubbery outer coating) or wires showing is finished. **Don't tape it and keep using it.** Replace it.\n\n<div class=\"warn\">**Grown-up needed:** If a cable is chewed while plugged in, a grown-up unplugs it at the wall without touching the damaged part. If the pet seems hurt, call a vet.</div>\n\n### The table-top troublemaker\n* Cats knock things off tables to see what happens. A cup next to a laptop is an experiment waiting to start.\n\n### The Drink Zone and Sticky Fingers\n### The drink zone\n* Most spills aren't dropped drinks. They're **knocked** drinks: an elbow, a sleeve, a hand reaching for the mouse.\n* The **knock zone** is the area right beside and in front of your keyboard and mouse, where your arms swing while you work.\n* Best: keep drinks on a **separate surface**, like a side table or shelf. Next best: on the desk but **outside the knock zone**, behind the screen or well off to the side.\n* Use a cup with a **lid**. A lidded travel mug or water bottle turns a disaster into a shrug.\n\n### Food\n* **Eat away from the keyboard.** Crumbs fall between keys and jam them, and greasy fingers leave a film on keys and screens.\n\n### Sticky little hands\n* Young kids love screens. They also have fingers that have recently been in jam, mud, or a nose.\n* **Wash hands first**, every time. **Supervise**: a grown-up or older sibling sits with them. A **kid-safe case** (a thick, rubbery case with a handle) protects a tablet from drops.\n\n### Lock it when you leave\n* Siblings are curious. An unlocked computer can send a \"funny\" message to your teacher. **Windows key + L** (or Control + Command + Q on a Mac) works on brothers, too.\n\n### Location, Location, Location\n### Keep it away from\n* **Heaters and radiators:** they bake the machine from the outside, so it can't cool itself. Most laptops are designed to run in rooms from about **50° to 95° F (10° to 35° C)**. Right next to a heater, it can get much hotter than the room.\n* **Sunny windowsills:** direct sun heats a dark case fast, and heat wears out batteries.\n* **Steamy bathrooms:** steam is water vapor. When it hits cooler metal and circuit boards, it **condenses** (turns back into liquid water), right on the electronics.\n* **Kitchens:** steam from cooking, plus tiny drops of **grease** in the air that settle on vents and keys and trap dust.\n\n### Stable ground\n* Use a **sturdy, flat surface**, not a wobbly shelf, a stack of books, or the edge of a table. Keep the device away from edges, and **never above water** like a fish tank or a sink.\n\n### Cables\n* A cable stretched across a walkway is a **trip hazard**. Someone gets hurt, and the laptop gets yanked off the table.\n* Run cables **along the wall** or behind furniture, or charge where the cord doesn't cross a path. **Don't hide cords under rugs**: they can't release heat there, and stepping on them damages the wires.\n\n### Static in winter\n* Dry winter air plus carpet plus socks equals **static electricity**. That zap can hurt sensitive electronics.\n* **Touch something metal first** (like a metal lamp base or a doorknob) to discharge yourself before you touch ports, cards, or the inside of anything.\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 8->D8 Start]]", "D8 Start": "(set: $miss to 0)# Day 8: On the Move\n\n*The Inspector drops a backpack on the counter. It lands with a crunch. She winces.*\n\n\"Laptops, tablets, and phones are built to travel. They are *not* built to be tossed, baked, frozen, or soaked. Most of the travel damage I see comes from a few habits that take ten seconds to fix.\"\n\n\"Today: how to pack it, how to carry it, what weather does to it, how to store it, and what to do after a drop. By the end, you'll write a checklist you can use every time you leave the house.\"\n\n\n[[Open the shop->D8 L1]]", "D8 L1": "## 📘 The Inspector's lesson: Packing and Carrying\n\n*The Inspector unzips a backpack with a padded laptop pocket and slides a laptop in like a letter into an envelope.*\n\n### Pack it right\n* Use a **padded sleeve** or a bag's **laptop compartment**. Padding spreads out bumps so they don't hit one spot.\n* **Nothing heavy pressing on the lid.** A thick textbook on top of a laptop presses the screen down onto the keyboard. Laptop screens are thin glass, and they crack.\n* Check the keyboard before you close the lid: a pencil, earbuds, or a paper clip left on the keys gets pressed into the screen.\n* **Don't toss the bag.** Set it down. A drop inside a bag is still a drop.\n\n### Carry it right\n* Carry a laptop **closed, by the base**. Never pick it up or walk around holding it **by the screen**. The hinges and the screen aren't built to hold the laptop's weight.\n* Moving across the room with it open? Hold the **base** with both hands.\n\n### Asleep... or just pretending?\n* Before you bag it, **shut it down**, or check that it's **really asleep**. Sometimes a laptop doesn't sleep when the lid closes: an update, a running program, or a setting keeps it awake.\n* A laptop that's **running in a closed bag** has nowhere to send its heat. It gets hot, drains its battery, and the heat wears the battery out faster.\n* Quick check: after you close the lid, is the fan still spinning, or is it getting warm? If so, open it and shut it down properly.\n\n\n[[Got it. Send in the next customer->D8 J2]]", "D8 J2": "**Dev** closed his laptop lid and stuffed it into his backpack before school. At 3 p.m. he pulls it out. It's hot to the touch, and the battery is completely dead.\n\n**What most likely happened?**\n\n* [[The backpack trapped heat from the sun on his walk->D8 J2 W]]\n* [[Closing the lid made the battery charge itself too much->D8 J2 W]]\n* [[It never went to sleep and ran all day in the bag->D8 J2 R]]\n* [[The battery is old and failed during the school day->D8 J2 W]]", "D8 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"It **never went to sleep**. It ran all day with nowhere for the heat to go, and that drained the battery. **Shut it down, or make sure it's really asleep, before you bag it.**\"\n\n[[Got it->D8 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Hot *and* dead after sitting in a bag all day. What was it doing in there?\"\n\n[[Try again->D8 J2]]]", "D8 J2 R": "(set: $miss to 0)## ✅ Job done\n**It kept running in the bag.** A closed bag traps heat, and a running laptop burns through its battery. Next time: shut it down, or wait a moment after closing the lid and check that it's cool and quiet before packing it.\n\n[[Next customer->D8 J3]]", "D8 J3": "**Kai** carried his laptop in his backpack all week with his science textbook stacked right on top of it. Today he opened it to find a spiderweb crack across the screen, and he never dropped it once.\n\n**What caused the crack, and how should he pack next time?**\n\n* [[Pressure from the book; pad it and keep nothing on top->D8 J3 R]]\n* [[A loose screen hinge; tighten the hinge screws himself->D8 J3 W]]\n* [[Cold weather made the glass brittle; keep it warm in winter->D8 J3 W]]\n* [[Too much screen brightness; turn it down to save it->D8 J3 W]]", "D8 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Every bump pushed that heavy book down on the lid, and the lid pressed the screen against the keyboard. **Pressure cracks screens.** Padded sleeve, laptop compartment, and **nothing heavy on top**.\"\n\n[[Got it->D8 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where was that textbook sitting? What's under a laptop's lid when it's closed?\"\n\n[[Try again->D8 J3]]]", "D8 J3 R": "(set: $miss to 0)## ✅ Job done\n**Heavy things on the lid crack screens.** The glass gets squeezed between the book and the keys with every step. A padded compartment and nothing stacked on top keeps the pressure off.\n\n[[Next customer->D8 J4]]", "D8 J4": "**Jayden** walks between classrooms holding his laptop open, gripping it by the top corner of the screen. \"It's faster than closing it,\" he says.\n\n**What should he do instead?**\n\n* [[Keep holding it by the screen, but use both hands->D8 J4 W]]\n* [[Close it and carry it by the base, or hold the base->D8 J4 R]]\n* [[Carry it open, but tilt the screen all the way back->D8 J4 W]]\n* [[Hold it by one corner of the keyboard for balance->D8 J4 W]]", "D8 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The screen and hinges aren't made to hold the whole laptop. **Carry it closed, by the base**, or hold the base with both hands if it has to stay open.\"\n\n[[Got it->D8 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which part of the laptop is built to hold its weight?\"\n\n[[Try again->D8 J4]]]", "D8 J4 R": "(set: $miss to 0)## ✅ Job done\n**Carry it by the base, not the screen.** The hinges and the thin screen take all the strain when you hold a laptop by its lid. That's how hinges loosen and screens crack.\n\n[[The Inspector has something to show you->D8 L5]]", "D8 L5": "## 📘 The Inspector's lesson: Heat, Cold, and Rain\n\n*The Inspector holds up a tablet with a temperature warning on its screen.* \"Weather. The great equalizer.\"\n\n### Hot cars\n* **Never leave a device in a parked car.** On a warm day, the inside of a car gets much hotter than the air outside.\n* Heat above about **95° F (35° C)** can **permanently** reduce how much charge a battery can hold. Heat can also damage screens.\n* If a device gets too hot, many will show a warning and refuse to work. Move it somewhere cool and **let it cool down on its own**. No freezer, no fridge: a sudden temperature change can cause condensation.\n\n### Cold to warm: wait for it\n* Bring a cold device into a warm room, and the warm air **condenses** on the cold parts, outside *and* inside. That's the same thing that fogs up glasses when you come in from the cold.\n* **Let it warm up to room temperature before turning it on.** Leave it closed and off. After a freezing car, that can take **an hour or more**. It's ready when it no longer feels cool to the touch.\n* Don't speed it up with a hair dryer or a heater. Fast heating makes more condensation, not less.\n\n### Rain and backpacks\n* Most backpacks are **water-resistant, not waterproof**. Water soaks through seams and outside pockets.\n* Keep devices in an **inside pocket**, in a sleeve, or in a zip-top bag on rainy days. A rain cover for your backpack helps too.\n* If a device gets wet: **power it off**, dry the outside, and **don't charge it until it's completely dry**. Don't use a hair dryer, and skip the rice (it doesn't work, and the grains get stuck in ports).\n\n<div class=\"warn\">**Grown-up needed:** If a device got soaked, a grown-up decides when it's dry enough to charge. Charging a wet device can damage it or cause a short circuit.</div>\n\n\n[[Got it. Send in the next customer->D8 J6]]", "D8 J6": "**Ms. Rivera** left her tablet on the passenger seat during a long July errand. When she gets back, the screen shows a temperature warning and it won't do anything.\n\n**What should she do now?**\n\n* [[Put it in the freezer for a few minutes to cool it fast->D8 J6 W]]\n* [[Plug it in to charge, since the heat drained the battery->D8 J6 W]]\n* [[Keep tapping the screen until the warning goes away->D8 J6 W]]\n* [[Move it somewhere cool and let it cool down on its own->D8 J6 R]]", "D8 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Let it cool down on its own** somewhere cool and shaded. A freezer is a sudden temperature swing, which can cause condensation inside. And next time it doesn't stay in the car.\"\n\n[[Got it->D8 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Slow and steady. What did I say about freezers and sudden changes?\"\n\n[[Try again->D8 J6]]]", "D8 J6 R": "(set: $miss to 0)## ✅ Job done\n**Cool it gradually, then never leave it in a parked car.** The warning is the tablet protecting itself. Freezing it fast risks condensation, and charging adds even more heat. Heat over about 95° F can permanently shrink battery capacity.\n\n[[Next customer->D8 J7]]", "D8 J7": "**Mr. Patel** left his laptop in the car overnight in January. He brought it inside, opened it right away, and turned it on. The screen looks foggy around the edges.\n\n**What should he have done?**\n\n* [[Turned it on right away so its own warmth dries it out fast->D8 J7 W]]\n* [[Warmed it up quickly with a hair dryer on low->D8 J7 W]]\n* [[Set it by the heater vent so it warms up faster->D8 J7 W]]\n* [[Left it closed and off until it reached room temperature->D8 J7 R]]", "D8 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Warm room air **condenses** on cold parts, inside the laptop too. **Leave it closed and off until it's room temperature.** After a freezing night, that can be an hour or more. Fast heating just makes more condensation.\"\n\n[[Got it->D8 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What happens when warm, moist air meets cold parts? And how long did I say to wait?\"\n\n[[Try again->D8 J7]]]", "D8 J7 R": "(set: $miss to 0)## ✅ Job done\n**Let it warm up slowly, closed and off.** Condensation is water, and water plus power can short out circuits. He should power it off now and let it warm up and dry before trying again.\n\n[[Next customer->D8 J8]]", "D8 J8": "**Nora** walked home in a downpour. Her phone was in the outside pocket of her backpack, which is now dripping. The phone is still on, and it's wet all over.\n\n**What should she do?**\n\n* [[Plug it in right away so it doesn't die while wet->D8 J8 W]]\n* [[Power it off, dry the outside, and don't charge it yet->D8 J8 R]]\n* [[Bury it in a bowl of dry rice overnight to pull water out->D8 J8 W]]\n* [[Blow-dry the charging port on high until it's warm->D8 J8 W]]", "D8 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Power off, dry the outside, and don't charge it** until it's completely dry. No rice and no hair dryer. And on rainy days, phones go in an inside pocket.\"\n\n[[Got it->D8 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say to do first with a wet device, and what to wait on?\"\n\n[[Try again->D8 J8]]]", "D8 J8 R": "(set: $miss to 0)## ✅ Job done\n**Off, dry, and no charging yet.** Charging a wet phone can cause a short circuit. Rice doesn't speed drying and leaves grains in ports, and a hair dryer's heat can damage parts. An inside pocket or a zip-top bag would have saved the day.\n\n[[The Inspector has something to show you->D8 L9]]", "D8 L9": "## 📘 The Inspector's lesson: Storage and Accidents\n\n*The Inspector opens a drawer labeled \"SUMMER\" and pulls out a laptop.* \"Let's talk about the long naps and the bad falls.\"\n\n### Long-term storage\n* Storing a device for weeks or months, like over summer break? Charge it to **about half (around 50%)**, then **power it off**.\n* Store it in a **cool, dry place**. Apple recommends below about **90° F (32° C)**. A hot attic, a garage, or a car trunk is out.\n* Why half? Storing a battery at **0%** can let it drain so low it never charges again. Storing at **100%** for a long time wears the battery out faster.\n* Storing longer than about **six months**? Charge it back up to about half every six months.\n\n### After a drop: check, then watch\n**Stop right away** if you see any of these:\n* A **burning or chemical smell**, **sparks**, **smoke**, or a **bulging battery** (the case, keyboard, or trackpad pushed up or out of shape).\n* Power it off, **don't charge it**, keep it away from anything that can burn, and get a professional.\n\n**If none of those**, it may be fine, but check:\n1. Look for **cracks** in the case and screen, and test the **hinge**: does it still open smoothly and hold its position?\n2. **Back up your files** right away, while it's working.\n3. **Watch for new problems** over the next few days. Flickering screens, keys that stop working, or a battery that drops suddenly can mean a cable inside got knocked loose.\n\n### When to call a pro\n* A **cracked case**, a case that has popped open, or anything that needs opening goes to a **professional**. Don't pry it open yourself.\n\n<div class=\"warn\">**Grown-up needed:** A swollen battery, a burning smell, or sparks means a grown-up takes over. Don't press on the swelling, don't charge it, and get it to a professional or a battery recycler.</div>\n\n\n[[Got it. Send in the next customer->D8 J10]]", "D8 J10": "**Ava** dropped her laptop down half a flight of stairs. She picks it up, opens it, and it turns on like normal. There's no smell, no sparks, and nothing is bulging. \"Phew! Nothing wrong!\"\n\n**What should she do now?**\n\n* [[Back up files, check for cracks and hinge damage, and watch it->D8 J10 R]]\n* [[Nothing else, since it turned on and works like normal right now->D8 J10 W]]\n* [[Open the bottom case herself and look for parts that came loose->D8 J10 W]]\n* [[Drop it again from a lower step to test whether it's really fine->D8 J10 W]]", "D8 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lucky Ava. Now **check for cracks and hinge damage, back up her files, and watch for new problems.** A loose cable inside might not act up until days later.\"\n\n[[Got it->D8 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"No danger signs, so it *may* be fine. What were the three checks I gave you?\"\n\n[[Try again->D8 J10]]]", "D8 J10 R": "(set: $miss to 0)## ✅ Job done\n**Check, back up, and watch.** Drops can loosen cables inside without showing any damage right away. Backing up now protects her work if something fails later. Opening the case is a job for a professional.\n\n[[Next customer->D8 J11]]", "D8 J11": "**Grandpa Leo's** laptop slid off the arm of the couch and hit the floor. A day later the trackpad is pushed up and won't click, the bottom looks puffy, and there's a faint sweet chemical smell.\n\n**What should happen?**\n\n* [[Press the trackpad firmly back into place and keep using it->D8 J11 W]]\n* [[Charge it fully overnight so the battery can settle down->D8 J11 W]]\n* [[Power it off, don't charge it, and get it to a professional->D8 J11 R]]\n* [[Keep using it, but only on a hard table instead of the couch->D8 J11 W]]", "D8 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A trackpad pushed up and a puffy bottom mean a **swollen battery**, and a chemical smell is a danger sign. **Power off, don't charge, don't press on it**, and a grown-up gets it to a professional.\"\n\n[[Got it->D8 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A puffy case and a chemical smell. Which list was that on?\"\n\n[[Try again->D8 J11]]]", "D8 J11 R": "(set: $miss to 0)## ✅ Job done\n**Swollen battery: stop using it.** Swelling means the battery is damaged inside, and pressing on it or charging it can make it worse, even cause a fire. A professional can replace it and recycle the old one safely.\n\n[[Next customer->D8 J12]]", "D8 J12": "**Ms. Abara's** son is putting his school laptop away for summer break. \"I'll charge it to 100% so it's ready in the fall,\" he says, \"and stick it in the garage.\"\n\n**What's the right way to store it?**\n\n* [[Charge it to 100% and keep it plugged in all summer->D8 J12 W]]\n* [[Let it run down to 0% so the battery can rest->D8 J12 W]]\n* [[Charge to about half, power off, and store it cool and dry->D8 J12 R]]\n* [[Charge it full, then store it in the garage inside its padded bag->D8 J12 W]]", "D8 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**About half charged, powered off, in a cool, dry place.** Full for months wears the battery, empty can let it drain too low to recover, and a garage in July is an oven.\"\n\n[[Got it->D8 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What charge level did I give for long naps? And is a summer garage *cool*?\"\n\n[[Try again->D8 J12]]]", "D8 J12 R": "(set: $miss to 0)(if: $days does not contain \"8\")[(set: $days to it + (a: \"8\"))]## ✅ Job done\n**About 50%, off, cool and dry.** That's the gentlest way for a lithium-ion battery to wait. If he stores it longer than six months, he should top it back up to half.\n\n[[Close up shop->D8 Done]]", "D8 Done": "(if: $days does not contain \"8\")[(set: $days to it + (a: \"8\"))]# Day 8 complete!\n\n<div class=\"tool\">🎒 **New tool earned: Travel Case**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Pack your bag with your device the right way: shut it down (or check that it's truly asleep), check the keyboard for stray pencils or earbuds, slide it into a padded sleeve or laptop compartment, and keep heavy books off the lid. Then open your **Tech Notebook** and write a **\"Before I Travel\" checklist** of at least six steps, using today's lessons. Include what you'll do about weather, like hot cars, cold cars, and rain. Ask a grown-up to read your checklist and add one thing.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Packing and Carrying\n### Pack it right\n* Use a **padded sleeve** or a bag's **laptop compartment**. Padding spreads out bumps so they don't hit one spot.\n* **Nothing heavy pressing on the lid.** A thick textbook on top of a laptop presses the screen down onto the keyboard. Laptop screens are thin glass, and they crack.\n* Check the keyboard before you close the lid: a pencil, ear **water-resistant, not waterproof**. Water soaks through seams and outside pockets.\n* Keep devices in an **inside pocket**, in a sleeve, or in a zip-top bag on rainy days. A rain cover for your backpack helps too.\n* If a device gets wet: **power it off**, dry the outside, and **don't charge it until it's completely dry**. Don't use a hair dryer, and skip the rice (it doesn't work, and the grains get stuck in ports).\n\n<div class=\"warn\">**Grown-up needed:** If a device got soaked, a grown-up decides when it's dry enough to charge. Charging a wet device can damage it or cause a short circuit.</div>\n\n### Storage and Accidents\n### Long-term storage\n* Storing a device for weeks or months, like over summer break? Charge it to **about half (around 50%)**, then **power it off**.\n* Store it in a **cool, dry place**. Apple recommends below about **90° F (32° C)**. A hot attic, a garage, or a car trunk is out.\n* Why half? Storing a battery at **0%** can let it drain so low it never charges again. Storing at **100%** for a long time wears the battery out faster.\n* Storing longer than about **six months**? Charge it back up to about half every six months.\n\n### After a drop: check, then watch\n**Stop right away** if you see any of these:\n* A **burning or chemical smell**, **sparks**, **smoke**, or a **bulging battery** (the case, keyboard, or trackpad pushed up or out of shape).\n* Power it off, **don't charge it**, keep it away from anything that can burn, and get a professional.\n\n**If none of those**, it may be fine, but check:\n1. Look for **cracks** in the case and screen, and test the **hinge**: does it still open smoothly and hold its position?\n2. **Back up your files** right away, while it's working.\n3. **Watch for new problems** over the next few days. Flickering screens, keys that stop working, or a battery that drops suddenly can mean a cable inside got knocked loose.\n\n### When to call a pro\n* A **cracked case**, a case that has popped open, or anything that needs opening goes to a **professional**. Don't pry it open yourself.\n\n<div class=\"warn\">**Grown-up needed:** A swollen battery, a burning smell, or sparks means a grown-up takes over. Don't press on the swelling, don't charge it, and get it to a professional or a battery recycler.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Take the Unit 2 Exam->Exam Start]]", "Exam Start": "(set: $miss to 0)# 🎓 The Inspector's Unit 2 Exam\n\n*The Inspector sets down a thick clipboard.* \"Sixteen questions, two from each day. Some of these customers have more than one thing going on, so read carefully. Same rule as always: miss twice and I'll show you.\"\n\n[[Begin->X1]]", "X1": "**Question 1 of 16.** A laptop slid off the arm of a couch, and now there's a crack across the screen.\n\n**Which of the five enemies caused it?**\n\n* [[Heat building up inside the case->X1 W]]\n* [[Dust clogging the vents and fans->X1 W]]\n* [[Moisture getting into the circuits->X1 W]]\n* [[Bumps and pressure on the device->X1 R]]", "X1 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A fall is the **bumps and pressure** enemy. It cracks screens and loosens connections.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Five enemies: heat, dust, power, moisture, bumps. Which one is a fall?\"\n\n[[Try again->X1]]]", "X1 R": "(set: $miss to 0)## ✅ Job done\n**Bumps and pressure.** Drops and weight crack screens and can loosen parts inside.\n\n[[Next question->X2]]", "X2": "**Question 2 of 16.** A customer asks why a little dust inside a computer is a big deal.\n\n**What's the main reason?**\n\n* [[Dust makes the screen look dimmer->X2 W]]\n* [[Dust traps heat, so parts run hotter->X2 R]]\n* [[Dust drains the battery while it sleeps overnight->X2 W]]\n* [[Dust slows down the Wi-Fi signal->X2 W]]", "X2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Dust **traps heat**. It coats parts and clogs vents and fans, so everything runs hotter.\"\n\n[[Got it->X2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about what dust does to the airflow path.\"\n\n[[Try again->X2]]]", "X2 R": "(set: $miss to 0)## ✅ Job done\n**Dust traps heat.** It blankets parts and blocks airflow, and heat is what wears electronics out.\n\n[[Next question->X3]]", "X3": "**Question 3 of 16.** A customer's OLED TV shows a faint ghost of a game's health bar, even on other shows.\n\n**What caused it?**\n\n* [[A weak or loose HDMI cable->X3 W]]\n* [[Fingerprints and smudges on the screen's coating->X3 W]]\n* [[A static image left on screen for a long time->X3 R]]\n* [[Glare from a window behind the couch->X3 W]]", "X3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"OLED pixels light themselves, and pixels that show the **same image for a long time** wear unevenly. That's burn-in.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's special about how OLED pixels work?\"\n\n[[Try again->X3]]]", "X3 R": "(set: $miss to 0)## ✅ Job done\n**A static image shown for a long time.** OLED pixels age with use, so a health bar that never moves can leave a ghost behind.\n\n[[Next question->X4]]", "X4": "**Question 4 of 16.** You're teaching a new trainee how to open a laptop lid.\n\n**What's the right way?**\n\n* [[Open it from the center of the lid->X4 R]]\n* [[Flip it open by grabbing one corner->X4 W]]\n* [[Lift it by the edge of the screen->X4 W]]\n* [[Pry it open with a fingernail->X4 W]]", "X4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Open from the **center of the lid**. One corner twists the screen and wears out one hinge.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about hinges and corners?\"\n\n[[Try again->X4]]]", "X4 R": "(set: $miss to 0)## ✅ Job done\n**From the center of the lid.** Opening by one corner twists the screen and strains one hinge.\n\n[[Next question->X5]]", "X5": "**Question 5 of 16.** A gaming laptop suddenly drops from smooth to choppy halfway through a match, and its fans are roaring.\n\n**What is happening?**\n\n* [[The game's servers are lagging far away->X5 W]]\n* [[Thermal throttling: it's slowing itself to cool off->X5 R]]\n* [[The keyboard is sending too many keypresses->X5 W]]\n* [[The screen's refresh rate quietly changed all by itself->X5 W]]", "X5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **thermal throttling**: the processor slows itself down to cool off.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Loud fans plus a sudden slowdown. What does a hot processor do to protect itself?\"\n\n[[Try again->X5]]]", "X5 R": "(set: $miss to 0)## ✅ Job done\n**Thermal throttling.** When the processor gets too hot, it slows itself to make less heat.\n\n[[Next question->X6]]", "X6": "**Question 6 of 16.** You're blowing dust out of a laptop's vent with compressed air.\n\n**What should you do with the fan?**\n\n* [[Let it spin as fast as the air can push it->X6 W]]\n* [[Spray the fan with alcohol first->X6 W]]\n* [[Pull the fan out of the laptop->X6 W]]\n* [[Hold it still so it can't over-spin->X6 R]]", "X6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Hold the fan still** with a toothpick so the air can't over-spin it and damage the bearing.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What happens to a fan's bearing when air spins it way too fast?\"\n\n[[Try again->X6]]]", "X6 R": "(set: $miss to 0)## ✅ Job done\n**Hold it still.** An over-spun fan can damage its bearing and start to whine.\n\n[[Next question->X7]]", "X7": "**Question 7 of 16.** Someone says, \"My power strip protects my PC from power surges.\"\n\n**What do you tell them?**\n\n* [[A plain strip just adds outlets; a surge protector absorbs spikes->X7 R]]\n* [[Correct, every power strip with an on/off switch blocks all surges->X7 W]]\n* [[Surges only matter for TVs, not computers->X7 W]]\n* [[Any strip works if it's plugged in upside down->X7 W]]", "X7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A plain **power strip just adds outlets**. A **surge protector** has parts inside that absorb voltage spikes.\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Is every power strip a surge protector?\"\n\n[[Try again->X7]]]", "X7 R": "(set: $miss to 0)## ✅ Job done\n**A power strip only adds outlets.** A surge protector absorbs spikes. Look for a UL listing and a joule rating.\n\n[[Next question->X8]]", "X8": "**Question 8 of 16.** A laptop charges very slowly on a small phone charger, but it does charge.\n\n**What's going on?**\n\n* [[The charger is overheating and about to explode->X8 W]]\n* [[The laptop battery is swollen->X8 W]]\n* [[The lower-watt charger just charges slowly->X8 R]]\n* [[The cable is frayed at the neck->X8 W]]", "X8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **lower-watt charger charges slowly**. USB-C devices agree on how much power to use.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does a lower-watt USB-C charger do to charging speed?\"\n\n[[Try again->X8]]]", "X8 R": "(set: $miss to 0)## ✅ Job done\n**Lower watts means slower charging.** It isn't dangerous, but the right charger is faster.\n\n[[Next question->X9]]", "X9": "**Question 9 of 16.** A family is putting a spare laptop in a closet for six months.\n\n**How charged should the battery be?**\n\n* [[Totally dead, at 0%->X9 W]]\n* [[About half charged->X9 R]]\n* [[Full, at 100%->X9 W]]\n* [[It doesn't matter at all->X9 W]]", "X9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Store it at **about half charge**, somewhere cool and dry.\"\n\n[[Got it->X9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Very full and very empty both add wear while a battery sits.\"\n\n[[Try again->X9]]]", "X9 R": "(set: $miss to 0)## ✅ Job done\n**About half.** Very full or fully dead both stress a battery that sits for months.\n\n[[Next question->X10]]", "X10": "**Question 10 of 16.** A laptop's trackpad has started lifting up and clicking oddly.\n\n**What should happen first?**\n\n* [[Press the trackpad down until it stays flat->X10 W]]\n* [[Keep charging it to see if the bump goes away on its own->X10 W]]\n* [[Poke a small hole to let the air out->X10 W]]\n* [[Stop using it, unplug it, and tell a grown-up->X10 R]]", "X10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a likely **swollen battery**. **Stop using it, unplug it, and tell a grown-up.** Never press or puncture it.\"\n\n[[Got it->X10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A lifting trackpad is a warning sign of what?\"\n\n[[Try again->X10]]]", "X10 R": "(set: $miss to 0)## ✅ Job done\n**Stop, unplug, tell a grown-up.** A swollen battery can catch fire if pressed, punctured, or charged.\n\n[[Next question->X11]]", "X11": "**Question 11 of 16.** A friend wants to go swimming with earbuds rated IPX4.\n\n**What does IPX4 mean?**\n\n* [[Fully waterproof for swimming laps in a pool->X11 W]]\n* [[Safe for diving up to 4 meters->X11 W]]\n* [[Protected from splashes, not swimming->X11 R]]\n* [[Waterproof for exactly 4 hours->X11 W]]", "X11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**IPX4 means splashes**, like sweat or light rain, not swimming.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say IPX4 covers?\"\n\n[[Try again->X11]]]", "X11 R": "(set: $miss to 0)## ✅ Job done\n**Splashes, not swimming.** And water resistance can wear down over time.\n\n[[Next question->X12]]", "X12": "**Question 12 of 16.** A gamer's character keeps slowly walking forward even when nobody touches the controller.\n\n**What is this called?**\n\n* [[Stick drift->X12 R]]\n* [[Input lag->X12 W]]\n* [[Button ghosting->X12 W]]\n* [[Screen tearing->X12 W]]", "X12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **stick drift**: the thumbstick reports movement when it's untouched.\"\n\n[[Got it->X12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The thumbstick reports movement that isn't happening...\"\n\n[[Try again->X12]]]", "X12 R": "(set: $miss to 0)## ✅ Job done\n**Stick drift.** It's often worn parts or dust in the stick. Clean, calibrate, then check the warranty.\n\n[[Next question->X13]]", "X13": "**Question 13 of 16.** A cat walked across a keyboard while its owner was getting a snack and typed nonsense into an essay.\n\n**What's the best habit to prevent it?**\n\n* [[Turn the brightness all the way down->X13 W]]\n* [[Lock the screen when stepping away->X13 R]]\n* [[Leave a heavy book on the keyboard->X13 W]]\n* [[Unplug the mouse before leaving->X13 W]]", "X13 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Lock the screen** when you step away. Windows key + L works on Windows.\"\n\n[[Got it->X13 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What shortcut did I show you for stepping away?\"\n\n[[Try again->X13]]]", "X13 R": "(set: $miss to 0)## ✅ Job done\n**Lock the screen.** Paws can't type into a locked computer. (And never pile books on a laptop!)\n\n[[Next question->X14]]", "X14": "**Question 14 of 16.** Someone keeps their laptop on the bathroom counter during hot showers.\n\n**Why is that a problem?**\n\n* [[The mirror reflects too much light->X14 W]]\n* [[Bathrooms block the Wi-Fi signal->X14 W]]\n* [[The sound of water drains the battery->X14 W]]\n* [[Steam condenses into water inside it->X14 R]]", "X14 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Steam condenses** into tiny water drops, inside the laptop too.\"\n\n[[Got it->X14 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does steam turn into when it touches something cooler?\"\n\n[[Try again->X14]]]", "X14 R": "(set: $miss to 0)## ✅ Job done\n**Steam condenses inside.** Moisture causes shorts and corrosion over time.\n\n[[Next question->X15]]", "X15": "**Question 15 of 16.** A laptop rode home in a freezing car and feels icy cold.\n\n**What should you do before turning it on?**\n\n* [[Turn it on right away to warm it up->X15 W]]\n* [[Put it near a heater to speed things up->X15 W]]\n* [[Wait until it reaches room temperature->X15 R]]\n* [[Put it in the fridge to keep it steady->X15 W]]", "X15 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Wait until it's room temperature.** Condensation can form inside a cold device, and you don't want power on that.\"\n\n[[Got it->X15 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What forms on cold things in a warm room?\"\n\n[[Try again->X15]]]", "X15 R": "(set: $miss to 0)## ✅ Job done\n**Let it warm up on its own first.** Condensation inside plus power can cause damage.\n\n[[Next question->X16]]", "X16": "**Question 16 of 16.** You're about to slide your laptop into your backpack between classes.\n\n**What should you do first?**\n\n* [[Shut it down or make sure it's asleep->X16 R]]\n* [[Turn the brightness all the way up->X16 W]]\n* [[Leave a game running to save time->X16 W]]\n* [[Open the lid a little so it can breathe->X16 W]]", "X16 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Shut it down or make sure it's really asleep.** A laptop running in a bag overheats.\"\n\n[[Got it->X16 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What happens to a laptop that keeps running in a closed bag?\"\n\n[[Try again->X16]]]", "X16 R": "(set: $miss to 0)## ✅ Job done\n**Shut down or sleep first.** A running laptop in a closed bag has nowhere to send its heat.\n\n[[See your results->Certificate]]", "Certificate": "# 🏅 Senior Technician: Unit 2 Complete\n\n*The Inspector hands you a new badge, heavier than the first.* \"You know the five enemies now: heat, dust, power, moisture, and bumps. You can keep a screen, a battery, a cable, and a whole room of gadgets healthy, and you can explain *why*. That's what makes a technician.\"\n\n**Your Unit 2 kit:** 📒 Tech Notebook · 🖥️ Screen Kit · 🌡️ Heat Detector · 🔌 Cable Kit · 🔋 Battery Tester · 🎧 Gear Bag · 🐾 Hazard Map · 🎒 Travel Case\n\n\"Next up: when things go wrong. Restarts, troubleshooting, updates, backups, scams, and what to do when a computer's life is over.\"\n\n*Unit 3: When Things Go Wrong, coming soon.*\n\n[[Back to the work schedule->Shop]]"}};
(function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly and unlocks the days before it (for links from course modules)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),...Object.keys(STORY.passages).map(k=>(k.match(/^D(\d+) Start$/)||[])[1]).filter(Boolean)]));show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];show('D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
