squints at the name on the order slip. \"A customer named Priya. Of course.\"\n\n**Priya**, 14: \"My new earbuds say IPX4. So I can swim laps with them, right?\"\n\n**What do you tell her?**\n\n* [[Yes, IPX4 means waterproof in any pool->D6 J4 W1]]\n* [[Yes, if she stays in the shallow end->D6 J4 W2]]\n* [[Yes, if she towels them off afterward->D6 J4 W3]]\n* [[No, IPX4 is for splashes, not swimming->D6 J4 R]]", "D6 J4 W1": "(set: $m6 to it + (a: \"Priya\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**IPX4 means splashes**, like sweat or light rain. **Not for swimming.**\"\n\n[[Got it->D6 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the IPX4 side of the rating picture. What kind of water is it?\"\n\n[[Try again->D6 J4]]]", "D6 J4 W2": "(set: $m6 to it + (a: \"Priya\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**IPX4 means splashes**, like sweat or light rain. **Not for swimming.**\"\n\n[[Got it->D6 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the IPX4 side of the rating picture. What kind of water is it?\"\n\n[[Try again->D6 J4]]]", "D6 J4 W3": "(set: $m6 to it + (a: \"Priya\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Sweat-proof is not lane-proof. Her earbuds sink faster than her times.</div>\n\n## Let me show you\n*The Inspector leans over.* \"**IPX4 means splashes**, like sweat or light rain. **Not for swimming.**\"\n\n[[Got it->D6 J4 R]]](else:)[<div class=\"oops\">Sweat-proof is not lane-proof. Her earbuds sink faster than her times.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the IPX4 side of the rating picture. What kind of water is it?\"\n\n[[Try again->D6 J4]]]", "D6 J4 R": "(set: $miss to 0)## ✅ Job done\n**Splashes only.** And water resistance wears off as earbuds age.\n\n[[Next customer->D6 J5]]", "D6 J5": "<div class=\"scene\">🎧 🔊 ⏰</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"His volume setting, and how long he listens.\"><polygon points=\"22,44 34,44 50,30 50,82 34,68 22,68\" fill=\"#e9ecef\"/><path d=\"M58 44 q8 12 0 24\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M66 39 q11 17 0 34\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M74 34 q14 22 0 44\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"96\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"108\" y=\"74\" width=\"9\" height=\"14\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"120\" y=\"68\" width=\"9\" height=\"20\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"132\" y=\"62\" width=\"9\" height=\"26\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"144\" y=\"56\" width=\"9\" height=\"32\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"156\" y=\"50\" width=\"9\" height=\"38\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"168\" y=\"44\" width=\"9\" height=\"44\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"180\" y=\"38\" width=\"9\" height=\"50\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"192\" y=\"32\" width=\"9\" height=\"56\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"204\" y=\"26\" width=\"9\" height=\"62\" rx=\"2\" fill=\"#ffb347\"/><text x=\"150\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his volume</text><circle cx=\"285\" cy=\"56\" r=\"34\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"285\" y1=\"56\" x2=\"285\" y2=\"32.2\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"285\" y1=\"56\" x2=\"302.0\" y2=\"56\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"285\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">3 to 4 hours a day</text></svg><div class=\"cap\">His volume setting, and how long he listens.</div></div>\n\n**Theo** plays his headphones at max volume for 3 to 4 hours every afternoon. \"If it hurt, I'd notice.\"\n\n**Best advice?**\n\n* [[Max is fine as long as the music isn't too bassy->D6 J5 W1]]\n* [[Turn it down until he can hear people nearby->D6 J5 R]]\n* [[Noise cancelling makes loud volume safe to use->D6 J5 W3]]\n* [[Earbuds are always quieter than headphones->D6 J5 W4]]", "D6 J5 W1": "(set: $m6 to it + (a: \"Theo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn it down.** If he can't hear someone next to him, it's too loud. Aim for the 60/60 rule, and watch the dB meter on an iPhone.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 60/60 picture. Does hearing damage hurt while it happens?\"\n\n[[Try again->D6 J5]]]", "D6 J5 W3": "(set: $m6 to it + (a: \"Theo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn it down.** If he can't hear someone next to him, it's too loud. Aim for the 60/60 rule, and watch the dB meter on an iPhone.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 60/60 picture. Does hearing damage hurt while it happens?\"\n\n[[Try again->D6 J5]]]", "D6 J5 W4": "(set: $m6 to it + (a: \"Theo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn it down.** If he can't hear someone next to him, it's too loud. Aim for the 60/60 rule, and watch the dB meter on an iPhone.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 60/60 picture. Does hearing damage hurt while it happens?\"\n\n[[Try again->D6 J5]]]", "D6 J5 R": "(set: $miss to 0)## ✅ Job done\n**Keep it where you can still hear people.** Hearing damage builds quietly, and hair cells don't grow back.\n\n[[Next customer->D6 S1]]", "D6 S1": "## 🎲 IPX4: okay or not? (1 of 8)\n\nPriya's earbuds are rated IPX4. Would they be okay in each of these?\n\n*The Inspector reads the situation:*\n\n### Sweaty run, then wipe them off\n\n* [[✅ IPX4 is okay->D6 S1 R]]\n* [[⛔ Not okay->D6 S1 W]]", "D6 S1 R": "## ✅ Right: it is just splashes or sweat\n**Sweaty run, then wipe them off.** Sweat is a splash.\n\n[[Next one->D6 S2]]", "D6 S1 W": "## ❌ Not this time: it is just splashes or sweat\n**Sweaty run, then wipe them off.** Sweat is a splash.\n\n[[Next one->D6 S2]]", "D6 S2": "## 🎲 IPX4: okay or not? (2 of 8)\n\n*The Inspector reads the situation:*\n\n### Swimming laps\n\n* [[✅ IPX4 is okay->D6 S2 W]]\n* [[⛔ Not okay->D6 S2 R]]", "D6 S2 R": "## ✅ Right: it is more than splashes\n**Swimming laps.** Under water is far past splashes.\n\n[[Next one->D6 S3]]", "D6 S2 W": "## ❌ Not this time: it is more than splashes\n**Swimming laps.** Under water is far past splashes.\n\n[[Next one->D6 S3]]", "D6 S3": "## 🎲 IPX4: okay or not? (3 of 8)\n\n*The Inspector reads the situation:*\n\n### Walking home in light rain\n\n* [[✅ IPX4 is okay->D6 S3 R]]\n* [[⛔ Not okay->D6 S3 W]]", "D6 S3 R": "## ✅ Right: it is just splashes or sweat\n**Walking home in light rain.** Light rain is splash level.\n\n[[Next one->D6 S4]]", "D6 S3 W": "## ❌ Not this time: it is just splashes or sweat\n**Walking home in light rain.** Light rain is splash level.\n\n[[Next one->D6 S4]]", "D6 S4": "## 🎲 IPX4: okay or not? (4 of 8)\n\n*The Inspector reads the situation:*\n\n### Wearing them in the shower\n\n* [[✅ IPX4 is okay->D6 S4 W]]\n* [[⛔ Not okay->D6 S4 R]]", "D6 S4 R": "## ✅ Right: it is more than splashes\n**Wearing them in the shower.** Hot steam and soap wear down the seals.\n\n[[Next one->D6 S5]]", "D6 S4 W": "## ❌ Not this time: it is more than splashes\n**Wearing them in the shower.** Hot steam and soap wear down the seals.\n\n[[Next one->D6 S5]]", "D6 S5": "## 🎲 IPX4: okay or not? (5 of 8)\n\n*The Inspector reads the situation:*\n\n### Dropped in the sink\n\n* [[✅ IPX4 is okay->D6 S5 W]]\n* [[⛔ Not okay->D6 S5 R]]", "D6 S5 R": "## ✅ Right: it is more than splashes\n**Dropped in the sink.** Sitting under water is not a splash.\n\n[[Next one->D6 S6]]", "D6 S5 W": "## ❌ Not this time: it is more than splashes\n**Dropped in the sink.** Sitting under water is not a splash.\n\n[[Next one->D6 S6]]", "D6 S6": "## 🎲 IPX4: okay or not? (6 of 8)\n\n*The Inspector reads the situation:*\n\n### Gym workout, drips of sweat\n\n* [[✅ IPX4 is okay->D6 S6 R]]\n* [[⛔ Not okay->D6 S6 W]]", "D6 S6 R": "## ✅ Right: it is just splashes or sweat\n**Gym workout, drips of sweat.** Sweat drips are what IPX4 is for.\n\n[[Next one->D6 S7]]", "D6 S6 W": "## ❌ Not this time: it is just splashes or sweat\n**Gym workout, drips of sweat.** Sweat drips are what IPX4 is for.\n\n[[Next one->D6 S7]]", "D6 S7": "## 🎲 IPX4: okay or not? (7 of 8)\n\n*The Inspector reads the situation:*\n\n### A day at the ocean\n\n* [[✅ IPX4 is okay->D6 S7 W]]\n* [[⛔ Not okay->D6 S7 R]]", "D6 S7 R": "## ✅ Right: it is more than splashes\n**A day at the ocean.** Salt water and waves are too much.\n\n[[Next one->D6 S8]]", "D6 S7 W": "## ❌ Not this time: it is more than splashes\n**A day at the ocean.** Salt water and waves are too much.\n\n[[Next one->D6 S8]]", "D6 S8": "## 🎲 IPX4: okay or not? (8 of 8)\n\n*The Inspector reads the situation:*\n\n### Splashed at the pool edge\n\n* [[✅ IPX4 is okay->D6 S8 R]]\n* [[⛔ Not okay->D6 S8 W]]", "D6 S8 R": "## ✅ Right: it is just splashes or sweat\n**Splashed at the pool edge.** A splash is fine. Swimming is not.\n\n[[The Inspector has something to show you->D6 L7]]", "D6 S8 W": "## ❌ Not this time: it is just splashes or sweat\n**Splashed at the pool edge.** A splash is fine. Swimming is not.\n\n[[The Inspector has something to show you->D6 L7]]", "D6 L7": "## 📘 The Inspector's lesson: Game Controllers\n\n\"Cheese dust. The natural enemy of the A button.\"\n\n**Sticky button:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"> stroke-width=\"1\"/><path d=\"M75 50 C78.6 54.8 78.6 58.4 75 58.4 C71.4 58.4 71.4 54.8 75 50 Z\" fill=\"#7fd1ff\"/></svg><b>Outside: damp cloth</b>barely damp, outside only</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Tips: rinse, then dry\"><path d=\"M14 50 q0 -30 22 -30 q22 0 22 30 Z\" fill=\"#9aa4ae\"/><rect x=\"28\" y=\"50\" width=\"16\" height=\"8\" rx=\"2\" fill=\"#6b747d\"/><path d=\"M20 4 C23.6 8.8 23.6 12.4 20 12.4 C16.4 12.4 16.4 8.8 20 4 Z\" fill=\"#7fd1ff\"/><path d=\"M42 2 C45.6 6.8 45.6 10.4 42 10.4 C38.4 10.4 38.4 6.8 42 2 Z\" fill=\"#7fd1ff\"/><circle cx=\"80\" cy=\"36\" r=\"15\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"80\" y1=\"36\" x2=\"80\" y2=\"25.5\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"80\" y1=\"36\" x2=\"87.5\" y2=\"36\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>Tips: rinse, then dry</b>dry fully, 2+ hours</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Case: dry swab\"><rect x=\"8\" y=\"22\" width=\"56\" height=\"42\" rx=\"14\" fill=\"#e9ecef\"/><rect x=\"16\" y=\"30\" width=\"40\" height=\"18\" rx=\"8\" fill=\"#4a525b\"/><circle cx=\"28\" cy=\"40\" r=\"3.5\" fill=\"#e8c27a\"/><circle cx=\"44\" cy=\"40\" r=\"3.5\" fill=\"#e8c27a\"/><line x1=\"54\" y1=\"34\" x2=\"92\" y2=\"6\" stroke=\"#e8c27a\" stroke-width=\"3\" stroke-linecap=\"round\"/><ellipse cx=\"54\" cy=\"34\" rx=\"5\" ry=\"5\" fill=\"#ffffff\"/><ellipse cx=\"92\" cy=\"6\" rx=\"5\" ry=\"5\" fill=\"#ffffff\"/></svg><b>Case: dry swab</b>on the metal contacts</div></div>\n<div class=\"cap\">Share earbuds rarely. They sit in your ear, so they pass on earwax and germs.</div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"The <b>60/60 rule</b>. Loud sound kills tiny <b>hair cells</b> in your inner ear. They never grow back.\"><rect x=\"20\" y=\"90\" width=\"9\" height=\"14\" rx=\"2\" fill=\"#6fe3b5\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><rect x=\"33\" y=\"83\" width=\"9\" height=\"21\" rx=\"2\" fill=\"#6fe3b5\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><rect x=\"46\" y=\"76\" width=\"9\" height=\"28\" rx=\"2\" fill=\"#6fe3b5\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><rect x=\"59\" y=\"69\" width=\"9\" height=\"35\" rx=\"2\" fill=\"#6fe3b5\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><rect x=\"72\" y=\"62\" width=\"9\" height=\"42\" rx=\"2\" fill=\"#6fe3b5\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><rect x=\"85\" y=\"55\" width=\"9\" height=\"49\" rx=\"2\" fill=\"#6fe3b5\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><rect x=\"98\" y=\"48\" width=\"9\" height=\"56\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"111\" y=\"41\" width=\"9\" height=\"63\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"124\" y=\"34\" width=\"9\" height=\"70\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"137\" y=\"27\" width=\"9\" height=\"77\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><text x=\"85\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">60% volume</text><text x=\"176\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"28\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">+</text><circle cx=\"235\" cy=\"70\" r=\"34\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><line x1=\"235\" y1=\"70\" x2=\"235\" y2=\"46.2\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"235\" y1=\"70\" x2=\"252.0\" y2=\"70\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><text x=\"235\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">60 minutes</text><line x1=\"282\" y1=\"70\" x2=\"318\" y2=\"70\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"318,70 311.0,73.8 311.0,66.2\" fill=\"#e9ecef\"/><path d=\"M345 52 q22 0 22 26 q0 14 -12 16 q-6 1 -6 10 q0 9 -11 9\" stroke=\"#7fd1ff\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"350\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">then a break</text></svg><div class=\"cap\">The <b>60/60 rule</b>. Loud sound kills tiny <b>hair cells</b> in your inner ear. They never grow back.</div></div>\n\n**60% on one device is not 60% on another**, so treat 60/60 as a rule of thumb. The better test: **if you can't hear someone talking next to you, it's too loud.** On an iPhone, Control Center's **Hearing** meter (add it in Settings > Control Center) shows the live dB. Stay out of its \"Loud\" zone.\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 215\" role=\"img\" aria-label=\"Water resistance <b>wears off</b>. Old seals, soap, sunscreen and lotion weaken it.\"><rect x=\"115\" y=\"8\" width=\"54\" height=\"50\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><text x=\"142\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"22\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">IP</text><rect x=\"174\" y=\"8\" width=\"54\" height=\"50\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><text x=\"201\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"24\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">X</text><rect x=\"233\" y=\"8\" width=\"54\" height=\"50\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><text x=\"260\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"24\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">4</text><text x=\"165\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">dust</text><text x=\"275\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15 lid</b>.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🥤</span><b>✅ Lidded cup</b>a spill becomes a shrug</div><div class=\"card ok\"><span class=\"big\">🪑</span><b>✅ Separate surface</b>side table or shelf</div><div class=\"card no\"><span class=\"big\">🖱️</span><b>❌ Mug by the mouse</b>right in the knock zone</div><div class=\"card no\"><span class=\"big\">🍪</span><b>❌ Snacks at the keys</b>crumbs jam the keys</div></div>\n\n**Sticky hands (siblings, cousins, you after lunch):** sugar and grease creep into ports and gaps, and wiping afterward pushes them in. Clean hands come first.\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Wash hands\"><path d=\"M30 14 h30 v10 h-8 v8\" stroke=\"#9aa4ae\" stroke-width=\"6\" fill=\"none\" stroke-linejoin=\"round\"/><path d=\"M48 38 q3 5 0 8 q-3 -3 0 -8 z\" fill=\"#7fd1ff\"/><path d=\"M54 48 q3 5 0 8 q-3 -3 0 -8 z\" fill=\"#7fd1ff\"/><path d=\"M42 52 q3 5 0 8 q-3 -3 0 -8 z\" fill=\"#7fd1ff\"/><ellipse cx=\"50\" cy=\"62\" rx=\"22\" ry=\"5\" fill=\"#7fd1ff\" opacity=\"0.5\"/></svg><b>1. Wash hands</b>every time, first</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Stay close\"><circle cx=\"34\" cy=\"20\" r=\"10\" fill=\"#ffb347\"/><rect x=\"22\" y=\"32\" width=\"24\" height=\"30\" rx=\"8\" fill=\"#ffb347\"/><circle cx=\"66\" cy=\"32\" r=\"7\" fill=\"#6fe3b5\"/><rect x=\"57\" y=\"41\" width=\"18\" height=\"21\" rx=\"6\" fill=\"#6fe3b5\"/></svg><b>2. Stay close</b>with younger kids</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Kid-safe case\"><rect x=\"22\" y=\"12\" width=\"56\" height=\"46\" rx=\"10\" fill=\"#ffb347\"/><rect x=\"31\" y=\"20\" width=\"38\" height=\"30\" rx=\"3\" fill=\"#7fd1ff\" opacity=\"0.7\"/><path d=\"M38 12 q12 -12 24 0\" stroke=\"#ffb347\" stroke-width=\"5\" fill=\"none\"/></svg><b>3. Kid-safe case</b>thick, rubbery, handle</div><div class=\"card\"><svg vie  [[Move the mug next to the keyboard instead->D7 J6 W4]]", "D7 J6 W1": "(set: $m7 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Her mug sat in the **knock zone**. Keep drinks out of elbow range, with a **lid**.\"\n\n[[Got it->D7 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the desk map again. Where is the red zone?\"\n\n[[Try again->D7 J6]]]", "D7 J6 W2": "(set: $m7 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Her mug sat in the **knock zone**. Keep drinks out of elbow range, with a **lid**.\"\n\n[[Got it->D7 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the desk map again. Where is the red zone?\"\n\n[[Try again->D7 J6]]]", "D7 J6 W4": "(set: $m7 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Her mug sat in the **knock zone**. Keep drinks out of elbow range, with a **lid**.\"\n\n[[Got it->D7 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the desk map again. Where is the red zone?\"\n\n[[Try again->D7 J6]]]", "D7 J6 R": "(set: $miss to 0)## ✅ Job done\n**Many spills are knocked over, so use a lid and keep drinks out of the zone.**\n\n[[Next customer->D7 J7]]", "D7 J7": "<div class=\"scene\">🍓 📱 🧒</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Fresh jam, heading straight for the tablet.\"><rect x=\"38\" y=\"54\" width=\"62\" height=\"50\" rx=\"18\" fill=\"#e8b48a\"/><rect x=\"40\" y=\"30\" width=\"13\" height=\"40\" rx=\"6\" fill=\"#e8b48a\"/><rect x=\"55\" y=\"24\" width=\"13\" height=\"40\" rx=\"6\" fill=\"#e8b48a\"/><rect x=\"70\" y=\"24\" width=\"13\" height=\"40\" rx=\"6\" fill=\"#e8b48a\"/><rect x=\"85\" y=\"30\" width=\"13\" height=\"40\" rx=\"6\" fill=\"#e8b48a\"/><ellipse cx=\"32\" cy=\"80\" rx=\"9\" ry=\"20\" fill=\"#e8b48a\" tran t quite\n*The Inspector raises an eyebrow.* \"Look at the steam picture again.\"\n\n[[Try again->D7 J10]]]", "D7 J10 W3": "(set: $m7 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Fog is the part you can see. It's also Kiosk advice.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Steam **condenses** into water on the parts inside, and that means corrosion. **Keep laptops out of steamy bathrooms.**\"\n\n[[Got it->D7 J10 R]]](else:)[<div class=\"oops\">Fog is the part you can see. It's also Kiosk advice.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the steam picture again.\"\n\n[[Try again->D7 J10]]]", "D7 J10 R": "(set: $miss to 0)## ✅ Job done\n**Moisture on circuits causes corrosion and glitches.**\n\n[[Next customer->D7 J11]]", "D7 J11": "<div class=\"scene\">🔌 🚶 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Gray footprints show where people walk at night.\"><text x=\"180\" y=\"16\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Jayden's hallway, from above</text><line x1=\"8\" y1=\"28\" x2=\"352\" y2=\"28\" stroke=\"#9aa4ae\" stroke-width=\"5\"/><line x1=\"8\" y1=\"98\" x2=\"244\" y2=\"98\" stroke=\"#9aa4ae\" stroke-width=\"5\"/><line x1=\"312\" y1=\"98\" x2=\"352\" y2=\"98\" stroke=\"#9aa4ae\" stroke-width=\"5\"/><rect x=\"42\" y=\"30\" width=\"22\" height=\"12\" rx=\"2\" fill=\"#eef1f4\"/><path d=\"M53 40 C 90 70, 220 60, 278 112\" stroke=\"#ffb347\" stroke-width=\"3\" fill=\"none\"/><rect x=\"262\" y=\"110\" width=\"34\" height=\"22\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"262\" y=\"106\" width=\"34\" height=\"5\" rx=\"1\" fill=\"#7fd1ff\" opacity=\"0.7\"/><ellipse cx=\"100\" cy=\"54\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"126\" cy=\"70\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"152\" cy=\"54\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"178\" cy=\"70\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"204\" cy=\"54\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><ellipse cx=\"230\" cy=\"70\" rx=\"7\" ry=\"4\" fill=\"#5d6873\"/><text x=\"53\" y=\"58\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">outlet</text><text x=\"250\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">laptop</text></svg><div class=\"cap\">Gray footprints show where people walk at night.</div></div>\n\n**Jayden's** charger cord stretches across the hallway. His mom tripped on it in the dark, and the laptop nearly fell.\n\n**Best fix?**\n\n* [[Hide the cord under the hallway rug->D7 J11 W1]]\n* [[Get a longer cable to lie loose on the floor->D7 J11 W2]]\n* [[Charge where the cord runs along the wall->D7 J11 R]]\n* [[Only charge it in the daytime with lights on->D7 J11 W4]]", "D7 J11 W1": "(set: $m7 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Hidden, hot and still a trip. Kiosk advice.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Cords don't cross walkways. **Charge where the cord runs along the wall.** Never under a rug: it traps heat.\"\n\n[[Got it->D7 J11 R]]](else:)[<div class=\"oops\">Hidden, hot and still a trip. Kiosk advice.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three cord pictures again.\"\n\n[[Try again->D7 J11]]]", "D7 J11 W2": "(set: $m7 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Cords don't cross walkways. **Charge where the cord runs along the wall.** Never under a rug: it traps heat.\"\n\n[[Got it->D7 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three cord pictures again.\"\n\n[[Try again->D7 J11]]]", "D7 J11 W4": "(set: $m7 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n \"round\"/></svg><div class=\"cap\">Cords go along walls or behind furniture, never across a walkway.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🧱</span><b>✅ Sturdy and flat</b>not a wobbly shelf</div><div class=\"card ok\"><span class=\"big\">📏</span><b>✅ Away from edges</b>nothing hanging off</div><div class=\"card no\"><span class=\"big\">🐠</span><b>❌ Over water</b>fish tank or sink</div><div class=\"card ok\"><span class=\"big\">🧦</span><b>✅ Winter zap</b>touch a doorknob first</div></div>\n\n**Winter zap:** dry winter air builds static in your socks and sleeves. Touch a metal doorknob or desk leg before you touch the computer, so the spark jumps there and not into its ports. (Opening a tower is different: Day 3 says to touch the unplugged case.)\n\n---\n\n🌙 *That's today's workday. Day 8 opens next time.*\n\n[[Back to the work schedule->Shop]]", "D8 Start": "(set: $miss to 0)(set: $m8 to (a:))# Day 8: On the Move\n\n<div class=\"scene\">🎒 💥 💻</div>\n\n*The wall sign reads: \"Days since last preventable disaster: 7.\" The Inspector drops a backpack. It lands with a crunch.* \"Devices are built to travel, not to be tossed, baked, frozen, or soaked. A few ten-second habits stop most travel damage.\"\n\n\n[[Open the shop->D8 L1]]", "D8 L1": "## 📘 The Inspector's lesson: Packing and Carrying\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Laptop screens are thin glass. Pressure cracks them, even with no drop.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Book on top</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Padded sleeve</text><line x1=\"60\" y1=\"26\" x2=\"60\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"60,40 56.2,33.0 63.8,33.0\" fill=\"#ff6b6b\"/> div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🛡️</span><b>✅ Padded sleeve</b>or laptop pocket</div><div class=\"card ok\"><span class=\"big\">✏️</span><b>✅ Clear the keys</b>pencils, earbuds, clips</div><div class=\"card no\"><span class=\"big\">📚</span><b>❌ Books on the lid</b>pressure cracks glass</div><div class=\"card no\"><span class=\"big\">💥</span><b>❌ Tossing the bag</b>a drop is still a drop</div></div>\n\nCarry it **closed, by the base**. Hinges and screens can't hold the whole laptop.\n\n**Before you bag it:** most modern laptops go to sleep when you close the lid. But a **download or update** can keep one awake, and so can a setting that keeps it on for a monitor. Not sure? **Shut it down** (Mac: Apple menu, Shut Down).\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"A download or update can keep it awake. A laptop running in a bag gets <b>hot and drained</b>.\"><rect x=\"6\" y=\"55\" width=\"84\" height=\"50\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"48\" y=\"77\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Close</text><text x=\"48\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">the lid</text><line x1=\"92\" y1=\"80\" x2=\"108\" y2=\"80\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"108,80 101.0,83.8 101.0,76.2\" fill=\"#9aa4ae\"/><rect x=\"110\" y=\"12\" width=\"142\" height=\"136\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><text x=\"181\" y=\"34\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Wait 10 sec,</text><text x=\"181\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">then check:</text><text x=\"181\" y=\"78\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Light off or pulsing</text><text x=\"181\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Fans silent</text><text x=\"181\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Lid cool, not warm</text><line x1=\"254\" y1=\"66\" x2=\"288\" y2=\"36\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"288,36 285.3,43.5 280.2,37.8\" fill=\"#6fe3b5\"/><line x1=\"254\" y1=\"94\" x2=\"288\" y2=\"124\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"288,124 280.2,122.2 285.3,116.5\" fill=\"#ff6b6b\"/><rect x=\"292\" y=\"12\" width=\"104\" height=\"46\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"344\" y=\"32\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">All yes</text><text x=\"344\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Bag it</text><rect x=\"292\" y=\"102\" width=\"104\" height=\"46\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><text x=\"344\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Any no</text><text x=\"344\" y=\"140\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Shut it down</text></svg><div class=\"cap\">A download or update can keep it awake. A laptop running in a bag gets <b>hot and drained</b>.</div></div>\n\n[[Got it. Send in the next customer->D8 S1]]", "D8 S1": "## 🎲 Before You Bag It (1 of 8)\n\nThe Inspector checks your travel bag.\n\n*The Inspector holds up:*\n\n### Shutting it down first\n\n* [[✅ Before you bag it->D8 S1 R]]\n* [[⛔ Never in the bag->D8 S1 W]]", "D8 S1 R": "## ✅ Right: it's part of a safe pack\n**Shutting it down first.** Off means no heat and no drain.\n\n[[Next one->D8 S2]]", "D8 S1 W": "## ❌ Not this time: it's part of a safe pack\n**Shutting it down first.** Off means no heat and no drain.\n\n[[Next one->D8 S2]]", "D8 S2": "## 🎲 Before You Bag It (2 of 8)\n\n*The Inspector holds up:*\n\n### Clearing pencils and earbuds off the keys\n\n* [[✅ Before you bag it->D8 S2 R]]\n* [[⛔ Never in the bag->D8 S2 W]]", "D8 S2 R": "## ✅ Right: it's part of a safe pack\n**Clearing pencils and earbuds off the keys.** Closing the lid presses them into the screen.\n\n[[Next one->D8 S3]]", "D8 S2 W": "## ❌ Not this time: it's part of a safe pack\n**Clearing pencils and earbuds off the keys.** Closing the lid presses them into the screen.\n\n[[Next one->D8 S3]]", "D8 S3": "## 🎲 Before You Bag It (3 of 8)\n\n*The Inspector holds up:*\n\n### A padded sleeve\n\n* [[✅ Before you bag it->D8 S3 R]]\n* [[⛔ Never in the bag->D8 S3 W]]", "D8 S3 R": "## ✅ Right: it's part of a safe pack\n**A padded sleeve.** It spreads out the bumps.\n\n[[Next one->D8 S4]]", "D8 S3 W": "## ❌ Not this time: it's part of a safe pack\n**A padded sleeve.** It spreads out the bumps.\n\n[[Next one->D8 S4]]", "D8 S4": "## 🎲 Before You Bag It (4 of 8)\n\n*The Inspector holds up:*\n\n### A fan-whirring, warm-lid laptop\n\n* [[✅ Before you bag it->D8 S4 W]]\n* [[⛔ Never in the bag->D8 S4 R]]", "D8 S4 R": "## ✅ Right: it stays out of the bag\n**A fan-whirring, warm-lid laptop.** It's still awake. It will bake in the bag.\n\n[[Next one->D8 S5]]", "D8 S4 W": "## ❌ Not this time: it stays out of the bag\n**A fan-whirring, warm-lid laptop.** It's still awake. It will bake in the bag.\n\n[[Next one->D8 S5]]", "D8 S5": "## 🎲 Before You Bag It (5 of 8)\n\n*The Inspector holds up:*\n\n### A laptop mid-update with the lid closed\n\n* [[✅ Before you bag it->D8 S5 W]]\n* [[⛔ Never in the bag->D8 S5 R]]", "D8 S5 R": "## ✅ Right: it stays out of the bag\n**A laptop mid-update with the lid closed.** Updates can keep it awake. Let it finish.\n\n[[Next one->D8 S6]]", "D8 S5 W": "## ❌ Not this time: it stays out of the bag\n**A laptop mid-update with the lid closed.** Updates can keep it awake. Let it finish.\n\n[[Next one->D8 S6]]", "D8 S6": "## 🎲 Before You Bag It (6 of 8)\n\n*The Inspector holds up:*\n\n### A textbook stacked on the lid\n\n* [[✅ Before you bag it->D8 S6 W]]\n* [[⛔ Never in the bag->D8 S6 R]]", "D8 S6 R": "## ✅ Right: it stays out of the bag\n**A textbook stacked on the lid.** Pressure cracks the screen.\n\n[[Next one->D8 S7]]", "D8 S6 W": "## ❌ Not this time: it stays out of the bag\n**A textbook stacked on the lid.** Pressure cracks the screen.\n\n[[Next one->D8 S7]]", "D8 S7": "## 🎲 Before You Bag It (7 of 8)\n\n*The Inspector holds up:*\n\n### Fans silent, lid cool, light pulsing\n\n* [[✅ Before you bag it->D8 S7 R]]\n* [[⛔ Never in the bag->D8 S7 W]]", "D8 S7 R": "## ✅ Right: it's part of a safe pack\n**Fans silent, lid cool, light pulsing.** Those are signs it is really asleep.\n\n[[Next one->D8 S8]]", "D8 S7 W": "## ❌ Not this time: it's part of a safe pack\n**Fans silent, lid cool, light pulsing.** Those are signs it is really asleep.\n\n[[Next one->D8 S8]]", "D8 S8": "## 🎲 Before You Bag It (8 of 8)\n\n*The Inspector holds up:*\n\n### A laptop still wet from the rain\n\n* [[✅ Before you bag it->D8 S8 W]]\n* [[⛔ Never in the bag->D8 S8 R]]", "D8 S8 R": "## ✅ Right: it stays out of the bag\n**A laptop still wet from the rain.** Wet plus warm is bad. Dry and power it off.\n\n[[Next customer->D8 J3]]", "D8 S8 W": "## ❌ Not this time: it stays out of the bag\n**A laptop still wet from the rain.** Wet plus warm is bad. Dry and power it off.\n\n[[Next customer->D8 J3]]", "D8 J3": "<div class=\"scene\">🎒 🔥 🪫</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"He closed the lid at 8 a.m. By 3 p.m. it's hot and dead.\"><path d=\"M66.0 22 Q90.0 2 114.0 22\" stroke=\"#5a7fa8\" stroke-width=\"6\" fill=\"none\"/><rect x=\"30\" y=\"18\" width=\"120\" height=\"100\" rx=\"22\" fill=\"#5a7fa8\"/><rect x=\"44\" y=\"30\" width=\"92\" height=\"80\" rx=\"12\" fill=\"#1b1f24\"/><rect x=\"62\" y=\"36\" width=\"14\" height=\"70\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"80\" y=\"36\" width=\"10\" height=\"70\" rx=\"3\" fill=\"#6b5a8e\"/><text x=\"113\" y=\"76\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">lid</text><text x=\"113\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">closed</text><circle cx=\"215\" cy=\"58\" r=\"30\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"215\" y1=\"58\" x2=\"215\" y2=\"36\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"215\" y1=\"58\" x2=\"233\" y2=\"58\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"276\" y=\"40\" width=\"62\" height=\"34\" rx=\"5\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"338\" y=\"50\" width=\"7\" height=\"14\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"281\" y=\"45\" width=\"5\" height=\"24\" rx=\"2\" fill=\"#ff6b6b\"/><text x=\"90\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Dev's backpack, inside</text><text x=\"215\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">3 p.m.</text><text x=\"310\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">hot, battery</text><text x=\"310\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">at 0%</text></svg><div class=\"cap\">He closed the lid at 8 a.m. By 3 p.m. it's hot and dead.</div></div>\n\n**Dev** started a big game download, then closed the lid and stuffed his laptop in his backpack. At 3 p.m. it's hot, and the battery is dead.\n\n**What happened?**\n\n* [[The sun on his walk baked the whole backpack->D8 J3 W1]]\n* [[Closing the lid overcharged the battery->D8 J3 W2]]\n* [[The download kept it running all day->D8 J3 R]]\n* [[The old battery just gave out during school->D8 J3 W4]]", "D8 J3 W1": "(set: $m8 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The download kept it awake, so it ran all day in a closed bag. **Shut it down**, or check the light, fans and lid first.\"\n\n[[Got it->D8 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the chart: what does a download do to sleep?\"\n\n[[Try again->D8 J3]]]", "D8 J3 W2": "(set: $m8 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Batteries stop charging at 100%. A lid can't overcharge anything.</div>\n\n## Let me show you\n*The Inspector leans over.* \"The download kept it awake, so it ran all day in a closed bag. **Shut it down**, or check the light, fans and lid first.\"\n\n[[Got it->D8 J3 R]]](else:)[<div class=\"oops\">Batteries stop charging at 100%. A lid can't overcharge anything.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the chart: what does a download do to sleep?\"\n\n[[Try again->D8 J3]]]", "D8 J3 W4": "(set: $m8 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The download kept it awake, so it ran all day in a closed bag. **Shut it down**, or check the light, fans and lid first.\"\n\n[[Got it->D8 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the chart: what does a download do to sleep?\"\n\n[[Try again->D8 J3]]]", "D8 J3 R": "(set: $miss to 0)## ✅ Job done\n**It never slept.** Trapped heat plus nonstop running drained the battery.\n\n[[Next customer->D8 J4]]", "D8 J4": "<div class=\"scene\">📚 💻 💥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 148\" role=\"img\" aria-label=\"The crack spreads out from the middle of the screen.\"><rect x=\"95.0\" y=\"8\" width=\"170\" height=\"92\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"102.0\" y=\"15\" width=\"156\" height=\"78\" rx=\"2\" fill=\"#2c4a66\"/><polygon points=\"91.0,102 269.0,102 283.0,120 77.0,120\" fill=\"#8a96a3\"/><polyline points=\"180,52 162,38 130,30\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 167,62 142,78\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 187,34 186,22\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 205,37 226,28\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 207,59 232,72\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 188,64 190,82\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 158,51 122,56\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><polyline points=\"180,52 198,64 210,82\" stroke=\"#e9ecef\" stroke-width=\"1.8\" fill=\"none\"/><circle cx=\"180\" cy=\"52\" r=\"16\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.2\"/><text x=\"180\" y=\"142\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Kai's laptop: no dents, no drop marks</text></svg><div class=\"cap\">The crack spreads out from the middle of the screen.</div></div>\n\n**Kai** carried his laptop all week with his textbook stacked on top. Now the screen has a spiderweb crack. He never dropped it.\n\n**What cracked it?**\n\n* [[The textbook pressing on the lid all week->D8 J4 R]]\n* [[A loose hinge from years of opening it->D8 J4 W2]]\n* [[Cold =\"14\" rx=\"3\" fill=\"#8a96a3\"/><circle cx=\"126\" cy=\"38\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"142\" cy=\"32\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"160\" cy=\"38\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"176\" cy=\"31\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"132\" cy=\"68\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"152\" cy=\"72\" r=\"3.5\" fill=\"#7fd1ff\"/><circle cx=\"171\" cy=\"67\" r=\"3.5\" fill=\"#7fd1ff\"/><line x1=\"186\" y1=\"53\" x2=\"212\" y2=\"53\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"212,53 205.0,56.8 205.0,49.2\" fill=\"#9aa4ae\"/><circle cx=\"250\" cy=\"45\" r=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"250\" y1=\"45\" x2=\"250\" y2=\"29\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"250\" y1=\"45\" x2=\"262\" y2=\"51\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"286\" y1=\"53\" x2=\"312\" y2=\"53\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"312,53 305.0,56.8 305.0,49.2\" fill=\"#9aa4ae\"/><path d=\"M341.0 38.0 A15 15 0 1 0 359.0 38.0\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"350\" y1=\"32\" x2=\"350\" y2=\"50\" stroke=\"#6fe3b5\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"50\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">1. Cold</text><text x=\"50\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">from the car</text><text x=\"150\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">2. Warm room</text><text x=\"150\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">water forms</text><text x=\"250\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Wait</text><text x=\"250\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">closed + off</text><text x=\"350\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">4. Turn on</text><text x=\"350\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">at room temp</text></svg><div class=\"cap\">Like glasses fogging up, but inside too. <b>Laptops:</b> wait until it feels room temperature, often an hour.</div></div>\n\nThat wait is for **laptops**. A phone that rides in a cold coat pocket is fine.\n\n**Rain and spills:** most current phones are **water-resistant** (IP67 or IP68 means tested for dunking in fresh water). Rain alone won't hurt them. The real rule is **never charge with a wet port.** An iPhone shows a \"Liquid Detected\" alert, and many Androids say \"Moisture detected.\" Laptops and older phones aren't rated, so use the steps:\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"><rect x=\"36\" y=\"6\" width=\"28\" height=\"52\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"28\" cy=\"14\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"25\" cy=\"40\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"75\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/><path d=\"M44.6 26.8 A9 9 0 1 0 55.4 26.8\" stroke=\"#6fe3b5\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"34\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>1. Power off</b>right away</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Dry it off\"><rect x=\"36\" y=\"6\" width=\"28\" height=\"52\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><path d=\"M24 40 Q50 32 76 40 L72 66 Q50 60 28 66 Z\" fill=\"#6b5a8e\"/><circle cx=\"28\" cy=\"14\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"25\" cy=\"40\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"75\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/></svg><b>2. Dry it off</b>just the outside</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Don't charge\"><rect x=\"30\" y=\"22\" width=\"26\" height=\"26\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"56\" y=\"27\" width=\"12\" height=\"4\" fill=\"#9aa4ae\"/><rect x=\"56\" y=\"39\" width=\"12\" height=\"4\" fill=\"#9aa4ae\"/><line x1=\"30\" y1=\"35\" x2=\"14\" y2=\"35\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"34\" y1=\"19\" x2=\"66\" y2=\"51\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"34\" y1=\"51\" x2=\"66\" y2=\"19\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>3. Don't charge</b>until fully dry</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Wait\"><circle cx=\"50\" cy=\"35\" r=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><line x1=\"50\" y1=\"35\" x2=\"50\" y2=\"19\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"35\" x2=\"62\" y2=\"41\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>4. Wait</b>at least a day</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🌳</span><b>✅ Cool, shady spot</b>let it cool on its own</div><div class=\"card ok\"><span class=\"big\">🎒</span><b>✅ Inside pocket</b>or a zip-top bag</div><div class=\"card no\"><span class=\"big\">🧊</span><b>❌ Freezer or fridge</b>too sudden: condensation</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Hair dryer, heater</b>fast heat = more water</div><div class=\"card no\"><span class=\"big\">🍚</span><b>❌ Rice</b>doesn't work, clogs ports</div><div class=\"card no\"><span class=\"big\">🌧️</span><b>❌ Outside pocket</b>bags aren't waterproof</div></div>\n\n[[Got it. Send in the next customer->D8 J6]]", "D8 J6": "<div class=\"scene\">🚗 ☀️ <svg viewBox=\"0 0 46 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"tablet\"><rect x=\"3\" y=\"3\" width=\"40\" height=\"54\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"8\" y=\"9\" width=\"30\" height=\"40\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.6\"/><circle cx=\"23\" cy=\"53\" r=\"2\" fill=\"#9aa4ae\"/></svg></div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"The tablet is showing a heat warning and won't work.\"><circle cx=\"150\" cy=\"22\" r=\"11\" fill=\"#ffb347\"/><path d=\"M172 14 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M172 22 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M14 96 L28 26 Q30 16 42 18 L48 20 L40 96 Z\" fill=\"#6b5a5a\"/><rect x=\"32\" y=\"90\" width=\"140\" height=\"26\" rx=\"10\" fill=\"#7a6767\"/><rect x=\"70\" y=\"80\" width=\"80\" height=\"10\" rx=\"3\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"232\" y=\"10\" width=\"86\" height=\"106\" rx=\"9\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"239\" y=\"18\" width=\"72\" height=\"88\" rx=\"3\" fill=\"#1b1f24\"/><rect x=\"270\" y=\"30\" width=\"10\" height=\"38\" rx=\"5\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><circle cx=\"275\" cy=\"72\" r=\"9\" fill=\"#ff6b6b\"/><rect x=\"273\" y=\"44\" width=\"4\" height=\"26\" fill=\"#ff6b6b\"/><text x=\"275\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">too hot</text><text x=\"100\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">left on the car seat, July</text><text x=\"275\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her tablet now</text></svg><div class=\"cap\">The tablet is showing a heat warning and won't work.</div></div>\n\n**Ms. Rivera** left her tablet on the car seat during a July errand. Now it shows a heat warning and won't work.\n\n**What now?**\n\n* [[Put it in the fridge for a few minutes->D8 J6 W1]]\n* [[Plug it in so it can recharge and reset->D8 J6 W2]]\n* [[Move it to shade and let it cool slowly->D8 J6 R]]\n* [[Restart it again and again until it works->D8 J6 W4]]", "D8 J6 W1": "(set: $m8 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Let it cool down on its own** somewhere cool. A fridge chills it too fast. And no more parked cars.\"\n\n[[Got it->D8 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Cool, shady spot and Freezer or fridge cards.\"\n\n[[Try again->D8 J6]]]", "D8 J6 W2": "(set: $m8 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Let it cool down on its own** somewhere cool. A fridge chills it too fast. And no more parked cars.\"\n\n[[Got it->D8 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Cool, shady spot and Freezer or fridge cards.\"\n\n[[Try again->D8 J6]]]", "D8 J6 W4": "(set: $m8 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Let it cool down on its own** somewhere cool. A fridge chills it too fast. And no more parked cars.\"\n\n[[Got it->D8 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Cool, shady spot and Freezer or fridge cards.\"\n\n[[Try again->D8 J6]]]", "D8 J6 R": "(set: $miss to 0)## ✅ Job done\n**Cool it slowly.** The warning is the tablet protecting itself from heat.\n\n[[Next customer->D8 J7]]", "D8 J7": "<div class=\"scene\">❄️ 🚗 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 148\" role=\"img\" aria-label=\"Look at the edges of the screen.\"><rect x=\"95.0\" y=\"8\" width=\"170\" height=\"92\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"102.0\" y=\"15\" width=\"156\" height=\"78\" rx=\"2\" fill=\"#3a6a96\"/><polygon points=\"91.0,102 269.0,102 283.0,120 77.0,120\" fill=\"#8a96a3\"/><rect x=\"102\" y=\"15\" width=\"156\" height=\"78\" rx=\"2\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"16\" opacity=\"0.6\"/><circle cx=\"161\" cy=\"88\" r=\"1.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"119\" cy=\"19\" r=\"3.0\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"165\" cy=\"91\" r=\"2.2\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"253\" cy=\"32\" r=\"2.7\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"178\" cy=\"22\" r=\"2.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"253\" cy=\"83\" r=\"2.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"105\" cy=\"76\" r=\"2.1\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"255\" cy=\"23\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"180\" cy=\"22\" r=\"2.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"196\" cy=\"87\" r=\"1.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"128\" cy=\"85\" r=\"2.2\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"254\" cy=\"44\" r=\"2.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"129\" cy=\"87\" r=\"2.3\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"109\" cy=\"85\" r=\"2.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"152\" cy=\"89\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"226\" cy=\"23\" r=\"2.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"157\" cy=\"85\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"145\" cy=\"88\" r=\"2.1\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"255\" cy=\"47\" r=\"1.7\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"136\" cy=\"22\" r=\"2.0\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"224\" cy=\"20\" r=\"2.8\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"250\" cy=\"29\" r=\"2.3\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"253\" cy=\"60\" r=\"1.9\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"111\" cy=\"22\" r=\"2.6\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"105\" cy=\"85\" r=\"2.2\" fill=\"#ffffff\" opacity=\"0.8\"/><circle cx=\"251\" cy=\"91\" r=\"1.5\" fill=\"#ffffff\" opacity=\"0.8\"/><text x=\"180\" y=\"142\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Patel's screen, just turned on</text></svg><div class=\"cap\">Look at the edges of the screen.</div></div>\n\n**Mr. Patel's** laptop spent a January night in his car. This morning he powered it on right away. The screen edges look foggy.\n\n**What should he have done?**\n\n* [[Turned it on so its own heat dries it out->D8 J7 W1]]\n* [[Kept it closed and off until room temp->D8 J7 R]]\n* [[Warmed it fast with a hair dryer on low->D8 J7 W3]]\n* [[Set it by the heater vent to warm it up->D8 J7 W4]]", "D8 J7 W1": "(set: $m8 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Warm air **condenses** on cold parts, inside too. **Closed and off until it feels room temperature**, often an hour.\"\n\n[[Got it->D8 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 3 in the cold-to-warm picture: closed and what?\"\n\n[[Try again->D8 J7]]]", "D8 J7 W3": "(set: $m8 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Warm air **condenses** on cold parts, inside too. **Closed and off until it feels room temperature**, often an hour.\"\n\n[[Got it->D8 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 3 in the cold-to-warm picture: closed and what?\"\n\n[[Try again->D8 J7]]]", "D8 J7 W4": "(set: $m8 to it + (a: \"Mr. Patel\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Warm air **condenses** on cold parts, inside too. **Closed and off until it feels room temperature**, often an hour.\"\n\n[[Got it->D8 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 3 in the cold-to-warm picture: closed and what?\"\n\n[[Try again->D8 J7]]]", "D8 J7 R": "(set: $miss to 0)## ✅ Job done\n**Let a cold laptop warm up slowly, closed and off.** Water plus power can short out circuits.\n\n[[Next customer->D8 J8]]", "D8 J8": "<div class=\"scene\">🌧️ 🎒 📱</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Her phone rode home in the outside pocket, soaked.\"><line x1=\"20\" y1=\"8\" x2=\"14\" y2=\"22\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"18\" x2=\"54\" y2=\"32\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"100\" y1=\"4\" x2=\"94\" y2=\"18\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"14\" x2=\"144\" y2=\"28\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"6\" x2=\"194\" y2=\"20\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"240\" y1=\"20\" x2=\"234\" y2=\"34\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"300\" y1=\"8\" x2=\"294\" y2=\"22\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"340\" y1=\"16\" x2=\"334\" y2=\"30\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"180\" y1=\"30\" x2=\"174\" y2=\"44\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"40\" x2=\"34\" y2=\"54\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M76.0 34 Q100.0 14 124.0 34\" stroke=\"#5a7fa8\" stroke-width=\"6\" fill=\"none\"/><rect x=\"40\" y=\"30\" width=\"120\" height=\"84\" rx=\"22\" fill=\"#5a7fa8\"/><rect x=\"60\" y=\"72\" width=\"80\" height=\"36\" rx=\"10\" fill=\"#4a6f98\" stroke=\"#3d5f85\" stroke-width=\"2\"/><rect x=\"84\" y=\"44\" width=\"32\" height=\"44\" rx=\"5\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"88\" y=\"49\" width=\"24\" height=\"22\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.8\"/><rect x=\"60\" y=\"72\" width=\"80\" height=\"36\" rx=\"10\" fill=\"#4a6f98\" opacity=\"0.9\"/><circle cx=\"80\" cy=\"58\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"120\" cy=\"64\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"76\" cy=\"50\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"122\" cy=\"48\" r=\"3\" fill=\"#7fd1ff\"/><rect x=\"210\" y=\"22\" width=\"56\" height=\"96\" rx=\"8\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"216\" y=\"30\" width=\"44\" height=\"76\" rx=\"3\" fill=\"#7fd1ff\" opacity=\"0.8\"/><circle cx=\"204\" cy=\"40\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"272\" cy=\"52\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"230\" cy=\"60\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"250\" cy=\"90\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"206\" cy=\"96\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"272\" cy=\"108\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><circle cx=\"238\" cy=\"116\" r=\"3.5\" fill=\"#7fd1ff\" stroke=\"#ffffff\" stroke-width=\"1\"/><text x=\"100\" y=\"133\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the outside pocket</text><text x=\"318\" y=\"64\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">works fine,</text><text x=\"318\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">port is wet</text></svg><div class=\"cap\">Her phone rode home in the outside pocket, soaked.</div></div>\n\n**Nora's** phone rode home in the outside pocket through a downpour. It works fine, but when she plugs in, it flashes \"Liquid Detected.\"\n\n**What should she do?**\n\n* [[Tap Emergency Override and charge it anyway->D8 J8 W1]]\n* [[Bury it in a bowl of rice overnight->D8 J8 W2]]\n* [[Unplug it and let the port air-dry->D8 J8 R]]\n* [[Blow-dry the charging port on high heat->D8 J8 W4]]", "D8 J8 W1": "(set: $m8 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Rain alone is fine, but a **wet port can short out while charging**. Unplug, dry the outside, and let the port air-dry. No rice, no heat.\"\n\n[[Got it->D8 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the third wet-step card: what stays dry?\"\n\n[[Try again->D8 J8]]]", "D8 J8 W2": "(set: $m8 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Rice leaves dust in the port and dries nothing.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Rain alone is fine, but a **wet port can short out while charging**. Unplug, dry the outside, and let the port air-dry. No rice, no heat.\"\n\n[[Got it->D8 J8 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Rice leaves dust in the port and dries nothing.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Look at the third wet-step card: what stays dry?\"\n\n[[Try again->D8 J8]]]", "D8 J8 W4": "(set: $m8 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Rain alone is fine, but a **wet port can short out while charging**. Unplug, dry the outside, and let the port air-dry. No rice, no heat.\"\n\n[[Got it->D8 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the third wet-step card: what stays dry?\"\n\n[[Try again->D8 J8]]]", "D8 J8 R": "(set: $miss to 0)## ✅ Job done\n**Never charge with a wet port.** The alert is the phone protecting itself. Next rainy day, use an inside pocket.\n\n[[The Inspector has something to show you->D8 L9]]", "D8 L9": "## 📘 The Inspector's lesson: Storage and Accidents\n\n**Long naps (like summer break):**\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.\"><rect x=\"25\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"109\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"29\" y=\"24\" width=\"5\" height=\"32\" rx=\"3\" fill=\"#ff6b6b\"/><rect x=\"155\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"239\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"159\" y=\"24\" width=\"38\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><rect x=\"285\" y=\"20\" width=\"84\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"369\" y=\"32\" width=\"8\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"289\" y=\"24\" width=\"76\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"70\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">0%</text><text x=\"70\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">may never</text><text x=\"70\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">charge again</text><text x=\"200\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">About 50%</text><text x=\"200\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">just right</text><text x=\"330\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">100%</text><text x=\"330\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">wears it out</text><text x=\"330\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">faster</text><line x1=\"62\" y1=\"137\" x2=\"78\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"62\" y1=\"153\" x2=\"78\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M191 145 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"322\" y1=\"137\" x2=\"338\" y2=\"153\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"153\" x2=\"338\" y2=\"137\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><div class=\"cap\">Then <b>power off</b>. Store below about 90°F (32°C). Over 6 months? Top it back up to half.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🗄️</span><b>✅ Cool, dry room</b>a closet or shelf</div><div class=\"card no\"><span class=\"big\">🏚️</span><b>❌ Hot attic</b>an oven in summer</div><div class=\"card no\"><span class=\"big\">🏠</span><b>❌ Garage</b>hot in summer</div><div class=\"card no\"><span class=\"big\">🚗</span><b>❌ Car trunk</b>way too hot</div></div>\n\n**After a drop, stop for any of these:**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">👃</span><b>❌ Burning smell</b>or a chemical smell</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Sparks</b>any at all</div><div class=\"card no\"><span class=\"big\">💨</span><b>❌ Smoke</b>any at all</div><div class=\"card no\"><span class=\"big\">🎈</span><b>❌ Bulging battery</b>case or trackpad pushed up</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 220\" role=\"img\" aria-label=\"Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.\"><rect x=\"6\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><text x=\"101\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Danger sign?</text><text x=\"20\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Power off</text><text x=\"20\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Don't charge</text><text x=\"20\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Keep it away from</text><text x=\"36\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">things that burn</text><text x=\"20\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Get a pro</text><rect x=\"204\" y=\"8\" width=\"190\" height=\"204\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"299\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">No signs?</text><text x=\"218\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">1. Check for cracks</text><text x=\"218\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">2. Test the hinge</text><text x=\"218\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">3. Back up files</text><text x=\"218\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">4. Watch for days</text><text x=\"299\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">loose cables can act</text><text x=\"299\" y=\"199\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">up days later</text></svg><div class=\"cap\">Cracked or popped-open case? A <b>pro</b> opens it. Don't pry.</div></div>\n\n<div class=\"warn\">**Grown-up needed:** A swollen battery, a burning smell, sparks, or a popped-open case means a grown-up takes over. Don't press, don't pry, don't charge. Get it to a professional or a battery recycler.</div>\n\n[[Got it. Send in the next customer->D8 J10]]", "D8 J10": "<div class=\"scene\"><svg viewBox=\"0 0 60 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"stairs\"><path d=\"M2 58 V46 H16 V34 H30 V22 H44 V10 H58 V58 Z\" fill=\"#a07850\" stroke=\"#e9ecef\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/></svg> 💻 😅</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"No smell, no sparks, nothing bulging.\"><path d=\"M10 120 V100 H50 V80 H90 V60 H130 V40 H170 V120 Z\" fill=\"#a07850\"/><line x1=\"150\" y1=\"26\" x2=\"230\" y2=\"70\" stroke=\"#9aa4ae\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"230,70 222.0,70.0 225.7,63.3\" fill=\"#9aa4ae\"/><rect x=\"231.0\" y=\"30\" width=\"110\" height=\"62\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"238.0\" y=\"37\" width=\"96\" height=\"48\" rx=\"2\" fill=\"#3a6a96\"/><polygon points=\"227.0,94 345.0,94 359.0,112 213.0,112\" fill=\"#8a96a3\"/><text x=\"286\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">it turns on fine</text><text x=\"90\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">half a flight</text></svg><div class=\"cap\">No smell, no sparks, nothing bulging.</div></div>\n\n**Ava** dropped her laptop down half a flight of stairs. It turns on fine. No smell, no sparks, nothing bulging.\n\n**What's the smart next step?**\n\n* [[Back up her files now, just in case->D8 J10 R]]\n* [[Nothing, since it turned on just fine->D8 J10 W2]]\n* [[Open the bottom case to look for loose parts->D8 J10 W3]]\n* [[Update the software to repair any drop damage->D8 J10 W4]]", "D8 J10 W2": "(set: $m8 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lucky Ava. Now **check cracks and the hinge, back up, and watch** for new problems over the next days.\"\n\n[[Got it->D8 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the No signs? box: a loose part can act up later. What protects her files?\"\n\n[[Try again->D8 J10]]]", "D8 J10 W3": "(set: $m8 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lucky Ava. Now **check cracks and the hinge, back up, and watch** for new problems over the next days.\"\n\n[[Got it->D8 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the No signs? box: a loose part can act up later. What protects her files?\"\n\n[[Try again->D8 J10]]]", "D8 J10 W4": "(set: $m8 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lucky Ava. Now **check cracks and the hinge, back up, and watch** for new problems over the next days.\"\n\n[[Got it->D8 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the No signs? box: a loose part can act up later. What protects her files?\"\n\n[[Try again->D8 J10]]]", "D8 J10 R": "(set: $miss to 0)## ✅ Job done\n**Check, back up, watch.** A loose cable inside may not act up until later.\n\n[[Next customer->D8 J11]]", "D8 J11": "<div class=\"scene\">🐕 💻 😬</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 142\" role=\"img\" aria-label=\"One corner has a gap where the case should be flush.\"><rect x=\"20\" y=\"62\" width=\"130\" height=\"12\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"20\" y=\"54\" width=\"130\" height=\"7\" rx=\"2\" fill=\"#5f8fb3\"/><text x=\"85\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">a normal laptop</text><text x=\"85\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">(closed, from the side)</text><rect x=\"200\" y=\"62\" width=\"104\" height=\"12\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"200\" y=\"54\" width=\"104\" height=\"7\" rx=\"2\" fill=\"#5f8fb3\"/><polygon points=\"304,54 340,40 340,56 304,61\" fill=\"#5f8fb3\"/><polygon points=\"304,62 342,60 342,78 304,74\" fill=\"#8a96a3\"/><polygon points=\"304,61 340,56 342,60 304,62\" fill=\"#0f1215\"/><line x1=\"322\" y1=\"92\" x2=\"322\" y2=\"80\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"322,80 325.8,87.0 318.2,87.0\" fill=\"#ffb347\"/><text x=\"270\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">Grandpa Leo's laptop</text><text x=\"270\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffb347\" text-an k it in the garage.\"\n\n**Right way to store it?**\n\n* [[Charge to 100% and leave it plugged in->D8 J12 W1]]\n* [[Let it run down to 0% so it can rest->D8 J12 W2]]\n* [[Charge to half, power off, keep it cool->D8 J12 R]]\n* [[Charge it full and garage it in its sleeve->D8 J12 W4]]", "D8 J12 W1": "(set: $m8 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**About half, powered off, cool and dry.** A garage in July is an oven.\"\n\n[[Got it->D8 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three batteries: which one is just right?\"\n\n[[Try again->D8 J12]]]", "D8 J12 W2": "(set: $m8 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**About half, powered off, cool and dry.** A garage in July is an oven.\"\n\n[[Got it->D8 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three batteries: which one is just right?\"\n\n[[Try again->D8 J12]]]", "D8 J12 W4": "(set: $m8 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**About half, powered off, cool and dry.** A garage in July is an oven.\"\n\n[[Got it->D8 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the three batteries: which one is just right?\"\n\n[[Try again->D8 J12]]]", "D8 J12 R": "(set: $miss to 0)(if: $days does not contain \"8\")[(set: $days to it + (a: \"8\"))]## ✅ Job done\n**About 50%, off, cool and dry.** Over six months? Top it back up to half.\n\n[[Close up shop->D8 Done]]", "D8 Done": "(if: $days does not contain \"8\")[(set: $days to it + (a: \"8\"))]# Day 8 complete!\n\n<div class=\"tool\">🎒 **New tool earned: Travel Case**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Make a phone note or Reminder called **\"Before I Travel\"**: shut down or check it's asleep, clear the keys, padded sleeve, nothing on the lid, let a cold laptop warm up first, never charge a wet port.</div>\n\n<div class=\"rocky\"><button type=\"button\" class=\"rocky-copy\" data-key=\"m8\" data-total=\"8\" data-none=\"nobody\" data-msg=\"Computer Care 101 Sr · Day 8 complete! Tool earned: 🎒 Travel Case. Right on the first try: {first} of 8 customers. Needed help with: {missed}. Field assignment: Make a phone note or Reminder called &quot;Before I Travel&quot;: shut down or check it&#x27;s asleep, clear the keys, padded sleeve, nothing on the lid, let a cold laptop warm up first, never charge a wet port.\">📋 Copy my results for Rocky</button><div class=\"rocky-box\" hidden></div><div class=\"rocky-ok\">Then paste them into your chat with Rocky. 💬</div></div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Packing and Carrying\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Laptop screens are thin glass. Pressure cracks them, even with no drop.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Book on top</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Padded sleeve</text><line x1=\"60\" y1=\"26\" x2=\"60\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"60,40 56.2,33.0 63.8,33.0\" fill=\"#ff6b6b\"/><line x1=\"100\" y1=\"26\" x2=\"100\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"100,40 96.2,33.0 103.8,33.0\" fill=\"#ff6b6b\"/><line x1=\"140\" y1=\"26\" x2=\"140\" y2=\"40\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"140, cracks glass</div><div class=\"card no\"><span class=\"big\">💥</span><b>❌ Tossing the bag</b>a drop is still a drop</div></div>\n\nCarry it **closed, by the base**. Hinges and screens can't hold the whole laptop.\n\n**Before you bag it:** most modern laptops go to sleep when you close the lid. But a **download or update** can keep one awake, and so can a setting that keeps it on for a monitor. Not sure? **Shut it down** (Mac: Apple menu, Shut Down).\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"A download or update can keep it awake. A laptop running in a bag gets <b>hot and drained</b>.\"><rect x=\"6\" y=\"55\" width=\"84\" height=\"50\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"48\" y=\"77\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Close</text><text x=\"48\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">the lid</text><line x1=\"92\" y1=\"80\" x2=\"108\" y2=\"80\" stroke=\"#9aa4ae\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"108,80 101.0,83.8 101.0,76.2\" fill=\"#9aa4ae\"/><rect x=\"110\" y=\"12\" width=\"142\" height=\"136\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><text x=\"181\" y=\"34\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Wait 10 sec,</text><text x=\"181\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">then check:</text><text x=\"181\" y=\"78\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Light off or pulsing</text><text x=\"181\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Fans silent</text><text x=\"181\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Lid cool, not warm</text><line x1=\"254\" y1=\"66\" x2=\"288\" y2=\"36\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"288,36 285.3,43.5 280.2,37.8\" fill=\"#6fe3b5\"/><line x1=\"254\" y1=\"94\" x2=\"288\" y2=\"124\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"288,124 280.2,122.2 285.3,116.5\" fill=\"#ff6b6b\"/><rect x=\"292\" y=\"12\" width=\"104\" height=\"46\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"344\" y=\"32\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">All yes</text><text x=\"344\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Bag it</text><rect x=\"292\" y=\"102\" width=\"104\" height=\"46\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><text x=\"344\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Any no</text><text x=\"344\" y=\"140\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Shut it down</text></svg><div class=\"cap\">A download or update can keep it awake. A laptop running in a bag gets <b>hot and drained</b>.</div></div>\n\n### Heat, Cold, and Rain\n<div class=\"pic\"><svg viewBox=\"0 0 400 180\" role=\"img\" aria-label=\"A parked car gets much hotter than outside. Over about 95°F can <b>permanently</b> shrink the battery.\"><circle cx=\"38\" cy=\"32\" r=\"15\" fill=\"#ffb347\"/><line x1=\"58.0\" y1=\"32.0\" x2=\"65.0\" y2=\"32.0\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"52.2\" y1=\"46.2\" x2=\"57.2\" y2=
