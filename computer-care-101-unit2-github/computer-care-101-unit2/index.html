ck, up close</text></svg><div class=\"cap\">Look at the cord right where it leaves the brick.</div></div>\n\n**Nora** winds her laptop cord tight around the brick every night. Now it's split where it leaves the brick. Thin wires show.\n\n**What should Nora do?**\n\n* [[Wrap the split in electrical tape->D4 J2 W]]\n* [[Wind it tighter to hold the split shut->D4 J2 W]]\n* [[Replace it; coil the new one loosely->D4 J2 R]]\n* [[Use it only while the laptop is off->D4 J2 W]]", "D4 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Bare wires mean **stop and replace**. The tight wrap bent it at the **strain relief** every night.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards and the tight-wrap card again.\"\n\n[[Try again->D4 J2]]]", "D4 J2 R": "(set: $miss to 0)## ✅ Job done\n**Replace a damaged cord, never tape it, and coil the next one loosely.**\n\n[[Next customer->D4 J3]]", "D4 J3": "<div class=\"scene\">🧥 📱 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Look at what's inside the port, past the end of the plug.\"><rect x=\"196\" y=\"24\" width=\"150\" height=\"84\" rx=\"10\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"200\" y=\"42\" width=\"110\" height=\"34\" rx=\"17\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><circle cx=\"272\" cy=\"54\" r=\"7\" fill=\"#d8d8d8\"/><circle cx=\"284\" cy=\"50\" r=\"6\" fill=\"#d8d8d8\"/><circle cx=\"294\" cy=\"60\" r=\"8\" fill=\"#d8d8d8\"/><circle cx=\"280\" cy=\"66\" r=\"8\" fill=\"#d8d8d8\"/><circle cx=\"266\" cy=\"66\" r=\"6\" fill=\"#d8d8d8\"/><circle cx=\"290\" cy=\"70\" r=\"5\" fill=\"#d8d8d8\"/><circle cx=\"300\" cy=\"52\" r=\"5\" fill=\"#d8d8d8\"/><line x1=\"262\" y1=\"50\" x2=\"256\" y2=\"46\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"72\" x2=\"306\" y2=\"76\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><line x1=\"286\" y1=\"46\" x2=\"290\" y2=\"40\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><line x1=\"264\" y1=\"70\" x2=\"258\" y2=\"74\" stroke=\"#d8d8d8\" stroke-width=\"1.5\"/><path d=\"M8 59 H120\" stroke=\"#5b6573\" stroke-width=\"10\" stroke-linecap=\"round\"/><rect x=\"116\" y=\"44\" width=\"54\" height=\"30\" rx=\"6\" fill=\"#4a535d\"/><rect x=\"170\" y=\"49\" width=\"70\" height=\"20\" rx=\"10\" fill=\"#c9d1d9\"/><rect x=\"182\" y=\"56\" width=\"50\" height=\"6\" rx=\"3\" fill=\"#8a96a3\"/><line x1=\"240\" y1=\"22\" x2=\"240\" y2=\"84\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><text x=\"70\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his charging plug</text><text x=\"272\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his tablet's port, up close</text><text x=\"240\" y=\"16\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">plug stops here</text></svg><div class=\"cap\">Look at what's inside the port, past the end of the plug.</div></div>\n\n**Mr. Patel's** tablet only charges at just the right angle. The plug never clicks all the way in. It rides in his coat pocket.\n\n**What should you try first?**\n\n* [[Power off; scoop lint with a wooden pick->D4 J3 R]]\n* [[Scrape the port with a straight paperclip->D4 J3 W]]\n* [[Push the plug in harder until it clicks->D4 J3 W]]\n* [[Drip rubbing alcohol in, then plug it in->D4 J3 W]]", "D4 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pocket **lint** is blocking the plug. Power off, then scoop it with a **wooden toothpick**. Never metal.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the port picture again.\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**A wooden or plastic toothpick clears lint without hurting the contacts.**\n\n[[Next customer->D4 J4]]", "D4 J4": "<div class=\"scene\">🔌 🟫 😟</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Look at the prong and at the outlet cover.\"><path d=\"M10 70 H60\" stroke=\"#5b6573\" stroke-width=\"8\" stroke-linecap=\"round\"/><rect x=\"60\" y=\"44\" width=\"62\" height=\"52\" rx=\"6\" fill=\"#e9ecef\"/><rect x=\"122\" y=\"50\" width=\"56\" height=\"12\" fill=\"#c9d1d9\"/><rect x=\"122\" y=\"78\" width=\"56\" height=\"12\" fill=\"#c9d1d9\"/><ellipse cx=\"160\" cy=\"56\" rx=\"20\" ry=\"8\" fill=\"#6b3e1e\"/><ellipse cx=\"166\" cy=\"56\" rx=\"10\" ry=\"5\" fill=\"#2a1a10\"/><rect x=\"230\" y=\"18\" width=\"80\" height=\"94\" rx=\"8\" fill=\"#f1efe6\"/><ellipse cx=\"262\" cy=\"52\" rx=\"16\" ry=\"18\" fill=\"#a0703a\" opacity=\"0.55\"/><rect x=\"258\" y=\"40\" width=\"5\" height=\"18\" fill=\"#1b1f24\"/><rect x=\"278\" y=\"40\" width=\"5\" height=\"20\" fill=\"#1b1f24\"/><path d=\"M265 76 a5 5 0 0 1 10 0 v4 h-10 z\" fill=\"#1b1f24\"/><text x=\"110\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her charger's prongs</text><text x=\"270\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the outlet</text></svg><div class=\"cap\">Look at the prong and at the outlet cover.</div></div>\n\n**Ms. Rivera's** charger has a brown scorch mark on one prong. The outlet cover looks discolored too. \"It still charges fine!\"\n\n**What's the right move?**\n\n* [[Keep using it, since it still charges->D4 J4 W]]\n* [[Rub the mark off with rubbing alcohol->D4 J4 W]]\n* [[Try another outlet and keep watch on it->D4 J4 W]]\n* [[A grown-up unplugs it; stop using it->D4 J4 R]]", "D4 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Scorched means it got **hot enough to burn**. **Unplug it and replace it.** A grown-up should have an electrician check that outlet.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the stop-sign cards again.\"\n\n[[Try again->D4 J4]]]", "D4 J4 R": "(set: $miss to 0)## ✅ Job done\n**\"Still works\" does not mean \"still safe.\"**\n\n[[The Inspector has something to show you->D4 L5]]", "D4 L5": "## 📘 The Inspector's lesson: Strips, Surges, and Storms\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"They look like twins. Only one soaks up <b>voltage spikes</b>.\"><polyline points=\"8,60 30,60 38,26 46,60 68,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"60\" x2=\"92\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"92,60 85.0,63.8 85.0,56.2\" fill=\"#ff6b6b\"/><rect x=\"96\" y=\"38\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"171\" y=\"65\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Power strip</text><line x1=\"250\" y1=\"60\" x2=\"268\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"268,60 261.0,63.8 261.0,56.2\" fill=\"#ff6b6b\"/><polyline points=\"272,60 294,60 302,26 310,60 332,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"366\" y1=\"37\" x2=\"384\" y2=\"55\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"366\" y1=\"55\" x2=\"384\" y2=\"37\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"302\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">gets through</text><polyline points=\"8,150 30,150 38,116 46,150 68,150\" fill=\"none\" stroke=\"#ff6b6b\" s -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><div class=\"cap\">Strips plugged into strips overload the first one. It can overheat and start a fire.</div></div>\n\nLightning is too big for any surge protector. FEMA says unplug when a storm warning comes.\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">💾</span><b>1. Save</b>your work</div><div class=\"card \"><span class=\"big\">🖥️</span><b>2. Shut down</b>all the way</div><div class=\"card ok\"><span class=\"big\">🔌</span><b>✅ 3. Unplug</b>from the wall, early</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Lightning close?</b>stay away from cords</div></div>\n\n<div class=\"warn\">**Grown-up needed:** Unplug and move power strips and surge protectors with a grown-up, and only with dry hands.</div>\n\n[[Got it. Send in the next customer->D4 J6]]", "D4 J6": "<div class=\"scene\">👴 🔌 🔥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Follow the cords from the wall to each thing Grandpa Leo plugged in.\"><rect x=\"8\" y=\"30\" width=\"34\" height=\"60\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"17\" y=\"48\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"29\" y=\"48\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M21 71 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><path d=\"M30 52 q24 0 26 38\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"40\" y=\"92\" width=\"80\" height=\"16\" rx=\"4\" fill=\"#ffc8a0\"/><rect x=\"50\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"65\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"80\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"95\" y=\"96\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M54 72 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M1 e=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">wall</text><text x=\"80\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">first strip</text><text x=\"164\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">strip 2</text><text x=\"248\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">strip 3</text><text x=\"326\" y=\"64\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Biscuit's</text><text x=\"326\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">bed</text></svg><div class=\"cap\">Follow the cords from the wall to each thing Grandpa Leo plugged in.</div></div>\n\n**Grandpa Leo** plugged a strip into a strip into a strip for his computer, printer, lamp, and Biscuit's dog bed. The first strip feels warm.\n\n**What should he do?**\n\n* [[Add a fourth strip to spread the load->D4 J6 W]]\n* [[Plug each strip into the wall instead->D4 J6 R]]\n* [[Tape the switches on so none get bumped->D4 J6 W]]\n* [[Swap the order so the warm one is last->D4 J6 W]]", "D4 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **daisy-chaining**. The first strip carries it all. Plug each one **straight into the wall**.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the daisy chain picture again.\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**Never daisy-chain strips.** The first one can overheat and start a fire.\n\n[[Next customer->D4 J7]]", "D4 J7": "<div class=\"scene\">🎮 <svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg> 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Read every word on the sticker under Dev's strip.\"><rect x=\"8\" y=\"34\" width=\"150\" height=\"34\" rx=\"6\" fill=\"#d9dde1\"/><g><rect x=\"40\" y=\"42\" width=\"12\" height=\"18\" rx=\"3\" fill=\"#1b1f24\"/></g><g><rect x=\"60\" y=\"42\" width=\"12\" height=\"18\" rx=\"3\" fill=\"#1b1f24\"/></g><g><rect x=\"80\" y=\"42\" width=\"12\" height=\"18\" rx=\"3\" fill=\"#1b1f24\"/></g><g><rect x=\"100\" y=\"42\" width=\"12\" height=\"18\" rx=\"3\" fill=\"#1b1f24\"/></g><g><rect x=\"120\" y=\"42\" width=\"12\" height=\"18\" rx=\"3\" fill=\"#1b1f24\"/></g><g><rect x=\"140\" y=\"42\" width=\"12\" height=\"18\" rx=\"3\" fill=\"#1b1f24\"/></g><rect x=\"14\" y=\"40\" width=\"20\" height=\"22\" rx=\"3\" fill=\"#ff6b6b\"/><rect x=\"17\" y=\"43\" width=\"14\" height=\"8\" rx=\"2\" fill=\"#ff9a9a\"/><path d=\"M158 51 q30 0 30 50\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\"/><line x1=\"70\" y1=\"68\" x2=\"70\" y2=\"100\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><rect x=\"10\" y=\"100\" width=\"170\" height=\"34\" rx=\"4\" fill=\"#f4f1e8\"/><text x=\"95\" y=\"114\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">6 OUTLETS · ON/OFF</text><text x=\"95\" y=\"129\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"normal\">15A  125V  1875W MAX</text><rect x=\"230\" y=\"20\" width=\"56\" height=\"94\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"240\" y=\"32\" width=\"36\" height=\"3\" fill=\"#ff6b6b\"/><rect x=\"240\" y=\"40\" width=\"36\" height=\"3\" fill=\"#7fd1ff\"/><rect x=\"240\" y=\"48\" width=\"36\" height=\"3\" fill=\"#6fe3b5\"/><rect x=\"240\" y=\"56\" width=\"36\" height=\"3\" fill=\"#ffb347\"/><circle cx=\"258\" cy=\"92\" r=\"9\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><path d=\"M230 104 q-20 0 -36 -50\" stroke=\"#c0c7ce\" stroke-width=\"3\" fill=\"none\"/><text x=\"83\" y=\"24\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Dev's strip</text><text x=\"258\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his gaming PC</text></svg><div class=\"cap\">Read every word on the sticker under Dev's strip.</div></div>\n\n**Dev** says his new gaming PC is protected. It's on a cheap strip with a switch. The label shows no joules and no surge words.\n\n**What do you tell Dev?**\n\n* [[It's safe, since every strip with a switch is->D4 J7 W]]\n* [[That's a power strip; get a surge protector->D4 J7 R]]\n* [[It's safe as long as the switch stays on->D4 J7 W]]\n* [[It's safe because it has six outlets->D4 J7 W]]", "D4 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No joules, no surge wording: that's a **power strip**. He needs a **listed surge protector** with a joule rating.\"\n\n[[Got it->D4 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the label cards again.\"\n\n[[Try again->D4 J7]]]", "D4 J7 R": "(set: $miss to 0)## ✅ Job done\n**A power strip adds outlets.** A surge protector soaks up spikes.\n\n[[Next customer->D4 J8]]", "D4 J8": "<div class=\"scene\">⛈️ 🖥️ 📱</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"The storm is far off, for now. His PC is still plugged in.\"><rect x=\"12\" y=\"10\" width=\"64\" height=\"112\" rx=\"10\" fill=\"#2b3138\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"18\" y=\"38\" width=\"52\" height=\"38\" rx=\"5\" fill=\"#ffb347\"/><text x=\"44\" y=\"54\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">Storm</text><text x=\"44\" y=\"69\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">warning</text><rect x=\"112\" y=\"40\" width=\"70\" height=\"48\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"118\" y=\"46\" width=\"58\" height=\"36\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"140\" y=\"88\" width=\"14\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"196\" y=\"40\" width=\"30\" height=\"58\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><path d=\"M211 98 V112 H120\" stroke=\"#c0c7ce\" stroke-width=\"3\" fill=\"none\"/><rect x=\"88\" y=\"106\" width=\"60\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"98\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"108\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"118\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"128\" y=\"110\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M88 114 H82 V126\" stroke=\"#c0c7ce\" stroke-width=\"3\" fill=\"none\"/><path d=\"M268 44 q-4 -18 14 -20 q6 -16 26 -10 q16 -8 26 8 q16 2 12 22 z\" fill=\"#5b6573\"/><polygon points=\"300,46 290,70 300,70 292,92 314,62 303,62 310,46\" fill=\"#ffb347\" opacity=\"0.8\"/><text x=\"160\" y=\"26\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Jayden's PC</text><text x=\"306\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">far off</text></svg><div class=\"cap\">The storm is far off, for now. His PC is still plugged in.</div></div>\n\n**Jayden** is finishing a slideshow. His phone shows a thunderstorm warning, and thunder rumbles far off. The PC is on a surge protector.\n\n**What's the smartest move?**\n\n* [[Keep working; surge protectors stop lightning->D4 J8 W]]\n* [[Turn off the monitor, leave the tower on->D4 J8 W]]\n* [[Wait for lightning overhead, then unplug->D4 J8 W]]\n* [[Save, shut down, and unplug right now->D4 J8 R]]", "D4 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lightning is too big for a surge protector. **Save, shut down, and unplug** while the storm is still far off.\"\n\n[[Got it->D4 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the storm cards again.\"\n\n[[Try again->D4 J8]]]", "D4 J8 R": "(set: $miss to 0)## ✅ Job done\n**Unplug before the storm, not during it.**\n\n[[The Inspector has something to show you->D4 L9]]", "D4 L9": "## 📘 The Inspector's lesson: Chargers\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"Watts (W) = how much power a charger can give. USB-C chargers <b>agree on a safe amount</b> first.\"><rect x=\"12\" y=\"24\" width=\"64\" height=\"44\" rx=\"6\" fill=\"#9aa4ae\"/><text x=\"44\" y=\"52\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">High W</text><line x1=\"84\" y1=\"46\" x2=\"238\" y2=\"46\" stroke=\"#6fe3b5\" stroke-width=\"5\" stroke-linecap=\"round\"/><polygon points=\"238,46 231.0,49.8 231.0,42.2\" fill=\"#6fe3b5\"/><text x=\"160\" y=\"32\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">normal speed</text><rect x=\"254\" y=\"22\" width=\"70\" height=\"43\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"259\" y=\"27\" width=\"60\" height=\"33\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"246,73 332,73 324,65 254,65\" fill=\"#8a96a3\"/><rect x=\"346\" y=\"34\" width=\"38\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"384\" y=\"40\" width=\"4\" height=\"8\" fill=\"#e9ecef\"/><rect x=\"349\" y=\"37\" width=\"29\" height=\"14\" rx=\"1\" fill=\"#6fe3b5\"/><rect x=\"26\" y=\"122\" width=\"36\" height=\"30\" rx=\"5\" fill=\"#9aa4ae\"/><text x=\"44\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Low W</text><line x1=\"70\" y1=\"137\" x2=\"238\" y2=\"137\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"238,137 231.0,140.8 231.0,133.2\" fill=\"#ffb347\"/><text x=\"160\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">slow, not dangerous</text><rect x=\"254\" y=\"112\" width=\"70\" height=\"43\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"259\" y=\"117\" width=\"60\" height=\"33\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"246,163 332,163 324,155 254,155\" fill=\"#8a96a3\"/><rect x=\"346\" y=\"126\" width=\"38\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"384\" y=\"132\" width=\"4\" height=\"8\" fill=\"#e9ecef\"/><rect x=\"349\" y=\"129\" width=\"8\" height=\"14\" rx=\"1\" fill=\"#ffb347\"/></svg><div class=\"cap\">Watts (W) = how much power a charger can give. USB-C chargers <b>agree on a safe amount</b> first.</div></div>\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"USB-C PD\"><rect x=\"10\" y=\"22\" width=\"44\" height=\"26\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"54\" y=\"27\" width=\"34\" height=\"16\" rx=\"8\" fill=\"#c0c7ce\"/><rect x=\"60\" y=\"33\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#1b1f24\"/></svg><b>USB-C PD</b>talks first, agrees on power</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Barrel plug\"><rect x=\"10\" y=\"22\" width=\"44\" height=\"26\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"54\" y=\"28\" width=\"32\" height=\"14\" fill=\"#c0c7ce\"/><circle cx=\"86\" cy=\"35\" r=\"7\" fill=\"#c0c7ce\"/><circle cx=\"86\" cy=\"35\" r=\"3\" fill=\"#1b1f24\"/></svg><b>Barrel plug</b>needs its own matching charger</div></div>\n\n**Warm is normal. Hot, noisy, or smelly is not.**\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">♨️</span><b>✅ Warm</b>normal</div><div class=\"card ok\"><span class=\"big\">🏬</span><b>✅ Maker or known brand</b>UL or ETL listed</div><div class=\"card ok\"><span class=\"big\">🪑</span><b>✅ Out on a desk</b>air can reach it</div><div class=\"card no\"><span class=\"big\">🥵</span><b>❌ Too hot to hold</b>stop using it</div><div class=\"card no\"><span class=\"big\">🐝</span><b>❌ Buzzing</b>or crackling</div><div class=\"card no\"><span class=\"big\">👃</span><b>❌ Burning smell</b>or scorch marks</div><div class=\"card no\"><span class=\"big\">💸</span><b>❌ No-name knockoff</b>may skip safety parts</div><div class=\"card no\"><span class=\"big\">🛏️</span><b>❌ Bed, couch, pillow</b>traps the heat</div></div>\n\n<div class=\"warn\">**Grown-up needed:** If a charger is too hot to hold, buzzing, smells like burning, or is scorched, a grown-up unplugs it. Stop using it.</div>\n\n[[Got it. Send in the next customer->D4 J10]]", "D4 J10": "<div class=\"scene\">📱 🔌 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Read the number printed on the charger.\"><rect x=\"8\" y=\"24\" width=\"34\" height=\"70\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"17\" y=\"47\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"29\" y=\"47\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M21 70 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><rect x=\"14\" y=\"40\" width=\"40\" height=\"40\" rx=\"7\" fill=\"#e9ecef\"/><rect x=\"25\" y=\"66\" width=\"18\" height=\"7\" rx=\"3.5\" fill=\"#1b1f24\"/><text x=\"34\" y=\"62\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">20W</text><path d=\"M34 80 q0 30 60 30 H200\" stroke=\"#e9ecef\" stroke-width=\"4\" fill=\"none\"/><rect x=\"206\" y=\"40\" width=\"80\" height=\"50\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"211\" y=\"45\" width=\"70\" height=\"40\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"198,98 294,98 286,90 206,90\" fill=\"#8a96a3\"/><rect x=\"300\" y=\"24\" width=\"38\" height=\"20\" rx=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"338\" y=\"30\" width=\"4\" height=\"8\" fill=\"#e9ecef\"/><rect x=\"303\" y=\"27\" width=\"6\" height=\"14\" rx=\"1\" fill=\"#ffb347\"/><text x=\"322\" y=\"62\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">after</text><text x=\"322\" y=\"78\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">1 hour</text><text x=\"130\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Tasha's phone charger</text></svg><div class=\"cap\">Read the number printed on the charger.</div></div>\n\n**Tasha** charges her laptop with her small phone charger and a USB-C cable. After an hour, the battery has barely moved.\n\n**What's going on?**\n\n* [[A low-watt charger works, but slowly->D4 J10 R]]\n* [[The phone charger may overload and burst->D4 J10 W]]\n* [[The cable damaged the laptop battery->D4 J10 W]]\n* [[Phone chargers can't power a laptop->D4 J10 W]]", "D4 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Fewer **watts**, so it **charges slowly**. USB-C agrees on a safe amount. Slow, not dangerous.\"\n\n[[Got it->D4 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the watts picture again.\"\n\n[[Try again->D4 J10]]]", "D4 J10 R": "(set: $miss to 0)## ✅ Job done\n**Lower watts mean slower charging, not danger.**\n\n[[Next customer->D4 J11]]", "D4 J11": "<div class=\"scene\">⛽ 🔌 🥵</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Listen, sniff, and touch (carefully). What do you notice?\"><rect x=\"140\" y=\"20\" width=\"34\" height=\"76\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"149\" y=\"46\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"161\" y=\"46\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M153 69 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><rect x=\"146\" y=\"36\" width=\"44\" height=\"50\" rx=\"7\" fill=\"#f4f4f4\"/><rect x=\"159\" y=\"72\" width=\"18\" height=\"7\" rx=\"3.5\" fill=\"#1b1f24\"/><line x1=\"146\" y1=\"60\" x2=\"190\" y2=\"60\" stroke=\"#b8b8b8\" stroke-width=\"1.5\"/><path d=\"M110 30 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M110 39 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M110 48 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 30 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 39 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 48 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"76\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">bzzz</text><text x=\"276\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">bzzz</text><path d=\"M160 18 q-5 -6 0 -12 q5 -6 0 -12\" stroke=\"#b07a4a\" stroke-width=\"2\" fill=\"none\" transform=\"translate(0 4)\"/><path d=\"M176 18 q-5 -6 0 -12 q5 -6 0 -12\" stroke=\"#b07a4a\" stroke-width=\"2\" fill=\"none\" transform=\"translate(0 4)\"/><rect x=\"252\" y=\"30\" width=\"56\" height=\"28\" rx=\"4\" fill=\"#f4f1e8\"/><text x=\"280\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">$3</text><text x=\"168\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Kenji's charger: no brand, no listing mark</text></svg><div class=\"cap\">Listen, sniff, and touch (carefully). What do you notice?</div></div>\n\n**Kenji's** $3 no-name gas-station charger is buzzing. It smells like hot plastic and is too hot to touch.\n\n**What should he do?**\n\n* [[Keep using it, since all chargers get warm->D4 J11 W]]\n* [[Set it on an ice pack to cool it down->D4 J11 W]]\n* [[Get a grown-up to unplug it; replace it->D4 J11 R]]\n* [[Use it only when someone is in the room->D4 J11 W]]", "D4 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Buzzing, a hot-plastic smell, too hot to hold: all **stop signs**. A grown-up **unplugs it**, and he buys a listed charger.\"\n\n[[Got it->D4 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the red charger cards again.\"\n\n[[Try again->D4 J11]]]", "D4 J11 R": "(set: $miss to 0)## ✅ Job done\n**Knockoffs can skip safety parts.** (And ice packs drip!)\n\n[[Next customer->D4 J12]]", "D4 J12": "<div class=\"scene\">💻 ☕ 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Her charger after a long video call.\"><rect x=\"4\" y=\"96\" width=\"352\" height=\"10\" rx=\"3\" fill=\"#8a6a4a\"/><rect x=\"30\" y=\"38\" width=\"90\" height=\"56\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"35\" y=\"43\" width=\"80\" height=\"46\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><polygon points=\"22,102 128,102 120,94 30,94\" fill=\"#8a96a3\"/><path d=\"M130 92 q30 0 60 -2\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\"/><rect x=\"190\" y=\"76\" width=\"64\" height=\"20\" rx=\"5\" fill=\"#4a535d\"/><rect x=\"214\" y=\"83\" width=\"16\" height=\"5\" rx=\"2\" fill=\"#8a96a3\"/><path d=\"M206 58 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M254 86 q40 0 60 -30 V20\" stroke=\"#5b6573\" stroke-width=\"3\" fill=\"none\"/><rect x=\"300\" y=\"4\" width=\"34\" height=\"40\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"309\" y=\"12\" width=\"4\" height=\"11\" fill=\"#1b1f24\"/><rect x=\"321\" y=\"12\" width=\"4\" height=\"13\" fill=\"#1b1f24\"/><path d=\"M313 35 a4 4 0 0 1 8 0 v3 h-8 z\" fill=\"#1b1f24\"/><text x=\"222\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her original charger, on the desk</text></svg><div class=\"cap\">Her charger after a long video call.</div></div>\n\n**Ms. Abara's** original charger feels warm after video calls, like a mug of tea that's cooled a bit. It's on her desk, silent, with no smell.\n\n**What do you tell her?**\n\n* [[It's overheating, so replace it today->D4 J12 W]]\n* [[Unplug it whenever she's not watching->D4 J12 W]]\n* [[Wrap it in foil to spread out the heat->D4 J12 W]]\n* [[Warm is normal, not a warning sign->D4 J12 R]]", "D4 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Warm is normal.** Too hot to hold, buzzing, or a burning smell would be different.\"\n\n[[Got it->D4 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the green Warm card again.\"\n\n[[Try again->D4 J12]]]", "D4 J12 R": "(set: $miss to 0)(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]## ✅ Job done\n**Chargers make a little heat.** Keep it on the desk, off beds.\n\n[[Close up shop->D4 Done]]", "D4 Done": "(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]# Day 4 complete!\n\n<div class=\"tool\">🔌 **New tool earned: Cable Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **Coil and check.** Practice the **over-under coil** on a spare cable, then let it fall. Does it uncoil flat? **With a grown-up**, follow your computer's power cord: is it a **surge protector** or just a **power strip**? Is the light on, and is anything daisy-chained?</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Cable Care\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Pull the <b>plug</b>, not the cord. Sharp bends at the neck crack the wires inside.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Gentle curve</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Sharp bend</text><rect x=\"18\" y=\"56\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"18\" y=\"70\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"30\" y=\"50\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#9aa4ae\"/><polygon points=\"70,54 100,60 100,70 70,76\" fill=\"#5d6670\" stroke=\"#ffb347\" stroke-width=\"2\"/><path d=\"M100 65 q55 0 70 60\" stroke=\"#e9ecef\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M161 50 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"218\" y=\"56\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"218\" y=\"70\" width=\"12\" height=\"4\" fill=\"#e9ecef\"/><rect x=\"230\" y=\"50\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#9aa4ae\"/><polygon points=\"270,54 300,60 300,70 270,76\" fill=\"#5d6670\" stroke=\"#ffb347\" stroke-width=\"2\"/><path d=\"M300 65 l12 0 l0 65\" stroke=\"#e9ecef\" stroke-width=\"6\" fill=\"none\" stroke-linejoin=\"miter\"/><path d=\"M318 58 l6 6 l-6 6 l6 6\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\"/><line x1=\"361\" y1=\"41\" x2=\"379\" y2=\"59\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"361\" y1=\"59\" x2=\"379\" y2=\"41\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"85\" y1=\"132\" x2=\"85\" y2=\"84\" stroke=\"#ffb347\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"85,84 88.8,91.0 81.2,91.0\" fill=\"#ffb347\"/><text x=\"85\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">strain relief</text><text x=\"312\" y=\"155\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">wires crack here</text></svg><div class=\"cap\">Pull the <b>plug</b>, not the cord. Sharp bends at the neck crack the wires inside.</div></div>\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Pull the plug\"><rect x=\"70\" y=\"12\" width=\"26\" height=\"46\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"78\" y=\"24\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"86\" y=\"24\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"42\" y=\"26\" width=\"24\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><line x1=\"2\" y1=\"35\" x2=\"42\" y2=\"35\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"58\" y1=\"14\" x2=\"26\" y2=\"14\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"26,14 33.0,10.2 33.0,17.8\" fill=\"#6fe3b5\"/></svg><b>✅ Pull the plug</b>grip the hard end</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"❌ Tight wrap\"><rect x=\"30\" y=\"12\" width=\"40\" height=\"48\" rx=\"5\" fill=\"#9aa4ae\"/><line x1=\"25\" y1=\"20\" x2=\"75\" y2=\"22\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"29\" x2=\"75\" y2=\"31\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"38\" x2=\"75\" y2=\"40\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"47\" x2=\"75\" y2=\"49\" stroke=\"#e9ecef\" stroke-width=\"3\"/><line x1=\"25\" y1=\"56\" x2=\"75\" y2=\"58\" stroke=\"#e9ecef\" stroke-width=\"3\"/><path d=\"M75 20 l8 0 l0 -14\" stroke=\"#e9ecef\" stroke-width=\"3\" fill=\"none\"/><line x1=\"7\" y1=\"7\" x2=\"21\" y2=\"21\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"7\" y1=\"21\" x2=\"21\" y2=\"7\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>❌ Tight wrap</b>sharp bend at the brick</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Over-under\"><ellipse cx=\"46\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"50\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/><ellipse cx=\"54\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"58\" cy=\"35\" rx=\"30\" ry=\"24\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/></svg><b>✅ Over-under</b>twist, flip, repeat: no kinks</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"✅ Loose loops\"><ellipse cx=\"48\" cy=\"35\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"51\" cy=\"37\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"54\" cy=\"39\" rx=\"32\" ry=\"22\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"3\"/><rect x=\"42\" y=\"6\" width=\"14\" height=\"60\" rx=\"4\" fill=\"#ffb347\"/></svg><b>✅ Loose loops</b>hand-sized, reusable tie</div></div>\n\n**Stop signs: replace it. Tape is not a repair.**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🧶</span><b>❌ Frayed jacket</b>split or fuzzy</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Bare wires</b>showing through</div><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ Scorch marks</b>brown or black</div><div class=\"card no\"><span class=\"big\">🫧</span><b>❌ Melted plastic</b>bubbled or warped</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Lint packs into ports. Power it off, then gently scoop it out.\"><line x1=\"40\" y1=\"40\" x2=\"170\" y2=\"40\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"40\" y1=\"90\" x2=\"170\" y2=\"90\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"170\" y1=\"38\" x2=\"170\" y2=\"92\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><circle cx=\"158\" cy=\"52\" r=\"8\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"160\" cy=\"66\" r=\"9\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"157\" cy=\"80\" r=\"8\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"148\" cy=\"60\" r=\"6\" fill=\"#c9c9c9\" opacity=\"0.9\"/><circle cx=\"148\" cy=\"75\" r=\"6\" fill=\"#c9c9c9\" opacity=\"0.9\"/><rect x=\"8\" y=\"52\" width=\"122\" height=\"26\" rx=\"5\" fill=\"#7fd1ff\"/><text x=\"158\" y=\"28\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"bold\">lint</text><text x=\"95\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Plug can't go</text><text x=\"95\" y=\"138\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">all the way in</text><line x1=\"230\" y1=\"30\" x2=\"330\" y2=\"58\" stroke=\"#e8c27a\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M361 44 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Wooden or plastic</text><path d=\"M232 112 h80 a10 10 0 0 0 0 -16 h-70 a8 8 0 0 0 0 12 h60\" stroke=\"#9aa4ae\" stroke-width=\"3\" fill=\"none\"/><line x1=\"361\" y1=\"97\" x2=\"379\" y2=\"115\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"361\" y1=\"115\" x2=\"379\" y2=\"97\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"300\" y=\"150\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Never metal</text></svg><div class=\"cap\">Lint packs into ports. Power it off, then gently scoop it out.</div></div>\n\nPets chew cords. Use **cord protectors** and unplug spare chargers.\n\n<div class=\"warn\">**Grown-up needed:** If a cord or charger is scorched, melted, or has bare wires, a grown-up unplugs it by the plug and takes it out of use.</div>\n\n### Strips, Surges, and Storms\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"They look like twins. Only one soaks up <b>voltage spikes</b>.\"><polyline points=\"8,60 30,60 38,26 46,60 68,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"60\" x2=\"92\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"92,60 85.0,63.8 85.0,56.2\" fill=\"#ff6b6b\"/><rect x=\"96\" y=\"38\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"171\" y=\"65\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Power strip</text><line x1=\"250\" y1=\"60\" x2=\"268\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"268,60 261.0,63.8 261.0,56.2\" fill=\"#ff6b6b\"/><polyline points=\"272,60 294,60 302,26 310,60 332,60\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"366\" y1=\"37\" x2=\"384\" y2=\"55\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"366\" y1=\"55\" x2=\"384\" y2=\"37\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"302\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">gets through</text><polyline points=\"8,150 30,150 38,116 46,150 68,150\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"150\" x2=\"92\" y2=\"150\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"92,150 85.0,153.8 85.0,146.2\" fill=\"#ff6b6b\"/><rect x=\"96\" y=\"128\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><text x=\"166\" y=\"155\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Surge protector</text><circle cx=\"236\" cy=\"137\" r=\"4\" fill=\"#6fe3b5\"/><line x1=\"250\" y1=\"150\" x2=\"268\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"268,150 261.0,153.8 261.0,146.2\" fill=\"#6fe3b5\"/><line x1=\"272\" y1=\"150\" x2=\"332\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\"/><path d=\"M366 146 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"302\" y=\"190\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">soaked up</text></svg><div class=\"cap\">They look like twins. Only one soaks up <b>voltage spikes</b>.</div></div>\n\n**Read the label:**\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🏷️</span><b>✅ Surge wording</b>like \"surge protector\", UL 1449</div><div class=\"card ok\"><span class=\"big\">🧪</span><b>✅ UL or ETL listed</b>a safety lab tested it</div><div class=\"card ok\"><span class=\"big\">🔢</span><b>✅ Joule rating</b>higher is better; several hundred+</div><div class=\"card ok\"><span class=\"big\">🟢</span><b>✅ Protected light</b>off? replace it</div><div class=\"card no\"><span class=\"big\">🤷</span><b>❌ \"Meets UL standards\"</b>vague, not a listing</div><div class=\"card no\"><span class=\"big\">🚫</span><b>❌ No joule rating</b>just a power strip</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Strips plugged into strips overload the first one. It can overheat and start a fire.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Daisy chain</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Each into the wall</text><path d=\"M38 62 q20 0 22 14\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M70 128 q-22 -8 -8 -28 l13 -8\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M85 168 q-22 -8 -8 -24 l13 -8\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"8\" y=\"40\" width=\"30\" height=\"44\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"16\" y=\"50\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"26\" y=\"50\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"55\" y=\"76\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#ffc8a0\"/><rect x=\"65\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"82\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"100\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"118\" y=\"80\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M80 62 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M110 62 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"70\" y=\"120\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"80\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"98\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"115\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"132\" y=\"124\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"85\" y=\"160\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"95\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"112\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"130\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"148\" y=\"164\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><line x1=\"171\" y1=\"41\" x2=\"189\" y2=\"59\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"171\" y1=\"59\" x2=\"189\" y2=\"41\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M248 66 q16 0 29 6\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M248 126 q16 0 29 6\" stroke=\"#c0c7ce\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"222\" y=\"40\" width=\"30\" height=\"120\" rx=\"4\" fill=\"#f1efe6\"/><rect x=\"230\" y=\"60\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"240\" y=\"60\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"230\" y=\"120\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"240\" y=\"120\" width=\"4\" height=\"10\" fill=\"#1b1f24\"/><rect x=\"277\" y=\"64\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"287\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"304\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"322\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"340\" y=\"68\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"277\" y=\"124\" width=\"90\" height=\"16\" rx=\"4\" fill=\"#d9dde1\"/><rect x=\"287\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"304\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"322\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"340\" y=\"128\" width=\"9\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M379 100 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><div class=\"cap\">Strips plugged into strips overload the first one. It can overheat and start a fire.</div></div>\n\nLightning is too big for any surge protector. FEMA says unplug when a storm warning comes.\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">💾</span><b>1. Save</b>your work</div><div class=\"card \"><span class=\"big\">🖥️</span><b>2. Shut down</b>all the way</div><div class=\"card ok\"><span class=\"big\">🔌</span><b>✅ 3. Unplug</b>from the wall, early</div><div class=\"card no\"><span class=\"big\">⚡</span><b>❌ Lightning close?</b>stay away from cords</div></div>\n\n<div class=\"warn\">**Grown-up needed:** Unplug and move power strips and surge protectors with a grown-up, and only with dry hands.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 5->D5 Start]]", "D5 Start": "(set: $miss to 0)# Day 5: Batteries & Charging\n\n<div class=\"scene\">🔋 📦 🔥</div>\n\n*The Inspector sets down a box of bagged, taped-up old batteries.* \"Every phone and laptop here runs on **lithium-ion**. They wear out a little every day. And a damaged one can be a **fire**.\"\n\n\n[[Open the shop->D5 L1]]", "D5 L1": "## 📘 The Inspector's lesson: How Batteries Age\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 100\" role=\"img\" aria-label=\"A <b>charge cycle</b> means 100% used in total, even if it takes two days.\"><rect x=\"8\" y=\"14\" width=\"88\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"96\" y=\"26\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"12\" y=\"18\" width=\"40\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"52\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">50% today</text><text x=\"122\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"26\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">+</text><rect x=\"146\" y=\"14\" width=\"88\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"234\" y=\"26\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"150\" y=\"18\" width=\"40\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"190\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">50% tomorrow</text><text x=\"259\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"26\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">=</text><rect x=\"284\" y=\"14\" width=\"88\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"372\" y=\"26\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"288\" y=\"18\" width=\"80\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><text x=\"330\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">1 cycle</text></svg><div class=\"cap\">A <b>charge cycle</b> means 100% used in total, even if it takes two days.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>Capacity fading</b> is normal. Apple designs Mac laptop batteries to keep up to 80% after 1,000 cycles.\"><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"132\" x2=\"385\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"62\" x2=\"360\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"64\" y=\"37\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">100%</text><text x=\"64\" y=\"67\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">80%</text><text x=\"64\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">0%</text><path d=\"M70 32 C 160 36, 260 48, 360 62\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"70\" cy=\"32\" r=\"6\" fill=\"#6fe3b5\"/><circle cx=\"360\" cy=\"62\" r=\"6\" fill=\"#ffb347\"/><text x=\"215\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Capacity slowly fades</text><text x=\"80\" y=\"156\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">new</text><text x=\"385\" y=\"156\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"end\" font-weight=\"bold\">1,000 cycles</text></svg><div class=\"cap\"><b>Capacity fading</b> is normal. Apple designs Mac laptop batteries to keep up to 80% after 1,000 cycles.</div></div>\n\n**What adds wear, and what's fine:**\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ Heat over 35°C</b>95°F can do lasting harm</div><div class=\"card no\"><span class=\"big\">🚗</span><b>❌ Hot car</b>or a sunny dashboard</div><div class=\"card no\"><span class=\"big\">🛏️</span><b>❌ Under a pillow</b>while it charges</div><div class=\"card no\"><span class=\"big\">🎮</span><b>❌ Gaming + charging</b>in a hot room</div><div class=\"card no\"><span class=\"big\">📅</span><b>❌ Full or empty</b>for weeks or months</div><div class=\"card ok\"><span class=\"big\">🔄</span><b>✅ Partial charges</b>30% to 80% is fine</div><div class=\"card ok\"><span class=\"big\">🧠</span><b>✅ No memory effect</b>never drain to 0% to train it</div><div class=\"card ok\"><span class=\"big\">🛡️</span><b>✅ Charge limit ~80%</b>then staying plugged in is fine</div></div>\n\n**Check battery health:**\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🪟</span><b>Windows</b>powercfg /batteryreport in Command Prompt. Compare design vs full charge capacity.</div><div class=\"card \"><span class=\"big\">💻</span><b>Mac</b>System Settings → Battery → Battery Health</div><div class=\"card \"><span class=\"big\">📱</span><b>iPhone</b>Settings → Battery → Battery Health</div></div>\n\n<div class=\"warn\">**Grown-up needed:** Ask a grown-up before running commands or changing battery settings on a family device.</div>\n\n[[Got it. Send in the next customer->D5 J2]]", "D5 J2": "<div class=\"scene\">💻 ⏳ 😟</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Ms. Rivera's laptop at full charge, then and now\"><rect x=\"30\" y=\"14\" width=\"120\" height=\"76\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"37\" y=\"21\" width=\"106\" height=\"62\" rx=\"3\" fill=\"#2f4a5c\"/><polygon points=\"20,90 160,90 170,102 10,102\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"56\" y=\"38\" width=\"52\" height=\"24\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"108\" y=\"45\" width=\"6\" height=\"10\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"60\" y=\"42\" width=\"44\" height=\"16\" rx=\"3\" fill=\"#6fe3b5\"/><text x=\"90\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">9 hr left</text><rect x=\"212\" y=\"14\" width=\"120\" height=\"76\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"219\" y=\"21\" width=\"106\" height=\"62\" rx=\"3\" fill=\"#2f4a5c\"/><polygon points=\"202,90 342,90 352,102 192,102\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"238\" y=\"38\" width=\"52\" height=\"24\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"290\" y=\"45\" width=\"6\" height=\"10\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"242\" y=\"42\" width=\"44\" height=\"16\" rx=\"3\" fill=\"#6fe3b5\"/><text x=\"272\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">1 hr left</text><text x=\"90\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">when it was new</text><text x=\"272\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">now, 4 years later</text></svg><div class=\"cap\">Same full charge, much less time.</div></div>\n\n**Ms. Rivera's** laptop is four years old. It used to last all day. Now it lasts about an hour.\n\n**What's your first step?**\n\n* [[Drain it to 0% a few times to reset it->D5 J2 W]]\n* [[Check its battery health report now->D5 J2 R]]\n* [[Reinstall the system to fix power use->D5 J2 W]]\n* [[Charge to 100%, leave it plugged a day->D5 J2 W]]", "D5 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Four years of cycles means fading. **Check the battery health report**: design capacity vs full charge capacity.\"\n\n[[Got it->D5 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Battery Health cards again.\"\n\n[[Try again->D5 J2]]]", "D5 J2 R": "(set: $miss to 0)## ✅ Job done\n**The health report shows how much capacity is left.**\n\n[[Next customer->D5 J3]]", "D5 J3": "<div class=\"scene\"><svg viewBox=\"0 0 48 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"tablet\"><rect x=\"3\" y=\"3\" width=\"42\" height=\"54\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"8\" y=\"9\" width=\"32\" height=\"42\" rx=\"2\" fill=\"#2f4a5c\"/><circle cx=\"24\" cy=\"54\" r=\"1.6\" fill=\"#9aa4ae\"/></svg> 🪫 😴</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"He runs it all the way down on purpose.\"><rect x=\"110\" y=\"8\" width=\"140\" height=\"96\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"117\" y=\"15\" width=\"126\" height=\"82\" rx=\"4\" fill=\"#2f4a5c\"/><rect x=\"146\" y=\"38\" width=\"60\" height=\"30\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><rect x=\"206\" y=\"47\" width=\"6\" height=\"12\" rx=\"2\" fill=\"#ff6b6b\"/><text x=\"180\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">0%</text><path d=\"M318 22 a16 16 0 1 0 14 24 a12 12 0 1 1 -14 -24 Z\" fill=\"#7fd1ff\"/><text x=\"180\" y=\"125\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Jayden's tablet, every night</text></svg><div class=\"cap\">He runs it all the way down on purpose.</div></div>\n\n**Jayden** lets his tablet die to 0% every night. \"It trains the battery!\"\n\n**What do you tell him?**\n\n* [[Good plan, but only once a week->D5 J3 W]]\n* [[Only helps if he charges overnight->D5 J3 W]]\n* [[Drain it, then freeze it overnight->D5 J3 W]]\n* [[No memory effect; drains add wear->D5 J3 R]]", "D5 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lithium-ion has **no memory effect**. Deep drains to 0% just **add wear**.\"\n\n[[Got it->D5 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the No memory effect card again.\"\n\n[[Try again->D5 J3]]]", "D5 J3 R": "(set: $miss to 0)## ✅ Job done\n**No training needed.** Partial charges are fine.\n\n[[Next customer->D5 J4]]", "D5 J4": "<div class=\"scene\">🚗 ☀️ 📱</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Tasha's phone on a car dashboard on a sunny day\"><circle cx=\"300\" cy=\"30\" r=\"13\" fill=\"#ffb347\"/><line x1=\"318.0\" y1=\"30.0\" x2=\"325.0\" y2=\"30.0\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"312.7\" y1=\"42.7\" x2=\"317.7\" y2=\"47.7\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"300.0\" y1=\"48.0\" x2=\"300.0\" y2=\"55.0\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"287.3\" y1=\"42.7\" x2=\"282.3\" y2=\"47.7\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"282.0\" y1=\"30.0\" x2=\"275.0\" y2=\"30.0\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"287.3\" y1=\"17.3\" x2=\"282.3\" y2=\"12.3\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"300.0\" y1=\"12.0\" x2=\"300.0\" y2=\"5.0\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"312.7\" y1=\"17.3\" x2=\"317.7\" y2=\"12.3\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"6\" x2=\"260\" y2=\"88\" stroke=\"#7fd1ff\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M14 88 H300 Q330 88 336 104 H14 Z\" fill=\"#4a535d\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><polygon points=\"172,72 232,72 242,88 160,88\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><polygon points=\"178,75 229,75 236,85 168,85\" fill=\"#2f4a5c\"/><line x1=\"205\" y1=\"110\" x2=\"205\" y2=\"93\" stroke=\"#e9ecef\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"205,93 208.8,100.0 201.2,100.0\" fill=\"#e9ecef\"/><text x=\"66\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the dashboard</text><text x=\"205\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Tasha's phone</text></svg><div class=\"cap\">Her phone sat here, behind the windshield, all day.</div></div>\n\n**Tasha** left her phone on the car dashboard on a summer beach day. Now it drains faster.\n\n**What most likely caused it?**\n\n* [[Heat from the sun-baked dashboard->D5 J4 R]]\n* [[Too much data used at the beach->D5 J4 W]]\n* [[Sand blocked the charging port->D5 J4 W]]\n* [[The car radio drained it all night->D5 J4 W]]", "D5 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Heat.** A summer dashboard gets far hotter than 35°C (95°F) and can **permanently** hurt capacity.\"\n\n[[Got it->D5 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Heat and Hot car cards again.\"\n\n[[Try again->D5 J4]]]", "D5 J4 R": "(set: $miss to 0)## ✅ Job done\n**Heat wore the battery.** Keep devices out of hot cars.\n\n[[Next customer->D5 J5]]", "D5 J5": "<div class=\"scene\">🎮 💻 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Full, and on the charger from morning to night.\"><rect x=\"40\" y=\"12\" width=\"150\" height=\"82\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"47\" y=\"19\" width=\"136\" height=\"68\" rx=\"3\" fill=\"#2f4a5c\"/><polygon points=\"30,94 200,94 210,106 20,106\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"30\" y=\"96\" width=\"22 to 0% every single weekend->D5 J5 W]]", "D5 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn on the charge limit** or smart charging. It holds near 80%, so staying plugged in is fine.\"\n\n[[Got it->D5 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Charge limit card again.\"\n\n[[Try again->D5 J5]]]", "D5 J5 R": "(set: $miss to 0)## ✅ Job done\n**Built-in protection keeps it from sitting at 100%.**\n\n[[The Inspector has something to show you->D5 L6]]", "D5 L6": "## 📘 The Inspector's lesson: Long-Term Storage\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Batteries lose charge even when off. Never put one away dead.\"><text x=\"60\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">0%</text><text x=\"200\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">About 50%</text><text x=\"340\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">100%</text><rect x=\"15\" y=\"32\" width=\"86\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"101\" y=\"44\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><line x1=\"48\" y1=\"42\" x2=\"68\" y2=\"62\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"48\" y1=\"62\" x2=\"68\" y2=\"42\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><rect x=\"155\" y=\"32\" width=\"86\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"241\" y=\"44\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"159\" y=\"36\" width=\"39\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><path d=\"M257 52 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><rect x=\"295\" y=\"32\" width=\"86\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"381\" y=\"44\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"299\" y=\"36\" width=\"78\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"60\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Deep discharge</text><text x=\"60\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">may never charge</text><text x=\"200\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Store here</text><text x=\"200\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">40% to 60%</text><text x=\"340\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Ages faster</text><text x=\"340\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">in storage</text></svg><div class=\"cap\">Batteries lose charge even when off. Never put one away dead.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🚪</span><b>✅ Indoor closet</b>cool and dry</div><div class=\"card ok\"><span class=\"big\">🌡️</span><b>✅ Below 32°C</b>90°F (Apple)</div><div class=\"card no\"><span class=\"big\">🏚️</span><b>❌ Hot garage</b>or attic</div><div class=\"card no\"><span class=\"big\">🚗</span><b>❌ Parked car</b>bakes in summer</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 160\" role=\"img\" aria-label=\"Apple says recharge to about 50% at least every 6 months. Checking more often is even safer.\"><rect x=\"50\" y=\"104\" width=\"340\" height=\"26\" fill=\"#ff6b6b\" opacity=\"0.25\"/><text x=\"220\" y=\"123\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">deep discharge zone</text><line x1=\"50\" y1=\"14\" x2=\"50\" y2=\"130\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"50\" y1=\"130\" x2=\"390\" y2=\"130\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><text x=\"44\" y=\"46\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"end\" font-weight=\"bold\">50%</text><text x=\"44\" y=\"134\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">0%</text><polyline points=\"50,42 150,62 150,42 250,62 250,42 350,62 350,42 385,49\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"4\" stroke-linejoin=\"round\"/><line x1=\"162\" y1=\"66\" x2=\"162\" y2=\"46\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"162,46 165.8,53.0 158.2,53.0\" fill=\"#ffb347\"/><line x1=\"262\" y1=\"66\" x2=\"262\" y2=\"46\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"262,46 265.8,53.0 258.2,53.0\" fill=\"#ffb347\"/><line x1=\"362\" y1=\"66\" x2=\"362\" y2=\"46\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"362,46 365.8,53.0 358.2,53.0\" fill=\"#ffb347\"/><text x=\"210\" y=\"90\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">top up every few months</text><text x=\"220\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">months in storage →</text></svg><div class=\"cap\">Apple says recharge to about 50% at least every 6 months. Checking more often is even safer.</div></div>\n\n\"Like a houseplant on vacation: not soaked, not dried out, and somebody checks on it.\"\n\n\n[[Got it. Send in the next customer->D5 J7]]", "D5 J7": "<div class=\"scene\">🗄️ 💻 🐕</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Put away dead for a year. Now the charger does nothing.\"><rect x=\"20\" y=\"66\" width=\"170\" height=\"14\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"20\" y=\"58\" width=\"170\" height=\"10\" rx=\"4\" fill=\"#4a535d\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><path d=\"M190 74 C 230 74, 240 52, 282 52\" stroke=\"#5b6573\" stroke-width=\"5\" fill=\"none\"/><rect x=\"282\" y=\"28\" width=\"44\" height=\"52\" rx=\"6\" fill=\"#e9ecef\"/><rect x=\"294\" y=\"40\" width=\"5\" height=\"12\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"309\" y=\"40\" width=\"5\" height=\"12\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"70\" y=\"12\" width=\"60\" height=\"28\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#ff6b6b\" stroke-width=\"2.5\"/><rect x=\"130\" y=\"20\" width=\"6\" height=\"11\" rx=\"2\" fill=\"#ff6b6b\"/><text x=\"160\" y=\"32\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">0%</text><text x=\"105\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Grandpa Leo's laptop</text><text x=\"105\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">plugged in, still 0%</text><text x=\"304\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the wall</text></svg><div class=\"cap\">Put away dead for a year. Now the charger does nothing.</div></div>\n\n**Grandpa Leo** put his laptop away with a dead battery a year ago. Now it won't charge at all.\n\n**What happened?**\n\n* [[The charger wore out; a new cable fixes it->D5 J7 W]]\n* [[Deep discharge; store at half next time->D5 J7 R]]\n* [[Closet too cold; store it in a car->D5 J7 W]]\n* [[It forgot its settings after a year->D5 J7 W]]", "D5 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"It sat dead and slid into **deep discharge**. Next time: **about half charge**, and top it up.\"\n\n[[Got it->D5 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the 0% battery in the picture again.\"\n\n[[Try again->D5 J7]]]", "D5 J7 R": "(set: $miss to 0)## ✅ Job done\n**Batteries drain even when off, so never store one empty.**\n\n[[Next customer->D5 J8]]", "D5 J8": "<div class=\"scene\"><svg viewBox=\"0 0 48 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"tablet\"><rect x=\"3\" y=\"3\" width=\"42\" height=\"54\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"8\" y=\"9\" width=\"32\" height=\"42\" rx=\"2\" fill=\"#2f4a5c\"/><circle cx=\"24\" cy=\"54\" r=\"1.6\" fill=\"#9aa4ae\"/></svg> 🏚️ ☀️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Charged full, then left in the garage for months.\"><polyline points=\"12,52 120,10 228,52\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"4\" stroke-linejoin=\"round\"/><line x1=\"22\" y1=\"52\" x2=\"22\" y2=\"118\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"218\" y1=\"52\" x2=\"218\" y2=\"118\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"40\" y=\"104\" width=\"160\" height=\"7\" rx=\"2\" fill=\"#8a6a45\"/><rect x=\"92\" y=\"50\" width=\"56\" height=\"54\" rx=\"9\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"99\" y=\"57\" width=\"42\" height=\"40\" rx=\"4\" fill=\"#2f4a5c\"/><rect x=\"104\" y=\"66\" width=\"26\" height=\"16\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"130\" y=\"71\" width=\"6\" height=\"6\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"108\" y=\"70\" width=\"18\" height=\"8\" rx=\"3\" fill=\"#ffb347\"/><text x=\"120\" y=\"98\" font-family=\"Segoe UI,Inter,sans-seri \n<div class=\"warn\">**Grown-up needed:** A swollen or damaged battery is a grown-up job from the moment you spot it. Don't handle it yourself.</div>\n\n[[Got it. Send in the next customer->D5 J10]]", "D5 J10": "<div class=\"scene\">👦 💻 ⬆️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Ollie's laptop with the trackpad edge raised\"><rect x=\"14\" y=\"14\" width=\"140\" height=\"92\" rx=\"8\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"24\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"37\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"50\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"63\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"76\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"89\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"102\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"115\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"128\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"141\" y=\"22\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"24\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"37\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"50\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"63\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"76\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"89\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"102\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"115\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"128\" y=\"34\" width=\"10\" height=\"9\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"141\" y=\"34\" width=\"10\" heig D5 J12 W]]\n* [[Wrap it in paper towels, then trash it->D5 J12 W]]\n* [[Tape the ends, take it to a drop-off->D5 J12 R]]\n* [[Leave it in the sun to use it all up->D5 J12 W]]", "D5 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Never trash or recycling bins. Even dead ones can spark when crushed. **Tape the ends, bag it, drop it off.**\"\n\n[[Got it->D5 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the NEVER and DO THIS picture again.\"\n\n[[Try again->D5 J12]]]", "D5 J12 R": "(set: $miss to 0)(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]## ✅ Job done\n**Battery drop-offs keep fires out of garbage trucks.**\n\n[[Close up shop->D5 Done]]", "D5 Done": "(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]# Day 5 complete!\n\n<div class=\"tool\">🔋 **New tool earned: Battery Tester**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **Battery check.** With a grown-up, find your device's battery health report or setting. In your Tech Notebook, write the health percentage (or design and full charge capacity). Note if a charge limit or optimized charging is on.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### How Batteries Age\n<div class=\"pic\"><svg viewBox=\"0 0 400 100\" role=\"img\" aria-label=\"A <b>charge cycle</b> means 100% used in total, even if it takes two days.\"><rect x=\"8\" y=\"14\" width=\"88\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"96\" y=\"26\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"12\" y=\"18\" width=\"40\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"52\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">50% today</text><text x=\"122\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"26\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">+</text><rect x=\"146\" y=\"14\" width=\"88\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"234\" y=\"26\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"150\" y=\"18\" width=\"40\" height=\"32\" rx=\"3\" fill=\"#ffb347\"/><text x=\"190\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">50% tomorrow</text><text x=\"259\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"26\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">=</text><rect x=\"284\" y=\"14\" width=\"88\" height=\"40\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"372\" y=\"26\" width=\"6\" height=\"16\" rx=\"2\" fill=\"#e9ecef\"/><rect x=\"288\" y=\"18\" width=\"80\" height=\"32\" rx=\"3\" fill=\"#6fe3b5\"/><text x=\"330\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">1 cycle</text></svg><div class=\"cap\">A <b>charge cycle</b> means 100% used in total, even if it takes two days.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>Capacity fading</b> is normal. Apple designs Mac laptop batteries to keep up to 80% after 1,000 cycles.\"><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"132\" x2=\"385\" y2=\"132\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"70\" y1=\"62\" x2=\"360\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"1\" stroke-dasharray=\"4 4\"/><text x=\"64\" y=\"37\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"end\" font-weight=\"normal\">100%</text
