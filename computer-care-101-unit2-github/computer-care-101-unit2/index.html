.pic svg { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
.cap { font-size: 0.85em; color: #cfd6dd; margin-top: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 10px; margin: 1em 0; }
.card { background: #2a2f36; border: 2px solid #2a2f36; border-radius: 10px; padding: 8px; text-align: center; font-size: 0.8em; line-height: 1.3; }
.card .big { font-size: 2.2em; display: block; line-height: 1.2; }
.card svg { width: 96px; height: 64px; display: block; margin: 0 auto 4px; }
.card b { display: block; color: #ffb347; margin: 2px 0; }
.card.ok { border-color: #6fe3b5; } .card.no { border-color: #ff6b6b; }
.scene { font-size: 2.6em; text-align: center; letter-spacing: 0.15em; margin: 0.2em 0; }

tw-passage li{margin:.2em 0}
tw-link{cursor:pointer;display:inline}
tw-link:focus-visible{outline:2px solid #7fd1ff;outline-offset:2px}
.warn{border-left:4px solid #ff6b6b;background:#2a2f36;margin:1em 0;padding:.5em 1em}
h1:focus,h2:focus{outline:none}
hr{border:0;border-top:1px solid #3a414a;margin:1.2em 0}
.controls{max-width:42em;margin:2em auto 0;display:flex;gap:12px;font-size:.85em}
.controls button{background:none;border:1px solid #3a414a;color:#aab4be;border-radius:6px;padding:.4em .9em;cursor:pointer;font:inherit}
.controls button:hover{color:#e9ecef;border-color:#7fd1ff}
.controls button:disabled{opacity:.35;cursor:default}

1 J4 W]]\n* [[Use a longer cable, glass blocks signal->D1 J4 W]]\n* [[Use a mouse pad; glass has no texture->D1 J4 R]]\n* [[Raise the DPI so it sees through glass->D1 J4 W]]", "D1 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor needs **texture**, and glass has none. A **mouse pad** fixes it. Clean the sensor with air or a dry swab only.\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Read the mouse picture's caption again.\n\n[[Try again->D1 J4]]]", "D1 J4 R": "(set: $miss to 0)## ✅ Job done\n**A mouse pad gives the sensor texture to track.**\n\n[[Next customer->D1 J5]]", "D1 J5": "<div class=\"scene\">⌨️ 🐕 🧹</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Crumbs and fur are packed between and under the tall keys.\"><rect x=\"16\" y=\"88\" width=\"328\" height=\"14\" rx=\"3\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"44\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"26,72 70,72 64,42 32,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"98\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"80,72 124,72 118,42 86,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"152\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"134,72 178,72 172,42 140,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"206\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"188,72 232,72 226,42 194,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"260\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"242,72 286,72 280,42 248,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"314\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"296,72 340,72 334,42 302,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"74\" cy=\"84\" r=\"3\" fill=\"#c9a46b\"/><circle cx=\"78\" cy=\"78\" r=\"2.5\" fill=\"#c9a46b\"/><circle cx=\"126\" cy=\"85\" r=\"3.5\" fill=\"#c9a46b\"/><circle cx=\"182\" cy=\"84\" r=\"3\" fill=\"#c9a46b\"/><circle cx=\"186\" cy=\"78\" r=\"2\" fill=\"#c9a46b\"/><circle cx=\"236\" cy=\"85\" r=\"3\" fill=\"#c9a46b\"/><circle cx=\"290\" cy=\"83\" r=\"3.5\" fill=\"#c9a46b\"/><circle cx=\"44\" cy=\"84\" r=\"2.5\" fill=\"#c9a46b\"/><path d=\"M92 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M146 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M200 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M256 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M310 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"180\" y=\"24\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">tall keys, side view</text><text x=\"180\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Grandpa Leo's keyboard, up close</text></svg><div class=\"cap\">Crumbs and fur are packed between and under the tall keys.</div></div>\n\n**Grandpa Leo's** mechanical keyboard is full of crumbs and dog fur. He grabs the house vacuum.\n\n**Better plan?**\n\n* [[Vacuum it on the lowest setting only->D1 J5 W]]\n* [[Pull the caps with a puller, then use air->D1 J5 R]]\n* [[Rinse it in the sink so the fur floats out->D1 J5 W]]\n* [[Pry keys off with a butter knife, vacuum->D1 J5 W]]", "D1 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Vacuums build **static**. Snap a photo, **pull the caps with a puller**, then use **compressed air**.\"\n\n[[Got it->D1 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the House vacuum card and the keyboard picture.\n\n[[Try again->D1 J5]]]", "D1 J5 R": "(set: $miss to 0)## ✅ Job done\n**Puller, then compressed air.** Photo the layout first.\n\n[[Next customer->D1 J6]]", "D1 J6": "<div class=\"scene\">👧 💻 🖥️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Count the slanted corners on the plug end.\"><path d=\"M8 112 C 60 112, 70 60, 118 60\" stroke=\"#5b6573\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"116\" y=\"47\" width=\"40\" height=\"26\" rx=\"4\" fill=\"#4a535d\"/><rect x=\"156\" y=\"51\" width=\"22\" height=\"18\" fill=\"#c9d1d9\"/><line x1=\"184\" y1=\"60\" x2=\"218\" y2=\"60\" stroke=\"#9aa4ae\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><path d=\"M224 30 H346 V78 H240 L224 62 Z\" fill=\"#c9d1d9\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"242\" y=\"42\" width=\"86\" height=\"12\" rx=\"2\" fill=\"#1b1f24\"/><text x=\"90\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the monitor's cable</text><text x=\"285\" y=\"102\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the plug end, up close</text></svg><div class=\"cap\">Count the slanted corners on the plug end.</div></div>\n\n**Nora's** neck hurts from looking down at her laptop. She borrowed a monitor. Look at its plug.\n\n**Which port, and where does the screen go?**\n\n* [[HDMI; top of screen level with her chin->D1 J6 W]]\n* [[Ethernet; top of screen right at eye level->D1 J6 W]]\n* [[HDMI; top of screen a bit above her head->D1 J6 W]]\n* [[DisplayPort; top at or just below eyes->D1 J6 R]]", "D1 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"One slanted corner is **DisplayPort**. The **top of the screen goes at or a little below eye level**.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Count corners on the port cards, then check the desk picture.\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**DisplayPort, with the top of the screen at or just below eye level.**\n\n[[Next customer->D1 J7]]", "D1 J7": "<div class=\"scene\">🖲️ 🔋 😤</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"New batteries are in. The ball still skips and sticks.\"><path d=\"M40 100 C 20 66, 40 14, 112 12 C 190 12, 214 56, 206 100 Z\" fill=\"#2a2f36\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><circle cx=\"104\" cy=\"62\" r=\"32\" fill=\"#c0475e\" stroke=\"#1b1f24\" stroke-width=\"2\"/><ellipse cx=\"94\" cy=\"50\" rx=\"9\" ry=\"6\" fill=\"#fff\" opacity=\"0.35\"/><rect x=\"150\" y=\"34\" width=\"38\" height=\"22\" rx=\"6\" fill=\"#4a535d\" stroke=\"#9aa4ae\" stroke-width=\"1.5\"/><rect x=\"150\" y=\"62\" width=\"38\" height=\"22\" rx=\"6\" fill=\"#4a535d\" stroke=\"#9aa4ae\" stroke-width=\"1.5\"/><rect x=\"246\" y=\"44\" width=\"50\" height=\"22\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"296\" y=\"50\" width=\"5\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"250\" y=\"48\" width=\"42\" height=\"14\" rx=\"2\" fill=\"#6fe3b5\"/><rect x=\"246\" y=\"74\" width=\"50\" height=\"22\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"296\" y=\"80\" width=\"5\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"250\" y=\"78\" width=\"42\" height=\"14\" rx=\"2\" fill=\"#6fe3b5\"/><text x=\"122\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Patel's trackball</text><text x=\"274\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">fresh batteries</text></svg><div class=\"cap\">New batteries are in. The ball still skips and sticks.</div></div>\n\n**Mr. Patel's** wireless trackball skips and sticks. Fresh batteries didn't help.\n\n**What should he check next?**\n\n* [[Order a new one, since batteries failed->D1 J7 W]]\n* [[Pop out the ball, clean the support dots->D1 J7 R]]\n* [[Soak it in warm, soapy water overnight->D1 J7 W]]\n* [[Spray alcohol into the hole until it works->D1 J7 W]]", "D1 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Batteries are ruled out. Gunk hides on the **support dots** under the ball.\"\n\n[[Got it->D1 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Read the mouse picture's caption again.\n\n[[Try again->D1 J7]]]", "D1 J7 R": "(set: $miss to 0)## ✅ Job done\n**Clean the support dots with a barely damp swab.**\n\n[[The Inspector has something to show you->D1 L8]]", "D1 L8": "## 📘 The Inspector's lesson: Why Computers Get Sick\n\n\"Almost every sick machine I see was hurt by one of **five enemies**.\"\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 290\" role=\"img\" aria-label=\"Unit 1 kept machines <b>clean</b>. Unit 2 keeps them <b>healthy</b>.\"><defs><linearGradient id=\"u2d1scr\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3a4552\"/><stop offset=\"1\" stop-color=\"#1b1f24\"/></linearGradient></defs><rect x=\"162\" y=\"118\" width=\"76\" height=\"52\" rx=\"5\" fill=\"url(#u2d1scr)\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"194\" y=\"170\" width=\"12\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"180\" y=\"180\" width=\"40\" height=\"5\" rx=\"2\" fill=\"#9aa4ae\"/><circle cx=\"188\" cy=\"138\" r=\"3\" fill=\"#e9ecef\"/><circle cx=\"212\" cy=\"138\" r=\"3\" fill=\"#e9ecef\"/><path d=\"M188 156 q12 -9 24 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/><rect x=\"196\" y=\"6\" width=\"8\" height=\"28\" rx=\"4\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"198\" y=\"18\" width=\"4\" height=\"16\" fill=\"#ff6b6b\"/><circle cx=\"200\" cy=\"38\" r=\"7\" fill=\"#ff6b6b\"/><path d=\"M210 12 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M210 19 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"200\" y=\"66\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">1. Heat</text><text x=\"200\" y=\"84\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">slows, then shuts off</text><circle cx=\"316\" cy=\"108\" r=\"9\" fill=\"#8f979f\"/><circle cx=\"330\" cy=\"100\" r=\"11\" fill=\"#8f979f\"/><circle cx=\"344\" cy=\"108\" r=\"9\" fill=\"#8f979f\"/><circle cx=\"324\" cy=\"114\" r=\"8\" fill=\"#8f979f\"/><circle cx=\"338\" cy=\"115\" r=\"8\" fill=\"#8f979f\"/><circle cx=\"352\" cy=\"98\" r=\"4\" fill=\"#8f979f\"/><circle cx=\"308\" cy=\"98\" r=\"3\" fill=\"#8f979f\"/><text x=\"330\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#c3cad1\" text-anchor=\"middle\" font-weight=\"bold\">2. Dust</text><text x=\"330\" y=\"162\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">traps the heat</text><polygon points=\"322,192 306,215 317,215 313,232 330,208 319,208\" fill=\"#ffb347\"/><text x=\"318\" y=\"252\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Power</text><text x=\"318\" y=\"270\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">spikes fry parts</text><path d=\"M82 192 C86 202 96 212 96 220 A14 14 0 0 1 68 220 C68 212 78 202 82 192 Z\" fill=\"#7fd1ff\"/><text x=\"82\" y=\"252\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">4. Moisture</text><text x=\"82\" y=\"270\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">shorts and crust</text><rect x=\"52\" y=\"89\" width=\"36\" height=\"28\" rx=\"3\" fill=\"#2a2f36\" stroke=\"#e9ecef\" stroke-width=\"2\"/><path d=\"M58 89 l6 9 l-4 6 l10 5 l-2 8 M68 104 l12 -6 l6 -9\" stroke=\"#ff6b6b\" stroke-width=\"2\" fill=\"none\"/><text x=\"70\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">5. Bumps</text><text x=\"70\" y=\"162\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">cracks, loose plugs</text><line x1=\"200\" y1=\"98\" x2=\"200\" y2=\"112\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"200,112 196.2,105.0 203.8,105.0\" fill=\"#ff6b6b\"/><line x1=\"286\" y1=\"122\" x2=\"246\" y2=\"136\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"246,136 251.4,130.1 253.9,137.3\" fill=\"#ff6b6b\"/><line x1=\"114\" y1=\"122\" x2=\"154\" y2=\"136\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"154,136 146.1,137.3 148.6,130.1\" fill=\"#ff6b6b\"/><line x1=\"282\" y1=\"206\" x2=\"240\" y2=\"176\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"240,176 247.9,177.0 243.5,183.2\" fill=\"#ff6b6b\"/><line x1=\"118\" y1=\"206\" x2=\"160\" y2=\"176\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"160,176 156.5,183.2 152.1,177.0\" fill=\"#ff6b6b\"/></svg><div class=\"cap\">Unit 1 kept machines <b>clean</b>. Unit 2 keeps them <b>healthy</b>.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"A <b>power surge</b> is a sudden spike of extra voltage. Storms are a classic cause.\"><polyline points=\"20,72 160,72 160,112 236,112 236,14 252,72 384,72\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polyline points=\"236,112 236,14 252,72\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linejoin=\"round\"/><text x=\"88\" y=\"62\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">normal power</text><text x=\"198\" y=\"134\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">power out</text><text x=\"262\" y=\"26\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">SPIKE when it</text><text x=\"262\" y=\"44\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">comes back!</text><text x=\"320\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">zap: parts fried</text></svg><div class=\"cap\">A <b>power surge</b> is a sudden spike of extra voltage. Storms are a classic cause.</div></div>\n\n**Clues:**\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🐢</span><b>Hot + slow</b>= Heat (throttling)</div><div class=\"card \"><span class=\"big\">🌫️</span><b>Fuzzy vents</b>= Dust</div><div class=\"card \"><span class=\"big\">⚫</span><b>Dead after a storm</b>= Power surge</div><div class=\"card no\"><span class=\"big\">🔌</span><b>❌ Frayed cord</b>= Power: stop using it</div><div class=\"card \"><span class=\"big\">🟢</span><b>Green or white crust</b>= Moisture (corrosion)</div><div class=\"card \"><span class=\"big\">💥</span><b>Cracked, or works at one angle</b>= Bumps</div></div>\n\n<div class=\"warn\">**Grown-up needed:** A frayed cable, a burning smell, or a device too hot to hold means stop and tell a grown-up. Never tape up a damaged power ort, up close</text></svg><div class=\"cap\">Look closely at the metal in the port.</div></div>\n\n**Tasha** kept an old laptop in a damp basement for a year. The USB port has crusty green spots and won't work.\n\n**Which enemy did this?**\n\n* [[Bumps, from sitting on a shelf so long->D1 J11 W]]\n* [[Heat, from the furnace in the basement->D1 J11 W]]\n* [[Moisture, which slowly corroded the metal->D1 J11 R]]\n* [[Dust, which slowly turned green over time->D1 J11 W]]", "D1 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Moisture.** Damp air **corrodes** metal. It turns crusty and stops connecting.\"\n\n[[Got it->D1 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the green crust clue card.\n\n[[Try again->D1 J11]]]", "D1 J11 R": "(set: $miss to 0)(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]## ✅ Job done\n**Moisture.** Store electronics somewhere dry.\n\n[[Close up shop->D1 Done]]", "D1 Done": "(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]# Day 1 complete!\n\n<div class=\"tool\">📒 **New tool earned: Tech Notebook**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Start your **Tech Notebook**. List every device you use. For each, write its **type** (see the device types below) and **one care habit** from Unit 1. Bonus: write which of the **five enemies** it faces most.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Unit 1 in Five Minutes\n**Device types:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Laptop\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"4  Frayed cord</b>= Power: stop using it</div><div class=\"card \"><span class=\"big\">🟢</span><b>Green or white crust</b>= Moisture (corrosion)</div><div class=\"card \"><span class=\"big\">💥</span><b>Cracked, or works at one angle</b>= Bumps</div></div>\n\n<div class=\"warn\">**Grown-up needed:** A frayed cable, a burning smell, or a device too hot to hold means stop and tell a grown-up. Never tape up a damaged power cord yourself.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 2->D2 Start]]", "D2 Start": "(set: $miss to 0)# Day 2: Screens, Cases & Hinges\n\n<div class=\"scene\">💻 📝 💥</div>\n\n*The Inspector tilts a laptop. A faint rectangle glows on the screen.* \"Someone closed it on a sticky-note pad. Screens cost the most and hurt the easiest.\"\n\n\n[[Open the shop->D2 L1]]", "D2 L1": "## 📘 The Inspector's lesson: How Screens Are Built\n\n\"Two kinds of screen. Each has its own weak spot.\"\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"<b>LCD</b>: most laptops and monitors. <b>OLED</b>: many phones and TVs, some laptops.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">LCD</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">OLED</text><line x1=\"50\" y1=\"56\" x2=\"50\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"50,32 53.8,39.0 46.2,39.0\" fill=\"#ffe08a\"/><line x1=\"80\" y1=\"56\" x2=\"80\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"80,32 83.8,39.0 76.2,39.0\" fill=\"#ffe08a\"/><line x1=\"120\" y1=\"56\" x2=\"120\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"120,32 123.8,39.0 116.2,39.0\" fill=\"#ffe08a\"/><line x1=\"150\" y1=\"56\" x2=\"150\" y2=\"32\" stroke=\"#ffe08 class=\"cap\"><b>LCD</b>: most laptops and monitors. <b>OLED</b>: many phones and TVs, some laptops.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 175\" role=\"img\" aria-label=\"A ghost that fades is <b>image retention</b>. One that stays is <b>burn-in</b>.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Pressure mark</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Burn-in</text><rect x=\"20\" y=\"30\" width=\"160\" height=\"102\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"26\" y=\"36\" width=\"148\" height=\"90\" rx=\"2\" fill=\"#e9ecef\"/><ellipse cx=\"100\" cy=\"88\" rx=\"26\" ry=\"18\" fill=\"#ff6b6b\" opacity=\"0.45\"/><ellipse cx=\"100\" cy=\"88\" rx=\"18\" ry=\"12\" fill=\"#ffb347\" opacity=\"0.6\"/><ellipse cx=\"100\" cy=\"88\" rx=\"10\" ry=\"6\" fill=\"#7fd1ff\" opacity=\"0.8\"/><path d=\"M150 30 L106 82 L112 86 Z\" fill=\"#e8c27a\"/><rect x=\"220\" y=\"30\" width=\"160\" height=\"102\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"226\" y=\"36\" width=\"148\" height=\"90\" rx=\"2\" fill=\"#2d4a5e\"/><polygon points=\"226,126 270,90 300,108 340,80 374,126\" fill=\"#3f6b55\"/><rect x=\"234\" y=\"44\" width=\"50\" height=\"9\" rx=\"3\" fill=\"#ffffff\" opacity=\"0.28\"/><rect x=\"340\" y=\"44\" width=\"26\" height=\"26\" rx=\"3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" opacity=\"0.28\"/><text x=\"100\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">LCD: hard pokes</text><text x=\"100\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">squeeze the layers</text><text x=\"300\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">OLED: same image</text><text x=\"300\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">for hours leaves a ghost</text></svg><div class=\"cap\">A ghost that fades is <b>image retention</b>. One that stays is <b>burn-in</b>.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"<b>Glossy</b> = mirror glare. <b>Matte</b> coating softens it. Either way, keep bright light to the side.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Window behind you</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Window to the side</text><rect x=\"60\" y=\"34\" width=\"80\" height=\"10\" rx=\"3\" fill=\"#9aa4ae\"/><text x=\"54\" y=\"44\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"end\" font-weight=\"normal\">screen</text><circle cx=\"100\" cy=\"112\" r=\"14\" fill=\"#e8c27a\"/><text x=\"100\" y=\"117\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">you</text><rect x=\"40\" y=\"160\" width=\"120\" height=\"12\" fill=\"#fff3b0\"/><text x=\"100\" y=\"188\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#fff3b0\" text-anchor=\"middle\" font-weight=\"normal\">window</text><line x1=\"70\" y1=\"158\" x2=\"82\" y2=\"48\" stroke=\"#ffe08a\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"82,48 85.1,55.4 77.4,54.6\" fill=\"#ffe08a\"/><line x1=\"84\" y1=\"48\" x2=\"96\" y2=\"96\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"96,96 90.6,90.1 98.0,88.3\" fill=\"#ff6b6b\"/><line x1=\"141\" y1=\"103\" x2=\"159\" y2=\"121\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"141\" y1=\"121\" x2=\"159\" y2=\"103\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><rect x=\"260\" y=\"34\" width=\"80\" height=\"10\" rx=\"3\" fill=\"#9aa4ae\"/><text x=\"254\" y=\"44\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"end\" font-weight=\"normal\">screen</text><circle cx=\"300\" cy=\"112\" r=\"14\" fill=\"#e8c27a\"/><text x=\"300\" y=\"117\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">you</text><rect x=\"384\" y=\"40\" width=\"12\" height=\"110\" fill=\"#fff3b0\"/><line x1=\"380\" y1=\"95\" x2=\"330\" y2=\"95\" stroke=\"#ffe08a\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"330,95 337.0,91.2 337.0,98.8\" fill=\"#ffe08a\"/><path d=\"M241 112 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><div class=\"cap\"><b>Glossy</b> = mirror glare. <b>Matte</b> coating softens it. Either way, keep bright light to the side.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">👆</span><b>✅ Taps, not jabs</b>point with the cursor</div><div class=\"card ok\"><span class=\"big\">🔅</span><b>✅ Lower brightness</b>or use auto</div><div class=\"card ok\"><span class=\"big\">💤</span><b>✅ Let it sleep</b>when you walk away</div><div class=\"card ok\"><span class=\"big\">🎮</span><b>✅ Shrink the HUD</b>or hide it</div><div class=\"card no\"><span class=\"big\">🧴</span><b>❌ Ammonia</b>in window cleaner, strips coatings</div><div class=\"card no\"><span class=\"big\">⚠️</span><b>❌ Alcohol-heavy</b>check the maker first</div></div>\n\n**What kind is yours?** Show a black picture in a dark room, then look for reflections. Not sure? Look up the model name with a grown-up.\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🌑</span><b>LCD</b>black image in a dark room glows dark gray</div><div class=\"card \"><span class=\"big\">⬛</span><b>OLED</b>black image in a dark room looks totally off</div><div class=\"card \"><span class=\"big\">🪞</span><b>Glossy</b>you can see a sharp mirror reflection</div><div class=\"card \"><span class=\"big\">🌫️</span><b>Matte</b>reflections look soft and blurry</div></div>\n\nCoatings are delicate. **Follow the maker's guide.** Dell says no alcohol on its monitors.\n\n[[Got it. Send in the next customer->D2 J2]]", "D2 J2": "<div class=\"scene\">👩‍💼 💅 🌈</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"Look at where the rainbow blotch sits.\"><rect x=\"64\" y=\"8\" width=\"182\" height=\"94\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"70\" y=\"14\" width=\"170\" height=\"82\" rx=\"2\" fill=\"#e9ecef\"/><polygon points=\"64,102 246,102 264,124 46,124\" fill=\"#8a96a3\"/><rect x=\"84\" y=\"26\" width=\"120\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"84\" y=\"40\" width=\"90\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"84\" y=\"54\" width=\"130\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"84\" y=\"68\" width=\"70\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><ellipse cx=\"178\" cy=\"62\" rx=\"20\" ry=\"13\" fill=\"#ff6b6b\" opacity=\"0.45\"/><ellipse cx=\"178\" cy=\"62\" rx=\"14\" ry=\"9\" fill=\"#ffb347\" opacity=\"0.6\"/><ellipse cx=\"178\" cy=\"62\" rx=\"8\" ry=\"5\" fill=\"#6fe3b5\" opacity=\"0.7\"/><ellipse cx=\"178\" cy=\"62\" rx=\"4\" ry=\"2.5\" fill=\"#7fd1ff\"/><g transform=\"rotate(-20 190 60)\"><rect x=\"190\" y=\"51\" width=\"60\" height=\"18\" rx=\"9\" fill=\"#e8c27a\"/><rect x=\"192\" y=\"54\" width=\"14\" height=\"12\" rx=\"5\" fill=\"#ffd9e0\"/></g><text x=\"155\" y=\"146\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Ms. Abara's screen, where she taps</text></svg><div class=\"cap\">Look at where the rainbow blotch sits.</div></div>\n\n**Ms. Abara** taps her laptop screen with her fingernail when she explains things. Now a rainbow blotch sits right where she taps.\n\n**What's happening?**\n\n* [[Fingernail pressure squeezes the LCD->D2 J2 R]]\n* [[OLED burn-in from one still picture->D2 J2 W]]\n* [[Skin oil has soaked into the pixels->D2 J2 W]]\n* [[The coating reflects the bright room->D2 J2 W]]", "D2 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **pressure mark**. Her nail keeps **squeezing the LCD layers** in one spot.\"\n\n[[Got it->D2 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pressure mark picture again.\"\n\n[[Try again->D2 J2]]]", "D2 J2 R": "(set: $miss to 0)## ✅ Job done\n**Pressure on the LCD layers.** Point with the cursor instead. Repeated jabs can leave it for good.\n\n[[Next customer->D2 J3]]", "D2 J3": "<div class=\"scene\">🎮 📺 👻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look at the top corners of the movie.\"><rect x=\"13\" y=\"9\" width=\"155\" height=\"92\" rx=\"5\" fill=\"#3a4048\"/><rect x=\"18\" y=\"14\" width=\"145\" height=\"82\" fill=\"#1b1f24\"/><rect x=\"18\" y=\"14\" width=\"145\" height=\"49.199999999999996\" fill=\"#2d4a5e\"/><polygon points=\"18,96 61.5,59.1 97.75,75.5 134.0,50.9 163,71.4 163,96\" fill=\"#3f6b55\"/><rect x=\"24\" y=\"20\" width=\"44\" height=\"8\" rx=\"3\" fill=\"#ff6b6b\"/><rect x=\"133\" y=\"20\" width=\"24\" height=\"24\" rx=\"2\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"76.5\" y=\"101\" width=\"28\" height=\"8\" fill=\"#3a4048\"/><rect x=\"193\" y=\"9\" width=\"155\" height=\"92\" rx=\"5\" fill=\"#3a4048\"/><rect x=\"198\" y=\"14\" width=\"145\" height=\"82\" fill=\"#1b1f24\"/><rect x=\"198\" y=\"14\" width=\"145\" height=\"49.199999999999996\" fill=\"#2d4a5e\"/><polygon points=\"198,96 241.5,59.1 277.75,75.5 314.0,50.9 343,71.4 343,96\" fill=\"#3f6b55\"/><circle cx=\"250\" cy=\"40\" r=\"10\" fill=\"#ffe08a\" opacity=\"0.8\"/><rect x=\"204\" y=\"20\" width=\"44\" height=\"8\" rx=\"3\" fill=\"#ffffff\" opacity=\"0.25\"/><rect x=\"313\" y=\"20\" width=\"24\" height=\"24\" rx=\"2\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2.5\" opacity=\"0.25\"/><rect x=\"256.5\" y=\"101\" width=\"28\" height=\"8\" fill=\"#3a4048\"/><text x=\"90\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her game, for hours</text><text x=\"270\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">a movie, later</text></svg><div class=\"cap\">Look at the top corners of the movie.</div></div>\n\n**Ava** plays the same game for hours on her OLED TV. Now she sees a faint ghost of the health bar and map during movies.\n\n**What's happening, and what helps?**\n\n* [[Pressure marks; stop tapping the TV->D2 J3 W]]\n* [[Dust; wipe the corners of the screen->D2 J3 W]]\n* [[Too dim; turn brightness all the way up->D2 J3 W]]\n* [[Burn-in; dim it and shrink the HUD->D2 J3 R]]", "D2 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **burn-in**. Those pixels showed the same bright HUD for hours. **Lower brightness and shrink the HUD.**\"\n\n[[Got it->D2 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the burn-in picture and the green cards.\"\n\n[[Try again->D2 J3]]]", "D2 J3 R": "(set: $miss to 0)## ✅ Job done\n**Burn-in from a static HUD.** If the ghost fades, it was only image retention.\n\n[[Next customer->D2 J4]]", "D2 J4": "<div class=\"scene\">🪟 💻 😣</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"The bright shape is the glass door, mirrored in her screen.\"><rect x=\"74\" y=\"8\" width=\"202\" height=\"96\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"80\" y=\"14\" width=\"190\" height=\"84\" rx=\"2\" fill=\"#2a3a48\"/><polygon points=\"74,104 276,104 294,126 56,126\" fill=\"#8a96a3\"/><rect x=\"150\" y=\"22\" width=\"56\" height=\"72\" fill=\"#fff3b0\" opacity=\"0.75\"/><line x1=\"178\" y1=\"22\" x2=\"178\" y2=\"94\" stroke=\"#2a3a48\" stroke-width=\"4\"/><line x1=\"150\" y1=\"58\" x2=\"206\" y2=\"58\" stroke=\"#2a3a48\" stroke-width=\"3\"/><line x1=\"96\" y1=\"90\" x2=\"130\" y2=\"24\" stroke=\"#ffffff\" stroke-width=\"3\" opacity=\"0.25\"/><line x1=\"230\" y1=\"90\" x2=\"256\" y2=\"40\" stroke=\"#ffffff\" stroke-width=\"3\" opacity=\"0.25\"/><text x=\"175\" y=\"146\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Ms. Doyle's glossy screen, afternoon</text></svg><div class=\"cap\">The bright shape is the glass door, mirrored in her screen.</div></div>\n\n**Ms. Doyle** sits with a glass door right behind her. Her glossy screen mirrors the bright door, and she squints all afternoon.\n\n**Best fix?**\n\n* [[Turn the brightness all the way down->D2 J4 W]]\n* [[Wipe it with window cleaner to cut glare->D2 J4 W]]\n* [[Turn the desk so the door is at the side->D2 J4 R]]\n* [[Press the screen flat to cut reflection->D2 J4 W]]", "D2 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Glossy screens act like mirrors. **Turn the desk so the door is to the side.**\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the window picture again.\"\n\n[[Try again->D2 J4]]]", "D2 J4 R": "(set: $miss to 0)## ✅ Job done\n**Move the light to the side.** Window cleaner and pressing can both damage the screen.\n\n[[The Inspector has something to show you->D2 L5]]", "D2 L5": "## 📘 The Inspector's lesson: Cleaning a Screen, Technician Style\n\n\"Five steps, in order.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Off + unplug\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fil \"0 0 100 70\" role=\"img\" aria-label=\"4. Gentle strokes\"><rect x=\"8\" y=\"4\" width=\"84\" height=\"58\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"14\" y=\"10\" width=\"72\" height=\"46\" rx=\"2\" fill=\"#1b1f24\"/><line x1=\"24\" y1=\"33\" x2=\"76\" y2=\"33\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"76,33 69.0,36.8 69.0,29.2\" fill=\"#6fe3b5\"/></svg><b>4. Gentle strokes</b>no pressing or scrubbing</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"5. Dry it\"><rect x=\"14\" y=\"22\" width=\"44\" height=\"30\" rx=\"5\" fill=\"#6fe3b5\" opacity=\"0.85\"/><path d=\"M18 32.5 q11.0 -6 18.0 0 t18.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M18 43.0 q11.0 -6 18.0 0 t18.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M69 36 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><b>5. Dry it</b>air-dry before power on</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 175\" role=\"img\" aria-label=\"Apple, Dell, and Microsoft all say: <b>never spray right on a screen</b>.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Spray on screen</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Water on cloth</text><rect x=\"12\" y=\"64\" width=\"26\" height=\"46\" rx=\"6\" fill=\"#6fe3b5\" opacity=\"0.85\"/><rect x=\"18\" y=\"54\" width=\"16\" height=\"11\" fill=\"#9aa4ae\"/><rect x=\"32\" y=\"54\" width=\"14\" height=\"6\" fill=\"#9aa4ae\"/><line x1=\"22\" y1=\"64\" x2=\"16\" y2=\"76\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><circle cx=\"50\" cy=\"60\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"58\" cy=\"55\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"58\" cy=\"65\" r=\ r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"280\" cy=\"57\" r=\"2.2\" fill=\"#7fd1ff\"/><rect x=\"286\" y=\"56\" width=\"50\" height=\"30\" rx=\"5\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M290 66.5 q12.5 -6 21.0 0 t21.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M290 77.0 q12.5 -6 21.0 0 t21.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><line x1=\"311\" y1=\"92\" x2=\"311\" y2=\"112\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"311,112 307.2,105.0 314.8,105.0\" fill=\"#7fd1ff\"/><rect x=\"260\" y=\"112\" width=\"102\" height=\"32\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"266\" y=\"118\" width=\"90\" height=\"20\" rx=\"2\" fill=\"#1b1f24\"/><text x=\"311\" y=\"164\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">then wipe gently</text><path d=\"M365 72 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><div class=\"cap\">Apple, Dell, and Microsoft all say: <b>never spray right on a screen</b>.</div></div>\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🪟</span><b>❌ Window cleaner</b>ammonia strips coatings</div><div class=\"card no\"><span class=\"big\">🧻</span><b>❌ Paper towels</b>rough on the coating</div><div class=\"card no\"><span class=\"big\">✊</span><b>❌ Pressing hard</b>leaves pressure marks</div><div class=\"card ok\"><span class=\"big\">📖</span><b>✅ Maker's guide</b>special glass has its own rules</div></div>\n\n<div class=\"warn\">**Grown-up needed:** Get a grown-up's OK before cleaning any screen. Use a barely damp cloth, never a spray bottle.</div>\n\n[[Got it. Send in the next customer->D2 J6]]", "D2 J6": "<div class=\"scene\">🧴 💻 ☁️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Theo's matte screen after the wipe.\"><rect x=\"44\" y=\"40\" width=\"40\" height=\"64\" rx=\"8\" fill=\"#7fd1ff\" opacity=\"0.9\"/><rect x=\"52\" y=\"24\" width=\"24\" height=\"16\" fill=\"#9aa4ae\"/><rect x=\"72\" y=\"24\" width=\"20\" height=\"7\" fill=\"#9aa4ae\"/><line x1=\"58\" y1=\"40\" x2=\"50\" y2=\"54\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"134\" y=\"12\" width=\"202\" height=\"104\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"140\" y=\"18\" width=\"190\" height=\"92\" rx=\"2\" fill=\"#26313b\"/><ellipse cx=\"190\" cy=\"50\" rx=\"34\" ry=\"18\" fill=\"#e9ecef\" opacity=\"0.22\"/><ellipse cx=\"196\" cy=\"54\" rx=\"20\" ry=\"10\" fill=\"#e9ecef\" opacity=\"0.25\"/><ellipse cx=\"275\" cy=\"80\" rx=\"40\" ry=\"20\" fill=\"#e9ecef\" opacity=\"0.2\"/><ellipse cx=\"282\" cy=\"84\" rx=\"22\" ry=\"10\" fill=\"#e9ecef\" opacity=\"0.25\"/><ellipse cx=\"240\" cy=\"40\" rx=\"18\" ry=\"10\" fill=\"#e9ecef\" opacity=\"0.2\"/><text x=\"64\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his blue cleaner</text><text x=\"235\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">cloudy patches that stay</text></svg><div class=\"cap\">Theo's matte screen after the wipe.</div></div>\n\n**Theo** wiped his matte screen with blue window cleaner. Now cloudy patches won't wipe off.\n\n**What should he do from now on?**\n\n* [[Use more window cleaner to even it out->D2 J6 W]]\n* [[Scrub the patches with a scrubby pad->D2 J6 W]]\n* [[Switch to dish soap since it is milder->D2 J6 W]]\n* [[Dry cloth, then barely damp distilled->D2 J6 R]]", "D2 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Window cleaner often has **ammonia**, which strips coatings. From now on: **dry microfiber, then barely damp distilled water.**\"\n\n[[Got it->D2 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the window cleaner card again.\"\n\n[[Try again->D2 J6]]]", "D2 J6 R": "(set: $miss to 0)## ✅ Job done\n**Dry cloth, then barely damp distilled water.** Coating damage like this is usually permanent.\n\n[[Next customer->D2 J7]]", "D2 J7": "<div class=\"scene\">🏃‍♀️ 💦 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"This is what Nora is about to do.\"><rect x=\"20\" y=\"48\" width=\"26\" height=\"46\" rx=\"6\" fill=\"#6fe3b5\" opacity=\"0.85\"/><rect x=\"26\" y=\"38\" width=\"16\" height=\"11\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"38\" width=\"14\" height=\"6\" fill=\"#9aa4ae\"/><line x1=\"30\" y1=\"48\" x2=\"24\" y2=\"60\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><circle cx=\"58\" cy=\"44\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"66\" cy=\"39\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"66\" cy=\"49\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"74\" cy=\"35\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"74\" cy=\"44\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"74\" cy=\"53\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"82\" cy=\"38\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"82\" cy=\"49\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"86\" cy=\"50\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"94\" cy=\"45\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"94\" cy=\"55\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"102\" cy=\"41\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"102\" cy=\"50\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"102\" cy=\"59\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"110\" cy=\"44\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"110\" cy=\"55\" r=\"2.2\" fill=\"#7fd1ff\"/><rect x=\"124\" y=\"8\" width=\"192\" height=\"94\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"130\" y=\"14\" width=\"180\" height=\"82\" rx=\"2\" fill=\"#cfe8ff\"/><polygon points=\"124,102 316,102 334,124 106,124\" fill=\"#8a96a3\"/><rect x=\"146\" y=\"28\" width=\"110\" height=\"6\" rx=\"3\" fill=\"#7fa4c4\"/><rect x=\"146\" y=\"42\" width=\"80\" height=\"6\" rx=\"3\" fill=\"#7fa4c4\"/><rect x=\"146\" y=\"56\" width=\"130\ en into the screen->D2 J9 R]]\n* [[Heat built up overnight and cracked it->D2 J9 W]]\n* [[The screen coating dried out and split->D2 J9 W]]", "D2 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Almost no space in there. **The lid pressed the pen into the screen.**\"\n\n[[Got it->D2 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pen picture again.\"\n\n[[Try again->D2 J9]]]", "D2 J9 R": "(set: $miss to 0)## ✅ Job done\n**The pen got pressed into the screen.** Check the keyboard is clear before closing.\n\n[[Next customer->D2 J10]]", "D2 J10": "<div class=\"scene\">💻 ↖️ 🫨</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Mia opens it by the top-left corner.\"><g transform=\"rotate(-5 180 100)\"><rect x=\"94\" y=\"14\" width=\"172\" height=\"88\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"100\" y=\"20\" width=\"160\" height=\"76\" rx=\"2\" fill=\"#cfe8ff\"/></g><rect x=\"80\" y=\"104\" width=\"200\" height=\"14\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"104\" y=\"98\" width=\"24\" height=\"10\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"232\" y=\"98\" width=\"24\" height=\"10\" rx=\"2\" fill=\"#5b6573\"/><path d=\"M92 92 q-6 4 0 8 M86 88 q-10 8 0 16\" stroke=\"#ffb347\" stroke-width=\"2\" fill=\"none\"/><g transform=\"rotate(200 100 22)\"><rect x=\"100\" y=\"13\" width=\"60\" height=\"18\" rx=\"9\" fill=\"#e8c27a\"/><rect x=\"102\" y=\"16\" width=\"14\" height=\"12\" rx=\"5\" fill=\"#ffd9e0\"/></g><text x=\"116\" y=\"134\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">loose hinge</text><text x=\"244\" y=\"134\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">other hinge</text><text x=\"42\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her</te =\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his screen, turned off</text><text x=\"292\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his keyboard</text></svg><div class=\"cap\">A faint grid shows on the dark screen, even after cleaning.</div></div>\n\n**Mr. Okoye** cleans his screen weekly. But a faint grid shows up every time, in the exact pattern of his keys.\n\n**Where does the pattern come from?**\n\n* [[The screen is burning in an image of keys->D2 J11 W]]\n* [[The coating is wearing off in a grid->D2 J11 W]]\n* [[Keys touch the shut screen and leave oil->D2 J11 R]]\n* [[The open screen reflects the keyboard->D2 J11 W]]", "D2 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Shut, the **keys touch the screen** and leave **skin oil**. Clean hands and a clean keyboard help.\"\n\n[[Got it->D2 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the keys-touch-screen picture again.\"\n\n[[Try again->D2 J11]]]", "D2 J11 R": "(set: $miss to 0)## ✅ Job done\n**Skin oil from the keys.** Not burn-in: that comes from a static image on OLED.\n\n[[Next customer->D2 J12]]", "D2 J12": "<div class=\"scene\">📷 🪙 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Gabe's laptop, lid pressed down on the cover.\"><rect x=\"20\" y=\"80\" width=\"220\" height=\"12\" rx=\"3\" fill=\"#8a96a3\"/><circle cx=\"24\" cy=\"80\" r=\"5\" fill=\"#5b6573\"/><polygon points=\"24,76 240,58 240,66 24,82\" fill=\"#8a96a3\"/><rect x=\"222\" y=\"66\" width=\"16\" height=\"13\" rx=\"2\" fill=\"#1b1f24\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"200\" y1=\"22\" x2=\"200\" y2=\"54\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"200,54 196.2,47.0 203.8,47.0\" fill=\"#ff6b6b\"/><text x=\"200\" y=\"16\" font-family=\"Segoe UI,Inter,sans-serif\" fon een the five-step way. For a week, open lids from the center and check the keyboard before closing. In your **Tech Notebook**, list which home screens are LCD or OLED, glossy or matte.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### How Screens Are Built\n\"Two kinds of screen. Each has its own weak spot.\"\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"<b>LCD</b>: most laptops and monitors. <b>OLED</b>: many phones and TVs, some laptops.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">LCD</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">OLED</text><line x1=\"50\" y1=\"56\" x2=\"50\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"50,32 53.8,39.0 46.2,39.0\" fill=\"#ffe08a\"/><line x1=\"80\" y1=\"56\" x2=\"80\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"80,32 83.8,39.0 76.2,39.0\" fill=\"#ffe08a\"/><line x1=\"120\" y1=\"56\" x2=\"120\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"120,32 123.8,39.0 116.2,39.0\" fill=\"#ffe08a\"/><line x1=\"150\" y1=\"56\" x2=\"150\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"150,32 153.8,39.0 146.2,39.0\" fill=\"#ffe08a\"/><rect x=\"30\" y=\"60\" width=\"140\" height=\"22\" rx=\"3\" fill=\"#3a5566\"/><text x=\"100\" y=\"76\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">glass</text><rect x=\"30\" y=\"84\" width=\"140\" height=\"22\" rx=\"3\" fill=\"#4a4060\"/><line x1=\"38\" y1=\"102\" x2=\"44\" y2=\"88\" stroke=\"#a99a >✅ Camera light</b>shows when it's on</div><div class=\"card ok\"><span class=\"big\">🏷️</span><b>✅ Stickers on lid</b>never over vents</div><div class=\"card no\"><span class=\"big\">🖥️</span><b>❌ Lift by screen</b>strains the hinges</div><div class=\"card no\"><span class=\"big\">🖊️</span><b>❌ Stuff on keys</b>pens, earbuds, crumbs</div><div class=\"card no\"><span class=\"big\">🪙</span><b>❌ Thick cover</b>can crack the screen</div><div class=\"card no\"><span class=\"big\">💦</span><b>❌ Wet ports</b>keep seams dry</div></div>\n\nWipe the case **powered off**, with a barely damp cloth (water, or a little alcohol if the maker allows).\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 3->D3 Start]]", "D3 Start": "(set: $miss to 0)# Day 3: Airflow & Heat\n\n<div class=\"scene\">💻 🔥 🌀</div>\n\n*The Inspector holds her hand behind a hot laptop and shakes it.* \"Every computer makes heat. That's normal. Trouble starts when the heat can't get **out**.\"\n\n\n[[Open the shop->D3 L1]]", "D3 L1": "## 📘 The Inspector's lesson: Where the Heat Comes From\n\n<div class=\"pic\"><svg viewBox=\"0 0 420 140\" role=\"img\" aria-label=\"The heat's escape route. Block any step and the heat gets stuck.\"><rect x=\"25\" y=\"25\" width=\"50\" height=\"50\" rx=\"5\" fill=\"#ffb347\"/><rect x=\"30\" y=\"18\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"30\" y=\"75\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"18\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"75\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"50\" y=\"18\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"50\" y=\"75\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"60\" y=\"18\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"60\" y=\"75\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"70\" y=\"18\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><rect x=\"70\" y=\"75\" width=\"4\" height=\"7\" fill=\"#9aa4ae\"/><text x=\"50\" y=\"55\" font-family=\"Se dth=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M292 108 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"292\" y1=\"122\" x2=\"352\" y2=\"122\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"352,122 345.0,125.8 345.0,118.2\" fill=\"#ff6b6b\"/><text x=\"356\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"bold\">Hot air OUT</text><text x=\"356\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"normal\">(by the hinge)</text></svg><div class=\"cap\">Air in, air out. Put your hand by a vent: warm air means <b>exhaust</b>.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 420 120\" role=\"img\" aria-label=\"Slowing down and shutting off are <b>safety features</b>. Your job: find out why it got hot.\"><defs><linearGradient id=\"u2hot\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#7fd1ff\"/><stop offset=\"0.5\" stop-color=\"#ffb347\"/><stop offset=\"1\" stop-color=\"#ff6b6b\"/></linearGradient></defs><rect x=\"20\" y=\"16\" width=\"380\" height=\"18\" rx=\"9\" fill=\"url(#u2hot)\"/><circle cx=\"60\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"360\" cy=\"25\" r=\"7\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"2\"/><text x=\"60\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">Cool</text><text x=\"60\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">quiet</text><text x=\"160\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Warm</text><text x=\"160\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">loud fans</text><text x=\"260\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff9a5a\" text-anchor=\"middle\" font-weight=\"bold\">Hot</text><text x=\"260\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">slows down</text><text x=\"260\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff9a5a\" text-anchor=\"middle\" font-weight=\"normal\">(throttling)</text><text x=\"360\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Too hot</text><text x=\"360\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">shuts off</text><text x=\"360\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">(shutdown)</text></svg><div class=\"cap\">Slowing down and shutting off are <b>safety features</b>. Your job: find out why it got hot.</div></div>\n\n**Signs it's too hot:**\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🌀</span><b>Roaring fans</b>even on easy jobs</div><div class=\"card \"><span class=\"big\">🔥</span><b>Hot underside</b>or hot keyboard</div><div class=\"card \"><span class=\"big\">🐢</span><b>Stutters</b>games and videos lag</div><div class=\"card \"><span class=\"big\">⚫</span><b>Sudden shutoff</b>no warning</div></div>\n\n[[Got it. Send in the next customer->D3 J2]]", "D3 J2": "<div class=\"scene\">🎮 🔥 🐢</div>\n\n**Ava's** gaming laptop gets choppy 20 minutes into a match. The fans scream and the bottom gets hot. After the game, it's fine.\n\n**What's happening?**\n\n* [[A virus that only runs during games->D3 J2 W]]\n* [[The chips are slowing down to cool off->D3 J2 R]]\n* [[The fans spin so fast they slow the game->D3 J2 W]]\n* [[The graphics chip is out of memory for good->D3 J2 W]]", "D3 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **throttling**. The chips slow down so they don't overheat.\"\n\n[[Got it->D3 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Loud, hot, and slow. Look at the heat scale again.\"\n\n[[Try again->D3 J2]]]", "D3 J2 R": "(set: $miss to 0)## ✅ Job done\n**Throttling.** The heat can't get out fast enough, so the chips slow down. Next: find out why.\n\n[[Next customer->D3 J3]]", "D3 J3": "<div class=\"scene\">💻 ♨️ 📁</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at where the warm air comes out, and where the folders would go.\"><line x1=\"0\" y1=\"118\" x2=\"360\" y2=\"118\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"20\" y=\"100\" width=\"170\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"181,100 190,100 216,28 207,28\" fill=\"#8a96a3\"/><polygon points=\"185,96 208,34 210,34 187,96\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"30\" y=\"110\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"168\" y=\"110\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"171\" y=\"101\" width=\"2\" height=\"9\" fill=\"#1b1f24\"/><rect x=\"176\" y=\"101\" width=\"2\" height=\"9\" fill=\"#1b1f24\"/><rect x=\"181\" y=\"101\" width=\"2\" height=\"9\" fill=\"#1b1f24\"/><path d=\"M196 72 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 80 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M196 88 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"192\" y1=\"106\" x2=\"228\" y2=\"106\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"228,106 221.0,109.8 221.0,102.2\" fill=\"#ff6b6b\"/><rect x=\"252\" y=\"46\" width=\"28\" height=\"72\" rx=\"2\" fill=\"#e8c27a\" stroke=\"#8a6d3b\" stroke-width=\"2\"/><rect x=\"268\" y=\"48\" width=\"28\" height=\"70\" rx=\"2\" fill=\"#e8c27a\" stroke=\"#8a6d3b\" stroke-width=\"2\"/><rect x=\"284\" y=\"50\" width=\"28\" height=\"68\" rx=\"2\" fill=\"#e8c27a\" stroke=\"#8a6d3b\" stroke-width=\"2\"/><rect x=\"300\" y=\"52\" width=\"28\" height=\"66\" rx=\"2\" fill=\"#e8c27a\" stroke=\"#8a6d3b\" stroke-width=\"2\"/><text x=\"105\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Patel's laptop</text><text x=\"302\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e8c27a\" text-anchor=\"middle\" font-weight=\"normal\">his folders</text><text x=\"210\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">warm air blows out here</text></svg><div class=\"cap\">Look at where the warm air comes out, and where the folders would go.</div></div>\n\n**Mr. Patel's** laptop blows warm air out of a grille by the hinge. He wants to stack folders tight against it.\n\n**Good idea?**\n\n* [[Yes, it's an intake, so folders keep dust out->D3 J3 W]]\n* [[Yes, it's a speaker, so they'll only muffle it->D3 J3 W]]\n* [[Yes, it's just for looks, so nothing changes->D3 J3 W]]\n* [[No, it's the exhaust, so they'll trap heat->D3 J3 R]]", "D3 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Warm air out means **exhaust**. Block it and the heat has nowhere to go.\"\n\n[[Got it->D3 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm air coming *out*. Which kind of vent is that?\"\n\n[[Try again->D3 J3]]]", "D3 J3 R": "(set: $miss to 0)## ✅ Job done\n**Exhaust.** Every vent needs open space. Keep the folders a few inches away.\n\n[[The Inspector has something to show you->D3 L4]]", "D3 L4": "## 📘 The Inspector's lesson: Where It Sits Matters\n\n<div class=\"pic\"><svg viewBox=\"0 0 420 170\" role=\"img\" aria-label=\"Soft things swallow the vents. Hard, flat things leave room to breathe.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">On a pillow</text><text x=\"315\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">On a desk</text><ellipse cx=\"100\" cy=\"130\" rx=\"92\" ry=\"28\" fill=\"#6b5a8e\"/><rect x=\"35\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"136,110 145,110 171,38 162,38\" fill=\"#8a96a3\"/><polygon points=\"140,106 163,44 165,44 142,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><ellipse cx=\"30\" cy=\"117\" rx=\"24\" ry=\"14\" fill=\"#6b5a8e\"/><ellipse cx=\"150\" cy=\"119\" rx=\"20\" ry=\"12\" fill=\"#6b5a8e\"/><line x1=\"12\" y1=\"107\" x2=\"32\" y2=\"127\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"12\" y1=\"127\" x2=\"32\" y2=\"107\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">vents smothered</text><line x1=\"225\" y1=\"138\" x2=\"418\" y2=\"138\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"250\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"351,110 360,110 386,38 377,38\" fill=\"#8a96a3\"/><polygon points=\"355,106 378,44 380,44 357,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"260\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"338\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><line x1=\"226\" y1=\"132\" x2=\"320\" y2=\"132\" stroke=\"#7fd1ff\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"320,132 313.0,135.8 313.0,128.2\" fill=\"#7fd1ff\"/><text x=\"315\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">air gap under it</text></svg><div class=\"cap\">Soft things swallow the vents. Hard, flat things leave room to breathe.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🪑</span><b>✅ Desk or table</b>hard and flat</div><div class=\"card ok\"><span class=\"big\">🛋️</span><b>✅ Lap desk</b>for the couch or bed</div><div class=\"card ok\"><span class=\"big\">📐</span><b>✅ Laptop stand</b>air flows under it</div><div class=\"card ok\"><span class=\"big\">📏</span><b>✅ A few inches</b>of space around vents</div><div class=\"card no\"><span class=\"big\">🛏️</span><b>❌ Bed or blanket</b>smothers the vents</div><div class=\"card no\"><span class=\"big\">🚪</span><b>❌ Closed cabinet</b>breathes its own hot air</div><div class=\"card no\"><span class=\"big\">☀️</span><b>❌ Sun or heater</b>hot before it even starts</div><div class=\"card no\"><span class=\"big\">🐈</span><b>❌ Pets on vents</b>fur blocks the air</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 420 80\" role=\"img\" aria-label=\"From Apple's guide for its laptops. A hot room means hot air going in.\"><rect x=\"20\" y=\"30\" width=\"380\" height=\"16\" rx=\"8\" fill=\"#2a2f36\"/><rect x=\"100\" y=\"30\" width=\"220\" height=\"16\" rx=\"8\" fill=\"#6fe3b5\"/><text x=\"210\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Comfortable room = happy laptop</text><text x=\"100\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">50°F / 10°C</text><text x=\"320\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">95°F / 35°C</text><text x=\"40\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"normal\">cold</text><text x=\"385\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">hot</text></svg><div class=\"cap\">From Apple's guide for its laptops. A hot room means hot air going in.</div></div>\n\n[[Got it. Send in the next customer->D3 J5]]", "D3 J5": "<div class=\"scene\">🛏️ 💻 ⚫</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at what the bottom of the laptop is sitting in.\"><path d=\"M10 120 Q30 72 80 82 Q130 66 180 80 Q230 64 280 80 Q330 70 350 120 Z\" fill=\"#6b5a8e\"/><path d=\"M40 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M100 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M160 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M220 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><path d=\"M280 116 q10 -14 0 -28\" stroke=\"#8a78b0\" stroke-width=\"2\" fill=\"none\"/><rect x=\"110\" y=\"74\" width=\"130\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"231,74 240,74 266,2 257,2\" fill=\"#8a96a3\"/><polygon points=\"235,70 258,8 260,8 237,70\" fill=\"#7fd1ff\" opacity=\"0.5\"/><path d=\"M84 100 Q100 76 130 81 Q170 77 200 81 Q232 76 262 96 Q250 108 84 104 Z\" fill=\"#6b5a8e\"/><path d=\"M120 104 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M205 104 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"175\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Jayden's laptop</text><text x=\"180\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#c7b6e8\" text-anchor=\"middle\" font-weight=\"normal\">his thick comforter</text></svg><div class=\"cap\">Look at what the bottom of the laptop is sitting in.</div></div>\n\n**Jayden** does homework in bed with his laptop on a thick comforter. Twice it went black with no warning. The bottom was hot.\n\n**What's going on?**\n\n* [[The vents were smothered, so it shut off->D3 J5 R]]\n* [[The battery is old, so it needs the charger->D3 J5 W]]\n* [[The comforter's static turned it off->D3 J5 W]]\n* [[A sleep setting kicks in after a while->D3 J5 W]]", "D3 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The comforter **smothered the vents**, so it did an **emergency shutdown**. Use a lap desk.\"\n\n[[Got it->D3 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Soft bedding plus a hot bottom. What happens at the far end of the heat scale?\"\n\n[[Try again->D3 J5]]]", "D3 J5 R": "(set: $miss to 0)## ✅ Job done\n**Smothered vents, then shutdown.** A lap desk gives it a hard, flat base, even in bed.\n\n[[Next customer->D3 J6]]", "D3 J6": "<div class=\"scene\"><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg> 🚪 🔥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Grandpa Leo's cabinet, shut and with the door cut away.\"><rect x=\"20\" y=\"16\" width=\"130\" height=\"104\" rx=\"4\" fill=\"#8b5e3c\" stroke=\"#5e3d26\" stroke-width=\"3\"/><line x1=\"85\" y1=\"20\" x2=\"85\" y2=\"116\" stroke=\"#5e3d26\" stroke-width=\"2.5\"/><circle cx=\"77\" cy=\"68\" r=\"4\" fill=\"#e8c27a\"/><circle cx=\"93\" cy=\"68\" r=\"4\" fill=\"#e8c27a\"/><text x=\"85\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">door shut</text><rect x=\"200\" y=\"16\" width=\"130\" height=\"104\" rx=\"4\" fill=\"#5e3d26\" stroke=\"#8b5e3c\" stroke-width=\"5\"/><rect x=\"235\" y=\"22\" width=\"60\" height=\"94\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"265.0\" cy=\"38\" r=\"5\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2\"/><line x1=\"245\" y1=\"86\" x2=\"285\" y2=\"86\" stroke=\"#5b6573\" stroke-width=\"2.5\"/><line x1=\"245\" y1=\"93\" x2=\"285\" y2=\"93\" stroke=\"#5b6573\" stroke-width=\"2.5\"/><line x1=\"245\" y1=\"100\" x2=\"285\" y2=\"100\" stroke=\"#5b6573\" stroke-width=\"2.5\"/><text x=\"265\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">inside the cabinet</text></svg><div class=\"cap\">Grandpa Leo's cabinet, shut and with the door cut away.</div></div>\n\n**Grandpa Leo** put his tower in a wooden cabinet and closes the door. Now the fans roar all afternoon.\n\n**Best advice?**\n\n* [[Put a little desk fan inside the cabinet->D3 J6 W]]\n* [[Turn the tower so the vents face the back->D3 J6 W]]\n* [[Open the door and give it a few inches->D3 J6 R]]\n* [[Shut it down for an hour each afternoon->D3 J6 W]]", "D3 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"It breathes out hot air, then **breathes it back in**. Open the door or move the tower.\"\n\n[[Got it->D3 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Door shut. Where does the hot air go?\"\n\n[[Try again->D3 J6]]]", "D3 J6 R": "(set: $miss to 0)## ✅ Job done\n**A closed cabinet traps the exhaust.** Give the tower open air and a few inches of space.\n\n[[Next customer->D3 J7]]", "D3 J7": "<div class=\"scene\">☀️ 🪟 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at where the light lands.\"><circle cx=\"34\" cy=\"26\" r=\"16\" fill=\"#ffd166\"/><rect x=\"64\" y=\"12\" width=\"70\" height=\"86\" fill=\"#1e3a52\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"99\" y1=\"12\" x2=\"99\" y2=\"98\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"64\" y1=\"55\" x2=\"134\" y2=\"55\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><polygon points=\"70,18 130,18 330,108 230,108\" fill=\"#ffd166\" opacity=\"0.28\"/><rect x=\"170\" y=\"110\" width=\"180\" height=\"8\" fill=\"#8b5e3c\"/><rect x=\"215\" y=\"99\" width=\"95\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"301,99 310,99 336,27 327,27\" fill=\"#8a96a3\"/><polygon points=\"305,95 328,33 330,33 307,95\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"225\" y=\"109\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"288\" y=\"109\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><path d=\"M232 76 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M232 83 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"99\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">window</text><text x=\"260\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" t  me show you\n*The Inspector leans over.* \"The cat is **blocking the exhaust**. Give her a warm bed somewhere else. Clear the fur with the PC off and unplugged.\"\n\n[[Got it->D3 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does a cat-shaped blanket do to an exhaust vent?\"\n\n[[Try again->D3 J8]]]", "D3 J8 R": "(set: $miss to 0)## ✅ Job done\n**A cat on a vent is a furry blockage.** A cozy cat bed nearby usually wins.\n\n[[The Inspector has something to show you->D3 L9]]", "D3 L9": "## 📘 The Inspector's lesson: Clearing the Airflow Path\n\n<div class=\"scene\">🌫️ 🌀</div>\n\n\"Dust is a blanket. Here's how to take it off.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Off + unplug\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"41\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"10\" y1=\"36\" x2=\"0\" y2=\"36\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"60\" y=\"14\" width=\"34\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"70\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"81\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/></svg><b>1. Off + unplug</b>not just asleep</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Short bursts\"><rect x=\"30\" y=\"20\" width=\"24\" height=\"48\" rx=\"5\" fill=\"#7fd1ff\"/><rect x=\"37\" y=\"11\" width=\"10\" height=\"9\" fill=\"#9aa4ae\"/><line x1=\"47\" y1=\"14\" x2=\"68\" y2=\"6\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"75\" cy=\"6\" r=\"4\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"84\" cy=\"9\" r=\"3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"93\" cy=\"12\" r=\"2\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/></svg><b>2. Short bursts</b>of compres laptop vent with one long spray. The fan spun like a jet. Now it whines.\n\n**What happened?**\n\n* [[Some of the dust melted onto the blades->D3 J11 W]]\n* [[Over-spinning hurt the fan's bearing->D3 J11 R]]\n* [[The blast made the fan spin backward->D3 J11 W]]\n* [[Too much clean air rushes through it now->D3 J11 W]]", "D3 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The blast **over-spun the fan** and hurt its **bearing**. Hold it still next time. Short bursts.\"\n\n[[Got it->D3 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What should you do with a fan while you spray it?\"\n\n[[Try again->D3 J11]]]", "D3 J11 R": "(set: $miss to 0)## ✅ Job done\n**Over-spinning damages bearings.** If the whine stays, a repair shop replaces the fan.\n\n[[Next customer->D3 J12]]", "D3 J12": "<div class=\"scene\"><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg> 🧹 ⚡</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"The tower is open and the boards are showing.\"><rect x=\"102\" y=\"30\" width=\"4\" height=\"40\" fill=\"#9aa4ae\"/><rect x=\"20\" y=\"14\" width=\"150\" height=\"112\" tting off are <b>safety features</b>. Your job: find out why it got hot.</div></div>\n\n**Signs it's too hot:**\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🌀</span><b>Roaring fans</b>even on easy jobs</div><div class=\"card \"><span class=\"big\">🔥</span><b>Hot underside</b>or hot keyboard</div><div class=\"card \"><span class=\"big\">🐢</span><b>Stutters</b>games and videos lag</div><div class=\"card \"><span class=\"big\">⚫</span><b>Sudden shutoff</b>no warning</div></div>\n\n### Where It Sits Matters\n<div class=\"pic\"><svg viewBox=\"0 0 420 170\" role=\"img\" aria-label=\"Soft things swallow the vents. Hard, flat things leave room to breathe.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">On a pillow</text><text x=\"315\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">On a desk</text><ellipse cx=\"100\" cy=\"130\" rx=\"92\" ry=\"28\" fill=\"#6b5a8e\"/><rect x=\"35\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"136,110 145,110 171,38 162,38\" fill=\"#8a96a3\"/><polygon points=\"140,106 163,44 165,44 142,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><ellipse cx=\"30\" cy=\"117\" rx=\"24\" ry=\"14\" fill=\"#6b5a8e\"/><ellipse cx=\"150\" cy=\"119\" rx=\"20\" ry=\"12\" fill=\"#6b5a8e\"/><line x1=\"12\" y1=\"107\" x2=\"32\" y2=\"127\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"12\" y1=\"127\" x2=\"32\" y2=\"107\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">vents smothered</text><line x1=\"225\" y1=\"138\" x2=\"418\" y2=\"138\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"250\" y=\"110\" width=\"110\" height=\"11\" rx=\"3\" fill=\"#8a96a3\"/><polygon points=\"351,110 360,110 386,38 377,38\" fill=\"#8a96a3\"/><polygon points=\"355,106 378,44 380,44 357,106\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"260\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><rect x=\"338\" y=\"120\" width=\"10\" height=\"7\" rx=\"2\" fill=\"#222\"/><line x1=\"226\" y1=\"132\" x2=\"320\" y2=\"132\" stroke=\"#7fd1ff\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"320,132 313.0,135.8 313.0,128.2\" fill=\"#7fd1ff\"/><text x=\"315\" y=\"165\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">air gap under it</text></svg><div class=\"cap\">Soft things swallow the vents. Hard, flat things leave room to breathe.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🪑</span><b>✅ Desk or table</b>hard and flat</div><div class=\"card ok\"><span class=\"big\">🛋️</span><b>✅ Lap desk</b>for the couch or bed</div><div class=\"card ok\"><span class=\"big\">📐</span><b>✅ Laptop stand</b>air flows under it</div><div class=\"card ok\"><span class=\"big\">📏</span><b>✅ A few inches</b>of space around vents</div><div class=\"card no\"><span class=\"big\">🛏️</span><b>❌ Bed or blanket</b>smothers the vents</div><div class=\"card no\"><span class=\"big\">🚪</span><b>❌ Closed cabinet</b>breathes its own hot air</div><div class=\"card no\"><span class=\"big\">☀️</span><b>❌ Sun or heater</b>hot before it even starts</div><div class=\"card no\"><span class=\"big\">🐈</span><b>❌ Pets on vents</b>fur blocks the air</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 420 80\" role=\"img\" aria-label=\"From Apple's guide for its laptops. A hot room means hot air going in.\"><rect x=\"20\" y=\"30\" width=\"380\" height=\"16\" rx=\"8\" fill=\"#2a2f36\"/><rect x=\"100\" y=\"30\" width=\"220\" height=\"16\" rx=\"8\" fill=\"#6fe3b5\"/><text x=\"210\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-
