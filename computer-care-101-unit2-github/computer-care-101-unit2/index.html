ntacts. It's amazing how much fuzz can hide in one tiny port.\n\n[[Next customer->D4 J4]]", "D4 J4": "**Ms. Rivera** noticed a brown scorch mark on one prong of her laptop charger's plug, and the outlet cover next to it looks slightly discolored. \"But it still charges fine,\" she says.\n\n**What's the right move?**\n\n* [[Keep using it, since the charger still works fine->D4 J4 W]]\n* [[Clean the mark off with a little rubbing alcohol->D4 J4 W]]\n* [[Plug it into a different outlet and keep a close eye on it->D4 J4 W]]\n* [[Have a grown-up unplug it, and stop using it for good->D4 J4 R]]", "D4 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A scorch mark means something got **hot enough to burn**. That charger is done: unplug it and replace it. And since the outlet looks discolored too, a grown-up should have an electrician check it.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Scorch marks were on my list of stop signs.\"\n\n[[Try again->D4 J4]]]", "D4 J4 R": "(set: $miss to 0)## ✅ Job done\n**Scorch marks mean stop and replace.** A burn mark means overheating, often from a loose or damaged connection. \"Still works\" does not mean \"still safe.\"\n\n[[The Inspector has something to show you->D4 L5]]", "D4 L5": "## 📘 The Inspector's lesson: Strips, Surges, and Storms\n\n*The Inspector holds up two long white boxes with outlets. They look like twins.* \"One of these protects your computer. The other just gives you more places to plug things in. Which is which?\"\n\n* **Power strip:** adds more outlets. That's it. Many have an on/off switch and a breaker that trips if you overload them, but **no surge protection**.\n* **Surge protector:** looks like a power strip, but it has parts inside that absorb sudden **voltage spikes** (surges) before they reach your electronics. Surges can come from lightning, from power coming back on after an outage, or from big appliances switching on and off.\n\n### Reading the label\n* **A UL or ETL listing:** an independent safety lab tested it. For surge protection, look for wording like **\"surge protector\"** or **\"surge protective device,\"** often with **UL 1449**. Vague phrases like \"meets UL standards\" are not the same as a listing.\n* **A joule rating:** how much surge energy it can soak up before it wears out. Higher is better, and for computer gear, look for at least several hundred joules. A plain power strip has no joule rating at all.\n* **A \"protected\" light:** surge protectors wear out, because each surge uses up some of their capacity. If the protection light is off, or after a big surge such as a nearby lightning strike, **replace it**. It may still pass power without protecting anything.\n\n### Don't daisy-chain\n**Daisy-chaining** means plugging one power strip into another (or into an extension cord). Everything down the chain draws power through the first strip, so it can overload, overheat, and start a fire. Plug each strip **straight into a wall outlet**, and don't overload it.\n\n### Thunderstorms\nA surge protector handles everyday spikes. A **nearby lightning strike** can be far too big for it. FEMA advises unplugging appliances when a thunderstorm warning is issued. So when a storm is on the way: **save your work, shut down, and unplug** from the wall. Do it early. Once lightning is close, stay away from plugged-in cords and wait it out.\n\n<div class=\"warn\">**Grown-up needed:** Unplug and rearrange power strips and surge protectors with a grown-up, and only when your hands are dry.</div>\n\n\n[[Got it. Send in the next customer->D4 J6]]", "D4 J6": "**Grandpa Leo** needed more outlets for his computer, printer, lamp, and Biscuit's heated dog bed. So he plugged a second power strip into the first, then a third strip into the second. The first strip now feels warm to the touch.\n\n**What should he do?**\n\n* [[Add a fourth strip so the load is spread out more->D4 J6 W]]\n* [[Plug each strip into a wall, not into each other->D4 J6 R]]\n* [[Tape the switches on so nobody bumps them off->D4 J6 W]]\n* [[Swap the order so the warm strip is last in line->D4 J6 W]]", "D4 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **daisy-chaining**. Everything on strips two and three still draws power through the first one, so it overloads and heats up. Each strip goes **straight into a wall outlet**, and a grown-up can help decide what really needs to stay plugged in.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's it called when strips plug into strips, and why is the first one warm?\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**Never daisy-chain power strips.** The first strip carries the load for the whole chain, and an overloaded strip can overheat and start a fire.\n\n[[Next customer->D4 J7]]", "D4 J7": "**Dev** just finished building a gaming PC. \"It's protected,\" he says, pointing to a cheap white strip with six outlets and an on/off switch. You flip it over. The label lists amps and volts, but no joule rating and no mention of surges.\n\n**What should you tell Dev?**\n\n* [[It's protected, since every strip with a switch is->D4 J7 W]]\n* [[That's only a power strip; get a surge protector->D4 J7 R]]\n* [[It's protected as long as its switch stays turned on->D4 J7 W]]\n* [[It's protected because it has six outlets, not four->D4 J7 W]]", "D4 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No joule rating and no surge wording means it's a **power strip**. It just adds outlets. Dev needs a **UL- or ETL-listed surge protector** with a joule rating.\"\n\n[[Got it->D4 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which words and numbers on a label tell you it's a surge protector?\"\n\n[[Try again->D4 J7]]]", "D4 J7 R": "(set: $miss to 0)## ✅ Job done\n**A power strip adds outlets; a surge protector absorbs spikes.** They look alike, so read the label: surge wording, a safety listing, and a joule rating. The on/off switch is just a switch.\n\n[[Next customer->D4 J8]]", "D4 J8": "**Jayden** is finishing a slideshow on the family desktop. The sky has gone dark, his phone just showed a thunderstorm warning, and thunder is rumbling in the distance. The computer is plugged into a surge protector.\n\n**What's the smartest move?**\n\n* [[Keep working, since the surge protector stops lightning->D4 J8 W]]\n* [[Turn off the monitor, but leave the tower running->D4 J8 W]]\n* [[Wait until the lightning is overhead, then unplug->D4 J8 W]]\n* [[Save, shut down, and unplug before the storm hits->D4 J8 R]]", "D4 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A surge protector handles everyday spikes, not a nearby lightning strike. **Save, shut down, and unplug** while the storm is still far off. Once it's overhead, stay away from plugged-in cords.\"\n\n[[Got it->D4 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say a surge protector *can't* handle?\"\n\n[[Try again->D4 J8]]]", "D4 J8 R": "(set: $miss to 0)## ✅ Job done\n**Unplug before the storm, not during it.** FEMA advises unplugging appliances during a thunderstorm warning. Doing it early means your work is saved and you aren't handling cords with lightning nearby.\n\n[[The Inspector has something to show you->D4 L9]]", "D4 L9": "## 📘 The Inspector's lesson: Chargers\n\n*The Inspector lines up a hefty laptop charger, a tiny phone charger, and a suspiciously cheap one with no brand on it.*\n\n### Use the right charger\n* Every charger is rated in **watts** (W): how much power it can deliver. Your laptop's original charger has its wattage printed on it.\n* **USB-C Power Delivery (PD)** chargers *talk* to the device before sending power. They agree on an amount, so the device only takes what the charger can safely give.\n* A **lower-watt charger**, like a small phone charger, on a laptop **charges slowly**. If the laptop is working hard, the battery might even drain while plugged in. It doesn't explode. Apple, for example, says its USB-C laptops can charge from adapters with higher or lower wattage, but charge best with at least the recommended wattage.\n* Older laptops with round **barrel plugs** need their own matching charger. Don't mix those up.\n\n### Warm vs. worrying\n* **Warm is normal.** Chargers turn a little of their power into heat as they work.\n* **Not normal:** too hot to hold comfortably, buzzing or crackling, a burning or melted-plastic smell, or scorch marks. **Have a grown-up unplug it, and stop using it.**\n\n### Knockoffs and beds\n* **Cheap, uncertified knockoff chargers** may skip the safety parts that prevent overheating and shocks. Some even print fake safety marks. Buy from the device maker or a well-known brand, from a real store, with a UL or ETL listing.\n* **Don't charge on a bed, couch, or under a pillow.** Chargers and devices need air to shed heat, and bedding traps it right next to something that can burn.\n\n\n[[Got it. Send in the next customer->D4 J10]]", "D4 J10": "**Tasha** left her laptop charger at her dad's place, so she plugs the laptop into her small phone charger with a USB-C cable. The laptop says it's charging, but after an hour the battery has barely moved.\n\n**What's going on?**\n\n* [[A low-watt charger works, but only slowly->D4 J10 R]]\n* [[The phone charger is overloading and may burst->D4 J10 W]]\n* [[The laptop's battery got damaged by the cable->D4 J10 W]]\n* [[Phone chargers can't send power to a laptop->D4 J10 W]]", "D4 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A phone charger delivers far fewer watts than a laptop charger. USB-C Power Delivery lets them **agree on a safe amount**, so it just **charges slowly**. Slow, not dangerous.\"\n\n[[Got it->D4 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Watts measure how much power a charger can deliver. Is a phone charger a big one or a small one?\"\n\n[[Try again->D4 J10]]]", "D4 J10 R": "(set: $miss to 0)## ✅ Job done\n**Lower watts mean slower charging, not danger.** USB-C Power Delivery negotiates the power, so the laptop takes only what the charger can safely give. For normal speed, use a charger with at least the wattage of the original.\n\n[[Next customer->D4 J11]]", "D4 J11": "**Kenji** bought a $3 laptop charger at a gas station when his broke. It has no brand name and no safety marks. Tonight it's buzzing, it smells like hot plastic, and it's too hot to keep his hand on.\n\n**What should he do?**\n\n* [[Keep using it, since every charger gets warm->D4 J11 W]]\n* [[Rest it on an ice pack so it runs cooler->D4 J11 W]]\n* [[Get a grown-up to unplug it, then replace it->D4 J11 R]]\n* [[Use it only while someone is in the room->D4 J11 W]]", "D4 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Buzzing, a hot-plastic smell, and too hot to hold are all **stop signs**. A grown-up should **unplug it**, and Kenji should replace it with a listed charger from a real store.\"\n\n[[Got it->D4 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm is normal. What warning signs did I list?\"\n\n[[Try again->D4 J11]]]", "D4 J11 R": "(set: $miss to 0)## ✅ Job done\n**Hot, buzzing, or smelly means stop.** Uncertified knockoffs can skip the safety parts that prevent overheating. A listed charger from the laptop's maker or a well-known brand is worth the extra money. (And ice packs drip. Keep them far away.)\n\n[[Next customer->D4 J12]]", "D4 J12": "**Ms. Abara** is worried. After an afternoon of video calls, her laptop's charger brick feels warm, about like a mug of tea that's been sitting a while. It's the original charger, sitting out on her desk. It's silent, and it doesn't smell like anything.\n\n**What should you tell her?**\n\n* [[It's overheating, so she should replace it today->D4 J12 W]]\n* [[It's failing, so unplug it whenever she's not watching->D4 J12 W]]\n* [[It's unsafe, so she should wrap it in foil to spread heat->D4 J12 W]]\n* [[Warm is normal if it's not hot, noisy, or smelly->D4 J12 R]]", "D4 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Warm is normal.** Chargers turn a bit of their power into heat. Too hot to hold, buzzing, or a burning smell would be a different story. Out on the desk, where air can reach it, is exactly where it belongs.\"\n\n[[Got it->D4 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which did I call normal: warm, or too hot to hold?\"\n\n[[Try again->D4 J12]]]", "D4 J12 R": "(set: $miss to 0)(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]## ✅ Job done\n**A warm charger is normal.** Chargers lose a little energy as heat while they work. Watch for the real warning signs: too hot to hold, buzzing, or a burning smell. And keep it off beds and out from under pillows.\n\n[[Close up shop->D4 Done]]", "D4 Done": "(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]# Day 4 complete!\n\n<div class=\"tool\">🔌 **New tool earned: Cable Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** **Coil and check.** 1. Find a cable that isn't plugged into anything (a spare charging cable or headphone cord works). Practice the **over-under coil**: one normal loop, then one loop with a small twist the other way, and repeat. When you're done, hold one end and let the coil fall. Does it uncoil flat, with no kinks? 2. **With a grown-up**, follow your computer's power cord to wherever it plugs in. Is it a **surge protector** (surge wording, a joule rating, a protection light) or just a **power strip**? If there's a protection light, is it on? Is anything daisy-chained? Write down what you find and tell your grown-up about anything that needs fixing.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Cable Care\n\"Cables are tougher than they look in the middle, and weaker than they look at the ends.\"\n\n* **Pull the plug, not the cord.** Grip the hard plug and pull it straight out. Yanking the cord tugs on the thin wires where they join the plug.\n* **Strain relief:** the thick, bendy collar where a cable meets its plug or charger. It spreads a bend out over a longer stretch so the wires inside don't fold at one sharp point. Bend a cable hard right at that spot, again and again, and the tiny wires crack and the outer jacket splits. Techs call this fraying \"at the neck.\"\n* **Coil loosely with the over-under method.** Wrapping a cord tightly around its charger brick bends it sharply right at the strain relief. Instead, make one normal loop (*over*), then give the cable a small twist the other way so the next loop forms underneath (*under*), and repeat. Stage and sound crews use this because the twists cancel out and the cable uncoils flat, with no kinks. Hand-sized loose loops with a reusable tie work too.\n* **Stop signs:** frayed or split jackets, exposed wires, scorch marks, or melted or bubbled plastic. **Stop using it and replace it.** Tape is not a repair.\n* **Pets:** a chewed cable can shock a pet and ruin the cable. Use **cord protectors** (plastic sleeves or covers), run cables out of reach, and unplug chargers that aren't in use.\n* **Lint in ports:** pocket lint packs into the bottom of USB-C and Lightning ports, so the plug can't push all the way in. The connection gets wobbly or charges on and off. The fix: power the device off, then gently scoop it out with a **wooden or plastic toothpick**. **Never metal.** Paperclips and pins can scratch the contacts or short them out.\n\n<div class=\"warn\">**Grown-up needed:** If a cord or charger is scorched, melted, or has exposed wires, let a grown-up unplug it by the plug and take it out of use.</div>\n\n### Strips, Surges, and Storms\n* **Power strip:** adds more outlets. That's it. Many have an on/off switch and a breaker that trips if you overload them, but **no surge protection**.\n* **Surge protector:** looks like a power strip, but it has parts inside that absorb sudden **voltage spikes** (surges) before they reach your electronics. Surges can come from lightning, from power coming back on after an outage, or from big appliances switching on and off.\n\n### Reading the label\n* **A UL or ETL listing:** an independent safety lab tested it. For surge protection, look for wording like **\"surge protector\"** or **\"surge protective device,\"** often with **UL 1449**. Vague phrases like \"meets UL standards\" are not the same as a listing.\n* **A joule rating:** how much surge energy it can soak up before it wears out. Higher is better, and for computer gear, look for at least several hundred joules. A plain power strip has no joule rating at all.\n* **A \"protected\" light:** surge protectors wear out, because each surge uses up some of their capacity. If the protection light is off, or after a big surge such as a nearby lightning strike, **replace it**. It may still pass power without protecting anything.\n\n### Don't daisy-chain\n**Daisy-chaining** means plugging one power strip into another (or into an extension cord). Everything down the chain draws power through the first strip, so it can overload, overheat, and start a fire. Plug each strip **straight into a wall outlet**, and don't overload it.\n\n### Thunderstorms\nA surge protector handles everyday spikes. A **nearby lightning strike** can be far too big for it. FEMA advises unplugging appliances when a thunderstorm warning is issued. So when a storm is on the way: **save your work, shut down, and unplug** from the wall. Do it early. Once lightning is close, stay away from plugged-in cords and wait it out.\n\n<div class=\"warn\">**Grown-up needed:** Unplug and rearrange power strips and surge protectors with a grown-up, and only when your hands are dry.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 5->D5 Start]]", "D5 Start": "(set: $miss to 0)# Day 5: Batteries & Charging\n\n*The Inspector sets a cardboard box on the bench. Inside are a dozen old batteries, each in its own plastic bag, with tape over the metal ends.*\n\n\"Every laptop, phone, tablet, and wireless controller in this shop runs on a **lithium-ion battery**. They're light, they hold a lot of energy, and they wear out a little every day. That last part isn't a defect. It's chemistry.\"\n\n\"Today you learn three things, Technician: how batteries age, how to store them, and what to do when one goes bad. That last one matters most, because a damaged battery isn't just a dead gadget. It can be a fire.\"\n\n\n[[Open the shop->D5 L1]]", "D5 L1": "## 📘 The Inspector's lesson: How Batteries Age\n\n*The Inspector holds up two identical phones.* \"Same model, same age. One lasts all day, one lasts until lunch. Let's find out why.\"\n\n### Charge cycles and capacity\n* A **charge cycle** means using a full battery's worth of energy, 100% in total. Using 50% today and 50% tomorrow adds up to **one** cycle, not two.\n* **Capacity** is how much energy the battery can hold. Every lithium-ion battery slowly loses capacity as it ages. This is called **capacity fading**, and it's normal.\n* Apple, for example, designs its Mac laptop batteries to keep **up to 80%** of their original capacity after **1,000 full cycles**. So a laptop that lasted 8 hours when new might last noticeably less after several years. Nothing is broken; the battery just holds less.\n\n### What speeds up aging\n* **Heat is the biggest enemy.** Apple warns that temperatures above **35°C (95°F)** can permanently damage battery capacity. Common heat traps: a hot car or a sunny dashboard, charging under a pillow or blanket, and gaming while charging in a hot room (the battery is being filled *and* drained at once, so it heats up).\n* **Sitting very full or very empty for a long time** adds wear. A battery parked at 100% for weeks, or left at 0% for months, ages faster than one kept in the middle.\n* Lithium-ion has **no memory effect**. You do *not* need to drain it to 0% to \"train\" or \"calibrate\" it. Deep drains actually add wear. Partial charges, like 30% to 80%, are perfectly fine.\n\n### Built-in battery protection\nMany modern devices protect themselves. Look for **Optimized Battery Charging**, **Smart Charging**, or a **charge limit** around **80%**. These features hold the battery below full when you leave it plugged in for long stretches, so **leaving a modern laptop plugged in is fine** when protection is turned on.\n\n### Battery health reports\nYou can check how worn a battery is:\n* **Windows laptops:** typing `powercfg /batteryreport` in Command Prompt creates a report. Compare **Design capacity** (when new) to **Full charge capacity** (now).\n* **Mac:** System Settings → Battery, then look for **Battery Health**.\n* **iPhone:** Settings → Battery → Battery Health (the exact name varies by version).\n\n<div class=\"warn\">**Grown-up needed:** Ask a grown-up before running commands or changing battery settings on a family device.</div>\n\n\n[[Got it. Send in the next customer->D5 J2]]", "D5 J2": "**Ms. Rivera** sets down her four-year-old laptop. \"When it was new it lasted all day. Now I get about an hour. Is it broken?\"\n\n**What's your first step?**\n\n* [[Drain it to 0% a few times to reset the battery->D5 J2 W]]\n* [[Check the battery health report against its design capacity->D5 J2 R]]\n* [[Reinstall the operating system to fix the battery's power use->D5 J2 W]]\n* [[Charge it to 100% and leave it plugged in for a full day->D5 J2 W]]", "D5 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Check the battery health report.** Four years of charge cycles means capacity fading. On Windows, `powercfg /batteryreport` compares design capacity with full charge capacity. If it's badly worn, a technician can replace the battery.\"\n\n[[Got it->D5 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Batteries hold less as they age. How could you *measure* how much this one has lost?\"\n\n[[Try again->D5 J2]]]", "D5 J2 R": "(set: $miss to 0)## ✅ Job done\n**Check the battery health report.** After years of charge cycles, every lithium-ion battery holds less. The report shows how much capacity is left, so you know whether a replacement makes sense.\n\n[[Next customer->D5 J3]]", "D5 J3": "**Jayden** proudly explains his routine: \"Every night I let my tablet die completely, all the way to 0%. It trains the battery to last longer.\"\n\n**What do you tell him?**\n\n* [[Good plan, but he should do it once a week, not daily->D5 J3 W]]\n* [[Draining to 0% only helps if he charges it overnight->D5 J3 W]]\n* [[He should drain it to 0% and then freeze it overnight->D5 J3 W]]\n* [[Lithium-ion has no memory, and deep drains add wear->D5 J3 R]]", "D5 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Lithium-ion batteries have no memory effect.** Draining to 0% every day doesn't train anything. It adds wear. Partial charges are fine.\"\n\n[[Got it->D5 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Does a lithium-ion battery need training? What did I say about deep drains?\"\n\n[[Try again->D5 J3]]]", "D5 J3 R": "(set: $miss to 0)## ✅ Job done\n**No training needed.** That advice comes from much older battery types. For lithium-ion, deep drains to 0% add wear, and charging whenever it's convenient is fine.\n\n[[Next customer->D5 J4]]", "D5 J4": "**Tasha** left her phone on the car dashboard during a summer afternoon at the beach. Ever since, its battery seems to drain faster.\n\n**What most likely caused it?**\n\n* [[Heat from the sun-baked dashboard wore the battery->D5 J4 R]]\n* [[The phone used too much data while it was at the beach->D5 J4 W]]\n* [[Sand got into the port and blocked the charging->D5 J4 W]]\n* [[The car's radio signal drained the battery overnight->D5 J4 W]]", "D5 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Heat.** A dashboard in summer can get far hotter than 35°C (95°F), and heat can permanently reduce battery capacity.\"\n\n[[Got it->D5 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I call the biggest enemy of a battery?\"\n\n[[Try again->D5 J4]]]", "D5 J4 R": "(set: $miss to 0)## ✅ Job done\n**Heat damaged the battery.** A parked car in summer gets dangerously hot, especially on the dashboard. Keep devices out of hot cars, out of direct sun, and out from under pillows while charging.\n\n[[Next customer->D5 J5]]", "D5 J5": "**Dev** keeps his gaming laptop plugged in at his desk all day, every day. He's worried he's ruining the battery.\n\n**What's the best advice?**\n\n* [[Unplug it every hour so the battery gets exercise->D5 J5 W]]\n* [[Take the battery out and run it on wall power only->D5 J5 W]]\n* [[Turn on its charge limit or smart charging setting->D5 J5 R]]\n* [[Let it drain to 0% every weekend to balance it out->D5 J5 W]]", "D5 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn on the charge limit or smart charging.** It keeps the battery around 80% instead of sitting at 100% all day. With that on, staying plugged in is fine.\"\n\n[[Got it->D5 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Many modern laptops have a setting just for people like Dev. What does it do?\"\n\n[[Try again->D5 J5]]]", "D5 J5 R": "(set: $miss to 0)## ✅ Job done\n**Use the built-in battery protection.** A charge limit or optimized charging keeps the battery from sitting full for long stretches. Also make sure the vents stay clear, because heat from gaming adds wear too.\n\n[[The Inspector has something to show you->D5 L6]]", "D5 L6": "## 📘 The Inspector's lesson: Long-Term Storage\n\n*The Inspector opens a drawer full of devices with sticky notes on them.* \"Spare laptops, old phones, the tablet that only comes out on road trips. Storage is where batteries quietly die.\"\n\n* **Store at about half charge.** Apple suggests about **50%**, and Microsoft suggests between **40% and 60%**. Full batteries age faster in storage, and empty ones are worse.\n* **Never store a battery fully dead.** A battery keeps slowly losing charge even when the device is off. If it starts near 0%, it can drop into **deep discharge** (drained so far that it may refuse to charge again, or become unsafe to charge).\n* **Keep it cool and dry.** A closet indoors is better than a hot garage, attic, or car. Apple recommends storing devices below **32°C (90°F)**.\n* **Top it up every few months.** Check stored devices and bring them back to about half. Apple says to recharge to 50% at least every six months; checking more often is even safer.\n\n\"Think of it like a houseplant on vacation. Not soaked, not dried out, and somebody checks on it.\"\n\n\n[[Got it. Send in the next customer->D5 J7]]", "D5 J7": "**Grandpa Leo** found his old laptop in a closet. He put it away with a dead battery a year ago, and now it won't charge at all. Biscuit sniffs the charger suspiciously.\n\n**What most likely happened, and what's the lesson?**\n\n* [[The charger wore out, so a new cable will fix it right up->D5 J7 W]]\n* [[It drained into deep discharge; store at half charge next time->D5 J7 R]]\n* [[The closet was too cold, so it should have been stored in a car->D5 J7 W]]\n* [[Laptops forget their settings if they sit unused for a year->D5 J7 W]]", "D5 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"It sat **dead for a year** and slid into **deep discharge**. The battery may need replacing. Next time: store at about half charge and top up every few months.\"\n\n[[Got it->D5 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How did he store it, and what did I say about storing a battery dead?\"\n\n[[Try again->D5 J7]]]", "D5 J7 R": "(set: $miss to 0)## ✅ Job done\n**Deep discharge.** Batteries slowly lose charge even when off, so one stored empty can drain too far to recover. Store at about half charge, somewhere cool, and check every few months.\n\n[[Next customer->D5 J8]]", "D5 J8": "**Nora** is putting her school tablet away for summer. She plans to charge it to 100% and store it in the garage, \"so it's ready in the fall.\"\n\n**What should she change?**\n\n* [[Store it at 100% but wrap it in a towel in the garage->D5 J8 W]]\n* [[Let it drain to 0% first so it can't lose any more charge->D5 J8 W]]\n* [[Leave it on the charger in the garage all summer long->D5 J8 W]]\n* [[Store it near half charge somewhere cool, and top it up->D5 J8 R]]", "D5 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**About half charge, somewhere cool and dry.** A full battery ages faster in storage, and a summer garage gets hot. Check it every few months.\"\n\n[[Got it->D5 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two things in her plan add wear. What charge level and what kind of place did I recommend?\"\n\n[[Try again->D5 J8]]]", "D5 J8 R": "(set: $miss to 0)## ✅ Job done\n**Half charge, cool place, occasional top-ups.** Full batteries wear faster in storage, and garages bake in summer. An indoor shelf or closet is much better.\n\n[[The Inspector has something to show you->D5 L9]]", "D5 L9": "## 📘 The Inspector's lesson: Swollen Batteries\n\n*The Inspector slides a laptop across the counter. Its bottom panel bulges like a loaf of bread.* \"Don't touch it. Just look.\"\n\n### What swelling is\nAs a lithium-ion battery ages, overheats, or gets damaged, chemical reactions inside can make **gas**. The gas puffs the battery up like a pillow. A **swollen battery** is damaged and can catch fire, especially if it's pressed, bent, or punctured.\n\n### Warning signs\n* A **trackpad lifting** up, or clicking strangely or not at all\n* A **gap** opening along the seams of the case\n* A phone or tablet **screen lifting** away from its frame\n* A **bulge** on the bottom or back\n* A device that **rocks** when you set it on a flat table\n\n### What to do\n1. **Stop using it.** Unplug it and **don't charge it again.**\n2. **Don't press, puncture, bend, or pry it.** Never try to remove a swollen battery yourself.\n3. Set it on a hard surface away from anything that burns, like paper, blankets, or curtains.\n4. **Tell a grown-up**, and take it to a professional repair shop, the manufacturer, or a battery recycler.\n\n### Disposal\n**Never put lithium-ion batteries in household trash or recycling bins.** They can be crushed in a garbage truck or sorting machine and start fires. Take them to a battery drop-off point, like many electronics stores or your town's household hazardous waste site. Put tape over the metal ends and put each battery in its own bag. Keep these in a grown-up box until drop-off day.\n\n<div class=\"warn\">**Grown-up needed:** A swollen or damaged battery is a grown-up job from the moment you spot it. Don't handle it yourself.</div>\n\n\n[[Got it. Send in the next customer->D5 J10]]", "D5 J10": "**Mr. Chen's** grandson Ollie says the trackpad on his laptop has started lifting up, and now it barely clicks.\n\n**What should he do?**\n\n* [[Press the trackpad back down firmly so it clicks again->D5 J10 W]]\n* [[Charge it fully so the trackpad gets enough power->D5 J10 W]]\n* [[Stop using it, unplug it, and tell a grown-up today->D5 J10 R]]\n* [[Open the case himself to check the trackpad screws->D5 J10 W]]", "D5 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a classic sign of a **swollen battery** pushing up from below. **Stop using it, unplug it, and get a grown-up.** Never press on it.\"\n\n[[Got it->D5 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A trackpad lifting from underneath. What could be pushing it up?\"\n\n[[Try again->D5 J10]]]", "D5 J10 R": "(set: $miss to 0)## ✅ Job done\n**Stop, unplug, tell a grown-up.** A lifting trackpad often means the battery underneath is swelling. Pressing it or charging it can make a damaged battery catch fire. A professional should remove it.\n\n[[Next customer->D5 J11]]", "D5 J11": "**Ava** brings in an old phone with a puffy back. \"It looks like a balloon,\" she says, reaching for a pin. \"Can I poke it to let the air out?\"\n\n**What do you tell her?**\n\n* [[Never puncture it; a pierced battery can start a fire->D5 J11 R]]\n* [[Only poke it a tiny bit, outdoors, away from her face->D5 J11 W]]\n* [[Squeeze it flat slowly so the gas escapes safely->D5 J11 W]]\n* [[Put it in the freezer first so poking it is safe->D5 J11 W]]", "D5 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Never puncture a swollen battery.** That's not air in there. A pierced lithium-ion battery can burst into flames. Set it down away from anything that burns and get a grown-up.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's inside that puffy battery, and what did I say about puncturing one?\"\n\n[[Try again->D5 J11]]]", "D5 J11 R": "(set: $miss to 0)## ✅ Job done\n**Don't puncture, press, or freeze it.** A damaged lithium-ion battery can catch fire if it's pierced. A grown-up should take it to a battery recycler or repair shop.\n\n[[Next customer->D5 J12]]", "D5 J12": "**Mr. Patel** is cleaning out a drawer. He tosses an old phone battery into the kitchen trash. \"It's dead anyway,\" he shrugs.\n\n**What should he do instead?**\n\n* [[Put it in the curbside recycling bin with the cans->D5 J12 W]]\n* [[Wrap it in paper towels first so it's safe in the trash->D5 J12 W]]\n* [[Tape its ends and take it to a battery drop-off point->D5 J12 R]]\n* [[Leave it in the sun to use up the last of its charge->D5 J12 W]]", "D5 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Never in household trash or recycling bins.** Even a 'dead' battery has energy left and can spark a fire when it's crushed. **Tape the ends, bag it, and take it to a battery drop-off.**\"\n\n[[Got it->D5 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where did I say lithium-ion batteries must *never* go?\"\n\n[[Try again->D5 J12]]]", "D5 J12 R": "(set: $miss to 0)(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]## ✅ Job done\n**Take it to a battery drop-off.** Lithium-ion batteries in trash or recycling trucks can be crushed and start fires. Tape over the metal ends, bag it, and drop it at an electronics store or hazardous waste site.\n\n[[Close up shop->D5 Done]]", "D5 Done": "(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]# Day 5 complete!\n\n<div class=\"tool\">🔋 **New tool earned: Battery Tester**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** With a grown-up, find your device's battery health report or setting (Windows battery report, Mac or iPhone Battery Health, or your device's battery settings). Write down what it says in your Tech Notebook: the health percentage or the design and full charge capacities, plus whether a charge limit or optimized charging is turned on.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### How Batteries Age\n### Charge cycles and capacity\n* A **charge cycle** means using a full battery's worth of energy, 100% in total. Using 50% today and 50% tomorrow adds up to **one** cycle, not two.\n* **Capacity** is how much energy the battery can hold. Every lithium-ion battery slowly loses capacity as it ages. This is called **capacity fading**, and it's normal.\n* Apple, for example, designs its Mac laptop batteries to keep **up to 80%** of their original capacity after **1,000 full cycles**. So a laptop that lasted 8 hours when new might last noticeably less after several years. Nothing is broken; the battery just holds less.\n\n### What speeds up aging\n* **Heat is the biggest enemy.** Apple warns that temperatures above **35°C (95°F)** can permanently damage battery capacity. Common heat traps: a hot car or a sunny dashboard, charging under a pillow or blanket, and gaming while charging in a hot room (the battery is being filled *and* drained at once, so it heats up).\n* **Sitting very full or very empty for a long time** adds wear. A battery parked at 100% for weeks, or left at 0% for months, ages faster than one kept in the middle.\n* Lithium-ion has **no memory effect**. You do *not* need to drain it to 0% to \"train\" or \"calibrate\" it. Deep drains actually add wear. Partial charges, like 30% to 80%, are perfectly fine.\n\n### Built-in battery protection\nMany modern devices protect themselves. Look for **Optimized Battery Charging**, **Smart Charging**, or a **charge limit** around **80%**. These features hold the battery below full when you leave it plugged in for long stretches, so **leaving a modern laptop plugged in is fine** when protection is turned on.\n\n### Battery health reports\nYou can check how worn a battery is:\n* **Windows laptops:** typing `powercfg /batteryreport` in Command Prompt creates a report. Compare **Design capacity** (when new) to **Full charge capacity** (now).\n* **Mac:** System Settings → Battery, then look for **Battery Health**.\n* **iPhone:** Settings → Battery → Battery Health (the exact name varies by version).\n\n<div class=\"warn\">**Grown-up needed:** Ask a grown-up before running commands or changing battery settings on a family device.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 6->D6 Start]]", "D6 Start": "(set: $miss to 0)# Day 6: Other Everyday Gear\n\n*The Inspector tips a canvas bag onto the counter. Out spill earbuds, a game controller with a suspicious orange smear, a phone, and a webcam.*\n\n\"Computers get all the attention, but this is the stuff people actually carry around all day. It goes in pockets, in ears, in snack-covered hands. So it gets dirty fast, and it breaks in very predictable ways.\"\n\n\"The golden rule still holds: **power off, and liquid goes on the cloth, never on the device.** Today you learn the details for each piece of gear.\"\n\n\n[[Open the shop->D6 L1]]", "D6 L1": "## 📘 The Inspector's lesson: Earbuds and Headphones\n\n*The Inspector holds an earbud up to the light.* \"See that fine metal screen? That's the **mesh**. It lets sound out and keeps gunk from getting in. Mostly.\"\n\n### Cleaning\n* **Earwax on the mesh** muffles the sound. Brush it off with a **dry, soft brush** (a clean, soft toothbrush works).\n* For the outside of the earbud, use a cloth that's **barely damp** with a little isopropyl alcohol. **Outside only.** Never let liquid go into the mesh, speaker openings, or charging contacts.\n* **Removable ear tips** (the soft silicone or foam parts) can come off and be cleaned separately. Silicone tips can be rinsed with plain water, but they must **dry completely** before you put them back. Apple, for example, says to let wet AirPods dry for **at least two hours**. A wet tip traps moisture right against the mesh.\n* **Charging-case contacts** (the little metal points inside) collect lint and grime. Wipe them with a **dry** cotton swab.\n* **Share earbuds rarely.** They sit inside your ear canal, so they pass along earwax and germs. If you do share, clean them first.\n\n### Volume safety\nVery loud sound damages the tiny **hair cells** in your inner ear, and they don't grow back. A common guideline is the **60/60 rule**: no more than about **60% volume** for no more than about **60 minutes** at a time, then give your ears a break.\n\n### Water ratings\nAn **IP rating** (Ingress Protection) has two digits. The first is for dust and the second is for water. An **X** means \"not tested\" for that one.\n* **IPX4** means protected from **splashes** from any direction: sweat, light rain. **Not swimming, not showering.**\n* **IPX7** means a device survived being dunked up to **1 meter for 30 minutes** in a lab test. That still doesn't make it a pool toy.\n* **Water resistance wears off over time.** Seals age, and soap, sunscreen, and lotion can damage them.\n\n<div class=\"warn\">**Grown-up needed:** Ask a grown-up before using isopropyl alcohol, and keep the bottle away from flames.</div>\n\n\n[[Got it. Send in the next customer->D6 J2]]", "D6 J2": "**Ava** says her left earbud sounds quiet and muffled. Up close, the little mesh screen has a yellowish-brown coating.\n\n**What's the right fix?**\n\n* [[Soak the earbud in alcohol until the coating dissolves->D6 J2 W]]\n* [[Poke through the mesh with a pin to open the holes->D6 J2 W]]\n* [[Brush the mesh gently with a dry, soft brush->D6 J2 R]]\n* [[Run warm water through the mesh to rinse it out->D6 J2 W]]", "D6 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **earwax** on the mesh. A **dry, soft brush** loosens it. Liquid and pins can push it deeper or tear the mesh.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What clogs the mesh, and what did I say goes *into* the mesh?\"\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**A dry, soft brush.** Earwax on the mesh blocks the sound. Never soak an earbud or push liquid or sharp objects into the openings.\n\n[[Next customer->D6 J3]]", "D6 J3": "**Marcus** washed his earbud tips in warm water, then immediately pushed them back on, still dripping, so he could listen on the bus.\n\n**What should he have done?**\n\n* [[Let the tips dry completely before putting them back->D6 J3 R]]\n* [[Dry the tips quickly with a hair dryer on its high heat->D6 J3 W]]\n* [[Put the wet earbuds in the case so they dry faster->D6 J3 W]]\n* [[Shake the water off and then use them right away->D6 J3 W]]", "D6 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Let them dry completely.** Wet tips trap water right against the mesh and speaker. Give them time, at least a couple of hours.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Washing the tips was fine. What did I say about putting them back?\"\n\n[[Try again->D6 J3]]]", "D6 J3 R": "(set: $miss to 0)## ✅ Job done\n**Dry completely first.** Removable tips can be washed, but water trapped against the mesh can damage the earbud. The charging case is no place for wet earbuds either.\n\n[[Next customer->D6 J4]]", "D6 J4": "**Priya**, 14, holds up her new earbuds. \"The box says IPX4, so I can swim laps with them, right?\"\n\n**What do you tell her?**\n\n* [[Yes, IPX4 means fully waterproof in any pool->D6 J4 W]]\n* [[Yes, as long as she stays in the shallow end of the pool->D6 J4 W]]\n* [[Yes, if she dries them with a towel afterward->D6 J4 W]]\n* [[No, IPX4 means splash resistant, not for swimming->D6 J4 R]]", "D6 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**IPX4 means splashes**, like sweat or light rain. It's **not for swimming**. And water resistance wears down over time anyway.\"\n\n[[Got it->D6 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does the 4 in IPX4 protect against?\"\n\n[[Try again->D6 J4]]]", "D6 J4 R": "(set: $miss to 0)## ✅ Job done\n**Splashes only.** IPX4 is tested against splashing water, not being underwater. \"Water resistant\" never means \"waterproof,\" and the seals weaken as the earbuds age.\n\n[[Next customer->D6 J5]]", "D6 J5": "**Theo** wears his headphones at maximum volume for three or four hours every afternoon. \"If it hurt, I'd notice,\" he says.\n\n**What's the best advice?**\n\n* [[Max volume is fine as long as the music isn't bassy->D6 J5 W]]\n* [[Follow the 60/60 rule and give his ears breaks->D6 J5 R]]\n* [[Switch ears every hour so each ear gets a rest->D6 J5 W]]\n* [[Use earbuds instead, since they're quieter by design->D6 J5 W]]", "D6 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Try the **60/60 rule**: about 60% volume for about 60 minutes, then a break. Loud sound damages hair cells in the inner ear, and that damage is permanent.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Hearing damage doesn't always hurt. What guideline did I give for volume and time?\"\n\n[[Try again->D6 J5]]]", "D6 J5 R": "(set: $miss to 0)## ✅ Job done\n**The 60/60 rule.** Hearing damage builds up quietly. You won't feel it happening. Lower volume and regular breaks protect hair cells that never grow back.\n\n[[The Inspector has something to show you->D6 L6]]", "D6 L6": "## 📘 The Inspector's lesson: Game Controllers\n\n*The Inspector picks up the controller with the orange smear.* \"Cheese dust. The natural enemy of the A button.\"\n\n### Sticky buttons\n1. **Turn the controller off** and unplug it (or take the batteries out).\n2. Dip a cotton swab in a little **70% isopropyl alcohol**, then squeeze it until it's barely damp.\n3. Run it around the **edges** of the sticky button. Press the button a few times to work the alcohol into the gap.\n4. Let it dry for a few minutes before turning it on. **Never pour or spray** liquid on a controller.\n\n### Stick drift\n**Stick drift** is when your character or camera moves on its own, even when you're not touching the thumbstick. Causes include **dust inside the thumbstick** and **worn-out sensor parts**.\n* Blow around the base of the stick with short bursts of **compressed air** (can upright).\n* Check for a **controller update**, and use the console's or computer's **calibration** tool if it has one.\n* If it still drifts, the parts are probably worn. Check the **warranty** first, then consider a repair. Don't open a controller that's still under warranty.\n\n### Charging and storage\nEverything from yesterday's battery lesson applies. Don't leave a controller dead in a drawer for months. And **pull cables by the plug, not the cord**. Yanking a cable while you play strains both the cable and the port.\n\n\n[[Got it. Send in the next customer->D6 J7]]", "D6 J7": "**Dev's** character keeps creeping to the left in his game, even when his thumbs are off the controller.\n\n**What's going on, and what's a good first step?**\n\n* [[The game is lagging; restarting the router will fix it->D6 J7 W]]\n* [[The battery is low; that makes the character drift->D6 J7 W]]\n* [[It's stick drift; clean around the stick and calibrate->D6 J7 R]]\n* [[The controller is too cold; warm it up in the sun first->D6 J7 W]]", "D6 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **stick drift**. Try short bursts of compressed air around the stick, a controller update, and calibration. If it keeps drifting, check the warranty for a repair.\"\n\n[[Got it->D6 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Movement when nobody touches the stick. What did I call that?\"\n\n[[Try again->D6 J7]]]", "D6 J7 R": "(set: $miss to 0)## ✅ Job done\n**Stick drift.** Dust or worn parts inside the thumbstick send false movement signals. Clean, update, and calibrate first, then use the warranty or a repair.\n\n[[Next customer->D6 J8]]", "D6 J8": "**Jayden** was eating cheesy chips during a game. Now his A button sticks down and pops back up slowly.\n\n**What's the right fix?**\n\n* [[Run the controller under the kitchen faucet to rinse the button->D6 J8 W]]\n* [[Power off, then swab the button edges with a little alcohol->D6 J8 R]]\n* [[Spray glass cleaner into the gap around the A button->D6 J8 W]]\n* [[Pry the A button off with a butter knife and scrub it->D6 J8 W]]", "D6 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Power off, then a barely damp alcohol swab around the edges.** Press the button a few times to work it in, and let it dry before playing.\"\n\n[[Got it->D6 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Power first, then what goes on the swab, and where does the swab go?\"\n\n[[Try again->D6 J8]]]", "D6 J8 R": "(set: $miss to 0)## ✅ Job done\n**Alcohol on a swab, around the edges.** Alcohol dissolves the snack gunk and dries fast. Never rinse or spray a controller, and don't pry buttons off.\n\n[[The Inspector has something to show you->D6 L9]]", "D6 L9": "## 📘 The Inspector's lesson: Phones, Tablets, and Webcams\n\n*The Inspector holds a phone up to her eye like a telescope.* \"Small lenses, small ports, big problems.\"\n\n### Camera lenses\nA smudge on a camera lens makes pictures and video calls look **blurry or hazy**. Wipe the lens gently with a **clean microfiber cloth**. Laptop webcams and external webcams need the same care.\n\n### Privacy covers\nA **thin privacy shutter** that slides over a webcam is fine on a monitor or desktop webcam. On a **laptop**, though, a **thick cover can crack the screen** when you close the lid, because there's almost no gap between the screen and the keyboard. Apple warns against covers thicker than about **0.1 mm** (about the thickness of printer paper) on its laptops.\n\n### Cases and screen protectors\nA good case absorbs drops. A screen protector takes the scratches so the real screen doesn't. If a phone gets hot while charging in a thick case, take the case off while it charges.\n\n### Lint in the charging port\nPocket lint packs into charging ports until the cable can't seat all the way. Symptoms: the cable feels loose, or it only charges at a certain angle.\n1. **Power off** the phone.\n2. Shine a light into the port.\n3. Gently loosen the lint with a **wooden or plastic toothpick** and lift it out. **Never use metal** (pins, paper clips), which can scratch or short the contacts.\n\n### Water and heat\n* **\"Water resistant\" is not \"waterproof.\"** Resistance wears down over time, and a drop in the pool is not a test you want to run.\n* **Don't charge phones under pillows or blankets.** Heat builds up with nowhere to go, and you already know what heat does to batteries.\n\n<div class=\"warn\">**Grown-up needed:** Ask a grown-up before cleaning out a charging port or working on someone else's phone.</div>\n\n\n[[Got it. Send in the next customer->D6 J10]]", "D6 J10": "**Mr. Patel's** phone only charges if he holds the cable at just the right angle. The cable works fine on other phones.\n\n**What's the best first fix?**\n\n* [[Buy a stronger, faster charger for the phone->D6 J10 W]]\n* [[Spray a little water in the port to loosen the gunk->D6 J10 W]]\n* [[Push the cable in harder until it clicks->D6 J10 W]]\n* [[Power off and ease the lint out with a toothpick->D6 J10 R]]", "D6 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Pocket lint.** Power off, shine a light in, and gently lift it out with a **wooden or plastic toothpick**. Never metal, never liquid.\"\n\n[[Got it->D6 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"The cable's fine. What lives in pockets and packs into ports?\"\n\n[[Try again->D6 J10]]]", "D6 J10 R": "(set: $miss to 0)## ✅ Job done\n**Clear the lint.** Packed lint stops the plug from seating fully. A wooden or plastic toothpick won't scratch or short the contacts like a metal pin can.\n\n[[Next customer->D6 J11]]", "D6 J11": "**Mr. Chen** says everyone on his video calls tells him he looks foggy, like he's calling from inside a cloud. His all-in-one's webcam is right above the screen, where he often touches it.\n\n**What should he try first?**\n\n* [[Wipe the webcam lens with a clean microfiber cloth->D6 J11 R]]\n* [[Turn the screen brightness all the way up to full->D6 J11 W]]\n* [[Buy a new webcam with a much higher resolution->D6 J11 W]]\n* [[Wipe the lens with a tissue and some window cleaner->D6 J11 W]]", "D6 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Fingerprint smudges on the lens.** A gentle wipe with a clean **microfiber cloth** usually clears it right up.\"\n\n[[Got it->D6 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"He keeps touching the area around the camera. What does that leave behind?\"\n\n[[Try again->D6 J11]]]", "D6 J11 R": "(set: $miss to 0)## ✅ Job done\n**Clean the lens with microfiber.** Smudges on a camera lens make the image blurry or hazy. Tissues can scratch, and window cleaner can damage coatings.\n\n[[Next customer->D6 J12]]", "D6 J12": "**Nora** stuck a chunky plastic camera cover on her laptop's webcam. Now when she closes the lid, she hears a little creak.\n\n**What should she do?**\n\n* [[Close the lid more gently so it doesn't creak->D6 J12 W]]\n* [[Leave it, since the creak is just the hinge settling->D6 J12 W]]\n* [[Add a second cover to the other side to balance it->D6 J12 W]]\n* [[Remove it and use a very thin shutter or none at all->D6 J12 R]]", "D6 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Almost none. **A thick cover can crack a laptop screen** when the lid closes. Take it off. Use a very thin shutter made for laptops, or none.\"\n\n[[Got it->D6 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How much space is there between a laptop's screen and keyboard when it's closed?\"\n\n[[Try again->D6 J12]]]", "D6 J12 R": "(set: $miss to 0)(if: $days does not contain \"6\")[(set: $days to it + (a: \"6\"))]## ✅ Job done\n**Take off the thick cover.** Laptops close with very little gap, so a chunky cover presses on the screen. Apple warns against covers thicker than about 0.1 mm on its laptops.\n\n[[Close up shop->D6 Done]]", "D6 Done": "(if: $days does not contain \"6\")[(set: $days to it + (a: \"6\"))]# Day 6 complete!\n\n<div class=\"tool\">🎧 **New tool earned: Gear Bag**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Give one everyday gadget (earbuds, a game controller, or a phone) a proper clean using today's steps. Power it off first. Ask a grown-up before using any alcohol or cleaning a charging port. Note in your Tech Notebook what you cleaned, which steps you used, and whether anything works better afterward.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Earbuds and Headphones\n### Cleaning\n* **Earwax on the mesh** muffles the sound. Brush it off with a **dry, soft brush** (a clean, soft toothbrush works).\n* For the outside of the earbud, use a cloth that's **barely damp** with a little isopropyl alcohol. **Outside only.** Never let liquid go into the mesh, speaker openings, or charging contacts.\n* **Removable ear tips** (the soft silicone or foam parts) can come off and be cleaned separately. Silicone tips can be rinsed with plain water, but they must **dry completely** before you put them back. Apple, for example, says to let wet AirPods dry for **at least two hours**. A wet tip traps moisture right against the mesh.\n* **Charging-case contacts** (the little metal points inside) collect lint and grime. Wipe them with a **dry** cotton swab.\n* **Share earbuds rarely.** They sit inside your ear canal, so they pass along earwax and germs. If you do share, clean them first.\n\n### Volume safety\nVery loud sound damages the tiny **hair cells** in your inner ear, and they don't grow back. A common guideline is the **60/60 rule**: no more than about **60% volume** for no more than about **60 minutes** at a time, then give your ears a break.\n\n### Water ratings\nAn **IP rating** (Ingress Protection) has two digits. The first is for dust and the second is for water. An **X** means \"not tested\" for that one.\n* **IPX4** means protected from **splashes** from any direction: sweat, light rain. **Not swimming, not showering.**\n* **IPX7** means a device survived being dunked up to **1 meter for 30 minutes** in a lab test. That still doesn't make it a pool toy.\n* **Water resistance wears off over time.** Seals age, and soap, sunscreen, and lotion can damage them.\n\n<div class=\"warn\">**Grown-up needed:** Ask a grown-up before using isopropyl alcohol, and keep the bottle away from flames.</div>\n\n### Game Controllers\n### Sticky buttons\n1. **Turn the controller off** and unplug it (or take the batteries out).\n2. Dip a cotton swab in a little **70% isopropyl alcohol**, then squeeze it until it's barely damp.\n3. Run it around the **edges** of the sticky button. Press the button a few times to work the alcohol into the gap.\n4. Let it dry for a few minutes before turning it on. **Never pour or spray** liquid on a controller.\n\n### Stick drift\n**Stick drift** is when your character or camera moves on its own, even when you're not touching the thumbstick. Causes include **dust inside the thumbstick** and **worn-out sensor parts**.\n* Blow around the base of the stick with short bursts of **compressed air** (can upright).\n* Check for a **controller update**, and use the console's or computer's **calibration** tool if it has one.\n* If it still drifts, the parts are probably worn. Check the **warranty** first, then consider a repair. Don't open a controller that's still under warranty.\n\n### Charging and storage\nEverything from yesterday's battery lesson applies. Don't leave a controller dead in a drawer for months. And **pull cables by the plug, not the cord**. Yanking a cable while you play strains both the cable and the port.\n\n### Phones, Tablets, and Webcams\n### Camera lenses\nA smudge on a camera lens makes pictures and video calls look **blurry or hazy**. Wipe the lens gently with a **clean microfiber cloth**. Laptop webcams and external webcams need the same care.\n\n### Privacy covers\nA **thin privacy shutter** that slides over a webcam is fine on a monitor or desktop webcam. On a **laptop**, though, a **thick cover can crack the screen** when you close the lid, because there's almost no gap between the screen and the keyboard. Apple warns against covers thicker than about **0.1 mm** (about the thickness of printer paper) on its laptops.\n\n### Cases and screen protectors\nA good case absorbs drops. A screen protector takes the scratches so the real screen doesn't. If a phone gets hot while charging in a thick case, take the case off while it charges.\n\n### Lint in the charging port\nPocket lint packs into charging ports until the cable can't seat all the way. Symptoms: the cable feels loose, or it only charges at a certain angle.\n1. **Power off** the phone.\n2. Shine a light into the port.\n3. Gently loosen the lint with a **wooden or plastic toothpick** and lift it out. **Never use metal** (pins, paper clips), which can scratch or short the contacts.\n\n### Water and heat\n* **\"Water resistant\" is not \"waterproof.\"** Resistance wears down over time, and a drop in the pool is not a test you want to run.\n* **Don't charge phones under pillows or blankets.** Heat builds up with nowhere to go, and you already know what heat does to batteries.\n\n<div class=\"warn\">**Grown-up needed:** Ask a grown-up before cleaning out a charging port or working on someone else's phone.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 7->D7 Start]]", "D7 Start": "(set: $miss to 0)# Day 7: Household Hazards\n\n*The Inspector pulls a laptop out of a box. A long orange cat hair is stuck in the hinge. She holds it up like evidence.*\n\n\"Technician, most of the damage I see doesn't happen in a factory or a lab. It happens at home. Cats, puppies, coffee, little brothers, radiators. A house is full of things that love computers a little too much.\"\n\n\"Today we learn to *read a room*. Where does the heat come from? Where do the drinks sit? Who has paws, and who has jam on their fingers? Spot the hazard (anything that could cause damage or injury) before it becomes a repair ticket.\"\n\n\"And if you meet a cat today, be polite. They outrank both of us.\"\n\n\n[[Open the shop->D7 L1]]", "D7 L1": "## 📘 The Inspector's lesson: Fur, Paws, and Teeth\n\n*The Inspector taps a vent caked with gray fluff.* \"Pets are family. They're also the number one reason I own a flashlight.\"\n\n### Fur in the vents\n* Pet hair floats around the house and gets **pulled into vents** by the fan. It forms a felt-like mat that blocks airflow, so the machine runs hot and the fan roars.\n* When a processor gets too hot, it uses **thermal throttling** (the processor slowing itself down to cool off). That's why a furry laptop feels sluggish.\n* Keep laptops on a hard surface, not on the dog's blanket or the cat's favorite pillow. Clean the vents with short bursts of compressed air and a soft brush, with the computer **off and unplugged**.\n\n### Cats on keyboards\n* Cats love warm keyboards. One stroll across the keys can type gibberish, delete a paragraph, or press a shortcut you've never heard of.\n* The fix is a habit: **lock the screen every time you walk away.** On Windows, press **Windows key + L**. On a Mac, press **Control + Command + Q**. The cat can walk all it wants, and nothing gets typed.\n* If the damage is already done, **Ctrl + Z** (Command + Z on a Mac) undoes recent typing in most programs.\n\n### Chewed cables\n* Puppies, kittens, and rabbits chew cords. A chewed cord can **shock** the pet, burn its mouth, or start a fire.\n* Prevention: **cord protectors** (plastic tubes that cover the cable), keeping cables up and **out of reach**, and **unplugging chargers** when you're not using them.\n* A cable with chewed insulation (the rubbery outer coating) or wires showing is finished. **Don't tape it and keep using it.** Replace it.\n\n<div class=\"warn\">**Grown-up needed:** If a cable is chewed while plugged in, a grown-up unplugs it at the wall without touching the damaged part. If the pet seems hurt, call a vet.</div>\n\n### The table-top troublemaker\n* Cats knock things off tables to see what happens. A cup next to a laptop is an experiment waiting to start.\n\n\n[[Got it. Send in the next customer->D7 J2]]", "D7 J2": "**Priya**, an eighth grader, left her school essay open to grab a snack. Her cat, Noodle, took a nap on the keyboard. The essay now ends with four pages of *ffffffffjjjjjjj*.\n\n**Which habit would stop this from happening again?**\n\n* [[Turning off autosave so cat typing never gets saved->D7 J2 W]]\n* [[Locking the screen whenever she steps away->D7 J2 R]]\n* [[Closing the lid partway so the keys are covered->D7 J2 W]]\n* [[Putting a thin silicone cover over the keyboard->D7 J2 W]]", "D7 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Lock the screen**: Windows key + L, or Control + Command + Q on a Mac. A locked computer ignores typing until you sign back in. Noodle can nap all she likes.\"\n\n[[Got it->D7 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say to do every time you walk away from the keys?\"\n\n[[Try again->D7 J2]]]", "D7 J2 R": "(set: $miss to 0)## ✅ Job done\n**Lock the screen when you step away.** A locked computer won't accept typing, so paws can't add or delete anything. For today's mess, Ctrl + Z can undo the cat's work. Turning off autosave would only risk losing *Priya's* work.\n\n[[Next customer->D7 J3]]", "D7 J3": "**Marcus** hears crunching under his desk. His new puppy, Pepper, has been chewing his laptop charger cable. The cable is still plugged into the wall, and he can see little copper wires poking out.\n\n**What should happen first?**\n\n* [[Wrap the chewed part in electrical tape and keep using it->D7 J3 W]]\n* [[Leave it plugged in, but lift it onto the desk out of reach->D7 J3 W]]\n* [[Spray it with bitter anti-chew spray so Pepper stops->D7 J3 W]]\n* [[A grown-up unplugs it at the wall; then replace it->D7 J3 R]]", "D7 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Exposed wires can shock a person *or* a puppy. **A grown-up unplugs it at the wall**, without touching the chewed part, and the cable gets **replaced**. Tape is not a repair.\"\n\n[[Got it->D7 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about a cable with wires showing? And who does the unplugging?\"\n\n[[Try again->D7 J3]]]", "D7 J3 R": "(set: $miss to 0)## ✅ Job done\n**Unplug it safely, then replace it.** Exposed wires can shock or burn, and tape doesn't make a damaged cable safe. Bitter spray and cord protectors are good *prevention* for the new cable, and keep an eye on Pepper's mouth for any burns.\n\n[[Next customer->D7 J4]]", "D7 J4": "**Grandpa Leo** is back. \"My laptop sounds like a hair dryer, and it's slow as molasses.\" It lives on the couch next to Biscuit, his golden retriever. You shine a flashlight into the vents. They're packed with golden fur.\n\n**What's the best plan?**\n\n* [[Clean the vents; keep it on a hard surface away from fur->D7 J4 R]]\n* [[Replace the fan, since it's clearly worn out from overuse->D7 J4 W]]\n* [[Run it only on battery power so the fan spins slower->D7 J4 W]]\n* [[Turn the screen brightness down so the laptop runs cooler->D7 J4 W]]", "D7 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That fur mat is **blocking the vents**. The laptop can't cool off, so the processor **throttles** and the fan screams. Clean the vents with the laptop off and unplugged, then move it to a hard surface away from Biscuit's napping spot.\"\n\n[[Got it->D7 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about what that fur is doing to the airflow, and what the processor does when it gets hot.\"\n\n[[Try again->D7 J4]]]", "D7 J4 R": "(set: $miss to 0)## ✅ Job done\n**Clean the vents and keep it off furry, soft spots.** Fur blocks airflow, so the laptop overheats and slows itself down (thermal throttling). The fan is probably fine; it's just working overtime. Sorry, Biscuit.\n\n[[The Inspector has something to show you->D7 L5]]", "D7 L5": "## 📘 The Inspector's lesson: The Drink Zone and Sticky Fingers\n\n*The Inspector sets a mug down on the far side of the bench, nowhere near the laptop.* \"Notice where that went.\"\n\n### The drink zone\n* Most spills aren't dropped drinks. They're **knocked** drinks: an elbow, a sleeve, a hand reaching for the mouse.\n* The **knock zone** is the area right beside and in front of your keyboard and mouse, where your arms swing while you work.\n* Best: keep drinks on a **separate surface**, like a side table or shelf. Next best: on the desk but **outside the knock zone**, behind the screen or well off to the side.\n* Use a cup with a **lid**. A lidded travel mug or water bottle turns a disaster into a shrug.\n\n### Food\n* **Eat away from the keyboard.** Crumbs fall between keys and jam them, and greasy fingers leave a film on keys and screens.\n\n### Sticky little hands\n* Young kids love screens. They also have fingers that have recently been in jam, mud, or a nose.\n* **Wash hands first**, every time. **Supervise**: a grown-up or older sibling sits with them. A **kid-safe case** (a thick, rubbery case with a handle) protects a tablet from drops.\n\n### Lock it when you leave\n* Siblings are curious. An unlocked computer can send a \"funny\" message to your teacher. **Windows key + L** (or Control + Command + Q on a Mac) works on brothers, too.\n\n\n[[Got it. Send in the next customer->D7 J6]]", "D7 J6": "**Ms. Rivera** keeps her coffee mug right next to her mouse so it's easy to reach. This morning she reached for the mouse, her elbow clipped the mug, and coffee flooded across the desk toward her laptop.\n\n**Which setup would have prevented this?**\n\n* [[A heavier ceramic mug that's harder to tip over->D7 J6 W]]\n* [[A coaster under the mug, right beside the mouse->D7 J6 W]]\n* [[A lidded mug, kept out of the knock zone or off the desk->D7 J6 R]]\n* [[Moving the mug to the other side, right next to the keyboard->D7 J6 W]]", "D7 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Her mug was sitting in the **knock zone**, right where her arm swings. Put drinks on a separate surface or well out of reach of your elbows, and use a **lid**.\"\n\n[[Got it->D7 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where do arms swing while you work? And what keeps liquid *inside* a cup?\"\n\n[[Try again->D7 J6]]]", "D7 J6 R": "(set: $miss to 0)## ✅ Job done\n**Lidded cup, out of the knock zone.** Most spills are knocked over, not dropped. A coaster protects the desk, not the laptop. If it happens, Unit 1's spill plan kicks in: power off, unplug, and tip the liquid out.\n\n[[Next customer->D7 J7]]", "D7 J7": "**Tasha's** little brother Remy is three. He wants to play his counting game on the family tablet. He's just finished a jam sandwich, and he's already reaching for the screen with both hands.\n\n**What's the best plan?**\n\n* [[Hand it over now, then wipe the screen with a wet wipe after->D7 J7 W]]\n* [[Let him play alone in his high chair so it can't fall->D7 J7 W]]\n* [[Wash his hands first, sit with him, and use a kid-safe case->D7 J7 R]]\n* [[Slide the tablet into a zip-top bag so jam can't reach it->D7 J7 W]]", "D7 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Wash hands first**, then **supervise**, and keep it in a **kid-safe case**. Jam gets into the charging port and the edges of the screen, and three-year-olds drop things.\"\n\n[[Got it->D7 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Three things for little hands. What comes *first*, who sits with him, and what goes around the tablet?\"\n\n[[Try again->D7 J7]]]", "D7 J7 R": "(set: $miss to 0)## ✅ Job done\n**Clean hands, a grown-up nearby, and a sturdy case.** Washing first stops sticky stuff from getting into ports and seams. Supervision catches the drops, and a kid-safe case survives the ones you don't catch.\n\n[[The Inspector has something to show you->D7 L8]]", "D7 L8": "## 📘 The Inspector's lesson: Location, Location, Location\n\n*The Inspector unrolls a floor plan of a house and starts circling things in red.* \"Where a computer lives matters as much as how you treat it.\"\n\n### Keep it away from\n* **Heaters and radiators:** they bake the machine from the outside, so it can't cool itself. Most laptops are designed to run in rooms from about **50° to 95° F (10° to 35° C)**. Right next to a heater, it can get much hotter than the room.\n* **Sunny windowsills:** direct sun heats a dark case fast, and heat wears out batteries.\n* **Steamy bathrooms:** steam is water vapor. When it hits cooler metal and circuit boards, it **condenses** (turns back into liquid water), right on the electronics.\n* **Kitchens:** steam from cooking, plus tiny drops of **grease** in the air that settle on vents and keys and trap dust.\n\n### Stable ground\n* Use a **sturdy, flat surface**, not a wobbly shelf, a stack of books, or the edge of a table. Keep the device away from edges, and **never above water** like a fish tank or a sink.\n\n### Cables\n* A cable stretched across a walkway is a **trip hazard**. Someone gets hurt, and the laptop gets yanked off the table.\n* Run cables **along the wall** or behind furniture, or charge where the cord doesn't cross a path. **Don't hide cords under rugs**: they can't release heat there, and stepping on them damages the wires.\n\n### Static in winter\n* Dry winter air plus carpet plus socks equals **static electricity**. That zap can hurt sensitive electronics.\n* **Touch something metal first** (like a metal lamp base or a doorknob) to discharge yourself before you touch ports, cards, or the inside of anything.\n\n\n[[Got it. Send in the next customer->D7 J9]]", "D7 J9": "**Nora** moved her laptop to a cozy spot on the windowsill, right next to the radiator. Now it's hot on the bottom, the fan never stops, and her video calls keep freezing.\n\n**What's the best fix?**\n\n* [[Move it to a cooler spot, away from the radiator->D7 J9 R]]\n* [[Prop up the back so more air gets under the laptop->D7 J9 W]]\n* [[Turn the radiator down to its lowest setting->D7 J9 W]]\n* [[Close extra browser tabs so it does less work->D7 J9 W]]", "D7 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The radiator is **heating the laptop from the outside**, so it can't cool down. It throttles, and calls stutter. **Move it away from the heat.** Out of the sun, too.\"\n\n[[Got it->D7 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say heaters do to a machine that's trying to cool itself?\"\n\n[[Try again->D7 J9]]]", "D7 J9 R": "(set: $miss to 0)## ✅ Job done\n**Move it away from the heat source.** A laptop cools itself by pushing out hot air, which doesn't work when the air around it is already hot. It throttles to protect itself. Propping it up helps a little, but the radiator is still right there.\n\n[[Next customer->D7 J10]]", "D7 J10": "**Dev** set up his gaming desktop on a narrow shelf, and the shelf wobbles a little when he types. Right below the shelf is his 20-gallon fish tank. \"Saves space,\" he says proudly.\n\n**What should Dev do?**\n\n* [[Add a rubber mat under the tower so it stops sliding->D7 J10 W]]\n* [[Put a lid on the fish tank and keep the setup as is->D7 J10 W]]\n* [[Push the tower all the way to the very back of the shelf->D7 J10 W]]\n* [[Move the computer to a sturdy desk, away from the tank->D7 J10 R]]", "D7 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A wobbly shelf plus water underneath is two hazards stacked up. **Move it to a sturdy surface, away from the water.** A lid only solves half the problem.\"\n\n[[Got it->D7 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two hazards in one picture. Which fix handles both?\"\n\n[[Try again->D7 J10]]]", "D7 J10 R": "(set: $miss to 0)## ✅ Job done\n**Sturdy surface, no water nearby.** A wobbly shelf can tip a heavy tower, and anything that falls into a fish tank is a disaster for the computer *and* the fish. Fixes that leave it over the tank only shrink the risk.\n\n[[Next customer->D7 J11]]", "D7 J11": "**Ava** props her laptop on the bathroom counter to watch videos during her long, hot showers. Lately the keys feel tacky, and the trackpad has gone glitchy.\n\n**What's going on, and what should she do?**\n\n* [[Steam condenses inside; keep the laptop out of there->D7 J11 R]]\n* [[The heat softened the keys; let them cool off first->D7 J11 W]]\n* [[The trackpad needs a driver update to work again->D7 J11 W]]\n* [[Fog is collecting on the screen; wipe it after each shower->D7 J11 W]]", "D7 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Steam **condenses** into water on cooler surfaces, and that includes the circuit boards *inside* her laptop. Over time that means corrosion. **Keep laptops out of steamy bathrooms.**\"\n\n[[Got it->D7 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What happens to steam when it touches something cooler?\"\n\n[[Try again->D7 J11]]]", "D7 J11 R": "(set: $miss to 0)## ✅ Job done\n**Steam turns back into water inside the laptop.** Moisture on circuits causes corrosion and glitches like a jumpy trackpad. Wiping the screen does nothing for the inside. A speaker outside the door works great for shower concerts.\n\n[[Next customer->D7 J12]]", "D7 J12": "**Jayden** charges his laptop on the hall table. The cord stretches across the hallway to the only outlet. Last night his mom tripped on it in the dark, and the laptop nearly flew off the table.\n\n**What's the best fix?**\n\n* [[Hide the cord under the hallway rug so nobody sees it->D7 J12 W]]\n* [[Get a longer cable so it can lie loose across the floor->D7 J12 W]]\n* [[Charge somewhere the cord can run along the wall->D7 J12 R]]\n* [[Only charge it in the daytime, when the lights are on->D7 J12 W]]", "D7 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Cables don't belong across walkways. **Charge where the cord runs along the wall** or behind furniture. And never under a rug: cords can overheat there, and feet wear out the wires.\"\n\n[[Got it->D7 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where did I say cables should run? And what did I say about rugs?\"\n\n[[Try again->D7 J12]]]", "D7 J12 R": "(set: $miss to 0)(if: $days does not contain \"7\")[(set: $days to it + (a: \"7\"))]## ✅ Job done\n**Keep cords out of walkways.** A trip hurts the person and yanks the laptop to the floor. Rugs hide the hazard but trap heat and hide damage, so cords can overheat. A different outlet or a properly routed cord fixes it for good.\n\n[[Close up shop->D7 Done]]", "D7 Done": "(if: $days does not contain \"7\")[(set: $days to it + (a: \"7\"))]# Day 7 complete!\n\n<div class=\"tool\">🐾 **New tool earned: Hazard Map**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Make a **hazard map** of where you use your computer. Draw the room from above: the desk or table, the computer, outlets, windows, and doors. Then mark every hazard you find: **drinks** (and your knock zone), **pets** and where they nap, **heat sources** (heaters, radiators, sunny windows), **edges** the computer is close to, and **cables** that cross a walkway. Pick **one hazard and fix it**. If your fix means moving plugs, cords, or a power strip, do it with a grown-up. Add a before-and-after note to your map.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Fur, Paws, and Teeth\n### Fur in the vents\n* Pet hair floats around the house and gets **pulled into vents** by the fan. It forms a felt-like mat that blocks airflow, so the machine runs hot and the fan roars.\n* When a processor gets too hot, it uses **thermal throttling** (the processor slowing itself down to cool off). That's why a furry laptop feels sluggish.\n* Keep laptops on a hard surface, not on the dog's blanket or the cat's favorite pillow. Clean the vents with short bursts of compressed air and a soft brush, with the computer **off and unplugged**.\n\n### Cats on keyboards\n* Cats love warm keyboards. One stroll across the keys can type gibberish, delete a paragraph, or press a shortcut you've never heard of.\n* The fix is a habit: **lock the screen every time you walk away.** On Windows, press **Windows key + L**. On a Mac, press **Control + Command + Q**. The cat can walk all it wants, and nothing gets typed.\n* If the damage is already done, **Ctrl + Z** (Command + Z on a Mac) undoes recent typing in most programs.\n\n### Chewed cables\n* Puppies, kittens, and rabbits chew cords. A chewed cord can **shock** the pet, burn its mouth, or start a fire.\n* Prevention: **cord protectors** (plastic tubes that cover the cable), keeping cables up and **out of reach**, and **unplug
