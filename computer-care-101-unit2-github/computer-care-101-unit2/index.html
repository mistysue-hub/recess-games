const STORY={"start": "Start", "startup": ["Init"], "header": ["Shift Bar"], "passages": {"Init": "(set: $days to (a:))(set: $miss to 0)(set: $mx to (a:))(set: $m1 to (a:))(set: $m2 to (a:))(set: $m3 to (a:))(set: $m4 to (a:))(set: $m5 to (a:))(set: $m6 to (a:))(set: $m7 to (a:))(set: $m8 to (a:))", "Shift Bar": "<div class=\"casebar\">🛠️ Workdays done: (print: $days's length) / 8 · [[Work schedule->Shop]] · [[Toolbox->Toolbox]]</div>", "Start": "# Keycap & Co.\n## Computer Care 101 Sr · Keep It Healthy\n\n<div class=\"scene\">🔔 🏷️ 🛠️</div>\n\n*The Inspector slides you a new name tag. It says* **TECHNICIAN.**\n\n\"In Jr you learned to name things and clean them. Now you learn *why* computers get sick, and how to stop it. Eight days. Trickier customers. Miss twice and I'll show you.\"\n\n\"The Quick-Fix Kiosk across the street is still open. Still wrong. Half our customers have already tried their advice.\"\n\n<div class=\"warn\">**Shop rule:** Liquids, batteries, wall power, opening a case, or someone else's device? Get a grown-up's OK first.</div>\n\n[[Clock in->Shop]]", "Shop": "# 📋 Work Schedule\n*Computer Care 101 Sr: Keep It Healthy.* One workday at a time: each day opens on its own day.\n\n(if: $days contains \"1\")[✅ ](else:)[📋 ][[Day 1: Back at the Bench->D1 Start]]\n(if: $days contains \"2\")[(if: $days contains \"2\")[✅ ](else:)[📋 ][[Day 2: Screens, Cases & Hinges->D2 Start]]](else:)[(if: $open >= 2)[(if: $days contains \"2\")[✅ ](else:)[📋 ][[Day 2: Screens, Cases & Hinges->D2 Start]]](else:)[🔒 Day 2: Screens, Cases & Hinges (opens on its own day)]]\n(if: $days contains \"3\")[(if: $days contains \"3\")[✅ ](else:)[📋 ][[Day 3: Airflow & Heat->D3 Start]]](else:)[(if: $open >= 3)[(if: $days contains \"3\")[✅ ](else:)[📋 ][[Day 3: Airflow & Heat->D3 Start]]](else:)[🔒 Day 3: Airflow & Heat (opens on its own day)]]\n(if: $days contains \"4\")[(if: $days contains \"4\")[✅ ](else:)[📋 ][[Day 4: Cords, Cables & Power->D4 Start]]](else:)[(if: $open >= 4)[(if: $days contains \"4\")[✅ ](else:)[📋 ][[Day 4: Cords, Cables & Power->D4 Start]]](else:)[🔒 Day 4: Cords, Cables & Power (opens on its own day)]]\n(if: $days contains \"5\")[(if: $days contains \"5\")[✅ ](else:)[📋 ][[Day 5: Batteries & Charging->D5 Start]]](else:)[(if: $open >= 5)[(if: $days contains \"5\")[✅ ](else:)[📋 ][[Day 5: Batteries & Charging->D5 Start]]](else:)[🔒 Day 5: Batteries & Charging (opens on its own day)]]\n(if: $days contains \"6\")[(if: $days contains \"6\")[✅ ](else:)[📋 ][[Day 6: Other Everyday Gear->D6 Start]]](else:)[(if: $open >= 6)[(if: $days contains \"6\")[✅ ](else:)[📋 ][[Day 6: Other Everyday Gear->D6 Start]]](else:)[🔒 Day 6: Other Everyday Gear (opens on its own day)]]\n(if: $days contains \"7\")[(if: $days contains \"7\")[✅ ](else:)[📋 ][[Day 7: Household Hazards->D7 Start]]](else:)[(if: $open >= 7)[(if: $days contains \"7\")[✅ ](else:)[📋 ][[Day 7: Household Hazards->D7 Start]]](else:)[🔒 Day 7: Household Hazards (opens on its own day)]]\n(if: $days contains \"8\")[(if: $days contains \"8\")[✅ ](else:)[📋 ][[Day 8: On the Move->D8 Start]]](else:)[(if: $open >= 8)[(if: $days contains \"8\")[✅ ](else:)[📋 ][[Day 8: On the Move->D8 Start]]](else:)[🔒 Day 8: On the Move (opens on its own day)]]\n\n---\n(if: $open >= 99)[🎓 [[The Inspector's Final Exam->Exam Start]]](else:)[🔒 The Inspector's Final Exam: *opens on its own day, after all 8 workdays*]", "Toolbox": "# 🧰 Your Toolbox\nEach day you finish earns a tool.\n\n(if: $days contains \"1\")[📒 **Tech Notebook**: Day 1, Back at the Bench](else:)[▫️ *Earned on Day 1*]\n(if: $days contains \"2\")[🖥️ **Screen Kit**: Day 2, Screens, Cases & Hinges](else:)[▫️ *Earned on Day 2*]\n(if: $days contains \"3\")[🌡️ **Heat Detector**: Day 3, Airflow & Heat](else:)[▫️ *Earned on Day 3*]\n(if: $days contains \"4\")[🔌 **Cable Kit**: Day 4, Cords, Cables & Power](else:)[▫️ *Earned on Day 4*]\n(if: $days contains \"5\")[🔋 **Battery Tester**: Day 5, Batteries & Charging](else:)[▫️ *Earned on Day 5*]\n(if: $days contains \"6\")[🎧 **Gear Bag**: Day 6, Other Everyday Gear](else:)[▫️ *Earned on Day 6*]\n(if: $days contains \"7\")[🐾 **Hazard Map**: Day 7, Household Hazards](else:)[▫️ *Earned on Day 7*]\n(if: $days contains \"8\")[🎒 **Travel Case**: Day 8, On the Move](else:)[▫️ *Earned on Day 8*]\n\n[[Back to the work schedule->Shop]]", "D1 Start": "(set: $miss to 0)(set: $m1 to (a:))# Day 1: Back at the Bench\n\n<div class=\"scene\">🏅 📒 🛠️</div>\n\n*The Inspector hands you a badge: **TECHNICIAN**.* \"You earned it. Now you learn *why* things work. Quick warm-up first, then the five enemies. Grab a notebook.\"\n\n*A hand-lettered sign hangs by the door:* **DAYS SINCE LAST PREVENTABLE DISASTER: 0.** *The Inspector follows your eyes.* \"A customer just left. Don't ask.\"\n\n\n[[Open the shop->D1 L1]]", "D1 L1": "## 📘 The Inspector's lesson: Jr in Five Minutes\n\n*The Inspector talks fast.* \"Look, don't read.\"\n\n**Device types:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Laptop\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"53\" width=\"20\" height=\"4\" rx=\"1\" fill=\"#5a636c\"/></svg><b>Laptop</b>folds shut, all in one case</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Desktop\"><rect x=\"4\" y=\"8\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"8\" y=\"12\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"28\" y=\"46\" width=\"8\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"18\" y=\"56\" width=\"28\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/><rect x=\"70\" y=\"10\" width=\"24\" height=\"52\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><circle cx=\"82\" cy=\"20\" r=\"3\" fill=\"#6fe3b5\"/><line x1=\"75\" y1=\"32\" x2=\"89\" y2=\"32\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"75\" y1=\"38\" x2=\"89\" y2=\"38\" stroke=\"#ffb347\" stroke-width=\"2\"/></svg><b>Desktop</b>the tower is the computer</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"All-in-one\"><rect x=\"14\" y=\"4\" width=\"72\" height=\"46\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"4\"/><rect x=\"19\" y=\"9\" width=\"62\" height=\"36\" fill=\"#2f4a5c\"/><polygon points=\"44,50 56,50 60,62 40,62\" fill=\"#9aa4ae\"/><rect x=\"34\" y=\"62\" width=\"32\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/></svg><b>All-in-one</b>computer inside the screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Chromebook\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"7\" fill=\"#7fd1ff\"/><rect x=\"29\" y=\"12\" width=\"14\" height=\"5\" rx=\"1\" fill=\"#e9ecef\"/><circle cx=\"44\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><circle cx=\"51\" cy=\"27\" r=\"7\" fill=\"#e9ecef\"/><circle cx=\"58\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><rect x=\"44\" y=\"30\" width=\"14\" height=\"5\" fill=\"#e9ecef\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/></svg><b>Chromebook</b>apps in the browser, files online</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Tablet\"><rect x=\"28\" y=\"4\" width=\"44\" height=\"62\" rx=\"6\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"33\" y=\"10\" width=\"34\" height=\"50\" fill=\"#2f4a5c\"/><circle cx=\"50\" cy=\"63\" r=\"1.6\" fill=\"#9aa4ae\"/></svg><b>Tablet</b>one flat touch screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Phone\"><rect x=\"38\" y=\"6\" width=\"26\" height=\"58\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"42\" y=\"13\" width=\"18\" height=\"44\" fill=\"#2f4a5c\"/><rect x=\"46\" y=\"9\" width=\"10\" height=\"2\" rx=\"1\" fill=\"#9aa4ae\"/></svg><b>Phone</b>a pocket computer</div></div>\n\n**Ports:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"USB-A\"><rect x=\"20\" y=\"24\" width=\"60\" height=\"22\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"29\" width=\"48\" height=\"7\" fill=\"#7fd1ff\"/></svg><b>USB-A</b>flat, one way up</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"USB-C\"><rect x=\"26\" y=\"25\" width=\"48\" height=\"20\" rx=\"10\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"36\" y=\"33\" width=\"28\" height=\"4\" rx=\"2\" fill=\"#7fd1ff\"/><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"6\" stroke=\"#6fe3b5\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"50,6 53.8,13.0 46.2,13.0\" fill=\"#6fe3b5\"/><line x1=\"50\" y1=\"48\" x2=\"50\" y2=\"64\" stroke=\"#6fe3b5\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"50,64 46.2,57.0 53.8,57.0\" fill=\"#6fe3b5\"/></svg><b>USB-C</b>small oval, either way</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"HDMI\"><polygon points=\"16,22 84,22 84,36 72,48 28,48 16,36\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"28\" y=\"29\" width=\"44\" height=\"6\" fill=\"#7fd1ff\"/><circle cx=\"22\" cy=\"44\" r=\"5\" fill=\"#ffb347\"/><circle cx=\"78\" cy=\"44\" r=\"5\" fill=\"#ffb347\"/></svg><b>HDMI</b>2 slanted corners</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"DisplayPort\"><polygon points=\"16,22 84,22 84,48 28,48 16,36\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"28\" y=\"29\" width=\"44\" height=\"6\" fill=\"#7fd1ff\"/><circle cx=\"20\" cy=\"44\" r=\"5\" fill=\"#ffb347\"/></svg><b>DisplayPort</b>1 slanted corner</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Ethernet\"><rect x=\"30\" y=\"12\" width=\"40\" height=\"38\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"42\" y=\"50\" width=\"16\" height=\"8\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"35\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"39\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"43\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"47\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"51\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"55\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"59\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"63\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/></svg><b>Ethernet</b>square, wired internet</div></div>\n<div class=\"cap\">Only USB-C ports? Old USB-A gear needs an <b>adapter</b> or <b>hub</b>. Plugs go in straight and gently.</div>\n\n**Quick-fire rules from Jr:**\n\n**Off and unplug first.** On an all-in-one, the computer is the screen, so pull its own cord.\n\n**Liquid goes on the cloth,** never on the device.\n\n**Laptop keys stay on.** Their tiny clips snap.\n\n**Compressed air:** short bursts, can upright. Apple OKs it for MacBook keyboards, says no for iPhones, so check your maker.\n\n[[Got it. Send in the next customer->D1 J2]]", "D1 J2": "<div class=\"scene\">💻 🥤 ⌨️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"The J key sticks. The rest of the laptop works fine.\"><rect x=\"78\" y=\"14\" width=\"56\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"144\" y=\"14\" width=\"56\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"210\" y=\"14\" width=\"56\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"78\" y=\"64\" width=\"56\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"144\" y=\"64\" width=\"56\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"210\" y=\"64\" width=\"56\" height=\"44\" rx=\"6\" fill=\"#2a2f36\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"144\" y=\"14\" width=\"56\" height=\"44\" rx=\"6\" fill=\"none\" stroke=\"#e0a050\" stroke-width=\"3\"/><path d=\"M148 28 q10 -8 22 -3 q14 6 24 -1 v14 q-10 8 -22 3 q-12 -5 -24 3 z\" fill=\"#b5651d\" opacity=\"0.55\"/><circle cx=\"156\" cy=\"55\" r=\"3\" fill=\"#b5651d\"/><circle cx=\"188\" cy=\"57\" r=\"2.4\" fill=\"#b5651d\"/><text x=\"106\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"20\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">H</text><text x=\"172\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"20\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">J</text><text x=\"238\" y=\"42\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"20\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">K</text><text x=\"106\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"20\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">B</text><text x=\"172\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"20\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">N</text><text x=\"238\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"20\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">M</text><text x=\"180\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Jayden's laptop keys (dried soda on J)</text></svg><div class=\"cap\">The J key sticks. The rest of the laptop works fine.</div></div>\n\n**Jayden** spilled soda on his laptop. It works, but the J key sticks.\n\n**What's the best plan for the sticky J?**\n\n* [[Pop the J key off and scrub under it->D1 J2 W1]]\n* [[Put it in rice overnight to dry it out->D1 J2 W2]]\n* [[Leave the key on and book a pro clean->D1 J2 R]]\n* [[Rinse the keys with a little distilled water->D1 J2 W4]]", "D1 J2 W1": "(set: $m1 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Soda dries into **sticky glue**. Rinsing spreads it under the key, and prying a laptop key snaps its clips. Leave it on and get a **pro clean**.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Think about what dried soda is made of, and what water does to it.\n\n[[Try again->D1 J2]]]", "D1 J2 W2": "(set: $m1 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Rice dries nothing and leaves starch dust in the keys.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Soda dries into **sticky glue**. Rinsing spreads it under the key, and prying a laptop key snaps its clips. Leave it on and get a **pro clean**.\"\n\n[[Got it->D1 J2 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Rice dries nothing and leaves starch dust in the keys.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* Think about what dried soda is made of, and what water does to it.\n\n[[Try again->D1 J2]]]", "D1 J2 W4": "(set: $m1 to it + (a: \"Jayden\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Soda dries into **sticky glue**. Rinsing spreads it under the key, and prying a laptop key snaps its clips. Leave it on and get a **pro clean**.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Think about what dried soda is made of, and what water does to it.\n\n[[Try again->D1 J2]]]", "D1 J2 R": "(set: $miss to 0)## ✅ Job done\n**Leave the key on, book a pro clean.** Same rule on a MacBook or a Chromebook.\n\n[[Next customer->D1 J3]]", "D1 J3": "<div class=\"scene\">🖱️ 🪟 😵</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Look at what the mouse sits on.\"><rect x=\"14\" y=\"78\" width=\"332\" height=\"10\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.3\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"40\" y1=\"86\" x2=\"48\" y2=\"80\" stroke=\"#e9ecef\" stroke-width=\"1.5\" opacity=\"0.7\"/><line x1=\"52\" y1=\"86\" x2=\"60\" y2=\"80\" stroke=\"#e9ecef\" stroke-width=\"1.5\" opacity=\"0.7\"/><line x1=\"270\" y1=\"86\" x2=\"278\" y2=\"80\" stroke=\"#e9ecef\" stroke-width=\"1.5\" opacity=\"0.7\"/><line x1=\"282\" y1=\"86\" x2=\"290\" y2=\"80\" stroke=\"#e9ecef\" stroke-width=\"1.5\" opacity=\"0.7\"/><line x1=\"34\" y1=\"88\" x2=\"34\" y2=\"116\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"326\" y1=\"88\" x2=\"326\" y2=\"116\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><path d=\"M112 77 Q 116 38 168 36 Q 222 38 230 77 Z\" fill=\"#2a2f36\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"164\" y=\"73\" width=\"10\" height=\"4\" fill=\"#ff6b6b\"/><line x1=\"169\" y1=\"80\" x2=\"150\" y2=\"106\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"4 4\" opacity=\"0.8\"/><line x1=\"169\" y1=\"80\" x2=\"169\" y2=\"106\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"4 4\" opacity=\"0.8\"/><line x1=\"169\" y1=\"80\" x2=\"188\" y2=\"106\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"4 4\" opacity=\"0.8\"/><polyline points=\"262,52 278,22 290,58 304,18 318,48\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"318,48 318,66 323,61 327,70 330,68 326,60 333,60\" fill=\"#e9ecef\"/><text x=\"170\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Dev's mouse</text><text x=\"255\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"normal\">the glass desk top</text><text x=\"180\" y=\"127\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">the light under the mouse, side view</text></svg><div class=\"cap\">Look at what the mouse sits on.</div></div>\n\n**Dev** just got a glass desk. Now his mouse cursor jumps around. He already cleaned the sensor with a dry swab. Still jumpy.\n\n**What's the fix?**\n\n* [[Clean the lens again, smudges blur its view->D1 J3 W1]]\n* [[Raise the DPI so it sees the glass edge->D1 J3 W2]]\n* [[Try another USB port, a loose one jumps->D1 J3 W3]]\n* [[Add a mouse pad, the sensor needs texture->D1 J3 R]]", "D1 J3 W1": "(set: $m1 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor tracks tiny bumps in the desk. Glass is smooth and see-through, so it has nothing to follow. A **mouse pad** gives it texture.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* The sensor reads tiny bumps in the surface under it. What does smooth glass have?\n\n[[Try again->D1 J3]]]", "D1 J3 W2": "(set: $m1 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor tracks tiny bumps in the desk. Glass is smooth and see-through, so it has nothing to follow. A **mouse pad** gives it texture.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* The sensor reads tiny bumps in the surface under it. What does smooth glass have?\n\n[[Try again->D1 J3]]]", "D1 J3 W3": "(set: $m1 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor tracks tiny bumps in the desk. Glass is smooth and see-through, so it has nothing to follow. A **mouse pad** gives it texture.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* The sensor reads tiny bumps in the surface under it. What does smooth glass have?\n\n[[Try again->D1 J3]]]", "D1 J3 R": "(set: $miss to 0)## ✅ Job done\n**A mouse pad gives the sensor texture to track.** Some pricey mice work on glass, so check the box.\n\n[[Next customer->D1 J4]]", "D1 J4": "<div class=\"scene\">⌨️ 🐕 🧹</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Crumbs and fur are packed between and under the tall keys.\"><rect x=\"16\" y=\"88\" width=\"328\" height=\"14\" rx=\"3\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"44\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"26,72 70,72 64,42 32,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"98\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"80,72 124,72 118,42 86,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"152\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"134,72 178,72 172,42 140,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"206\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"188,72 232,72 226,42 194,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"260\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"242,72 286,72 280,42 248,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"314\" y=\"72\" width=\"8\" height=\"16\" fill=\"#9aa4ae\"/><polygon points=\"296,72 340,72 334,42 302,42\" fill=\"#4a535d\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"74\" cy=\"84\" r=\"3\" fill=\"#c9a46b\"/><circle cx=\"78\" cy=\"78\" r=\"2.5\" fill=\"#c9a46b\"/><circle cx=\"126\" cy=\"85\" r=\"3.5\" fill=\"#c9a46b\"/><circle cx=\"182\" cy=\"84\" r=\"3\" fill=\"#c9a46b\"/><circle cx=\"186\" cy=\"78\" r=\"2\" fill=\"#c9a46b\"/><circle cx=\"236\" cy=\"85\" r=\"3\" fill=\"#c9a46b\"/><circle cx=\"290\" cy=\"83\" r=\"3.5\" fill=\"#c9a46b\"/><circle cx=\"44\" cy=\"84\" r=\"2.5\" fill=\"#c9a46b\"/><path d=\"M92 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M146 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M200 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M256 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M310 86 q6 -10 12 -4 t10 -8\" stroke=\"#b9a58a\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"180\" y=\"24\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">tall keys, side view</text><text x=\"180\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Grandpa Leo's keyboard, up close</text></svg><div class=\"cap\">Crumbs and fur are packed between and under the tall keys.</div></div>\n\n**Grandpa Leo's** mechanical keyboard is full of crumbs and dog fur. Biscuit naps on it. The Kiosk told Leo to grab the house vacuum.\n\n**Better plan?**\n\n* [[Run the vacuum on low, it's gentler->D1 J4 W1]]\n* [[Flip it over and shake the crumbs out->D1 J4 W2]]\n* [[Wipe the tops with a damp cloth and let it dry->D1 J4 W3]]\n* [[Photo first, puller for caps, then air->D1 J4 R]]", "D1 J4 W1": "(set: $m1 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">The vacuum eats three keycaps. Biscuit watches, unimpressed.</div>\n\n## Let me show you\n*The Inspector leans over.* \"A house vacuum can yank off keycaps, and its moving air builds **static** that zaps parts. Snap a photo of the layout, **pull the caps with a puller**, then use short bursts of air.\"\n\n[[Got it->D1 J4 R]]](else:)[<div class=\"oops\">The vacuum eats three keycaps. Biscuit watches, unimpressed.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* Which tool lifts the caps off safely, and what blows out what is underneath?\n\n[[Try again->D1 J4]]]", "D1 J4 W2": "(set: $m1 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A house vacuum can yank off keycaps, and its moving air builds **static** that zaps parts. Snap a photo of the layout, **pull the caps with a puller**, then use short bursts of air.\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which tool lifts the caps off safely, and what blows out what is underneath?\n\n[[Try again->D1 J4]]]", "D1 J4 W3": "(set: $m1 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A house vacuum can yank off keycaps, and its moving air builds **static** that zaps parts. Snap a photo of the layout, **pull the caps with a puller**, then use short bursts of air.\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which tool lifts the caps off safely, and what blows out what is underneath?\n\n[[Try again->D1 J4]]]", "D1 J4 R": "(set: $miss to 0)## ✅ Job done\n**Photo, puller, then air.** The Inspector sighs: \"Leo's.\"\n\n[[Next customer->D1 J5]]", "D1 J5": "<div class=\"scene\">👧 💻 🖥️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Count the slanted corners on the plug end.\"><path d=\"M8 112 C 60 112, 70 60, 118 60\" stroke=\"#5b6573\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"116\" y=\"47\" width=\"40\" height=\"26\" rx=\"4\" fill=\"#4a535d\"/><rect x=\"156\" y=\"51\" width=\"22\" height=\"18\" fill=\"#c9d1d9\"/><line x1=\"184\" y1=\"60\" x2=\"218\" y2=\"60\" stroke=\"#9aa4ae\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><path d=\"M224 30 H346 V78 H240 L224 62 Z\" fill=\"#c9d1d9\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"242\" y=\"42\" width=\"86\" height=\"12\" rx=\"2\" fill=\"#1b1f24\"/><text x=\"90\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the monitor's cable</text><text x=\"285\" y=\"102\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the plug end, up close</text></svg><div class=\"cap\">Count the slanted corners on the plug end.</div></div>\n\n**Nora's** neck hurts from looking down at her laptop. She borrowed a monitor. The cable has no label, so look at its plug.\n\n**Which port is that plug?**\n\n* [[HDMI, it has two slanted corners->D1 J5 W1]]\n* [[DisplayPort, it has one slanted corner->D1 J5 R]]\n* [[Ethernet, it carries a wired connection->D1 J5 W3]]\n* [[USB-A, it's flat and rectangular->D1 J5 W4]]", "D1 J5 W1": "(set: $m1 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Count the slanted corners. One means **DisplayPort**. Two means HDMI. A laptop with only USB-C ports needs an adapter to plug it in.\"\n\n[[Got it->D1 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Count the slanted corners on the plug, then compare the port cards.\n\n[[Try again->D1 J5]]]", "D1 J5 W3": "(set: $m1 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Count the slanted corners. One means **DisplayPort**. Two means HDMI. A laptop with only USB-C ports needs an adapter to plug it in.\"\n\n[[Got it->D1 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Count the slanted corners on the plug, then compare the port cards.\n\n[[Try again->D1 J5]]]", "D1 J5 W4": "(set: $m1 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Count the slanted corners. One means **DisplayPort**. Two means HDMI. A laptop with only USB-C ports needs an adapter to plug it in.\"\n\n[[Got it->D1 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Count the slanted corners on the plug, then compare the port cards.\n\n[[Try again->D1 J5]]]", "D1 J5 R": "(set: $miss to 0)## ✅ Job done\n**DisplayPort.** One slanted corner.\n\n[[Next customer->D1 J6]]", "D1 J6": "<div class=\"scene\">🖥️ 👀 🧍</div>\n\n**Nora's** monitor works now. She is setting it on her desk and can't decide how high it should sit.\n\n**Where should the top of the screen sit?**\n\n* [[Level with her chin, so reading feels relaxed->D1 J6 W1]]\n* [[A little above her head, so she sits up tall->D1 J6 W2]]\n* [[At or just below eye level, neck stays straight->D1 J6 R]]\n* [[Flat on the desk, since that's how most laptops sit->D1 J6 W4]]", "D1 J6 W1": "(set: $m1 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Put the top of the screen **at or just below eye level**, about an arm's length away. Looking down bends your neck like a long phone slouch, and the strain adds up all day.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which way does your neck bend when you look down at a phone?\n\n[[Try again->D1 J6]]]", "D1 J6 W2": "(set: $m1 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Put the top of the screen **at or just below eye level**, about an arm's length away. Looking down bends your neck like a long phone slouch, and the strain adds up all day.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which way does your neck bend when you look down at a phone?\n\n[[Try again->D1 J6]]]", "D1 J6 W4": "(set: $m1 to it + (a: \"Nora\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Put the top of the screen **at or just below eye level**, about an arm's length away. Looking down bends your neck like a long phone slouch, and the strain adds up all day.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which way does your neck bend when you look down at a phone?\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**Top of the screen at or just below eye level.** On a laptop alone, add a stand plus a separate keyboard.\n\n[[The Inspector has something to show you->D1 L7]]", "D1 L7": "## 📘 The Inspector's lesson: Why Computers Get Sick\n\n\"Almost every sick machine I see was hurt by one of **five enemies**.\"\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 290\" role=\"img\" aria-label=\"Jr kept machines <b>clean</b>. Sr keeps them <b>healthy</b>.\"><defs><linearGradient id=\"u2d1scr\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3a4552\"/><stop offset=\"1\" stop-color=\"#1b1f24\"/></linearGradient></defs><rect x=\"162\" y=\"118\" width=\"76\" height=\"52\" rx=\"5\" fill=\"url(#u2d1scr)\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"194\" y=\"170\" width=\"12\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"180\" y=\"180\" width=\"40\" height=\"5\" rx=\"2\" fill=\"#9aa4ae\"/><circle cx=\"188\" cy=\"138\" r=\"3\" fill=\"#e9ecef\"/><circle cx=\"212\" cy=\"138\" r=\"3\" fill=\"#e9ecef\"/><path d=\"M188 156 q12 -9 24 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/><rect x=\"196\" y=\"6\" width=\"8\" height=\"28\" rx=\"4\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"198\" y=\"18\" width=\"4\" height=\"16\" fill=\"#ff6b6b\"/><circle cx=\"200\" cy=\"38\" r=\"7\" fill=\"#ff6b6b\"/><path d=\"M210 12 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M210 19 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"200\" y=\"66\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">1. Heat</text><text x=\"200\" y=\"84\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">slows, then shuts off</text><circle cx=\"316\" cy=\"108\" r=\"9\" fill=\"#8f979f\"/><circle cx=\"330\" cy=\"100\" r=\"11\" fill=\"#8f979f\"/><circle cx=\"344\" cy=\"108\" r=\"9\" fill=\"#8f979f\"/><circle cx=\"324\" cy=\"114\" r=\"8\" fill=\"#8f979f\"/><circle cx=\"338\" cy=\"115\" r=\"8\" fill=\"#8f979f\"/><circle cx=\"352\" cy=\"98\" r=\"4\" fill=\"#8f979f\"/><circle cx=\"308\" cy=\"98\" r=\"3\" fill=\"#8f979f\"/><text x=\"330\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#c3cad1\" text-anchor=\"middle\" font-weight=\"bold\">2. Dust</text><text x=\"330\" y=\"162\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">traps the heat</text><polygon points=\"322,192 306,215 317,215 313,232 330,208 319,208\" fill=\"#ffb347\"/><text x=\"318\" y=\"252\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Power</text><text x=\"318\" y=\"270\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">spikes fry parts</text><path d=\"M82 192 C86 202 96 212 96 220 A14 14 0 0 1 68 220 C68 212 78 202 82 192 Z\" fill=\"#7fd1ff\"/><text x=\"82\" y=\"252\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">4. Moisture</text><text x=\"82\" y=\"270\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">shorts and crust</text><rect x=\"52\" y=\"89\" width=\"36\" height=\"28\" rx=\"3\" fill=\"#2a2f36\" stroke=\"#e9ecef\" stroke-width=\"2\"/><path d=\"M58 89 l6 9 l-4 6 l10 5 l-2 8 M68 104 l12 -6 l6 -9\" stroke=\"#ff6b6b\" stroke-width=\"2\" fill=\"none\"/><text x=\"70\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">5. Bumps</text><text x=\"70\" y=\"162\" font-family=\"Segoe UI,Inter,sans-ser won't work.\n\n**Which enemy did this?**\n\n* [[Heat, the basement furnace baked the metal green->D1 J10 W1]]\n* [[Moisture, damp air slowly corroded the metal->D1 J10 R]]\n* [[Dust, years of it piled up and turned green->D1 J10 W3]]\n* [[Power, a leftover charge ate the metal->D1 J10 W4]]", "D1 J10 W1": "(set: $m1 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Moisture.** Damp air **corrodes** metal. It turns crusty and stops connecting.\"\n\n[[Got it->D1 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which clue card mentions green crust, and what causes it?\n\n[[Try again->D1 J10]]]", "D1 J10 W3": "(set: $m1 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Moisture.** Damp air **corrodes** metal. It turns crusty and stops connecting.\"\n\n[[Got it->D1 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which clue card mentions green crust, and what causes it?\n\n[[Try again->D1 J10]]]", "D1 J10 W4": "(set: $m1 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Moisture.** Damp air **corrodes** metal. It turns crusty and stops connecting.\"\n\n[[Got it->D1 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Which clue card mentions green crust, and what causes it?\n\n[[Try again->D1 J10]]]", "D1 J10 R": "(set: $miss to 0)## ✅ Job done\n**Moisture.** Corrosion. Don't plug anything into that port, and store electronics somewhere dry.\n\n[[Next customer->D1 S1]]", "D1 S1": "## 🎲 Heat problem, or not? (1 of 8)\n\nThe Inspector reads out symptoms. Is the culprit heat, or one of the other four enemies?\n\n*The Inspector reads:*\n\n### Vents clogged with fuzz, laptop shuts off\n\n* [[🔥 Heat problem->D1 S1 R]]\n* [[⚡ Another enemy->D1 S1 W]]", "D1 S1 R": "## ✅ Right: it is a heat problem\n**Vents clogged with fuzz, laptop shuts off.** Dust blankets the parts and traps heat.\n\n[[Next one->D1 S2]]", "D1 S1 W": "## ❌ Not this time: it is a heat problem\n**Vents clogged with fuzz, laptop shuts off.** Dust blankets the parts and traps heat.\n\n[[Next one->D1 S2]]", "D1 S2": "## 🎲 Heat problem, or not? (2 of 8)\n\n*The Inspector reads:*\n\n### Dead after lightning hit the street\n\n* [[🔥 Heat problem->D1 S2 W]]\n* [[⚡ Another enemy->D1 S2 R]]", "D1 S2 R": "## ✅ Right: it is a different enemy\n**Dead after lightning hit the street.** That is a power surge.\n\n[[Next one->D1 S3]]", "D1 S2 W": "## ❌ Not this time: it is a different enemy\n**Dead after lightning hit the street.** That is a power surge.\n\n[[Next one->D1 S3]]", "D1 S3": "## 🎲 Heat problem, or not? (3 of 8)\n\n*The Inspector reads:*\n\n### Green crust on a charging port\n\n* [[🔥 Heat problem->D1 S3 W]]\n* [[⚡ Another enemy->D1 S3 R]]", "D1 S3 R": "## ✅ Right: it is a different enemy\n**Green crust on a charging port.** Moisture slowly corrodes metal.\n\n[[Next one->D1 S4]]", "D1 S3 W": "## ❌ Not this time: it is a different enemy\n**Green crust on a charging port.** Moisture slowly corrodes metal.\n\n[[Next one->D1 S4]]", "D1 S4": "## 🎲 Heat problem, or not? (4 of 8)\n\n*The Inspector reads:*\n\n### Game console wedged into a tight shelf\n\n* [[🔥 Heat problem->D1 S4 R]]\n* [[⚡ Another enemy->D1 S4 W]]", "D1 S4 R": "## ✅ Right: it is a heat problem\n**Game console wedged into a tight shelf.** No airflow, so heat has nowhere to go.\n\n[[Next one->D1 S5]]", "D1 S4 W": "## ❌ Not this time: it is a heat problem\n**Game console wedged into a tight shelf.** No airflow, so heat has nowhere to go.\n\n[[Next one->D1 S5]]", "D1 S5": "## 🎲 Heat problem, or not? (5 of 8)\n\n*The Inspector reads:*\n\n### Cracked corner after a backpack drop\n\n* [[🔥 Heat problem->D1 S5 W]]\n* [[⚡ Another enemy->D1 S5 R]]", "D1 S5 R": "## ✅ Right: it is a different enemy\n**Cracked corner after a backpack drop.** That is Bumps.\n\n[[Next one->D1 S6]]", "D1 S5 W": "## ❌ Not this time: it is a different enemy\n**Cracked corner after a backpack drop.** That is Bumps.\n\n[[Next one->D1 S6]]", "D1 S6": "## 🎲 Heat problem, or not? (6 of 8)\n\n*The Inspector reads:*\n\n### Phone warning on a sunny car dashboard\n\n* [[🔥 Heat problem->D1 S6 R]]\n* [[⚡ Another enemy->D1 S6 W]]", "D1 S6 R": "## ✅ Right: it is a heat problem\n**Phone warning on a sunny car dashboard.** Too hot, so it shuts down to protect itself.\n\n[[Next one->D1 S7]]", "D1 S6 W": "## ❌ Not this time: it is a heat problem\n**Phone warning on a sunny car dashboard.** Too hot, so it shuts down to protect itself.\n\n[[Next one->D1 S7]]", "D1 S7": "## 🎲 Heat problem, or not? (7 of 8)\n\n*The Inspector reads:*\n\n### Juice spilled and shorted the keyboard\n\n* [[🔥 Heat problem->D1 S7 W]]\n* [[⚡ Another enemy->D1 S7 R]]", "D1 S7 R": "## ✅ Right: it is a different enemy\n**Juice spilled and shorted the keyboard.** That is Moisture.\n\n[[Next one->D1 S8]]", "D1 S7 W": "## ❌ Not this time: it is a different enemy\n**Juice spilled and shorted the keyboard.** That is Moisture.\n\n[[Next one->D1 S8]]", "D1 S8": "## 🎲 Heat problem, or not? (8 of 8)\n\n*The Inspector reads:*\n\n### Fan roaring, bottom too hot to touch\n\n* [[🔥 Heat problem->D1 S8 R]]\n* [[⚡ Another enemy->D1 S8 W]]", "D1 S8 R": "## ✅ Right: it is a heat problem\n**Fan roaring, bottom too hot to touch.** The machine is fighting heat.\n\n[[Close up shop->D1 Done]]", "D1 S8 W": "## ❌ Not this time: it is a heat problem\n**Fan roaring, bottom too hot to touch.** The machine is fighting heat.\n\n[[Close up shop->D1 Done]]", "D1 Done": "(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]# Day 1 complete!\n\n<div class=\"tool\">📒 **New tool earned: Tech Notebook**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Start your **Tech Notebook** (a phone Notes list works). List every device you us -width=\"3\"/><circle cx=\"82\" cy=\"20\" r=\"3\" fill=\"#6fe3b5\"/><line x1=\"75\" y1=\"32\" x2=\"89\" y2=\"32\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"75\" y1=\"38\" x2=\"89\" y2=\"38\" stroke=\"#ffb347\" stroke-width=\"2\"/></svg><b>Desktop</b>the tower is the computer</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"All-in-one\"><rect x=\"14\" y=\"4\" width=\"72\" height=\"46\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"4\"/><rect x=\"19\" y=\"9\" width=\"62\" height=\"36\" fill=\"#2f4a5c\"/><polygon points=\"44,50 56,50 60,62 40,62\" fill=\"#9aa4ae\"/><rect x=\"34\" y=\"62\" width=\"32\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/></svg><b>All-in-one</b>computer inside the screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Chromebook\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"7\" fill=\"#7fd1ff\"/><rect x=\"29\" y=\"12\" width=\"14\" height=\"5\" rx=\"1\" fill=\"#e9ecef\"/><circle cx=\"44\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><circle cx=\"51\" cy=\"27\" r=\"7\" fill=\"#e9ecef\"/><circle cx=\"58\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><rect x=\"44\" y=\"30\" width=\"14\" height=\"5\" fill=\"#e9ecef\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/></svg><b>Chromebook</b>apps in the browser, files online</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Tablet\"><rect x=\"28\" y=\"4\" width=\"44\" height=\"62\" rx=\"6\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"33\" y=\"10\" width=\"34\" height=\"50\" fill=\"#2f4a5c\"/><circle cx=\"50\" cy=\"63\" r=\"1.6\" fill=\"#9aa4ae\"/></svg><b>Tablet</b>one flat touch screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Phone\"><rect x=\"38\" y=\"6\" width=\"26\" height=\"58\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"42\" y=\"13\" width=\"18\" height=\"44\" fill=\"#2f4a5c\"/><rect x=\"46\" y=\"9\" width=\"10\" height=\"2\" rx=\"1\" fill=\"#9aa4ae\"/></svg><b>Phone</b>a pocket computer</div></div>\n\n**Ports:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"USB-A\"><rect x=\"20\" y=\"24\" width=\"60\" height=\"22\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"29\" width=\"48\" height=\"7\" fill=\"#7fd1ff\"/></svg><b>USB-A</b>flat, one way up</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"USB-C\"><rect x=\"26\" y=\"25\" width=\"48\" height=\"20\" rx=\"10\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"36\" y=\"33\" width=\"28\" height=\"4\" rx=\"2\" fill=\"#7fd1ff\"/><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"6\" stroke=\"#6fe3b5\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"50,6 53.8,13.0 46.2,13.0\" fill=\"#6fe3b5\"/><line x1=\"50\" y1=\"48\" x2=\"50\" y2=\"64\" stroke=\"#6fe3b5\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"50,64 46.2,57.0 53.8,57.0\" fill=\"#6fe3b5\"/></svg><b>USB-C</b>small oval, either way</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"HDMI\"><polygon points=\"16,22 84,22 84,36 72,48 28,48 16,36\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"28\" y=\"29\" width=\"44\" height=\"6\" fill=\"#7fd1ff\"/><circle cx=\"22\" cy=\"44\" r=\"5\" fill=\"#ffb347\"/><circle cx=\"78\" cy=\"44\" r=\"5\" fill=\"#ffb347\"/></svg><b>HDMI</b>2 slanted corners</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"DisplayPort\"><polygon points=\"16,22 84,22 84,48 28,48 16,36\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"28\" y=\"29\" width=\"44\" height=\"6\" fill=\"#7fd1ff\"/><circle cx=\"20\" cy=\"44\" r=\"5\" fill=\"#ffb347\"/></svg><b>DisplayPort</b>1 slanted corner</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Ethernet\"><rect x=\"30\" y=\"12\" width=\"40\" height=\"38\" rx=\"2\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"42\" y=\"50\" width=\"16\" height=\"8\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"35\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"39\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"43\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"47\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"51\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"55\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"59\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/><rect x=\"63\" y=\"15\" width=\"2\" height=\"8\" fill=\"#ffb347\"/></svg><b>Ethernet</b>square, wired internet</div></div>\n<div class=\"cap\">Only USB-C ports? Old USB-A gear needs an <b>adapter</b> or <b>hub</b>. Plugs go in straight and gently.</div>\n\n**Quick-fire rules from Jr:**\n\n**Off and unplug first.** On an all-in-one, the computer is the screen, so pull its own cord.\n\n**Liquid goes on the cloth,** never on the device.\n\n**Laptop keys stay on.** Their tiny clips snap.\n\n**Compressed air:** short bursts, can upright. Apple OKs it for MacBook keyboards, says no for iPhones, so check your maker.\n\n### Why Computers Get Sick\n\"Almost every sick machine I see was hurt by one of **five enemies**.\"\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 290\" role=\"img\" aria-label=\"Jr kept machines <b>clean</b>. Sr keeps them <b>healthy</b>.\"><defs><linearGradient id=\"u2d1scr\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#3a4552\"/><stop offset=\"1\" stop-color=\"#1b1f24\"/></linearGradient></defs><rect x=\"162\" y=\"118\" width=\"76\" height=\"52\" rx=\"5\" fill=\"url(#u2d1scr)\" stroke=\"#e9ecef\" stroke-width=\"2.5\"/><rect x=\"194\" y=\"170\" width=\"12\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"180\" y=\"180\" width=\"40\" height=\"5\" rx=\"2\" fill=\"#9aa4ae\"/><circle cx=\"188\" cy=\"138\" r=\"3\" fill=\"#e9ecef\"/><circle cx=\"212\" cy=\"138\" r=\"3\" fill=\"#e9ecef\"/><path d=\"M188 156 q12 -9 24 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/><rect x=\"196\" y=\"6\" width=\"8\" height=\"28\" rx=\"4\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"198\" y=\"18\" width=\"4\" height=\"16\" fill=\"#ff6b6b\"/><circle cx=\"200\" cy=\"38\" r=\"7\" fill=\"#ff6b6b\"/><path d=\"M210 12 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M210 19 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ff6b6b\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"200\" y=\"66\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">1. Heat</text><text x=\"200\" y=\"84\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">slows, then shuts off</text><circle cx=\"316\" cy=\"108\" r=\"9\" fill=\"#8f979f\"/><circle cx=\"330\" cy=\"100\" r=\"11\" fill=\"#8f979f\"/><circle cx=\"344\" cy=\"108\" r=\"9\" fill=\"#8f979f\"/><circle cx=\"324\" cy=\"114\" r=\"8\" fill=\"#8f979f\"/><circle cx=\"338\" cy=\"115\" r=\"8\" fill=\"#8f979f\"/><circle cx=\"352\" cy=\"98\" r=\"4\" fill=\"#8f979f\"/><circle cx=\"308\" cy=\"98\" r=\"3\" fill=\"#8f979f\"/><text x=\"330\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#c3cad1\" text-anchor=\"middle\" font-weight=\"bold\">2. Dust</text><text x=\"330\" y=\"162\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">traps the heat</text><polygon points=\"322,192 306,215 317,215 313,232 330,208 319,208\" fill=\"#ffb347\"/><text x=\"318\" y=\"252\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Power</text><text x=\"318\" y=\"270\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">spikes fry parts</text><path d=\"M82 192 C86 202 96 212 96 220 A14 14 0 0 1 68 220 C68 212 78 202 82 192 Z\" fill=\"#7fd1ff\"/><text x=\"82\" y=\"252\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">4. Moisture</text><text x=\"82\" y=\"270\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">shorts and crust</text><rect x=\"52\" y=\"89\" width=\"36\" height=\"28\" rx=\"3\" fill=\"#2a2f36\" stroke=\"#e9ecef\" stroke-width=\"2\"/><path d=\"M58 89 l6 9 l-4 6 l10 5 l-2 8 M68 104 l12 -6 l6 -9\" stroke=\"#ff6b6b\" stroke-width=\"2\" fill=\"none\"/><text x=\"70\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">5. Bumps</text><text x=\"70\" y=\"162\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">cracks, loose plugs</text><line x1=\"200\" y1=\"98\" x2=\"200\" y2=\"112\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"200,112 196.2,105.0 203.8,105.0\" fill=\"#ff6b6b\"/><line x1=\"286\" y1=\"122\" x2=\"246\" y2=\"136\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"246,136 251.4,130.1 253.9,137.3\" fill=\"#ff6b6b\"/><line x1=\"114\" y1=\"122\" x2=\"154\" y2=\"136\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"154,136 146.1,137.3 148.6,130.1\" fill=\"#ff6b6b\"/><line x1=\"282\" y1=\"206\" x2=\"240\" y2=\"176\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"240,176 247.9,177.0 243.5,183.2\" fill=\"#ff6b6b\"/><line x1=\"118\" y1=\"206\" x2=\"160\" y2=\"176\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"160,176 156.5,183.2 152.1,177.0\" fill=\"#ff6b6b\"/></svg><div class=\"cap\">Jr kept machines <b>clean</b>. Sr keeps them <b>healthy</b>.</div></div>\n\n**Dust is a heat problem in disguise.** It blankets the parts and clogs fans, so heat gets trapped.\n\n**Bumps** means drops, knocks and squeezing.\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"A <b>power surge</b> is a sudden jolt of extra electricity. Storms and outages are classic causes. Day 4 shows what blocks it.\"><polyline points=\"20,72 160,72 160,112 236,112 236,14 252,72 384,72\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"3.5\" stroke-linejoin=\"round\"/><polyline points=\"236,112 236,14 252,72\" fill=\"none\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linejoin=\"round\"/><text x=\"88\" y=\"62\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">normal power</text><text x=\"198\" y=\"134\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">power out</text><text x=\"262\" y=\"26\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">SPIKE when it</text><text x=\"262\" y=\"44\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">comes back!</text><text x=\"320\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">zap: parts fried</text></svg><div class=\"cap\">A <b>power surge</b> is a sudden jolt of extra electricity. Storms and outages are classic causes. Day 4 shows what blocks it.</div></div>\n\n**Clues:**\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🐢</span><b>Hot + slow</b>= Heat (throttling)</div><div class=\"card \"><span class=\"big\">🌫️</span><b>Fuzzy vents</b>= Dust</div><div class=\"card \"><span class=\"big\">⚫</span><b>Dead after a storm</b>= Power surge</div><div class=\"card no\"><span class=\"big\">🔌</span><b>❌ Frayed cord</b>= Power: stop using it</div><div class=\"card \"><span class=\"big\">🟢</span><b>Green or white crust</b>= Moisture (corrosion)</div><div class=\"card \"><span class=\"big\">💥</span><b>Cracked, or works at one angle</b>= Bumps</div></div>\n\n<div class=\"warn\">**Grown-up needed:** A frayed cable, a burning smell, or a device too hot to hold means stop and tell a grown-up. Never tape up a damaged power cord yourself.</div>\n\n---\n\n🌙 *That's today's workday. Day 2 opens next time.*\n\n[[Back to the work schedule->Shop]]", "D2 Start": "(set: $miss to 0)(set: $m2 to (a:))# Day 2: Screens, Cases & Hinges\n\n<div class=\"scene\">💻 📝 💥</div>\n\n*A hand-lettered sign hangs over the counter: \"Days since last preventable disaster: 1.\"*\n\n*The Inspector tilts a laptop. A faint rectangle glows on the screen.* \"Someone closed it on a sticky-note pad. Screens cost the most and hurt the easiest.\"\n\n\n[[Open the shop->D2 L1]]", "D2 L1": "## 📘 The Inspector's lesson: How Screens Are Built\n\n\"Two kinds of screen. Each has its own weak spot.\"\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"<b>LCD</b>: most laptops and monitors. <b>OLED</b>: many phones and TVs, and a growing number of laptops.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">LCD</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">OLED</text><line x1=\"50\" y1=\"56\" x2=\"50\" y2=\"32\" stroke=\"#ffe08a\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"50,32 53.8,39.0 46.2,39.0\ ffb347\"/><rect x=\"346\" y=\"86\" width=\"20\" height=\"44\" rx=\"3\" fill=\"#111\"/><text x=\"300\" y=\"156\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">each pixel glows</text><text x=\"300\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">black = fully off</text></svg><div class=\"cap\"><b>LCD</b>: most laptops and monitors. <b>OLED</b>: many phones and TVs, and a growing number of laptops.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 175\" role=\"img\" aria-label=\"A ghost that fades is <b>image retention</b>. One that stays is <b>burn-in</b>.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Pressure mark</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Burn-in</text><rect x=\"20\" y=\"30\" width=\"160\" height=\"102\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"26\" y=\"36\" width=\"148\" height=\"90\" rx=\"2\" fill=\"#e9ecef\"/><ellipse cx=\"100\" cy=\"88\" rx=\"26\" ry=\"18\" fill=\"#ff6b6b\" opacity=\"0.45\"/><ellipse cx=\"100\" cy=\"88\" rx=\"18\" ry=\"12\" fill=\"#ffb347\" opacity=\"0.6\"/><ellipse cx=\"100\" cy=\"88\" rx=\"10\" ry=\"6\" fill=\"#7fd1ff\" opacity=\"0.8\"/><path d=\"M150 30 L106 82 L112 86 Z\" fill=\"#e8c27a\"/><rect x=\"220\" y=\"30\" width=\"160\" height=\"102\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"226\" y=\"36\" width=\"148\" height=\"90\" rx=\"2\" fill=\"#2d4a5e\"/><polygon points=\"226,126 270,90 300,108 340,80 374,126\" fill=\"#3f6b55\"/><rect x=\"234\" y=\"44\" width=\"50\" height=\"9\" rx=\"3\" fill=\"#ffffff\" opacity=\"0.28\"/><rect x=\"340\" y=\"44\" width=\"26\" height=\"26\" rx=\"3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" opacity=\"0.28\"/><text x=\"100\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">LCD: hard pokes</text><text x=\"100\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">squeeze the layers</text><text x=\"300\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">OLED: same image</text><text x=\"300\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">for hours leaves a ghost</text></svg><div class=\"cap\">A ghost that fades is <b>image retention</b>. One that stays is <b>burn-in</b>.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">👆</span><b>✅ Taps, not jabs</b>point with the cursor</div><div class=\"card ok\"><span class=\"big\">🔅</span><b>✅ Lower brightness</b>or use auto</div><div class=\"card ok\"><span class=\"big\">💤</span><b>✅ Let it sleep</b>when you walk away</div><div class=\"card ok\"><span class=\"big\">🎮</span><b>✅ Shrink the HUD</b>or hide it</div><div class=\"card no\"><span class=\"big\">🧴</span><b>❌ Ammonia</b>in window cleaner, strips coatings</div><div class=\"card no\"><span class=\"big\">⚠️</span><b>❌ Alcohol wipes</b>Apple yes, Dell no: check</div></div>\n\n**What kind is yours?** Show a fully black picture in a dark room. Also look for sharp mirror reflections (glossy) or soft ones (matte).\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🌑</span><b>LCD</b>black image in a dark room glows dark gray</div><div class=\"card \"><span class=\"big\">⬛</span><b>OLED</b>black image in a dark room looks totally off</div><div class=\"card \"><span class=\"big\">🪞</span><b>Glossy</b>you can see a sharp mirror reflection</div><div class=\"card \"><span class=\"big\">🌫️</span><b>Matte</b>reflections look soft and blurry</div></div>\n\n**Mini-LED trap:** some MacBook Pros, iPads and TVs are LCDs with local dimming. They can look almost black too. Check the model name.\n\nCoatings are delicate, and alcohol can strip them. **Check your maker:** Apple says 70% isopropyl wipes are OK on its displays. Dell says no alcohol on its monitors.\n\n[[Got it. Send in the next customer->D2 J2]]", "D2 J2": "<div class=\"scene\">👩‍💼 💅 🌈</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"Look at where the rainbow blotch sits.\"><rect x=\"64\" y=\"8\" width=\"182\" height=\"94\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"70\" y=\"14\" width=\"170\" height=\"82\" rx=\"2\" fill=\"#e9ecef\"/><polygon points=\"64,102 246,102 264,124 46,124\" fill=\"#8a96a3\"/><rect x=\"84\" y=\"26\" width=\"120\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"84\" y=\"40\" width=\"90\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"84\" y=\"54\" width=\"130\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"84\" y=\"68\" width=\"70\" height=\"6\" rx=\"3\" fill=\"#9aa4ae\"/><ellipse cx=\"178\" cy=\"62\" rx=\"20\" ry=\"13\" fill=\"#ff6b6b\" opacity=\"0.45\"/><ellipse cx=\"178\" cy=\"62\" rx=\"14\" ry=\"9\" fill=\"#ffb347\" opacity=\"0.6\"/><ellipse cx=\"178\" cy=\"62\" rx=\"8\" ry=\"5\" fill=\"#6fe3b5\" opacity=\"0.7\"/><ellipse cx=\"178\" cy=\"62\" rx=\"4\" ry=\"2.5\" fill=\"#7fd1ff\"/><g transform=\"rotate(-20 190 60)\"><rect x=\"190\" y=\"51\" width=\"60\" height=\"18\" rx=\"9\" fill=\"#e8c27a\"/><rect x=\"192\" y=\"54\" width=\"14\" height=\"12\" rx=\"5\" fill=\"#ffd9e0\"/></g><text x=\"155\" y=\"146\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Ms. Abara's screen, where she taps</text></svg><div class=\"cap\">Look at where the rainbow blotch sits.</div></div>\n\n**Ms. Abara** taps her laptop screen with her fingernail when she explains things. Now a rainbow blotch sits right where she taps.\n\n**What's happening?**\n\n* [[Fingernail pressure squeezes the LCD->D2 J2 R]]\n* [[OLED burn-in from one still picture->D2 J2 W2]]\n* [[Skin oil has soaked into the pixels->D2 J2 W3]]\n* [[The coating reflects the bright room->D2 J2 W4]]", "D2 J2 W2": "(set: $m2 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **pressure mark**. Her nail keeps **squeezing the LCD layers** in one spot.\"\n\n[[Got it->D2 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pressure mark picture again.\"\n\n[[Try again->D2 J2]]]", "D2 J2 W3": "(set: $m2 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **pressure mark**. Her nail keeps **squeezing the LCD layers** in one spot.\"\n\n[[Got it->D2 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pressure mark picture again.\"\n\n[[Try again->D2 J2]]]", "D2 J2 W4": "(set: $m2 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **pressure mark**. Her nail keeps **squeezing the LCD layers** in one spot.\"\n\n[[Got it->D2 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pressure mark picture again.\"\n\n[[Try again->D2 J2]]]", "D2 J2 R": "(set: $miss to 0)## ✅ Job done\n**Pressure on the LCD layers.** Point with the cursor instead. Repeated jabs can leave it for good.\n\n[[Next customer->D2 J3]]", "D2 J3": "<div class=\"scene\">🎮 📺 👻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look at the top corners of the movie.\"><rect x=\"13\" y=\"9\" width=\"155\" height=\"92\" rx=\"5\" fill=\"#3a4048\"/><rect x=\"18\" y=\"14\" width=\"145\" height=\"82\" fill=\"#1b1f24\"/><rect x=\"18\" y=\"14\" width=\"145\" height=\"49.199999999999996\" fill=\"#2d4a5e\"/><polygon points=\"18,96 61.5,59.1 97.75,75.5 134.0,50.9 163,71.4 163,96\" fill= s safe on a screen\n**Dry microfiber cloth.** Soft, and it lifts dust without scratching.\n\n[[Next one->D2 S2]]", "D2 S2": "## 🎲 Safe on a screen, or never? (2 of 8)\n\n*The Inspector holds up:*\n\n### Window cleaner\n\n* [[✅ Safe on a screen->D2 S2 W]]\n* [[⛔ Never on a screen->D2 S2 R]]", "D2 S2 R": "## ✅ Right: it never goes on a screen\n**Window cleaner.** Ammonia strips coatings.\n\n[[Next one->D2 S3]]", "D2 S2 W": "## ❌ Not this time: it never goes on a screen\n**Window cleaner.** Ammonia strips coatings.\n\n[[Next one->D2 S3]]", "D2 S3": "## 🎲 Safe on a screen, or never? (3 of 8)\n\n*The Inspector holds up:*\n\n### Barely damp cloth, water only\n\n* [[✅ Safe on a screen->D2 S3 R]]\n* [[⛔ Never on a screen->D2 S3 W]]", "D2 S3 R": "## ✅ Right: it is safe on a screen\n**Barely damp cloth, water only.** Gentle, and no drips into the edges.\n\n[[Next one->D2 S4]]", "D2 S3 W": "## ❌ Not this time: it is safe on a screen\n**Barely damp cloth, water only.** Gentle, and no drips into the edges.\n\n[[Next one->D2 S4]]", "D2 S4": "## 🎲 Safe on a screen, or never? (4 of 8)\n\n*The Inspector holds up:*\n\n### Paper towel\n\n* [[✅ Safe on a screen->D2 S4 W]]\n* [[⛔ Never on a screen->D2 S4 R]]", "D2 S4 R": "## ✅ Right: it never goes on a screen\n**Paper towel.** Rough fibers can scratch the coating.\n\n[[Next one->D2 S5]]", "D2 S4 W": "## ❌ Not this time: it never goes on a screen\n**Paper towel.** Rough fibers can scratch the coating.\n\n[[Next one->D2 S5]]", "D2 S5": "## 🎲 Safe on a screen, or never? (5 of 8)\n\n*The Inspector holds up:*\n\n### Spray aimed at the glass\n\n* [[✅ Safe on a screen->D2 S5 W]]\n* [[⛔ Never on a screen->D2 S5 R]]", "D2 S5 R": "## ✅ Right: it never goes on a screen\n**Spray aimed at the glass.** Drips sneak in around the edges.\n\n[[Next one->D2 S6]]", "D2 S5 W": "## ❌ Not this time: it never goes on a screen\n**Spray aimed at the glass.** Drips sneak in around the edges.\n\n[[Next one->D2 S6]]", "D2 S6": "## 🎲 Safe on a screen, or never? (6 of 8)\n\n*The Inspector holds up:*\n\n### Pressing hard on a smudge\n\n* [[✅ Safe on a screen->D2 S6 W]]\n* [[⛔ Never on a screen->D2 S6 R]]", "D2 S6 R": "## ✅ Right: it never goes on a screen\n**Pressing hard on a smudge.** It leaves pressure marks.\n\n[[Next one->D2 S7]]", "D2 S6 W": "## ❌ Not this time: it never goes on a screen\n**Pressing hard on a smudge.** It leaves pressure marks.\n\n[[Next one->D2 S7]]", "D2 S7": "## 🎲 Safe on a screen, or never? (7 of 8)\n\n*The Inspector holds up:*\n\n### Alcohol wipe your maker bans\n\n* [[✅ Safe on a screen->D2 S7 W]]\n* [[⛔ Never on a screen->D2 S7 R]]", "D2 S7 R": "## ✅ Right: it never goes on a screen\n**Alcohol wipe your maker bans.** It can strip the coating.\n\n[[Next one->D2 S8]]", "D2 S7 W": "## ❌ Not this time: it never goes on a screen\n**Alcohol wipe your maker bans.** It can strip the coating.\n\n[[Next one->D2 S8]]", "D2 S8": "## 🎲 Safe on a screen, or never? (8 of 8)\n\n*The Inspector holds up:*\n\n### Wiping while it is powered off\n\n* [[✅ Safe on a screen->D2 S8 R]]\n* [[⛔ Never on a screen->D2 S8 W]]", "D2 S8 R": "## ✅ Right: it is safe on a screen\n**Wiping while it is powered off.** Smudges show up, and nothing can short.\n\n[[Next customer->D2 J6]]", "D2 S8 W": "## ❌ Not this time: it is safe on a screen\n**Wiping while it is powered off.** Smudges show up, and nothing can short.\n\n[[Next customer->D2 J6]]", "D2 J6": "<div class=\"scene\">🏃‍♀️ 💦 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 150\" role=\"img\" aria-label=\"This is what Nora is about to do.\"><rect x=\"20\" y=\"48\" width=\"26\" height=\"46\" rx=\"6\" fill=\"#6fe3b5\" opacity=\"0.85\"/><rect x=\"26\" y=\"38\" width=\"16\" height=\"11\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"38\" width=\"14\" height=\"6\" fill=\"#9aa4ae\"/><line x1=\"30\" y1=\"48\" x2=\"24\" y2=\"60\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><circle cx=\"58\" cy=\"44\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"66\" cy=\"39\" r=\"2.2\" fill=\"#7fd1ff\"/><circle cx=\"6  pen sat.</div></div>\n\n**Jordan** set his pen on the keyboard and snapped the laptop shut. Next morning: a long crack, right where the pen was.\n\n**What happened?**\n\n* [[The hinge snapped and dropped the screen->D2 J8 W1]]\n* [[Heat built up overnight and cracked it->D2 J8 W2]]\n* [[The screen coating dried out and split->D2 J8 W3]]\n* [[The lid pressed the pen into the screen->D2 J8 R]]", "D2 J8 W1": "(set: $m2 to it + (a: \"Jordan\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Almost no space in there. **The lid pressed the pen into the screen.**\"\n\n[[Got it->D2 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pen picture again.\"\n\n[[Try again->D2 J8]]]", "D2 J8 W2": "(set: $m2 to it + (a: \"Jordan\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Almost no space in there. **The lid pressed the pen into the screen.**\"\n\n[[Got it->D2 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pen picture again.\"\n\n[[Try again->D2 J8]]]", "D2 J8 W3": "(set: $m2 to it + (a: \"Jordan\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Almost no space in there. **The lid pressed the pen into the screen.**\"\n\n[[Got it->D2 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pen picture again.\"\n\n[[Try again->D2 J8]]]", "D2 J8 R": "(set: $miss to 0)## ✅ Job done\n**The pen got pressed into the screen.** Check the keyboard is clear before closing.\n\n[[Next customer->D2 J9]]", "D2 J9": "<div class=\"scene\">💻 ↖️ 🫨</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Mia opens it by the top-left corner.\"><g transform=\"rotate(-5 180 100)\"><rect x=\"94\" y=\"14\" width=\"172\" height=\"88\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"100\" y=\"20\" width=\"160\" height=\"76\" rx=\"2\" fill=\"#cfe8ff\"/></g><rect x=\"80\" y=\"104\" width= le\" font-weight=\"normal\">each pixel glows</text><text x=\"300\" y=\"174\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">black = fully off</text></svg><div class=\"cap\"><b>LCD</b>: most laptops and monitors. <b>OLED</b>: many phones and TVs, and a growing number of laptops.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 175\" role=\"img\" aria-label=\"A ghost that fades is <b>image retention</b>. One that stays is <b>burn-in</b>.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Pressure mark</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Burn-in</text><rect x=\"20\" y=\"30\" width=\"160\" height=\"102\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"26\" y=\"36\" width=\"148\" height=\"90\" rx=\"2\" fill=\"#e9ecef\"/><ellipse cx=\"100\" cy=\"88\" rx=\"26\" ry=\"18\" fill=\"#ff6b6b\" opacity=\"0.45\"/><ellipse cx=\"100\" cy=\"88\" rx=\"18\" ry=\"12\" fill=\"#ffb347\" opacity=\"0.6\"/><ellipse cx=\"100\" cy=\"88\" rx=\"10\" ry=\"6\" fill=\"#7fd1ff\" opacity=\"0.8\"/><path d=\"M150 30 L106 82 L112 86 Z\" fill=\"#e8c27a\"/><rect x=\"220\" y=\"30\" width=\"160\" height=\"102\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"226\" y=\"36\" width=\"148\" height=\"90\" rx=\"2\" fill=\"#2d4a5e\"/><polygon points=\"226,126 270,90 300,108 340,80 374,126\" fill=\"#3f6b55\"/><rect x=\"234\" y=\"44\" width=\"50\" height=\"9\" rx=\"3\" fill=\"#ffffff\" opacity=\"0.28\"/><rect x=\"340\" y=\"44\" width=\"26\" height=\"26\" rx=\"3\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"3\" opacity=\"0.28\"/><text x=\"100\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">LCD: hard pokes</text><text x=\"100\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">squeeze the layers</text><text x=\"300\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">OLED: same image</text><text x=\"300\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">for hours leaves a ghost</text></svg><div class=\"cap\">A ghost that fades is <b>image retention</b>. One that stays is <b>burn-in</b>.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">👆</span><b>✅ Taps, not jabs</b>point with the cursor</div><div class=\"card ok\"><span class=\"big\">🔅</span><b>✅ Lower brightness</b>or use auto</div><div class=\"card ok\"><span class=\"big\">💤</span><b>✅ Let it sleep</b>when you walk away</div><div class=\"card ok\"><span class=\"big\">🎮</span><b>✅ Shrink the HUD</b>or hide it</div><div class=\"card no\"><span class=\"big\">🧴</span><b>❌ Ammonia</b>in window cleaner, strips coatings</div><div class=\"card no\"><span class=\"big\">⚠️</span><b>❌ Alcohol wipes</b>Apple yes, Dell no: check</div></div>\n\n**What kind is yours?** Show a fully black picture in a dark room. Also look for sharp mirror reflections (glossy) or soft ones (matte).\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🌑</span><b>LCD</b>black image in a dark room glows dark gray</div><div class=\"card \"><span class=\"big\">⬛</span><b>OLED</b>black image in a dark room looks totally off</div><div class=\"card \"><span class=\"big\">🪞</span><b>Glossy</b>you can see a sharp mirror reflection</div><div class=\"card \"><span class=\"big\">🌫️</span><b>Matte</b>reflections look soft and blurry</div></div>\n\n**Mini-LED trap:** some MacBook Pros, iPads and TVs are LCDs with local dimming. They can look almost black too. Check the model name.\n\nCoatings are delicate, and alcohol can strip them. **Check your maker:** Apple says 70% isopropyl wipes are OK on its displays. Dell says no alcohol on its monitors.\n\n### Cleaning a Screen, Technician Style\n\"Five steps, in order.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Off + unplug\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"41\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"10\" y1=\"36\" x2=\"0\" y2=\"36\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"60\" y=\"14\" width=\"34\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"70\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"81\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/></svg><b>1. Off + unplug</b>smudges show on black</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Dry cloth first\"><rect x=\"8\" y=\"4\" width=\"84\" height=\"58\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"14\" y=\"10\" width=\"72\" height=\"46\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"40\" y=\"26\" width=\"40\" height=\"26\" rx=\"5\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M44 35.1 q10.0 -6 16.0 0 t16.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M44 44.2 q10.0 -6 16.0 0 t16.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M24 22 q12 -8 24 0\" stroke=\"#e9ecef\" stroke-width=\"2\" fill=\"none\"/></svg><b>2. Dry cloth first</b>light pressure</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Water on cloth\"><path d=\"M50 8.1 q7.700000000000001 9.9 0 16.5 q-7.700000000000001 -6.6000000000000005 0 -16.5\" fill=\"#7fd1ff\"/><rect x=\"24\" y=\"36\" width=\"52\" height=\"28\" rx=\"5\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M28 45.8 q13.0 -6 22.0 0 t22.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M28 55.599999999999994 q13.0 -6 22.0 0 t22.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"36\" stroke=\"#7fd1ff\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"50,36 46.2,29.0 53.8,29.0\" fill=\"#7fd1ff\"/></svg><b>3. Water on cloth</b>barely damp, distilled if you can</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Gentle strokes\"><rect x=\"8\" y=\"4\" width=\"84\" height=\"58\" rx=\"6\" fill=\"#3a4048\"/><rect x=\"14\" y=\"10\" width=\"72\" height=\"46\" rx=\"2\" fill=\"#1b1f24\"/><line x1=\"24\" y1=\"33\" x2=\"76\" y2=\"33\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"76,33 69.0,36.8 69.0,29.2\" fill=\"#6fe3b5\"/></svg><b>4. Gentle strokes</b>no pressing or scrubbing</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"5. Dry it\"><rect x=\"14\" y=\"22\" width=\"44\" height=\"30\" rx=\"5\" fill=\"#6fe3b5\" opacity=\"0.85\"/><path d=\"M18 32.5 q11.0 -6 18.0 0 t18.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M18 43.0 q11.0 -6 18.0 0 t18.0 0\" stroke=\"#1b1f24\" stroke-width=\"1.5\" fill=\"none\" opacity=\"0.5\"/><path d=\"M69 36 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><b>5. Dry it</b>air-dry before power on</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 175\" role=\"img\" aria-label=\"Apple, Dell, and Microsoft all say: <b>never spray right on a screen</b>.\"><text x=\"100\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Spray on screen</text><text x=\"300\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Water on cloth</text><rect x=\"12\" y=\"64\"
