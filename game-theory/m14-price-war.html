<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price War</title>
<style>
  body{margin:0;background:#07070f;color:#e8f7ff;font-family:"Courier New",monospace;padding:14px;text-align:center}
  h1{font-size:22px;letter-spacing:3px;color:#39ff14;text-shadow:0 0 8px #39ff14;margin:8px 0}
  h2{font-size:16px;color:#ff2bd6;letter-spacing:2px;margin:6px 0}
  .bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
  .box{border:2px solid #00e5ff;box-shadow:0 0 8px #00e5ff55;padding:6px 12px;min-width:92px}
  .box b{display:block;font-size:22px;color:#ffe600}
  table{margin:10px auto;border-collapse:collapse}
  td,th{border:2px solid #00e5ff;padding:6px 9px;font-size:14px}
  th{color:#ff2bd6}
  button{font:bold 17px "Courier New",monospace;margin:4px;padding:9px 0;min-width:50px;background:#07070f;color:#ffe600;border:3px solid #ffe600;border-radius:6px;cursor:pointer;box-shadow:0 0 10px #ffe60066}
  button:active{background:#ffe600;color:#07070f}
  button.big{padding:12px 20px;margin:8px}
  #round,#final{display:none}
  #out{width:95%;max-width:620px;height:130px;background:#0e0e1c;color:#e8f7ff;border:2px solid #39ff14;font:14px "Courier New",monospace}
  .note{color:#9fb4c8;font-size:14px}
  .rival{color:#00e5ff;font-size:18px}
  .news{color:#ff2bd6;border:2px dashed #ff2bd6;display:inline-block;padding:6px 12px;margin:6px;font-size:15px}
  .rank{font-size:26px;color:#ffe600;text-shadow:0 0 10px #ffe600;letter-spacing:3px;margin:10px 0 2px}
  .tape{display:inline-block;border:2px solid #ff2bd6;box-shadow:0 0 8px #ff2bd655;padding:8px 14px;margin:8px;text-align:left}
  .tape b{color:#39ff14}
  .fact{border-top:2px dashed #00e5ff;margin:14px auto;padding-top:10px;max-width:580px;color:#9fb4c8;font-size:14px}
</style>
</head>
<body>
<h1>PRICE WAR</h1>
<p class="note">You and Penny's Pops sell the same soda on the same street. 100 customers a day. Each soda costs you both 2 coins to make. Every round you both set a price at the same moment.</p>
<div class="bar">
  <div class="box">ROUND<b id="rn">1/6</b></div>
  <div class="box">YOUR PROFIT<b id="ms">0</b></div>
</div>

<div id="pick">
  <p class="news" id="rules"></p>
  <p class="rival" id="who"></p>
  <p>Pick your price:</p>
  <div id="choices"></div>
</div>

<div id="round">
  <h2 id="headline"></h2>
  <p id="detail"></p>
  <button class="big" id="next" onclick="nextRound()">NEXT ROUND</button>
</div>

<div id="final">
  <h1>STORE CLOSED</h1>
  <div id="verdict"></div>
  <p>Copy your results, then paste them to Rocky in the chat.</p>
  <textarea id="out" readonly></textarea><br>
  <button class="big" onclick="copyIt()">COPY MY RESULTS FOR ROCKY</button>
  <p class="note" id="status"></p>
</div>

<script>
var total=6,half=3,r=0,log=[],ms=0,PRICES=[2,3,4,6,8,10,12,14,16,18,20];
var TAUNTS={win:["Penny: \"Enjoy it while it lasts.\"","Penny: \"Hmph. Nice price.\""],lose:["Penny: \"Two coins cheaper and they all came to me!\"","Penny: \"My customers say thanks.\""],tie:["Penny: \"Split the street? Fine. For now.\""]};
function el(i){return document.getElementById(i)}
function show(id,on){el(id).style.display=on?"block":"none"}
function phase(){return r<half?1:2}
function customers(p,pr,ph){
  if(ph===1){return p<pr?100:(p===pr?50:0)}
  return Math.max(0,Math.min(100,50+5*(pr-p)));
}
function profit(p,pr,ph){return (p-2)*customers(p,pr,ph)}
function showBest(b){return b.ps.length>3?"any price (all earn 0)":b.ps.join(" or ")}
function bestList(pr,ph){
  var m=-1e9,list=[];
  PRICES.forEach(function(p){var x=profit(p,pr,ph);if(x>m){m=x;list=[p]}else if(x===m)list.push(p)});
  return {profit:m,ps:list};
}
function rivalP(){
  if(r===0||r===half)return 10;
  return bestList(log[r-1].p,phase()).ps[0];
}
function setup(){
  el("rn").textContent=(r+1)+"/"+total;
  el("rules").textContent=(phase()===1)
    ?"RULE: the sodas are identical. Every customer buys from the cheaper store. Same price: split 50/50."
    :"NEW RULE: your sodas now taste different and each store has fans. Customers = 50 + 5 x (Penny's price minus yours), from 0 to 100.";
  el("who").textContent=(r===0||r===half)?"Penny opens at a middle price.":"Penny is pricing to beat what you charged last round.";
  var c="";
  PRICES.forEach(function(p){c+="<button onclick=\"play("+p+")\">"+p+"</button>"});
  el("choices").innerHTML=c;
  show("pick",true);show("round",false);
}
function play(p){
  var ph=phase(),pr=rivalP(),n=customers(p,pr,ph),mine=profit(p,pr,ph),his=profit(pr,p,ph),b=bestList(pr,ph);
  log.push({ph:ph,p:p,pr:pr,n:n,mine:mine,his:his,best:b,hit:mine===b.profit});
  ms+=mine;
  el("ms").textContent=ms;
  el("headline").textContent="You charged "+p+". Penny charged "+pr+". You sold "+n+" sodas.";
  var tk=mine>his?"win":(mine<his?"lose":"tie"),tl=TAUNTS[tk][r%TAUNTS[tk].length];
  el("detail").innerHTML="Your profit: <b>"+mine+"</b>. Penny's profit: <b>"+his+"</b>.<br><span class=\"rival\">"+tl+"</span><br><span class=\"note\">Your best reply to Penny's "+pr+" was "+showBest(b)+" ("+b.profit+" coins).</span>";
  el("next").textContent=(r===total-1)?"SEE FINAL SCORE":(r===half-1?"NEW RULE AHEAD":"NEXT ROUND");
  show("pick",false);show("round",true);
}
function nextRound(){
  r++;
  if(r>=total){finish();return}
  setup();
}
function finish(){
  show("round",false);show("pick",false);
  var rows="<tr><th>Round</th><th>Rule</th><th>You</th><th>Penny</th><th>Sold</th><th>Your profit</th><th>Best reply</th></tr>";
  var hits=0,i;
  for(i=0;i<total;i++){
    var x=log[i];if(x.hit)hits++;
    rows+="<tr><td>"+(i+1)+"</td><td>"+(x.ph===1?"same soda":"fans")+"</td><td>"+x.p+"</td><td>"+x.pr+"</td><td>"+x.n+"</td><td>"+x.mine+"</td><td>"+showBest(x.best)+(x.hit?" ✔":"")+"</td></tr>";
  }
  var p1=0,p2=0;for(i=0;i<half;i++)p1+=log[i].mine;for(i=half;i<total;i++)p2+=log[i].mine;
  var rank=hits>=5?"PRICE PRO":(hits>=3?"SHARP SELLER":"BARGAIN BIN");
  el("verdict").innerHTML=
    "<table>"+rows+"</table>"+
    "<p>Profit with same soda: <b>"+p1+"</b>. Profit with fans: <b>"+p2+"</b>. Best reply in <b>"+hits+"</b> of 6 rounds.</p>"+
    "<div class=\"rank\">RANK: "+rank+"</div>"+
    "<h2>REPLAY THE TAPE</h2>"+
    "<div class=\"tape\">Same soda: whoever is a coin cheaper gets everyone, so prices race down to <b>2 or 3</b>, barely above cost.</div>"+
    "<div class=\"tape\">With fans: undercutting only steals a few customers, so prices settle at <b>12</b> each and each store earns <b>500</b>.</div>"+
    "<p class=\"note\">Same street, same cost. What made the second half so different?</p>"+
    "<div class=\"fact\">This is one reason companies spend so much on making their products feel different, even when they are nearly the same.</div>";
  el("out").value="GT-M14 | my prices: "+log.map(function(x){return x.p}).join(", ")+
    " | Penny prices: "+log.map(function(x){return x.pr}).join(", ")+
    " | sold: "+log.map(function(x){return x.n}).join(", ")+
    " | my profits: "+log.map(function(x){return x.mine}).join(", ")+
    " | same-soda total "+p1+", fans total "+p2+" | best reply in "+hits+" of 6";
  show("final",true);
}
function copyIt(){
  var t=el("out"),s=el("status");
  t.select();t.setSelectionRange(0,999);
  var ok=false;
  function fallback(){
    try{ok=document.execCommand("copy")}catch(e){}
    s.textContent=ok?"Copied! Now paste it to Rocky.":"Tap the box, select all, copy, then paste it to Rocky.";
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(function(){s.textContent="Copied! Now paste it to Rocky."},fallback);
      return;
    }
  }catch(e){}
  fallback();
}
setup();
</script>
</body>
</html>
