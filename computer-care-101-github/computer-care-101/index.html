<head>

<title>Keycap & Co.: Computer Care 101</title>
<style>
tw-story { background: #1b1f24; color: #e9ecef; font-family: "DejaVu Sans Mono", "Courier New", monospace; font-size: 1.05em; line-height: 1.6; }
tw-passage { max-width: 42em; margin: 0 auto; }
tw-link, .enchantment-link { color: #ffb347; font-weight: bold; }
tw-link:hover, .enchantment-link:hover { color: #ffe0a8; }
h1, h2, h3 { color: #7fd1ff; font-family: "Segoe UI", "Inter", sans-serif; line-height: 1.25; }
code { background: #2a2f36; padding: 0.1em 0.35em; border-radius: 4px; color: #b8f2a2; }
.warn { border-left: 4px solid #ff6b6b; background: #2a2f36; margin: 1em 0; padding: 0.5em 1em; }
.casebar { background: #2a2f36; border: 1px dashed #7fd1ff; padding: 0.3em 0.8em; font-size: 0.85em; margin-bottom: 1em; }
.tool { background: #2a2f36; border: 1px solid #ffb347; border-radius: 8px; padding: 0.6em 1em; margin: 1em 0; }
.ports { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 1em 0; }
.port { margin: 0; background: #2a2f36; border-radius: 8px; padding: 8px; text-align: center; font-size: 0.8em; line-height: 1.3; }
.port svg { width: 72px; height: 48px; display: block; margin: 0 auto 4px; }
.port b { display: block; color: #ffb347; }
tw-passage li:has(tw-link) { margin: 0.6em 0; }
.field { border-left: 4px solid #7fd1ff; background: #22303a; padding: 0.5em 1em; margin: 1em 0; }
.pic { background: #232930; border-radius: 10px; padding: 10px; margin: 1em 0; text-align: center; }
.pic svg { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
.cap { font-size: 0.85em; color: #cfd6dd; margin-top: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 10px; margin: 1em 0; }
.card { background: #2a2f36; border: 2px solid #2a2f36; border-radius: 10px; padding: 8px; text-align: center; font-size: 0.8em; line-height: 1.3; }
.card .big { font-size: 2.2em; display: block; line-height: 1.2; }
.card svg { width: 96px; height: 64px; display: block; margin: 0 auto 4px; }
.card b { display: block; color: #ffb347; margin: 2px 0; }
.card.ok { border-color: #6fe3b5; } .card.no { border-color: #ff6b6b; }
.scene { font-size: 2.6em; text-align: center; letter-spacing: 0.15em; margin: 0.2em 0; }
html,body{margin:0;background:#1b1f24}
tw-story{display:block;min-height:100vh;padding:24px 16px 48px;box-sizing:border-box}
tw-passage{display:block}
tw-passage p{margin:0 0 1em}
tw-passage ul,tw-passage ol{margin:0 0 1em;padding-left:1.4em}
tw-passage li{margin:.2em 0}
tw-link{cursor:pointer;display:inline}
tw-link:focus-visible{outline:2px solid #7fd1ff;outline-offset:2px}
.warn{border-left:4px solid #ff6b6b;background:#2a2f36;margin:1em 0;padding:.5em 1em}
h1:focus,h2:focus{outline:none}
hr{border:0;border-top:1px solid #3a414a;margin:1.2em 0}
.controls{max-width:42em;margin:2em auto 0;display:flex;gap:12px;font-size:.85em}
.controls button{background:none;border:1px solid #3a414a;color:#aab4be;border-radius:6px;padding:.4em .9em;cursor:pointer;font:inherit}
.controls button:hover{color:#e9ecef;border-color:#7fd1ff}
.controls button:disabled{opacity:.35;cursor:default}
</style>
</head>

<script>
const STORY={"start": "Start", "startup": ["Init"], "header": ["Shift Bar"], "passages": {"Init": "(set: $days to (a:))(set: $miss to 0)", "Shift Bar": "<div class=\"casebar\">🛠️ Workdays done: (print: $days's length) / 6 · [[Work schedule->Shop]] · [[Toolbox->Toolbox]]</div>", "Start": "# Keycap & Co.\n## Computer Care 101 · Unit 1: Know Your Gear\n\n<div class=\"scene\">🔔 ⌨️ 🖱️ 🧰</div>\n\n*You walk into* **Keycap & Co. Repair Bench.** *The boss looks up. Everyone calls her* **The Inspector.**\n\n\"Hi, new trainee! Six workdays. Each day I teach you. Then you help customers. Each day you finish earns a tool.\"\n\n\"Miss a job twice? I'll show you. That's how we learn.\"\n\n<div class=\"warn\">**Shop rule:** Ask a grown-up before you use liquids, open a computer, or touch someone else's computer.</div>\n\n[[Clock in->Shop]]", "Shop": "# 📋 Work Schedule\n*Unit 1: Know Your Gear.* Finish a day to open the next one.\n\n(if: $days contains \"1\")[✅ ](else:)[📋 ][[Day 1: Know Your Machine->D1 Start]]\n(if: $days's length >= 1)[(if: $days contains \"2\")[✅ ](else:)[📋 ][[Day 2: Your Cleaning Kit->D2 Start]]](else:)[🔒 Day 2: Your Cleaning Kit]\n(if: $days's length >= 2)[(if: $days contains \"3\")[✅ ](else:)[📋 ][[Day 3: Keyboard Cleaning Day->D3 Start]]](else:)[🔒 Day 3: Keyboard Cleaning Day]\n(if: $days's length >= 3)[(if: $days contains \"4\")[✅ ](else:)[📋 ][[Day 4: Meet the Mice->D4 Start]]](else:)[🔒 Day 4: Meet the Mice]\n(if: $days's length >= 4)[(if: $days contains \"5\")[✅ ](else:)[📋 ][[Day 5: Mouse Service Day->D5 Start]]](else:)[🔒 Day 5: Mouse Service Day]\n(if: $days's length >= 5)[(if: $days contains \"6\")[✅ ](else:)[📋 ][[Day 6: Comfort Check->D6 Start]]](else:)[🔒 Day 6: Comfort Check]\n\n---\n(if: $days's length >= 6)[🎓 [[The Inspector's Unit 1 Exam->Exam Start]]](else:)[🔒 The Inspector's Unit 1 Exam: *finish all 6 days to unlock*]", "Toolbox": "# 🧰 Your Toolbox\nEach day you finish earns a tool.\n\n(if: $days contains \"1\")[🔦 **Port Map**: Day 1, Know Your Machine](else:)[▫️ *Earned on Day 1*]\n(if: $days contains \"2\")[🧽 **Cleaning Kit**: Day 2, Your Cleaning Kit](else:)[▫️ *Earned on Day 2*]\n(if: $days contains \"3\")[🧹 **Keycap Puller**: Day 3, Keyboard Cleaning Day](else:)[▫️ *Earned on Day 3*]\n(if: $days contains \"4\")[🖱️ **Mouse Field Guide**: Day 4, Meet the Mice](else:)[▫️ *Earned on Day 4*]\n(if: $days contains \"5\")[🪛 **Service Kit**: Day 5, Mouse Service Day](else:)[▫️ *Earned on Day 5*]\n(if: $days contains \"6\")[🪑 **Posture Pro Badge**: Day 6, Comfort Check](else:)[▫️ *Earned on Day 6*]\n\n[[Back to the work schedule->Shop]]", "D1 Start": "(set: $miss to 0)# Day 1: Know Your Machine\n\n<div class=\"scene\">💻 🖥️ 🔌</div>\n\n*The Inspector taps the machines on her bench.* \"You can't fix what you can't name. Let's meet them.\"\n\n\n[[Open the shop->D1 L1]]", "D1 L1": "## 📘 The Inspector's lesson: Four Kinds of Computers\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Laptop\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"53\" width=\"20\" height=\"4\" rx=\"1\" fill=\"#5a636c\"/></svg><b>Laptop</b>folds shut, all in one case</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Desktop\"><rect x=\"4\" y=\"8\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"8\" y=\"12\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"28\" y=\"46\" width=\"8\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"18\" y=\"56\" width=\"28\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/><rect x=\"70\" y=\"10\" width=\"24\" height=\"52\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><circle cx=\"82\" cy=\"20\" r=\"3\" fill=\"#6fe3b5\"/><line x1=\"75\" y1=\"32\" x2=\"89\" y2=\"32\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"75\" y1=\"38\" x2=\"89\" y2=\"38\" stroke=\"#ffb347\" stroke-width=\"2\"/></svg><b>Desktop</b>the tower is the computer</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"All-in-one\"><rect x=\"14\" y=\"4\" width=\"72\" height=\"46\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"4\"/><rect x=\"19\" y=\"9\" width=\"62\" height=\"36\" fill=\"#2f4a5c\"/><polygon points=\"44,50 56,50 60,62 40,62\" fill=\"#9aa4ae\"/><rect x=\"34\" y=\"62\" width=\"32\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/></svg><b>All-in-one</b>computer inside the screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Chromebook\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"7\" fill=\"#7fd1ff\"/><rect x=\"29\" y=\"12\" width=\"14\" height=\"5\" rx=\"1\" fill=\"#e9ecef\"/><circle cx=\"44\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><circle cx=\"51\" cy=\"27\" r=\"7\" fill=\"#e9ecef\"/><circle cx=\"58\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><rect x=\"44\" y=\"30\" width=\"14\" height=\"5\" fill=\"#e9ecef\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/></svg><b>Chromebook</b>apps in the browser, files online</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"The <b>golden rule</b>. No zaps. Dirt is easy to see on a dark screen.\"><rect x=\"20\" y=\"20\" width=\"80\" height=\"54\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"25\" y=\"25\" width=\"70\" height=\"44\" fill=\"#111\"/><path d=\"M52.3 41.3 A11 11 0 1 0 67.7 41.3\" stroke=\"#ff6b6b\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"36\" x2=\"60\" y2=\"47\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"220\" y=\"26\" width=\"30\" height=\"40\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"229\" y=\"38\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"238\" y=\"38\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"160\" y=\"35\" width=\"24\" height=\"22\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"184\" y=\"39\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"184\" y=\"50\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"160\" y1=\"46\" x2=\"144\" y2=\"46\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"196\" y1=\"87\" x2=\"160\" y2=\"87\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"160,87 167.0,83.2 167.0,90.8\" fill=\"#ffb347\"/><rect x=\"300\" y=\"20\" width=\"80\" height=\"54\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"305\" y=\"25\" width=\"70\" height=\"44\" fill=\"#111\"/><rect x=\"320\" y=\"38\" width=\"40\" height=\"22\" rx=\"6\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M363 18 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"60\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">1. Turn it off</text><text x=\"200\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">2. Unplug it</text><text x=\"340\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Then clean</text><text x=\"200\" y=\"142\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Every time!</text></svg><div class=\"cap\">The <b>golden rule</b>. No zaps. Dirt is easy to see on a dark screen.</div></div>\n\nOn a desktop, the monitor is **just a screen**.\n\n[[Got it. Send in the next customer->D1 J2]]", "D1 J2": "<div class=\"scene\">🖥️ 🌬️ 🔌</div>\n\n**Mr. Chen** has a big screen. No tower. The back of the screen has vents and its own power cord.\n\n**What kind of computer is it?**\n\n* [[A desktop that just lost its tower->D1 J2 W]]\n* [[A Chromebook with its lid open->D1 J2 W]]\n* [[An all-in-one, PC inside the screen->D1 J2 R]]\n* [[A laptop that has lost its keyboard->D1 J2 W]]", "D1 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The computer is inside the screen. That's an **all-in-one**.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the four computer cards. Where can the computer hide?\"\n\n[[Try again->D1 J2]]]", "D1 J2 R": "(set: $miss to 0)## ✅ Job done\n**All-in-one.** Vents and a power cord on the screen mean the computer is inside it.\n\n[[Next customer->D1 J3]]", "D1 J3": "<div class=\"scene\">🖥️ 😟 <line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg></div>\n\n**Mr. Ruiz** brings in his monitor. \"My computer won't turn on!\" A tall case with a power button sits under his desk.\n\n**What should he bring in?**\n\n* [[Nothing more, the screen is the PC->D1 J3 W]]\n* [[The keyboard, since it is the brain->D1 J3 W]]\n* [[The power strip that sits under it->D1 J3 W]]\n* [[The tower, because that is the PC->D1 J3 R]]", "D1 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"On a desktop, the **tower** is the computer. The monitor is just a screen.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the desktop card. Which part is the computer?\"\n\n[[Try again->D1 J3]]]", "D1 J3 R": "(set: $miss to 0)## ✅ Job done\n**The tower.** Tip: check that its power cord is in and its back switch is on.\n\n[[Next customer->D1 J4]]", "D1 J4": "<div class=\"scene\">💻 🔌 💧</div>\n\n**Oscar** wipes his laptop screen with a wet paper towel. The laptop is on and plugged in.\n\n**What should Oscar do first?**\n\n* [[Turn the brightness up to see dirt->D1 J4 W]]\n* [[Wipe fast so water can't soak in->D1 J4 W]]\n* [[Add window cleaner to the towel->D1 J4 W]]\n* [[Turn it off and then unplug it->D1 J4 R]]", "D1 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Golden rule: **turn it off and unplug it first.**\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the golden rule picture again.\"\n\n[[Try again->D1 J4]]]", "D1 J4 R": "(set: $miss to 0)## ✅ Job done\n**Off and unplugged, every time.** Tomorrow: why paper towels stay away from screens.\n\n[[The Inspector has something to show you->D1 L5]]", "D1 L5": "## 📘 The Inspector's lesson: The Port Tour\n\n\"Ports are the holes where plugs go. Learn their shapes.\"\n\n<div class=\"ports\"><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"8\" y=\"10\" width=\"44\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"12\" y=\"14\" width=\"36\" height=\"6\" fill=\"#ffb347\"/></svg><figcaption><b>USB-A</b>flat rectangle, one way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"12\" y=\"13\" width=\"36\" height=\"14\" rx=\"7\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"19\" y=\"18\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#ffb347\"/></svg><figcaption><b>USB-C</b>small oval, either way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V22 L46 28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"14\" y=\"16\" width=\"32\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>HDMI</b>two slanted corners</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"16\" y=\"16\" width=\"30\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>DisplayPort</b>one slanted corner</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M16 7 H44 V29 H36 V34 H24 V29 H16 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><g stroke=\"#ffb347\" stroke-width=\"2\"><line x1=\"21\" y1=\"11\" x2=\"21\" y2=\"16\"/><line x1=\"26\" y1=\"11\" x2=\"26\" y2=\"16\"/><line x1=\"31\" y1=\"11\" x2=\"31\" y2=\"16\"/><line x1=\"36\" y1=\"11\" x2=\"36\" y2=\"16\"/><line x1=\"40\" y1=\"11\" x2=\"40\" y2=\"16\"/></g></svg><figcaption><b>Ethernet</b>square, cable has a clip</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"5\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2\" fill=\"#1b1f24\"/></svg><figcaption><b>Headphone jack</b>tiny round hole, no pin</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"6\" y=\"17\" width=\"48\" height=\"6\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/></svg><figcaption><b>SD card slot</b>long thin slot</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"12\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2.5\" fill=\"#ffb347\"/></svg><figcaption><b>Barrel charger</b>big round hole with a pin</figcaption></figure></div>\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">📺</span><b>HDMI</b>picture + sound to a TV</div><div class=\"card \"><span class=\"big\">🖥️</span><b>DisplayPort</b>mostly for monitors</div><div class=\"card \"><span class=\"big\">🔋</span><b>USB-C</b>charge, files, often video</div><div class=\"card \"><span class=\"big\">🌐</span><b>Ethernet</b>wired internet, steadier than Wi-Fi</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Won't fit? <b>Flip it.</b> Check the shape. Never force it.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Straight + gentle</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Pushed hard</text><rect x=\"140\" y=\"58\" width=\"40\" height=\"24\" rx=\"2\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/><rect x=\"146\" y=\"63\" width=\"30\" height=\"7\" fill=\"#ffb347\"/><rect x=\"36\" y=\"56\" width=\"44\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"80\" y=\"60\" width=\"36\" height=\"20\" fill=\"#c8cfd6\"/><rect x=\"84\" y=\"71\" width=\"28\" height=\"5\" fill=\"#ff "middle\" font-weight=\"normal\">Tasha's cable</text><text x=\"285\" y=\"102\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the plug end, up close</text></svg><div class=\"cap\">Look at the shape of the plug end. Which port matches it?</div></div>\n\n**Tasha** wants a movie on her TV. Her cable's plug is wide and flat, with two slanted corners.\n\n**Which port does it go in?**\n\n* [[HDMI, the port for TVs and screens->D1 J6 R]]\n* [[USB-C, the small oval-shaped port->D1 J6 W]]\n* [[The small, round headphone jack->D1 J6 W]]\n* [[Ethernet, the square port with a clip->D1 J6 W]]", "D1 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **HDMI**. It sends picture and sound to a TV.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two slanted corners. Look at the port cards again.\"\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**HDMI.** Wide and flat with two slanted corners.\n\n[[Next customer->D1 J7]]", "D1 J7": "<div class=\"scene\"><svg viewBox=\"0 0 64 40\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"USB flash drive\"><rect x=\"2\" y=\"8\" width=\"38\" height=\"24\" rx=\"6\" fill=\"#6b5a8e\"/><circle cx=\"12\" cy=\"20\" r=\"3\" fill=\"#1b1f24\"/><rect x=\"40\" y=\"11\" width=\"22\" height=\"18\" fill=\"none\" stroke=\"#c9d1d9\" stroke-width=\"3\"/><rect x=\"42\" y=\"13\" width=\"18\" height=\"6\" fill=\"#c9d1d9\"/></svg> 💻 💪</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"Look at where the flat bar is inside the plug, and inside the port.\"><rect x=\"12\" y=\"44\" width=\"88\" height=\"40\" rx=\"9\" fill=\"#6b5a8e\"/><rect x=\"100\" y=\"51\" width=\"46\" height=\"26\" fill=\"none\" stroke=\"#c9d1d9\" stroke-width=\"3\"/><rect x=\"103\" y=\"54\" width=\"40\" height=\"9\" fill=\"#c9d1d9\"/><line x1=\"152\" 1 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the adapter picture again.\"\n\n[[Try again->D1 J8]]]", "D1 J8 R": "(set: $miss to 0)## ✅ Job done\n**An adapter or hub.** Never force a plug into the wrong shape.\n\n[[Next customer->D1 J9]]", "D1 J9": "<div class=\"scene\">📶 🎮 🧊</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"A square port with a clip notch at the bottom.\"><rect x=\"10\" y=\"26\" width=\"160\" height=\"74\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><path d=\"M64 42 H112 V80 H98 V88 H78 V80 H64 Z\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><line x1=\"72\" y1=\"48\" x2=\"72\" y2=\"58\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><line x1=\"80\" y1=\"48\" x2=\"80\" y2=\"58\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><line x1=\"88\" y1=\"48\" x2=\"88\" y2=\"58\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><line x1=\"96\" y1=\"48\" x2=\"96\" y2=\"58\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><line x1=\"104\" y1=\"48\" x2=\"104\" y2=\"58\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><rect x=\"230\" y=\"62\" width=\"100\" height=\"30\" rx=\"6\" fill=\"#4a535d\"/><line x1=\"250\" y1=\"62\" x2=\"244\" y2=\"34\" stroke=\"#8a96a3\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"310\" y1=\"62\" x2=\"316\" y2=\"34\" stroke=\"#8a96a3\" stroke-width=\"4\" stroke-linecap=\"round\"/><circle cx=\"250\" cy=\"80\" r=\"3\" fill=\"#6fe3b5\"/><circle cx=\"265\" cy=\"80\" r=\"3\" fill=\"#6fe3b5\"/><circle cx=\"280\" cy=\"80\" r=\"3\" fill=\"#6fe3b5\"/><circle cx=\"295\" cy=\"80\" r=\"3\" fill=\"#6fe3b5\"/><circle cx=\"310\" cy=\"80\" r=\"3\" fill=\"#6fe3b5\"/><path d=\"M270 48.0 Q280 39.0 290 48.0\" stroke=\"#7fd1ff\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M262 46.4 Q280 30.2 298 46.4\" stroke=\"#7fd1ff\" stroke-width=\"2.5\" fill=\"none\"/><text x=\"90\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Nora's laptop port</text><text x=\"280\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the router (by her desk)</text></svg><div class=\"cap\">A square port with a clip notch at the bottom.</div></div>\n\n**Nora's** lessons freeze when her brother games on the Wi-Fi. Her desk is by the router. Her laptop has a square port.\n\n**What could help?**\n\n* [[An Ethernet cable to the router->D1 J9 R]]\n* [[A long HDMI cable to the router->D1 J9 W]]\n* [[Headphones in the little round jack->D1 J9 W]]\n* [[An SD card in the long, thin slot->D1 J9 W]]", "D1 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"An **Ethernet** cable. Wired internet doesn't share the Wi-Fi.\"\n\n[[Got it->D1 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which card says wired internet?\"\n\n[[Try again->D1 J9]]]", "D1 J9 R": "(set: $miss to 0)## ✅ Job done\n**Ethernet.** No square port? A USB-to-Ethernet adapter works too.\n\n[[The Inspector has something to show you->D1 L10]]", "D1 L10": "## 📘 The Inspector's lesson: Vents and Power\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>Vents</b> are slots or grilles. A <b>fan</b> pulls cool air in and pushes hot air out.\"><text x=\"200\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Bottom of a laptop</text><rect x=\"100\" y=\"30\" width=\"200\" height=\"110\" rx=\"10\" fill=\"#3a434d\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"150\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"162\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"174\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"186\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"198\" y=\"50\" width=\"6\" hei ll=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">to stay safe</text></svg><div class=\"cap\">Beds, pillows, blankets, and laps block vents. Use a hard, flat surface.</div></div>\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Laptop\"><rect x=\"30\" y=\"20\" width=\"40\" height=\"28\" rx=\"5\" fill=\"#9aa4ae\"/><line x1=\"30\" y1=\"34\" x2=\"6\" y2=\"34\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"70\" y1=\"34\" x2=\"96\" y2=\"34\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><path d=\"M45.1 31.1 A7 7 0 1 0 54.9 31.1\" stroke=\"#1b1f24\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"27\" x2=\"50\" y2=\"34\" stroke=\"#1b1f24\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>Laptop</b>charger brick on the cord</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Desktop\"><rect x=\"30\" y=\"4\" width=\"40\" height=\"62\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"34\" y=\"42\" width=\"32\" height=\"20\" fill=\"#3a434d\"/><circle cx=\"50\" cy=\"52\" r=\"8\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><ellipse cx=\"50\" cy=\"48.0\" rx=\"1.76\" ry=\"3.6\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(0 50 52)\"/><ellipse cx=\"50\" cy=\"48.0\" rx=\"1.76\" ry=\"3.6\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(90 50 52)\"/><ellipse cx=\"50\" cy=\"48.0\" rx=\"1.76\" ry=\"3.6\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(180 50 52)\"/><ellipse cx=\"50\" cy=\"48.0\" rx=\"1.76\" ry=\"3.6\" fill=\"#7fd1ff\" opacity=\"0.85\" transform=\"rotate(270 50 52)\"/><circle cx=\"50\" cy=\"52\" r=\"1.6\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2\"/></svg><b>Desktop</b>power box in the tower, with a fan</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Laptop battery\"><rect x=\"22\" y=\"20\" width=\"52\" height=\"30\" rx=\"4\" fill=\"none\" stroke=\"#6fe3b5\" s  sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Find every **port** and **vent** on your computer. Name each port. Draw a map or take photos. Which vents are on the bottom? A soft surface could block those.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### The Port Tour\n\"Ports are the holes where plugs go. Learn their shapes.\"\n\n<div class=\"ports\"><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"8\" y=\"10\" width=\"44\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"12\" y=\"14\" width=\"36\" height=\"6\" fill=\"#ffb347\"/></svg><figcaption><b>USB-A</b>flat rectangle, one way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"12\" y=\"13\" width=\"36\" height=\"14\" rx=\"7\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"19\" y=\"18\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#ffb347\"/></svg><figcaption><b>USB-C</b>small oval, either way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V22 L46 28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"14\" y=\"16\" width=\"32\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>HDMI</b>two slanted corners</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"16\" y=\"16\" width=\"30\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>DisplayPort</b>one slanted corner</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M16 7 H44 V29 H36 V34 H24 V29 H16 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><g stroke=\"#ffb347\" stroke-width=\"2\"><line x1=\"21\" y1=\"11\" x2=\"21\" y2=\"16\"/><line x1=\"26\" y1=\"11\" x2=\"26\" y2=\"16\"/><line x1=\"31\" y1=\"11\" x2=\"31\" y2=\"16\"/><line x1=\"36\" y1=\"11\" x2=\"36\" y2=\"16\"/><line x1=\"40\" y1=\"11\" x2=\"40\" y2=\"16\"/></g></svg><figcaption><b>Ethernet</b>square, cable has a clip</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"5\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2\" fill=\"#1b1f24\"/></svg><figcaption><b>Headphone jack</b>tiny round hole, no pin</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"6\" y=\"17\" width=\"48\" height=\"6\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/></svg><figcaption><b>SD card slot</b>long thin slot</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"12\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2.5\" fill=\"#ffb347\"/></svg><figcaption><b>Barrel charger</b>big round hole with a pin</figcaption></figure></div>\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">📺</span><b>HDMI</b>picture + sound to a TV</div><div class=\"card \"><span class=\"big\">🖥️</span><b>DisplayPort</b>mostly for monitors</div><div class=\"card \"><span class=\"big\">🔋</span><b>USB-C</b>charge, files, often video</div><div class=\"card \"><span class=\"big\">🌐</span><b>Ethernet</b>wired internet, steadier than Wi-Fi</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Won't fit? <b>Flip it.</b> Check the shape. Never force it.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Straight + gentle</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Pushed hard</text><rect x=\"140\" y=\"58\" width=\"40\" height=\"2 " font-weight=\"bold\">use...</text><text x=\"95\" y=\"52\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Paper towel</text><line x1=\"172\" y1=\"47\" x2=\"206\" y2=\"47\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,47 199.0,50.8 199.0,43.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"52\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Microfiber</text><text x=\"95\" y=\"90\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Window cleaner</text><line x1=\"172\" y1=\"85\" x2=\"206\" y2=\"85\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,85 199.0,88.8 199.0,81.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"90\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Distilled water</text><text x=\"95\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Scratchy sponge</text><line x1=\"172\" y1=\"123\" x2=\"206\" y2=\"123\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,123 199.0,126.8 199.0,119.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Cloth + alcohol</text><text x=\"95\" y=\"166\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Home vacuum</text><line x1=\"172\" y1=\"161\" x2=\"206\" y2=\"161\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,161 199.0,164.8 199.0,157.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"166\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Air + soft brush</text></svg><div class=\"cap\">Every bad tool has a safe swap.</div></div>\n\n\"Now sort the bin. Safe, or keep away?\"\n\n[[Got it. Send in the next customer->D2 S1]]", "D2 S1": "## Sorting the bin: item 1 of 8\n\n*The Inspector holds up:*\n\n### Microfiber cloth\n\n* [[✅ Safe for the kit->D2 S1 R]]\n* [[⛔ Keep it away->D2 S1 W]]", "D2 S1 R": "## ✅ Right: it belongs in the kit\n**Microfiber cloth.** Soft, no fuzz, and it grabs dust.\n\n[[Next item->D2 S2]]", "D2 S1 W": "## ❌ Not this time: it belongs in the kit\n**Microfiber cloth.** Soft, no fuzz, and it grabs dust.\n\n[[Next item->D2 S2]]", "D2 S2": "## Sorting the bin: item 2 of 8\n\n*The Inspector holds up:*\n\n### Paper towels\n\n* [[✅ Safe for the kit->D2 S2 W]]\n* [[⛔ Keep it away->D2 S2 R]]", "D2 S2 R": "## ✅ Right: it stays out of the kit\n**Paper towels.** They can scratch and leave fuzz.\n\n[[Next item->D2 S3]]", "D2 S2 W": "## ❌ Not this time: it stays out of the kit\n**Paper towels.** They can scratch and leave fuzz.\n\n[[Next item->D2 S3]]", "D2 S3": "## Sorting the bin: item 3 of 8\n\n*The Inspector holds up:*\n\n### Window cleaner (the blue spray)\n\n* [[✅ Safe for the kit->D2 S3 W]]\n* [[⛔ Keep it away->D2 S3 R]]", "D2 S3 R": "## ✅ Right: it stays out of the kit\n**Window cleaner (the blue spray).** Its **ammonia** can hurt screens.\n\n[[Next item->D2 S4]]", "D2 S3 W": "## ❌ Not this time: it stays out of the kit\n**Window cleaner (the blue spray).** Its **ammonia** can hurt screens.\n\n[[Next item->D2 S4]]", "D2 S4": "## Sorting the bin: item 4 of 8\n\n*The Inspector holds up:*\n\n### 70% isopropyl alcohol\n\n* [[✅ Safe for the kit->D2 S4 R]]\n* [[⛔ Keep it away->D2 S4 W]]", "D2 S4 R": "## ✅ Right: it belongs in the kit\n**70% isopropyl alcohol.** It kills germs on a cloth, with a grown-up.\n\n[[Next item->D2 S5]]", "D2 S4 W": "## ❌ Not this time: it belongs in the kit\n**70% isopropyl alcohol.** It kills germs on a cloth, with a grown-up.\n\n[[Next item->D2 S5]]", "D2 S5": "## Sorting the bin: item 5 of 8\n\n*The Inspector holds up:*\n\n### Household vacuum cleaner\n\n* [[✅ Safe for the kit->D2 S5 W]]\n* [[⛔ Keep it away->D2 S5 R]]", "D2 S5 R": "## ✅ Right: it stays out of the kit\n**Household vacuum cleaner.** It can rip off keys and zap with static.\n\n[[Next item->D2 S6]]", "D2 S5 W": "## ❌ Not this time: it stays out of the kit\n**Household vacuum cleaner.** It can rip off keys and zap with static.\n\n[[Next item->D2 S6]]", "D2 S6": "## Sorting the bin: item 6 of 8\n\n*The Inspector holds up:*\n\n### Compressed air can\n\n* [[✅ Safe for the kit->D2 S6 R]]\n* [[⛔ Keep it away->D2 S6 W]]", "D2 S6 R": "## ✅ Right: it belongs in the kit\n**Compressed air can.** It blows out dust when held **upright**.\n\n[[Next item->D2 S7]]", "D2 S6 W": "## ❌ Not this time: it belongs in the kit\n**Compressed air can.** It blows out dust when held **upright**.\n\n[[Next item->D2 S7]]", "D2 S7": "## Sorting the bin: item 7 of 8\n\n*The Inspector holds up:*\n\n### Distilled water\n\n* [[✅ Safe for the kit->D2 S7 R]]\n* [[⛔ Keep it away->D2 S7 W]]", "D2 S7 R": "## ✅ Right: it belongs in the kit\n**Distilled water.** No minerals, so no white spots.\n\n[[Next item->D2 S8]]", "D2 S7 W": "## ❌ Not this time: it belongs in the kit\n**Distilled water.** No minerals, so no white spots.\n\n[[Next item->D2 S8]]", "D2 S8": "## Sorting the bin: item 8 of 8\n\n*The Inspector holds up:*\n\n### Bleach wipes\n\n* [[✅ Safe for the kit->D2 S8 W]]\n* [[⛔ Keep it away->D2 S8 R]]", "D2 S8 R": "## ✅ Right: it stays out of the kit\n**Bleach wipes.** It is too harsh and fades key letters.\n\n[[Next customer->D2 J4]]", "D2 S8 W": "## ❌ Not this time: it stays out of the kit\n**Bleach wipes.** It is too harsh and fades key letters.\n\n[[Next customer->D2 J4]]", "D2 J4": "<div class=\"scene\">🤧 🧴 ⌨️</div>\n\n**Ms. Abara** wants to kill germs on her laptop keys. She aims the alcohol spray right at them.\n\n**What's the right way?**\n\n* [[Spray a light mist on all the keys->D2 J4 W]]\n* [[Pour a little into the key gaps->D2 J4 W]]\n* [[Wet a cloth first, then wipe->D2 J4 R]]\n* [[Spray it, then close the lid->D2 J4 W]]", "D2 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Liquid goes on the cloth, never on the device.** Spray drips under the keys.\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the liquid rule picture again.\n\n[[Try again->D2 J4]]]", "D2 J4 R": "(set: $miss to 0)## ✅ Job done\n**Wet the cloth, then wipe.**\n\n[[Next customer->D2 J5]]", "D2 J5": "<div class=\"scene\">💨 🙃 ❄️</div>\n\n**Leo** holds the air can upside down. A frosty white spray shoots out.\n\n**What went wrong?**\n\n* [[Tipping the can sprays icy liquid->D2 J5 R]]\n* [[The can is empty and spraying dust->D2 J5 W]]\n* [[Dust turns white when it is blasted->D2 J5 W]]\n* [[He forgot to shake the can hard->D2 J5 W]]", "D2 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Keep it **upright**. Tipped over, it sprays **icy liquid**, not air.\"\n\n[[Got it->D2 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the tipped-over can picture again.\n\n[[Try again->D2 J5]]]", "D2 J5 R": "(set: $miss to 0)## ✅ Job done\n**Tipping the can sprays freezing liquid.**\n\n[[Next customer->D2 J6]]", "D2 J6": "<div class=\"scene\">💧 🖥️ ⚪</div>\n\n**Kai** wiped his screen with tap water. Now it has white spots.\n\n**What should he use next time?**\n\n* [[Hot tap water, so it dries fast->D2 J6 W]]\n* [[Window cleaner, to get the spots->D2 J6 W]]\n* [[Fizzy water, so bubbles lift dirt->D2 J6 W]]\n* [[Distilled water on microfiber->D2 J6 R]]", "D2 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Tap water has **minerals**. **Distilled water** does not, so no spots.\"\n\n[[Got it->D2 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the water card again.\n\n[[Try again->D2 J6]]]", "D2 J6 R": "(set: $miss to 0)## ✅ Job done\n**Distilled water on a barely damp microfiber cloth.**\n\n[[Next customer->D2 J7]]", "D2 J7": "<div class=\"scene\">🍯 💻 🧽</div>\n\n**Mia** has a sticky spot on her laptop lid. She grabs the scratchy side of a sponge.\n\n**What should she use instead?**\n\n* [[A soft cloth with some alcohol->D2 J7 R]]\n* [[The soft side of the wet sponge->D2 J7 W]]\n* [[A paper towel with dish soap->D2 J7 W]]\n* [[Steel wool, rubbed very gently->D2 J7 W]]", "D2 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Scratchy pads **scratch**. A **soft cloth with a little alcohol** lifts the sticky spot.\"\n\n[[Got it->D2 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the swap picture again.\n\n[[Try again->D2 J7]]]", "D2 J7 R": "(set: $miss to 0)## ✅ Job done\n**Microfiber and a little alcohol.** No scratches.\n\n[[Next customer->D2 J8]]", "D2 J8": "<div class=\"scene\">🖥️ 🌫️ 🌪️</div>\n\n**Mr. Grant** has dusty vents on his desktop. He grabs the family vacuum.\n\n**What should he use instead?**\n\n* [[A wet cloth pushed into the vents->D2 J8 W]]\n* [[Compressed air and a soft brush->D2 J8 R]]\n* [[The vacuum on its top setting->D2 J8 W]]\n* [[A hair dryer on the hot setting->D2 J8 W]]", "D2 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Vacuums make **static**. Use **compressed air and a soft brush**.\"\n\n[[Got it->D2 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the vacuum picture again.\n\n[[Try again->D2 J8]]]", "D2 J8 R": "(set: $miss to 0)## ✅ Job done\n**Air and a brush, with the computer off and unplugged.**\n\n[[Next customer->D2 J9]]", "D2 J9": "<div class=\"scene\">🧽 💦 💻</div>\n\n**Ms. Doyle** lifts her cloth out of the water. It is dripping.\n\n**What should she do first?**\n\n* [[Wipe fast before the water drips->D2 J9 W]]\n* [[Add some window cleaner to it->D2 J9 W]]\n* [[Wring it out until barely damp->D2 J9 R]]\n* [[Hold the laptop upside down->D2 J9 W]]", "D2 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Barely damp.** If a drop comes out, it's too wet.\"\n\n[[Got it->D2 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the two cloths again.\n\n[[Try again->D2 J9]]]", "D2 J9 R": "(set: $miss to 0)## ✅ Job done\n**Wring it out until it is barely damp.**\n\n[[Next customer->D2 J10]]", "D2 J10": "<div class=\"scene\">🧺 🧽 😕</div>\n\n**Theo's** cloth was washed with fabric softener. Now it just smears.\n\n**What happened?**\n\n* [[This cloth only works one time->D2 J10 W]]\n* [[The cloth shrank in the wash->D2 J10 W]]\n* [[Softener made it too clean to work->D2 J10 W]]\n* [[Softener clogged the tiny threads->D2 J10 R]]", "D2 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Fabric softener** clogs the tiny threads. Wash it without softener.\"\n\n[[Got it->D2 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the cloth card again.\n\n[[Try again->D2 J10]]]", "D2 J10 R": "(set: $miss to 0)(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]## ✅ Job done\n**Softener clogged the threads.**\n\n[[Close up shop->D2 Done]]", "D2 Done": "(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]# Day 2 complete!\n\n<div class=\"tool\">🧽 **New tool earned: Cleaning Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Build your own cleaning kit with a grown-up. Find a microfiber cloth, a soft brush, and cotton swabs. Put away anything from the trouble bin.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### The Good Stuff\n\"Here is your kit.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Microfiber cloth\"><path d=\"M26 22 q12 -10 24 0 t24 0 v26 q-12 -10 -24 0 t-24 0 z\" fill=\"#7fd1ff\" opacity=\"0.9\"/><line x1=\"32\" y1=\"24\" x2=\"32\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"41\" y1=\"24\" x2=\"41\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"50\" y1=\"24\" x2=\"50\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"59\" y1=\"24\" x2=\"59\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"68\" y1=\"24\" x2=\"68\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><path d=\"M30 56 q20 -6 40 0\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" fill=\"none\"/></svg><b>Microfiber cloth</b>grabs dust (no softener!)</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Soft brush\"><rect x=\"44\" y=\"30\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#c98a52\"/><rect x=\"42\" y=\"22\" width=\"16\" height=\"10\" fill=\"#9aa4ae\"/><line x1=\"42\" y1=\"22\" x2=\"40\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"45\" y1=\"22\" x2=\"44\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"48\" y1=\"22\" x2=\"48\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"51\" y1=\"22\" x2=\"52\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"54\" y1=\"22\" x2=\"56\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"57\" y1=\"22\" x2=\"60\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/></svg><b>Soft brush</b>sweeps out gaps</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Cotton swabs\"><line x1=\"18\" y1=\"22\" x2=\"82\" y2=\"22\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"16\" cy=\"22\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><ellipse cx=\"84\" cy=\"22\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><line x1=\"18\" y1=\"36\" x2=\"82\" y2=\"36\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"16\" cy=\"36\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><ellipse cx=\"84\" cy=\"36\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><line x1=\"18\" y1=\"50\" x2=\"82\" y2=\"50\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"16\" cy=\"50\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><ellipse cx=\"84\" cy=\"50\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/></svg><b>Cotton swabs</b>for corners</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Compressed air\"><g transform=\"rotate(0 44 38)\"><rect x=\"30\" y=\"12\" width=\"28\" height=\"56\" rx=\"5\" fill=\"#7fd1ff\"/><rect x=\"38\" y=\"2\" width=\"12\" height=\"10\" fill=\"#9aa4ae\"/><line x1=\"50\" y1=\"6\" x2=\"74\" y2=\"-2\" stroke=\"#9aa4ae\" stroke-width=\"3\"/></g><circle cx=\"82\" cy=\"4\" r=\"3.0\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.8\"/><circle cx=\"89\" cy=\"8\" r=\"2.3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.8\"/><circle cx=\"96\" cy=\"12\" r=\"1.6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.8\"/></svg><b>Compressed air</b>upright, short puffs</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"70% alcohol\"><rect x=\"34\" y=\"20\" width=\"32\" height=\"46\" rx=\"6\" fill=\"#e9ecef\"/><rect x=\"42\" y=\"8\" width=\"16\" height=\"12\" fill=\"#ff6b6b\"/><rect x=\"34\" y=\"34\" width=\"32\" height=\"18\" fill=\"#ffb347\"/><text x=\"50\" y=\"48\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">70%</text></svg><b>70% alcohol</b>kills germs</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Distilled water\"><path d=\"M30 22 h40 v40 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 z\" fill=\"#7fd1ff\" opacity=\"0.55\"/><rect x=\"42\" y=\"10\" width=\"16\" height=\"12\" fill=\"#9aa4ae\"/><path d=\"M50 32 q-9 12 0 18 q9 -6 0 -18 z\" fill=\"#ffffff\"/></svg><b>Distilled water</b>no white spots</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 180\" role=\"img\" aria-label=\"<b>Liquid rule:</b> liquid goes on the cloth. Never on the computer.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Spray the device</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Spray the cloth</text><rect x=\"78\" y=\"60\" width=\"84\" height=\"58\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"84\" y=\"66\" width=\"72\" height=\"46\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.45\"/><rect x=\"70\" y=\"118\" width=\"100\" height=\"10\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"18\" y=\"56\" width=\"24\" height=\"40\" rx=\"5\" fill=\"#6fe3b5\"/><rect x=\"24\" y=\"44\" width=\"12\" height=\"12\" fill=\"#9aa4ae\"/><rect x=\"24\" y=\"40\" width=\"26\" height=\"7\" rx=\"2\" fill=\"#9aa4ae\"/><circle cx=\"54\" cy=\"43\" r=\"2.5\" fill=\"#7fd1ff\"/><circle cx=\"63\" cy=\"49\" r=\"2.5\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"43\" r=\"2.5\" fill=\"#7fd1ff\"/><path d=\"M100 130 q3 8 0 12 q-3 -4 0 -12 z\" fill=\"#7fd1ff\"/><path d=\"M114 130 q3 8 0 12 q-3 -4 0 -12 z\" fill=\"#7fd1ff\"/><path d=\"M128 130 q3 8 0 12 q-3 -4 0 -12 z\" fill=\"#7fd1ff\"/><line x1=\"174\" y1=\"39\" x2=\"196\" y2=\"61\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"174\" y1=\"61\" x2=\"196\" y2=\"39\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"168\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">drips get inside</text><rect x=\"222\" y=\"56\" width=\"24\" height=\"40\" rx=\"5\" fill=\"#6fe3b5\"/><rect x=\"228\" y=\"44\" width=\"12\" height=\"12\" fill=\"#9aa4ae\"/><rect x=\"228\" y=\"40\" width=\"26\" height=\" t=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"44\" y=\"12\" width=\"34\" height=\"22\" rx=\"4\" fill=\"#6fe3b5\" transform=\"rotate(-12 61 23)\"/><path d=\"M20 12 q-5 4 0 8\" stroke=\"#e9ecef\" stroke-width=\"2\" fill=\"none\"/><path d=\"M28 10 q-5 4 0 8\" stroke=\"#e9ecef\" stroke-width=\"2\" fill=\"none\"/></svg><b>4. Wipe</b>barely damp cloth</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Loose stuff first. Then wipe the top.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Wipe first</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Tap first</text><line x1=\"200\" y1=\"8\" x2=\"200\" y2=\"165\" stroke=\"#4a525c\" stroke-width=\"2\"/><rect x=\"45\" y=\"34\" width=\"110\" height=\"16\" rx=\"4\" fill=\"#6fe3b5\"/><line x1=\"100\" y1=\"52\" x2=\"100\" y2=\"64\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"100,64 96.2,57.0 103.8,57.0\" fill=\"#6fe3b5\"/><rect x=\"40\" y=\"68\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"108\" y=\"68\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"30\" y=\"118\" width=\"140\" height=\"8\" fill=\"#4a525c\"/><circle cx=\"100\" cy=\"112\" r=\"5\" fill=\"#c8a165\"/><line x1=\"162\" y1=\"44\" x2=\"178\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"162\" y1=\"60\" x2=\"178\" y2=\"44\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">crumbs go deeper</text><rect x=\"230\" y=\"42\" width=\"140\" height=\"8\" fill=\"#4a525c\"/><rect x=\"240\" y=\"50\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"308\" y=\"50\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><line x1=\"300\" y1=\"80\" x2=\"300\" y2=\"118\" stroke=\"#c8a165\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"300,118 296.2,111.0 303.8,111.0\" fill=\"#c8a165\"/><circle cx=\"300\" cy=\"126\" r=\"5\" fill=\"#c8a165\"/><path d=\"M363 100 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">crumbs fall out</text></svg><div class=\"cap\">Loose stuff first. Then wipe the top.</div></div>\n\n\"Every keyboard. Every week. In this order.\"\n\n[[Got it. Send in the next customer->D3 J3]]", "D3 J3": "<div class=\"scene\">⌨️ 🍪 🛠️</div>\n\n**Job 1: the weekly clean.** A crumby keyboard sits on the bench.\n\n**What's the very first step?**\n\n* [[Blast it with compressed air->D3 J3 W]]\n* [[Unplug it from the computer->D3 J3 R]]\n* [[Wipe the keycaps with a cloth->D3 J3 W]]\n* [[Flip it over and tap it gently->D3 J3 W]]", "D3 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Unplug it first.** Or every wipe types junk.\"\n\n[[Got it->D3 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at card 1 again.\n\n[[Try again->D3 J3]]]", "D3 J3 R": "(set: $miss to 0)## ✅ Job done\n**Unplug first, so wiping doesn't type.**\n\n[[Next customer->D3 J4]]", "D3 J4": "<div class=\"scene\">⌨️ 🔌 ❓</div>\n\nIt's unplugged now.\n\n**What's the next step?**\n\n* [[Wipe the keys with a damp cloth->D3 J4 W]]\n* [[Spray alcohol between the keys->D3 J4 W]]\n* [[Flip it over and tap it gently->D3 J4 R]]\n* [[Pull off every single keycap->D3 J4 W]]", "D3 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Flip and tap.** Let the crumbs fall out.\"\n\n[[Got it->D3 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the Wipe first / Tap first picture.\n\n[[Try again->D3 J4]]]", "D3 J4 R": "(set: $miss to 0)## ✅ Job done\n**Flip and tap gets the loose crumbs out.**\n\n[[Next customer->D3 J5]]", "D3 J5": "<div class=\"scene\">🍪 🐕 ⌨️</div>\n\nCrumbs and one dog hair fall out. \"Grandpa Leo's,\" says The Inspector.\n\n**What's next?**\n\n* [[Air between keys, then wipe->D3 J5 R]]\n* [[Wipe it, then spray water in->D3 J5 W]]\n* [[Vacuum the gaps with a home vac->D3 J5 W]]\n* [[Wash it in the dishwasher->D3 J5 W]]", "D3 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Air, then a barely damp wipe.** No vacuum. No water in the gaps.\"\n\n[[Got it->D3 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at cards 3 and 4.\n\n[[Try again->D3 J5]]]", "D3 J5 R": "(set: $miss to 0)## ✅ Job done\n**Air first, then wipe.** Done!\n\n[[The Inspector has something to show you->D3 L6]]", "D3 L6": "## 📘 The Inspector's lesson: Deep Cleaning by Type\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Photo first\"><rect x=\"22\" y=\"20\" width=\"56\" height=\"38\" rx=\"6\" fill=\"#9aa4ae\"/><rect x=\"38\" y=\"13\" width=\"20\" height=\"9\" rx=\"2\" fill=\"#9aa4ae\"/><circle cx=\"50\" cy=\"39\" r=\"12\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"3\"/></svg><b>1. Photo first</b>so caps go back right</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Keycap puller\"><polygon points=\"30,58 70,58 64,40 36,40\" fill=\"#7fd1ff\"/><path d=\"M30 60 L30 18 Q50 2 70 18 L70 60\" stroke=\"#ffb347\" stroke-width=\"3\" fill=\"none\"/ stroke=\"#4a525c\" stroke-width=\"2\"/><rect x=\"25\" y=\"62\" width=\"150\" height=\"16\" rx=\"4\" fill=\"#7fd1ff\"/><line x1=\"45\" y1=\"56\" x2=\"45\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"45,30 48.8,37.0 41.2,37.0\" fill=\"#6fe3b5\"/><line x1=\"155\" y1=\"56\" x2=\"155\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"155,30 158.8,37.0 151.2,37.0\" fill=\"#6fe3b5\"/><rect x=\"30\" y=\"104\" width=\"12\" height=\"14\" fill=\"#ffb347\"/><rect x=\"158\" y=\"104\" width=\"12\" height=\"14\" fill=\"#ffb347\"/><line x1=\"36\" y1=\"110\" x2=\"164\" y2=\"110\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><path d=\"M91 140 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"100\" y=\"160\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">slow and even</text><polygon points=\"225,92 375,62 378,76 228,106\" fill=\"#7fd1ff\"/><line x1=\"365\" y1=\"56\" x2=\"365\" y2=\"30\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"365,30 368.8,37.0 361.2,37.0\" fill=\"#ff6b6b\"/><rect x=\"230\" y=\"114\" width=\"12\" height=\"14\" fill=\"#ffb347\"/><rect x=\"358\" y=\"114\" width=\"12\" height=\"14\" fill=\"#ffb347\"/><line x1=\"236\" y1=\"120\" x2=\"320\" y2=\"96\" stroke=\"#9aa4ae\" stroke-width=\"4\"/><line x1=\"292\" y1=\"132\" x2=\"308\" y2=\"148\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"292\" y1=\"148\" x2=\"308\" y2=\"132\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"300\" y=\"162\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">bar pops out</text></svg><div class=\"cap\">Big keys (space, Shift, Enter) have a metal <b>stabilizer</b> bar under them.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🧴</span><b>✅ Sticky switch</b>cap off, alcohol swab</div><div class=\"card ok\"><span class=\"big\">💻</span><b>✅ Laptop keys</b>stay on, clean around</div><div class=\"card no\"><span class=\"big\">⌨️</span><b>❌ Keyboard body</b>never gets wet</div><div class=\"card no\"><span class=\"big\">🚰</span><b>❌ Soaking</b>never, any keyboard</div></div>\n\n[[Got it. Send in the next customer->D3 J7]]", "D3 J7": "<div class=\"scene\">💻 🍞 🔪</div>\n\n**Ben's** laptop has a crumb under the H key. He wants to pop the key off with a butter knife.\n\n**What do you tell him?**\n\n* [[Yes. All keys pop off the same way->D3 J7 W]]\n* [[Yes, but use a screwdriver instead->D3 J7 W]]\n* [[No. Clean around the key with air->D3 J7 R]]\n* [[No. Press down hard to crush it->D3 J7 W]]", "D3 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Laptop keys stay on.** The tiny clips snap.\"\n\n[[Got it->D3 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the Laptop side of the key picture.\n\n[[Try again->D3 J7]]]", "D3 J7 R": "(set: $miss to 0)## ✅ Job done\n**Laptop keys stay on, so use air around them.**\n\n[[Next customer->D3 J8]]", "D3 J8": "<div class=\"scene\">⌨️ 🧼 🫧</div>\n\n**Jordan** pulled all the keycaps off his gaming keyboard. Now he wants to wash them.\n\n**What's the smart way?**\n\n* [[Rinse the whole keyboard in the sink->D3 J8 W]]\n* [[Wash just the caps, dry a full day->D3 J8 R]]\n* [[Boil the caps in a pot of water->D3 J8 W]]\n* [[Wash the caps, put them back wet->D3 J8 W]]", "D3 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Only the caps get washed.** Then they **dry all the way**.\"\n\n[[Got it->D3 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at cards 3 and 4.\n\n[[Try again->D3 J8]]]", "D3 J8 R": "(set: $miss to 0)## ✅ Job done\n**Wash only the caps and let them dry fully.**\n\n[[Next customer->D3 J9]]", "D3 J9": "<div class=\"scene\">⌨️ 💪 😬</div>\n\n**Quinn** hooked the puller under the left end of his space bar. He's yanking it up.\n\n**What should Quinn do?**\n\n* [[Yank the right end up as well->D3 J9 W]]\n* [[Twist the space bar sideways->D3 J9 W]]\n* [[Pry harder from just one end->D3 J9 W]]\n* [[Lift it straight up and even->D3 J9 R]]", "D3 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Big keys have **stabilizers**. Lift **straight up, slow and even**.\"\n\n[[Got it->D3 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the space bar picture.\n\n[[Try again->D3 J9]]]", "D3 J9 R": "(set: $miss to 0)## ✅ Job done\n**Straight up and even, or the bar pops out.**\n\n[[Next customer->D3 J10]]", "D3 J10": "<div class=\"scene\">⌨️ 🥤 🫠</div>\n\n**Ava's** gaming keyboard W key is sticky from a soda drip.\n\n**What's a good home fix?**\n\n* [[Swab the switch with alcohol->D3 J10 R]]\n* [[Pour dish soap into the switch->D3 J10 W]]\n* [[Rinse it under the warm faucet->D3 J10 W]]\n* [[Keep typing hard on that key->D3 J10 W]]", "D3 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Unplug, cap off, **a little alcohol on a swab**. Press it. Let it dry.\"\n\n[[Got it->D3 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the Sticky switch card.\n\n[[Try again->D3 J10]]]", "D3 J10 R": "(set: $miss to 0)## ✅ Job done\n**A little alcohol melts the sugar, then dries.**\n\n[[The Inspector has something to show you->D3 L11]]", "D3 L11": "## 📘 The Inspector's lesson: Spill Emergency\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Unplug now\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"41\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x
