<title>Keycap & Co.: Computer Care 101</title>
<style>
tw-story { background: #1b1f24; color: #e9ecef; font-family: "DejaVu Sans Mono", "Courier New", monospace; font-size: 1.05em; line-height: 1.6; }
tw-passage { max-width: 42em; margin: 0 auto; }
tw-link, .enchantment-link { color: #ffb347; font-weight: bold; }
tw-link:hover, .enchantment-link:hover { color: #ffe0a8; }
h1, h2, h3 { color: #7fd1ff; font-family: "Segoe UI", "Inter", sans-serif; line-height: 1.25; }
code { background: #2a2f36; padding: 0.1em 0.35em; border-radius: 4px; color: #b8f2a2; }
.warn { border-left: 4px solid #ff6b6b; background: #2a2f36; margin: 1em 0; padding: 0.5em 1em; }
.casebar { background: #2a2f36; border: 1px dashed #7fd1ff; padding: 0.3em 0.8em; font-size: 0.85em; margin-bottom: 1em; }
.tool { background: #2a2f36; border: 1px solid #ffb347; border-radius: 8px; padding: 0.6em 1em; margin: 1em 0; }
.ports { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 1em 0; }
.port { margin: 0; background: #2a2f36; border-radius: 8px; padding: 8px; text-align: center; font-size: 0.8em; line-height: 1.3; }
.port svg { width: 72px; height: 48px; display: block; margin: 0 auto 4px; }
.port b { display: block; color: #ffb347; }
tw-passage li:has(tw-link) { margin: 0.6em 0; }
.field { border-left: 4px solid #7fd1ff; background: #22303a; padding: 0.5em 1em; margin: 1em 0; }
.pic { background: #232930; border-radius: 10px; padding: 10px; margin: 1em 0; text-align: center; }
.pic svg { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; }
.cap { font-size: 0.85em; color: #cfd6dd; margin-top: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 10px; margin: 1em 0; }
.card { background: #2a2f36; border: 2px solid #2a2f36; border-radius: 10px; padding: 8px; text-align: center; font-size: 0.8em; line-height: 1.3; }
.card .big { font-size: 2.2em; display: block; line-height: 1.2; }
.card svg { width: 96px; height: 64px; display: block; margin: 0 auto 4px; }
.card b { display: block; color: #ffb347; margin: 2px 0; }
.card.ok { border-color: #6fe3b5; } .card.no { border-color: #ff6b6b; }
.scene { font-size: 2.6em; text-align: center; letter-spacing: 0.15em; margin: 0.2em 0; }
html,body{margin:0;background:#1b1f24}
tw-story{display:block;min-height:100vh;padding:24px 16px 48px;box-sizing:border-box}
tw-passage{display:block}
tw-passage p{margin:0 0 1em}
tw-passage ul,tw-passage ol{margin:0 0 1em;padding-left:1.4em}
tw-passage li{margin:.2em 0}
tw-link{cursor:pointer;display:inline}
tw-link:focus-visible{outline:2px solid #7fd1ff;outline-offset:2px}
.warn{border-left:4px solid #ff6b6b;background:#2a2f36;margin:1em 0;padding:.5em 1em}
h1:focus,h2:focus{outline:none}
hr{border:0;border-top:1px solid #3a414a;margin:1.2em 0}
.controls{max-width:42em;margin:2em auto 0;display:flex;gap:12px;font-size:.85em}
.controls button{background:none;border:1px solid #3a414a;color:#aab4be;border-radius:6px;padding:.4em .9em;cursor:pointer;font:inherit}
.controls button:hover{color:#e9ecef;border-color:#7fd1ff}
.controls button:disabled{opacity:.35;cursor:default}
</style>
</head>

<script>
const STORY={"start": "Start", "startup": ["Init"], "header": ["Shift Bar"], "passages": {"Init": "(set: $days to (a:))(set: $miss to 0)", "Shift Bar": "<div class=\"casebar\">🛠️ Workdays done: (print: $days's length) / 6 · [[Work schedule->Shop]] · [[Toolbox->Toolbox]]</div>", "Start": "# Keycap & Co.\n## Computer Care 101 · Unit 1: Know Your Gear\n\n<div class=\"scene\">🔔 ⌨️ 🖱️ 🧰</div>\n\n*You walk into* **Keycap & Co. Repair Bench.** *The boss looks up. Everyone calls her* **The Inspector.**\n\n\"Hi, new trainee! Six workdays. Each day I teach you. Then you help customers. Each day you finish earns a tool.\"\n\n\"Miss a job twice? I'll show you. That's how we learn.\"\n\n<div class=\"warn\">**Shop rule:** Ask a grown-up before you use liquids, open a computer, or touch someone else's computer.</div>\n\n[[Clock in->Shop]]", "Shop": "# 📋 Work Schedule\n*Unit 1: Know Your Gear.* Finish a day to open the next one.\n\n(if: $days contains \"1\")[✅ ](else:)[📋 ][[Day 1: Know Your Machine->D1 Start]]\n(if: $days's length >= 1)[(if: $days contains \"2\")[✅ ](else:)[📋 ][[Day 2: Your Cleaning Kit->D2 Start]]](else:)[🔒 Day 2: Your Cleaning Kit]\n(if: $days's length >= 2)[(if: $days contains \"3\")[✅ ](else:)[📋 ][[Day 3: Keyboard Cleaning Day->D3 Start]]](else:)[🔒 Day 3: Keyboard Cleaning Day]\n(if: $days's length >= 3)[(if: $days contains \"4\")[✅ ](else:)[📋 ][[Day 4: Meet the Mice->D4 Start]]](else:)[🔒 Day 4: Meet the Mice]\n(if: $days's length >= 4)[(if: $days contains \"5\")[✅ ](else:)[📋 ][[Day 5: Mouse Service Day->D5 Start]]](else:)[🔒 Day 5: Mouse Service Day]\n(if: $days's length >= 5)[(if: $days contains \"6\")[✅ ](else:)[📋 ][[Day 6: Comfort Check->D6 Start]]](else:)[🔒 Day 6: Comfort Check]\n\n---\n(if: $days's length >= 6)[🎓 [[The Inspector's Unit 1 Exam->Exam Start]]](else:)[🔒 The Inspector's Unit 1 Exam: *finish all 6 days to unlock*]", "Toolbox": "# 🧰 Your Toolbox\nEach day you finish earns a tool.\n\n(if: $days contains \"1\")[🔦 **Port Map**: Day 1, Know Your Machine](else:)[▫️ *Earned on Day 1*]\n(if: $days contains \"2\")[🧽 **Cleaning Kit**: Day 2, Your Cleaning Kit](else:)[▫️ *Earned on Day 2*]\n(if: $days contains \"3\")[🧹 **Keycap Puller**: Day 3, Keyboard Cleaning Day](else:)[▫️ *Earned on Day 3*]\n(if: $days contains \"4\")[🖱️ **Mouse Field Guide**: Day 4, Meet the Mice](else:)[▫️ *Earned on Day 4*]\n(if: $days contains \"5\")[🪛 **Service Kit**: Day 5, Mouse Service Day](else:)[▫️ *Earned on Day 5*]\n(if: $days contains \"6\")[🪑 **Posture Pro Badge**: Day 6, Comfort Check](else:)[▫️ *Earned on Day 6*]\n\n[[Back to the work schedule->Shop]]", "D1 Start": "(set: $miss to 0)# Day 1: Know Your Machine\n\n<div class=\"scene\">💻 🖥️ 🔌</div>\n\n*The Inspector taps the machines on her bench.* \"You can't fix what you can't name. Let's meet them.\"\n\n\n[[Open the shop->D1 L1]]", "D1 L1": "## 📘 The Inspector's lesson: Four Kinds of Computers\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Laptop\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"53\" width=\"20\" height=\"4\" rx=\"1\" fill=\"#5a636c\"/></svg><b>Laptop</b>folds shut, all in one case</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Desktop\"><rect x=\"4\" y=\"8\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"8\" y=\"12\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"28\" y=\"46\" width=\"8\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"18\" y=\"56\" width=\"28\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/><rect x=\"70\" y=\"10\" width=\"24\" height=\"52\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><circle cx=\"82\" cy=\"20\" r=\"3\" fill=\"#6fe3b5\"/><line x1=\"75\" y1=\"32\" x2=\"89\" y2=\"32\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"75\" y1=\"38\" x2=\"89\" y2=\"38\" stroke=\"#ffb347\" stroke-width=\"2\"/></svg><b>Desktop</b>the tower is the computer</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"All-in-one\"><rect x=\"14\" y=\"4\" width=\"72\" height=\"46\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"4\"/><rect x=\"19\" y=\"9\" width=\"62\" height=\"36\" fill=\"#2f4a5c\"/><polygon points=\"44,50 56,50 60,62 40,62\" fill=\"#9aa4ae\"/><rect x=\"34\" y=\"62\" width=\"32\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/></svg><b>All-in-one</b>computer inside the screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Chromebook\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"7\" fill=\"#7fd1ff\"/><rect x=\"29\" y=\"12\" width=\"14\" height=\"5\" rx=\"1\" fill=\"#e9ecef\"/><circle cx=\"44\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><circle cx=\"51\" cy=\"27\" r=\"7\" fill=\"#e9ecef\"/><circle cx=\"58\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><rect x=\"44\" y=\"30\" width=\"14\" height=\"5\" fill=\"#e9ecef\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/></svg><b>Chromebook</b>apps in the browser, files online</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"The <b>golden rule</b>. No zaps. Dirt is easy to see on a dark screen.\"><rect x=\"20\" y=\"20\" width=\"80\" height=\"54\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"25\" y=\"25\" width=\"70\" height=\"44\" fill=\"#111\"/><path d=\"M52.3 41.3 A11 11 0 1 0 67.7 41.3\" stroke=\"#ff6b6b\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"36\" x2=\"60\" y2=\"47\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"220\" y=\"26\" width=\"30\" height=\"40\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"229\" y=\"38\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"238\" y=\"38\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"160\" y=\"35\" width=\"24\" height=\"22\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"184\" y=\"39\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"184\" y=\"50\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"160\" y1=\"46\" x2=\"144\" y2=\"46\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"196\" y1=\"87\" x2=\"160\" y2=\"87\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"160,87 167.0,83.2 167.0,90.8\" fill=\"#ffb347\"/><rect x=\"300\" y=\"20\" width=\"80\" height=\"54\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"305\" y=\"25\" width=\"70\" height=\"44\" fill=\"#111\"/><rect x=\"320\" y=\"38\" width=\"40\" height=\"22\" rx=\"6\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M363 18 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"60\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">1. Turn it off</text><text x=\"200\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">2. Unplug it</text><text x=\"340\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Then clean</text><text x=\"200\" y=\"142\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Every time!</text></svg><div class=\"cap\">The <b>golden rule</b>. No zaps. Dirt is easy to see on a dark screen.</div></div>\n\nOn a desktop, the monitor is **just a screen**.\n\n[[Got it. Send in the next customer->D1 J2]]", "D1 J2": "<div class=\"scene\">🖥️ 🌬️ 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the back of the screen. What is built into it?\"><rect x=\"60\" y=\"8\" width=\"200\" height=\"92\" rx=\"8\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"96\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"110\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"124\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"138\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"152\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"166\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"180\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"194\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"208\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"222\" y=\"20\" width=\"7\" height=\"26\" rx=\"2\" fill=\"#1b1f24\"/><polygon points=\"146,100 174,100 182,116 138,116\" fill=\"#8a96a3\"/><rect x=\"120\" y=\"116\" width=\"80\" height=\"6\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"226\" y=\"80\" width=\"18\" height=\"12\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M244 86 C 268 86, 262 64, 282 64\" stroke=\"#5b6573\" stroke-width=\"5\" fill=\"none\"/><rect x=\"290\" y=\"53\" width=\"24\" height=\"22\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"314\" y=\"57\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"314\" y=\"68\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"290\" y1=\"64\" x2=\"274\" y2=\"64\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"326\" y=\"44\" width=\"30\" height=\"40\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"335\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"344\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><text x=\"150\" y=\"68\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Chen's screen</text><text x=\"150\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">(from the back)</text></svg><div class=\"cap\">Look at the back of the screen. What is built into it?</div></div>\n\n**Mr. Chen** has a big screen. No tower. The back of the screen has vents and its own power cord.\n\n**What kind of computer is it?**\n\n* [[A desktop that just lost its tower->D1 J2 W]]\n* [[A Chromebook with its lid open->D1 J2 W]]\n* [[An all-in-one, PC inside the screen->D1 J2 R]]\n* [[A laptop that has lost its keyboard->D1 J2 W]]", "D1 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The computer is inside the screen. That's an **all-in-one**.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the four computer cards. Where can the computer hide?\"\n\n[[Try again->D1 J2]]]", "D1 J2 R": "(set: $miss to 0)## ✅ Job done\n**All-in-one.** Vents and a power cord on the screen mean the computer is inside it.\n\n[[Next customer->D1 J3]]", "D1 J3": "<div class=\"scene\">🖥️ 😟 <svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg></div>\n\n**Mr. Ruiz** brings in his monitor. \"My computer won't turn on!\" A tall case with a power button sits under his desk.\n\n**What should he bring in?**\n\n* [[Nothing more, the screen is the PC->D1 J3 W]]\n* [[The keyboard, since it is the brain->D1 J3 W]]\n* [[The power strip that sits under it->D1 J3 W]]\n* [[The tower, because that is the PC->D1 J3 R]]", "D1 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"On a desktop, the **tower** is the computer. The monitor is just a screen.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the desktop card. Which part is the computer?\"\n\n[[Try again->D1 J3]]]", "D1 J3 R": "(set: $miss to 0)## ✅ Job done\n**The tower.** Tip: check that its power cord is in and its back switch is on.\n\n[[Next customer->D1 J4]]", "D1 J4": "<div class=\"scene\">💻 🔌 💧</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the screen and the cord.\"><rect x=\"40\" y=\"8\" width=\"120\" height=\"78\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"45\" y=\"13\" width=\"110\" height=\"68\" fill=\"#4f86a8\"/><rect x=\"52\" y=\"20\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#cfe8f5\"/><rect x=\"52\" y=\"32\" width=\"70\" height=\"6\" rx=\"2\" fill=\"#cfe8f5\"/><polygon points=\"32,90 168,90 180,106 20,106\" fill=\"#9aa4ae\"/><circle cx=\"158\" cy=\"98\" r=\"3\" fill=\"#6fe3b5\"/><rect x=\"96\" y=\"40\" width=\"44\" height=\"34\" rx=\"3\" fill=\"#f2f4f6\" transform=\"rotate(-10 118 57)\"/><path d=\"M108 80 q-4 7 0 10 q4 -3 0 -10 Z\" fill=\"#7fd1ff\"/><path d=\"M124 84 q-4 7 0 10 q4 -3 0 -10 Z\" fill=\"#7fd1ff\"/><path d=\"M138 76 q-4 7 0 10 q4 -3 0 -10 Z\" fill=\"#7fd1ff\"/><path d=\"M180 100 C 230 100, 230 64, 266 64\" stroke=\"#5b6573\" stroke-width=\"5\" fill=\"none\"/><rect x=\"282\" y=\"53\" width=\"24\" height=\"22\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"306\" y=\"57\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"306\" y=\"68\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"282\" y1=\"64\" x2=\"266\" y2=\"64\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"318\" y=\"44\" width=\"30\" height=\"40\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"327\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"336\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><text x=\"100\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Oscar's laptop</text><text x=\"300\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his charger cord</text></svg><div class=\"cap\">Look at the screen and the cord.</div></div>\n\n**Oscar** wipes his laptop screen with a wet paper towel. The laptop is on and plugged in.\n\n**What should Oscar do first?**\n\n* [[Turn the brightness up to see dirt->D1 J4 W]]\n* [[Wipe fast so water can't soak in->D1 J4 W]]\n* [[Add window cleaner to the towel->D1 J4 W]]\n* [[Turn it off and then unplug it->D1 J4 R]]", "D1 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Golden rule: **turn it off and unplug it first.**\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the golden rule picture again.\"\n\n[[Try again->D1 J4]]]", "D1 J4 R": "(set: $miss to 0)## ✅ Job done\n**Off and unplugged, every time.** Tomorrow: why paper towels stay away from screens.\n\n[[The Inspector has something to show you->D1 L5]]", "D1 L5": "## 📘 The Inspector's lesson: The Port Tour\n\n\"Ports are the holes where plugs go. Learn their shapes.\"\n\n<div class=\"ports\"><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"8\" y=\"10\" width=\"44\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"12\" y=\"14\" width=\"36\" height=\"6\" fill=\"#ffb347\"/></svg><figcaption><b>USB-A</b>flat rectangle, one way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"12\" y=\"13\" width=\"36\" height=\"14\" rx=\"7\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"19\" y=\"18\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#ffb347\"/></svg><figcaption><b>USB-C</b>small oval, either way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V22 L46 28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"14\" y=\"16\" width=\"32\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>HDMI</b>two slanted corners</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"16\" y=\"16\" width=\"30\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>DisplayPort</b>one slanted corner</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M16 7 H44 V29 H36 V34 H24 V29 H16 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><g stroke=\"#ffb347\" stroke-width=\"2\"><line x1=\"21\" y1=\"11\" x2=\"21\" y2=\"16\"/><line x1=\"26\" y1=\"11\" x2=\"26\" y2=\"16\"/><line x1=\"31\" y1=\"11\" x2=\"31\" y2=\"16\"/><line x1=\"36\" y1=\"11\" x2=\"36\" y2=\"16\"/><line x1=\"40\" y1=\"11\" x2=\"40\" y2=\"16\"/></g></svg><figcaption><b>Ethernet</b>square, cable has a clip</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"5\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2\" fill=\"#1b1f24\"/></svg><figcaption><b>Headphone jack</b>tiny round hole, no pin</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"6\" y=\"17\" width=\"48\" height=\"6\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/></svg><figcaption><b>SD card slot</b>long thin slot</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"12\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2.5\" fill=\"#ffb347\"/></svg><figcaption><b>Barrel charger</b>big round hole with a pin</figcaption></figure></div>\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">📺</span><b>HDMI</b>picture + sound to a TV</div><div class=\"card \"><span class=\"big\">🖥️</span><b>DisplayPort</b>mostly for monitors</div><div class=\"card \"><span class=\"big\">🔋</span><b>USB-C</b>charge, files, often video</div><div class=\"card \"><span class=\"big\">🌐</span><b>Ethernet</b>wired internet, steadier than Wi-Fi</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Won't fit? <b>Flip it.</b> Check the shape. Never force it.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Straight + gentle</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Pushed hard</text><rect x=\"140\" y=\"58\" width=\"40\" height=\"24\" rx=\"2\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/><rect x=\"146\" y=\"63\" width=\"30\" height=\"7\" fill=\"#ffb347\"/><rect x=\"36\" y=\"56\" width=\"44\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"80\" y=\"60\" width=\"36\" height=\"20\" fill=\"#c8cfd6\"/><rect x=\"84\" y=\"71\" width=\"28\" height=\"5\" fill=\"#ffb347\"/><line x1=\"84\" y1=\"102\" x2=\"130\" y2=\"102\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"130,102 123.0,105.8 123.0,98.2\" fill=\"#6fe3b5\"/><path d=\"M91 128 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\" 0\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">USB-A plug</text><text x=\"188\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">adapter</text><text x=\"350\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">USB-C port</text><text x=\"200\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"normal\">Need more ports? Use a hub.</text></svg><div class=\"cap\">New laptops may have <b>only USB-C</b>. An adapter or hub joins old plugs.</div></div>\n\n[[Got it. Send in the next customer->D1 J6]]", "D1 J6": "<div class=\"scene\">💻 📺 🍿</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the shape of the plug end. Which port matches it?\"><path d=\"M8 112 C 60 112, 70 60, 118 60\" stroke=\"#5b6573\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"116\" y=\"47\" width=\"40\" height=\"26\" rx=\"4\" fill=\"#4a535d\"/><rect x=\"156\" y=\"51\" width=\"22\" height=\"18\" fill=\"#c9d1d9\"/><line x1=\"184\" y1=\"60\" x2=\"218\" y2=\"60\" stroke=\"#9aa4ae\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><path d=\"M224 30 H346 V60 L330 78 H240 L224 60 Z\" fill=\"#c9d1d9\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"242\" y=\"42\" width=\"86\" height=\"12\" rx=\"2\" fill=\"#1b1f24\"/><text x=\"90\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Tasha's cable</text><text x=\"285\" y=\"102\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the plug end, up close</text></svg><div class=\"cap\">Look at the shape of the plug end. Which port matches it?</div></div>\n\n**Tasha** wants a movie on her TV. Her cable's plug is wide and flat, with two slanted corners.\n\n**Which port does it go in?**\n\n* [[HDMI, the port for TVs and screens->D1 J6 R]]\n* [[USB-C, the small oval-shaped port->D1 J6 W]]\n* [[The small, round headphone jack->D1 J6 W]]\n* [[Ethernet, the square port with a clip->D1 J6 W]]", "D1 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **HDMI**. It sends picture and sound to a TV.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two slanted corners. Look at the port cards again.\"\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**HDMI.** Wide and flat with two slanted corners.\n\n[[Next customer->D1 J7]]", "D1 J7": "<div class=\"scene\"><svg viewBox=\"0 0 64 40\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"USB flash drive\"><rect x=\"2\" y=\"8\" width=\"38\" height=\"24\" rx=\"6\" fill=\"#6b5a8e\"/><circle cx=\"12\" cy=\"20\" r=\"3\" fill=\"#1b1f24\"/><rect x=\"40\" y=\"11\" width=\"22\" height=\"18\" fill=\"none\" stroke=\"#c9d1d9\" stroke-width=\"3\"/><rect x=\"42\" y=\"13\" width=\"18\" height=\"6\" fill=\"#c9d1d9\"/></svg> 💻 💪</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"Look at where the flat bar is inside the plug, and inside the port.\"><rect x=\"12\" y=\"44\" width=\"88\" height=\"40\" rx=\"9\" fill=\"#6b5a8e\"/><rect x=\"100\" y=\"51\" width=\"46\" height=\"26\" fill=\"none\" stroke=\"#c9d1d9\" stroke-width=\"3\"/><rect x=\"103\" y=\"54\" width=\"40\" height=\"9\" fill=\"#c9d1d9\"/><line x1=\"152\" y1=\"64\" x2=\"190\" y2=\"64\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"190,64 183.0,67.8 183.0,60.2\" fill=\"#ff6b6b\"/><rect x=\"200\" y=\"24\" width=\"150\" height=\"80\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"214\" y=\"51\" width=\"46\" height=\"26\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><rect x=\"218\" y=\"54\" width=\"38\" height=\"9\" fill=\"#ffb347\"/><text x=\"78\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Marcus's flash drive</text><text x=\"275\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the flat rectangle port</text><text x=\"171\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">push!</text></svg><div class=\"cap\">Look at where the flat bar is inside the plug, and inside the port.</div></div>\n\n**Marcus** pushes a flash drive into a flat rectangle port. It won't go in. He pushes harder.\n\n**What should Marcus do?**\n\n* [[Push harder, since ports can be tight->D1 J7 W]]\n* [[Wiggle it side to side until it goes->D1 J7 W]]\n* [[Stop, flip it, and try it gently->D1 J7 R]]\n* [[Tap it in with the end of a pencil->D1 J7 W]]", "D1 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **USB-A**. It fits **one way up**. Flip it and go gently.\"\n\n[[Got it->D1 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Straight + gentle picture again.\"\n\n[[Try again->D1 J7]]]", "D1 J7 R": "(set: $miss to 0)## ✅ Job done\n**Flip it.** Forcing can bend the metal inside the port.\n\n[[Next customer->D1 J8]]", "D1 J8": "<div class=\"scene\">💻 🖱️ ❓</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"The plug and the ports are different shapes.\"><ellipse cx=\"42\" cy=\"66\" rx=\"24\" ry=\"34\" fill=\"#8a96a3\"/><line x1=\"42\" y1=\"34\" x2=\"42\" y2=\"56\" stroke=\"#1b1f24\" stroke-width=\"2\"/><path d=\"M42 32 C 42 8, 100 10, 104 58\" stroke=\"#5b6573\" stroke-width=\"5\" fill=\"none\"/><rect x=\"96\" y=\"58\" width=\"16\ ** lessons freeze when her brother games on the Wi-Fi. Her desk is by the router. Her laptop has a square port.\n\n**What could help?**\n\n* [[An Ethernet cable to the router->D1 J9 R]]\n* [[A long HDMI cable to the router->D1 J9 W]]\n* [[Headphones in the little round jack->D1 J9 W]]\n* [[An SD card in the long, thin slot->D1 J9 W]]", "D1 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"An **Ethernet** cable. Wired internet doesn't share the Wi-Fi.\"\n\n[[Got it->D1 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which card says wired internet?\"\n\n[[Try again->D1 J9]]]", "D1 J9 R": "(set: $miss to 0)## ✅ Job done\n**Ethernet.** No square port? A USB-to-Ethernet adapter works too.\n\n[[The Inspector has something to show you->D1 L10]]", "D1 L10": "## 📘 The Inspector's lesson: Vents and Power\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>Vents</b> are slots or grilles. A <b>fan</b> pulls cool air in and pushes hot air out.\"><text x=\"200\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Bottom of a laptop</text><rect x=\"100\" y=\"30\" width=\"200\" height=\"110\" rx=\"10\" fill=\"#3a434d\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"150\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"162\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"174\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"186\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"198\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"210\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"222\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"234\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"246\" y=\"50\" width=\"6\" height=\" </text><text x=\"95\" y=\"52\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Paper towel</text><line x1=\"172\" y1=\"47\" x2=\"206\" y2=\"47\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,47 199.0,50.8 199.0,43.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"52\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Microfiber</text><text x=\"95\" y=\"90\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Window cleaner</text><line x1=\"172\" y1=\"85\" x2=\"206\" y2=\"85\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,85 199.0,88.8 199.0,81.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"90\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Distilled water</text><text x=\"95\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Scratchy sponge</text><line x1=\"172\" y1=\"123\" x2=\"206\" y2=\"123\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,123 199.0,126.8 199.0,119.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Cloth + alcohol</text><text x=\"95\" y=\"166\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Home vacuum</text><line x1=\"172\" y1=\"161\" x2=\"206\" y2=\"161\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"206,161 199.0,164.8 199.0,157.2\" fill=\"#ffb347\"/><text x=\"285\" y=\"166\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Air + soft brush</text></svg><div class=\"cap\">Every bad tool has a safe swap.</div></div>\n\n\"Now sort the bin. Safe, or keep away?\"\n\n[[Got it. Send in the next customer->D2 S1]]", "D2 S1": "## Sorting the bin: item 1 of 8\n\n*The Inspector holds up:*\n\n### Microfiber cloth\n\n* [[✅ Safe for the kit->D2 S1 R]]\n* [[⛔ Keep it away->D2 S1 W]]", "D2 S1 R": "## ✅ Right: it belongs in the kit\n**Microfiber cloth.** Soft, no fuzz, and it grabs dust.\n\n[[Next item->D2 S2]]", "D2 S1 W": "## ❌ Not this time: it belongs in the kit\n**Microfiber cloth.** Soft, no fuzz, and it grabs dust.\n\n[[Next item->D2 S2]]", "D2 S2": "## Sorting the bin: item 2 of 8\n\n*The Inspector holds up:*\n\n### Paper towels\n\n* [[✅ Safe for the kit->D2 S2 W]]\n* [[⛔ Keep it away->D2 S2 R]]", "D2 S2 R": "## ✅ Right: it stays out of the kit\n**Paper towels.** They can scratch and leave fuzz.\n\n[[Next item->D2 S3]]", "D2 S2 W": "## ❌ Not this time: it stays out of the kit\n**Paper towels.** They can scratch and leave fuzz.\n\n[[Next item->D2 S3]]", "D2 S3": "## Sorting the bin: item 3 of 8\n\n*The Inspector holds up:*\n\n### Window cleaner (the blue spray)\n\n* [[✅ Safe for the kit->D2 S3 W]]\n* [[⛔ Keep it away->D2 S3 R]]", "D2 S3 R": "## ✅ Right: it stays out of the kit\n**Window cleaner (the blue spray).** Its **ammonia** can hurt screens.\n\n[[Next item->D2 S4]]", "D2 S3 W": "## ❌ Not this time: it stays out of the kit\n**Window cleaner (the blue spray).** Its **ammonia** can hurt screens.\n\n[[Next item->D2 S4]]", "D2 S4": "## Sorting the bin: item 4 of 8\n\n*The Inspector holds up:*\n\n### 70% isopropyl alcohol\n\n* [[✅ Safe for the kit->D2 S4 R]]\n* [[⛔ Keep it away->D2 S4 W]]", "D2 S4 R": "## ✅ Right: it belongs in the kit\n**70% isopropyl alcohol.** It kills germs on a cloth, with a grown-up.\n\n[[Next item->D2 S5]]", "D2 S4 W": "## ❌ Not this time: it belongs in the kit\n**70% isopropyl alcohol.** It kills germs on a cloth, with a grown-up.\n\n[[Next item->D2 S5]]", "D2 S5": "## Sorting the bin: item 5 of 8\n\n*The Inspector holds up:*\n\n### Household vacuum cleaner\n\n* [[✅ Safe for the kit->D2 S5 W]]\n* [[⛔ Keep it away->D2 S5 R]]", "D2 S5 R": "## ✅ Right: it stays out of the kit\n**Household vacuum cleaner.** It can rip off keys and zap with static.\n\n[[Next item->D2 S6]]", "D2 S5 W": "## ❌ Not this time: it stays out of the kit\n**Household vacuum cleaner.** It can rip off keys and zap with static.\n\n[[Next item->D2 S6]]", "D2 S6": "## Sorting the bin: item 6 of 8\n\n*The Inspector holds up:*\n\n### Compressed air can\n\n* [[✅ Safe for the kit->D2 S6 R]]\n* [[⛔ Keep it away->D2 S6 W]]", "D2 S6 R": "## ✅ Right: it belongs in the kit\n**Compressed air can.** It blows out dust when held **upright**.\n\n[[Next item->D2 S7]]", "D2 S6 W": "## ❌ Not this time: it belongs in the kit\n**Compressed air can.** It blows out dust when held **upright**.\n\n[[Next item->D2 S7]]", "D2 S7": "## Sorting the bin: item 7 of 8\n\n*The Inspector holds up:*\n\n### Distilled water\n\n* [[✅ Safe for the kit->D2 S7 R]]\n* [[⛔ Keep it away->D2 S7 W]]", "D2 S7 R": "## ✅ Right: it belongs in the kit\n**Distilled water.** No minerals, so no white spots.\n\n[[Next item->D2 S8]]", "D2 S7 W": "## ❌ Not this time: it belongs in the kit\n**Distilled water.** No minerals, so no white spots.\n\n[[Next item->D2 S8]]", "D2 S8": "## Sorting the bin: item 8 of 8\n\n*The Inspector holds up:*\n\n### Bleach wipes\n\n* [[✅ Safe for the kit->D2 S8 W]]\n* [[⛔ Keep it away->D2 S8 R]]", "D2 S8 R": "## ✅ Right: it stays out of the kit\n**Bleach wipes.** It is too harsh and fades key letters.\n\n[[Next customer->D2 J4]]", "D2 S8 W": "## ❌ Not this time: it stays out of the kit\n**Bleach wipes.** It is too harsh and fades key letters.\n\n[[Next customer->D2 J4]]", "D2 J4": "<div class=\"scene\">🤧 🧴 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at where the spray is going.\"><rect x=\"20\" y=\"50 ff\"/><circle cx=\"232\" cy=\"90\" r=\"3\" fill=\"#7fd1ff\"/><circle cx=\"205\" cy=\"102\" r=\"3\" fill=\"#7fd1ff\"/><text x=\"44\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her spray</text><text x=\"245\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her laptop keys</text></svg><div class=\"cap\">Look at where the spray is going.</div></div>\n\n**Ms. Abara** wants to kill germs on her laptop keys. She aims the alcohol spray right at them.\n\n**What's the right way?**\n\n* [[Spray a light mist on all the keys->D2 J4 W]]\n* [[Pour a little into the key gaps->D2 J4 W]]\n* [[Wet a cloth first, then wipe->D2 J4 R]]\n* [[Spray it, then close the lid->D2 J4 W]]", "D2 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Liquid goes on the cloth, never on the device.** Spray drips under the keys.\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the liquid rule picture again.\n\n[[Try again->D2 J4]]]", "D2 J4 R": "(set: $miss to 0)## ✅ Job done\n**Wet the cloth, then wipe.**\n\n[[Next customer->D2 J5]]", "D2 J5": "<div class=\"scene\">💨 🙃 ❄️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look at which end of the can is up.\"><g transform=\"translate(148 0) scale(-1 1)\"><g transform=\"rotate(180 74 56)\"><rect x=\"60\" y=\"30\" width=\"28\" height=\"56\" rx=\"5\" fill=\"#7fd1ff\"/><rect x=\"68\" y=\"20\" width=\"12\" height=\"10\" fill=\"#9aa4ae\"/><line x1=\"80\" y1=\"24\" x2=\"104\" y2=\"16\" stroke=\"#9aa4ae\" stroke-width=\"3\"/></g></g><polygon points=\"104,96 222,62 222,128\" fill=\"#ffffff\" opacity=\"0.35\"/><polygon points=\"104,96 200,78 200,114\" fill=\"#ffffff\" opacity=\"0.45\"/><text x=\"150\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\" \"22\" y1=\"80\" x2=\"22\" y2=\"112\" stroke=\"#7fd1ff\" stroke-width=\"3\" opacity=\"0.5\"/><line x1=\"168\" y1=\"80\" x2=\"168\" y2=\"112\" stroke=\"#7fd1ff\" stroke-width=\"3\" opacity=\"0.5\"/><path d=\"M60 70 Q62 44 91.5 42 Q130 44 130 70 Z\" fill=\"#9aa4ae\"/><line x1=\"63\" y1=\"58\" x2=\"88.0\" y2=\"58\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"215\" y=\"14\" width=\"130\" height=\"76\" rx=\"4\" fill=\"#2f4a5c\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"266.0\" y=\"90\" width=\"28\" height=\"10\" fill=\"#9aa4ae\"/><polyline points=\"232,30 300,78 248,70 322,36 270,46 330,80\" stroke=\"#ffd28a\" stroke-width=\"2\" stroke-dasharray=\"4 5\" fill=\"none\"/><polygon points=\"322,58 322,74 326,70 330,77 333,75 329,69 334,69\" fill=\"#e9ecef\" stroke=\"#1b1f24\" stroke-width=\"1\"/><text x=\"95\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mrs. Lin's glass desk</text><text x=\"280\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her cursor</text></svg><div class=\"cap\">Look at what the mouse is sitting on.</div></div>\n\n**Mrs. Lin** got a pretty glass desk. Now her cursor jumps all over.\n\n**Why?**\n\n* [[Glass blocks the mouse's radio signal->D4 J2 W]]\n* [[The mouse needs an update to use glass->D4 J2 W]]\n* [[Clear glass gives it nothing to see->D4 J2 R]]\n* [[The glass makes the mouse get too hot->D4 J2 W]]", "D4 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The mouse's eye needs bumps. **Clear glass has nothing to see.** A mouse pad fixes it.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the glass picture again.\"\n\n[[Try again->D4 J2]]]", "D4 J2 R": "(set: $miss to 0)## ✅ Job done\n**Nothing to track.** Put a mouse pad on the glass.\n\n[[Next customer->D4 J3]]", "D4 J3": "<div class=\"scene\">🗄️ 🖱️ ↕️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"The ball sits inside. Look at which way the cursor won't go.\"><ellipse cx=\"80\" cy=\"60\" rx=\"58\" ry=\"52\" fill=\"#2a2f36\" stroke=\"#8a96a3\" stroke-width=\"3\"/><circle cx=\"80\" cy=\"64\" r=\"28\" fill=\"none\" stroke=\"#8a96a3\" stroke-width=\"3\"/><circle cx=\"80\" cy=\"64\" r=\"22\" fill=\"#5b636c\"/><circle cx=\"72\" cy=\"56\" r=\"6\" fill=\"#7b848e\"/><rect x=\"200\" y=\"12\" width=\"140\" height=\"80\" rx=\"4\" fill=\"#2f4a5c\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"256.0\" y=\"92\" width=\"28\" height=\"10\" fill=\"#9aa4ae\"/><line x1=\"270\" y1=\"50\" x2=\"320\" y2=\"50\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"320,50 313.0,53.8 313.0,46.2\" fill=\"#6fe3b5\"/><line x1=\"270\" y1=\"50\" x2=\"220\" y2=\"50\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"220,50 227.0,46.2 227.0,53.8\" fill=\"#6fe3b5\"/><line x1=\"270\" y1=\"26\" x2=\"270\" y2=\"74\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-dasharray=\"4 4\"/><line x1=\"264\" y1=\"22\" x2=\"276\" y2=\"34\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"264\" y1=\"34\" x2=\"276\" y2=\"22\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"264\" y1=\"68\" x2=\"276\" y2=\"80\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"264\" y1=\"80\" x2=\"276\" y2=\"68\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"266,44 266,60 270,56 274,63 277,61 273,55 278,55\" fill=\"#e9ecef\" stroke=\"#1b1f24\" stroke-width=\"1\"/><text x=\"80\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his old mouse (bottom)</text><text x=\"270\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">what the cursor does</text></svg><div class=\"cap\">The ball sits inside. Look at which way the cursor won't go.</div></div>\n\n**Mr. Abernathy** found an old ball mouse. The cursor goes left and right. It won't go up or down.\n\n**What's wrong?**\n\n* [[The up-down roller is full of gunk->D4 J3 R]]\n* [[The computer only goes side to side->D4 J3 W]]\n* [[The rubber ball has gone totally flat->D4 J3 W]]\n* [[It needs a brand-new laser sensor->D4 J3 W]]", "D4 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**The up-down roller is gunky.** Pop out the ball and clean the rollers.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the ball mouse. Which roller does up and down?\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**Gunky roller.** Twist off the ring, take out the ball, and scrape the rollers clean.\n\n[[The Inspector has something to show you->D4 L4]]", "D4 L4": "## 📘 The Inspector's lesson: Shapes for Different Jobs\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Trackball\"><ellipse cx=\"50\" cy=\"40\" rx=\"34\" ry=\"26\" fill=\"#9aa4ae\"/><circle cx=\"56\" cy=\"38\" r=\"16\" fill=\"#ffb347\"/><circle cx=\"51\" cy=\"33\" r=\"4\" fill=\"#ffd28a\"/><rect x=\"20\" y=\"28\" width=\"9\" height=\"16\" rx=\"3\" fill=\"#1b1f24\"/></svg><b>Trackball</b>stays still. Roll the ball.</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Vertical\"><path d=\"M34 64 L34 22 Q38 4 58 8 Q72 12 70 34 L66 64 Z\" fill=\"#9aa4ae\"/><line x1=\"66\" y1=\"16\" x2=\"70\" y2=\"34\" stroke=\"#1b1f24\" stroke-width=\"2\"/><path d=\"M18 40 q-8 10 4 18\" stroke=\"#6fe3b5\" stroke-width=\"3\" fill=\"none\"/><line x1=\"20\" y1=\"56\" x2=\"28\" y2=\"58\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"28,58 20.3,60.0 22.1,52.6\" fill=\"#6fe3b5\"/></svg><b>Vertical</b>hold it like a handshake</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Gaming\"><path d=\"M28 60 Q20 30 34 12 Q50 2 66 12 Q80 30 72 60 Q50 70 28 60 Z\" fill=\"#9aa4ae\" stroke=\"#6fe3b5\" stroke-width=\"3\"/><line x1=\"50\" y1=\"6\" x2=\"50\" y2=\"30\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"47\" y=\"14\" width=\"6\" height=\"10\" rx=\"2\" fill=\"#ff6b6b\"/><rect x=\"22\" y=\"30\" width=\"7\" height=\"8\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"22\" y=\"40\" width=\"7\" height=\"8\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"50\" y=\"34\" width=\"22\" height=\"12\" rx=\"3\" fill=\"#1b1f24\"/><text x=\"61\" y=\"44\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"10\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">DPI</text></svg><b>Gaming</b>extra buttons + DPI</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Trackpad\"><rect x=\"6\" y=\"18\" width=\"88\" height=\"46\" rx=\"5\" fill=\"#9aa4ae\"/><rect x=\"30\" y=\"34\" width=\"40\" height=\"26\" rx=\"3\" fill=\"#5b636c\"/><circle cx=\"44\" cy=\"50\" r=\"4\" fill=\"#e9ecef\"/><circle cx=\"56\" cy=\"50\" r=\"4\" fill=\"#e9ecef\"/><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"6\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"50,6 53.8,13.0 46.2,13.0\" fill=\"#6fe3b5\"/></svg><b>Trackpad</b>2 fingers slide = scroll</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Drawing tablet\"><rect x=\"8\" y=\"16\" width=\"70\" height=\"48\" rx=\"5\" fill=\"#5b636c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><path d=\"M18 52 q12 -18 26 -6 t20 -10\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"92\" y1=\"4\" x2=\"66\" y2=\"38\" stroke=\"#ffb347\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"66\" y1=\"38\" x2=\"63\" y2=\"42\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>Drawing tablet</b>a pen (stylus). Press hard = thick line.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>DPI</b> = how far the cursor goes. Higher DPI = faster cursor. Nothing is broken.\"><text x=\"10\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">Same small hand move...</text><text x=\"10\" y=\"62\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"bold\">Low DPI</text><ellipse cx=\"115\" cy=\"56\" rx=\"11.200000000000001\" ry=\"16.8\" fill=\"#9aa4ae\"/><line x1=\"115\" y1=\"39.2\" x2=\"115\" y2=\"53.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"103.8\" y1=\"53.48\" x2=\"126.2\" y2=\"53.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"132\" y1=\"56\" x2=\"155\" y2=\"56\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"155,56 148.0,59.8 148.0,52.2\" fill=\"#e9ecef\"/><line x1=\"180\" y1=\"56\" x2=\"245\" y2=\"56\" stroke=\"#7fd1ff\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"245,56 238.0,59.8 238.0,52.2\" fill=\"#7fd1ff\"/><text x=\"250\" y=\"61\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"normal\">short</text><text x=\"10\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">High DPI</text><ellipse cx=\"115\" cy=\"116\" rx=\"11.200000000000001\" ry=\"16.8\" fill=\"#9aa4ae\"/><line x1=\"115\" y1=\"99.2\" x2=\"115\" y2=\"113.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"103.8\" y1=\"113.48\" x2=\"126.2\" y2=\"113.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"132\" y1=\"116\" x2=\"155\" y2=\"116\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"155,116 148.0,119.8 148.0,112.2\" fill=\"#e9ecef\"/><line x1=\"180\" y1=\"116\" x2=\"385\" y2=\"116\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"385,116 378.0,119.8 378.0,112.2\" fill=\"#ff6b6b\"/><text x=\"385\" y=\"145\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"bold\">far and fast!</text><line x1=\"168\" y1=\"34\" x2=\"168\" y2=\"150\" stroke=\"#9aa4ae\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/><text x=\"275\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">cursor moves</text></svg><div class=\"cap\"><b>DPI</b> = how far the cursor goes. Higher DPI = faster cursor. Nothing is broken.</div></div>\n\n[[Got it. Send in the next customer->D4 J5]]", "D4 J5": "<div class=\"scene\">🪑 🖱️ 💪</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Almost no room for the mouse to slide.\"><rect x=\"90\" y=\"8\" width=\"180\" height=\"104\" rx=\"6\" fill=\"#8b5a2b\" stroke=\"#5e3b1a\" stroke-width=\"3\"/><rect x=\"115\" y=\"18\" width=\"80\" height=\"48.0\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#8a96a3\" stroke-width=\"3\"/><polygon points=\"107,76.0 203,76.0 195,66.0 115,66.0\" fill=\"#8a96a3\"/><rect x=\"215\" y=\"16\" width=\"44\" height=\"54\" rx=\"3\" fill=\"#4a6fa5\"/><rect x=\"219\" y=\"20\" width=\"44\" height=\"54\" rx=\"3\" fill=\"#a5544a\"/><rect x=\"100\" y=\"80\" width=\"30\" height=\"26\" rx=\"4\" fill=\"#d9d9d9\"/><path d=\"M130 86 q8 0 8 10\" stroke=\"#d9d9d9\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"205\" cy=\"92\" rx=\"8.4\" ry=\"12.6\" fill=\"#9aa4ae\"/><line x1=\"205\" y1=\"79.4\" x2=\"205\" y2=\"90.11\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"196.6\" y1=\"90.11\" x2=\"213.4\" y2=\"90.11\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"165\" y1=\"92\" x2=\"188\" y2=\"92\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><line x1=\"222\" y1=\"92\" x2=\"262\" y2=\"92\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><text x=\"180\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Patel's tiny desk, from above</text></svg><div class=\"cap\">Almost no room for the mouse to slide.</div></div>\n\n**Mr. Patel** has a tiny desk. There's no room to slide a mouse. His shoulder gets tired.\n\n**Which mouse helps most?**\n\n* [[A gaming mouse with lots of buttons->D4 J5 W]]\n* [[A trackball that stays in one spot->D4 J5 R]]\n* [[An old ball mouse with a rubber ball->D4 J5 W]]\n* [[A bigger mouse pad for more room->D4 J5 W]]", "D4 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **trackball** stays put. Only the ball moves.\"\n\n[[Got it->D4 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the shape cards. Which one stays still?\"\n\n[[Try again->D4 J5]]]", "D4 J5 R": "(set: $miss to 0)## ✅ Job done\n**Trackball.** It needs almost no desk space and very little arm movement.\n\n[[Next customer->D4 J6]]", "D4 J6": "<div class=\"scene\">📚 🖱️ 😣</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"Look at how her hand and wrist sit.\"><rect x=\"10\" y=\"100\" width=\"340\" height=\"6\" rx=\"2\" fill=\"#8b5a2b\"/><path d=\"M150 100 Q152 74 199.5 72 Q260 74 260 100 Z\" fill=\"#9aa4ae\"/><line x1=\"153\" y1=\"88\" x2=\"194.0\" y2=\"88\" stroke=\"#1b1f24\" stroke-width=\"2\"/><path d=\"M20 74 L150 70 Q200 54 246 62 Q264 68 264 92 L254 92 Q252 80 240 76 Q200 68 160 84 L24 90 Z\" fill=\"#e0b48c\" stroke=\"#b5835a\" stroke-width=\"2\"/><line x1=\"200\" y1=\"22\" x2=\"200\" y2=\"52\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"200,52 196.2,45.0 203.8,45.0\" fill=\"#ffb347\"/><text x=\"200\" y=\"16\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">palm faces down</text><text x=\"180\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Rosa's hand on her mouse (side view)</text></svg><div class=\"cap\">Look at how her hand and wrist sit.</div></div>\n\n**Rosa's** arm aches after homework. Her palm faces flat down on the mouse.\n\n**Which mouse might feel better?**\n\n* [[A laser mouse that works on more surfaces->D4 J6 W]]\n* [[A smaller mouse that takes less room->D4 J6 W]]\n* [[A gaming mouse with a higher DPI->D4 J6 W]]\n* [[A vertical mouse held like a handshake->D4 J6 R]]", "D4 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **vertical mouse** turns your hand on its side, like a handshake.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the shape cards. Which one turns your hand?\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**Vertical mouse.** If the pain keeps going, tell a grown-up. She may need a doctor.\n\n[[Next customer->D4 J7]]", "D4 J7": "<div class=\"scene\">🎮 🖱️ 💨</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"He pressed this button. Then the cursor started zooming.\"><path d=\"M48 112 Q34 66 54 30 Q78 10 102 30 Q122 66 108 112 Q78 124 48 112 Z\" fill=\"#9aa4ae\"/><line x1=\"78\" y1=\"18\" x2=\"78\" y2=\"58\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"74\" y=\"28\" width=\"8\" height=\"14\" rx=\"3\" fill=\"#1b1f24\"/><rect x=\"70\" y=\"64\" width=\"16\" height=\"10\" rx=\"3\" fill=\"#ff6b6b\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"88\" y1=\"69\" x2=\"124\" y2=\"69\" stroke=\"#ffb347\" stroke-width=\"2\"/><text x=\"128\" y=\"74\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"start\" font-weight=\"normal\">DPI button</text><rect x=\"222\" y=\"14\" width=\"128\" height=\"76\" rx=\"4\" fill=\"#2f4a5c\" stroke=\"#9aa4ae\"  [[Make the text smaller so more will fit->D6 J2 W]]", "D6 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lift the screen with a **stand**. Then use a **separate keyboard and mouse**.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the Laptop card again.\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**A stand plus a separate keyboard.** The screen goes up. Hands stay low.\n\n[[Next customer->D6 J3]]", "D6 J3": "<div class=\"scene\">👧 💻 😵</div>\n\n**Zoe** read on her computer for an hour. Her eyes feel tired and dry.\n\n**What helps?**\n\n* [[Turn the screen brightness all the way up->D6 J3 W]]\n* [[Move the screen much closer to her eyes->D6 J3 W]]\n* [[Use the 20-20-20 rule to rest her eyes->D6 J3 R]]\n* [[Read faster so she can finish sooner->D6 J3 W]]", "D6 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The **20-20-20 rule.** Looking far away lets eyes rest.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the three 20s cards again.\n\n[[Try again->D6 J3]]]", "D6 J3 R": "(set: $miss to 0)## ✅ Job done\n**20-20-20.** We blink less at screens. Looking far away helps.\n\n[[Next customer->D6 J4]]", "D6 J4": "<div class=\"scene\">🖥️ ☀️ 😖</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"His desk, seen from above. He looks at the screen. What else is in front of him?\"><rect x=\"70\" y=\"8\" width=\"220\" height=\"120\" rx=\"6\" fill=\"none\" stroke=\"#3a424b\" stroke-width=\"3\"/><rect x=\"120\" y=\"4\" width=\"120\" height=\"10\" fill=\"#ffe08a\"/><line x1=\"132\" y1=\"18\" x2=\"126\" y2=\"34\" stroke=\"#ffe08a\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"126,34 124.9,26.1 132.1,28.8\" fill=\"#ffe08a\"/><line x1=\"180\" y1=\"18\" x2=\"180\" y2=\"34\" stroke=\"#ffe08a\" stroke-width=\"2\" stroke-linecap=\"round\
