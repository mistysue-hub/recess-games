 rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"42\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"42\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"42\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"42\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"42\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"42\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"52\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"44\" y=\"12\" width=\"34\" height=\"22\" rx=\"4\" fill=\"#6fe3b5\" transform=\"rotate(-12 61 23)\"/><path d=\"M20 12 q-5 4 0 8\" stroke=\"#e9ecef\" stroke-width=\"2\" fill=\"none\"/><path d=\"M28 10 q-5 4 0 8\" stroke=\"#e9ecef\" stroke-width=\"2\" fill=\"none\"/></svg><b>4. Wipe</b>barely damp cloth</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Loose stuff first. Then wipe the top.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Wipe first</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Tap first</text><line x1=\"200\" y1=\"8\" x2=\"200\" y2=\"165\" stroke=\"#4a525c\" stroke-width=\"2\"/><rect x=\"45\" y=\"34\" width=\"110\" height=\"16\" rx=\"4\" fill=\"#6fe3b5\"/><line x1=\"100\" y1=\"52\" x2=\"100\" y2=\"64\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"100,64 96.2,57.0 103.8,57.0\" fill=\"#6fe3b5\"/><rect x=\"40\" y=\"68\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"108\" y=\"68\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"30\" y=\"118\" width=\"140\" height=\"8\" fill=\"#4a525c\"/><circle cx=\"100\" cy=\"112\" r=\"5\" fill=\"#c8a165\"/><line x1=\"162\" y1=\"44\" x2=\"178\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"162\" y1=\"60\" x2=\"178\" y2=\"44\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">crumbs go deeper</text><rect x=\"230\" y=\"42\" width=\"140\" height=\"8\" fill=\"#4a525c\"/><rect x=\"240\" y=\"50\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"308\" y=\"50\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><line x1=\"300\" y1=\"80\" x2=\"300\" y2=\"118\" stroke=\"#c8a165\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"300,118 296.2,111.0 303.8,111.0\" fill=\"#c8a165\"/><circle cx=\"300\" cy=\"126\" r=\"5\" fill=\"#c8a165\"/><path d=\"M363 100 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">crumbs fall out</text></svg><div class=\"cap\">Loose stuff first. Then wipe the top.</div></div>\n\nCrumby keyboard? Clean it **every week**. Not crumby? **Once a month** is plenty.\n\nWipe with a cloth that is **barely damp**. Drips run into the gaps.\n\n<div class=\"warn\">**Grown-up needed** to hold the air can. Hold it **upright**. Short puffs. Never breathe it in. Never shake it.</div>\n\n\"Same four steps, in this order.\"\n\n### Spill Emergency\n<div class=\"warn\">**Tell a grown-up right away.** Wet plugs and power are not for kids. Then shut down the computer. On a desktop, a grown-up pulls the keyboard cord from the computer. Not from the wall.</div>\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"41\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"10\" y1=\"36\" x2=\"0\" y2=\"36\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"60\" y=\"14\" width=\"34\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"70\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"81\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/></svg><b>1. Power off</b>power + liquid = bad</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Flip it\"><line x1=\"10\" y1=\"62\" x2=\"90\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><polygon points=\"18,60 50,12 54,16 24,62\" fill=\"#8a96a3\"/><polygon points=\"82,60 50,12 46,16 76,62\" fill=\"#8a96a3\"/><path d=\"M34 46 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/><path d=\"M66 46 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/><path d=\"M40 56 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/></svg><b>2. Flip it</b>liquid drains out</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Blot\"><rect x=\"15\" y=\"32\" width=\"70\" height=\"34\" rx=\"4\" fill=\"#4a525c\"/><rect x=\"19\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"32\" y=\"16\" width=\"36\" height=\"16\" rx=\"4\" fill=\"#6fe3b5\"/><line x1=\"50\" y1=\"2\" x2=\"50\" y2=\"14\" stroke=\"#e9ecef\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"50,14 46.2,7.0 53.8,7.0\" fill=\"#e9ecef\"/></svg><b>3. Blot</b>press, don't wipe</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Dry 1–2 days\"><circle cx=\"50\" cy=\"36\" r=\"24\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"3\"/><line x1=\"50\" y1=\"36\" x2=\"50\" y2=\"19\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"36\" x2=\"65\" y2=\"36\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>4. Dry 1–2 days</b>wet inside = broken</div></div>\n\n**Flip it** so the liquid drains out, not in. **Blot**, don't wipe: wiping pushes the liquid deeper. **Dry 1 to 2 days**: liquid hides inside, and turning it on wet can break it for good. Most keyboards must never get wet inside. Never soak one.\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🍚</span><b>❌ No rice</b>no faster, grains get in</div><div class=\"card no\"><span class=\"big\">🔌</span><b>❌ No “just checking”</b>don't turn it on wet</div><div class=\"card ok\"><span class=\"big\">⏱️</span><b>✅ Act fast</b>the first minute counts</div><div class=\"card \"><span class=\"big\">🧃</span><b>Juice or soda?</b>sticky: ask a repair pro</div></div>\n\n---\n\n🌙 *That's today's workday. Day 4 opens next time.*\n\n[[Back to the work schedule->Shop]]", "D4 Start": "(set: $miss to 0)(set: $m4 to (a:))# Day 4: Meet the Mice\n\n<div class=\"scene\">🗄️ 🖱️ ✨</div>\n\n*The Inspector opens a drawer full of mice.* \"Old ones, new ones! Name it first. Then you know how to care for it.\"\n\n\n[[Open the shop->D4 L1]]", "D4 L1": "## 📘 The Inspector's lesson: How a Mouse Sees\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🕰️</span><b>Ball mouse</b>very old. A ball inside turns rollers.</div><div class=\"card \"><span class=\"big\">💡</span><b>Optical mouse</b>optical = a light + a tiny camera</div><div class=\"card \"><span class=\"big\">🔴</span><b>Laser mouse</b>laser = a stronger light. Sees more.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Old ball mouse, seen from the bottom. Each roller handles one direction.\"><ellipse cx=\"130\" cy=\"100\" rx=\"95\" ry=\"85\" fill=\"#2a2f36\" stroke=\"#8a96a3\" stroke-width=\"3\"/><circle cx=\"130\" cy=\"105\" r=\"42\" fill=\"#5b636c\" stroke=\"#8a96a3\" stroke-width=\"2\"/><circle cx=\"117\" cy=\"92\" r=\"10\" fill=\"#7b848e\"/><rect x=\"88\" y=\"47\" width=\"84\" height=\"14\" rx=\"7\" fill=\"#ffb347\"/><rect x=\"174\" y=\"63\" width=\"14\" height=\"84\" rx=\"7\" fill=\"#7fd1ff\"/><line x1=\"172\" y1=\"54\" x2=\"232\" y2=\"40\" stroke=\"#ffb347\" stroke-width=\"2\"/><text x=\"238\" y=\"38\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"start\" font-weight=\"bold\">Up-down roller</text><l ld\">Glass: nothing to see</text></svg><div class=\"cap\">The mouse's eye needs tiny bumps. Clear glass and mirrors have none. A few special mice can see glass.</div></div>\n\n*The Inspector taps the glass.* \"A mouse's eye needs bumps. Most mice can't see clear glass. A mouse pad fixes that.\"\n\n\n[[Got it. Send in the next customer->D4 S1]]", "D4 S1": "## 🎲 Good Mouse Spot? (1 of 6)\n\nWhere can a mouse see well?\n\n*The Inspector holds up:*\n\n### Mouse pad\n\n* [[✅ Good mouse spot->D4 S1 R]]\n* [[⛔ Bad mouse spot->D4 S1 W]]", "D4 S1 R": "## ✅ Right: it has tiny bumps to see\n**Mouse pad.** Made for mice, with tiny bumps.\n\n[[Next one->D4 S2]]", "D4 S1 W": "## ❌ Not this time: it has tiny bumps to see\n**Mouse pad.** Made for mice, with tiny bumps.\n\n[[Next one->D4 S2]]", "D4 S2": "## 🎲 Good Mouse Spot? (2 of 6)\n\n*The Inspector holds up:*\n\n### Wooden table\n\n* [[✅ Good mouse spot->D4 S2 R]]\n* [[⛔ Bad mouse spot->D4 S2 W]]", "D4 S2 R": "## ✅ Right: it has tiny bumps to see\n**Wooden table.** Wood grain has lots of bumps.\n\n[[Next one->D4 S3]]", "D4 S2 W": "## ❌ Not this time: it has tiny bumps to see\n**Wooden table.** Wood grain has lots of bumps.\n\n[[Next one->D4 S3]]", "D4 S3": "## 🎲 Good Mouse Spot? (3 of 6)\n\n*The Inspector holds up:*\n\n### Clear glass desk\n\n* [[✅ Good mouse spot->D4 S3 W]]\n* [[⛔ Bad mouse spot->D4 S3 R]]", "D4 S3 R": "## ✅ Right: it has no bumps to see\n**Clear glass desk.** Nothing for the eye to see.\n\n[[Next one->D4 S4]]", "D4 S3 W": "## ❌ Not this time: it has no bumps to see\n**Clear glass desk.** Nothing for the eye to see.\n\n[[Next one->D4 S4]]", "D4 S4": "## 🎲 Good Mouse Spot? (4 of 6)\n\n*The Inspector holds up:*\n\n### Notebook paper\n\n* [[✅ Good mouse spot->D4 S4 R]]\n* [[⛔ Bad mouse spot->D4 S4 W]]", "D4 S4 R": "## ✅ Right: it has tiny bumps to see\n**Notebook paper.** Paper has tiny bumps too.\n\n[[Next one->D4 S5]]", "D4 S4 W": "## ❌ Not this time: it has tiny bumps to see\n**Notebook paper.** Paper has tiny bumps too.\n\n[[Next one->D4 S5]]", "D4 S5": "## 🎲 Good Mouse Spot? (5 of 6)\n\n*The Inspector holds up:*\n\n### Mirror\n\n* [[✅ Good mouse spot->D4 S5 W]]\n* [[⛔ Bad mouse spot->D4 S5 R]]", "D4 S5 R": "## ✅ Right: it has no bumps to see\n**Mirror.** A mirror is smooth, so the cursor jumps.\n\n[[Next one->D4 S6]]", "D4 S5 W": "## ❌ Not this time: it has no bumps to see\n**Mirror.** A mirror is smooth, so the cursor jumps.\n\n[[Next one->D4 S6]]", "D4 S6": "## 🎲 Good Mouse Spot? (6 of 6)\n\n*The Inspector holds up:*\n\n### Glass plate\n\n* [[✅ Good mouse spot->D4 S6 W]]\n* [[⛔ Bad mouse spot->D4 S6 R]]", "D4 S6 R": "## ✅ Right: it has no bumps to see\n**Glass plate.** Smooth glass. Most mice get lost.\n\n[[Next customer->D4 J3]]", "D4 S6 W": "## ❌ Not this time: it has no bumps to see\n**Glass plate.** Smooth glass. Most mice get lost.\n\n[[Next customer->D4 J3]]", "D4 J3": "<div class=\"scene\">🪟 🖱️ 😵</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Look at what the mouse is sitting on.\"><rect x=\"10\" y=\"70\" width=\"170\" height=\"10\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.28\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"22\" y1=\"80\" x2=\"22\" y2=\"112\" stroke=\"#7fd1ff\" stroke-width=\"3\" opacity=\"0.5\"/><line x1=\"168\" y1=\"80\" x2=\"168\" y2=\"112\" stroke=\"#7fd1ff\" stroke-width=\"3\" opacity=\"0.5\"/><path d=\"M60 70 Q62 44 91.5 42 Q130 44 130 70 Z\" fill=\"#9aa4ae\"/><line x1=\"63\" y1=\"58\" x2=\"88.0\" y2=\"58\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"215\" y=\"14\" width=\"130\" height=\"76\" rx=\"4\" fill=\"#2f4a5c\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"266.0\" y=\"90\" width=\"28\" height=\"10\" fill=\"#9aa4ae\"/><polyline points=\"232,30 300,78 248,70 322,36 270,46 330,80\" stroke=\"#ffd28a\" stroke-width=\"2\" stroke-dasharray=\"4 5\" fill=\"none\"/><polygon points=\"322,58 322,74 326,70 330,77 333,75 329,69 334,69\" fill=\"#e9ecef\" stroke=\"#1b1f24\" stroke-width=\"1\"/><text x=\"95\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mrs. Lin's glass desk</text><text x=\"280\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her cursor</text></svg><div class=\"cap\">Look at what the mouse is sitting on.</div></div>\n\n**Mrs. Lin** got a pretty glass desk. Now her cursor jumps all over.\n\n**Why does it jump?**\n\n* [[Glass blocks the mouse's signal->D4 J3 W1]]\n* [[The mouse needs an update->D4 J3 W2]]\n* [[Glass has no bumps to see->D4 J3 R]]\n* [[The mouse got too hot->D4 J3 W4]]", "D4 J3 W1": "(set: $m4 to it + (a: \"Mrs. Lin\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The mouse's eye needs bumps. **Clear glass has none.** A mouse pad fixes it.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about the mouse's eye. Look at wood and glass in the picture.\"\n\n[[Try again->D4 J3]]]", "D4 J3 W2": "(set: $m4 to it + (a: \"Mrs. Lin\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The mouse's eye needs bumps. **Clear glass has none.** A mouse pad fixes it.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about the mouse's eye. Look at wood and glass in the picture.\"\n\n[[Try again->D4 J3]]]", "D4 J3 W4": "(set: $m4 to it + (a: \"Mrs. Lin\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The mouse's eye needs bumps. **Clear glass has none.** A mouse pad fixes it.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think about the mouse's eye. Look at wood and glass in the picture.\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**Nothing to track.** A mouse pad on the glass fixes it. A few special mice work on glass ,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">what the cursor does</text></svg><div class=\"cap\">The ball sits inside. Look at which way the cursor won't go.</div></div>\n\n**Mr. Abernathy** found an old ball mouse. The cursor goes left and right. It won't go up or down.\n\n**What's wrong?**\n\n* [[The up-down roller is gunky->D4 J4 R]]\n* [[The mouse needs a new battery->D4 J4 W2]]\n* [[The rubber ball has gone flat->D4 J4 W3]]\n* [[The computer only goes sideways, not up->D4 J4 W4]]", "D4 J4 W2": "(set: $m4 to it + (a: \"Mr. Abernathy\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**The up-down roller is gunky.** Pop out the ball and clean the rollers.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the ball mouse. Which roller does up and down?\"\n\n[[Try again->D4 J4]]]", "D4 J4 W3": "(set: $m4 to it + (a: \"Mr. Abernathy\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**The up-down roller is gunky.** Pop out the ball and clean the rollers.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the ball mouse. Which roller does up and down?\"\n\n[[Try again->D4 J4]]]", "D4 J4 W4": "(set: $m4 to it + (a: \"Mr. Abernathy\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**The up-down roller is gunky.** Pop out the ball and clean the rollers.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the ball mouse. Which roller does up and down?\"\n\n[[Try again->D4 J4]]]", "D4 J4 R": "(set: $miss to 0)## ✅ Job done\n**Gunky roller.** A grown-up can twist off the ring, take out the ball, and scrape the rollers clean.\n\n[[The Inspector has something to show you->D4 L5]]", "D4 L5": "## 📘 The Inspector's lesson: Shapes for Different Jobs\n\n<div class=\"cards\"><div class=\"car 63 327,61 323,55 328,55\" fill=\"#e9ecef\" stroke=\"#1b1f24\" stroke-width=\"1\"/><text x=\"285\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his cursor: zoom!</text><text x=\"78\" y=\"136\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Dev's gaming mouse</text></svg><div class=\"cap\">He pressed this button. Then the cursor started zooming.</div></div>\n\n**Dev** pressed the DPI button on his gaming mouse. Now the cursor zooms! \"Is it broken? My tournament is Saturday!\"\n\n**What's happening?**\n\n* [[The button broke the mouse inside->D4 J6 W1]]\n* [[The mouse needs fresh batteries->D4 J6 W2]]\n* [[He turned DPI up, so it jumps->D4 J6 R]]\n* [[The computer needs a restart->D4 J6 W4]]", "D4 J6 W1": "(set: $m4 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Higher DPI = giant cursor jumps.** Press the button until the cursor is slow again.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the DPI picture. What does a small hand move do at high DPI?\"\n\n[[Try again->D4 J6]]]", "D4 J6 W2": "(set: $m4 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Higher DPI = giant cursor jumps.** Press the button until the cursor is slow again.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the DPI picture. What does a small hand move do at high DPI?\"\n\n[[Try again->D4 J6]]]", "D4 J6 W4": "(set: $m4 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Higher DPI = giant cursor jumps.** Press the button until the cursor is slow again.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the DPI picture. What does a small hand move do at high DPI?\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**DPI went up.** Gamers call it sensitivity. Nothing is broken, so Dev can still win on Saturday.\n\n[[Next customer->D4 J7]]", "D4 J7": "<div class=\"scene\">🪑 🖱️ 💪</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Almost no room for the mouse to slide.\"><rect x=\"90\" y=\"8\" width=\"180\" height=\"104\" rx=\"6\" fill=\"#8b5a2b\" stroke=\"#5e3b1a\" stroke-width=\"3\"/><rect x=\"115\" y=\"18\" width=\"80\" height=\"48.0\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#8a96a3\" stroke-width=\"3\"/><polygon points=\"107,76.0 203,76.0 195,66.0 115,66.0\" fill=\"#8a96a3\"/><rect x=\"215\" y=\"16\" width=\"44\" height=\"54\" rx=\"3\" fill=\"#4a6fa5\"/><rect x=\"219\" y=\"20\" width=\"44\" height=\"54\" rx=\"3\" fill=\"#a5544a\"/><rect x=\"100\" y=\"80\" width=\"30\" height=\"26\" rx=\"4\" fill=\"#d9d9d9\"/><path d=\"M130 86 q8 0 8 10\" stroke=\"#d9d9d9\" stroke-width=\"3\" fill=\"none\"/><ellipse cx=\"205\" cy=\"92\" rx=\"8.4\" ry=\"12.6\" fill=\"#9aa4ae\"/><line x1=\"205\" y1=\"79.4\" x2=\"205\" y2=\"90.11\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"196.6\" y1=\"90.11\" x2=\"213.4\" y2=\"90.11\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"165\" y1=\"92\" x2=\"188\" y2=\"92\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><line x1=\"222\" y1=\"92\" x2=\"262\" y2=\"92\" stroke=\"#ff6b6b\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><text x=\"180\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Patel's tiny desk, from above</text></svg><div class=\"cap\">Almost no room for the mouse to slide.</div></div>\n\n**Mr. Patel** has a tiny desk. There's no room to slide a mouse. His shoulder gets tired.\n\n**Which mouse helps most?**\n\n* [[A gaming mouse with lots of buttons->D4 J7 W1]]\n* [[A trackball that stays in one spot->D4 ️ Dry clean->D5 S2 R]]\n* [[🧽 Barely damp cloth->D5 S2 W]]", "D5 S2 R": "## ✅ Right: air or a dry swab, no liquid\n**Lint around the scroll wheel.** Air and a toothpick. No liquid inside.\n\n[[Next one->D5 S3]]", "D5 S2 W": "## ❌ Not this time: air or a dry swab, no liquid\n**Lint around the scroll wheel.** Air and a toothpick. No liquid inside.\n\n[[Next one->D5 S3]]", "D5 S3": "## 🎲 Dry Clean or Damp Clean? (3 of 7)\n\n*The Inspector points at a mouse part:*\n\n### Crumbs in the button gaps\n\n* [[🌬️ Dry clean->D5 S3 R]]\n* [[🧽 Barely damp cloth->D5 S3 W]]", "D5 S3 R": "## ✅ Right: air or a dry swab, no liquid\n**Crumbs in the button gaps.** A puff of air blows them out.\n\n[[Next one->D5 S4]]", "D5 S3 W": "## ❌ Not this time: air or a dry swab, no liquid\n**Crumbs in the button gaps.** A puff of air blows them out.\n\n[[Next one->D5 S4]]", "D5 S4": "## 🎲 Dry Clean or Damp Clean? (4 of 7)\n\n*The Inspector points at a mouse part:*\n\n### The plastic shell\n\n* [[🌬️ Dry clean->D5 S4 W]]\n* [[🧽 Barely damp cloth->D5 S4 R]]", "D5 S4 R": "## ✅ Right: a cloth barely damp, off first\n**The plastic shell.** Wipe it with a cloth, barely damp.\n\n[[Next one->D5 S5]]", "D5 S4 W": "## ❌ Not this time: a cloth barely damp, off first\n**The plastic shell.** Wipe it with a cloth, barely damp.\n\n[[Next one->D5 S5]]", "D5 S5": "## 🎲 Dry Clean or Damp Clean? (5 of 7)\n\n*The Inspector points at a mouse part:*\n\n### Tara's shiny palm spot\n\n* [[🌬️ Dry clean->D5 S5 W]]\n* [[🧽 Barely damp cloth->D5 S5 R]]", "D5 S5 R": "## ✅ Right: a cloth barely damp, off first\n**Tara's shiny palm spot.** A little alcohol cuts the oil.\n\n[[Next one->D5 S6]]", "D5 S5 W": "## ❌ Not this time: a cloth barely damp, off first\n**Tara's shiny palm spot.** A little alcohol cuts the oil.\n\n[[Next one->D5 S6]]", "D5 S6": "## 🎲 Dry Clean or Damp Clean? (6 of 7)\n\n*The Inspector points at a mouse part:*\n\n### The trackball ball\n\n* [[🌬️ Dry clean->D5 S6 W]]\n* [[🧽 Barely damp cloth->D5 S6 R]]", "D5 S6  an eyebrow.* \"Look at the 4 steps in Battery Care. Which one comes first?\"\n\n[[Try again->D5 J10]]]", "D5 J10 R": "(set: $miss to 0)## ✅ Job done\n**Grown-up, gloves, batteries out.** The grown-up cleans the contacts (the metal bits) and recycles the old batteries.\n\n[[Next customer->D5 J11]]", "D5 J11": "<div class=\"scene\">✈️ 🖱️ 🗄️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"His spare mouse, with its AA batteries.\"><rect x=\"20\" y=\"30\" width=\"200\" height=\"80\" rx=\"4\" fill=\"#5a4636\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"28\" y=\"38\" width=\"184\" height=\"64\" fill=\"#2a2f36\"/><rect x=\"20\" y=\"104\" width=\"200\" height=\"18\" rx=\"3\" fill=\"#6b5442\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"104\" y=\"110\" width=\"32\" height=\"5\" rx=\"2\" fill=\"#9aa4ae\"/><rect x=\"80\" y=\"44\" width=\"80\" height=\"52\" rx=\"24\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"98\" y=\"54\" width=\"44\" height=\"32\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"1.5\"/><rect x=\"102\" y=\"58\" width=\"36\" height=\"10\" rx=\"2\" fill=\"#9aa4ae\"/><rect x=\"102\" y=\"58\" width=\"14\" height=\"10\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"138\" y=\"61\" width=\"3\" height=\"4\" fill=\"#9aa4ae\"/><rect x=\"102\" y=\"71\" width=\"36\" height=\"10\" rx=\"2\" fill=\"#9aa4ae\"/><rect x=\"102\" y=\"71\" width=\"14\" height=\"10\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"138\" y=\"74\" width=\"3\" height=\"4\" fill=\"#9aa4ae\"/><rect x=\"250\" y=\"22\" width=\"90\" height=\"84\" rx=\"6\" fill=\"#e4e8ec\"/><rect x=\"250\" y=\"22\" width=\"90\" height=\"22\" rx=\"6\" fill=\"#ff6b6b\"/><text x=\"295\" y=\"38\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffffff\" text-anchor=\"middle\" font-weight=\"bold\">trip</text><text x=\"295\" y=\"72\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"26\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">3</text><text x=\"295\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"normal\">months</text><text x=\"120\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his spare mouse, in the drawer</text><text x=\"295\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">away</text></svg><div class=\"cap\">His spare mouse, with its AA batteries.</div></div>\n\n**Mr. Chen** leaves on a 3-month trip. His spare mouse with AA batteries stays in a drawer.\n\n**What should he do first?**\n\n* [[Leave the batteries in for later->D5 J11 W1]]\n* [[Flip it over so they can't leak->D5 J11 W2]]\n* [[Take the batteries out->D5 J11 R]]\n* [[Wrap the mouse up in plastic->D5 J11 W4]]", "D5 J11 W1": "(set: $m5 to it + (a: \"Mr. Chen\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Take the batteries out** of anything you won't use for a long time.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the two rows in the leak picture. Which one ends safe?\"\n\n[[Try again->D5 J11]]]", "D5 J11 W2": "(set: $m5 to it + (a: \"Mr. Chen\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Take the batteries out** of anything you won't use for a long time.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the two rows in the leak picture. Which one ends safe?\"\n\n[[Try again->D5 J11]]]", "D5 J11 W4": "(set: $m5 to it + (a: \"Mr. Chen\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Take the batteries out** of anything you won't use for a long time.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the two rows in the /text></svg><div class=\"cap\">Know the parts. Each one gets cleaned its own way.</div></div>\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Power off\"><rect x=\"14\" y=\"4\" width=\"36\" height=\"60\" rx=\"18.0\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"32.0\" y1=\"4\" x2=\"32.0\" y2=\"26.8\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"14\" y1=\"26.8\" x2=\"50\" y2=\"26.8\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"70.8\" y=\"26\" width=\"6.4\" height=\"5\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"66\" y=\"30\" width=\"16\" height=\"30\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"66\" y=\"46.5\" width=\"16\" height=\"13.5\" rx=\"3\" fill=\"#ffb347\"/><line x1=\"58\" y1=\"22\" x2=\"74\" y2=\"10\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"74,10 70.7,17.3 66.1,11.1\" fill=\"#6fe3b5\"/></svg><b>1. Power off</b>unplug or batteries out</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Wipe the shell\"><rect x=\"30\" y=\"4\" width=\"40\" height=\"62\" rx=\"20.0\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"50.0\" y1=\"4\" x2=\"50.0\" y2=\"27.56\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"30\" y1=\"27.56\" x2=\"70\" y2=\"27.56\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"52\" y=\"20\" width=\"40\" height=\"22\" rx=\"5\" fill=\"#6fe3b5\" opacity=\"0.85\" transform=\"rotate(-20 72 31)\"/><path d=\"M84 46 q-4 7 0 10 q4 -3 0 -10z\" fill=\"#7fd1ff\"/></svg><b>2. Wipe the shell</b>cloth, a bit of alcohol</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Sensor\"><rect x=\"10\" y=\"8\" width=\"44\" height=\"56\" rx=\"20\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"24\" y=\"26\" width=\"16\" height=\"18\" rx=\"4\" fill=\"#7fd1ff\"/><path d=\"M62 28 q4 -5 8 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M72 30 q4 -5 8 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M82 32 q4 -5 8 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/></svg><b>3. Sensor</b>air puff or dry swab</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Feet\"><rect x=\"28\" y=\"4\" width=\"44\" height=\"62\" rx=\"20\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"36\" y=\"10\" width=\"28\" height=\"8\" rx=\"4\" fill=\"#6fe3b5\"/><rect x=\"36\" y=\"52\" width=\"28\" height=\"8\" rx=\"4\" fill=\"#6fe3b5\"/><circle cx=\"38\" cy=\"56\" r=\"3\" fill=\"#6b4a2a\"/><circle cx=\"62\" cy=\"14\" r=\"3\" fill=\"#6b4a2a\"/></svg><b>4. Feet</b>clean, or replace</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"5. Scroll wheel\"><rect x=\"30\" y=\"6\" width=\"22\" height=\"58\" rx=\"10\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"36\" y=\"16\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#ffb347\"/><line x1=\"92\" y1=\"6\" x2=\"48\" y2=\"30\" stroke=\"#e8c27a\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>5. Scroll wheel</b>air, then wooden toothpick</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"6. Cloth pad\"><rect x=\"8\" y=\"16\" width=\"60\" height=\"44\" rx=\"6\" fill=\"#7fd1ff\" opacity=\"0.7\"/><circle cx=\"20\" cy=\"12\" r=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"34\" cy=\"8\" r=\"4\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"46\" cy=\"12\" r=\"5\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><path d=\"M72 30 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M72 39 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M72 48 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/></svg><b>6. Cloth pad</b>wash, then air dry</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🧴</span><b>✅ Alcohol cloth</b>just barely wet</div><div class=\"card no\"><span class=\"big\">🚰</span><b>❌ Under the tap</b>water gets in the circuits</div><div class=\"card ok\"><span class=\"big\">🪵</span><b>✅ Wooden toothpick</b>for the wheel</div><div class=\"card no\"><span class=\"big\">📌</span><b>❌ Metal pin</b>scratches parts</div><div class=\"card ok\"><span class=\"big\">🌬️</span><b>✅ Air or dry swab</b>for the sensor</div><div class=\"card no\"><span class=\"big\">💦</span><b>❌ Wet scrubbing</b>on the sensor</div><div class=\"card ok\"><span class=\"big\">🌤️</span><b>✅ Air dry</b>the cloth pad</div><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ High heat</b>bends the rubber</div></div>\n\n<div class=\"warn\">**Grown-up needed** to hold the alcohol. Turn the mouse off before you wipe.</div>\n\n### Trackballs and Trackpads\nA trackball is a mouse you roll with a ball.\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 180\" role=\"img\" aria-label=\"The ball sits on little <b>support dots</b>. Gunk on them makes the cursor jump.\"><path d=\"M40 70 L40 140 Q40 160 60 160 L200 160 Q220 160 220 140 L220 70\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"130\" cy=\"78\" r=\"48\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M108 60 q14 -14 34 -6\" stroke=\"#ffffff\" stroke-width=\"4\" fill=\"none\" opacity=\"0.6\"/><circle cx=\"98\" cy=\"120\" r=\"7\" fill=\"#ffb347\"/><circle cx=\"102\" cy=\"127\" r=\"4\" fill=\"#6b4a2a\"/><circle cx=\"162\" cy=\"120\" r=\"7\" fill=\"#ffb347\"/><circle cx=\"166\" cy=\"127\" r=\"4\" fill=\"#6b4a2a\"/><rect x=\"122\" y=\"152\" width=\"16\" height=\"10\" fill=\"#1b1f24\"/><line x1=\"130\" y1=\"176\" x2=\"130\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"130,150 133.8,157.0 126.2,157.0\" fill=\"#6fe3b5\"/><line x1=\"170\" y1=\"124\" x2=\"232\" y2=\"140\" stroke=\"#ffb347\" stroke-width=\"2\"/><text x=\"250\" y=\"30\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"start\" font-weight=\"bold\">1. Push ball out</text><text x=\"250\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">from the hole</text><text x=\"250\" y=\"82\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"bold\">2. Wipe the ball</text><text x=\"250\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"start\" font-weight=\"bold\">3. Clean the dots</text><text x=\"250\" y=\"150\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"start\" font-weight=\"normal\">gunk hides here!</text></svg><div class=\"cap\">The ball sits on little <b>support dots</b>. Gunk on them makes the cursor jump.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">📴</span><b>✅ Trackpad: off first</b>wiping can click</div><div class=\"card ok\"><span class=\"big\">🧽</span><b>✅ Soft cloth</b>barely damp</div><div class=\"card no\"><span class=\"big\">💦</span><b>❌ Spray on the pad</b>liquid sneaks in</div></div>\n\n### Battery Care\n<div class=\"pic\"><svg viewBox=\"0 0 400 215\" role=\"img\" aria-label=\"Batteries left sitting for months leak most. Not using it? Take them out.\"><text x=\"12\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">Batteries left in</text><rect x=\"20\" y=\"35\" width=\"40\" height=\"64\" rx=\"20.0\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"40.0\" y1=\"35\" x2=\"40.0\" y2=\"59.32\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"20\" y1=\"59.32\" x2=\"60\" y2=\"59.32\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"36.4\" y=\"50\" width=\"7.2\" height=\"5\" rx=\"1\" fill=  $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lift the screen with a **stand**. Then use a **separate keyboard and mouse**.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Where is his head pointing, and where should the top of the screen be?\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**A stand plus a separate keyboard.** The top of the screen goes up to his eyes, so his neck stays straight. Hands stay low.\n\n[[Next customer->D6 J3]]", "D6 J3": "<div class=\"scene\">👧 💻 😵</div>\n\n**Zoe** read on her computer for an hour. She never looked up. Her eyes feel tired and dry.\n\n**What helps her eyes?**\n\n* [[Rub her eyes with her fists->D6 J3 W1]]\n* [[Look far away every 20 minutes->D6 J3 R]]\n* [[Keep reading with a much dimmer screen->D6 J3 W3]]\n* [[Switch to a phone screen->D6 J3 W4]]", "D6 J3 W1": "(set: $m6 to it + (a: \"Zoe\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Now her eyes are red AND tired.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Every **20 minutes**, look **20 feet** away for **20 seconds**.\"\n\n[[Got it->D6 J3 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Now her eyes are red AND tired.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* Count the 20s on the cards. Should eyes look close or far?\n\n[[Try again->D6 J3]]]", "D6 J3 W3": "(set: $m6 to it + (a: \"Zoe\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Every **20 minutes**, look **20 feet** away for **20 seconds**.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Count the 20s on the cards. Should eyes look close or far?\n\n[[Try again->D6 J3]]]", "D6 J3 W4": "(set: $m6 to it + (a: \"Zoe\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Every **20 minutes**, look **20 feet** away for **20 seconds**.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Count the 20s on the cards. Should eyes look close or far?\n\n[[Try again->D6 J3]]]", "D6 J3 R": "(set: $miss to 0)## ✅ Job done\n**20-20-20.** We blink less at screens. Looking far away (like across the room or out a window) lets eyes rest.\n\n[[Next customer->D6 J4]]", "D6 J4": "<div class=\"scene\">🖥️ ☀️ 😖</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"His desk, seen from above. He looks at the screen. What else is in front of him?\"><rect x=\"70\" y=\"8\" width=\"220\" height=\"120\" rx=\"6\" fill=\"none\" stroke=\"#3a424b\" stroke-width=\"3\"/><rect x=\"120\" y=\"4\" width=\"120\" height=\"10\" fill=\"#ffe08a\"/><line x1=\"132\" y1=\"18\" x2=\"126\" y2=\"34\" stroke=\"#ffe08a\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"126,34 124.9,26.1 132.1,28.8\" fill=\"#ffe08a\"/><line x1=\"180\" y1=\"18\" x2=\"180\" y2=\"34\" stroke=\"#ffe08a\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"180,34 176.2,27.0 183.8,27.0\" fill=\"#ffe08a\"/><line x1=\"228\" y1=\"18\" x2=\"234\" y2=\"34\" stroke=\"#ffe08a\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"234,34 227.9,28.8 235.1,26.1\" fill=\"#ffe08a\"/><rect x=\"130\" y=\"44\" width=\"100\" height=\"40\" rx=\"3\" fill=\"#a07a52\"/><rect x=\"150\" y=\"50\" width=\"60\" height=\"8\" rx=\"2\" fill=\"#7fd1ff\"/><circle cx=\"180\" cy=\"102\" r=\"12\" fill=\"#f2c79b\"/><text x=\"300\" y=\"14\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffe08a\" text-anchor=\"start\" font-weight=\"normal\">big sunny</text><text x=\"300\" y=\"30\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffe08a\" text-anchor=\"start\" font-weight=\"normal\">window</text><text x=\"60\" y=\"58\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#7fd1ff\" text-anchor=\"end\" font-weight=\"normal\">his</text><text x=\"60\" y=\"74\" font-family=\"S de**.\"\n\n[[Got it->D6 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Where is the sun compared with his screen? Light behind a screen is the problem.\n\n[[Try again->D6 J4]]]", "D6 J4 R": "(set: $miss to 0)## ✅ Job done\n**Window at the side.** Light behind the screen hurts your eyes. Light on the screen makes glare.\n\n[[The Inspector has something to show you->D6 L5]]", "D6 L5": "## 📘 The Inspector's lesson: Arms, Wrists, and Feet\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 225\" role=\"img\" aria-label=\"Sit like this.\"><line x1=\"0\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"72\" y=\"80\" width=\"8\" height=\"76\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"72\" y=\"148\" width=\"76\" height=\"8\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"106\" y=\"156\" width=\"6\" height=\"59\" fill=\"#9aa4ae\"/><rect x=\"200\" y=\"128\" width=\"195\" height=\"8\" rx=\"2\" fill=\"#a07a52\"/><rect x=\"380\" y=\"136\" width=\"8\" height=\"79\" fill=\"#a07a52\"/><rect x=\"206\" y=\"136\" width=\"8\" height=\"79\" fill=\"#a07a52\"/><rect x=\"210\" y=\"122\" width=\"58\" height=\"6\" rx=\"2\" fill=\"#9aa4ae\"/><line x1=\"110\" y1=\"72\" x2=\"100\" y2=\"145\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"112\" y1=\"80\" x2=\"116\" y2=\"122\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"122\" x2=\"222\" y2=\"122\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"100\" y1=\"145\" x2=\"178\" y2=\"145\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"178\" y1=\"145\" x2=\"178\" y2=\"208\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"178\" y1=\"208\" x2=\"196\" y2=\"208\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"118\" cy=\"50\" r=\"17\" fill=\"#f2c79b\"/><circle cx=\"127\" cy=\"47\" r=\"2.5\" fill=\"#1b1f24\"/><path d=\"M116 110 L128 110 L128 122\" strok ain->D6 J7]]]", "D6 J7 R": "(set: $miss to 0)## ✅ Job done\n**Fold the feet in.** Flat keyboard, straight wrists. *The Inspector sighs.* \"Grandpa Leo's.\"\n\n[[Next customer->D6 J8]]", "D6 J8": "<div class=\"scene\">👧 ⌨️ 🖱️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 156\" role=\"img\" aria-label=\"Her desk, seen from above. Follow her arm to the mouse.\"><rect x=\"30\" y=\"18\" width=\"236\" height=\"64\" rx=\"6\" fill=\"#3a424b\"/><rect x=\"38\" y=\"26\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"38\" y=\"39\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"38\" y=\"52\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"38\" y=\"65\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"53\" y=\"26\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"53\" y=\"39\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"53\" y=\"52\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"53\" y=\"65\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"68\" y=\"26\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"68\" y=\"39\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"68\" y=\"52\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"68\" y=\"65\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"83\" y=\"26\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"83\" y=\"39\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"83\" y=\"52\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"83\" y=\"65\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"98\" y=\"26\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"98\" y=\"39\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"98\" y=\"52\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636d\"/><rect x=\"98\" y=\"65\" width=\"12\" height=\"10\" rx=\"2\" fill=\"#5a636 rmal\">Ava's keyboard (very wide)</text></svg><div class=\"cap\">Her desk, seen from above. Follow her arm to the mouse.</div></div>\n\n**Ava's** full-size keyboard is very wide. It has a **number pad** (a block of number keys) on the right. Her mouse is way off to the right. Her shoulder is sore.\n\n**What could help?**\n\n* [[Lean forward and stretch her arm out->D6 J8 W1]]\n* [[Switch to a narrower TKL keyboard->D6 J8 R]]\n* [[Get a much wider mouse pad->D6 J8 W3]]\n* [[Sit farther from the desk->D6 J8 W4]]", "D6 J8 W1": "(set: $m6 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **TKL** has no number pad. The mouse sits **closer**.\"\n\n[[Got it->D6 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the two keyboards. Which one lets the mouse sit closer?\n\n[[Try again->D6 J8]]]", "D6 J8 W3": "(set: $m6 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **TKL** has no number pad. The mouse sits **closer**.\"\n\n[[Got it->D6 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the two keyboards. Which one lets the mouse sit closer?\n\n[[Try again->D6 J8]]]", "D6 J8 W4": "(set: $m6 to it + (a: \"Ava\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **TKL** has no number pad. The mouse sits **closer**.\"\n\n[[Got it->D6 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the two keyboards. Which one lets the mouse sit closer?\n\n[[Try again->D6 J8]]]", "D6 J8 R": "(set: $miss to 0)## ✅ Job done\n**A TKL keyboard.** TKL means no number pad, so it is skinnier. Her arm doesn't have to reach.\n\n[[The Inspector has something to show you->D6 L9]]", "D6 L9": "## 📘 The Inspector's lesson: Move Your Body\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"Even a great setup needs breaks.\"><circle cx=\"70\" cy=\"65\" r=\"45\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"4\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(0 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(30 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(60 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(90 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(120 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(150 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(180 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(210 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(240 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(270 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(300 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(330 70 65)\"/><line x1=\"70\" y1=\"65\" x2=\"70\" y2=\"32\" stroke=\"#e9ecef\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"65\" x2=\"92\" y2=\"65\" stroke=\"#e9ecef\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"70\" y=\"138\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Once an hour</text><line x1=\"130\" y1=\"65\" x2=\"200\" y2=\"65\" stroke=\"#6fe3b5\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"200,65 193.0,68.8 193.0,61.2\" fill=\"#6fe3b5\"/><circle cx=\"290\" cy=\"26\" r=\"15\" fill=\"#f2c79b\"/><line x1=\"290\" y1=\"42\" x2=\"290\" y2=\"92\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"50\" x2=\"262\" y2=\"18\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"50\" x2=\"318\" y2=\"18\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"92\" x2=\"272\" y2=\"126\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"92\" x2=\"308\" y2=\"126\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><text x=\"290\" y=\"145\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Get up and move!</text></svg><div class=\"cap\">Even a great setup needs breaks.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🚶</span><b>✅ Walk around</b></div><div class=\"card ok\"><span class=\"big\">💧</span><b>✅ Get water</b></div><div class=\"card ok\"><span class=\"big\">🙆</span><b>✅ Roll your shoulders</b>and shrug</div><div class=\"card ok\"><span class=\"big\">🤲</span><b>✅ Stretch</b>neck and wrists, gently</div></div>\n\nSitting still for hours **stiffens your muscles**. Moving wakes them up. Gamers: loading screens and respawns count as break time. Stand up and look out the window.\n\n<div class=\"warn\">**Grown-up needed** if pain doesn't go away, or your hands tingle or feel numb. Tell a grown-up. You may need a doctor.</div>\n\n[[Got it. Send in the next customer->D6 S1]]", "D6 S1": "## 🎲 Comfy or Ouch? (1 of 7)\n\nCheck each desk setup.\n\n*The Inspector peeks at a desk:*\n\n### Top of the screen at eye level\n\n* [[😌 Comfy->D6 S1 R]]\n* [[😣 Ouch->D6 S1 W]]", "D6 S1 R": "## ✅ Right: it is comfy\n**Top of the screen at eye level.** Your neck stays straight.\n\n[[Next one->D6 S2]]", "D6 S1 W": "## ❌ Not this time: it is comfy\n**Top of the screen at eye level.** Your neck stays straight.\n\n[[Next one->D6 S2]]", "D6 S2": "## 🎲 Comfy or Ouch? (2 of 7)\n\n*The Inspector peeks at a desk:*\n\n### Bright window right behind the screen\n\n* [[😌 Comfy->D6 S2 W]]\n* [[😣 Ouch->D6 S2 R]]", "D6 S2 R": "## ✅ Right: it is an ouch\n**Bright window right behind the screen.** Light behind a screen hurts your eyes.\n\n[[Next one->D6 S3]]", "D6 S2 W": "## ❌ Not this time: it is an ouch\n**Bright window right behind the screen.** Light behind a screen hurts your eyes.\n\n[[Next one->D6 S3]]", "D6 S3": "## 🎲 Comfy or Ouch? (3 of 7)\n\n*The Inspector peeks at a desk:*\n\n### Feet flat on the floor\n\n* [[😌 Comfy->D6 S3 R]]\n* [[😣 Ouch->D6 S3 W]]", "D6 S3 R": "## ✅ Right: it is comfy\n**Feet flat on the floor.** Your legs and back both get support.\n\n[[Next one->D6 S4]]", "D6 S3 W": "## ❌ Not this time: it is comfy\n**Feet flat on the floor.** Your legs and back both get support.\n\n[[Next one->D6 S4]]", "D6 S4": "## 🎲 Comfy or Ouch? (4 of 7)\n\n*The Inspector peeks at a desk:*\n\n### Keyboard with its little feet flipped out\n\n* [[😌 Comfy->D6 S4 W]]\n* [[😣 Ouch->D6 S4 R]]", "D6 S4 R": "## ✅ Right: it is an ouch\n**Keyboard with its little feet flipped out.** Wrists bend up and get sore.\n\n[[Next one->D6 S5]]", "D6 S4 W": "## ❌ Not this time: it is an ouch\n**Keyboard with its little feet flipped out.** Wrists bend up and get sore.\n\n[[Next one->D6 S5]]", "D6 S5": "## 🎲 Comfy or Ouch? (5 of 7)\n\n*The Inspector peeks at a desk:*\n\n### Tiny text, so he leans in close\n\n* [[😌 Comfy->D6 S5 W]]\n* [[😣 Ouch->D6 S5 R]]", "D6 S5 R": "## ✅ Right: it is an ouch\n**Tiny text, so he leans in close.** Leaning in aches. Zoom bigger: Ctrl and + in your web browser (Cmd and + on a Mac).\n\n[[Next one->D6 S6]]", "D6 S5 W": "## ❌ Not this time: it is an ouch\n**Tiny text, so he leans in close.** Leaning in aches. Zoom bigger: Ctrl and + in your web browser (Cmd and + on a Mac).\n\n[[Next one->D6 S6]]", "D6 S6": "## 🎲 Comfy or Ouch? (6 of 7)\n\n*The Inspector peeks at a desk:*\n\n### Mouse close, right beside the keys\n\n* [[😌 Comfy->D6 S6 R]]\n* [[😣 Ouch->D6 S6 W]]", "D6 S6 R": "## ✅ Right: it is comfy\n**Mouse close, right beside the keys.** Short reach, so your shoulder relaxes.\n\n[[Next one->D6 S7]]", "D6 S6 W": "## ❌ Not this time: it is comfy\n**Mouse close, right beside the keys.** Short reach, so your shoulder relaxes.\n\n[[Next one->D6 S7]]", "D6 S7": "## 🎲 Comfy or Ouch? (7 of 7)\n\n*The Inspector peeks at a desk:*\n\n### Window light coming from the side\n\n* [[😌 Comfy->D6 S7 R]]\n* [[😣 Ouch->D6 S7 W]]", "D6 S7 R": "## ✅ Right: it is comfy\n**Window light coming from the side.** No glare, no squinting.\n\n[[Next customer->D6 J11]]", "D6 S7 W": "## ❌ Not this time: it is comfy\n**Window light coming from the side.** No glare, no squinting.\n\n[[Next customer->D6 J11]]", "D6 J11": "<div class=\"scene\">🎮 ⏰ 🍝</div>\n\n**Dev** has a big tournament on Saturday, so he games for four hours without getting up. His back is stiff. His legs feel like noodles.\n\n**What should he change?**\n\n* [[Play on, but sit up very straight->D6 J11 W1]]\n* [[Skip breaks and practice more->D6 J11 W2]]\n* [[Rest only when something hurts->D6 J11 W3]]\n* [[Get up and move every hour->D6 J11 R]]", "D6 J11 W1": "(set: $m6 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Get up and move about once an hour.**\"\n\n[[Got it->D6 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Think of the clock in the Move Your Body lesson. How often does it say to stand up?\n\n[[Try again->D6 J11]]]", "D6 J11 W2": "(set: $m6 to it + (a: \"Dev\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Noodle legs lose tournaments.</div>\n\n## Let me show you\n*The Inspector leans over.* \"**Get up and move about once an hour.**\"\n\n[[Got it->D6 J11 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Noodle legs lose tournaments.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* Think of the clock in the Move Your Body lesson. How often does it say to stand up?\n\n[[Try again->D6 J11]]]", "D6 J11 W3": "(set: $m6 to it + (a: \"Dev\"))(set: $miss to 68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(180 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(210 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(240 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(270 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(300 70 65)\"/><rect x=\"68\" y=\"23\" width=\"4\" height=\"8\" fill=\"#ffb347\" transform=\"rotate(330 70 65)\"/><line x1=\"70\" y1=\"65\" x2=\"70\" y2=\"32\" stroke=\"#e9ecef\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"70\" y1=\"65\" x2=\"92\" y2=\"65\" stroke=\"#e9ecef\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"70\" y=\"138\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Once an hour</text><line x1=\"130\" y1=\"65\" x2=\"200\" y2=\"65\" stroke=\"#6fe3b5\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"200,65 193.0,68.8 193.0,61.2\" fill=\"#6fe3b5\"/><circle cx=\"290\" cy=\"26\" r=\"15\" fill=\"#f2c79b\"/><line x1=\"290\" y1=\"42\" x2=\"290\" y2=\"92\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"50\" x2=\"262\" y2=\"18\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"50\" x2=\"318\" y2=\"18\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"92\" x2=\"272\" y2=\"126\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"290\" y1=\"92\" x2=\"308\" y2=\"126\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><text x=\"290\" y=\"145\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Get up and move!</text></svg><div class=\"cap\">Even a great setup needs breaks.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🚶</span><b>✅ Walk around</b></div><div class=\"card ok\"><span class=\"big\">💧</span><b>✅ Get water</b></div><div class=\"card ok\"><span class=\"big\">🙆</span><b>✅ Roll your shoulders</b>and shrug</div><div class=\"card ok\"><span class=\"big\">🤲</span><b>✅ Stretch</b>neck and wrists, gently</div></div>\n\nSitting still for hours **stiffens your muscles**. Moving wakes them up. Gamers: loading screens and respawns count as break time. Stand up and look out the window.\n\n<div class=\"warn\">**Grown-up needed** if pain doesn't go away, or your hands tingle or feel numb. Tell a grown-up. You may need a doctor.</div>\n\n---\n\n🌙 *That's the last workday. The exam opens next time.*\n\n[[Back to the work schedule->Shop]]", "Exam Start": "(set: $miss to 0)(set: $mx to (a:))# 🎓 The Inspector's Final Exam\n\n*The Inspector sets down a clipboard.* \"Twelve questions. Two from each day. Miss twice, and I'll show you.\"\n\n\"No pressure. Okay, a little pressure. Your customers are coming back to see how you do.\"\n\n[[Begin->X1]]", "X1": "<div class=\"scene\">🔌 💻 🖱️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 130\" role=\"img\" aria-label=\"One small oval port. Three flat plugs.\"><rect x=\"10\" y=\"26\" width=\"130\" height=\"76\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"52\" y=\"54\" width=\"46\" height=\"20\" rx=\"10\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><rect x=\"62\" y=\"61\" width=\"26\" height=\"6\" rx=\"3\" fill=\"#ffb347\"/><rect x=\"236\" y=\"22\" width=\"46\" height=\"18\" rx=\"3\" fill=\"#c9d1d9\" stroke=\"#e9ecef\" stroke-width=\"1.5\"/><rect x=\"242\" y=\"27\" width=\"30\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"282\" y=\"25\" width=\"46\" height=\"12\" rx=\"5\" fill=\"#5b6573\"/><text x=\"346\" y=\"36\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"11\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">mouse</text><rect x=\"236\" y=\"52\" width=\"46\" height=\"18\" rx=\"3\" fill=\"#c9d1d9\" stroke=\"#e9ecef\" stroke-width=\"1.5\"/><rect x=\"242\" y=\"57\" width=\"30\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"282\" y=\"55\" width=\"46\" height=\"12\" rx=\"5\" fill=\"#5b6573\"/><text x=\"346\" y=\"66\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"11\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">keyboard</text><rect x=\"236\" y=\"82\" width=\"46\" height=\"18\" rx=\"3\" fill=\"#c9d1d9\" stroke=\"#e9ecef\" stroke-width=\"1.5\"/><rect x=\"242\" y=\"87\" width=\"30\" height=\"8\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"282\" y=\"85\" width=\"46\" height=\"12\" rx=\"5\" fill=\"#5b6573\"/><text x=\"346\" y=\"96\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"11\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">flash</text><text x=\"75\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the laptop: one port</text><text x=\"285\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">three flat plugs</text></svg><div class=\"cap\">One small oval port. Three flat plugs.</div></div>\n\n**Question 1 of 12.** **Marcus** is back, and he flips his plugs the right way now! His new laptop has just one small oval port. He wants a mouse, a keyboard, and a flash drive. He wants all three plugged in at the same time. Their plugs are flat.\n\n**What does Marcus need?**\n\n* [[An Ethernet cable for each one->X1 W1]]\n* [[A hub for the oval hole->X1 R]]\n* [[An HDMI cable for the three->X1 W3]]\n* [[A bigger, faster charger->X1 W4]]", "X1 W1": "(set: $mx to it + (a: \"question 1\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **hub**. It turns one oval hole into many flat ones.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"He has one hole and three plugs. Which little box turns one hole into many?\"\n\n[[Try again->X1]]]", "X1 W3": "(set: $mx to it + (a: \"question 1\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **hub**. It turns one oval hole into many flat ones.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"He has one hole and three plugs. Which little box turns one hole into many?\"\n\n[[Try again->X1]]]", "X1 W4": "(set: $mx to it + (a: \"question 1\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **hub**. It turns one oval hole into many flat ones.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"He has one hole and three plugs. Which little box turns one hole into many?\"\n\n[[Try again->X1]]]", "X1 R": "(set: $miss to 0)## ✅ Job done\n**A hub.** One oval port in, many ports out. An adapter changes one plug's shape. A hub gives you more holes.\n\n[[Next question->X2]]", "X2": "<div class=\"scene\">🐈 💻 🔥</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Air comes in at the bottom and blows out the back.\"><rect x=\"14\" y=\"20\" width=\"170\" height=\"86\" rx=\"8\" fill=\"#8a96a3\"/><rect x=\"40\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"49\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"58\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"67\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"76\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"85\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"94\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"103\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"112\" y=\"34\" width=\"4\" height=\"22\" rx=\"2\" fill=\"#1b1f24\"/> ite\n*The Inspector raises an eyebrow.* \"What are the slots for? Warm air has to get out.\"\n\n[[Try again->X2]]]", "X2 W3": "(set: $mx to it + (a: \"question 2\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Back to the hot potato in a blanket burrito.</div>\n\n## Let me show you\n*The Inspector leans over.* \"**Keep the vents clear.** Warm air needs a way out, or the laptop gets too hot.\"\n\n[[Got it->X2 R]]](else:)[<div class=\"oops\">Back to the hot potato in a blanket burrito.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"What are the slots for? Warm air has to get out.\"\n\n[[Try again->X2]]]", "X2 R": "(set: $miss to 0)## ✅ Job done\n**Clear vents on a hard, flat spot.** A cat, a towel or a bed blocks the air. Then the laptop shuts off. Pickles can nap beside it.\n\n[[Next question->X3]]", "X3": "<div class=\"scene\">🧴 ⌨️ 🖥️</div>\n\n**Question 3 of 12.** **Ms. Abara** is back, and she knows the liquid rule now! Her cloth has a little 70% alcohol on it. A grown-up holds the bottle. She wants to clean her laptop keys and her screen.\n\n**Where can the alcohol cloth go?**\n\n* [[Keys only, not the screen->X3 R]]\n* [[Keys and screen, to save time->X3 W2]]\n* [[The screen only, not the keys->X3 W3]]\n* [[Neither one, use tap water->X3 W4]]", "X3 W2": "(set: $mx to it + (a: \"question 3\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Alcohol can wear off a screen's coating.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Keys and mice get **alcohol**. Screens get **distilled water**, because alcohol can wear off the coating.\"\n\n[[Got it->X3 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Alcohol can wear off a screen's coating.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Alcohol is for keys, shells and mice. What do screens get?\"\n\n[[Try again->X3]]]", "X3 W3": "(set: $mx to it + (a: \"question 3\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The I  eyebrow.* \"Frost means liquid came out, not air. Which way keeps the liquid down?\"\n\n[[Try again->X4]]]", "X4 W4": "(set: $mx to it + (a: \"question 4\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Hold it **upright** and use **short puffs**. Tipped or shaken, the freezing liquid sprays out.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Frost means liquid came out, not air. Which way keeps the liquid down?\"\n\n[[Try again->X4]]]", "X4 R": "(set: $miss to 0)## ✅ Job done\n**Upright, short puffs.** Tipping or shaking lets the freezing liquid out. It can hurt skin and the computer. The Inspector checks the name tag. Theo, not Leo. Phew.\n\n[[Next question->X5]]", "X5": "<div class=\"scene\">🔧 ⌨️ 🍪</div>\n\n**Question 5 of 12.** **Ben** is back, and he put the butter knife down! His new keyboard is mechanical. The caps lift off. Crumbs hide under them.\n\n**What lifts the caps off?**\n\n* [[A keycap puller, after a photo->X5 R]]\n* [[A butter knife, slid under gently->X5 W2]]\n* [[A screwdriver to pry up each cap->X5 W3]]\n* [[His fingernails, pulling really hard->X5 W4]]", "X5 W2": "(set: $mx to it + (a: \"question 5\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">Ben! The butter knife is for butter.</div>\n\n## Let me show you\n*The Inspector leans over.* \"A **keycap puller**. Take a photo first so the caps go back right.\"\n\n[[Got it->X5 R]]](else:)[<div class=\"oops\">Ben! The butter knife is for butter.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"There is a tool made just for caps. It has cap in its name.\"\n\n[[Try again->X5]]]", "X5 W3": "(set: $mx to it + (a: \"question 5\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **keycap puller**. Take a photo first so the caps go back right.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"There is a tool made just for caps. It h (function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  // "Copy my results for Rocky": fills in the learner's first-try score and who they needed help with, copies it, and shows it
  out.addEventListener('click',e=>{const b=e.target.closest('.rocky-copy');if(!b)return;
    const miss=[...new Set(S[b.dataset.key]||[])];const tot=+b.dataset.total;
    const msg=b.dataset.msg.replace('{first}',String(Math.max(0,tot-miss.length))).replace('{missed}',miss.length?miss.join(', '):(b.dataset.none||'nobody'));
    const wrap=b.parentNode,box=wrap.querySelector('.rocky-box'),ok=wrap.querySelector('.rocky-ok');box.hidden=false;box.textContent=msg;
    const done=y=>{ok.textContent=y?'✅ Copied! Now paste it into your chat with Rocky.':"Copy didn't work here. Select the words above, copy them, then paste them into your chat with Rocky.";};
    const fallback=()=>{try{const r=document.createRange();r.selectNodeContents(box);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);done(document.execCommand('copy')===true);}catch(_){done(false);}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(msg).then(()=>done(true),fallback);else fallback();}catch(_){fallback();}
  });
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly, unlocks the days before it, and lets the schedule open day N today ($open)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),...Object.keys(STORY.passages).map(k=>(k.match(/^D(\d+) Start$/)||[])[1]).filter(Boolean)]));S.open=99;show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];S.open=n;show((n===1&&!(S.days||[]).length&&('Start' in STORY.passages))?'Start':'D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
