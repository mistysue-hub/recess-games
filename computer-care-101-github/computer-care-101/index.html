0 70\" role=\"img\" aria-label=\"Laptop\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"53\" width=\"20\" height=\"4\" rx=\"1\" fill=\"#5a636c\"/></svg><b>Laptop</b>folds shut, all in one case</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Desktop\"><rect x=\"4\" y=\"8\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"8\" y=\"12\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"28\" y=\"46\" width=\"8\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"18\" y=\"56\" width=\"28\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/><rect x=\"70\" y=\"10\" width=\"24\" height=\"52\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><circle cx=\"82\" cy=\"20\" r=\"3\" fill=\"#6fe3b5\"/><line x1=\"75\" y1=\"32\" x2=\"89\" y2=\"32\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"75\" y1=\"38\" x2=\"89\" y2=\"38\" stroke=\"#ffb347\" stroke-width=\"2\"/></svg><b>Desktop</b>the tower is the computer</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"All-in-one\"><rect x=\"14\" y=\"4\" width=\"72\" height=\"46\" rx=\"3\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"4\"/><rect x=\"19\" y=\"9\" width=\"62\" height=\"36\" fill=\"#2f4a5c\"/><polygon points=\"44,50 56,50 60,62 40,62\" fill=\"#9aa4ae\"/><rect x=\"34\" y=\"62\" width=\"32\" height=\"4\" rx=\"2\" fill=\"#9aa4ae\"/></svg><b>All-in-one</b>computer inside the screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Chromebook\"><rect x=\"22\" y=\"6\" width=\"56\" height=\"38\" rx=\"3\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"30\" fill=\"#2f4a5c\"/><rect x=\"26\" y=\"10\" width=\"48\" height=\"7\" fill=\"#7fd1ff\"/><rect x=\"29\" y=\"12\" width=\"14\" height=\"5\" rx=\"1\" fill=\"#e9ecef\"/><circle cx=\"44\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><circle cx=\"51\" cy=\"27\" r=\"7\" fill=\"#e9ecef\"/><circle cx=\"58\" cy=\"30\" r=\"5\" fill=\"#e9ecef\"/><rect x=\"44\" y=\"30\" width=\"14\" height=\"5\" fill=\"#e9ecef\"/><polygon points=\"16,48 84,48 92,60 8,60\" fill=\"#9aa4ae\"/></svg><b>Chromebook</b>mostly web apps, files often online</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 150\" role=\"img\" aria-label=\"The <b>golden rule</b>: off and unplugged, so no zaps.\"><rect x=\"20\" y=\"20\" width=\"80\" height=\"54\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"25\" y=\"25\" width=\"70\" height=\"44\" fill=\"#111\"/><path d=\"M52.3 41.3 A11 11 0 1 0 67.7 41.3\" stroke=\"#ff6b6b\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"60\" y1=\"36\" x2=\"60\" y2=\"47\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><rect x=\"220\" y=\"26\" width=\"30\" height=\"40\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"229\" y=\"38\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"238\" y=\"38\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"160\" y=\"35\" width=\"24\" height=\"22\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"184\" y=\"39\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"184\" y=\"50\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"160\" y1=\"46\" x2=\"144\" y2=\"46\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><line x1=\"196\" y1=\"87\" x2=\"160\" y2=\"87\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"160,87 167.0,83.2 167.0,90.8\" fill=\"#ffb347\"/><rect x=\"300\" y=\"20\" width=\"80\" height=\"54\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"305\" y=\"25\" width=\"70\" height=\"44\" fill=\"#111\"/><rect x=\"320\" y=\"38\" width=\"40\" height=\"22\" rx=\"6\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M363 18 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"60\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">1. Turn it off</text><text x=\"200\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">2. Unplug it</text><text x=\"340\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">3. Then clean</text><text x=\"200\" y=\"142\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Every time!</text></svg><div class=\"cap\">The <b>golden rule</b>: off and unplugged, so no zaps.</div></div>\n\nOn a desktop, the **tower** is the computer. The monitor is **just a screen**.\n\n[[Got it. Send in the next customer->D1 J2]]", "D1 J2": "<div class=\"scene\">🖥️ ⌨️ 🔌</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at what plugs into the screen. Is there any other box?\"><rect x=\"70\" y=\"8\" width=\"190\" height=\"92\" rx=\"8\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><polygon points=\"146,100 174,100 182,116 138,116\" fill=\"#8a96a3\"/><rect x=\"120\" y=\"116\" width=\"80\" height=\"6\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"226\" y=\"80\" width=\"18\" height=\"12\" rx=\"2\" fill=\"#1b1f24\"/><path d=\"M244 86 C 268 86, 262 64, 282 64\" stroke=\"#5b6573\" stroke-width=\"5\" fill=\"none\"/><rect x=\"290\" y=\"53\" width=\"24\" height=\"22\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"314\" y=\"57\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"314\" y=\"68\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"290\" y1=\"64\" x2=\"274\" y2=\"64\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"326\" y=\"44\" width=\"30\" height=\"40\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"335\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"344\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"6\" y=\"100\" width=\"54\" height=\"20\" rx=\"3\" fill=\"#6b5a8e\"/><rect x=\"11\" y=\"105\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"11\" y=\"112\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"21\" y=\"105\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"21\" y=\"112\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"31\" y=\"105\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"31\" y=\"112\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"41\" y=\"105\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"41\" y=\"112\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"51\" y=\"105\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><rect x=\"51\" y=\"112\" width=\"7\" height=\"4\" fill=\"#cfd6dd\"/><path d=\"M33 100 C 40 80, 52 74, 70 74\" stroke=\"#5b6573\" stroke-width=\"4\" fill=\"none\"/><rect x=\"66\" y=\"69\" width=\"10\" height=\"10\" rx=\"2\" fill=\"#1b1f24\"/><text x=\"165\" y=\"62\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Mr. Chen's screen</text><text x=\"165\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">(from the back)</text><text x=\"33\" y=\"133\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"12\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">keyboard</text></svg><div class=\"cap\">Look at what plugs into the screen. Is there any other box?</div></div>\n\n**Mr. Chen** has a big screen. There is no tower anywhere. His keyboard plugs into the screen. No cable goes to another box.\n\n**What kind of computer is it?**\n\n* [[A desktop with the tower hidden away->D1 J2 W1]]\n* [[An all-in-one, computer inside->D1 J2 R]]\n* [[Only a big monitor, no computer->D1 J2 W3]]\n* [[A laptop missing its keyboard->D1 J2 W4]]", "D1 J2 W1": "(set: $m1 to it + (a: \"Mr. Chen\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The computer is hiding inside the screen. That's an **all-in-one**.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where could the computer be, if there is no other box?\"\n\n[[Try again->D1 J2]]]", "D1 J2 W3": "(set: $m1 to it + (a: \"Mr. Chen\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The computer is hiding inside the screen. That's an **all-in-one**.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where could the computer be, if there is no other box?\"\n\n[[Try again->D1 J2]]]", "D1 J2 W4": "(set: $m1 to it + (a: \"Mr. Chen\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The computer is hiding inside the screen. That's an **all-in-one**.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where could the computer be, if there is no other box?\"\n\n[[Try again->D1 J2]]]", "D1 J2 R": "(set: $miss to 0)## ✅ Job done\n**All-in-one.** No tower and no cable to another box? The computer is hiding inside the screen.\n\n[[Next customer->D1 S1]]", "D1 S1": "## 🎲 Computer or just a screen? (1 of 7)\n\nIs it the computer, or just a helper?\n\n*The Inspector holds up:*\n\n### A tower under a desk\n\n* [[🧠 The computer->D1 S1 R]]\n* [[📺 Not the computer->D1 S1 W]]", "D1 S1 R": "## ✅ Right: it is a computer\n**A tower under a desk.** The tower holds the computer parts.\n\n[[Next one->D1 S2]]", "D1 S1 W": "## ❌ Not this time: it is a computer\n**A tower under a desk.** The tower holds the computer parts.\n\n[[Next one->D1 S2]]", "D1 S2": "## 🎲 Computer or just a screen? (2 of 7)\n\n*The Inspector holds up:*\n\n### A desktop's monitor\n\n* [[🧠 The computer->D1 S2 W]]\n* [[📺 Not the computer->D1 S2 R]]", "D1 S2 R": "## ✅ Right: it is only a helper or a screen\n**A desktop's monitor.** It only shows the picture.\n\n[[Next one->D1 S3]]", "D1 S2 W": "## ❌ Not this time: it is only a helper or a screen\n**A desktop's monitor.** It only shows the picture.\n\n[[Next one->D1 S3]]", "D1 S3": "## 🎲 Computer or just a screen? (3 of 7)\n\n*The Inspector holds up:*\n\n### A laptop\n\n* [[🧠 The computer->D1 S3 R]]\n* [[📺 Not the computer->D1 S3 W]]", "D1 S3 R": "## ✅ Right: it is a computer\n**A laptop.** Screen, keys and computer in one case.\n\n[[Next one->D1 S4]]", "D1 S3 W": "## ❌ Not this time: it is a computer\n**A laptop.** Screen, keys and computer in one case.\n\n[[Next one->D1 S4]]", "D1 S4": "## 🎲 Computer or just a screen? (4 of 7)\n\n*The Inspector holds up:*\n\n### A keyboard\n\n* [[🧠 The computer->D1 S4 W]]\n* [[📺 Not the computer->D1 S4 R]]", "D1 S4 R": "## ✅ Right: it is only a helper or a screen\n**A keyboard.** It only sends your typing.\n\n[[Next one->D1 S5]]", "D1 S4 W": "## ❌ Not this time: it is only a helper or a screen\n**A keyboard.** It only sends your typing.\n\n[[Next one->D1 S5]]", "D1 S5": "## 🎲 Computer or just a screen? (5 of 7)\n\n*The Inspector holds up:*\n\n### An all-in-one\n\n* [[🧠 The computer->D1 S5 R]]\n* [[📺 Not the computer->D1 S5 W]]", "D1 S5 R": "## ✅ Right: it is a computer\n**An all-in-one.** The computer hides inside the screen.\n\n[[Next one->D1 S6]]", "D1 S5 W": "## ❌ Not this time: it is a computer\n**An all-in-one.** The computer hides inside the screen.\n\n[[Next one->D1 S6]]", "D1 S6": "## 🎲 Computer or just a screen? (6 of 7)\n\n*The Inspector holds up:*\n\n### A mouse\n\n* [[🧠 The computer->D1 S6 W]]\n* [[📺 Not the computer->D1 S6 R]]", "D1 S6 R": "## ✅ Right: it is only a helper or a screen\n**A mouse.** It only points and clicks.\n\n[[Next one->D1 S7]]", "D1 S6 W": "## ❌ Not this time: it is only a helper or a screen\n**A mouse.** It only points and clicks.\n\n[[Next one->D1 S7]]", "D1 S7": "## 🎲 Computer or just a screen? (7 of 7)\n\n*The Inspector holds up:*\n\n### A Chromebook\n\n* [[🧠 The computer->D1 S7 R]]\n* [[📺 Not the computer->D1 S7 W]]", "D1 S7 R": "## ✅ Right: it is a computer\n**A Chromebook.** A small laptop. It is a real computer.\n\n[[Next customer->D1 J4]]", "D1 S7 W": "## ❌ Not this time: it is a computer\n**A Chromebook.** A small laptop. It is a real computer.\n\n[[Next customer->D1 J4]]", "D1 J4": "<div class=\"scene\">💻 🔌 💧</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the screen and the cord.\"><rect x=\"40\" y=\"8\" width=\"120\" height=\"78\" rx=\"4\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"45\" y=\"13\" width=\"110\" height=\"68\" fill=\"#4f86a8\"/><rect x=\"52\" y=\"20\" width=\"50\" height=\"6\" rx=\"2\" fill=\"#cfe8f5\"/><rect x=\"52\" y=\"32\" width=\"70\" height=\"6\" rx=\"2\" fill=\"#cfe8f5\"/><polygon points=\"32,90 168,90 180,106 20,106\" fill=\"#9aa4ae\"/><circle cx=\"158\" cy=\"98\" r=\"3\" fill=\"#6fe3b5\"/><rect x=\"96\" y=\"40\" width=\"44\" height=\"34\" rx=\"3\" fill=\"#f2f4f6\" transform=\"rotate(-10 118 57)\"/><path d=\"M108 80 q-4 7 0 10 q4 -3 0 -10 Z\" fill=\"#7fd1ff\"/><path d=\"M124 84 q-4 7 0 10 q4 -3 0 -10 Z\" fill=\"#7fd1ff\"/><path d=\"M138 76 q-4 7 0 10 q4 -3 0 -10 Z\" fill=\"#7fd1ff\"/><path d=\"M180 100 C 230 100, 230 64, 266 64\" stroke=\"#5b6573\" stroke-width=\"5\" fill=\"none\"/><rect x=\"282\" y=\"53\" width=\"24\" height=\"22\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"306\" y=\"57\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"306\" y=\"68\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"282\" y1=\"64\" x2=\"266\" y2=\"64\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"318\" y=\"44\" width=\"30\" height=\"40\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"327\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><rect x=\"336\" y=\"56\" width=\"3\" height=\"9\" fill=\"#9aa4ae\"/><text x=\"100\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Oscar's laptop</text><text x=\"300\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">his charger cord</text></svg><div class=\"cap\">Look at the screen and the cord.</div></div>\n\n**Oscar** wipes his laptop screen with a wet paper towel. The laptop is on and plugged in.\n\n**What should Oscar do first?**\n\n* [[Turn the brightness up to see dirt->D1 J4 W1]]\n* [[Wipe fast so water can't soak in->D1 J4 W2]]\n* [[Add window cleaner to the towel->D1 J4 W3]]\n* [[Turn it off and then unplug it->D1 J4 R]]", "D1 J4 W1": "(set: $m1 to it + (a: \"Oscar\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Golden rule: **turn it off and unplug it first.**\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Water and a live plug are a bad mix. Look at the golden rule picture.\"\n\n[[Try again->D1 J4]]]", "D1 J4 W2": "(set: $m1 to it + (a: \"Oscar\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Golden rule: **turn it off and unplug it first.**\"\n\n[[Got it->D1 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Water and a live plug are a bad mix. Look at the golden rule picture.\"\n\n[[Try again->D1 J4]]]", "D1 J4 W3": "(set: $m1 to it + (a: \"Oscar\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">That's Kiosk advice. Laptops HATE baths.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Golden rule: **turn it off and unplug it first.**\"\n\n[[Got it->D1 J4 R]]](else:)[<div class=\"oops\">That's Kiosk advice. Laptops HATE baths.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"Water and a live plug are a bad mix. Look at the golden rule picture.\"\n\n[[Try again->D1 J4]]]", "D1 J4 R": "(set: $miss to 0)## ✅ Job done\n**Off and unplugged, every time.** Water plus power can zap it. Tomorrow: why paper towels stay away from screens.\n\n[[The Inspector has something to show you->D1 L5]]", "D1 L5": "## 📘 The Inspector's lesson: The Port Tour\n\n\"Ports are the holes where plugs go. Learn their shapes.\"\n\n<div class=\"ports\"><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"8\" y=\"10\" width=\"44\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"12\" y=\"14\" width=\"36\" height=\"6\" fill=\"#ffb347\"/></svg><figcaption><b>USB-A</b>flat rectangle, fits one way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"12\" y=\"13\" width=\"36\" height=\"14\" rx=\"7\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"19\" y=\"18\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#ffb347\"/></svg><figcaption><b>USB-C</b>small oval, fits either way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V22 L46 28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"14\" y=\"16\" width=\"32\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>HDMI</b>flat, two cut corners, TV picture</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M16 7 H44 V29 H36 V34 H24 V29 H16 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><g stroke=\"#ffb347\" stroke-width=\"2\"><line x1=\"21\" y1=\"11\" x2=\"21\" y2=\"16\"/><line x1=\"26\" y1=\"11\" x2=\"26\" y2=\"16\"/><line x1=\"31\" y1=\"11\" x2=\"31\" y2=\"16\"/><line x1=\"36\" y1=\"11\" x2=\"36\" y2=\"16\"/><line x1=\"40\" y1=\"11\" x2=\"40\" y2=\"16\"/></g></svg><figcaption><b>Ethernet</b>squarish, cable has a clip</figcaption></figure></div>\n\n**USB-A** fits one way, like a key. The pins inside are **thin metal**. Forcing it bends them.\n\nNeed a different shape? An **adapter** changes the plug. A **hub** is a little box that turns one hole into many.\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 130\" role=\"img\" aria-label=\"New laptops may have <b>only USB-C</b>. An <b>adapter</b> or <b>hub</b> joins old plugs.\"><line x1=\"6\" y1=\"50\" x2=\"30\" y2=\"50\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"30\" y=\"38\" width=\"34\" height=\"24\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"64\" y=\"41\" width=\"26\" height=\"18\" fill=\"#c8cfd6\"/><line x1=\"100\" y1=\"50\" x2=\"132\" y2=\"50\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"132,50 125.0,53.8 125.0,46.2\" fill=\"#ffb347\"/><rect x=\"142\" y=\"32\" width=\"92\" height=\"36\" rx=\"8\" fill=\"#3a434d\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><rect x=\"150\" y=\"40\" width=\"26\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"234\" y=\"44\" width=\"22\" height=\"12\" rx=\"6\" fill=\"#c8cfd6\"/><line x1=\"266\" y1=\"50\" x2=\"300\" y2=\"50\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"300,50 293.0,53.8 293.0,46.2\" fill=\"#ffb347\"/><rect x=\"310\" y=\"20\" width=\"80\" height=\"60\" rx=\"6\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"332\" y=\"42\" width=\"34\" height=\"16\" rx=\"8\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><text x=\"60\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">USB-A plug</text><text x=\"188\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">adapter</text><text x=\"350\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">USB-C port</text><text x=\"200\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"normal\">A hub: one hole becomes many.</text></svg><div class=\"cap\">New laptops may have <b>only USB-C</b>. An <b>adapter</b> or <b>hub</b> joins old plugs.</div></div>\nThe **router** is the box that brings the internet. An **Ethernet** cable gives your computer its own path to it.\n\n[[Got it. Send in the next customer->D1 J6]]", "D1 J6": "<div class=\"scene\"><svg viewBox=\"0 0 64 40\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"USB flash drive\"><rect x=\"2\" y=\"8\" width=\"38\" height=\"24\" rx=\"6\" fill=\"#6b5a8e\"/><circle cx=\"12\" cy=\"20\" r=\"3\" fill=\"#1b1f24\"/><rect x=\"40\" y=\"11\" width=\"22\" height=\"18\" fill=\"none\" stroke=\"#c9d1d9\" stroke-width=\"3\"/><rect x=\"42\" y=\"13\" width=\"18\" height=\"6\" fill=\"#c9d1d9\"/></svg> 💻 💪</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 125\" role=\"img\" aria-label=\"Look at where the flat bar is inside the plug, and inside the port.\"><rect x=\"12\" y=\"44\" width=\"88\" height=\"40\" rx=\"9\" fill=\"#6b5a8e\"/><rect x=\"100\" y=\"51\" width=\"46\" height=\"26\" fill=\"none\" stroke=\"#c9d1d9\" stroke-width=\"3\"/><rect x=\"103\" y=\"54\" width=\"40\" height=\"9\" fill=\"#c9d1d9\"/><line x1=\"152\" y1=\"64\" x2=\"190\" y2=\"64\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"190,64 183.0,67.8 183.0,60.2\" fill=\"#ff6b6b\"/><rect x=\"200\" y=\"24\" width=\"150\" height=\"80\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"214\" y=\"51\" width=\"46\" height=\"26\" fill=\"#1b1f24\" stroke=\"#7fd1ff\" stroke-width=\"2.5\"/><rect x=\"218\" y=\"54\" width=\"38\" height=\"9\" fill=\"#ffb347\"/><text x=\"78\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Marcus's flash drive</text><text x=\"275\" y=\"120\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the flat rectangle port</text><text x=\"171\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">push!</text></svg><div class=\"cap\">Look at where the flat bar is inside the plug, and inside the port.</div></div>\n\n**Marcus** pushes a flash drive (a small memory stick) into a flat rectangle port. It won't go in. He pushes harder.\n\n**What should Marcus do?**\n\n* [[Push harder, ports can be tight->D1 J6 W1]]\n* [[Wiggle it until it goes in->D1 J6 W2]]\n* [[Stop, flip it, and try gently->D1 J6 R]]\n* [[Blow in the port, then push on->D1 J6 W4]]", "D1 J6 W1": "(set: $m1 to it + (a: \"Marcus\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">The port said no. Ports are shy.</div>\n\n## Let me show you\n*The Inspector leans over.* \"That's **USB-A**. It fits **one way up**. Flip it and go gently.\"\n\n[[Got it->D1 J6 R]]](else:)[<div class=\"oops\">The port said no. Ports are shy.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* \"A key fits a lock one way. Which ports work like a key?\"\n\n[[Try again->D1 J6]]]", "D1 J6 W2": "(set: $m1 to it + (a: \"Marcus\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **USB-A**. It fits **one way up**. Flip it and go gently.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A key fits a lock one way. Which ports work like a key?\"\n\n[[Try again->D1 J6]]]", "D1 J6 W4": "(set: $m1 to it + (a: \"Marcus\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **USB-A**. It fits **one way up**. Flip it and go gently.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A key fits a lock one way. Which ports work like a key?\"\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**Flip it.** The pins inside the port are thin metal. Forcing bends them, and then nothing fits.\n\n[[Next customer->D1 J7]]", "D1 J7": "<div class=\"scene\">💻 📺 🍿</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the shape of the plug end. Which port matches it?\"><path d=\"M8 112 C 60 112, 70 60, 118 60\" stroke=\"#5b6573\" stroke-width=\"9\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"116\" y=\"47\" width=\"40\" height=\"26\" rx=\"4\" fill=\"#4a535d\"/><rect x=\"156\" y=\"51\" width=\"22\" height=\"18\" fill=\"#c9d1d9\"/><line x1=\"184\" y1=\"60\" x2=\"218\" y2=\"60\" stroke=\"#9aa4ae\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><path d=\"M224 30 H346 V60 L330 78 H240 L224 60 Z\" fill=\"#c9d1d9\" stroke=\"#e9ecef\" stroke-width=\"2\"/><rect x=\"242\" y=\"42\" width=\"86\" height=\"12\" rx=\"2\" fill=\"#1b1f24\"/><text x=\"90\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Tasha's cable</text><text x=\"285\" y=\"102\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the plug end, up close</text></svg><div class=\"cap\">Look at the shape of the plug end. Which port matches it?</div></div>\n\n**Tasha** wants a movie on her TV. Her cable's plug is wide and flat, with two cut corners.\n\n**Which port does it go in?**\n\n* [[The small, round headphone hole->D1 J7 W1]]\n* [[USB-C, the small oval port->D1 J7 W2]]\n* [[HDMI, the wide one for TVs->D1 J7 R]]\n* [[The square port with a clip->D1 J7 W4]]", "D1 J7 W1": "(set: $m1 to it + (a: \"Tasha\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **HDMI**, the wide port with two cut corners. It carries the picture and the sound to a TV.\"\n\n[[Got it->D1 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the plug end: wide and flat, with two cut corners. Which port card matches that shape?\"\n\n[[Try again->D1 J7]]]", "D1 J7 W2": "(set: $m1 to it + (a: \"Tasha\"))(set: )[## Let me show you\n*The Inspector leans over.* \"An **Ethernet** cable. Wired internet doesn't share the Wi-Fi.\"\n\n[[Got it->D1 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which cable gives her a private path, so she isn't sharing the air?\"\n\n[[Try again->D1 J9]]]", "D1 J9 R": "(set: $miss to 0)## ✅ Job done\n**Ethernet.** A cable is its own private path. No square port? A USB-to-Ethernet adapter works too.\n\n[[The Inspector has something to show you->D1 L10]]", "D1 L10": "## 📘 The Inspector's lesson: Vents and Power\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>Vents</b> are slots for air. A <b>fan</b> pulls cool air in and pushes hot air out.\"><text x=\"200\" y=\"18\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"bold\">Bottom of a laptop</text><rect x=\"100\" y=\"30\" width=\"200\" height=\"110\" rx=\"10\" fill=\"#3a434d\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"150\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"162\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"174\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"186\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"198\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"210\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"222\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"234\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"246\" y=\"50\" width=\"6\" height=\"40\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"284\" y=\"70\" width=\"16\" height=\"6\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"284\" y=\"82\" width=\"16\" height=\"6\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"284\" y=\"94\" width=\"16\" height=\"6\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"284\" y=\"106\" width=\"16\" height=\"6\" rx= on the bottom and side.</div></div>\n\n**Ms. Rivera's** laptop shuts off when she uses it on her bed. It has slots on the bottom and side. A fan whirs and warm air blows out of them.\n\n**What are those slots?**\n\n* [[Speaker holes, for loud music->D1 J11 W1]]\n* [[Vents, for air in and out->D1 J11 R]]\n* [[Plug-in spots for the charger->D1 J11 W3]]\n* [[Extra ports for very old cables->D1 J11 W4]]", "D1 J11 W1": "(set: $m1 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **vents**. The bed blocks them, so it gets hot and shuts off.\"\n\n[[Got it->D1 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm air is blowing out. What do slots for air have to be called?\"\n\n[[Try again->D1 J11]]]", "D1 J11 W3": "(set: $m1 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **vents**. The bed blocks them, so it gets hot and shuts off.\"\n\n[[Got it->D1 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm air is blowing out. What do slots for air have to be called?\"\n\n[[Try again->D1 J11]]]", "D1 J11 W4": "(set: $m1 to it + (a: \"Ms. Rivera\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **vents**. The bed blocks them, so it gets hot and shuts off.\"\n\n[[Got it->D1 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Warm air is blowing out. What do slots for air have to be called?\"\n\n[[Try again->D1 J11]]]", "D1 J11 R": "(set: $miss to 0)(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]## ✅ Job done\n**Vents.** The bed blocks them, heat builds up, and the laptop shuts off to protect its parts. A hot potato in a blanket burrito! Use a hard, flat surface or a lap desk (a hard tray).\n\n[[Close up shop->D1 Done]]", "D1 Done": "(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]# Day 1 complete!\n\n<div class=\"tool\">🔦 **New tool earned: Port Map**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Look at the sides and back of a computer with a grown-up. Find 2 ports and name them. Take photos or draw a map. Want to see the vents on the bottom? Ask the grown-up to turn it off and flip it for you. Never push anything into a port!</div>\n\n<div class=\"rocky\"><button type=\"button\" class=\"rocky-copy\" data-key=\"m1\" data-total=\"7\" data-none=\"nobody\" data-msg=\"Computer Care 101 Jr · Day 1 complete! Tool earned: 🔦 Port Map. Right on the first try: {first} of 7 customers. Needed help with: {missed}. Field assignment: Look at the sides and back of a computer with a grown-up. Find 2 ports and name them. Take photos or draw a map. Want to see the vents on the bottom? Ask the grown-up to turn it off and flip it for you. Never push anything into a port!\">📋 Copy my results for Rocky</button><div class=\"rocky-box\" hidden></div><div class=\"rocky-ok\">Then paste them into your chat with Rocky. 💬</div></div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### The Port Tour\n\"Ports are the holes where plugs go. Learn their shapes.\"\n\n<div class=\"ports\"><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"8\" y=\"10\" width=\"44\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"12\" y=\"14\" width=\"36\" height=\"6\" fill=\"#ffb347\"/></svg><figcaption><b>USB-A</b>flat rectangle, fits one way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"12\" y=\"13\" width=\"36\" height=\"14\" rx=\"7\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"19\" y=\"18\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#ffb347\"/></svg><figcaption><b>USB-C</b>small oval, fits either way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V22 L46 28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"14\" y=\"16\" width=\"32\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>HDMI</b>flat, two cut corners, TV picture</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M16 7 H44 V29 H36 V34 H24 V29 H16 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><g stroke=\"#ffb347\" stroke-width=\"2\"><line x1=\"21\" y1=\"11\" x2=\"21\" y2=\"16\"/><line x1=\"26\" y1=\"11\" x2=\"26\" y2=\"16\"/><line x1=\"31\" y1=\"11\" x2=\"31\" y2=\"16\"/><line x1=\"36\" y1=\"11\" x2=\"36\" y2=\"16\"/><line x1=\"40\" y1=\"11\" x2=\"40\" y2=\"16\"/></g></svg><figcaption><b>Ethernet</b>squarish, cable has a clip</figcaption></figure></div>\n\n**USB-A** fits one way, like a key. The pins inside are **thin metal**. Forcing it bends them.\n\nNeed a different shape? An **adapter** changes the plug. A **hub** is a little box that turns one hole into many.\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 130\" role=\"img\" aria-label=\"New laptops may have <b>only USB-C</b>. An <b>adapter</b> or <b>hub</b> joins old plugs.\"><line x1=\"6\" y1=\"50\" x2=\"30\" y2=\"50\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"30\" y=\"38\" width=\"34\" height=\"24\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"64\" y=\"41\" width=\"26\" height=\"18\" fill=\"#c8cfd6\"/><line x1=\"100\" y1=\"50\" x2=\"132\" y2=\"50\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"132,50 125.0,53.8 125.0,46.2\" fill=\"#ffb347\"/><rect x=\"142\" y=\"32\" width=\"92\" height=\"36\" rx=\"8\" fill=\"#3a434d\" stroke=\"#ffb347\" stroke-width=\"2.5\"/><rect x=\"150\" y=\"40\" width=\"26\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"234\" y=\"44\" width=\"22\" height=\"12\" rx=\"6\" fill=\"#c8cfd6\"/><line x1=\" le picture. Where does the liquid go?\n\n[[Try again->D2 J3]]]", "D2 J3 W2": "(set: $m2 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Liquid goes on the cloth, never on the device.** Spray drips under the keys.\"\n\n[[Got it->D2 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the liquid rule picture. Where does the liquid go?\n\n[[Try again->D2 J3]]]", "D2 J3 W4": "(set: $m2 to it + (a: \"Ms. Abara\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Liquid goes on the cloth, never on the device.** Spray drips under the keys.\"\n\n[[Got it->D2 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the liquid rule picture. Where does the liquid go?\n\n[[Try again->D2 J3]]]", "D2 J3 R": "(set: $miss to 0)## ✅ Job done\n**Put a little alcohol on a cloth, then wipe.** Ask a grown-up to hold the bottle.\n\n[[Next customer->D2 J4]]", "D2 J4": "<div class=\"scene\">🐕 🙃 ❄️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look at which end of the can is up.\"><g transform=\"translate(148 0) scale(-1 1)\"><g transform=\"rotate(180 74 56)\"><rect x=\"60\" y=\"30\" width=\"28\" height=\"56\" rx=\"5\" fill=\"#7fd1ff\"/><rect x=\"68\" y=\"20\" width=\"12\" height=\"10\" fill=\"#9aa4ae\"/><line x1=\"80\" y1=\"24\" x2=\"104\" y2=\"16\" stroke=\"#9aa4ae\" stroke-width=\"3\"/></g></g><polygon points=\"104,96 222,62 222,128\" fill=\"#ffffff\" opacity=\"0.35\"/><polygon points=\"104,96 200,78 200,114\" fill=\"#ffffff\" opacity=\"0.45\"/><text x=\"150\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffffff\">❄</text><text x=\"176\" y=\"108\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffffff\">❄</text><text x=\"196\" y=\"86\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffffff\">❄</text><text x=\"208\" y=\"118\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffffff\">❄</text><text x=\"80\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Leo's can,</text><text x=\"80\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">how he holds it</text><text x=\"290\" y=\"92\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">what sprays out</text></svg><div class=\"cap\">Look at which end of the can is up.</div></div>\n\n**Grandpa Leo** holds the air can upside down. His dog Biscuit is asleep on the desk, so Leo reaches over him. Frosty white spray shoots out. Biscuit sneezes.\n\n**Why is the spray frosty?**\n\n* [[The can is nearly empty->D2 J4 W1]]\n* [[Liquid from inside came out->D2 J4 R]]\n* [[Cold dust is normal for these cans->D2 J4 W3]]\n* [[He forgot to shake it first->D2 J4 W4]]", "D2 J4 W1": "(set: $m2 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Keep it **upright**. Tipped over, the **cold liquid** comes out, not air.\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the tipped can. Inside is a liquid. Which way did it pour?\n\n[[Try again->D2 J4]]]", "D2 J4 W3": "(set: $m2 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Keep it **upright**. Tipped over, the **cold liquid** comes out, not air.\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the tipped can. Inside is a liquid. Which way did it pour?\n\n[[Try again->D2 J4]]]", "D2 J4 W4": "(set: $m2 to it + (a: \"Grandpa Leo\"))(set: $miss to it + 1)(if: $miss >= 2)[<div class=\"oops\">You shook it. It's now a tiny cold snowman.</div>\n\n## Let me show you\n*The Inspector leans over.* \"Keep it **upright**. Tipped over, the **cold liquid** comes out, not air.\"\n\n[[Got it->D2 J4 R]]](else:)[<div class=\"oops\">You shook it. It's now a tiny cold snowman.</div>\n\n## Not quite\n*The Inspector raises an eyebrow.* Look at the tipped can. Inside is a liquid. Which way did it pour?\n\n[[Try again->D2 J4]]]", "D2 J4 R": "(set: $miss to 0)## ✅ Job done\n**Tipping the can lets the freezing liquid out.** It can hurt skin and the computer. That can is cold as a penguin sneeze. The Inspector sighs: \"Grandpa Leo's.\"\n\n[[Next customer->D2 J5]]", "D2 J5": "<div class=\"scene\">💧 🖥️ ⚪</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the white spots the water left.\"><rect x=\"20\" y=\"30\" width=\"56\" height=\"14\" rx=\"5\" fill=\"#9aa4ae\"/><rect x=\"62\" y=\"44\" width=\"14\" height=\"16\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"38\" y=\"18\" width=\"16\" height=\"12\" rx=\"3\" fill=\"#9aa4ae\"/><path d=\"M69 68 q-6 10 0 14 q6 -4 0 -14 z\" fill=\"#7fd1ff\"/><rect x=\"140\" y=\"10\" width=\"200\" height=\"94\" rx=\"6\" fill=\"#8a96a3\"/><rect x=\"148\" y=\"18\" width=\"184\" height=\"78\" rx=\"2\" fill=\"#2f4a5c\"/><rect x=\"230\" y=\"104\" width=\"20\" height=\"12\" fill=\"#8a96a3\"/><rect x=\"206\" y=\"114\" width=\"68\" height=\"6\" rx=\"3\" fill=\"#8a96a3\"/><ellipse cx=\"176\" cy=\"36\" rx=\"6\" ry=\"4.5\" fill=\"#ffffff\" opacity=\"0.85\"/><ellipse cx=\"204\" cy=\"58\" rx=\"8\" ry=\"6.0\" fill=\"#ffffff\" opacity=\"0.85\"/><ellipse cx=\"250\" cy=\"40\" rx=\"5\" ry=\"3.8\" fill=\"#ffffff\" opacity=\"0.85\"/><ellipse cx=\"290\" cy=\"70\" rx=\"7\" ry=\"5.2\" fill=\"#ffffff\" opacity=\"0.85\"/><ellipse cx=\"318\" cy=\"34\" rx=\"5\" ry=\"3.8\" fill=\"#ffffff\" opacity=\"0.85\"/><ellipse cx=\"232\" cy=\"80\" rx=\"6\" ry=\"4.5\" fill=\"#ffffff\" opacity=\"0.85\"/><ellipse cx=\"170\" cy=\"78\" rx=\"5\" ry=\"3.8\" fill=\"#ffffff\" opacity=\"0.85\"/><ellipse cx=\"270\" cy=\"54\" rx=\"4\" ry=\"3.0\" fill=\"#ffffff\" opacity=\"0.85\"/><text x=\"48\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">what he used</text><text x=\"240\" y=\"132\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Kai's screen now</text></svg><div class=\"cap\">Look at the white spots the water left.</div></div>\n\n**Kai** wiped his screen with tap water. The Quick-Fix Kiosk said that was fine. Now it has white spots.\n\n**What should he use next time?**\n\n* [[Tap water, but rub harder->D2 J5 W1]]\n* [[A little alcohol on a cloth->D2 J5 W2]]\n* [[Window cleaner to lift the spots->D2 J5 W3]]\n* [[Distilled water on microfiber->D2 J5 R]]", "D2 J5 W1": "(set: $m2 to it + (a: \"Kai\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Tap water has **minerals**. **Distilled water** does not, so no spots. Alcohol and window cleaner can wear a screen's coating.\"\n\n[[Got it->D2 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the water card. Which water has no minerals?\n\n[[Try again->D2 J5]]]", "D2 J5 W2": "(set: $m2 to it + (a: \"Kai\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Tap water has **minerals**. **Distilled water** does not, so no spots. Alcohol and window cleaner can wear a screen's coating.\"\n\n[[Got it->D2 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the water card. Which water has no minerals?\n\n[[Try again->D2 J5]]]", "D2 J5 W3": "(set: $m2 to it + (a: \"Kai\"))(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Tap water has **minerals**. **Distilled water** does not, so no spots. Alcohol and window cleaner can wear a screen's coating.\"\n\n[[Got it->D2 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the water card. Which water has no minerals?\n\n[[Try again->D2 J5]]]", "D2 J5 R": "(set: $miss to 0)## ✅ Job done\n**Distilled water on a barely damp microfiber cloth.**\n\n[[The Inspector has something to show you->D2 L6]]", "D2 L6": "## 📘 The Inspector's lesson: The Trouble Bin\n\n\"These stay out of the kit.\"\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🧻</span><b>❌ Paper towels</b>scratch and leave fuzz</div><div class=\"card no\"><span class=\"big\">🪟</span><b>❌ Window cleaner</b>ammonia hurts screens</div><div class=\"card no\"><span class=\"big\">🧪</span><b>❌ Bleach</b>fades plastic and key letters</div><div class=\"card no\"><span class=\"big\">🧽</span><b>❌ Scratchy sponge</b>scratches screens</div><div class=\"card no\"><span class=\"big\">🌪️</span><b>❌ Home vacuum</b>yanks keys, makes static</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"A home vacuum pulls too hard and builds static.\"><rect x=\"40\" y=\"120\" width=\"320\" height=\"34\" rx=\"5\" fill=\"#3a4048\"/><rect x=\"52\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"82\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"112\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"142\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"172\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"232\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"262\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"292\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"322\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"202\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#1b1f24\"/><rect x=\"200\" y=\"62\" width=\"26\" height=\"20\" rx=\"3\" fill=\"#8a96a3\" transform=\"rotate(-18 213 72)\"/><line x1=\"213\" y1=\"112\" x2=\"213\" y2=\"90\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"213,90 216.8,97.0 209.2,97.0\" fill=\"#ffb347\"/><path d=\"M180 40 h66 l-10 14 h-46 z\" fill=\"#9aa4ae\"/><rect x=\"200\" y=\"6\" width=\"26\" height=\"34\" fill=\"#9aa4ae\"/><polygon points=\"272,26 263,42 270,42 265,56 280,37 273,37 278,26\" fill=\"#ffe066\"/><polygon points=\"160,30 151,46 158,46 153,60 168,41 161,41 166,30\" fill=\"#ffe066\"/><text x=\"320\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffe066\" text-anchor=\"middle\" font-weight=\"bold\">Zap!</text><text x=\"320\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffe066\" text-anchor=\"middle\" font-weight=\"normal\">static</text><text x=\"90\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Pop!</text><text x=\"90\" y=\"90\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">key ripped off</text></svg><div class=\"cap\">A home vacuum pulls too hard and builds static.</div></div>\n\nA home vacuum has air rushing past plastic. That builds **static**: a tiny zap that can hurt computer parts. It also yanks off keys.\n\n**Ammonia** is a strong chemical in window spray. It can wear off a screen's coating.\n\n\"Now sort the bin. Kit, or trouble?\"\n\n[[Got it. Send in the next customer->D2 S1]]", "D2 S1": "## 🎲 Sort the cleaning bin (1 of 7)\n\nThe Inspector holds up one thing at a time. Kit, or trouble bin?\n\n*The Inspector holds up:*\n\n### Microfiber cloth\n\n* [[✅ In the kit->D2 S1 R]]\n* [[⛔ Trouble bin->D2 S1 W]]", "D2 S1 R": "## ✅ Right: it belongs in the kit\n**Microfiber cloth.** Tiny threads grab dust and leave no fuzz.\n\n[[Next one->D2 S2]]", "D2 S1 W": "## ❌ Not this time: it belongs in the kit\n**Microfiber cloth.** Tiny threads grab dust and leave no fuzz.\n\n[[Next one->D2 S2]]", "D2 S2": "## 🎲 Sort the cleaning bin (2 of 7)\n\n*The Inspector holds up:*\n\n### Paper towels\n\n* [[✅ In the kit->D2 S2 W]]\n* [[⛔ Trouble bin->D2 S2 R]]", "D2 S2 R": "## ✅ Right: it goes in the trouble bin\n**Paper towels.** They scratch and leave fuzz behind.\n\n[[Next one->D2 S3]]", "D2 S2 W": "## ❌ Not this time: it goes in the trouble bin\n**Paper towels.** They scratch and leave fuzz behind.\n\n[[Next one->D2 S3]]", "D2 S3": "## 🎲 Sort the cleaning bin (3 of 7)\n\n*The Inspector holds up:*\n\n### Window cleaner (the blue spray)\n\n* [[✅ In the kit->D2 S3 W]]\n* [[⛔ Trouble bin->D2 S3 R]]", "D2 S3 R": "## ✅ Right: it goes in the trouble bin\n**Window cleaner (the blue spray).** Its ammonia can wear off a screen's coating.\n\n[[Next one->D2 S4]]", "D2 S3 W": "## ❌ Not this time: it goes in the trouble bin\n**Window cleaner (the blue spray).** Its ammonia can wear off a screen's coating.\n\n[[Next one->D2 S4]]", "D2 S4": "## 🎲 Sort the cleaning bin (4 of 7)\n\n*The Inspector holds up:*\n\n### 70% alcohol on a cloth\n\n* [[✅ In the kit->D2 S4 R]]\n* [[⛔ Trouble bin->D2 S4 W]]", "D2 S4 R": "## ✅ Right: it belongs in the kit\n**70% alcohol on a cloth.** It lifts grease from keys and mice. A grown-up holds the bottle.\n\n[[Next one->D2 S5]]", "D2 S4 W": "## ❌ Not this time: it belongs in the kit\n**70% alcohol on a cloth.** It lifts grease from keys and mice. A grown-up holds the bottle.\n\n[[Next one->D2 S5]]", "D2 S5": "## 🎲 Sort the cleaning bin (5 of 7)\n\n*The Inspector holds up:*\n\n### Household vacuum\n\n* [[✅ In the kit->D2 S5 W]]\n* [[⛔ Trouble bin->D2 S5 R]]", "D2 S5 R": "## ✅ Right: it goes in the trouble bin\n**Household vacuum.** It builds static zaps and yanks off keys.\n\n[[Next one->D2 S6]]", "D2 S5 W": "## ❌ Not this time: it goes in the trouble bin\n**Household vacuum.** It builds static zaps and yanks off keys.\n\n[[Next one->D2 S6]]", "D2 S6": "## 🎲 Sort the cleaning bin (6 of 7)\n\n*The Inspector holds up:*\n\n### Compressed air can\n\n* [[✅ In the kit->D2 S6 R]]\n* [[⛔ Trouble bin->D2 S6 W]]", "D2 S6 R": "## ✅ Right: it belongs in the kit\n**Compressed air can.** Upright, short puffs. A grown-up holds it.\n\n[[Next one->D2 S7]]", "D2 S6 W": "## ❌ Not this time: it belongs in the kit\n**Compressed air can.** Upright, short puffs. A grown-up holds it.\n\n[[Next one->D2 S7]]", "D2 S7": "## 🎲 Sort the cleaning bin (7 of 7)\n\n*The Inspector holds up:*\n\n### Distilled water\n\n* [[✅ In the kit->D2 S7 R]]\n* [[⛔ Trouble bin->D2 S7 W]]", "D2 S7 R": "## ✅ Right: it belongs in the kit\n**Distilled water.** No minerals, so no white spots.\n\n[[Next customer->D2 J8]]", "D2 S7 W": "## ❌ Not this time: it belongs in the kit\n**Distilled water.** No minerals, so no white spots.\n\n[[Next customer->D2 J8]]", "D2 J8": "<div class=\"scene\"><svg viewBox=\"0 0 40 60\" style=\"height:1.1em;width:auto;vertical-align:-0.12em\" role=\"img\" aria-label=\"computer tower\"><rect x=\"6\" y=\"2\" width=\"28\" height=\"56\" rx=\"4\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"11\" y=\"9\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><rect x=\"11\" y=\"15\" width=\"18\" height=\"3\" rx=\"1\" fill=\"#9aa4ae\"/><circle cx=\"20\" cy=\"30\" r=\"6\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"2.5\"/><line x1=\"20\" y1=\"22\" x2=\"20\" y2=\"30\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><line x1=\"11\" y1=\"42\" x2=\"29\" y2=\"42\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"46\" x2=\"29\" y2=\"46\" stroke=\"#5b6573\" stroke-width=\"2\"/><line x1=\"11\" y1=\"50\" x2=\"29\" y2=\"50\" stroke=\"#5b6573\" stroke-width=\"2\"/></svg> 🌫️ 🌪️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 140\" role=\"img\" aria-label=\"Look how much dust is packed into the vents.\"><rect x=\"40\" y=\"8\" width=\"90\" height=\"106\" rx=\"6\" fill=\"#3a4250\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><line x1=\"52\" y1=\"20\" x2=\"118\" y2=\"20\" stroke=\"#1b1f24\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"5  can. Keep paper towels, window spray and bleach out of the kit.</div>\n\n<div class=\"rocky\"><button type=\"button\" class=\"rocky-copy\" data-key=\"m2\" data-total=\"6\" data-none=\"nobody\" data-msg=\"Computer Care 101 Jr · Day 2 complete! Tool earned: 🧽 Cleaning Kit. Right on the first try: {first} of 6 customers. Needed help with: {missed}. Field assignment: Build your own cleaning kit with a grown-up. Find a microfiber cloth, a soft brush and cotton swabs. Ask the grown-up to hold any alcohol or air can. Keep paper towels, window spray and bleach out of the kit.\">📋 Copy my results for Rocky</button><div class=\"rocky-box\" hidden></div><div class=\"rocky-ok\">Then paste them into your chat with Rocky. 💬</div></div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### The Good Stuff\n\"Here is your kit.\"\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Microfiber cloth\"><path d=\"M26 22 q12 -10 24 0 t24 0 v26 q-12 -10 -24 0 t-24 0 z\" fill=\"#7fd1ff\" opacity=\"0.9\"/><line x1=\"32\" y1=\"24\" x2=\"32\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"41\" y1=\"24\" x2=\"41\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"50\" y1=\"24\" x2=\"50\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"59\" y1=\"24\" x2=\"59\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"68\" y1=\"24\" x2=\"68\" y2=\"46\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><path d=\"M30 56 q20 -6 40 0\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" fill=\"none\"/></svg><b>Microfiber cloth</b>grabs dust</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Soft brush\"><rect x=\"44\" y=\"30\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#c98a52\"/><rect x=\"42\" y=\"22\" width=\"16\" height=\"10\" fill=\"#9aa4ae\"/><line x1=\"42\" y1=\"22\" x2=\"40\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"45\" y1=\"22\" x2=\"44\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"48\" y1=\"22\" x2=\"48\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"51\" y1=\"22\" x2=\"52\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"54\" y1=\"22\" x2=\"56\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/><line x1=\"57\" y1=\"22\" x2=\"60\" y2=\"4\" stroke=\"#e8d7b0\" stroke-width=\"2.5\"/></svg><b>Soft brush</b>sweeps out gaps</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Cotton swabs\"><line x1=\"18\" y1=\"22\" x2=\"82\" y2=\"22\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"16\" cy=\"22\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><ellipse cx=\"84\" cy=\"22\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><line x1=\"18\" y1=\"36\" x2=\"82\" y2=\"36\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"16\" cy=\"36\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><ellipse cx=\"84\" cy=\"36\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><line x1=\"18\" y1=\"50\" x2=\"82\" y2=\"50\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"16\" cy=\"50\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/><ellipse cx=\"84\" cy=\"50\" rx=\"9\" ry=\"5\" fill=\"#ffffff\"/></svg><b>Cotton swabs</b>for corners</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Compressed air\"><g transform=\"rotate(0 44 38)\"><rect x=\"30\" y=\"12\" width=\"28\" height=\"56\" rx=\"5\" fill=\"#7fd1ff\"/><rect x=\"38\" y=\"2\" width=\"12\" height=\"10\" fill=\"#9aa4ae\"/><line x1=\"50\" y1=\"6\" x2=\"74\" y2=\"-2\" stroke=\"#9aa4ae\" stroke-width=\"3\"/></g><circle cx=\"82\" cy=\"4\" r=\"3.0\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.8\"/><circle cx=\"89\" cy=\"8\" r=\"2.3\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.8\"/><circle cx=\"96\" cy=\"12\" r=\"1.6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"1.8\"/></svg><b>Compressed air</b>grown-up holds it</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"70% alcohol\"><rect x=\"34\" y=\"20\" width=\"32\" height=\"46\" rx=\"6\" fill=\"#e9ecef\"/><rect x=\"42\" y=\"8\" width=\"16\" height=\"12\" fill=\"#ff6b6b\"/><rect x=\"34\" y=\"34\" width=\"32\" height=\"18\" fill=\"#ffb347\"/><text x=\"50\" y=\"48\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#1b1f24\" text-anchor=\"middle\" font-weight=\"bold\">70%</text></svg><b>70% alcohol</b>cloth only, grown-up pours</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Distilled water\"><path d=\"M30 22 h40 v40 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 z\" fill=\"#7fd1ff\" opacity=\"0.55\"/><rect x=\"42\" y=\"10\" width=\"16\" height=\"12\" fill=\"#9aa4ae\"/><path d=\"M50 32 q-9 12 0 18 q9 -6 0 -18 z\" fill=\"#ffffff\"/></svg><b>Distilled water</b>no minerals, no spots</div></div>\n\n**Distilled water** is water with the minerals taken out. Minerals are what leave white spots.\n\n**Microfiber** is a cloth made of tiny threads. They grab dust.\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 180\" role=\"img\" aria-label=\"<b>Liquid rule:</b> liquid goes on the cloth. Never on the computer.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Spray the device</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Spray the cloth</text><rect x=\"78\" y=\"60\" width=\"84\" height=\"58\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"84\" y=\"66\" width=\"72\" height=\"46\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.45\"/><rect x=\"70\" y=\"118\" width=\"100\" height=\"10\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"18\" y=\"56\" width=\"24\" height=\"40\" rx=\"5\" fill=\"#6fe3b5\"/><rect x=\"24\" y=\"44\" width=\"12\" height=\"12\" fill=\"#9aa4ae\"/><rect x=\"24\" y=\"40\" width=\"26\" height=\"7\" rx=\"2\" fill=\"#9aa4ae\"/><circle cx=\"54\" cy=\"43\" r=\"2.5\" fill=\"#7fd1ff\"/><circle cx=\"63\" cy=\"49\" r=\"2.5\" fill=\"#7fd1ff\"/><circle cx=\"72\" cy=\"43\" r=\"2.5\" fill=\"#7fd1ff\"/><path d=\"M100 130 q3 8 0 12 q-3 -4 0 -12 z\" fill=\"#7fd1ff\"/><path d=\"M114 130 q3 8 0 12 q-3 -4 0 -12 z\" fill=\"#7fd1ff\"/><path d=\"M128 130 q3 8 0 12 q-3 -4 0 -12 z\" fill=\"#7fd1ff\"/><line x1=\"174\" y1=\"39\" x2=\"196\" y2=\"61\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"174\" y1=\"61\" x2=\"196\" y2=\"39\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"168\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">drips get inside</text><rect x=\"222\" y=\"56\" width=\"24\" height=\"40\" rx=\"5\" fill=\"#6fe3b5\"/><rect x=\"228\" y=\"44\" width=\"12\" height=\"12\" fill=\"#9aa4ae\"/><rect x=\"228\" y=\"40\" width=\"26\" height=\"7\" rx=\"2\" fill=\"#9aa4ae\"/><circle cx=\"258\" cy=\"43\" r=\"2.5\" fill=\"#7fd1ff\"/><circle cx=\"267\" cy=\"49\" r=\"2.5\" fill=\"#7fd1ff\"/><circle cx=\"276\" cy=\"43\" r=\"2.5\" fill=\"#7fd1ff\"/><path d=\"M285 50 q12 -10 24 0 t24 0 v26 q-12 -10 -24 0 t-24 0 z\" fill=\"#7fd1ff\" opacity=\"0.9\"/><line x1=\"291\" y1=\"52\" x2=\"291\" y2=\"74\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"300\" y1=\"52\" x2=\"300\" y2=\"74\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"309\" y1=\"52\" x2=\"309\" y2=\"74\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"318\" y1=\"52\" x2=\"318\" y2=\"74\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"327\" y1=\"52\" x2=\"327\" y2=\"74\" stroke=\"#1b1f24\" stroke-width=\"1\" opacity=\"0.5\"/><line x1=\"310\" y1=\"90\" x2=\"310\" y2=\"112\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"310,112 306.2,105.0 313.8,105.0\" fill=\"#6fe3b5\"/><rect x=\"268\" y=\"110\" width=\"84\" height=\"58\" rx=\"4\" fill=\"#8a96a3\"/><rect x=\"274\" y=\"116\" width=\"72\" height=\"46\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.45\"/><rect x=\"260\" y=\"168\" width=\"100\" height=\"10\" rx=\"3\" fill=\"#8a96a3\"/><path d=\"M376 52 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"392\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"end\" font-weight=\"normal\">then</text><text x=\"392\" y=\"116\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"end\" font-weight=\"normal\">wipe</text><line x1=\"200\" y1=\"32\" x2=\"200\" y2=\"170\" stroke=\"#9aa4ae\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/></svg><div class=\"cap\"><b>Liquid rule:</b> liquid goes on the cloth. Never on the computer.</div></div>\n\nWring the cloth until **barely damp**. Drips run into the gaps.\n\n### The Trouble Bin\n\"These stay out of the kit.\"\n\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🧻</span><b>❌ Paper towels</b>scratch and leave fuzz</div><div class=\"card no\"><span class=\"big\">🪟</span><b>❌ Window cleaner</b>ammonia hurts screens</div><div class=\"card no\"><span class=\"big\">🧪</span><b>❌ Bleach</b>fades plastic and key letters</div><div class=\"card no\"><span class=\"big\">🧽</span><b>❌ Scratchy sponge</b>scratches screens</div><div class=\"card no\"><span class=\"big\">🌪️</span><b>❌ Home vacuum</b>yanks keys, makes static</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"A home vacuum pulls too hard and builds static.\"><rect x=\"40\" y=\"120\" width=\"320\" height=\"34\" rx=\"5\" fill=\"#3a4048\"/><rect x=\"52\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"82\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"112\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"142\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"172\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"232\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"262\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"292\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"322\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#8a96a3\"/><rect x=\"202\" y=\"126\" width=\"24\" height=\"20\" rx=\"3\" fill=\"#1b1f24\"/><rect x=\"200\" y=\"62\" width=\"26\" height=\"20\" rx=\"3\" fill=\"#8a96a3\" transform=\"rotate(-18 213 72)\"/><line x1=\"213\" y1=\"112\" x2=\"213\" y2=\"90\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"213,90 216.8,97.0 209.2,97.0\" fill=\"#ffb347\"/><path d=\"M180 40 h66 l-10 14 h-46 z\" fill=\"#9aa4ae\"/><rect x=\"200\" y=\"6\" width=\"26\" height=\"34\" fill=\"#9aa4ae\"/><polygon points=\"272,26 263,42 270,42 265,56 280,37 273,37 278,26\" fill=\"#ffe066\"/><polygon points=\"160,30 151,46 158,46 153,60 168,41 161,41 166,30\" fill=\"#ffe066\"/><text x=\"320\" y=\"60\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffe066\" text-anchor=\"middle\" font-weight=\"bold\">Zap!</text><text x=\"320\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffe066\" text-anchor=\"middle\" font-weight=\"normal\">static</text><text x=\"90\" y=\"70\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"17\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Pop!</text><text x=\"90\" y=\"90\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">key ripped off</text></svg><div class=\"cap\">A home vacuum pulls too hard and builds static.</div></div>\n\nA home vacuum has air rushing past plastic. That builds **static**: a tiny zap that can hurt computer parts. It also yanks off keys.\n\n**Ammonia** is a strong chemical in window spray. It can wear off a screen's coating.\n\n\"Now sort the bin. Kit, or trouble?\"\n\n---\n\n🌙 *That's today's workday. Day 3 opens next time.*\n\n[[Back to the work schedule->Shop]]", "D3 Start": "(set: $miss to 0)(set: $m3 to (a:))# Day 3: Keyboard Cleaning Day\n\n<div class=\"scene\">⌨️ 🍪 🧹</div>\n\n*The Inspector shakes a keyboard. Something crunches. Then he clicks a little counter.* \"This is the Crumb Counter. Today it gets a workout.\"\n\n\"Keyboard cleaning day! Which keys come off. How to clean. What to do in a spill.\"\n\n\n[[Open the shop->D3 L1]]", "D3 L1": "## 📘 The Inspector's lesson: Some Keys Come Off, Some Don't\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"<b>Mechanical</b> keyboards (many gaming ones) have caps that lift off. Laptop keys sit on tiny clips that snap.\"><text x=\"100\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Mechanical</text><text x=\"300\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Laptop</text><line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"190\" stroke=\"#4a525c\" stroke-width=\"2\"/><rect x=\"55\" y=\"132\" width=\"90\" height=\"28\" rx=\"4\" fill=\"#4a525c\"/><rect x=\"94\" y=\"110\" width=\"12\" height=\"22\" fill=\"#ffb347\"/><rect x=\"88\" y=\"117\" width=\"24\" height=\"8\" fill=\"#ffb347\"/><polygon points=\"58,98 142,98 132,62 68,62\" fill=\"#7fd1ff\"/><rect x=\"93\" y=\"90\" width=\"14\" height=\"8\" fill=\"#1b1f24\"/><line x1=\"165\" y1=\"108\" x2=\"165\" y2=\"60\" stroke=\"#6fe3b5\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"165,60 168.8,67.0 161.2,67.0\" fill=\"#6fe3b5\"/><text x=\"30\" y=\"84\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"bold\">cap</text><text x=\"100\" y=\"150\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">switch</text><text x=\"100\" y=\"186\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Pops off a post</text><rect x=\"230\" y=\"150\" width=\"140\" height=\"8\" rx=\"2\" fill=\"#9aa4ae\"/><line x1=\"262\" y1=\"148\" x2=\"338\" y2=\"122\" stroke=\"#ffb347\" stroke-width=\"4\"/><line x1=\"262\" y1=\"122\" x2=\"338\" y2=\"148\" stroke=\"#ffb347\" stroke-width=\"4\"/><rect x=\"245\" y=\"106\" width=\"110\" height=\"14\" rx=\"3\" fill=\"#7fd1ff\"/><text x=\"300\" y=\"80\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">tiny X clips</text><line x1=\"300\" y1=\"86\" x2=\"300\" y2=\"102\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"300,102 296.2,95.0 303.8,95.0\" fill=\"#ffb347\"/><line x1=\"363\" y1=\"111\" x2=\"381\" y2=\"129\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"363\" y1=\"129\" x2=\"381\" y2=\"111\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"372\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">snap!</text><text x=\"300\" y=\"186\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Stays on</text></svg><div class=\"cap\"><b>Mechanical</b> keyboards (many gaming ones) have caps that lift off. Laptop keys sit on tiny clips that snap.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">⌨️</span><b>✅ Mechanical</b>caps lift off</div><div class=\"card no\"><span class=\"big\">💻</span><b>❌ Laptop</b>keys stay on</div><div class=\"card ok\"><span class=\"big\">🔧</span><b>✅ Keycap puller</b>tiny tool lifts caps</div><div class=\"card \"><span class=\"big\">🔘</span><b>Switch</b>button under the key</div></div>\n\nA **keycap** is the top of a key, the part you press. Under it sits the **switch**, the little button that makes it type. Take a photo before you pull any caps, so they go back right.\n\n<div class=\"warn\">**Grown-up needed.** Not sure which kind you have? Leave the keys on. Ask a grown-up first.</div>\n\n[[Got it. Send in the next customer->D3 S1]]", "D3 S1": "## 🎲 Comes Off or Stays On? (1 of 7)\n\nThe Inspector checks what you can take off a keyboard.\n\n*The Inspector holds up:*\n\n### A keycap on a mechanical keyboard\n\n* [[🔧 Comes off->D3 S1 R]]\n* [[🔒 Stays on->D3 S1 W]]", "D3 S1 R": "## ✅ Right: it can come off\n**A keycap on a mechanical keyboard.** A keycap puller lifts it off.\n\n[[Next one->D3 S2]]", "D3 S1 W": "## ❌ Not this time: it can come off\n**A keycap on a mechanical keyboard.** A keycap puller lifts it off.\n\n[[Next one->D3 S2]]", "D3 S2": "## 🎲 Comes Off or Stays On? (2 of 7)\n\n*The Inspector holds up:*\n\n### A key on a laptop\n\n* [[🔧 Comes off->D3 S2 W]]\n* [[🔒 Stays on->D3 S2 R]]", "D3 S2 R": "## ✅ Right: it stays on\n**A key on a laptop.** Tiny clips hold it, and they snap.\n\n[[Next one->D3 S3]]", "D3 S2 W": "## ❌ Not this time: it stays on\n**A key on a laptop.** Tiny clips hold it, and they snap.\n\n[[Next one->D3 S3]]", "D3 S3": "## 🎲 Comes Off or Stays On? (3 of 7)\n\n*The Inspector holds up:*\n\n### A keycap on a gaming keyboard\n\n* [[🔧 Comes off->D3 S3 R]]\n* [[🔒 Stays on->D3 S3 W]]", "D3 S3 R": "## ✅ Right: it can come off\n**A keycap on a gaming keyboard.** Most gaming keyboards are mechanical. Puller time.\n\n[[Next one->D3 S4]]", "D3 S3 W": "## ❌ Not this time: it can come off\n**A keycap on a gaming keyboard.** Most gaming keyboards are mechanical. Puller time.\n\n[[Next one->D3 S4]]", "D3 S4": "## 🎲 Comes Off or Stays On? (4 of 7)\n\n*The Inspector holds up:*\n\n### A big Enter key on a mechanical keyboard\n\n* [[🔧 Comes off->D3 S4 R]]\n* [[🔒 Stays on->D3 S4 W]]", "D3 S4 R": "## ✅ Right: it can come off\n**A big Enter key on a mechanical keyboard.** Lift both ends together. It has a bar under it.\n\n[[Next one->D3 S5]]", "D3 S4 W": "## ❌ Not this time: it can come off\n**A big Enter key on a mechanical keyboard.** Lift both ends together. It has a bar under it.\n\n[[Next one->D3 S5]]", "D3 S5": "## 🎲 Comes Off or Stays On? (5 of 7)\n\n*The Inspector holds up:*\n\n### The switch under a keycap\n\n* [[🔧 Comes off->D3 S5 W]]\n* [[🔒 Stays on->D3 S5 R]]", "D3 S5 R": "## ✅ Right: it stays on\n**The switch under a keycap.** It is the typing button. Leave it be.\n\n[[Next one->D3 S6]]", "D3 S5 W": "## ❌ Not this time: it stays on\n**The switch under a keycap.** It is the typing button. Leave it be.\n\n[[Next one->D3 S6]]", "D3 S6": "## 🎲 Comes Off or Stays On? (6 of 7)\n\n*The Inspector holds up:*\n\n### A key on a keyboard you're unsure about\n\n* [[🔧 Comes off->D3 S6 W]]\n* [[🔒 Stays on->D3 S6 R]]", "D3 S6 R": "## ✅ Right: it stays on\n**A key on a keyboard you're unsure about.** Not sure? Leave it on and ask a grown-up.\n\n[[Next one->D3 S7]]", "D3 S6 W": "## ❌ Not this time: it stays on\n**A key on a keyboard you're unsure about.** Not sure? Leave it on and ask a grown-up.\n\n[[Next one->D3 S7]]", "D3 S7": "## 🎲 Comes Off or Stays On? (7 of 7)\n\n*The Inspector holds up:*\n\n### The space bar on a laptop\n\n* [[🔧 Comes off->D3 S7 W]]\n* [[🔒 Stays on->D3 S7 R]]", "D3 S7 R": "## ✅ Right: it stays on\n**The space bar on a laptop.** Laptop keys stay on, big or small.\n\n[[The Inspector has something to show you->D3 L3]]", "D3 S7 W": "## ❌ Not this time: it stays on\n**The space bar on a laptop.** Laptop keys stay on, big or small.\n\n[[The Inspector has something to show you->D3 L3]]", "D3 L3": "## 📘 The Inspector's lesson: The Weekly Clean\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Unplug\"><rect x=\"10\ q-5 4 0 8\" stroke=\"#e9ecef\" stroke-width=\"2\" fill=\"none\"/></svg><b>4. Wipe</b>barely damp cloth</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"Loose stuff first. Then wipe the top.\"><text x=\"100\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Wipe first</text><text x=\"300\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Tap first</text><line x1=\"200\" y1=\"8\" x2=\"200\" y2=\"165\" stroke=\"#4a525c\" stroke-width=\"2\"/><rect x=\"45\" y=\"34\" width=\"110\" height=\"16\" rx=\"4\" fill=\"#6fe3b5\"/><line x1=\"100\" y1=\"52\" x2=\"100\" y2=\"64\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"100,64 96.2,57.0 103.8,57.0\" fill=\"#6fe3b5\"/><rect x=\"40\" y=\"68\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"108\" y=\"68\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"30\" y=\"118\" width=\"140\" height=\"8\" fill=\"#4a525c\"/><circle cx=\"100\" cy=\"112\" r=\"5\" fill=\"#c8a165\"/><line x1=\"162\" y1=\"44\" x2=\"178\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"162\" y1=\"60\" x2=\"178\" y2=\"44\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"100\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">crumbs go deeper</text><rect x=\"230\" y=\"42\" width=\"140\" height=\"8\" fill=\"#4a525c\"/><rect x=\"240\" y=\"50\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"308\" y=\"50\" width=\"52\" height=\"22\" rx=\"3\" fill=\"#9aa4ae\"/><line x1=\"300\" y1=\"80\" x2=\"300\" y2=\"118\" stroke=\"#c8a165\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"300,118 296.2,111.0 303.8,111.0\" fill=\"#c8a165\"/><circle cx=\"300\" cy=\"126\" r=\"5\" fill=\"#c8a165\"/><path d=\"M363 100 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"152\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"normal\">crumbs fall out</text></svg><div class=\"cap\">Loose stuff first. Then wipe the top.</div></div>\n\nCrumby keyboard? Clean it **every week**. Not crumby? **Once a month** is plenty.\n\nWipe with a cloth that is **barely damp**. Drips run into the gaps.\n\n<div class=\"warn\">**Grown-up needed** to hold the air can. Hold it **upright**. Short puffs. Never breathe it in. Never shake it.</div>\n\n\"Same four steps, in this order.\"\n\n[[Got it. Send in the next customer->D3 J4]]", "D3 J4": "<div class=\"scene\">⌨️ 🍪 🛠️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"The keyboard, just as it came in.\"><rect x=\"14\" y=\"14\" width=\"259\" height=\"91\" rx=\"6\" fill=\"#4a525c\"/><rect x=\"19\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"40\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"61\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"82\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"103\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"124\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"145\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"166\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"187\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"208\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"229\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"250\" y=\"19\" width=\"18\" height=\"18\" rx=\"3\" fill=\"#9aa4ae\"/><rect x= /div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Flip it\"><line x1=\"10\" y1=\"62\" x2=\"90\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><polygon points=\"18,60 50,12 54,16 24,62\" fill=\"#8a96a3\"/><polygon points=\"82,60 50,12 46,16 76,62\" fill=\"#8a96a3\"/><path d=\"M34 46 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/><path d=\"M66 46 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/><path d=\"M40 56 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/></svg><b>2. Flip it</b>liquid drains out</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Blot\"><rect x=\"15\" y=\"32\" width=\"70\" height=\"34\" rx=\"4\" fill=\"#4a525c\"/><rect x=\"19\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9 n<div class=\"tool\">🧹 **New tool earned: Keycap Puller**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Ask a grown-up to help. Shut down your computer and unplug the keyboard. Flip it over a towel and tap. Count the crumbs! Weekly if crumby, monthly if not. A grown-up holds any air can. Then write a spill plan on a sticky note.</div>\n\n<div class=\"rocky\"><button type=\"button\" class=\"rocky-copy\" data-key=\"m3\" data-total=\"7\" data-none=\"nobody\" data-msg=\"Computer Care 101 Jr · Day 3 complete! Tool earned: 🧹 Keycap Puller. Right on the first try: {first} of 7 customers. Needed help with: {missed}. Field assignment: Ask a grown-up to help. Shut down your computer and unplug the keyboard. Flip it over a towel and tap. Count the crumbs! Weekly if crumby, monthly if not. A grown-up holds any air can. Then write a spill plan on a sticky note.\">📋 Copy my results for Rocky</button><div class=\"rocky-box\" hidden></div><div class=\"rocky-ok\">Then paste them into your chat with Rocky. 💬</div></div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### Some Keys Come Off, Some Don't\n<div class=\"pic\"><svg viewBox=\"0 0 400 200\" role=\"img\" aria-label=\"<b>Mechanical</b> keyboards (many gaming ones) have caps that lift off. Laptop keys sit on tiny clips that snap.\"><text x=\"100\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Mechanical</text><text x=\"300\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">Laptop</text><line x1=\"200\" y1=\"10\" x2=\"200\" y2=\"190\" stroke=\"#4a525c\" stroke-width=\"2\"/><rect x=\"55\" y=\"132\" width=\"90\" height=\"28\" rx=\"4\" f \"bold\">snap!</text><text x=\"300\" y=\"186\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Stays on</text></svg><div class=\"cap\"><b>Mechanical</b> keyboards (many gaming ones) have caps that lift off. Laptop keys sit on tiny clips that snap.</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">⌨️</span><b>✅ Mechanical</b>caps lift off</div><div class=\"card no\"><span class=\"big\">💻</span><b>❌ Laptop</b>keys stay on</div><div class=\"card ok\"><span class=\"big\">🔧</span><b>✅ Keycap puller</b>tiny tool lifts caps</div><div class=\"card \"><span class=\"big\">🔘</span><b>Switch</b>button under the key</div></div>\n\nA **keycap** is the top of a key, the part you press. Under it sits the **switch**, the little button that makes it type. Take a photo before you pull any caps, so they go back right.\n\n<div class=\"warn\">**Grown-up needed.** Not sure which kind you have? Leave the keys on. Ask a grown-up first.</div>\n\n### The Weekly Clean\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Unplug\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"41\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"10\" y1=\"36\" x2=\"0\" y2=\"36\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"60\" y=\"14\" width=\"34\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"70\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"81\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/></svg><b>1. Unplug</b>or it types junk</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Flip + tap\"><rect x=\"15\" y=\"8\" width=\"70\" height=\"12\" rx=\"3\" fill=\"#4a525c\"/><rect x=\"19\" y=\"20\" width=\"8\" height=\"5\" fill=\"#9aa4ae\"/><rect x=\"2
