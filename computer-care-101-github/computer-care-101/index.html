<div class=\"warn\">**Grown-up needed** if pain doesn't go away, or your hands tingle or feel numb. Tell a grown-up. You may need a doctor.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Take the Unit 1 Exam->Exam Start]]", "Exam Start": "(set: $miss to 0)# 🎓 The Inspector's Unit 1 Exam\n\n*The Inspector sets down a clipboard.* \"Twelve questions. Two from each day. Miss twice, and I'll show you. Ready?\"\n\n[[Begin->X1]]", "X1": "<div class=\"scene\">💻 🔌</div>\n\n**Question 1 of 12.** A laptop has a small, rounded oval port. The plug fits in either way up. The laptop charges through it.\n\n**What kind of port is it?**\n\n* [[USB-A->X1 W]]\n* [[USB-C->X1 R]]\n* [[HDMI->X1 W]]\n* [[Ethernet->X1 W]]", "X1 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Small oval, fits either way up, and it charges: **USB-C**.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Small oval, either way up... check your Port Map.\"\n\n[[Try again->X1]]]", "X1 R": "(set: $miss to 0)## ✅ Job done\n**USB-C.** It fits either way up. It can charge, move files, and often send video.\n\n[[Next question->X2]]", "X2": "<div class=\"scene\">🎬 💻 🔥</div>\n\n**Question 2 of 12.** A girl is about to make a big video on her laptop. That will make the laptop work very hard.\n\n**Where should the laptop sit while it works hard?**\n\n* [[On a soft pillow, so it's cushioned->X2 W]]\n* [[Under a blanket, to keep off dust->X2 W]]\n* [[On a bed, so the fans are quiet->X2 W]]\n* [[On a hard, flat spot, vents clear->X2 R]]", "X2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A hard, flat surface with the vents clear.** Then air can flow in and out.\"\n\n[[Got it->X2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What do the vents need?\"\n\n[[Try again->X2]]]", "X2 R": "(set: $miss to 0)## ✅ Job done\n**Hard surface, clear vents.** Soft things block the vents. Then the laptop gets too hot.\n\n[[Next question->X3]]", "X3": "<div class=\"scene\">🧽 💻</div>\n\n**Question 3 of 12.** A boy wants to clean his laptop screen tonight.\n\n**What should he use?**\n\n* [[Off, with a paper towel and some window cleaner->X3 W]]\n* [[Still on, with a bleach wipe and then a dry cloth->X3 W]]\n* [[Off, with a microfiber cloth and distilled water->X3 R]]\n* [[Still on, with a can of compressed air upside down->X3 W]]", "X3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Power off. Use microfiber. Put distilled water **on the cloth**.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think: the golden rule, the right cloth, and where the water goes.\"\n\n[[Try again->X3]]]", "X3 R": "(set: $miss to 0)## ✅ Job done\nTurn it off. Use microfiber. Put a little distilled water on the cloth. Never put it on the screen.\n\n[[Next question->X4]]", "X4": "<div class=\"scene\">🧰 🔍</div>\n\n**Question 4 of 12.** You check a cleaning kit that a kid made at home.\n\n**Which item goes in the trouble bin?**\n\n* [[Window cleaner with ammonia->X4 R]]\n* [[A clean microfiber cloth->X4 W]]\n* [[Distilled water on a cloth->X4 W]]\n* [[70% alcohol on a cotton swab->X4 W]]", "X4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Window cleaner with ammonia** can hurt the coating on a screen. It stays out of the kit.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which one can strip the coating off a screen?\"\n\n[[Try again->X4]]]", "X4 R": "(set: $miss to 0)## ✅ Job done\n**Window cleaner with ammonia.** All the rest are safe if you use them the right way.\n\n[[Next question->X5]]", "X5": "<div class=\"scene\">⌨️ 🍪</div>\n\n**Question 5 of 12.** A crumb is stuck under a laptop key.\n\n**What should you do?**\n\n* [[Power off, then air and a swab->X5 R]]\n* [[Power off, then pry it up with a knife->X5 W]]\n* [[Power off, then pour alcohol in the gap->X5 W]]\n* [[Leave it on and hit the key hard->X5 W]]", "X5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Laptop keys stay on. Power off. Then use **air and a swab around the key**.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Do laptop keys come off?\"\n\n[[Try again->X5]]]", "X5 R": "(set: $miss to 0)## ✅ Job done\nLaptop keys stay on, because their clips snap. So clean around them instead.\n\n[[Next question->X6]]", "X6": "<div class=\"scene\">🥤 💦 ⌨️</div>\n\n**Question 6 of 12.** Someone just spilled soda all over their laptop keys.\n\n**What comes first?**\n\n* [[Wipe the keys dry with a towel->X6 W]]\n* [[Put it in a bag of rice->X6 W]]\n* [[Power it off and unplug it->X6 R]]\n* [[Check if it still types->X6 W]]", "X6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Power off and unplug, right away.** Then flip it, blot it, and let it dry.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"First minute, first step...\"\n\n[[Try again->X6]]]", "X6 R": "(set: $miss to 0)## ✅ Job done\n**Power off and unplug.** Then flip it and blot it. Don't wipe. Let it dry for 24 to 48 hours. Soda is sugary. So it may need a cleaning by a pro.\n\n[[Next question->X7]]", "X7": "<div class=\"scene\">🖱️ 🪟</div>\n\n**Question 7 of 12.** A mouse skips and jumps on a clear glass table.\n\n**What's the fix?**\n\n* [[Update the mouse driver->X7 W]]\n* [[Use a mouse pad->X7 R]]\n* [[Change the batteries->X7 W]]\n* [[Turn the DPI up->X7 W]]", "X7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor needs texture. Use a **mouse pad.**\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does the sensor need to see?\"\n\n[[Try again->X7]]]", "X7 R": "(set: $miss to 0)## ✅ Job done\nClear glass gives the sensor nothing to track. A mouse pad gives it texture to see.\n\n[[Next question->X8]]", "X8": "<div class=\"scene\">🖱️ 🪫</div>\n\n**Question 8 of 12.** A wireless mouse lags and jumps a bit more each day.\n\n**What should you try first?**\n\n* [[Buy a new gaming mouse->X8 W]]\n* [[Turn the DPI up as high as it goes->X8 W]]\n* [[Change or charge the battery->X8 R]]\n* [[Move to a glass desk->X8 W]]", "X8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lag that gets worse each day means a **low battery**. Change it or charge it first.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What are the warning signs of a low battery?\"\n\n[[Try again->X8]]]", "X8 R": "(set: $miss to 0)## ✅ Job done\n**Change or charge the battery.** Always try the simple fix first.\n\n[[Next question->X9]]", "X9": "<div class=\"scene\">🖱️ 💨</div>\n\n**Question 9 of 12.** You blast a scroll wheel with compressed air. But some lint is still stuck in the gap around it.\n\n**What do you use to lift it out?**\n\n* [[A thin metal paperclip->X9 W]]\n* [[A sewing needle->X9 W]]\n* [[A wet cotton swab->X9 W]]\n* [[A wooden toothpick->X9 R]]", "X9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **wooden toothpick**. Metal can scratch things or cause a short.\"\n\n[[Got it->X9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check step 5 of the service checklist. Never metal.\"\n\n[[Try again->X9]]]", "X9 R": "(set: $miss to 0)## ✅ Job done\n**A wooden toothpick.** It is gentle and dry, and it is not metal.\n\n[[Next question->X10]]", "X10": "<div class=\"scene\">🔋 🧂 ⚠️</div>\n\n**Question 10 of 12.** You open a mouse's battery door. There is crusty white powder on the batteries.\n\n**What comes first?**\n\n* [[Get a grown-up and put on gloves->X10 R]]\n* [[Brush it off with your fingers->X10 W]]\n* [[Blow the powder off the batteries->X10 W]]\n* [[Close it and keep using the mouse->X10 W]]", "X10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's leaked battery chemicals. **Grown-up and gloves first.**\"\n\n[[Got it->X10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Is that crust safe to touch?\"\n\n[[Try again->X10]]]", "X10 R": "(set: $miss to 0)## ✅ Job done\n**Grown-up and gloves first.** Then take out the batteries and recycle them. Clean the metal contacts with a swab.\n\n[[Next question->X11]]", "X11": "<div class=\"scene\">😣 💻</div>\n\n**Question 11 of 12.** Someone's neck hurts. They use a laptop on a low table every day.\n\n**What's the best fix?**\n\n* [[Tilt the screen way back->X11 W]]\n* [[Use it in bed so the screen is higher->X11 W]]\n* [[Use a stand and a separate keyboard->X11 R]]\n* [[Make the text bigger to read->X11 W]]", "X11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Use a stand to put the screen at **eye level**. Add a **separate keyboard and mouse**.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where should the top of the screen be?\"\n\n[[Try again->X11]]]", "X11 R": "(set: $miss to 0)## ✅ Job done\nUse a stand, plus a separate keyboard and mouse. The screen goes up. Your hands stay comfy.\n\n[[Next question->X12]]", "X12": "<div class=\"scene\">👀 ⏱️</div>\n\n**Question 12 of 12.** A friend asks you about the 20-20-20 rule.\n\n**What do you tell them?**\n\n* [[Every 20 seconds, look 20 inches away for 20 minutes->X12 W]]\n* [[After 20 hours of screens, rest for 20 minutes->X12 W]]\n* [[Sit 20 inches away at 20 percent brightness->X12 W]]\n* [[Every 20 minutes, look 20 feet away for 20 seconds->X12 R]]", "X12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Every **20 minutes**, look **20 feet** away for **20 seconds**.\"\n\n[[Got it->X12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Minutes, feet, seconds...\"\n\n[[Try again->X12]]]", "X12 R": "(set: $miss to 0)## ✅ Job done\n**Every 20 minutes, look 20 feet away for 20 seconds.** It gives the focus muscles in your eyes a break.\n\n[[See your results->Certificate]]", "Certificate": "# 🏅 Junior Technician: Unit 1 Complete\n\n<div class=\"scene\">🏅 🎉 🧰</div>\n\n*The Inspector pins a brass badge on you.* \"You did it! You know ports, cleaning, keyboards, mice, and comfy desks.\"\n\n**Your toolbox:** 🔦 Port Map · 🧽 Cleaning Kit · 🧹 Keycap Puller · 🖱️ Mouse Field Guide · 🪛 Service Kit · 🪑 Posture Pro Badge\n\n*Next up: Unit 2, Keep It Healthy.*\n\n[[Back to the work schedule->Shop]]"}};
(function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly and unlocks the days before it (for links from course modules)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),...Object.keys(STORY.passages).map(k=>(k.match(/^D(\d+) Start$/)||[])[1]).filter(Boolean)]));show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];show('D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
