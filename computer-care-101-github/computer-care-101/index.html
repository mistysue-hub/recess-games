oard. Every week. In this order.\"\n\n### Spill Emergency\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Unplug now\"><rect x=\"10\" y=\"22\" width=\"26\" height=\"28\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"28\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><rect x=\"36\" y=\"41\" width=\"10\" height=\"3\" fill=\"#9aa4ae\"/><line x1=\"10\" y1=\"36\" x2=\"0\" y2=\"36\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"60\" y=\"14\" width=\"34\" height=\"44\" rx=\"5\" fill=\"none\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"70\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/><rect x=\"81\" y=\"28\" width=\"3\" height=\"10\" fill=\"#9aa4ae\"/></svg><b>1. Unplug now</b>power + liquid = bad</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Flip it\"><line x1=\"10\" y1=\"62\" x2=\"90\" y2=\"62\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><polygon points=\"18,60 50,12 54,16 24,62\" fill=\"#8a96a3\"/><polygon points=\"82,60 50,12 46,16 76,62\" fill=\"#8a96a3\"/><path d=\"M34 46 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/><path d=\"M66 46 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/><path d=\"M40 56 q-3 5 0 7 q3 -2 0 -7\" fill=\"#7fd1ff\"/></svg><b>2. Flip it</b>laptop = tent</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Blot\"><rect x=\"15\" y=\"32\" width=\"70\" height=\"34\" rx=\"4\" fill=\"#4a525c\"/><rect x=\"19\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"36\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"46\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"19\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"29\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"39\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"49\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"59\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"69\" y=\"56\" width=\"8\" height=\"7\" rx=\"1.5\" fill=\"#9aa4ae\"/><rect x=\"32\" y=\"16\" width=\"36\" height=\"16\" rx=\"4\" fill=\"#6fe3b5\"/><line x1=\"50\" y1=\"2\" x2=\"50\" y2=\"14\" stroke=\"#e9ecef\" stroke-width=\"2.5\" stroke-linecap=\"round\"/><polygon points=\"50,14 46.2,7.0 53.8,7.0\" fill=\"#e9ecef\"/></svg><b>3. Blot</b>press, don't wipe</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Dry 1–2 days\"><circle cx=\"50\" cy=\"36\" r=\"24\" fill=\"none\" stroke=\"#6fe3b5\" stroke-width=\"3\"/><line x1=\"50\" y1=\"36\" x2=\"50\" y2=\"19\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"36\" x2=\"65\" y2=\"36\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>4. Dry 1–2 days</b>24 to 48 hours</div></div>\n<div class=\"cards\"><div class=\"card no\"><span class=\"big\">🍚</span><b>❌ No rice</b>no faster, grains get in</div><div class=\"card no\"><span class=\"big\">🔌</span><b>❌ No “just checking”</b>don't turn it on wet</div><div class=\"card ok\"><span class=\"big\">⏱️</span><b>✅ Act fast</b>the first minute counts</div><div class=\"card \"><span class=\"big\">🧃</span><b>Juice or soda?</b>sticky, needs a pro</div></div>\n\n<div class=\"warn\">**Grown-up needed.** Tell a grown-up about a spill right away.</div>\n\n---\n\n[[Back to the work schedule->Shop]]\n[[Start Day 4->D4 Start]]", "D4 Start": "(set: $miss to 0)# Day 4: Meet the Mice\n\n<div class=\"scene\">🗄️ 🖱️ ✨</div>\n\n*The Inspector opens a drawer full of mice.* \"Old ones, new ones! Name it first. Then you know how to care for it.\"\n\n\n[[Open the shop->D4 L1]]", "D4 L1": "## 📘 The Inspector's lesson: How a Mouse Sees\n\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🕰️</span><b>Ball mouse</b>very old. A ball turns rollers.</div><div class=\"card \"><span class=\"big\">💡</span><b>Optical mouse</b>a light + a tiny camera</div><div class=\"card \"><span class=\"big\">🔴</span><b>Laser mouse</b>like optical, reads more surfaces</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Old ball mouse, seen from the bottom. Each roller does one way.\"><ellipse cx=\"130\" cy=\"100\" rx=\"95\" ry=\"85\" fill=\"#2a2f36\" stroke=\"#8a96a3\" stroke-width=\"3\"/><circle cx=\"130\" cy=\"105\" r=\"42\" fill=\"#5b636c\" stroke=\"#8a96a3\" stroke-width=\"2\"/><circle cx=\"117\" cy=\"92\" r=\"10\" fill=\"#7b848e\"/><rect x=\"88\" y=\"47\" width=\"84\" height=\"14\" rx=\"7\" fill=\"#ffb347\"/><rect x=\"174\" y=\"63\" width=\"14\" height=\"84\" rx=\"7\" fill=\"#7fd1ff\"/><line x1=\"172\" y1=\"54\" x2=\"232\" y2=\"40\" stroke=\"#ffb347\" stroke-width=\"2\"/><text x=\"238\" y=\"38\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"start\" font-weight=\"bold\">Up-down roller</text><line x1=\"300\" y1=\"54\" x2=\"300\" y2=\"68\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"300,68 296.2,61.0 303.8,61.0\" fill=\"#ffb347\"/><line x1=\"300\" y1=\"54\" x2=\"300\" y2=\"42\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"300,42 303.8,49.0 296.2,49.0\" fill=\"#ffb347\"/><line x1=\"188\" y1=\"110\" x2=\"232\" y2=\"115\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><text x=\"238\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"bold\">Side-side roller</text><line x1=\"300\" y1=\"128\" x2=\"314\" y2=\"128\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"314,128 307.0,131.8 307.0,124.2\" fill=\"#7fd1ff\"/><line x1=\"300\" y1=\"128\" x2=\"286\" y2=\"128\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"286,128 293.0,124.2 293.0,131.8\" fill=\"#7fd1ff\"/><text x=\"130\" y=\"110\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">ball</text><text x=\"238\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">Gunk = stuck cursor</text></svg><div class=\"cap\">Old ball mouse, seen from the bottom. Each roller does one way.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 195\" role=\"img\" aria-label=\"The mouse's eye needs tiny bumps. Clear glass and mirrors have none.\"><text x=\"200\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Light shines down. A tiny camera looks.</text><path d=\"M20 92 Q35 40 100 46 Q155 52 170 92 Z\" fill=\"#9aa4ae\"/><circle cx=\"80\" cy=\"86\" r=\"5\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"1.5\"/><polygon points=\"100,90 88,112 112,112\" fill=\"#ff6b6b\" opacity=\"0.7\"/><rect x=\"10\" y=\"112\" width=\"170\" height=\"16\" fill=\"#8b5a2b\"/><circle cx=\"18\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"31\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"44\" cy=\"124\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"57\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"70\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"83\" cy=\"124\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"96\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"109\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"122\" cy=\"124\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"135\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"148\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"161\" cy=\"124\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"174\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><path d=\"M86 150 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><text x=\"95\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Wood: bumps to see</text><path d=\"M230 92 Q245 40 310 46 Q365 52 380 92 Z\" fill=\"#9aa4ae\"/><circle cx=\"290\" cy=\"86\" r=\"5\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"1.5\"/><polygon points=\"310,90 298,112 322,112\" fill=\"#ff6b6b\" opacity=\"0.7\"/><rect x=\"220\" y=\"112\" width=\"170\" height=\"10\" fill=\"#7fd1ff\" opacity=\"0.3\" stroke=\"#7fd1ff\" stroke-width=\"1.5\"/><line x1=\"310\" y1=\"122\" x2=\"310\" y2=\"140\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-dasharray=\"4 4\" opacity=\"0.7\"/><line x1=\"296\" y1=\"143\" x2=\"314\" y2=\"161\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"296\" y1=\"161\" x2=\"314\" y2=\"143\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"305\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"bold\">Glass: nothing to see</text></svg><div class=\"cap\">The mouse's eye needs tiny bumps. Clear glass and mirrors have none.</div></div>\n\n**Where does it work?**\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🟦</span><b>✅ Mouse pad</b>the best fix</div><div class=\"card ok\"><span class=\"big\">🪵</span><b>✅ Wood table</b>lots of bumps</div><div class=\"card no\"><span class=\"big\">🪟</span><b>❌ Clear glass</b>cursor jumps</div><div class=\"card no\"><span class=\"big\">🪞</span><b>❌ Mirror</b>cursor jumps</div></div>\n\n[[Got it. Send in the next customer->D4 J2]]", "D4 J2": "<div class=\"scene\">🪟 🖱️ 😵</div>\n\n**Mrs. Lin** got a pretty glass desk. Now her cursor jumps all over.\n\n**Why?**\n\n* [[Glass blocks the mouse's radio signal->D4 J2 W]]\n* [[The mouse needs an update to use glass->D4 J2 W]]\n* [[Clear glass gives it nothing to see->D4 J2 R]]\n* [[The glass makes the mouse get too hot->D4 J2 W]]", "D4 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The mouse's eye needs bumps. **Clear glass has nothing to see.** A mouse pad fixes it.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the glass picture again.\"\n\n[[Try again->D4 J2]]]", "D4 J2 R": "(set: $miss to 0)## ✅ Job done\n**Nothing to track.** Put a mouse pad on the glass.\n\n[[Next customer->D4 J3]]", "D4 J3": "<div class=\"scene\">🗄️ 🖱️ ↕️</div>\n\n**Mr. Abernathy** found an old ball mouse. The cursor goes left and right. It won't go up or down.\n\n**What's wrong?**\n\n* [[The up-down roller is full of gunk->D4 J3 R]]\n* [[The computer only goes side to side->D4 J3 W]]\n* [[The rubber ball has gone totally flat->D4 J3 W]]\n* [[It needs a brand-new laser sensor->D4 J3 W]]", "D4 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**The up-down roller is gunky.** Pop out the ball and clean the rollers.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the ball mouse. Which roller does up and down?\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**Gunky roller.** Twist off the ring, take out the ball, and scrape the rollers clean.\n\n[[The Inspector has something to show you->D4 L4]]", "D4 L4": "## 📘 The Inspector's lesson: Shapes for Different Jobs\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Trackball\"><ellipse cx=\"50\" cy=\"40\" rx=\"34\" ry=\"26\" fill=\"#9aa4ae\"/><circle cx=\"56\" cy=\"38\" r=\"16\" fill=\"#ffb347\"/><circle cx=\"51\" cy=\"33\" r=\"4\" fill=\"#ffd28a\"/><rect x=\"20\" y=\"28\" width=\"9\" height=\"16\" rx=\"3\" fill=\"#1b1f24\"/></svg><b>Trackball</b>stays still. Roll the ball.</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Vertical\"><path d=\"M34 64 L34 22 Q38 4 58 8 Q72 12 70 34 L66 64 Z\" fill=\"#9aa4ae\"/><line x1=\"66\" y1=\"16\" x2=\"70\" y2=\"34\" stroke=\"#1b1f24\" stroke-width=\"2\"/><path d=\"M18 40 q-8 10 4 18\" stroke=\"#6fe3b5\" stroke-width=\"3\" fill=\"none\"/><line x1=\"20\" y1=\"56\" x2=\"28\" y2=\"58\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"28,58 20.3,60.0 22.1,52.6\" fill=\"#6fe3b5\"/></svg><b>Vertical</b>hold it like a handshake</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Gaming\"><path d=\"M28 60 Q20 30 34 12 Q50 2 66 12 Q80 30 72 60 Q50 70 28 60 Z\" fill=\"#9aa4ae\" stroke=\"#6fe3b5\" stroke-width=\"3\"/><line x1=\"50\" y1=\"6\" x2=\"50\" y2=\"30\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"47\" y=\"14\" width=\"6\" height=\"10\" rx=\"2\" fill=\"#ff6b6b\"/><rect x=\"22\" y=\"30\" width=\"7\" height=\"8\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"22\" y=\"40\" width=\"7\" height=\"8\" rx=\"2\" fill=\"#ffb347\"/><rect x=\"50\" y=\"34\" width=\"22\" height=\"12\" rx=\"3\" fill=\"#1b1f24\"/><text x=\"61\" y=\"44\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"10\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">DPI</text></svg><b>Gaming</b>extra buttons + DPI</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Trackpad\"><rect x=\"6\" y=\"18\" width=\"88\" height=\"46\" rx=\"5\" fill=\"#9aa4ae\"/><rect x=\"30\" y=\"34\" width=\"40\" height=\"26\" rx=\"3\" fill=\"#5b636c\"/><circle cx=\"44\" cy=\"50\" r=\"4\" fill=\"#e9ecef\"/><circle cx=\"56\" cy=\"50\" r=\"4\" fill=\"#e9ecef\"/><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"6\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"50,6 53.8,13.0 46.2,13.0\" fill=\"#6fe3b5\"/></svg><b>Trackpad</b>2 fingers slide = scroll</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Drawing tablet\"><rect x=\"8\" y=\"16\" width=\"70\" height=\"48\" rx=\"5\" fill=\"#5b636c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><path d=\"M18 52 q12 -18 26 -6 t20 -10\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/><line x1=\"92\" y1=\"4\" x2=\"66\" y2=\"38\" stroke=\"#ffb347\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"66\" y1=\"38\" x2=\"63\" y2=\"42\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>Drawing tablet</b>a pen (stylus). Press hard = thick line.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 170\" role=\"img\" aria-label=\"<b>DPI</b> = how far the cursor goes. Higher DPI = faster cursor. Nothing is broken.\"><text x=\"10\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">Same small hand move...</text><text x=\"10\" y=\"62\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"bold\">Low DPI</text><ellipse cx=\"115\" cy=\"56\" rx=\"11.200000000000001\" ry=\"16.8\" fill=\"#9aa4ae\"/><line x1=\"115\" y1=\"39.2\" x2=\"115\" y2=\"53.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"103.8\" y1=\"53.48\" x2=\"126.2\" y2=\"53.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"132\" y1=\"56\" x2=\"155\" y2=\"56\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"155,56 148.0,59.8 148.0,52.2\" fill=\"#e9ecef\"/><line x1=\"180\" y1=\"56\" x2=\"245\" y2=\"56\" stroke=\"#7fd1ff\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"245,56 238.0,59.8 238.0,52.2\" fill=\"#7fd1ff\"/><text x=\"250\" y=\"61\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"normal\">short</text><text x=\"10\" y=\"122\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">High DPI</text><ellipse cx=\"115\" cy=\"116\" rx=\"11.200000000000001\" ry=\"16.8\" fill=\"#9aa4ae\"/><line x1=\"115\" y1=\"99.2\" x2=\"115\" y2=\"113.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"103.8\" y1=\"113.48\" x2=\"126.2\" y2=\"113.48\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"132\" y1=\"116\" x2=\"155\" y2=\"116\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"155,116 148.0,119.8 148.0,112.2\" fill=\"#e9ecef\"/><line x1=\"180\" y1=\"116\" x2=\"385\" y2=\"116\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><polygon points=\"385,116 378.0,119.8 378.0,112.2\" fill=\"#ff6b6b\"/><text x=\"385\" y=\"145\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"end\" font-weight=\"bold\">far and fast!</text><line x1=\"168\" y1=\"34\" x2=\"168\" y2=\"150\" stroke=\"#9aa4ae\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/><text x=\"275\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">cursor moves</text></svg><div class=\"cap\"><b>DPI</b> = how far the cursor goes. Higher DPI = faster cursor. Nothing is broken.</div></div>\n\n[[Got it. Send in the next customer->D4 J5]]", "D4 J5": "<div class=\"scene\">🪑 🖱️ 💪</div>\n\n**Mr. Patel** has a tiny desk. There's no room to slide a mouse. His shoulder gets tired.\n\n**Which mouse helps most?**\n\n* [[A gaming mouse with lots of buttons->D4 J5 W]]\n* [[A trackball that stays in one spot->D4 J5 R]]\n* [[An old ball mouse with a rubber ball->D4 J5 W]]\n* [[A bigger mouse pad for more room->D4 J5 W]]", "D4 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **trackball** stays put. Only the ball moves.\"\n\n[[Got it->D4 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the shape cards. Which one stays still?\"\n\n[[Try again->D4 J5]]]", "D4 J5 R": "(set: $miss to 0)## ✅ Job done\n**Trackball.** It needs almost no desk space and very little arm movement.\n\n[[Next customer->D4 J6]]", "D4 J6": "<div class=\"scene\">📚 🖱️ 😣</div>\n\n**Rosa's** arm aches after homework. Her palm faces flat down on the mouse.\n\n**Which mouse might feel better?**\n\n* [[A laser mouse that works on more surfaces->D4 J6 W]]\n* [[A smaller mouse that takes less room->D4 J6 W]]\n* [[A gaming mouse with a higher DPI->D4 J6 W]]\n* [[A vertical mouse held like a handshake->D4 J6 R]]", "D4 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **vertical mouse** turns your hand on its side, like a handshake.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the shape cards. Which one turns your hand?\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**Vertical mouse.** If the pain keeps going, tell a grown-up. She may need a doctor.\n\n[[Next customer->D4 J7]]", "D4 J7": "<div class=\"scene\">🎮 🖱️ 💨</div>\n\n**Dev** pressed the DPI button on his gaming mouse. Now the cursor zooms! \"Is it broken?\"\n\n**What's happening?**\n\n* [[The DPI button broke the mouse inside->D4 J7 W]]\n* [[The DPI button just turned on lights->D4 J7 W]]\n* [[He turned DPI up, so it moves faster->D4 J7 R]]\n* [[The DPI button switched on Bluetooth->D4 J7 W]]", "D4 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Higher DPI = faster cursor.** Press the button again to slow it down.\"\n\n[[Got it->D4 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the DPI picture again.\"\n\n[[Try again->D4 J7]]]", "D4 J7 R": "(set: $miss to 0)## ✅ Job done\n**DPI went up.** Nothing is broken.\n\n[[Next customer->D4 J8]]", "D4 J8": "<div class=\"scene\">🎨 🖱️ 🧼</div>\n\n**Lily** loves to draw. But drawing with a mouse feels like drawing with a bar of soap!\n\n**What tool fits her best?**\n\n* [[A trackball she rolls with her thumbs->D4 J8 W]]\n* [[A drawing tablet with a pen (stylus)->D4 J8 R]]\n* [[A vertical mouse held on its side->D4 J8 W]]\n* [[A gaming mouse set to a high DPI->D4 J8 W]]", "D4 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **drawing tablet with a stylus** works like a pen. Press harder for thicker lines.\"\n\n[[Got it->D4 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the shape cards. Which one has a pen?\"\n\n[[Try again->D4 J8]]]", "D4 J8 R": "(set: $miss to 0)## ✅ Job done\n**Drawing tablet.** A pen feels natural for drawing.\n\n[[Next customer->D4 J9]]", "D4 J9": "<div class=\"scene\">💻 📜 🤔</div>\n\n**Ms. Park** is using her laptop's trackpad. She can't scroll down a long web page.\n\n**What do you show her?**\n\n* [[Press hard with one finger and hold->D4 J9 W]]\n* [[Tap the trackpad three times fast->D4 J9 W]]\n* [[Draw a big circle with just one finger->D4 J9 W]]\n* [[Slide two fingers up or down together->D4 J9 R]]", "D4 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Slide **two fingers together** to scroll.\"\n\n[[Got it->D4 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the trackpad card again.\"\n\n[[Try again->D4 J9]]]", "D4 J9 R": "(set: $miss to 0)## ✅ Job done\n**Two fingers.** One finger moves the cursor. Two fingers scroll.\n\n[[The Inspector has something to show you->D4 L10]]", "D4 L10": "## 📘 The Inspector's lesson: Connecting Keyboards and Mice\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 230\" role=\"img\" aria-label=\"Three ways to connect a mouse or keyboard.\"><text x=\"10\" y=\"30\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#6fe3b5\" text-anchor=\"start\" font-weight=\"bold\">Wired</text><text x=\"10\" y=\"50\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">plug in. Done!</text><ellipse cx=\"160\" cy=\"36\" rx=\"12.6\" ry=\"18.900000000000002\" fill=\"#9aa4ae\"/><line x1=\"160\" y1=\"17.099999999999998\" x2=\"160\" y2=\"33.165\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"147.4\" y1=\"33.165\" x2=\"172.6\" y2=\"33.165\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"300\" y=\"14\" width=\"70\" height=\"42.0\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#8a96a3\" stroke-width=\"3\"/><polygon points=\"292,66.0 378,66.0 370,56.0 300,56.0\" fill=\"#8a96a3\"/><path d=\"M160 17 C160 2 230 4 230 36 S290 58 300 52\" stroke=\"#ffb347\" stroke-width=\"3\" fill=\"none\"/><line x1=\"0\" y1=\"78\" x2=\"400\" y2=\"78\" stroke=\"#2a2f36\" stroke-width=\"2\"/><text x=\"10\" y=\"106\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"start\" font-weight=\"bold\">Dongle</text><text x=\"10\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">tiny USB plug</text><ellipse cx=\"160\" cy=\"112\" rx=\"12.6\" ry=\"18.900000000000002\" fill=\"#9aa4ae\"/><line x1=\"160\" y1=\"93.1\" x2=\"160\" y2=\"109.165\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"147.4\" y1=\"109.165\" x2=\"172.6\" y2=\"109.165\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"300\" y=\"90\" width=\"70\" height=\"42.0\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#8a96a3\" stroke-width=\"3\"/><polygon points=\"292,142.0 378,142.0 370,132.0 300,132.0\" fill=\"#8a96a3\"/><path d=\"M190 105 q7 7 0 14\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M199 102 q7 10 0 20\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M208 99 q7 13 0 26\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><rect x=\"288\" y=\"114\" width=\"13\" height=\"9\" rx=\"2\" fill=\"#ffb347\"/><text x=\"262\" y=\"144\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">dongle</text><line x1=\"0\" y1=\"152\" x2=\"400\" y2=\"152\" stroke=\"#2a2f36\" stroke-width=\"2\"/><text x=\"10\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"bold\">Bluetooth</text><text x=\"10\" y=\"202\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"start\" font-weight=\"normal\">no plug. Pair it!</text><ellipse cx=\"160\" cy=\"188\" rx=\"12.6\" ry=\"18.900000000000002\" fill=\"#9aa4ae\"/><line x1=\"160\" y1=\"169.1\" x2=\"160\" y2=\"185.165\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"147.4\" y1=\"185.165\" x2=\"172.6\" y2=\"185.165\" stroke=\"#1b1f24\" stroke-width=\"2\"/><rect x=\"300\" y=\"166\" width=\"70\" height=\"42.0\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#8a96a3\" stroke-width=\"3\"/><polygon points=\"292,218.0 378,218.0 370,208.0 300,208.0\" fill=\"#8a96a3\"/><path d=\"M190 181 q7 7 0 14\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M199 178 q7 10 0 20\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M208 175 q7 13 0 26\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M240 181 q7 7 0 14\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M249 178 q7 10 0 20\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M258 175 q7 13 0 26\" stroke=\"#7fd1ff\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/></svg><div class=\"cap\">Three ways to connect a mouse or keyboard.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"It only talks to the computer its dongle is in. Move the dongle with it.\"><rect x=\"30\" y=\"20\" width=\"90\" height=\"54.0\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#8a96a3\" stroke-width=\"3\"/><polygon points=\"22,84.0 128,84.0 120,74.0 30,74.0\" fill=\"#8a96a3\"/><rect x=\"120\" y=\"58\" width=\"16\" height=\"11\" rx=\"2\" fill=\"#ffb347\"/><text x=\"75\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">has the dongle</text><rect x=\"280\" y=\"20\" width=\"90\" height=\"54.0\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#8a96a3\" stroke-width=\"3\"/><polygon points=\"272,84.0 378,84.0 370,74.0 280,74.0\" fill=\"#8a96a3\"/><text x=\"325\" y=\"98\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#9aa4ae\" text-anchor=\"middle\" font-weight=\"normal\">no dongle</text><rect x=\"160\" y=\"130\" width=\"90\" height=\"32\" rx=\"4\" fill=\"#9aa4ae\"/><rect x=\"165.0\" y=\"135\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"178.3\" y=\"135\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"191.7\" y=\"135\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"205.0\" y=\"135\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"218.3\" y=\"135\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"231.7\" y=\"135\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"165.0\" y=\"144\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"178.3\" y=\"144\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"191.7\" y=\"144\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"205.0\" y=\"144\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"218.3\" y=\"144\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"231.7\" y=\"144\" width=\"10.3\" height=\"6\" rx=\"1\" fill=\"#1b1f24\"/><rect x=\"182.5\" y=\"153\" width=\"45.0\" height=\"5\" rx=\"1\" fill=\"#1b1f24\"/><line x1=\"185\" y1=\"128\" x2=\"140\" y2=\"82\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"140,82 147.7,84.3 142.2,89.7\" fill=\"#6fe3b5\"/><path d=\"M141 116 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"225\" y1=\"128\" x2=\"270\" y2=\"82\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-dasharray=\"5 5\"/><line x1=\"254\" y1=\"108\" x2=\"270\" y2=\"124\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"254\" y1=\"124\" x2=\"270\" y2=\"108\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"205\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Keyboard + dongle = a team</text></svg><div class=\"cap\">It only talks to the computer its dongle is in. Move the dongle with it.</div></div>\n\n**Bluetooth? Pair it first:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Hold the button\"><ellipse cx=\"40\" cy=\"38\" rx=\"19.599999999999998\" ry=\"29.4\" fill=\"#9aa4ae\"/><line x1=\"40\" y1=\"8.600000000000001\" x2=\"40\" y2=\"33.59\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"20.400000000000002\" y1=\"33.59\" x2=\"59.599999999999994\" y2=\"33.59\" stroke=\"#1b1f24\" stroke-width=\"2\"/><circle cx=\"40\" cy=\"58\" r=\"4\" fill=\"#7fd1ff\"/><line x1=\"47\" y1=\"58\" x2=\"51\" y2=\"58\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"33\" y1=\"58\" x2=\"29\" y2=\"58\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"44.9\" y1=\"62.9\" x2=\"47.7\" y2=\"65.7\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"35.1\" y1=\"62.9\" x2=\"32.3\" y2=\"65.7\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"78\" cy=\"30\" r=\"10\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><text x=\"78\" y=\"35\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"12\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">5s</text></svg><b>1. Hold the button</b>until a light blinks</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Open settings\"><rect x=\"10\" y=\"6\" width=\"80\" height=\"54\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><text x=\"50\" y=\"26\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"12\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Bluetooth</text><rect x=\"34\" y=\"34\" width=\"32\" height=\"16\" rx=\"8\" fill=\"#6fe3b5\"/><circle cx=\"58\" cy=\"42\" r=\"6\" fill=\"#e9ecef\"/></svg><b>2. Open settings</b>turn Bluetooth on</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"3. Pick it\"><rect x=\"10\" y=\"6\" width=\"80\" height=\"54\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><rect x=\"16\" y=\"14\" width=\"68\" height=\"12\" rx=\"2\" fill=\"#2a2f36\"/><rect x=\"16\" y=\"31\" width=\"68\" height=\"12\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.5\"/><rect x=\"16\" y=\"48\" width=\"68\" height=\"8\" rx=\"2\" fill=\"#2a2f36\"/><path d=\"M65 37 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><b>3. Pick it</b>once on each computer</div></div>\n\n**Batteries:**\n\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🔌</span><b>✅ Wired</b>no batteries, no pairing</div><div class=\"card \"><span class=\"big\">🔋</span><b>AA or AAA</b>swap in fresh ones</div><div class=\"card \"><span class=\"big\">⚡</span><b>Battery inside</b>charge it with a cable</div><div class=\"card no\"><span class=\"big\">🐌</span><b>❌ Laggy? Skips?</b>worse each day = low battery. Change or charge it!</div></div>\n\n[[Got it. Send in the next customer->D4 J11]]", "D4 J11": "<div class=\"scene\">👴 ⌨️ 💻</div>\n\n**Grandpa Leo** moved his wireless keyboard to his new laptop. It won't type. Its tiny dongle is still in his old computer.\n\n**What should he do?**\n\n* [[Move the dongle to the new laptop->D4 J11 R]]\n* [[Hold the keyboard closer to the laptop->D4 J11 W]]\n* [[Turn on the new laptop's Bluetooth->D4 J11 W]]\n* [[Buy a brand-new keyboard for the laptop->D4 J11 W]]", "D4 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The keyboard only talks to the computer with its **dongle**. **Move the dongle.**\"\n\n[[Got it->D4 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the dongle picture again.\"\n\n[[Try again->D4 J11]]]", "D4 J11 R": "(set: $miss to 0)## ✅ Job done\n**Move the dongle.** The keyboard and its dongle are a team.\n\n[[Next customer->D4 J12]]", "D4 J12": "<div class=\"scene\">⌨️ 📶 💻</div>\n\n**Nadia** got a new Bluetooth keyboard. It has no plug at all. She turns it on, but it won't type.\n\n**What does she need to do?**\n\n* [[Look in the box for a lost dongle->D4 J12 W]]\n* [[Wait an hour so it can warm up first->D4 J12 W]]\n* [[Pair it in the Bluetooth settings->D4 J12 R]]\n* [[Press every key one time to wake it->D4 J12 W]]", "D4 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Bluetooth needs **pairing**. Hold the button until it blinks. Then pick it in **Bluetooth settings**.\"\n\n[[Got it->D4 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the pairing steps.\"\n\n[[Try again->D4 J12]]]", "D4 J12 R": "(set: $miss to 0)## ✅ Job done\n**Pair it.** You do this once on each computer.\n\n[[Next customer->D4 J13]]", "D4 J13": "<div class=\"scene\">🖱️ 🐌 🔋</div>\n\n**Gabe's** wireless mouse gets more laggy and jumpy every day. It runs on AA batteries.\n\n**What should he try first?**\n\n* [[Go buy a brand-new mouse at the store->D4 J13 W]]\n* [[Put fresh AA batteries in the mouse->D4 J13 R]]\n* [[Wipe and reset the whole computer->D4 J13 W]]\n* [[Turn the DPI setting all the way up->D4 J13 W]]", "D4 J13 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lag that gets worse each day means **low batteries**. Try fresh ones first.\"\n\n[[Got it->D4 J13 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the snail card again.\"\n\n[[Try again->D4 J13]]]", "D4 J13 R": "(set: $miss to 0)## ✅ Job done\n**Fresh batteries.** Always try the easy fix first.\n\n[[Next customer->D4 J14]]", "D4 J14": "<div class=\"scene\">📚 🖱️ 🪫</div>\n\n**Mrs. Okafor** runs a library computer lab. Mice keep dying in the middle of class.\n\n**Which mice would fix that?**\n\n* [[Bluetooth mice paired to each computer->D4 J14 W]]\n* [[Mice that run on fresh AA batteries->D4 J14 W]]\n* [[2.4 GHz mice that each use a dongle->D4 J14 W]]\n* [[Wired mice that never need batteries->D4 J14 R]]", "D4 J14 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Wired mice** get power from the cable. They never run out.\"\n\n[[Got it->D4 J14 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the battery cards. Which one needs no battery?\"\n\n[[Try again->D4 J14]]]", "D4 J14 R": "(set: $miss to 0)(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]## ✅ Job done\n**Wired mice.** No batteries, no charging, no pairing.\n\n[[Close up shop->D4 Done]]", "D4 Done": "(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]# Day 4 complete!\n\n<div class=\"tool\">🖱️ **New tool earned: Mouse Field Guide**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Find your mouse or trackpad. Test it on a mouse pad, a table, and something shiny. Where does it work best? Does it use a cable, a dongle, or Bluetooth?</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### How a Mouse Sees\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🕰️</span><b>Ball mouse</b>very old. A ball turns rollers.</div><div class=\"card \"><span class=\"big\">💡</span><b>Optical mouse</b>a light + a tiny camera</div><div class=\"card \"><span class=\"big\">🔴</span><b>Laser mouse</b>like optical, reads more surfaces</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 190\" role=\"img\" aria-label=\"Old ball mouse, seen from the bottom. Each roller does one way.\"><ellipse cx=\"130\" cy=\"100\" rx=\"95\" ry=\"85\" fill=\"#2a2f36\" stroke=\"#8a96a3\" stroke-width=\"3\"/><circle cx=\"130\" cy=\"105\" r=\"42\" fill=\"#5b636c\" stroke=\"#8a96a3\" stroke-width=\"2\"/><circle cx=\"117\" cy=\"92\" r=\"10\" fill=\"#7b848e\"/><rect x=\"88\" y=\"47\" width=\"84\" height=\"14\" rx=\"7\" fill=\"#ffb347\"/><rect x=\"174\" y=\"63\" width=\"14\" height=\"84\" rx=\"7\" fill=\"#7fd1ff\"/><line x1=\"172\" y1=\"54\" x2=\"232\" y2=\"40\" stroke=\"#ffb347\" stroke-width=\"2\"/><text x=\"238\" y=\"38\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ffb347\" text-anchor=\"start\" font-weight=\"bold\">Up-down roller</text><line x1=\"300\" y1=\"54\" x2=\"300\" y2=\"68\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"300,68 296.2,61.0 303.8,61.0\" fill=\"#ffb347\"/><line x1=\"300\" y1=\"54\" x2=\"300\" y2=\"42\" stroke=\"#ffb347\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"300,42 303.8,49.0 296.2,49.0\" fill=\"#ffb347\"/><line x1=\"188\" y1=\"110\" x2=\"232\" y2=\"115\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><text x=\"238\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#7fd1ff\" text-anchor=\"start\" font-weight=\"bold\">Side-side roller</text><line x1=\"300\" y1=\"128\" x2=\"314\" y2=\"128\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"314,128 307.0,131.8 307.0,124.2\" fill=\"#7fd1ff\"/><line x1=\"300\" y1=\"128\" x2=\"286\" y2=\"128\" stroke=\"#7fd1ff\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"286,128 293.0,124.2 293.0,131.8\" fill=\"#7fd1ff\"/><text x=\"130\" y=\"110\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">ball</text><text x=\"238\" y=\"170\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">Gunk = stuck cursor</text></svg><div class=\"cap\">Old ball mouse, seen from the bottom. Each roller does one way.</div></div>\n<div class=\"pic\"><svg viewBox=\"0 0 400 195\" role=\"img\" aria-label=\"The mouse's eye needs tiny bumps. Clear glass and mirrors have none.\"><text x=\"200\" y=\"20\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Light shines down. A tiny camera looks.</text><path d=\"M20 92 Q35 40 100 46 Q155 52 170 92 Z\" fill=\"#9aa4ae\"/><circle cx=\"80\" cy=\"86\" r=\"5\" fill=\"#1b1f24\" stroke=\"#e9ecef\" stroke-width=\"1.5\"/><polygon points=\"100,90 88,112 112,112\" fill=\"#ff6b6b\" opacity=\"0.7\"/><rect x=\"10\" y=\"112\" width=\"170\" height=\"16\" fill=\"#8b5a2b\"/><circle cx=\"18\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"31\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"44\" cy=\"124\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"57\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"70\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"83\" cy=\"124\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"96\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"109\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"122\" cy=\"124\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"135\" cy=\"116\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"148\" cy=\"120\" r=\"2\" fill=\"#4a2e14\"/><circle cx=\"161\" cy=\"12 -linecap=\"round\" stroke-linejoin=\"round\"/><line x1=\"225\" y1=\"128\" x2=\"270\" y2=\"82\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-dasharray=\"5 5\"/><line x1=\"254\" y1=\"108\" x2=\"270\" y2=\"124\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"254\" y1=\"124\" x2=\"270\" y2=\"108\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><text x=\"205\" y=\"182\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"15\" fill=\"#6fe3b5\" text-anchor=\"middle\" font-weight=\"bold\">Keyboard + dongle = a team</text></svg><div class=\"cap\">It only talks to the computer its dongle is in. Move the dongle with it.</div></div>\n\n**Bluetooth? Pair it first:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"1. Hold the button\"><ellipse cx=\"40\" cy=\"38\" rx=\"19.599999999999998\" ry=\"29.4\" fill=\"#9aa4ae\"/><line x1=\"40\" y1=\"8.600000000000001\" x2=\"40\" y2=\"33.59\" stroke=\"#1b1f24\" stroke-width=\"2\"/><line x1=\"20.400000000000002\" y1=\"33.59\" x2=\"59.599999999999994\" y2=\"33.59\" stroke=\"#1b1f24\" stroke-width=\"2\"/><circle cx=\"40\" cy=\"58\" r=\"4\" fill=\"#7fd1ff\"/><line x1=\"47\" y1=\"58\" x2=\"51\" y2=\"58\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"33\" y1=\"58\" x2=\"29\" y2=\"58\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"44.9\" y1=\"62.9\" x2=\"47.7\" y2=\"65.7\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><line x1=\"35.1\" y1=\"62.9\" x2=\"32.3\" y2=\"65.7\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"78\" cy=\"30\" r=\"10\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><text x=\"78\" y=\"35\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"12\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"bold\">5s</text></svg><b>1. Hold the button</b>until a light blinks</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"2. Open settings\"><rect x=\"10\" y=\"6\" width=\"80\" height=\"54\" rx=\"4\" ill=\"#7fd1ff\"/><path d=\"M62 28 q4 -5 8 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M72 30 q4 -5 8 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M82 32 q4 -5 8 0\" stroke=\"#e9ecef\" stroke-width=\"2.5\" fill=\"none\"/></svg><b>3. Sensor</b>air puff or dry swab</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"4. Feet\"><rect x=\"28\" y=\"4\" width=\"44\" height=\"62\" rx=\"20\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"36\" y=\"10\" width=\"28\" height=\"8\" rx=\"4\" fill=\"#6fe3b5\"/><rect x=\"36\" y=\"52\" width=\"28\" height=\"8\" rx=\"4\" fill=\"#6fe3b5\"/><circle cx=\"38\" cy=\"56\" r=\"3\" fill=\"#6b4a2a\"/><circle cx=\"62\" cy=\"14\" r=\"3\" fill=\"#6b4a2a\"/></svg><b>4. Feet</b>clean, or replace</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"5. Scroll wheel\"><rect x=\"30\" y=\"6\" width=\"22\" height=\"58\" rx=\"10\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><rect x=\"36\" y=\"16\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#ffb347\"/><line x1=\"92\" y1=\"6\" x2=\"48\" y2=\"30\" stroke=\"#e8c27a\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>5. Scroll wheel</b>air, then wooden toothpick</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"6. Cloth pad\"><rect x=\"8\" y=\"16\" width=\"60\" height=\"44\" rx=\"6\" fill=\"#7fd1ff\" opacity=\"0.7\"/><circle cx=\"20\" cy=\"12\" r=\"6\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"34\" cy=\"8\" r=\"4\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><circle cx=\"46\" cy=\"12\" r=\"5\" fill=\"none\" stroke=\"#e9ecef\" stroke-width=\"2\"/><path d=\"M72 30 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M72 39 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M72 48 q5 -5 10 0 t10 0 t10 0\" stroke=\"#ffb347\" stroke-width=\"2.5\" fill=\"none\" stroke-linecap=\"round\"/></svg><b>6. Cloth pad</b>wash, then air dry</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🧴</span><b>✅ Alcohol cloth</b>just barely wet</div><div class=\"card no\"><span class=\"big\">🚰</span><b>❌ Under the tap</b>never the mouse</div><div class=\"card ok\"><span class=\"big\">🪵</span><b>✅ Wooden toothpick</b>for the wheel</div><div class=\"card no\"><span class=\"big\">📌</span><b>❌ Metal pin</b>scratches parts</div><div class=\"card ok\"><span class=\"big\">🌬️</span><b>✅ Air or dry swab</b>for the sensor</div><div class=\"card no\"><span class=\"big\">💦</span><b>❌ Wet scrubbing</b>on the sensor</div><div class=\"card ok\"><span class=\"big\">🌤️</span><b>✅ Air dry</b>the cloth pad</div><div class=\"card no\"><span class=\"big\">🔥</span><b>❌ High heat</b>bends the rubber</div></div>\n\n[[Got it. Send in the next customer->D5 J2]]", "D5 J2": "<div class=\"scene\">🖱️ 〰️ 🔍</div>\n\n**Sam's** cursor shakes and jumps. Under the mouse, hair and dust cover the little eye.\n\n**How do you clean the sensor?**\n\n* [[Scrub it hard with a wet paper towel->D5 J2 W]]\n* [[Scrape it clean with a metal pin->D5 J2 W]]\n* [[Spray glass cleaner right on it->D5 J2 W]]\n* [[Give it a puff of air or a dry swab->D5 J2 R]]", "D5 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A puff of air or a dry swab.** A scratch on that window stays forever.\"\n\n[[Got it->D5 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at card 3 again.\"\n\n[[Try again->D5 J2]]]", "D5 J2 R": "(set: $miss to 0)## ✅ Job done\n**Air or a dry swab, gently.**\n\n[[Next customer->D5 J3]]", "D5 J3": "<div class=\"scene\">🖱️ 🧶 😣</div>\n\n**Mr. Ito's** scroll wheel barely turns. Gray fuzz is packed around it.\n\n**What's the fix?**\n\n* [[Pour alcohol in the gap and spin it->D5 J3 W]]\n* [[Canned air, then a wooden toothpick->D5 J3 R]]\n* [[Dig the lint out with a metal paper clip->D5 J3 W]]\n* [[Pull the wheel out with some pliers->D5 J3 W]]", "D5 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Air, then a wooden toothpick.** Metal can scratch parts.\"\n\n[[Got it->D5 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at card 5 again.\"\n\n[[Try again->D5 J3]]]", "D5 J3 R": "(set: $miss to 0)## ✅ Job done\n**Air, then lift the lint out with a wooden toothpick.**\n\n[[Next customer->D5 J4]]", "D5 J4": "<div class=\"scene\">🖱️ ✋ ✨</div>\n\n**Tara's** white mouse is gray and shiny where her hand rests.\n\n**What cleans it best?**\n\n* [[A cloth just a little wet with alcohol->D5 J4 R]]\n* [[A scratchy sponge and lots of dish soap->D5 J4 W]]\n* [[A paper towel soaked in bleach->D5 J4 W]]\n* [[Rinse it under the kitchen sink->D5 J4 W]]", "D5 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That shine is skin oil. **A cloth barely wet with alcohol** cuts right through it.\"\n\n[[Got it->D5 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at card 2 again.\"\n\n[[Try again->D5 J4]]]", "D5 J4 R": "(set: $miss to 0)## ✅ Job done\n**A cloth barely wet with alcohol.** Never put a mouse under water.\n\n[[Next customer->D5 J5]]", "D5 J5": "<div class=\"scene\">🎮 🖱️ 😬</div>\n\n**Dev's** mouse drags and scratches. The smooth pads underneath are worn thin and crusty.\n\n**What's the fix?**\n\n* [[Sand the whole bottom until it's smooth->D5 J5 W]]\n* [[Glue a sheet of paper across the bottom->D5 J5 W]]\n* [[Clean the feet and replace worn ones->D5 J5 R]]\n* [[Buy a bigger, smoother mouse pad->D5 J5 W]]", "D5 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **mouse feet**. Clean them. **Replace them** if they're worn.\"\n\n[[Got it->D5 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the Feet label on the mouse picture.\"\n\n[[Try again->D5 J5]]]", "D5 J5 R": "(set: $miss to 0)## ✅ Job done\n**Clean the feet, and replace worn ones so it glides again.**\n\n[[Next customer->D5 J6]]", "D5 J6": "<div class=\"scene\">🟦 🍿 👃</div>\n\n**Jun's** cloth mouse pad is stained. It smells like snacks.\n\n**How should he clean it?**\n\n* [[Hand wash it, rinse, and let it air dry->D5 J6 R]]\n* [[Scrub out all the stains with bleach->D5 J6 W]]\n* [[Dry it on high heat to kill the germs->D5 J6 W]]\n* [[Wipe it with window cleaner, then use it->D5 J6 W]]", "D5 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Wash, rinse, and air dry all the way.** High heat bends the rubber.\"\n\n[[Got it->D5 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at card 6 again.\"\n\n[[Try again->D5 J6]]]", "D5 J6 R": "(set: $miss to 0)## ✅ Job done\n**Hand wash, rinse, and let it dry all the way.**\n\n[[The Inspector has something to show you->D5 L7]]", "D5 L7": "## 📘 The Inspector's lesson: Trackballs and Trackpads\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 180\" role=\"img\" aria-label=\"The ball sits on little <b>support dots</b>. Gunk on the dots makes the cursor jump.\"><path d=\"M40 70 L40 140 Q40 160 60 160 L200 160 Q220 160 220 140 L220 70\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><circle cx=\"130\" cy=\"78\" r=\"48\" fill=\"#7fd1ff\" opacity=\"0.85\"/><path d=\"M108 60 q14 -14 34 -6\" stroke=\"#ffffff\" stroke-width=\"4\" fill=\"none\" opacity=\"0.6\"/><circle cx=\"98\" cy=\"120\" r=\"7\" fill=\"#ffb347\"/><circle cx=\"102\" cy=\"127\" r=\"4\" fill=\"#6b4a2a\"/><circle cx=\"162\" cy=\"120\" r=\"7\" fill=\"#ffb347\"/><circle cx=\"166\" cy=\"127\" r=\"4\" fill=\"#6b4a2a\"/><rect x=\"122\" y=\"152\" width=\"16\" height=\"10\" fill=\"#1b1f24\"/><line x1=\"130\" y1=\"176\" x2=\"130\" y2=\"150\" stroke=\"#6fe3b5\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"130,150 133.8,157.0 12  to the computer->D5 J8 W]]\n* [[In the mouse settings on the computer->D5 J8 W]]\n* [[On the rubber feet under the case->D5 J8 W]]\n* [[On the support dots under the ball->D5 J8 R]]", "D5 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pop the ball out. Clean the **support dots** under it.\"\n\n[[Got it->D5 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the trackball picture again.\"\n\n[[Try again->D5 J8]]]", "D5 J8 R": "(set: $miss to 0)## ✅ Job done\n**The support dots.** Wipe them with a swab barely wet with alcohol.\n\n[[Next customer->D5 J9]]", "D5 J9": "<div class=\"scene\">💻 👆 🪟</div>\n\n**Kira** wipes her smudgy trackpad. The laptop is on. Every wipe opens an app!\n\n**What should she do?**\n\n* [[Wipe faster so it misses the touches->D5 J9 W]]\n* [[Turn it off first, then wipe gently->D5 J9 R]]\n* [[Spray cleaner on so the cloth glides->D5 J9 W]]\n* [[Wear gloves so the pad can't feel her->D5 J9 W]]", "D5 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn it off first.** Then use a barely damp soft cloth.\"\n\n[[Got it->D5 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at step 1 on the trackpad picture.\"\n\n[[Try again->D5 J9]]]", "D5 J9 R": "(set: $miss to 0)## ✅ Job done\n**Off first, then a barely damp microfiber cloth.**\n\n[[The Inspector has something to show you->D5 L10]]", "D5 L10": "## 📘 The Inspector's lesson: Battery Care\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 215\" role=\"img\" aria-label=\"Not using it for a long time? Take the batteries out.\"><text x=\"12\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"16\" fill=\"#ff6b6b\" text-anchor=\"start\" font-weight=\"bold\">Batteries left in</text><rect x=\"20\" y=\"35\" width=\"40\" height=\"64\" rx=\"20.0\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2\"/><line x1=\"40.0\" y1=\"35\" x2=\"40.0\" y2=\"59.32\" stroke=\ le\" font-weight=\"bold\">Safe!</text></svg><div class=\"cap\">Not using it for a long time? Take the batteries out.</div></div>\n<div class=\"cards\"><div class=\"card \"><span class=\"big\">🙋</span><b>1. Get a grown-up</b></div><div class=\"card \"><span class=\"big\">🧤</span><b>2. Gloves on</b>crust can make skin sore</div><div class=\"card \"><span class=\"big\">🔋</span><b>3. Batteries out</b></div><div class=\"card \"><span class=\"big\">🧹</span><b>4. Clean contacts</b>the metal bits, with a swab</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">♻️</span><b>✅ Recycle bin</b>at stores or the recycling center</div><div class=\"card ok\"><span class=\"big\">🔌</span><b>✅ Charge now and then</b>rechargeable mice</div><div class=\"card no\"><span class=\"big\">🗑️</span><b>❌ Trash can</b>can start truck fires</div><div class=\"card no\"><span class=\"big\">🪫</span><b>❌ Dead for months</b>hurts rechargeables</div></div>\n\n<div class=\"warn\">**Grown-up needed** if you see crusty white powder on batteries. Wear gloves. The crust can make skin sore.</div>\n\n[[Got it. Send in the next customer->D5 J11]]", "D5 J11": "<div class=\"scene\">🖱️ 🔋 ⚠️</div>\n\n**Lena's** mouse sat all summer. Now the batteries have crusty white powder on them.\n\n**What should she do?**\n\n* [[Wipe it off with her fingers and reuse->D5 J11 W]]\n* [[Get a grown-up, gloves, batteries out->D5 J11 R]]\n* [[Blow the powder off and put them back->D5 J11 W]]\n* [[Close the door and keep on using it->D5 J11 W]]", "D5 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a battery leak. **Grown-up, gloves, batteries out.** Then recycle them.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the red box again.\"\n\n[[Try again->D5 J11]]]", "D5 J11 R": "(set: $miss to 0)## ✅ Job done\n**Grown-up, gloves, batteries out.** Clean the contacts and recycle.\n\n[[Next customer->D5 J12]]", "D5 J12": "<div class=\"scene\">✈️ 🖱️ 🗄️</div>\n\n**Mr. Chen** leaves on a 3-month trip. His spare mouse with AA batteries stays in a drawer.\n\n**What should he do first?**\n\n* [[Leave the batteries in for when he's back->D5 J12 W]]\n* [[Flip it over so the batteries can't leak->D5 J12 W]]\n* [[Take the batteries out before he goes->D5 J12 R]]\n* [[Wrap the mouse up tight in plastic wrap->D5 J12 W]]", "D5 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Take the batteries out** of anything you won't use for a long time.\"\n\n[[Got it->D5 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the two rows in the leak picture.\"\n\n[[Try again->D5 J12]]]", "D5 J12 R": "(set: $miss to 0)(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]## ✅ Job done\n**Take the batteries out.** Unused batteries are the ones that leak.\n\n[[Close up shop->D5 Done]]", "D5 Done": "(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]# Day 5 complete!\n\n<div class=\"tool\">🪛 **New tool earned: Service Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Give your mouse or trackpad a full service. Use the checklist. Does it use batteries? Check for crust **with a grown-up**. Find where your town recycles batteries.</div>\n\n---\n## 📘 Your guide for this assignment\n*The Inspector slides her notes back across the counter.* \"You'll need these. Keep them open while you work.\"\n\n### The Service Checklist\n<div class=\"pic\"><svg viewBox=\"0 0 400 210\" role=\"img\" aria-label=\"Know the parts. Each one gets cleaned its own way.\"><rect x=\"40\" y=\"30\" width=\"70\" height=\"140\" rx=\"35\" fill=\"#3a424c\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><line x1=\"75\" y1=\"30\" x2=\"75\" y2=\"85\" stroke=\"#9aa4ae\" stroke-width=\"2.5\"/><line x1=\"40\" y1=\"85\" x2=\"110 b5\" text-anchor=\"middle\" font-weight=\"bold\">top of the screen</text></svg><div class=\"cap\">Screen up high. Not too close.</div></div>\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Window behind screen\"><rect x=\"4\" y=\"4\" width=\"92\" height=\"62\" rx=\"4\" fill=\"none\" stroke=\"#3a424b\" stroke-width=\"2\"/><rect x=\"20\" y=\"4\" width=\"60\" height=\"7\" fill=\"#ffe08a\"/><rect x=\"32\" y=\"22\" width=\"36\" height=\"6\" rx=\"2\" fill=\"#7fd1ff\"/><circle cx=\"50\" cy=\"46\" r=\"9\" fill=\"#f2c79b\"/><line x1=\"76\" y1=\"44\" x2=\"92\" y2=\"60\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"76\" y1=\"60\" x2=\"92\" y2=\"44\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>Window behind screen</b>too bright</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Window behind you\"><rect x=\"4\" y=\"4\" width=\"92\" height=\"62\" rx=\"4\" fill=\"none\" stroke=\"#3a424b\" stroke-width=\"2\"/><rect x=\"20\" y=\"59\" width=\"60\" height=\"7\" fill=\"#ffe08a\"/><rect x=\"32\" y=\"14\" width=\"36\" height=\"6\" rx=\"2\" fill=\"#7fd1ff\"/><circle cx=\"50\" cy=\"38\" r=\"9\" fill=\"#f2c79b\"/><line x1=\"24\" y1=\"56\" x2=\"34\" y2=\"24\" stroke=\"#ffe08a\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"34,24 35.6,31.8 28.2,29.6\" fill=\"#ffe08a\"/><line x1=\"36\" y1=\"24\" x2=\"43\" y2=\"33\" stroke=\"#ffe08a\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"43,33 35.7,29.8 41.7,25.1\" fill=\"#ffe08a\"/><line x1=\"76\" y1=\"22\" x2=\"92\" y2=\"38\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"76\" y1=\"38\" x2=\"92\" y2=\"22\" stroke=\"#ff6b6b\" stroke-width=\"4\" stroke-linecap=\"round\"/></svg><b>Window behind you</b>glare on screen</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Window at the side\"><rect x=\"4\" y=\"4\" width=\"92\" height=\"62\" rx=\"4\" fill=\"none\" stroke=\"#3a424b\" stroke-width=\"2\"/><rect x=\"4\" y=\"16\" width=\"7\" height=\"40\" fill=\"#ffe08a\"/><rect x=\"32\" y=\"16\" width=\"36\" height=\"6\" rx=\"2\" fill=\"#7fd1ff\"/><circle cx=\"50\" cy=\"42\" r=\"9\" fill=\"#f2c79b\"/><path d=\"M73 52 l6 7 l12 -14\" stroke=\"#6fe3b5\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg><b>Window at the side</b>just right</div></div>\n\n**The 20-20-20 rule:**\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Every 20 minutes\"><circle cx=\"50\" cy=\"35\" r=\"27\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"3\"/><line x1=\"50\" y1=\"35\" x2=\"50\" y2=\"16\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"35\" x2=\"63\" y2=\"42\" stroke=\"#e9ecef\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg><b>Every 20 minutes</b></div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"Look 20 feet away\"><circle cx=\"14\" cy=\"38\" r=\"8\" fill=\"#f2c79b\"/><line x1=\"24\" y1=\"38\" x2=\"74\" y2=\"38\" stroke=\"#6fe3b5\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/><polygon points=\"84,14 72,42 96,42\" fill=\"#6fe3b5\"/><rect x=\"81\" y=\"42\" width=\"6\" height=\"12\" fill=\"#a07a52\"/></svg><b>Look 20 feet away</b>far, far away</div><div class=\"card\"><svg viewBox=\"0 0 100 70\" role=\"img\" aria-label=\"For 20 seconds\"><polygon points=\"34,8 66,8 50,35\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/><polygon points=\"34,62 66,62 50,35\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"3\"/><polygon points=\"41,55 59,55 50,44\" fill=\"#7fd1ff\"/></svg><b>For 20 seconds</b>eyes rest</div></div>\n<div class=\"cards\"><div class=\"card ok\"><span class=\"big\">🔍</span><b>✅ Text too small?</b>make it bigger</div><div class=\"card no\"><span class=\"big\">🙇</span><b>❌ Leaning in</b>hurts your back</div><div class=\"card ok\"><span class=\"big\">💡</span><b>✅ Dark room?</b>lamp on or dim the screen</div><div class=\"card ok\"><span class=\"big\">💻</span><b>✅ Laptop?</b>add a stand + a keyboard</div></div>\n\n[[Got it. Send in the next customer->D6 J2]]", "D6 J2": "<div class=\"scene\">💻 🛋️ 😣</div>\n\n**Amir** does homework on a laptop on the coffee table. His neck hurts every night.\n\n**Best fix?**\n\n* [[Use a stand and a separate keyboard->D6 J2 R]]\n* [[Tilt the laptop screen back all the way->D6 J2 W]]\n* [[Lie on the floor on his tummy to work->D6 J2 W]]\n* [[Make the text smaller so more will fit->D6 J2 W]]", "D6 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lift the screen with a **stand**. Then use a **separate keyboard and mouse**.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the Laptop card again.\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**A stand plus a separate keyboard.** The screen goes up. Hands stay low.\n\n[[Next customer->D6 J3]]", "D6 J3": "<div class=\"scene\">👧 💻 😵</div>\n\n**Zoe** read on her computer for an hour. Her eyes feel tired and dry.\n\n**What helps?**\n\n* [[Turn the screen brightness all the way up->D6 J3 W]]\n* [[Move the screen much closer to her eyes->D6 J3 W]]\n* [[Use the 20-20-20 rule to rest her eyes->D6 J3 R]]\n* [[Read faster so she can finish sooner->D6 J3 W]]", "D6 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The **20-20-20 rule.** Looking far away lets eyes rest.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the three 20s cards again.\n\n[[Try again->D6 J3]]]", "D6 J3 R": "(set: $miss to 0)## ✅ Job done\n**20-20-20.** We blink less at screens. Looking far away helps.\n\n[[Next customer->D6 J4]]", "D6 J4": "<div class=\"scene\">🖥️ ☀️ 😖</div>\n\n**Mr. Chen's** computer faces a big, sunny window. He squints all afternoon.\n\n**Best fix?**\n\n* [[Turn the brightness all the way down->D6 J4 W]]\n* [[Wear sunglasses whenever he's at the computer->D6 J4 W]]\n* [[Only use it after the sun goes down->D6 J4 W]]\n* [[Turn the desk so light comes from the side->D6 J4 R]]", "D6 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Light should come from the **side**.\"\n\n[[Got it->D6 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the window cards again.\n\n[[Try again->D6 J4]]]", "D6 J4 R": "(set: $miss to 0)## ✅ Job done\n**Window at the side.** No bright light behind the screen. No glare on it.\n\n[[Next customer->D6 J5]]", "D6 J5": "<div class=\"scene\">🛏️ 🌙 💻</div>\n\n**Ruby** reads on her laptop in a dark room. The screen is super bright. Her eyes sting.\n\n**What helps most?**\n\n* [[Turn on a lamp or dim the screen->D6 J5 R]]\n* [[Turn the brightness up even higher->D6 J5 W]]\n* [[Hold the laptop closer to her face->D6 J5 W]]\n* [[Rest one eye at a time while reading->D6 J5 W]]", "D6 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Match the screen to the room.** Lamp on, or screen dimmer.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the Dark room card again.\n\n[[Try again->D6 J5]]]", "D6 J5 R": "(set: $miss to 0)## ✅ Job done\n**Lamp on, or brightness down.** And remember: beds block laptop vents!\n\n[[Next customer->D6 J6]]", "D6 J6": "<div class=\"scene\">👦 🖥️ 🔍</div>\n\n**Eli** leans in to read tiny text. His back aches.\n\n**Better fix?**\n\n* [[Move the monitor six inches from him->D6 J6 W]]\n* [[Make the text bigger and sit back->D6 J6 R]]\n* [[Squint so the small text looks sharper->D6 J6 W]]\n* [[Lower the monitor so he looks down->D6 J6 W]]", "D6 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Make the text bigger.** Keep the screen an arm's length away.\"\n\n[[Got it->D6 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* Look at the Text too small card again.\n\n[[Try again->D6 J6]]]", "D6 J6 R": "(set: $miss to 0)## ✅ Job done\n**Bigger text, sit back.** Press **Ctrl and +** to zoom. On a Mac, **Cmd and +**.\n\n[[The Inspector has something to show you->D6 L7]]", "D6 L7": "## 📘 The Inspector's lesson: Arms, Wrists, and Feet\n\n<div class=\"pic\"><svg viewBox=\"0 0 400 225\" role=\"img\" aria-label=\"Sit like this.\"><line x1=\"0\" y1=\"215\" x2=\"400\" y2=\"215\" stroke=\"#9aa4ae\" stroke-width=\"3\"/><rect x=\"72\" y=\"80\" width=\"8\" height=\"76\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"72\" y=\"148\" width=\"76\" height=\"8\" rx=\"3\" fill=\"#9aa4ae\"/><rect x=\"106\" y=\"156\" width=\"6\" height=\"59\" fill=\"#9aa4ae\"/><rect x=\"200\" y=\"128\" width=\"195\" height=\"8\" rx=\"2\" fill=\"#a07a52\"/><rect x=\"380\" y=\"136\" width=\"8\" height=\"79\" fill=\"#a07a52\"/><rect x=\"206\" y=\"136\" width=\"8\" height=\"79\" fill=\"#a07a52\"/><rect x=\"210\" y=\"122\" width=\"58\" height=\"6\" rx=\"2\" fill=\"#9aa4ae\"/><line x1=\"110\" y1=\"72\" x2=\"100\" y2=\"145\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"112\" y1=\"80\" x2=\"116\" y2=\"122\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"116\" y1=\"122\" x2=\"222\" y2=\"122\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"100\" y1=\"145\" x2=\"178\" y2=\"145\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"178\" y1=\"145\" x2=\"178\" y2=\"208\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><line x1=\"178\" y1=\"208\" x2=\"196\" y2=\"208\" stroke=\"#e9ecef\" stroke-width=\"6\" stroke-linecap=\"round\"/><circle cx=\"118\" cy=\"50\" r=\"17\" fill=\"#f2c79b\"/><circle cx=\"127\" cy=\"47\" r=\"2.5\" fill=\"#1b1f24\"/><path d=\"M116 110 L128 110 L128 122\" stroke=\"#6fe3b5\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"92\" cy=\"72\" r=\"10\" fill=\"#ffb3
