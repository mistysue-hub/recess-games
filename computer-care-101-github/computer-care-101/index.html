he screen makes your eyes work hard. A window behind *you* makes glare shine back off the screen.\n* **Match the screen to the room.** A super-bright screen in a dark room is hard on your eyes. Turn on a lamp, or turn the brightness down.\n\n\"Laptops are tricky. When the keyboard is at a good height, the screen is too low. The fix is a **stand** (to lift the screen) plus a **separate keyboard and mouse**.\"\n\n\n[[Got it. Send in the next customer->D7 J2]]", "D7 J2": "**Amir** does all his homework on a laptop on the coffee table. His neck hurts every night.\n\n**What's the best fix?**\n\n* [[Use a stand and a separate keyboard->D7 J2 R]]\n* [[Tilt the laptop screen back all the way->D7 J2 W]]\n* [[Lie on the floor on his stomach->D7 J2 W]]\n* [[Make the text smaller to fit more->D7 J2 W]]", "D7 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Raise the screen to eye level with a **stand**. Then use a **separate keyboard and mouse**.\"\n\n[[Got it->D7 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where should the top of the screen be?\"\n\n[[Try again->D7 J2]]]", "D7 J2 R": "(set: $miss to 0)## ✅ Job done\n**A stand plus a separate keyboard and mouse.** That solves the laptop problem.\n\n[[Next customer->D7 J3]]", "D7 J3": "**Zoe** says her eyes feel tired and dry. She has been reading on her computer for an hour.\n\n**Which habit helps?**\n\n* [[Turn the brightness way up->D7 J3 W]]\n* [[Move the screen closer->D7 J3 W]]\n* [[Follow the 20-20-20 rule->D7 J3 R]]\n* [[Read faster to finish sooner->D7 J3 W]]", "D7 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The **20-20-20 rule.** It lets your eye muscles relax. And you'll blink more.\"\n\n[[Got it->D7 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Remember the rule with three 20s.\"\n\n[[Try again->D7 J3]]]", "D7 J3 R": "(set: $miss to 0)## ✅ Job done\n**20-20-20.** People blink less when they stare at screens. Looking far away gives eyes a break.\n\n[[Next customer->D7 J4]]", "D7 J4": "**Mr. Chen's** all-in-one computer sits on a desk. It faces a big, sunny window. He squints at the screen all afternoon.\n\n**What's the best fix?**\n\n* [[Turn the brightness all the way down->D7 J4 W]]\n* [[Wear sunglasses at the computer->D7 J4 W]]\n* [[Use it only after the sun sets->D7 J4 W]]\n* [[Put the window off to the side->D7 J4 R]]", "D7 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Light should come from the **side**.\"\n\n[[Got it->D7 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where should light come from?\"\n\n[[Try again->D7 J4]]]", "D7 J4 R": "(set: $miss to 0)## ✅ Job done\n**Turn the desk so the window is to the side.** Then no bright light comes from behind the screen. And no glare shines on it.\n\n[[Next customer->D7 J5]]", "D7 J5": "**Ruby** reads on her laptop in bed at night. All the lights are off. The screen is at full brightness, and her eyes sting.\n\n**What helps most?**\n\n* [[Turn on a lamp or dim the screen->D7 J5 R]]\n* [[Turn the brightness up even more->D7 J5 W]]\n* [[Hold the laptop closer to her face->D7 J5 W]]\n* [[Close one eye at a time to rest->D7 J5 W]]", "D7 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Match the screen to the room.** Turn on a lamp, or turn the brightness down.\"\n\n[[Got it->D7 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about the screen and the room?\"\n\n[[Try again->D7 J5]]]", "D7 J5 R": "(set: $miss to 0)## ✅ Job done\n**Lamp on, or brightness down.** A blazing screen in a dark room makes eyes work hard. (And remember Day 1: beds block laptop vents!)\n\n[[Next customer->D7 J6]]", "D7 J6": "**Eli** keeps leaning closer to his monitor to read small text. By the end of the day, his back aches.\n\n**What's the better fix?**\n\n* [[Move the monitor six inches from him->D7 J6 W]]\n* [[Make the text bigger and sit back->D7 J6 R]]\n* [[Squint to make the text sharper->D7 J6 W]]\n* [[Lower the monitor and look down->D7 J6 W]]", "D7 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Make the text bigger.** Keep the screen about an arm's length away.\"\n\n[[Got it->D7 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say to do instead of leaning in?\"\n\n[[Try again->D7 J6]]]", "D7 J6 R": "(set: $miss to 0)## ✅ Job done\n**Bigger text, arm's length away.** Most programs zoom in with **Ctrl and +**. On a Mac, use **Cmd and +**.\n\n[[The Inspector has something to show you->D7 L7]]", "D7 L7": "## 📘 The Inspector's lesson: Arms, Wrists, and Feet\n\n* **Elbows** bent about like the corner of a box. **Shoulders relaxed.**\n* **Wrists straight** while you type. Don't bend them up, down, or sideways. A keyboard has little feet on the back. Folding them out tilts it up. That can bend your wrists up. **Flat is usually better.**\n* **Keep the mouse close** to the keyboard. Then your arm won't reach out to the side.\n* **Feet flat on the floor.** Do your legs not reach? Use a **footrest** (a little step for your feet) or a **sturdy box**.\n* **Back held up** by the chair.\n\n\n[[Got it. Send in the next customer->D7 J8]]", "D7 J8": "**Tasha** is shorter than her chair was made for. She raised the seat to reach the keyboard. Now her feet dangle in the air.\n\n**What helps?**\n\n* [[Lower the chair, though the desk is high->D7 J8 W]]\n* [[Put a footrest or box under her feet->D7 J8 R]]\n* [[Sit cross-legged on her feet->D7 J8 W]]\n* [[Stand on tiptoe when she types->D7 J8 W]]", "D7 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Bring the floor up to her with a **footrest or a sturdy box**.\"\n\n[[Got it->D7 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Keep the chair height for her arms. What can come up to meet her feet?\"\n\n[[Try again->D7 J8]]]", "D7 J8 R": "(set: $miss to 0)## ✅ Job done\n**A footrest or a sturdy box.** The chair height is right for her arms. So bring the floor up to her feet.\n\n[[Next customer->D7 J9]]", "D7 J9": "**Grandpa Leo** folded out the little feet on the back of his keyboard. Now his wrists bend up sharply when he types. They ache.\n\n**What's a good fix?**\n\n* [[Fold out even taller keyboard feet->D7 J9 W]]\n* [[Rest his wrists on the desk edge->D7 J9 W]]\n* [[Fold the feet in so it sits flat->D7 J9 R]]\n* [[Hold his hands higher over the keys->D7 J9 W]]", "D7 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those feet tilt the keyboard up. That bends the wrists up. **Fold them in** so his wrists can stay straight.\"\n\n[[Got it->D7 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about those little keyboard feet?\"\n\n[[Try again->D7 J9]]]", "D7 J9 R": "(set: $miss to 0)## ✅ Job done\n**Fold the feet in.** A flat keyboard helps keep wrists straight.\n\n[[Next customer->D7 J10]]", "D7 J10": "**Ava's** full-size keyboard is very wide. Her mouse sits way off to the right. Her right shoulder is sore after gaming.\n\n**What could help?**\n\n* [[Move the mouse even farther away->D7 J10 W]]\n* [[Get a louder, clicky keyboard->D7 J10 W]]\n* [[Use the mouse with her left hand->D7 J10 W]]\n* [[Use a narrower TKL keyboard->D7 J10 R]]", "D7 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **TKL** keyboard has no number pad. So the mouse can sit **closer**, and her arm doesn't have to reach.\"\n\n[[Got it->D7 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think back to Day 3. Which keyboard size makes room for the mouse?\"\n\n[[Try again->D7 J10]]]", "D7 J10 R": "(set: $miss to 0)## ✅ Job done\n**A narrower TKL keyboard.** With no number pad, the mouse sits right next to the keys. Her shoulder doesn't reach out to the side.\n\n[[The Inspector has something to show you->D7 L11]]", "D7 L11": "## 📘 The Inspector's lesson: Move Your Body\n\n\"Last lesson. Even a perfect setup needs breaks. Don't sit in it for hours.\"\n\n* **Get up and move about once an hour.** Walk around. Get some water. Stretch.\n* **Shrug and roll your shoulders.** Gently stretch your neck and wrists.\n* Does pain **not go away**? Do your hands tingle or feel numb? Then **tell a grown-up**. You may need to see a doctor.\n\n\n[[Got it. Send in the next customer->D7 J12]]", "D7 J12": "**Jayden** played games for four hours without getting up. Now his back is stiff. His legs feel like noodles.\n\n**What should he change?**\n\n* [[Play shorter and only sit in bed->D7 J12 W]]\n* [[Get up and move once an hour->D7 J12 R]]\n* [[Buy a chair so he never gets up->D7 J12 W]]\n* [[Play standing on one foot->D7 J12 W]]", "D7 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Get up and move about once an hour.** Bodies aren't built to sit still for four hours.\"\n\n[[Got it->D7 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What was my last lesson?\"\n\n[[Try again->D7 J12]]]", "D7 J12 R": "(set: $miss to 0)(if: $days does not contain \"7\")[(set: $days to it + (a: \"7\"))]## ✅ Job done\n**Move about once an hour.** A quick walk and a stretch between rounds keeps the body happy. No chair is good enough to sit in for four hours straight.\n\n[[Close up shop->D7 Done]]", "D7 Done": "(if: $days does not contain \"7\")[(set: $days to it + (a: \"7\"))]# Day 7 complete!\n\n<div class=\"tool\">🪑 **New tool earned: Posture Pro Badge**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Do a comfort check of your own setup. Check screen height, distance, light, elbows, wrists, mouse spot, and feet. Make **one change today**. Try the 20-20-20 rule and a stretch break every hour.</div>\n\n[[Back to the work schedule->Shop]]\n[[Take the Unit 1 Exam->Exam Start]]", "Exam Start": "(set: $miss to 0)# 🎓 The Inspector's Unit 1 Exam\n\n*The Inspector sets down a clipboard.* \"Here are fourteen questions. There are two from each day. Same rule as always. Miss twice, and I'll show you. Ready?\"\n\n[[Begin->X1]]", "X1": "**Question 1 of 14.** A laptop has a small, rounded oval port. The plug fits in either way up. The laptop charges through it.\n\n**What kind of port is it?**\n\n* [[USB-A->X1 W]]\n* [[USB-C->X1 R]]\n* [[HDMI->X1 W]]\n* [[Ethernet->X1 W]]", "X1 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Small oval, fits either way up, and it charges: **USB-C**.\"\n\n[[Got it->X1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Small oval, either way up... check your Port Map.\"\n\n[[Try again->X1]]]", "X1 R": "(set: $miss to 0)## ✅ Job done\n**USB-C.** It fits either way up. It can charge, move files, and often send video.\n\n[[Next question->X2]]", "X2": "**Question 2 of 14.** A girl is about to make a big video on her laptop. That will make the laptop work very hard.\n\n**Where should the laptop sit while it works hard?**\n\n* [[On a soft pillow, so it's cushioned->X2 W]]\n* [[Under a blanket, to keep off dust->X2 W]]\n* [[On a bed, so the fans are quiet->X2 W]]\n* [[On a hard, flat spot, vents clear->X2 R]]", "X2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A hard, flat surface with the vents clear.** Then air can flow in and out.\"\n\n[[Got it->X2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What do the vents need?\"\n\n[[Try again->X2]]]", "X2 R": "(set: $miss to 0)## ✅ Job done\n**Hard surface, clear vents.** Soft things block the vents. Then the laptop gets too hot.\n\n[[Next question->X3]]", "X3": "**Question 3 of 14.** A boy wants to clean his laptop screen tonight.\n\n**What should he use?**\n\n* [[Off, with a paper towel and some window cleaner->X3 W]]\n* [[Still on, with a bleach wipe and then a dry cloth->X3 W]]\n* [[Off, with a microfiber cloth and distilled water->X3 R]]\n* [[Still on, with a can of compressed air upside down->X3 W]]", "X3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Power off. Use microfiber. Put distilled water **on the cloth**.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think: the golden rule, the right cloth, and where the water goes.\"\n\n[[Try again->X3]]]", "X3 R": "(set: $miss to 0)## ✅ Job done\nTurn it off. Use microfiber. Put a little distilled water on the cloth. Never put it on the screen.\n\n[[Next question->X4]]", "X4": "**Question 4 of 14.** You check a cleaning kit that a kid made at home.\n\n**Which item goes in the trouble bin?**\n\n* [[Window cleaner with ammonia->X4 R]]\n* [[A clean microfiber cloth->X4 W]]\n* [[Distilled water on a cloth->X4 W]]\n* [[70% alcohol on a cotton swab->X4 W]]", "X4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Window cleaner with ammonia** can hurt the coating on a screen. It stays out of the kit.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which one can strip the coating off a screen?\"\n\n[[Try again->X4]]]", "X4 R": "(set: $miss to 0)## ✅ Job done\n**Window cleaner with ammonia.** All the rest are safe if you use them the right way.\n\n[[Next question->X5]]", "X5": "**Question 5 of 14.** A keyboard feels squishy. It has no click. Each key has a rubber dome under it.\n\n**What type is it?**\n\n* [[Mechanical->X5 W]]\n* [[Membrane->X5 R]]\n* [[Butterfly->X5 W]]\n* [[Scissor-switch->X5 W]]", "X5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A rubber dome means **membrane**.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Rubber dome...\"\n\n[[Try again->X5]]]", "X5 R": "(set: $miss to 0)## ✅ Job done\n**Membrane.** Each key sits on a soft rubber dome.\n\n[[Next question->X6]]", "X6": "**Question 6 of 14.** A tiny keyboard has letters and numbers. But it has no number pad. It has no arrow keys and no function row.\n\n**What size is it?**\n\n* [[Full-size->X6 W]]\n* [[TKL (tenkeyless)->X6 W]]\n* [[Split ergonomic->X6 W]]\n* [[60%->X6 R]]", "X6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No number pad, no arrows, no function row: **60%**.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"TKL drops the number pad. Which size drops even more?\"\n\n[[Try again->X6]]]", "X6 R": "(set: $miss to 0)## ✅ Job done\n**60%.** TKL only drops the number pad. A 60% drops the arrow keys and function row too.\n\n[[Next question->X7]]", "X7": "**Question 7 of 14.** A crumb is stuck under a laptop key.\n\n**What should you do?**\n\n* [[Power off, then air and a swab->X7 R]]\n* [[Power off, then pry it up with a knife->X7 W]]\n* [[Power off, then pour alcohol in the gap->X7 W]]\n* [[Leave it on and hit the key hard->X7 W]]", "X7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Laptop keys stay on. Power off. Then use **air and a swab around the key**.\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Do laptop keys come off?\"\n\n[[Try again->X7]]]", "X7 R": "(set: $miss to 0)## ✅ Job done\nLaptop keys stay on, because their clips snap. So clean around them instead.\n\n[[Next question->X8]]", "X8": "**Question 8 of 14.** Someone just spilled soda all over their laptop keys.\n\n**What comes first?**\n\n* [[Wipe the keys dry with a towel->X8 W]]\n* [[Put it in a bag of rice->X8 W]]\n* [[Power it off and unplug it->X8 R]]\n* [[Check if it still types->X8 W]]", "X8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Power off and unplug, right away.** Then flip it, blot it, and let it dry.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"First minute, first step...\"\n\n[[Try again->X8]]]", "X8 R": "(set: $miss to 0)## ✅ Job done\n**Power off and unplug.** Then flip it and blot it. Don't wipe. Let it dry for 24 to 48 hours. Soda is sugary. So it may need a cleaning by a pro.\n\n[[Next question->X9]]", "X9": "**Question 9 of 14.** A mouse skips and jumps on a clear glass table.\n\n**What's the fix?**\n\n* [[Update the mouse driver->X9 W]]\n* [[Use a mouse pad->X9 R]]\n* [[Change the batteries->X9 W]]\n* [[Turn the DPI up->X9 W]]", "X9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor needs texture. Use a **mouse pad.**\"\n\n[[Got it->X9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does the sensor need to see?\"\n\n[[Try again->X9]]]", "X9 R": "(set: $miss to 0)## ✅ Job done\nClear glass gives the sensor nothing to track. A mouse pad gives it texture to see.\n\n[[Next question->X10]]", "X10": "**Question 10 of 14.** A wireless mouse lags and jumps a bit more each day.\n\n**What should you try first?**\n\n* [[Buy a new gaming mouse->X10 W]]\n* [[Turn the DPI up as high as it goes->X10 W]]\n* [[Change or charge the battery->X10 R]]\n* [[Move to a glass desk->X10 W]]", "X10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lag that gets worse each day means a **low battery**. Change it or charge it first.\"\n\n[[Got it->X10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What are the warning signs of a low battery?\"\n\n[[Try again->X10]]]", "X10 R": "(set: $miss to 0)## ✅ Job done\n**Change or charge the battery.** Always try the simple fix first.\n\n[[Next question->X11]]", "X11": "**Question 11 of 14.** You blast a scroll wheel with compressed air. But some lint is still stuck in the gap around it.\n\n**What do you use to lift it out?**\n\n* [[A thin metal paperclip->X11 W]]\n* [[A sewing needle->X11 W]]\n* [[A wet cotton swab->X11 W]]\n* [[A wooden toothpick->X11 R]]", "X11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **wooden toothpick**. Metal can scratch things or cause a short.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check step 5 of the service checklist. Never metal.\"\n\n[[Try again->X11]]]", "X11 R": "(set: $miss to 0)## ✅ Job done\n**A wooden toothpick.** It is gentle and dry, and it is not metal.\n\n[[Next question->X12]]", "X12": "**Question 12 of 14.** You open a mouse's battery door. There is crusty white powder on the batteries.\n\n**What comes first?**\n\n* [[Get a grown-up and put on gloves->X12 R]]\n* [[Brush it off with your fingers->X12 W]]\n* [[Blow the powder off the batteries->X12 W]]\n* [[Close it and keep using the mouse->X12 W]]", "X12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's leaked battery chemicals. **Grown-up and gloves first.**\"\n\n[[Got it->X12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Is that crust safe to touch?\"\n\n[[Try again->X12]]]", "X12 R": "(set: $miss to 0)## ✅ Job done\n**Grown-up and gloves first.** Then take out the batteries and recycle them. Clean the metal contacts with a swab.\n\n[[Next question->X13]]", "X13": "**Question 13 of 14.** Someone's neck hurts. They use a laptop on a low table every day.\n\n**What's the best fix?**\n\n* [[Tilt the screen way back->X13 W]]\n* [[Use it in bed so the screen is higher->X13 W]]\n* [[Use a stand and a separate keyboard->X13 R]]\n* [[Make the text bigger to read->X13 W]]", "X13 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Use a stand to put the screen at **eye level**. Add a **separate keyboard and mouse**.\"\n\n[[Got it->X13 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where should the top of the screen be?\"\n\n[[Try again->X13]]]", "X13 R": "(set: $miss to 0)## ✅ Job done\nUse a stand, plus a separate keyboard and mouse. The screen goes up. Your hands stay comfy.\n\n[[Next question->X14]]", "X14": "**Question 14 of 14.** A friend asks you about the 20-20-20 rule.\n\n**What do you tell them?**\n\n* [[Every 20 seconds, look 20 inches away for 20 minutes->X14 W]]\n* [[After 20 hours of screens, rest for 20 minutes->X14 W]]\n* [[Sit 20 inches away at 20 percent brightness->X14 W]]\n* [[Every 20 minutes, look 20 feet away for 20 seconds->X14 R]]", "X14 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Every **20 minutes**, look **20 feet** away for **20 seconds**.\"\n\n[[Got it->X14 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Minutes, feet, seconds...\"\n\n[[Try again->X14]]]", "X14 R": "(set: $miss to 0)## ✅ Job done\n**Every 20 minutes, look 20 feet away for 20 seconds.** It gives the focus muscles in your eyes a break.\n\n[[See your results->Certificate]]", "Certificate": "# 🏅 Junior Technician: Unit 1 Complete\n\n*The Inspector pins a small brass badge to your apron.* \"Look what you can do now. You can name each kind of computer. You can build a safe cleaning kit. You can tell keyboards and mice apart. You can clean them the right way. And you can set up a desk that won't hurt you. That's a strong start.\"\n\n**Your toolbox:** 🔦 Port Map · 🧽 Cleaning Kit · ⌨️ Keyboard ID Card · 🧹 Keycap Puller · 🖱️ Mouse Field Guide · 🪛 Service Kit · 🪑 Posture Pro Badge\n\n\"Next unit, we go deeper. We'll look at screens, air flow, cables, and batteries. We'll cover earbuds and game controllers. And we'll see what pets and little brothers and sisters do to computers.\"\n\n*Unit 2: Keep It Healthy, coming soon.*\n\n[[Back to the work schedule->Shop]]"}};
(function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly and unlocks the days before it (for links from course modules)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),...Object.keys(STORY.passages).map(k=>(k.match(/^D(\d+) Start$/)||[])[1]).filter(Boolean)]));show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];show('D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
