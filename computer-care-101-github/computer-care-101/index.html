 width=\"4\" height=\"24\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"318\" y=\"58\" width=\"4\" height=\"24\" rx=\"2\" fill=\"#1b1f24\"/><rect x=\"327\" y=\"58\" width=\"4\" height=\"24\" rx=\"2\" fill=\"#1b1f24\"/><line x1=\"334\" y1=\"46\" x2=\"334\" y2=\"20\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"334,20 337.8,27.0 330.2,27.0\" fill=\"#ff6b6b\"/><line x1=\"318\" y1=\"46\" x2=\"318\" y2=\"20\" stroke=\"#ff6b6b\" stroke-width=\"3\" stroke-linecap=\"round\"/><polygon points=\"318,20 321.8,27.0 314.2,27.0\" fill=\"#ff6b6b\"/><text x=\"99\" y=\"128\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">her laptop, underneath</text><text x=\"281\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the back edge</text></svg><div class=\"cap\">Air comes in at the bottom and blows out the back.</div></div>\n\n**Question 2 of 12.** A girl is about to make a big video on her laptop. That will make the laptop work very hard.\n\n**Where should the laptop sit while it works hard?**\n\n* [[On a soft pillow, so it's cushioned->X2 W]]\n* [[Under a blanket, to keep off dust->X2 W]]\n* [[On a bed, so the fans are quiet->X2 W]]\n* [[On a hard, flat spot, vents clear->X2 R]]", "X2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A hard, flat surface with the vents clear.** Then air can flow in and out.\"\n\n[[Got it->X2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What do the vents need?\"\n\n[[Try again->X2]]]", "X2 R": "(set: $miss to 0)## ✅ Job done\n**Hard surface, clear vents.** Soft things block the vents. Then the laptop gets too hot.\n\n[[Next question->X3]]", "X3": "<div class=\"scene\">🧽 💻</div>\n\n**Question 3 of 12.** A boy wants to clean his laptop screen tonight.\n\n**What should he use?**\n\n* [[Off, with a paper towel and some window cleaner->X3 W]]\n* [[Still on, with a bleach wipe and then a dry cloth->X3 W]]\n* [[Off, with a microfiber cloth and distilled water->X3 R]]\n* [[Still on, with a can of compressed air upside down->X3 W]]", "X3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Power off. Use microfiber. Put distilled water **on the cloth**.\"\n\n[[Got it->X3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Think: the golden rule, the right cloth, and where the water goes.\"\n\n[[Try again->X3]]]", "X3 R": "(set: $miss to 0)## ✅ Job done\nTurn it off. Use microfiber. Put a little distilled water on the cloth. Never put it on the screen.\n\n[[Next question->X4]]", "X4": "<div class=\"scene\">🧰 🔍</div>\n\n<div class=\"cards\"><div class=\"card\"><svg viewBox=\"0 0 96 64\" role=\"img\" aria-label=\"Spray bottle\"><rect x=\"36\" y=\"22\" width=\"26\" height=\"38\" rx=\"5\" fill=\"#7fd1ff\" opacity=\"0.8\"/><rect x=\"40\" y=\"10\" width=\"18\" height=\"12\" fill=\"#4a535d\"/><path d=\"M58 12 h14 v6 h-14\" fill=\"#4a535d\"/><path d=\"M48 22 v-4\" stroke=\"#4a535d\" stroke-width=\"3\"/><rect x=\"39\" y=\"34\" width=\"20\" height=\"12\" rx=\"2\" fill=\"#e9ecef\"/></svg><b>Spray bottle</b>window cleaner, with ammonia</div><div class=\"card\"><svg viewBox=\"0 0 96 64\" role=\"img\" aria-label=\"A cloth\"><rect x=\"22\" y=\"16\" width=\"52\" height=\"38\" rx=\"6\" fill=\"#6fe3b5\"/><path d=\"M22 30 L74 30\" stroke=\"#3aa880\" stroke-width=\"2\"/><circle cx=\"28\" cy=\"40\" r=\"1.5\" fill=\"#3aa880\"/><circle cx=\"36\" cy=\"46\" r=\"1.5\" fill=\"#3aa880\"/><circle cx=\"44\" cy=\"40\" r=\"1.5\" fill=\"#3aa880\"/><circle cx=\"52\" cy=\"46\" r=\"1.5\" fill=\"#3aa880\"/><circle cx=\"60\" cy=\"40\" r=\"1.5\" fill=\"#3aa880\"/><circle cx=\"68\" cy=\"46\" r=\"1.5\" fill=\"#3aa880\"/></svg><b>A cloth</b>clean microfiber</div><div class=\"card\"><svg viewBox=\"0 0 96 64\" role=\"img\" aria-label=\"Water\"><rect x=\"34\" y=\"8\" width=\"14\" height=\"8\" rx=\"2\" fill=\"#4a535d\"/><path d=\"M30 16 h22 l8 8 v34 h-38 v-34 z\" fill=\"#7fd1ff\" opacity=\"0.55\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"26\" y=\"34\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#e9ecef\"/><circle cx=\"72\" cy=\"40\" r=\"10\" fill=\"#e9ecef\" opacity=\"0.9\"/></svg><b>Water</b>distilled, on a cloth</div><div class=\"card\"><svg viewBox=\"0 0 96 64\" role=\"img\" aria-label=\"Alcohol\"><rect x=\"18\" y=\"20\" width=\"24\" height=\"38\" rx=\"4\" fill=\"#e9ecef\"/><rect x=\"22\" y=\"10\" width=\"16\" height=\"10\" fill=\"#ff6b6b\"/><rect x=\"21\" y=\"32\" width=\"18\" height=\"10\" rx=\"2\" fill=\"#7fd1ff\"/><line x1=\"54\" y1=\"50\" x2=\"84\" y2=\"20\" stroke=\"#e9ecef\" stroke-width=\"3\"/><ellipse cx=\"54\" cy=\"50\" rx=\"6\" ry=\"4\" fill=\"#fff\" transform=\"rotate(-45 54 50)\"/><ellipse cx=\"84\" cy=\"20\" rx=\"6\" ry=\"4\" fill=\"#fff\" transform=\"rotate(-45 84 20)\"/></svg><b>Alcohol</b>70%, on a cotton swab</div></div>\n\n**Question 4 of 12.** You check a cleaning kit that a kid made at home.\n\n**Which item goes in the trouble bin?**\n\n* [[Window cleaner with ammonia->X4 R]]\n* [[A clean microfiber cloth->X4 W]]\n* [[Distilled water on a cloth->X4 W]]\n* [[70% alcohol on a cotton swab->X4 W]]", "X4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Window cleaner with ammonia** can hurt the coating on a screen. It stays out of the kit.\"\n\n[[Got it->X4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which one can strip the coating off a screen?\"\n\n[[Try again->X4]]]", "X4 R": "(set: $miss to 0)## ✅ Job done\n**Window cleaner with ammonia.** All the rest are safe if you use them the right way.\n\n[[Next question->X5]]", "X5": "<div class=\"scene\">💻 🍪</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"Laptop keys are flat and thin. Look where the crumb is.\"><rect x=\"10\" y=\"14\" width=\"190\" height=\"92\" rx=\"8\" fill=\"#3a4250\"/><rect x=\"20\" y=\"22\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><rect x=\"20\" y=\"64\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><rect x=\"65\" y=\"22\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><rect x=\"65\" y=\"64\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><rect x=\"110\" y=\"22\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><rect x=\"110\" y=\"64\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><rect x=\"155\" y=\"22\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><rect x=\"155\" y=\"64\" width=\"38\" height=\"36\" rx=\"4\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"1.5\"/><path d=\"M92 56 l10 -3 l8 4 l-2 8 l-10 2 l-7 -4 z\" fill=\"#c8894a\" stroke=\"#8a5a2a\" stroke-width=\"1.5\"/><rect x=\"230\" y=\"70\" width=\"120\" height=\"8\" rx=\"2\" fill=\"#5b6573\"/><rect x=\"238\" y=\"58\" width=\"44\" height=\"7\" rx=\"2\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"1.5\"/><rect x=\"296\" y=\"58\" width=\"44\" height=\"7\" rx=\"2\" fill=\"#1b1f24\" stroke=\"#9aa4ae\" stroke-width=\"1.5\"/><path d=\"M278 66 l6 -3 l5 2 l-1 4 l-8 1 z\" fill=\"#c8894a\"/><circle cx=\"286\" cy=\"66\" r=\"22\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"2\"/><text x=\"105\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the laptop keys, from above</text><text x=\"290\" y=\"112\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">from the side</text></svg><div class=\"cap\">Laptop keys are flat and thin. Look where the crumb is.</div></div>\n\n**Question 5 of 12.** A crumb is stuck under a laptop key.\n\n**What should you do?**\n\n* [[Power off, then air and a swab->X5 R]]\n* [[Power off, then pry it up with a knife->X5 W]]\n* [[Power off, then pour alcohol in the gap->X5 W]]\n* [[Leave it on and hit the key hard->X5 W]]", "X5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Laptop keys stay on. Power off. Then use **air and a swab around the key**.\"\n\n[[Got it->X5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Do laptop keys come off?\"\n\n[[Try again->X5]]]", "X5 R": "(set: $miss to 0)## ✅ Job done\nLaptop keys stay on, because their clips snap. So clean around them instead.\n\n[[Next question->X6]]", "X6": "<div class=\"scene\">🥤 💦 💻</div>\n\n**Question 6 of 12.** Someone just spilled soda all over their laptop keys.\n\n**What comes first?**\n\n* [[Wipe the keys dry with a towel->X6 W]]\n* [[Put it in a bag of rice->X6 W]]\n* [[Power it off and unplug it->X6 R]]\n* [[Check if it still types->X6 W]]", "X6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Power off and unplug, right away.** Then flip it, blot it, and let it dry.\"\n\n[[Got it->X6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"First minute, first step...\"\n\n[[Try again->X6]]]", "X6 R": "(set: $miss to 0)## ✅ Job done\n**Power off and unplug.** Then flip it and blot it. Don't wipe. Let it dry for 24 to 48 hours. Soda is sugary. So it may need a cleaning by a pro.\n\n[[Next question->X7]]", "X7": "<div class=\"scene\">🖱️ 🪟</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"The sensor light shines right through the glass.\"><rect x=\"20\" y=\"62\" width=\"320\" height=\"12\" rx=\"2\" fill=\"#7fd1ff\" opacity=\"0.35\" stroke=\"#7fd1ff\" stroke-width=\"1.5\"/><rect x=\"40\" y=\"74\" width=\"8\" height=\"48\" fill=\"#5b6573\"/><rect x=\"312\" y=\"74\" width=\"8\" height=\"48\" fill=\"#5b6573\"/><path d=\"M130 62 C 130 34, 220 30, 230 62 Z\" fill=\"#8a96a3\"/><polygon points=\"174,62 184,62 200,124 158,124\" fill=\"#ff6b6b\" opacity=\"0.3\"/><circle cx=\"179\" cy=\"60\" r=\"3\" fill=\"#ff6b6b\"/><line x1=\"20\" y1=\"124\" x2=\"340\" y2=\"124\" stroke=\"#5b6573\" stroke-width=\"2\"/><text x=\"180\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the mouse</text><text x=\"268\" y=\"100\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">the sensor light</text><text x=\"90\" y=\"54\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#7fd1ff\" text-anchor=\"middle\" font-weight=\"normal\">clear glass</text></svg><div class=\"cap\">The sensor light shines right through the glass.</div></div>\n\n**Question 7 of 12.** A mouse skips and jumps on a clear glass table.\n\n**What's the fix?**\n\n* [[Update the mouse driver->X7 W]]\n* [[Use a mouse pad->X7 R]]\n* [[Change the batteries->X7 W]]\n* [[Turn the DPI up->X7 W]]", "X7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor needs texture. Use a **mouse pad.**\"\n\n[[Got it->X7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does the sensor need to see?\"\n\n[[Try again->X7]]]", "X7 R": "(set: $miss to 0)## ✅ Job done\nClear glass gives the sensor nothing to track. A mouse pad gives it texture to see.\n\n[[Next question->X8]]", "X8": "<div class=\"scene\">🖱️ 📅</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 130\" role=\"img\" aria-label=\"The same wireless mouse, a few days apart.\"><rect x=\"10\" y=\"14\" width=\"160\" height=\"88\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"2\"/><path d=\"M24 80 C 60 74, 80 52, 110 50 S 140 40, 150 32\" stroke=\"#6fe3b5\" stroke-width=\"3\" fill=\"none\" stroke-dasharray=\"14 3\"/><path d=\"M150 26 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 0 z\" fill=\"#e9ecef\"/><rect x=\"190\" y=\"14\" width=\"160\" height=\"88\" rx=\"6\" fill=\"#1b1f24\" stroke=\"#5b6573\" stroke-width=\"2\"/><path d=\"M204 80 L222 76\" stroke=\"#ffb347\" stroke-width=\"3\"/><path d=\"M244 66 L254 62\" stroke=\"#ffb347\" stroke-width=\"3\"/><path d=\"M282 54 L288 50\" stroke=\"#ffb347\" stroke-width=\"3\"/><path d=\"M222 76 L244 66 M254 62 L282 54 M288 50 L330 32\" stroke=\"#ffb347\" stroke-width=\"1.5\" stroke-dasharray=\"2 5\"/><path d=\"M330 26 l0 16 l4 -4 l3 7 l3 -1 l-3 -7 l6 0 z\" fill=\"#e9ecef\"/><text x=\"90\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Monday: a little lag</text><text x=\"270\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">Friday: big jumps</text></svg><div class=\"cap\">The same wireless mouse, a few days apart.</div></div>\n\n**Question 8 of 12.** A wireless mouse lags and jumps a bit more each day.\n\n**What should you try first?**\n\n* [[Buy a new gaming mouse->X8 W]]\n* [[Turn the DPI up as high as it goes->X8 W]]\n* [[Change or charge the battery->X8 R]]\n* [[Move to a glass desk->X8 W]]", "X8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lag that gets worse each day means a **low battery**. Change it or charge it first.\"\n\n[[Got it->X8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What are the warning signs of a low battery?\"\n\n[[Try again->X8]]]", "X8 R": "(set: $miss to 0)## ✅ Job done\n**Change or charge the battery.** Always try the simple fix first.\n\n[[Next question->X9]]", "X9": "<div class=\"scene\">🖱️ 💨</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"The fuzzy bits are stuck in the gap around the wheel.\"><path d=\"M40 30 C 40 6, 120 6, 120 30 L120 100 C 120 128, 40 128, 40 100 Z\" fill=\"#8a96a3\"/><line x1=\"80\" y1=\"10\" x2=\"80\" y2=\"56\" stroke=\"#5b6573\" stroke-width=\"2\"/><rect x=\"73\" y=\"22\" width=\"14\" height=\"26\" rx=\"6\" fill=\"#1b1f24\"/><rect x=\"76\" y=\"25\" width=\"8\" height=\"20\" rx=\"4\" fill=\"#4a535d\"/><circle cx=\"80\" cy=\"35\" r=\"22\" fill=\"none\" stroke=\"#ffb347\" stroke-width=\"2\"/><line x1=\"108\" y1=\"35\" x2=\"196\" y2=\"60\" stroke=\"#ffb347\" stroke-width=\"2\" stroke-linecap=\"round\"/><polygon points=\"196,60 188.2,61.8 190.3,54.4\" fill=\"#ffb347\"/><circle cx=\"270\" cy=\"66\" r=\"56\" fill=\"#8a96a3\" stroke=\"#ffb347\" stroke-width=\"2\"/><rect x=\"242\" y=\"20\" width=\"56\" height=\"92\" rx=\"20\" fill=\"#1b1f24\"/><rect x=\"252\" y=\"28\" width=\"36\" height=\"76\" rx=\"16\" fill=\"#4a535d\"/><line x1=\"254\" y1=\"36\" x2=\"286\" y2=\"36\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"254\" y1=\"45\" x2=\"286\" y2=\"45\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"254\" y1=\"54\" x2=\"286\" y2=\"54\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"254\" y1=\"63\" x2=\"286\" y2=\"63\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"254\" y1=\"72\" x2=\"286\" y2=\"72\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"254\" y1=\"81\" x2=\"286\" y2=\"81\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"254\" y1=\"90\" x2=\"286\" y2=\"90\" stroke=\"#3a4250\" stroke-width=\"3\"/><line x1=\"254\" y1=\"99\" x2=\"286\" y2=\"99\" stroke=\"#3a4250\" stroke-width=\"3\"/><circle cx=\"247\" cy=\"40\" r=\"5\" fill=\"#d8d2c4\"/><circle cx=\"252\" cy=\"47\" r=\"4\" fill=\"#d8d2c4\"/><circle cx=\"245\" cy=\"52\" r=\"4\" fill=\"#d8d2c4\"/><circle cx=\"250\" cy=\"57\" r=\"3\" fill=\"#d8d2c4\"/><circle cx=\"293\" cy=\"78\" r=\"5\" fill=\"#d8d2c4\"/><circle cx=\"289\" cy=\"86\" r=\"4\" fill=\"#d8d2c4\"/><circle cx=\"295\" cy=\"92\" r=\"4\" fill=\"#d8d2c4\"/><circle cx=\"291\" cy=\"98\" r=\"3\" fill=\"#d8d2c4\"/><path d=\"M240 36 l6 4 M256 44 l-4 6 M298 74 l-5 6 M286 94 l6 2\" stroke=\"#d8d2c4\" stroke-width=\"2\" stroke-linecap=\"round\"/><text x=\"80\" y=\"130\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the mouse</text><text x=\"170\" y=\"22\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ffb347\" text-anchor=\"middle\" font-weight=\"normal\">up close</text></svg><div class=\"cap\">The fuzzy bits are stuck in the gap around the wheel.</div></div>\n\n**Question 9 of 12.** You blast a scroll wheel with compressed air. But some lint is still stuck in the gap around it.\n\n**What do you use to lift it out?**\n\n* [[A thin metal paperclip->X9 W]]\n* [[A sewing needle->X9 W]]\n* [[A wet cotton swab->X9 W]]\n* [[A wooden toothpick->X9 R]]", "X9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **wooden toothpick**. Metal can scratch things or cause a short.\"\n\n[[Got it->X9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check step 5 of the service checklist. Never metal.\"\n\n[[Try again->X9]]]", "X9 R": "(set: $miss to 0)## ✅ Job done\n**A wooden toothpick.** It is gentle and dry, and it is not metal.\n\n[[Next question->X10]]", "X10": "<div class=\"scene\">🔋 🧂 ⚠️</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"Look at the white crust on the battery ends.\"><rect x=\"50\" y=\"14\" width=\"260\" height=\"92\" rx=\"12\" fill=\"#2b3139\" stroke=\"#5b6573\" stroke-width=\"2\"/><rect x=\"80\" y=\"28\" width=\"180\" height=\"28\" rx=\"5\" fill=\"#4a535d\"/><rect x=\"80\" y=\"28\" width=\"60\" height=\"28\" rx=\"5\" fill=\"#ffb347\"/><rect x=\"260\" y=\"36\" width=\"8\" height=\"12\" rx=\"2\" fill=\"#c9d1d9\"/><rect x=\"80\" y=\"66\" width=\"180\" height=\"28\" rx=\"5\" fill=\"#4a535d\"/><rect x=\"80\" y=\"66\" width=\"60\" height=\"28\" rx=\"5\" fill=\"#ffb347\"/><rect x=\"260\" y=\"74\" width=\"8\" height=\"12\" rx=\"2\" fill=\"#c9d1d9\"/><circle cx=\"268\" cy=\"40\" r=\"6\" fill=\"#f4f1e8\"/><circle cx=\"275\" cy=\"44\" r=\"5\" fill=\"#f4f1e8\"/><circle cx=\"263\" cy=\"46\" r=\"4\" fill=\"#f4f1e8\"/><circle cx=\"272\" cy=\"34\" r=\"4\" fill=\"#f4f1e8\"/><circle cx=\"278\" cy=\"38\" r=\"3\" fill=\"#f4f1e8\"/><circle cx=\"272\" cy=\"76\" r=\"6\" fill=\"#f4f1e8\"/><circle cx=\"279\" cy=\"80\" r=\"5\" fill=\"#f4f1e8\"/><circle cx=\"267\" cy=\"82\" r=\"4\" fill=\"#f4f1e8\"/><circle cx=\"276\" cy=\"70\" r=\"4\" fill=\"#f4f1e8\"/><circle cx=\"282\" cy=\"74\" r=\"3\" fill=\"#f4f1e8\"/><circle cx=\"80\" cy=\"46\" r=\"6\" fill=\"#f4f1e8\"/><circle cx=\"87\" cy=\"50\" r=\"5\" fill=\"#f4f1e8\"/><circle cx=\"75\" cy=\"52\" r=\"4\" fill=\"#f4f1e8\"/><circle cx=\"84\" cy=\"40\" r=\"4\" fill=\"#f4f1e8\"/><circle cx=\"90\" cy=\"44\" r=\"3\" fill=\"#f4f1e8\"/><rect x=\"318\" y=\"20\" width=\"30\" height=\"80\" rx=\"6\" fill=\"none\" stroke=\"#5b6573\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><text x=\"180\" y=\"126\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">inside the battery door</text></svg><div class=\"cap\">Look at the white crust on the battery ends.</div></div>\n\n**Question 10 of 12.** You open a mouse's battery door. There is crusty white powder on the batteries.\n\n**What comes first?**\n\n* [[Get a grown-up and put on gloves->X10 R]]\n* [[Brush it off with your fingers->X10 W]]\n* [[Blow the powder off the batteries->X10 W]]\n* [[Close it and keep using the mouse->X10 W]]", "X10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's leaked battery chemicals. **Grown-up and gloves first.**\"\n\n[[Got it->X10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Is that crust safe to touch?\"\n\n[[Try again->X10]]]", "X10 R": "(set: $miss to 0)## ✅ Job done\n**Grown-up and gloves first.** Then take out the batteries and recycle them. Clean the metal contacts with a swab.\n\n[[Next question->X11]]", "X11": "<div class=\"scene\">😣 💻</div>\n\n<div class=\"pic\"><svg viewBox=\"0 0 360 135\" role=\"img\" aria-label=\"See how far down the head has to bend.\"><rect x=\"150\" y=\"100\" width=\"170\" height=\"8\" rx=\"2\" fill=\"#8a6a4a\"/><rect x=\"158\" y=\"108\" width=\"8\" height=\"18\" fill=\"#8a6a4a\"/><rect x=\"304\" y=\"108\" width=\"8\" height=\"18\" fill=\"#8a6a4a\"/><rect x=\"170\" y=\"94\" width=\"66\" height=\"6\" rx=\"2\" fill=\"#8a96a3\"/><polygon points=\"232,94 236,94 252,58 248,58\" fill=\"#8a96a3\"/><rect x=\"30\" y=\"92\" width=\"74\" height=\"10\" rx=\"3\" fill=\"#5b6573\"/><rect x=\"38\" y=\"102\" width=\"7\" height=\"24\" fill=\"#5b6573\"/><rect x=\"90\" y=\"102\" width=\"7\" height=\"24\" fill=\"#5b6573\"/><path d=\"M66 90 L88 50\" stroke=\"#e9ecef\" stroke-width=\"7\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M88 50 Q 100 56 106 66\" stroke=\"#e9ecef\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/><circle cx=\"114\" cy=\"76\" r=\"12\" fill=\"#e9ecef\"/><path d=\"M66 90 L118 92 L122 124\" stroke=\"#e9ecef\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M88 54 L118 80 L172 92\" stroke=\"#e9ecef\" stroke-width=\"4.5\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"96\" cy=\"56\" r=\"7\" fill=\"#ff6b6b\" opacity=\"0.85\"/><path d=\"M124 72 L244 74\" stroke=\"#9aa4ae\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><text x=\"96\" y=\"30\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"13\" fill=\"#ff6b6b\" text-anchor=\"middle\" font-weight=\"normal\">sore neck</text><text x=\"235\" y=\"124\" font-family=\"Segoe UI,Inter,sans-serif\" font-size=\"14\" fill=\"#e9ecef\" text-anchor=\"middle\" font-weight=\"normal\">the low table</text></svg><div class=\"cap\">See how far down the head has to bend.</div></div>\n\n**Question 11 of 12.** Someone's neck hurts. They use a laptop on a low table every day.\n\n**What's the best fix?**\n\n* [[Tilt the screen way back->X11 W]]\n* [[Use it in bed so the screen is higher->X11 W]]\n* [[Use a stand and a separate keyboard->X11 R]]\n* [[Make the text bigger to read->X11 W]]", "X11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Use a stand to put the screen at **eye level**. Add a **separate keyboard and mouse**.\"\n\n[[Got it->X11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Where should the top of the screen be?\"\n\n[[Try again->X11]]]", "X11 R": "(set: $miss to 0)## ✅ Job done\nUse a stand, plus a separate keyboard and mouse. The screen goes up. Your hands stay comfy.\n\n[[Next question->X12]]", "X12": "<div class=\"scene\">👀 ⏱️</div>\n\n**Question 12 of 12.** A friend asks you about the 20-20-20 rule.\n\n**What do you tell them?**\n\n* [[Every 20 seconds, look 20 inches away for 20 minutes->X12 W]]\n* [[After 20 hours of screens, rest for 20 minutes->X12 W]]\n* [[Sit 20 inches away at 20 percent brightness->X12 W]]\n* [[Every 20 minutes, look 20 feet away for 20 seconds->X12 R]]", "X12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Every **20 minutes**, look **20 feet** away for **20 seconds**.\"\n\n[[Got it->X12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Minutes, feet, seconds...\"\n\n[[Try again->X12]]]", "X12 R": "(set: $miss to 0)## ✅ Job done\n**Every 20 minutes, look 20 feet away for 20 seconds.** It gives the focus muscles in your eyes a break.\n\n[[See your results->Certificate]]", "Certificate": "# 🏅 Junior Technician: Unit 1 Complete\n\n<div class=\"scene\">🏅 🎉 🧰</div>\n\n*The Inspector pins a brass badge on you.* \"You did it! You know ports, cleaning, keyboards, mice, and comfy desks.\"\n\n**Your toolbox:** 🔦 Port Map · 🧽 Cleaning Kit · 🧹 Keycap Puller · 🖱️ Mouse Field Guide · 🪛 Service Kit · 🪑 Posture Pro Badge\n\n*Next up: Unit 2, Keep It Healthy.*\n\n[[Back to the work schedule->Shop]]"}};
(function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly and unlocks the days before it (for links from course modules)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),...Object.keys(STORY.passages).map(k=>(k.match(/^D(\d+) Start$/)||[])[1]).filter(Boolean)]));show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];show('D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
