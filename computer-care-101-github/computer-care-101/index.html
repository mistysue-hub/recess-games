<style>

<script>
const STORY={"start": "Start", "startup": ["Init"], "header": ["Shift Bar"], "passages": {"Init": "(set: $days to (a:))(set: $miss to 0)", "Shift Bar": "<div class=\"casebar\">🛠️ Workdays done: (print: $days's length) / 7 · [[Work schedule->Shop]] · [[Toolbox->Toolbox]]</div>", "Start": "# Keycap & Co.\n## Computer Care 101 · Unit 1: Know Your Gear\n\n*A bell jingles as you push open the door of* **Keycap & Co. Repair Bench.** *There are shelves of keyboards. There's a jar of spare keys and a mug full of screwdrivers. Behind the counter, a woman in an apron looks up over her glasses. Everyone in town calls her* **The Inspector.**\n\n\"So you're the new trainee. Good. Here's how this works. We have seven workdays. Each day, I teach you one thing. Then customers come in, and you use it. Each day you finish earns a tool for your toolbox.\"\n\n\"Get a job wrong twice, and I'll step in and show you. Everybody messes up a few times while they learn.\"\n\n<div class=\"warn\">**Shop rule:** In real life, ask a grown-up first before you use liquids, open up a computer, or touch someone else's computer. A red box like this one is your reminder.</div>\n\n[[Clock in->Shop]]", "Shop": "# 📋 Work Schedule\n*Unit 1: Know Your Gear.* Finish a day to open the next one.\n\n(if: $days contains \"1\")[✅ ](else:)[📋 ][[Day 1: Know Your Machine->D1 Start]]\n(if: $days's length >= 1)[(if: $days contains \"2\")[✅ ](else:)[📋 ][[Day 2: Your Cleaning Kit->D2 Start]]](else:)[🔒 Day 2: Your Cleaning Kit]\n(if: $days's length >= 2)[(if: $days contains \"3\")[✅ ](else:)[📋 ][[Day 3: Meet the Keyboards->D3 Start]]](else:)[🔒 Day 3: Meet the Keyboards]\n(if: $days's length >= 3)[(if: $days contains \"4\")[✅ ](else:)[📋 ][[Day 4: Keyboard Cleaning Day->D4 Start]]](else:)[🔒 Day 4: Keyboard Cleaning Day]\n(if: $days's length >= 4)[(if: $days contains \"5\")[✅ ](else:)[📋 ][[Day 5: Meet the Mice->D5 Start]]](else:)[🔒 Day 5: Meet the Mice]\n(if: $days's length >= 5)[(if: $days contains \"6\")[✅ ](else:)[📋 ][[Day 6: Mouse Service Day->D6 Start]]](else:)[🔒 Day 6: Mouse Service Day]\n(if: $days's length >= 6)[(if: $days contains \"7\")[✅ ](else:)[📋 ][[Day 7: Comfort Check->D7 Start]]](else:)[🔒 Day 7: Comfort Check]\n\n---\n(if: $days's length >= 7)[🎓 [[The Inspector's Unit 1 Exam->Exam Start]]](else:)[🔒 The Inspector's Unit 1 Exam: *finish all 7 days to unlock*]", "Toolbox": "# 🧰 Your Toolbox\nEach day you finish earns a tool.\n\n(if: $days contains \"1\")[🔦 **Port Map**: Day 1, Know Your Machine](else:)[▫️ *Earned on Day 1*]\n(if: $days contains \"2\")[🧽 **Cleaning Kit**: Day 2, Your Cleaning Kit](else:)[▫️ *Earned on Day 2*]\n(if: $days contains \"3\")[⌨️ **Keyboard ID Card**: Day 3, Meet the Keyboards](else:)[▫️ *Earned on Day 3*]\n(if: $days contains \"4\")[🧹 **Keycap Puller**: Day 4, Keyboard Cleaning Day](else:)[▫️ *Earned on Day 4*]\n(if: $days contains \"5\")[🖱️ **Mouse Field Guide**: Day 5, Meet the Mice](else:)[▫️ *Earned on Day 5*]\n(if: $days contains \"6\")[🪛 **Service Kit**: Day 6, Mouse Service Day](else:)[▫️ *Earned on Day 6*]\n(if: $days contains \"7\")[🪑 **Posture Pro Badge**: Day 7, Comfort Check](else:)[▫️ *Earned on Day 7*]\n\n[[Back to the work schedule->Shop]]", "D1 Start": "(set: $miss to 0)# Day 1: Know Your Machine\n\n*The Inspector taps four machines lined up on the bench.*\n\n\"You can't fix what you can't name. So here is lesson one. Four kinds of computers come through that door.\"\n\n* **Laptop:** It folds shut. The screen, keys, trackpad, and battery are all in one case.\n* **Desktop:** The computer lives in its own box. That box is called the **tower**. The monitor (the screen), keyboard, and mouse all plug into it. On a desktop, the monitor is *just a screen*.\n* **All-in-one:** The whole computer is built into the back of the monitor. The keyboard and mouse are separate.\n* **Chromebook:** A laptop that runs Google's ChromeOS. Most apps run in the web browser. Most files are saved online.\n\n\"Now the golden rule of this shop. **Turn it off and unplug it before you clean anything.** Dirt is easier to see on a dark screen. Nothing can short out with a zap. And you can't type junk by mistake.\"\n\n\"The doors open soon. Let's see who's first.\"\n\n\n[[Open the shop->D1 J1]]", "D1 J1": "**Mr. Chen** sets a big screen on the counter. \"My computer is acting up,\" he says. You look for the computer part. There's no tower. But the back of the screen is thick. It has vents (little slots for air). A power cord goes right into it. His keyboard and mouse have no wires.\n\n**What kind of computer does Mr. Chen have?**\n\n* [[A desktop with no tower->D1 J1 W]]\n* [[A Chromebook->D1 J1 W]]\n* [[An all-in-one->D1 J1 R]]\n* [[A laptop with no keyboard->D1 J1 W]]", "D1 J1 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The vents and power cord are on the back of the screen. So the whole computer is inside the monitor. That's an **all-in-one**.\"\n\n[[Got it->D1 J1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the back of that screen. Where are the computer parts hiding?\"\n\n[[Try again->D1 J1]]]", "D1 J1 R": "(set: $miss to 0)## ✅ Job done\nThe computer lives inside the back of the monitor. That's why it has vents and its own power cord. All-in-ones save desk space. But they are harder to fix or upgrade. Everything is packed in tight.\n\n[[Next customer->D1 J2]]", "D1 J2": "**Mr. Ruiz** hurries in with a monitor. \"My computer won't turn on, so I brought it in!\" You ask about his desk at home. He says a big box sits under it. The box has a power button and blinking lights. The monitor's cable plugs into that box.\n\n**What should Mr. Ruiz have brought in?**\n\n* [[Nothing else, the monitor is it->D1 J2 W]]\n* [[The keyboard, the computer is in it->D1 J2 W]]\n* [[The power strip, it runs the computer->D1 J2 W]]\n* [[The tower, that box is the computer->D1 J2 R]]", "D1 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"On a desktop, the **tower** is the computer. The monitor is just a screen. He needs to bring in that box under his desk.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Remember what I said about desktops. Which part is *just a screen*?\"\n\n[[Try again->D1 J2]]]", "D1 J2 R": "(set: $miss to 0)## ✅ Job done\nOn a desktop, **the tower is the computer**. The monitor only shows what the tower sends it. (Tip for Mr. Ruiz: check the tower first. Is its power cord plugged in? Is the switch on its back turned on?)\n\n[[Next customer->D1 J3]]", "D1 J3": "**Oscar** is wiping his laptop screen at the counter. The laptop is on and plugged in. He is using a wet paper towel.\n\n**What should Oscar do first?**\n\n* [[Turn up the brightness to see smudges->D1 J3 W]]\n* [[Wipe fast so the water can't soak in->D1 J3 W]]\n* [[Add window cleaner to the towel->D1 J3 W]]\n* [[Turn it off and unplug the charger->D1 J3 R]]", "D1 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Golden rule: **turn it off and unplug it first.** Then we'll talk about that paper towel.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Remember the golden rule of this shop.\"\n\n[[Try again->D1 J3]]]", "D1 J3 R": "(set: $miss to 0)## ✅ Job done\nTurn it off and unplug it first, every time. Smudges are *easier* to see on a dark screen. Tomorrow you'll learn why paper towels should stay far away from screens.\n\n[[The Inspector has something to show you->D1 L4]]", "D1 L4": "## 📘 The Inspector's lesson: The Port Tour\n\n*Between customers, The Inspector turns a laptop on its side. She points along its edge.*\n\n\"Ports are the holes where plugs go. They are how everything connects. Learn their shapes. Then you'll never jam a plug in the wrong hole.\"\n\n<div class=\"ports\"><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"8\" y=\"10\" width=\"44\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"12\" y=\"14\" width=\"36\" height=\"6\" fill=\"#ffb347\"/></svg><figcaption><b>USB-A</b>flat rectangle, one way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"12\" y=\"13\" width=\"36\" height=\"14\" rx=\"7\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"19\" y=\"18\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#ffb347\"/></svg><figcaption><b>USB-C</b>small oval, either way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V22 L46 28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"14\" y=\"16\" width=\"32\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>HDMI</b>two slanted corners</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"16\" y=\"16\" width=\"30\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>DisplayPort</b>one slanted corner</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M16 7 H44 V29 H36 V34 H24 V29 H16 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><g stroke=\"#ffb347\" stroke-width=\"2\"><line x1=\"21\" y1=\"11\" x2=\"21\" y2=\"16\"/><line x1=\"26\" y1=\"11\" x2=\"26\" y2=\"16\"/><line x1=\"31\" y1=\"11\" x2=\"31\" y2=\"16\"/><line x1=\"36\" y1=\"11\" x2=\"36\" y2=\"16\"/><line x1=\"40\" y1=\"11\" x2=\"40\" y2=\"16\"/></g></svg><figcaption><b>Ethernet</b>square, cable has a clip</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"5\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2\" fill=\"#1b1f24\"/></svg><figcaption><b>Headphone jack</b>tiny round hole, no pin</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"6\" y=\"17\" width=\"48\" height=\"6\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/></svg><figcaption><b>SD card slot</b>long thin slot</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"12\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2.5\" fill=\"#ffb347\"/></svg><figcaption><b>Barrel charger</b>big round hole with a pin</figcaption></figure></div>\n\n* **USB-A:** A flat rectangle. It **only fits one way up**. If a plug won't go in, flip it. Don't force it. Mice, keyboards, flash drives (small memory sticks), and wireless dongles (tiny plugs for wireless gear) use it.\n* **USB-C:** A small, rounded oval. It **fits either way up**. It can charge and move files. On many laptops, it can send video too. Lots of new laptops have *only* USB-C. So older USB-A gear needs an **adapter** or a **hub**. An adapter changes one plug shape to another. A hub gives you more ports.\n* **HDMI:** Wide and flat, with **two slanted corners**. It sends picture and sound to a TV or monitor.\n* **DisplayPort:** Like HDMI, but with **only one slanted corner**. It is mostly used for computer monitors.\n* **Ethernet:** A squarish port. Its cable has a clear plastic plug with a little clip. It gives you **wired internet** (internet through a cable). It is steadier than Wi-Fi. Why? It does not share the air with every other device in the house.\n* **Headphone jack:** A small round hole. It is for wired headphones and some mics.\n* **SD card slot:** A long, thin slot. It holds the memory cards from cameras.\n* **Barrel charging port:** A round hole with a pin in the middle. Some laptop chargers use it. Other laptops charge through USB-C.\n\n\"Port care rule: **plugs go in straight and gently.** If it doesn't fit, don't push harder. Check the shape. Forcing a plug is how ports get bent and broken.\"\n\n\n[[Got it. Send in the next customer->D1 J5]]", "D1 J5": "**Tasha** wants to watch a movie on her TV. She'll use her laptop. She holds up a cable. Its plug is wide and flat. It has two slanted corners on the bottom.\n\n**Which port on her laptop does that cable plug into?**\n\n* [[HDMI: wide and flat, for screens->D1 J5 R]]\n* [[USB-C: small oval, fits either way->D1 J5 W]]\n* [[Headphone jack: small and round->D1 J5 W]]\n* [[Ethernet: square, with a clip->D1 J5 W]]", "D1 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's an **HDMI** cable. HDMI carries picture and sound to TVs and monitors. Its plug has those two slanted corners.\"\n\n[[Got it->D1 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two slanted corners. Check the port tour.\"\n\n[[Try again->D1 J5]]]", "D1 J5 R": "(set: $miss to 0)## ✅ Job done\n**HDMI** sends picture and sound to a TV or monitor. Many newer laptops can also send video through **USB-C**. But a wide plug with slanted corners is HDMI every time.\n\n[[Next customer->D1 J6]]", "D1 J6": "**Marcus** is pushing a flash drive into his laptop. The port is a flat rectangle. The drive won't go in. So he presses harder... and harder.\n\n**What should Marcus do?**\n\n* [[Push harder, some ports are tight->D1 J6 W]]\n* [[Wiggle it side to side until it fits->D1 J6 W]]\n* [[Stop, flip it, and try again gently->D1 J6 R]]\n* [[Tap it in with the back of a pencil->D1 J6 W]]", "D1 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **USB-A**. It only fits **one way up**. Flip it and try again, gently. Forcing it bends the metal inside.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Flat rectangle... how many ways up does that port fit?\"\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**USB-A fits only one way up.** If it won't go in, flip it. Pushing, wiggling, or tapping can bend the thin metal tab inside the port. Then *nothing* fits.\n\n[[Next customer->D1 J7]]", "D1 J7": "**Jayden** got a new laptop. It only has small oval ports on its sides. His favorite gaming mouse has a flat, rectangle plug.\n\n**What does Jayden need?**\n\n* [[Tape to hold the plug on the port->D1 J7 W]]\n* [[A USB-C to USB-A adapter or hub->D1 J7 R]]\n* [[An HDMI cable for the mouse->D1 J7 W]]\n* [[Nothing, just push the plug harder->D1 J7 W]]", "D1 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"His laptop has **USB-C**. His mouse uses **USB-A**. A small **adapter or hub** joins the two.\"\n\n[[Got it->D1 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Small oval ports, and a flat rectangle plug. What did I say about new laptops and older gear?\"\n\n[[Try again->D1 J7]]]", "D1 J7 R": "(set: $miss to 0)## ✅ Job done\nHis laptop has **USB-C** ports. His mouse has a **USB-A** plug. A cheap **adapter** joins them. So does a **hub** with several ports. Never force a plug into a port that's the wrong shape.\n\n[[Next customer->D1 J8]]", "D1 J8": "**Nora's** online lessons keep freezing. It happens when her brother games on the Wi-Fi. Her desk is right next to the router (the box that brings in the internet). Her laptop has a squarish port on the side.\n\n**What could help?**\n\n* [[An Ethernet cable from the router->D1 J8 R]]\n* [[A long HDMI cable from the router->D1 J8 W]]\n* [[Headphones plugged into the round jack->D1 J8 W]]\n* [[An SD card in the long, thin slot->D1 J8 W]]", "D1 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"An **Ethernet** cable from the router. A wired connection doesn't share the Wi-Fi with her brother's game.\"\n\n[[Got it->D1 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which port is for wired internet?\"\n\n[[Try again->D1 J8]]]", "D1 J8 R": "(set: $miss to 0)## ✅ Job done\n**Ethernet** gives her a wired connection. Then she isn't fighting her brother for the Wi-Fi. (No Ethernet port on the laptop? A **USB-to-Ethernet adapter** works too.)\n\n[[The Inspector has something to show you->D1 L9]]", "D1 L9": "## 📘 The Inspector's lesson: Vents and Power\n\n*The Inspector flips a laptop upside down.* \"One more thing before the busy afternoon.\"\n\n* **Vents** are slots or little grilles (rows of holes). They are usually on the bottom, sides, or back. Inside, **fans** pull cool air in. They push hot air out.\n* A bed, pillow, or blanket can block the vents. So can your lap. Then heat builds up. The computer slows down. Then it **shuts itself off to keep its parts safe**.\n* **Power supply:** This part brings power in. A laptop has a **charger brick** on its cord. A desktop has a power box inside the tower. It often has its own fan and vent on the back.\n* **Battery:** Laptops have one inside. Desktops don't. So a desktop turns off right away if it gets unplugged.\n\n\n[[Got it. Send in the next customer->D1 J10]]", "D1 J10": "**Ms. Rivera's** laptop shuts off each time she uses it on her bed. You flip it over. There are slots along the bottom and one side.\n\n**What are those slots for?**\n\n* [[Speakers, to make music louder->D1 J10 W]]\n* [[Vents to let air in and out->D1 J10 R]]\n* [[Extra ports for old cables->D1 J10 W]]\n* [[Gaps to make the laptop lighter->D1 J10 W]]", "D1 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **vents**. A blanket or bed blocks them. The laptop gets too hot. So it shuts itself off to stay safe.\"\n\n[[Got it->D1 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Remember what I just showed you on the bottom of that laptop.\"\n\n[[Try again->D1 J10]]]", "D1 J10 R": "(set: $miss to 0)(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]## ✅ Job done\nThose slots are **vents**. Her bed blocks them, and heat builds up. So the laptop shuts off to protect its parts. A hard surface or a lap desk fixes it. You'll learn lots more about air flow in Unit 2.\n\n[[Close up shop->D1 Done]]", "D1 Done": "(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]# Day 1 complete!\n\n<div class=\"tool\">🔦 **New tool earned: Port Map**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Find every **port** and **vent** on your own computer. Use the port tour to name each port. Draw a quick map or take photos. Which vents are on the bottom? A soft surface could block those.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 2->D2 Start]]", "D2 Start": "(set: $miss to 0)# Day 2: Your Cleaning Kit\n\n*The Inspector dumps a bin of stuff on the counter. Some of it is great. Some of it is trouble.*\n\n\"Lots of the damage I see comes from people *trying to clean*. They grab what's under the kitchen sink. Today you build a real kit. You also learn what stays out of it.\"\n\n\"Two rules come first. **Golden rule:** turn it off and unplug it first. **Liquid rule:** liquid goes on the cloth. Never spray or pour it on the device.\"\n\n\n[[Open the shop->D2 L1]]", "D2 L1": "## 📘 The Inspector's lesson: The Good Stuff\n\n*The Inspector sets out six things in a neat row.*\n\n* **Microfiber cloth:** a soft cloth that leaves no fuzz. It traps dust. It does not just push it around. Wash it now and then. But **skip the fabric softener**. Softener clogs the tiny threads, so they stop grabbing dust.\n* **Soft brush:** a clean paintbrush or makeup brush. It sweeps dust out of gaps.\n* **Cotton swabs:** for corners, edges, and around keys.\n* **Compressed air:** a can that blows air. It gets dust out of tight spots. **Hold it upright. Use short puffs. Never shake it.** If you tip it over, it sprays icy liquid, not air.\n* **70% isopropyl alcohol:** a rubbing alcohol. It kills germs and dries fast. A grown-up holds the bottle. Keep it away from flames.\n* **Distilled water:** water with the minerals taken out. It dries with no white spots. Tap water leaves spots.\n\n\"Damp means *barely* damp. Can you squeeze a drop out of the cloth? Then it's too wet.\"\n\n\n[[Got it. Send in the next customer->D2 L2]]", "D2 L2": "## 📘 The Inspector's lesson: The Trouble Bin\n\n*She slides a second pile to the side.* \"And here's what stays out.\"\n\n* **Paper towels and tissues:** made from wood. They can leave tiny scratches. They also drop fuzz.\n* **Window cleaner** (the blue spray): many have a strong chemical called **ammonia**. It can strip the coating off screens.\n* **Bleach and harsh cleaners:** they make plastic change color. They rub the letters off keys.\n* **Scrubby sponges and scratchy pads:** they scratch screens and shiny cases.\n* **Home vacuum cleaners:** they suck hard. They can rip off keycaps and small parts. The nozzle can also build up **static** (the zap you feel after rubbing socks on carpet). Static can zap electronics.\n\n\"Now sort that bin for me. Safe, or keep it away?\"\n\n\n[[Got it. Send in the next customer->D2 S1]]", "D2 S1": "## Sorting the bin: item 1 of 8\n\n*The Inspector holds up:*\n\n### Microfiber cloth\n\n* [[✅ Safe for the kit->D2 S1 R]]\n* [[⛔ Keep it away->D2 S1 W]]", "D2 S1 R": "## ✅ Right: it belongs in the kit\n**Microfiber cloth.** Soft, no fuzz, and it traps dust. It's the most-used tool in the kit.\n\n[[Next item->D2 S2]]", "D2 S1 W": "## ❌ Not this time: it belongs in the kit\n**Microfiber cloth.** Soft, no fuzz, and it traps dust. It's the most-used tool in the kit.\n\n[[Next item->D2 S2]]", "D2 S2": "## Sorting the bin: item 2 of 8\n\n*The Inspector holds up:*\n\n### Paper towels\n\n* [[✅ Safe for the kit->D2 S2 W]]\n* [[⛔ Keep it away->D2 S2 R]]", "D2 S2 R": "## ✅ Right: it stays out of the kit\n**Paper towels.** They are made from wood. They can scratch screens. They drop fuzz in keyboards.\n\n[[Next item->D2 S3]]", "D2 S2 W": "## ❌ Not this time: it stays out of the kit\n**Paper towels.** They are made from wood. They can scratch screens. They drop fuzz in keyboards.\n\n[[Next item->D2 S3]]", "D2 S3": "## Sorting the bin: item 3 of 8\n\n*The Inspector holds up:*\n\n### Window cleaner (the blue spray)\n\n* [[✅ Safe for the kit->D2 S3 W]]\n* [[⛔ Keep it away->D2 S3 R]]", "D2 S3 R": "## ✅ Right: it stays out of the kit\n**Window cleaner (the blue spray).** Many have **ammonia**. It can hurt the coating on screens.\n\n[[Next item->D2 S4]]", "D2 S3 W": "## ❌ Not this time: it stays out of the kit\n**Window cleaner (the blue spray).** Many have **ammonia**. It can hurt the coating on screens.\n\n[[Next item->D2 S4]]", "D2 S4": "## Sorting the bin: item 4 of 8\n\n*The Inspector holds up:*\n\n### 70% isopropyl alcohol\n\n* [[✅ Safe for the kit->D2 S4 R]]\n* [[⛔ Keep it away->D2 S4 W]]", "D2 S4 R": "## ✅ Right: it belongs in the kit\n**70% isopropyl alcohol.** Great for killing germs on keycaps and mice. It dries fast. Put it on a cloth or swab. Let a grown-up hold the bottle.\n\n[[Next item->D2 S5]]", "D2 S4 W": "## ❌ Not this time: it belongs in the kit\n**70% isopropyl alcohol.** Great for killing germs on keycaps and mice. It dries fast. Put it on a cloth or swab. Let a grown-up hold the bottle.\n\n[[Next item->D2 S5]]", "D2 S5": "## Sorting the bin: item 5 of 8\n\n*The Inspector holds up:*\n\n### Household vacuum cleaner\n\n* [[✅ Safe for the kit->D2 S5 W]]\n* [[⛔ Keep it away->D2 S5 R]]", "D2 S5 R": "## ✅ Right: it stays out of the kit\n**Household vacuum cleaner.** It sucks hard. It can pull off keycaps and small parts. The nozzle can build up static.\n\n[[Next item->D2 S6]]", "D2 S5 W": "## ❌ Not this time: it stays out of the kit\n**Household vacuum cleaner.** It sucks hard. It can pull off keycaps and small parts. The nozzle can build up static.\n\n[[Next item->D2 S6]]", "D2 S6": "## Sorting the bin: item 6 of 8\n\n*The Inspector holds up:*\n\n### Compressed air can\n\n* [[✅ Safe for the kit->D2 S6 R]]\n* [[⛔ Keep it away->D2 S6 W]]", "D2 S6 R": "## ✅ Right: it belongs in the kit\n**Compressed air can.** It blasts dust out of tight gaps. Hold it **upright**. Use short puffs.\n\n[[Next item->D2 S7]]", "D2 S6 W": "## ❌ Not this time: it belongs in the kit\n**Compressed air can.** It blasts dust out of tight gaps. Hold it **upright**. Use short puffs.\n\n[[Next item->D2 S7]]", "D2 S7": "## Sorting the bin: item 7 of 8\n\n*The Inspector holds up:*\n\n### Distilled water\n\n* [[✅ Safe for the kit->D2 S7 R]]\n* [[⛔ Keep it away->D2 S7 W]]", "D2 S7 R": "## ✅ Right: it belongs in the kit\n**Distilled water.** No minerals, so no white spots. A barely damp cloth is all you need.\n\n[[Next item->D2 S8]]", "D2 S7 W": "## ❌ Not this time: it belongs in the kit\n**Distilled water.** No minerals, so no white spots. A barely damp cloth is all you need.\n\n[[Next item->D2 S8]]", "D2 S8": "## Sorting the bin: item 8 of 8\n\n*The Inspector holds up:*\n\n### Bleach wipes\n\n* [[✅ Safe for the kit->D2 S8 W]]\n* [[⛔ Keep it away->D2 S8 R]]", "D2 S8 R": "## ✅ Right: it stays out of the kit\n**Bleach wipes.** Bleach is too harsh. It can make plastic change color. It rubs the letters off keys.\n\n[[Next customer->D2 J4]]", "D2 S8 W": "## ❌ Not this time: it stays out of the kit\n**Bleach wipes.** Bleach is too harsh. It can make plastic change color. It rubs the letters off keys.\n\n[[Next customer->D2 J4]]", "D2 J4": "**Ms. Abara** wants to kill germs on her laptop keys. Her family just had colds. She aims a spray bottle of alcohol right at the keys.\n\n**What's the right way to use it?**\n\n* [[Spray a light mist on all the keys->D2 J4 W]]\n* [[Pour a little into the key gaps->D2 J4 W]]\n* [[Wet a cloth first, then wipe->D2 J4 R]]\n* [[Spray it, then close the lid->D2 J4 W]]", "D2 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Liquid goes on the cloth, never on the device.** Spray drips down between the keys. It gets into the parts underneath.\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What was my rule about liquids?\"\n\n[[Try again->D2 J4]]]", "D2 J4 R": "(set: $miss to 0)## ✅ Job done\nWet the cloth, then wipe. Spray drips between the keys. It reaches the parts underneath. Make sure the laptop is off first, too.\n\n[[Next customer->D2 J5]]", "D2 J5": "**Leo** is blasting dust out of his keyboard. He holds the can of air upside down to reach better. A frosty white spray shoots out.\n\n**What went wrong?**\n\n* [[Tipping the can sprays icy liquid->D2 J5 R]]\n* [[The can is empty and spraying dust->D2 J5 W]]\n* [[Dust turns white when it is blasted->D2 J5 W]]\n* [[He forgot to shake the can hard->D2 J5 W]]", "D2 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Upright, short puffs.** Tip the can and it sprays icy liquid, not air. That liquid is freezing cold. It can hurt parts.\"\n\n[[Got it->D2 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How did I say to hold the can?\"\n\n[[Try again->D2 J5]]]", "D2 J5 R": "(set: $miss to 0)## ✅ Job done\nKeep the can **upright**. Tipped over, it sprays freezing liquid, not air. And never shake it.\n\n[[Next customer->D2 J6]]", "D2 J6": "**Kai** cleaned his screen with a cloth dipped in tap water. Now it's dry. But it's covered in faint white spots.\n\n**What should he use next time?**\n\n* [[Hot tap water, so it dries fast->D2 J6 W]]\n* [[Window cleaner, to get the spots->D2 J6 W]]\n* [[Fizzy water, so bubbles lift dirt->D2 J6 W]]\n* [[Distilled water on microfiber->D2 J6 R]]", "D2 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Tap water has **minerals** in it. They dried into those spots. **Distilled water** has the minerals taken out.\"\n\n[[Got it->D2 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What leaves white spots? Which water doesn't have it?\"\n\n[[Try again->D2 J6]]]", "D2 J6 R": "(set: $miss to 0)## ✅ Job done\nUse **distilled water** on a barely damp microfiber cloth. The white spots are minerals. Tap water leaves them when it dries.\n\n[[Next customer->D2 J7]]", "D2 J7": "**Mia** found a sticky spot on her laptop lid. She's about to scrub it with the green, scratchy side of a kitchen sponge.\n\n**What should she use instead?**\n\n* [[A soft cloth with some alcohol->D2 J7 R]]\n* [[The soft side of the wet sponge->D2 J7 W]]\n* [[A paper towel with dish soap->D2 J7 W]]\n* [[Steel wool, rubbed very gently->D2 J7 W]]", "D2 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Scrubby pads **scratch**. A microfiber cloth with a little alcohol melts the sticky stuff. And it won't scratch.\"\n\n[[Got it->D2 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I put in the trouble bin about scrubby things?\"\n\n[[Try again->D2 J7]]]", "D2 J7 R": "(set: $miss to 0)## ✅ Job done\n**A microfiber cloth with a little alcohol.** Alcohol loosens the sticky stuff. The soft cloth won't scratch. Scratchy pads leave marks that stay.\n\n[[Next customer->D2 J8]]", "D2 J8": "**Mr. Grant** has dusty vents on the back of his desktop computer. He's about to clean them with the family vacuum.\n\n**What should he use instead?**\n\n* [[A wet cloth pushed into the vents->D2 J8 W]]\n* [[Compressed air and a soft brush->D2 J8 R]]\n* [[The vacuum on its top setting->D2 J8 W]]\n* [[A hair dryer on the hot setting->D2 J8 W]]", "D2 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Vacuums can build up **static**. They can pull off small parts. **Compressed air and a soft brush** do the job safely.\"\n\n[[Got it->D2 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Why did the vacuum land in the trouble bin?\"\n\n[[Try again->D2 J8]]]", "D2 J8 R": "(set: $miss to 0)## ✅ Job done\nUse **compressed air and a soft brush**. Turn the computer off and unplug it first. Home vacuums can zap electronics with static. Unit 2 has lots more about vents.\n\n[[Next customer->D2 J9]]", "D2 J9": "**Ms. Doyle** dunks her microfiber cloth in distilled water. She lifts it out, dripping. She's ready to wipe her laptop screen.\n\n**What should she do first?**\n\n* [[Wipe fast before the water drips->D2 J9 W]]\n* [[Add some window cleaner to it->D2 J9 W]]\n* [[Wring it out until barely damp->D2 J9 R]]\n* [[Hold the laptop upside down->D2 J9 W]]", "D2 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Barely damp.** If you can squeeze out a drop, it's too wet. Drips can run into the edges of the screen.\"\n\n[[Got it->D2 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How damp is *damp*?\"\n\n[[Try again->D2 J9]]]", "D2 J9 R": "(set: $miss to 0)## ✅ Job done\n**Wring it out until it's barely damp.** Drips can run down behind the edge of the screen. If you can squeeze out a drop, it's too wet.\n\n[[Next customer->D2 J10]]", "D2 J10": "**Theo's** microfiber cloth used to grab dust well. Then his dad washed it with fabric softener. Now it just smears things around.\n\n**What happened?**\n\n* [[This cloth only works one time->D2 J10 W]]\n* [[The cloth shrank in the wash->D2 J10 W]]\n* [[Softener made it too clean to work->D2 J10 W]]\n* [[Softener clogged the tiny threads->D2 J10 R]]", "D2 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Fabric softener** coats the tiny threads. Then they can't grab dust. Wash microfiber without it.\"\n\n[[Got it->D2 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say to skip when washing microfiber?\"\n\n[[Try again->D2 J10]]]", "D2 J10 R": "(set: $miss to 0)(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]## ✅ Job done\n**Fabric softener clogs the threads.** Wash the cloth again with plain soap and no softener. It may work again. Don't use dryer sheets either.\n\n[[Close up shop->D2 Done]]", "D2 Done": "(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]# Day 2 complete!\n\n<div class=\"tool\">🧽 **New tool earned: Cleaning Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Build your own cleaning kit from things at home. Do it with a grown-up. Find a microfiber cloth (glasses cloths count), a soft brush, and cotton swabs. Put away anything from the trouble bin.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 3->D3 Start]]", "D3 Start": "(set: $miss to 0)# Day 3: Meet the Keyboards\n\n*The Inspector lines up keyboards like a museum display.*\n\n\"Each kind of keyboard needs its own care. Pull a key off the wrong kind, and it breaks. So step one, every time, is this: **what type is it?**\"\n\n\n[[Open the shop->D3 L1]]", "D3 L1": "## 📘 The Inspector's lesson: What's Under the Keys\n\n\"There are five kinds of keyboards. You can tell them apart by how they **feel**, how they **sound**, and what's **under** the keys.\"\n\n* **Membrane:** a rubber **dome** sits under each key. Keys feel soft and squishy. Most cheap desktop keyboards are this kind.\n* **Scissor-switch:** thin keys sit on tiny plastic clips shaped like an **X**. A press is short and crisp. Most laptops have these.\n* **Mechanical:** each key has its own **switch** under it. The keycaps pop off with a puller. Switches come in three kinds:\n* **Linear:** smooth all the way down. Quiet.\n* **Tactile:** a little bump you can feel. Fairly quiet.\n* **Clicky:** a bump *and* a loud click.\n* **Butterfly:** super flat keys that barely move. Some older laptops have them, like many MacBooks from 2015 to 2019. One crumb can jam them!\n* **Ergonomic or split:** comfy keyboards. They are curved, tilted, or split in two. This keeps your wrists straighter.\n\n\n[[Got it. Send in the next customer->D3 J2]]", "D3 J2": "**Mila** hands you a keyboard. She presses a key so you can hear it. *CLICK.* You feel a little bump, then a sharp click. You pop off the cap with a puller. A bright switch sits under it.\n\n**What type is it?**\n\n* [[Membrane with a rubber dome->D3 J2 W]]\n* [[Scissor-switch, like a laptop->D3 J2 W]]\n* [[Butterfly, like old MacBooks->D3 J2 W]]\n* [[Clicky mechanical switches->D3 J2 R]]", "D3 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Its own switch under every key means **mechanical**. A bump plus a click means **clicky** switches.\"\n\n[[Got it->D3 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A switch under the cap. And a click you can hear.\"\n\n[[Try again->D3 J2]]]", "D3 J2 R": "(set: $miss to 0)## ✅ Job done\n**Mechanical, with clicky switches.** The switch under every key is the big clue.\n\n[[Next customer->D3 J3]]", "D3 J3": "**Mr. Okoye** brings in a cheap office keyboard. The keys feel soft and squishy. No click. A key is stuck, so you lift it up. You find a little rubber bump under it.\n\n**What type is it?**\n\n* [[Membrane->D3 J3 R]]\n* [[Mechanical->D3 J3 W]]\n* [[Butterfly->D3 J3 W]]\n* [[Ergonomic split->D3 J3 W]]", "D3 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That rubber bump is a **dome**. So this is a **membrane** keyboard.\"\n\n[[Got it->D3 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Soft and squishy, with a rubber bump. What's that bump called?\"\n\n[[Try again->D3 J3]]]", "D3 J3 R": "(set: $miss to 0)## ✅ Job done\n**Membrane.** A key press squashes the rubber dome. The dome pushes two thin layers together. That's how the key press gets sent.\n\n[[Next customer->D3 J4]]", "D3 J4": "**Ben's** laptop keys are thin. A press is short and crisp. Through the gap under one key, you see a tiny white plastic X.\n\n**What type is it?**\n\n* [[Mechanical->D3 J4 W]]\n* [[Scissor-switch->D3 J4 R]]\n* [[Membrane with a rubber dome->D3 J4 W]]\n* [[Ergonomic split->D3 J4 W]]", "D3 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That X is the **scissor** clip. Most laptops have scissor-switch keyboards.\"\n\n[[Got it->D3 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A tiny plastic X under a thin laptop key...\"\n\n[[Try again->D3 J4]]]", "D3 J4 R": "(set: $miss to 0)## ✅ Job done\n**Scissor-switch.** That little X clip keeps the key flat. It also breaks easily. That's why we don't pop off laptop keys. More on that tomorrow.\n\n[[Next customer->D3 J5]]", "D3 J5": "**Mr. Hale** has an older MacBook. Its keys are super flat and barely move. One crumb fell in, and a key quit working.\n\n**What type is it most likely?**\n\n* [[Mechanical->D3 J5 W]]\n* [[Membrane->D3 J5 W]]\n* [[Ergonomic split->D3 J5 W]]\n* [[Butterfly->D3 J5 R]]", "D3 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **butterfly** keyboard. They are famous for jamming from tiny bits of dirt.\"\n\n[[Got it->D3 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Super flat, barely moves, older MacBook, jammed by one crumb...\"\n\n[[Try again->D3 J5]]]", "D3 J5 R": "(set: $miss to 0)## ✅ Job done\n**Butterfly.** Many MacBooks from 2015 to 2019 had these thin keyboards. They jammed so often that Apple set up a plan to fix them. If one breaks, a pro should fix it.\n\n[[Next customer->D3 J6]]", "D3 J6": "**Sofia** wants a mechanical keyboard. But she shares a room with her little sister. Her sister goes to bed early.\n\n**Which switch type should she skip?**\n\n* [[Linear switches->D3 J6 W]]\n* [[Tactile switches->D3 J6 W]]\n* [[Clicky switches->D3 J6 R]]\n* [[Low-profile linear switches->D3 J6 W]]", "D3 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Clicky** switches are made to click loudly. Linear or tactile would be kinder to a sleeping sister.\"\n\n[[Got it->D3 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which switch makes a sound on purpose?\"\n\n[[Try again->D3 J6]]]", "D3 J6 R": "(set: $miss to 0)## ✅ Job done\nSkip **clicky** switches. They click on every press. **Linear** (smooth) or **tactile** (a quiet bump) are much quieter.\n\n[[The Inspector has something to show you->D3 L7]]", "D3 L7": "## 📘 The Inspector's lesson: Sizes and Connections\n\n*The Inspector lines up three keyboards, from longest to shortest.*\n\n* **Full-size:** has everything. That includes the **number pad** on the right.\n* **TKL** (*tenkeyless*): no number pad. That leaves more room for the mouse.\n* **60%:** no number pad. **Also** no arrow keys and no top row of F keys. It's tiny and easy to carry.\n\n\"Next is **how it connects**:\"\n\n* **Wired:** it has a cable. No batteries. No pairing.\n* **2.4 GHz wireless:** it comes with a tiny USB plug called a **dongle**. **The keyboard only talks to the computer its dongle is in.**\n* **Bluetooth:** no dongle. You **pair** it in the computer's Bluetooth settings. Pairing means linking them up. Most of the time, you hold a button on the keyboard until a light blinks.\n\n\n[[Got it. Send in the next customer->D3 J8]]", "D3 J8": "**Ava** shows you her gaming keyboard. It has letters, numbers, and arrow keys. But there's no number pad on the right. \"I wanted more room for my mouse,\" she says.\n\n**What size of keyboard is this?**\n\n* [[Full-size keyboard->D3 J8 W]]\n* [[60% keyboard->D3 J8 W]]\n* [[TKL (tenkeyless)->D3 J8 R]]\n* [[Split ergonomic->D3 J8 W]]", "D3 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No number pad, but it still has arrows and F keys. That's **TKL**.\"\n\n[[Got it->D3 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which size drops only the number pad?\"\n\n[[Try again->D3 J8]]]", "D3 J8 R": "(set: $miss to 0)## ✅ Job done\n**TKL, or tenkeyless.** It's a full keyboard minus the number pad. A 60% would also lose the arrow keys and the F key row.\n\n[[Next customer->D3 J9]]", "D3 J9": "**Grandpa Leo** has a new wireless keyboard. He moved his laptop to the other side of the house. Now the keyboard won't work. A tiny USB plug is still in his old desktop.\n\n**What's the likely problem?**\n\n* [[Bluetooth needs to be turned off->D3 J9 W]]\n* [[The dongle is in the old desktop->D3 J9 R]]\n* [[Wireless only works in one room->D3 J9 W]]\n* [[The charging cable came loose->D3 J9 W]]", "D3 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That tiny plug is the keyboard's **2.4 GHz dongle**. The keyboard only talks to the computer the dongle is in.\"\n\n[[Got it->D3 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What is that tiny USB plug for?\"\n\n[[Try again->D3 J9]]]", "D3 J9 R": "(set: $miss to 0)## ✅ Job done\nMove the **dongle** to the laptop. A 2.4 GHz keyboard only talks to the computer its dongle is in.\n\n[[Next customer->D3 J10]]", "D3 J10": "**Nadia's** Bluetooth keyboard works with her tablet. Now she wants to use it with her laptop. There's no dongle in the box.\n\n**How does she connect it?**\n\n* [[Plug its cable into the tablet->D3 J10 W]]\n* [[Buy a 2.4 GHz dongle for it->D3 J10 W]]\n* [[Pair it in Bluetooth settings->D3 J10 R]]\n* [[Hold it against the laptop->D3 J10 W]]", "D3 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Bluetooth keyboards **pair**. Hold the pairing button until the light blinks. Then pick the keyboard in the laptop's **Bluetooth settings**.\"\n\n[[Got it->D3 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Bluetooth keyboards don't use a dongle. What do you do instead?\"\n\n[[Try again->D3 J10]]]", "D3 J10 R": "(set: $miss to 0)## ✅ Job done\n**Pair it in Bluetooth settings.** Hold the keyboard's pairing button until its light blinks. Then pick it from the laptop's Bluetooth list.\n\n[[Next customer->D3 J11]]", "D3 J11": "**Mrs. Kowalski** types all day for work. On her normal keyboard, her wrists bend out to the sides. She wants something more comfy.\n\n**Which keyboard style is made for this?**\n\n* [[A 60% one, since it's smaller->D3 J11 W]]\n* [[An ergonomic split keyboard->D3 J11 R]]\n* [[A butterfly one, since it's flat->D3 J11 W]]\n* [[A clicky mechanical keyboard->D3 J11 W]]", "D3 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"An **ergonomic split** keyboard lets each hand sit straight in front of its own shoulder.\"\n\n[[Got it->D3 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which style is shaped to keep wrists straighter?\"\n\n[[Try again->D3 J11]]]", "D3 J11 R": "(set: $miss to 0)(if: $days does not contain \"3\")[(set: $days to it + (a: \"3\"))]## ✅ Job done\nAn **ergonomic split** keyboard. The two halves spread apart. Then her wrists stay straight and don't bend out. Day 7 has lots more on how to sit.\n\n[[Close up shop->D3 Done]]", "D3 Done": "(if: $days does not contain \"3\")[(set: $days to it + (a: \"3\"))]# Day 3 complete!\n\n<div class=\"tool\">⌨️ **New tool earned: Keyboard ID Card**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Look at your own keyboard. What type is it? What size? How does it connect? Tell someone how you know. Use clues like the feel, the sound, and any stickers on the bottom.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 4->D4 Start]]", "D4 Start": "(set: $miss to 0)# Day 4: Keyboard Cleaning Day\n\n*The Inspector holds up a keyboard and shakes it. Something crunches inside.*\n\n\"Yesterday you learned to tell keyboards apart. Today you learn why it matters. **Each type gets cleaned in its own way.** First the weekly clean. Then deep cleaning. Then what to do after a spill.\"\n\n\n[[Open the shop->D4 L1]]", "D4 L1": "## 📘 The Inspector's lesson: The Weekly Clean\n\n\"Every keyboard gets this, in this order:\"\n\n1. **Unplug it** (or shut down the laptop).\n2. **Flip it over and tap it gently.** Loose crumbs fall out.\n3. **Compressed air** between the keys. Hold the can upright. Use short puffs.\n4. **Wipe the keycaps** with a cloth. Make it barely damp with alcohol or distilled water.\n\n\"Loose stuff first. Then the stuck stuff. Then the top. If you wipe first, you just push crumbs deeper.\"\n\n\n[[Got it. Send in the next customer->D4 J2]]", "D4 J2": "**Job 1: the weekly clean, step by step.** A keyboard full of crumbs sits on the bench.\n\n**What's the very first step?**\n\n* [[Blast it with compressed air->D4 J2 W]]\n* [[Unplug it->D4 J2 R]]\n* [[Wipe the keycaps->D4 J2 W]]\n* [[Flip it over and tap it->D4 J2 W]]", "D4 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Unplug it first.** Always. If you don't, every wipe types something.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What always comes first in this shop?\"\n\n[[Try again->D4 J2]]]", "D4 J2 R": "(set: $miss to 0)## ✅ Job done\n**Unplug it.** If you don't, every wipe types junk into whatever window is open.\n\n[[Next customer->D4 J3]]", "D4 J3": "It's unplugged.\n\n**What's the next step?**\n\n* [[Wipe the keys with a damp cloth->D4 J3 W]]\n* [[Spray alcohol between the keys->D4 J3 W]]\n* [[Flip it over and tap it gently->D4 J3 R]]\n* [[Pull off every keycap->D4 J3 W]]", "D4 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Flip and tap.** Let gravity do the easy part first.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Get the loose stuff out first, the easy way.\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**Flip and tap.** Gravity pulls out loose crumbs for free.\n\n[[Next customer->D4 J4]]", "D4 J4": "*A small shower of crumbs and one dog hair land on the bench.* \"Grandpa Leo's, for sure,\" says The Inspector.\n\n**What's next?**\n\n* [[Air between the keys, then wipe->D4 J4 R]]\n* [[Wipe, then spray water between keys->D4 J4 W]]\n* [[Use the home vacuum on the gaps->D4 J4 W]]\n* [[Put it in the dishwasher on gentle->D4 J4 W]]", "D4 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Compressed air, then a barely damp wipe.** Never a vacuum. Never water in the gaps.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Air before wiping. And remember the trouble bin.\"\n\n[[Try again->D4 J4]]]", "D4 J4 R": "(set: $miss to 0)## ✅ Job done\n**Air, then wipe.** Done! That's the whole weekly clean.\n\n[[The Inspector has something to show you->D4 L5]]", "D4 L5": "## 📘 The Inspector's lesson: Deep Cleaning by Type\n\n\"Sometimes the weekly clean isn't enough. How you go deeper depends on the type:\"\n\n* **Mechanical:** the keycaps come off with a **keycap puller**. That's a little tool that grabs a keycap and lifts it. **Take a photo of the keys first.** Then you'll know where they go. Wash only the caps in warm, soapy water. Let them **dry all the way**, a full day, before they go back on. The keyboard itself never gets wet.\n* **Big keys** (space bar, Shift, Enter) have **stabilizers**. Those are metal bars and clips that keep long keys flat. Pull big keys **straight up, slowly and evenly**. Yank one end, and the bar pops out.\n* **Sticky mechanical switch:** take the cap off. Put a tiny bit of alcohol on a swab. Touch it to the switch. Press the switch a few times. Let it dry.\n* **Laptop keys stay on.** Their scissor clips snap easily. Clean *around* them with air and swabs.\n* **Membrane keyboards:** some caps pop off. But the rubber domes under them stay put. Never soak the keyboard.\n\n\n[[Got it. Send in the next customer->D4 J6]]", "D4 J6": "**Ben** brings in his laptop. \"A crumb is stuck under my H key. Can I pop it off with a butter knife? My friend does that with his gaming keyboard.\"\n\n**What do you tell him?**\n\n* [[Yes. All keys pop off the same way->D4 J6 W]]\n* [[Yes, but use a screwdriver instead->D4 J6 W]]\n* [[No. Clean around it with air->D4 J6 R]]\n* [[No. Press hard to crush the crumb->D4 J6 W]]", "D4 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Laptop keys stay on.** Mechanical keycaps are made to come off. Laptop keys sit on tiny scissor clips that snap.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about laptop keys?\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**Laptop keys stay on.** Use air and a swab around the key. A broken scissor clip often means a whole new keyboard.\n\n[[Next customer->D4 J7]]", "D4 J7": "**Jordan** is deep-cleaning his mechanical keyboard. He pulled off all the keycaps with a puller. Now he wants to wash them.\n\n**What's the smart way to do it?**\n\n* [[Rinse the whole keyboard in the sink->D4 J7 W]]\n* [[Wash just the caps, then dry fully->D4 J7 R]]\n* [[Boil the caps in a pot to clean them->D4 J7 W]]\n* [[Wash the caps, put them back damp->D4 J7 W]]", "D4 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Only the keycaps get washed.** Never the keyboard. Warm, soapy water. Then dry them *all the way*.\"\n\n[[Got it->D4 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which part can get wet? And how long do they dry?\"\n\n[[Try again->D4 J7]]]", "D4 J7 R": "(set: $miss to 0)## ✅ Job done\n**Just the keycaps, in warm soapy water. Dry them all the way.** Boiling can bend the plastic. Damp caps drip into the switches. Hopefully he took that photo first!\n\n[[Next customer->D4 J8]]", "D4 J8": "**Jordan's friend Quinn** is trying to pull off his space bar. He hooked the puller under the left end. He's yanking it up.\n\n**What should Quinn do instead?**\n\n* [[Yank the right end too->D4 J8 W]]\n* [[Twist the space bar sideways->D4 J8 W]]\n* [[Pry harder from one end->D4 J8 W]]\n* [[Lift it straight up, evenly->D4 J8 R]]", "D4 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The space bar has **stabilizers**. Pull it **straight up, slowly and evenly**. If not, the bar pops out of its clip.\"\n\n[[Got it->D4 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's special about big keys like the space bar?\"\n\n[[Try again->D4 J8]]]", "D4 J8 R": "(set: $miss to 0)## ✅ Job done\n**Straight up, slow and even.** Long keys have stabilizer bars. Yanking one end is the classic way to knock one loose.\n\n[[Next customer->D4 J9]]", "D4 J9": "**Ava's** mechanical W key feels sticky after a soda drip. The rest of the keyboard is fine.\n\n**What's a good home fix?**\n\n* [[Swab the switch with alcohol->D4 J9 R]]\n* [[Pour dish soap into the switch->D4 J9 W]]\n* [[Rinse it under the warm faucet->D4 J9 W]]\n* [[Keep typing hard on that key->D4 J9 W]]", "D4 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Cap off. Put **a little alcohol on a swab**. Touch it to the switch. Press it a few times. Let it dry.\"\n\n[[Got it->D4 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look back at my deep cleaning lesson.\"\n\n[[Try again->D4 J9]]]", "D4 J9 R": "(set: $miss to 0)## ✅ Job done\n**Cap off. Swab with a little alcohol. Press it a few times. Let it dry.** Unplug first, of course. Alcohol melts the sugar and then dries up.\n\n[[The Inspector has something to show you->D4 L10]]", "D4 L10": "## 📘 The Inspector's lesson: Spill Emergency\n\n*The Inspector's voice gets serious.* \"Spills break more keyboards than anything else. What you do in the **first minute** matters most.\"\n\n1. **Turn it off and unplug it, right away.** Power plus liquid is what does the damage.\n2. **Flip it upside down** so liquid drains *out*. A laptop goes open like a tent, keys facing down.\n3. **Blot, don't wipe.** Press a cloth on it. Wiping spreads liquid around.\n4. **Let it dry at least 24 to 48 hours.** No turning it on \"just to check.\"\n\n\"**Skip the rice.** It doesn't dry things any faster than air. And grains get stuck inside. **Sugary drinks** (juice, soda, milk) leave sticky stuff behind. They often need a cleaning by a pro.\"\n\n\n[[Got it. Send in the next customer->D4 J11]]", "D4 J11": "**Omar** just knocked a glass of water across his desktop keyboard. It's still plugged in.\n\n**What's the very first thing to do?**\n\n* [[Unplug it right away->D4 J11 R]]\n* [[Wipe the keys with a towel->D4 J11 W]]\n* [[Type to see if it still works->D4 J11 W]]\n* [[Put it in a bowl of rice->D4 J11 W]]", "D4 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Unplug it right away.** Then flip, blot, and dry. Testing it while it's wet is the worst move.\"\n\n[[Got it->D4 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"First minute, first step...\"\n\n[[Try again->D4 J11]]]", "D4 J11 R": "(set: $miss to 0)## ✅ Job done\n**Unplug first.** Then flip it over. Blot, don't wipe. Let it dry for at least 24 to 48 hours.\n\n[[Next customer->D4 J12]]", "D4 J12": "**Hana's** little brother spilled apple juice on her laptop. She shut it off and flipped it. She let it dry for two days. Now it turns on, but some keys feel gummy.\n\n**What's the best next step?**\n\n* [[Put it in a bag of rice for two days->D4 J12 W]]\n* [[Pour water on the keys to rinse them->D4 J12 W]]\n* [[Take it to a pro for a cleaning->D4 J12 R]]\n* [[Pry off the keys and scrub under them->D4 J12 W]]", "D4 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"She did everything right. But **juice leaves sugar behind.** That needs a **cleaning by a pro**.\"\n\n[[Got it->D4 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about sugary drinks?\"\n\n[[Try again->D4 J12]]]", "D4 J12 R": "(set: $miss to 0)(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]## ✅ Job done\n**A cleaning by a pro.** Hana acted fast, and that likely saved the laptop. But leftover sugar can keep making keys sticky. It can also eat away at parts inside.\n\n[[Close up shop->D4 Done]]", "D4 Done": "(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]# Day 4 complete!\n\n<div class=\"tool\">🧹 **New tool earned: Keycap Puller**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Ask a grown-up first. Then give your keyboard a **weekly clean**: unplug, flip and tap, air, wipe. Take before and after photos if you like. Then make a spill plan on a sticky note. Put it near your computer.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 5->D5 Start]]", "D5 Start": "(set: $miss to 0)# Day 5: Meet the Mice\n\n*The Inspector opens a drawer full of mice. One is old and dusty, with a rubber ball. One is a glowing gaming mouse.*\n\n\"Same deal as keyboards. Name it first. Then you'll know how to care for it. Mice have changed a lot. So let's start with how they *see*.\"\n\n\n[[Open the shop->D5 L1]]", "D5 L1": "## 📘 The Inspector's lesson: How a Mouse Sees\n\n* **Ball mouse** (very old): A rubber ball sits underneath. It turns two little **rollers** inside. One roller is for side to side. One is for up and down. When a roller got gunky, the **cursor** (the arrow on the screen) got stuck. Or it only moved one way.\n* **Optical mouse:** It has a small light and a tiny camera. The camera takes thousands of pictures of the desk each second. That is how it sees the mouse move.\n* **Laser mouse:** It works like optical. But it can read more kinds of surfaces.\n\n\"Optical and laser **sensors** (the mouse's eye) need **texture** to see. Texture means tiny bumps and marks on the surface. **Clear glass** and **mirrors** give the sensor nothing to track. So the cursor jumps. A **mouse pad** fixes that.\"\n\n\n[[Got it. Send in the next customer->D5 J2]]", "D5 J2": "**Mrs. Lin** just got a pretty glass desk. Now her mouse cursor jumps and skips around.\n\n**Why?**\n\n* [[Glass blocks the mouse's signal->D5 J2 W]]\n* [[The mouse needs an update for glass->D5 J2 W]]\n* [[Clear glass has nothing to track->D5 J2 R]]\n* [[Glass makes the mouse too hot->D5 J2 W]]", "D5 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor looks for tiny bumps on the surface. **Clear glass has nothing to track.** A mouse pad fixes it.\"\n\n[[Got it->D5 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How does an optical mouse know it's moving?\"\n\n[[Try again->D5 J2]]]", "D5 J2 R": "(set: $miss to 0)## ✅ Job done\n**Clear glass gives the sensor nothing to track.** The fix is a **mouse pad**.\n\n[[Next customer->D5 J3]]", "D5 J3": "**Mr. Abernathy** found his old mouse in a closet. It has a rubber ball underneath. The cursor moves left and right. But it won't move up and down.\n\n**What is most likely wrong?**\n\n* [[The up-down roller is full of gunk->D5 J3 R]]\n* [[The computer only goes side to side->D5 J3 W]]\n* [[The rubber ball has gone flat->D5 J3 W]]\n* [[It needs a new laser sensor->D5 J3 W]]", "D5 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"One roller is for side to side. One is for up and down. **The up-and-down roller is gunked up.** Pop out the ball and clean the rollers.\"\n\n[[Got it->D5 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How many rollers does a ball mouse have? What does each one do?\"\n\n[[Try again->D5 J3]]]", "D5 J3 R": "(set: $miss to 0)## ✅ Job done\n**The up-and-down roller is gunky.** Twist off the ring underneath. Take out the ball. Gently scrape the gunk off the rollers. (Then maybe think about an optical mouse!)\n\n[[The Inspector has something to show you->D5 L4]]", "D5 L4": "## 📘 The Inspector's lesson: Shapes for Different Jobs\n\n* **Trackball:** The mouse stays still. You roll a ball with your thumb or fingers. It is great for small desks and tired shoulders.\n* **Vertical mouse:** Your hand rests on its side, like a handshake. That way your arm isn't twisted.\n* **Gaming mouse:** It has extra buttons. It also has **DPI** you can change. DPI is how far the cursor moves when you move the mouse. Higher DPI means a faster cursor.\n* **Trackpad:** a flat touch spot on most laptops. One finger moves the cursor. **Two fingers sliding together** make the page scroll.\n* **Drawing tablet:** a flat pad and a **stylus** (a pen for the computer). You draw with it. Press harder for darker or thicker lines.\n\n\n[[Got it. Send in the next customer->D5 J5]]", "D5 J5": "**Mr. Patel** has a tiny desk. There's no room to slide a mouse around. And his shoulder gets tired.\n\n**Which mouse would help most?**\n\n* [[A gaming mouse with extra buttons->D5 J5 W]]\n* [[A trackball that stays still->D5 J5 R]]\n* [[A ball mouse with a rubber ball->D5 J5 W]]\n* [[A bigger mouse pad for more room->D5 J5 W]]", "D5 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **trackball** stays in one spot. Only the ball moves.\"\n\n[[Got it->D5 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which mouse doesn't need to move at all?\"\n\n[[Try again->D5 J5]]]", "D5 J5 R": "(set: $miss to 0)## ✅ Job done\nA **trackball**. It needs almost no desk space. It needs almost no arm movement, too.\n\n[[Next customer->D5 J6]]", "D5 J6": "**Rosa's** arm aches after long days of homework. When she uses her mouse, her palm faces flat down.\n\n**Which mouse might feel better?**\n\n* [[A laser mouse that works on more surfaces->D5 J6 W]]\n* [[A smaller mouse that takes less room->D5 J6 W]]\n* [[A gaming mouse with higher DPI->D5 J6 W]]\n* [[A vertical mouse held like a handshake->D5 J6 R]]", "D5 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **vertical mouse** turns the hand on its side, like a handshake. Then the arm isn't twisted.\"\n\n[[Got it->D5 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which mouse changes the way your hand sits?\"\n\n[[Try again->D5 J6]]]", "D5 J6 R": "(set: $miss to 0)## ✅ Job done\nA **vertical mouse.** (If the pain keeps going, she should tell a grown-up. She may need to see a doctor.)\n\n[[Next customer->D5 J7]]", "D5 J7": "**Dev** got a gaming mouse. \"It has a DPI button. When I press it, the cursor zooms across the screen! Is it broken?\"\n\n**What's happening?**\n\n* [[The DPI button is broken->D5 J7 W]]\n* [[The DPI button turned on lights->D5 J7 W]]\n* [[He turned the DPI up higher->D5 J7 R]]\n* [[DPI switched it to Bluetooth->D5 J7 W]]", "D5 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**DPI** is how far the cursor moves when the mouse moves. Press the button again to turn it down.\"\n\n[[Got it->D5 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does DPI control?\"\n\n[[Try again->D5 J7]]]", "D5 J7 R": "(set: $miss to 0)## ✅ Job done\n**DPI** stands for *dots per inch*. Higher DPI means a faster cursor. Nothing is broken.\n\n[[Next customer->D5 J8]]", "D5 J8": "**Lily** loves to draw. She wants to make art on the computer. But drawing with a mouse feels like drawing with a bar of soap!\n\n**What tool fits her best?**\n\n* [[A trackball she rolls with her thumb->D5 J8 W]]\n* [[A drawing tablet and stylus->D5 J8 R]]\n* [[A vertical mouse held on its side->D5 J8 W]]\n* [[A gaming mouse with high DPI->D5 J8 W]]", "D5 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **drawing tablet with a stylus** works like a pen on paper. Pressing harder makes thicker lines.\"\n\n[[Got it->D5 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which tool works like a pen?\"\n\n[[Try again->D5 J8]]]", "D5 J8 R": "(set: $miss to 0)## ✅ Job done\nA **drawing tablet with a stylus.** Holding a pen feels much more natural for drawing. And how hard you press changes the line.\n\n[[Next customer->D5 J9]]", "D5 J9": "**Ms. Park** is using her laptop's trackpad. She can't figure out how to scroll down a long web page.\n\n**What do you show her?**\n\n* [[Press hard with one finger and hold->D5 J9 W]]\n* [[Tap the trackpad three times fast->D5 J9 W]]\n* [[Draw a circle with one finger->D5 J9 W]]\n* [[Slide two fingers up or down->D5 J9 R]]", "D5 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"On most trackpads, you slide **two fingers together** to scroll.\"\n\n[[Got it->D5 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How many fingers did I say for scrolling?\"\n\n[[Try again->D5 J9]]]", "D5 J9 R": "(set: $miss to 0)## ✅ Job done\n**Two fingers, sliding together.** One finger moves the cursor. Two fingers scroll.\n\n[[The Inspector has something to show you->D5 L10]]", "D5 L10": "## 📘 The Inspector's lesson: Power and Connections\n\n\"Mice connect the same three ways keyboards do. They can be **wired** (with a cable). They can use a **2.4 GHz dongle** (a tiny plug for the computer). Or they can use **Bluetooth** (a wireless link with no plug).\"\n\n* **Wired mice** never need batteries. They never need pairing, either.\n* **Wireless mice** run on **AA or AAA batteries**. Or they have a **battery inside** that you charge with a cable.\n* **Low-battery signs:** The cursor starts to **lag, skip, or stutter**. Lag means it falls behind your hand. It gets a little worse each day. Or the mouse drops its connection for no reason. Before you blame the mouse, **change or charge the battery**.\n\n\n[[Got it. Send in the next customer->D5 J11]]", "D5 J11": "**Gabe's** wireless mouse gets a little more laggy and jumpy every day. It runs on AA batteries.\n\n**What should he try first?**\n\n* [[Buy a brand-new mouse->D5 J11 W]]\n* [[Put in fresh batteries->D5 J11 R]]\n* [[Wipe and reset the computer->D5 J11 W]]\n* [[Turn the DPI all the way up->D5 J11 W]]", "D5 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lag and skipping that get worse each day mean **low batteries**. Try fresh batteries first.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What are the warning signs of a low battery?\"\n\n[[Try again->D5 J11]]]", "D5 J11 R": "(set: $miss to 0)## ✅ Job done\n**Fresh batteries.** Lag that gets worse each day is the classic low-battery sign. Always try the simple fix first.\n\n[[Next customer->D5 J12]]", "D5 J12": "**Mrs. Okafor** runs a computer lab at a library. She's tired of mice dying in the middle of classes.\n\n**Which mice would solve that?**\n\n* [[Bluetooth mice that pair with each computer->D5 J12 W]]\n* [[Mice that use AA batteries->D5 J12 W]]\n* [[2.4 GHz mice with dongles->D5 J12 W]]\n* [[Wired mice that never need batteries->D5 J12 R]]", "D5 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Wired mice** get power through the cable. They never need batteries or charging.\"\n\n[[Got it->D5 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which kind never runs out of power?\"\n\n[[Try again->D5 J12]]]", "D5 J12 R": "(set: $miss to 0)(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]## ✅ Job done\n**Wired mice.** No batteries, no charging, no pairing. That's perfect for shared computers.\n\n[[Close up shop->D5 Done]]", "D5 Done": "(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]# Day 5 complete!\n\n<div class=\"tool\">🖱️ **New tool earned: Mouse Field Guide**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Find out what kind of mouse or trackpad you have. Then test it on three surfaces. Try a mouse pad, a wooden table, and something shiny. Where does it track best? Why?</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 6->D6 Start]]", "D6 Start": "(set: $miss to 0)# Day 6: Mouse Service Day\n\n*A pile of dirty mice waits on the bench. One scroll wheel is fuzzy with lint.*\n\n\"Mice live in your hand all day. So they collect skin oil, lint, and crumbs. Today is service day. That means clean-up and fix-up day.\"\n\n\n[[Open the shop->D6 L1]]", "D6 L1": "## 📘 The Inspector's lesson: The Service Checklist\n\n1. **Power off.** Unplug it, switch it off, or take the batteries out.\n2. **Shell and buttons:** Wipe them with a cloth that is just barely wet with alcohol. Alcohol cuts through skin oil.\n3. **Sensor window** (the little eye on the bottom): Use a gentle puff of air or a **dry** swab. It is like a tiny camera lens. So don't scrub, and use nothing wet.\n4. **Mouse feet** (the smooth pads underneath): Gently scrape off the grime. **Replace them** when they wear through. They don't cost much.\n5. **Scroll wheel:** Use compressed air (air in a can). Then lift lint out of the gap with a **wooden toothpick**. Never use metal.\n6. **Cloth mouse pads:** Hand wash with mild soap. Rinse. Let them **air dry all the way**.\n\n\n[[Got it. Send in the next customer->D6 J2]]", "D6 J2": "**Sam's** wireless mouse cursor keeps flickering and shaking. You flip it over. A hair and some dust are smeared right across the sensor window.\n\n**How do you clean the sensor?**\n\n* [[Scrub it hard with a wet towel->D6 J2 W]]\n* [[Scrape it with a metal pin->D6 J2 W]]\n* [[Spray glass cleaner right on it->D6 J2 W]]\n* [[Use a puff of air or dry swab->D6 J2 R]]", "D6 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A puff of air or a dry swab.** If you scratch that window, the mark stays forever.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Gentle, and dry.\"\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**Air or a dry swab, gently.** The sensor window is like a little camera lens.\n\n[[Next customer->D6 J3]]", "D6 J3": "**Mr. Ito's** scroll wheel barely turns. Gray fuzz is packed into the gap around it.\n\n**What's the fix?**\n\n* [[Pour alcohol in the gap and spin it->D6 J3 W]]\n* [[Canned air, then a wooden toothpick->D6 J3 R]]\n* [[Dig the lint out with a metal clip->D6 J3 W]]\n* [[Pull the scroll wheel out with pliers->D6 J3 W]]", "D6 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Compressed air, then a wooden toothpick.** Metal can scratch parts or cause a short.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check step 5 on the checklist.\"\n\n[[Try again->D6 J3]]]", "D6 J3 R": "(set: $miss to 0)## ✅ Job done\n**Air, then a wooden toothpick.** Lift the lint out gently. Then spin the wheel to check.\n\n[[Next customer->D6 J4]]", "D6 J4": "**Tara's** white mouse has turned gray and shiny where her palm rests.\n\n**What cleans it best?**\n\n* [[A cloth just a bit wet with alcohol->D6 J4 R]]\n* [[A scratchy sponge and some dish soap->D6 J4 W]]\n* [[A paper towel soaked in bleach->D6 J4 W]]\n* [[Rinse it under the kitchen sink->D6 J4 W]]", "D6 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A cloth barely wet with alcohol** cuts through skin oil. And it dries fast.\"\n\n[[Got it->D6 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What cuts skin oil but won't hurt the parts?\"\n\n[[Try again->D6 J4]]]", "D6 J4 R": "(set: $miss to 0)## ✅ Job done\n**A cloth barely wet with alcohol.** That shine is skin oil. Never run a mouse under water.\n\n[[Next customer->D6 J5]]", "D6 J5": "**Dev's** gaming mouse now drags and scratches on his mouse pad. Underneath, the smooth pads are worn thin. Dark, crusty grime is stuck around them.\n\n**What's the fix?**\n\n* [[Sand the bottom until it's smooth->D6 J5 W]]\n* [[Glue paper across the bottom->D6 J5 W]]\n* [[Clean the feet, replace if worn->D6 J5 R]]\n* [[Buy a bigger, smoother mouse pad->D6 J5 W]]", "D6 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **mouse feet**. Clean the grime off. **Replace them** when they're worn through.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Those smooth pads have a name. And they can be replaced.\"\n\n[[Try again->D6 J5]]]", "D6 J5 R": "(set: $miss to 0)## ✅ Job done\n**Clean the feet. Replace them if they're worn.** New feet make the mouse glide smoothly again.\n\n[[Next customer->D6 J6]]", "D6 J6": "**Jun's** cloth mouse pad is stained. It smells like snacks.\n\n**How should he clean it?**\n\n* [[Hand wash, rinse, and air dry->D6 J6 R]]\n* [[Scrub out the stains with bleach->D6 J6 W]]\n* [[Dry it on high heat to kill germs->D6 J6 W]]\n* [[Wipe with window cleaner, then use it->D6 J6 W]]", "D6 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Mild soap, rinse, and air dry all the way.** High heat can bend the rubber back out of shape.\"\n\n[[Got it->D6 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check step 6 on the checklist.\"\n\n[[Try again->D6 J6]]]", "D6 J6 R": "(set: $miss to 0)## ✅ Job done\n**Hand wash, rinse, and air dry all the way.** A damp mouse pad gets smelly. And high heat can hurt the rubber bottom.\n\n[[The Inspector has something to show you->D6 L7]]", "D6 L7": "## 📘 The Inspector's lesson: Trackballs and Trackpads\n\n* **Trackball:** Pop the ball out. Most have a hole underneath so you can push it out. Wipe the ball. Then clean the **little support dots or rollers** it sits on. Use a swab barely wet with alcohol. That's where the gunk hides.\n* **Trackpad:** **Turn the laptop off** first. Then wiping won't click on things. Use a microfiber cloth (a soft, smooth cloth) that is barely damp. Keep liquid away from the edges.\n\n\n[[Got it. Send in the next customer->D6 J8]]", "D6 J8": "**Mr. Patel** is back. His trackball cursor now moves in jerky little jumps.\n\n**Where is the gunk most likely hiding?**\n\n* [[Inside the long cable to the computer->D6 J8 W]]\n* [[In the mouse settings on the computer->D6 J8 W]]\n* [[On the rubber feet under the whole case->D6 J8 W]]\n* [[On the support dots under the ball->D6 J8 R]]", "D6 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pop the ball out. Look at the **support dots or rollers** underneath.\"\n\n[[Got it->D6 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does the ball rest on?\"\n\n[[Try again->D6 J8]]]", "D6 J8 R": "(set: $miss to 0)## ✅ Job done\n**The support dots or rollers.** Wipe them with a swab barely wet with alcohol. Wipe the ball. Then put it back.\n\n[[Next customer->D6 J9]]", "D6 J9": "**Kira** is cleaning her laptop's smudgy trackpad. The laptop is still on. Every wipe opens a random program!\n\n**What should she do?**\n\n* [[Wipe faster so it misses the touches->D6 J9 W]]\n* [[Turn it off first, then wipe gently->D6 J9 R]]\n* [[Spray cleaner on so the cloth glides->D6 J9 W]]\n* [[Wear gloves so it can't feel her->D6 J9 W]]", "D6 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn the laptop off first.** Then use a barely damp microfiber cloth.\"\n\n[[Got it->D6 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say to do first with a trackpad?\"\n\n[[Try again->D6 J9]]]", "D6 J9 R": "(set: $miss to 0)## ✅ Job done\n**Off first. Then a barely damp microfiber cloth.** And keep liquid away from the edges.\n\n[[The Inspector has something to show you->D6 L10]]", "D6 L10": "## 📘 The Inspector's lesson: Battery Care\n\n* Old batteries can **leak**. They leave a **crusty white powder**. It can make your skin sore. If you see it, **get a grown-up and gloves**. Take the batteries out. Clean the metal contacts (the metal bits the battery touches) with a swab. Then **recycle** the old batteries.\n* **Stop leaks before they start:** Take batteries out of anything you won't use for a long time.\n* **Rechargeable mice:** Don't leave them totally dead for months. Charge them up now and then.\n* **Never throw batteries in the trash.** Many stores and recycling centers have bins for old batteries. Rechargeable batteries in garbage trucks can even start fires.\n\n\n[[Got it. Send in the next customer->D6 J11]]", "D6 J11": "**Lena** opens the battery door on her old wireless mouse. She didn't use it all summer. The batteries are covered in crusty white powder.\n\n**What should she do?**\n\n* [[Wipe it off with her fingers, then reuse->D6 J11 W]]\n* [[Get a grown-up, gloves, batteries out->D6 J11 R]]\n* [[Blow the powder off and put them back->D6 J11 W]]\n* [[Close the door and keep using it->D6 J11 W]]", "D6 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **leaked battery juice** that dried up. **Grown-up, gloves, batteries out.** Then clean the contacts and recycle the batteries.\"\n\n[[Got it->D6 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Is that crust safe to touch?\"\n\n[[Try again->D6 J11]]]", "D6 J11 R": "(set: $miss to 0)## ✅ Job done\n**Grown-up, gloves, batteries out.** Then clean the contacts with a swab. Recycle the old batteries.\n\n[[Next customer->D6 J12]]", "D6 J12": "**Mr. Chen** is going on a three-month trip. His spare wireless mouse uses AA batteries. It will sit in a drawer the whole time.\n\n**What should he do before he goes?**\n\n* [[Leave the batteries in for later->D6 J12 W]]\n* [[Flip it so the batteries won't leak->D6 J12 W]]\n* [[Take the batteries out first->D6 J12 R]]\n* [[Wrap it up in plastic wrap->D6 J12 W]]", "D6 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Take the batteries out** of anything you won't use for a long time.\"\n\n[[Got it->D6 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's the rule for stopping leaks?\"\n\n[[Try again->D6 J12]]]", "D6 J12 R": "(set: $miss to 0)(if: $days does not contain \"6\")[(set: $days to it + (a: \"6\"))]## ✅ Job done\n**Take the batteries out.** Batteries that sit unused for months are the most likely to leak.\n\n[[Close up shop->D6 Done]]", "D6 Done": "(if: $days does not contain \"6\")[(set: $days to it + (a: \"6\"))]# Day 6 complete!\n\n<div class=\"tool\">🪛 **New tool earned: Service Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. I have homework for you before tomorrow.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Give your own mouse or trackpad a full service. Follow the checklist. Does your mouse use batteries? Then check the battery door for crust, with a grown-up. Find out where your town recycles batteries.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 7->D7 Start]]", "D7 Start": "(set: $miss to 0)# Day 7: Comfort Check\n\n*The Inspector rolls her shoulders.* \"Last day of Unit 1. Today we fix the human, not the computer.\"\n\n\"A clean computer can still hurt you if it's set up wrong. You can get a sore neck, tired eyes, and achy wrists. Let's start with your eyes.\"\n\n\n[[Open the shop->D7 L1]]", "D7 L1": "## 📘 The Inspector's lesson: Screens and Eyes\n\n* **Top of the screen** at your eye level, or a little below.\n* About an **arm's length** away. Is the text too small? **Make the text bigger.** Don't lean in.\n* **The 20-20-20 rule:** Every **20 minutes**, look at something **20 feet** away. Look for **20 seconds**.\n* **Light from the side.** A bright window behind t
