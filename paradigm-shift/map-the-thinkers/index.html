<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map the Thinkers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfdf8; --grid:#d6e4f0; --margin:#e08a8a; --ink:#1f2a36; --soft:#5a6875;
    --blue:#2d5f8b; --red:#b3261e; --sticky:#fff2a8; --good:#2e7d4f; --line:#c9d6e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--ink); font-family:"Atkinson Hyperlegible",system-ui,sans-serif; font-size:18px; line-height:1.45;
    min-height:100vh;
  }
  .page{max-width:760px;margin:0 auto;padding:20px 16px 40px 40px;position:relative;min-height:100vh}
  .page::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--margin)}
  h1,h2{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;margin:0 0 8px}
  h1{font-size:28px} h2{font-size:22px}
  .tag{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px;margin-bottom:12px}
  p{margin:8px 0}
  .sticky{background:var(--sticky);padding:12px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(-.4deg);margin:14px 0}
  .btn{display:block;width:100%;text-align:left;border:2px solid var(--blue);background:#fff;color:var(--ink);
       font:inherit;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;min-height:56px}
  .btn:active{transform:translateY(1px)}
  .btn.main{background:var(--blue);color:#fff;text-align:center;font-weight:700}
  .row{display:flex;gap:12px}
  .row .btn{text-align:center;font-weight:700}
  .btn.done{border-color:var(--good);background:#eaf5ee;color:var(--good);cursor:default}
  .btn.miss{animation:shake .3s}
  .btn.hint{border-style:dashed;border-color:var(--red)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .slots{list-style:none;padding:0;margin:10px 0}
  .slots li{border-bottom:1px solid var(--line);padding:8px 2px;min-height:42px}
  .slots li .n{font-family:"Special Elite",monospace;color:var(--soft);margin-right:8px}
  .slots li .d{color:var(--red);font-family:"Special Elite",monospace;margin-left:6px}
  .stmt{font-size:20px;font-weight:700;margin:12px 0}
  .feedback{border-left:4px solid var(--good);padding:8px 12px;background:#fff;margin:12px 0}
  .feedback.wrong{border-left-color:var(--red)}
  .feedback b.v{display:block}
  .anom{color:var(--red);font-family:"Special Elite",monospace}
  .progress{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px}
  .report{background:#fff;border:2px solid var(--ink);padding:12px 14px;margin:14px 0;white-space:pre-wrap;font-family:"Special Elite",monospace;font-size:16px}
  .hidden{display:none}
  @media (max-width:480px){.page{padding-left:34px}.page::before{left:18px}h1{font-size:24px}.row{flex-direction:column;gap:0}}
</style>
<style>
  .who{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;margin:10px 0}
  .who b{font-family:"Special Elite",monospace;font-size:22px;display:block}
  .mapwrap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;gap:6px;margin:10px 0}
  .ytop,.ybot{grid-column:2;text-align:center;font-size:14px;color:var(--soft)}
  .yaxis{grid-row:2;writing-mode:vertical-rl;transform:rotate(180deg);font-size:14px;color:var(--soft);text-align:center}
  .grid{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .cell{min-height:78px;border:2px dashed var(--line);border-radius:8px;background:#fff;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;justify-content:center}
  .cell.mine{border-style:solid;border-color:var(--blue);background:#eaf1f8}
  .cell.theirs{border-style:solid;border-color:var(--good)}
  .chip{background:var(--sticky);border-radius:6px;padding:1px 5px;font-size:12px;line-height:1.3}
  .chip.me{background:#cfe0f1}
  .xlab{grid-column:2;display:flex;justify-content:space-between;font-size:14px;color:var(--soft)}
  button.cell:disabled{cursor:default}
</style>
</head>
<body>
<main class="page" id="app" aria-live="polite"></main>
<script>
(function(){
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var app = document.getElementById('app');
  function el(h){ var h0=app.querySelector('h1,h2'); var t0=h0?h0.textContent:null; var y=window.scrollY; app.innerHTML = h; var h1=app.querySelector('h1,h2'); if(t0!==null && h1 && h1.textContent===t0){ window.scrollTo(0,y); } else { window.scrollTo(0,0); } }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function L(core, ext){ return level === 'extended' && ext !== undefined ? ext : core; }
  function tag(n){ return '<div class="tag">Lab notebook · Module '+n+' · '+(level==='core'?'Core':'Extended')+'</div>'; }
  function finishScreen(name, text, extraHtml, again){
    el('<h1>Notebook closed</h1><div class="tag">'+esc(name)+' · '+(level==='core'?'Core':'Extended')+'</div>'+
      (extraHtml||'')+
      '<p><b>What you found:</b></p><div class="report">'+esc(text)+'</div>'+
      '<button class="btn main" id="copy">Copy my results for Rocky</button><p id="copied" class="hidden">Copied! Paste it into your chat with Rocky.</p>'+
      '<p>Go back to Rocky and type <b>done</b>.</p><button class="btn" id="again">Play again</button>');
    document.getElementById('copy').onclick = function(){
      var c = document.getElementById('copied');
      function ok(){ c.classList.remove('hidden'); }
      function fallback(){ var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
        try{ document.execCommand('copy'); ok(); }catch(e){ c.textContent='Copy didn\'t work here. Read the box to Rocky instead.'; ok(); } t.remove(); }
      try{ navigator.clipboard.writeText(text).then(ok, fallback); }catch(e){ fallback(); }
    };
    document.getElementById('again').onclick = again;
  }
  function choiceButtons(boxId, options, onPick){
    var box = document.getElementById(boxId);
    options.forEach(function(o){ var b=document.createElement('button'); b.className='btn'; b.textContent=o.label; b.dataset.k=o.k;
      b.onclick=function(){ onPick(o, b); }; box.appendChild(b); });
  }

  // x: 0 rules & logic, 1 in between, 2 community & history. y: 0 truth, 1 in between, 2 usefulness.
  // core:true thinkers appear at both levels; ext:true at Extended only. The two sets together match
  // the thinker lists in M12's Core (4) and Extended (5) readings.
  var THINKERS = [
    {n:'Popper', y:'1934', idea:'Make bold guesses and try hard to prove them wrong.', at:[0,0], core:true, why:'A logical rule (falsification), and theories can get closer to the truth.'},
    {n:'Kuhn', y:'1962', idea:'Science works inside paradigms and changes them in revolutions.', at:[2,2], core:true, why:'Trust comes from a trained community; progress is better puzzle-solving, not a march to truth.'},
    {n:'Lakatos', y:'1970', idea:'Judge a theory by whether it keeps predicting new things.', at:[1,1], ext:true, why:'A rational rule, but applied to history over long stretches of time.'},
    {n:'Feyerabend', y:'1975', idea:'No single method fits all of science.', at:[2,1], core:true, why:'Against fixed rules; history shows rule-breaking working.'},
    {n:'Longino', y:'1990', idea:'Science is trustworthy when a community welcomes criticism.', at:[2,0], core:true, why:'Trust comes from community criticism, but she doesn\'t give up on truth.'}
  ].filter(function(t){ return t.core || (level==='extended' && t.ext); });
  var mine = {};
  function mapHtml(clickable, highlight){
    var cells = [];
    for(var y=0;y<3;y++) for(var x=0;x<3;x++){
      var chips = Object.keys(mine).filter(function(k){ return mine[k][0]===x && mine[k][1]===y; }).map(function(k){ return '<span class="chip'+(k==='You'?' me':'')+'">'+esc(k)+'</span>'; }).join('');
      var cls = 'cell'+(highlight && highlight.mine && highlight.mine[0]===x && highlight.mine[1]===y ? ' mine':'')+(highlight && highlight.theirs && highlight.theirs[0]===x && highlight.theirs[1]===y ? ' theirs':'');
      cells.push('<button class="'+cls+'" data-x="'+x+'" data-y="'+y+'"'+(clickable?'':' disabled')+' aria-label="trust '+['rules and logic','in between','community and history'][x]+', aim '+['truth','in between','usefulness'][y]+'">'+chips+'</button>');
    }
    return '<div class="mapwrap"><div class="ytop">Aim: truth ↑</div><div class="yaxis">What is science for?</div><div class="grid">'+cells.join('')+'</div>'+
      '<div class="ybot">↓ Aim: useful predictions and problem-solving</div><div class="xlab"><span>← Trust: rules and logic</span><span>community and history →</span></div></div>';
  }
  function intro(){
    el('<h1>Map the Thinkers</h1>'+tag(12)+
      '<p>Place each thinker from the course on the map by tapping a square. Then place yourself.</p>'+
      '<div class="sticky"><b>Across:</b> What makes science trustworthy? Rules and logic, or a community of people?<br><b>Up and down:</b> What is science for? Getting closer to the truth, or making useful predictions?</div>'+
      '<button class="btn main" id="go">Start mapping</button>');
    document.getElementById('go').onclick = function(){ place(0); };
  }
  function place(i){
    if(i>=THINKERS.length) return me();
    var t = THINKERS[i];
    el('<h2>'+(i+1)+' of '+THINKERS.length+'</h2><div class="who"><b>'+esc(t.n)+' ('+t.y+')</b>'+esc(t.idea)+'</div><p>Where does '+esc(t.n)+' go?</p>'+mapHtml(true));
    app.querySelectorAll('.cell').forEach(function(c){ c.onclick=function(){
      var spot=[+c.dataset.x,+c.dataset.y]; mine[t.n]=spot;
      var same = spot[0]===t.at[0] && spot[1]===t.at[1];
      el('<h2>'+(i+1)+' of '+THINKERS.length+'</h2><div class="who"><b>'+esc(t.n)+' ('+t.y+')</b>'+esc(t.idea)+'</div>'+
        mapHtml(false,{mine:spot, theirs:t.at})+
        '<div class="feedback"><b class="v">'+(same?'Same square as one common reading.':'One common reading puts '+esc(t.n)+' in the green square.')+'</b>'+esc(t.why)+' Thinkers argue about this; your placement can be just as good if you can explain it.</div>'+
        '<button class="btn main" id="n">'+(i<THINKERS.length-1?'Next thinker':'Now place yourself')+'</button>');
      document.getElementById('n').onclick = function(){ place(i+1); };
    }; });
  }
  function me(){
    el('<h2>Where do you go?</h2><p>What makes science trustworthy to you, and what do you think it\'s for? Tap your square.</p>'+mapHtml(true));
    app.querySelectorAll('.cell').forEach(function(c){ c.onclick=function(){
      mine['You']=[+c.dataset.x,+c.dataset.y];
      askWhy();
    }; });
  }
  var myWhy = '';
  function askWhy(){
    var X=['rules and logic','in between on trust','community and history'], Y=['truth','in between on aim','useful predictions'];
    var p = mine['You'];
    el('<h2>Why there?</h2><p>You picked <b>trust: '+esc(X[p[0]])+' · aim: '+esc(Y[p[1]])+'</b>. Which fits best?</p><div id="why"></div>');
    var opts = [
      {k:'rules',  label:'Science needs strict rules so it stays honest.'},
      {k:'people', label:'Science is a community checking each other\'s work.'},
      {k:'true',   label:'Science is slowly getting closer to how the world really is.'},
      {k:'use',    label:'Science is for making predictions that actually work.'},
      {k:'both',   label:'A bit of both; it depends on the question.'},
      {k:'other',  label:'Something else (I\'ll tell Rocky).'}
    ];
    choiceButtons('why', opts, function(o){ myWhy = o.label; result(); });
  }
  function choiceButtons(boxId, options, onPick){
    var box = document.getElementById(boxId);
    options.forEach(function(o){ var b=document.createElement('button'); b.className='btn'; b.textContent=o.label;
      b.onclick=function(){ onPick(o, b); }; box.appendChild(b); });
  }
  function result(){
    var near = THINKERS.filter(function(t){ return mine[t.n] && mine[t.n][0]===mine['You'][0] && mine[t.n][1]===mine['You'][1]; }).map(function(t){return t.n;});
    el('<h2>Your map</h2>'+mapHtml(false,{mine:mine['You']})+
      '<div class="sticky">A map with two lines squeezes every thinker into nine boxes. It makes them easy to compare, and it hides a lot. Kuhn might call it a little paradigm.</div>'+
      '<button class="btn main" id="n">Close the notebook</button>');
    document.getElementById('n').onclick = function(){
      var X=['rules and logic','in between','community and history'], Y=['truth','in between','usefulness'];
      var lines = THINKERS.map(function(t){ var p=mine[t.n]; return t.n+': '+X[p[0]]+' / '+Y[p[1]]; });
      var text = ['done — Map the Thinkers ('+level+')',
        'You: '+X[mine['You'][0]]+' / '+Y[mine['You'][1]]+(near.length?' (same square as '+near.join(', ')+')':''),
        'Why: '+myWhy].concat(lines).join('\n');
      finishScreen('Map the Thinkers', text, '', function(){ mine={}; myWhy=''; intro(); });
    };
  }
  intro();
})();
</script>
</body>
</html>
