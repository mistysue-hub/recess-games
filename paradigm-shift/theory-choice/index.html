<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theory Choice Scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfdf8; --grid:#d6e4f0; --margin:#e08a8a; --ink:#1f2a36; --soft:#5a6875;
    --blue:#2d5f8b; --red:#b3261e; --sticky:#fff2a8; --good:#2e7d4f; --line:#c9d6e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--ink); font-family:"Atkinson Hyperlegible",system-ui,sans-serif; font-size:18px; line-height:1.45;
    min-height:100vh;
  }
  .page{max-width:760px;margin:0 auto;padding:20px 16px 40px 40px;position:relative;min-height:100vh}
  .page::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--margin)}
  h1,h2{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;margin:0 0 8px}
  h1{font-size:28px} h2{font-size:22px}
  .tag{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px;margin-bottom:12px}
  p{margin:8px 0}
  .sticky{background:var(--sticky);padding:12px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(-.4deg);margin:14px 0}
  .btn{display:block;width:100%;text-align:left;border:2px solid var(--blue);background:#fff;color:var(--ink);
       font:inherit;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;min-height:56px}
  .btn:active{transform:translateY(1px)}
  .btn.main{background:var(--blue);color:#fff;text-align:center;font-weight:700}
  .row{display:flex;gap:12px}
  .row .btn{text-align:center;font-weight:700}
  .btn.done{border-color:var(--good);background:#eaf5ee;color:var(--good);cursor:default}
  .btn.miss{animation:shake .3s}
  .btn.hint{border-style:dashed;border-color:var(--red)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .slots{list-style:none;padding:0;margin:10px 0}
  .slots li{border-bottom:1px solid var(--line);padding:8px 2px;min-height:42px}
  .slots li .n{font-family:"Special Elite",monospace;color:var(--soft);margin-right:8px}
  .slots li .d{color:var(--red);font-family:"Special Elite",monospace;margin-left:6px}
  .stmt{font-size:20px;font-weight:700;margin:12px 0}
  .feedback{border-left:4px solid var(--good);padding:8px 12px;background:#fff;margin:12px 0}
  .feedback.wrong{border-left-color:var(--red)}
  .feedback b.v{display:block}
  .anom{color:var(--red);font-family:"Special Elite",monospace}
  .progress{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px}
  .report{background:#fff;border:2px solid var(--ink);padding:12px 14px;margin:14px 0;white-space:pre-wrap;font-family:"Special Elite",monospace;font-size:16px}
  .hidden{display:none}
  @media (max-width:480px){.page{padding-left:34px}.page::before{left:18px}h1{font-size:24px}.row{flex-direction:column;gap:0}}
</style>
<style>
  .vals{display:flex;flex-direction:column;gap:10px;margin:10px 0}
  .val{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .val h3{margin:0 0 4px;font-family:"Special Elite",monospace;font-weight:400}
  .val .scores{display:flex;gap:12px;flex-wrap:wrap;font-size:16px;margin:4px 0}
  .val .scores span b{font-family:"Special Elite",monospace}
  .val .src{font-size:14px;color:var(--soft)}
  .w{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
  .w .btn{margin:0;width:auto;min-width:48px;min-height:44px;padding:6px 10px;text-align:center;font-weight:700}
  .w .btn.on{background:var(--blue);color:#fff}
  .w .lbl{font-size:15px;color:var(--soft);margin-right:4px}
  .tally{display:flex;gap:10px;margin:10px 0}
  .tally div{flex:1;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px;text-align:center}
  .tally b{display:block;font-family:"Special Elite",monospace;font-size:28px}
  .win{border-color:var(--good)!important;background:#eaf5ee!important}
</style>
</head>
<body>
<main class="page" id="app" aria-live="polite"></main>
<script>
(function(){
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var app = document.getElementById('app');
  function el(h){ app.innerHTML = h; window.scrollTo(0,0); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function L(core, ext){ return level === 'extended' && ext !== undefined ? ext : core; }
  function tag(n){ return '<div class="tag">Lab notebook · Module '+n+' · '+(level==='core'?'Core':'Extended')+'</div>'; }
  function finishScreen(name, text, extraHtml, again){
    el('<h1>Notebook closed</h1><div class="tag">'+esc(name)+' · '+(level==='core'?'Core':'Extended')+'</div>'+
      (extraHtml||'')+
      '<p><b>What you found:</b></p><div class="report">'+esc(text)+'</div>'+
      '<button class="btn main" id="copy">Copy my results for Rocky</button><p id="copied" class="hidden">Copied! Paste it into your chat with Rocky.</p>'+
      '<p>Go back to Rocky and type <b>done</b>.</p><button class="btn" id="again">Play again</button>');
    document.getElementById('copy').onclick = function(){
      var c = document.getElementById('copied');
      function ok(){ c.classList.remove('hidden'); }
      function fallback(){ var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
        try{ document.execCommand('copy'); ok(); }catch(e){ c.textContent='Copy didn\'t work here. Read the box to Rocky instead.'; ok(); } t.remove(); }
      try{ navigator.clipboard.writeText(text).then(ok, fallback); }catch(e){ fallback(); }
    };
    document.getElementById('again').onclick = again;
  }
  function choiceButtons(boxId, options, onPick){
    var box = document.getElementById(boxId);
    options.forEach(function(o){ var b=document.createElement('button'); b.className='btn'; b.textContent=o.label; b.dataset.k=o.k;
      b.onclick=function(){ onPick(o, b); }; box.appendChild(b); });
  }

  // Scores: 0 = weak, 1 = fair, 2 = strong. Sources: Kuhn's 1977 essay for accuracy, consistency, simplicity.
  var VALUES = [
    {k:'acc', n:'Accuracy', d:'Predictions match observations.', p:1, c:1, src:'Kuhn\'s example: Copernicus was not more accurate until Kepler.'},
    {k:'con', n:'Consistency', d:'Fits with other accepted science.', p:2, c:0, src:'Kuhn\'s example: a moving Earth clashed with the physics everyone accepted.'},
    {k:'sco', n:'Scope', d:'Explains many kinds of things, not just one.', p:1, c:1, src:'This game\'s call: both covered the same Sun, Moon and planets.'},
    {k:'sim', n:'Simplicity', d:'Uses fewer separate ideas to explain things.', p:1, c:2, src:'Kuhn\'s example: equal for calculating, but Copernicus explained the backward loops with one circle per planet instead of two.'},
    {k:'fru', n:'Fruitfulness', d:'Leads to new discoveries.', p:null, c:null, hp:0, hc:2, src:'In 1543, nobody could know yet. With hindsight: Copernicus led on to Kepler and Galileo.'}
  ];
  var W = {acc:1,con:1,sco:1,sim:1,fru:1}, round = 1, results = [];
  function sc(v, side){ var x = side==='p' ? (round===1 ? v.p : (v.p===null?v.hp:v.p)) : (round===1 ? v.c : (v.c===null?v.hc:v.c)); return x; }
  function word(x){ return x===null ? '?' : ['weak','fair','strong'][x]; }
  function totals(){ var P=0,C=0; VALUES.forEach(function(v){ var a=sc(v,'p'), b=sc(v,'c'); if(a!==null) P+=a*W[v.k]; if(b!==null) C+=b*W[v.k]; }); return [P,C]; }
  function render(){
    var t = totals(), winner = t[0]>t[1] ? 'Ptolemy' : (t[1]>t[0] ? 'Copernicus' : 'Tie');
    el('<h2>'+(round===1?'1543: judge with the eyes of the time':'Now judge with hindsight')+'</h2>'+
      '<p>'+L('Tap how much each value matters to you, from 0 (not at all) to 3 (a lot). The totals change as you tap.','Set a weight from 0 to 3 for each value. Totals are weight × score.')+'</p>'+
      '<div class="vals">'+VALUES.map(function(v){
        var a=sc(v,'p'), b=sc(v,'c');
        return '<div class="val"><h3>'+v.n+'</h3><div>'+esc(v.d)+'</div>'+
          '<div class="scores"><span>Ptolemy: <b>'+word(a)+'</b></span><span>Copernicus: <b>'+word(b)+'</b></span></div>'+
          '<div class="src">'+esc(v.src)+'</div>'+
          '<div class="w"><span class="lbl">Matters:</span>'+[0,1,2,3].map(function(n){ return '<button class="btn'+(W[v.k]===n?' on':'')+'" data-k="'+v.k+'" data-n="'+n+'" aria-label="'+v.n+' weight '+n+'">'+n+'</button>'; }).join('')+'</div></div>';
      }).join('')+'</div>'+
      '<div class="tally"><div class="'+(winner==='Ptolemy'?'win':'')+'"><span>Ptolemy</span><b>'+t[0]+'</b></div><div class="'+(winner==='Copernicus'?'win':'')+'"><span>Copernicus</span><b>'+t[1]+'</b></div></div>'+
      '<p><b>With your weights: '+(winner==='Tie'?'a tie.':winner+' wins.')+'</b></p>'+
      '<button class="btn main" id="lock">Lock in my weights</button>');
    app.querySelectorAll('.w .btn').forEach(function(b){ b.onclick=function(){ W[b.dataset.k]=+b.dataset.n; var y=window.scrollY; render(); window.scrollTo(0,y); }; });
    document.getElementById('lock').onclick = function(){ results.push({round:round, w:JSON.parse(JSON.stringify(W)), t:totals(), winner:winner}); afterLock(winner); };
  }
  function afterLock(winner){
    if(round===1){
      el('<h2>Locked in for 1543</h2><p>With your weights, <b>'+(winner==='Tie'?'it\'s a tie':winner+' wins')+'</b>.</p>'+
        '<div class="sticky">Kuhn\'s point: two honest, smart astronomers in 1543 could weigh these values differently and choose differently. Neither had to be foolish.</div>'+
        '<p>Fruitfulness was a question mark in 1543. Next, fill it in with what we know now.</p><button class="btn main" id="n">Use hindsight</button>');
      document.getElementById('n').onclick = function(){ round=2; render(); };
    } else {
      el('<h2>Is hindsight fair?</h2><p>With hindsight, <b>'+(winner==='Tie'?'it\'s a tie':winner+' wins')+'</b>.</p>'+
        '<p>Is it fair to judge astronomers in 1543 by what happened later?</p><div id="v"></div>');
      choiceButtons('v', [{k:'yes',label:'Yes: results are what count'},{k:'no',label:'No: they could only judge what they knew then'},{k:'both',label:'Partly: it depends what you\'re asking'}], function(o){
        var r1=results[0], r2=results[1];
        var text = ['done — Theory Choice Scale ('+level+')',
          'Weights (accuracy, consistency, scope, simplicity, fruitfulness): '+[r1.w.acc,r1.w.con,r1.w.sco,r1.w.sim,r1.w.fru].join(', ')+(r2?' → '+[r2.w.acc,r2.w.con,r2.w.sco,r2.w.sim,r2.w.fru].join(', '):''),
          '1543 winner: '+r1.winner, 'Hindsight winner: '+r2.winner, 'Is hindsight fair? '+o.label].join('\n');
        finishScreen('Theory Choice Scale', text,
          '<div class="sticky">There\'s no wrong winner. Kuhn called these five "values," not rules, because people can weigh them differently and still be reasonable.</div>',
          function(){ W={acc:1,con:1,sco:1,sim:1,fru:1}; round=1; results=[]; intro(); });
      });
    }
  }
  function intro(){
    el('<h1>Theory Choice Scale</h1>'+tag(10)+
      '<p>It\'s 1543. Copernicus has just published his Sun-centered model. Ptolemy\'s Earth-centered model has worked for 1,400 years. Which should an astronomer choose?</p>'+
      '<div class="sticky">Thomas Kuhn named five values scientists use to choose theories. You decide how much each one matters. Most of the scores come from Kuhn\'s own example, and each one says where it comes from.</div>'+
      '<button class="btn main" id="go">Start weighing</button>');
    document.getElementById('go').onclick = render;
  }
  intro();
})();
</script>
</body>
</html>
