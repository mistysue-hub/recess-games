<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atom Through Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfdf8; --grid:#d6e4f0; --margin:#e08a8a; --ink:#1f2a36; --soft:#5a6875;
    --blue:#2d5f8b; --red:#b3261e; --sticky:#fff2a8; --good:#2e7d4f; --line:#c9d6e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--ink); font-family:"Atkinson Hyperlegible",system-ui,sans-serif; font-size:18px; line-height:1.45;
    min-height:100vh;
  }
  .page{max-width:760px;margin:0 auto;padding:20px 16px 40px 40px;position:relative;min-height:100vh}
  .page::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--margin)}
  h1,h2{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;margin:0 0 8px}
  h1{font-size:28px} h2{font-size:22px}
  .tag{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px;margin-bottom:12px}
  p{margin:8px 0}
  .sticky{background:var(--sticky);padding:12px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(-.4deg);margin:14px 0}
  .btn{display:block;width:100%;text-align:left;border:2px solid var(--blue);background:#fff;color:var(--ink);
       font:inherit;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;min-height:56px}
  .btn:active{transform:translateY(1px)}
  .btn.main{background:var(--blue);color:#fff;text-align:center;font-weight:700}
  .row{display:flex;gap:12px}
  .row .btn{text-align:center;font-weight:700}
  .btn.done{border-color:var(--good);background:#eaf5ee;color:var(--good);cursor:default}
  .btn.miss{animation:shake .3s}
  .btn.hint{border-style:dashed;border-color:var(--red)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .slots{list-style:none;padding:0;margin:10px 0}
  .slots li{border-bottom:1px solid var(--line);padding:8px 2px;min-height:42px}
  .slots li .n{font-family:"Special Elite",monospace;color:var(--soft);margin-right:8px}
  .slots li .d{color:var(--red);font-family:"Special Elite",monospace;margin-left:6px}
  .stmt{font-size:20px;font-weight:700;margin:12px 0}
  .feedback{border-left:4px solid var(--good);padding:8px 12px;background:#fff;margin:12px 0}
  .feedback.wrong{border-left-color:var(--red)}
  .feedback b.v{display:block}
  .anom{color:var(--red);font-family:"Special Elite",monospace}
  .progress{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px}
  .report{background:#fff;border:2px solid var(--ink);padding:12px 14px;margin:14px 0;white-space:pre-wrap;font-family:"Special Elite",monospace;font-size:16px}
  .hidden{display:none}
  @media (max-width:480px){.page{padding-left:34px}.page::before{left:18px}h1{font-size:24px}.row{flex-direction:column;gap:0}}
</style>
<style>
  .models{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
  .m{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;font:inherit;color:var(--ink)}
  .m svg{display:block;margin:0 auto}
  .m b{display:block;font-family:"Special Elite",monospace;font-size:15px}
  .m span{font-size:13px;color:var(--soft)}
  button.m{cursor:pointer;min-height:120px}
  .q{font-size:20px;font-weight:700;margin:12px 0}
  @media (max-width:620px){.models{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:400px){.models{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="page" id="app" aria-live="polite"></main>
<script>
(function(){
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var app = document.getElementById('app');
  function el(h){ var h0=app.querySelector('h1,h2'); var t0=h0?h0.textContent:null; var y=window.scrollY; app.innerHTML = h; var h1=app.querySelector('h1,h2'); if(t0!==null && h1 && h1.textContent===t0){ window.scrollTo(0,y); } else { window.scrollTo(0,0); } }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function L(core, ext){ return level === 'extended' && ext !== undefined ? ext : core; }
  function tag(n){ return '<div class="tag">Lab notebook · Module '+n+' · '+(level==='core'?'Core':'Extended')+'</div>'; }
  function finishScreen(name, text, extraHtml, again){
    el('<h1>Notebook closed</h1><div class="tag">'+esc(name)+' · '+(level==='core'?'Core':'Extended')+'</div>'+
      (extraHtml||'')+
      '<p><b>What you found:</b></p><div class="report">'+esc(text)+'</div>'+
      '<button class="btn main" id="copy">Copy my results for Rocky</button><p id="copied" class="hidden">Copied! Paste it into your chat with Rocky.</p>'+
      '<p>Go back to Rocky and type <b>done</b>.</p><button class="btn" id="again">Play again</button>');
    document.getElementById('copy').onclick = function(){
      var c = document.getElementById('copied');
      function ok(){ c.classList.remove('hidden'); }
      function fallback(){ var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
        try{ document.execCommand('copy'); ok(); }catch(e){ c.textContent='Copy didn\'t work here. Read the box to Rocky instead.'; ok(); } t.remove(); }
      try{ navigator.clipboard.writeText(text).then(ok, fallback); }catch(e){ fallback(); }
    };
    document.getElementById('again').onclick = again;
  }
  function choiceButtons(boxId, options, onPick){
    var box = document.getElementById(boxId);
    options.forEach(function(o){ var b=document.createElement('button'); b.className='btn'; b.textContent=o.label; b.dataset.k=o.k;
      b.onclick=function(){ onPick(o, b); }; box.appendChild(b); });
  }

  function svg(k){
    var s='<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">';
    if(k==='dalton') s+='<circle cx="32" cy="32" r="22" fill="#8d8d8d" stroke="#1f2a36" stroke-width="2"/>';
    if(k==='thomson'){ s+='<circle cx="32" cy="32" r="24" fill="#f3c6c6" stroke="#1f2a36" stroke-width="2"/>'; [[22,24],[40,22],[30,40],[44,38],[20,40],[34,28]].forEach(function(p){ s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#2d5f8b"/>'; }); }
    if(k==='rutherford'){ s+='<circle cx="32" cy="32" r="4" fill="#b3261e"/>'; [[10,32],[52,20],[40,54]].forEach(function(p){ s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="#2d5f8b"/>'; }); }
    if(k==='bohr'){ s+='<circle cx="32" cy="32" r="12" fill="none" stroke="#5a6875"/><circle cx="32" cy="32" r="24" fill="none" stroke="#5a6875"/><circle cx="32" cy="32" r="4" fill="#b3261e"/><circle cx="44" cy="32" r="3" fill="#2d5f8b"/><circle cx="12" cy="20" r="3" fill="#2d5f8b"/>'; }
    if(k==='schrodinger'){ for(var i=0;i<60;i++){ var a=i*2.399, rr=4+ (i%12)*1.8; s+='<circle cx="'+(32+rr*Math.cos(a)).toFixed(1)+'" cy="'+(32+rr*Math.sin(a)).toFixed(1)+'" r="1.5" fill="#2d5f8b" opacity=".6"/>'; } s+='<circle cx="32" cy="32" r="3" fill="#b3261e"/>'; }
    return s+'</svg>';
  }
  var MODELS = [
    {k:'dalton', n:'Dalton', y:L('early 1800s','1803–1808')},
    {k:'thomson', n:'Thomson', y:'1904'},
    {k:'rutherford', n:'Rutherford', y:'1911'},
    {k:'bohr', n:'Bohr', y:'1913'},
    {k:'schrodinger', n:'Schrödinger', y:'1926'}
  ];
  var Qs = [
    {q:'Which was the first model to explain why elements join in fixed, whole-number amounts?', a:'dalton',
      why:L('Dalton said atoms are tiny balls that join in whole-number amounts.','Dalton\'s indivisible atoms of fixed weight explain fixed whole-number combining ratios.')},
    {q:'Which was the first model to include tiny negative particles inside the atom?', a:'thomson',
      why:L('J.J. Thomson found the electron in 1897 and put electrons inside his atom.','Thomson discovered the electron in 1897 and built it into his 1904 model.')},
    {q:'A few particles fired at thin gold foil bounced almost straight back. Which was the first model to explain that?', a:'rutherford',
      why:L('Rutherford said the atom has a tiny, heavy center, the nucleus, that bounces some particles back.','A small, dense, positive nucleus explains the rare large-angle scattering seen in 1909.')},
    {q:'Hydrogen gives off only certain colors of light. Which was the first model to explain that?', a:'bohr',
      why:L('Bohr\'s fixed energy levels explain exactly which colors hydrogen gives off.','Transitions between Bohr\'s fixed energy levels give hydrogen\'s exact spectral lines.')},
    {q:L('Which was the first model where electrons are fuzzy clouds instead of tiny balls on paths?','Which was the first model to replace definite electron paths with probability clouds, in a way that could be extended to atoms with many electrons?'), a:'schrodinger',
      why:L('Schrödinger\'s math gives clouds of where an electron is likely to be.','Schrödinger\'s wave mechanics gives orbitals, and it could be extended to atoms with many electrons, where Bohr\'s model failed.')},
    {q:'Something lost: which model puts electrons on fixed rings, like rungs on a ladder, the picture teachers still draw?', a:'bohr', loss:true,
      why:L('Bohr\'s rings are easy to draw. The newer cloud model is more accurate, but it gave up that simple picture.','Bohr\'s drawable orbits were traded away for far better predictions: a small Kuhn loss.')}
  ];
  var right=0, missed=[];
  function row(clickable, mark){
    return '<div class="models">'+MODELS.map(function(m){
      var tagname = clickable ? 'button' : 'div';
      var hl = mark===m.k ? ' style="border-color:#2e7d4f;background:#eaf5ee"' : '';
      return '<'+tagname+' class="m" data-k="'+m.k+'"'+hl+'>'+svg(m.k)+'<b>'+m.n+'</b><span>'+m.y+'</span></'+tagname+'>'; }).join('')+'</div>';
  }
  function intro(){
    el('<h1>Atom Through Time</h1>'+tag(9)+
      '<p>Five models of the atom, from the early 1800s to 1926. Each one explained something the one before couldn\'t.</p>'+row(false)+
      '<div class="sticky">Tap the model that answers each question. The models stay on screen the whole time.</div>'+
      '<button class="btn main" id="go">Start</button>');
    document.getElementById('go').onclick = function(){ ask(0); };
  }
  function ask(i){
    if(i>=Qs.length) return finish();
    var Q=Qs[i], misses=0;
    function render(note){
      el('<h2>'+(Q.loss?'Something lost':'Question '+(i+1)+' of '+(Qs.length-1))+'</h2>'+row(true)+'<p class="q">'+esc(Q.q)+'</p>'+(note||''));
      app.querySelectorAll('button.m').forEach(function(b){ b.onclick=function(){ pick(b.dataset.k); }; });
    }
    function pick(k){
      if(k===Q.a){ if(misses===0) right++; else missed.push(i+1); done(true); }
      else { misses++; if(misses>=2){ missed.push(i+1); done(false); } else render('<div class="feedback wrong"><b class="v">Not that one.</b>Look at the years. Which came first that could explain it?</div>'); }
    }
    function done(ok){
      var m = MODELS.filter(function(x){return x.k===Q.a;})[0];
      el('<h2>'+(Q.loss?'Something lost':'Question '+(i+1)+' of '+(Qs.length-1))+'</h2>'+row(false, Q.a)+'<p class="q">'+esc(Q.q)+'</p>'+
        '<div class="feedback'+(ok?'':' wrong')+'"><b class="v">'+(ok?'Yes: ':'It\'s ')+m.n+'.</b>'+esc(Q.why)+'</div>'+
        '<button class="btn main" id="n">'+(i<Qs.length-1?'Next':'Close the notebook')+'</button>');
      document.getElementById('n').onclick = function(){ ask(i+1); };
    }
    render();
  }
  function finish(){
    var text = ['done — Atom Through Time ('+level+')', 'Right on the first try: '+right+' of '+Qs.length+' (including the "something lost" question)'].join('\n');
    finishScreen('Atom Through Time', text,
      '<div class="sticky">Each model solved new puzzles. But the newest one gave up the easy picture, and teachers still draw Bohr\'s rings. Progress, but toward what?</div>',
      function(){ right=0; missed=[]; intro(); });
  }
  intro();
})();
</script>
</body>
</html>
