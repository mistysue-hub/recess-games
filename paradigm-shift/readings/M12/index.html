<style>
  :root{--paper:#fbfbf4;--grid:#d3e2ef;--margin:#e7a3a3;--ink:#1f2a36;--soft:#56636f;--pencil:#2d5f8b;--red:#b3261e;
        --sticky:#fff2a8;--hi:#ffe866;--card:#ffffff;--line:#c9d6e2;--tape:rgba(214,226,236,.85)}
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip}
  body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:19px;line-height:1.62}
  .page{max-width:760px;margin:0 auto;padding:22px 20px 56px 56px;position:relative;min-height:100vh}
  .page::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:var(--margin)}
  .ink-line{position:absolute;left:35px;top:0;width:4px;height:0;background:var(--red);border-radius:2px}
  .ink-line::after{content:"";position:absolute;left:-4px;bottom:-6px;width:12px;height:12px;border-radius:50%;background:var(--red)}
  .tag{font-family:"Special Elite",ui-monospace,monospace;color:var(--soft);font-size:15px;margin:0 0 10px}
  h1,h2,h3{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;line-height:1.2;text-wrap:balance}
  h1{font-size:clamp(28px,6vw,38px);margin:0 0 6px}
  h2{font-size:24px;margin:34px 0 8px}
  h2 span{padding:0 6px;margin-left:-6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
     background:linear-gradient(transparent 52%,var(--hi) 52%,var(--hi) 90%,transparent 90%)}
  h3{font-size:20px;margin:24px 0 6px}
  p{margin:10px 0;max-width:64ch} li{max-width:62ch;margin:6px 0} ul,ol{padding-left:26px}
  strong{font-weight:700}
  .lede{font-size:1.18em;line-height:1.55;max-width:56ch}
  /* the taped-in sketch */
  .sketch{position:relative;margin:18px 0 20px;max-width:420px;background:var(--card);padding:14px 14px 8px;
          box-shadow:0 1px 0 var(--line),3px 5px 0 rgba(31,42,54,.08);transform:rotate(-1.2deg)}
  .sketch::before,.sketch::after{content:"";position:absolute;top:-10px;width:70px;height:22px;background:var(--tape)}
  .sketch::before{left:22px;transform:rotate(-6deg)} .sketch::after{right:22px;transform:rotate(5deg)}
  .sketch svg{display:block;width:100%;height:auto}
  .sketch svg path,.sketch svg circle,.sketch svg ellipse,.sketch svg rect{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sketch .ink{stroke:var(--ink);stroke-width:3} .sketch .red{stroke:var(--red);stroke-width:3}
  .sketch .pencil{stroke:var(--pencil);stroke-width:2;opacity:.8} .sketch .thin{stroke-width:2}
  .sketch .dash{stroke-dasharray:6 7} .sketch .fill.red{fill:var(--red)} .sketch .fill.ink,.sketch .fill.small{fill:var(--ink)}
  .sketch .pencil.fill{fill:var(--pencil)}
  .sketch figcaption{font-family:"Special Elite",ui-monospace,monospace;color:var(--pencil);font-size:15px;margin:4px 2px 2px}
  /* pencil timeline for dated history */
  .timeline{padding:0 0 0 28px;margin:16px 0;position:relative}
  .timeline::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;width:2px;background:var(--pencil);opacity:.55}
  .timeline p{position:relative;margin:0 0 16px}
  .timeline .entry::before{content:"";position:absolute;left:-27px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--pencil)}
  .timeline .entry > strong:first-child{display:block;font-family:"Special Elite",ui-monospace,monospace;font-weight:400;color:var(--pencil);font-size:18px}
  .timeline .note{color:var(--ink);padding:10px 14px;background:rgba(255,255,255,.7);border-radius:4px}
  /* index card */
  .card{position:relative;background:var(--card);margin:26px 0;padding:16px 18px;max-width:60ch;transform:rotate(.8deg);
        box-shadow:3px 5px 0 rgba(31,42,54,.1);background-image:linear-gradient(transparent 33px,#f2b8b8 33px,#f2b8b8 35px,transparent 35px)}
  .card .tape{position:absolute;top:-11px;left:50%;width:84px;height:22px;margin-left:-42px;background:var(--tape);transform:rotate(-3deg)}
  .card-title,.sticky-title,.anomaly-title{font-family:"Special Elite",ui-monospace,monospace;font-size:17px;margin:0 0 6px}
  .card-title{color:var(--red)}
  .now{position:relative;background:var(--card);margin:26px 0;padding:14px 18px 12px 18px;max-width:60ch;border:2px solid var(--pencil);border-radius:3px;
       transform:rotate(-.5deg);box-shadow:3px 5px 0 rgba(45,95,139,.18)}
  .now::before{content:"";position:absolute;top:-9px;left:22px;width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .now-title{font-family:"Special Elite",ui-monospace,monospace;color:var(--pencil);font-size:17px;margin:0 0 6px}
  .logbox{background:var(--card);margin:26px 0;padding:14px 16px;max-width:62ch;border:2px dashed var(--red);border-radius:4px}
  .logbox h3{margin:0 0 4px;font-size:19px;color:var(--red)}
  .logbox p{margin:4px 0;font-size:16px;color:var(--soft)}
  .logbox textarea{width:100%;min-height:96px;margin:8px 0;padding:10px;font:inherit;font-size:17px;color:var(--ink);background:var(--paper);
       border:1px solid var(--line);border-radius:4px;resize:vertical}
  .logbox textarea:focus-visible,.logbox button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
  .logbox button{font:inherit;font-size:16px;padding:9px 14px;border-radius:6px;border:0;background:var(--red);color:#fff;cursor:pointer}
  .logbox .status{display:inline-block;margin-left:10px;font-size:15px;color:var(--pencil)}
  .logbox details{margin-top:12px} .logbox summary{cursor:pointer;font-size:16px;color:var(--pencil)}
  .logbox ol{margin:8px 0 0;padding-left:22px;font-size:16px} .logbox li{margin:6px 0}
  .logbox li b{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;color:var(--red)}
  .glossary{background:var(--card);border-left:6px solid var(--pencil);padding:4px 18px 8px;margin:28px 0;box-shadow:3px 5px 0 rgba(31,42,54,.08)}
  .glossary h2{margin-top:14px}
  .sticky{display:block;background:var(--sticky);padding:16px 18px;margin:28px 0;box-shadow:3px 4px 0 rgba(0,0,0,.12);transform:rotate(-.6deg);max-width:62ch}
  .sticky p{margin:4px 0}
  .anomaly{color:var(--red);margin:24px 0;padding-left:14px;border-left:3px dashed var(--red)}
  .anomaly p{margin:3px 0}
  .tablewrap{overflow-x:auto;margin:14px 0}
  table{border-collapse:collapse;font-size:16px;background:var(--card)}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;color:var(--pencil)}
  hr{border:0;border-top:1px solid var(--line);margin:30px 0 8px}
  hr + p{font-size:15px;color:var(--soft)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .stamp{display:inline-block;margin:28px 0 8px;padding:10px 16px;border:3px solid var(--red);color:var(--red);border-radius:6px;
         font-family:"Special Elite",ui-monospace,monospace;font-size:18px;transform:rotate(-2deg)}
  .stamp b{font-weight:400;text-decoration:underline}
  @media (max-width:480px){ .page{padding:18px 14px 44px 42px} .page::before{left:24px} .ink-line{left:23px} body{font-size:18px} }
  @media (prefers-reduced-motion:no-preference){
    .sketch path,.sketch circle,.sketch ellipse,.sketch rect{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease-out forwards}
    .sketch .dash{animation:none;stroke-dashoffset:0}
    @keyframes draw{to{stroke-dashoffset:0}}
  }
  @media (prefers-reduced-motion:reduce){ .sketch,.card,.sticky,.stamp{transform:none} }
  /* scroll motion (only when JS adds .anim, so text is never hidden without it) */
  body.anim .rv{opacity:0;translate:var(--dx,0) 18px;transition:opacity .55s ease-out,translate .75s cubic-bezier(.2,.9,.25,1.05)}
  body.anim .rv.in{opacity:1;translate:0 0}
  body.anim h2{opacity:0}
  body.anim h2.pop{opacity:1;animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{scale:.4;rotate:-4deg}60%{scale:1.08;rotate:1deg}100%{scale:1;rotate:0deg}}
  .burst{position:absolute;pointer-events:none;z-index:5;width:0;height:0}
  .burst i{position:absolute;left:0;top:0;display:block;border-radius:50%}
  .burst b{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;border:4px solid var(--red)}
  h2{position:relative}
</style>

<script>
  var LEVELS = {"core": "<h1>Module 12: Your Own Revolution<\/h1>\n<p class=\"lede\">Kuhn's book has sold more than a million copies, and his word \"paradigm\" escaped from science into everyday talk. But the idea started with one person changing his own mind about something he thought he understood. This module is about yours.<\/p>\n<h2><span>The last anomaly is you<\/span><\/h2>\n<p>You've watched scientists change their minds about oxygen, comets, planets, continents and atoms. Now think about your own mind.<\/p>\n<p>Is there something you used to be sure about, and now see completely differently? Maybe how a game or sport really works, how something in nature works, or a rule you thought was true. Think about:<\/p>\n<ul>\n<li><strong>Your old paradigm.<\/strong> What did you believe, and what did it help you explain?<\/li>\n<li><strong>The anomaly.<\/strong> What didn't fit? Did you ignore it at first, like the students who saw the trick cards as normal?<\/li>\n<li><strong>The crisis.<\/strong> Was there a moment when the old view stopped working?<\/li>\n<li><strong>The switch.<\/strong> What made you change? New evidence, a new explanation, or someone you trusted?<\/li>\n<li><strong>What you lost.<\/strong> Did the old view do anything the new one doesn't?<\/li>\n<\/ul>\n<p>If your story doesn't fit Kuhn's pattern, that's interesting too. Maybe minds don't always change the way he said science does.<\/p>\n<h2><span>The map of the thinkers<\/span><\/h2>\n<p>In this course you met a lot of thinkers. Here they are in one place:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Thinker<\/th>\n<th>Big idea, in one line<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Francis Bacon (1620)<\/td>\n<td>Gather careful observations and build up to laws, step by step.<\/td>\n<\/tr>\n<tr>\n<td>The Vienna Circle (1920s–30s)<\/td>\n<td>Only statements you could check by observation are meaningful.<\/td>\n<\/tr>\n<tr>\n<td>Karl Popper (1934)<\/td>\n<td>Science means bold guesses you try hard to prove wrong.<\/td>\n<\/tr>\n<tr>\n<td>Norwood Russell Hanson (1958)<\/td>\n<td>What you see depends on what you already know.<\/td>\n<\/tr>\n<tr>\n<td>Thomas Kuhn (1962)<\/td>\n<td>Science works inside paradigms, and changes them in revolutions.<\/td>\n<\/tr>\n<tr>\n<td>Duhem and Quine<\/td>\n<td>You can always save a theory by blaming something else.<\/td>\n<\/tr>\n<tr>\n<td>Imre Lakatos (1970)<\/td>\n<td>Judge a theory by whether it keeps predicting new things.<\/td>\n<\/tr>\n<tr>\n<td>Paul Feyerabend (1975)<\/td>\n<td>No single method fits all of science.<\/td>\n<\/tr>\n<tr>\n<td>Helen Longino (1990)<\/td>\n<td>Science is trustworthy when a community welcomes criticism.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>In the game, you'll place each one on a map with two questions:<\/p>\n<ul>\n<li><strong>What makes science trustworthy?<\/strong> Rules and logic, or a community of people?<\/li>\n<li><strong>What is science for?<\/strong> Getting closer to the truth, or making useful predictions?<\/li>\n<\/ul>\n<p>Then you'll place yourself.<\/p>\n<h2><span>A map is a paradigm too<\/span><\/h2>\n<p>Here's one last twist. A map with two lines forces every thinker into nine boxes. That makes the ideas easy to compare, but it also squashes them. Kuhn might say the map is a little paradigm: it helps you see some things and hides others.<\/p>\n<h2><span>Your next edition<\/span><\/h2>\n<p>If you were writing the next edition of this course, what would you add, cut or change? Which anomaly from your log would you fix first?<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Before Kuhn, \"paradigm\" was best known as a grammar word, used for a model example like a verb you practice so you can do others like it. Kuhn's book turned it into a word people use about business, sports and everyday life.<\/p><\/aside>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Every thinker on the map is still argued about. Philosophers today don't agree on who was right, and many think each one saw part of the picture. Is that a sign philosophy of science has failed, or a sign it's working?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look at your whole log one last time. Add anything new you noticed in this module.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>The course ends with you. Endings that make the reader the hero are a storytelling trick, and textbooks use tricks too.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 12: Your Own Revolution<\/h1>\n<p class=\"lede\"><em>The Structure of Scientific Revolutions<\/em> has sold over a million copies and pushed the word \"paradigm\" into ordinary speech. Kuhn's framework started with a personal reversal: a summer afternoon in 1947 when Aristotle suddenly made sense to him. This last module turns the framework on you.<\/p>\n<h2><span>Kuhn on yourself<\/span><\/h2>\n<p>Kuhn developed his ideas about whole scientific communities, and he was cautious about stretching them to individuals. Still, his own story began with a personal gestalt switch: the summer of 1947, when Aristotle's physics suddenly made sense. Use that as permission to test his framework on your own thinking.<\/p>\n<p>Pick a belief you once held firmly and now don't, about a subject, a person, yourself, or how something works. Then ask:<\/p>\n<ul>\n<li><strong>Paradigm.<\/strong> What did the old belief let you explain or predict? What questions did it make seem important?<\/li>\n<li><strong>Anomaly.<\/strong> What didn't fit, and how long did you explain it away? Did you, like the Bruner and Postman subjects, see the anomaly as something normal at first?<\/li>\n<li><strong>Crisis.<\/strong> Was there a period when the old view stopped working but you had nothing to replace it with?<\/li>\n<li><strong>Switch.<\/strong> Did you change because of evidence, a new explanation, a person, or something else? Was it sudden, like a gestalt switch, or gradual?<\/li>\n<li><strong>Loss.<\/strong> Did the new view lose anything the old one gave you, a Kuhn loss?<\/li>\n<\/ul>\n<p>Then test the test: where does your story <em>not<\/em> fit Kuhn's pattern? An honest misfit is more useful than a forced match.<\/p>\n<h2><span>The map<\/span><\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Thinker<\/th>\n<th>Core claim<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bacon (<em>Novum Organum<\/em>, 1620)<\/td>\n<td>Careful induction from observations builds secure general laws.<\/td>\n<\/tr>\n<tr>\n<td>Vienna Circle (1920s–30s)<\/td>\n<td>Meaning requires possible verification by experience; logic plus observation justifies science.<\/td>\n<\/tr>\n<tr>\n<td>Popper (1934; 1963)<\/td>\n<td>Falsifiability marks science; progress comes from bold conjectures and severe tests; theories can gain verisimilitude.<\/td>\n<\/tr>\n<tr>\n<td>Hanson (1958)<\/td>\n<td>Observation is theory-laden.<\/td>\n<\/tr>\n<tr>\n<td>Kuhn (1962)<\/td>\n<td>Normal science within paradigms, punctuated by revolutions; progress \"from,\" not \"toward.\"<\/td>\n<\/tr>\n<tr>\n<td>Duhem (1906) and Quine (1951)<\/td>\n<td>Hypotheses face evidence only in bundles, so no single test is decisive.<\/td>\n<\/tr>\n<tr>\n<td>Lakatos (1970)<\/td>\n<td>Research programmes are progressive or degenerating.<\/td>\n<\/tr>\n<tr>\n<td>Feyerabend (1975)<\/td>\n<td>No universal method; proliferation of rival ideas is healthy.<\/td>\n<\/tr>\n<tr>\n<td>Laudan (1977)<\/td>\n<td>Progress means problem-solving effectiveness, not approach to truth.<\/td>\n<\/tr>\n<tr>\n<td>van Fraassen (1980)<\/td>\n<td>Science aims at empirical adequacy, not truth about unobservables.<\/td>\n<\/tr>\n<tr>\n<td>Longino (1990)<\/td>\n<td>Objectivity is a property of communities that permit transformative criticism.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The game asks you to place each on two axes:<\/p>\n<ul>\n<li><strong>Source of trust:<\/strong> method and logic ← → community and history<\/li>\n<li><strong>Aim of science:<\/strong> truth ← → successful prediction and problem-solving<\/li>\n<\/ul>\n<p>Then place yourself.<\/p>\n<h2><span>Every map is a framework<\/span><\/h2>\n<p>A two-axis map is a small paradigm. It makes comparison easy by deciding in advance which differences matter. Lakatos ends up in the middle of both axes, which may say more about the map than about him, and Feyerabend fits no box well. When a thinker resists placement, that is an anomaly for the map, not necessarily a flaw in the thinker.<\/p>\n<h2><span>The next edition<\/span><\/h2>\n<p>Science changes its textbooks after revolutions. This course could change too. Using your Anomaly Log, write the first three changes you'd make to a second edition: what to add, what to cut, which story to tell less tidily.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>You'll change your mind about big things more than once. Kuhn's pattern gives you words for it: what didn't fit, how long you explained it away, and what finally made you switch.<\/p><\/aside>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Before 1962, \"paradigm\" was best known as a grammarian's term for a model example. Kuhn's book made it, and \"paradigm shift,\" into everyday vocabulary, often used far more loosely than he meant. A word's meaning shifting after a book like this is itself a small Kuhnian event.<\/p><\/aside>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Philosophers of science today rarely accept any single thinker on this map whole. Many draw on several, accepting Kuhn's history, Popper's demand for testing, Lakatos's attention to programmes over time, and Longino's focus on communities. Suppose a surprising science claim shows up in the news tomorrow. Which thinker on the map would you trust most to help you decide whether to believe it, and why?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Read your whole log one last time and add anything this module raised.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>Ending a course with \"your own revolution\" makes the learner the hero of the story. That is a storytelling choice, and courses, like textbooks, make them.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var sketch = '<figure class="sketch"><svg viewBox="0 0 320 170" role="img" aria-label="Sketch: a map of ideas, and a compass"><path class="ink" d="M100 20 v130 M30 85 h160"/><circle class="red fill" cx="70" cy="50" r="5"/><circle class="ink fill small" cx="140" cy="60" r="5"/><circle class="ink fill small" cx="128" cy="118" r="5"/><circle class="ink fill small" cx="62" cy="110" r="5"/><circle class="ink" cx="250" cy="85" r="44"/><path class="red fill" d="M250 47 l8 38 -8 38 -8 -38 z"/><path class="pencil" d="M206 85 h88 M250 41 v88"/></svg><figcaption>Fig. 12: a map of ideas, and a compass</figcaption></figure>';
  var body = LEVELS[level].replace(/(<\/h1>)/, '$1' + sketch);
  document.getElementById('body').innerHTML =
    '<p class="tag">Lab notebook, module 12, ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' + body +
    '<p class="stamp">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 12: Your Own Revolution (' + (level === 'core' ? 'Core' : 'Extended') + ')';
  // Anomaly Log box: saved only in this browser, with a Copy button for Rocky
  (function(){
    var N = '12', KEY = 'paradigm-shift:anomaly-log:M';
    var store = null; try { localStorage.setItem('ps-test', '1'); localStorage.removeItem('ps-test'); store = localStorage; } catch(e) {}
    var box = document.createElement('section'); box.className = 'logbox';
    box.innerHTML = '<h3>Add to your log</h3>' +
      '<p>Jot what seemed too tidy, one-sided or left out in this module. ' + (store ? 'It stays on this device.' : 'This page can\'t save here, so copy it before you leave.') + '</p>' +
      '<label for="lg" class="sr">Anomaly Log entry for module 12</label><textarea id="lg" placeholder="Anomaly: ..."></textarea>' +
      '<button type="button" id="cp">Copy for Rocky</button><span class="status" id="st" role="status"></span>' +
      '<details id="past"><summary>Your log so far</summary><ol id="pl"></ol></details>';
    var anchor = document.querySelector('#body .anomaly') || document.querySelector('#body .stamp');
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var ta = box.querySelector('#lg'), st = box.querySelector('#st');
    if (store) { ta.value = store.getItem(KEY + N) || ''; }
    ta.addEventListener('input', function(){ if (store) { try { store.setItem(KEY + N, ta.value); st.textContent = 'Saved'; } catch(e) {} } });
    function list(){
      var pl = box.querySelector('#pl'), n = 0; pl.innerHTML = '';
      for (var i = 1; i <= 12; i++) { var k = (i < 10 ? '0' : '') + i, v = store ? store.getItem(KEY + k) : '';
        if (v && v.trim()) { var li = document.createElement('li'); li.innerHTML = '<b>Module ' + i + ':</b> '; li.appendChild(document.createTextNode(v)); pl.appendChild(li); n++; } }
      box.querySelector('#past').style.display = n ? '' : 'none';
    }
    list(); ta.addEventListener('change', list);
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 12: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch(e) { st.textContent = 'Select your note and copy it.'; } t.remove(); }
      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion: paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
</body>
