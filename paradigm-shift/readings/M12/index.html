<script>
  var LEVELS = {"core": "<h1>Module 12: Your Own Revolution<\/h1>\n<p>Kuhn's book has sold more than a million copies, and his word \"paradigm\" escaped from science into everyday talk. But the idea started with one person changing his own mind about something he thought he understood. This module is about yours.<\/p>\n<h2>The last anomaly is you<\/h2>\n<p>You've watched scientists change their minds about oxygen, comets, planets, continents and atoms. Now think about your own mind.<\/p>\n<p>Is there something you used to be sure about, and now see completely differently? Maybe how a game or sport really works, how something in nature works, or a rule you thought was true. Think about:<\/p>\n<ul>\n<li><strong>Your old paradigm.<\/strong> What did you believe, and what did it help you explain?<\/li>\n<li><strong>The anomaly.<\/strong> What didn't fit? Did you ignore it at first, like the students who saw the trick cards as normal?<\/li>\n<li><strong>The crisis.<\/strong> Was there a moment when the old view stopped working?<\/li>\n<li><strong>The switch.<\/strong> What made you change? New evidence, a new explanation, or someone you trusted?<\/li>\n<li><strong>What you lost.<\/strong> Did the old view do anything the new one doesn't?<\/li>\n<\/ul>\n<p>If your story doesn't fit Kuhn's pattern, that's interesting too. Maybe minds don't always change the way he said science does.<\/p>\n<h2>The map of the thinkers<\/h2>\n<p>In this course you met a lot of thinkers. Here they are in one place:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Thinker<\/th>\n<th>Big idea, in one line<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Francis Bacon (1620)<\/td>\n<td>Gather careful observations and build up to laws, step by step.<\/td>\n<\/tr>\n<tr>\n<td>The Vienna Circle (1920s–30s)<\/td>\n<td>Only statements you could check by observation are meaningful.<\/td>\n<\/tr>\n<tr>\n<td>Karl Popper (1934)<\/td>\n<td>Science means bold guesses you try hard to prove wrong.<\/td>\n<\/tr>\n<tr>\n<td>Norwood Russell Hanson (1958)<\/td>\n<td>What you see depends on what you already know.<\/td>\n<\/tr>\n<tr>\n<td>Thomas Kuhn (1962)<\/td>\n<td>Science works inside paradigms, and changes them in revolutions.<\/td>\n<\/tr>\n<tr>\n<td>Duhem and Quine<\/td>\n<td>You can always save a theory by blaming something else.<\/td>\n<\/tr>\n<tr>\n<td>Imre Lakatos (1970)<\/td>\n<td>Judge a theory by whether it keeps predicting new things.<\/td>\n<\/tr>\n<tr>\n<td>Paul Feyerabend (1975)<\/td>\n<td>No single method fits all of science.<\/td>\n<\/tr>\n<tr>\n<td>Helen Longino (1990)<\/td>\n<td>Science is trustworthy when a community welcomes criticism.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>In the game, you'll place each one on a map with two questions:<\/p>\n<ul>\n<li><strong>What makes science trustworthy?<\/strong> Rules and logic, or a community of people?<\/li>\n<li><strong>What is science for?<\/strong> Getting closer to the truth, or making useful predictions?<\/li>\n<\/ul>\n<p>Then you'll place yourself.<\/p>\n<h2>A map is a paradigm too<\/h2>\n<p>Here's one last twist. A map with two lines forces every thinker into nine boxes. That makes the ideas easy to compare, but it also squashes them. Kuhn might say the map is a little paradigm: it helps you see some things and hides others.<\/p>\n<h2>Your next edition<\/h2>\n<p>If you were writing the next edition of this course, what would you add, cut or change? Which anomaly from your log would you fix first?<\/p>\n<p><strong>Weird but true:<\/strong> Before Kuhn, \"paradigm\" was best known as a grammar word, used for a model example like a verb you practice so you can do others like it. Kuhn's book turned it into a word people use about business, sports and everyday life.<\/p>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Every thinker on the map is still argued about. Philosophers today don't agree on who was right, and many think each one saw part of the picture. Is that a sign philosophy of science has failed, or a sign it's working?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look at your whole log one last time. Add anything new you noticed in this module.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>The course ends with you. Endings that make the reader the hero are a storytelling trick, and textbooks use tricks too.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 12: Your Own Revolution<\/h1>\n<p><em>The Structure of Scientific Revolutions<\/em> has sold over a million copies and pushed the word \"paradigm\" into ordinary speech. Kuhn's framework started with a personal reversal: a summer afternoon in 1947 when Aristotle suddenly made sense to him. This last module turns the framework on you.<\/p>\n<h2>Kuhn on yourself<\/h2>\n<p>Kuhn developed his ideas about whole scientific communities, and he was cautious about stretching them to individuals. Still, his own story began with a personal gestalt switch: the summer of 1947, when Aristotle's physics suddenly made sense. Use that as permission to test his framework on your own thinking.<\/p>\n<p>Pick a belief you once held firmly and now don't, about a subject, a person, yourself, or how something works. Then ask:<\/p>\n<ul>\n<li><strong>Paradigm.<\/strong> What did the old belief let you explain or predict? What questions did it make seem important?<\/li>\n<li><strong>Anomaly.<\/strong> What didn't fit, and how long did you explain it away? Did you, like the Bruner and Postman subjects, see the anomaly as something normal at first?<\/li>\n<li><strong>Crisis.<\/strong> Was there a period when the old view stopped working but you had nothing to replace it with?<\/li>\n<li><strong>Switch.<\/strong> Did you change because of evidence, a new explanation, a person, or something else? Was it sudden, like a gestalt switch, or gradual?<\/li>\n<li><strong>Loss.<\/strong> Did the new view lose anything the old one gave you, a Kuhn loss?<\/li>\n<\/ul>\n<p>Then test the test: where does your story <em>not<\/em> fit Kuhn's pattern? An honest misfit is more useful than a forced match.<\/p>\n<h2>The map<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Thinker<\/th>\n<th>Core claim<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bacon (<em>Novum Organum<\/em>, 1620)<\/td>\n<td>Careful induction from observations builds secure general laws.<\/td>\n<\/tr>\n<tr>\n<td>Vienna Circle (1920s–30s)<\/td>\n<td>Meaning requires possible verification by experience; logic plus observation justifies science.<\/td>\n<\/tr>\n<tr>\n<td>Popper (1934; 1963)<\/td>\n<td>Falsifiability marks science; progress comes from bold conjectures and severe tests; theories can gain verisimilitude.<\/td>\n<\/tr>\n<tr>\n<td>Hanson (1958)<\/td>\n<td>Observation is theory-laden.<\/td>\n<\/tr>\n<tr>\n<td>Kuhn (1962)<\/td>\n<td>Normal science within paradigms, punctuated by revolutions; progress \"from,\" not \"toward.\"<\/td>\n<\/tr>\n<tr>\n<td>Duhem (1906) and Quine (1951)<\/td>\n<td>Hypotheses face evidence only in bundles, so no single test is decisive.<\/td>\n<\/tr>\n<tr>\n<td>Lakatos (1970)<\/td>\n<td>Research programmes are progressive or degenerating.<\/td>\n<\/tr>\n<tr>\n<td>Feyerabend (1975)<\/td>\n<td>No universal method; proliferation of rival ideas is healthy.<\/td>\n<\/tr>\n<tr>\n<td>Laudan (1977)<\/td>\n<td>Progress means problem-solving effectiveness, not approach to truth.<\/td>\n<\/tr>\n<tr>\n<td>van Fraassen (1980)<\/td>\n<td>Science aims at empirical adequacy, not truth about unobservables.<\/td>\n<\/tr>\n<tr>\n<td>Longino (1990)<\/td>\n<td>Objectivity is a property of communities that permit transformative criticism.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The game asks you to place each on two axes:<\/p>\n<ul>\n<li><strong>Source of trust:<\/strong> method and logic ← → community and history<\/li>\n<li><strong>Aim of science:<\/strong> truth ← → successful prediction and problem-solving<\/li>\n<\/ul>\n<p>Then place yourself.<\/p>\n<h2>Every map is a framework<\/h2>\n<p>A two-axis map is a small paradigm. It makes comparison easy by deciding in advance which differences matter. Lakatos ends up in the middle of both axes, which may say more about the map than about him, and Feyerabend fits no box well. When a thinker resists placement, that is an anomaly for the map, not necessarily a flaw in the thinker.<\/p>\n<h2>The next edition<\/h2>\n<p>Science changes its textbooks after revolutions. This course could change too. Using your Anomaly Log, write the first three changes you'd make to a second edition: what to add, what to cut, which story to tell less tidily.<\/p>\n<p><strong>Weird but true:<\/strong> Before 1962, \"paradigm\" was best known as a grammarian's term for a model example. Kuhn's book made it, and \"paradigm shift,\" into everyday vocabulary, often used far more loosely than he meant. A word's meaning shifting after a book like this is itself a small Kuhnian event.<\/p>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Philosophers of science today rarely accept any single thinker on this map whole. Many draw on several, accepting Kuhn's history, Popper's demand for testing, Lakatos's attention to programmes over time, and Longino's focus on communities. Suppose a surprising science claim shows up in the news tomorrow. Which thinker on the map would you trust most to help you decide whether to believe it, and why?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Read your whole log one last time and add anything this module raised.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>Ending a course with \"your own revolution\" makes the learner the hero of the story. That is a storytelling choice, and courses, like textbooks, make them.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  document.getElementById('page').innerHTML =
    '<p class="tag">Lab notebook · Module 12 · ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' +
    LEVELS[level] +
    '<p class="done">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 12: Your Own Revolution · ' + (level === 'core' ? 'Core' : 'Extended');
</script>
