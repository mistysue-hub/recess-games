<script>
  var LEVELS = {"core": "<h1>Module 11: This Course Is a Paradigm<\/h1>\n<p>This reading caught a mistake in itself. While the course was being checked, a reviewer noticed that this module's own list of anomalies didn't match Module 5. It's fixed now. Keep that in mind as you read: a course about science changing its mind had to change its own mind, too.<\/p>\n<h2>Turn the tools around<\/h2>\n<p>For ten modules you've used Kuhn's tools on science: paradigms, exemplars, normal science, anomalies, revolutions. Now point them at something closer: this course.<\/p>\n<h2>How this course came to be<\/h2>\n<p>This course was designed in October 2026 for Recess by its author, with help from an AI assistant. Here are some of the real choices behind it:<\/p>\n<ul>\n<li><strong>No book.<\/strong> Kuhn's <em>The Structure of Scientific Revolutions<\/em> is still under copyright, so this course couldn't show you his words. Every reading was written new.<\/li>\n<li><strong>One course, two levels.<\/strong> The author first asked for two versions, one for grades 5-8 and one for grades 9-12, then chose a single course with two reading levels.<\/li>\n<li><strong>The lab notebook look.<\/strong> A sketchbook look was planned for younger learners. It was dropped so both levels would match.<\/li>\n<li><strong>The examples.<\/strong> Oxygen, comets, planets, playing cards, atoms. Earth science was added in Module 7, partly because the course had leaned so hard on physics, chemistry and astronomy.<\/li>\n<li><strong>Fact-checking.<\/strong> Every reading was checked against sources before you saw it, and the checks caught real mistakes.<\/li>\n<\/ul>\n<h2>The mistakes the course made<\/h2>\n<p>Here's the most Kuhn-like part. Remember Module 1, about tidy textbook stories? The first draft of Module 1 made exactly that mistake.<\/p>\n<p>It said Priestley tested his gas on a mouse and named it \"dephlogisticated air\" in August 1774. Fact-checking showed those things happened months later, in early 1775. The draft had squished a messy timeline into one tidy moment, the very habit Module 1 warns about.<\/p>\n<p>Other catches:<\/p>\n<ul>\n<li>An early draft said the first Leyden jars were coated in metal foil. The first ones were partly filled with water.<\/li>\n<li>Before Module 6 was written, the plan called it \"Too Many Circles,\" based on the popular story that Ptolemy's followers piled on more and more epicycles. Fact-checking showed that story is a myth. The title stayed, with a question mark.<\/li>\n<\/ul>\n<h2>The anomalies you may have logged<\/h2>\n<p>Each module planted an anomaly about the course itself. Here they are, in case your log is lost:<\/p>\n<ol>\n<li>Module 1 told history in a neat order while warning against neat orders.<\/li>\n<li>Module 2 used one example to stand for all science before a paradigm.<\/li>\n<li>Module 3 told only a success story.<\/li>\n<li>Module 4 built a big idea on 28 college students.<\/li>\n<li>Module 5 made the Neptune story sound simple.<\/li>\n<li>Module 6's title repeated a myth.<\/li>\n<li>Module 7 was the first Earth science example.<\/li>\n<li>Module 8 treated one vote as final.<\/li>\n<li>Module 9 drew a five-step staircase.<\/li>\n<li>Module 10 made a crowded debate into a duel.<\/li>\n<\/ol>\n<p>Also left out: almost all science outside Europe and the United States, nearly all biology and medicine, and few women. The ones you met are the mathematician Nicole-Reine Lepaute, the geologist Marie Tharp and the philosopher Helen Longino.<\/p>\n<h2>So, is this course a paradigm?<\/h2>\n<p>It has <strong>exemplars<\/strong>, model examples you learned to see the rest through, like the comet and Neptune. It has a <strong>spine<\/strong> it rarely questioned: Kuhn's story of how science works. And like a textbook, it chose a tidy order.<\/p>\n<p><strong>Weird but true:<\/strong> Every mistake listed in this module was found by checking against sources, not by noticing it was wrong. They all looked right. That's what makes a tidy mistake hard to catch.<\/p>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>How would each thinker judge this course? Popper would ask which of its claims could be proven wrong. Longino would ask whether it really welcomed criticism. Kuhn might call it a fair textbook: useful, but hiding its own revolutions. Which judgment fits best?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Read your whole log. Which anomaly bothers you most? If you rewrote this course, what would you change first?<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>A course that admits its mistakes can seem more trustworthy. Is that a reason to trust it, or a clever way to win your trust?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 11: This Course Is a Paradigm<\/h1>\n<p>This reading caught a mistake in itself. While the course was being checked, a reviewer noticed that this module's own list of anomalies misdescribed Module 5. It's fixed now. A module about the course's own blind spots had a blind spot of its own, which is roughly what Kuhn would have predicted.<\/p>\n<h2>The textbook problem, from the inside<\/h2>\n<p>Module 1 introduced Kuhn's claim that textbooks are where a paradigm lives. They teach through <strong>exemplars<\/strong>, present the past as a straight road to the present, and quietly drop the losing side. This course is a kind of textbook. So apply the tools.<\/p>\n<h2>How this course came to be<\/h2>\n<p>This course was designed in October 2026 for the Recess learning platform by its author, with help from an AI assistant. Some of its actual design decisions:<\/p>\n<ul>\n<li><strong>Original readings only.<\/strong> <em>The Structure of Scientific Revolutions<\/em> remains under copyright, so the course could not quote or closely paraphrase it. Every reading teaches Kuhn's ideas in new words, through historical cases he and others used.<\/li>\n<li><strong>One course, two levels.<\/strong> The author first asked for separate versions for grades 5-8 and 9-12, then chose one course whose readings come in two levels, with the level chosen when the course starts.<\/li>\n<li><strong>One look.<\/strong> A sketchbook look was planned for younger learners and dropped so the course would have a single identity: the lab notebook.<\/li>\n<li><strong>A spine and side views.<\/strong> Kuhn was chosen as the spine, with other philosophers as side views. That is itself a framing decision: Popper, Lakatos and Longino appear as commentators on Kuhn's story rather than as authors of their own.<\/li>\n<li><strong>Example selection.<\/strong> The course drew mostly on physics, chemistry and astronomy, as Kuhn did. Geology entered in Module 7 partly to answer that imbalance.<\/li>\n<li><strong>Fact-checking.<\/strong> Every reading was checked against sources, at the author's request, before any learner saw it.<\/li>\n<\/ul>\n<h2>What the fact-checks caught<\/h2>\n<p>The first draft of Module 1, a module about textbooks compressing messy history, compressed messy history. It placed Priestley's mouse test, his breathing the gas and his naming of \"dephlogisticated air\" in August 1774. Sources showed they came in early 1775, after his October 1774 visit to Lavoisier. The draft had produced exactly the tidy sequence it was criticizing.<\/p>\n<p>Other corrections:<\/p>\n<ul>\n<li>An early Module 2 draft described the first Leyden jars as foil-coated. The first ones were partly filled with water; foil came in 1747.<\/li>\n<li>Module 6 was planned under the title \"Too Many Circles,\" drawing on the \"epicycles on epicycles\" story. Fact-checking found that story to be a modern myth. The module kept the title with a question mark and made the myth part of its lesson.<\/li>\n<li>Before writing, the fact-checker also flagged traps the course avoided: claiming Copernicus was more accurate or used fewer circles overall (he needed fewer only to explain the backward loops, as Kuhn himself noted), claiming Thomson named the \"plum pudding,\" and claiming Pluto was demoted for being too small.<\/li>\n<\/ul>\n<p>Kuhn would recognize the pattern. Errors that fit the expected story are the hardest to see, just like the trick cards in Module 4.<\/p>\n<h2>The planted anomalies<\/h2>\n<p>Each module ended by pointing at a weakness in the course. In case your log is incomplete, here they are. Tidy chronology (M1); one example standing for all pre-paradigm science, and only physics and chemistry so far (M2); only success stories (M3); a 28-person study carrying a large idea (M4); astronomy dominance (M5); a myth in a title (M6); late arrival of Earth science (M7); a contested vote treated as final (M8); a five-step staircase (M9); a crowded debate told as a duel (M10).<\/p>\n<p>Beyond those: biology and medicine are almost absent; science outside Europe and the United States appears only briefly, in Module 6; and the few women you met are the mathematician Nicole-Reine Lepaute, the geologist Marie Tharp and the philosopher Helen Longino.<\/p>\n<h2>Is it a paradigm?<\/h2>\n<p>In Kuhn's broad sense, the course has a <strong>disciplinary matrix<\/strong>: a shared vocabulary (paradigm, anomaly, crisis), a set of exemplars (Halley's comet, Neptune, oxygen, the trick cards), and standards for a good answer. Notice how it trained you: by Module 9 you were probably spotting staircases and anomalies automatically. That is the power of a paradigm and its blind spot.<\/p>\n<p><strong>Weird but true:<\/strong> None of the errors listed here was caught because it looked wrong. Each read smoothly and fit the story. They were caught only because someone checked them against sources, which is close to Popper's point about criticism, and Longino's.<\/p>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Apply each thinker to this course. <strong>Popper<\/strong> asks: which claims here could be refuted, and did the course try to refute them? <strong>Lakatos<\/strong> asks: when the course corrected itself, did the corrections lead anywhere new, or only patch? <strong>Longino<\/strong> asks: were there real venues for criticism, and was criticism taken up? The Anomaly Log is one such venue. <strong>Feyerabend<\/strong> might ask what a course with no spine at all would look like. <strong>Kuhn<\/strong> might say: a good textbook, and therefore a hider of its own revolutions. Whose test does the course pass, and whose does it fail?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Read your whole log. Which anomaly matters most? What would the next edition of this course change first?<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>Admitting mistakes makes a source look trustworthy. A course that confesses its errors may be more honest, or may be using honesty to earn trust. How would you tell the difference?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  document.getElementById('page').innerHTML =
    '<p class="tag">Lab notebook · Module 11 · ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' +
    LEVELS[level] +
    '<p class="done">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 11: This Course Is a Paradigm · ' + (level === 'core' ? 'Core' : 'Extended');
</script>
