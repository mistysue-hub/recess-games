<style>
  :root{--paper:#fbfbf4;--grid:#d3e2ef;--margin:#e7a3a3;--ink:#1f2a36;--soft:#56636f;--pencil:#2d5f8b;--red:#b3261e;

  .ink-line::after{content:"";position:absolute;left:-4px;bottom:-6px;width:12px;height:12px;border-radius:50%;background:var(--red)}

     background:linear-gradient(transparent 52%,var(--hi) 52%,var(--hi) 90%,transparent 90%)}

          box-shadow:0 1px 0 var(--line),3px 5px 0 rgba(31,42,54,.08);transform:rotate(-1.2deg)}
  .sketch::before,.sketch::after{content:"";position:absolute;top:-10px;width:70px;height:22px;background:var(--tape)}
  .sketch::before{left:22px;transform:rotate(-6deg)} .sketch::after{right:22px;transform:rotate(5deg)}
  .sketch svg{display:block;width:100%;height:auto}
  .sketch svg path,.sketch svg circle,.sketch svg ellipse,.sketch svg rect{fill:none;stroke-linecap:round;stroke-linejoin:round}

  .sketch .pencil{stroke:var(--pencil);stroke-width:2;opacity:.8} .sketch .thin{stroke-width:2}
  .sketch .dash{stroke-dasharray:6 7} .sketch .fill.red{fill:var(--red)} .sketch .fill.ink,.sketch .fill.small{fill:var(--ink)}

  h2{position:relative}
</style>

<script>
  var LEVELS = {"core": "<h1>Module 11: This Course Is a Paradigm<\/h1>\n<p class=\"lede\">This reading caught a mistake in itself. While the course was being checked, a reviewer noticed that this module's own list of anomalies didn't match Module 5. It's fixed now. Keep that in mind as you read: a course about science changing its mind had to change its own mind, too.<\/p>\n<h2><span>Turn the tools around<\/span><\/h2>\n<p>For ten modules you've used Kuhn's tools on science: paradigms, exemplars, normal science, anomalies, revolutions. Now point them at something closer: this course.<\/p>\n<h2><span>How this course came to be<\/span><\/h2>\n<p>This course was designed in October 2026 for Recess by its author, with help from an AI assistant. Here are some of the real choices behind it:<\/p>\n<ul>\n<li><strong>No book.<\/strong> Kuhn's <em>The Structure of Scientific Revolutions<\/em> is still under copyright, so this course couldn't show you his words. Every reading was written new.<\/li>\n<li><strong>One course, two levels.<\/strong> The author first asked for two versions, one for grades 5-8 and one for grades 9-12, then chose a single course with two reading levels.<\/li>\n<li><strong>The lab notebook look.<\/strong> A sketchbook look was planned for younger learners. It was dropped so both levels would match.<\/li>\n<li><strong>The examples.<\/strong> Oxygen, comets, planets, playing cards, atoms. Earth science was added in Module 7, partly because the course had leaned so hard on physics, chemistry and astronomy.<\/li>\n<li><strong>Fact-checking.<\/strong> Every reading was checked against sources before you saw it, and the checks caught real mistakes.<\/li>\n<\/ul>\n<h2><span>The mistakes the course made<\/span><\/h2>\n<p>Here's the most Kuhn-like part. Remember Module 1, about tidy textbook stories? The first draft of Module 1 made exactly that mistake.<\/p>\n<p>It said Priestley tested his gas on a mouse and named it \"dephlogisticated air\" in August 1774. Fact-checking showed those things happened months later, in early 1775. The draft had squished a messy timeline into one tidy moment, the very habit Module 1 warns about.<\/p>\n<p>Other catches:<\/p>\n<ul>\n<li>An early draft said the first Leyden jars were coated in metal foil. The first ones were partly filled with water.<\/li>\n<li>Before Module 6 was written, the plan called it \"Too Many Circles,\" based on the popular story that Ptolemy's followers piled on more and more epicycles. Fact-checking showed that story is a myth. The title stayed, with a question mark.<\/li>\n<\/ul>\n<h2><span>The anomalies you may have logged<\/span><\/h2>\n<p>Each module planted an anomaly about the course itself. Here they are, in case your log is lost:<\/p>\n<ol>\n<li>Module 1 told history in a neat order while warning against neat orders.<\/li>\n<li>Module 2 used one example to stand for all science before a paradigm.<\/li>\n<li>Module 3 told only a success story.<\/li>\n<li>Module 4 built a big idea on 28 college students.<\/li>\n<li>Module 5 made the Neptune story sound simple.<\/li>\n<li>Module 6's title repeated a myth.<\/li>\n<li>Module 7 was the first Earth science example.<\/li>\n<li>Module 8 treated one vote as final.<\/li>\n<li>Module 9 drew a five-step staircase.<\/li>\n<li>Module 10 made a crowded debate into a duel.<\/li>\n<\/ol>\n<p>Also left out: almost all science outside Europe and the United States, nearly all biology and medicine, and few women. The ones you met are the mathematician Nicole-Reine Lepaute, the geologist Marie Tharp and the philosopher Helen Longino.<\/p>\n<h2><span>So, is this course a paradigm?<\/span><\/h2>\n<p>It has <strong>exemplars<\/strong>, model examples you learned to see the rest through, like the comet and Neptune. It has a <strong>spine<\/strong> it rarely questioned: Kuhn's story of how science works. And like a textbook, it chose a tidy order.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Every mistake listed in this module was found by checking against sources, not by noticing it was wrong. They all looked right. That's what makes a tidy mistake hard to catch.<\/p><\/aside>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>How would each thinker judge this course? Popper would ask which of its claims could be proven wrong. Longino would ask whether it really welcomed criticism. Kuhn might call it a fair textbook: useful, but hiding its own revolutions. Which judgment fits best?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Read your whole log. Which anomaly bothers you most? If you rewrote this course, what would you change first?<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>A course that admits its mistakes can seem more trustworthy. Is that a reason to trust it, or a clever way to win your trust?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 11: This Course Is a Paradigm<\/h1>\n<p class=\"lede\">This reading caught a mistake in itself. While the course was being checked, a reviewer noticed that this module's own list of anomalies misdescribed Module 5. It's fixed now. A module about the course's own blind spots had a blind spot of its own, which is roughly what Kuhn would have predicted.<\/p>\n<h2><span>The textbook problem, from the inside<\/span><\/h2>\n<p>Module 1 introduced Kuhn's claim that textbooks are where a paradigm lives. They teach through <strong>exemplars<\/strong>, present the past as a straight road to the present, and quietly drop the losing side. This course is a kind of textbook. So apply the tools.<\/p>\n<h2><span>How this course came to be<\/span><\/h2>\n<p>This course was designed in October 2026 for the Recess learning platform by its author, with help from an AI assistant. Some of its actual design decisions:<\/p>\n<ul>\n<li><strong>Original readings only.<\/strong> <em>The Structure of Scientific Revolutions<\/em> remains under copyright, so the course could not quote or closely paraphrase it. Every reading teaches Kuhn's ideas in new words, through historical cases he and others used.<\/li>\n<li><strong>One course, two levels.<\/strong> The author first asked for separate versions for grades 5-8 and 9-12, then chose one course whose readings come in two levels, with the level chosen when the course starts.<\/li>\n<li><strong>One look.<\/strong> A sketchbook look was planned for younger learners and dropped so the course would have a single identity: the lab notebook.<\/li>\n<li><strong>A spine and side views.<\/strong> Kuhn was chosen as the spine, with other philosophers as side views. That is itself a framing decision: Popper, Lakatos and Longino appear as commentators on Kuhn's story rather than as authors of their own.<\/li>\n<li><strong>Example selection.<\/strong> The course drew mostly on physics, chemistry and astronomy, as Kuhn did. Geology entered in Module 7 partly to answer that imbalance.<\/li>\n<li><strong>Fact-checking.<\/strong> Every reading was checked against sources, at the author's request, before any learner saw it.<\/li>\n<\/ul>\n<h2><span>What the fact-checks caught<\/span><\/h2>\n<p>The first draft of Module 1, a module about textbooks compressing messy history, compressed messy history. It placed Priestley's mouse test, his breathing the gas and his naming of \"dephlogisticated air\" in August 1774. Sources showed they came in early 1775, after his October 1774 visit to Lavoisier. The draft had produced exactly the tidy sequence it was criticizing.<\/p>\n<p>Other corrections:<\/p>\n<ul>\n<li>An early Module 2 draft described the first Leyden jars as foil-coated. The first ones were partly filled with water; foil came in 1747.<\/li>\n<li>Module 6 was planned under the title \"Too Many Circles,\" drawing on the \"epicycles on epicycles\" story. Fact-checking found that story to be a modern myth. The module kept the title with a question mark and made the myth part of its lesson.<\/li>\n<li>Before writing, the fact-checker also flagged traps the course avoided: claiming Copernicus was more accurate or used fewer circles overall (he needed fewer only to explain the backward loops, as Kuhn himself noted), claiming Thomson named the \"plum pudding,\" and claiming Pluto was demoted for being too small.<\/li>\n<\/ul>\n<p>Kuhn would recognize the pattern. Errors that fit the expected story are the hardest to see, just like the trick cards in Module 4.<\/p>\n<h2><span>The planted anomalies<\/span><\/h2>\n<p>Each module ended by pointing at a weakness in the course. In case your log is incomplete, here they are. Tidy chronology (M1); one example standing for all pre-paradigm science, and only physics and chemistry so far (M2); only success stories (M3); a 28-person study carrying a large idea (M4); astronomy dominance (M5); a myth in a title (M6); late arrival of Earth science (M7); a contested vote treated as final (M8); a five-step staircase (M9); a crowded debate told as a duel (M10).<\/p>\n<p>Beyond those: biology and medicine are almost absent; science outside Europe and the United States appears only briefly, in Module 6; and the few women you met are the mathematician Nicole-Reine Lepaute, the geologist Marie Tharp and the philosopher Helen Longino.<\/p>\n<h2><span>Is it a paradigm?<\/span><\/h2>\n<p>In Kuhn's broad sense, the course has a <strong>disciplinary matrix<\/strong>: a shared vocabulary (paradigm, anomaly, crisis), a set of exemplars (Halley's comet, Neptune, oxygen, the trick cards), and standards for a good answer. Notice how it trained you: by Module 9 you were probably spotting staircases and anomalies automatically. That is the power of a paradigm and its blind spot.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>Textbooks, news sites and AI chatbots all frame what they tell you, and this course was built with help from an AI assistant. The questions you've been asking here work on any of them.<\/p><\/aside>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>None of the errors listed here was caught because it looked wrong. Each read smoothly and fit the story. They were caught only because someone checked them against sources, which is close to Popper's point about criticism, and Longino's.<\/p><\/aside>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Apply each thinker to this course. <strong>Popper<\/strong> asks: which claims here could be refuted, and did the course try to refute them? <strong>Lakatos<\/strong> asks: when the course corrected itself, did the corrections lead anywhere new, or only patch? <strong>Longino<\/strong> asks: were there real venues for criticism, and was criticism taken up? The Anomaly Log is one such venue. <strong>Feyerabend<\/strong> might ask what a course with no spine at all would look like. <strong>Kuhn<\/strong> might say: a good textbook, and therefore a hider of its own revolutions. Whose test does the course pass, and whose does it fail?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Read your whole log. Which anomaly matters most? What would the next edition of this course change first?<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>Admitting mistakes makes a source look trustworthy. A course that confesses its errors may be more honest, or may be using honesty to earn trust. How would you tell the difference?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var sketch = '<figure class="sketch"><svg viewBox="0 0 320 170" role="img" aria-label="Sketch: this course, under the magnifying glass"><rect class="pencil" x="70" y="22" width="130" height="130" rx="4"/><path class="pencil" d="M86 50 h96 M86 68 h96 M86 86 h70 M86 104 h90 M86 122 h60"/><circle class="ink" cx="196" cy="94" r="38"/><path class="ink" d="M224 122 l46 40"/><path class="red" d="M178 86 h36"/></svg><figcaption>Fig. 11: this course, under the magnifying glass</figcaption></figure>';
  var body = LEVELS[level].replace(/(<\/h1>)/, '$1' + sketch);
  document.getElementById('body').innerHTML =
    '<p class="tag">Lab notebook, module 11, ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' + body +
    '<p class="stamp">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 11: This Course Is a Paradigm (' + (level === 'core' ? 'Core' : 'Extended') + ')';
  // Anomaly Log box: saved only in this browser, with a Copy button for Rocky
  (function(){
    var N = '11', KEY = 'paradigm-shift:anomaly-log:M';
    var store = null; try { localStorage.setItem('ps-test', '1'); localStorage.removeItem('ps-test'); store = localStorage; } catch(e) {}
    var box = document.createElement('section'); box.className = 'logbox';
    box.innerHTML = '<h3>Add to your log</h3>' +
      '<p>Jot what seemed too tidy, one-sided or left out in this module. ' + (store ? 'It stays on this device.' : 'This page can\'t save here, so copy it before you leave.') + '</p>' +
      '<label for="lg" class="sr">Anomaly Log entry for module 11</label><textarea id="lg" placeholder="Anomaly: ..."></textarea>' +
      '<button type="button" id="cp">Copy for Rocky</button><span class="status" id="st" role="status"></span>' +
      '<details id="past"><summary>Your log so far</summary><ol id="pl"></ol></details>';
    var anchor = document.querySelector('#body .anomaly') || document.querySelector('#body .stamp');
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var ta = box.querySelector('#lg'), st = box.querySelector('#st');
    if (store) { ta.value = store.getItem(KEY + N) || ''; }
    ta.addEventListener('input', function(){ if (store) { try { store.setItem(KEY + N, ta.value); st.textContent = 'Saved'; } catch(e) {} } });
    function list(){
      var pl = box.querySelector('#pl'), n = 0; pl.innerHTML = '';
      for (var i = 1; i <= 12; i++) { var k = (i < 10 ? '0' : '') + i, v = store ? store.getItem(KEY + k) : '';
        if (v && v.trim()) { var li = document.createElement('li'); li.innerHTML = '<b>Module ' + i + ':</b> '; li.appendChild(document.createTextNode(v)); pl.appendChild(li); n++; } }
      box.querySelector('#past').style.display = n ? '' : 'none';
    }
    list(); ta.addEventListener('change', list);
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 11: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();

      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion: paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
