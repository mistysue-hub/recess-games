<script>
  var LEVELS = {"core": "<h1>Module 5: The Puzzle That Won't Solve<\/h1>\n<p>In December 1612, Galileo pointed his telescope near Jupiter and drew a faint dot in his notebook. He thought it was a star. It was actually the planet Neptune. Nobody would find Neptune on purpose for another 234 years, and it took a planet that wouldn't behave to do it.<\/p>\n<h2>A planet off course<\/h2>\n<p>In 1781, the astronomer William Herschel discovered a new planet, Uranus. Astronomers used Newton's laws to work out exactly where it should be, year after year. But Uranus wouldn't cooperate. By the 1840s it was clearly drifting away from where the math said it should be.<\/p>\n<p>That's an <strong>anomaly<\/strong>: a result that doesn't fit what your paradigm expects. Astronomers had two choices:<\/p>\n<ol>\n<li>Newton's laws are wrong.<\/li>\n<li>Newton's laws are fine, and something we can't see is pulling on Uranus.<\/li>\n<\/ol>\n<h2>The rescue<\/h2>\n<p>Two mathematicians, Urbain Le Verrier in France and John Couch Adams in England, chose option 2. Each worked out where an unseen planet would have to be to pull Uranus off course. Le Verrier sent his prediction to the Berlin Observatory.<\/p>\n<p>On the night of September 23, 1846, the astronomer Johann Galle pointed his telescope where Le Verrier said to look. In less than an hour he found a planet that wasn't on any star map, less than one degree from the predicted spot. It was Neptune.<\/p>\n<p>The anomaly became one of Newton's greatest victories.<\/p>\n<h2>The same trick, again<\/h2>\n<p>Then Le Verrier noticed another problem. Mercury, the planet closest to the Sun, doesn't trace exactly the same oval every time. Its whole orbit slowly turns. Newton's laws explained most of that turning, but not all. A tiny bit was left over (today we know it's 43 arcseconds every hundred years). (An arcsecond is a very small piece of a degree.)<\/p>\n<p>Le Verrier tried the trick that had worked so well. In 1859 he suggested an unseen planet even closer to the Sun. It was named Vulcan. That same year, an amateur astronomer said he'd seen it crossing the Sun. For decades, astronomers searched. Vulcan was never found.<\/p>\n<p>In 1915, Albert Einstein published a new theory of gravity called general relativity. It explained Mercury's leftover 43 arcseconds exactly, with no extra planet at all. Mercury's anomaly hadn't been a missing planet. It was a crack in Newton's laws.<\/p>\n<h2>Why scientists don't give up right away<\/h2>\n<p>Kuhn's point: an anomaly almost never makes scientists drop their paradigm right away. First they try to fix it, and often they should. The Neptune rescue worked brilliantly. The Vulcan rescue failed. At the start, nobody could tell which kind of anomaly they were looking at.<\/p>\n<p>Only some anomalies refuse every fix. Those are the ones that can push a science into crisis, which is what Module 6 is about.<\/p>\n<p><strong>Weird but true:<\/strong> When Galileo saw Neptune in 1612, it had just started its own backward loop and was barely moving. That may be why he thought it was a star. The planet's own odd motion helped it hide.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Anomaly:<\/strong> a result that doesn't fit what the paradigm expects.<\/li>\n<li><strong>Rescue:<\/strong> explaining an anomaly by adding something new (like an unseen planet) while keeping the paradigm.<\/li>\n<li><strong>General relativity:<\/strong> Einstein's 1915 theory of gravity, which replaced Newton's for some problems.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Two philosophers, Pierre Duhem and W. V. O. Quine, pointed out that you can never test just one idea by itself. Every prediction also depends on other things you assumed, like how many planets there are or whether your telescope works. So when a prediction fails, you can always blame one of those other things and save your main theory. If that's true, how should scientists decide when to stop saving a theory?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>This module made the Neptune story sound simple. People still argue about how much credit Adams deserves compared with Le Verrier.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 5: The Puzzle That Won't Solve<\/h1>\n<p>On December 28, 1612, and again on January 27, 1613, Galileo plotted a faint object near Jupiter in his notebook. It was Neptune. He took it for a fixed star; it was barely moving at the time. Neptune would wait 234 years to be found on purpose, and the search began with a planet that refused to follow the rules.<\/p>\n<h2>Uranus misbehaves<\/h2>\n<p>William Herschel discovered Uranus on March 13, 1781, the first planet found since antiquity. Astronomers soon computed its orbit from Newton's laws, and in 1821 Alexis Bouvard published detailed tables of its expected positions. Within a couple of decades, Uranus had drifted measurably off those tables.<\/p>\n<p>Faced with an anomaly like this, a scientist can question the paradigm, or question something else. Questioning Newton, whose mechanics had already predicted Halley's comet, seemed far less reasonable than supposing something unseen was at work.<\/p>\n<h2>Rescue, version one: Neptune<\/h2>\n<p>In 1845–46 Urbain Le Verrier in Paris and John Couch Adams in Cambridge independently calculated the position of an undiscovered planet whose gravity could account for Uranus's wandering. Le Verrier published his result and sent it to the Berlin Observatory. On the night of September 23–24, 1846, Johann Galle, assisted by Heinrich d'Arrest, found the planet within an hour of starting the search, less than a degree from Le Verrier's predicted position.<\/p>\n<p>Neptune turned an anomaly into a triumph. It became the textbook example of a scientific prediction. (How much credit Adams deserves is still debated; his work was mostly unpublished at the time.)<\/p>\n<h2>Rescue, version two: Vulcan<\/h2>\n<p>Mercury's orbit is an ellipse whose closest point to the Sun, its perihelion, slowly rotates. Newtonian gravity, counting the pulls of the other planets, accounts for nearly all of that rotation. Le Verrier found a stubborn remainder, later fixed at about 43 arcseconds per century. (One arcsecond is 1/3,600 of a degree.)<\/p>\n<p>In 1859 Le Verrier proposed the same cure that had worked for Uranus: unseen matter inside Mercury's orbit. That year, an amateur astronomer, Edmond Lescarbault, reported seeing a small body cross the Sun, and in January 1860 Le Verrier announced the planet, named Vulcan. Sightings came and went for decades. None held up.<\/p>\n<p>In 1915 Einstein's general theory of relativity predicted Mercury's extra 43 arcseconds with no new planet at all. The anomaly had been pointing at a limit of Newton's theory itself.<\/p>\n<h2>What the two stories teach together<\/h2>\n<p>The two rescues used exactly the same reasoning. One succeeded spectacularly and one failed completely. That is Kuhn's central point about anomalies. Scientists do not, and should not, abandon a successful paradigm at the first mismatch; the mismatch is usually a puzzle for normal science, and often it gets solved. But there is no rule that tells you in advance which anomalies will yield to a fix and which ones mark the edge of the paradigm. Mercury's anomaly was known for more than half a century before a new theory replaced Newton's.<\/p>\n<p>Rescues of this kind keep happening. In 1930 Wolfgang Pauli proposed an undetectable particle to explain why energy seemed to go missing in a type of radioactive decay, rather than give up conservation of energy. The neutrino was finally detected in 1956. In 2011 the OPERA experiment reported neutrinos apparently arriving faster than light; in 2012 the cause turned out to be a fiber-optic cable that wasn't fully plugged in. Sometimes the fix is a new particle. Sometimes it's the equipment. Sometimes, as with Mercury, it's the theory.<\/p>\n<p><strong>Weird but true:<\/strong> When Galileo first recorded Neptune, the planet had just begun its retrograde loop and was nearly stationary, too slow to stand out in his small telescope. One physicist argued in 2009 that he may have noticed it shift, though others doubt it. If so, he saw an anomaly and filed it as noise.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Anomaly:<\/strong> an observation that violates the expectations of the current paradigm.<\/li>\n<li><strong>Auxiliary hypothesis:<\/strong> an extra assumption used alongside a theory to make a prediction (for example, \"there is no planet beyond Uranus\").<\/li>\n<li><strong>Perihelion precession:<\/strong> the slow rotation of a planet's orbit, measured at its point closest to the Sun.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Pierre Duhem (<em>The Aim and Structure of Physical Theory<\/em>, 1906) and W. V. O. Quine (\"Two Dogmas of Empiricism,\" 1951) argued that hypotheses are never tested in isolation. A prediction always depends on a bundle of assumptions: the theory, the number of planets, how the instruments work, and more. When the prediction fails, logic alone doesn't say which assumption to blame. This <strong>Duhem–Quine thesis<\/strong> is why the Neptune rescue was legitimate, and also why a determined defender can save almost any theory. It is a problem for Popper's falsification from Module 3: if one failed prediction never forces you to drop a particular theory, what does? Imagine you're an astronomer in 1880. Mercury's orbit is still off, and after twenty years of searching nobody has found Vulcan. How much longer do you keep searching before you suspect Newton?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>Two of the last three modules have been about astronomy, and most of the rest about physics and chemistry. Astronomy's predictions are unusually clean. Would these lessons look the same in biology or medicine?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  document.getElementById('page').innerHTML =
    '<p class="tag">Lab notebook · Module 5 · ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' +
    LEVELS[level] +
    '<p class="done">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 5: The Puzzle That Won&#x27;t Solve · ' + (level === 'core' ? 'Core' : 'Extended');
</script>
