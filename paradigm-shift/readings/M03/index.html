<script>
  var LEVELS = {"core": "<h1>Module 3: Puzzle-Solving<\/h1>\n<p>Edmond Halley made a prediction he knew he would never get to check. A comet, he said, would come back in 1758. Halley would have been 102 years old by then.<\/p>\n<h2>A puzzle with a promise<\/h2>\n<p>When you open a jigsaw puzzle, you know three things before you start. There is a picture. All the pieces fit. And if you can't finish it, the problem is you, not the puzzle.<\/p>\n<p>Thomas Kuhn thought most of the science that scientists do every day works the same way. He called it <strong>normal science<\/strong>. Inside a paradigm, scientists work on puzzles the paradigm promises can be solved. Their job isn't to question the paradigm. Their job is to finish the picture.<\/p>\n<h2>The comet that came back<\/h2>\n<p>In the late 1600s, the English astronomer Edmond Halley studied old records of comets. Three of them, seen in 1531, 1607 and 1682, had very similar paths across the sky. Halley guessed they weren't three comets at all. They were one comet, coming back about every 76 years.<\/p>\n<p>Halley used Isaac Newton's new laws of gravity to work out its path. He predicted the comet would return in 1758. Halley died in 1742, so he never got to find out.<\/p>\n<p>As 1758 got closer, three French mathematicians took on the puzzle: Alexis Clairaut, Joseph Lalande and Nicole-Reine Lepaute. They knew the giant planets Jupiter and Saturn would tug on the comet and slow it down. For months they worked through huge calculations by hand. They predicted the comet would make its closest pass by the Sun in mid-April 1759.<\/p>\n<p>On Christmas night, 1758, a German farmer and amateur astronomer named Johann Palitzsch spotted the comet. It made its closest pass by the Sun on March 13, 1759, about a month off from the prediction. Today we call it Halley's Comet.<\/p>\n<h2>What nobody was doing<\/h2>\n<p>Here's the interesting part. Nobody in this story was trying to find out whether Newton's laws were right. Everyone already trusted them. The question was only: can we do the math well enough to get the date right?<\/p>\n<p>If the comet had been very late, the mathematicians would have checked their math first. That's what Kuhn meant by a puzzle. The rules are trusted, so a failure points back at the puzzle-solver.<\/p>\n<p>Kuhn didn't think this made scientists dull. Normal science makes measurements sharper and sharper. And because scientists expect the pieces to fit, they notice when one really doesn't. You'll see why that matters in Module 5.<\/p>\n<p><strong>Weird but true:<\/strong> Mark Twain was born in 1835, two weeks after Halley's Comet came closest to the Sun. In 1909 he said he expected to \"go out with it\" when it came back. He died on April 21, 1910, one day after its next closest pass.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Normal science:<\/strong> everyday science done inside a paradigm, solving puzzles the paradigm says have answers.<\/li>\n<li><strong>Puzzle (Kuhn's sense):<\/strong> a problem that is sure to have a solution, where failing means the solver needs to try again.<\/li>\n<li><strong>Perihelion<\/strong> (PAIR-ih-HEE-lee-un): a comet's or planet's closest point to the Sun.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Karl Popper, an Austrian-British philosopher, had a very different idea. In a 1934 book he said what makes an idea scientific is that it could be proven wrong. \"All swans are white\" is scientific, because one black swan would prove it false. Popper thought good scientists should try hard to prove their own ideas wrong, not just protect them. He worried that normal science teaches scientists to stop questioning. Who do you think describes good science better, Kuhn or Popper?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>This module picked a puzzle that worked out. Comet predictions that failed don't usually make it into stories like this one.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 3: Puzzle-Solving<\/h1>\n<p>Edmond Halley made a prediction he could not live to see tested: a comet would return in 1758, when he would have been 102. Everyone who checked it would be relying on rules Halley had helped to spread. He had even paid to print Isaac Newton's great book of physics in 1687.<\/p>\n<h2>Science without questioning the rules<\/h2>\n<p>Picture a scientist. You may imagine someone daring to overturn everything we know. Kuhn argued that this picture gets most science backward. Almost all the time, scientists are not testing their field's basic ideas. They are using those ideas to solve problems.<\/p>\n<p>Kuhn called this <strong>normal science<\/strong>, and compared it to puzzle-solving. A real puzzle comes with a guarantee: a solution exists, the rules for reaching it are known, and if you fail, the failure is yours. A crossword clue with no answer isn't a hard puzzle. It's a broken one.<\/p>\n<p>Inside a paradigm, Kuhn said, the important problems come with that guarantee. He sorted normal science into roughly three kinds of work:<\/p>\n<ul>\n<li>measuring more precisely the facts the paradigm says matter;<\/li>\n<li>making the paradigm's predictions match nature more closely;<\/li>\n<li>filling in the paradigm's open details and extending it to new cases.<\/li>\n<\/ul>\n<p>None of these asks whether the paradigm is true. All of them assume it.<\/p>\n<h2>The return of the comet<\/h2>\n<p>The cleanest example comes from the century after Isaac Newton. In 1705 Edmond Halley argued that comets seen in 1531, 1607 and 1682 were one object on a long, stretched orbit, returning about every 76 years. Using Newton's mechanics, he predicted its return in 1758. He died in 1742.<\/p>\n<p>The return became a test of skill, not of Newton. In the late 1750s the French mathematician Alexis Clairaut, working with Joseph Lalande and Nicole-Reine Lepaute, calculated how the gravity of Jupiter and Saturn would delay the comet. The work took months of hand computation. They predicted perihelion, its closest approach to the Sun, for mid-April 1759.<\/p>\n<p>Johann Palitzsch, a German farmer and amateur astronomer, saw it first, on Christmas night 1758. Perihelion came on March 13, 1759, about a month earlier than the forecast. That was a triumph for the calculation, and it made Newton's mechanics look stronger than ever. But notice what was really at stake. If the comet had arrived a year late, the first suspect would have been the arithmetic, or some unknown pull, never Newton's laws.<\/p>\n<h2>Why normal science isn't boring<\/h2>\n<p>It's easy to hear \"normal science\" as an insult. Kuhn meant the opposite. Because a paradigm tells scientists which problems matter and promises they're solvable, it lets them dig deeply into small, hard questions they would never attempt if they were still arguing about basics. Precision instruments, careful measurements and detailed calculations all come from normal science.<\/p>\n<p>It also sets up revolutions. A community that expects every piece to fit is the community best placed to notice when one doesn't. Without sharp expectations there are no surprises. That is the subject of Module 5.<\/p>\n<h2>How people actually test ideas<\/h2>\n<p>In 1960 the psychologist Peter Wason gave volunteers three numbers, 2, 4, 6, and told them the numbers fit a secret rule. Volunteers could propose other sets of three and be told whether each fit. Most quickly formed a guess, like \"even numbers going up by two,\" and then tested only sets that fit their guess: 8, 10, 12; 20, 22, 24. Every test said yes, so they felt sure. Many announced rules far more specific than the real one, which was simply \"any three numbers that go up.\" To find that out, you have to try a set your guess says should fail.<\/p>\n<p>You'll try Wason's task yourself in this module's game.<\/p>\n<p><strong>Weird but true:<\/strong> Mark Twain was born on November 30, 1835, two weeks after that year's perihelion of Halley's Comet. In 1909 he said he expected to go out with it. He died on April 21, 1910, the day after its next perihelion.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Normal science:<\/strong> research inside a paradigm, solving problems the paradigm guarantees are solvable.<\/li>\n<li><strong>Puzzle (Kuhn's sense):<\/strong> a problem with an assured solution and known rules, where failure reflects on the solver.<\/li>\n<li><strong>Falsifiable:<\/strong> able to be shown false by some possible observation.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Karl Popper (1902–1994), in <em>Logik der Forschung<\/em> (1934; in English as <em>The Logic of Scientific Discovery<\/em>, 1959), argued that what separates science from non-science is <strong>falsifiability<\/strong>. A scientific theory must forbid some possible observations. No number of white swans proves \"all swans are white,\" but one black swan refutes it. Popper thought good scientists should state bold theories and then try hard to refute them. From that angle, Kuhn's normal scientist, who takes the paradigm for granted, looked worrying: Popper later wrote that normal science was a danger to science. Wason studied individuals, not scientific communities, but his volunteers behaved more like Kuhn's picture than Popper's ideal: they looked for confirmation, not refutation. Wason's volunteers tested only guesses that could say yes. Is that a flaw people can fix, or just how everyone works until something surprises them?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>The comet story is a success story. Predictions that failed rarely get retold, so a course made only of successes may make normal science look more reliable than it is.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  document.getElementById('page').innerHTML =
    '<p class="tag">Lab notebook · Module 3 · ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' +
    LEVELS[level] +
    '<p class="done">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 3: Puzzle-Solving · ' + (level === 'core' ? 'Core' : 'Extended');
</script>
