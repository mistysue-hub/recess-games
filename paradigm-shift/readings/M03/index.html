<style>
  :root{--paper:#fbfbf4;--grid:#d3e2ef;--margin:#e7a3a3;--ink:#1f2a36;--soft:#56636f;--pencil:#2d5f8b;--red:#b3261e;
        --sticky:#fff2a8;--hi:#ffe866;--card:#ffffff;--line:#c9d6e2;--tape:rgba(214,226,236,.85)}
  *{box-sizing:border-box}
  html,body{margin:0;overflow-x:clip}
  body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:19px;line-height:1.62}
  .page{max-width:760px;margin:0 auto;padding:22px 20px 56px 56px;position:relative;min-height:100vh}
  .page::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:var(--margin)}
  .ink-line{position:absolute;left:35px;top:0;width:4px;height:0;background:var(--red);border-radius:2px}
  .ink-line::after{content:"";position:absolute;left:-4px;bottom:-6px;width:12px;height:12px;border-radius:50%;background:var(--red)}
  .tag{font-family:"Special Elite",ui-monospace,monospace;color:var(--soft);font-size:15px;margin:0 0 10px}
  h1,h2,h3{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;line-height:1.2;text-wrap:balance}

  h2{font-size:24px;margin:34px 0 8px}

     background:linear-gradient(transparent 52%,var(--hi) 52%,var(--hi) 90%,transparent 90%)}
  h3{font-size:20px;margin:24px 0 6px}
  p{margin:10px 0;max-width:64ch} li{max-width:62ch;margin:6px 0} ul,ol{padding-left:26px}
  strong{font-weight:700}

  /* the taped-in sketch */
  .sketch{position:relative;margin:18px 0 20px;max-width:420px;background:var(--card);padding:14px 14px 8px;
          box-shadow:0 1px 0 var(--line),3px 5px 0 rgba(31,42,54,.08);transform:rotate(-1.2deg)}
  .sketch::before,.sketch::after{content:"";position:absolute;top:-10px;width:70px;height:22px;background:var(--tape)}
  .sketch::before{left:22px;transform:rotate(-6deg)} .sketch::after{right:22px;transform:rotate(5deg)}
  .sketch svg{display:block;width:100%;height:auto}
  .sketch svg path,.sketch svg circle,.sketch svg ellipse,.sketch svg rect{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .sketch .ink{stroke:var(--ink);stroke-width:3} .sketch .red{stroke:var(--red);stroke-width:3}
  .sketch .pencil{stroke:var(--pencil);stroke-width:2;opacity:.8} .sketch .thin{stroke-width:2}
  .sketch .dash{stroke-dasharray:6 7} .sketch .fill.red{fill:var(--red)} .sketch .fill.ink,.sketch .fill.small{fill:var(--ink)}

  .sketch figcaption{font-family:"Special Elite",ui-monospace,monospace;color:var(--pencil);font-size:15px;margin:4px 2px 2px}

  .logbox .status{display:inline-block;margin-left:10px;font-size:15px;color:var(--pencil)}
  .logbox details{margin-top:12px} .logbox summary{cursor:pointer;font-size:16px;color:var(--pencil)}
  .logbox ol{margin:8px 0 0;padding-left:22px;font-size:16px} .logbox li{margin:6px 0}
  .logbox li b{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;color:var(--red)}
  .glossary{background:var(--card);border-left:6px solid var(--pencil);padding:4px 18px 8px;margin:28px 0;box-shadow:3px 5px 0 rgba(31,42,54,.08)}
  .glossary h2{margin-top:14px}
  .sticky{display:block;background:var(--sticky);padding:16px 18px;margin:28px 0;box-shadow:3px 4px 0 rgba(0,0,0,.12);transform:rotate(-.6deg);max-width:62ch}

  .anomaly{color:var(--red);margin:24px 0;padding-left:14px;border-left:3px dashed var(--red)}
  .anomaly p{margin:3px 0}
  .tablewrap{overflow-x:auto;margin:14px 0}

  .burst{position:absolute;pointer-events:none;z-index:5;width:0;height:0}
  .burst i{position:absolute;left:0;top:0;display:block;border-radius:50%}
  .burst b{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;border:4px solid var(--red)}
  h2{position:relative}
</style>

<script>
  var LEVELS = {"core": "<h1>Module 3: Puzzle-Solving<\/h1>\n<p class=\"lede\">Edmond Halley made a prediction he knew he would never get to check. A comet, he said, would come back in 1758. Halley would have been 102 years old by then.<\/p>\n<h2><span>A puzzle with a promise<\/span><\/h2>\n<p>When you open a jigsaw puzzle, you know three things before you start. There is a picture. All the pieces fit. And if you can't finish it, the problem is you, not the puzzle.<\/p>\n<p>Thomas Kuhn thought most of the science that scientists do every day works the same way. He called it <strong>normal science<\/strong>. Inside a paradigm, scientists work on puzzles the paradigm promises can be solved. Their job isn't to question the paradigm. Their job is to finish the picture.<\/p>\n<h2><span>The comet that came back<\/span><\/h2>\n<p>In the late 1600s, the English astronomer Edmond Halley studied old records of comets. Three of them, seen in 1531, 1607 and 1682, had very similar paths across the sky. Halley guessed they weren't three comets at all. They were one comet, coming back about every 76 years.<\/p>\n<p>Halley used Isaac Newton's new laws of gravity to work out its path. He predicted the comet would return in 1758. Halley died in 1742, so he never got to find out.<\/p>\n<p>As 1758 got closer, three French mathematicians took on the puzzle: Alexis Clairaut, Joseph Lalande and Nicole-Reine Lepaute. They knew the giant planets Jupiter and Saturn would tug on the comet and slow it down. For months they worked through huge calculations by hand. They predicted the comet would make its closest pass by the Sun in mid-April 1759.<\/p>\n<p>On Christmas night, 1758, a German farmer and amateur astronomer named Johann Palitzsch spotted the comet. It made its closest pass by the Sun on March 13, 1759, about a month off from the prediction. Today we call it Halley's Comet.<\/p>\n<h2><span>What nobody was doing<\/span><\/h2>\n<p>Here's the interesting part. Nobody in this story was trying to find out whether Newton's laws were right. Everyone already trusted them. The question was only: can we do the math well enough to get the date right?<\/p>\n<p>If the comet had been very late, the mathematicians would have checked their math first. That's what Kuhn meant by a puzzle. The rules are trusted, so a failure points back at the puzzle-solver.<\/p>\n<p>Kuhn didn't think this made scientists dull. Normal science makes measurements sharper and sharper. And because scientists expect the pieces to fit, they notice when one really doesn't. You'll see why that matters in Module 5.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Mark Twain was born in 1835, two weeks after Halley's Comet came closest to the Sun. In 1909 he said he expected to \"go out with it\" when it came back. He died on April 21, 1910, one day after its next closest pass.<\/p><\/aside>\n<h2><span>Words for your notebook<\/span><\/h2>\n<ul>\n<li><strong>Normal science:<\/strong> everyday science done inside a paradigm, solving puzzles the paradigm says have answers.<\/li>\n<li><strong>Puzzle (Kuhn's sense):<\/strong> a problem that is sure to have a solution, where failing means the solver needs to try again.<\/li>\n<li><strong>Perihelion<\/strong> (PAIR-ih-HEE-lee-un): a comet's or planet's closest point to the Sun.<\/li>\n<\/ul>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Karl Popper, an Austrian-British philosopher, had a very different idea. In a 1934 book he said what makes an idea scientific is that it could be proven wrong. \"All swans are white\" is scientific, because one black swan would prove it false. Popper thought good scientists should try hard to prove their own ideas wrong, not just protect them. He worried that normal science teaches scientists to stop questioning. Who do you think describes good science better, Kuhn or Popper?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This module picked a puzzle that worked out. Comet predictions that failed don't usually make it into stories like this one.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 3: Puzzle-Solving<\/h1>\n<p class=\"lede\">Edmond Halley made a prediction he could not live to see tested: a comet would return in 1758, when he would have been 102. Everyone who checked it would be relying on rules Halley had helped to spread. He had even paid to print Isaac Newton's great book of physics in 1687.<\/p>\n<h2><span>Science without questioning the rules<\/span><\/h2>\n<p>Picture a scientist. You may imagine someone daring to overturn everything we know. Kuhn argued that this picture gets most science backward. Almost all the time, scientists are not testing their field's basic ideas. They are using those ideas to solve problems.<\/p>\n<p>Kuhn called this <strong>normal science<\/strong>, and compared it to puzzle-solving. A real puzzle comes with a guarantee: a solution exists, the rules for reaching it are known, and if you fail, the failure is yours. A crossword clue with no answer isn't a hard puzzle. It's a broken one.<\/p>\n<p>Inside a paradigm, Kuhn said, the important problems come with that guarantee. He sorted normal science into roughly three kinds of work:<\/p>\n<ul>\n<li>measuring more precisely the facts the paradigm says matter;<\/li>\n<li>making the paradigm's predictions match nature more closely;<\/li>\n<li>filling in the paradigm's open details and extending it to new cases.<\/li>\n<\/ul>\n<p>None of these asks whether the paradigm is true. All of them assume it.<\/p>\n<h2><span>The return of the comet<\/span><\/h2>\n<p>The cleanest example comes from the century after Isaac Newton. In 1705 Edmond Halley argued that comets seen in 1531, 1607 and 1682 were one object on a long, stretched orbit, returning about every 76 years. Using Newton's mechanics, he predicted its return in 1758. He died in 1742.<\/p>\n<p>The return became a test of skill, not of Newton. In the late 1750s the French mathematician Alexis Clairaut, working with Joseph Lalande and Nicole-Reine Lepaute, calculated how the gravity of Jupiter and Saturn would delay the comet. The work took months of hand computation. They predicted perihelion, its closest approach to the Sun, for mid-April 1759.<\/p>\n<p>Johann Palitzsch, a German farmer and amateur astronomer, saw it first, on Christmas night 1758. Perihelion came on March 13, 1759, about a month earlier than the forecast. That was a triumph for the calculation, and it made Newton's mechanics look stronger than ever. But notice what was really at stake. If the comet had arrived a year late, the first suspect would have been the arithmetic, or some unknown pull, never Newton's laws.<\/p>\n<h2><span>Why normal science isn't boring<\/span><\/h2>\n<p>It's easy to hear \"normal science\" as an insult. Kuhn meant the opposite. Because a paradigm tells scientists which problems matter and promises they're solvable, it lets them dig deeply into small, hard questions they would never attempt if they were still arguing about basics. Precision instruments, careful measurements and detailed calculations all come from normal science.<\/p>\n<p>It also sets up revolutions. A community that expects every piece to fit is the community best placed to notice when one doesn't. Without sharp expectations there are no surprises. That is the subject of Module 5.<\/p>\n<h2><span>How people actually test ideas<\/span><\/h2>\n<p>In 1960 the psychologist Peter Wason gave volunteers three numbers, 2, 4, 6, and told them the numbers fit a secret rule. Volunteers could propose other sets of three and be told whether each fit. Most quickly formed a guess, like \"even numbers going up by two,\" and then tested only sets that fit their guess: 8, 10, 12; 20, 22, 24. Every test said yes, so they felt sure. Many announced rules far more specific than the real one, which was simply \"any three numbers that go up.\" To find that out, you have to try a set your guess says should fail.<\/p>\n<p>You'll try Wason's task yourself in this module's game.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>Most science today is still puzzle-solving inside a framework. Weather forecasts, drug trials and particle colliders all take their basic theories for granted and work on the details. And Wason's trap is still easy to fall into: it's tempting to search only for evidence that agrees with you.<\/p><\/aside>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Mark Twain was born on November 30, 1835, two weeks after that year's perihelion of Halley's Comet. In 1909 he said he expected to go out with it. He died on April 21, 1910, the day after its next perihelion.<\/p><\/aside>\n<section class=\"glossary\"><h2><span>Terms<\/span><\/h2><ul>\n<li><strong>Normal science:<\/strong> research inside a paradigm, solving problems the paradigm guarantees are solvable.<\/li>\n<li><strong>Puzzle (Kuhn's sense):<\/strong> a problem with an assured solution and known rules, where failure reflects on the solver.<\/li>\n<li><strong>Falsifiable:<\/strong> able to be shown false by some possible observation.<\/li>\n<\/ul><\/section>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Karl Popper (1902–1994), in <em>Logik der Forschung<\/em> (1934; in English as <em>The Logic of Scientific Discovery<\/em>, 1959), argued that what separates science from non-science is <strong>falsifiability<\/strong>. A scientific theory must forbid some possible observations. No number of white swans proves \"all swans are white,\" but one black swan refutes it. Popper thought good scientists should state bold theories and then try hard to refute them. From that angle, Kuhn's normal scientist, who takes the paradigm for granted, looked worrying: Popper later wrote that normal science was a danger to science. Wason studied individuals, not scientific communities, but his volunteers behaved more like Kuhn's picture than Popper's ideal: they looked for confirmation, not refutation. Wason's volunteers tested only guesses that could say yes. Is that a flaw people can fix, or just how everyone works until something surprises them?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>The comet story is a success story. Predictions that failed rarely get retold, so a course made only of successes may make normal science look more reliable than it is.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var sketch = '<figure class="sketch"><svg viewBox="0 0 320 170" role="img" aria-label="Sketch: a comet on a long, stretched orbit"><ellipse class="pencil dash" cx="170" cy="92" rx="130" ry="46"/><circle class="red" cx="50" cy="92" r="9"/><path class="red thin" d="M50 80 v-6 M50 104 v6 M38 92 h-6 M62 92 h6 M41 83 l-4 -4 M59 101 l4 4 M41 101 l-4 4 M59 83 l4 -4"/><circle class="ink" cx="258" cy="62" r="6"/><path class="ink thin" d="M262 58 L312 34 M264 64 L314 50 M262 68 L310 66"/></svg><figcaption>Fig. 3: a comet on a long, stretched orbit</figcaption></figure>';
  var body = LEVELS[level].replace(/(<\/h1>)/, '$1' + sketch);
  document.getElementById('body').innerHTML =
    '<p class="tag">Lab notebook, module 3, ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' + body +
    '<p class="stamp">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 3: Puzzle-Solving (' + (level === 'core' ? 'Core' : 'Extended') + ')';
  // Anomaly Log box: saved only in this browser, with a Copy button for Rocky
  (function(){
    var N = '03', KEY = 'paradigm-shift:anomaly-log:M';
    var store = null; try { localStorage.setItem('ps-test', '1'); localStorage.removeItem('ps-test'); store = localStorage; } catch(e) {}
    var box = document.createElement('section'); box.className = 'logbox';
    box.innerHTML = '<h3>Add to your log</h3>' +
      '<p>Jot what seemed too tidy, one-sided or left out in this module. ' + (store ? 'It stays on this device.' : 'This page can\'t save here, so copy it before you leave.') + '</p>' +
      '<label for="lg" class="sr">Anomaly Log entry for module 3</label><textarea id="lg" placeholder="Anomaly: ..."></textarea>' +
      '<button type="button" id="cp">Copy for Rocky</button><span class="status" id="st" role="status"></span>' +
      '<details id="past"><summary>Your log so far</summary><ol id="pl"></ol></details>';
    var anchor = document.querySelector('#body .anomaly') || document.querySelector('#body .stamp');
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var ta = box.querySelector('#lg'), st = box.querySelector('#st');
    if (store) { ta.value = store.getItem(KEY + N) || ''; }
    ta.addEventListener('input', function(){ if (store) { try { store.setItem(KEY + N, ta.value); st.textContent = 'Saved'; } catch(e) {} } });
    function list(){
      var pl = box.querySelector('#pl'), n = 0; pl.innerHTML = '';
      for (var i = 1; i <= 12; i++) { var k = (i < 10 ? '0' : '') + i, v = store ? store.getItem(KEY + k) : '';
        if (v && v.trim()) { var li = document.createElement('li'); li.innerHTML = '<b>Module ' + i + ':</b> '; li.appendChild(document.createTextNode(v)); pl.appendChild(li); n++; } }
      box.querySelector('#past').style.display = n ? '' : 'none';
    }
    list(); ta.addEventListener('change', list);
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 3: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();

  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion: paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
