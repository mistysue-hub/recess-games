<script>
  var LEVELS = {"core": "<h1>Module 7: Revolution: The Drifting Continents<\/h1>\n<p>The Atlantic Ocean is getting wider while you read this, at about the speed your fingernails grow. A hundred years ago, almost every geologist would have told you that was impossible.<\/p>\n<h2>A map that looks like a puzzle<\/h2>\n<p>Look at a world map. The bulge of South America looks like it could tuck into the curve of Africa, like two puzzle pieces. Lots of people have noticed that. In 1912, a German scientist named Alfred Wegener decided it wasn't a coincidence.<\/p>\n<p>Wegener studied weather and the atmosphere, not rocks. But in a lecture in January 1912, and in a book in 1915, he made a bold claim: long ago, the continents were joined in one giant landmass, now called Pangaea. Over millions of years, they drifted apart. He called his idea <strong>continental drift<\/strong>.<\/p>\n<h2>Wegener's evidence<\/h2>\n<p>Wegener didn't just point at a map. He collected clues:<\/p>\n<ul>\n<li><strong>The fit.<\/strong> The edges of the continents, out where the shallow sea floor drops off, fit together even better than the coastlines.<\/li>\n<li><strong>Fossils.<\/strong> Fossils of <em>Mesosaurus<\/em>, a small reptile that lived in fresh water, are found in both South America and southern Africa. It couldn't have swum across an ocean. Fossils of an ancient fern-like plant called <em>Glossopteris<\/em> turn up on continents now far apart.<\/li>\n<li><strong>Rocks.<\/strong> Rock types and formations on one side of the Atlantic match the other.<\/li>\n<li><strong>Ice and coal.<\/strong> Scratches left by ancient glaciers appear in places that are hot today, like parts of Africa and India. Antarctica has coal with fossils of plants that need warmth.<\/li>\n<\/ul>\n<h2>Why almost nobody believed him<\/h2>\n<p>Most geologists said no, and some were harsh about it. In 1926, at a big meeting in New York, most speakers argued against him.<\/p>\n<p>They had real reasons. The biggest: Wegener couldn't explain <em>how<\/em>. What force could push a whole continent through the solid rock of the ocean floor? The forces he suggested were far too weak. He also guessed the continents were moving much faster than they really are. And he wasn't a geologist, which didn't help.<\/p>\n<p>Wegener died in 1930 on an expedition across the ice in Greenland. Continental drift looked like a dead idea.<\/p>\n<h2>The ocean floor talks back<\/h2>\n<p>After World War II, scientists mapped the ocean floor in detail. In 1952, a geologist and mapmaker named Marie Tharp noticed something in the data: a deep valley running down the middle of a huge underwater mountain range in the Atlantic. Her research partner, Bruce Heezen, brushed it off at first. Months later, he came around.<\/p>\n<p>In the early 1960s, Harry Hess suggested that new sea floor forms at these underwater ridges and spreads outward. Rocks on the sea floor carry stripes of magnetism. In 1963, Fred Vine and Drummond Matthews suggested the stripes were a record of spreading, so they should match on both sides of a ridge, like a mirror. By 1966, ship surveys showed they did.<\/p>\n<p>Now there was a mechanism. By the late 1960s, most geologists had switched to a new idea called <strong>plate tectonics<\/strong>: Earth's surface is broken into giant plates that move a few centimeters a year.<\/p>\n<p>That's a revolution: not just a new fact, but a new way of seeing the whole Earth.<\/p>\n<p><strong>Weird but true:<\/strong> Marie Tharp mapped the bottom of the ocean without being allowed on the research ships. For years women weren't permitted to work on them, so the men collected the depth measurements and Tharp turned the numbers into maps. She finally went to sea in 1968.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Continental drift:<\/strong> Wegener's idea that the continents have moved over time.<\/li>\n<li><strong>Mechanism:<\/strong> an explanation of <em>how<\/em> something happens.<\/li>\n<li><strong>Plate tectonics:<\/strong> the modern theory that Earth's surface is made of moving plates.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Paul Feyerabend, an Austrian philosopher, argued in 1975 that there's no single scientific method that all good science follows. Sometimes, he said, scientists have to stick with an idea even when the evidence and the rules seem to be against it. Wegener's few supporters might be an example. Should scientists ever keep an idea most experts reject?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>This is the course's first big example from Earth science. Why do you think it took until Module 7?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 7: Revolution: The Drifting Continents<\/h1>\n<p>The Atlantic is widening by a few centimeters a year, roughly the rate your fingernails grow. In 1926, a room full of expert geologists was asked to consider that continents move, and most of them said no. They had good reasons. They were also wrong.<\/p>\n<h2>An outsider's hypothesis<\/h2>\n<p>On January 6, 1912, in Frankfurt, the meteorologist Alfred Wegener presented an idea most geologists would spend half a century rejecting: the continents move. His 1915 book, <em>The Origin of Continents and Oceans<\/em>, went through several revised editions. It argued that the continents were once joined in a single landmass, which he later named Pangaea, which broke apart and drifted.<\/p>\n<p>The evidence Wegener assembled was broad:<\/p>\n<ul>\n<li><strong>Geometric fit.<\/strong> Matched along the edges of their continental shelves rather than the present coastlines, South America and Africa fit closely.<\/li>\n<li><strong>Fossils.<\/strong> <em>Mesosaurus<\/em>, a freshwater reptile, occurs in both Brazil and southern Africa; the seed fern <em>Glossopteris<\/em> is spread across today's southern continents. (Decades later, in 1969, the reptile <em>Lystrosaurus<\/em> turned up in Antarctica too.)<\/li>\n<li><strong>Geology.<\/strong> Rock types and geological structures line up across the Atlantic.<\/li>\n<li><strong>Ancient climates.<\/strong> Glacial deposits in Africa, India and Australia, places now warm, and coal with fossil plants in Antarctica.<\/li>\n<\/ul>\n<h2>The rejection was not just stubbornness<\/h2>\n<p>At a 1926 symposium of the American Association of Petroleum Geologists in New York, most speakers opposed drift; the chairman was one of the few supporters. It is tempting to tell this as closed-minded experts versus a lone genius. The real story is messier.<\/p>\n<p>Wegener's critics had serious objections. He had no workable <strong>mechanism<\/strong>. The forces he proposed, such as tidal forces and one he called \"flight from the poles,\" were far too weak to move continents. And his picture of continents plowing through solid ocean floor made little physical sense. His estimates of the drift rate, some of them meters a year, were far too fast. And alternative explanations existed for the fossils, such as now-sunken land bridges. Wegener was also an outsider to geology. In 1931 the British geologist Arthur Holmes suggested heat-driven convection in the mantle as a possible engine, but without supporting data it drew little attention. Wegener had already died, in November 1930, on the Greenland ice sheet.<\/p>\n<h2>Evidence from the sea floor<\/h2>\n<p>The turn came from the oceans. In 1952 Marie Tharp, plotting sonar depth data with Bruce Heezen at Columbia University, found a rift valley running along the crest of the Mid-Atlantic Ridge. Heezen dismissed it as \"girl talk\" for months, until earthquake locations turned out to follow her rift. Harry Hess proposed <strong>seafloor spreading<\/strong> in a 1960 report, published in 1962: new crust forms at mid-ocean ridges and moves outward. The sea floor is striped with magnetic bands that record flips of Earth's magnetic field. In 1963 Fred Vine and Drummond Matthews proposed that spreading made these stripes. If so, the pattern on one side of a ridge should mirror the other. Ship surveys confirmed the symmetry by 1966. (Lawrence Morley had the same idea independently, but two journals rejected his paper.) By 1967–68, with earthquake data added, <strong>plate tectonics<\/strong> had become the framework of geophysics.<\/p>\n<h2>Revolution, Kuhn-style<\/h2>\n<p>Notice what plate tectonics is not: it isn't simply Wegener vindicated. In plate tectonics, continents don't plow through the ocean floor; they ride on plates that include the ocean floor. The vocabulary, the mechanism and the problems geologists worked on all changed. That is closer to what Kuhn meant by a revolution: not one fact added, but a different picture of what Earth is and which questions matter. It also shows why Kuhn rejected the simple \"the evidence was always there\" story. The same fossils meant one thing to Wegener and another to his critics until a new framework made them fit.<\/p>\n<p><strong>Weird but true:<\/strong> For roughly two decades Marie Tharp was not allowed aboard her institution's research vessels; women were barred from shipboard work. Heezen and others collected soundings, and Tharp built the maps from their numbers, earthquake records and older profiles. She joined an expedition at sea in 1968.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Mechanism:<\/strong> an account of the process that produces an effect.<\/li>\n<li><strong>Seafloor spreading:<\/strong> the formation of new oceanic crust at mid-ocean ridges and its movement away from them.<\/li>\n<li><strong>Plate tectonics:<\/strong> the theory that Earth's outer shell is divided into moving plates.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Paul Feyerabend, in <em>Against Method<\/em> (1975), argued that no single methodological rule fits the whole history of science, and that great advances often broke the rules of their day. He joked that the only principle that survives is \"anything goes,\" and many readers take that as a warning to rule-makers rather than a recipe. Feyerabend also defended keeping minority ideas alive, because they can be the source of the evidence that later overturns the majority. Wegener's few supporters seem to fit his case. But would a rule of \"keep every rejected idea alive\" have helped, or would it have kept many wrong ideas going too?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>Six modules passed before the course used an example from Earth science. Physics, chemistry and astronomy have dominated, with one detour into psychology. Philosophers of science have been accused of the same habit.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
