<script>
  var LEVELS = {"core": "<h1>Module 10: Kuhn vs. Popper, 1965<\/h1>\n<p class=\"lede\">Philosophers can argue fiercely. In 1946, Karl Popper argued so hard with another philosopher, Ludwig Wittgenstein, that (by Popper's account) Wittgenstein waved a fireplace poker at him. People who were in the room remember it differently, and nobody agrees exactly what happened. Nineteen years later, Popper had another big argument, this time with Thomas Kuhn.<\/p>\n<h2><span>The big meeting<\/span><\/h2>\n<p>In July 1965, philosophers from many countries met at Bedford College in London. One session became famous: Thomas Kuhn on one side, Karl Popper and his supporters on the other. (Paul Feyerabend was supposed to be there too, but he couldn't come.) Their papers were later collected in a book, published in 1970.<\/p>\n<p>They agreed on a lot. Both thought science goes through big changes. Both thought science isn't just piling up facts. But they disagreed sharply about one thing.<\/p>\n<h2><span>Defend it, or try to break it?<\/span><\/h2>\n<p><strong>Popper's side.<\/strong> A good scientist should always try to prove their own theory wrong. Science moves forward by bold guesses and tough tests. Popper wrote a paper called \"Normal Science and its Dangers.\" He worried that Kuhn's \"normal scientist,\" who trusts the paradigm and just solves puzzles, was a badly trained scientist who had stopped asking hard questions.<\/p>\n<p><strong>Kuhn's side.<\/strong> If scientists dropped their theory every time something went wrong, they'd never get anywhere. Remember Neptune: sticking with Newton led to a great discovery. Every theory has problems. Scientists need to commit to a paradigm long enough to find out what it can really do.<\/p>\n<p>Some critics went further and said Kuhn made science sound like a crowd that follows whatever its group believes. Kuhn said that's not what he meant.<\/p>\n<h2><span>How scientists choose<\/span><\/h2>\n<p>So how <em>do<\/em> scientists choose between two theories? Several years later, Kuhn gave his answer. He said scientists share five values. A good theory should be:<\/p>\n<ol>\n<li><strong>Accurate:<\/strong> its predictions match observations.<\/li>\n<li><strong>Consistent:<\/strong> it doesn't contradict itself or other accepted science.<\/li>\n<li><strong>Broad in scope:<\/strong> it explains many kinds of things, not just one.<\/li>\n<li><strong>Simple:<\/strong> it uses fewer separate ideas to explain things.<\/li>\n<li><strong>Fruitful:<\/strong> it leads to new discoveries.<\/li>\n<\/ol>\n<p>Here's the catch. These values can point in different directions. Kuhn used Copernicus as his example. In 1543, Copernicus's model wasn't more accurate than Ptolemy's. It clashed with the accepted physics of the day, which said Earth doesn't move. But it explained the planets' backward loops in a simpler way.<\/p>\n<p>So two smart, honest scientists in 1543 could weigh those values differently and choose different theories. Neither one would be crazy. That, Kuhn said, is how theory choice really works.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>The \"poker\" story shows the problem this whole course is about. Several smart people were in the same room, saw the same thing, and came away telling different stories.<\/p><\/aside>\n<h2><span>Words for your notebook<\/span><\/h2>\n<ul>\n<li><strong>Values (for theories):<\/strong> qualities that make a theory good, like accuracy and simplicity.<\/li>\n<li><strong>Theory choice:<\/strong> how scientists decide which of two theories to accept.<\/li>\n<li><strong>Commitment:<\/strong> sticking with an idea long enough to test what it can do.<\/li>\n<\/ul>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Helen Longino, an American philosopher, said nobody is perfectly unbiased, not even scientists. What makes science trustworthy is that scientists check each other's work, and that criticism from many different people is welcomed and taken seriously. Does that sound more like Kuhn's side, Popper's side, or something new?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This module made the debate sound like a two-person duel. Many other philosophers were part of it, and some of them disagreed with both Kuhn and Popper.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 10: Kuhn vs. Popper, 1965<\/h1>\n<p class=\"lede\">On October 25, 1946, at a Cambridge philosophy club, Karl Popper and Ludwig Wittgenstein argued so heatedly that, in Popper's telling, Wittgenstein brandished a fireplace poker before storming out. Witnesses' accounts conflict, and the episode may have been dramatized in the retelling. Popper liked an argument. In 1965 he had another one, with Kuhn.<\/p>\n<h2><span>Bedford College, July 1965<\/span><\/h2>\n<p>The International Colloquium in the Philosophy of Science met at Bedford College, London, from July 11 to 17, 1965. Its central symposium put Kuhn's <em>Structure<\/em>, then three years old, before Karl Popper and the circle around him at the London School of Economics. Paul Feyerabend could not attend, and John Watkins stepped in for him and for Lakatos as a main speaker. The papers, much expanded, appeared in 1970 as <em>Criticism and the Growth of Knowledge<\/em>, edited by Imre Lakatos and Alan Musgrave.<\/p>\n<h2><span>What they agreed on, and didn't<\/span><\/h2>\n<p>The disagreement is easy to exaggerate. Kuhn and Popper both rejected the view that science grows by piling up verified facts; both gave revolutions a central place; both treated testing against experience as essential.<\/p>\n<p>Their real conflict was over <strong>normal science<\/strong>. Popper's contribution, \"Normal Science and its Dangers,\" granted that normal science exists but called it a danger to science and even to civilization. In his view, the normal scientist has been taught badly, trained to apply rules rather than to criticize them. For Popper, the scientific attitude is permanent criticism, and a scientist should always be trying to refute their best theory.<\/p>\n<p>Kuhn's answer was that permanent criticism would be fatal. A community that abandoned its framework at every anomaly would never develop any framework far enough to discover which anomalies matter. Commitment, even dogmatism up to a point, is what makes deep testing possible: the Neptune rescue required trusting Newton. In Kuhn's account, the criticism Popper praised mostly happens during crises, not every day.<\/p>\n<p>Critics, Lakatos among them, charged that Kuhn had made theory change a matter of \"mob psychology.\" That charge followed Kuhn for years. In the 1970s, David Bloor and Barry Barnes at Edinburgh went further than Kuhn. Their <strong>Strong Programme<\/strong> in the sociology of science proposed that the same kinds of causes, social ones included, should explain both true and false scientific beliefs. Kuhn distanced himself sharply from this, most clearly in a lecture published in 1992 as \"The Trouble with the Historical Philosophy of Science.\"<\/p>\n<h2><span>Kuhn's answer: shared values<\/span><\/h2>\n<p>In a 1973 lecture, published in 1977 as \"Objectivity, Value Judgment, and Theory Choice,\" Kuhn gave his most direct reply. Scientists choosing between theories share five standard criteria: <strong>accuracy, consistency, scope, simplicity and fruitfulness.<\/strong> They are real and they matter. But they work as values, not algorithms. Applied to the same case they can conflict, and individual scientists can weigh them differently.<\/p>\n<p>Take the case Kuhn himself used, Copernicus. His Sun-centered model made no better predictions than the old one until Kepler reworked it. A moving Earth also clashed with the physics everyone accepted at the time. Its pull was elegance: the planets' backward loops fell out of Earth's own motion, instead of needing extra machinery for each planet. Kepler and Galileo found that elegance persuasive. Many careful astronomers did not, and they weren't being foolish. For Kuhn, that variability is not a flaw in scientific rationality. It is how a community spreads its bets while a new paradigm is still unproven.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>When expert advice changes, as it has about dietary fat or about resting after a concussion, people have the same argument Kuhn and Popper did: should experts hold steady until the evidence is overwhelming, or keep revising as they go?<\/p><\/aside>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>The poker incident is a small lesson in doing history. Smart, attentive eyewitnesses in the same room gave accounts that can't all be true. And the most widely told version is the one Popper himself wrote down, nearly three decades later.<\/p><\/aside>\n<section class=\"glossary\"><h2><span>Terms<\/span><\/h2><ul>\n<li><strong>Normal science (Popper's critique):<\/strong> routine work that, for Popper, risks replacing criticism with training.<\/li>\n<li><strong>Theory choice:<\/strong> how a community comes to accept one theory over a rival.<\/li>\n<li><strong>Strong Programme:<\/strong> an Edinburgh-based approach in sociology of science that seeks the same kinds of causal explanations for true and false beliefs.<\/li>\n<\/ul><\/section>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Helen Longino, in <em>Science as Social Knowledge<\/em> (1990), relocates objectivity from individuals to communities. No scientist is free of background assumptions. A community's methods are objective to the degree that they permit <strong>transformative criticism<\/strong>: there must be public venues for criticism, responsiveness to it, shared standards, and tempered equality of intellectual authority among participants. Her view takes Kuhn's point that science is a social enterprise, and Popper's point that criticism is essential, and makes the quality of a community's criticism the test. Which of those four does this course, with its Anomaly Log, meet least well?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>The module frames 1965 as Kuhn versus Popper. The 1970 volume also contains papers by Lakatos, Feyerabend, Watkins, Toulmin and others, several of whom disagreed with both.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};

    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
</body>
