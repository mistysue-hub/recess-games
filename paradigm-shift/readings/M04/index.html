<script>
  var LEVELS = {"core": "<h1>Module 4: Seeing What You Expect<\/h1>\n<p>Quick: what color is the six of spades? Black, of course. So what would you see if someone flashed a red one in front of you? In 1949, almost everyone saw something that wasn't there.<\/p>\n<h2>The trick deck<\/h2>\n<p>In 1949, two psychologists at Harvard, Jerome Bruner and Leo Postman, played a sneaky game with 28 students.<\/p>\n<p>They used a machine that could flash a picture for a tiny moment, as short as one hundredth of a second. They flashed playing cards, one at a time. Each card was shown again and again, a little longer each time, until the student named it correctly twice in a row.<\/p>\n<p>Most of the cards were normal. But some were trick cards, painted the wrong color. There was a red six of spades. There was a black four of hearts. Spades are supposed to be black, and hearts are supposed to be red.<\/p>\n<h2>What the students saw<\/h2>\n<p>The normal cards were easy. On average, students named them after a flash of about three hundredths of a second.<\/p>\n<p>The trick cards were a different story. They took about four times as long to name correctly. And at first, almost every student saw a trick card as a normal one. A red six of spades got called \"six of hearts\" (the color won) or \"six of spades\" (the shape won). Their brains quietly fixed the card to match what they expected.<\/p>\n<p>Some students did something stranger. About half of them, looking at a red spade, reported in-between colors, like purple or brown. Their eyes said red, their expectations said black, and they saw something in the middle.<\/p>\n<p>A few students got upset and confused. They weren't sure anymore what a playing card even looked like. And some never named certain trick cards correctly at all, even when the card stayed up for a full second.<\/p>\n<p>Here's the hopeful part. Once a student had figured out one trick card, the next trick card got much easier. Knowing that trick cards <em>existed<\/em> changed what they could see.<\/p>\n<h2>Why Kuhn cared<\/h2>\n<p>Thomas Kuhn loved this experiment, because he thought scientists are just like those students.<\/p>\n<p>A paradigm tells scientists what to expect. Most of the time that's a huge help: it lets them see what matters fast. But it also means that something unexpected can get missed, or quietly fitted into the old categories. Only after scientists start to suspect something's off do they really see it. And once they do, they can't un-see it.<\/p>\n<p><strong>Weird but true:<\/strong> The famous drawing that looks like both a duck and a rabbit first appeared in 1892, as a joke in a German humor magazine. People have been puzzling over it ever since.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Expectation:<\/strong> what you think you'll see before you look.<\/li>\n<li><strong>Anomaly:<\/strong> something that doesn't fit what you expected. The trick cards were anomalies.<\/li>\n<li><strong>Gestalt switch<\/strong> (guh-SHTALT): when the same picture suddenly looks completely different to you, like a drawing that flips between a duck and a rabbit.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Norwood Russell Hanson, an American philosopher, wrote a book in 1958 arguing that seeing isn't just your eyes taking a picture. What you see depends on what you already know. He used drawings that can be seen two ways to make his point. Think of an X-ray: a doctor and someone who has never studied medicine look at the same picture, but they don't notice the same things. Do you think two people looking at the same thing always see the same thing?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>The whole experiment used 28 students from Harvard and Radcliffe in 1949. Is that enough to say how everyone's brain works?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 4: Seeing What You Expect<\/h1>\n<p>What color is the six of spades? You answered without looking, and that is the point of this module. In 1949, two psychologists showed that people shown a red six of spades for a split second almost never see a red six of spades.<\/p>\n<h2>An experiment Kuhn couldn't stop thinking about<\/h2>\n<p>In 1949 the Harvard psychologists Jerome Bruner and Leo Postman published a short paper with a large afterlife. Their subjects were 28 Harvard and Radcliffe students. Using a tachistoscope, a device that displays an image for a precisely timed instant, they flashed playing cards one at a time. Each card started at a hundredth of a second and was shown for longer and longer, up to a full second, until the subject named it correctly twice in a row.<\/p>\n<p>Most cards were ordinary. Six were \"trick\" cards with suit and color swapped: a black three of hearts and a black four of hearts, a red two of spades and a red six of spades, a black ace of diamonds, a red six of clubs.<\/p>\n<h2>Four ways of seeing a card that shouldn't exist<\/h2>\n<p>Ordinary cards were recognized at about 28 thousandths of a second on average. Trick cards needed about 114, roughly four times longer. The way subjects got there is the interesting part. Bruner and Postman described four kinds of reaction:<\/p>\n<ul>\n<li><strong>Dominance.<\/strong> Nearly every subject (27 of 28) at first reported a trick card as a normal one. Either the shape won (a red six of spades seen as a six of spades) or the color won (seen as a six of hearts). The anomaly was absorbed into an existing category without being noticed.<\/li>\n<li><strong>Compromise.<\/strong> About half the subjects, shown a red spade, reported something in between: purplish, brownish, blackish-brown. Expectation and input were averaged into a color neither one predicted.<\/li>\n<li><strong>Disruption.<\/strong> Sixteen subjects at some point lost confidence entirely, unsure of the color, the suit, or even whether it was a playing card.<\/li>\n<li><strong>Recognition.<\/strong> Correct identification often came suddenly, after a growing sense that something was wrong. Some said the symbols looked wrong, or \"reversed,\" before they could say why.<\/li>\n<\/ul>\n<p>Some trick cards were never correctly identified, even at a full second; about one in ten trick-card presentations stayed unrecognized at the longest exposure. And experience mattered: after recognizing one trick card, subjects recognized the next much faster. Practice with normal cards gave no such boost.<\/p>\n<h2>The scientist as card-reader<\/h2>\n<p>Kuhn used this experiment as a model of scientific discovery. A paradigm supplies expectations, and expectations make perception fast and efficient. The cost is that genuine novelty first appears as nothing at all, or as a normal case slightly off. It takes time, a sense of wrongness, and often some failure before an anomaly is seen for what it is. Then, as with the subjects who caught one trick card, the whole category of the unexpected becomes visible.<\/p>\n<p>Kuhn went further. After a revolution, he said, scientists don't simply interpret the same data differently. In some sense they see differently, the way a drawing that looked like a duck abruptly becomes a rabbit. He called this a <strong>gestalt switch<\/strong>, while admitting the comparison was only partly apt: unlike someone staring at the drawing, a scientist can't simply choose to see it the old way again.<\/p>\n<p><strong>Weird but true:<\/strong> The duck-rabbit first appeared, unsigned, in the German humor magazine <em>Fliegende Blätter<\/em> on October 23, 1892. The psychologist Joseph Jastrow used it, and the philosopher Ludwig Wittgenstein made it famous as an example of \"seeing as.\" Kuhn borrowed it for scientific revolutions.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Tachistoscope:<\/strong> an instrument that displays an image for a precisely controlled, very short time.<\/li>\n<li><strong>Theory-laden observation:<\/strong> the idea that what we observe is shaped by the concepts and theories we already hold.<\/li>\n<li><strong>Gestalt switch:<\/strong> a sudden reorganization of how the same input is perceived.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Norwood Russell Hanson, in <em>Patterns of Discovery<\/em> (1958), argued that seeing is not a neutral recording of light. He used ambiguous figures, like the drawing that can be seen as a young woman or an old one, to argue that what we perceive is organized by what we already know. A trained physicist and a beginner looking at the same apparatus don't see the same thing. Hanson's view sharpens a problem for Popper's method from Module 3: if observations are shaped by theories, can an observation ever be a neutral judge between two theories? A doctor and a first-year student look at the same X-ray. Whose observation should count as evidence, and could the student ever see something the doctor's training hides?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>Twenty-eight college students in 1949 are a small and narrow group to support claims about how scientists, or people in general, perceive. Kuhn built a lot on one study.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  document.getElementById('page').innerHTML =

  document.title = 'Module 4: Seeing What You Expect · ' + (level === 'core' ? 'Core' : 'Extended');
</script>
