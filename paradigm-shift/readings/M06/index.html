<script>
  var LEVELS = {"core": "<h1>Module 6: Too Many Circles?<\/h1>\n<p>Go outside on the right nights and you can watch Mars do something that seems impossible. It slows down, stops, backs up for weeks, and then goes forward again. For 2,000 years, explaining that loop was one of the biggest puzzles in science.<\/p>\n<h2>The wanderers<\/h2>\n<p>Watch the night sky for a few months and most stars march across it together, like one giant spinning bowl. But five bright lights don't keep up. The Greeks called them <em>planētēs<\/em>, \"wanderers.\" Stranger still, a wanderer like Mars usually drifts east against the stars, then slows, loops backward for about two months, and then turns east again. Astronomers call that loop <strong>retrograde motion<\/strong>.<\/p>\n<h2>Ptolemy's toolkit<\/h2>\n<p>Around the year 150, an astronomer in Alexandria, Egypt, named Claudius Ptolemy wrote a great book of astronomy. In it, Earth sits still and everything circles it. To match the wanderers, he used a set of tools:<\/p>\n<ul>\n<li><strong>Deferent:<\/strong> a big circle the planet's path follows around Earth.<\/li>\n<li><strong>Epicycle:<\/strong> a smaller circle that rides on the big one, like a seat on a spinning carnival ride. The epicycle makes the backward loops.<\/li>\n<li><strong>Eccentric:<\/strong> a big circle whose center is a little off from Earth.<\/li>\n<li><strong>Equant:<\/strong> a spot near the middle of the big circle. From that spot, the center of the small circle seems to move at an even pace; from the center, it doesn't.<\/li>\n<\/ul>\n<p>It worked. For more than 1,400 years, astronomers used Ptolemy's toolkit to predict where planets would be. Astronomers in the Islamic world improved his models for centuries.<\/p>\n<h2>Copernicus's surprise<\/h2>\n<p>In 1543, Nicolaus Copernicus published a book that put the Sun near the center and set Earth moving around it. Now the backward loops had a simple story: when Earth, on its faster inside track, passes Mars, Mars seems to slide backward, like a slower car you pass on the highway.<\/p>\n<p>But here's the surprise. Copernicus still used circles, and still needed small epicycles. His model <strong>was not more accurate<\/strong> than Ptolemy's. And it didn't use fewer circles overall either.<\/p>\n<p>The real jump in accuracy came later. Tycho Brahe made the most careful sky measurements anyone had made without a telescope. Johannes Kepler spent years trying to fit Tycho's measurements of Mars with circles. One of his circle models missed by a tiny amount, only about an eighth of a degree. Kepler trusted Tycho's data more than his model, so he threw the model out. In 1609 he showed that Mars moves on an <strong>ellipse<\/strong>, a stretched circle, and his predictions fit.<\/p>\n<h2>Kuhn's crisis<\/h2>\n<p>Thomas Kuhn told this story as a <strong>crisis<\/strong>. A crisis, he said, is when a paradigm's puzzles keep failing, and scientists start to feel the old rules might be the problem. He argued that by Copernicus's time, astronomers sensed that Ptolemy's system, fixed and refixed for centuries, had grown into a tangle.<\/p>\n<p>Historians since then have pushed back on part of that story. You may have heard that Ptolemy's followers kept piling \"epicycles on epicycles\" until the system collapsed. Historians say that's a myth: the number of circles stayed roughly the same, and Copernicus's book used about as many.<\/p>\n<p>So was there really a crisis? You'll judge for yourself.<\/p>\n<p><strong>Weird but true:<\/strong> Tycho Brahe, whose measurements helped Kepler break the circles, wore a fake nose. At age 20 he lost part of his real one in a sword fight with his cousin, reportedly over which of them was the better mathematician.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Retrograde motion:<\/strong> when a planet seems to move backward against the stars for a while.<\/li>\n<li><strong>Epicycle:<\/strong> a small circle carried around on a bigger one.<\/li>\n<li><strong>Crisis (Kuhn's sense):<\/strong> a time when a paradigm's puzzles keep failing and scientists start to doubt the rules.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Imre Lakatos, a Hungarian-British philosopher, said don't judge a theory by whether it has problems, because every theory does. Ask instead: is it still predicting new things nobody expected? Or is it only making patches to fit things already known? He called the first kind \"progressive\" and the second \"degenerating.\" Which was Kepler's ellipse?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>This module's own title, \"Too Many Circles?\", echoes the epicycle myth the reading says is wrong. Why might a course still use it?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 6: Too Many Circles?<\/h1>\n<p>On the right nights, Mars visibly stops, reverses against the stars for weeks, and resumes. For roughly two thousand years, explaining that loop was the central technical problem of astronomy, and the solutions people accepted say a great deal about how sciences change.<\/p>\n<h2>The problem of the wanderers<\/h2>\n<p>Against the background stars, the five planets visible to the naked eye mostly drift eastward. Periodically each one slows, stops, reverses for a while, stops again, and resumes. This <strong>retrograde motion<\/strong> was the central puzzle of ancient mathematical astronomy.<\/p>\n<p>Around 150 CE, Claudius Ptolemy of Alexandria assembled the most complete solution in the work later called the <em>Almagest<\/em>. Earth sits at rest. Each planet rides on an <strong>epicycle<\/strong>, a small circle whose center travels around a larger <strong>deferent<\/strong>. Ptolemy refined this with an <strong>eccentric<\/strong> (the deferent's center offset from Earth) and his own invention, the <strong>equant<\/strong>: a point from which the epicycle's center appears to move at a steady rate. The equant broke with the old ideal of uniform circular motion about a circle's center, but it worked remarkably well. Ptolemaic astronomy produced usable predictions for well over a millennium, and astronomers in the medieval Islamic world refined it. Ibn al-Shatir in Damascus built models without the equant whose mathematics closely matches what Copernicus later used. Historians still debate whether Copernicus knew of that work or reinvented it.<\/p>\n<h2>Copernicus did not win on accuracy<\/h2>\n<p><em>De revolutionibus<\/em> (1543) placed the Sun near the center and set Earth in motion. Its great payoff was qualitative: retrograde motion stops being a separate mechanism for each planet and becomes a side effect of Earth's own orbit. Earth overtakes the outer planets; Mercury and Venus overtake Earth.<\/p>\n<p>Two popular beliefs about Copernicus are false. His published system was not more accurate than Ptolemy's, and it did not use fewer circles overall. Copernicus kept uniform circular motion, replaced the equant with small extra epicycles, and ended up with a system at least as complicated to calculate with. For decades, the case for a moving Earth could not rest on better predictions.<\/p>\n<p>The accuracy breakthrough came from data. Tycho Brahe's naked-eye observations were far more precise than any before. Johannes Kepler, working on Tycho's Mars data, built a circle-based model that disagreed with the observations by about 8 arcminutes, roughly an eighth of a degree. Earlier astronomers would have shrugged at that. Kepler trusted Tycho's precision more than his own model, discarded it, and in <em>Astronomia nova<\/em> (1609) published his first two laws: planets move on ellipses, and sweep out equal areas in equal times.<\/p>\n<h2>Kuhn's crisis, and the historians' reply<\/h2>\n<p>In Kuhn's account, Copernicus's revolution followed a <strong>crisis<\/strong>: a period when a paradigm's puzzles resist solution for so long that practitioners lose confidence in the rules themselves. Kuhn argued that by the sixteenth century astronomers felt the Ptolemaic tradition had become unmanageable: its adjustments no longer made it more accurate. In his view, that sense of failure opened the field to a radically new approach.<\/p>\n<p>Later historians have challenged parts of this. The image of Ptolemaic astronomers piling \"epicycles on epicycles\" appears to be a modern myth; circle counts stayed fairly stable, and Copernicus's published book needed about as many as Ptolemy's. Whether working astronomers in 1500 experienced a \"crisis,\" or whether that label was applied afterward, is still argued. Notice the irony: a course about textbooks tidying history is now reporting that Kuhn's own history may have been tidied.<\/p>\n<p><strong>Weird but true:<\/strong> Tycho Brahe lost part of his nose in a duel in December 1566, at age 20, after quarreling with his cousin and fellow student Manderup Parsberg, reportedly over who was the better mathematician. He wore a metal replacement for the rest of his life; legend said gold and silver, but a 2012 analysis of traces on his skull pointed to brass.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Equant:<\/strong> a point offset from a circle's center, from which a body's motion along the circle appears uniform.<\/li>\n<li><strong>Arcminute:<\/strong> 1/60 of a degree.<\/li>\n<li><strong>Crisis (Kuhn's sense):<\/strong> prolonged failure of normal science that loosens a community's commitment to its paradigm.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Imre Lakatos, in \"Falsification and the Methodology of Scientific Research Programmes\" (1970), proposed a middle path between Popper and Kuhn. Every research programme has a <strong>hard core<\/strong> it protects and a <strong>protective belt<\/strong> of auxiliary hypotheses it adjusts. A programme is <strong>progressive<\/strong> if its adjustments lead to novel predictions that are then confirmed, and <strong>degenerating<\/strong> if adjustments only accommodate facts already known. Rationally, scientists should prefer progressive programmes, though a degenerating one can recover. By Lakatos's test, were Ptolemy's eccentric and equant progressive or degenerating? Was Copernicus's system progressive in 1543, or only later, once Kepler and Galileo built on it?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>The module's title, \"Too Many Circles?\", echoes the very myth the reading debunks. A course can repeat a tidy story even while correcting it.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
