<script>
  var LEVELS = {"core": "<h1>Module 6: Too Many Circles?<\/h1>\n<p class=\"lede\">Go outside on the right nights and you can watch Mars do something that seems impossible. It slows down, stops, backs up for weeks, and then goes forward again. For 2,000 years, explaining that loop was one of the biggest puzzles in science.<\/p>\n<h2><span>The wanderers<\/span><\/h2>\n<p>Watch the night sky for a few months and most stars march across it together, like one giant spinning bowl. But five bright lights don't keep up. The Greeks called them <em>planētēs<\/em>, \"wanderers.\" Stranger still, a wanderer like Mars usually drifts east against the stars, then slows, loops backward for about two months, and then turns east again. Astronomers call that loop <strong>retrograde motion<\/strong>.<\/p>\n<h2><span>Ptolemy's toolkit<\/span><\/h2>\n<p>Around the year 150, an astronomer in Alexandria, Egypt, named Claudius Ptolemy wrote a great book of astronomy. In it, Earth sits still and everything circles it. To match the wanderers, he used two main tools:<\/p>\n<ul>\n<li><strong>Big circle:<\/strong> the main path the planet follows around Earth.<\/li>\n<li><strong>Epicycle:<\/strong> a smaller circle that rides on the big one, like a seat on a spinning carnival ride. The epicycle makes the backward loops.<\/li>\n<\/ul>\n<p>It worked. For more than 1,400 years, astronomers used Ptolemy's tools (plus a few clever extras) to predict where planets would be. Astronomers in the Islamic world improved his models for centuries.<\/p>\n<h2><span>Copernicus's surprise<\/span><\/h2>\n<p>In 1543, Nicolaus Copernicus published a book that put the Sun near the center and set Earth moving around it. Now the backward loops had a simple story: when Earth, on its faster inside track, passes Mars, Mars seems to slide backward, like a slower car you pass on the highway.<\/p>\n<p>But here's the surprise. Copernicus still used circles, and still needed small epicycles. His model <strong>was not more accurate<\/strong> than Ptolemy's. And it didn't use fewer circles overall either.<\/p>\n<p>The real jump in accuracy came later. Tycho Brahe made the most careful sky measurements anyone had made without a telescope. Johannes Kepler spent years trying to fit Tycho's measurements of Mars with circles. One of his circle models missed by a tiny amount. Kepler trusted Tycho's data more than his model, so he threw the model out. In 1609 he showed that Mars moves on an <strong>ellipse<\/strong>, a stretched circle, and his predictions fit.<\/p>\n<h2><span>Kuhn's crisis<\/span><\/h2>\n<p>Thomas Kuhn told this story as a <strong>crisis<\/strong>. A crisis, he said, is when a paradigm's puzzles keep failing, and scientists start to feel the old rules might be the problem. He argued that by Copernicus's time, astronomers sensed that Ptolemy's system, fixed and refixed for centuries, had grown into a tangle.<\/p>\n<p>Historians since then have pushed back on part of that story. You may have heard that Ptolemy's followers kept piling \"epicycles on epicycles\" until the system collapsed. Historians say that's a myth: the number of circles stayed roughly the same, and Copernicus's book used about as many.<\/p>\n<p>So was there really a crisis? You'll judge for yourself.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Tycho Brahe, whose measurements helped Kepler break the circles, wore a fake nose. At age 20 he lost part of his real one in a sword fight with his cousin, reportedly over which of them was the better mathematician.<\/p><\/aside>\n<h2><span>Words for your notebook<\/span><\/h2>\n<ul>\n<li><strong>Retrograde motion:<\/strong> when a planet seems to move backward against the stars for a while.<\/li>\n<li><strong>Epicycle:<\/strong> a small circle carried around on a bigger one.<\/li>\n<li><strong>Crisis (Kuhn's sense):<\/strong> a time when a paradigm's puzzles keep failing and scientists start to doubt the rules.<\/li>\n<\/ul>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>A philosopher named Imre Lakatos said don't judge a theory by whether it has problems, because every theory does. Ask instead: is it still predicting new things nobody expected? Or is it only making patches to fit things already known? Think of two ways to fix a bad video-game strategy: a patch that only fixes yesterday's loss, or a new idea that also wins games you haven't played yet. Which was Kepler's ellipse?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Which claim here would you most want to double-check, and where would you look? Write it in your log, or just tell Rocky.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This module's own title, \"Too Many Circles?\", echoes the epicycle myth the reading says is wrong. Why might a course still use it?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 6: Too Many Circles?<\/h1>\n<p class=\"lede\">On the right nights, Mars visibly stops, reverses against the stars for weeks, and resumes. For roughly two thousand years, explaining that loop was the central technical problem of astronomy, and the solutions people accepted say a great deal about how sciences change.<\/p>\n<h2><span>The problem of the wanderers<\/span><\/h2>\n<p>Against the background stars, the five planets visible to the naked eye mostly drift eastward. Periodically each one slows, stops, reverses for a while, stops again, and resumes. This <strong>retrograde motion<\/strong> was the central puzzle of ancient mathematical astronomy.<\/p>\n<p>Around 150 CE, Claudius Ptolemy of Alexandria assembled the most complete solution in the work later called the <em>Almagest<\/em>. Earth sits at rest. Each planet rides on an <strong>epicycle<\/strong>, a small circle whose center travels around a larger <strong>deferent<\/strong>. Ptolemy refined this with an <strong>eccentric<\/strong> (the deferent's center offset from Earth) and his own invention, the <strong>equant<\/strong>: a point from which the epicycle's center appears to move at a steady rate. The equant broke with the old ideal of uniform circular motion about a circle's center, but it worked remarkably well. Ptolemaic astronomy produced usable predictions for well over a millennium, and astronomers in the medieval Islamic world refined it. Ibn al-Shatir in Damascus built models without the equant whose mathematics closely matches what Copernicus later used. Historians still debate whether Copernicus knew of that work or reinvented it.<\/p>\n<h2><span>Copernicus did not win on accuracy<\/span><\/h2>\n<p><em>De revolutionibus<\/em> (1543) placed the Sun near the center and set Earth in motion. Its great payoff was qualitative: retrograde motion stops being a separate mechanism for each planet and becomes a side effect of Earth's own orbit. Earth overtakes the outer planets; Mercury and Venus overtake Earth.<\/p>\n<p>Two popular beliefs about Copernicus are false. His published system was not more accurate than Ptolemy's, and it did not use fewer circles overall. Copernicus kept uniform circular motion, replaced the equant with small extra epicycles, and ended up with a system at least as complicated to calculate with. For decades, the case for a moving Earth could not rest on better predictions.<\/p>\n<p>The accuracy breakthrough came from data. Tycho Brahe's naked-eye observations were far more precise than any before. Johannes Kepler, working on Tycho's Mars data, built a circle-based model that disagreed with the observations by about 8 arcminutes, roughly an eighth of a degree. Earlier astronomers would have shrugged at that. Kepler trusted Tycho's precision more than his own model, discarded it, and in <em>Astronomia nova<\/em> (1609) published his first two laws: planets move on ellipses, and sweep out equal areas in equal times.<\/p>\n<h2><span>Kuhn's crisis, and the historians' reply<\/span><\/h2>\n<p>In Kuhn's account, Copernicus's revolution followed a <strong>crisis<\/strong>: a period when a paradigm's puzzles resist solution for so long that practitioners lose confidence in the rules themselves. Kuhn argued that by the sixteenth century astronomers felt the Ptolemaic tradition had become unmanageable: its adjustments no longer made it more accurate. In his view, that sense of failure opened the field to a radically new approach.<\/p>\n<p>Later historians have challenged parts of this. The image of Ptolemaic astronomers piling \"epicycles on epicycles\" appears to be a modern myth; circle counts stayed fairly stable, and Copernicus's published book needed about as many as Ptolemy's. Whether working astronomers in 1500 experienced a \"crisis,\" or whether that label was applied afterward, is still argued. Notice the irony: a course about textbooks tidying history is now reporting that Kuhn's own history may have been tidied.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>Scientists still have to choose between models that fit the data about equally well, and they often lean on the same values the Copernicans did, like simplicity and how much a model explains at once.<\/p><\/aside>\n<p><strong>A complication:<\/strong> Kuhn knew this material well. He wrote a full history of the subject, <em>The Copernican Revolution<\/em> (1957), five years before <em>Structure<\/em>. That is worth remembering when you weigh his crisis story against the historians' reply: he had worked in the sources, which makes the disagreement more interesting, not less.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Tycho Brahe lost part of his nose in a duel in December 1566, at age 20, after quarreling with his cousin and fellow student Manderup Parsberg, reportedly over who was the better mathematician. He wore a metal replacement for the rest of his life; legend said gold and silver, but a 2012 analysis of traces on his skull pointed to brass.<\/p><\/aside>\n<section class=\"glossary\"><h2><span>Terms<\/span><\/h2><ul>\n<li><strong>Equant:<\/strong> a point offset from a circle's center, from which a body's motion along the circle appears uniform.<\/li>\n<li><strong>Arcminute:<\/strong> 1/60 of a degree.<\/li>\n<li><strong>Crisis (Kuhn's sense):<\/strong> prolonged failure of normal science that loosens a community's commitment to its paradigm.<\/li>\n<\/ul><\/section>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Imre Lakatos, in \"Falsification and the Methodology of Scientific Research Programmes\" (1970), proposed a middle path between Popper and Kuhn. Every research programme has a <strong>hard core<\/strong> it protects and a <strong>protective belt<\/strong> of auxiliary hypotheses it adjusts. A programme is <strong>progressive<\/strong> if its adjustments lead to novel predictions that are then confirmed, and <strong>degenerating<\/strong> if adjustments only accommodate facts already known. Rationally, scientists should prefer progressive programmes, though a degenerating one can recover. By Lakatos's test, were Ptolemy's eccentric and equant progressive or degenerating? Was Copernicus's system progressive in 1543, or only later, once Kepler and Galileo built on it?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>The module's title, \"Too Many Circles?\", echoes the very myth the reading debunks. A course can repeat a tidy story even while correcting it.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};

      var rs = box.querySelector('#rs');
      if (!ta.value.trim() && !rv.dataset.once) { rv.dataset.once = '1'; rs.textContent = 'Write your own guess first, even a rough one. Then tap again.'; return; }
      planted.classList.remove('locked'); planted.classList.add('in'); rv.style.display = 'none'; rs.textContent = '';
      planted.scrollIntoView({behavior:'smooth', block:'center'});
    });
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 6: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch(e) { st.textContent = 'Select your note and copy it.'; } t.remove(); }
      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // "Reveal:" answers stay hidden until the learner taps
  document.querySelectorAll('#body .answercard').forEach(function(card){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'reveal'; b.textContent = 'I picked one. Show the answer';
    var wrap = document.createElement('div'); wrap.className = 'revealrow'; wrap.appendChild(b);
    card.parentNode.insertBefore(wrap, card);
    b.addEventListener('click', function(){ card.classList.remove('locked'); card.classList.add('in'); wrap.style.display = 'none'; });
  });
  // Module 11: tick the planted anomalies you caught
  (function(){
    if ('06' !== '11') return;
    var ols = document.querySelectorAll('#body ol'), ol = null;
    ols.forEach(function(o){ if (o.children.length === 10) ol = o; });
    if (!ol) return;
    ol.classList.add('tick');
    var score = document.createElement('p'); score.className = 'score'; score.setAttribute('role', 'status');
    ol.parentNode.insertBefore(score, ol);
    function upd(){ score.textContent = 'You caught ' + ol.querySelectorAll('input:checked').length + ' of 10'; }
    Array.prototype.forEach.call(ol.children, function(li, i){
      var lab = document.createElement('label'), cb = document.createElement('input'), sp = document.createElement('span');
      cb.type = 'checkbox'; cb.setAttribute('aria-label', 'I caught number ' + (i + 1)); sp.innerHTML = li.innerHTML;
      lab.appendChild(cb); lab.appendChild(sp); li.innerHTML = ''; li.appendChild(lab); cb.addEventListener('change', upd);
    });
    upd();
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion (Core only; Extended keeps the self-inking sketch and the margin line): paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var calm = level === 'extended';
  if (!reduce && !calm && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .answercard, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
