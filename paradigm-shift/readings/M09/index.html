<script>
  var LEVELS = {"core": "<h1>Module 9: Progress Toward What?<\/h1>\n<p>Imagine firing a giant artillery shell at a sheet of tissue paper and having it bounce back and hit you. That's how the scientist Ernest Rutherford later described one of the strangest results in the history of the atom.<\/p>\n<h2>Five pictures of one tiny thing<\/h2>\n<p>Nobody has ever looked at an atom the way you look at a marble. So scientists built <strong>models<\/strong>: pictures and rules that explain what experiments show. Over about 120 years, the model of the atom changed again and again.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>When<\/th>\n<th>The picture<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dalton<\/td>\n<td>early 1800s<\/td>\n<td>Atoms are tiny, solid balls that can't be split. They join in fixed, whole-number amounts.<\/td>\n<\/tr>\n<tr>\n<td>Thomson<\/td>\n<td>1904<\/td>\n<td>J.J. Thomson had found the electron in 1897. His atom is a ball of positive charge with tiny negative electrons scattered through it. People later nicknamed it the \"plum pudding\" model.<\/td>\n<\/tr>\n<tr>\n<td>Rutherford<\/td>\n<td>1911<\/td>\n<td>In an experiment in 1909, a few particles fired at thin gold foil bounced almost straight back. Ernest Rutherford said the atom must have a tiny, heavy center: the <strong>nucleus<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Bohr<\/td>\n<td>1913<\/td>\n<td>Niels Bohr put electrons on fixed levels, like rungs on a ladder. It explained exactly which colors of light hydrogen gives off.<\/td>\n<\/tr>\n<tr>\n<td>Schrödinger<\/td>\n<td>1926<\/td>\n<td>Erwin Schrödinger's math describes electrons as fuzzy clouds of where they're likely to be, not tiny balls on paths.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Each model explained something the one before couldn't. That sounds like a staircase climbing toward the truth.<\/p>\n<h2>Kuhn's surprising ending<\/h2>\n<p>Thomas Kuhn ended his famous book with a comparison to evolution. In evolution, living things don't change <em>toward<\/em> a goal. Giraffes didn't evolve \"toward\" the perfect giraffe. Living things change <em>away from<\/em> what worked less well where they lived.<\/p>\n<p>Kuhn thought science might be like that. Each new paradigm solves more puzzles than the old one, so there's real progress. But maybe it isn't progress <em>toward<\/em> one final, perfect truth. Maybe it's progress <em>away from<\/em> older problems.<\/p>\n<h2>Something lost<\/h2>\n<p>Here's another twist. New models don't only add. They sometimes lose things too.<\/p>\n<p>Bohr's model gives you a picture you can draw: electrons on tidy rings. Schrödinger's model is much more accurate, but it gives up that simple picture. Electrons don't have neat paths at all.<\/p>\n<p>That's why your science teacher may still draw the Bohr model. Chemists still use Dalton's idea of atoms joining in whole-number amounts every day. Old models don't vanish. Scientists keep the ones that are good enough for the job.<\/p>\n<p><strong>Weird but true:<\/strong> Rutherford's gold-foil team fired particles at foil so thin you could almost see through it. Nearly all of them went straight through. Only a tiny few bounced back, and those few changed the picture of every atom.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Model:<\/strong> a simplified picture and set of rules that explains what experiments show.<\/li>\n<li><strong>Nucleus:<\/strong> the tiny, heavy center of an atom.<\/li>\n<li><strong>Progress:<\/strong> getting better. But better at what? That's the question.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Karl Popper thought a new theory can be closer to the truth than the old one, even if neither is perfectly true. Each good replacement gets nearer. Kuhn wasn't sure science moves toward a final truth at all. Do you think science is getting closer to the truth, or just getting better at solving puzzles?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>The table shows five neat steps. Lots of other scientists, other models and wrong turns were left out. That's a staircase, the very thing Module 1 warned about.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 9: Progress Toward What?<\/h1>\n<p>Ernest Rutherford later said that one result from his laboratory was about as believable as a heavy artillery shell bouncing back off tissue paper. That result reshaped the atom. It was one step in a century of models, and the question this module asks is what all those steps were heading toward.<\/p>\n<h2>A century of atoms<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Date<\/th>\n<th>What it explained<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dalton<\/td>\n<td>1803–1808<\/td>\n<td>Elements combine in fixed whole-number ratios, because they are made of indivisible atoms of characteristic weight.<\/td>\n<\/tr>\n<tr>\n<td>Thomson<\/td>\n<td>1904<\/td>\n<td>Atoms contain electrons (discovered 1897), embedded in a diffuse positive charge. The \"plum pudding\" name probably came from popular writers, not Thomson.<\/td>\n<\/tr>\n<tr>\n<td>Rutherford<\/td>\n<td>1911<\/td>\n<td>The Geiger–Marsden experiments (key result 1909) showed a few alpha particles bouncing back from gold foil: positive charge and most of the mass sit in a tiny nucleus.<\/td>\n<\/tr>\n<tr>\n<td>Bohr<\/td>\n<td>1913<\/td>\n<td>Electrons occupy fixed energy levels; jumps between them produce hydrogen's exact spectral lines. It failed for atoms with more electrons.<\/td>\n<\/tr>\n<tr>\n<td>Schrödinger<\/td>\n<td>1926<\/td>\n<td>Wave mechanics replaces orbits with orbitals, probability distributions with no definite path.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Read as a staircase, this is the textbook picture of progress. Each step explains what the last could not. Rutherford's nucleus even created a new problem, since classical physics says an orbiting electron should radiate energy and spiral inward, and Bohr's fixed levels were partly an answer to it.<\/p>\n<h2>Evolution without a goal<\/h2>\n<p><em>Structure<\/em> ends with an analogy to Darwin. What made Darwin's theory hard to accept, Kuhn argued, was not evolution itself but evolution without a goal. Organisms don't evolve toward a predetermined perfect form; they evolve away from less successful ones. Kuhn suggested science works the same way. Later paradigms are better puzzle-solvers than earlier ones, so there is genuine progress. But we may not need, and may not be able to justify, the idea that science is closing in on a final, finished description of nature. Progress from, not progress toward.<\/p>\n<h2>Kuhn loss<\/h2>\n<p>If progress were simple accumulation, nothing would ever be lost. The philosopher Heinz Post coined the term <strong>Kuhn loss<\/strong> for problems or explanations that a new paradigm abandons. An example often given: René Descartes's vortex theory explained why all the planets orbit in the same direction and roughly the same plane, because they are carried by one swirling vortex. Newton's gravity, which replaced it, could account for the orbits once they existed but offered no reason for that shared direction; Newton attributed the system's arrangement to an intelligent designer. A question the old theory answered became, for a long time, a question the new one didn't try to answer.<\/p>\n<p>The atom has smaller losses of its own. Bohr's model gave an intuitive, drawable picture; quantum mechanics traded it for far better predictions. Teachers still draw Bohr atoms, and chemists still reason with Dalton's ratios, because a model can be wrong in detail and right for the job.<\/p>\n<p><strong>Weird but true:<\/strong> In the gold-foil experiments, almost every alpha particle passed through with little deflection. The rare large-angle bounces were what mattered. Most of the data agreed with the old model; the anomaly was in the few.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Model:<\/strong> a simplified representation used to explain and predict.<\/li>\n<li><strong>Kuhn loss:<\/strong> an explanation or problem-solving ability lost when one paradigm replaces another.<\/li>\n<li><strong>Verisimilitude:<\/strong> Popper's term for a theory's degree of closeness to the truth.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Karl Popper held that even false theories can differ in <strong>verisimilitude<\/strong>, closeness to the truth, so a sequence of refuted theories can still approach truth. Larry Laudan, in <em>Progress and Its Problems<\/em> (1977), rejected truth as the measure. We can never tell how close we are to a truth we don't have, he argued. So progress should be judged by problem-solving: how many important problems a theory solves, minus the ones a change leaves unsolved. Laudan's view takes Kuhn loss seriously; Popper's has trouble with it. Bohr's atom is wrong in detail, yet teachers still draw it. Does a model that's wrong but useful count as progress?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>Five models in a neat table, each a step up. This is exactly the \"textbook staircase\" from Module 1, with dozens of scientists and abandoned models left out.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';

  document.title = 'Module 9: Progress Toward What? · ' + (level === 'core' ? 'Core' : 'Extended');
</script>
