<script>
  var LEVELS = {"core": "<h1>Module 1: The Textbook Lie<\/h1>\n<p>In 1775, an English minister breathed a brand-new gas on purpose, just to see what it would do to him. His chest felt light and easy for a while afterward. He was right that the gas was special. He was wrong about what it was. And the way most books tell this story is a little bit wrong too.<\/p>\n<h2>Who discovered oxygen?<\/h2>\n<p>Open almost any science book and you might read something like this: \"Joseph Priestley discovered oxygen in 1774.\" One person, one year, done.<\/p>\n<p>It's a neat sentence. It fits on a flash card. And it leaves out most of what really happened.<\/p>\n<p>Here's the messier story.<\/p>\n<p><strong>Around 1771 or 1772,<\/strong> a Swedish chemist named Carl Wilhelm Scheele heated some chemicals and collected a gas that made flames burn brighter. He called it \"fire air.\" But his book about it got stuck at the printer. It didn't come out until 1777.<\/p>\n<p><strong>In August 1774,<\/strong> an English minister and chemist named Joseph Priestley heated a red powder and collected a gas. A candle burned in it with an amazingly strong flame.<\/p>\n<p><strong>In October 1774,<\/strong> Priestley visited Paris and told a French chemist, Antoine Lavoisier, about his gas.<\/p>\n<p><strong>Early in 1775,<\/strong> back in England, Priestley tested the gas some more. A mouse in a jar of it stayed lively much longer than in ordinary air. Priestley breathed some himself and said his chest felt light and easy.<\/p>\n<p>But Priestley didn't think he had found a new element. Chemists back then believed that anything burning gave off an invisible stuff called <em>phlogiston<\/em> (say it: flo-JISS-tun). Priestley decided his gas was air with the phlogiston taken out, so it could soak up lots more. He called it \"dephlogisticated air.\"<\/p>\n<p>Meanwhile, Lavoisier repeated the experiments, and over the next few years he came to a completely different conclusion. There is no phlogiston, he argued. This gas is a basic ingredient of the air, an element. When things burn, they grab this element instead of giving something off. He named it <em>oxygen<\/em>.<\/p>\n<p><strong>Priestley never agreed.<\/strong> For the rest of his life, he kept saying phlogiston was real.<\/p>\n<p>So who discovered oxygen? Scheele made it first. Priestley made it and told the world first. Lavoisier was the first to understand it as we do today. And even Lavoisier got a piece wrong: the name \"oxygen\" means \"acid-maker,\" because he thought oxygen was what made acids acidic. Some acids, like the hydrochloric acid in your stomach, have no oxygen in them at all.<\/p>\n<h2>Why do science books tidy things up?<\/h2>\n<p>Science books are written to teach today's ideas fast. They don't have room for every wrong turn. So they line up the past like a staircase, with each scientist adding one more step toward what we know now.<\/p>\n<p>A physicist-turned-historian named Thomas Kuhn thought that staircase picture was a big problem.<\/p>\n<p>Kuhn trained as a physicist. In 1947 he was asked to help with a college science class built around stories from science history, and he started reading old science books, like the ones written by the Greek thinker Aristotle more than 2,000 years ago. At first Aristotle's ideas about motion looked just plain silly. Then Kuhn had a surprise: once he saw the world the way Aristotle did, with Aristotle's own questions and goals, the ideas made a lot of sense. Aristotle wasn't a bad scientist. He was playing by different rules.<\/p>\n<p>That surprise grew into a famous book. In 1962, Kuhn published <em>The Structure of Scientific Revolutions<\/em>. Its big idea: science doesn't just pile up facts, one on top of another. Every so often, scientists change the whole set of rules they use to see the world. Kuhn called those changes <em>revolutions<\/em>. Oxygen replacing phlogiston was one of them.<\/p>\n<p>And here's the sneaky part. After a revolution, the new science books get written, and they make the revolution almost invisible. Priestley becomes \"the man who discovered oxygen,\" as if he agreed with us all along. The fight disappears.<\/p>\n<p><strong>Weird but true:<\/strong> Joseph Priestley also found a way to make fizzy water. In 1767 he lived next to a brewery, used the gas bubbling up from the beer vats, and worked out how to put bubbles into drinking water.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Phlogiston:<\/strong> an invisible stuff that chemists once believed burning things gave off. It turned out not to exist.<\/li>\n<li><strong>Revolution (in science):<\/strong> a big change in the rules scientists use to see the world.<\/li>\n<li><strong>Textbook history:<\/strong> the tidy, staircase version of the past that science books often tell.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Francis Bacon, an English thinker, wrote a book in 1620 about how science should work. Gather lots of careful observations, he said, and slowly build them up into general laws. In his picture, science grows like a pile of facts, getting bigger and more certain over time. Kuhn's picture is different: sometimes the pile gets knocked over and rebuilt in a new shape. Which picture fits the oxygen story better?<\/p><\/aside>\n<h2>Your Anomaly Log starts now<\/h2>\n<p>An anomaly (uh-NOM-uh-lee) is something that doesn't fit, like a puzzle piece from the wrong box. Kuhn noticed that big changes in science start with anomalies.<\/p>\n<p>In this course, you'll hunt for anomalies in the course itself. Keep a page (on paper or in a notes app) called <strong>Anomaly Log<\/strong>. At the end of each module, write down anything that seemed too tidy, left out, or didn't quite fit.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>This module told you a story in a neat order, with dates in bold. Is that a little like a textbook? Keep watching.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 1: The Textbook Lie<\/h1>\n<p>In early 1775 an English minister inhaled a gas no one had named, to see what it would do. He reported that his breathing felt light and easy for some time afterward, and wondered whether it might become a luxury. He had a sample of oxygen. He was sure it was something else.<\/p>\n<h2>A sentence that fits on a flash card<\/h2>\n<p>\"Joseph Priestley discovered oxygen in 1774.\"<\/p>\n<p>You've probably met sentences like that. They're tidy, testable and easy to remember. They're also, in an important way, false. Not because the date is wrong, but because the sentence assumes a discovery is a single moment that belongs to a single person. The real history of oxygen shows why that assumption breaks down.<\/p>\n<h2>Three chemists, one gas, no agreement<\/h2>\n<p><strong>Scheele, around 1771–72.<\/strong> In Sweden, the pharmacist-chemist Carl Wilhelm Scheele produced a gas by heating several compounds, including saltpeter and mercuric oxide. Flames burned fiercely in it, so he called it \"fire air.\" He wrote it up and sent the manuscript to the printer in 1775, but the book didn't appear until 1777. By then, others had announced the same gas.<\/p>\n<p><strong>Priestley, August 1774.<\/strong> In England, Joseph Priestley, a minister who did chemistry with homemade equipment, focused sunlight through a large lens onto a red powder (mercuric oxide) and collected the gas it released. A candle flared brilliantly in it. At first he suspected it was a gas he already knew.<\/p>\n<p><strong>Paris, October 1774.<\/strong> Traveling on the Continent, Priestley met Antoine Lavoisier, a wealthy French chemist known for obsessively careful weighing, and described his experiments.<\/p>\n<p><strong>Priestley, early 1775.<\/strong> Back in England, Priestley tested the gas further. A mouse sealed in a jar of it stayed active far longer than one in ordinary air. Priestley inhaled some himself and reported that his breathing felt light and easy for some time afterward.<\/p>\n<p>What did Priestley think he had? Not a new element. The leading chemical theory of the day said that burning releases a substance called <em>phlogiston<\/em>. Air could absorb only so much phlogiston before a flame went out. Priestley reasoned that his gas must be air with its phlogiston removed, which is why it supported burning so well. He named it \"dephlogisticated air.\" Inside his theory, that was a perfectly sensible conclusion.<\/p>\n<p><strong>Lavoisier, from 1774.<\/strong> Lavoisier repeated Priestley's work. Over the next few years he built a radically different explanation: phlogiston doesn't exist. The gas is a distinct element, one part of ordinary air. Burning and rusting are cases of substances <em>combining<\/em> with it, which is why metals get heavier when they rust instead of lighter. He named the element <em>oxygène<\/em>, meaning \"acid-former,\" because he believed it was what made acids acidic. (It isn't; hydrochloric acid contains no oxygen at all.)<\/p>\n<p><strong>The holdout.<\/strong> Priestley never accepted Lavoisier's chemistry. He defended phlogiston until his death in 1804.<\/p>\n<p>So \"who discovered oxygen?\" has no clean answer. Scheele made it first. Priestley made it and published first. Lavoisier was the first to understand it roughly as we do, and he still attached a wrong idea to its name. Discovery here is not a moment. It's a process stretched over years, with an argument at its center.<\/p>\n<h2>Kuhn's Aristotle moment<\/h2>\n<p>Thomas S. Kuhn (1922–1996) earned a Ph.D. in physics at Harvard. In 1947 Harvard's president, James Conant, asked him to help prepare a science course for undergraduates built around historical case studies. Preparing for it, he read Aristotle's writings on motion, and at first they baffled him. Measured against Newton, Aristotle seemed not just wrong but almost incompetent at observing the world.<\/p>\n<p>Then something shifted. Kuhn began to see that Aristotle was asking different questions. Aristotle's \"motion\" covered all kinds of change, including growth and decay, not just objects moving through space. Read on its own terms, his physics was coherent and smart. The problem wasn't Aristotle. The problem was reading him through modern assumptions.<\/p>\n<p>That experience led, fifteen years later, to <em>The Structure of Scientific Revolutions<\/em> (1962), one of the most influential books about science ever written; it has sold more than a million copies. Its central claim: science doesn't develop only by steady accumulation. Long stretches of steady work are punctuated by revolutions, in which a scientific community replaces the framework it uses to define problems, read evidence, and decide what counts as a good answer. The oxygen story is one of Kuhn's favorite examples of such a revolution.<\/p>\n<h2>Why the textbooks hide it<\/h2>\n<p>Here is the point of this module's title. Kuhn argued that science textbooks make revolutions hard to see. Nobody plans this; it comes from the job textbooks are built to do. Their job is to train new scientists in the current framework as efficiently as possible. So they:<\/p>\n<ul>\n<li>present the past as a straight line leading to today's view;<\/li>\n<li>recast earlier scientists as working on today's problems (Priestley becomes \"the discoverer of oxygen,\" though he would have rejected the description);<\/li>\n<li>drop the losing theories, or mention them only as mistakes.<\/li>\n<\/ul>\n<p>The result is a history that looks cumulative even when it wasn't. Each generation of scientists learns from books that have been rewritten after the latest revolution, so the revolutions keep vanishing from view. Historians sometimes call this kind of storytelling <strong>Whig history<\/strong>: telling the past as an inevitable march toward the present.<\/p>\n<p>This matters for more than history class. If you believe science only accumulates, you'll expect today's theories to be permanent bricks in the wall. If Kuhn is right, today's theories might someday be reread the way we now read phlogiston: sensible in their time, and replaced.<\/p>\n<p><strong>Weird but true:<\/strong> Priestley also found a practical way to make carbonated water. Living beside a brewery in Leeds from 1767, he used the \"fixed air\" (carbon dioxide) rising from the fermenting vats, and in 1772 published directions for putting it into water.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Phlogiston:<\/strong> a substance that eighteenth-century chemists believed was released in burning. Lavoisier's oxygen theory replaced it.<\/li>\n<li><strong>Scientific revolution (Kuhn's sense):<\/strong> a change in the framework a scientific community uses to define problems and judge solutions.<\/li>\n<li><strong>Whig history:<\/strong> telling the past as a straight road to the present, judging earlier thinkers only by how close they came to today's answers.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Francis Bacon (1561–1626), in <em>Novum Organum<\/em> (1620), argued that science should advance by gathering many careful observations and building up general laws step by step, guarding against the mind's habit of leaping to conclusions. His picture of science is cumulative: knowledge grows more complete and more secure over time. For Bacon, a good method protects us from error. For Kuhn, even the best methods operate inside a framework, and frameworks themselves get replaced. Priestley and Lavoisier had the same gas and the same careful methods, yet reached different conclusions. Which picture fits the oxygen story better: Bacon's growing pile of facts, or Kuhn's pile that gets knocked over and rebuilt?<\/p><\/aside>\n<h2>The Anomaly Log<\/h2>\n<p>An <strong>anomaly<\/strong> is a result that doesn't fit the expectations of the framework you're using. Kuhn argued that revolutions begin when anomalies pile up and refuse to go away.<\/p>\n<p>Throughout this course, you'll apply that idea to the course itself. Start a page in your notebook or notes app titled <strong>Anomaly Log<\/strong>. At the end of each module, record anything in the course that seemed too tidy, one-sided, left out, or out of place. The last modules will use it.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>This reading criticizes tidy, ordered histories, then presents its own history as a tidy ordered list with bold dates. Notice that. You'll come back to it.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  document.getElementById('page').innerHTML =

    '<p class="done">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 1: The Textbook Lie · ' + (level === 'core' ? 'Core' : 'Extended');
</script>
