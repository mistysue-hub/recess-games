<script>
  var LEVELS = {"core": "<h1>Module 2: Rules Nobody Wrote Down<\/h1>\n<p class=\"lede\">In 1746, in front of the King of France, a scientist named Jean-Antoine Nollet lined up 180 royal guards holding hands. Then he sent one electric shock through all of them. They jumped into the air at the same instant. Later he did it with a long line of monks. Everyone could see electricity was real. Nobody could agree on what it was.<\/p>\n<h2><span>Learning a game by watching<\/span><\/h2>\n<p>Think about a game you learned on a playground or at a friend's house. Did anybody hand you a rule book? Probably not. You watched, you tried, someone said \"no, you can't do that,\" and after a while you just <em>knew<\/em> how the game worked. Some of those rules you might not even be able to put into words, but you'd notice right away if someone broke one.<\/p>\n<p>Thomas Kuhn thought science works a lot like that.<\/p>\n<h2><span>What's a paradigm?<\/span><\/h2>\n<p>Kuhn's most famous word is <strong>paradigm<\/strong> (say it: PAIR-uh-dime). It comes from an old Greek word meaning \"pattern\" or \"example.\"<\/p>\n<p>For Kuhn, a paradigm is the shared way a group of scientists sees its part of the world. It includes:<\/p>\n<ul>\n<li><strong>Big ideas everyone accepts<\/strong> (for example: \"matter is made of tiny particles\").<\/li>\n<li><strong>Model examples<\/strong> everyone has worked through, the way you learn math by doing practice problems.<\/li>\n<li><strong>Unwritten rules<\/strong> about which questions are worth asking and what a good answer looks like.<\/li>\n<\/ul>\n<p>Here's the key part: scientists mostly learn their paradigm the way you learned that playground game. Students don't memorize a list of rules. They solve problem after problem from their textbooks until they start seeing new problems the same way their teachers do.<\/p>\n<h2><span>Science before a paradigm: the electricity mess<\/span><\/h2>\n<p>What does science look like when there <em>isn't<\/em> a shared paradigm yet? Kuhn pointed to the study of electricity in the 1700s.<\/p>\n<p>People had known for a long time that rubbing amber or glass makes it attract bits of paper. In the 1700s, lots of experimenters got interested. But they couldn't agree on what electricity even <em>was<\/em>.<\/p>\n<ul>\n<li>Some focused on <strong>attraction and pushing apart<\/strong>: rubbed objects pulling or pushing things.<\/li>\n<li>In 1729, an English experimenter named Stephen Gray found that electricity could <strong>travel<\/strong> along a thread about 800 feet long.<\/li>\n<li>A French scientist, Charles du Fay, decided in the 1730s that there were <strong>two different kinds<\/strong> of electricity.<\/li>\n<li>Others were most excited by <strong>sparks<\/strong>.<\/li>\n<\/ul>\n<p>Everyone had their own theory, and each theory explained some results well and others badly. Every new book had to start from scratch, arguing about the basics.<\/p>\n<p>Then, in 1745 and 1746, experimenters in Germany and the Netherlands invented the <strong>Leyden jar<\/strong> (say it: LYE-den), a glass jar partly filled with water that could store electricity and give a powerful shock. It was the most dramatic thing anyone had seen, and the old theories had a hard time explaining it.<\/p>\n<p>In America, Benjamin Franklin came up with an idea: maybe electricity is one single invisible fluid. An object with too much of it is \"plus,\" and an object with too little is \"minus.\" His idea explained the Leyden jar very well. Over time, more and more experimenters started using Franklin's picture as their starting point.<\/p>\n<p>That changed everything. Instead of arguing about what electricity was, researchers could work on shared puzzles: How much charge can a jar hold? How does it flow? A paradigm had arrived.<\/p>\n<p>(Franklin's fluid idea wasn't the last word, by the way. Later science replaced it. But we still use his words \"plus\" and \"minus\" today.)<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Franklin's choice of which charge to call \"plus\" and which \"minus\" was really a guess. Today we know the tiny electrons carry the charge he called minus. So in a wire, electrons actually move the opposite way from the direction circuit diagrams draw the current.<\/p><\/aside>\n<h2><span>Words for your notebook<\/span><\/h2>\n<ul>\n<li><strong>Paradigm:<\/strong> the shared way a group of scientists sees its part of the world: big ideas, model examples, and unwritten rules.<\/li>\n<li><strong>Pre-paradigm science:<\/strong> science before a shared paradigm, when everyone starts from scratch.<\/li>\n<li><strong>Leyden jar:<\/strong> an early glass jar for storing electric charge, invented in 1745–46.<\/li>\n<\/ul>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>In the 1920s and 1930s, a group of thinkers in Austria called the <strong>Vienna Circle<\/strong> had a very different picture. For them, science was about two things only: logic and observations anyone can check. A statement only means something, they said, if some observation could show whether it's true. There's no room in that picture for unwritten rules or for how a group of scientists was trained. Kuhn said the group matters a lot. Who has the better picture of how scientists actually work?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your Anomaly Log.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This module said science \"before a paradigm\" was a mess. But it only gave one example, from one century. Is one example enough?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 2: Rules Nobody Wrote Down<\/h1>\n<p class=\"lede\">In 1746, before King Louis XV, the French experimenter Jean-Antoine Nollet sent the shock of a single Leyden jar through a chain of 180 royal guards holding hands, and they leapt into the air together. He repeated the stunt with a long chain of monks. It was spectacular, and it settled nothing about what electricity actually was. To see why that jar mattered so much, rewind a few years, to when nobody could agree on the question.<\/p>\n<h2><span>The rules you can't state but would notice broken<\/span><\/h2>\n<p>Native speakers of English almost all say \"a big red ball,\" never \"a red big ball.\" Very few could state the rule behind that. (Linguists have one: opinion, size, age, shape, color, origin, material, purpose.) Yet the wrong order sounds instantly off. You learned the rule from thousands of examples, not from a definition.<\/p>\n<p>Kuhn argued that the knowledge that holds a science together is often like this: learned from examples, shared by a community, mostly unstated, and very hard to see from the inside.<\/p>\n<h2><span>Paradigm<\/span><\/h2>\n<p>The word <strong>paradigm<\/strong> comes from the Greek <em>paradeigma<\/em>, \"pattern\" or \"example.\" Before Kuhn, it was best known as a grammar term: a model verb you conjugate so you can conjugate others like it. After 1962, thanks largely to Kuhn, it became one of the most overused words in English.<\/p>\n<p>Kuhn himself used it loosely. One early critic went through <em>Structure<\/em> and counted more than twenty different senses. In later writing Kuhn separated two main meanings:<\/p>\n<ol>\n<li><strong>The broad sense (he later called it a \"disciplinary matrix\"):<\/strong> everything a scientific community shares. Its basic laws and assumptions about what the world contains, its preferred methods and instruments, its standards for what counts as a real problem and a good solution, and even its sense of which results are surprising.<\/li>\n<li><strong>The narrow sense (exemplars):<\/strong> the concrete, worked-out solutions every student in a field learns. The inclined plane, the pendulum, the balanced chemical equation. Kuhn came to think this sense was the deeper one.<\/li>\n<\/ol>\n<p>Why would worked examples matter so much? A physics student who has solved enough pendulum and inclined-plane problems starts to <em>see<\/em> a new problem as \"basically a pendulum.\" No textbook states that rule. The skill of seeing resemblances is learned by doing, and it lets a community agree on what a problem is and how to attack it. Members share it so thoroughly that they rarely notice it.<\/p>\n<h2><span>Before the jar: four camps, no common ground<\/span><\/h2>\n<p>In the early 1700s, electrical researchers weren't working from one framework. Different researchers treated different effects as the main event. Four common positions:<\/p>\n<ul>\n<li><strong>Attraction.<\/strong> Rubbed amber and glass pull light objects; repulsion was an awkward side puzzle.<\/li>\n<li><strong>Conduction.<\/strong> In 1729 Stephen Gray sent the \"electric virtue\" along a thread about 800 feet long, and showed that some materials carry it and others don't.<\/li>\n<li><strong>Two electricities.<\/strong> In the 1730s Charles du Fay argued for two kinds, vitreous (from glass) and resinous (from amber).<\/li>\n<li><strong>Effluvium.<\/strong> Others pictured a material stream pouring out of rubbed bodies, and studied sparks and glow.<\/li>\n<\/ul>\n<p>Each camp explained its favorite effects and fumbled the rest. Because nobody could take any foundation for granted, every author had to argue the basics all over again. Observations piled up, but they didn't add up.<\/p>\n<h2><span>A jar, a shock, a race<\/span><\/h2>\n<p>Then, in 1745–46, a glass jar changed the argument. Ewald von Kleist in Germany and, independently, Pieter van Musschenbroek in Leiden found that a jar partly filled with water, with a wire through its cork, could store a startling amount of charge and deliver a savage shock. Musschenbroek wrote that he wouldn't take a second shock for the whole kingdom of France. (Within a couple of years, experimenters swapped the water for metal foil.) Within a year, Nollet was zapping guards at Versailles. The jar was dramatic, and it embarrassed most existing theories.<\/p>\n<p>Benjamin Franklin's <strong>one-fluid theory<\/strong> (late 1740s) handled it best. Electricity is a single fluid. A body can hold an excess of it (positive, \"plus\") or a deficit (negative, \"minus\"). In the jar, the glass keeps the two sides from evening out until a conductor connects them. (In England, William Watson reached a similar idea at about the same time.) Franklin's account didn't explain everything, but it explained the jar and much else, and it gave researchers a common starting point.<\/p>\n<p>What changed afterward is the important part. Researchers stopped relitigating foundations and began working on shared, specific problems: measuring charge, improving the jar, mapping conductors. Papers got narrower and more technical, written for fellow specialists. That shift, from debate about basics to focused puzzle-work, is what Kuhn meant by a field acquiring a paradigm. (Franklin's single fluid was itself replaced later. His plus and minus signs survived.)<\/p>\n<h2><span>Why this is controversial<\/span><\/h2>\n<p>Calling science a set of community-held, partly unstated commitments made many readers uneasy. If a paradigm is learned by apprenticeship rather than derived from logic and evidence, isn't science just a culture or a club? Kuhn denied saying science is irrational, but the worry followed him all his career, and you'll meet it again.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>Every field you'll study, from medicine to coding, still trains people on worked examples. When you learn to code by changing programs that already work, you're picking up a paradigm the same way the electricians after Franklin did.<\/p><\/aside>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Franklin's assignment of \"positive\" and \"negative\" was a convention made before anyone knew what carried charge. Electrons turned out to be negative, so in a wire they drift opposite to the \"conventional current\" still drawn in circuit diagrams. A paradigm's vocabulary can outlive the theory that chose it.<\/p><\/aside>\n<section class=\"glossary\"><h2><span>Terms<\/span><\/h2><ul>\n<li><strong>Paradigm:<\/strong> a scientific community's shared framework (broad sense) or its model problem solutions (narrow sense, \"exemplars\").<\/li>\n<li><strong>Exemplar:<\/strong> a standard worked example that teaches students how to see and solve new problems.<\/li>\n<li><strong>Pre-paradigm period:<\/strong> the stage of a field with competing schools and no shared foundations.<\/li>\n<\/ul><\/section>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>The <strong>Vienna Circle<\/strong>, a group of philosophers and scientists who met in Vienna in the 1920s and 1930s (including Moritz Schlick and Rudolf Carnap), developed <strong>logical positivism<\/strong>. Its core idea, the verification principle, held that a statement is meaningful only if observation could, in principle, confirm or disconfirm it. On this view, the justification of science lies in logic plus observation, not in how scientists happen to be trained or what their community takes for granted. Those things belong to psychology or sociology, not to the logic of science. Here's a twist: Kuhn's book was first published as part of the <em>International Encyclopedia of Unified Science<\/em>, a series launched by logical positivists, and Carnap was one of its editors. Scientists in a field all learn from the same worked examples. Does that shared training make their results more trustworthy, or just make them think alike? Use the Leyden jar story.<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This reading uses half a century of one field (electricity) to illustrate what all pre-paradigm science looks like. Every example so far in this course has come from physics and chemistry. Keep an eye on which sciences show up, and which don't.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};

    var ta = box.querySelector('#lg'), st = box.querySelector('#st');
    if (store) { ta.value = store.getItem(KEY + N) || ''; }
    ta.addEventListener('input', function(){ if (store) { try { store.setItem(KEY + N, ta.value); st.textContent = 'Saved'; } catch(e) {} } });
    function list(){
      var pl = box.querySelector('#pl'), n = 0; pl.innerHTML = '';
      for (var i = 1; i <= 12; i++) { var k = (i < 10 ? '0' : '') + i, v = store ? store.getItem(KEY + k) : '';
        if (v && v.trim()) { var li = document.createElement('li'); li.innerHTML = '<b>Module ' + i + ':</b> '; li.appendChild(document.createTextNode(v)); pl.appendChild(li); n++; } }
      box.querySelector('#past').style.display = n ? '' : 'none';
    }
    list(); ta.addEventListener('change', list);
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 2: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch(e) { st.textContent = 'Select your note and copy it.'; } t.remove(); }
      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion: paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
</body>
</html>
