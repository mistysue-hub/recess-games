<script>
  var LEVELS = {"core": "<h1>Module 8: Talking Past Each Other<\/h1>\n<p>In 1930, an 11-year-old girl in England came up with the name for a brand-new planet. Her name was Venetia Burney, and she suggested \"Pluto.\" Seventy-six years later, a vote took Pluto off the list of planets, and Pluto itself never changed at all.<\/p>\n<h2>The planet nobody counts anymore<\/h2>\n<p>On New Year's Day, 1801, the Italian astronomer Giuseppe Piazzi spotted a tiny moving dot between Mars and Jupiter. It was named Ceres, and for more than fifty years, astronomy books listed it as a planet.<\/p>\n<p>Then astronomers kept finding more objects in the same zone, dozens of them. Were they all planets? Slowly, during the 1850s and 1860s, astronomers started calling them something else: <strong>asteroids<\/strong>. Ceres hadn't changed at all. The word \"planet\" had.<\/p>\n<h2>Pluto's turn<\/h2>\n<p>In 1930, Clyde Tombaugh discovered Pluto, and for 76 years it was the ninth planet. Then, in 2005, a team led by Mike Brown found Eris, out past Pluto and almost exactly the same size. If Pluto was a planet, wasn't Eris? And what about the other icy worlds being found out there?<\/p>\n<p>In August 2006, the International Astronomical Union voted on an official definition. A planet must:<\/p>\n<ol>\n<li>orbit the Sun,<\/li>\n<li>be massive enough to pull itself into a round shape, and<\/li>\n<li>have <strong>cleared its neighborhood<\/strong>: be big enough that its gravity has swept away or controls the other objects near its orbit.<\/li>\n<\/ol>\n<p>Pluto passes the first two tests. It fails the third, because it shares its region of space with lots of other icy objects. So Pluto became a <strong>dwarf planet<\/strong>, and Eris and Ceres were called dwarf planets too.<\/p>\n<p>Notice: Pluto wasn't demoted for being \"too small.\" The rules set no minimum size: Mercury is smaller than Jupiter's moon Ganymede and is still a planet. Pluto changed category because of rule 3.<\/p>\n<h2>People still disagree<\/h2>\n<p>Not everyone accepts the vote. Alan Stern, the scientist who led NASA's New Horizons mission to Pluto, has argued that rule 3 makes no sense. Some scientists use a definition based on roundness alone, which would make Pluto a planet again, plus many others, including big moons like ours.<\/p>\n<p>Here's Kuhn's point. When two people argue \"Pluto is a planet!\" \"No, it isn't!\", they may not disagree about a single fact about Pluto. They agree on its size, its orbit, its icy surface. They're using the word \"planet\" differently. After a big change in science, the words people use can change meaning, and then people on the two sides talk past each other. Kuhn thought this made revolutions hard to settle with evidence alone.<\/p>\n<p><strong>Weird but true:<\/strong> Venetia Burney's grandfather read about the new planet in the newspaper and told her at breakfast. She suggested Pluto, the Roman god of the underworld. He passed the idea to an astronomer friend, who sent a telegram to the observatory in Arizona that had found it.<\/p>\n<h2>Words for your notebook<\/h2>\n<ul>\n<li><strong>Definition:<\/strong> the rules for what a word includes and leaves out.<\/li>\n<li><strong>Dwarf planet:<\/strong> a round body that orbits the Sun but hasn't cleared its neighborhood.<\/li>\n<li><strong>Talking past each other:<\/strong> arguing while using the same word to mean different things.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p>Scientists and philosophers argue about what science gives us. Some say good science is getting closer and closer to the truth about how the world really is, even the parts we can't see. Others say science only needs to fit what we can observe and make useful predictions, and that's enough. If astronomers can change the meaning of \"planet,\" does that mean science is about truth, or about useful ways of sorting things?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Did anything seem too tidy, left out, or not quite fitting? Add it to your log.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>This module treats the 2006 vote as the big moment. But only a few hundred of the thousands of astronomers in the IAU were in the room to vote.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 8: Talking Past Each Other<\/h1>\n<p>In March 1930, eleven-year-old Venetia Burney of Oxford suggested the name \"Pluto\" for the newly found ninth planet. Her grandfather passed it to an astronomer, who cabled it to Lowell Observatory. Seventy-six years later the same object was voted out of the category. Nothing about Pluto had changed.<\/p>\n<h2>Same object, different word<\/h2>\n<p>Giuseppe Piazzi found Ceres on January 1, 1801. It, and soon Pallas, Juno and Vesta, were counted as planets for over half a century. As dozens of similar bodies turned up between Mars and Jupiter, astronomers gradually stopped calling them planets; by the 1860s \"asteroid\" was the standard term. Nothing about Ceres changed. The category did.<\/p>\n<p>Clyde Tombaugh discovered Pluto in 1930. In 2005 Mike Brown, Chad Trujillo and David Rabinowitz announced Eris, slightly smaller than Pluto in diameter but about 27 percent more massive. Either Eris was the tenth planet, or \"planet\" needed rules. On August 24, 2006, the International Astronomical Union in Prague adopted a definition: a planet orbits the Sun, has enough mass to be nearly round, and has <strong>cleared the neighborhood<\/strong> around its orbit. Pluto fails the third criterion, so it became a <strong>dwarf planet<\/strong>, a category Eris and Ceres also fall into.<\/p>\n<p>The decision remains contested. Alan Stern, who led the New Horizons mission to Pluto, argues the third criterion is incoherent: Neptune hasn't cleared Pluto from its zone either. Some planetary scientists prefer a \"geophysical\" definition based on a body's own properties, under which Pluto, Eris, Ceres and even large moons count as planets.<\/p>\n<h2>Incommensurability<\/h2>\n<p>Kuhn's word for this situation was <strong>incommensurability<\/strong>, from a mathematical term for quantities with no common measure. His claim was that after a revolution, key terms change their meaning, so the old and new frameworks don't translate into each other cleanly. A key example was <strong>mass<\/strong>. In Newtonian physics, mass is conserved: you can't make or destroy it. In Einstein's physics, mass can be converted into energy. The word is the same; the concept isn't. A Newtonian and an Einsteinian can't simply compare answers, because they mean different things by the question.<\/p>\n<p>Critics heard this as saying rival theories can't be compared at all, which would make theory choice arbitrary. Kuhn rejected that reading. Incommensurable frameworks, he said, can still be compared, just not by word-for-word translation. Scientists learn the other side's language, the way a bilingual person does, and judge using shared values. (Module 10 returns to those values.)<\/p>\n<p>The Pluto debate is a small, friendly case. People on both sides agree on every measurement of Pluto. They disagree about what the word should do.<\/p>\n<p><strong>Weird but true:<\/strong> Venetia Burney's suggestion travelled from a breakfast-table conversation with her grandfather, Falconer Madan, to the astronomer Herbert Hall Turner, who cabled Lowell Observatory in Arizona. Names, like definitions, are decided by people.<\/p>\n<h2>Terms<\/h2>\n<ul>\n<li><strong>Incommensurability:<\/strong> the absence of a common measure between two frameworks, so that their key terms don't translate directly.<\/li>\n<li><strong>Dwarf planet:<\/strong> under the 2006 IAU definition, a nearly round body orbiting the Sun that has not cleared its neighborhood.<\/li>\n<li><strong>Constructive empiricism:<\/strong> the view that science aims only at theories that are accurate about what can be observed.<\/li>\n<\/ul>\n<aside class=\"sticky\"><span class=\"label\">Side View<\/span><p><strong>Scientific realists<\/strong> hold that our best theories are approximately true, including about things we can't observe, like electrons. Hilary Putnam (1975) gave the \"no miracles\" argument: realism is the only view that doesn't make the success of science a miracle. Bas van Fraassen, in <em>The Scientific Image<\/em> (1980), defended <strong>constructive empiricism<\/strong>: science aims at theories that are \"empirically adequate,\" true about observable things, and accepting a theory needn't mean believing everything it says about the unobservable. Kuhn's incommensurability sharpened this debate: if the meaning of \"mass\" changed, in what sense was Newton's mass ever \"approximately\" Einstein's? Back to Pluto: nothing measured about it changed in 2006, only the word \"planet.\" Did what we know change, or only how we sort it?<\/p><\/aside>\n<h2>Your Anomaly Log<\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><span class=\"label\">Anomaly<\/span><p>The module presents the 2006 IAU vote as decisive, but the vote was taken by the few hundred members present at the final session, out of an organization of thousands.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';

</script>
