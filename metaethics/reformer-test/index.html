<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reformer Test</title>
<style>/* Debate-card look shared by the Meta-ethics games (copied inline into each page at build). */
:root{--desk:#3b2a1e;--desk2:#2a1d14;--card:#fbf5e6;--ink:#2b2118;--muted:#6b5b4a;--brass:#b8893a;--brass2:#8a6424;--line:#e4d6b8;--good:#2f6b3a;--goodbg:#e3f0e2;--bad:#8a2f22;--badbg:#f6e2dc;--note:#efe4c8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at top,var(--desk) 0%,var(--desk2) 100%);min-height:100vh;color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif;padding:16px}
.wrap{max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:6px;padding:20px 20px 22px;box-shadow:0 6px 18px rgba(0,0,0,.35);margin-bottom:16px;border-top:4px solid var(--brass)}
.card.info{background:var(--note);border-top-color:var(--brass2);font-size:15px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:19px;margin:0 0 10px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px;font-family:system-ui,sans-serif}
.compass{display:block;margin:0 auto 6px;width:34px;height:34px}
.claim{font-size:20px;margin:6px 0 14px;padding:12px 14px;background:#fff;border-left:4px solid var(--brass);border-radius:4px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns.one{grid-template-columns:1fr}
button{font:600 16px/1.3 system-ui,sans-serif;padding:14px 12px;border-radius:6px;border:2px solid var(--brass2);background:#fff;color:var(--ink);cursor:pointer;min-height:52px;touch-action:manipulation}
button:hover{background:#fff8e6}
button:disabled{opacity:.55;cursor:default}
button.primary{background:var(--brass2);color:#fff;border-color:var(--brass2)}
button.picked{outline:3px solid var(--brass)}
.fb{margin-top:14px;padding:12px 14px;border-radius:6px;font-size:16px;display:none}
.fb.show{display:block}
.fb.good{background:var(--goodbg);color:var(--good)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.neutral{background:#f1ead8;color:var(--ink)}
.prog{font:13px system-ui,sans-serif;color:var(--muted);margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
.view{background:#fff;border-radius:6px;padding:10px 12px;border-left:4px solid var(--brass2);font-size:15px}
.view b{font-family:system-ui,sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--brass2)}
pre.res{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:10px 0}
.hide{display:none}
dl.bins{margin:0}dl.bins dt{font-weight:bold;font-family:system-ui,sans-serif;font-size:14px;margin-top:6px}dl.bins dd{margin:0 0 0 0}
@media (max-width:420px){.btns{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <svg class="compass" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="none" stroke="#b8893a" stroke-width="2"/><path d="M20 4 L24 20 L20 36 L16 20 Z" fill="#b8893a"/><circle cx="20" cy="20" r="2.5" fill="#fbf5e6"/></svg>
    <h1>The Reformer Test</h1>
    <p class="sub">Is Anything Really Wrong? · Session 4</p>
    <div id="stage"></div>
  </div>
  <div class="card info">
    <b>Cultural relativism</b> says right and wrong are set by a culture's own standards, so no culture's morality is mistaken by its own lights. Your job in the scored rounds is to say what <i>relativism</i> implies, not what you believe.
  </div>
</div>
<script>
/* Shared helpers for the Meta-ethics games (inlined into each page at build). */
const stage=document.getElementById('stage');
function el(h){stage.innerHTML=h;window.scrollTo(0,0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function endp(s){return /[.!?]$/.test(s)?s:s+'.'}
/* Scored question: two tries, then the answer. o={prog,head,q,opts,a,why,extra,next,cb(firstTry,tries)} */
function ask(o){
 let tries=0;
 el(`${o.prog?`<div class="prog">${o.prog}</div>`:''}${o.head||''}<div class="claim">${esc(o.q)}</div><div class="btns one">${o.opts.map((t,j)=>`<button data-j="${j}">${esc(t)}</button>`).join('')}</div><div class="fb" id="fb"></div>`);
 stage.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{
  const j=+b.dataset.j,fb=document.getElementById('fb');tries++;
  if(j===o.a||tries>=2){
   const ok=j===o.a;
   stage.querySelectorAll('.btns button').forEach(x=>x.disabled=true);
   b.classList.add('picked');
   fb.className='fb show '+(ok?'good':'bad');
   fb.innerHTML=`<b>${ok?'Yes':'The answer'}: ${esc(endp(o.opts[o.a]))}</b> ${o.why}${o.extra||''}<div class="btns one" style="margin-top:12px"><button class="primary" id="nx">${o.next||'Next'}</button></div>`;
   document.getElementById('nx').onclick=()=>o.cb(ok&&tries===1,ok?tries:0);
  } else {b.disabled=true;fb.className='fb show bad';fb.innerHTML='<b>Not quite.</b> Think back to the reading and try once more.';}
 });
}
/* Unscored choice with a reveal. o={prog,head,q,opts,reveal(j)->html,next,cb(j)} */
function choose(o){
 el(`${o.prog?`<div class="prog">${o.prog}</div>`:''}${o.head||''}${o.q?`<p>${esc(o.q)}</p>`:''}<div class="btns one">${o.opts.map((t,j)=>`<button data-j="${j}">${esc(t)}</button>`).join('')}</div><div class="fb" id="fb"></div>`);
 stage.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{
  const j=+b.dataset.j;
  if(!o.reveal){o.cb(j);return;}
  stage.querySelectorAll('.btns button').forEach(x=>x.disabled=true);b.classList.add('picked');
  const fb=document.getElementById('fb');fb.className='fb show neutral';
  fb.innerHTML=`${o.reveal(j)}<div class="btns one" style="margin-top:12px"><button class="primary" id="nx">${o.next||'Next'}</button></div>`;
  document.getElementById('nx').onclick=()=>o.cb(j);
 });
}
function views(v){return `<div class="two">${v.map(p=>`<div class="view"><b>${p[0]}</b><br>${p[1]}</div>`).join('')}</div>`}
function showResults(text){
 el(`<h2>Results</h2><pre class="res">${esc(text)}</pre><div class="btns one"><button class="primary" id="cp">Copy my results for Rocky</button></div><p class="sub" style="margin-top:12px">Paste them into your chat with Rocky, then type done.</p><div class="btns one"><button id="again">Play again</button></div>`);
 document.getElementById('cp').onclick=()=>copyText(text);
 document.getElementById('again').onclick=()=>location.reload();
}
function copyText(t){
 const b=document.getElementById('cp');
 let ok=false;const fin=()=>{ok=true;b.textContent='Copied! Now paste it to Rocky';};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(fin,()=>{if(!ok)fallback(t,fin);});setTimeout(()=>{if(!ok)fallback(t,fin);},1500);}else fallback(t,fin);
}
function fallback(t,done){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){document.getElementById('cp').textContent='Select the box above and copy it';}a.remove();}

let score=0,log=[],folk=[];
const ROUNDS=[
 {head:`<p><b>Frederick Douglass</b> (real history) was born into slavery in Maryland and escaped in 1838. He argued that slavery was wrong when it was accepted by millions of Americans and protected by national law.</p>`,
  q:"By the standards accepted in Maryland, the slave state where he was born, what does cultural relativism say about his claim that slavery was wrong?",
  opts:["It was right, because slavery is wrong everywhere","It was mistaken by Maryland's accepted standards","Relativism can't say anything about it"],a:1,
  why:"Cultural relativism measures right and wrong by a society's standards, and Maryland's accepted standards and laws allowed slavery.",
  views:[["Realist","Douglass was right and his society was wrong. That's exactly why he's admired."],["Relativist reply","He belonged to an abolitionist community, and he argued from his nation's own promise that all are created equal. By those standards, he was right."]]},
 {head:`<p><b>Susan B. Anthony</b> (real history) voted in the November 1872 U.S. election when women weren't allowed to. She was arrested, tried and fined $100, which she refused to pay.</p>`,
  q:"Now switch theories. Individual relativism says each person's own standards set what's right for them. What does it say about Anthony's voting?",
  opts:["Right by her own standards, so not mistaken","Wrong, because the law said so","Individual relativism can't say anything about it"],a:0,
  why:"By her own standards, voting was right, so individual relativism says she wasn't mistaken. <b>Twist:</b> by the same logic, anyone who breaks any law they personally disagree with is also right. Bug or feature?",
  views:[["Realist","She was right, but not because she believed it. Equal rights would be true even if she had doubted them."],["Cultural relativist","By her society's accepted standards in 1872, she was wrong. The two kinds of relativism can give opposite answers."]]},
 {head:`<p>The United States abolished slavery in 1865.</p>`,
  q:"What does cultural relativism say happened to the country's morality?",
  opts:["It became better by a standard that holds for every culture","It became morally worse","Its standards changed; no standard outside all cultures can call the change better"],a:2,
  why:"If each era's standards set what's right for that era, there's no outside measure that could make the new standards <i>better</i>. This is the moral-progress problem.",
  views:[["Realist","It became better. Moral progress is real, and this is a clear case."],["Relativist reply","By <i>our</i> standards today it was progress, and that's the only kind of judgment anyone can make."]]},
 {head:`<p><b>The tolerance trap.</b> Island A's standards say: be tolerant of outsiders. Island B's standards say: never tolerate outsiders' ways.</p>`,
  q:"According to cultural relativism, is Island B wrong to be intolerant?",
  opts:["Yes, tolerance is right for everyone","No, by its own standards intolerance is right for B","Only if Island A says so"],a:1,
  why:"\"Everyone should be tolerant\" is a rule for all cultures, and relativism says there are none. So it can't call B's intolerance wrong.",
  views:[["Critic","The view many people adopt <i>for</i> tolerance can't make tolerance a rule."],["Relativist reply","We can still be tolerant ourselves, because our standards value it. We just can't claim B is objectively mistaken."]]},
 {head:`<p><b>Check question.</b></p>`,
  q:"Descriptive relativism is the claim that...",
  opts:["each culture's morality is right for that culture","no one should ever judge another culture","cultures do in fact disagree about morality"],a:2,
  why:"It's a fact claim about what people believe. It doesn't say who, if anyone, is right. That bigger claim is moral relativism.",views:null}
];
const FOLK=[
 {who:"A classmate you know well",line:"thinks breaking a promise just to go to a party is fine."},
 {who:"Someone from a very different culture far away",line:"thinks breaking a promise just to go to a party is fine."},
 {who:"A visitor from another planet, with a totally different way of life",line:"thinks breaking a promise just to go to a party is fine."}
];
const FOPTS=["We could both be right","One of us must be mistaken","Not sure"];
function intro(){
 el(`<h2>Test relativism on real cases</h2><p>Part 1: four cases and a check question. For each, predict what <b>cultural relativism</b> says, then see how a realist and a relativist read it.</p><p>Part 2: a quick test researchers have run on real people. No right answers there.</p><div class="btns one"><button class="primary" onclick="round(0)">Start</button></div>`);
}
function round(i){
 const r=ROUNDS[i];
 ask({prog:`Part 1 · ${i+1} of ${ROUNDS.length}`,head:r.head,q:r.q,opts:r.opts,a:r.a,why:r.why,extra:r.views?views(r.views):'',
  next:i<ROUNDS.length-1?'Next case':'On to Part 2',
  cb:(first,tries)=>{if(first)score++;log.push(`R${i+1} ${tries===1?'right first try':tries===2?'right on try 2':'missed twice'}`);i<ROUNDS.length-1?round(i+1):folkIntro();}});
}
function folkIntro(){
 el(`<h2>Part 2: Could you both be right?</h2><p>You think breaking a promise just to go to a party is wrong. Three different people disagree with you. For each one, say whether you could <i>both</i> be right.</p><div class="btns one"><button class="primary" onclick="folkQ(0)">Start Part 2</button></div>`);
}
function folkQ(i){
 const f=FOLK[i];
 choose({prog:`Part 2 · ${i+1} of ${FOLK.length}`,head:`<div class="claim"><b>${esc(f.who)}</b> ${esc(f.line)}</div>`,q:"Could you both be right?",opts:FOPTS,
  cb:j=>{folk.push(FOPTS[j]);i<FOLK.length-1?folkQ(i+1):folkReveal();}});
}
function folkReveal(){
 const shifted=folk[0]!==folk[2];
 el(`<h2>What researchers found</h2><p>Your answers: classmate: <b>${esc(folk[0])}</b> · faraway culture: <b>${esc(folk[1])}</b> · visitor from another planet: <b>${esc(folk[2])}</b>.</p><div class="fb show neutral">In 2011, researchers led by Hagop Sarkissian asked people this kind of question. With someone from their own culture, most said one side must be mistaken. The more different the other person's way of life, the more people said both could be right, especially with an imagined alien.${shifted?' <b>Your answers shifted too.</b>':' <b>Your answers stayed the same</b>, unlike many people in the study.'}</div><p style="margin-top:14px">Is that shift a clue about morality, or just about how we feel about strangers? Bring your answer to Rocky.</p><div class="btns one"><button class="primary" onclick="finish()">See my results</button></div>`);
}
function finish(){
 showResults(`Reformer Test (Is Anything Really Wrong? M04)
What relativism implies: ${score} of ${ROUNDS.length} right first try (${log.join('; ')})
Could we both be right?
- Classmate: ${folk[0]}
- Faraway culture: ${folk[1]}
- Visitor from another planet: ${folk[2]}`);
}
intro();
</script>
</body>
</html>
