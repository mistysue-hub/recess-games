<script>
const STORY={"start": "Start", "startup": ["Init"], "header": ["Case Bar"], "passages": {"Init": "(set: $cases to (a:))(set: $miss to 0)(set: $clues to (a:))", "Case Bar": "<div class=\"casebar\">🔎 Cases closed: (print: $cases's length) / 8 · [[Case Board->HQ]] · [[Field Guide->Field Guide]] · [[How Common?->Frequency Files]]</div>", "Start": "# The Case of the Silent Space Bar\n\n*Rain taps on the window of* **Keycap & Co. Repair Bench.** *You're the newest junior technician, and your boss, an old repair legend everyone calls* **The Inspector,** *slides a stack of folders across the counter.*\n\n\"Eight cases, kid. Eight MSI keyboards. Every one has a space bar that quit. Same symptom, different crime.\"\n\n\"Here's the secret most people never learn: **the symptom is not the cause.** A dead space bar can be crumbs, a setting, a sneaky program, a spill, or a cable buried inside. Your job is to find out *what happened* — and *how* it happened.\"\n\n\"Interview the client. Gather clues. Run tests. Then name the culprit. Guess wrong twice and I'll walk you through it. No shame in that — that's how I learned.\"\n\n[[Open the case board->HQ]]", "HQ": "# 🗂️ The Case Board\n\nCases get harder as you go. Each one teaches a real repair skill.\n\n**Level 1 · Rookie**\n(if: $cases contains \"1\")[✅ ](else:)[📁 ][[Case 1: The Gamer Who Sprinted->C1 Intake]]\n(if: $cases contains \"2\")[✅ ](else:)[📁 ][[Case 2: The Crumb Bandit->C2 Intake]]\n\n**Level 2 · Investigator**\n(if: $cases contains \"3\")[✅ ](else:)[📁 ][[Case 3: The Midnight Remap->C3 Intake]]\n(if: $cases contains \"4\")[✅ ](else:)[📁 ][[Case 4: The Helpful Program That Wasn't->C4 Intake]]\n\n**Level 3 · Detective**\n(if: $cases contains \"5\")[✅ ](else:)[📁 ][[Case 5: The Press-the-Middle Puzzle->C5 Intake]]\n(if: $cases contains \"6\")[✅ ](else:)[📁 ][[Case 6: The Vigor Wobble->C6 Intake]]\n\n**Level 4 · Senior Tech**\n(if: $cases contains \"7\")[✅ ](else:)[📁 ][[Case 7: The Smoothie Incident->C7 Intake]]\n(if: $cases contains \"8\")[✅ ](else:)[(if: $cases's length >= 7)[📁 ](else:)[🔒 ]](if: $cases's length >= 7)[[[Boss Case 8: The Couch Drop->C8 Intake]]](else:)[Boss Case 8: The Couch Drop — *solve 7 cases to unlock*]\n\n(if: $cases's length is 8)[[[🏆 Claim your Master Technician badge->Final Badge]]]\n\n---\n🔧 [[Real Repair Mode: fix MY actual MSI space bar->Real Repair]]\n📊 [[The Frequency Files: how common is each culprit?->Frequency Files]]", "Suspects Lineup": "## The usual suspects\n\nEvery dead space bar comes down to one of these culprits. Learn them — they show up in every case.\n\n* **Glitch** — a temporary software hiccup. Fixed by a restart.\n* **Accessibility setting** — Sticky Keys or Filter Keys switched on by accident.\n* **Remap** — a program told the space bar to do something else.\n* **Bad driver** — the little program that lets Windows talk to the keyboard is wrong or scrambled.\n* **Debris** — crumbs, hair, dust jamming the key.\n* **Mechanical misfit** — the key or its stabilizer bar isn't pressing evenly.\n* **Liquid** — a spill shorted or gummed up the contacts.\n* **Loose connection** — a cable (inside a laptop, or a USB cable outside) isn't connected right.\n\n[[Back->HQ]]", "C1 Intake": "(set: $miss to 0)\n# Case 1: The Gamer Who Sprinted\n**Level 1 · Rookie**\n\n*A kid named* **Maya** *bursts in holding an* **MSI GF63 Thin** *gaming laptop.*\n\n\"I was playing my game for, like, three hours straight. Then I opened my homework and the space bar just... stopped. Everything else types. I didn't spill anything, I swear!\"\n\n*The Inspector raises an eyebrow.* \"Ask good questions, kid.\"\n\n[[Ask: \"What kind of game? Which keys were you using?\"->C1 Q1]]\n[[Ask: \"Does the space bar feel normal when you press it?\"->C1 Q2]]\n[[Run a test->C1 Tests]]", "C1 Q1": "\"It's a running game. You hold **Shift** to sprint. I was holding it down constantly. And sometimes I'd tap Shift a bunch to dodge.\"\n\n📝 *Clue: lots of holding and tapping Shift.*\n\n*Did your computer ever beep or show a little pop-up during the game?*\n\n\"Uh... maybe? Something popped up and I clicked **Yes** to get rid of it fast.\"\n\n📝 *Clue: a pop-up she clicked \"Yes\" on without reading.*\n\n[[Ask another question->C1 Intake]]\n[[Run a test->C1 Tests]]", "C1 Q2": "\"Yeah, it clicks like always. It's not stuck or crunchy.\"\n\n📝 *Clue: the key feels physically normal. That makes debris and broken parts less likely.*\n\n[[Ask another question->C1 Intake]]\n[[Run a test->C1 Tests]]", "C1 Tests": "## Choose a test\n\n[[Restart the laptop->C1 Restart]]\n[[Open the on-screen keyboard (Windows key + R, type osk)->C1 OSK]]\n[[Check Settings → Accessibility → Keyboard->C1 Access]]\n[[I'm ready to name the culprit->C1 Accuse]]", "C1 Restart": "You restart. The space bar... still doesn't work.\n\n📝 *Clue: not a temporary glitch — something is* **saved** *that survives a restart. That points to a* **setting.**\n\n[[Back to tests->C1 Tests]]", "C1 OSK": "You open the on-screen keyboard and watch it while Maya presses the real space bar. Quick taps: the on-screen key never lights up. But when she holds the real key down for a second... it lights up and types a space!\n\n📝 *Clue: quick presses get ignored, but long presses work.*\n\n[[Back to tests->C1 Tests]]", "C1 Access": "You open **Settings → Accessibility → Keyboard.** Something is switched **On** that shouldn't be...\n\nYou'll need to name it. Head to the lineup.\n\n[[Back to tests->C1 Tests]]\n[[Name the culprit->C1 Accuse]]", "C1 Accuse": "## Who did it?\n\n[[Debris under the key->C1 Wrong]]\n[[A bad driver->C1 Wrong]]\n[[Filter Keys, turned on by accident->C1 Right]]\n[[Liquid damage->C1 Wrong]]", "C1 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector leans over.* \"Let me show you. Quick presses are ignored, long presses work, and it survived a restart. That's **Filter Keys** — it tells Windows to ignore quick or repeated taps. It switches on if you hold the **right Shift for 8 seconds**, and Maya was holding Shift for hours.\"\n\n[[See how the case closes->C1 Right]]](else:)[*The Inspector shakes her head.* \"Not quite. Look at your clues again: the key feels normal, a restart didn't help, and **long presses work but quick ones don't.** What feature ignores quick key presses?\"\n\n[[Try again->C1 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C1 Right": "(if: $cases does not contain \"1\")[(set: $cases to it + (a: \"1\"))]\n# ✅ Case Closed: Filter Keys\n\n## How it happened\nMaya held **Shift** for sprinting. In Windows, **holding the right Shift key for 8 seconds** brings up the **Filter Keys** offer — and Maya clicked **Yes** to make the pop-up go away. Filter Keys tells Windows to **ignore brief or repeated keystrokes**, which is great for people with hand tremors, but it makes a fast typer's space bar seem dead. Its cousin, **Sticky Keys**, switches on when you press **Shift five times in a row.**\n\n## The fix\n**Windows key + I → Accessibility → Keyboard →** turn **Filter keys** and **Sticky keys** **Off.** You can also turn off the keyboard shortcuts that switch them on, right there in the same menu.\n\n## 📊 How common is it?\n**Very common — and very cheap to fix.** Accidental accessibility settings are one of the first things technicians check, because they're fast to rule out and can make a perfectly good keyboard seem broken.\n\n<div class=\"warn\">**Inspector's lesson:** Never click \"Yes\" on a pop-up you didn't read.</div>\n\n[[Back to the case board->HQ]]", "C2 Intake": "(set: $miss to 0)\n# Case 2: The Crumb Bandit\n**Level 1 · Rookie**\n\n**Grandpa Leo** *sets down an* **MSI Modern 15** *laptop.* \"My space bar's gone stubborn. Sometimes it works, sometimes I have to really smash it. And it makes a noise like walking on gravel.\"\n\n*There's a dog hair on his sweater and a tiny toast crumb on his sleeve.*\n\n[[Ask: \"Where do you usually use your laptop?\"->C2 Q1]]\n[[Ask: \"Did anything change on the computer recently?\"->C2 Q2]]\n[[Run a test->C2 Tests]]", "C2 Q1": "\"At the kitchen table, mostly. I have my toast and coffee while I read the news. Biscuit — that's my dog — sleeps right on my feet.\"\n\n📝 *Clue: food and a shedding dog near the keyboard, every single day.*\n\n[[Ask another question->C2 Intake]]\n[[Run a test->C2 Tests]]", "C2 Q2": "\"Well, there was a message saying Windows wanted to update. I said 'later.' Could that be it?\"\n\n📝 *Clue... or a red herring? A pending update is worth doing eventually, but would an update make a key sound* **crunchy?**\n\n[[Ask another question->C2 Intake]]\n[[Run a test->C2 Tests]]", "C2 Tests": "## Choose a test\n\n[[Shine a flashlight along the edges of the space bar->C2 Light]]\n[[Plug in a different USB keyboard->C2 External]]\n[[Run the Windows update->C2 Update]]\n[[I'm ready to name the culprit->C2 Accuse]]", "C2 Light": "You tilt a flashlight across the keyboard. In the gap under the space bar: **crumbs, a gray fuzz of dust, and a curly brown dog hair.**\n\n📝 *Clue: physical evidence at the scene.*\n\n[[Back to tests->C2 Tests]]", "C2 External": "The other keyboard's space bar works perfectly every time.\n\n📝 *Clue: Windows can make spaces fine — so the problem is in Leo's* **laptop keyboard itself.** *That's a* **hardware** *problem.*\n\n[[Back to tests->C2 Tests]]", "C2 Update": "The update installs. It takes 20 minutes. The space bar still crunches and skips.\n\n📝 *Clue: that was a red herring. Updates are good, but they can't remove gravel.*\n\n[[Back to tests->C2 Tests]]", "C2 Accuse": "## Who did it?\n\n[[The Windows update->C2 Wrong]]\n[[Debris — crumbs, dust, and dog hair->C2 Right]]\n[[Filter Keys->C2 Wrong]]\n[[A loose cable inside->C2 Wrong]]", "C2 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector points to the flashlight.* \"The answer was sitting right there. **Crunchy sound + works only with a hard press + crumbs visible under the key = debris.** Settings and drivers never make a key sound like gravel.\"\n\n[[See how the case closes->C2 Right]]](else:)[*The Inspector taps the counter.* \"Think about the **sound.** Can a software setting make a key crunch?\"\n\n[[Try again->C2 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C2 Right": "(if: $cases does not contain \"2\")[(set: $cases to it + (a: \"2\"))]\n# ✅ Case Closed: The Crumb Bandit\n\n## How it happened\nEvery morning: toast over the keyboard. Every day: Biscuit shedding at his feet. The **space bar is the biggest key and sits right where hands and crumbs land,** so debris slowly packed underneath until the key couldn't press down far enough to make contact.\n\n## The fix\n<div class=\"warn\">**Grown-up OK needed** for compressed air.</div>\n\n1. **Shut down** and **unplug** the laptop.\n2. Tip it upside down at an angle and **gently tap** to shake debris out.\n3. **Compressed air,** held upright, in short bursts along the space bar's edges.\n4. A soft brush to sweep the gap.\n5. **Don't pry off a laptop space bar** — the tiny plastic scissor clips and the metal stabilizer wire break easily.\n\n## 📊 How common is it?\n**Very common.** Repair shops consistently name **debris** as the top cause of keys that stick, skip, or need a hard press — especially single keys like the space bar.\n\n<div class=\"warn\">**Inspector's lesson:** Look before you click. A flashlight solved this faster than any software.</div>\n\n[[Back to the case board->HQ]]", "C3 Intake": "(set: $miss to 0)\n# Case 3: The Midnight Remap\n**Level 2 · Investigator**\n\n*Twins* **Sam and Ari** *share an* **MSI Katana** *gaming laptop. They are not happy with each other.*\n\n**Sam:** \"The space bar stopped typing spaces. Ari broke it!\"\n**Ari:** \"I did NOT. I didn't even touch the keyboard. I just set up my new game last night.\"\n\n[[Ask Ari: \"What exactly did you set up?\"->C3 Q1]]\n[[Ask Sam: \"Does the space bar do ANYTHING?\"->C3 Q2]]\n[[Run a test->C3 Tests]]", "C3 Q1": "**Ari:** \"I installed a program from a video so I could make **jump** happen with a different key. I changed some key settings. But that's just for the game!\"\n\n📝 *Clue: a key-remapping program was installed last night.*\n\n[[Ask another question->C3 Intake]]\n[[Run a test->C3 Tests]]", "C3 Q2": "**Sam:** \"When I press it in my document, nothing types. But my game character jumps when I press it in the game... even when the game isn't the main window, I think?\"\n\n📝 *Clue: the key* **is** *sending a signal — it's just being turned into something else.*\n\n[[Ask another question->C3 Intake]]\n[[Run a test->C3 Tests]]", "C3 Tests": "## Choose a test\n\n[[Plug in a different keyboard->C3 External]]\n[[Clean under the space bar->C3 Clean]]\n[[Check installed apps for keyboard tools->C3 Apps]]\n[[I'm ready to name the culprit->C3 Accuse]]", "C3 External": "You plug in a different USB keyboard. Its space bar **doesn't type spaces either!**\n\n📝 *Big clue: two different keyboards with the same problem. It can't be the laptop's physical key. Something in* **software** *is changing* **every** *space bar on this computer.*\n\n[[Back to tests->C3 Tests]]", "C3 Clean": "You clean it carefully. Spotless. It feels great. It still doesn't type spaces.\n\n📝 *Clue: debris ruled out.*\n\n[[Back to tests->C3 Tests]]", "C3 Apps": "In the list of installed apps you find **Microsoft PowerToys**, installed yesterday. It has a section called **Keyboard Manager.**\n\n📝 *Clue: a tool that can make one key act like another — for the whole computer, not just one game.*\n\n[[Back to tests->C3 Tests]]", "C3 Accuse": "## Who did it?\n\n[[Ari physically broke the key->C3 Wrong]]\n[[A key remap in PowerToys Keyboard Manager->C3 Right]]\n[[Debris->C3 Wrong]]\n[[A loose internal cable->C3 Wrong]]", "C3 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector folds her arms.* \"Two keyboards, same problem. That rules out the laptop's key entirely. Ari installed **PowerToys** and remapped keys — and a PowerToys remap applies to the **whole computer**, not just one game.\"\n\n[[See how the case closes->C3 Right]]](else:)[*The Inspector:* \"Remember the external keyboard test. If a **brand-new** keyboard has the same problem, can the laptop's key be the culprit?\"\n\n[[Try again->C3 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C3 Right": "(if: $cases does not contain \"3\")[(set: $cases to it + (a: \"3\"))]\n# ✅ Case Closed: The Midnight Remap\n\n## How it happened\nAri followed a video to remap keys for a game using **PowerToys Keyboard Manager**. In the shuffle, the space bar got reassigned. A remap like this works **system-wide** — in every app, on every keyboard — until it's removed. Ari didn't break anything physically; the space bar was **following new instructions.** (MSI Center, SteelSeries GG, and game macro tools on MSI gaming laptops can cause the same thing.)\n\n## The fix\nOpen **PowerToys → Keyboard Manager**, find the remap that involves the space bar, and delete it. In MSI Center or SteelSeries GG, look for key bindings or macros, or reset the keyboard profile to default.\n\n## 📊 How common is it?\n**Uncommon overall — but common among gamers.** It's easy to miss because the key *feels* totally normal.\n\n<div class=\"warn\">**Inspector's lesson:** \"What changed right before it broke?\" is the most powerful question in troubleshooting. Also, Ari is innocent... mostly.</div>\n\n[[Back to the case board->HQ]]", "C4 Intake": "(set: $miss to 0)\n# Case 4: The Helpful Program That Wasn't\n**Level 2 · Investigator**\n\n**Ms. Priya**, *a bookkeeper, brings in her* **MSI Prestige** *laptop.* \"My space bar has gone haywire. Sometimes it types a whole row of spaces, sometimes it acts like it's stuck ON until I press it again. It's like an on/off switch.\"\n\n[[Ask: \"When did this start?\"->C4 Q1]]\n[[Ask: \"Have you installed anything new?\"->C4 Q2]]\n[[Run a test->C4 Tests]]", "C4 Q1": "\"Tuesday. Right after my computer finished 'optimizing.'\"\n\n📝 *Clue: it started right after some kind of automatic change.*\n\n[[Ask another question->C4 Intake]]\n[[Run a test->C4 Tests]]", "C4 Q2": "\"An ad said my computer had '47 outdated drivers,' so I downloaded a free **driver updater** program. It updated everything automatically. So helpful!\"\n\n📝 *Clue: an all-in-one 'driver booster' style tool replaced drivers on her laptop.*\n\n[[Ask another question->C4 Intake]]\n[[Run a test->C4 Tests]]", "C4 Tests": "## Choose a test\n\n[[Check Sticky Keys / Filter Keys->C4 Access]]\n[[Plug in a different keyboard->C4 External]]\n[[Open Device Manager → Keyboards → Properties → Driver tab->C4 Driver]]\n[[I'm ready to name the culprit->C4 Accuse]]", "C4 Access": "All accessibility keyboard settings are **Off.**\n\n📝 *Clue: settings ruled out.*\n\n[[Back to tests->C4 Tests]]", "C4 External": "A different keyboard works fine.\n\n📝 *Hmm. That suggests the* **laptop's keyboard** *is the problem... but remember: the laptop's keyboard has its* **own** *driver, separate from a USB keyboard's. So a bad driver for the built-in keyboard is still a suspect.*\n\n[[Back to tests->C4 Tests]]", "C4 Driver": "The **Driver** tab shows the built-in keyboard's driver was changed **on Tuesday**, by the \"driver updater.\" The date matches exactly.\n\n📝 *Clue: the timing lines up perfectly.*\n\n[[Back to tests->C4 Tests]]", "C4 Accuse": "## Who did it?\n\n[[Debris->C4 Wrong]]\n[[Sticky Keys->C4 Wrong]]\n[[A wrong keyboard driver installed by the \"driver updater\"->C4 Right]]\n[[The space bar wore out->C4 Wrong]]", "C4 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector:* \"It started the exact day the driver updater ran, and the Driver tab confirms it. People on repair forums have reported that these tools can overwrite keyboard drivers or firmware with the **wrong** one. Culprit: **a bad driver.**\"\n\n[[See how the case closes->C4 Right]]](else:)[*The Inspector:* \"What happened **on Tuesday**? Follow the timeline.\"\n\n[[Try again->C4 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C4 Right": "(if: $cases does not contain \"4\")[(set: $cases to it + (a: \"4\"))]\n# ✅ Case Closed: The Helpful Program That Wasn't\n\n## How it happened\nA pop-up ad scared Priya with \"47 outdated drivers.\" The free updater swapped in drivers from its own collection — including a **mismatched keyboard driver.** The new driver misread the space bar's signals, making it repeat or act like a toggle. One real owner of an MSI gaming laptop had exactly this toggle problem and fixed it by **rolling back the keyboard driver.**\n\n## The fix\n<div class=\"warn\">**Grown-up needed** for Device Manager.</div>\n\n1. **Device Manager → Keyboards →** right-click the keyboard → **Properties → Driver → Roll Back Driver.**\n2. If that's grayed out: right-click → **Uninstall device**, then **Action → Scan for hardware changes.** Windows reinstalls a clean driver. (This is MSI's own recommended step.)\n3. Get any MSI-specific drivers **only from MSI's support page for that exact model,** or the MSI Center app.\n4. Uninstall the \"driver updater.\"\n\n## 📊 How common is it?\n**Uncommon, but sneaky.** Driver problems usually show up right after an update or a new program — so the **timeline** is your best clue.\n\n<div class=\"warn\">**Inspector's lesson:** Scary ads that say your computer is in trouble are trying to sell you something.</div>\n\n[[Back to the case board->HQ]]", "C5 Intake": "(set: $miss to 0)\n# Case 5: The Press-the-Middle Puzzle\n**Level 3 · Detective**\n\n**Devon**, *a college student, puts down a brand-new MSI laptop.* \"It's two weeks old! The space bar works if I hit it dead center. But I type with my thumb on the **right side**, and half my spaces go missing.\"\n\n[[Ask: \"Has it ever worked on the ends?\"->C5 Q1]]\n[[Ask: \"Any spills, drops, or new programs?\"->C5 Q2]]\n[[Run a test->C5 Tests]]", "C5 Q1": "\"Honestly? I think it's been like this since day one. I just thought I was a sloppy typist.\"\n\n📝 *Clue: present from the start — not something that happened later.*\n\n[[Ask another question->C5 Intake]]\n[[Run a test->C5 Tests]]", "C5 Q2": "\"Nope. Nothing. It's practically new.\"\n\n📝 *Clue: no accident, no software change.*\n\n[[Ask another question->C5 Intake]]\n[[Run a test->C5 Tests]]", "C5 Tests": "## Choose a test\n\n[[Press the space bar slowly at the left end, middle, and right end->C5 Press]]\n[[Reinstall the keyboard driver->C5 Driver]]\n[[Shine a flashlight under the key->C5 Light]]\n[[I'm ready to name the culprit->C5 Accuse]]", "C5 Press": "* **Middle:** types a space every time. ✅\n* **Left end:** works only with a hard press. ⚠️\n* **Right end:** usually nothing. ❌\n\n📝 *Clue: the closer you press to the middle, the better it works. Where might the actual switch be?*\n\n[[Back to tests->C5 Tests]]", "C5 Driver": "You reinstall the driver. No change at all.\n\n📝 *Clue: software is very unlikely. A driver doesn't know* **where** *on a key you pressed.*\n\n[[Back to tests->C5 Tests]]", "C5 Light": "Clean as a whistle. No crumbs, no hair.\n\n📝 *Clue: debris ruled out.*\n\n[[Back to tests->C5 Tests]]", "C5 Accuse": "## Who did it?\n\n[[A bad driver->C5 Wrong]]\n[[Debris->C5 Wrong]]\n[[A mechanical misfit — the ends of the key don't press the center switch far enough->C5 Right]]\n[[Filter Keys->C5 Wrong]]", "C5 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector:* \"Under most laptop space bars, the switch is only in the **middle**. A metal **stabilizer bar** is supposed to make the whole key go down evenly. If the key sits a little high, pressing the end doesn't push the middle far enough. That's **mechanical** — no software can fix it.\"\n\n[[See how the case closes->C5 Right]]](else:)[*The Inspector:* \"Software doesn't know **where** on a key your finger landed. What kind of problem changes depending on **where** you press?\"\n\n[[Try again->C5 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C5 Right": "(if: $cases does not contain \"5\")[(set: $cases to it + (a: \"5\"))]\n# ✅ Case Closed: The Press-the-Middle Puzzle\n\n## How it happened\nNobody did anything wrong. Under the space bar, the switch that registers a press sits in the **center**. The **stabilizer bar** should level the key so a press at either end still reaches the center. On Devon's laptop, the fit was slightly off from the factory, so end presses didn't travel far enough. This is a **known complaint** from owners of several MSI models (and other brands too).\n\n## The fix\n1. **Software can't fix it** — skip the drivers.\n2. Devon's laptop is two weeks old, so it's **under warranty.** Contact **MSI support or the store** — this is the best fix.\n3. Some owners have fixed it themselves by tucking a tiny (about 5 mm) square of paper or a thin sticky pad under the **center** of the keycap so it reaches the switch sooner. That risks breaking clips and voiding the warranty, so it's a **grown-up-only, last-resort** fix, and never on a laptop still under warranty.\n\n## 📊 How common is it?\n**Uncommon overall, but a recognized pattern.** Its clue is unmistakable: **works in the middle, fails at the ends, never involved an accident.**\n\n<div class=\"warn\">**Inspector's lesson:** Sometimes the culprit is the design itself. A good tech knows when the answer is \"use the warranty.\"</div>\n\n[[Back to the case board->HQ]]", "C6 Intake": "(set: $miss to 0)\n# Case 6: The Vigor Wobble\n**Level 3 · Detective**\n\n**Jordan** *carries in an* **MSI Vigor GK50** *mechanical gaming keyboard.* \"So I watched a video, used the keycap puller that came in the box, and deep-cleaned my whole keyboard. Every key works great now... except the space bar. It wobbles, and the left side doesn't register.\"\n\n[[Ask: \"How did you take the space bar off?\"->C6 Q1]]\n[[Ask: \"Did you notice any metal parts?\"->C6 Q2]]\n[[Run a test->C6 Tests]]", "C6 Q1": "\"I hooked the puller under one end and yanked it up. It made a little *snap* sound. Then I just pushed it back on.\"\n\n📝 *Clue: yanked from one end, with a snap.*\n\n[[Ask another question->C6 Intake]]\n[[Run a test->C6 Tests]]", "C6 Q2": "\"Oh yeah, there was a bent metal wire thing that came loose. I kind of... pushed it back under.\"\n\n📝 *Clue: a loose metal wire under the space bar.*\n\n[[Ask another question->C6 Intake]]\n[[Run a test->C6 Tests]]", "C6 Tests": "## Choose a test\n\n[[Unplug and replug the keyboard->C6 Replug]]\n[[Remove the space bar slowly and look underneath->C6 Look]]\n[[Reinstall drivers->C6 Driver]]\n[[I'm ready to name the culprit->C6 Accuse]]", "C6 Replug": "Unplugged, replugged, different USB port. Every other key works. Space bar still wobbles.\n\n📝 *Clue: the connection is fine.*\n\n[[Back to tests->C6 Tests]]", "C6 Look": "You unplug the keyboard and lift the space bar **slowly and evenly from both ends.** Underneath, the long metal **stabilizer wire** has popped out of its clip on the **left side.**\n\n📝 *Clue: found it at the scene.*\n\n[[Back to tests->C6 Tests]]", "C6 Driver": "The keyboard works perfectly in every other way. Drivers wouldn't make one key wobble.\n\n📝 *Clue: software ruled out.*\n\n[[Back to tests->C6 Tests]]", "C6 Accuse": "## Who did it?\n\n[[A dead switch->C6 Wrong]]\n[[A popped-out stabilizer wire->C6 Right]]\n[[A bad USB port->C6 Wrong]]\n[[A remap->C6 Wrong]]", "C6 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector:* \"Wobble + one side doesn't register + 'a metal wire came loose' = the **stabilizer.** The space bar is so long it needs a wire to keep it level. Yank one end and the wire pops out of its clip.\"\n\n[[See how the case closes->C6 Right]]](else:)[*The Inspector:* \"What does a long key need to keep it from **wobbling**? Think about that metal wire.\"\n\n[[Try again->C6 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C6 Right": "(if: $cases does not contain \"6\")[(set: $cases to it + (a: \"6\"))]\n# ✅ Case Closed: The Vigor Wobble\n\n## How it happened\nJordan did a great job cleaning — mechanical keyboards like the Vigor GK series are **designed** for keycaps to come off, and MSI even includes a puller. But the **space bar is special**: it has **stabilizers** (plastic clips plus a metal wire). Yanking from one end popped the wire out of its left clip, so the key tilts instead of pressing straight down.\n\n## The fix\n<div class=\"warn\">**Grown-up OK needed.** Unplug first.</div>\n1. Remove the keys around the space bar for room.\n2. Lift the space bar **slowly and evenly from both ends.**\n3. Hook each end of the wire back into its clip. If the wire is **bent**, don't force it — a replacement may be needed.\n4. Press the space bar **straight down** until it seats, then test both ends.\n\n## 📊 How common is it?\n**Common — after DIY cleaning.** It's one of the most frequent \"I fixed it and now it's worse\" problems with mechanical keyboards.\n\n<div class=\"warn\">**Inspector's lesson:** Big keys come off slow and level. Never yank.</div>\n\n[[Back to the case board->HQ]]", "C7 Intake": "(set: $miss to 0)\n# Case 7: The Smoothie Incident\n**Level 4 · Senior Tech**\n\n**Mrs. Okafor** *rushes in with an* **MSI laptop** *sealed in a giant zip bag full of* **rice.**\n\n\"My son knocked a **mango smoothie** onto it yesterday. I shut it off right away and put it in rice overnight. This morning it turned on! But now the space bar is sticky and half dead, and some other keys feel gummy.\"\n\n*The Inspector sighs at the rice.*\n\n[[Ask: \"What did you do right after the spill?\"->C7 Q1]]\n[[Ask: \"Did you turn it on to check it before this morning?\"->C7 Q2]]\n[[Run a test->C7 Tests]]", "C7 Q1": "\"I held the power button until it shut off, unplugged it, and wiped the keyboard with a towel. Then the rice.\"\n\n📝 *Clue: shutting it off fast was* **excellent.** *Wiping (instead of blotting) can spread liquid around.*\n\n[[Ask another question->C7 Intake]]\n[[Run a test->C7 Tests]]", "C7 Q2": "\"Well... once last night, just for a second, to see if it was okay.\"\n\n📝 *Clue: powering on while still wet is risky — electricity plus liquid can short circuits.*\n\n[[Ask another question->C7 Intake]]\n[[Run a test->C7 Tests]]", "C7 Tests": "## Choose a test\n\n[[Shine a flashlight under the keys->C7 Light]]\n[[Check accessibility settings->C7 Access]]\n[[Press the space bar and listen->C7 Press]]\n[[I'm ready to name the culprit->C7 Accuse]]", "C7 Light": "Under the space bar: a dried, shiny, orange **film**. And a few **grains of rice** wedged in the gaps.\n\n📝 *Clue: sugary residue — plus a bonus problem from the rice.*\n\n[[Back to tests->C7 Tests]]", "C7 Access": "All off. Settings are fine.\n\n📝 *Clue: software ruled out.*\n\n[[Back to tests->C7 Tests]]", "C7 Press": "It makes a slow, sticky *thwuck* and is slow to come back up.\n\n📝 *Clue: something gummy is holding the key down.*\n\n[[Back to tests->C7 Tests]]", "C7 Accuse": "## Who did it?\n\n[[Dry crumbs only->C7 Wrong]]\n[[Sugary liquid residue (with rice as an accomplice)->C7 Right]]\n[[A bad driver->C7 Wrong]]\n[[Filter Keys->C7 Wrong]]", "C7 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector:* \"A mango smoothie is full of **sugar.** When the water dries, the sugar stays behind as glue. That's why the key is sticky and other nearby keys feel gummy too. And the rice? Grains got stuck in the gaps.\"\n\n[[See how the case closes->C7 Right]]](else:)[*The Inspector:* \"What's left behind when a **smoothie** dries? Water evaporates... but what doesn't?\"\n\n[[Try again->C7 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C7 Right": "(if: $cases does not contain \"7\")[(set: $cases to it + (a: \"7\"))]\n# ✅ Case Closed: The Smoothie Incident\n\n## How it happened\nThe smoothie seeped under the space bar and nearby keys. Mrs. Okafor did the most important thing right — **power off immediately.** But the water dried and left **sugar** behind, gluing the key mechanisms. Turning it on while still damp risked a short circuit. And the **rice** didn't dry it faster than open air would have; it just added grains to the gaps.\n\n## The right spill response\n<div class=\"warn\">**Get a grown-up right away.**</div>\n1. **Power off immediately** and unplug.\n2. **Flip it upside down** (laptop open in a tent shape) so liquid drains *out*.\n3. **Blot, don't wipe.**\n4. **Wait at least 24–48 hours** before turning it on. No \"quick checks.\"\n5. **Skip the rice.**\n6. **Sugary drinks** (juice, soda, smoothies, milk) usually need a **professional cleaning**, because residue can keep causing corrosion and stickiness inside.\n\n## 📊 How common is it?\n**Very common — the #1 thing repair shops see.** One repair shop even reports that spills make up about 60% of the keyboard failures it handles. Spills are dramatic and usually need professional help, so they show up at repair counters a lot.\n\n<div class=\"warn\">**Inspector's lesson:** The first minute after a spill matters more than anything you do the next day.</div>\n\n[[Back to the case board->HQ]]", "C8 Intake": "(set: $miss to 0)\n# Boss Case 8: The Couch Drop\n**Level 4 · Senior Tech**\n\n**Alex** *places an* **MSI GF63** *on the counter like it's a sleeping animal.*\n\n\"So, a few weeks ago it slid off the couch onto the floor. It seemed fine! But last week the space bar died. Then **B**, **N**, and **M** started going out too. And the right **Alt** key.\"\n\n*The Inspector leans in.* \"Now this is a real case. Take your time.\"\n\n[[Ask: \"Did anything get spilled, ever?\"->C8 Q1]]\n[[Ask: \"Did you try anything already?\"->C8 Q2]]\n[[Ask: \"Does the laptop flex or creak anywhere?\"->C8 Q3]]\n[[Run a test->C8 Tests]]", "C8 Q1": "\"Never. I don't eat near it.\"\n\n📝 *Clue: no spill, and probably not much debris.*\n\n[[Ask another question->C8 Intake]]\n[[Run a test->C8 Tests]]", "C8 Q2": "\"I restarted, like, ten times. I checked Sticky Keys. My mom helped me reinstall the keyboard driver. Nothing.\"\n\n📝 *Clue: the easy software fixes are already ruled out. Good — Alex did the first steps right.*\n\n[[Ask another question->C8 Intake]]\n[[Run a test->C8 Tests]]", "C8 Q3": "\"Hmm. When I press down on the bottom-left corner, sometimes the keys flicker back on for a second.\"\n\n📝 *Clue: pressing the case changes whether keys work. Something inside is* **loose.**\n\n[[Ask another question->C8 Intake]]\n[[Run a test->C8 Tests]]", "C8 Tests": "## Choose a test\n\n[[Plug in a different keyboard->C8 External]]\n[[Do an EC reset with the battery reset hole->C8 EC]]\n[[Clean under the keys->C8 Clean]]\n[[Look at which keys are failing->C8 Pattern]]\n[[I'm ready to name the culprit->C8 Accuse]]", "C8 External": "A USB keyboard works perfectly — every key.\n\n📝 *Clue: Windows is fine. The problem is the* **laptop's own keyboard or its connection.**\n\n[[Back to tests->C8 Tests]]", "C8 EC": "<div class=\"warn\">**Grown-up needed.** You shut down the laptop, unplug the charger, and press a straightened paperclip into the tiny **Battery Reset Hole** on the bottom for about 10 seconds. This resets the **EC (Embedded Controller)** chip that helps run the keyboard. It doesn't erase files.</div>\n\nYou plug the charger back in and power on. No change.\n\n📝 *Clue: not a stuck controller.*\n\n[[Back to tests->C8 Tests]]", "C8 Clean": "Squeaky clean. No change.\n\n📝 *Clue: debris ruled out.*\n\n[[Back to tests->C8 Tests]]", "C8 Pattern": "Space, B, N, M, right Alt... they're all **neighbors**, clustered in the bottom rows. Inside a keyboard, keys are wired in a grid of rows and columns that all travel through **one flat ribbon cable.** A *group* of keys failing together is a classic sign that part of that connection isn't touching.\n\n📝 *Big clue: neighboring keys failing together.*\n\n[[Back to tests->C8 Tests]]", "C8 Accuse": "## Who did it?\n\n[[A bad driver->C8 Wrong]]\n[[Hidden debris->C8 Wrong]]\n[[A loosened ribbon cable inside, from the drop->C8 Right]]\n[[Sticky Keys->C8 Wrong]]", "C8 Wrong": "(set: $miss to it + 1)\n(if: $miss >= 2)[*The Inspector:* \"Put it all together: a **drop**, then a **group of neighboring keys** failing, keys **flickering when the case is pressed**, and an **external keyboard works fine.** Software was ruled out by Alex. The drop jostled the **ribbon cable** connecting the keyboard to the main board.\"\n\n[[See how the case closes->C8 Right]]](else:)[*The Inspector:* \"Software's been ruled out. Debris's been ruled out. What happens inside a laptop when it **falls**, and why would pressing the case make keys flicker?\"\n\n[[Try again->C8 Accuse]]\n[[Review the suspects->Suspects Lineup]]]", "C8 Right": "(if: $cases does not contain \"8\")[(set: $cases to it + (a: \"8\"))]\n# ✅ Boss Case Closed: The Couch Drop\n\n## How it happened\nWhen the laptop hit the floor, the jolt nudged the thin **ribbon cable** that connects the keyboard to the main board. At first it still touched well enough. Weeks of normal flexing as Alex picked it up and typed slowly worked it looser, until the circuits for one cluster of keys — the space bar and its neighbors — lost contact. Pressing the case squeezed it back into place for a moment, which is why keys flickered.\n\n## The fix\n<div class=\"warn\">**This is where a home technician STOPS.** Fixing a ribbon cable means opening the laptop. Doing it yourself can void the warranty or damage the delicate connector.</div>\n\n1. **Under warranty?** Contact **MSI support** or the store.\n2. **Out of warranty?** A repair shop can reseat the cable, or replace the keyboard if the cable is damaged.\n3. **Meanwhile:** use an external keyboard.\n\n## 📊 How common is it?\n**Less common, but serious.** It usually comes with a history — a **drop, a bump, or lots of flexing** — and a **group** of keys failing together.\n\n<div class=\"warn\">**Inspector's lesson:** You ruled out everything safe first. Knowing when to hand it to a pro isn't giving up — it's what pros do.</div>\n\n[[Back to the case board->HQ]]", "Final Badge": "# 🏆 Master Technician\n\n*The Inspector hands you a brass badge shaped like a space bar.*\n\n\"Eight cases, eight different culprits, one symptom. You learned the method:\"\n\n1. **Interview** — \"What changed right before it broke?\"\n2. **Restart** — it clears temporary glitches.\n3. **Split the suspects** — another keyboard working means the problem is this keyboard's hardware or driver; another keyboard failing too means software.\n4. **Settings before drivers, drivers before tools, tools before opening anything.**\n5. **Look at the evidence** — sounds, crumbs, timing, which keys, where you press.\n6. **Know when to stop** and get a grown-up or a professional.\n\n[[Read the Frequency Files->Frequency Files]]\n[[Try Real Repair Mode on your own keyboard->Real Repair]]\n[[Back to the case board->HQ]]", "Frequency Files": "# 📊 The Frequency Files\n## How common is each culprit?\n\n* **Debris (crumbs, dust, hair)** — ⭐⭐⭐⭐ Very common · *Fix: Easy at home*\n* **Liquid spills** — ⭐⭐⭐⭐ Very common at repair shops · *Fix: Often needs a pro*\n* **Temporary glitch** — ⭐⭐⭐ Common · *Fix: Easiest — restart*\n* **Accessibility settings (Sticky/Filter Keys)** — ⭐⭐⭐ Common · *Fix: Easy*\n* **Stabilizer popped out (after DIY cleaning)** — ⭐⭐⭐ Common on mechanical keyboards · *Fix: Medium*\n* **Bad or mismatched driver** — ⭐⭐ Uncommon · *Fix: Medium*\n* **Key remap / macro software** — ⭐⭐ Uncommon (common among gamers) · *Fix: Easy, once found*\n* **Mechanical misfit (press-the-middle)** — ⭐⭐ Uncommon, known pattern · *Fix: Warranty*\n* **Loose ribbon cable** — ⭐ Less common, serious · *Fix: Pro only*\n\n## 🧠 Detective's puzzle: why do the numbers disagree?\n\nIf you look up \"most common cause of keyboard failure,\" you'll find wildly different answers. One repair shop says about **60%** of the broken keyboards it sees are **spills.** Another repair blog says **debris** is \"by far\" the most common cause. A third claims that at least **40%** of the time, the fix is just a **software toggle or a driver reinstall.**\n\nWho's right? Maybe **all of them** — because they're counting **different things.**\n\n* **Repair shops** only see the keyboards people *bring in.* Nobody pays a shop to turn off Filter Keys — they fix that at home. So shops see lots of spills and few setting problems.\n* **Home troubleshooting guides** hear from people who fix it themselves, so software fixes look more common there.\n\nScientists call this **selection bias**: *where* you collect your data changes *what* the data says.\n\n<div class=\"warn\">**Inspector's lesson:** Before you trust a statistic, ask, \"Who counted, and what did they count?\"</div>\n\n[[Back to the case board->HQ]]", "Field Guide": "# 📘 The Technician's Field Guide\n\nQuick reference for every tool you'll use:\n\n* **On-screen keyboard:** Windows key + R → type `osk` → Enter\n* **Accessibility settings:** Windows key + I → Accessibility → Keyboard (Sticky, Filter, Toggle keys)\n* **Sticky Keys shortcut:** press Shift 5 times · **Filter Keys shortcut:** hold right Shift 8 seconds\n* **Reinstall a driver:** Device Manager → Keyboards → right-click → Uninstall device → Action → Scan for hardware changes *(grown-up)*\n* **Roll back a driver:** Device Manager → Keyboards → Properties → Driver → Roll Back Driver *(grown-up)*\n* **MSI EC reset:** shut down → unplug charger → paperclip in Battery Reset Hole for about 10 seconds → plug in → power on. No hole? Hold power about 30 seconds with the charger unplugged. *(grown-up)*\n* **MSI drivers and BIOS:** only from MSI's support page for your exact model, or MSI Center *(grown-up; never interrupt a BIOS update)*\n* **Voice typing workaround:** Windows key + H\n\n[[Back to the case board->HQ]]", "Real Repair": "# 🔧 Real Repair Mode\n*The real-life version: work through it with YOUR actual MSI keyboard.*\n\nYou sit down to type, hit the space bar... and nothing happens. Your words are smashingtogetherlikethis.\n\nDon't panic. Most space bar problems can be fixed at home, and you're going to work through them like a real repair tech: **easiest and safest fixes first**, hard stuff last.\n\n<div class=\"warn\">**Tech rule #1:** Anything that involves opening, unplugging, resetting, or putting liquid near a computer needs a grown-up's OK first. You'll see a red box like this whenever that applies.</div>\n\nFirst things first. What kind of MSI keyboard are we rescuing?\n\n[[The keyboard built into my MSI laptop->Laptop Symptoms]]\n[[A separate MSI keyboard that plugs into a computer (like a Vigor or Forge GK)->External Symptoms]]\n[[I'm not sure->Which Keyboard]]", "Which Keyboard": "## Which one do I have?\n\n* If the keyboard is **attached to the screen** and folds shut like a book, it's a **laptop keyboard**.\n* If it's a **separate keyboard** with a cable (or a little USB receiver) going to a computer, it's an **external keyboard**. MSI's external gaming keyboards usually have a model name like **Vigor GK30**, **GK50**, **GK71**, or **Forge GK** printed on a sticker underneath.\n\n[[It's a laptop keyboard->Laptop Symptoms]]\n[[It's an external keyboard->External Symptoms]]", "Laptop Symptoms": "## What's the space bar doing?\n\nLook closely. Each problem points to a different cause.\n\n[[It does nothing at all, no matter where I press->Restart First]]\n[[It only works if I press the middle; the ends don't count->Edges Problem]]\n[[It feels crunchy, sticky, or gets stuck down->Debris Check]]\n[[It acts weird: types twice, acts like it's held down, or works like an on/off switch->Restart First]]\n[[Something got spilled on it->Spill Emergency]]", "External Symptoms": "## What's the space bar doing?\n\n[[It does nothing at all->External Connection]]\n[[It only works if I press the middle->External Stabilizer]]\n[[It feels crunchy, sticky, or gets stuck down->External Debris]]\n[[It types twice or acts like it's held down->Restart First]]\n[[Something got spilled on it->Spill Emergency]]", "Restart First": "## Step 1: The classic restart\n\nIt sounds too simple, but lots of keyboard problems are just a temporary software glitch, and a restart clears them.\n\n1. Save your work.\n2. Click **Start → Power → Restart**. (A *restart* clears more than closing the lid or using Sleep.)\n3. Once Windows is back, open **Notepad** and try the space bar.\n\nDid it come back?\n\n[[Yes! It works now.->Fixed]]\n[[Nope, still broken.->Detective Test]]", "Detective Test": "## Step 2: Be a detective — is it the keyboard or the computer?\n\nReal techs split every problem into two possible suspects:\n\n* **Hardware:** the physical key itself is broken, dirty, or disconnected.\n* **Software:** the key is fine, but Windows is ignoring it.\n\n**Test A — the on-screen keyboard:** Press **Windows key + R**, type `osk`, and press Enter. A keyboard appears on screen. Click its space bar while typing in Notepad. If the on-screen space works, Windows itself can make spaces.\n\n**Test B — a different keyboard:** If you have another USB keyboard in the house, plug it in and try *its* space bar.\n\nWhat happened with the other keyboard?\n\n[[The other keyboard's space bar works fine->Hardware Suspect]]\n[[The other keyboard's space bar ALSO doesn't work->Software Suspect]]\n[[I don't have another keyboard to test->Software Suspect]]", "Software Suspect": "## Suspect: Windows settings\n\nIf a space bar on a *different* keyboard also fails, the keyboard probably isn't the problem — something in Windows is. (If you couldn't test another keyboard, checking software is still the safe next move, since it can't hurt anything.)\n\nLet's check the most common culprit first: **accessibility settings that got turned on by accident.**\n\n[[Check accessibility settings->Accessibility Keys]]", "Accessibility Keys": "## Step 3: Sticky Keys and Filter Keys\n\nWindows has helpful features for people who have trouble pressing keys. But they can get switched on *by accident*, and then the keyboard seems broken.\n\n* **Sticky Keys** turns on if you press **Shift five times in a row**.\n* **Filter Keys** turns on if you **hold the right Shift key for 8 seconds**. Filter Keys tells Windows to *ignore quick or repeated key presses* — which can make a space bar seem dead!\n\nGamers trigger these all the time without noticing.\n\n**To check:**\n1. Press **Windows key + I** to open Settings.\n2. Go to **Accessibility → Keyboard**.\n3. Make sure **Sticky keys**, **Filter keys**, and **Toggle keys** are all **Off**.\n\nTest the space bar in Notepad. Any luck?\n\n[[Yes! Filter Keys or Sticky Keys was on.->Fixed]]\n[[They were already off.->Remap Check]]", "Remap Check": "## Step 4: Was the space bar re-assigned?\n\nSome programs let you change what a key does. If someone (maybe for a game) told the space bar to do something else, it won't type a space anymore.\n\nAsk yourself or a grown-up: is any of this installed?\n\n* **Microsoft PowerToys** (has a *Keyboard Manager* that remaps keys)\n* **MSI Center** or **SteelSeries GG** (keyboard lighting and key-setting apps found on many MSI gaming laptops)\n* Game macro or key-binding software\n\nIf so, open it and look for a **key remapping**, **macro**, or **key binding** section. Remove anything that changes the space bar, or reset the keyboard profile to default.\n\n[[Found a remap and removed it — fixed!->Fixed]]\n[[No remaps, or none of these are installed->Driver Reinstall]]", "Driver Reinstall": "## Step 5: Reinstall the keyboard driver\n\nA **driver** is a little program that lets Windows talk to a piece of hardware. If it gets scrambled, keys can stop working. This is MSI's own recommended fix, and Windows puts the driver right back automatically.\n\n<div class=\"warn\">**Grown-up needed:** Device Manager controls important hardware. Do this step together.</div>\n\n1. Click the Windows search bar, type **Device Manager**, and open it.\n2. Click the arrow next to **Keyboards** to expand it.\n3. Right-click the keyboard (often called *Standard PS/2 Keyboard* or *HID Keyboard Device*) and choose **Uninstall device**. Do **not** tick any box that offers to delete the driver software.\n4. At the top, click **Action → Scan for hardware changes**. Windows reinstalls the driver.\n5. Restart and test.\n\nFixed?\n\n[[Yes!->Fixed]]\n[[No — but it broke right after an update->Driver Rollback]]\n[[No, still broken->Firmware Updates]]", "Driver Rollback": "## Bonus step: Roll back the driver\n\nSometimes a *new* driver is the troublemaker. People have fixed space bars that started acting strangely by going back to the older driver.\n\n<div class=\"warn\">**Grown-up needed.**</div>\n\n1. Open **Device Manager → Keyboards**.\n2. Right-click the keyboard → **Properties** → **Driver** tab.\n3. Click **Roll Back Driver** (if it's grayed out, there's no older version saved).\n4. Restart and test.\n\n[[That fixed it!->Fixed]]\n[[Still broken->Firmware Updates]]", "Firmware Updates": "## Step 6: Update the BIOS and MSI drivers\n\nDeep inside every MSI laptop is basic software called the **BIOS**, plus a tiny chip called the **EC (Embedded Controller)** that helps handle things like the keyboard. MSI recommends updating the BIOS when keys stop responding.\n\n<div class=\"warn\">**Grown-up needed — this one is serious.** A BIOS update must never be interrupted. Keep the laptop plugged into the charger the whole time and don't turn it off until it's done.</div>\n\n1. Find the laptop's exact model name (on the sticker underneath, e.g. *GF63 Thin*).\n2. Go to MSI's official support page for that model, or open the **MSI Center** app's support/update section.\n3. Install the latest **BIOS**, **chipset**, and any keyboard-related drivers listed there.\n\n<div class=\"warn\">**Watch out:** Avoid \"driver booster\" style programs that promise to update everything automatically. Some have been known to install the wrong keyboard software. Always get drivers straight from MSI.</div>\n\n[[Updates fixed it!->Fixed]]\n[[Still broken->EC Reset]]", "EC Reset": "## Step 7: The secret reset hole\n\nMany MSI laptops have a tiny **Battery Reset Hole** on the bottom. It resets that EC chip — kind of like waking up the part of the laptop that listens to the keyboard. It doesn't erase any files.\n\n<div class=\"warn\">**Grown-up needed.**</div>\n\n1. **Shut down** the laptop completely.\n2. **Unplug the charger.**\n3. Flip it over and find the tiny hole (check the laptop's manual if you can't spot it).\n4. Gently push a **straightened paperclip** into the hole and hold it for about **10 seconds**.\n5. Plug the charger back in and turn the laptop on. (It might not power up until the charger is connected — that's normal after this reset.)\n\n**No reset hole?** MSI says you can hold the **power button for about 30 seconds** with the charger unplugged instead.\n\n[[That did it!->Fixed]]\n[[Still broken->Hardware Suspect]]", "Hardware Suspect": "## Suspect: the keyboard itself\n\nIf another keyboard works but this one doesn't, the problem is almost certainly *physical*: dirt, a misaligned key, or a loose connection inside.\n\nIs this a laptop keyboard or an external one?\n\n[[Laptop keyboard->Debris Check]]\n[[External MSI keyboard->External Debris]]", "Debris Check": "## Step: Clean under the space bar (laptop)\n\nCrumbs, pet hair, and dust love the space bar because it's the biggest key, right where your hands rest.\n\n<div class=\"warn\">**Grown-up OK needed** before using compressed air.</div>\n\n1. **Shut down** the laptop and unplug the charger.\n2. Open it, tip it upside down at an angle, and **gently tap** the back to let crumbs fall out.\n3. Use **compressed air** held upright, in short bursts, blowing along the edges of the space bar.\n4. A **soft brush** can help sweep out the gap.\n\n<div class=\"warn\">**Don't pry the laptop space bar off!** Laptop keys sit on tiny plastic clips (called *scissor switches*) that snap easily, and the space bar also has a thin metal wire that keeps it level. Unlike a mechanical keyboard, laptop keys are not made to pop off and on.</div>\n\nTurn the laptop back on and test.\n\n[[Fixed!->Fixed]]\n[[It only works when I press the middle->Edges Problem]]\n[[Still dead everywhere->Ribbon Cable]]", "Edges Problem": "## The \"press-the-middle\" problem\n\nThis is a **known MSI laptop complaint**. Owners of several models have noticed the space bar only registers when pressed near the center, or needs a hard press at the ends.\n\n**Why?** Under a laptop space bar, the actual switch is usually just in the **middle**. A thin metal **stabilizer bar** is supposed to make the whole key go down evenly so that pressing the end still pushes the middle switch. If the key sits a little high, or the bar isn't seated right, pressing the ends doesn't push the middle down far enough.\n\n**Software cannot fix this one** — it's mechanical.\n\nYour options:\n\n1. **Clean it first.** A crumb under one end can cause exactly this. [[Go clean it->Debris Check]]\n2. **Warranty repair.** If the laptop is still under warranty, this is the *best* choice — contact MSI or the store before doing anything else. [[How to get help->Get Help]]\n3. **The DIY shim fix.** Some owners have fixed it by gently lifting the key and sticking a tiny square of paper (about 5 mm) or a thin sticky pad under the center of the keycap, so it presses the switch sooner. This can void a warranty and risks breaking the clips, so it's a **grown-up-only, last-resort** fix.\n4. **Temporary workaround** while you wait. [[Show me workarounds->Workaround]]", "Ribbon Cable": "## The hidden connection\n\nInside the laptop, the keyboard connects to the main board with a thin, flat **ribbon cable**. If it gets loose or damaged — say, from a drop — keys can stop working, sometimes a whole group of keys at once.\n\nClue: are **other keys near the space bar** acting up too? That makes a cable or keyboard-wide problem even more likely.\n\n<div class=\"warn\">**Stop here.** Fixing the ribbon cable means opening the laptop. That's a job for a repair shop or MSI, especially if the laptop is under warranty. Opening it yourself can void the warranty or damage it.</div>\n\n[[How to get help->Get Help]]\n[[Workarounds until it's fixed->Workaround]]", "External Connection": "## Step 1: Check the connection (external keyboard)\n\nIf the **whole keyboard** is dead (lights off, no keys work), start here. If *only* the space bar is dead but other keys work, skip ahead.\n\n1. **Unplug the USB cable and plug it back in** firmly.\n2. Try a **different USB port** — preferably one directly on the computer, not a hub.\n3. Check the cable for **kinks, cuts, or bent plugs**.\n4. If it's **wireless**, charge it or replace the batteries, and make sure the USB receiver is plugged in.\n\n[[Fixed!->Fixed]]\n[[Other keys work — just the space bar is dead->Restart First]]\n[[The whole keyboard is still dead->Try Other Computer]]", "Try Other Computer": "## Try another computer\n\nPlug the keyboard into a **different computer**.\n\n[[It works on the other computer->Software Suspect]]\n[[It's dead there too->Get Help]]", "External Debris": "## Step: Clean under the space bar (MSI mechanical keyboard)\n\nGood news: MSI's gaming keyboards are usually **mechanical**, and their keycaps are *designed* to come off. Many even ship with a **keycap puller** in the box.\n\n<div class=\"warn\">**Grown-up OK needed.** And unplug the keyboard first!</div>\n\n1. **Unplug the keyboard.**\n2. Use the keycap puller to remove the keys **around** the space bar first — it gives you room.\n3. The space bar is special: it has **stabilizers** (plastic clips plus a metal wire) that keep it from wobbling. Lift it **slowly and evenly from both ends**. Don't yank one side up, or you can bend the wire.\n4. Blow out the crumbs with compressed air and brush out the gap.\n5. If the switch itself feels sticky, a tiny drop of **isopropyl alcohol** on the switch, then pressing it several times, can help. Let it dry completely.\n6. To replace the space bar, line the wire back into its clips, then press the key straight down until it clicks.\n\nPlug it back in and test.\n\n[[Fixed!->Fixed]]\n[[It only works when I press the middle->External Stabilizer]]\n[[Still dead->Restart First]]", "External Stabilizer": "## The wobbly-stabilizer problem\n\nIf the space bar only works in the middle, the **stabilizer wire** probably popped out of one of its clips, so the key tilts instead of pressing straight down.\n\n<div class=\"warn\">**Grown-up OK needed.** Unplug first.</div>\n\n1. Remove the space bar slowly and evenly from both ends.\n2. Look at the metal wire. Each end should hook into a small plastic clip.\n3. Gently re-seat any end that came loose. If the wire is **bent**, don't try to force it straight — a replacement may be needed.\n4. Press the space bar back on straight down and test it at both ends.\n\n[[Fixed!->Fixed]]\n[[The wire is bent or a clip broke->Get Help]]", "Spill Emergency": "## SPILL! Move fast.\n\nWhat you do in the **first minute** matters most.\n\n<div class=\"warn\">**Get a grown-up right now.**</div>\n\n1. **Turn it off immediately.** For a laptop, hold the power button until it shuts off. Unplug the charger. For an external keyboard, **unplug it**.\n2. **Flip it upside down** so liquid drains *out*, not deeper in. Laptops: open in a tent shape, keys facing down.\n3. **Blot** with a towel. **Don't wipe** — wiping spreads liquid around.\n4. **Let it dry for at least 24–48 hours.** Do *not* turn it on to \"check.\"\n\n<div class=\"warn\">**Myth buster: Don't put it in rice!** Rice doesn't pull water out of electronics better than open air does, and rice dust and grains can get stuck inside.</div>\n\nSticky drinks (juice, soda, milk) leave sugar behind that can keep keys gummy even after drying. Those often need a professional cleaning.\n\n[[It dried out and works now->Fixed]]\n[[It's dry, but the space bar is still broken->Get Help]]", "Workaround": "## Workarounds while you wait\n\nYou can keep working while the real fix gets sorted out:\n\n* **On-screen keyboard:** Press **Windows key + R**, type `osk`, Enter. Click the space bar on screen.\n* **Plug in any USB keyboard.** Laptops work fine with an external keyboard.\n* **Remap a key:** With a grown-up, install **Microsoft PowerToys** and use its *Keyboard Manager* to make a key you rarely use (like **Right Alt**) type a space.\n* **Voice typing:** Press **Windows key + H** and speak — Windows types for you, spaces included!\n\n[[I'm ready to get it fixed for real->Get Help]]\n[[Start over->Real Repair]]", "Get Help": "## Time to call in the pros\n\nYou've done everything a careful home tech should. Knowing when to stop *is* a repair skill!\n\n**Before contacting help, gather:**\n* The **exact model name** (sticker on the bottom)\n* The **serial number** (same sticker)\n* A list of **what you already tried** — you just did a whole troubleshooting checklist, so you can tell them exactly what didn't work!\n\n**Where to go:**\n1. **Warranty first.** If it's still under warranty, contact **MSI Support** or the store where it was bought. Don't open the laptop before asking.\n2. **Out of warranty?** A local computer repair shop can replace a laptop keyboard or an external keyboard's switch or stabilizer.\n\n[[See your troubleshooting badge->Badge]]", "Fixed": "## SPACE BAR RESCUED!\n\nNicely done. You found the problem by testing the easy, safe stuff first — exactly how professional technicians work.\n\n**Keep it working:**\n* Keep food and drinks away from the keyboard.\n* Give it a weekly shake-out and a quick puff of compressed air.\n* Remember that pressing Shift five times turns on Sticky Keys!\n\n[[See your troubleshooting badge->Badge]]\n[[Try a different problem->Real Repair]]", "Badge": "# 🏅 Keyboard Detective\n\n**You learned the real technician's method:**\n\n1. **Restart** first — it fixes more than you'd think.\n2. **Split the suspects:** hardware or software? Test with another keyboard or the on-screen one.\n3. **Check settings** before drivers, and **drivers** before opening anything.\n4. **Know when to stop** and get a grown-up or a professional.\n\n[[Fix another problem->Real Repair]]\n[[Back to the case board->HQ]]"}};
(function(){
  let S={}, hist=[], cur=STORY.start;
  const KEY='save:'+document.title;
  const out=document.getElementById('out');

  // ---- macro evaluation (supports the subset used by this story) ----
  function val(name){return S[name];}
  function cond(c){
    let m;
    if(m=c.match(/^\$(\w+) does not contain "([^"]*)"$/)) return !(val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+) contains "([^"]*)"$/)) return (val(m[1])||[]).includes(m[2]);
    if(m=c.match(/^\$(\w+)'s length (>=|is) (\d+)$/)){const L=(val(m[1])||[]).length;return m[2]==='is'?L==+m[3]:L>=+m[3];}
    if(m=c.match(/^\$(\w+) (>=|is) (\d+)$/)){const v=+val(m[1]);return m[2]==='is'?v==+m[3]:v>=+m[3];}
    console.warn('unknown condition',c);return false;
  }
  function set(name,expr){
    let m;
    if(expr==='(a:)') S[name]=[];
    else if(/^\d+$/.test(expr)) S[name]=+expr;
    else if(expr==='it + 1') S[name]=(+S[name]||0)+1;
    else if(m=expr.match(/^it \+ \(a: "([^"]*)"\)$/)) S[name]=(S[name]||[]).concat([m[1]]);
    else console.warn('unknown set',expr);
  }
  function hook(t,i){ // t[i]==='[' ; return [content,endIndex]
    let d=0;
    for(let j=i;j<t.length;j++){if(t[j]==='[')d++;else if(t[j]===']'){d--;if(d===0)return [t.slice(i+1,j),j+1];}}
    return [t.slice(i+1),t.length];
  }
  function run(t){
    let r='',i=0;
    while(i<t.length){
      const rest=t.slice(i);let m;
      if(rest.startsWith('(set: ')){let d=0,j=i,q=false;for(;j<t.length;j++){const c=t[j];if(c==='"')q=!q;else if(!q&&c==='(')d++;else if(!q&&c===')'){d--;if(d===0)break;}}
        const inner=t.slice(i+6,j);const mm=inner.match(/^\$(\w+) to (.+)$/);if(mm)set(mm[1],mm[2]);else console.warn('bad set',inner);i=j+1;continue;}
      if(m=rest.match(/^\(print: \$(\w+)'s length\)/)){r+=String((S[m[1]]||[]).length);i+=m[0].length;continue;}
      if(m=rest.match(/^\(if: ([^)]*)\)\[/)){
        const pass=cond(m[1]);let [a,end]=hook(t,i+m[0].length-1);let b=null;
        const el=t.slice(end).match(/^\(else:\)\[/);
        if(el){[b,end]=hook(t,end+el[0].length-1);}
        r+=pass?run(a):(b!==null?run(b):'');i=end;continue;
      }
      r+=t[i];i++;
    }
    return r;
  }

  // ---- markup rendering ----
  function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;');}
  function inline(s){
    s=s.replace(/\[\[([^\]]+?)\]\]/g,(_,x)=>{const k=x.lastIndexOf('->');const txt=k<0?x:x.slice(0,k),tgt=k<0?x:x.slice(k+2);
      return '<tw-link tabindex="0" role="link" data-to="'+esc(tgt)+'">'+txt+'</tw-link>';});
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>');
    return s;
  }
  function render(t){
    const lines=t.split('\n');let h='',para=[],list=null;
    const flushP=()=>{if(para.length){h+='<p>'+para.join('<br>')+'</p>';para=[];}};
    const flushL=()=>{if(list){h+='<'+list.tag+'>'+list.items.map(x=>'<li>'+x+'</li>').join('')+'</'+list.tag+'>';list=null;}};
    for(const raw of lines){
      const l=raw.replace(/\s+$/,'');let m;
      if(!l.trim()){flushP();flushL();continue;}
      if(l==='---'){flushP();flushL();h+='<hr>';continue;}
      if(m=l.match(/^(#{1,3}) (.*)$/)){flushP();flushL();h+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';continue;}
      if(m=l.match(/^\* (.*)$/)){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]};}list.items.push(inline(m[1]));continue;}
      if(m=l.match(/^\d+\. (.*)$/)){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]};}list.items.push(inline(m[1]));continue;}
      if(/^<div/.test(l)){flushP();flushL();h+=inline(l);continue;}
      flushL();para.push(inline(l));
    }
    flushP();flushL();return h;
  }

  function save(){try{localStorage.setItem(KEY,JSON.stringify({S,cur}));}catch(e){}}
  function show(name,push){
    if(!(name in STORY.passages)){console.warn('missing passage',name);return;}
    if(push)hist.push({S:JSON.parse(JSON.stringify(S)),cur});
    cur=name;
    const body=run(STORY.passages[name]); // run the passage first so the header shows updated progress
    const head=STORY.header.map(n=>run(STORY.passages[n])).join('\n\n');
    out.innerHTML=render((head?head+'\n\n':'')+body);
    document.getElementById('back').disabled=!hist.length;
    save();window.scrollTo(0,0);
    const first=out.querySelector('h1,h2');if(first){first.setAttribute('tabindex','-1');first.focus({preventScroll:true});}
  }
  // header shows on every passage except the title screen
  const origHeader=STORY.header.slice();
  const _show=show;show=function(n,p){STORY.header=(n===STORY.start)?[]:origHeader;_show(n,p);};

  out.addEventListener('click',e=>{const a=e.target.closest('tw-link');if(a)show(a.dataset.to,true);});
  out.addEventListener('keydown',e=>{const a=e.target.closest('tw-link');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(a.dataset.to,true);}});
  document.getElementById('back').onclick=()=>{const h=hist.pop();if(h){S=h.S;show(h.cur,false);}};
  document.getElementById('restart').onclick=()=>{if(!confirm('Start over and clear your solved cases?'))return;S={};hist=[];STORY.startup.forEach(n=>run(STORY.passages[n]));show(STORY.start,false);};

  STORY.startup.forEach(n=>run(STORY.passages[n]));
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}
  // ?day=N opens that day directly and unlocks the days before it (for links from course modules)
  let dayParam=null;try{dayParam=new URLSearchParams(location.search).get('day');}catch(e){}
  if(saved)S=Object.assign(S,saved.S);
  if(dayParam==='exam'&&('Exam Start' in STORY.passages)){S.days=Array.from(new Set([...(S.days||[]),'1','2','3','4','5','6','7']));show('Exam Start',false);}
  else if(dayParam&&('D'+dayParam+' Start') in STORY.passages){const n=parseInt(dayParam,10);const d=new Set(S.days||[]);for(let i=1;i<n;i++)d.add(String(i));S.days=[...d];show('D'+n+' Start',false);}
  else if(saved&&saved.cur in STORY.passages){show(saved.cur,false);}else show(STORY.start,false);
})();
</script>
