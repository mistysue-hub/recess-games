<style>

<script>
const STORY={"start": "Start", "startup": ["Init"], "header": ["Shift Bar"], "passages": {"Init": "(set: $days to (a:))(set: $miss to 0)", "Shift Bar": "<div class=\"casebar\">🛠️ Workdays done: (print: $days's length) / 7 · [[Work schedule->Shop]] · [[Toolbox->Toolbox]]</div>", "Start": "# Keycap & Co.\n## Computer Care 101 · Unit 1: Know Your Gear\n\n*A bell jingles as you push open the door of* **Keycap & Co. Repair Bench.** *Shelves of keyboards, a jar of spare keycaps, a coffee mug full of screwdrivers. Behind the counter, a woman in a canvas apron looks up over her glasses. Everyone in town calls her* **The Inspector.**\n\n\"So you're the new trainee. Good. Here's how this works: seven workdays. Each day I teach you one thing, then customers come in and you put it to work. Every day you finish earns a tool for your toolbox.\"\n\n\"Get a job wrong twice and I'll step in and show you. Nobody learns this stuff without messing up a few times.\"\n\n<div class=\"warn\">**Shop rule:** In real life, anything with liquids, opening a case, or someone else's computer needs a grown-up's OK first. When you see a red box like this, that's the reminder.</div>\n\n[[Clock in->Shop]]", "Shop": "# 📋 Work Schedule\n*Unit 1: Know Your Gear.* Each day unlocks when you finish the one before it.\n\n(if: $days contains \"1\")[✅ ](else:)[📋 ][[Day 1: Know Your Machine->D1 Start]]\n(if: $days's length >= 1)[(if: $days contains \"2\")[✅ ](else:)[📋 ][[Day 2: Your Cleaning Kit->D2 Start]]](else:)[🔒 Day 2: Your Cleaning Kit]\n(if: $days's length >= 2)[(if: $days contains \"3\")[✅ ](else:)[📋 ][[Day 3: Meet the Keyboards->D3 Start]]](else:)[🔒 Day 3: Meet the Keyboards]\n(if: $days's length >= 3)[(if: $days contains \"4\")[✅ ](else:)[📋 ][[Day 4: Keyboard Cleaning Day->D4 Start]]](else:)[🔒 Day 4: Keyboard Cleaning Day]\n(if: $days's length >= 4)[(if: $days contains \"5\")[✅ ](else:)[📋 ][[Day 5: Meet the Mice->D5 Start]]](else:)[🔒 Day 5: Meet the Mice]\n(if: $days's length >= 5)[(if: $days contains \"6\")[✅ ](else:)[📋 ][[Day 6: Mouse Service Day->D6 Start]]](else:)[🔒 Day 6: Mouse Service Day]\n(if: $days's length >= 6)[(if: $days contains \"7\")[✅ ](else:)[📋 ][[Day 7: Comfort Check->D7 Start]]](else:)[🔒 Day 7: Comfort Check]\n\n---\n(if: $days's length >= 7)[🎓 [[The Inspector's Unit 1 Exam->Exam Start]]](else:)[🔒 The Inspector's Unit 1 Exam: *finish all 7 days to unlock*]", "Toolbox": "# 🧰 Your Toolbox\nEvery day you finish earns a tool.\n\n(if: $days contains \"1\")[🔦 **Port Map**: Day 1, Know Your Machine](else:)[▫️ *Earned on Day 1*]\n(if: $days contains \"2\")[🧽 **Cleaning Kit**: Day 2, Your Cleaning Kit](else:)[▫️ *Earned on Day 2*]\n(if: $days contains \"3\")[⌨️ **Keyboard ID Card**: Day 3, Meet the Keyboards](else:)[▫️ *Earned on Day 3*]\n(if: $days contains \"4\")[🧹 **Keycap Puller**: Day 4, Keyboard Cleaning Day](else:)[▫️ *Earned on Day 4*]\n(if: $days contains \"5\")[🖱️ **Mouse Field Guide**: Day 5, Meet the Mice](else:)[▫️ *Earned on Day 5*]\n(if: $days contains \"6\")[🪛 **Service Kit**: Day 6, Mouse Service Day](else:)[▫️ *Earned on Day 6*]\n(if: $days contains \"7\")[🪑 **Posture Pro Badge**: Day 7, Comfort Check](else:)[▫️ *Earned on Day 7*]\n\n[[Back to the work schedule->Shop]]", "D1 Start": "(set: $miss to 0)# Day 1: Know Your Machine\n\n*The Inspector taps four machines lined up on the bench.*\n\n\"You can't fix what you can't name. Lesson one: four kinds of computers walk through that door.\"\n\n* **Laptop:** screen, keyboard, trackpad, and battery all in one folding case.\n* **Desktop:** the computer itself lives in a separate box called the **tower**. The monitor, keyboard, and mouse all plug into it. On a desktop, the monitor is *just a screen*.\n* **All-in-one:** the whole computer is built into the back of the monitor. The keyboard and mouse are separate.\n* **Chromebook:** a laptop that runs Google's ChromeOS. Most apps run in the web browser, and most files are stored online.\n\n\"And the golden rule of this shop: **power off and unplug before you clean anything.** A dark screen shows dirt better, and you can't short anything out or type gibberish by accident.\"\n\n\"Doors open in a minute. Let's see who's first.\"\n\n\n[[Open the shop->D1 J1]]", "D1 J1": "**Mr. Chen** sets a big screen on the counter. \"My computer is acting up.\" You look around for the computer part. There's no tower, but the back of the screen is thick, has vents, and a power cord goes straight into it. His keyboard and mouse are wireless.\n\n**What kind of computer does Mr. Chen have?**\n\n* [[A desktop with the tower missing->D1 J1 W]]\n* [[A Chromebook->D1 J1 W]]\n* [[An all-in-one->D1 J1 R]]\n* [[A laptop with the keyboard removed->D1 J1 W]]", "D1 J1 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The vents and the power cord are on the back of the screen. That means the whole computer is built into the monitor. That's an **all-in-one**.\"\n\n[[Got it->D1 J1 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Look at the back of that screen. Where do you think the computer parts are hiding?\"\n\n[[Try again->D1 J1]]]", "D1 J1 R": "(set: $miss to 0)## ✅ Job done\nThe computer lives inside the back of the monitor. That's why it has vents and its own power cord. All-in-ones save desk space, but they're harder to upgrade or repair because everything is packed together.\n\n[[Next customer->D1 J2]]", "D1 J2": "**Mr. Ruiz** hurries in carrying a monitor. \"My computer won't turn on, so I brought it in!\" When you ask about his desk at home, he says there's a big box underneath with a power button and blinking lights, and the monitor's cable plugs into that box.\n\n**What should Mr. Ruiz have brought in?**\n\n* [[Nothing else, since the monitor is the whole computer->D1 J2 W]]\n* [[The keyboard, since the computer is built into it->D1 J2 W]]\n* [[The power strip, since it controls the computer->D1 J2 W]]\n* [[The tower under his desk, since that box is the computer->D1 J2 R]]", "D1 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"On a desktop, the **tower** is the computer. The monitor is just a screen, so he needs to bring that box under his desk.\"\n\n[[Got it->D1 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Remember what I said about desktops. Which part is *just a screen*?\"\n\n[[Try again->D1 J2]]]", "D1 J2 R": "(set: $miss to 0)## ✅ Job done\nOn a desktop, **the tower is the computer**. The monitor only shows what the tower sends it. (Tip for Mr. Ruiz: before carrying anything in, check that the tower's power cord is plugged in and the switch on its back is on.)\n\n[[Next customer->D1 J3]]", "D1 J3": "**Oscar** is wiping his laptop screen at the counter. It's on, plugged in, and he's using a wet paper towel.\n\n**What should Oscar do first?**\n\n* [[Turn up the brightness so he can see the smudges->D1 J3 W]]\n* [[Wipe faster so the water doesn't soak in->D1 J3 W]]\n* [[Add some window cleaner to the paper towel->D1 J3 W]]\n* [[Shut it down and unplug the charger->D1 J3 R]]", "D1 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Golden rule: **power off and unplug first.** Then we'll talk about that paper towel.\"\n\n[[Got it->D1 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Remember the golden rule of this shop.\"\n\n[[Try again->D1 J3]]]", "D1 J3 R": "(set: $miss to 0)## ✅ Job done\nPower off and unplug first, every time. A dark screen actually shows smudges *better*. Tomorrow you'll learn why paper towels don't belong anywhere near a screen.\n\n[[The Inspector has something to show you->D1 L4]]", "D1 L4": "## 📘 The Inspector's lesson: The Port Tour\n\n*Between customers, The Inspector turns a laptop sideways and points along its edge.*\n\n\"Ports are how everything connects. Learn their shapes and you'll never jam a plug into the wrong hole.\"\n\n<div class=\"ports\"><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"8\" y=\"10\" width=\"44\" height=\"20\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"12\" y=\"14\" width=\"36\" height=\"6\" fill=\"#ffb347\"/></svg><figcaption><b>USB-A</b>flat rectangle, one way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"12\" y=\"13\" width=\"36\" height=\"14\" rx=\"7\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"19\" y=\"18\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#ffb347\"/></svg><figcaption><b>USB-C</b>small oval, either way up</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V22 L46 28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"14\" y=\"16\" width=\"32\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>HDMI</b>two slanted corners</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M8 12 H52 V28 H14 L8 22 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><rect x=\"16\" y=\"16\" width=\"30\" height=\"4\" fill=\"#ffb347\"/></svg><figcaption><b>DisplayPort</b>one slanted corner</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><path d=\"M16 7 H44 V29 H36 V34 H24 V29 H16 Z\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><g stroke=\"#ffb347\" stroke-width=\"2\"><line x1=\"21\" y1=\"11\" x2=\"21\" y2=\"16\"/><line x1=\"26\" y1=\"11\" x2=\"26\" y2=\"16\"/><line x1=\"31\" y1=\"11\" x2=\"31\" y2=\"16\"/><line x1=\"36\" y1=\"11\" x2=\"36\" y2=\"16\"/><line x1=\"40\" y1=\"11\" x2=\"40\" y2=\"16\"/></g></svg><figcaption><b>Ethernet</b>square, cable has a clip</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"5\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2\" fill=\"#1b1f24\"/></svg><figcaption><b>Headphone jack</b>tiny round hole, no pin</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><rect x=\"6\" y=\"17\" width=\"48\" height=\"6\" rx=\"1\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/></svg><figcaption><b>SD card slot</b>long thin slot</figcaption></figure><figure class=\"port\"><svg viewBox=\"0 0 60 40\"><circle cx=\"30\" cy=\"20\" r=\"12\" fill=\"none\" stroke=\"#7fd1ff\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"20\" r=\"2.5\" fill=\"#ffb347\"/></svg><figcaption><b>Barrel charger</b>bigger round hole with a pin</figcaption></figure></div>\n\n* **USB-A:** a flat rectangle. It **only fits one way up**, so if a plug won't go in, flip it. Don't force it. Used by mice, keyboards, flash drives, and wireless dongles.\n* **USB-C:** a small rounded oval that **fits either way up**. It handles charging, files, and on many laptops, video too. Lots of new laptops have *only* USB-C, so older USB-A gear needs an **adapter** or a **hub**.\n* **HDMI:** wide and flat with **two slanted corners**. It sends picture and sound to a TV or monitor.\n* **DisplayPort:** like HDMI, but with **only one slanted corner**. Mostly used for computer monitors.\n* **Ethernet:** a squarish port for a cable with a clear plastic plug and a little clip. It's **wired internet**, and steadier than Wi-Fi because it doesn't share the air with every other device in the house.\n* **Headphone jack:** a small round hole for wired headphones and some microphones.\n* **SD card slot:** a long, thin slot for the memory cards from cameras.\n* **Barrel charging port:** a round hole with a pin in the middle, used by some laptop chargers. Other laptops charge through USB-C.\n\n\"Port care rule: **plugs go in straight and gently.** If it doesn't fit, don't push harder. Check the shape. Forcing a plug is how ports get bent and broken.\"\n\n\n[[Got it. Send in the next customer->D1 J5]]", "D1 J5": "**Tasha** wants to watch a movie on the TV using her laptop. She holds up a cable with a wide, flat plug that has two slanted corners on the bottom.\n\n**Which port on her laptop does that cable plug into?**\n\n* [[HDMI: the wide, flat port for screens and TVs->D1 J5 R]]\n* [[USB-C: the small oval port that works either way up->D1 J5 W]]\n* [[Headphone jack: the small round hole for audio->D1 J5 W]]\n* [[Ethernet: the squarish port for wired internet->D1 J5 W]]", "D1 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's an **HDMI** cable. HDMI carries video and sound to TVs and monitors, and its plug has those two slanted corners.\"\n\n[[Got it->D1 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Two slanted corners. Check the port tour.\"\n\n[[Try again->D1 J5]]]", "D1 J5 R": "(set: $miss to 0)## ✅ Job done\n**HDMI** sends picture and sound to a TV or monitor. Many newer laptops can also send video through **USB-C**, but that slanted, wide plug is HDMI every time.\n\n[[Next customer->D1 J6]]", "D1 J6": "**Marcus** is pushing a flash drive into his laptop's flat rectangular port. It won't go in, so he's pressing harder... and harder.\n\n**What should Marcus do?**\n\n* [[Push harder, since some ports are just tight->D1 J6 W]]\n* [[Wiggle it side to side until it slides in->D1 J6 W]]\n* [[Stop, flip the drive over, and try again gently->D1 J6 R]]\n* [[Tap it in lightly with the back of a pencil->D1 J6 W]]", "D1 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **USB-A**, and it only fits **one way up**. Flip it and try again, gently. Forcing it bends the metal inside.\"\n\n[[Got it->D1 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Flat rectangle... how many ways up does that port fit?\"\n\n[[Try again->D1 J6]]]", "D1 J6 R": "(set: $miss to 0)## ✅ Job done\n**USB-A fits only one way up.** If it won't go in, flip it. Pushing, wiggling, or tapping can bend the thin metal tab inside the port, and then *nothing* fits.\n\n[[Next customer->D1 J7]]", "D1 J7": "**Jayden** got a new laptop. It has only small oval ports on its sides. His favorite gaming mouse has a flat rectangular plug.\n\n**What does Jayden need?**\n\n* [[Tape to hold the mouse plug against the port->D1 J7 W]]\n* [[An adapter or hub that turns USB-C into USB-A->D1 J7 R]]\n* [[An HDMI cable to connect the mouse instead->D1 J7 W]]\n* [[Nothing, if he pushes the plug in harder->D1 J7 W]]", "D1 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"His laptop has **USB-C**, and his mouse uses **USB-A**. A small **adapter or hub** connects the two.\"\n\n[[Got it->D1 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Small oval ports, and a flat rectangular plug. What did I say about new laptops and older gear?\"\n\n[[Try again->D1 J7]]]", "D1 J7 R": "(set: $miss to 0)## ✅ Job done\nHis laptop has **USB-C** ports, and his mouse has a **USB-A** plug. A cheap **adapter** (or a **hub** with several ports) bridges them. Never force a plug into a port it isn't shaped for.\n\n[[Next customer->D1 J8]]", "D1 J8": "**Nora's** online lessons freeze every time her brother starts gaming on the Wi-Fi. Her desk is right next to the internet router, and her laptop has a squarish port on the side.\n\n**What could help?**\n\n* [[Run an Ethernet cable from the router to her laptop->D1 J8 R]]\n* [[Run an HDMI cable from the router to her laptop->D1 J8 W]]\n* [[Plug her headphones into the round headphone jack->D1 J8 W]]\n* [[Put an SD card in the thin card slot->D1 J8 W]]", "D1 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"An **Ethernet** cable from the router. A wired connection doesn't have to share the Wi-Fi with her brother's game.\"\n\n[[Got it->D1 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which port is for wired internet?\"\n\n[[Try again->D1 J8]]]", "D1 J8 R": "(set: $miss to 0)## ✅ Job done\n**Ethernet** gives her a wired connection, so she isn't competing with her brother for the Wi-Fi. (If a laptop has no Ethernet port, a **USB-to-Ethernet adapter** works too.)\n\n[[The Inspector has something to show you->D1 L9]]", "D1 L9": "## 📘 The Inspector's lesson: Vents and Power\n\n*The Inspector flips a laptop upside down.* \"One more thing before the afternoon rush.\"\n\n* **Vents** are slots or grilles, usually on the bottom, sides, or back. Inside, **fans** pull cool air in and push hot air out.\n* Block the vents with a bed, pillow, blanket, or even your lap, and heat builds up. The computer slows down, then **shuts itself off to protect its parts**.\n* **Power supply:** laptops use a **charger brick** on the cord. Desktops have a power supply box inside the tower, usually with its own fan and vent on the back.\n* **Battery:** laptops have one inside. Desktops don't, so they switch off instantly if they're unplugged.\n\n\n[[Got it. Send in the next customer->D1 J10]]", "D1 J10": "**Ms. Rivera's** laptop shuts off every time she uses it on her bed. You flip it over and find slots along the bottom and one side.\n\n**What are those slots for?**\n\n* [[Speakers, so music sounds louder->D1 J10 W]]\n* [[Vents that let air in and push hot air out->D1 J10 R]]\n* [[Extra ports for older cables->D1 J10 W]]\n* [[Spaces that make the laptop lighter->D1 J10 W]]", "D1 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **vents**. A blanket or mattress blocks them, the laptop overheats, and it shuts itself off to protect itself.\"\n\n[[Got it->D1 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Remember what I just showed you on the bottom of that laptop.\"\n\n[[Try again->D1 J10]]]", "D1 J10 R": "(set: $miss to 0)(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]## ✅ Job done\nThose slots are **vents**. Her bed blocks them, heat builds up, and the laptop shuts itself off to protect its parts. A hard surface, or a lap desk, fixes it. You'll learn a lot more about airflow in Unit 2.\n\n[[Close up shop->D1 Done]]", "D1 Done": "(if: $days does not contain \"1\")[(set: $days to it + (a: \"1\"))]# Day 1 complete!\n\n<div class=\"tool\">🔦 **New tool earned: Port Map**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Find and label every **port** and **vent** on your own computer. Use the port tour to name each port, and draw a quick map or take photos. Which vents are on the bottom, where a soft surface could block them?</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 2->D2 Start]]", "D2 Start": "(set: $miss to 0)# Day 2: Your Cleaning Kit\n\n*The Inspector dumps a bin of supplies on the counter. Some of it is great. Some of it is trouble.*\n\n\"Half the damage I see comes from people *trying to clean*. They grab whatever's under the kitchen sink. Today you build a proper kit, and you learn what stays out of it.\"\n\n\"Two rules come before everything else. **Golden rule:** power off and unplug first. **Liquid rule:** liquid goes on the cloth, never sprayed or poured onto the device.\"\n\n\n[[Open the shop->D2 L1]]", "D2 L1": "## 📘 The Inspector's lesson: The Good Stuff\n\n*The Inspector sets out six items in a neat row.*\n\n* **Microfiber cloth:** soft and lint-free, and it traps dust instead of pushing it around. Wash it now and then, but **skip the fabric softener**, which clogs the tiny fibers so they stop grabbing dust.\n* **Soft brush:** a clean paintbrush or makeup brush sweeps dust out of gaps.\n* **Cotton swabs:** for corners, edges, and around keys.\n* **Compressed air:** blows dust out of tight spaces. **Hold it upright, use short bursts, and never shake it.** Tip it over and it sprays freezing liquid instead of air.\n* **70% isopropyl alcohol:** disinfects and dries fast. A grown-up handles the bottle, and it stays away from flames.\n* **Distilled water:** water with the minerals removed, so it dries without the white spots tap water leaves.\n\n\"Damp means *barely* damp. If you can squeeze a drop out of the cloth, it's too wet.\"\n\n\n[[Got it. Send in the next customer->D2 L2]]", "D2 L2": "## 📘 The Inspector's lesson: The Trouble Bin\n\n*She slides a second pile to the side.* \"And here's what stays out.\"\n\n* **Paper towels and tissues:** made of wood fibers that can leave fine scratches, and they shed lint.\n* **Window cleaner** (the blue spray): many contain **ammonia**, which can strip the coatings off screens.\n* **Bleach and harsh cleaners:** they discolor plastic and rub the letters off keys.\n* **Scrubby sponges and abrasive pads:** they scratch screens and shiny cases.\n* **Household vacuum cleaners:** the suction can rip off keycaps and small parts, and the nozzle can build up **static electricity**, which can zap electronics.\n\n\"Now sort that bin for me. Safe, or keep it away?\"\n\n\n[[Got it. Send in the next customer->D2 S1]]", "D2 S1": "## Sorting the bin: item 1 of 8\n\n*The Inspector holds up:*\n\n### Microfiber cloth\n\n* [[✅ Safe for the kit->D2 S1 R]]\n* [[⛔ Keep it away->D2 S1 W]]", "D2 S1 R": "## ✅ Right: it belongs in the kit\n**Microfiber cloth.** Soft, lint-free, and it traps dust. It's the most-used tool in the kit.\n\n[[Next item->D2 S2]]", "D2 S1 W": "## ❌ Not this time: it belongs in the kit\n**Microfiber cloth.** Soft, lint-free, and it traps dust. It's the most-used tool in the kit.\n\n[[Next item->D2 S2]]", "D2 S2": "## Sorting the bin: item 2 of 8\n\n*The Inspector holds up:*\n\n### Paper towels\n\n* [[✅ Safe for the kit->D2 S2 W]]\n* [[⛔ Keep it away->D2 S2 R]]", "D2 S2 R": "## ✅ Right: it stays out of the kit\n**Paper towels.** Wood fibers can leave fine scratches on screens, and they shed lint into keyboards.\n\n[[Next item->D2 S3]]", "D2 S2 W": "## ❌ Not this time: it stays out of the kit\n**Paper towels.** Wood fibers can leave fine scratches on screens, and they shed lint into keyboards.\n\n[[Next item->D2 S3]]", "D2 S3": "## Sorting the bin: item 3 of 8\n\n*The Inspector holds up:*\n\n### Window cleaner (the blue spray)\n\n* [[✅ Safe for the kit->D2 S3 W]]\n* [[⛔ Keep it away->D2 S3 R]]", "D2 S3 R": "## ✅ Right: it stays out of the kit\n**Window cleaner (the blue spray).** Many window cleaners contain **ammonia**, which can damage screen coatings.\n\n[[Next item->D2 S4]]", "D2 S3 W": "## ❌ Not this time: it stays out of the kit\n**Window cleaner (the blue spray).** Many window cleaners contain **ammonia**, which can damage screen coatings.\n\n[[Next item->D2 S4]]", "D2 S4": "## Sorting the bin: item 4 of 8\n\n*The Inspector holds up:*\n\n### 70% isopropyl alcohol\n\n* [[✅ Safe for the kit->D2 S4 R]]\n* [[⛔ Keep it away->D2 S4 W]]", "D2 S4 R": "## ✅ Right: it belongs in the kit\n**70% isopropyl alcohol.** Great for disinfecting keycaps and mice, and it dries fast. Put it on a cloth or swab, and let a grown-up handle the bottle.\n\n[[Next item->D2 S5]]", "D2 S4 W": "## ❌ Not this time: it belongs in the kit\n**70% isopropyl alcohol.** Great for disinfecting keycaps and mice, and it dries fast. Put it on a cloth or swab, and let a grown-up handle the bottle.\n\n[[Next item->D2 S5]]", "D2 S5": "## Sorting the bin: item 5 of 8\n\n*The Inspector holds up:*\n\n### Household vacuum cleaner\n\n* [[✅ Safe for the kit->D2 S5 W]]\n* [[⛔ Keep it away->D2 S5 R]]", "D2 S5 R": "## ✅ Right: it stays out of the kit\n**Household vacuum cleaner.** Strong suction can pull off keycaps and small parts, and the nozzle can build up static electricity.\n\n[[Next item->D2 S6]]", "D2 S5 W": "## ❌ Not this time: it stays out of the kit\n**Household vacuum cleaner.** Strong suction can pull off keycaps and small parts, and the nozzle can build up static electricity.\n\n[[Next item->D2 S6]]", "D2 S6": "## Sorting the bin: item 6 of 8\n\n*The Inspector holds up:*\n\n### Compressed air can\n\n* [[✅ Safe for the kit->D2 S6 R]]\n* [[⛔ Keep it away->D2 S6 W]]", "D2 S6 R": "## ✅ Right: it belongs in the kit\n**Compressed air can.** It blasts dust out of tight gaps. Hold it **upright** and use short bursts.\n\n[[Next item->D2 S7]]", "D2 S6 W": "## ❌ Not this time: it belongs in the kit\n**Compressed air can.** It blasts dust out of tight gaps. Hold it **upright** and use short bursts.\n\n[[Next item->D2 S7]]", "D2 S7": "## Sorting the bin: item 7 of 8\n\n*The Inspector holds up:*\n\n### Distilled water\n\n* [[✅ Safe for the kit->D2 S7 R]]\n* [[⛔ Keep it away->D2 S7 W]]", "D2 S7 R": "## ✅ Right: it belongs in the kit\n**Distilled water.** No minerals, so no white spots. A barely damp cloth is all you need.\n\n[[Next item->D2 S8]]", "D2 S7 W": "## ❌ Not this time: it belongs in the kit\n**Distilled water.** No minerals, so no white spots. A barely damp cloth is all you need.\n\n[[Next item->D2 S8]]", "D2 S8": "## Sorting the bin: item 8 of 8\n\n*The Inspector holds up:*\n\n### Bleach wipes\n\n* [[✅ Safe for the kit->D2 S8 W]]\n* [[⛔ Keep it away->D2 S8 R]]", "D2 S8 R": "## ✅ Right: it stays out of the kit\n**Bleach wipes.** Bleach is too harsh. It can discolor plastic and wear off the letters on keys.\n\n[[Next customer->D2 J4]]", "D2 S8 W": "## ❌ Not this time: it stays out of the kit\n**Bleach wipes.** Bleach is too harsh. It can discolor plastic and wear off the letters on keys.\n\n[[Next customer->D2 J4]]", "D2 J4": "**Ms. Abara** wants to disinfect her laptop keyboard after a cold went around her house. She's holding a spray bottle of alcohol, aimed right at the keys.\n\n**What's the right way to use it?**\n\n* [[Spray a light mist across all the keys at once->D2 J4 W]]\n* [[Pour a little into the keyboard gaps->D2 J4 W]]\n* [[Dampen a cloth or swab first, then wipe the keys->D2 J4 R]]\n* [[Spray it, then close the lid to trap it->D2 J4 W]]", "D2 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Liquid goes on the cloth, never on the device.** Spray drips down between the keys and into the electronics underneath.\"\n\n[[Got it->D2 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which rule did I give you about liquids?\"\n\n[[Try again->D2 J4]]]", "D2 J4 R": "(set: $miss to 0)## ✅ Job done\nDampen the cloth, then wipe. Spray drips into the gaps between keys and reaches the circuits underneath. Make sure the laptop is off first, too.\n\n[[Next customer->D2 J5]]", "D2 J5": "**Leo** is blasting dust out of his keyboard with compressed air. He's holding the can upside down to reach better, and a frosty white spray shoots out.\n\n**What went wrong?**\n\n* [[Tilting the can lets cold liquid propellant spray out->D2 J5 R]]\n* [[The can is nearly empty and spraying leftover dust->D2 J5 W]]\n* [[Dust turns white and frosty when it gets blasted->D2 J5 W]]\n* [[He forgot to shake the can hard before spraying->D2 J5 W]]", "D2 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Upright, short bursts.** Tip a can of compressed air and it sprays its liquid propellant instead of air. That's freezing cold and can damage parts.\"\n\n[[Got it->D2 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How did I say to hold the can?\"\n\n[[Try again->D2 J5]]]", "D2 J5 R": "(set: $miss to 0)## ✅ Job done\nKeep the can **upright**. Tipped over, it sprays freezing liquid instead of air. And never shake it.\n\n[[Next customer->D2 J6]]", "D2 J6": "**Kai** cleaned his monitor with a cloth dipped in tap water. Now that it's dry, it's covered in faint white spots.\n\n**What should he use next time?**\n\n* [[Hot tap water, so it dries faster->D2 J6 W]]\n* [[Window cleaner, to cut through the spots->D2 J6 W]]\n* [[Sparkling water, since the bubbles lift dirt->D2 J6 W]]\n* [[Distilled water on a barely damp microfiber cloth->D2 J6 R]]", "D2 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Tap water has **minerals** in it, and they're what dried into those spots. **Distilled water** has the minerals removed.\"\n\n[[Got it->D2 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What leaves those white spots behind, and which water doesn't have it?\"\n\n[[Try again->D2 J6]]]", "D2 J6 R": "(set: $miss to 0)## ✅ Job done\n**Distilled water** on a barely damp microfiber cloth. The white spots are minerals left behind when tap water dries.\n\n[[Next customer->D2 J7]]", "D2 J7": "**Mia** found a sticky spot on her laptop lid. She's about to attack it with the green scrubby side of a kitchen sponge.\n\n**What should she use instead?**\n\n* [[A microfiber cloth with a little alcohol on it->D2 J7 R]]\n* [[The yellow soft side of the same wet sponge->D2 J7 W]]\n* [[A paper towel soaked in dish soap->D2 J7 W]]\n* [[Steel wool, gently, in small circles->D2 J7 W]]", "D2 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Scrubby pads **scratch**. A microfiber cloth with a little alcohol dissolves the sticky stuff without scratching.\"\n\n[[Got it->D2 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I put in the trouble bin about scrubby things?\"\n\n[[Try again->D2 J7]]]", "D2 J7 R": "(set: $miss to 0)## ✅ Job done\n**Microfiber with a little alcohol.** Alcohol loosens sticky residue, and microfiber won't scratch. Abrasive pads leave permanent scuffs.\n\n[[Next customer->D2 J8]]", "D2 J8": "**Mr. Grant** is about to clean the dusty vents on the back of his desktop tower with the family's vacuum cleaner.\n\n**What should he use instead?**\n\n* [[A wet cloth pushed into the vent slots->D2 J8 W]]\n* [[Short bursts of compressed air and a soft brush->D2 J8 R]]\n* [[The vacuum, but on its highest setting->D2 J8 W]]\n* [[A hair dryer on the hot setting->D2 J8 W]]", "D2 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Vacuums can build up **static electricity** and pull off small parts. **Compressed air and a soft brush** do the job safely.\"\n\n[[Got it->D2 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Why did the vacuum land in the trouble bin?\"\n\n[[Try again->D2 J8]]]", "D2 J8 R": "(set: $miss to 0)## ✅ Job done\n**Compressed air and a soft brush**, with the computer off and unplugged. Household vacuums can zap electronics with static. Unit 2 covers vents in much more detail.\n\n[[Next customer->D2 J9]]", "D2 J9": "**Ms. Doyle** dunks her microfiber cloth in distilled water and lifts it out, dripping, ready to wipe her laptop screen.\n\n**What should she do first?**\n\n* [[Wipe quickly before the water drips anywhere->D2 J9 W]]\n* [[Add a squirt of window cleaner to the cloth->D2 J9 W]]\n* [[Wring it out until it's barely damp->D2 J9 R]]\n* [[Hold the laptop upside down while she wipes->D2 J9 W]]", "D2 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Barely damp.** If you can squeeze a drop out, it's too wet, and drips can run into the edges of the screen.\"\n\n[[Got it->D2 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How damp is *damp*?\"\n\n[[Try again->D2 J9]]]", "D2 J9 R": "(set: $miss to 0)## ✅ Job done\n**Wring it out until it's barely damp.** Drips can run down behind the screen's edge. If you can squeeze out a drop, it's too wet.\n\n[[Next customer->D2 J10]]", "D2 J10": "**Theo's** microfiber cloth used to grab dust perfectly. Since his dad washed it with fabric softener, it just smears things around.\n\n**What happened?**\n\n* [[Microfiber can only be used one time->D2 J10 W]]\n* [[The cloth shrank in the washing machine->D2 J10 W]]\n* [[The softener made the cloth too clean to work->D2 J10 W]]\n* [[Fabric softener clogged the tiny fibers that grab dust->D2 J10 R]]", "D2 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Fabric softener** coats the tiny fibers so they can't grab dust anymore. Wash microfiber without it.\"\n\n[[Got it->D2 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say to skip when washing microfiber?\"\n\n[[Try again->D2 J10]]]", "D2 J10 R": "(set: $miss to 0)(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]## ✅ Job done\n**Fabric softener clogs the fibers.** Wash the cloth again with plain detergent and no softener, and it may recover. Don't use dryer sheets either.\n\n[[Close up shop->D2 Done]]", "D2 Done": "(if: $days does not contain \"2\")[(set: $days to it + (a: \"2\"))]# Day 2 complete!\n\n<div class=\"tool\">🧽 **New tool earned: Cleaning Kit**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Build your own cleaning kit from what's in your house, with a grown-up. Find a microfiber cloth (eyeglass cloths count), a soft brush, and cotton swabs. Put away anything from the trouble bin.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 3->D3 Start]]", "D3 Start": "(set: $miss to 0)# Day 3: Meet the Keyboards\n\n*The Inspector lines up keyboards like a museum display.*\n\n\"Different keyboards need different care. Pull a key off the wrong kind and you've got a broken keyboard. So step one, every time, is: **what type is this?**\"\n\n\n[[Open the shop->D3 L1]]", "D3 L1": "## 📘 The Inspector's lesson: What's Under the Keys\n\n\"Five kinds of keyboards. You can tell them apart by how they **feel**, how they **sound**, and what's **underneath**.\"\n\n* **Membrane:** a rubber **dome** under each key. Soft and squishy to press. Most inexpensive desktop keyboards.\n* **Scissor-switch:** thin keys sitting on tiny plastic **X-shaped clips**. A short, crisp press. Most laptops.\n* **Mechanical:** a separate **switch** under every key, and keycaps that pop off with a puller. Switches come in three kinds: **linear** (smooth all the way down, quiet), **tactile** (a little bump you can feel, fairly quiet), and **clicky** (a bump *and* a loud click).\n* **Butterfly:** ultra-flat keys with barely any movement, from some older laptops (many 2015–2019 MacBooks). Famous for jamming from a single crumb.\n* **Ergonomic or split:** shaped, tilted, or split in two so your wrists stay straighter.\n\n\n[[Got it. Send in the next customer->D3 J2]]", "D3 J2": "**Mila** hands over a keyboard and presses a key so you can hear it. *CLICK.* You can feel a little bump, then a sharp click. You pop the cap off with a puller and see a colorful switch underneath.\n\n**What type is it?**\n\n* [[Membrane with a rubber dome->D3 J2 W]]\n* [[Scissor-switch, like a laptop->D3 J2 W]]\n* [[Butterfly->D3 J2 W]]\n* [[Mechanical with clicky switches->D3 J2 R]]", "D3 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A separate switch under every key means **mechanical**. A bump plus a click means **clicky** switches.\"\n\n[[Got it->D3 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A separate switch under the cap, and a click you can hear.\"\n\n[[Try again->D3 J2]]]", "D3 J2 R": "(set: $miss to 0)## ✅ Job done\n**Mechanical, with clicky switches.** The separate switch under every key is the giveaway.\n\n[[Next customer->D3 J3]]", "D3 J3": "**Mr. Okoye** brings in a cheap office keyboard. The keys feel soft and squishy, with no click. When a key gets stuck, you pry it up and find a little rubber bump underneath.\n\n**What type is it?**\n\n* [[Membrane->D3 J3 R]]\n* [[Mechanical->D3 J3 W]]\n* [[Butterfly->D3 J3 W]]\n* [[Ergonomic split->D3 J3 W]]", "D3 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That rubber bump is a **dome**, so this is a **membrane** keyboard.\"\n\n[[Got it->D3 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Soft and squishy with a rubber bump. What's that bump called?\"\n\n[[Try again->D3 J3]]]", "D3 J3 R": "(set: $miss to 0)## ✅ Job done\n**Membrane.** Pressing a key squashes the rubber dome, which pushes two circuit layers together to make contact.\n\n[[Next customer->D3 J4]]", "D3 J4": "**Ben's** laptop keys are thin with a short, crisp press. Through the gap under one key, you can see a tiny white plastic X.\n\n**What type is it?**\n\n* [[Mechanical->D3 J4 W]]\n* [[Scissor-switch->D3 J4 R]]\n* [[Membrane with a rubber dome->D3 J4 W]]\n* [[Ergonomic split->D3 J4 W]]", "D3 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That X is the **scissor** clip. Scissor-switch keyboards are on most laptops.\"\n\n[[Got it->D3 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"A tiny plastic X under a thin laptop key...\"\n\n[[Try again->D3 J4]]]", "D3 J4 R": "(set: $miss to 0)## ✅ Job done\n**Scissor-switch.** That little X-shaped clip keeps the key level. It's also fragile, which is why laptop keys don't get popped off. More on that tomorrow.\n\n[[Next customer->D3 J5]]", "D3 J5": "**Mr. Hale's** older MacBook has super-flat keys that barely move. One key quit working after a single crumb fell into it.\n\n**What type is it most likely?**\n\n* [[Mechanical->D3 J5 W]]\n* [[Membrane->D3 J5 W]]\n* [[Ergonomic split->D3 J5 W]]\n* [[Butterfly->D3 J5 R]]", "D3 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's a **butterfly** keyboard. They're famous for jamming from tiny bits of debris.\"\n\n[[Got it->D3 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Ultra-flat, barely moves, older MacBook, jammed by one crumb...\"\n\n[[Try again->D3 J5]]]", "D3 J5 R": "(set: $miss to 0)## ✅ Job done\n**Butterfly.** These ultra-thin keyboards were on many 2015–2019 MacBooks, and they jammed so often that Apple ran a repair program for them. If one fails, a professional should handle it.\n\n[[Next customer->D3 J6]]", "D3 J6": "**Sofia** wants a mechanical keyboard, but she shares a bedroom with her little sister, who goes to sleep early.\n\n**Which switch type should she avoid?**\n\n* [[Linear switches->D3 J6 W]]\n* [[Tactile switches->D3 J6 W]]\n* [[Clicky switches->D3 J6 R]]\n* [[Low-profile linear switches->D3 J6 W]]", "D3 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Clicky** switches are made to click loudly. Linear or tactile would be much kinder to a sleeping sister.\"\n\n[[Got it->D3 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which switch makes a sound on purpose?\"\n\n[[Try again->D3 J6]]]", "D3 J6 R": "(set: $miss to 0)## ✅ Job done\nAvoid **clicky** switches, which click on every press. **Linear** (smooth) or **tactile** (a quiet bump) are much quieter.\n\n[[The Inspector has something to show you->D3 L7]]", "D3 L7": "## 📘 The Inspector's lesson: Sizes and Connections\n\n*The Inspector lines up three keyboards from longest to shortest.*\n\n* **Full-size:** everything, including the **number pad** on the right.\n* **TKL** (*tenkeyless*): no number pad. That leaves more room for the mouse.\n* **60%:** no number pad, **and** no arrow keys or function row. Tiny and portable.\n\n\"Then there's **how it connects**:\"\n\n* **Wired:** a cable. No batteries, no pairing.\n* **2.4 GHz wireless:** comes with a tiny USB **dongle**. **The keyboard only talks to the computer its dongle is plugged into.**\n* **Bluetooth:** no dongle. You **pair** it in the computer's Bluetooth settings. Usually you hold a pairing button on the keyboard until a light blinks.\n\n\n[[Got it. Send in the next customer->D3 J8]]", "D3 J8": "**Ava** shows you her gaming keyboard. It has letters, numbers, and arrow keys, but no number pad on the right side. \"I wanted more room for my mouse,\" she says.\n\n**What size of keyboard is this?**\n\n* [[Full-size->D3 J8 W]]\n* [[60%->D3 J8 W]]\n* [[TKL (tenkeyless)->D3 J8 R]]\n* [[Split ergonomic->D3 J8 W]]", "D3 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"No number pad, but it still has arrows and function keys. That's **TKL**.\"\n\n[[Got it->D3 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which size drops only the number pad?\"\n\n[[Try again->D3 J8]]]", "D3 J8 R": "(set: $miss to 0)## ✅ Job done\n**TKL, or tenkeyless.** A full keyboard minus the number pad. A 60% would have lost the arrow keys and function row too.\n\n[[Next customer->D3 J9]]", "D3 J9": "**Grandpa Leo's** new wireless keyboard stopped working after he moved his laptop to the other side of the house. A tiny USB plug is still sitting in his old desktop.\n\n**What's the likely problem?**\n\n* [[Its Bluetooth needs to be switched off in settings->D3 J9 W]]\n* [[Its 2.4 GHz dongle is still plugged into the other computer->D3 J9 R]]\n* [[Wireless keyboards only work within a single room->D3 J9 W]]\n* [[Its charging cable came loose from the laptop->D3 J9 W]]", "D3 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That tiny plug is the keyboard's **2.4 GHz dongle**. The keyboard only talks to whatever computer the dongle is plugged into.\"\n\n[[Got it->D3 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What is that tiny USB plug for?\"\n\n[[Try again->D3 J9]]]", "D3 J9 R": "(set: $miss to 0)## ✅ Job done\nMove the **dongle** to the laptop. A 2.4 GHz keyboard only talks to the computer its dongle is plugged into.\n\n[[Next customer->D3 J10]]", "D3 J10": "**Nadia's** Bluetooth keyboard works with her tablet. Now she wants to use it with her laptop. There's no dongle in the box.\n\n**How does she connect it?**\n\n* [[Plug the keyboard's charging cable into the tablet->D3 J10 W]]\n* [[Buy a 2.4 GHz dongle for the keyboard->D3 J10 W]]\n* [[Put the keyboard in pairing mode and pair it in Bluetooth settings->D3 J10 R]]\n* [[Hold the keyboard against the laptop until it connects->D3 J10 W]]", "D3 J10 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Bluetooth keyboards **pair**. Hold the pairing button until the light blinks, then choose the keyboard in the laptop's **Bluetooth settings**.\"\n\n[[Got it->D3 J10 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Bluetooth keyboards don't use a dongle. What do you do instead?\"\n\n[[Try again->D3 J10]]]", "D3 J10 R": "(set: $miss to 0)## ✅ Job done\n**Pairing mode, then Bluetooth settings.** Hold the keyboard's pairing button until its light blinks, then pick it from the laptop's Bluetooth list.\n\n[[Next customer->D3 J11]]", "D3 J11": "**Mrs. Kowalski** types all day for work, and her wrists bend outward at an angle on her regular keyboard. She wants something more comfortable.\n\n**Which keyboard style is designed for this?**\n\n* [[A 60% keyboard, since it's smaller->D3 J11 W]]\n* [[An ergonomic split keyboard->D3 J11 R]]\n* [[A butterfly keyboard, since it's flatter->D3 J11 W]]\n* [[A clicky mechanical keyboard->D3 J11 W]]", "D3 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"An **ergonomic split** keyboard lets each hand sit straight in front of its own shoulder.\"\n\n[[Got it->D3 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which style is shaped to keep wrists straighter?\"\n\n[[Try again->D3 J11]]]", "D3 J11 R": "(set: $miss to 0)(if: $days does not contain \"3\")[(set: $days to it + (a: \"3\"))]## ✅ Job done\nAn **ergonomic split** keyboard. Splitting the halves apart lets her wrists stay straight instead of bending outward. Day 7 covers posture in detail.\n\n[[Close up shop->D3 Done]]", "D3 Done": "(if: $days does not contain \"3\")[(set: $days to it + (a: \"3\"))]# Day 3 complete!\n\n<div class=\"tool\">⌨️ **New tool earned: Keyboard ID Card**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Identify your own keyboard: what type, what size, and how it connects. Explain to someone how you can tell, using clues like the feel, the sound, and any stickers underneath.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 4->D4 Start]]", "D4 Start": "(set: $miss to 0)# Day 4: Keyboard Cleaning Day\n\n*The Inspector holds up a keyboard and shakes it. Something crunches inside.*\n\n\"Yesterday you learned to tell keyboards apart. Today you learn why that matters: **each type gets cleaned differently.** Weekly clean first, then deep cleaning, then what to do when something gets spilled.\"\n\n\n[[Open the shop->D4 L1]]", "D4 L1": "## 📘 The Inspector's lesson: The Weekly Clean\n\n\"Every keyboard gets this, in this order:\"\n\n1. **Unplug it** (or shut down the laptop).\n2. **Flip it over and tap gently** so loose crumbs fall out.\n3. **Compressed air** between the keys, upright, in short bursts.\n4. **Wipe the keycaps** with a cloth barely dampened with alcohol or distilled water.\n\n\"Loose stuff first, then the stuck stuff, then the surface. Wiping first just pushes crumbs deeper.\"\n\n\n[[Got it. Send in the next customer->D4 J2]]", "D4 J2": "**Job 1: weekly clean, step by step.** A crumb-filled desktop keyboard is on the bench.\n\n**What's the very first step?**\n\n* [[Blast it with compressed air->D4 J2 W]]\n* [[Unplug it->D4 J2 R]]\n* [[Wipe the keycaps->D4 J2 W]]\n* [[Flip it over and tap it->D4 J2 W]]", "D4 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Unplug it first.** Always. Otherwise every wipe types something.\"\n\n[[Got it->D4 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What always comes first in this shop?\"\n\n[[Try again->D4 J2]]]", "D4 J2 R": "(set: $miss to 0)## ✅ Job done\n**Unplug it.** Otherwise every wipe types a random string into whatever window is open.\n\n[[Next customer->D4 J3]]", "D4 J3": "It's unplugged.\n\n**What's the next step?**\n\n* [[Wipe the keycaps with a damp cloth->D4 J3 W]]\n* [[Spray alcohol between the keys->D4 J3 W]]\n* [[Flip it over and tap it gently->D4 J3 R]]\n* [[Pull every keycap off with a puller->D4 J3 W]]", "D4 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Flip and tap.** Let gravity do the easy part before anything else.\"\n\n[[Got it->D4 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Get the loose stuff out first, the easy way.\"\n\n[[Try again->D4 J3]]]", "D4 J3 R": "(set: $miss to 0)## ✅ Job done\n**Flip and tap.** Gravity removes loose crumbs for free.\n\n[[Next customer->D4 J4]]", "D4 J4": "*A small shower of crumbs and one dog hair land on the bench.* \"Grandpa Leo's, obviously,\" says The Inspector.\n\n**What's next?**\n\n* [[Compressed air between the keys, then wipe the keycaps->D4 J4 R]]\n* [[Wipe the keycaps, then spray water between them->D4 J4 W]]\n* [[Vacuum the gaps with the household vacuum cleaner->D4 J4 W]]\n* [[Run the keyboard through the dishwasher on gentle->D4 J4 W]]", "D4 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Compressed air, then a barely damp wipe.** Never a vacuum, never water in the gaps.\"\n\n[[Got it->D4 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Air before wiping. And remember the trouble bin.\"\n\n[[Try again->D4 J4]]]", "D4 J4 R": "(set: $miss to 0)## ✅ Job done\n**Air, then wipe.** Done! That's the whole weekly clean.\n\n[[The Inspector has something to show you->D4 L5]]", "D4 L5": "## 📘 The Inspector's lesson: Deep Cleaning by Type\n\n\"Sometimes the weekly clean isn't enough. How you go deeper depends on the type:\"\n\n* **Mechanical:** keycaps come off with a **keycap puller**. **Take a photo of the layout first.** Wash only the caps in warm, soapy water, and let them **dry completely**, a full day, before putting them back. The keyboard itself never gets wet.\n* **Big keys** (space bar, Shift, Enter) have **stabilizers**: metal wires and clips that keep long keys level. Pull these **straight up, slowly and evenly**. Yank one end and the wire pops out.\n* **Sticky mechanical switch:** take the cap off, put a tiny bit of alcohol on a swab, touch it to the switch, and press the switch a few times. Let it dry.\n* **Laptop keys stay on.** Their scissor clips snap easily. Clean *around* them with air and swabs.\n* **Membrane keyboards:** some caps pop off, but the rubber domes underneath stay put. Never soak the keyboard.\n\n\n[[Got it. Send in the next customer->D4 J6]]", "D4 J6": "**Ben** brings in his laptop. \"There's a crumb stuck under my H key. Should I pop it off with a butter knife like my friend does with his gaming keyboard?\"\n\n**What do you tell him?**\n\n* [[Yes. All keycaps pop off the same way, even on laptops->D4 J6 W]]\n* [[Yes, but use a flat screwdriver instead of a butter knife->D4 J6 W]]\n* [[No. Laptop keys snap, so clean around it with air and a swab->D4 J6 R]]\n* [[No. Press the key hard until the crumb gets crushed under it->D4 J6 W]]", "D4 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Laptop keys stay on.** Mechanical keycaps are made to come off. Laptop keys sit on tiny scissor clips that snap.\"\n\n[[Got it->D4 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about laptop keys?\"\n\n[[Try again->D4 J6]]]", "D4 J6 R": "(set: $miss to 0)## ✅ Job done\n**Laptop keys stay on.** A broken scissor clip usually means replacing the whole keyboard.\n\n[[Next customer->D4 J7]]", "D4 J7": "**Jordan** is deep-cleaning his mechanical keyboard. He's pulled all the keycaps off with a puller and wants to wash them.\n\n**What's the smart way to do it?**\n\n* [[Wash the whole keyboard under the faucet, then let it dry->D4 J7 W]]\n* [[Wash only the keycaps in warm soapy water and let them dry completely->D4 J7 R]]\n* [[Boil the keycaps in a pot so they come out really clean->D4 J7 W]]\n* [[Wash the keycaps, then put them back on while still damp->D4 J7 W]]", "D4 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Only the keycaps get washed**, never the keyboard. Warm soapy water, then dry *completely*.\"\n\n[[Got it->D4 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which part can get wet? And for how long do they dry?\"\n\n[[Try again->D4 J7]]]", "D4 J7 R": "(set: $miss to 0)## ✅ Job done\n**Just the keycaps, warm soapy water, dry completely.** Boiling can warp plastic, and damp caps drip into the switches. Hopefully he took that layout photo!\n\n[[Next customer->D4 J8]]", "D4 J8": "**Jordan's friend Quinn** is trying to pull off his space bar. He hooked the puller under the left end and is yanking it upward.\n\n**What should Quinn do instead?**\n\n* [[Yank the right end too, so both sides match->D4 J8 W]]\n* [[Twist the space bar sideways to unclip it->D4 J8 W]]\n* [[Leave the puller on and pry harder from one end->D4 J8 W]]\n* [[Lift it straight up, slowly and evenly from both ends->D4 J8 R]]", "D4 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The space bar has **stabilizers**. Pull it **straight up, slowly and evenly**, or the wire pops out of its clip.\"\n\n[[Got it->D4 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's special about big keys like the space bar?\"\n\n[[Try again->D4 J8]]]", "D4 J8 R": "(set: $miss to 0)## ✅ Job done\n**Straight up, slow and even.** Long keys have stabilizer wires, and yanking one end is the classic way to knock one loose. (There's a whole case file about this in Unit 3.)\n\n[[Next customer->D4 J9]]", "D4 J9": "**Ava's** mechanical W key feels sticky after a soda drip. The rest of the keyboard is fine.\n\n**What's a good home fix?**\n\n* [[Pull the cap and swab the switch with a little alcohol->D4 J9 R]]\n* [[Pour dish soap straight into the switch and wait->D4 J9 W]]\n* [[Rinse the whole keyboard under warm running water->D4 J9 W]]\n* [[Keep typing hard until the switch loosens on its own->D4 J9 W]]", "D4 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Cap off, **a little alcohol on a swab**, touch it to the switch, press it a few times, and let it dry.\"\n\n[[Got it->D4 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"I covered sticky switches in the deep-cleaning lesson.\"\n\n[[Try again->D4 J9]]]", "D4 J9 R": "(set: $miss to 0)## ✅ Job done\n**Cap off, swab with a little alcohol, press it a few times, let it dry.** Unplug first, of course. Alcohol dissolves the sugar and evaporates.\n\n[[The Inspector has something to show you->D4 L10]]", "D4 L10": "## 📘 The Inspector's lesson: Spill Emergency\n\n*The Inspector's voice gets serious.* \"Spills are the number-one keyboard killer. What you do in the **first minute** matters most.\"\n\n1. **Power off and unplug, immediately.** Electricity plus liquid is what causes the damage.\n2. **Flip it upside down** so liquid drains *out*. Laptops go open, in a tent shape, keys facing down.\n3. **Blot, don't wipe.** Wiping spreads liquid around.\n4. **Let it dry at least 24–48 hours.** No turning it on \"just to check.\"\n\n\"**Skip the rice.** It doesn't dry electronics any faster than air, and grains get stuck inside. **Sugary drinks** (juice, soda, milk) leave sticky residue behind, so they often need a professional cleaning.\"\n\n\n[[Got it. Send in the next customer->D4 J11]]", "D4 J11": "**Omar** just knocked a glass of water across his desktop keyboard. It's still plugged in.\n\n**What's the very first thing to do?**\n\n* [[Unplug it right away->D4 J11 R]]\n* [[Grab a towel and wipe the keys->D4 J11 W]]\n* [[Type a few keys to see if it still works->D4 J11 W]]\n* [[Find a bowl of rice to put it in->D4 J11 W]]", "D4 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Unplug it immediately.** Then flip, blot, and dry. Testing it while it's wet is the worst move.\"\n\n[[Got it->D4 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"First minute, first step...\"\n\n[[Try again->D4 J11]]]", "D4 J11 R": "(set: $miss to 0)## ✅ Job done\n**Unplug first.** Then flip it over, blot (don't wipe), and let it dry for at least 24–48 hours.\n\n[[Next customer->D4 J12]]", "D4 J12": "**Hana's** little brother spilled apple juice on her laptop. She shut it off, flipped it, and let it dry for two days. Now it turns on, but several keys feel gummy.\n\n**What's the best next step?**\n\n* [[Put it in a bag of rice for another two days->D4 J12 W]]\n* [[Pour water over the keys to rinse out the juice->D4 J12 W]]\n* [[Take it to a professional for a cleaning->D4 J12 R]]\n* [[Pry off the gummy laptop keys to scrub underneath->D4 J12 W]]", "D4 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"She did everything right, but **juice leaves sugar behind.** That needs a **professional cleaning**.\"\n\n[[Got it->D4 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say about sugary drinks?\"\n\n[[Try again->D4 J12]]]", "D4 J12 R": "(set: $miss to 0)(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]## ✅ Job done\n**Professional cleaning.** Hana's quick response probably saved the laptop, but sugar residue can keep causing stickiness and corrosion inside.\n\n[[Close up shop->D4 Done]]", "D4 Done": "(if: $days does not contain \"4\")[(set: $days to it + (a: \"4\"))]# Day 4 complete!\n\n<div class=\"tool\">🧹 **New tool earned: Keycap Puller**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** With a grown-up's OK, give your own keyboard a **weekly clean**: unplug, flip and tap, air, wipe. Take before-and-after photos if you like. Then make a sticky-note spill plan and put it near your computer.</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 5->D5 Start]]", "D5 Start": "(set: $miss to 0)# Day 5: Meet the Mice\n\n*The Inspector opens a drawer full of mice, from a dusty one with a rubber ball to a glowing gaming mouse.*\n\n\"Same deal as keyboards: name it first, then you'll know how to care for it. Mice have changed a lot, so let's start with how they *see*.\"\n\n\n[[Open the shop->D5 L1]]", "D5 L1": "## 📘 The Inspector's lesson: How a Mouse Sees\n\n* **Ball mouse** (museum piece): a rubber ball underneath rolled two little **rollers** inside, one for side-to-side and one for up-and-down. When the rollers got gunky, the cursor stuck or only moved one direction.\n* **Optical:** a small light and a tiny camera that photographs the surface thousands of times a second to see movement.\n* **Laser:** like optical, but it can read more kinds of surfaces.\n\n\"Optical and laser sensors need **surface texture** to see. **Clear glass** and **mirrors** give them nothing to track, so the cursor jumps. A **mouse pad** fixes that.\"\n\n\n[[Got it. Send in the next customer->D5 J2]]", "D5 J2": "**Mrs. Lin** just got a beautiful glass desk. Now her mouse cursor jumps and skips around.\n\n**Why?**\n\n* [[Glass blocks the mouse's wireless signal to the computer->D5 J2 W]]\n* [[The mouse needs a driver update to work on glass->D5 J2 W]]\n* [[The sensor needs surface texture to track, and clear glass has none->D5 J2 R]]\n* [[Glass desks reflect heat and make the mouse overheat->D5 J2 W]]", "D5 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"The sensor tracks tiny texture on the surface. **Clear glass has nothing to track.** A mouse pad fixes it.\"\n\n[[Got it->D5 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How does an optical mouse know it's moving?\"\n\n[[Try again->D5 J2]]]", "D5 J2 R": "(set: $miss to 0)## ✅ Job done\n**Clear glass gives the sensor nothing to track.** Fix: a **mouse pad**.\n\n[[Next customer->D5 J3]]", "D5 J3": "**Mr. Abernathy** dug his old mouse out of a closet. It has a rubber ball underneath. The cursor will move left and right, but not up and down.\n\n**What's most likely wrong?**\n\n* [[The up-and-down roller inside is coated with gunk->D5 J3 R]]\n* [[The computer only supports side-to-side movement->D5 J3 W]]\n* [[The rubber ball has gone flat and needs air->D5 J3 W]]\n* [[The mouse needs a laser sensor installed->D5 J3 W]]", "D5 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"One roller handles side-to-side and one handles up-and-down. **The up-and-down roller is gunked up.** Pop out the ball and clean the rollers.\"\n\n[[Got it->D5 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How many rollers does a ball mouse have, and what does each one do?\"\n\n[[Try again->D5 J3]]]", "D5 J3 R": "(set: $miss to 0)## ✅ Job done\n**The up-and-down roller is gunked.** Twist off the ring underneath, take out the ball, and gently scrape the gunk off the rollers. (Then maybe think about an optical mouse!)\n\n[[The Inspector has something to show you->D5 L4]]", "D5 L4": "## 📘 The Inspector's lesson: Shapes for Different Jobs\n\n* **Trackball:** the device stays still, and you roll a ball with your thumb or fingers. Great for small desks and tired shoulders.\n* **Vertical mouse:** your hand rests sideways, like a handshake, so your forearm isn't twisted.\n* **Gaming mouse:** extra buttons and adjustable **DPI**, which is how far the cursor moves when you move the mouse. Higher DPI means a faster cursor.\n* **Trackpad:** a touch surface on most laptops. One finger moves the cursor, and **two fingers sliding together scroll**.\n* **Drawing tablet:** a flat pad and a **stylus** (pen) for drawing. Press harder for darker or thicker lines.\n\n\n[[Got it. Send in the next customer->D5 J5]]", "D5 J5": "**Mr. Patel** works at a tiny desk with no room to slide a mouse around, and his shoulder gets tired.\n\n**Which mouse would help most?**\n\n* [[A gaming mouse, which has extra programmable buttons->D5 J5 W]]\n* [[A trackball, which stays still while he rolls the ball->D5 J5 R]]\n* [[A ball mouse, which uses a rubber ball underneath->D5 J5 W]]\n* [[A bigger mouse pad, which gives him more sliding room->D5 J5 W]]", "D5 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **trackball** stays in one spot. Only the ball moves.\"\n\n[[Got it->D5 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which mouse doesn't need to move at all?\"\n\n[[Try again->D5 J5]]]", "D5 J5 R": "(set: $miss to 0)## ✅ Job done\nA **trackball**. It needs almost no desk space and almost no arm movement.\n\n[[Next customer->D5 J6]]", "D5 J6": "**Rosa's** forearm aches after long days of homework. When she uses her mouse, her palm faces flat down.\n\n**Which mouse might feel better?**\n\n* [[A laser mouse, which tracks on more kinds of surfaces->D5 J6 W]]\n* [[A smaller mouse, which takes up less room on the desk->D5 J6 W]]\n* [[A gaming mouse, which lets her raise the DPI->D5 J6 W]]\n* [[A vertical mouse, which holds her hand like a handshake->D5 J6 R]]", "D5 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **vertical mouse** turns the hand sideways, like a handshake, so the forearm isn't twisted.\"\n\n[[Got it->D5 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which mouse changes the angle of your hand?\"\n\n[[Try again->D5 J6]]]", "D5 J6 R": "(set: $miss to 0)## ✅ Job done\nA **vertical mouse.** (If pain keeps going, she should tell a grown-up and maybe see a doctor.)\n\n[[Next customer->D5 J7]]", "D5 J7": "**Dev** got a gaming mouse. \"It has a DPI button, and when I press it, the cursor suddenly zooms across the screen. Is it broken?\"\n\n**What's happening?**\n\n* [[The DPI button broke, so the mouse needs replacing->D5 J7 W]]\n* [[DPI turns on the lights, which confuses the sensor->D5 J7 W]]\n* [[DPI changes how far the cursor moves, and he turned it up->D5 J7 R]]\n* [[DPI switches to Bluetooth, which makes the cursor jump->D5 J7 W]]", "D5 J7 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**DPI** is sensitivity: how far the cursor moves when the mouse moves. Press the button again to bring it down.\"\n\n[[Got it->D5 J7 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does DPI control?\"\n\n[[Try again->D5 J7]]]", "D5 J7 R": "(set: $miss to 0)## ✅ Job done\n**DPI** stands for *dots per inch*. Higher means a faster cursor. Nothing's broken.\n\n[[Next customer->D5 J8]]", "D5 J8": "**Lily** loves to draw and wants to make digital art. Drawing with a regular mouse feels like drawing with a bar of soap.\n\n**What tool fits her best?**\n\n* [[A trackball she can roll with her thumb->D5 J8 W]]\n* [[A drawing tablet with a stylus->D5 J8 R]]\n* [[A vertical mouse she holds sideways->D5 J8 W]]\n* [[A gaming mouse with a high DPI setting->D5 J8 W]]", "D5 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"A **drawing tablet with a stylus** works like a pen on paper, and pressing harder makes thicker lines.\"\n\n[[Got it->D5 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which tool works like a pen?\"\n\n[[Try again->D5 J8]]]", "D5 J8 R": "(set: $miss to 0)## ✅ Job done\nA **drawing tablet with a stylus.** Holding a pen is far more natural for drawing, and pressure changes the line.\n\n[[Next customer->D5 J9]]", "D5 J9": "**Ms. Park** is using her laptop's trackpad and can't figure out how to scroll down a long web page.\n\n**What do you show her?**\n\n* [[Press down hard with one finger and hold->D5 J9 W]]\n* [[Tap the trackpad three times quickly->D5 J9 W]]\n* [[Draw a circle with one finger->D5 J9 W]]\n* [[Slide two fingers up or down together->D5 J9 R]]", "D5 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Two fingers sliding together** scroll on most trackpads.\"\n\n[[Got it->D5 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"How many fingers did I say for scrolling?\"\n\n[[Try again->D5 J9]]]", "D5 J9 R": "(set: $miss to 0)## ✅ Job done\n**Two fingers, sliding together.** One finger moves the cursor, and two fingers scroll.\n\n[[The Inspector has something to show you->D5 L10]]", "D5 L10": "## 📘 The Inspector's lesson: Power and Connections\n\n\"Mice connect the same three ways keyboards do: **wired**, **2.4 GHz dongle**, or **Bluetooth**.\"\n\n* **Wired mice** never need batteries and never need pairing.\n* **Wireless mice** run on **AA or AAA batteries**, or on a **built-in rechargeable battery** you charge with a cable.\n* **Low-battery warning signs:** the cursor starts to **lag, skip, or stutter**, a little worse each day, or the mouse randomly disconnects. Before blaming the mouse, **change or charge the battery**.\n\n\n[[Got it. Send in the next customer->D5 J11]]", "D5 J11": "**Gabe's** wireless mouse has gotten a little laggier and jumpier every day this week. It runs on AA batteries.\n\n**What should he try first?**\n\n* [[Buy a brand-new mouse->D5 J11 W]]\n* [[Put in fresh batteries->D5 J11 R]]\n* [[Reinstall the computer's operating system->D5 J11 W]]\n* [[Turn the DPI all the way up->D5 J11 W]]", "D5 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Lag and skipping that get worse day by day mean **low batteries**. Fresh batteries first.\"\n\n[[Got it->D5 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say are the warning signs of a low battery?\"\n\n[[Try again->D5 J11]]]", "D5 J11 R": "(set: $miss to 0)## ✅ Job done\n**Fresh batteries.** Steadily worsening lag is the classic low-battery sign. Always try the simple fix first.\n\n[[Next customer->D5 J12]]", "D5 J12": "**Mrs. Okafor** runs a computer lab at a library. She's tired of mice dying in the middle of classes.\n\n**Which mice would solve that?**\n\n* [[Bluetooth mice, which pair with each computer->D5 J12 W]]\n* [[Wireless mice with AA batteries->D5 J12 W]]\n* [[2.4 GHz mice with a dongle for each computer->D5 J12 W]]\n* [[Wired mice, which never need batteries->D5 J12 R]]", "D5 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Wired mice** get power through the cable. They never need batteries or charging.\"\n\n[[Got it->D5 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Which kind never runs out of power?\"\n\n[[Try again->D5 J12]]]", "D5 J12 R": "(set: $miss to 0)(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]## ✅ Job done\n**Wired mice.** No batteries, no charging, no pairing. That's perfect for shared computers.\n\n[[Close up shop->D5 Done]]", "D5 Done": "(if: $days does not contain \"5\")[(set: $days to it + (a: \"5\"))]# Day 5 complete!\n\n<div class=\"tool\">🖱️ **New tool earned: Mouse Field Guide**</div>\n\n*The Inspector flips the sign to CLOSED.* \"Good work today. Before tomorrow, I've got homework for you.\"\n\n<div class=\"field\">📝 **Field assignment (real life):** Identify your own mouse or trackpad. Then test it on three different surfaces, like a mouse pad, a wooden table, and something shiny. Where does it track best, and why?</div>\n\n[[Back to the work schedule->Shop]]\n[[Start Day 6->D6 Start]]", "D6 Start": "(set: $miss to 0)# Day 6: Mouse Service Day\n\n*A pile of grimy mice waits on the bench. One scroll wheel is fuzzy with lint.*\n\n\"Mice live in your hand all day, so they collect skin oil, lint, and crumbs. Today is service day.\"\n\n\n[[Open the shop->D6 L1]]", "D6 L1": "## 📘 The Inspector's lesson: The Service Checklist\n\n1. **Power off.** Unplug it, switch it off, or take the batteries out.\n2. **Shell and buttons:** wipe with a cloth barely dampened with alcohol. That cuts through skin oil.\n3. **Sensor window** on the bottom: a gentle puff of air or a **dry** swab. It's like a tiny camera lens, so no scrubbing and nothing wet.\n4. **Mouse feet** (the smooth pads underneath): gently scrape off built-up grime. **Replace them** when they're worn through. They're cheap.\n5. **Scroll wheel:** compressed air, then a **wooden toothpick** to lift lint out of the gap. Never metal.\n6. **Cloth mouse pads:** hand wash with mild soap, rinse, and let them **air dry completely**.\n\n\n[[Got it. Send in the next customer->D6 J2]]", "D6 J2": "**Sam's** wireless mouse cursor keeps flickering and jittering. You flip it over: there's a hair and a smear of dust right across the sensor window.\n\n**How do you clean the sensor?**\n\n* [[Scrub it hard with a wet paper towel->D6 J2 W]]\n* [[Scrape the dust off with a metal pin->D6 J2 W]]\n* [[Spray glass cleaner straight onto it->D6 J2 W]]\n* [[A gentle puff of air or a dry cotton swab->D6 J2 R]]", "D6 J2 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A puff of air or a dry swab.** Scratch that window and the smudge is permanent.\"\n\n[[Got it->D6 J2 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Gentle, and dry.\"\n\n[[Try again->D6 J2]]]", "D6 J2 R": "(set: $miss to 0)## ✅ Job done\n**Air or a dry swab, gently.** The sensor window is a little camera lens.\n\n[[Next customer->D6 J3]]", "D6 J3": "**Mr. Ito's** scroll wheel barely turns, and you can see gray fuzz packed into the gap around it.\n\n**What's the fix?**\n\n* [[Pour alcohol into the gap and spin the wheel->D6 J3 W]]\n* [[Compressed air, then a wooden toothpick to lift the lint->D6 J3 R]]\n* [[Dig the lint out with a metal paperclip->D6 J3 W]]\n* [[Pull the scroll wheel out with pliers->D6 J3 W]]", "D6 J3 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Compressed air, then a wooden toothpick.** Metal can scratch or short something.\"\n\n[[Got it->D6 J3 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check step 5 on the checklist.\"\n\n[[Try again->D6 J3]]]", "D6 J3 R": "(set: $miss to 0)## ✅ Job done\n**Air, then a wooden toothpick.** Lift the lint out gently, then spin the wheel to check.\n\n[[Next customer->D6 J4]]", "D6 J4": "**Tara's** white mouse has turned grayish and shiny where her palm rests.\n\n**What cleans it best?**\n\n* [[A cloth barely dampened with alcohol->D6 J4 R]]\n* [[A scrubby sponge with dish soap->D6 J4 W]]\n* [[A paper towel soaked in bleach->D6 J4 W]]\n* [[Running it under the kitchen faucet->D6 J4 W]]", "D6 J4 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**A cloth barely dampened with alcohol** cuts through skin oil and dries fast.\"\n\n[[Got it->D6 J4 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What cuts through skin oil without hurting electronics?\"\n\n[[Try again->D6 J4]]]", "D6 J4 R": "(set: $miss to 0)## ✅ Job done\n**A cloth barely dampened with alcohol.** That shine is skin oil. Never run a mouse under water.\n\n[[Next customer->D6 J5]]", "D6 J5": "**Dev's** gaming mouse now drags and scratches across his mouse pad. Underneath, the smooth pads are worn thin, with a dark crust of grime around them.\n\n**What's the fix?**\n\n* [[Sand the bottom of the mouse until it's smooth->D6 J5 W]]\n* [[Glue a sheet of paper across the bottom->D6 J5 W]]\n* [[Clean the grime off, and replace the feet if worn->D6 J5 R]]\n* [[Buy a bigger mouse pad and keep using it->D6 J5 W]]", "D6 J5 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Those are **mouse feet**. Clean the grime off, and **replace them** when they're worn through.\"\n\n[[Got it->D6 J5 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Those smooth pads have a name, and they can be replaced.\"\n\n[[Try again->D6 J5]]]", "D6 J5 R": "(set: $miss to 0)## ✅ Job done\n**Clean the feet, and replace them if they're worn.** New feet bring back the smooth glide.\n\n[[Next customer->D6 J6]]", "D6 J6": "**Jun's** cloth mouse pad is stained and smells like snacks.\n\n**How should he clean it?**\n\n* [[Hand wash with mild soap, rinse, and air dry completely->D6 J6 R]]\n* [[Scrub it with bleach to remove the stains->D6 J6 W]]\n* [[Put it in the dryer on high heat to kill germs->D6 J6 W]]\n* [[Wipe it with window cleaner and use it right away->D6 J6 W]]", "D6 J6 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Mild soap, rinse, and air dry completely.** High heat can warp the rubber back.\"\n\n[[Got it->D6 J6 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Check step 6 on the checklist.\"\n\n[[Try again->D6 J6]]]", "D6 J6 R": "(set: $miss to 0)## ✅ Job done\n**Hand wash, rinse, air dry completely.** A damp mouse pad grows smells, and high heat can damage the rubber base.\n\n[[The Inspector has something to show you->D6 L7]]", "D6 L7": "## 📘 The Inspector's lesson: Trackballs and Trackpads\n\n* **Trackball:** pop the ball out (most have a hole underneath to push it from). Wipe the ball, then clean the **little support dots or rollers** it rests on with a swab barely dampened with alcohol. That's where the gunk hides.\n* **Trackpad:** **turn the laptop off** first, so wiping doesn't click on things. Use a microfiber cloth that's barely damp, and keep liquid away from the edges.\n\n\n[[Got it. Send in the next customer->D6 J8]]", "D6 J8": "**Mr. Patel** is back. His trackball cursor now moves in jerky little jumps.\n\n**Where's the gunk most likely hiding?**\n\n* [[Inside the USB cable that connects it to the computer->D6 J8 W]]\n* [[In the computer's mouse settings menu->D6 J8 W]]\n* [[On the rubber feet on the bottom of the case->D6 J8 W]]\n* [[On the small support dots or rollers the ball sits on->D6 J8 R]]", "D6 J8 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"Pop the ball out and look at the **support dots or rollers** underneath.\"\n\n[[Got it->D6 J8 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What does the ball rest on?\"\n\n[[Try again->D6 J8]]]", "D6 J8 R": "(set: $miss to 0)## ✅ Job done\n**The support dots or rollers.** Wipe them with a swab barely dampened with alcohol, wipe the ball, and put it back.\n\n[[Next customer->D6 J9]]", "D6 J9": "**Kira** is cleaning her laptop's smudgy trackpad while the laptop is on. Every wipe opens a random program.\n\n**What should she do?**\n\n* [[Wipe faster so it doesn't register the touches->D6 J9 W]]\n* [[Turn the laptop off, then wipe with a barely damp cloth->D6 J9 R]]\n* [[Spray cleaner on the trackpad so the cloth glides->D6 J9 W]]\n* [[Wear gloves so the trackpad can't feel her->D6 J9 W]]", "D6 J9 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Turn the laptop off first.** Then a barely damp microfiber cloth.\"\n\n[[Got it->D6 J9 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What did I say to do first with a trackpad?\"\n\n[[Try again->D6 J9]]]", "D6 J9 R": "(set: $miss to 0)## ✅ Job done\n**Off first, then a barely damp microfiber cloth.** And keep liquid away from the edges.\n\n[[The Inspector has something to show you->D6 L10]]", "D6 L10": "## 📘 The Inspector's lesson: Battery Care\n\n* Old batteries can **leak**, leaving a **crusty white powder** that irritates skin. If you see it: **get a grown-up and gloves**, take the batteries out, clean the metal contacts with a swab, and **recycle** the old batteries.\n* **Prevention:** take batteries out of anything you won't use for a long time.\n* **Rechargeable mice:** don't leave them completely dead for months. Charge them up now and then.\n* **Never throw batteries in the trash.** Many stores and recycling centers have battery drop-off bins. Rechargeable batteries in garbage trucks can even start fires.\n\n\n[[Got it. Send in the next customer->D6 J11]]", "D6 J11": "**Lena** opens the battery door on her old wireless mouse, unused all summer. The batteries are covered in a crusty white powder.\n\n**What should she do?**\n\n* [[Wipe the powder off with her fingers and reuse them->D6 J11 W]]\n* [[Get a grown-up, put on gloves, and remove the batteries->D6 J11 R]]\n* [[Blow the powder away and put the batteries back->D6 J11 W]]\n* [[Close the door and keep using the mouse as it is->D6 J11 W]]", "D6 J11 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"That's **leaked battery chemicals**. **Grown-up, gloves, batteries out**, then clean the contacts and recycle the batteries.\"\n\n[[Got it->D6 J11 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"Is that crust safe to touch?\"\n\n[[Try again->D6 J11]]]", "D6 J11 R": "(set: $miss to 0)## ✅ Job done\n**Grown-up, gloves, batteries out.** Then clean the contacts with a swab and recycle the old batteries.\n\n[[Next customer->D6 J12]]", "D6 J12": "**Mr. Chen** is leaving for a three-month trip. His spare wireless mouse runs on AA batteries and will sit in a drawer the whole time.\n\n**What should he do before he goes?**\n\n* [[Leave the batteries in so it's ready when he's back->D6 J12 W]]\n* [[Turn the mouse upside down so the batteries don't leak->D6 J12 W]]\n* [[Take the batteries out->D6 J12 R]]\n* [[Wrap the mouse in plastic wrap->D6 J12 W]]", "D6 J12 W": "(set: $miss to it + 1)(if: $miss >= 2)[## Let me show you\n*The Inspector leans over.* \"**Take the batteries out** of anything that won't be used for a long time.\"\n\n[[Got it->D6 J12 R]]](else:)[## Not quite\n*The Inspector raises an eyebrow.* \"What's the prevention rule?\"\n\n[[Try again->D6 J12]]]", "D6 J12 R": "(set: $miss to 0)(if: $days does not contain \"6\")[(set: $days to it + (a: \"6\"))]## ✅ Job done\n**Take the batteries out.** Batteries sitting unused for months are the ones most likely to leak.\n\n[[Close up
