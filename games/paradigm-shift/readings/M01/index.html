<script>
  var LEVELS = {"core": "<h1>Module 1: The Textbook Lie<\/h1>\n<p class=\"lede\">In 1775, an English minister breathed a brand-new gas on purpose, just to see what it would do to him. He was right that the gas was special. He was wrong about what it was. And the way most books tell this story is a little bit wrong too.<\/p>\n<h2><span>Who discovered oxygen?<\/span><\/h2>\n<p>Open almost any science book and you might read: \"Joseph Priestley discovered oxygen in 1774.\" One person, one year, done.<\/p>\n<p>It's a neat sentence, and it leaves out most of what really happened. Here's the messier story.<\/p>\n<div class=\"timeline\">\n<p class=\"entry\"><strong>Around 1771 or 1772,<\/strong> a Swedish chemist named Carl Wilhelm Scheele heated some chemicals and collected a gas that made flames burn brighter. He called it \"fire air.\" His book didn't come out until 1777.<\/p>\n<p class=\"entry\"><strong>In August 1774,<\/strong> an English minister and chemist named Joseph Priestley heated a red powder and collected a gas. A candle burned in it with an amazingly strong flame.<\/p>\n<p class=\"entry\"><strong>In October 1774,<\/strong> Priestley visited Paris and told a French chemist, Antoine Lavoisier, about his gas.<\/p>\n<p class=\"entry\"><strong>Early in 1775,<\/strong> back in England, Priestley tested the gas some more. A mouse in a jar of it stayed lively much longer than in ordinary air. Priestley breathed some himself.<\/p>\n<\/div>\n<p>But Priestley didn't think he had found a new element. Chemists back then believed that anything burning gave off an invisible stuff called <em>phlogiston<\/em> (say it: flo-JISS-tun). Priestley decided his gas was air with the phlogiston taken out. He called it \"dephlogisticated air.\"<\/p>\n<p>Lavoisier repeated the experiments and came to a completely different conclusion. There is no phlogiston, he argued. This gas is a basic ingredient of the air, an element. When things burn, they grab it instead of giving something off. He named it <em>oxygen<\/em>. Priestley never agreed. For the rest of his life, he kept saying phlogiston was real.<\/p>\n<p>So who discovered oxygen? Scheele made it first. Priestley made it and told the world first. Lavoisier was the first to understand it as we do today. Three people, three different pieces.<\/p>\n<h2><span>Why do science books tidy things up?<\/span><\/h2>\n<p>Science books teach today's ideas fast, with no room for every wrong turn. So they line up the past like a staircase, each scientist adding one more step.<\/p>\n<p>A historian of science named Thomas Kuhn thought that staircase picture was a big problem. In 1962, he published <em>The Structure of Scientific Revolutions<\/em>. Its big idea: science doesn't just pile up facts, one on top of another. Every so often, scientists change the whole set of rules they use to see the world. Kuhn called those changes <em>revolutions<\/em>. Oxygen replacing phlogiston was one of them.<\/p>\n<p>And here's the sneaky part. After a revolution, the new books make the revolution almost invisible. Priestley becomes \"the man who discovered oxygen,\" as if he agreed with us all along.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>In 1767, Joseph Priestley lived next to a brewery, used the gas bubbling up from the beer vats, and worked out how to make fizzy water.<\/p><\/aside>\n<h2><span>Words for your notebook<\/span><\/h2>\n<ul>\n<li><strong>Phlogiston:<\/strong> an invisible stuff that chemists once believed burning things gave off. It turned out not to exist.<\/li>\n<li><strong>Revolution (in science):<\/strong> a big change in the rules scientists use to see the world.<\/li>\n<li><strong>Textbook history:<\/strong> the tidy, staircase version of the past that science books often tell.<\/li>\n<\/ul>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>In 1620, an English thinker named Francis Bacon said science should gather careful observations and build them up into laws, so knowledge grows like a pile of facts. Kuhn's picture is different: sometimes the pile gets knocked over and rebuilt. Think of LEGO bricks: keep adding forever, or sometimes knock it down and build it a new way? Which fits the oxygen story better?<\/p><\/aside>\n<h2><span>Your Anomaly Log starts now<\/span><\/h2>\n<p>An anomaly (uh-NOM-uh-lee) is something that doesn't fit, like a puzzle piece from the wrong box. Kuhn noticed that big changes in science start with anomalies. In this course, you'll hunt for them in the course itself. Keep an <strong>Anomaly Log<\/strong> in the box at the bottom of each reading page (or on paper). After each module, write down anything that seemed too tidy, left out, or didn't fit.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This module told you a story in a neat order, with dates in bold. Is that a little like a textbook? Keep watching.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 1: The Textbook Lie<\/h1>\n<p class=\"lede\">In early 1775 an English minister inhaled a gas no one had named, to see what it would do. He reported that his breathing felt light and easy for some time afterward, and wondered whether it might become a luxury. He had a sample of oxygen. He was sure it was something else.<\/p>\n<h2><span>A sentence that fits on a flash card<\/span><\/h2>\n<p>\"Joseph Priestley discovered oxygen in 1774.\"<\/p>\n<p>It's tidy and easy to remember. It's also, in an important way, false: not because the date is wrong, but because it assumes a discovery is a single moment that belongs to a single person.<\/p>\n<h2><span>Three chemists, one gas, no agreement<\/span><\/h2>\n<div class=\"timeline\">\n<p class=\"entry\"><strong>Scheele, around 1771–72.<\/strong> In Sweden, the pharmacist-chemist Carl Wilhelm Scheele produced a gas by heating several compounds, including saltpeter and mercuric oxide. Flames burned fiercely in it, so he called it \"fire air.\" He wrote it up and sent the manuscript to the printer in 1775, but the book didn't appear until 1777. By then, others had announced the same gas.<\/p>\n<p class=\"entry\"><strong>Priestley, August 1774.<\/strong> In England, Joseph Priestley, a minister who did chemistry with homemade equipment, focused sunlight through a large lens onto a red powder (mercuric oxide) and collected the gas it released. A candle flared brilliantly in it. At first he suspected it was a gas he already knew.<\/p>\n<p class=\"entry\"><strong>Paris, October 1774.<\/strong> Traveling on the Continent, Priestley met Antoine Lavoisier, a wealthy French chemist known for obsessively careful weighing, and described his experiments.<\/p>\n<p class=\"entry\"><strong>Priestley, early 1775.<\/strong> Back in England, Priestley found that a mouse sealed in a jar of the gas stayed active far longer than one in ordinary air. Then he tried breathing it himself.<\/p>\n<p class=\"note\">What did Priestley think he had? Not a new element. The leading chemical theory of the day said that burning releases a substance called <em>phlogiston<\/em>. Air could absorb only so much phlogiston before a flame went out. Priestley reasoned that his gas must be air with its phlogiston removed, which is why it supported burning so well. He named it \"dephlogisticated air.\" Inside his theory, that was a perfectly sensible conclusion.<\/p>\n<p class=\"entry\"><strong>Lavoisier, from 1774.<\/strong> Lavoisier repeated Priestley's work. Over the next few years he built a radically different explanation: phlogiston doesn't exist. The gas is a distinct element, one part of ordinary air. Burning and rusting are cases of substances <em>combining<\/em> with it, which is why metals get heavier when they rust instead of lighter. He named the element <em>oxygène<\/em>, meaning \"acid-former,\" because he believed it was what made acids acidic. (It isn't; hydrochloric acid contains no oxygen at all.)<\/p>\n<p class=\"entry\"><strong>The holdout.<\/strong> Priestley never accepted Lavoisier's chemistry. He defended phlogiston until his death in 1804.<\/p>\n<\/div>\n<p>So \"who discovered oxygen?\" has no clean answer. Scheele made it first. Priestley made it and published first. Lavoisier was the first to understand it roughly as we do, and he still attached a wrong idea to its name. Discovery here is not a moment. It's a process stretched over years, with an argument at its center.<\/p>\n<h2><span>Kuhn's Aristotle moment<\/span><\/h2>\n<p>Thomas S. Kuhn (1922–1996) was a young Harvard physicist in 1947, helping prepare a science course built around historical case studies. Reading Aristotle on motion, he at first found him almost incompetent at observing the world. Then it clicked: Aristotle was asking different questions, and his \"motion\" covered every kind of change, from falling to growing. Read on its own terms, his physics made sense. The problem was reading him through modern assumptions.<\/p>\n<p>Fifteen years later Kuhn published <em>The Structure of Scientific Revolutions<\/em> (1962). Its central claim: science doesn't develop only by steady accumulation. Long stretches of steady work are punctuated by revolutions, in which a scientific community replaces the framework it uses to define problems, read evidence, and decide what counts as a good answer. The oxygen story is one of Kuhn's favorite examples of such a revolution.<\/p>\n<h2><span>Why the textbooks hide it<\/span><\/h2>\n<p>Here is the point of this module's title. Kuhn argued that science textbooks make revolutions hard to see. Nobody plans this; it comes from their job, which is to train new scientists in the current framework as efficiently as possible. So they:<\/p>\n<ul>\n<li>present the past as a straight line leading to today's view;<\/li>\n<li>recast earlier scientists as working on today's problems (Priestley becomes \"the discoverer of oxygen,\" though he would have rejected the description);<\/li>\n<li>drop the losing theories, or mention them only as mistakes.<\/li>\n<\/ul>\n<p>The result is a history that looks cumulative even when it wasn't. Each generation learns from books rewritten after the latest revolution, so the revolutions keep vanishing from view. Historians call this kind of storytelling <strong>Whig history<\/strong>: the past told as an inevitable march toward the present.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>If science only piled up, today's theories would be permanent. If Kuhn is right, some may someday be reread the way we now read phlogiston. And the one-genius story is still everywhere, even though the 2019 picture of a black hole took eight telescopes and more than 200 researchers.<\/p><\/aside>\n<p><strong>A complication:<\/strong> Even the neat three-man version leaves people out. Lavoisier's wife, Marie-Anne Paulze Lavoisier, translated English chemistry papers for him, including Kirwan's essay defending phlogiston, drew illustrations for his 1789 textbook and helped keep his lab records. Credit stories shrink a crowd to a few names, which is part of how a revolution comes to look like the work of one genius.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Priestley also found a practical way to make carbonated water. Living beside a brewery in Leeds from 1767, he used the \"fixed air\" (carbon dioxide) rising from the fermenting vats, and in 1772 published directions for putting it into water.<\/p><\/aside>\n<section class=\"glossary\"><h2><span>Terms<\/span><\/h2><ul>\n<li><strong>Phlogiston:<\/strong> a substance that eighteenth-century chemists believed was released in burning. Lavoisier's oxygen theory replaced it.<\/li>\n<li><strong>Scientific revolution (Kuhn's sense):<\/strong> a change in the framework a scientific community uses to define problems and judge solutions.<\/li>\n<li><strong>Whig history:<\/strong> telling the past as a straight road to the present, judging earlier thinkers only by how close they came to today's answers.<\/li>\n<\/ul><\/section>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Francis Bacon (1561–1626), in <em>Novum Organum<\/em> (1620), argued that science advances by gathering careful observations and building up general laws step by step. In his picture, knowledge grows like a pile, more complete and secure over time, and a good method protects us from error. For Kuhn, even the best methods work inside a framework, and frameworks get replaced. Priestley and Lavoisier had the same gas and the same careful methods, yet reached different conclusions. Which picture fits the oxygen story better: Bacon's growing pile of facts, or Kuhn's pile that gets knocked over and rebuilt?<\/p><\/aside>\n<h2><span>The Anomaly Log<\/span><\/h2>\n<p>An <strong>anomaly<\/strong> is a result that doesn't fit the framework you're using. Kuhn argued that revolutions begin when anomalies pile up and refuse to go away.<\/p>\n<p>In this course you'll hunt for anomalies in the course itself. Keep an <strong>Anomaly Log<\/strong> in the box at the bottom of each reading page, or on paper, and add anything that seems too tidy, one-sided, left out, or out of place. The last modules will use it.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This reading criticizes tidy, ordered histories, then presents its own history as a tidy ordered list with bold dates. Notice that. You'll come back to it.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';

    box.innerHTML = '<h3>Add to your log</h3>' +
      '<p>Jot what seemed too tidy, one-sided or left out in this module. ' + (store ? 'It stays on this device.' : 'This page can\'t save here, so copy it before you leave.') + '</p>' +
      '<label for="lg" class="sr">Anomaly Log entry for module 1</label><textarea id="lg" placeholder="Anomaly: ..."></textarea>' +
      '<button type="button" id="cp">Copy for Rocky</button><span class="status" id="st" role="status"></span>' +
      (document.querySelector('#body .anomaly') ? '<div class="revealrow"><button type="button" id="rv" class="reveal">Now show me what the course planted</button><span class="status" id="rs" role="status"></span></div>' : '') +
      '<details id="past"><summary>Your log so far</summary><ol id="pl"></ol></details>';
    var planted = document.querySelector('#body .anomaly');
    var anchor = planted || document.querySelector('#body .stamp');
    if (planted) { planted.classList.add('locked'); anchor.parentNode.insertBefore(box, anchor); }
    else anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var ta = box.querySelector('#lg'), st = box.querySelector('#st');
    if (store) { ta.value = store.getItem(KEY + N) || ''; }
    ta.addEventListener('input', function(){ if (store) { try { store.setItem(KEY + N, ta.value); st.textContent = 'Saved'; } catch(e) {} } });
    function list(){
      var pl = box.querySelector('#pl'), n = 0; pl.innerHTML = '';
      for (var i = 1; i <= 12; i++) { var k = (i < 10 ? '0' : '') + i, v = store ? store.getItem(KEY + k) : '';
        if (v && v.trim()) { var li = document.createElement('li'); li.innerHTML = '<b>Module ' + i + ':</b> '; li.appendChild(document.createTextNode(v)); pl.appendChild(li); n++; } }
      box.querySelector('#past').style.display = n ? '' : 'none';
    }
    list(); ta.addEventListener('change', list);
    var rv = box.querySelector('#rv');
    if (rv) rv.addEventListener('click', function(){
      var rs = box.querySelector('#rs');
      if (!ta.value.trim() && !rv.dataset.once) { rv.dataset.once = '1'; rs.textContent = 'Write your own guess first, even a rough one. Then tap again.'; return; }
      planted.classList.remove('locked'); planted.classList.add('in'); rv.style.display = 'none'; rs.textContent = '';
      planted.scrollIntoView({behavior:'smooth', block:'center'});
    });
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 1: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch(e) { st.textContent = 'Select your note and copy it.'; } t.remove(); }
      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // "Reveal:" answers stay hidden until the learner taps
  document.querySelectorAll('#body .answercard').forEach(function(card){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'reveal'; b.textContent = 'I picked one. Show the answer';
    var wrap = document.createElement('div'); wrap.className = 'revealrow'; wrap.appendChild(b);
    card.parentNode.insertBefore(wrap, card);
    b.addEventListener('click', function(){ card.classList.remove('locked'); card.classList.add('in'); wrap.style.display = 'none'; });
  });
  // Module 11: tick the planted anomalies you caught
  (function(){
    if ('01' !== '11') return;
    var ols = document.querySelectorAll('#body ol'), ol = null;
    ols.forEach(function(o){ if (o.children.length === 10) ol = o; });
    if (!ol) return;
    ol.classList.add('tick');
    var score = document.createElement('p'); score.className = 'score'; score.setAttribute('role', 'status');
    ol.parentNode.insertBefore(score, ol);
    function upd(){ score.textContent = 'You caught ' + ol.querySelectorAll('input:checked').length + ' of 10'; }
    Array.prototype.forEach.call(ol.children, function(li, i){
      var lab = document.createElement('label'), cb = document.createElement('input'), sp = document.createElement('span');
      cb.type = 'checkbox'; cb.setAttribute('aria-label', 'I caught number ' + (i + 1)); sp.innerHTML = li.innerHTML;
      lab.appendChild(cb); lab.appendChild(sp); li.innerHTML = ''; li.appendChild(lab); cb.addEventListener('change', upd);
    });
    upd();
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion (Core only; Extended keeps the self-inking sketch and the margin line): paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var calm = level === 'extended';
  if (!reduce && !calm && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .answercard, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
</body>
