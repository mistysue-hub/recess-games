<script>
  var LEVELS = {"core": "<h1>Module 5: The Puzzle That Won't Solve<\/h1>\n<p class=\"lede\">In December 1612, Galileo pointed his telescope near Jupiter and drew a faint dot in his notebook. He thought it was a star. It was actually the planet Neptune. Nobody would find Neptune on purpose for another 234 years, and it took a planet that wouldn't behave to do it.<\/p>\n<h2><span>A planet off course<\/span><\/h2>\n<p>In 1781, the astronomer William Herschel discovered a new planet, Uranus. Astronomers used Newton's laws to work out exactly where it should be, year after year. But Uranus wouldn't cooperate. By the 1840s it was clearly drifting away from where the math said it should be.<\/p>\n<p>That's an <strong>anomaly<\/strong>: a result that doesn't fit what your paradigm expects. Astronomers had two choices:<\/p>\n<ol>\n<li>Newton's laws are wrong.<\/li>\n<li>Newton's laws are fine, and something we can't see is pulling on Uranus.<\/li>\n<\/ol>\n<h2><span>The rescue<\/span><\/h2>\n<p>Two mathematicians, Urbain Le Verrier in France and John Couch Adams in England, chose option 2. Each worked out where an unseen planet would have to be to pull Uranus off course. Le Verrier sent his prediction to the Berlin Observatory.<\/p>\n<p>On the night of September 23, 1846, the astronomer Johann Galle pointed his telescope where Le Verrier said to look. In less than an hour he found a planet that wasn't on any star map, less than one degree from the predicted spot. It was Neptune.<\/p>\n<p>The anomaly became one of Newton's greatest victories.<\/p>\n<h2><span>The same trick, again<\/span><\/h2>\n<p>Then Le Verrier noticed another problem. Mercury, the planet closest to the Sun, doesn't trace exactly the same oval every time. Its whole orbit slowly turns. Newton's laws explained most of that turning, but not all. A tiny bit was left over (today we know it's 43 arcseconds every hundred years). (An arcsecond is a very small piece of a degree.)<\/p>\n<p>Le Verrier tried the trick that had worked so well. In 1859 he suggested an unseen planet even closer to the Sun. It was named Vulcan. That same year, an amateur astronomer said he'd seen it crossing the Sun. For decades, astronomers searched. Vulcan was never found.<\/p>\n<p>In 1915, Albert Einstein published a new theory of gravity called general relativity. It explained Mercury's leftover 43 arcseconds exactly, with no extra planet at all. Mercury's anomaly hadn't been a missing planet. It was a crack in Newton's laws.<\/p>\n<h2><span>Why scientists don't give up right away<\/span><\/h2>\n<p>Kuhn's point: an anomaly almost never makes scientists drop their paradigm right away. First they try to fix it, and often they should. The Neptune rescue worked brilliantly. The Vulcan rescue failed. At the start, nobody could tell which kind of anomaly they were looking at.<\/p>\n<p>Only some anomalies refuse every fix. Those are the ones that can push a science into crisis, which is what Module 6 is about.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>When Galileo saw Neptune in 1612, it had just started its own backward loop and was barely moving. That may be why he thought it was a star. The planet's own odd motion helped it hide.<\/p><\/aside>\n<h2><span>Words for your notebook<\/span><\/h2>\n<ul>\n<li><strong>Anomaly:<\/strong> a result that doesn't fit what the paradigm expects.<\/li>\n<li><strong>Rescue:<\/strong> explaining an anomaly by adding something new (like an unseen planet) while keeping the paradigm.<\/li>\n<li><strong>General relativity:<\/strong> Einstein's 1915 theory of gravity, which replaced Newton's for some problems.<\/li>\n<\/ul>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Two philosophers, Pierre Duhem and W. V. O. Quine, pointed out that you can never test just one idea by itself. Every prediction also depends on other things you assumed, like how many planets there are or whether your telescope works. So when a prediction fails, you can always blame one of those other things and save your main theory. Say you've looked for your lost shoe in three places. When do you stop looking and decide someone moved it? When should scientists stop saving a theory?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Which part of the Neptune story sounded too easy? What might have gone wrong that the reading left out? Write it in your log, or just tell Rocky.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>This module made the Neptune story sound simple. People still argue about how much credit Adams deserves compared with Le Verrier.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 5: The Puzzle That Won't Solve<\/h1>\n<p class=\"lede\">On December 28, 1612, and again on January 27, 1613, Galileo plotted a faint object near Jupiter in his notebook. It was Neptune. He took it for a fixed star; it was barely moving at the time. Neptune would wait 234 years to be found on purpose, and the search began with a planet that refused to follow the rules.<\/p>\n<h2><span>Uranus misbehaves<\/span><\/h2>\n<p>William Herschel discovered Uranus on March 13, 1781, the first planet found since antiquity. Astronomers soon computed its orbit from Newton's laws, and in 1821 Alexis Bouvard published detailed tables of its expected positions. Within a couple of decades, Uranus had drifted measurably off those tables.<\/p>\n<p>Faced with an anomaly like this, a scientist can question the paradigm, or question something else. Questioning Newton, whose mechanics had already predicted Halley's comet, seemed far less reasonable than supposing something unseen was at work.<\/p>\n<h2><span>Rescue, version one: Neptune<\/span><\/h2>\n<p>In 1845–46 Urbain Le Verrier in Paris and John Couch Adams in Cambridge independently calculated the position of an undiscovered planet whose gravity could account for Uranus's wandering. Le Verrier published his result and sent it to the Berlin Observatory. On the night of September 23–24, 1846, Johann Galle, assisted by Heinrich d'Arrest, found the planet within an hour of starting the search, less than a degree from Le Verrier's predicted position.<\/p>\n<p>Neptune turned an anomaly into a triumph. It became the textbook example of a scientific prediction. (How much credit Adams deserves is still debated; his work was mostly unpublished at the time.)<\/p>\n<h2><span>Rescue, version two: Vulcan<\/span><\/h2>\n<p>Mercury's orbit is an ellipse whose closest point to the Sun, its perihelion, slowly rotates. Newtonian gravity, counting the pulls of the other planets, accounts for nearly all of that rotation. Le Verrier found a stubborn remainder, later fixed at about 43 arcseconds per century. (One arcsecond is 1/3,600 of a degree.)<\/p>\n<p>In 1859 Le Verrier proposed the same cure that had worked for Uranus: unseen matter inside Mercury's orbit. That year, an amateur astronomer, Edmond Lescarbault, reported seeing a small body cross the Sun, and in January 1860 Le Verrier announced the planet, named Vulcan. Sightings came and went for decades. None held up.<\/p>\n<p>In 1915 Einstein's general theory of relativity predicted Mercury's extra 43 arcseconds with no new planet at all. The anomaly had been pointing at a limit of Newton's theory itself.<\/p>\n<h2><span>What the two stories teach together<\/span><\/h2>\n<p>The two rescues used exactly the same reasoning. One succeeded spectacularly and one failed completely. That is Kuhn's central point about anomalies. Scientists do not, and should not, abandon a successful paradigm at the first mismatch; the mismatch is usually a puzzle for normal science, and often it gets solved. But there is no rule that tells you in advance which anomalies will yield to a fix and which ones mark the edge of the paradigm. Mercury's anomaly was known for more than half a century before a new theory replaced Newton's.<\/p>\n<p>Rescues of this kind keep happening. In 1930 Wolfgang Pauli proposed an undetectable particle to explain why energy seemed to go missing in a type of radioactive decay, rather than give up conservation of energy. The neutrino was finally detected in 1956. In 2011 the OPERA experiment reported neutrinos apparently arriving faster than light; in 2012 the cause turned out to be a fiber-optic cable that wasn't fully plugged in. Sometimes the fix is a new particle. Sometimes it's the equipment. Sometimes, as with Mercury, it's the theory.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>Astronomers face their own \"Neptune or Vulcan?\" choice today. Galaxies spin as if they hold far more mass than we can see. Most physicists blame unseen \"dark matter,\" a Neptune-style rescue; a minority think gravity itself needs changing, as it did for Mercury. The question is still open.<\/p><\/aside>\n<p><strong>A complication:<\/strong> Mercury's drift was not only a choice between Vulcan and a new theory. In 1894 the astronomer Asaph Hall suggested adjusting Newton's inverse-square law by a tiny amount instead. Each rescue attempt cost something different, which is why \"save the theory\" is not one move but a menu.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>When Galileo first recorded Neptune, the planet had just begun its retrograde loop and was nearly stationary, too slow to stand out in his small telescope. One physicist argued in 2009 that he may have noticed it shift, though others doubt it. If so, he saw an anomaly and filed it as noise.<\/p><\/aside>\n<section class=\"glossary\"><h2><span>Terms<\/span><\/h2><ul>\n<li><strong>Anomaly:<\/strong> an observation that violates the expectations of the current paradigm.<\/li>\n<li><strong>Auxiliary hypothesis:<\/strong> an extra assumption used alongside a theory to make a prediction (for example, \"there is no planet beyond Uranus\").<\/li>\n<li><strong>Perihelion precession:<\/strong> the slow rotation of a planet's orbit, measured at its point closest to the Sun.<\/li>\n<\/ul><\/section>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Pierre Duhem (<em>The Aim and Structure of Physical Theory<\/em>, 1906) and W. V. O. Quine (\"Two Dogmas of Empiricism,\" 1951) argued that hypotheses are never tested in isolation. A prediction always depends on a bundle of assumptions: the theory, the number of planets, how the instruments work, and more. When the prediction fails, logic alone doesn't say which assumption to blame. This <strong>Duhem–Quine thesis<\/strong> is why the Neptune rescue was legitimate, and also why a determined defender can save almost any theory. It is a problem for Popper's falsification from Module 3: if one failed prediction never forces you to drop a particular theory, what does? Imagine you're an astronomer in 1880. Mercury's orbit is still off, and after twenty years of searching nobody has found Vulcan. How much longer do you keep searching before you suspect Newton?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>Two of the last three modules have been about astronomy, and most of the rest about physics and chemistry. Astronomy's predictions are unusually clean. Would these lessons look the same in biology or medicine?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};

      var rs = box.querySelector('#rs');
      if (!ta.value.trim() && !rv.dataset.once) { rv.dataset.once = '1'; rs.textContent = 'Write your own guess first, even a rough one. Then tap again.'; return; }
      planted.classList.remove('locked'); planted.classList.add('in'); rv.style.display = 'none'; rs.textContent = '';
      planted.scrollIntoView({behavior:'smooth', block:'center'});
    });
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 5: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch(e) { st.textContent = 'Select your note and copy it.'; } t.remove(); }
      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // "Reveal:" answers stay hidden until the learner taps
  document.querySelectorAll('#body .answercard').forEach(function(card){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'reveal'; b.textContent = 'I picked one. Show the answer';
    var wrap = document.createElement('div'); wrap.className = 'revealrow'; wrap.appendChild(b);
    card.parentNode.insertBefore(wrap, card);
    b.addEventListener('click', function(){ card.classList.remove('locked'); card.classList.add('in'); wrap.style.display = 'none'; });
  });
  // Module 11: tick the planted anomalies you caught
  (function(){
    if ('05' !== '11') return;
    var ols = document.querySelectorAll('#body ol'), ol = null;
    ols.forEach(function(o){ if (o.children.length === 10) ol = o; });
    if (!ol) return;
    ol.classList.add('tick');
    var score = document.createElement('p'); score.className = 'score'; score.setAttribute('role', 'status');
    ol.parentNode.insertBefore(score, ol);
    function upd(){ score.textContent = 'You caught ' + ol.querySelectorAll('input:checked').length + ' of 10'; }
    Array.prototype.forEach.call(ol.children, function(li, i){
      var lab = document.createElement('label'), cb = document.createElement('input'), sp = document.createElement('span');
      cb.type = 'checkbox'; cb.setAttribute('aria-label', 'I caught number ' + (i + 1)); sp.innerHTML = li.innerHTML;
      lab.appendChild(cb); lab.appendChild(sp); li.innerHTML = ''; li.appendChild(lab); cb.addEventListener('change', upd);
    });
    upd();
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion (Core only; Extended keeps the self-inking sketch and the margin line): paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var calm = level === 'extended';
  if (!reduce && !calm && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .answercard, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
