<style>
  :root{--paper:#fbfbf4;--grid:#d3e2ef;--margin:#e7a3a3;--ink:#1f2a36;--soft:#56636f;--pencil:#2d5f8b;--red:#b3261e;

     background:linear-gradient(transparent 52%,var(--hi) 52%,var(--hi) 90%,transparent 90%)}

          box-shadow:0 1px 0 var(--line),3px 5px 0 rgba(31,42,54,.08);transform:rotate(-1.2deg)}

  .sketch svg{display:block;width:100%;height:auto}
  .sketch svg path,.sketch svg circle,.sketch svg ellipse,.sketch svg rect{fill:none;stroke-linecap:round;stroke-linejoin:round}

  .sketch .pencil{stroke:var(--pencil);stroke-width:2;opacity:.8} .sketch .thin{stroke-width:2}
  .sketch .dash{stroke-dasharray:6 7} .sketch .fill.red{fill:var(--red)} .sketch .fill.ink,.sketch .fill.small{fill:var(--ink)}

  .sketch figcaption{font-family:"Special Elite",ui-monospace,monospace;color:var(--pencil);font-size:15px;margin:4px 2px 2px}

  .logbox textarea:focus-visible,.logbox button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
  .logbox button{font:inherit;font-size:16px;padding:9px 14px;border-radius:6px;border:0;background:var(--red);color:#fff;cursor:pointer}
  .logbox .status{display:inline-block;margin-left:10px;font-size:15px;color:var(--pencil)}
  .logbox details{margin-top:12px} .logbox summary{cursor:pointer;font-size:16px;color:var(--pencil)}
  .logbox ol{margin:8px 0 0;padding-left:22px;font-size:16px} .logbox li{margin:6px 0}
  .logbox li b{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;color:var(--red)}

  .sticky{display:block;background:var(--sticky);padding:16px 18px;margin:28px 0;box-shadow:3px 4px 0 rgba(0,0,0,.12);transform:rotate(-.6deg);max-width:62ch}

  .burst i{position:absolute;left:0;top:0;display:block;border-radius:50%}
  .burst b{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;border:4px solid var(--red)}
  h2{position:relative}
</style>

<script>
  var LEVELS = {"core": "<h1>Module 11: This Course Is a Paradigm<\/h1>\n<p class=\"lede\">This reading caught a mistake in itself. While the course was being checked, a reviewer noticed that this module's own list of anomalies didn't match Module 5. It's fixed now. Keep that in mind as you read: a course about science changing its mind had to change its own mind, too.<\/p>\n<h2><span>Turn the tools around<\/span><\/h2>\n<p>For ten modules you've used Kuhn's tools on science: paradigms, exemplars, normal science, anomalies, revolutions. Now point them at something closer: this course.<\/p>\n<h2><span>How this course came to be<\/span><\/h2>\n<p>This course was designed in October 2026 for Recess by its author, with help from an AI assistant. Every reading was written new, because Kuhn's book is still under copyright. And every reading was checked against real sources before you saw it. The checks caught real mistakes.<\/p>\n<h2><span>Find the planted error<\/span><\/h2>\n<p>Here are three claims about mistakes the checks caught in this course's first drafts. Two are true. One was changed on purpose, and it's wrong. Which one? Tell Rocky your pick, then tap to check.<\/p>\n<ol>\n<li>An early draft said the first Leyden jars were coated in metal foil. The first ones were really partly filled with water.<\/li>\n<li>Module 6 kept its title \"Too Many Circles\" but added a question mark, because fact-checking showed the \"epicycles on epicycles\" story is a myth.<\/li>\n<li>The first draft of Module 1 said Priestley tested his gas on a mouse and named it \"dephlogisticated air\" in August 1774. Those things really happened in 1795.<\/li>\n<\/ol>\n<div class=\"answercard locked\"><p class=\"anomaly-title\">The answer<\/p><p>Claim 3 is the planted error. The mouse test and the name \"dephlogisticated air\" really came in early 1775, not 1795. Claims 1 and 2 are real catches. The true Module 1 story is the best one: Module 1 warns about tidy textbook stories, and its own first draft squished a messy timeline into one tidy moment.<\/p><\/div>\n<h2><span>The anomalies you may have logged<\/span><\/h2>\n<p>Each module planted an anomaly about the course itself. Tick the ones you caught in your own log:<\/p>\n<ol>\n<li>Module 1 told history in a neat order while warning against neat orders.<\/li>\n<li>Module 2 used one example to stand for all science before a paradigm.<\/li>\n<li>Module 3 told only a success story.<\/li>\n<li>Module 4 built a big idea on 28 college students.<\/li>\n<li>Module 5 made the Neptune story sound simple.<\/li>\n<li>Module 6's title repeated a myth.<\/li>\n<li>Module 7 was the first Earth science example.<\/li>\n<li>Module 8 treated one vote as final.<\/li>\n<li>Module 9 drew a five-step staircase.<\/li>\n<li>Module 10 made a crowded debate into a duel.<\/li>\n<\/ol>\n<p>Also left out: almost all science outside Europe and the United States, nearly all biology and medicine, and few women. The ones you met are the mathematician Nicole-Reine Lepaute, the geologist Marie Tharp and the philosopher Helen Longino.<\/p>\n<h2><span>So, is this course a paradigm?<\/span><\/h2>\n<p>It has <strong>exemplars<\/strong>, model examples you learned to see the rest through, like the comet and Neptune. It has a <strong>spine<\/strong> it rarely questioned: Kuhn's story of how science works. And like a textbook, it chose a tidy order.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Every mistake listed in this module was found by checking against sources, not by noticing it was wrong. They all looked right. That's what makes a tidy mistake hard to catch.<\/p><\/aside>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>How would each thinker judge this course? Popper would ask which of its claims could be proven wrong. Longino would ask whether it really welcomed criticism. Kuhn might call it a fair textbook: useful, but hiding its own revolutions. Which judgment fits best?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Read your whole log. Which anomaly bothers you most? If you rewrote this course, what would you change first?<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>A course that admits its mistakes can seem more trustworthy. Is that a reason to trust it, or a clever way to win your trust?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 11: This Course Is a Paradigm<\/h1>\n<p class=\"lede\">This reading caught a mistake in itself. While the course was being checked, a reviewer noticed that this module's own list of anomalies misdescribed Module 5. It's fixed now. A module about the course's own blind spots had a blind spot of its own, which is roughly what Kuhn would have predicted.<\/p>\n<h2><span>The textbook problem, from the inside<\/span><\/h2>\n<p>Module 1 introduced Kuhn's claim that textbooks are where a paradigm lives. They teach through <strong>exemplars<\/strong>, present the past as a straight road to the present, and quietly drop the losing side. This course is a kind of textbook. So apply the tools.<\/p>\n<h2><span>How this course came to be<\/span><\/h2>\n<p>This course was designed in October 2026 for the Recess learning platform by its author, with help from an AI assistant. Every reading was written in new words, because <em>The Structure of Scientific Revolutions<\/em> remains under copyright, and every reading was checked against sources before any learner saw it. Two choices shaped it most. Kuhn was chosen as the spine, with other philosophers as side views, a framing decision: Popper, Lakatos and Longino appear as commentators on Kuhn's story rather than as authors of their own. And the examples lean on physics, chemistry and astronomy, as Kuhn's did. Geology entered in Module 7 partly to answer that imbalance.<\/p>\n<h2><span>Find the planted error<\/span><\/h2>\n<p>Fact-checking caught real errors in this course's first drafts. Here are three claims about those catches. Two are true. One was changed on purpose and is wrong. Which one? Tell Rocky your pick and your reason, then check.<\/p>\n<ol>\n<li>An early Module 2 draft described the first Leyden jars as foil-coated. The first ones were partly filled with water; foil came in 1747.<\/li>\n<li>Module 6 was planned under the title \"Too Many Circles,\" drawing on the \"epicycles on epicycles\" story. Fact-checking found that story to be a modern myth, so the module kept the title with a question mark.<\/li>\n<li>The first draft of Module 1 placed Priestley's mouse test, his breathing the gas and his naming of \"dephlogisticated air\" in August 1774. Sources showed they came in 1795, after his October 1774 visit to Lavoisier.<\/li>\n<\/ol>\n<div class=\"answercard locked\"><p class=\"anomaly-title\">The answer<\/p><p>Claim 3 is the planted error. The sources put those events in early 1775, not 1795. Claims 1 and 2 are real. The true version of claim 3 is the irony: a module about textbooks compressing messy history compressed messy history. The fact-checker also flagged traps the course avoided: claiming Copernicus was more accurate or used fewer circles overall (he needed fewer only to explain the backward loops, as Kuhn himself noted), claiming Thomson named the \"plum pudding,\" and claiming Pluto was demoted for being too small. Kuhn would recognize the pattern: errors that fit the expected story are the hardest to see, just like the trick cards in Module 4.<\/p><\/div>\n<h2><span>The planted anomalies<\/span><\/h2>\n<p>Each module ended by pointing at a weakness in the course. Tick the ones you caught in your own log:<\/p>\n<ol>\n<li>Tidy chronology (Module 1).<\/li>\n<li>One example standing for all pre-paradigm science, and only physics and chemistry so far (Module 2).<\/li>\n<li>Only success stories (Module 3).<\/li>\n<li>A 28-person study carrying a large idea (Module 4).<\/li>\n<li>Astronomy dominance (Module 5).<\/li>\n<li>A myth in a title (Module 6).<\/li>\n<li>Late arrival of Earth science (Module 7).<\/li>\n<li>A contested vote treated as final (Module 8).<\/li>\n<li>A five-step staircase (Module 9).<\/li>\n<li>A crowded debate told as a duel (Module 10).<\/li>\n<\/ol>\n<p>Beyond those: biology and medicine are almost absent; science outside Europe and the United States appears only briefly, in Module 6; and the few women you met are the mathematician Nicole-Reine Lepaute, the geologist Marie Tharp and the philosopher Helen Longino.<\/p>\n<h2><span>Is it a paradigm?<\/span><\/h2>\n<p>In Kuhn's broad sense, the course has a <strong>disciplinary matrix<\/strong>: a shared vocabulary (paradigm, anomaly, crisis), a set of exemplars (Halley's comet, Neptune, oxygen, the trick cards), and standards for a good answer. Notice how it trained you: by Module 9 you were probably spotting staircases and anomalies automatically. That is the power of a paradigm and its blind spot.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>Textbooks, news sites and AI chatbots all frame what they tell you, and this course was built with help from an AI assistant. The questions you've been asking here work on any of them.<\/p><\/aside>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>None of the errors listed here was caught because it looked wrong. Each read smoothly and fit the story. They were caught only because someone checked them against sources, which is close to Popper's point about criticism, and Longino's.<\/p><\/aside>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Apply each thinker to this course. <strong>Popper<\/strong> asks: which claims here could be refuted, and did the course try to refute them? <strong>Lakatos<\/strong> asks: when the course corrected itself, did the corrections lead anywhere new, or only patch? <strong>Longino<\/strong> asks: were there real venues for criticism, and was criticism taken up? The Anomaly Log is one such venue. <strong>Feyerabend<\/strong> might ask what a course with no spine at all would look like. <strong>Kuhn<\/strong> might say: a good textbook, and therefore a hider of its own revolutions. Whose test does the course pass, and whose does it fail?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Read your whole log. Which anomaly matters most? What would the next edition of this course change first?<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>Admitting mistakes makes a source look trustworthy. A course that confesses its errors may be more honest, or may be using honesty to earn trust. How would you tell the difference?<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var sketch = '<figure class="sketch"><svg viewBox="0 0 320 170" role="img" aria-label="Sketch: this course, under the magnifying glass"><rect class="pencil" x="70" y="22" width="130" height="130" rx="4"/><path class="pencil" d="M86 50 h96 M86 68 h96 M86 86 h70 M86 104 h90 M86 122 h60"/><circle class="ink" cx="196" cy="94" r="38"/><path class="ink" d="M224 122 l46 40"/><path class="red" d="M178 86 h36"/></svg><figcaption>Fig. 11: this course, under the magnifying glass</figcaption></figure>';
  var body = LEVELS[level].replace(/(<\/h1>)/, '$1' + sketch);
  document.getElementById('body').innerHTML =
    '<p class="tag">Lab notebook, module 11, ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' + body +
    '<p class="stamp">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 11: This Course Is a Paradigm (' + (level === 'core' ? 'Core' : 'Extended') + ')';
  // Anomaly Log box: saved only in this browser, with a Copy button for Rocky
  (function(){
    var N = '11', KEY = 'paradigm-shift:anomaly-log:M';
    var store = null; try { localStorage.setItem('ps-test', '1'); localStorage.removeItem('ps-test'); store = localStorage; } catch(e) {}
    var box = document.createElement('section'); box.className = 'logbox';
    box.innerHTML = '<h3>Add to your log</h3>' +
      '<p>Jot what seemed too tidy, one-sided or left out in this module. ' + (store ? 'It stays on this device.' : 'This page can\'t save here, so copy it before you leave.') + '</p>' +
      '<label for="lg" class="sr">Anomaly Log entry for module 11</label><textarea id="lg" placeholder="Anomaly: ..."></textarea>' +
      '<button type="button" id="cp">Copy for Rocky</button><span class="status" id="st" role="status"></span>' +
      (document.querySelector('#body .anomaly') ? '<div class="revealrow"><button type="button" id="rv" class="reveal">Now show me what the course planted</button><span class="status" id="rs" role="status"></span></div>' : '') +
      '<details id="past"><summary>Your log so far</summary><ol id="pl"></ol></details>';
    var planted = document.querySelector('#body .anomaly');
    var anchor = planted || document.querySelector('#body .stamp');
    if (planted) { planted.classList.add('locked'); anchor.parentNode.insertBefore(box, anchor); }
    else anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var ta = box.querySelector('#lg'), st = box.querySelector('#st');
    if (store) { ta.value = store.getItem(KEY + N) || ''; }
    ta.addEventListener('input', function(){ if (store) { try { store.setItem(KEY + N, ta.value); st.textContent = 'Saved'; } catch(e) {} } });
    function list(){
      var pl = box.querySelector('#pl'), n = 0; pl.innerHTML = '';
      for (var i = 1; i <= 12; i++) { var k = (i < 10 ? '0' : '') + i, v = store ? store.getItem(KEY + k) : '';
        if (v && v.trim()) { var li = document.createElement('li'); li.innerHTML = '<b>Module ' + i + ':</b> '; li.appendChild(document.createTextNode(v)); pl.appendChild(li); n++; } }
      box.querySelector('#past').style.display = n ? '' : 'none';
    }
    list(); ta.addEventListener('change', list);
    var rv = box.querySelector('#rv');
    if (rv) rv.addEventListener('click', function(){
      var rs = box.querySelector('#rs');
      if (!ta.value.trim() && !rv.dataset.once) { rv.dataset.once = '1'; rs.textContent = 'Write your own guess first, even a rough one. Then tap again.'; return; }
      planted.classList.remove('locked'); planted.classList.add('in'); rv.style.display = 'none'; rs.textContent = '';
      planted.scrollIntoView({behavior:'smooth', block:'center'});
    });
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 11: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch(e) { st.textContent = 'Select your note and copy it.'; } t.remove(); }
      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // "Reveal:" answers stay hidden until the learner taps
  document.querySelectorAll('#body .answercard').forEach(function(card){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'reveal'; b.textContent = 'I picked one. Show the answer';
    var wrap = document.createElement('div'); wrap.className = 'revealrow'; wrap.appendChild(b);
    card.parentNode.insertBefore(wrap, card);
    b.addEventListener('click', function(){ card.classList.remove('locked'); card.classList.add('in'); wrap.style.display = 'none'; });
  });
  // Module 11: tick the planted anomalies you caught
  (function(){
    if ('11' !== '11') return;
    var ols = document.querySelectorAll('#body ol'), ol = null;
    ols.forEach(function(o){ if (o.children.length === 10) ol = o; });
    if (!ol) return;
    ol.classList.add('tick');
    var score = document.createElement('p'); score.className = 'score'; score.setAttribute('role', 'status');
    ol.parentNode.insertBefore(score, ol);
    function upd(){ score.textContent = 'You caught ' + ol.querySelectorAll('input:checked').length + ' of 10'; }
    Array.prototype.forEach.call(ol.children, function(li, i){
      var lab = document.createElement('label'), cb = document.createElement('input'), sp = document.createElement('span');
      cb.type = 'checkbox'; cb.setAttribute('aria-label', 'I caught number ' + (i + 1)); sp.innerHTML = li.innerHTML;
      lab.appendChild(cb); lab.appendChild(sp); li.innerHTML = ''; li.appendChild(lab); cb.addEventListener('change', upd);
    });
    upd();
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion (Core only; Extended keeps the self-inking sketch and the margin line): paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var calm = level === 'extended';
  if (!reduce && !calm && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .answercard, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
