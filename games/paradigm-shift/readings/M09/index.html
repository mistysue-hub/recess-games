<script>
  var LEVELS = {"core": "<h1>Module 9: Progress Toward What?<\/h1>\n<p class=\"lede\">Imagine firing a giant artillery shell at a sheet of tissue paper and having it bounce back and hit you. That's how the scientist Ernest Rutherford later described one of the strangest results in the history of the atom.<\/p>\n<h2><span>Five pictures of one tiny thing<\/span><\/h2>\n<p>Nobody has ever looked at an atom the way you look at a marble. So scientists built <strong>models<\/strong>: pictures and rules that explain what experiments show. Over about 120 years, the model of the atom changed again and again.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>When<\/th>\n<th>The picture<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dalton<\/td>\n<td>early 1800s<\/td>\n<td>Atoms are tiny, solid balls that can't be split. They join in fixed, whole-number amounts.<\/td>\n<\/tr>\n<tr>\n<td>Thomson<\/td>\n<td>1904<\/td>\n<td>J.J. Thomson had found the electron in 1897. His atom is a ball of positive charge with tiny negative electrons scattered through it. People later nicknamed it the \"plum pudding\" model.<\/td>\n<\/tr>\n<tr>\n<td>Rutherford<\/td>\n<td>1911<\/td>\n<td>In an experiment in 1909, a few particles fired at thin gold foil bounced almost straight back. Ernest Rutherford said the atom must have a tiny, heavy center: the <strong>nucleus<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Bohr<\/td>\n<td>1913<\/td>\n<td>Niels Bohr put electrons on fixed levels, like rungs on a ladder. It explained exactly which colors of light hydrogen gives off.<\/td>\n<\/tr>\n<tr>\n<td>Schrödinger<\/td>\n<td>1926<\/td>\n<td>Erwin Schrödinger's math describes electrons as fuzzy clouds of where they're likely to be, not tiny balls on paths.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Each model explained something the one before couldn't. That sounds like a staircase climbing toward the truth.<\/p>\n<h2><span>Kuhn's surprising ending<\/span><\/h2>\n<p>Thomas Kuhn ended his famous book with a comparison to evolution. In evolution, living things don't change <em>toward<\/em> a goal. Giraffes didn't evolve \"toward\" the perfect giraffe. Living things change <em>away from<\/em> what worked less well where they lived.<\/p>\n<p>Kuhn thought science might be like that. Each new paradigm solves more puzzles than the old one, so there's real progress. But maybe it isn't progress <em>toward<\/em> one final, perfect truth. Maybe it's progress <em>away from<\/em> older problems.<\/p>\n<h2><span>Something lost<\/span><\/h2>\n<p>Here's another twist. New models don't only add. They sometimes lose things too.<\/p>\n<p>Bohr's model gives you a picture you can draw: electrons on tidy rings. Schrödinger's model is much more accurate, but it gives up that simple picture. Electrons don't have neat paths at all.<\/p>\n<p>That's why your science teacher may still draw the Bohr model. Chemists still use Dalton's idea of atoms joining in whole-number amounts every day. Old models don't vanish. Scientists keep the ones that are good enough for the job.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>Rutherford's gold-foil team fired particles at foil so thin you could almost see through it. Nearly all of them went straight through. Only a tiny few bounced back, and those few changed the picture of every atom.<\/p><\/aside>\n<h2><span>Words for your notebook<\/span><\/h2>\n<ul>\n<li><strong>Model:<\/strong> a simplified picture and set of rules that explains what experiments show.<\/li>\n<li><strong>Nucleus:<\/strong> the tiny, heavy center of an atom.<\/li>\n<li><strong>Progress:<\/strong> getting better. But better at what? That's the question.<\/li>\n<\/ul>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Karl Popper thought a new theory can be closer to the truth than the old one, even if neither is perfectly true. Each good replacement gets nearer. Kuhn wasn't sure science moves toward a final truth at all. Think of a map of your town that gets better every year, with more streets and fewer mistakes. Is that getting closer to the real town, or just a more useful map?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>The table made atoms look like a staircase of five steps. What might the table have left out? Write it in your log, or just tell Rocky.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>The table shows five neat steps. Lots of other scientists, other models and wrong turns were left out. That's a staircase, the very thing Module 1 warned about.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>", "extended": "<h1>Module 9: Progress Toward What?<\/h1>\n<p class=\"lede\">Ernest Rutherford later said that one result from his laboratory was about as believable as a heavy artillery shell bouncing back off tissue paper. That result reshaped the atom. It was one step in a century of models, and the question this module asks is what all those steps were heading toward.<\/p>\n<h2><span>A century of atoms<\/span><\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Date<\/th>\n<th>What it explained<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dalton<\/td>\n<td>1803–1808<\/td>\n<td>Elements combine in fixed whole-number ratios, because they are made of indivisible atoms of characteristic weight.<\/td>\n<\/tr>\n<tr>\n<td>Thomson<\/td>\n<td>1904<\/td>\n<td>Atoms contain electrons (discovered 1897), embedded in a diffuse positive charge. The \"plum pudding\" name probably came from popular writers, not Thomson.<\/td>\n<\/tr>\n<tr>\n<td>Rutherford<\/td>\n<td>1911<\/td>\n<td>The Geiger–Marsden experiments (key result 1909) showed a few alpha particles bouncing back from gold foil: positive charge and most of the mass sit in a tiny nucleus.<\/td>\n<\/tr>\n<tr>\n<td>Bohr<\/td>\n<td>1913<\/td>\n<td>Electrons occupy fixed energy levels; jumps between them produce hydrogen's exact spectral lines. It failed for atoms with more electrons.<\/td>\n<\/tr>\n<tr>\n<td>Schrödinger<\/td>\n<td>1926<\/td>\n<td>Wave mechanics replaces orbits with orbitals, probability distributions with no definite path.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Read as a staircase, this is the textbook picture of progress. Each step explains what the last could not. Rutherford's nucleus even created a new problem, since classical physics says an orbiting electron should radiate energy and spiral inward, and Bohr's fixed levels were partly an answer to it.<\/p>\n<h2><span>Evolution without a goal<\/span><\/h2>\n<p><em>Structure<\/em> ends with an analogy to Darwin. What made Darwin's theory hard to accept, Kuhn argued, was not evolution itself but evolution without a goal. Organisms don't evolve toward a predetermined perfect form; they evolve away from less successful ones. Kuhn suggested science works the same way. Later paradigms are better puzzle-solvers than earlier ones, so there is genuine progress. But we may not need, and may not be able to justify, the idea that science is closing in on a final, finished description of nature. Progress from, not progress toward.<\/p>\n<h2><span>Kuhn loss<\/span><\/h2>\n<p>If progress were simple accumulation, nothing would ever be lost. The philosopher Heinz Post coined the term <strong>Kuhn loss<\/strong> for problems or explanations that a new paradigm abandons. An example often given: René Descartes's vortex theory explained why all the planets orbit in the same direction and roughly the same plane, because they are carried by one swirling vortex. Newton's gravity, which replaced it, could account for the orbits once they existed but offered no reason for that shared direction; Newton attributed the system's arrangement to an intelligent designer. A question the old theory answered became, for a long time, a question the new one didn't try to answer.<\/p>\n<p>The atom has smaller losses of its own. Bohr's model gave an intuitive, drawable picture; quantum mechanics traded it for far better predictions. Teachers still draw Bohr atoms, and chemists still reason with Dalton's ratios, because a model can be wrong in detail and right for the job.<\/p>\n<aside class=\"now\"><p class=\"now-title\">Why it matters now<\/p><p>Your phone's GPS has to correct for Einstein's relativity to stay accurate, yet engineers still design bridges with Newton's laws. An old model that's good enough for the job doesn't disappear.<\/p><\/aside>\n<p><strong>A complication:<\/strong> The staircase hides a long fight over whether atoms were real at all. Into the early 1900s, respected chemists such as Wilhelm Ostwald held that science could do without atoms. Jean Perrin's measurements of jittering particles in liquid around 1908 helped change minds, and Ostwald conceded in 1909. Models of the atom were competing with a view that said there might be nothing to model.<\/p>\n<aside class=\"card\"><span class=\"tape\"><\/span><p class=\"card-title\">Weird but true<\/p><p>In the gold-foil experiments, almost every alpha particle passed through with little deflection. The rare large-angle bounces were what mattered. Most of the data agreed with the old model; the anomaly was in the few.<\/p><\/aside>\n<section class=\"glossary\"><h2><span>Terms<\/span><\/h2><ul>\n<li><strong>Model:<\/strong> a simplified representation used to explain and predict.<\/li>\n<li><strong>Kuhn loss:<\/strong> an explanation or problem-solving ability lost when one paradigm replaces another.<\/li>\n<li><strong>Verisimilitude:<\/strong> Popper's term for a theory's degree of closeness to the truth.<\/li>\n<\/ul><\/section>\n<aside class=\"sticky\"><p class=\"sticky-title\">Side View<\/p><p>Karl Popper held that even false theories can differ in <strong>verisimilitude<\/strong>, closeness to the truth, so a sequence of refuted theories can still approach truth. Larry Laudan, in <em>Progress and Its Problems<\/em> (1977), rejected truth as the measure. We can never tell how close we are to a truth we don't have, he argued. So progress should be judged by problem-solving: how many important problems a theory solves, minus the ones a change leaves unsolved. Laudan's view takes Kuhn loss seriously; Popper's has trouble with it. Bohr's atom is wrong in detail, yet teachers still draw it. Does a model that's wrong but useful count as progress?<\/p><\/aside>\n<h2><span>Your Anomaly Log<\/span><\/h2>\n<p>Look back over this module. Add anything that seemed too tidy, one-sided, left out, or out of place.<\/p>\n<div class=\"anomaly\"><p class=\"anomaly-title\">Anomaly<\/p><p>Five models in a neat table, each a step up. This is exactly the \"textbook staircase\" from Module 1, with dozens of scientists and abandoned models left out.<\/p><\/div>\n<hr />\n<p><em>This reading was written for this course. No text was copied from Kuhn's book or any other source.<\/em><\/p>"};
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var sketch = '<figure class="sketch"><svg viewBox="0 0 320 170" role="img" aria-label="Sketch: one of many drawings of the atom"><circle class="red fill" cx="160" cy="86" r="8"/><ellipse class="ink" cx="160" cy="86" rx="90" ry="26"/><ellipse class="ink" cx="160" cy="86" rx="90" ry="26" transform="rotate(60 160 86)"/><ellipse class="ink" cx="160" cy="86" rx="90" ry="26" transform="rotate(-60 160 86)"/><circle class="ink fill small" cx="250" cy="86" r="5"/><circle class="ink fill small" cx="115" cy="51" r="5"/><circle class="ink fill small" cx="206" cy="48" r="5"/></svg><figcaption>Fig. 9: one of many drawings of the atom</figcaption></figure>';
  var body = LEVELS[level].replace(/(<\/h1>)/, '$1' + sketch);
  document.getElementById('body').innerHTML =
    '<p class="tag">Lab notebook, module 9, ' + (level === 'core' ? 'Core' : 'Extended') + '</p>' + body +
    '<p class="stamp">Finished reading? Go back to Rocky and say <b>done</b>.</p>';
  document.title = 'Module 9: Progress Toward What? (' + (level === 'core' ? 'Core' : 'Extended') + ')';
  // Anomaly Log box: saved only in this browser, with a Copy button for Rocky
  (function(){
    var N = '09', KEY = 'paradigm-shift:anomaly-log:M';
    var store = null; try { localStorage.setItem('ps-test', '1'); localStorage.removeItem('ps-test'); store = localStorage; } catch(e) {}
    var box = document.createElement('section'); box.className = 'logbox';
    box.innerHTML = '<h3>Add to your log</h3>' +
      '<p>Jot what seemed too tidy, one-sided or left out in this module. ' + (store ? 'It stays on this device.' : 'This page can\'t save here, so copy it before you leave.') + '</p>' +
      '<label for="lg" class="sr">Anomaly Log entry for module 9</label><textarea id="lg" placeholder="Anomaly: ..."></textarea>' +
      '<button type="button" id="cp">Copy for Rocky</button><span class="status" id="st" role="status"></span>' +
      (document.querySelector('#body .anomaly') ? '<div class="revealrow"><button type="button" id="rv" class="reveal">Now show me what the course planted</button><span class="status" id="rs" role="status"></span></div>' : '') +
      '<details id="past"><summary>Your log so far</summary><ol id="pl"></ol></details>';
    var planted = document.querySelector('#body .anomaly');
    var anchor = planted || document.querySelector('#body .stamp');
    if (planted) { planted.classList.add('locked'); anchor.parentNode.insertBefore(box, anchor); }
    else anchor.parentNode.insertBefore(box, anchor.nextSibling);
    var ta = box.querySelector('#lg'), st = box.querySelector('#st');
    if (store) { ta.value = store.getItem(KEY + N) || ''; }
    ta.addEventListener('input', function(){ if (store) { try { store.setItem(KEY + N, ta.value); st.textContent = 'Saved'; } catch(e) {} } });
    function list(){
      var pl = box.querySelector('#pl'), n = 0; pl.innerHTML = '';
      for (var i = 1; i <= 12; i++) { var k = (i < 10 ? '0' : '') + i, v = store ? store.getItem(KEY + k) : '';
        if (v && v.trim()) { var li = document.createElement('li'); li.innerHTML = '<b>Module ' + i + ':</b> '; li.appendChild(document.createTextNode(v)); pl.appendChild(li); n++; } }
      box.querySelector('#past').style.display = n ? '' : 'none';
    }
    list(); ta.addEventListener('change', list);
    var rv = box.querySelector('#rv');
    if (rv) rv.addEventListener('click', function(){
      var rs = box.querySelector('#rs');
      if (!ta.value.trim() && !rv.dataset.once) { rv.dataset.once = '1'; rs.textContent = 'Write your own guess first, even a rough one. Then tap again.'; return; }
      planted.classList.remove('locked'); planted.classList.add('in'); rv.style.display = 'none'; rs.textContent = '';
      planted.scrollIntoView({behavior:'smooth', block:'center'});
    });
    box.querySelector('#cp').addEventListener('click', function(){
      var text = 'Anomaly Log, module 9: ' + ta.value.trim();
      function ok(){ st.textContent = 'Copied. Paste it to Rocky.'; }
      function fallback(){ var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); ok(); } catch(e) { st.textContent = 'Select your note and copy it.'; } t.remove(); }
      if (!ta.value.trim()) { st.textContent = 'Write a note first, or tell Rocky "nothing this time."'; return; }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    });
  })();
  // "Reveal:" answers stay hidden until the learner taps
  document.querySelectorAll('#body .answercard').forEach(function(card){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'reveal'; b.textContent = 'I picked one. Show the answer';
    var wrap = document.createElement('div'); wrap.className = 'revealrow'; wrap.appendChild(b);
    card.parentNode.insertBefore(wrap, card);
    b.addEventListener('click', function(){ card.classList.remove('locked'); card.classList.add('in'); wrap.style.display = 'none'; });
  });
  // Module 11: tick the planted anomalies you caught
  (function(){
    if ('09' !== '11') return;
    var ols = document.querySelectorAll('#body ol'), ol = null;
    ols.forEach(function(o){ if (o.children.length === 10) ol = o; });
    if (!ol) return;
    ol.classList.add('tick');
    var score = document.createElement('p'); score.className = 'score'; score.setAttribute('role', 'status');
    ol.parentNode.insertBefore(score, ol);
    function upd(){ score.textContent = 'You caught ' + ol.querySelectorAll('input:checked').length + ' of 10'; }
    Array.prototype.forEach.call(ol.children, function(li, i){
      var lab = document.createElement('label'), cb = document.createElement('input'), sp = document.createElement('span');
      cb.type = 'checkbox'; cb.setAttribute('aria-label', 'I caught number ' + (i + 1)); sp.innerHTML = li.innerHTML;
      lab.appendChild(cb); lab.appendChild(sp); li.innerHTML = ''; li.appendChild(lab); cb.addEventListener('change', upd);
    });
    upd();
  })();
  // stagger the sketch strokes so the drawing inks in once
  var parts = document.querySelectorAll('.sketch svg *');
  parts.forEach(function(el, i){ try{ var L = Math.ceil(el.getTotalLength()); el.style.setProperty('--len', L); el.style.animationDelay = (i * 0.12) + 's'; }catch(e){} });
  // the margin line fills with ink as you read
  var page = document.getElementById('page'), ink = document.getElementById('ink');
  function fill(){ var max = document.documentElement.scrollHeight - innerHeight;
    var f = max > 0 ? Math.min(1, scrollY / max) : 1; ink.style.height = (f * page.offsetHeight) + 'px'; }
  addEventListener('scroll', fill, {passive:true}); addEventListener('resize', fill); fill();
  // motion (Core only; Extended keeps the self-inking sketch and the margin line): paragraphs slide in from alternating sides; each section heading explodes into view
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var calm = level === 'extended';
  if (!reduce && !calm && 'IntersectionObserver' in window && document.body.animate) {
    document.body.classList.add('anim');
    var root = document.getElementById('body');
    var blocks = root.querySelectorAll(':scope > p:not(.tag), :scope > ul > li, :scope > ol > li, :scope > aside, :scope > .anomaly, :scope > .answercard, :scope > .tablewrap, :scope > .stamp, :scope > .logbox, .timeline > p, .glossary li');
    blocks.forEach(function(el, i){
      el.classList.add('rv');
      var fromLeft = el.parentNode.classList && el.parentNode.classList.contains('timeline') ? true : (i % 2 === 0);
      el.style.setProperty('--dx', (fromLeft ? -46 : 46) + 'px');
    });
    var colors = ['#b3261e', '#2d5f8b', '#ffd400', '#1f2a36', '#e7a3a3'];
    var nBursts = 0;
    function burst(h){
      var sc = nBursts++ === 0 ? 1 : 0.7;
      var box = document.createElement('span'); box.className = 'burst';
      box.style.left = Math.min(h.offsetWidth * 0.45, 200) + 'px'; box.style.top = (h.offsetHeight / 2) + 'px'; h.appendChild(box);
      var ring = document.createElement('b'); box.appendChild(ring);
      ring.animate([{transform:'scale(.2)', opacity:1}, {transform:'scale(' + (12 * sc) + ')', opacity:0}], {duration:800, easing:'ease-out'});
      for (var k = 0; k < Math.round(34 * sc); k++) {
        var d = document.createElement('i'), size = (7 + Math.random() * 10) * sc, ang = Math.random() * Math.PI * 2, dist = (70 + Math.random() * 150) * sc;
        d.style.width = d.style.height = size + 'px'; d.style.background = colors[k % colors.length];
        d.style.marginLeft = d.style.marginTop = (-size / 2) + 'px'; box.appendChild(d);
        d.animate([{transform:'translate(0,0) scale(1.3)', opacity:1}, {opacity:1, offset:.6},
                   {transform:'translate(' + Math.cos(ang) * dist * 1.6 + 'px,' + Math.sin(ang) * dist * .7 + 'px) scale(0)', opacity:0}],
                  {duration:950 + Math.random() * 600, easing:'cubic-bezier(.1,.75,.3,1)', fill:'forwards'});
      }
      setTimeout(function(){ box.remove(); }, 1700);
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var el = e.target; io.unobserve(el);
        if (el.tagName === 'H2') { el.classList.add('pop'); burst(el); }
        else { el.classList.add('in'); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -6% 0px'});
    root.querySelectorAll('h2').forEach(function(h){ io.observe(h); });
    blocks.forEach(function(el){ io.observe(el); });
  }
</script>
