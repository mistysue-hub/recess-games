<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2-4-6 Rule Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fdfdf8; --grid:#d6e4f0; --margin:#e08a8a; --ink:#1f2a36; --soft:#5a6875;
    --blue:#2d5f8b; --red:#b3261e; --sticky:#fff2a8; --good:#2e7d4f; --line:#c9d6e2;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--ink); font-family:"Atkinson Hyperlegible",system-ui,sans-serif; font-size:18px; line-height:1.45;
    min-height:100vh;
  }
  .page{max-width:760px;margin:0 auto;padding:20px 16px 40px 40px;position:relative;min-height:100vh}
  .page::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:2px;background:var(--margin)}
  h1,h2{font-family:"Special Elite",ui-monospace,monospace;font-weight:400;margin:0 0 8px}
  h1{font-size:28px} h2{font-size:22px}
  .tag{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px;margin-bottom:12px}
  p{margin:8px 0}
  .sticky{background:var(--sticky);padding:12px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(-.4deg);margin:14px 0}
  .btn{display:block;width:100%;text-align:left;border:2px solid var(--blue);background:#fff;color:var(--ink);
       font:inherit;padding:14px 16px;margin:10px 0;border-radius:10px;cursor:pointer;min-height:56px}
  .btn:active{transform:translateY(1px)}
  .btn.main{background:var(--blue);color:#fff;text-align:center;font-weight:700}
  .row{display:flex;gap:12px}
  .row .btn{text-align:center;font-weight:700}
  .btn.done{border-color:var(--good);background:#eaf5ee;color:var(--good);cursor:default}
  .btn.miss{animation:shake .3s}
  .btn.hint{border-style:dashed;border-color:var(--red)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .slots{list-style:none;padding:0;margin:10px 0}
  .slots li{border-bottom:1px solid var(--line);padding:8px 2px;min-height:42px}
  .slots li .n{font-family:"Special Elite",monospace;color:var(--soft);margin-right:8px}
  .slots li .d{color:var(--red);font-family:"Special Elite",monospace;margin-left:6px}
  .stmt{font-size:20px;font-weight:700;margin:12px 0}
  .feedback{border-left:4px solid var(--good);padding:8px 12px;background:#fff;margin:12px 0}
  .feedback.wrong{border-left-color:var(--red)}
  .feedback b.v{display:block}
  .anom{color:var(--red);font-family:"Special Elite",monospace}
  .progress{font-family:"Special Elite",monospace;color:var(--soft);font-size:15px}
  .report{background:#fff;border:2px solid var(--ink);padding:12px 14px;margin:14px 0;white-space:pre-wrap;font-family:"Special Elite",monospace;font-size:16px}
  .hidden{display:none}
  @media (max-width:480px){.page{padding-left:34px}.page::before{left:18px}h1{font-size:24px}.row{flex-direction:column;gap:0}}
</style>
<style>
  .slots3{display:flex;gap:10px;margin:12px 0}
  .slot{flex:1;min-height:64px;border:2px solid var(--line);border-radius:10px;background:#fff;font:700 30px "Atkinson Hyperlegible",sans-serif;color:var(--ink);cursor:pointer}
  .slot.active{border-color:var(--blue);box-shadow:0 0 0 3px #cfe0f1}
  .pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .pad .btn{margin:0;text-align:center;font-weight:700;font-size:22px;min-height:52px;padding:8px}
  .log{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:4px}
  .log li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:"Special Elite",monospace;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .yes{color:var(--good)} .no{color:var(--red)}
  .known{font-family:"Special Elite",monospace;font-size:20px}
</style>
</head>
<body>
<main class="page" id="app" aria-live="polite"></main>
<script>
(function(){
  var level = new URLSearchParams(location.search).get('level') === 'extended' ? 'extended' : 'core';
  var app = document.getElementById('app');
  var OPTIONS = {
    core: ['Any three numbers that go up','Each number goes up by 2','Only even numbers','Each number goes up by the same amount'],
    extended: ['Any three numbers that go up','Each number goes up by the same amount','The middle number is the average of the other two','Even numbers going up']
  }[level];
  var RIGHT = 'Any three numbers that go up';
  var tests = [], wrongInRow = 0, guesses = 0, solved = false, revealed = false, hintShown = false;
  var cur = ['', '', ''], active = 0;

  function el(h){ var h0=app.querySelector('h1,h2'); var t0=h0?h0.textContent:null; var y=window.scrollY; app.innerHTML = h; var h1=app.querySelector('h1,h2'); if(t0!==null && h1 && h1.textContent===t0){ window.scrollTo(0,y); } else { window.scrollTo(0,0); } }
  function fits(t){ return t[0] < t[1] && t[1] < t[2]; }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }
  function breaking(){ return tests.filter(function(t){ return t.predicted === false; }).length; }
  function surprises(){ return tests.filter(function(t){ return t.predicted !== t.result; }).length; }

  function intro(){
    el('<h1>2-4-6 Rule Hunt</h1><div class="tag">Lab notebook · Module 3 · '+(level==='core'?'Core':'Extended')+'</div>'+
      '<p class="known">2, 4, 6 fits a secret rule.</p>'+
      '<div class="sticky">Build your own sets of three numbers to test. Before each test, say whether you think it will fit. When you think you know the rule, tap <b>I know the rule</b>.</div>'+
      '<button class="btn main" id="go">Start testing</button>');
    document.getElementById('go').onclick = lab;
  }

  function lab(note){
    var logHtml = tests.length ? '<ul class="log">'+tests.slice().reverse().map(function(t){
      return '<li><span>'+t.nums.join(', ')+'</span><span>you said: '+(t.predicted?'fits':'won\'t fit')+'</span><b class="'+(t.result?'yes':'no')+'">'+(t.result?'✓ Fits':'✗ Doesn\'t fit')+'</b></li>'; }).join('')+'</ul>' : '';
    el('<h2>Your tests</h2><p class="progress">Known: 2, 4, 6 fits. Tests so far: '+tests.length+'</p>'+
      (note||'')+
      '<p class="progress">Tap a box, then tap its digits (0 to 99).</p><div class="slots3">'+[0,1,2].map(function(i){ return '<button class="slot'+(i===active?' active':'')+'" data-i="'+i+'" aria-label="Number '+(i+1)+'">'+(cur[i]===''?'·':cur[i])+'</button>'; }).join('')+'</div>'+
      '<div class="pad">'+[1,2,3,4,5,6,7,8,9,0].map(function(d){ return '<button class="btn" data-d="'+d+'">'+d+'</button>'; }).join('')+'</div>'+
      '<div class="row"><button class="btn" id="clr">Clear</button><button class="btn main" id="test">Test this set</button></div>'+
      (surprises() >= 1 || tests.length >= 5 ? '<button class="btn" id="know">I know the rule</button>' : '<button class="btn" id="know" disabled style="opacity:.55">I know the rule (unlocks after a test that surprises you, or after 5 tests)</button>')+ logHtml);
    app.querySelectorAll('.slot').forEach(function(b){ b.onclick = function(){ active = +b.dataset.i; lab(); }; });
    app.querySelectorAll('[data-d]').forEach(function(b){ b.onclick = function(){
      if(cur[active].length >= 2) cur[active] = '';
      cur[active] += b.dataset.d;
      if(cur[active].length === 2 && active < 2) active++;
      lab();
    }; });
    document.getElementById('clr').onclick = function(){ cur = ['','','']; active = 0; lab(); };
    document.getElementById('test').onclick = function(){
      if(cur.some(function(c){ return c===''; })){ lab('<div class="feedback wrong"><b class="v">Fill in all three numbers first.</b>Tap a box, then tap digits.</div>'); return; }
      predict(cur.map(Number));
    };
    document.getElementById('know').onclick = guessRule;
  }

  function predict(nums){
    el('<h2>Before you test</h2><p class="known">'+nums.join(', ')+'</p><p>Do you think this set fits the rule?</p>'+
      '<div class="row"><button class="btn" id="y">I think it fits</button><button class="btn" id="n">I think it won\'t fit</button></div>');
    function go(p){
      var r = fits(nums); tests.push({nums:nums, predicted:p, result:r});
      cur = ['','','']; active = 0;
      var surprise = (p !== r);
      var msg = '<div class="feedback'+(r?'':' wrong')+'"><b class="v">'+nums.join(', ')+(r?' fits.':' doesn\'t fit.')+'</b>'+
        (surprise ? 'That surprised your guess. Surprises are the most useful tests.' : 'As you expected.')+'</div>';
      if(level==='core' && !hintShown && tests.length >= 6 && breaking() === 0){
        hintShown = true;
        msg += '<div class="sticky">Hint: every test so far was one you expected to fit. Try a set you think will NOT fit.</div>';
      }
      lab(msg);
    }
    document.getElementById('y').onclick = function(){ go(true); };
    document.getElementById('n').onclick = function(){ go(false); };
  }

  function guessRule(){
    var opts = shuffle(OPTIONS);
    el('<h2>Name the rule</h2><p>Which rule is it?</p><div id="o"></div><button class="btn" id="back">Keep testing instead</button>');
    var box = document.getElementById('o');
    opts.forEach(function(o){ var b=document.createElement('button'); b.className='btn'; b.textContent=o;
      b.onclick=function(){ guesses++;
        if(o===RIGHT){ solved = true; finish(); }
        else { wrongInRow++;
          if(wrongInRow>=2){ revealed = true; finish(); }
          else lab('<div class="feedback wrong"><b class="v">Not that one.</b>Keep testing. Try a set your guess says should fail.</div>');
        }
      }; box.appendChild(b); });
    document.getElementById('back').onclick = function(){ lab(); };
  }

  function finish(){
    var text = ['done — 2-4-6 Rule Hunt ('+level+')',
      'Tests: '+tests.length+' (breaking tests: '+breaking()+')',
      'Rule: '+(solved ? 'found in '+guesses+(guesses===1?' guess':' guesses') : 'shown after two wrong guesses')].join('\n');
    el('<h1>Notebook closed</h1><div class="tag">2-4-6 Rule Hunt · '+(level==='core'?'Core':'Extended')+'</div>'+
      (solved ? '<div class="feedback"><b class="v">You found it: any three numbers that go up.</b></div>' :
                '<div class="feedback wrong"><b class="v">The rule: any three numbers that go up.</b>Sets like 1, 2, 3 or 5, 40, 41 fit. Sets like 6, 4, 2 or 3, 3, 3 don\'t.</div>')+
      '<div class="sticky">In 1960 the psychologist Peter Wason gave people this same puzzle. Most tested only sets that fit their guess, felt sure, and named a rule that was too narrow. A <b>breaking test</b> is a set you expect NOT to fit. It\'s the kind of test Karl Popper said good scientists should run.</div>'+
      '<p><b>What you found:</b></p><div class="report">'+text+'</div>'+
      '<button class="btn main" id="copy">Copy my results for Rocky</button><p id="copied" class="hidden">Copied! Paste it into your chat with Rocky.</p>'+
      '<p>Go back to Rocky and type <b>done</b>.</p><button class="btn" id="again">Play again</button>');
    document.getElementById('copy').onclick = function(){
      var c = document.getElementById('copied');
      function ok(){ c.classList.remove('hidden'); }
      function fallback(){ var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select();
        try{ document.execCommand('copy'); ok(); }catch(e){ c.textContent='Copy didn\'t work here. Read the box to Rocky instead.'; ok(); } t.remove(); }
      try{ navigator.clipboard.writeText(text).then(ok, fallback); }catch(e){ fallback(); }
    };
    document.getElementById('again').onclick = function(){ tests=[]; wrongInRow=0; guesses=0; solved=false; revealed=false; hintShown=false; cur=['','','']; active=0; intro(); };
  }

  intro();
})();
</script>
</body>
</html>
