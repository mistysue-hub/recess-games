<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;width:900px;height:1200px;overflow:hidden;position:relative;background:#1fa7a0;background-image:radial-gradient(#0f7f7a 5px,transparent 5.5px);background-size:44px 44px;font-family:"Trebuchet MS","DejaVu Sans",Verdana,sans-serif;color:#1b2a3a}
.box{position:absolute;left:50px;top:190px;width:760px;height:420px;background:#ffd23f;border:8px solid #1b2a3a;border-radius:26px;transform:rotate(-2.5deg);box-shadow:14px 14px 0 #0b4f4b;padding:34px 44px}
.box h1{margin:0;font-size:104px;line-height:.98;color:#d62828;font-weight:900;letter-spacing:1px;text-shadow:4px 4px 0 #fff3b0}
.box p{margin:18px 0 0;font-size:34px;font-weight:700}
.burst{position:absolute;left:640px;top:20px;width:190px;height:190px;border-radius:50%;background:#d62828;color:#fff;font-weight:900;font-size:34px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center;border:7px solid #fff;transform:rotate(12deg);box-shadow:8px 8px 0 #0b4f4b;z-index:3}
.burst small{display:block;font-size:22px}
.tiles{position:absolute;left:50px;top:680px;width:560px;display:flex;flex-wrap:wrap;gap:22px}
.t{width:166px;height:150px;border:6px solid #1b2a3a;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 4px 8px;box-shadow:6px 6px 0 #0b4f4b;font-size:64px}
.t span{font-size:17px;font-weight:900;background:#fff;border:3px solid #1b2a3a;border-radius:8px;padding:2px 6px}
.t:nth-child(1){background:#ff9f43;transform:rotate(-3deg)}.t:nth-child(2){background:#ffd23f;transform:rotate(2deg)}.t:nth-child(3){background:#7bd88f;transform:rotate(-2deg)}.t:nth-child(4){background:#74b9ff;transform:rotate(3deg)}.t:nth-child(5){background:#ff8fab;transform:rotate(-3deg)}.t:nth-child(6){background:#c39bff;transform:rotate(2deg)}
.lens{position:absolute;left:650px;top:575px;font-size:150px;transform:rotate(-12deg);filter:drop-shadow(10px 10px 0 #0b4f4b);z-index:2}
.mascot{position:absolute;left:640px;top:775px;width:230px;text-align:center}
.mascot .big{font-size:96px;line-height:1.05;opacity:.6}
.bub{background:#fff;border:5px solid #1b2a3a;border-radius:30px;font-weight:900;font-size:25px;padding:6px 14px;display:inline-block;margin-bottom:6px}
.tag{background:#fff3b0;border:4px solid #1b2a3a;font-weight:900;font-size:20px;padding:2px 8px;transform:rotate(-3deg);display:inline-block}
</style></head><body>
<div class="burst"><div>13<br>TOOLS!<small>to win</small></div></div>
<div class="box"><h1>BALONEY<br>DETECTOR<br>KIT</h1><p>Think like a scientist!</p></div>
<div class="lens">🔍</div>
<div class="tiles"><div class="t">🧪<span>B-2</span></div><div class="t">🧲<span>G-9</span></div><div class="t">🧭<span>L-16</span></div><div class="t">💡<span>Q-23</span></div><div class="t">🔬<span>A-37</span></div><div class="t">🌡️<span>K-51</span></div></div>
<div class="mascot"><div class="bub">I am so here.</div><div class="big">🐉</div><div class="tag">Dragon (invisible*)</div></div>
</body></html>
