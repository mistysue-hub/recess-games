<script>
function T(rows){return "<table>"+rows.map(function(r,i){return "<tr>"+r.map(function(c){return i===0||c===r[0]?"<th>"+c+"</th>":"<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</table>"}
var PD=T([["You ↓ · Partner →","SHARE","GRAB"],["SHARE","You 3, Partner 3","You 0, Partner 5"],["GRAB","You 5, Partner 0","You 1, Partner 1"]]);
var L={
"1": {
"t": "WORK BACKWARD",
"s": "Lesson 1 · about 11 minutes",
"S": [
{
"h": "WHAT JUST HAPPENED?",
"b": "<b>Bishop Bea never guessed. She had a cheat code: 1, 5, 9, 13, 17. Here's why it works.</b><br><br>In Game Night 1, everyone chose at the same moment. In Race to 21 you <b>took turns</b>, and you saw every move before making yours.<br><br>That changes everything: now you can <b>plan ahead</b>."
},
{
"h": "QUICK CHECK",
"q": "Race to 21: each turn you add 1, 2 or 3, and whoever says 21 wins. Your rival just said 18. What do you say to win right now?",
"o": [
"19",
"20",
"21"
],
"a": 2,
"w": "Add 3 and you say 21. Whoever says 21 wins."
},
{
"h": "THE BIG IDEA: BACKWARD INDUCTION",
"b": "<b>Backward induction</b> means solving a turn-taking game from the end. Find the last winning move, then ask which position lets you reach it, and repeat back to the start. Instead of \"what should I do now?\", ask \"how does this end?\"<svg viewBox=\"0 0 380 78\" role=\"img\" aria-label=\"Key numbers 1, 5, 9, 13, 17, 21, each 4 apart, found by working back from 21\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font:700 14px Rubik,sans-serif\"><line x1=\"54\" y1=\"32\" x2=\"79\" y2=\"32\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"117\" y1=\"32\" x2=\"142\" y2=\"32\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"180\" y1=\"32\" x2=\"205\" y2=\"32\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"243\" y1=\"32\" x2=\"268\" y2=\"32\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"306\" y1=\"32\" x2=\"331\" y2=\"32\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><text x=\"318\" y=\"22\" text-anchor=\"middle\" fill=\"#f2c14e\" font-size=\"12\">&#8722;4</text><text x=\"255\" y=\"22\" text-anchor=\"middle\" fill=\"#f2c14e\" font-size=\"12\">&#8722;4</text><text x=\"192\" y=\"22\" text-anchor=\"middle\" fill=\"#f2c14e\" font-size=\"12\">&#8722;4</text><text x=\"129\" y=\"22\" text-anchor=\"middle\" fill=\"#f2c14e\" font-size=\"12\">&#8722;4</text><text x=\"66\" y=\"22\" text-anchor=\"middle\" fill=\"#f2c14e\" font-size=\"12\">&#8722;4</text><circle cx=\"35\" cy=\"32\" r=\"19\" fill=\"#8e7dff\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"35\" y=\"37\" text-anchor=\"middle\" fill=\"#fff\">1</text><circle cx=\"98\" cy=\"32\" r=\"19\" fill=\"#8e7dff\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"98\" y=\"37\" text-anchor=\"middle\" fill=\"#fff\">5</text><circle cx=\"161\" cy=\"32\" r=\"19\" fill=\"#8e7dff\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"161\" y=\"37\" text-anchor=\"middle\" fill=\"#fff\">9</text><circle cx=\"224\" cy=\"32\" r=\"19\" fill=\"#8e7dff\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"224\" y=\"37\" text-anchor=\"middle\" fill=\"#fff\">13</text><circle cx=\"287\" cy=\"32\" r=\"19\" fill=\"#8e7dff\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"287\" y=\"37\" text-anchor=\"middle\" fill=\"#fff\">17</text><circle cx=\"350\" cy=\"32\" r=\"19\" fill=\"#f2c14e\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"350\" y=\"37\" text-anchor=\"middle\" fill=\"#2a1d00\">21</text><text x=\"190\" y=\"72\" text-anchor=\"middle\" fill=\"#d9d3c0\" font-size=\"12\">work back from 21, one jump of 4 at a time</text></svg><b>Race to 21, step by step</b> (add 1, 2 or 3):<br>1. Say 21 and you win.<br>2. At 17, your rival can only reach 18, 19 or 20, so you say 21. Saying 17 is as good as winning.<br>3. From 13 you can always reach 17, so 13 wins too. Same for 9, 5 and 1. These are the <b>key numbers</b>.<br>4. Say 1 first, then add enough to make 4 with each rival move.<br><br><b>Why it matters:</b> computers solve chess endgames this way, starting from checkmate and working back."
},
{
"h": "TRY IT",
"q": "Race to 21, adding 1 to 3 each turn. Your rival says 7. How much do you add to land on a key number (a number that leads to 21 in steps of 4)?",
"o": [
"+1 (8)",
"+2 (9)",
"+3 (10)"
],
"a": 1,
"w": "9 is a key number: 1, 5, <b>9</b>, 13, 17, 21."
},
{

"b": "Backward induction works on any turn-taking game, so game theorists draw them as a <b>tree</b>. Each branch is a move. Each tip of the tree is a final result.<br><br>To solve the tree, start at the tips and cross out the moves nobody would choose, one level at a time, back to the start.<br><br><svg viewBox=\"0 0 380 240\" role=\"img\" aria-label=\"Game tree for race to 4 adding 1 or 2\" xmlns=\"http://www.w3.org/2000/svg\" style=\"font:700 14px Rubik,sans-serif\"><line x1=\"30\" y1=\"136\" x2=\"110\" y2=\"86\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"30\" y1=\"136\" x2=\"110\" y2=\"187\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"110\" y1=\"86\" x2=\"190\" y2=\"52\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"110\" y1=\"86\" x2=\"190\" y2=\"120\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"110\" y1=\"187\" x2=\"190\" y2=\"165\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"110\" y1=\"187\" x2=\"190\" y2=\"210\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"190\" y1=\"52\" x2=\"270\" y2=\"30\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"190\" y1=\"52\" x2=\"270\" y2=\"75\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"190\" y1=\"120\" x2=\"270\" y2=\"120\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"190\" y1=\"165\" x2=\"270\" y2=\"165\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><line x1=\"270\" y1=\"30\" x2=\"350\" y2=\"30\" stroke=\"#8a8fb8\" stroke-width=\"2\"/><circle cx=\"30\" cy=\"136\" r=\"15\" fill=\"#2b2f45\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"30\" y=\"141\" text-anchor=\"middle\" fill=\"#fff\">0</text><circle cx=\"110\" cy=\"86\" r=\"15\" fill=\"#8e7dff\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"110\" y=\"91\" text-anchor=\"middle\" fill=\"#fff\">1</text><circle cx=\"110\" cy=\"187\" r=\"15\" fill=\"#8e7dff\" stroke=\"#f5ecd7\" stroke-width=\"2\"/><text x=\"110\" y=\"192\" text-anchor=\"middle\" fill=\"#fff\">2</text><circle cx=\"190\" cy=\"52\" r=\"15\" fill=\"#3a6fd8\" stroke=\"# "h": "THE BIG IDEA: BID YOUR TRUE VALUE",
"b": "In a second-price auction your bid only decides <b>whether</b> you win. The price comes from the second-highest bid, so shading your bid can't save you money. It can only lose you a good deal. The best bid is your <b>true value</b>.<br><br>Say the prize is worth 60 to you. In the game the top rival bid was 48 on the skateboard and 66 on the poster. Your points:<table style=\"font-size:13px;width:100%\"><tr><th>Your bid</th><th>Rival tops at 48</th><th>Rival tops at 66</th></tr><tr><th>40</th><td>lose: 0</td><td>lose: 0</td></tr><tr><th>60</th><td class=\"hit\">win, pay 48: +12</td><td class=\"hit\">lose: 0</td></tr><tr><th>80</th><td>win, pay 48: +12</td><td>win, pay 66: -6</td></tr></table>Bid 40 misses a +12 deal. Bid 80 can win at a loss. Bid 60 wins exactly when the price is worth it.<br><br><b>Why it matters:</b> auction designers like rules where telling the truth is the best strategy, so bidders don't have to out-guess each other."
},
{

{

},
{
"h": "THE BIG IDEA: THE WINNER'S CURSE",
"b": "When nobody knows an item's true value, everyone guesses. Some guess high, some low, and the <b>highest guess wins</b>. So the winner is the person who overestimated most. That is the <b>winner's curse</b>: winning is a hint that your guess was too high.<br><br><b>Jar 1</b> was really worth 50. The robots bid their guesses: 41, 44, 47, 49 and 52. Most were low, but the top bid, 52, was already above 50. You guessed 58. Bid near your guess (55 or 60) and you beat every robot, but you pay more than 50: -5 at 55.<br><b>The fix:</b> bid below your guess. Jar 2 (really 80, you guessed 72, robots topped out at 64) shows it costs little: a bid of 65 still won, +15.<br><br><b>Why it matters:</b> companies bidding for oil rights, or anyone bidding on something with a hidden value, can \"win\" by overpaying."

},
{

"100"

"w": "You pay your last bid, 90, and get nothing."

"h": "THE BIG IDEA: SUNK COSTS AND ESCALATION",
"b": "Money you've already bid is a <b>sunk cost</b>: it's gone whether you win or lose. In a contest where everyone pays while they stay in (a <b>war of attrition</b>), quitting feels like admitting the money was wasted, so people keep raising. That is <b>escalation</b>.<br><br>Watch it against Sensible Sam, who keeps going to 100 on a 100-point prize (bids rise by 10):<table style=\"font-size:13px;width:100%\"><tr><th>Round</th><th>You</th><th>Sam</th></tr><tr><th>1</th><td>10</td><td>20</td></tr><tr><th>2</th><td>30</td><td>40</td></tr><tr><th>...</th><td>...</td><td>...</td></tr><tr><th>5</th><td>90</td><td>100</td></tr><tr><th>6</th><td>110</td><td>quits</td></tr></table>To beat Sam you must reach 110, so you pay 110 for a 100-point prize: -10. Sam paid 100 for nothing. Sitting out costs 0. Every raise felt better than quitting, yet the whole climb was a loss.<br><br><b>The way out:</b> judge each raise by what happens <i>next</i>, not by what you have already paid.<br><br><b>Why it matters:</b> projects get kept alive \"because we've already spent so much\", even when finishing will cost more than it's worth."

var K={"1": ["Taking turns: you see each move before you choose.", "Backward induction: start at the end and work back.", "Race to 21 key numbers: 1, 5, 9, 13, 17, 21.", "Some games give the first player a sure win; some give it to the second."], "2": ["Start with the smallest case (2 pirates) and build up.", "Each pirate compares your offer with what they'd get from the next captain.", "Buy the cheapest votes: pirates who'd get 0 otherwise.", "Always ask: what happens if my plan fails?", "Two ties: a tied vote passes, but an offer that only equals a pirate's backup is a NO."], "3": ["Each pass doubles the pot but hands your partner the next move.", "Taking now pays double passing and being taken from, at every turn. That is why logic unravels back to turn 1.", "Backward induction says take right away.", "Real people usually pass, and often earn more.", "Read your partner: take one turn before they would.", "Turn 6 is 128 vs 64. If nobody takes, the piles double once more (256/64) and the first player gets the big pile."], "4": ["A threat is credible only if carrying it out helps the one making it.", "Test: after you act, would they really follow through?", "Contracts, burned bridges and reputation can make threats real.", "Shouting louder doesn't change the payoffs."], "5": ["Coin logic: offer 1, accept anything above 0.", "Real people often offer 4-5 and reject very low offers.", "Fairness is part of many people's payoff.", "Best offer: the smallest one your partner will actually accept."], "6": ["Second-price auction: bid exactly what it's worth to you. It's never worse than any other bid and sometimes better (other bids can tie it, none beats it).", "Your bid decides if you win; the second-highest bid sets the price.", "Winner's curse: when everyone's guessing, the winner probably guessed too high.", "Hidden value: bid below your guess."], "7": ["Both-pay auctions can push bids past the prize's value.", "Sunk costs are gone either way: ignore them.", "Decide your limit before you start.", "Against someone who never quits, the best move is not to start."], "8": ["Work backward · Buy the cheapest votes · Trust has a price · Empty threat", "Fair enough? · True value bid · Sunk cost"]};
(function(){var ADD={"1": {"h": "CHANGE THE RULES", "b": "Change the rules and the key numbers change. If you can add 1 or 2 and the goal is 10, the key numbers are 10, 7, 4 and 1.<br><br>The gap between key numbers is always <b>one more than the biggest step</b> you're allowed. Steps of 1 to 3 give a gap of 4; steps of 1 to 2 give a gap of 3."}, "2": {"h": "A COUSIN: PROOF BY INDUCTION", "b": "In math class you'll meet <b>proof by induction</b>: prove the smallest case, then show that each case leads to the next. The pirates use the same chain. Annie's case is settled first, and every bigger ship builds on the one before it."}, "3": {"h": "WHY DO PEOPLE PASS?", "b": "People might pass because they hope their partner is generous, because they want to be someone who shares, or because they doubt the other player will reason all the way back.<br><br>If you think your partner will pass, passing yourself can be smart. Being \"too logical\" can leave points on the table."}, "4": {"h": "SPOT THE EMPTY THREAT", "b": "Ask one question: when the moment comes, would carrying out the threat actually help the person making it?<br><br>\"Clean your room or no phone tonight\" is easy to carry out, so it's believable. \"Do that again and we're canceling the whole vacation\" usually isn't, because the family would lose the vacation too."}, "5": {"h": "WHAT WOULD YOU OFFER?", "b": "Picture a real split with a friend. Offering 1 of 10 is risky: many people would rather get nothing than accept an insulting deal. Offering 5 is safe but generous.<br><br>Many real offers land around 4 or 5, because people who propose expect others to care about fairness, not just coins."}, "6": {"h": "WHY HONEST BIDS WIN", "b": "In a second-price auction, bidding <b>more</b> than your value can make you win something at a price above what it's worth to you. Bidding <b>less</b> can make you lose something you'd have happily paid for.<br><br>Bidding exactly your value never does either. It's never worse than any other bid, and sometimes better. Game theorists call that <b>weakly dominant</b>: several bids can end the same way (say you'd win at the same price either way), so honesty isn't the only good bid, but no other bid beats it."}, "7": {"h": "SET YOUR LIMIT FIRST", "b": "The limit has to come before the first bid, because once you are in, quitting hurts most. With a 100-point prize, a limit of 100 beats Quinn (he quits at 30, so you win for +70). But against someone who never stops, like Stan, any limit loses: the smart move is not to start."}, "8": {"h": "THE BIG PICTURE", "b": "<b>Look ahead, reason back.</b> Start at the end, find the best moves there, and work backward to today. Then remember that real people care about fairness and pride, so the coldly \"logical\" move isn't always the winning one."}};for(var k in ADD){var S=L[k]&&L[k].S;if(!S)continue;var i=S.length-1;if(k==='8'){for(var j=0;j<S.length;j++){if(S[j].q){i=j;break}}}S.splice(i,0,ADD[k]);}})();


(function(){var DEEP={"1": {"h": "NERD ZONE: WINNING SPOTS", "b": "Race to 21 is a <b>combinatorial game</b>: two players, no luck, no hidden information. Mathematicians label every position. A <b>P-position</b> means the player who just moved will win with perfect play; an <b>N-position</b> means the next player will.<br><br>Memory trick: <b>P = the Previous player wins, N = the Next player wins</b>.<br><br>The key numbers are the P-positions. Every move from a P-position lands on an N-position, and every N-position has a move back to a P-position.", "q": "In Race to 21, is 17 a P-position or an N-position?", "o": ["P-position: whoever just said 17 wins", "N-position: whoever moves next from 17 wins", "Neither: both players could still win from 17"], "a": 0, "w": "From 17, every move lands on 18-20, and from there the player who said 17 can reach 21."}, "2": {"h": "NERD ZONE: WHAT EVERY PIRATE MUST KNOW", "b": "The pirate answer only works if every pirate is perfectly logical and greedy, knows the others are too, knows that they know, and so on. Game theorists call this <b>common knowledge of rationality</b>, the same idea behind the two-thirds game.<br><br>If even one pirate might vote out of anger, the \"cheapest votes\" plan can fail. A lot of modern economics studies what happens when that assumption breaks.", "q": "What does \"common knowledge of rationality\" mean?", "o": ["Everyone is logical and knows everyone else is, and so on", "Every pirate knows the rules and can add up the coins", "The pirates agree on a plan together before the vote"], "a": 0, "w": "The pirate solution needs that whole chain of \"I know that you know.\""}, "3": {"h": "NERD ZONE: A PARADOX", "b": "Game theorists still argue about this one. Backward induction says take at turn 1, because your partner would take at turn 2. But if turn 2 ever happens, you just passed, so you weren't perfectly logical. Why should your partner expect you to be logical later?<br><br>The plan depends on what players believe <b>after something \"impossible\" happens</b>. Whole research papers have been written about it.", "q": "Why do game theorists call the centipede game a paradox?", "o": ["Reaching turn 2 already breaks the \"take now\" logic", "Nobody can ever work out who should move first", "The pot gets smaller each time someone passes"], "a": 0, "w": "The plan depends on what players believe after something \"impossible\" happens."}, "4": {"h": "NERD ZONE: THE CHAIN-STORE PARADOX", "b": "In 1978 Selten imagined a store chain in 20 towns, with a rival opening in one town at a time. Should the chain fight to scare the others? Backward induction says no: in the last town there's nobody left to scare, so it won't fight there, and the logic unravels all the way back to town 1.<br><br>Yet real chains do fight. Later work in 1982 showed why: a little doubt about how tough the chain really is makes building a reputation worth the cost.", "q": "In Selten's chain-store story, why does backward induction say never fight?", "o": ["Nobody is left to scare in the last town, so it unravels back", "Rivals always call the chain's bluff in the first town", "A chain can only afford to fight in one town"], "a": 0, "w": "Each town's fight can't change what happens later, so it never pays. Real chains fight anyway, to build a reputation."}, "5": {"h": "NERD ZONE: BACK-AND-FORTH BARGAINING", "b": "Real bargaining usually goes back and forth. In 1982 the economist Ariel Rubinstein solved a game where players take turns making offers and waiting costs both sides.<br><br>Rubinstein showed the game has exactly one equilibrium outcome: they agree right away, and the more <b>patient</b> player gets the bigger share. If both are equally patient and offers come quickly, the split gets close to 50/50.", "q": "In Rubinstein's bargaining game, who gets the bigger share?", "o": ["The more patient player", "Whoever offers second", "Whoever makes the lowest offer"], "a": 0, "w": "Waiting hurts the impatient player more, so the patient one can hold out for more."}, "6": {"h": "NERD ZONE: FOUR AUCTIONS, ONE ANSWER?", "b": "Economists study four classic auctions: <b>English</b> (prices rise out loud), <b>Dutch</b> (prices fall until someone calls out), <b>first-price sealed</b> (the top bid pays its bid), and <b>second-price sealed</b> (Vickrey).<br><br>The <b>revenue equivalence theorem</b>, built on work by Vickrey (1961), Roger Myerson (1981), and John Riley and William Samuelson (1981), shows that under certain conditions the seller expects the same money from all four. Bidders bid lower in some formats, and it evens out.", "q": "Which auction works like a second-price auction for bidders?", "o": ["English: prices rise until one bidder is left", "Dutch: prices fall until someone calls out", "First-price sealed: the top bid pays its own bid"], "a": 0, "w": "In a rising auction you stay in until your value, and the winner pays about the second-highest value."}, "7": {"h": "NERD ZONE: THE WAR OF ATTRITION", "b": "A contest where everyone pays while they stay in, and the last one standing wins, is called a <b>war of attrition</b>. The biologist John Maynard Smith studied it in animals in 1974.<br><br>In the simplest version, the equilibrium is a <b>mixed strategy</b>: each player quits at a random time, and on average the total spent eats up about the whole prize. That's why wars of attrition are so wasteful.", "q": "In a war of attrition, what usually happens to the prize's value?", "o": ["Most of it gets used up by the cost of staying in", "It keeps growing as more players join the contest", "The first player to quit collects most of it"], "a": 0, "w": "On average, the cost of staying in uses up about the whole prize."}, "8": {"h": "NERD ZONE: WHERE YOU ARE", "b": "Game Night 2 covered <b>dynamic games</b>: game trees, backward induction, and <b>subgame perfect equilibrium</b>, Selten's name for plans that make sense at every step.<br><br>Ultimatums belong to <b>bargaining theory</b>. Auctions belong to <b>mechanism design</b>: writing rules so that people's own choices lead to a good result. Mechanism design won the 2007 Nobel Prize in economics (Hurwicz, Maskin and Myerson).", "q": "Mechanism design is about...", "o": ["Writing rules so people's choices lead to good results", "Building computers that can beat people at games", "Finding the single best move in any turn-taking game"], "a": 0, "w": "Auction rules are a classic example: the right rules make honest bidding the smart move."}};var GD=[{"h": "YOU DID IT!", "b": "You've learned how to think ahead: backward induction, credible threats, fair deals, smart bidding and sunk costs.<br><br><b>Before you move on to Game Night 3</b>, here's how to go deeper on <b>Part 2</b> if you're curious."}, {"h": "WATCH THE LECTURES FOR PART 2", "b": "These lectures from <b>Yale's free Game Theory course (ECON 159)</b>, taught by Professor Ben Polak, match Part 2:<br><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-13\" target=\"_blank\" rel=\"noopener\">Lecture 13: Sequential Games: Moral Hazard, Incentives, and Hungry Lions</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-14\" target=\"_blank\" rel=\"noopener\">Lecture 14: Backward Induction: Commitment, Spies, and First-Mover Advantages</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-15\" target=\"_blank\" rel=\"noopener\">Lecture 15: Backward Induction: Chess, Strategies, and Credible Threats</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-16\" target=\"_blank\" rel=\"noopener\">Lecture 16: Backward Induction: Reputation and Duels</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-17\" target=\"_blank\" rel=\"noopener\">Lecture 17: Backward Induction: Ultimatums and Bargaining</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-20\" target=\"_blank\" rel=\"noopener\">Lecture 20: Subgame Perfect Equilibrium: Wars of Attrition</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-24\" target=\"_blank\" rel=\"noopener\">Lecture 24: Asymmetric Information: Auctions and the Winner's Curse</a><br><br>It's college-level: a big step up, and a great challenge."}, {"h": "TRY IT AT HOME", "b": "<b>Race to a new number:</b> play to 30 adding 1 to 4. Can you find the new key numbers before you start? (Hint: the gap is one more than the biggest step.)<br><br><b>The 6-pirate puzzle:</b> using the same rules as the game, how should the captain split 100 coins among 6 pirates? Start with 2 pirates and build up.<details><summary>Tap to reveal the 6-pirate answer</summary>The captain keeps <b>98</b>. Give <b>1 coin each to Bo and Dot</b>, the two pirates who would get 0 under the 5-pirate plan (98, 0, 1, 0, 1 going down the line). That is 3 yes votes out of 6: half, so it passes.</details>"}, {"h": "STRETCH: 200 PIRATES", "b": "<b>What breaks when there are 200 pirates?</b> Same rules, still 100 coins. Think about what the captain has to buy, and what each vote costs.<details><summary>Tap to reveal what happens</summary>The captain needs half the votes and buys them at 1 coin each. With 200 pirates he needs 100 votes: his own plus 99 bought ones, so he keeps just 1 coin. With 201 or 202 pirates he keeps nothing but still survives. At 203 he can't afford enough votes and gets thrown overboard. The cheap-votes trick only works while there are coins left to buy votes with.</details>"}, {"h": "READ MORE", "b": "<b>The Art of Strategy</b> by Avinash Dixit and Barry Nalebuff (2008): stories about commitment, threats, bargaining and auctions from sports, business and movies.<br><br><b>Introduction to Game Theory: A Discovery Approach</b> by Jennifer Firkins Nordstrom: a free online textbook where you work out the ideas yourself.<br><a href=\"https://nordstrommath.com/IntroGameTheoryText\" target=\"_blank\" rel=\"noopener\">Read it free</a>"}, {"h": "COMING NEXT", "b": "So far, most games happened once. Next is <b>Game Night 3: The Long Game</b>: games played again and again, where reputation, trust and revenge change everything."}];for(var k in DEEP){var S=L[k]&&L[k].S;if(!S)continue;var i=S.length-1;if(k==='8'){for(var j=0;j<S.length;j++){if(S[j].q){i=j;break}}}S.splice(i,0,DEEP[k]);}if(L[9]){L[9].S=GD;L[9].t='GO DEEPER';}})();

function shufIdx(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}

  el("keys").innerHTML="<b>KEY IDEAS</b> (keep this open while you talk to Rocky)<br>"+(K[m]||[]).map(function(x){return "• "+x}).join("<br>");if(checks===0){el("rank").textContent="EXPLORER";var lk=[];LS.S.forEach(function(x){var d=document.createElement("div");d.innerHTML=x.b||"";Array.prototype.forEach.call(d.querySelectorAll("a"),function(a){lk.push("<a href=\""+a.getAttribute("href")+"\" target=\"_blank\" rel=\"noopener\">"+a.textContent+"</a>")})});el("verdict").innerHTML="All the links in one place:<br>"+lk.join("<br>");el("out").style.display="none";Array.prototype.forEach.call(document.querySelectorAll("#final button, #final p"),function(x){if(x.id!=="verdict")x.style.display="none"});el("keys").style.display="none";}
