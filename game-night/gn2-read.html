var K={"1": ["Taking turns: you see each move before you choose.", "Backward induction: start at the end and work back.", "Race to 21 key numbers: 1, 5, 9, 13, 17, 21.", "Some games give the first player a sure win; some give it to the second."], "2": ["Start with the smallest case (2 pirates) and build up.", "Each pirate compares your offer with what they'd get from the next captain.", "Buy the cheapest votes: pirates who'd get 0 otherwise.", "Always ask: what happens if my plan fails?"], "3": ["Each pass doubles the pot but hands your partner the next move.", "Backward induction says take right away.", "Real people usually pass, and often earn more.", "Read your partner: take one turn before they would."], "4": ["A threat is credible only if carrying it out helps the one making it.", "Test: after you act, would they really follow through?", "Contracts, burned bridges and reputation can make threats real.", "Shouting louder doesn't change the payoffs."], "5": ["Coin logic: offer 1, accept anything above 0.", "Real people often offer 4-5 and reject very low offers.", "Fairness is part of many people's payoff.", "Best offer: the smallest one your partner will actually accept."], "6": ["Second-price auction: bid exactly what it's worth to you.", "Your bid decides if you win; the second-highest bid sets the price.", "Winner's curse: when everyone's guessing, the winner probably guessed too high.", "Hidden value: bid below your guess."], "7": ["Both-pay auctions can push bids past the prize's value.", "Sunk costs are gone either way: ignore them.", "Decide your limit before you start.", "Against someone who never quits, the best move is not to start."], "8": ["Work backward · Buy the cheapest votes · Trust has a price · Empty threat", "Fair enough? · True value bid · Sunk cost"]};
(function(){var ADD={"1": {"h": "CHANGE THE RULES", "b": "Change the rules and the key numbers change. If you can add 1 or 2 and the goal is 10, the key numbers are 10, 7, 4 and 1.<br><br>The gap between key numbers is always <b>one more than the biggest step</b> you're allowed. Steps of 1 to 3 give a gap of 4; steps of 1 to 2 give a gap of 3."}, "2": {"h": "SMALLEST CASE FIRST", "b": "Working up from the smallest case is a trick mathematicians use all the time. When a problem looks huge, shrink it. What if there were only 2 pirates? Then 3? Each answer becomes a stepping stone for the next.<br><br>In math class you'll meet a cousin of this idea called <b>proof by induction</b>."}, "3": {"h": "WHY DO PEOPLE PASS?", "b": "People might pass because they hope their partner is generous, because they want to be someone who shares, or because they doubt the other player will reason all the way back.<br><br>If you think your partner will pass, passing yourself can be smart. Being \"too logical\" can leave points on the table."}, "4": {"h": "SPOT THE EMPTY THREAT", "b": "Ask one question: when the moment comes, would carrying out the threat actually help the person making it?<br><br>\"Clean your room or no phone tonight\" is easy to carry out, so it's believable. \"Do that again and we're canceling the whole vacation\" usually isn't, because the family would lose the vacation too."}, "5": {"h": "WHAT WOULD YOU OFFER?", "b": "Picture a real split with a friend. Offering 1 of 10 is risky: many people would rather get nothing than accept an insulting deal. Offering 5 is safe but generous.<br><br>Many real offers land around 4 or 5, because people who propose expect others to care about fairness, not just coins."}, "6": {"h": "WHY HONEST BIDS WIN", "b": "In a second-price auction, bidding <b>more</b> than your value can make you win something at a price above what it's worth to you. Bidding <b>less</b> can make you lose something you'd have happily paid for.<br><br>Bidding exactly your value never does either, so it's the best plan no matter what anyone else bids."}, "7": {"h": "HOW TO AVOID THE TRAP", "b": "Before a bidding war starts, set your limit: the most the prize is worth to you. Then stick to it, even after you've already paid a lot.<br><br>Ask yourself: \"If I were starting fresh right now, would I pay this much more?\" If not, walk away. What you've already spent is gone either way."}, "8": {"h": "THE BIG PICTURE", "b": "<b>Look ahead, reason back.</b> Start at the end, find the best moves there, and work backward to today. Then remember that real people care about fairness and pride, so the coldly \"logical\" move isn't always the winning one."}};for(var k in ADD){var S=L[k]&&L[k].S;if(!S)continue;var i=S.length-1;if(k==='8'){for(var j=0;j<S.length;j++){if(S[j].q){i=j;break}}}S.splice(i,0,ADD[k]);}})();


(function(){var DEEP={"1": {"h": "NERD ZONE: WINNING SPOTS", "b": "Race to 21 is a <b>combinatorial game</b>: two players, no luck, no hidden information. Mathematicians label every position. A <b>P-position</b> means the player who just moved will win with perfect play; an <b>N-position</b> means the next player will.<br><br>The key numbers are the P-positions. Every move from a P-position lands on an N-position, and every N-position has a move back to a P-position.", "q": "In Race to 21, is 17 a P-position or an N-position?", "o": ["P-position: the player who just said 17 wins with perfect play", "N-position: the next player wins", "Neither"], "a": 0, "w": "From 17, every move lands on 18-20, and from there the player who said 17 can reach 21."}, "2": {"h": "NERD ZONE: WHAT EVERY PIRATE MUST KNOW", "b": "The pirate answer only works if every pirate is perfectly logical and greedy, knows the others are too, knows that they know, and so on. Game theorists call this <b>common knowledge of rationality</b>, the same idea behind the two-thirds game.<br><br>If even one pirate might vote out of anger, the \"cheapest votes\" plan can fail. A lot of modern economics studies what happens when that assumption breaks.", "q": "What does \"common knowledge of rationality\" mean?", "o": ["Everyone is logical, knows the others are, knows they know, and so on", "Every pirate can count to 100", "The pirates talk before they vote"], "a": 0, "w": "The pirate solution needs that whole chain of \"I know that you know.\""}, "3": {"h": "NERD ZONE: A PARADOX", "b": "Game theorists still argue about this one. Backward induction says take at turn 1, because your partner would take at turn 2. But if turn 2 ever happens, you just passed, so you weren't perfectly logical. Why should your partner expect you to be logical later?<br><br>The plan depends on what players believe <b>after something \"impossible\" happens</b>. Whole research papers have been written about it.", "q": "Why do game theorists call the centipede game a paradox?", "o": ["Anyone who reaches turn 2 has already broken the \"take now\" logic", "Nobody can ever win it", "The pot shrinks every turn"], "a": 0, "w": "The plan depends on what players believe after something \"impossible\" happens."}, "4": {"h": "NERD ZONE: THE CHAIN-STORE PARADOX", "b": "In 1978 Selten imagined a store chain in 20 towns, with a rival opening in one town at a time. Should the chain fight to scare the others? Backward induction says no: in the last town there's nobody left to scare, so it won't fight there, and the logic unravels all the way back to town 1.<br><br>Yet real chains do fight. Later work in 1982 showed why: a little doubt about how tough the chain really is makes building a reputation worth the cost.", "q": "In Selten's chain-store story, why does backward induction say never fight?", "o": ["In the last town nobody is left to scare, and that logic unravels back to town 1", "Fighting is always free", "Rivals never open stores"], "a": 0, "w": "Each town's fight can't change what happens later, so it never pays. Real chains fight anyway, to build a reputation."}, "5": {"h": "NERD ZONE: BACK-AND-FORTH BARGAINING", "b": "Real bargaining usually goes back and forth. In 1982 the economist Ariel Rubinstein solved a game where players take turns making offers and waiting costs both sides.<br><br>Rubinstein showed the game has exactly one equilibrium outcome: they agree right away, and the more <b>patient</b> player gets the bigger share. If both are equally patient and offers come quickly, the split gets close to 50/50.", "q": "In Rubinstein's bargaining game, who gets the bigger share?", "o": ["The more patient player", "Whoever offers second", "Whoever makes the lowest offer"], "a": 0, "w": "Waiting hurts the impatient player more, so the patient one can hold out for more."}, "6": {"h": "NERD ZONE: FOUR AUCTIONS, ONE ANSWER?", "b": "Economists study four classic auctions: <b>English</b> (prices rise out loud), <b>Dutch</b> (prices fall until someone calls out), <b>first-price sealed</b> (the top bid pays its bid), and <b>second-price sealed</b> (Vickrey).<br><br>The <b>revenue equivalence theorem</b>, built on work by Vickrey (1961), Roger Myerson (1981), and John Riley and William Samuelson (1981), shows that under certain conditions the seller expects the same money from all four. Bidders bid lower in some formats, and it evens out.", "q": "Which auction works like a second-price auction for bidders?", "o": ["English: prices rise out loud", "Dutch: prices fall until someone calls out", "First-price sealed"], "a": 0, "w": "In a rising auction you stay in until your value, and the winner pays about the second-highest value."}, "7": {"h": "NERD ZONE: THE WAR OF ATTRITION", "b": "A contest where everyone pays while they stay in, and the last one standing wins, is called a <b>war of attrition</b>. The biologist John Maynard Smith studied it in animals in 1974.<br><br>In the simplest version, the equilibrium is a <b>mixed strategy</b>: each player quits at a random time, and on average the total spent eats up about the whole prize. That's why wars of attrition are so wasteful.", "q": "In a war of attrition, what usually happens to the prize's value?", "o": ["Most of it gets eaten up by what players spend staying in", "It doubles", "The first player to quit gets it"], "a": 0, "w": "On average, the cost of staying in uses up about the whole prize."}, "8": {"h": "NERD ZONE: WHERE YOU ARE", "b": "Game Night 2 covered <b>dynamic games</b>: game trees, backward induction, and <b>subgame perfect equilibrium</b>, Selten's name for plans that make sense at every step.<br><br>Ultimatums belong to <b>bargaining theory</b>. Auctions belong to <b>mechanism design</b>: writing rules so that people's own choices lead to a good result. Mechanism design won the 2007 Nobel Prize in economics (Hurwicz, Maskin and Myerson).", "q": "Mechanism design is about...", "o": ["Writing rules so people's own choices lead to a good result", "Building machines that play games", "Finding the best chess move"], "a": 0, "w": "Auction rules are a classic example: the right rules make honest bidding the smart move."}};var GD=[{"h": "YOU DID IT!", "b": "You've learned how to think ahead: backward induction, credible threats, fair deals, smart bidding and sunk costs.<br><br><b>Before you move on to Game Night 3</b>, here's how to go deeper on <b>Part 2</b> if you're curious."}, {"h": "WATCH THE LECTURES FOR PART 2", "b": "These lectures from <b>Yale's free Game Theory course (ECON 159)</b>, taught by Professor Ben Polak, match Part 2:<br><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-13\" target=\"_blank\" rel=\"noopener\">Lecture 13: Sequential Games: Moral Hazard, Incentives, and Hungry Lions</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-14\" target=\"_blank\" rel=\"noopener\">Lecture 14: Backward Induction: Commitment, Spies, and First-Mover Advantages</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-15\" target=\"_blank\" rel=\"noopener\">Lecture 15: Backward Induction: Chess, Strategies, and Credible Threats</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-16\" target=\"_blank\" rel=\"noopener\">Lecture 16: Backward Induction: Reputation and Duels</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-17\" target=\"_blank\" rel=\"noopener\">Lecture 17: Backward Induction: Ultimatums and Bargaining</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-20\" target=\"_blank\" rel=\"noopener\">Lecture 20: Subgame Perfect Equilibrium: Wars of Attrition</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-24\" target=\"_blank\" rel=\"noopener\">Lecture 24: Asymmetric Information: Auctions and the Winner's Curse</a><br><br>It's college-level: a big step up, and a great challenge."}, {"h": "TRY IT AT HOME", "b": "<b>Race to a new number:</b> play to 30 adding 1 to 4. Can you
