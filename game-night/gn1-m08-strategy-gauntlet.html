<head>

<title>Strategy Gauntlet</title>
<style>
  body{margin:0;background:#07070f;color:#e8f7ff;font-family:"Courier New",monospace;padding:14px;text-align:center}

  .note{font-size:14px}

  button.mini{min-width:28px !important;padding:1px 4px !important;margin:2px 1px !important;font-size:13px !important;border-width:2px !important;box-shadow:0 0 0 2px #5e0b17,0 3px 0 2px #3a0610 !important}
  button.mini2{min-width:54px !important}

  .nash td.act{background:rgba(255,233,168,.16);cursor:pointer;outline:2px dashed #ffe9a8;outline-offset:-4px}
  .nash td.lock{background:rgba(247,201,72,.28);box-shadow:inset 0 0 12px rgba(247,201,72,.8)}
  .ring{display:inline-block;border:2px solid #ffd84d;border-radius:50%;padding:0 6px;color:#ffe9a8}
  .locktxt{font:11px "Bungee","Arial Black",sans-serif;color:#ffd84d;letter-spacing:1px}
  .ladder{display:inline-block;margin:6px auto;text-align:left}
  .rung{padding:5px 14px;margin:3px 0;border-left:4px solid #555;background:rgba(0,0,0,.3);border-radius:6px;font-size:14px;color:#aaa}
  .rung.on{border-left-color:#ffd84d;color:#fff7e6}

  .barrow{display:flex;align-items:center;gap:8px;margin:8px auto;max-width:520px;text-align:left}
  .bl{min-width:150px;font-size:13px}
  .track{flex:1;height:18px;background:rgba(0,0,0,.4);border-radius:9px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#38d17f,#7dff9e)}
  .fill.low{background:linear-gradient(90deg,#d7263d,#ff8a8a)}

</style>
<style>

 background:

 color:#fff2b3 !important;background:#1a0610;border:3px solid var(--gold);text-shadow:0 0 10px #ffb300,0 0 22px #ff6a00 !important;animation:jackpot 1.4s ease-in-out infinite;box-shadow:0 0 0 4px #4a1020,0 0 26px rgba(255,179,0,.55)}

<body>
<h1>STRATEGY GAUNTLET</h1>
<p class="note">Boss round! The Dealer has 8 HP. Each puzzle you crack knocks off 1 HP. Two tries per puzzle.</p>
<div class="bar">
  <div class="box">ROUND<b id="rn">1/8</b></div>
  <div class="box">DEALER HP<b id="hp">8</b></div>
</div>
<div class="hpbar"><div id="hpfill"></div></div>

<div id="pick">
  <p class="taunt" id="taunt"></p>
  <h2 id="rtitle"></h2>
  <div id="scene"></div>
  <p id="q"></p>
  <div id="choices"></div>
  <p class="msg" id="fb"></p>
  <button class="big" id="next" style="display:none" onclick="nextRound()">NEXT ROUND</button>
</div>

<div id="final">
  <h1 id="endt">GAUNTLET OVER</h1>
  <div id="verdict"></div>
  <p>Copy your results, then paste them to Rocky in the chat.</p>
  <textarea id="out" readonly></textarea><br>
  <button class="big" onclick="copyIt()">COPY MY RESULTS FOR ROCKY</button>
  <p class="note" id="status"></p>
</div>

<script>
function g2(rl,cl,rm,cm,cells){var h="<table class=\"grid\"><tr><th>"+rl+" \\ "+cl+"</th><th>"+cm[0]+"</th><th>"+cm[1]+"</th></tr>";
  for(var r=0;r<2;r++){h+="<tr><th>"+rm[r]+"</th><td>"+cells[r][0]+"</td><td>"+cells[r][1]+"</td></tr>"}return h+"</table><p class=\"note\">First number: "+rl+". Second number: "+cl+".</p>"}
var R=[
 {t:"ROUND 1: WHAT'S IN A GAME?",taunt:"\"Every game has rules, kid. Let's see if you know them.\"",
  scene:"<div class=\"story\">Rock-paper-scissors: two players, three hand shapes, both shown at the same moment.</div>",
  q:"Which of these is a <b>payoff</b> in rock-paper-scissors?",ch:["Choosing rock","Winning, losing or tying","The two players","Not seeing the other hand early"],a:1,
  why:"Payoffs are what each player gets at the end: a win, a loss or a tie. Rock is a move, the two people are the players, and not seeing the other hand is about information."},
 {t:"ROUND 2: THE DOMINANT MOVE",taunt:"\"Bet you can't spot a sure thing when you see one.\"",
  scene:g2("You","Rival",["PRACTICE","SKIP"],["PRACTICE","SKIP"],[["3, 3","5, 1"],["1, 5","2, 2"]])+"<div class=\"story\">Before a race, you and a rival each decide to practice or skip. Points show how happy each of you is with the result.</div>",
  q:"Do <b>you</b> have a dominant move?",ch:["Yes: PRACTICE","Yes: SKIP","No dominant move"],a:0,
  why:"If the rival practices, you get 3 for practicing vs 1 for skipping. If the rival skips, you get 5 vs 2. Practicing wins both times, so it's dominant."},
 {t:"ROUND 3: FIND THE LOCK",taunt:"\"Two friends, one plan, no phones. Good luck.\"",
  scene:g2("Jo","Sam",["MOVIE","ARCADE"],["MOVIE","ARCADE"],[["3, 2","0, 0"],["0, 0","2, 3"]])+"<div class=\"story\">Jo and Sam want to hang out but can't text. Jo likes the movie more, Sam likes the arcade more, and going alone is worth 0 to both.</div>",
  q:"Which outcomes are <b>Nash equilibria</b> (nobody wants to switch alone)?",ch:["Only MOVIE-MOVIE","Only ARCADE-ARCADE","Both MOVIE-MOVIE and ARCADE-ARCADE","None of them"],a:2,
  why:"At MOVIE-MOVIE, switching alone drops Jo from 3 to 0 and Sam from 2 to 0. At ARCADE-ARCADE, switching drops Jo from 2 to 0 and Sam from 3 to 0. Both are locks; the mixed-up outcomes are not, because either friend would rather switch to join the other."},
 {t:"ROUND 4: LEVEL UP",taunt:"\"Everyone thinks they're the smart one at my table.\"",
  scene:"<div class=\"story\">New game: everyone picks a number from 0 to 100. Closest to <b>HALF</b> of the average wins. You know everyone else is a Level 1 player: they assume the crowd picks at random (average about 50) and guess half of that. Ignore your own guess's effect on the average.</div>",
  q:"What should <b>you</b> guess?",ch:["50","25","About 12","0"],a:2,
  why:"Level 1 players guess half of 50 = 25. If everyone guesses about 25, the average is about 25, and half of that is about 12. You beat the crowd by being exactly one level smarter."},
 {t:"ROUND 5: THE BEACH",taunt:"\"Pick your spot. I'll pick mine right next to yours.\"",
  scene:"<div class=\"story\">Two ice-cream trucks park on a long beach marked 1 to 9. Swimmers are spread evenly along it, and each one walks to the nearer truck. Each day, each truck can move to grab more customers.</div>",
  q:"If both trucks keep moving to win more customers, where do they end up?",ch:["One at 1, one at 9","Both near 5, the middle","One at 3, one at 7","Wherever they started"],a:1,
  why:"A truck can always win more customers by sliding toward the other truck from the outside. The only spot where neither can gain by moving is side by side in the middle: the median magnet."},
 {t:"ROUND 6: KEEP 'EM GUESSING",taunt:"\"I can read you like an open hand.\"",
  scene:g2("Your shot","Keeper guesses",["LEFT","RIGHT"],["LEFT","RIGHT"],[["40%","80%"],["70%","30%"]])+"<div class=\"story\">You take a shot LEFT or RIGHT; the keeper guesses a side. Each box is your chance to score. The keeper studies you and always guesses the side that hurts you most.</div>",
  q:"Which plan makes the keeper's guess not matter?",ch:["Always shoot LEFT","Shoot LEFT half the time","Shoot LEFT 3 times out of 4","Always shoot RIGHT"],a:1,
  why:"Shooting LEFT half the time: if the keeper guesses LEFT you score 0.5×40 + 0.5×70 = 55%; if RIGHT, 0.5×80 + 0.5×30 = 55%. Same either way, so the keeper can't exploit you. Any fixed side gets read and drops to 40% or 30%."},
 {t:"ROUND 7: PRICE WAR",taunt:"\"Undercut me? Cute. Let's see your math.\"",
  scene:"<div class=\"story\">Two stands sell the exact same phone case. Each case costs $2 to make. Every buyer goes to the cheaper stand; if prices tie, buyers split evenly. Your rival is charging <b>$6</b>.</div>",
  q:"Which of these prices earns <b>you</b> the most profit?",ch:["$7","$6","$5","$2"],a:2,
  why:"At $5 you get every buyer and make $3 each. At $6 you split the buyers and make $4 each, which is only $2 per buyer on average. At $7 you sell nothing, and at $2 you make nothing. So $5 wins, and that's how price wars start."},
 {t:"ROUND 8: FINAL HAND",taunt:"\"Last hand. Everything you've learned, all at once.\"",
  scene:g2("Kai","Rio",["CLEAN","SKIP"],["CLEAN","SKIP"],[["3, 3","1, 4"],["4, 1","2, 2"]])+"<div class=\"story\">Kai and Rio share a room. Each decides to clean or skip. A clean room is nice, but each would rather the other do the work.</div>",
  q:"If each just picks their own best move, where does it settle?",ch:["Both clean","Both skip","One cleans, one skips","You can't tell"],a:1,
  why:"Skipping is dominant for both: 4 beats 3 if the other cleans, and 2 beats 1 if the other skips. So both skip and get 2, even though both cleaning would give each of them 3. It's a Prisoner's Dilemma in disguise."}
];
var r=0,hp=8,tries=0,log=[],locked=false;
function el(i){return document.getElementById(i)}
function show(id,on){el(id).style.display=on?"block":"none"}
function setHP(){el("hp").textContent=hp;el("hpfill").style.width=(hp/8*100)+"%"}
function setup(){
  var x=R[r];tries=0;locked=false;
  el("rn").textContent=(r+1)+"/8";el("taunt").textContent="THE DEALER: "+x.taunt;el("rtitle").textContent=x.t;
  el("scene").innerHTML=x.scene;el("q").innerHTML=x.q;el("fb").innerHTML="";show("next",false);
  var h="";x.ch.forEach(function(c,i){h+="<button id=\"c"+i+"\" onclick=\"pick("+i+")\">"+c+"</button>"});el("choices").innerHTML=h;
  show("pick",true);
}
function pick(i){
  if(locked)return;locked=true;var x=R[r];tries++;
  el("fb").innerHTML="The Dealer flips the card...";
  setTimeout(function(){
    if(i===x.a){hp--;setHP();log.push("R"+(r+1)+":"+(tries===1?"hit":"hit on try 2"));
      el("c"+i).className="on";el("fb").innerHTML="<b>HIT!</b> The Dealer loses 1 HP. "+x.why;endRound();}
    else if(tries>=2){log.push("R"+(r+1)+":miss");el("c"+i).disabled=true;el("c"+x.a).className="on";
      el("fb").innerHTML="<b>The Dealer blocks it.</b> The answer: "+x.ch[x.a]+". "+x.why;endRound();}
    else{el("c"+i).disabled=true;el("fb").innerHTML="<b>Miss!</b> One more try. Look at the numbers again.";locked=false;}
  },650);
}
function endRound(){
  for(var k=0;k<R[r].ch.length;k++){var b=el("c"+k);if(b)b.disabled=true}
  el("next").textContent=(r===7)?"SEE THE FINAL TABLE":"NEXT ROUND";show("next",true);
}
function nextRound(){r++;if(r>=8){finish();return}setup()}
function finish(){
  show("pick",false);var hits=8-hp;
  var rank=hits===8?"HIGH ROLLER":(hits>=6?"CARD SHARP":(hits>=4?"TABLE REGULAR":"NEWCOMER"));
  el("endt").textContent=hp===0?"THE DEALER IS BROKE!":"GAUNTLET OVER";
  var rows="";log.forEach(function(s,i){rows+="<tr><td>"+R[i].t.replace(/^ROUND \d+: /,"")+"</td><td>"+s.split(":")[1]+"</td></tr>"});
  el("verdict").innerHTML="<div class=\"rank\">RANK: "+rank+"</div><p>You knocked off <b>"+hits+"</b> of 8 HP. Dealer HP left: <b>"+hp+"</b>.</p><table><tr><th>Puzzle</th><th>Result</th></tr>"+rows+"</table>"+
   "<div class=\"tape\">Card unlocked: <b>STRATEGIST</b>. <a href=\"gn1-deck.html?card=8\">Open your Strategy Deck</a> to see it.</div>";
  el("out").value="GN1-M08 | round results: "+log.join(", ")+" | Dealer HP left "+hp;
  show("final",true);
}
