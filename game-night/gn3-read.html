<script>
function T(rows){return "<table>"+rows.map(function(r,i){return "<tr>"+r.map(function(c){return i===0||c===r[0]?"<th>"+c+"</th>":"<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</table>"}
var PD=T([["You ↓ · Them →","SHARE","GRAB"],["SHARE","You 3, Them 3","You 0, Them 5"],["GRAB","You 5, Them 0","You 1, Them 1"]]);
var HD=T([["You ↓ · Rival →","HAWK","DOVE"],["HAWK","-5","10"],["DOVE","0","5"]]);
var L={
1:{t:"TIT FOR TAT",s:"Lesson 1 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"<b>Your bot just learned that grabbing is great right up until round two.</b><br><br>Your bot played Share or Grab against every other bot, <b>10 rounds</b> each. Unlike Game Night 1, partners met again and again, so every move could be paid back next round."+PD},
 {h:"THE BIG IDEA: THE SHADOW OF THE FUTURE",b:"In a <b>repeated game</b> you meet the same player again and again, so today's move can be paid back tomorrow. Robert Axelrod called this the <b>shadow of the future</b>: the longer the future, the more cooperating pays.<br><br>Watch it with Copycat Cora, who shares in round 1 and then copies your last move. Your total score:<table class='sm'><tr><th>Match length</th><th>Always share</th><th>Always grab</th></tr><tr><td><b>1 round</b></td><td>3</td><td>5</td></tr><tr><td><b>3 rounds</b></td><td>9 (3+3+3)</td><td>7 (5+1+1)</td></tr><tr><td><b>10 rounds</b></td><td>30</td><td>14 (5+9)</td></tr></table><p>With one round, grabbing wins. From round 2 on, Cora grabs back, and sharing keeps paying 3 a round while grabbing pays 1. By round 3 sharing has pulled ahead.</p><p class='why'><b>Why it matters:</b> a restaurant that wants you back next week has a reason to be honest today.</p>"},
 {h:"QUICK CHECK",q:"Against Copycat Cora, what is the shortest match in which always sharing beats always grabbing?",o:["1 round", "2 rounds", "3 rounds"],a:2,w:"1 round: grabbing wins, 5 to 3. 2 rounds: a tie, 6 to 6. 3 rounds: sharing wins, 9 to 7, and the gap keeps growing."},
 {h:"THE BIG IDEA: TIT FOR TAT WINS ON TOTAL",b:"<b>Tit for Tat</b> shares in round 1, then copies whatever you did last round. It never grabs first, so it can never beat a partner in a single match. So how does it win a tournament? By adding up.<br><br>Scores of three bots against the five bots in your arena (10 rounds each). The four nice ones are Sam, Cora, Greta and Fiona:<table class='sm'><tr><th>Bot</th><th>vs the 4 nice bots</th><th>vs Grabby Gus</th><th>Total</th></tr><tr><td><b>Tit for Tat</b></td><td>30 + 30 + 30 + 30 = 120</td><td>9</td><td>129</td></tr><tr><td><b>Always Share</b></td><td>120</td><td>0</td><td>120</td></tr><tr><td><b>Always Grab</b></td><td>50 + 14 + 14 + 18 = 96</td><td>10</td><td>106</td></tr></table><p>Tit for Tat gets 30 from every nice bot and loses only a little to Gus (9 to 14). Always Grab farms Saint Sam (50), then gets about 1 a round from everyone else.</p><p class='why'><b>Why it matters:</b> in Axelrod's real tournaments the winner was nice and could never beat a partner in a single match. It won on total.</p>"},
 {h:"QUICK CHECK",q:"In a single match, can Tit for Tat ever score MORE than the bot it's playing?",o:["Yes, whenever the other bot is nice","No, it can only tie or trail","Only against Saint Sam"],a:1,w:"Tit for Tat never grabs first, so it can tie or fall a little behind, but never get ahead. It wins tournaments by adding up lots of good matches."},
 {h:"THE REAL TOURNAMENT",b:"Around 1980 the political scientist Robert Axelrod invited experts to send in computer programs to play the repeated Prisoner's Dilemma against each other.<br><br>The winner was one of the shortest programs sent in, only a few lines long: <b>Tit for Tat</b>, by the mathematical psychologist Anatol Rapoport. Axelrod ran a second, bigger tournament. Tit for Tat won again."},
 {h:"WHY TIT FOR TAT WORKS",r:[["NICE","It never grabs first, so it gets lots of 3-point rounds with other nice players."],["QUICK TO HIT BACK","It grabs right after you grab, so it isn't a pushover."],["QUICK TO FORGIVE","As soon as you share again, it shares again."],["CLEAR","It's easy to figure out, so other players learn that sharing pays."]]},
 {h:"TRY IT",q:"Which bot in your arena was nice but NOT quick to hit back?",o:["Copycat Cora","Saint Sam","Grudge Greta"],a:1,w:"Saint Sam shared no matter what, so grabbers took advantage of him every round."},
 {h:"TRUCES IN THE TRENCHES",b:"In his 1984 book <i>The Evolution of Cooperation</i>, Axelrod described soldiers in World War I trenches who faced the same enemy unit for months. In some places, both sides quietly held back, a system called \"live and let live,\" and answered any attack with an attack. It was Tit for Tat with real stakes."},
 {h:"A LITTLE FORGIVENESS",b:"In real life, moves get misread. A friend's \"grab\" might be an accident. Strict Tit for Tat can get stuck in a revenge loop after one mistake: picture two Copycat players. In round 2 one slips and grabs. In round 3 the other grabs back. In round 4 the first grabs back at that. And on it goes, each averaging 2.5 a round instead of 3. Forgiving Fiona (Tit for Two Tats) only hits back after two grabs in a row, so one accident doesn't start a feud.<br><br><b>An honest caveat:</b> forgiveness isn't a magic cure. In the game's oops round (5% slips, 50 rounds) Fiona averaged a little more than strict Tit for Tat (about 563 vs 551) and clearly more than Always Grab (about 517), but she finished ahead of strict Tit for Tat in only about 6 runs out of 10. With lots of slips and short matches, grabbers and grudge-holders can do better. Forgiveness pays most when mistakes happen and the game lasts a long time."},
 {h:"LAST CHECK",q:"A friend breaks a promise once, then apologizes and keeps the next one. What does Tit for Tat do?",o:["Never trust them again, whatever they do","Hit back once, then go back to sharing","Keep sharing and never react to it"],a:1,w:"Quick to hit back, quick to forgive: that's the Tit for Tat way."}]},
2:{t:"TRUST ME",s:"Lesson 2 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"<b>You just found out how much a stranger's trust is worth, and how fast it can vanish.</b><br><br>First you were the <b>sender</b>: every coin you sent to Robin was tripled, and Robin chose what to send back. Then you were the <b>receiver</b>, and Max had to decide whether to trust you."},
 {h:"THE BIG IDEA: TRUST PAYS BECAUSE PILES GROW",b:"<b>Trust</b> means handing something valuable to someone who could just keep it. It is worth the risk when it makes the pile <b>grow</b>: here, every coin you send triples.<br><br>Part A, four rounds, 10 coins each round. Robin returns a third of the pile to a stranger, but half once you have sent 6 or more:<table class='sm'><tr><th>Plan</th><th>Round 1</th><th>Rounds 2-4</th><th>Total</th></tr><tr><td><b>Send 0</b></td><td>keep 10</td><td>10 each</td><td>40</td></tr><tr><td><b>Send 10</b></td><td>30 arrives, Robin returns 10</td><td>30 arrives, Robin returns 15</td><td>10 + 15 + 15 + 15 = 55</td></tr></table><p>Step by step: you send 10 and 30 arrives. In round 1 Robin returns a third, 10, so you only break even. Robin remembers, and from round 2 returns half, 15, which beats keeping your 10.</p><p class='why'><b>Why it matters:</b> loans, trade and group projects all start with someone going first, and both sides end up with more.</p>"},
 {h:"QUICK CHECK",q:"You send 6 coins. They triple, and your partner sends back half. How many come back?",o:["3","9","18"],a:1,w:"6 × 3 = 18 for your partner. Half of 18 is 9, so you turned 6 into 9."},
 {h:"THE BIG IDEA: REPUTATION IS MEMORY",b:"Your partner remembers what you did. That memory is your <b>reputation</b>, and it decides what you are offered next.<br><br>In Part B you are the receiver. Max sends 6 in round 5, then 10 if you returned half or more. If you keep it all, he never sends again. Your coins, rounds 5 to 8:<table class='sm'><tr><th>Plan</th><th>R5</th><th>R6</th><th>R7</th><th>R8</th><th>Total</th></tr><tr><td><b>Return half</b></td><td>9</td><td>15</td><td>15</td><td>15</td><td>54</td></tr><tr><td><b>Keep all in R5</b></td><td>18</td><td>0</td><td>0</td><td>0</td><td>18</td></tr></table><p>Keeping everything looked like +9 that day (18 instead of 9), but it turned 54 into 18. A good reputation is worth more than one big grab, as long as there is a tomorrow.</p><p class='why'><b>Why it matters:</b> lenders, shops and friends all remember how you treated them last time.</p>"},
 {h:"THE TRUST GAME",b:"In 1995 the economists Joyce Berg, John Dickhaut and Kevin McCabe ran this game with real people and real money. Players never met and never learned who their partner was.<br><br>Cold logic says: the receiver will keep everything, so send nothing. But 30 of the 32 senders trusted a stranger with some money, about half of it on average."},
 {h:"TRY IT",q:"In round 5 you returned half, so in round 6 Max sends 10, which triples to 30. Suppose you keep ALL 30 in round 6. What is your Part B total?",o:["39", "54", "30"],a:0,w:"9 + 30 = 39, and then Max sends nothing in rounds 7 and 8. Returning half every time earns 54."},
 {h:"THE LAST-ROUND PROBLEM",b:"In the final round, there's no future to protect, so keeping it all is tempting: in round 8 of the game, keeping all of Max's 30 would beat returning half by 15 coins (69 in Part B instead of 54). And if you think ahead, your partner might expect that and send less at the end.<br><br>This is why trust grows best when relationships <b>don't have a known last day</b>."},
 {h:"QUICK CHECK",q:"When is the temptation to break trust the strongest?",o:["The first round","The middle rounds","The last round"],a:2,w:"With no next round, there's no reputation left to lose."},
 {h:"STARS AND REVIEWS",b:"How do strangers on the internet trust each other? Sites like eBay added buyer and seller ratings in the 1990s. A good rating is a reputation everyone can see, so it pays to stay honest even with someone you'll never meet again."},
 {h:"LAST CHECK",q:"A new classmate wants to borrow your favorite charger. What's the trust-builder move?",o:["Lend something small first and see if it comes back","Refuse to lend anything, ever, to anyone new","Lend your favorite things right away to prove trust"],a:0,w:"Start small, watch how they repay you, and build from there."}]},
3:{t:"HAWK OR DOVE",s:"Lesson 3 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"<b>Birds just solved a math problem without knowing any math.</b><br><br>They met over food worth 10. Hawks fight; doves back down. Then you watched a whole flock change, generation after generation."+HD},
 {h:"WHERE DOES -5 COME FROM?",b:"A fight over food worth 10 has a winner and a loser. Two hawks are equally strong, so each wins half the time. The winner takes the 10. The loser pays the <b>fight cost</b>: the injury points a fight takes from the loser. Here the fight cost is 20.<br><br>So a hawk meeting a hawk gets 10 half the time and loses 20 the other half:<br><b>½ × 10 + ½ × (−20) = −5</b>, which is the same as <b>(10 − 20) ÷ 2 = −5</b>."},
 {h:"THE BIG IDEA: THE EVOLUTIONARILY STABLE STRATEGY",b:"A strategy is <b>evolutionarily stable</b> (an <b>ESS</b>) when a population using it can't be taken over by a few newcomers who play differently. Food is worth 10 and a fight costs 20. Test three flocks:<table class='sm'><tr><th>Flock</th><th>A hawk gets</th><th>A dove gets</th><th>Who spreads?</th></tr><tr><td><b>All hawks</b></td><td>-5</td><td>0</td><td>Doves (0 beats -5)</td></tr><tr><td><b>All doves</b></td><td>10</td><td>5</td><td>Hawks (10 beats 5)</td></tr><tr><td><b>Half and half</b></td><td>2.5</td><td>2.5</td><td>Neither: stable</td></tr></table><p>A lone dove in a hawk flock dodges every fight, so doves spread. A lone hawk in a dove flock wins every meal, so hawks spread. The flock is pulled to the mix in the middle, where nobody gains by switching. Birds that score more have more chicks.</p><p class='why'><b>Why it matters:</b> this is how biologists began to explain why animal contests so often stop short of all-out fighting.</p>"},
 {h:"QUICK CHECK",q:"Food is worth 10 and a fight costs 20. In a flock where only 1 bird in 4 is a hawk, which type scores more on average, and what happens over the generations?",o:["Hawks score more, so hawks become more common", "Doves score more, so doves become more common", "They score the same, so nothing changes"],a:0,w:"A hawk averages ¼ × (-5) + ¾ × 10 = 6.25. A dove averages ¼ × 0 + ¾ × 5 = 3.75. Hawks do best when they are rare, so they spread until the two scores meet at half hawks."},
 {h:"THE BALANCE POINT",b:"Hawks do best when they're rare. Doves do best when hawks are common. So the flock settles where both score the <b>same</b>.<br><br>Let's check it at <b>half hawks</b> (fight cost 20). A hawk averages ½ × (−5) + ½ × 10 = <b>2.5</b>. A dove averages ½ × 0 + ½ × 5 = <b>2.5</b>. Equal scores, so nobody gains by switching.<br><br>That's why <b>share of hawks = food ÷ fight cost</b> — when a fight costs <b>more</b> than the food. If fighting is cheaper than the food, everyone becomes a hawk."},
 {h:"WORKED EXAMPLE",r:[["FIGHT COST 20","10 ÷ 20 = 1/2. Half hawks."],["FIGHT COST 30","10 ÷ 30 = 1/3. A third hawks."],["THE PATTERN","The more fights hurt, the fewer hawks. (This works when a fight costs more than the food, 10. If it cost less, every bird would fight.)"]]},
 {h:"TRY IT",q:"Food is worth 10. When a fight costs more than the food, the share of hawks settles at food ÷ fight cost. If fights cost 50, where does the share of hawks settle?",o:["50%","20%","10%"],a:1,w:"10 ÷ 50 = 1/5, or 20% hawks."},
 {h:"WHO FOUND THIS?",b:"In 1973 the biologists John Maynard Smith and George Price used games like this to ask why animal fights are so often more show than injury. Maynard Smith and Price named the settled mix an <b>evolutionarily stable strategy</b>, and biologists still use the idea today."},
 {h:"NOBODY IS CHOOSING",b:"Birds don't do math. (Evolution never did its homework; it just keeps whatever works.) Birds whose habits score better have more chicks, and the chicks inherit those habits. Over many generations, the population ends up where a game theorist would predict."},
 {h:"SHOW BEFORE FIGHT",b:"Many animals size each other up before fighting. Red deer stags have roaring contests and walk side by side before they ever lock antlers. Often one backs off, and nobody gets hurt. It's a lot more dove than hawk."},
 {h:"LAST CHECK",q:"If fights get MORE dangerous, the share of hawks...",o:["goes up","goes down","stays the same"],a:1,w:"Food ÷ a bigger fight cost is a smaller number, so there are fewer hawks."}]},
4:{t:"SIGNALS",s:"Lesson 4 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"<b>Every runner said \"I'm fast!\" Funny how nobody ever says \"I'm slow.\"</b><br><br>In Stage 1 the Iron Camp badge showed who was really fast. In Stage 2 the camp got cheap, every runner had a badge, and you were mostly guessing."},
 {h:"CHEAP TALK",b:"Saying something costs nothing. When everyone wants to be picked, everyone says the same thing, so the words tell you nothing. Game theorists call this <b>cheap talk</b>."},
 {h:"THE BIG IDEA: COSTLY SIGNALING",b:"A <b>costly signal</b> is believable when it costs <b>too much for the wrong people to fake</b>. Camp pays 10 and skipping pays 4, so camp is worth it only if it costs less than 6. Each runner does this math:<table class='sm'><tr><th>Runner</th><th>Camp cost</th><th>Camp pays 10 - cost</th><th>Skip</th><th>Choice</th></tr><tr><td><b>Fast</b></td><td>2</td><td>8</td><td>4</td><td>Camp</td></tr><tr><td><b>Slow</b></td><td>8</td><td>2</td><td>4</td><td>Skip</td></tr><tr><td><b>Slow, cheap camp</b></td><td>3</td><td>7</td><td>4</td><td>Camp</td></tr></table><p>Stage 1: only fast runners finished camp, so a badge meant FAST (which is why paying 1 point to check was worth it). Stage 2: camp got cheap, slow runners finished too, and the badge told you nothing. That is called <b>pooling</b>.</p><p class='why'><b>Why it matters:</b> diplomas, money-back guarantees and a peacock's heavy tail work this way.</p>"},
 {h:"QUICK CHECK",q:"Why did your Stage 2 picks feel like luck?",o:["Camp got cheap, so every runner had a badge and it told you nothing","Only the slow runners had badges, so the badges pointed the wrong way","The camp records were hidden, so you had to guess blindly"],a:0,w:"When camp got cheap, slow runners finished it too (10 - 3 = 7 beats 4). Everyone had a badge, so it could no longer tell fast from slow. That is called pooling."},
 {h:"TRY IT",q:"Camp finishers earn 10; everyone else earns 4. If camp cost a slow runner 5, would the badge still tell fast from slow?",o:["No: 10 - 5 = 5 beats 4, so slow runners would go too", "Yes: 5 is a lot of effort, so slow runners would still skip it", "Yes, because fast runners would still pay less"],a:0,w:"Slow: 10 - 5 = 5, which beats 4, so everyone goes and the badge stops meaning anything. The camp has to cost a slow runner 6 or more to keep them out."},
 {h:"DIPLOMAS AS SIGNALS",b:"In 1973 the economist Michael Spence explained that a diploma can work like the camp badge. It's harder to earn for people who'd struggle with the job, so employers treat it as a signal. Spence shared the 2001 Nobel Prize in economics for this kind of work. (Officially it is the Sveriges Riksbank Prize in Economic Sciences in Memory of Alfred Nobel, but everyone says Nobel.) Yes, your diploma is basically a very long, very expensive camp badge."},
 {h:"THE PEACOCK'S TAIL",b:"A peacock's huge tail is heavy and makes him easier to catch. In 1975 the biologist Amotz Zahavi suggested that's the point: only a healthy bird can afford such a handicap, so the tail is hard to fake. Biologists still debate the details, but the idea changed how they study animal signals."},
 {h:"QUICK CHECK",q:"Which is the most believable signal that a shop sells good products?",o:["A big sign that says \"Best quality in town!\"","A full money-back guarantee on everything","A shiny new logo and a slick website"],a:1,w:"A guarantee is costly for a shop with bad products, because they'd keep paying refunds."},
 {h:"LAST CHECK",q:"What makes a signal believable?",o:["It is repeated loudly by lots of different people","It costs too much for the wrong people to fake","It is free to send, so everyone can see it quickly"],a:1,w:"If a faker can't afford it, the signal tells the truth."}]},
5:{t:"BLUFF",s:"Lesson 5 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"<b>You just played a game where the smartest move is sometimes a fib, and everyone agreed to play.</b><br><br>Your rival couldn't see your card. That's <b>hidden information</b>. Trusting Tess never challenged. Watchful Wes learned from every card he saw (the ones shown when you stayed, and the ones shown when he challenged) and worked out how often your pushes were HIGH.<br><br>Rules reminder: when cards are shown, your <b>HIGH beats your rival's hidden card</b> and your <b>LOW loses to it</b>."},
 {h:"QUICK CHECK",q:"Against Trusting Tess, what was the best move with a LOW card?",o:["STAY","PUSH"],a:1,w:"Tess always backed down, so pushing won +1 every time. Staying with LOW lost 1."},
 {h:"THE BIG IDEA: BLUFFING AS A MIXED STRATEGY",b:"A <b>mixed strategy</b> means picking your move with set odds, so a smart rival can't predict you. Bluffing is how you stay unreadable.<br><br>Take 12 hands against a smart rival: 6 HIGH, 6 LOW. Staying scores +1 with HIGH and -1 with LOW. A push is either backed down (+1) or challenged (HIGH +2, LOW -2).<table class='sm'><tr><th>Your plan</th><th>Rival's reply</th><th>Total</th></tr><tr><td><b>Push only with HIGH</b></td><td>backs down every push</td><td>6 - 6 = 0</td></tr><tr><td><b>Push every hand</b></td><td>challenges every push</td><td>12 - 12 = 0</td></tr><tr><td><b>Push HIGH + bluff on 2 LOW</b></td><td>challenges 2 pushes in 3</td><td>+4</td></tr></table><p>The mix: 6 HIGH pushes earn +10 (about 2 backed down, 4 challenged). The 2 bluffs lose 1 each on average (-2). The other 4 LOW cards stay (-4). So 10 - 2 - 4 = <b>+4</b>.</p><p class='why'><b>Why it matters:</b> penalty takers, poker players and tennis servers vary their plays, because a predictable move is a beatable move.</p>"},
 {h:"THE BALANCE",b:"That +4 mix is the balance. In this game, it works out to bluffing with about <b>1 LOW card in 3</b>. Then a smart rival can't tell, and the best they can do is challenge about <b>2 pushes in 3</b>.<br><br><b>Where does 3 in 4 come from?</b> Out of 12 hands: 6 HIGH (always push) + 2 bluffs on the 6 LOW = 8 pushes, and 6 of 8 = <b>3 in 4</b> are HIGH. That's the mix Watchful Wes can't beat: if his guess of how often a push is HIGH drops below 3 in 4, challenging starts to pay."},
 {h:"CHECK THE MATH",r:[["YOUR LOW CARD","Stay: lose 1. Push: win 1 a third of the time, lose 2 two-thirds of the time: also lose 1 on average. You're fine either way."],["THEIR CHOICE","When you push, it's HIGH 3 times out of 4. Challenge: lose 2 three times, win 2 once: lose 1 on average. Back down: lose 1. They're stuck."]]},
 {h:"TRY IT",q:"Why bluff only SOMETIMES?",o:["Always bluffing gets you caught, and never bluffing gives your card away","Bluffing wins fewer points than staying, so it is only a backup plan","The rules only let you push on a LOW card once in a while"],a:0,w:"Bluffing is a mixed strategy, like the penalty kicks in Game Night 1."},
 {h:"FROM POKER TO MATH",b:"John von Neumann, who helped start game theory, studied a simplified card game. In his 1944 book with Oskar Morgenstern, he showed that bluffing isn't a mistake or a trick. It's part of playing <b>well</b> when information is hidden."},
 {h:"BLUFFS IN THE WILD",b:"A basketball player's pump fake, a soccer player's step-over, a cat puffing up its fur to look bigger: all bluffs. Each one works only because the real move happens sometimes too. (A pump fake that never turns into a shot is just standing around.)"},
 {h:"GAMES VS. REAL LIFE",b:"Bluffing is part of the rules in games everyone agreed to play. In real life, people you bluff may not have agreed to play, and honesty builds the reputation from Lesson 2. Know which game you're in."},
 {h:"LAST CHECK",q:"Watchful Wes works out how often your pushes are HIGH. You've pushed on almost every hand, far more often than you could have HIGH cards. What does he do?",o:["Backs down every time, since you must be holding HIGH","Challenges more, because your pushes stopped meaning HIGH","Ignores your pushes and just flips a coin each time"],a:1,w:"Bluff too often and your push stops meaning HIGH, so Wes calls it. The same happens if you only push on LOW: he sees your HIGH cards when you stay."}]},
6:{t:"THE SHARED LAKE",s:"Lesson 6 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"<b>Four fishers, one lake, and surprisingly little chill.</b><br><br>Four fishers shared one lake. Every fish you caught was yours, but a smaller lake hurt <b>everyone</b>. Then the town tried a plan."},
 {h:"THE BIG IDEA: THE TRAGEDY OF THE COMMONS",b:"A <b>commons</b> is something a whole group shares, like a lake. The <b>tragedy of the commons</b> happens when each person gets all the benefit of taking extra, but the cost is spread over everyone, so everyone takes too much and the commons is destroyed.<br><br>The lake holds 60 fish and doubles what is left (up to 60). Four fishers:<table class='sm'><tr><th>Plan</th><th>Season 1</th><th>Season 2</th><th>Season 3</th></tr><tr><td><b>Each takes 6</b></td><td>60, 36 left, back to 60</td><td>60 again</td><td>60 again</td></tr><tr><td><b>Each takes 9</b></td><td>60, 24 left, doubles to 48</td><td>48, 12 left, doubles to 24</td><td>24 fish, all caught: empty</td></tr></table><p>If only you take 9 while the others take 6, you gain 3 every season and the lake stays nearly full. If all four do it, each gets 24 fish in three seasons, then the lake is gone.</p><p class='why'><b>Why it matters:</b> overfished oceans, overgrazed pastures and a shared kitchen nobody cleans all follow this pattern.</p>"},
 {h:"THE BIG IDEA: HOW COMMUNITIES SOLVE IT",b:"Elinor Ostrom found that many real communities avoid the tragedy by making the cost fall on the person who causes it: <b>clear limits</b>, <b>watchers</b> who check, and <b>fair penalties</b>.<br><br>In the game the limit is 1 fish per 10 in the lake (6 at 60 fish). Gil is tempted to take 9, which is 3 extra:<br><br><b>A promise nobody checks:</b> Gil keeps his 3 extra every season. Bo and Cam see it and copy him. That promise was cheap talk.<br><br><b>Watchers and a one-season ban:</b> Gil tests the rule once and gets 9, then is banned and gets 0. Following the limit would have given about 12 over those two seasons. Cheating costs more than it pays, so he stops.<p class='why'><b>Why it matters:</b> catch limits with inspectors, like the irrigation communities Ostrom studied, work this way.</p>"},
 {h:"QUICK CHECK",q:"Gil takes 9 fish instead of 6. Who pays for the 3 extra fish?",o:["Only Gil, since he is the one who took them","Everyone who shares the lake, Gil included","Nobody, because the lake refills on its own"],a:1,w:"Gil gets all 3 extra fish, but the smaller lake is smaller for everyone."},
 {h:"SHARE OR GRAB, AGAIN",b:"It's the Prisoner's Dilemma with many players. Taking more is better for you no matter what the others do, but if everyone takes more, everyone ends up with less."},
 {h:"TRY IT",q:"A lake has 40 fish and doubles what's left. What's the most the group can catch and still have 40 next season?",o:["10","20","40"],a:1,w:"Leave 20, which doubles back to 40. So the group can catch 20."},
 {h:"WHO NAMED IT?",b:"The name comes from a 1968 essay by the biologist Garrett Hardin about a shared pasture. A herder gets the full benefit of adding one more cow, but the damage to the grass is shared by all, so every herder adds cows until the pasture is ruined. (Everyone is being sensible. Together they are being ridiculous.)"},
 {h:"ELINOR OSTROM",b:"Hardin thought only governments or private owners could save a commons. The political scientist <b>Elinor Ostrom</b> went and looked. She studied mountain pastures in Switzerland, forests in Japan and irrigation canals in Spain that communities had shared for centuries. In 2009 she became the first woman to win the Nobel Prize in economics."},
 {h:"WHAT WORKS",r:[["CLEAR LIMITS","Everyone knows the rule, like 1 fish for every 10 in the lake."],["WATCHERS","Someone checks, so cheating gets noticed."],["FAIR PENALTIES","Small at first, bigger for repeat cheaters, like a one-season ban."],["A SAY FOR EVERYONE","People follow rules they helped make."]]},
 {h:"WHEN IT GOES WRONG",b:"Off the coast of Newfoundland, cod were so plentiful for centuries that people thought they could never run out. After decades of heavy fishing, the cod collapsed, and in 1992 Canada closed the fishery. Thousands of people lost their jobs."},
 {h:"LAST CHECK",q:"In the game, which plan made Gil stop overfishing?",o:["No rule at all, so everyone fishes how they like","A promise that everyone agreed to keep","Watchers who check, plus a one-season ban"],a:2,w:"A promise is cheap talk. Watchers plus a real penalty made cheating cost more than it paid."}]},
7:{t:"VOTE!",s:"Lesson 7 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"<b>Three groups, three trips, and one vote that refused to behave.</b><br><br>Three groups, three field trips, the same opinions every time. But when you changed the <b>order</b> of the votes, the winner changed."},
 {h:"THE BIG IDEA: THE CONDORCET PARADOX",b:"Every voter can rank the choices sensibly, and the <b>group</b> can still go in a circle: A beats B, B beats C, and C beats A. In 1785 the Marquis de Condorcet noticed this, so it is called the <b>Condorcet paradox</b>.<br><br>Three groups of 7 rank the field trips:<table class='sm'><tr><th>Group</th><th>1st</th><th>2nd</th><th>3rd</th></tr><tr><td><b>Animal Fans</b></td><td>Zoo</td><td>Museum</td><td>Water Park</td></tr><tr><td><b>History Buffs</b></td><td>Museum</td><td>Water Park</td><td>Zoo</td></tr><tr><td><b>Splash Squad</b></td><td>Water Park</td><td>Zoo</td><td>Museum</td></tr></table><p>A <b>Condorcet winner</b> would be a trip that beats every other trip head to head. Look for one: the zoo loses to the water park, the water park loses to the museum, and the museum loses to the zoo. There is no winner. The next screen shows the votes.</p><p class='why'><b>Why it matters:</b> what a group wants is not always a single clear answer, even when every member is perfectly logical.</p>"},
 {h:"HEAD TO HEAD",b:"<svg viewBox=\"0 0 300 195\" width=\"100%\" style=\"max-width:320px;display:block;margin:6px auto\" role=\"img\" aria-label=\"Voting triangle: Zoo beats Museum, Museum beats Water Park, Water Park beats Zoo\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#ffe14d\"/></marker></defs><g font-family=\"Rubik,Arial,sans-serif\" font-size=\"12\" font-weight=\"800\" text-anchor=\"middle\"><rect x=\"108\" y=\"8\" width=\"84\" height=\"30\" rx=\"8\" fill=\"#0e2a1a\" stroke=\"#a6f04a\" stroke-width=\"2\"/><text x=\"150\" y=\"28\" fill=\"#eef4ff\">ZOO</text><rect x=\"210\" y=\"140\" width=\"84\" height=\"30\" rx=\"8\" fill=\"#0e2a1a\" stroke=\"#a6f04a\" stroke-width=\"2\"/><text x=\"252\" y=\"160\" fill=\"#eef4ff\">MUSEUM</text><rect x=\"6\" y=\"140\" width=\"84\" height=\"30\" rx=\"8\" fill=\"#0e2a1a\" stroke=\"#a6f04a\" stroke-width=\"2\"/><text x=\"48\" y=\"160\" fill=\"#eef4ff\">WATER PARK</text><g stroke=\"#ffe14d\" stroke-width=\"2.5\" fill=\"none\" marker-end=\"url(#ar)\"><line x1=\"172\" y1=\"42\" x2=\"240\" y2=\"136\"/><line x1=\"206\" y1=\"155\" x2=\"96\" y2=\"155\"/><line x1=\"58\" y1=\"136\" x2=\"128\" y2=\"42\"/></g><g fill=\"#ffe14d\" font-size=\"11\" font-weight=\"600\"><text x=\"226\" y=\"86\" text-anchor=\"start\">beats, 14-7</text><text x=\"150\" y=\"146\">beats, 14-7</text><text x=\"76\" y=\"86\" text-anchor=\"end\">beats, 14-7</text></g></g></svg><p class=\"note\" style=\"text-align:center\">Each arrow means \"beats\": the trip at the tail beats the trip at the arrowhead. Follow the arrows: Zoo → Museum → Water Park → Zoo. They run in a circle.</p>",r:[["ZOO VS MUSEUM","Animal Fans and Splash Squad prefer the zoo. Zoo wins 14 to 7."],["MUSEUM VS WATER PARK","Animal Fans and History Buffs prefer the museum. Museum wins 14 to 7."],["WATER PARK VS ZOO","History Buffs and Splash Squad prefer the water park. Water Park wins 14 to 7."]]},
 {h:"QUICK CHECK",q:"Three groups of 7: Group 1 ranks Zoo > Museum > Water Park; Group 2 ranks Museum > Water Park > Zoo; Group 3 ranks Water Park > Zoo > Museum. Which trip beats BOTH others head-to-head?",o:["Zoo","Museum","Water Park","None of them"],a:3,w:"Each one loses to one of the others. The class's preferences go in a circle."},
 {h:"THE BIG IDEA: WHOEVER SETS THE ORDER WINS",b:"When preferences go in a circle, the winner depends on the <b>order of the votes</b>. That is <b>agenda power</b>: same voters, same opinions, and whoever sets the agenda picks the winner.<br><br>Each vote is head to head, and the winner faces the third trip:<table class='sm'><tr><th>First vote</th><th>Winner</th><th>Second vote</th><th>Final winner</th></tr><tr><td><b>Zoo vs Museum</b></td><td>Zoo</td><td>Zoo vs Water Park</td><td>Water Park</td></tr><tr><td><b>Museum vs Water Park</b></td><td>Museum</td><td>Museum vs Zoo</td><td>Zoo</td></tr><tr><td><b>Zoo vs Water Park</b></td><td>Water Park</td><td>Water Park vs Museum</td><td>Museum</td></tr></table><p>The trip left out of the first vote enters last and wins. Every trip can win. All it takes is choosing the order.</p><p class='why'><b>Why it matters:</b> committees and councils often vote on options in pairs, so the order of the votes can matter as much as the voters.</p>"},
 {h:"TRY IT",q:"Same three groups: head to head, Zoo beats Museum, Museum beats Water Park, Water Park beats Zoo. The winner of the first vote faces the third trip. You want the WATER PARK to win. Which pair should vote first?",o:["Zoo vs Museum", "Museum vs Water Park", "Zoo vs Water Park"],a:0,w:"Zoo beats Museum, then the Water Park beats the Zoo. The Water Park entered last."},
 {h:"STRATEGIC VOTING",b:"In Stage 2 a different class votes once, and the most votes wins. Zoo Crew (9 kids) rank Zoo > Water Park > Museum, Museum Club (7) rank Museum > Water Park > Zoo, and Splash Squad (5) rank Water Park > Museum > Zoo.<br><br>If Splash Squad votes for its favorite: Zoo 9, Museum 7, Water Park 5, and the zoo, its <b>least</b> favorite, wins. If it votes for its second choice, the museum: Museum 12, Zoo 9, and the museum wins. Voting this way is called <b>strategic voting</b>."},
 {h:"ARROW'S SURPRISE",b:"In 1951 the economist Kenneth Arrow proved something shocking: with three or more options, no ranked voting system can follow every one of a short list of fair-sounding rules all the time. He later won a Nobel Prize. Every voting system has trade-offs."},
 {h:"OTHER WAYS TO VOTE",b:"Some places use different systems. With <b>ranked-choice voting</b>, used in some US cities and in Maine, you rank the options, and votes for knocked-out options move to each voter's next choice. That can make strategic voting less necessary, though no system removes it completely (the Gibbard-Satterthwaite theorem says so).<br><br>The counting method matters too. With the honest Stage 2 ballots, plurality picks Zoo, a top-two runoff picks Museum (12 to 9 over Zoo), and the Borda count (2 points for 1st, 1 for 2nd) picks Water Park (26, to Museum's 19 and Zoo's 18). Water Park is also the Condorcet winner: it beats Museum 14 to 7 and Zoo 12 to 9."},
 {h:"LAST CHECK",q:"Why might a group fight over the ORDER of votes?",o:["When preferences go in a circle, the order can decide the winner","Going first lets a group lock in its favorite trip for good","Groups that vote later get extra votes, so order is about power"],a:0,w:"Same opinions, different order, different winner."}]},
8:{t:"YOUR LONG GAME PLAYBOOK",s:"Boss warm-up · about 5 minutes",S:[
 {h:"SEVEN BIG IDEAS",b:"Tap each card to review it. Then beat three quick checks before you face the Hive Mind."},
 {h:"YOUR CARDS",r:[["TIT FOR TAT","Start nice, hit back right away, forgive fast, be clear."],["TRUST BUILDER","Trust grows with reputation and a future together."],["STABLE STRATEGY","A population settles on a mix no newcomer can beat. Hawks = food ÷ fight cost (when a fight costs more than the food)."],["COSTLY SIGNAL","Believable signals cost too much to fake."],["BLUFF MASTER","With hidden information, bluff sometimes so your moves don't give you away."],["COMMONS KEEPER","Shared resources need limits, watchers and fair penalties."],["AGENDA SETTER","When preferences go in a circle, the order of votes picks the winner."]]},
 {h:"CHECK 1",q:"Tit for Tat's first move is always...",o:["SHARE","GRAB","Random"],a:0,w:"It's nice: it never grabs first."},
 {h:"CHECK 2",q:"Which signal is believable?",o:["One that is free and easy for anyone to send","One that is too costly for the wrong people to fake","One that is loud and repeated by lots of people"],a:1,w:"Costly signals are hard to fake."},
 {h:"CHECK 3",q:"A shared lake keeps shrinking. What helped most in the game?",o:["A promise that everyone agrees to keep","Watchers who check and a fair penalty","Everyone fishing as fast as they can first"],a:1,w:"Rules only work when someone checks."}]},

var K={"1":["Repeated games: today's move can be paid back tomorrow.","Tit for Tat: nice, quick to hit back, quick to forgive, clear.","Grabbers win once, then get stuck with 1 point a round.","The longer the future, the more sharing pays: against Copycat Cora, sharing beats grabbing from a 3-round match on (30 vs 14 over 10).","Tit for Tat can't beat a partner in one match, but it wins on total (129, vs 120 for Always Share and 106 for Always Grab)."],
"2":["Trust game: sent coins triple, the receiver chooses what to return.","Trusting grows the pile: sending 10 every round earned 55 in Part A, sending nothing earned 40.","Reputation is your partner's memory: returning half earned 54 in Part B, keeping it all in round 5 earned 18.","The last round tempts people to break trust.","Start small and build trust step by step."],
"3":["Hawks fight; doves back down. Neither wins everywhere.","All hawks: doves spread. All doves: hawks spread. The mix in between is stable (an ESS).","The mix settles where both score the same.","Hawk vs hawk: (food − fight cost) ÷ 2, here (10 − 20) ÷ 2 = −5.","Share of hawks = food ÷ fight cost, when a fight costs more than the food.","A stable strategy can't be taken over by a few newcomers."],
"4":["Cheap talk: free to say, so it tells you little.","Costly signal: too expensive for the wrong people to fake.","Camp is worth it only if it costs less than 6 (10 - cost beats 4). Fast: 10 - 2 = 8 > 4. Slow: 10 - 8 = 2 < 4.","If camp is cheap for slow runners, everyone gets the badge (pooling) and it tells you nothing.","Diplomas, guarantees and peacock tails can work as signals."],
"5":["Hidden information: your rival can't see your card.","Mixed strategy: pick your move with set odds so a smart rival can't predict you.","12 hands vs a smart rival: never bluff 0, always push 0, the mix +4. In the real 14-hand game Wes isn't perfect, so your totals may differ: never bluff +1, always push +2, a good mix up to +8.","Best mix here: always push HIGH, bluff on about 1 LOW card in 3 (6 of 8 pushes, 3 in 4, are HIGH)."],
"6":["Tragedy of the commons: each person's extra take hurts everyone a little.","Safe catch: leave enough for the lake to grow back. The lake can lose 30 a season; everyone taking 9 empties it in 3 seasons.","Promises alone fail; watchers plus fair penalties work.","Elinor Ostrom showed communities can manage commons well."],
"7":["Group preferences can go in a circle (Condorcet paradox).","Then whoever sets the order of votes can pick the winner: the trip left out of the first vote enters last and wins.","Strategic voting: back your 2nd choice to stop your last.","A Condorcet winner beats every other option head to head; in a circle, there is none.","Every voting system has trade-offs (Arrow); none removes strategic voting completely."],
"8":["Tit for Tat · Trust Builder · Stable Strategy · Costly Signal","Bluff Master · Commons Keeper · Agenda Setter"]};

(function(){var ADD={"1": {"h": "WHY REPEATING CHANGES EVERYTHING", "b": "Who would you rather cheat: a stranger at a garage sale you'll never see again, or the friend you sit with at lunch every day? With the friend, there's always a next round.<br><br>That's one reason friends, teammates and neighbors cooperate more than strangers: the future is watching."}, "2": {"h": "HOW TRUST GROWS", "b": "Trust usually grows in small steps. You lend a friend a pencil before you lend them your phone. Each small promise kept makes the next, bigger one easier.<br><br>Broken trust works the other way: one broken promise can undo many kept ones."}, "3": {"h": "IT'S NOT ABOUT NICE ANIMALS", "b": "Doves aren't \"nicer\" animals and hawks aren't \"meaner.\" They're strategies, and what matters is which one does better against the rest of the group.<br><br>When fights are very costly, more animals back down. When fights are cheap, more of them fight."}, "4": {"h": "SIGNALS IN YOUR LIFE", "b": "Which is a stronger sign that someone is a great guitarist: saying \"I'm great at guitar,\" or playing a hard song in front of you? Talk is cheap. Showing a skill is costly to fake.<br><br>Trophies, finished projects and portfolios work as signals because they're hard to get without the real skill."}, "7": {"h": "WHO SETS THE AGENDA?", "b": "This happens outside of games too. In a club or student council meeting, whoever writes the list of what gets voted on, and in what order, quietly has a lot of power.<br><br>Next time your class votes, ask: are we voting on everything at once, or in rounds? It can change the result."}, "8": {"h": "THE BIG PICTURE", "b": "When games repeat, the future matters. Trust, reputation, signals and fair rules all grow from one idea: <b>what you do today changes how others treat you tomorrow.</b>"}};for(var k in ADD){var S=L[k]&&L[k].S;if(!S)continue;var i=S.length-1;if(k==='8'){for(var j=0;j<S.length;j++){if(S[j].q){i=j;break}}}S.splice(i,0,ADD[k]);}})();


(function(){var DEEP={"1": {"h": "NERD ZONE: THE FOLK THEOREM", "b": "Use Share or Grab from Game Night 1: 3 each, 5 vs 0, or 1 each. Say you both share until someone grabs, then both grab forever. Sharing beats a one-time grab as long as the chance of another round is at least <b>1 in 2</b>.<br><br><b>The one-line proof.</b> Let p be the chance there is another round. Sharing gets 3 every round forever. Grabbing gets 5 once, then 1 forever (the grudge kicks in). Add up what each is worth, then multiply by (1 − p) to clear the fractions: sharing wins if<br><b>3 ≥ 5(1 − p) + p</b>, which is <b>3 ≥ 5 − 4p</b>, i.e. <b>p ≥ ½</b>.<br><br>Game theorists prove a general version called the <b>folk theorem</b>, nicknamed that because many knew it before anyone published it: when the future matters enough, cooperation can be an equilibrium.", "q": "In the folk-theorem example, how likely must another round be for sharing to beat a one-time grab?", "o": ["At least 1 in 2 (a coin flip or better)", "At least 1 in 10 (almost never)", "Only if another round is certain"], "a": 0, "w": "With 3 each forever versus 5 once and then 1 forever, sharing wins when the next round is at least 50% likely."}, "2": {"h": "NERD ZONE: TYPES", "b": "If you both know the game lasts exactly 10 rounds, backward induction says trust should collapse from the last round back to the first. Real people trust anyway.<br><br>In 1982 the economists David Kreps, Paul Milgrom, John Roberts and Robert Wilson showed why: if there's even a small chance your partner is the kind who always plays fair as long as you do, it pays to act trustworthy too, until close to the end. These hidden personalities are called <b>types</b>.", "q": "Why act trustworthy even when the last round is known?", "o": ["Your partner might be the fair-minded kind, so a good reputation pays", "Trust costs nothing, so there is never a reason to hold it back", "Everyone knows the last round is coming, so nobody betrays anyone"], "a": 0, "w": "A small chance of a fair-minded partner keeps cooperation going until close to the end."}, "3": {"h": "NERD ZONE: THE ESS TEST", "b": "Maynard Smith's test has two steps. Imagine a few newcomers playing differently. The old strategy is <b>evolutionarily stable</b> if the newcomers do worse against it than it does against itself, or if they tie there but, when the two kinds meet, the old strategy scores more than the newcomers score against each other.<br><br>Biologists also use <b>replicator dynamics</b>: a strategy spreads when it scores above the group's average and shrinks when it scores below. In Hawk or Dove, that pulls the flock to the balance point (hawk share = food ÷ fight cost, when a fight costs more than the food).", "q": "Replicator dynamics says a strategy spreads when...", "o": ["It scores above the group's average", "It is used by the most animals right now", "It is the gentlest strategy available"], "a": 0, "w": "Above average grows, below average shrinks, until the mix settles."}, "4": {"h": "NERD ZONE: SEPARATE OR POOL", "b": "If fast and slow runners make different choices, so the badge tells them apart, it's a <b>separating equilibrium</b>. If everyone makes the same choice, the badge tells you nothing: a <b>pooling equilibrium</b>. Signals separate when they cost much more for the wrong type.<br><br>Hidden information can even break a market. In 1970 George Akerlof showed that when buyers can't tell good used cars from \"lemons,\" good cars can disappear from the market.", "q": "If fast and slow runners all skip camp, the badge tells you nothing. That's a...", "o": ["Pooling equilibrium", "Separating equilibrium", "Dominant move"], "a": 0, "w": "Everyone makes the same choice, so the signal can't tell the types apart."}, "5": {"h": "NERD ZONE: BOTH SIDES MIX", "b": "At the balance point, both players mix, and each one's mix is set by the <b>other</b> player's payoffs. You bluff just often enough that challenging and backing down pay your rival the same. Your rival challenges just often enough that bluffing and giving up pay you the same.<br><br>Neither can gain by changing alone, so it's a Nash equilibrium in mixed strategies: the same idea as the penalty kicks in Game Night 1.", "q": "At the balance point, what sets how often YOU should bluff?", "o": ["Your rival's payoffs", "Your own payoffs", "Pure luck, with no plan"], "a": 0, "w": "You bluff just often enough that your rival can't gain by challenging or by backing down."}, "6": {"h": "NERD ZONE: EXTERNALITIES", "b": "A cost you push onto other people is called an <b>externality</b>. Each extra fish you take costs everyone a little of next year's lake, but you don't pay that cost yourself, so everyone takes too many.<br><br>The shared lake is a Prisoner's Dilemma with many players, called a <b>collective action problem</b>. Ostrom's fixes (watching, fair rules, growing penalties) work by putting the cost back on the person who causes it.", "q": "Why does everyone take too many fish?", "o": ["The cost of each extra fish is shared, not paid by the one who took it", "Fishers do not realize the lake is getting smaller each season", "Taking more fish always makes the lake grow back faster than before"], "a": 0, "w": "That's an externality: you keep the whole benefit but share the cost."}, "7": {"h": "NERD ZONE: NO SYSTEM IS SAFE", "b": "Arrow's theorem has a cousin. The <b>Gibbard-Satterthwaite theorem</b> (1973 and 1975) says that with three or more options, every voting system that isn't run by a dictator, and lets any option win, can sometimes reward strategic voting.<br><br>There's good news too. If every voter's opinions line up along one scale, like the beach in Game Night 1, Duncan Black showed in 1948 that the <b>median voter's</b> favorite can't be beaten head to head. No circle.", "q": "Gibbard and Satterthwaite showed that with three or more options...", "o": ["Every system that isn't a dictatorship can sometimes reward strategic voting", "Ranked-choice voting completely removes any reason to vote strategically", "Only plurality voting, one vote each, can ever be gamed by voters"], "a": 0, "w": "No voting system is completely safe from strategic voting."}, "8": {"h": "NERD ZONE: NOBEL GAMES", "b": "Game theory keeps winning the Nobel Prize in economics: Nash, Harsanyi and Selten (1994); Vickrey and Mirrlees (1996); Akerlof, Spence and Stiglitz for hidden information (2001); Aumann and Schelling for conflict and cooperation (2005); Hurwicz, Maskin and Myerson for mechanism design (2007); Ostrom (2009); Roth and Shapley for matching markets (2012); Milgrom and Wilson for auctions (2020).<br><br>You've now met the ideas behind many of them.", "q": "Who was the first woman to win the Nobel Prize in economics?", "o": ["Elinor Ostrom", "Esther Duflo", "Claudia Goldin"], "a": 0, "w": "Ostrom won in 2009 for showing how communities protect shared resources. Duflo (2019) and Goldin (2023) came later."}};var GD=[{"h": "YOU DID IT!", "b": "You've finished all three Game Nights: payoffs and Nash equilibrium, thinking ahead, and now the long game of trust, signals, evolution and voting.<br><br>That's the core of a real college course. Want more? Here's where to go next."}, {"h": "WATCH THE LECTURES FOR PART 3", "b": "These lectures from <b>Yale's free Game Theory course (ECON 159)</b>, taught by Professor Ben Polak, match Part 3:<br><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-11\" target=\"_blank\" rel=\"noopener\">Lecture 11: Evolutionary Stability: Cooperation, Mutation, and Equilibrium</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-12\" target=\"_blank\" rel=\"noopener\">Lecture 12: Evolutionary Stability: Social Convention, Aggression, and Cycles</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-21\" target=\"_blank\" rel=\"noopener\">Lecture 21: Repeated Games: Cooperation vs. the End Game</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-22\" targ /* MY RESULTS: save result lines so students can always get back to them */
(function(){
  var file=(location.pathname.split("/").pop()||"");var part=(file.match(/^(gn\d)-/)||[])[1];if(!part)return;
  function ls(){try{return window.localStorage}catch(e){return null}}
  var last="";
  function save(){var o=document.getElementById("out"),s=ls();if(!o||!s||!o.value||o.value===last)return;last=o.value;
    try{s.setItem("gnres::"+file+location.search,JSON.stringify({t:Date.now(),v:o.value}))}catch(e){}}
  setInterval(save,1200);
  if(!(/read\.html$/.test(file)&&/[?&]m=9\b/.test(location.search)))return;
  var st=document.createElement("style");
  st.textContent='#mrBtn{position:fixed;right:10px;top:10px;z-index:9998;font:700 13px system-ui,sans-serif;color:#fff;background:rgba(10,10,30,.92);border:2px solid #ffe14d;border-radius:999px;padding:10px 14px;min-height:44px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.5)}'+
  '#mrOv{position:fixed;inset:0;z-index:9999;display:none;background:#080818;color:#fff;overflow-y:auto;padding:14px;font:15px/1.45 system-ui,sans-serif}'+
  '#mrOv h2{font-size:20px;margin:6px 0 8px}#mrOv textarea{width:100%;min-height:92px;background:#111833;color:#fff;border:2px solid #9fe7ff;border-radius:10px;padding:8px;font:13px/1.35 monospace;margin:4px 0}'+
  '#mrOv button,#mrOv a.mrA{display:inline-block;font:700 14px system-ui,sans-serif;color:#fff;background:#2a2a55;border:2px solid #9fe7ff;border-radius:10px;padding:10px 14px;min-height:44px;margin:4px 8px 8px 0;cursor:pointer;text-decoration:none}'+
  '#mrOv .mrNote{opacity:.8;font-size:13px}';
  document.head.appendChild(st);
  var b=document.createElement("button");b.id="mrBtn";b.type="button";b.textContent="\uD83D\uDCCB MY RESULTS FOR ROCKY";document.body.appendChild(b);
  var ov=document.createElement("div");ov.id="mrOv";document.body.appendChild(ov);
  function items(){var s=ls(),a=[],i,k;if(!s)return a;try{for(i=0;i<s.length;i++){k=s.key(i);if(k&&k.indexOf("gnres::"+part+"-")===0){var o=JSON.parse(s.getItem(k));a.push({k:k,v:o.v,t:o.t})}}}catch(e){}
    a.sort(function(x,y){var m=function(z){var r=z.v.match(/-M0?(\d)/);return r?+r[1]:9};return m(x)-m(y)||x.t-y.t});return a}
  function copy(txt,btn){function ok(){var o=btn.textContent;btn.textContent="Copied!";setTimeout(function(){btn.textContent=o},1500)}
    function fb(){var t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){btn.textContent="Select the box and copy"}document.body.removeChild(t)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb)}else fb()}
  function render(){var it=items(),h='<button type="button" id="mrX">\u25C0 BACK TO GO DEEPER</button><h2>My results for Rocky</h2>';
    if(!it.length)h+='<p>No saved results on this device yet. Go back to your game page, finish it, and tap COPY MY RESULTS FOR ROCKY.</p>';
    else h+='<p class="mrNote">Haven\u2019t pasted these to Rocky yet? Copy a box and paste it into your chat with Rocky.</p>';
    it.forEach(function(x,j){h+='<textarea readonly id="mrT'+j+'">'+x.v.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</textarea><button type="button" data-j="'+j+'">COPY</button>'});
    h+='<p><a class="mrA" href="'+part+'-m08-'+({gn1:"strategy-gauntlet",gn2:"grandmaster-gauntlet",gn3:"hive-mind-gauntlet"})[part]+'.html" target="_blank" rel="noopener">OPEN THE BOSS GAME PAGE</a></p>';
    ov.innerHTML=h;ov.scrollTop=0;
    document.getElementById("mrX").onclick=function(){ov.style.display="none";document.documentElement.style.overflow=""};
    Array.prototype.forEach.call(ov.querySelectorAll("button[data-j]"),function(bt){bt.onclick=function(){copy(it[+bt.getAttribute("data-j")].v,bt)}})}
  b.addEventListener("click",function(){render();ov.style.display="block";document.documentElement.style.overflow="hidden"});
})();
</script>
</body>
</html>
