<script>
function T(rows){return "<table>"+rows.map(function(r,i){return "<tr>"+r.map(function(c){return i===0||c===r[0]?"<th>"+c+"</th>":"<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</table>"}
var PD=T([["You ↓ · Them →","SHARE","GRAB"],["SHARE","You 3, Them 3","You 0, Them 5"],["GRAB","You 5, Them 0","You 1, Them 1"]]);
var HD=T([["You ↓ · Rival →","HAWK","DOVE"],["HAWK","-5","10"],["DOVE","0","5"]]);
var L={
1:{t:"TIT FOR TAT",s:"Lesson 1 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"Your bot played Share or Grab against every other bot, <b>10 rounds</b> each. Unlike Game Night 1, partners met again and again, so every move could be paid back next round."+PD},
 {h:"QUICK CHECK",q:"In a single match, can Tit for Tat ever score MORE than the bot it's playing?",o:["Yes, often","No, never","Only against Saint Sam"],a:1,w:"Tit for Tat never grabs first, so it can tie or fall a little behind, but never get ahead. It wins tournaments by adding up lots of good matches."},
 {h:"THE REAL TOURNAMENT",b:"Around 1980 the political scientist Robert Axelrod invited experts to send in computer programs to play the repeated Prisoner's Dilemma against each other.<br><br>The winner was one of the shortest programs sent in, only a few lines long: <b>Tit for Tat</b>, by the mathematical psychologist Anatol Rapoport. Axelrod ran a second, bigger tournament. Tit for Tat won again."},
 {h:"WHY TIT FOR TAT WORKS",r:[["NICE","It never grabs first, so it gets lots of 3-point rounds with other nice players."],["QUICK TO HIT BACK","It grabs right after you grab, so it isn't a pushover."],["QUICK TO FORGIVE","As soon as you share again, it shares again."],["CLEAR","It's easy to figure out, so other players learn that sharing pays."]]},
 {h:"TRY IT",q:"Which bot in your arena was nice but NOT quick to hit back?",o:["Copycat Cora","Saint Sam","Grudge Greta"],a:1,w:"Saint Sam shared no matter what, so grabbers took advantage of him every round."},
 {h:"WHY GRABBERS FADE",b:"Grabby Gus wins big for one round against each nice bot. After that, the bots that hit back grab too, and Gus is stuck with 1 point a round.<br><br>Against Copycat Cora: Gus gets 5, then 1 point for 9 rounds."},
 {h:"QUICK CHECK",q:"Grabby Gus plays Copycat Cora for 10 rounds. How many points does Gus get?",o:["50","14","10"],a:1,w:"5 in round 1, then 9 rounds of Grab/Grab at 1 point each: 5 + 9 = 14. Two sharers would each get 30."},
 {h:"THE SHADOW OF THE FUTURE",b:"In a one-time game, grabbing is the dominant move. But when you'll meet again, today's grab costs you tomorrow. Axelrod called this the <b>shadow of the future</b>: the longer the future, the more sharing pays."},
 {h:"TRUCES IN THE TRENCHES",b:"In his 1984 book <i>The Evolution of Cooperation</i>, Axelrod described soldiers in World War I trenches who faced the same enemy unit for months. In some places, both sides quietly held back, a system called \"live and let live,\" and answered any attack with an attack. It was Tit for Tat with real stakes."},
 {h:"A LITTLE FORGIVENESS",b:"In real life, moves get misread. A friend's \"grab\" might be an accident. Strict Tit for Tat can get stuck in a revenge loop after one mistake. Forgiving Fiona (Tit for Two Tats) only hits back after two grabs in a row, so one accident doesn't start a feud."},
 {h:"LAST CHECK",q:"A friend breaks a promise once, then apologizes and keeps the next one. What does Tit for Tat do?",o:["Never trust them again","Hit back once, then go back to sharing","Ignore it forever"],a:1,w:"Quick to hit back, quick to forgive: that's the Tit for Tat way."}]},
2:{t:"TRUST ME",s:"Lesson 2 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"First you were the <b>sender</b>: every coin you sent to Robin was tripled, and Robin chose what to send back. Then you were the <b>receiver</b>, and Max had to decide whether to trust you."},
 {h:"QUICK CHECK",q:"You send 6 coins. They triple, and your partner sends back half. How many come back?",o:["3","9","18"],a:1,w:"6 × 3 = 18 for your partner. Half of 18 is 9, so you turned 6 into 9."},
 {h:"THE TRUST GAME",b:"In 1995 the economists Joyce Berg, John Dickhaut and Kevin McCabe ran this game with real people and real money. Players never met and never learned who their partner was.<br><br>Cold logic says: the receiver will keep everything, so send nothing. But 30 of the 32 senders trusted a stranger with some money, about half of it on average."},
 {h:"WHY TRUST CAN PAY",b:"When you send coins, the pile <b>grows</b>. Sending 10 makes 30 to share. Sending nothing keeps the pile at 10.<br><br>Trust is risky, but it's how both sides end up with more."},
 {h:"REPUTATION",b:"Robin returned more after you trusted Robin with more. Max sent you more after you treated him fairly. Your past moves became a <b>reputation</b>, and your reputation decided what you were offered next."},
 {h:"TRY IT",q:"In Part B, why did keeping it all in round 5 hurt you?",o:["Max stopped sending","The coins stopped tripling","You lost your own coins"],a:0,w:"Max remembered. Keep it all once, and you get 18 coins for the whole Part B instead of 54."},
 {h:"THE LAST-ROUND PROBLEM",b:"In the final round, there's no future to protect, so keeping it all is tempting. And if you think ahead, your partner might expect that and send less at the end.<br><br>This is why trust grows best when relationships <b>don't have a known last day</b>."},
 {h:"QUICK CHECK",q:"When is the temptation to break trust the strongest?",o:["The first round","The middle rounds","The last round"],a:2,w:"With no next round, there's no reputation left to lose."},
 {h:"STARS AND REVIEWS",b:"How do strangers on the internet trust each other? Sites like eBay added buyer and seller ratings in the 1990s. A good rating is a reputation everyone can see, so it pays to stay honest even with someone you'll never meet again."},
 {h:"LAST CHECK",q:"A new classmate wants to borrow your favorite charger. What's the trust-builder move?",o:["Lend something small first and see if it comes back","Refuse forever","Lend everything you own"],a:0,w:"Start small, watch how they repay you, and build from there."}]},
3:{t:"HAWK OR DOVE",s:"Lesson 3 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"Birds met over food worth 10. Hawks fight; doves back down. Then you watched a whole flock change, generation after generation."+HD},
 {h:"WHY NOT ALL HAWKS?",b:"In a flock full of hawks, every meeting is a fight worth <b>-5</b>. A dove in that flock just backs away and gets <b>0</b>, which beats -5. So doves start to spread."},
 {h:"QUICK CHECK",q:"In a flock of ALL doves, what does one hawk get from each meeting?",o:["5","10","-5"],a:1,w:"Every dove backs down, so the hawk gets all 10. Doves only get 5. So hawks spread too."},
 {h:"THE BALANCE POINT",b:"Hawks do best when they're rare. Doves do best when hawks are common. So the flock settles where both score the <b>same</b>.<br><br>In this game that point is: <b>share of hawks = food ÷ fight cost</b>."},
 {h:"WORKED EXAMPLE",r:[["FIGHT COST 20","10 ÷ 20 = 1/2. Half hawks."],["FIGHT COST 30","10 ÷ 30 = 1/3. A third hawks."],["THE PATTERN","The more fights hurt, the fewer hawks."]]},
 {h:"TRY IT",q:"If fights cost 50, where does the share of hawks settle?",o:["50%","20%","10%"],a:1,w:"10 ÷ 50 = 1/5, or 20% hawks."},
 {h:"A STABLE STRATEGY",b:"In 1973 the biologists John Maynard Smith and George Price used games like this to ask why animal fights are so often more show than injury. Maynard Smith called the settled mix an <b>evolutionarily stable strategy</b>: once a population has it, a few newcomers playing differently can't take over."},
 {h:"NOBODY IS CHOOSING",b:"Birds don't do math. Birds whose habits score better have more chicks, and the chicks inherit those habits. Over many generations, the population ends up where a game theorist would predict."},
 {h:"SHOW BEFORE FIGHT",b:"Many animals size each other up before fighting. Red deer stags have roaring contests and walk side by side before they ever lock antlers. Often one backs off, and nobody gets hurt. It's a lot more dove than hawk."},
 {h:"LAST CHECK",q:"If fights get MORE dangerous, the share of hawks...",o:["goes up","goes down","stays the same"],a:1,w:"Food ÷ a bigger fight cost is a smaller number, so there are fewer hawks."}]},
4:{t:"SIGNALS",s:"Lesson 4 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"Every runner said \"I'm fast!\" With the Iron Camp badge, you could pick fast runners every time. Without it, you were mostly guessing."},
 {h:"CHEAP TALK",b:"Saying something costs nothing. When everyone wants to be picked, everyone says the same thing, so the words tell you nothing. Game theorists call this <b>cheap talk</b>."},
 {h:"QUICK CHECK",q:"Why did your Stage 2 picks feel like luck?",o:["Everyone said they were fast, because talk was free","The fast runners were hiding","Coaches can never tell"],a:0,w:"When saying it is free, slow runners say it too."},
 {h:"COSTLY SIGNALS",b:"A signal is believable when it costs <b>too much to fake</b>. Camp cost a fast runner 2 points but a slow runner 8. With a reward of 10 for camp finishers and 4 for everyone else:"},
 {h:"DO THE MATH",r:[["FAST RUNNER","Camp: 10 - 2 = 8. Skip: 4. Do the camp."],["SLOW RUNNER","Camp: 10 - 8 = 2. Skip: 4. Skip it."],["SO...","Only fast runners finish camp, which is exactly why the badge means something."]]},
 {h:"TRY IT",q:"If camp cost slow runners only 3, what would happen?",o:["Slow runners would do camp too, and the badge would stop meaning anything","Nothing would change","Fast runners would quit"],a:0,w:"Slow: 10 - 3 = 7, which beats 4. Everyone does camp, so the badge stops telling you who's fast."},
 {h:"DIPLOMAS AS SIGNALS",b:"In 1973 the economist Michael Spence explained that a diploma can work like the camp badge. It's harder to earn for people who'd struggle with the job, so employers treat it as a signal. Spence shared the 2001 Nobel Prize in economics for this kind of work."},
 {h:"THE PEACOCK'S TAIL",b:"A peacock's huge tail is heavy and makes him easier to catch. In 1975 the biologist Amotz Zahavi suggested that's the point: only a healthy bird can afford such a handicap, so the tail is hard to fake. Biologists still debate the details, but the idea changed how they study animal signals."},
 {h:"QUICK CHECK",q:"Which is the most believable signal that a shop sells good products?",o:["A sign that says \"Best quality!\"","A full money-back guarantee","A shiny new logo"],a:1,w:"A guarantee is costly for a shop with bad products, because they'd keep paying refunds."},
 {h:"LAST CHECK",q:"What makes a signal believable?",o:["It's loud","It costs too much for the wrong people to fake","Lots of people say it"],a:1,w:"If a faker can't afford it, the signal tells the truth."}]},
5:{t:"BLUFF",s:"Lesson 5 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"Your rival couldn't see your card. That's <b>hidden information</b>. Trusting Tess never challenged. Watchful Wes counted how often you pushed."},
 {h:"QUICK CHECK",q:"Against Trusting Tess, what was the best move with a LOW card?",o:["STAY","PUSH"],a:1,w:"Tess always backed down, so pushing won +1 every time. Staying with LOW lost 1."},
 {h:"IF YOU NEVER BLUFF",b:"If you push only with HIGH cards, your push gives your card away. A smart rival just backs down every time. You win +1 with HIGH and lose 1 with LOW: about even."},
 {h:"IF YOU ALWAYS BLUFF",b:"If you push with every card, a smart rival challenges every time. HIGH wins +2, LOW loses 2. Still about even, and you've been caught."},
 {h:"THE BALANCE",b:"The best plan is in between. In this game, it works out to bluffing with about <b>1 LOW card in 3</b>. Then a smart rival can't tell, and the best they can do is challenge about <b>2 pushes in 3</b>."},
 {h:"CHECK THE MATH",r:[["YOUR LOW CARD","Stay: lose 1. Push: win 1 a third of the time, lose 2 two-thirds of the time: also lose 1 on average. You're fine either way."],["THEIR CHOICE","When you push, it's HIGH 3 times out of 4. Challenge: lose 2 three times, win 2 once: lose 1 on average. Back down: lose 1. They're stuck."]]},
 {h:"TRY IT",q:"Why bluff only SOMETIMES?",o:["Bluffing always gets you caught; never bluffing gives your card away","Bluffing is against the rules","It's more polite"],a:0,w:"Bluffing is a mixed strategy, like the penalty kicks in Game Night 1."},
 {h:"FROM POKER TO MATH",b:"John von Neumann, who helped start game theory, studied a simplified card game. In his 1944 book with Oskar Morgenstern, he showed that bluffing isn't a mistake or a trick. It's part of playing <b>well</b> when information is hidden."},
 {h:"BLUFFS IN THE WILD",b:"A basketball player's pump fake, a soccer player's step-over, a cat puffing up its fur to look bigger: all bluffs. Each one works only because the real move happens sometimes too."},
 {h:"GAMES VS. REAL LIFE",b:"Bluffing is part of the rules in games everyone agreed to play. In real life, people you bluff may not have agreed to play, and honesty builds the reputation from Lesson 2. Know which game you're in."},
 {h:"LAST CHECK",q:"Watchful Wes saw you bluff on 3 of your last 4 LOW cards. What does he do?",o:["Backs down","Challenges every push","Leaves the game"],a:1,w:"Bluff too often and your push stops meaning anything, so Wes calls it."}]},
6:{t:"THE SHARED LAKE",s:"Lesson 6 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"Four fishers shared one lake. Every fish you caught was yours, but a smaller lake hurt <b>everyone</b>. Then the town tried a plan."},
 {h:"THE TRAGEDY OF THE COMMONS",b:"In 1968 the biologist Garrett Hardin wrote about a shared pasture. Each herder gets the full benefit of adding one more cow, but the damage to the grass is shared by all. So everyone adds cows until the pasture is ruined. He called it the <b>tragedy of the commons</b>."},
 {h:"QUICK CHECK",q:"Gil takes 9 fish instead of 6. Who pays for the 3 extra fish?",o:["Only Gil","Everyone who shares the lake","Nobody"],a:1,w:"Gil gets all 3 extra fish, but the smaller lake is smaller for everyone."},
 {h:"SHARE OR GRAB, AGAIN",b:"It's the Prisoner's Dilemma with many players. Taking more is better for you no matter what the others do, but if everyone takes more, everyone ends up with less."},
 {h:"WORKED EXAMPLE",b:"The lake doubles what's left, up to 60. To get back to 60, you must leave at least <b>30</b>. So the most a full lake can lose and still refill is 30, about 7 each for 4 fishers. A rule of 6 each leaves a safety margin. Bo, Cam and Gil took 9 each."},
 {h:"TRY IT",q:"A lake has 40 fish and doubles what's left. What's the most the group can catch and still have 40 next season?",o:["10","20","40"],a:1,w:"Leave 20, which doubles back to 40. So the group can catch 20."},
 {h:"ELINOR OSTROM",b:"Hardin thought only governments or private owners could save a commons. The political scientist <b>Elinor Ostrom</b> went and looked. She studied mountain pastures in Switzerland, forests in Japan and irrigation canals in Spain that communities had shared for centuries. In 2009 she became the first woman to win the Nobel Prize in economics."},
 {h:"WHAT WORKS",r:[["CLEAR LIMITS","Everyone knows the rule, like 1 fish for every 10 in the lake."],["WATCHERS","Someone checks, so cheating gets noticed."],["FAIR PENALTIES","Small at first, bigger for repeat cheaters, like a one-season ban."],["A SAY FOR EVERYONE","People follow rules they helped make."]]},
 {h:"WHEN IT GOES WRONG",b:"Off the coast of Newfoundland, cod were so plentiful for centuries that people thought they could never run out. After decades of heavy fishing, the cod collapsed, and in 1992 Canada closed the fishery. Thousands of people lost their jobs."},
 {h:"LAST CHECK",q:"In the game, which plan made Gil stop overfishing?",o:["No rule","A promise nobody checked","Watchers and a one-season ban"],a:2,w:"A promise is cheap talk. Watchers plus a real penalty made cheating cost more than it paid."}]},
7:{t:"VOTE!",s:"Lesson 7 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"Three groups, three field trips, the same opinions every time. But when you changed the <b>order</b> of the votes, the winner changed."},
 {h:"HEAD TO HEAD",r:[["ZOO VS MUSEUM","Animal Fans and Splash Squad prefer the zoo. Zoo wins 14 to 7."],["MUSEUM VS WATER PARK","Animal Fans and History Buffs prefer the museum. Museum wins 14 to 7."],["WATER PARK VS ZOO","History Buffs and Splash Squad prefer the water park. Water Park wins 14 to 7."]]},
 {h:"QUICK CHECK",q:"Which trip beats BOTH others head-to-head?",o:["Zoo","Museum","Water Park","None of them"],a:3,w:"Each one loses to one of the others. The class's preferences go in a circle."},
 {h:"THE CONDORCET PARADOX",b:"In 1785 the French thinker the <b>Marquis de Condorcet</b> noticed this: each person can have sensible preferences, but the <b>group</b> can prefer A to B, B to C, and C to A. It's called the Condorcet paradox."},
 {h:"THE AGENDA SETTER",b:"When preferences go in a circle, whatever enters the voting <b>last</b> wins. So whoever decides the order of the votes can choose the winner. That's real power, and it's why groups argue about the order of votes."},
 {h:"TRY IT",q:"You want the ZOO to win. Which pair should vote first?",o:["Zoo vs Museum","Museum vs Water Park","Zoo vs Water Park"],a:1,w:"Museum beats Water Park, then Zoo beats Museum. The zoo entered last."},
 {h:"STRATEGIC VOTING",b:"In Stage 2, Splash Squad's favorite couldn't win. Voting for it would let their <b>least</b> favorite, the zoo, win. Voting for their second choice stopped that. Voting this way is called <b>strategic voting</b>."},
 {h:"ARROW'S SURPRISE",b:"In 1951 the economist Kenneth Arrow proved something shocking: with three or more options, no ranked voting system can follow every one of a short list of fair-sounding rules all the time. He later won a Nobel Prize. Every voting system has trade-offs."},
 {h:"OTHER WAYS TO VOTE",b:"Some places use different systems. With <b>ranked-choice voting</b>, used in some US cities and in Maine, you rank the options, and votes for knocked-out options move to each voter's next choice. That can make strategic voting less necessary."},
 {h:"LAST CHECK",q:"Why might a group fight over the ORDER of votes?",o:["When preferences go in a circle, the order can decide the winner","Order never matters","It makes votes faster"],a:0,w:"Same opinions, different order, different winner."}]},
8:{t:"YOUR LONG GAME PLAYBOOK",s:"Boss warm-up · about 5 minutes",S:[
 {h:"SEVEN BIG IDEAS",b:"Tap each card to review it. Then beat three quick checks before you face the Hive Mind."},
 {h:"YOUR CARDS",r:[["TIT FOR TAT","Start nice, hit back right away, forgive fast, be clear."],["TRUST BUILDER","Trust grows with reputation and a future together."],["STABLE STRATEGY","A population settles on a mix no newcomer can beat. Hawks = food ÷ fight cost."],["COSTLY SIGNAL","Believable signals cost too much to fake."],["BLUFF MASTER","With hidden information, bluff sometimes so your moves don't give you away."],["COMMONS KEEPER","Shared resources need limits, watchers and fair penalties."],["AGENDA SETTER","When preferences go in a circle, the order of votes picks the winner."]]},
 {h:"CHECK 1",q:"Tit for Tat's first move is always...",o:["SHARE","GRAB","Random"],a:0,w:"It's nice: it never grabs first."},
 {h:"CHECK 2",q:"Which signal is believable?",o:["One that's free to send","One that's too costly to fake","One that's loud"],a:1,w:"Costly signals are hard to fake."},
 {h:"CHECK 3",q:"A shared lake keeps shrinking. What helped most in the game?",o:["A promise","Watchers and a fair penalty","Fishing faster"],a:1,w:"Rules only work when someone checks."}]},
9:{t:"GO DEEPER",s:"Bonus · explore whenever you like",S:[
 {h:"YOU DID IT!",b:"You've finished all three Game Nights: payoffs and Nash equilibrium, thinking ahead, and now the long game of trust, signals, evolution and voting.<br><br>That's the core of a real college course. Want more? Here's where to go next."},
 {h:"THE REAL COURSE",b:"Game Night was built to make the ideas in <b>Yale's Game Theory course (ECON 159)</b>, taught by Professor Ben Polak, fun and bite-sized.<br><br>The whole course is free on Open Yale Courses: 24 recorded lectures from a real Yale class, about 70 minutes each, with problem sets and exams. It's college-level, so it's a big step up, and a great challenge.<br><br><a href=\"https://oyc.yale.edu/economics/econ-159\" target=\"_blank\" rel=\"noopener\">Open Yale Courses: Game Theory</a>"},
 {h:"PLAY MORE",b:"<b>The Evolution of Trust</b> by Nicky Case is a free interactive game (about 30 minutes) about the repeated Prisoner's Dilemma. You'll watch Tit for Tat and other strategies battle it out, with mistakes thrown in.<br><br><a href=\"https://ncase.me/trust/\" target=\"_blank\" rel=\"noopener\">Play The Evolution of Trust</a>"},
 {h:"READ MORE",b:"<b>The Art of Strategy</b> by Avinash Dixit and Barry Nalebuff (2008): game theory told through stories from sports, business and movies.<br><br><b>Game Theory: A Very Short Introduction</b> by Ken Binmore (2007): short, but more mathematical.<br><br><b>Introduction to Game Theory: A Discovery Approach</b> by Jennifer Firkins Nordstrom: a free online textbook where you work out the ideas yourself.<br><a href=\"https://nordstrommath.com/IntroGameTheoryText\" target=\"_blank\" rel=\"noopener\">Read it free</a>"},
 {h:"FOR THE VERY CURIOUS",b:"<b>The Evolution of Cooperation</b> by Robert Axelrod (1984): the story of the Tit for Tat tournaments, written for everyone.<br><br><b>Governing the Commons</b> by Elinor Ostrom (1990): how real communities protect shared resources. It's written for researchers, so it's a challenge."},
 {h:"KEEP PLAYING",b:"Every time you share a pizza, vote in a group, trust a new friend or decide whether to believe an ad, you're in a game. Now you know how to read it."}]}

var K={"1":["Repeated games: today's move can be paid back tomorrow.","Tit for Tat: nice, quick to hit back, quick to forgive, clear.","Grabbers win once, then get stuck with 1 point a round.","The longer the future, the more sharing pays."],
"2":["Trust game: sent coins triple, the receiver chooses what to return.","Trusting grows the pile; reputation decides what you're offered next.","The last round tempts people to break trust.","Start small and build trust step by step."],
"3":["Hawks fight; doves back down. Neither wins everywhere.","The mix settles where both score the same.","Share of hawks = food ÷ fight cost.","A stable strategy can't be taken over by a few newcomers."],
"4":["Cheap talk: free to say, so it tells you little.","Costly signal: too expensive for the wrong people to fake.","Fast: camp 10 - 2 = 8 > 4. Slow: camp 10 - 8 = 2 < 4.","Diplomas, guarantees and peacock tails can work as signals."],
"5":["Hidden information: your rival can't see your card.","Never bluff: your push gives your card away.","Always bluff: you get caught.","Best mix here: bluff on about 1 LOW card in 3."],
"6":["Tragedy of the commons: each person's extra take hurts everyone a little.","Safe catch: leave enough for the lake to grow back.","Promises alone fail; watchers plus fair penalties work.","Elinor Ostrom showed communities can manage commons well."],
"7":["Group preferences can go in a circle (Condorcet paradox).","Then whoever sets the order of votes can pick the winner.","Strategic voting: back your 2nd choice to stop your last.","Every voting system has trade-offs (Arrow)."],
"8":["Tit for Tat · Trust Builder · Stable Strategy · Costly Signal","Bluff Master · Commons Keeper · Agenda Setter"]};

(function(){var ADD={"1": {"h": "WHY REPEATING CHANGES EVERYTHING", "b": "Who would you rather cheat: a stranger at a garage sale you'll never see again, or the friend you sit with at lunch every day? With the friend, there's always a next round.<br><br>That's one reason friends, teammates and neighbors cooperate more than strangers: the future is watching."}, "2": {"h": "HOW TRUST GROWS", "b": "Trust usually grows in small steps. You lend a friend a pencil before you lend them your phone. Each small promise kept makes the next, bigger one easier.<br><br>Broken trust works the other way: one broken promise can undo many kept ones."}, "3": {"h": "IT'S NOT ABOUT NICE ANIMALS", "b": "Doves aren't \"nicer\" animals and hawks aren't \"meaner.\" They're strategies, and what matters is which one does better against the rest of the group.<br><br>When fights are very costly, more animals back down. When fights are cheap, more of them fight."}, "4": {"h": "SIGNALS IN YOUR LIFE", "b": "Which is a stronger sign that someone is a great guitarist: saying \"I'm great at guitar,\" or playing a hard song in front of you? Talk is cheap. Showing a skill is costly to fake.<br><br>Trophies, finished projects and portfolios work as signals because they're hard to get without the real skill."}, "5": {"h": "WHY BLUFF AT ALL?", "b": "If you only push with high cards, a smart rival backs down every time you push, so your strong hands never win much. Bluffing now and then makes your pushes believable, which helps your strong hands too.<br><br>But bluff too often and you get caught. That's why the best plan is a <b>mix</b>."}, "6": {"h": "IT'S NOT HOPELESS", "b": "The tragedy of the commons isn't a law of nature. Groups that talk things over, set clear limits, watch fairly, and use small penalties that grow if someone keeps cheating can protect a shared resource for generations.<br><br>That's what Elinor Ostrom found again and again."}, "7": {"h": "WHO SETS THE AGENDA?", "b": "This happens outside of games too. In a club or student council meeting, whoever writes the list of what gets voted on, and in what order, quietly has a lot of power.<br><br>Next time your class votes, ask: are we voting on everything at once, or in rounds? It can change the result."}, "8": {"h": "THE BIG PICTURE", "b": "When games repeat, the future matters. Trust, reputation, signals and fair rules all grow from one idea: <b>what you do today changes how others treat you tomorrow.</b>"}};for(var k in ADD){var S=L[k]&&L[k].S;if(!S)continue;var i=S.length-1;if(k==='8'){for(var j=0;j<S.length;j++){if(S[j].q){i=j;break}}}S.splice(i,0,ADD[k]);}})();


(function(){var DEEP={"1": {"h": "NERD ZONE: THE FOLK THEOREM", "b": "Use Share or Grab from Game Night 1: 3 each, 5 vs 0, or 1 each. Say you both share until someone grabs, then both grab forever. Sharing beats a one-time grab as long as the chance of another round is at least <b>1 in 2</b>.<br><br>Game theorists prove a general version called the <b>folk theorem</b>, nicknamed that because many knew it before anyone published it: when the future matters enough, cooperation can be an equilibrium.", "q": "In the folk-theorem example, how likely must another round be for sharing to beat a one-time grab?", "o": ["At least 1 in 2", "At least 1 in 10", "Sharing never beats grabbing"], "a": 0, "w": "With 3 each forever versus 5 once and then 1 forever, sharing wins when the next round is at least 50% likely."}, "2": {"h": "NERD ZONE: TYPES", "b": "If you both know the game lasts exactly 10 rounds, backward induction says trust should collapse from the last round back to the first. Real people trust anyway.<br><br>In 1982 the economists David Kreps, Paul Milgrom, John Roberts and Robert Wilson showed why: if there's even a small chance your partner is the kind who always plays fair as long as you do, it pays to act trustworthy too, until close to the end. These hidden personalities are called <b>types</b>.", "q": "Why act trustworthy even when the last round is known?", "o": ["Your partner might be the kind who plays fair if you do, so a good reputation pays", "Trust is always free", "The last round never comes"], "a": 0, "w": "A small chance of a fair-minded partner keeps cooperation going until close to the end."}, "3": {"h": "NERD ZONE: THE ESS TEST", "b": "Maynard Smith's test has two steps. Imagine a few newcomers playing differently. The old strategy is <b>evolutionarily stable</b> if the newcomers do worse against it than it does against itself, or if they tie there but, when the two kinds meet, the old strategy scores more than the newcomers score against each other.<br><br>Biologists also use <b>replicator dynamics</b>: a strategy spreads when it scores above the group's average and shrinks when it scores below. In Hawk or Dove, that pulls the flock to the balance point.", "q": "Replicator dynamics says a strategy spreads when...", "o": ["It scores above the group's average", "Most animals like it", "It is the nicest strategy"], "a": 0, "w": "Above average grows, below average shrinks, until the mix settles."}, "4": {"h": "NERD ZONE: SEPARATE OR POOL", "b": "If fast and slow runners make different choices, so the badge tells them apart, it's a <b>separating equilibrium</b>. If everyone makes the same choice, the badge tells you nothing: a <b>pooling equilibrium</b>. Signals separate when they cost much more for the wrong type.<br><br>Hidden information can even break a market. In 1970 George Akerlof showed that when buyers can't tell good used cars from \"lemons,\" good cars can disappear from the market.", "q": "If fast and slow runners all skip camp, the badge tells you nothing. That's a...", "o": ["Pooling equilibrium", "Separating equilibrium", "Dominant move"], "a": 0, "w": "Everyone makes the same choice, so the signal can't tell the types apart."}, "5": {"h": "NERD ZONE: BOTH SIDES MIX", "b": "At the balance point, both players mix, and each one's mix is set by the <b>other</b> player's payoffs. You bluff just often enough that challenging and backing down pay your rival the same. Your rival challenges just often enough that bluffing and giving up pay you the same.<br><br>Neither can gain by changing alone, so it's a Nash equilibrium in mixed strategies: the same idea as the penalty kicks in Game Night 1.", "q": "At the balance point, what sets how often YOU should bluff?", "o": ["Your rival's payoffs", "Your own favorite cards", "Pure luck"], "a": 0, "w": "You bluff just often enough that your rival can't gain by challenging or by backing down."}, "6": {"h": "NERD ZONE: EXTERNALITIES", "b": "A cost you push onto other people is called an <b>externality</b>. Each extra fish you take costs everyone a little of next year's lake, but you don't pay that cost yourself, so everyone takes too many.<br><br>The shared lake is a Prisoner's Dilemma with many players, called a <b>collective action problem</b>. Ostrom's fixes (watching, fair rules, growing penalties) work by putting the cost back on the person who causes it.", "q": "Why does everyone take too many fish?", "o": ["Each extra fish's cost is shared by everyone, not paid by the taker", "Bigger lakes have tastier fish", "The lake never refills"], "a": 0, "w": "That's an externality: you keep the whole benefit but share the cost."}, "7": {"h": "NERD ZONE: NO SYSTEM IS SAFE", "b": "Arrow's theorem has a cousin. The <b>Gibbard-Satterthwaite theorem</b> (1973 and 1975) says that with three or more options, every voting system that isn't run by a dictator, and lets any option win, can sometimes reward strategic voting.<br><br>There's good news too. If every voter's opinions line up along one scale, like the beach in Game Night 1, Duncan Black showed in 1948 that the <b>median voter's</b> favorite can't be beaten head to head. No circle.", "q": "Gibbard and Satterthwaite showed that with three or more options...", "o": ["Every voting system that isn't a dictatorship can sometimes reward strategic voting", "Ranked voting can never be gamed", "The middle option always wins"], "a": 0, "w": "No voting system is completely safe from strategic voting."}, "8": {"h": "NERD ZONE: NOBEL GAMES", "b": "Game theory keeps winning the Nobel Prize in economics: Nash, Harsanyi and Selten (1994); Vickrey and Mirrlees (1996); Akerlof, Spence and Stiglitz for hidden information (2001); Aumann and Schelling for conflict and cooperation (2005); Hurwicz, Maskin and Myerson for mechanism design (2007); Ostrom (2009); Roth and Shapley for matching markets (2012); Milgrom and Wilson for auctions (2020).<br><br>You've now met the ideas behind many of them.", "q": "Who was the first woman to win the Nobel Prize in economics?", "o": ["Elinor Ostrom", "Esther Duflo", "Claudia Goldin"], "a": 0, "w": "Ostrom won in 2009 for showing how communities protect shared resources. Duflo (2019) and Goldin (2023) came later."}};var GD=[{"h": "YOU DID IT!", "b": "You've finished all three Game Nights: payoffs and Nash equilibrium, thinking ahead, and now the long game of trust, signals, evolution and voting.<br><br>That's the core of a real college course. Want more? Here's where to go next."}, {"h": "WATCH THE LECTURES FOR PART 3", "b": "These lectures from <b>Yale's free Game Theory course (ECON 159)</b>, taught by Professor Ben Polak, match Part 3:<br><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-11\" target=\"_blank\" rel=\"noopener\">Lecture 11: Evolutionary Stability: Cooperation, Mutation, and Equilibrium</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-12\" target=\"_blank\" rel=\"noopener\">Lecture 12: Evolutionary Stability: Social Convention, Aggression, and Cycles</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-21\" target=\"_blank\" rel=\"noopener\">Lecture 21: Repeated Games: Cooperation vs. the End Game</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-22\" target=\"_blank\" rel=\"noopener\">Lecture 22: Repeated Games: Cheating, Punishment, and Outsourcing</a><br><a href=\"https://oyc.yale.edu/economics/econ-159/lecture-23\" target=\"_blank\" rel=\"noopener\">Lecture 23: Asymmetric Information: Silence, Signaling and Suffering Education</a>"}, {"h": "THE WHOLE REAL COURSE", "b": "Game Night was built to make the ideas in <b>Yale's Game Theory course (ECON 159)</b> fun and bite-sized. The whole course is free on Open Yale Courses: 24 recorded lectures from a real Yale class, about 70 minutes each, with problem sets and exams. You now know the ideas behind a big part of it, so it's the perfect next step if you want the full college version.<br><br><a href=\"https://oyc.yale.edu/economics/econ-159\" target=\"_blank\" rel=\"noopener\">Open Yale Courses: Game Theory</a>"}, {"h": "PLAY MORE", "b": "<b>The Evolution of Trust</b> by Nicky Case is a free interactive game (about 30 minutes) about the repeated Prisoner's Dilemma. You'll watch Tit for Tat and other strategies battle it out, with mistakes thrown in.<br><a href=\"https://ncase.me/trust/\" target=\"_blank\" rel=\"noopener\">Play The Evolution of Trust</a>"}, {"h": "READ MORE", "b": "<b>The Art of Strategy</b> by Avinash Dixit and Barry Nalebuff (2008): game theory told through stories from sports, business and movies.<br><br><b>Game Theory: A Very Short Introduction</b> by Ken Binmore (2007): short, but more mathematical.<br><br><b>Introduction to Game Theory: A Discovery Approach</b> by Jennifer Firkins Nordstrom: a free online textbook where you work out the ideas yourself.<br><a href=\"https://nordstrommath.com/IntroGameTheoryText\" target=\"_blank\" rel=\"noopener\">Read it free</a>"}, {"h": "FOR THE VERY CURIOUS", "b": "<b>The Evolution of Cooperation</b> by Robert Axelrod (1984): the story of the Tit for Tat tournaments, written for everyone.<br><br><b>Governing the Commons</b> by Elinor Ostrom (1990): how real communities protect shared resources. It's written for researchers, so it's a challenge."}, {"h": "KEEP PLAYING", "b": "Every time you share a pizza, vote in a group, trust a new friend or decide whether to believe an ad, you're in a game. Now you know how to read it."}];for(var k in DEEP){var S=L[k]&&L[k].S;if(!S)continue;var i=S.length-1;if(k==='8'){for(var j=0;j<S.length;j++){if(S[j].q){i=j;break}}}S.splice(i,0,DEEP[k]);}if(L[9]){L[9].S=GD;L[9].t='GO DEEPER';}})();

  if(k===s.a){if(!tried)first++;el("ft").textContent=first+"/"+checks;b.classList.add("on");
    el("fb").innerHTML="<span class=\"good\"><b>"+(tried?"Got it.":"Yes!")+"</b></span> "+s.w;
    Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(x){x.disabled=true});el("next").style.display="inline-block";}
  else{tried=true;b.disabled=true;el("fb").innerHTML="<span class=\"bad\"><b>Not quite.</b></span> Look back at the screen and try another answer.";}
}
var lastNav=0;
function nextScreen(){var t=Date.now();if(t-lastNav<300)return;lastNav=t;if(i<LS.S.length-1){i++;draw()}else finish()}
function finish(){el("round").style.display="none";
  var rk=first===checks?"PERFECT RUN":(first>=checks-1?"SHARP READER":"LEVEL CLEARED");el("rank").textContent=rk;
  el("verdict").textContent="You got "+first+" of "+checks+" checks right on the first try.";
  el("out").value="GN3-READ-M0"+m+" | lesson finished"+(checks?" | checks right on first try "+first+"/"+checks:" | bonus links explored");
  el("keys").innerHTML="<b>KEY IDEAS</b> (keep this open while you talk to Rocky)<br>"+(K[m]||[]).map(function(x){return "• "+x}).join("<br>");if(checks===0){el("rank").textContent="EXPLORER";var lk=[];LS.S.forEach(function(x){var d=document.createElement("div");d.innerHTML=x.b||"";Array.prototype.forEach.call(d.querySelectorAll("a"),function(a){lk.push("<a href=\""+a.getAttribute("href")+"\" target=\"_blank\" rel=\"noopener\">"+a.textContent+"</a>")})});el("verdict").innerHTML="All the links in one place:<br>"+lk.join("<br>");el("out").style.display="none";Array.prototype.forEach.call(document.querySelectorAll("#final button, #final p"),function(x){if(x.id!=="verdict")x.style.display="none"});el("keys").style.display="none";}
  el("final").style.display="block";window.scrollTo(0,0);}
function copyIt(){
  var t=el("out"),s=el("status");t.select();t.setSelectionRange(0,999);var ok=false;
  function fallback(){try{ok=document.execCommand("copy")}catch(e){}s.textContent=ok?"Copied! Now paste it to Rocky.":"Tap the box, select all, copy, then paste it to Rocky."}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(function(){s.textContent="Copied! Now paste it to Rocky."},fallback);return}}catch(e){}
