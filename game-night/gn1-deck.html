<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Deck</title>
<style>
  body{margin:0;background:#07070f;color:#e8f7ff;font-family:"Courier New",monospace;padding:14px;text-align:center}
  h1{font-size:22px;letter-spacing:3px;margin:8px 0}
  h2{font-size:16px;letter-spacing:2px;margin:6px 0}
  p{line-height:1.45}
  table{margin:10px auto;border-collapse:collapse}
  td,th{border:2px solid #00e5ff;padding:7px 9px;font-size:14px}
  button{font:bold 16px "Courier New",monospace;margin:5px;padding:10px 14px;cursor:pointer}
  #out{width:95%;max-width:620px;height:110px;font:14px "Courier New",monospace}
  .note{font-size:14px}
  .panel{position:relative;margin:14px auto;padding:16px 14px 18px;border-radius:26px;
   background:radial-gradient(ellipse at 50% 35%,var(--felt,#0f6b3a),var(--felt-dark,#0a4a28) 85%);
   border:10px solid #5a2e12;box-shadow:inset 0 0 0 3px #b8860b,inset 0 0 40px rgba(0,0,0,.55),0 10px 24px rgba(0,0,0,.55)}
  .panel::before{content:"♠ ♥ ♣ ♦";display:block;font-size:12px;letter-spacing:8px;color:rgba(255,255,255,.28);margin-bottom:4px}
  @media (max-width:480px){.panel{border-width:6px;padding:12px 8px 14px}}
  .story{background:rgba(0,0,0,.28);border-radius:12px;padding:10px 12px;text-align:left;font-size:15px}
  .msg{min-height:22px;color:#ffe9a8;font-weight:600}
  .tiny{font-size:11px;color:#7dff9e}
  .gwrap{max-width:100%;overflow-x:auto}
  .grid td{min-width:0;padding:5px 4px}
  .grid th{padding:5px 4px;font-size:12px}
  .step{display:flex;align-items:center;justify-content:center;gap:4px;margin:3px 0}
  .step .who{font-size:10px;min-width:30px;text-align:right;color:#f3d38a}
  .step b{display:inline-block;min-width:18px;font-size:18px;color:#fff}
  button.mini{min-width:28px !important;padding:1px 4px !important;margin:2px 1px !important;font-size:13px !important;border-width:2px !important;box-shadow:0 0 0 2px #5e0b17,0 3px 0 2px #3a0610 !important}
  button.mini2{min-width:54px !important}
  td.locked{background:rgba(255,255,255,.06)}
  .nash td{font-size:15px;min-width:0;padding:6px 4px}
  .nash td.act{background:rgba(255,233,168,.16);cursor:pointer;outline:2px dashed #ffe9a8;outline-offset:-4px}
  .nash td.lock{background:rgba(247,201,72,.28);box-shadow:inset 0 0 12px rgba(247,201,72,.8)}
  .ring{display:inline-block;border:2px solid #ffd84d;border-radius:50%;padding:0 6px;color:#ffe9a8}
  .locktxt{font:11px "Bungee","Arial Black",sans-serif;color:#ffd84d;letter-spacing:1px}
  .ladder{display:inline-block;margin:6px auto;text-align:left}
  .rung{padding:5px 14px;margin:3px 0;border-left:4px solid #555;background:rgba(0,0,0,.3);border-radius:6px;font-size:14px;color:#aaa}
  .rung.on{border-left-color:#ffd84d;color:#fff7e6}
  .dial{font:20px "Bungee","Arial Black",sans-serif;margin:8px 0;color:#ffe9a8}
  .barrow{display:flex;align-items:center;gap:8px;margin:8px auto;max-width:520px;text-align:left}
  .bl{min-width:150px;font-size:13px}
  .track{flex:1;height:18px;background:rgba(0,0,0,.4);border-radius:9px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#38d17f,#7dff9e)}
  .fill.low{background:linear-gradient(90deg,#d7263d,#ff8a8a)}
  button.on:disabled{filter:none;opacity:1}
</style>
<style>
  .deck{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:10px}
  .card{width:150px;height:250px;border-radius:14px;position:relative;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.55);
   background:#fff8e7;color:#1b1b1b;border:3px solid #fff;overflow:hidden;font-family:"Rubik",system-ui,sans-serif}
  .card .front,.card .bk{position:absolute;inset:0;padding:10px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .card .bk{display:none;background:#fff8e7;font-size:12px;overflow-y:auto;text-align:left;justify-content:flex-start}
  .card.flip .front{display:none}.card.flip .bk{display:flex}
  .card .bk p{margin:6px 0;line-height:1.3}
  .card .ex{color:#7a1020;font-style:italic}
  .cn{font-size:10px;letter-spacing:2px;color:#888;position:absolute;top:7px;left:9px}
  .emo{font-size:46px;margin:6px 0}
  .name{font:15px "Bungee","Arial Black",sans-serif;text-align:center;color:#1b1b1b;line-height:1.15}
  .rar{margin-top:6px;font-size:11px;letter-spacing:2px;font-weight:800;padding:2px 8px;border-radius:999px;background:#ddd}
  .hint{position:absolute;bottom:7px;font-size:10px;color:#999}
  .card.common{border-color:#b9b9b9}.card.common .rar{background:#e3e3e3}
  .card.rare{border-color:#1e6fd9}.card.rare .rar{background:#1e6fd9;color:#fff}
  .card.epic{border-color:#7b3fe4}.card.epic .rar{background:#7b3fe4;color:#fff}
  .card.legendary{border-color:#f7c948;background:linear-gradient(160deg,#fff8e7,#ffe9a8)}.card.legendary .rar{background:#b8860b;color:#fff}
  .card.back{background:repeating-linear-gradient(45deg,#8c1c2b 0 8px,#5c0f1a 8px 16px);border-color:#f7c948;color:#ffe9a8;cursor:default;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .card.back .cn{color:#ffe9a8}
  .backpat{font-size:32px;line-height:1.1;color:rgba(255,233,168,.7)}
  .lockd{margin-top:8px;font:12px "Bungee","Arial Black",sans-serif;letter-spacing:2px}
  .card.glow{animation:glowc 1.4s ease-in-out infinite}
  @keyframes glowc{0%,100%{box-shadow:0 0 0 0 rgba(247,201,72,.0),0 6px 14px rgba(0,0,0,.55)}50%{box-shadow:0 0 22px 6px rgba(247,201,72,.9),0 6px 14px rgba(0,0,0,.55)}}
  .newbanner{display:inline-block;margin:6px auto 4px;padding:8px 14px;border-radius:10px;background:#0a0a0a;border:2px solid #ffd84d;color:#ffd84d;font:14px "Bungee","Arial Black",sans-serif;letter-spacing:1px}
  .card.foil{border-color:#f7c948 !important;background:linear-gradient(120deg,#fff3c4 0%,#f7c948 30%,#fffbe6 48%,#e0a91c 66%,#fff3c4 100%) !important;background-size:220% 220% !important;animation:foilsh 3s linear infinite}
  .card.foil .rar{background:#b8860b !important;color:#fff !important}
  .foiltag{margin-top:4px;font:11px "Bungee","Arial Black",sans-serif;letter-spacing:2px;color:#7a5200}
  @keyframes foilsh{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  .use{font-weight:600;color:#1b4d2e}
  @media (prefers-reduced-motion:reduce){.card.glow,.card.foil{animation:none}}
</style>

 background:

 font:600 11px "Rubik",sans-serif;letter-spacing:2px;color:#f3d38a}

 background:radial-gradient(circle at 50% 35%,#ff5a6e,var(--red) 60%) !important;border:3px dashed rgba(255,255,255,.9) !important;border-radius:999px !important;
 box-shadow:0 0 0 4px var(--red),0 6px 0 4px #5e0b17,0 10px 14px rgba(0,0,0,.45) !important;text-shadow:0 2px 0 rgba(0,0,0,.45);

button:nth-of-type(4n+4){background:radial-gradient(circle at 50% 35%,#38d17f,var(--green) 60%) !important;box-shadow:0 0 0 4px var(--green),0 6px 0 4px #06512b,0 10px 14px rgba(0,0,0,.45) !important}
button:active{transform:translateY(4px)}
button.on{background:radial-gradient(circle at 50% 35%,#fff3c4,var(--gold) 60%) !important;color:#3a2200 !important;text-shadow:none;box-shadow:0 0 0 4px var(--gold),0 0 18px 6px rgba(247,201,72,.75),0 6px 0 4px #6b4a00 !important}
button:disabled{filter:grayscale(1) brightness(.6);cursor:default}
#next,button.big,#final button,#go{background:linear-gradient(180deg,#ffe28a,#f7c948 45%,#c99212) !important;color:#3a2200 !important;text-shadow:0 1px 0 rgba(255,255,255,.6);
 border:3px solid #fff3c4 !important;border-radius:14px !important;box-shadow:0 0 0 4px #8a5a00,0 6px 0 4px #4a2f00,0 0 22px rgba(247,201,72,.45) !important;padding:12px 22px !important}
table{background:rgba(0,0,0,.28);border-radius:10px;overflow:hidden;border-collapse:separate !important;border-spacing:0}
td,th{border:1px solid rgba(247,201,72,.45) !important;color:#fff7e6}
th{color:var(--gold) !important;font-family:"Rubik",sans-serif;font-weight:800;background:rgba(0,0,0,.25)}
.note{color:#f1dfc0 !important;opacity:.92}
.news{font-family:"Bungee","Arial Black",sans-serif;font-size:14px !important;color:#ffd84d !important;background:#0a0a0a;border:2px solid #ffd84d !important;border-radius:8px;padding:8px 14px !important;box-shadow:0 0 12px rgba(255,216,77,.4);letter-spacing:1px}
.rival,.partner,.goalie{color:#9fe7ff !important;text-shadow:0 1px 0 #000}
.promise{color:#ffe9a8 !important}
.rank{font-family:"Bungee","Arial Black",sans-serif !important;font-size:clamp(24px,6vw,34px) !important;display:inline-block;padding:10px 18px;margin:12px auto 6px !important;border-radius:14px;
 color:#fff2b3 !important;background:#1a0610;border:3px solid var(--gold);text-shadow:0 0 10px #ffb300,0 0 22px #ff6a00 !important;animation:jackpot 1.4s ease-in-out infinite;box-shadow:0 0 0 4px #4a1020,0 0 26px rgba(255,179,0,.55)}
@keyframes jackpot{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.tape{background:var(--ivory) !important;color:var(--ink) !important;border:none !important;border-radius:12px !important;box-shadow:0 6px 14px rgba(0,0,0,.5) !important;
 padding:14px 16px 12px 34px !important;position:relative;max-width:520px}
.tape::before{content:"♦";position:absolute;left:10px;top:8px;color:var(--red);font-size:18px}
.tape b{color:#a1001c !important}
.fact{background:linear-gradient(180deg,#d8b25a,#a87b22);color:#2a1800 !important;border:2px solid #fff0b8 !important;border-radius:10px;padding:12px 14px !important;box-shadow:0 4px 0 #5a3a00,0 8px 16px rgba(0,0,0,.4)}
#out{font-family:"Courier New",monospace !important;background:#fffdf4 !important;color:#222 !important;border:2px dashed #b8860b !important;border-radius:6px;box-shadow:0 6px 12px rgba(0,0,0,.4)}
.goal,.good,.w,.k,td.k{color:#7dff9e !important;text-shadow:0 1px 0 #000}
.save,.bad,.l,.w-,td.w{color:#ff8a8a !important;text-shadow:0 1px 0 #000}
.disp{background:#120000 !important;color:#ff4747 !important;border:3px solid var(--gold) !important;border-radius:10px;font-family:"Bungee",sans-serif !important;text-shadow:0 0 8px #ff2a2a}
.shower{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.shower span{position:absolute;top:-40px;width:26px;height:26px;border-radius:50%;border:4px dashed rgba(255,255,255,.9);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.marquee i,.rank{animation:none}}
@media (max-width:480px){#pick,#round,#result,#final{border-width:6px;padding:12px 8px 14px}button{margin:8px 5px !important;padding:9px 12px !important}}
</style>
</head>
<body>
<h1>STRATEGY DECK</h1>
<p class="note">Every module of Game Night 1 unlocks a card. Tap a card to flip it.</p>
<div class="panel" id="deckpanel">
  <h2 id="count"></h2>
  <div id="newcard"></div>
  <div class="deck" id="deck"></div>
</div>
<script>
var CARDS=[
 {n:"The Four Parts",e:"🧩",r:"COMMON",d:"Every game has players, the moves they can make, the payoffs they care about, and what each player knows.",u:"a situation feels confusing: name the players, moves, payoffs and who knows what.",x:"Rock-paper-scissors: 2 players, 3 moves, win/lose/tie, and nobody sees the other hand first."},
 {n:"Dominant Move",e:"💪",r:"COMMON",d:"A move that is your best choice no matter what anyone else does.",u:"one move beats the others no matter what anyone else does: just take it.",x:"In Share or Grab, Grab always scores you more, whatever your partner picks."},
 {n:"Nash Lock",e:"🔒",r:"RARE",d:"A set of moves where nobody can do better by changing only their own move.",u:"you need to predict where a group will settle: look for the spot nobody wants to leave alone.",x:"Two friends both waiting at the same mall entrance: neither wants to walk away alone."},
 {n:"Level Up",e:"🧠",r:"RARE",d:"Figure out how many steps ahead other people are thinking, then stay one step ahead of them.",u:"you're guessing what others will do: ask how many steps ahead they think, then go one more.",x:"If everyone else guesses 33, the smart guess is 22."},
 {n:"Median Magnet",e:"🍦",r:"RARE",d:"When rivals pick a spot on a line, they get pulled toward the middle.",u:"you're picking a spot, a price or an opinion against rivals: the middle pulls everyone in.",x:"Two ice-cream trucks end up parked side by side in the middle of the beach."},
 {n:"Keep 'Em Guessing",e:"🎲",r:"EPIC",d:"Mix your moves on purpose so a smart opponent can't take advantage of you.",u:"a smart opponent is studying your habits: mix it up so they can't read you.",x:"A kicker who always shoots left gets saved; a kicker who mixes scores more."},
 {n:"Price War",e:"⚔️",r:"EPIC",d:"When rivals keep undercutting each other, prices fall until nobody earns much. Loyal fans or a different product soften the war.",u:"a rival keeps cutting prices: compete on something besides price, like loyal fans or a different product.",x:"Two lemonade stands keep dropping prices until a cup barely covers the lemons."},
 {n:"Strategist",e:"👑",r:"LEGENDARY",d:"You beat the Dealer: you can spot the game, find each player's best moves, and predict where it settles.",u:"any choice depends on what other people choose: spot the game, find best moves, predict where it settles.",x:"Next time your group can't agree where to eat, you'll know exactly why."}
];
function el(i){return document.getElementById(i)}
var got=[];
try{var raw=localStorage.getItem("gn1deck");if(raw)got=JSON.parse(raw)||[]}catch(e){got=[]}
var fresh=null,foil=[];
try{var fr=localStorage.getItem("gn1foil");if(fr)foil=JSON.parse(fr)||[]}catch(e){foil=[]}
try{var m=/[?&]card=(\d+)/.exec(location.search);if(m){var k=parseInt(m[1],10);if(k>=1&&k<=8){fresh=k;if(got.indexOf(k)<0)got.push(k);if(/[?&]foil=1(&|$)/.test(location.search)&&foil.indexOf(k)<0)foil.push(k)}}}catch(e){}
try{localStorage.setItem("gn1foil",JSON.stringify(foil))}catch(e){}
try{localStorage.setItem("gn1deck",JSON.stringify(got))}catch(e){}
function draw(){
  var h="";
  CARDS.forEach(function(c,i){
    var n=i+1,open=got.indexOf(n)>=0,isFoil=foil.indexOf(n)>=0;
    if(!open){h+="<div class=\"card back\"><div class=\"backpat\">♠♥<br>♣♦</div><div class=\"cn\">CARD "+n+"</div><div class=\"lockd\">LOCKED</div></div>";return}
    h+="<div class=\"card "+c.r.toLowerCase()+(isFoil?" foil":"")+(n===fresh?" glow":"")+"\" onclick=\"this.classList.toggle('flip')\">"+
      "<div class=\"front\"><div class=\"cn\">CARD "+n+"</div><div class=\"emo\">"+c.e+"</div><div class=\"name\">"+c.n+"</div><div class=\"rar\">"+c.r+"</div>"+(isFoil?"<div class=\"foiltag\">GOLD FOIL</div>":"")+"<div class=\"hint\">tap to flip</div></div>"+
      "<div class=\"bk\"><div class=\"name\">"+c.n+"</div><p>"+c.d+"</p><p class=\"use\">Use it when "+c.u+"</p><p class=\"ex\">Example: "+c.x+"</p></div></div>";
  });
  el("deck").innerHTML=h;
  el("count").textContent="CARDS COLLECTED: "+got.length+" OF 8";
  if(fresh){var c=CARDS[fresh-1];el("newcard").innerHTML="<div class=\"newbanner\">"+(foil.indexOf(fresh)>=0?"NEW GOLD FOIL CARD: ":"NEW CARD UNLOCKED: ")+c.e+" "+c.n.toUpperCase()+"</div>"}
}
draw();
</script>

<script id="casino-skin-js">
(function(){try{
  var h=document.querySelector("h1");
  if(h&&!document.querySelector(".sign")){
    var sign=document.createElement("div");sign.className="sign";
    function row(){var m=document.createElement("div");m.className="marquee";var s="";for(var i=0;i<22;i++)s+="<i></i>";m.innerHTML=s;return m}
    h.parentNode.insertBefore(sign,h);
    var tag=document.createElement("span");tag.className="tag";tag.textContent="GAME NIGHT 1 · OUTSMART ANYONE";
    sign.appendChild(row());sign.appendChild(tag);sign.appendChild(h);sign.appendChild(row());
  }
  var f=document.getElementById("final");
  if(f&&window.MutationObserver){var fired=false;new MutationObserver(function(){
    if(!fired&&f.style.display==="block"){fired=true;shower()}}).observe(f,{attributes:true,attributeFilter:["style"]});}
  function shower(){
    try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
    var cols=["#d7263d","#1e6fd9","#222","#13a05a","#f7c948","#7b3fe4"],b=document.createElement("div");b.className="shower";
    for(var i=0;i<20;i++){var s=document.createElement("span");s.style.left=Math.round(Math.random()*96)+"%";s.style.background=cols[i%cols.length];
      s.style.animationDuration=(1.6+Math.random()*0.6)+"s";s.style.animationDelay=(Math.random()*0.3)+"s";b.appendChild(s)}
    document.body.appendChild(b);setTimeout(function(){if(b.parentNode)b.parentNode.removeChild(b)},2600);
  }
}catch(e){}})();
</script>
