<script>
function T(rows){return "<table>"+rows.map(function(r,i){return "<tr>"+r.map(function(c){return i===0||c===r[0]?"<th>"+c+"</th>":"<td>"+c+"</td>"}).join("")+"</tr>"}).join("")+"</table>"}
var PD=T([["You \\ Partner","SHARE","GRAB"],["SHARE","You 3, Partner 3","You 0, Partner 5"],["GRAB","You 5, Partner 0","You 1, Partner 1"]]);
var L={
1:{t:"EVERY GAME HAS FOUR PARTS",s:"Lesson 1 · about 11 minutes",S:[
 {h:"WHAT JUST HAPPENED?",b:"You and Jordan both wanted the same thing: to find each other. But you each chose <b>without talking</b>, and your result depended on <b>your</b> choice and <b>Jordan's</b>.<br><br>That is what game theory studies: choices where what you get depends on what other people choose too."},
 {h:"QUICK CHECK",q:"In the mall game, when did you score?",o:["When I picked the most popular place","When Jordan and I picked the same thing","When I picked fastest"],a:1,w:"You scored only on a match. A popular place helped only because Jordan was likely to pick it too."},
 {h:"WHERE GAME THEORY CAME FROM",b:"In 1944 the mathematician John von Neumann and the economist Oskar Morgenstern wrote a book called <i>Theory of Games and Economic Behavior</i>. It started a whole new field.<br><br>Today game theory is used by economists, biologists who study animals, sports analysts, and people who design apps and AI."},
 {h:"THE FOUR PARTS",b:"Every game, from chess to the mall game, has four parts:<br><br><b>PLAYERS</b>: who is choosing.<br><b>MOVES</b>: the choices each player can make.<br><b>PAYOFFS</b>: what each player gets for every mix of moves.<br><b>INFORMATION</b>: what each player knows when they choose."},
 {h:"THE MALL GAME, PART BY PART",r:[["PLAYERS","You and Jordan."],["MOVES","The places, times, numbers and coin sides you could pick."],["PAYOFFS","Match: you both win. Miss: you both get nothing."],["INFORMATION","You choose at the same moment, and neither of you sees the other's choice."]]},
 {h:"PAYOFFS AREN'T ALWAYS POINTS",b:"A payoff is whatever the player cares about: points, money, time, a grade, or just having fun with a friend.<br><br>In the mall game, nobody handed you a prize. The payoff was <b>finding Jordan</b>."},
 {h:"TRY IT: ROCK-PAPER-SCISSORS",q:"\"Both players throw at the same moment, so neither sees the other's pick.\" Which part is that?",o:["Players","Moves","Payoffs","Information"],a:3,w:"Information is what you know when you choose. In rock-paper-scissors you know nothing about the other throw."},
 {h:"ONE MORE",q:"\"Rock beats scissors, scissors beats paper, paper beats rock, the same throw is a tie.\" Which part is that?",o:["Players","Moves","Payoffs","Information"],a:2,w:"Payoffs tell you what each player gets for each mix of moves: win, lose or tie."},
 {h:"SAME TIME OR TAKING TURNS?",b:"Information can be very different from game to game.<br><br>In rock-paper-scissors you choose at the <b>same time</b>, so you know nothing about the other choice. In chess or tic-tac-toe you <b>take turns</b> and see every move before you choose.<br><br>Game Night 2 is all about turn-taking games."},
 {h:"TWO KINDS OF GAMES",b:"In some games, one player's win is the other's loss, like rock-paper-scissors.<br><br>In others, like the mall game, you win together or lose together. That is a <b>coordination game</b>. When people can't talk, they often pick whatever stands out to everyone, called a <b>focal point</b>.<br><br>In 1960 the economist Thomas Schelling asked a group of students where they would meet someone in New York with no plan. The most common answer: the information booth at Grand Central Terminal, at noon."},
 {h:"FOCAL POINTS IN REAL LIFE",b:"You use focal points all the time without noticing:<br><br>• Meeting \"at the front\" of a place, not a side door.<br>• Splitting something 50/50 when nobody has a better idea.<br>• Calling \"heads\" because it comes to mind first.<br><br>When you can't talk, pick what the <b>other</b> person is most likely to pick."},
 {h:"LAST CHECK",q:"Round 5: Jordan's text said \"Food court!\" Why should you trust it?",o:["Jordan might be tricking me","We both want to meet, so Jordan gains nothing by lying","Texts are always true"],a:1,w:"In a coordination game you both want the same thing, so an honest message helps you both."}]},
2:{t:"DOMINANT MOVES AND THE PRISONER'S DILEMMA",s:"Lesson 2 · about 11 minutes",S:[
 {h:"READING A PAYOFF TABLE",b:"Rows are <b>your</b> moves. Columns are your <b>partner's</b> moves. Each box shows what you both get."+PD},
 {h:"QUICK CHECK",b:PD,q:"You SHARE and your partner GRABS. What do you get?",o:["0","1","3","5"],a:0,w:"Find your row (SHARE) and their column (GRAB): you get 0, they get 5."},
 {h:"THE COVER-A-COLUMN TRICK",b:"To find your best move, pretend you know what your partner does. Look at one column at a time.<br><br>Partner SHARES: Share gets you 3, Grab gets you <b>5</b>. Grab is better.<br>Partner GRABS: Share gets you 0, Grab gets you <b>1</b>. Grab is better again."},
 {h:"DOMINANT MOVE",b:"Grab wins in <b>both</b> columns. A move that is best for you <b>no matter what</b> the other player does is a <b>dominant move</b>.<br><br>If you have one, you don't even need to guess what the other player will do."},
 {h:"TRY IT: TWO SHOPS",b:T([["You \\ Rival","AD","NO AD"],["AD","You 2","You 6"],["NO AD","You 1","You 4"]])+"Your payoffs only. Use the cover-a-column trick.",q:"Which move is dominant for you?",o:["AD","NO AD","Neither"],a:0,w:"Rival runs an ad: 2 beats 1. Rival doesn't: 6 beats 4. AD wins both columns."},
 {h:"WHERE THE NAME COMES FROM",b:"Two researchers at the RAND Corporation, Merrill Flood and Melvin Dresher, invented this game in 1950. The mathematician Albert Tucker told it as a story: two suspects are questioned in separate rooms. Each is offered a deal to blame the other. If both stay quiet, both get a short sentence. If both blame each other, both get a long one."},
 {h:"THE DILEMMA",b:"If both players follow their dominant move, both GRAB and get <b>1 each</b>. If both had shared, they'd get <b>3 each</b>.<br><br>Each player's smart choice leads to a worse result for both. This is the <b>Prisoner's Dilemma</b>."},
 {h:"DILEMMAS ARE EVERYWHERE",b:"• Two companies both spend a fortune on ads, mostly canceling each other out.<br>• Fishing boats each catch as much as they can, and the fish run out for everyone.<br>• Two countries both build more weapons, and neither ends up safer.<br><br>Each side's smart move makes everyone worse off."},
 {h:"WHY DID PARTNER 5 GRAB?",r:[["TAP TO FIND OUT","Partner 5 remembered how often you grabbed. When a game is played again and again, trust becomes worth something, and breaking promises costs you later."]]},
 {h:"HOW TO ESCAPE: TIT FOR TAT",b:"Around 1980 the political scientist Robert Axelrod held a contest. Experts sent in computer programs to play the Prisoner's Dilemma against each other, again and again.<br><br>The winner, sent in by Anatol Rapoport, was the simplest one: <b>Tit for Tat</b>. Share on the first round, then copy whatever your partner did last time. Nice, but not a pushover."},
 {h:"LAST CHECK",q:"Which one is a Prisoner's Dilemma?",o:["Two teammates who both slack on a group project, each hoping the other does the work","Flipping a coin","A race where the fastest runner wins"],a:0,w:"Each slacker gains by slacking, but if both slack, the project (and both grades) suffer."}]},
3:{t:"NASH EQUILIBRIUM",s:"Lesson 3 · about 11 minutes",S:[
 {h:"BEST REPLY",b:"Your <b>best reply</b> is your best move if you already knew what everyone else would do.<br><br>Bank rules: WITHDRAW always pays 10. KEEP pays 15 if at least 4 of the 6 savers keep, otherwise 0."},
 {h:"QUICK CHECK",q:"The other 5 savers all KEEP. What is your best reply?",o:["KEEP (15)","WITHDRAW (10)"],a:0,w:"With you, 6 keep, so the bank survives and keeping pays 15, more than 10."},
 {h:"AND NOW?",q:"The other 5 savers all WITHDRAW. What is your best reply?",o:["KEEP","WITHDRAW"],a:1,w:"Keeping alone means only 1 of 6 keep, so the bank fails and you get 0. Withdrawing gets 10."},
 {h:"MEET JOHN NASH",b:"John Nash wrote his big idea in 1950, while still a graduate student at Princeton. His key paper was just two pages long, and it changed economics. Decades later he shared the 1994 Nobel Prize in economics, and the movie <i>A Beautiful Mind</i> told his life story."},
 {h:"NASH EQUILIBRIUM",b:"When <b>every</b> player is already playing a best reply, nobody can do better by switching alone. That is a <b>Nash equilibrium</b>, named for John Nash.<br><br><b>The test:</b> freeze everyone else. Would any one player gain by switching? If nobody would, it's an equilibrium."},
 {h:"THE BANK HAS TWO",r:[["ALL KEEP","15 each. Anyone who switches gets 10 instead. Nobody wants to switch."],["ALL WITHDRAW","10 each. Anyone who keeps alone gets 0. Nobody wants to switch."],["SO WHICH ONE HAPPENS?","It depends on what people expect. That's why a rumor can start a bank run, even at a healthy bank."]]},
 {h:"THE STAG HUNT",b:"An old story from the philosopher Jean-Jacques Rousseau: two hunters can team up to catch a stag (a big deer), but only if <b>both</b> stay. Either one can catch a rabbit alone.<br><br>Both hunting the stag is an equilibrium. Both chasing rabbits is too. Teamwork pays more, but only if you trust the other hunter."},
 {h:"TRY IT",b:PD,q:"In Share or Grab, is SHARE / SHARE a Nash equilibrium?",o:["Yes","No"],a:1,w:"Freeze your partner on SHARE: you'd switch to GRAB and get 5 instead of 3. Someone gains by switching, so it isn't an equilibrium."},
 {h:"EQUILIBRIUM ISN'T ALWAYS BEST",b:"GRAB / GRAB is the only equilibrium in Share or Grab, and it's the worst result for the team. An equilibrium is where things <b>settle</b>, not necessarily where they <b>should</b> be."},
 {h:"WHICH SIDE OF THE ROAD?",b:"Driving is a coordination game with two equilibria. In the US everyone drives on the right. In the UK and Japan everyone drives on the left.<br><br>Either one works, as long as <b>everyone</b> does the same thing. Nobody wants to be the one driver who switches!"},
 {h:"LAST CHECK",q:"Two friends pick a movie. Both want to sit together more than they care which movie. Both pick COMEDY. Is that an equilibrium?",o:["Yes: switching alone means sitting apart","No: someone always wants to switch"],a:0,w:"If either one switches alone, they sit apart and both lose. Nobody gains by switching."}]},
4:{t:"THINKING ABOUT THINKING",s:"Lesson 4 · about 11 minutes",S:[
 {h:"THE RULE",b:"Everyone picks a number from 1 to 100. The target is <b>two-thirds of the average</b>. Closest wins.<br><br>To win, you have to guess what everyone else will guess."},
 {h:"QUICK CHECK",q:"What is the biggest the target could ever be?",o:["100","About 67","50"],a:1,w:"Even if everyone picks 100, two-thirds of 100 is about 67."},
 {h:"CROSS THEM OUT",b:"So a guess above 67 can never win. A choice that is never your best is called <b>dominated</b>. Smart players cross those out first."},
 {h:"THE BEAUTY CONTEST",b:"In 1936 the economist John Maynard Keynes compared the stock market to a newspaper contest where readers picked the six prettiest faces from 100 photos. To win, you shouldn't pick the face <b>you</b> like best, but the one you think <b>everyone else</b> will pick.<br><br>That's why this game is often called the Keynesian beauty contest."},
 {h:"THE THINKING LADDER",r:[["LEVEL 0","Picks without thinking. The average ends up around 50."],["LEVEL 1","Thinks everyone is level 0, so guesses two-thirds of 50: about 33."],["LEVEL 2","Thinks everyone is level 1, so guesses two-thirds of 33: about 22."],["LEVEL 3","About 15. Each level down heads toward 1."]]},
 {h:"TRY IT",q:"Everyone in your class thinks at level 1. What should you guess?",o:["33","22","1"],a:1,w:"If they all guess about 33, the target is two-thirds of 33: about 22. Be one level deeper than the crowd."},
 {h:"WHAT EXPERIMENTS FOUND",b:"In 1995 the economist Rosemarie Nagel ran this game with real players. Almost half the guesses landed near <b>33</b> or <b>22</b>: level 1 and level 2 on the ladder. Most people think one or two steps ahead, not more."},
 {h:"REAL PEOPLE",b:"Perfect logic says 1. But real people don't all go that deep. When the blog <i>Wait But Why</i> ran this game with thousands of readers, the winning number was <b>15</b>.<br><br>The winning skill is to be <b>one</b> level smarter than the crowd, not ten."},
 {h:"WHERE THIS SHOWS UP",b:"• A poker player deciding whether you think they're bluffing.<br>• A quarterback guessing what the defense expects.<br>• Investors buying what they think other investors will buy next.<br><br>In each one, the winner reads the crowd one step better."},
 {h:"LAST CHECK",q:"Rock-paper-scissors: your friend knows you love rock, so they expect rock and plan to throw paper. You think one level deeper. What do you throw?",o:["Rock","Paper","Scissors"],a:2,w:"They throw paper to beat your rock, so scissors beats their paper."}]},
5:{t:"WHY RIVALS CROWD THE MIDDLE",s:"Lesson 5 · about 11 minutes",S:[
 {h:"COUNTING YOUR SHARE",b:"The beach has 10 spots with the same number of people at each. Everyone walks to the <b>nearer</b> truck."},
 {h:"EXAMPLE",r:[["FRAN AT 3, YOU AT 4","You get spots 4 to 10: 7 spots, or 70%. Fran gets spots 1 to 3: 30%."]]},
 {h:"QUICK CHECK",q:"Fran parks at 8. Where should you park?",o:["5","7","9"],a:1,w:"At 7 you get spots 1 to 7: 70%. At 5 you'd split the middle and get less."},
 {h:"YOUR BEST REPLY",b:"Park <b>right next to your rival, on the side with more beach</b>."},
 {h:"TRY IT",q:"Fran parks at 6. Best spot?",o:["5 (spots 1-5, 50%)","7 (spots 7-10, 40%)","1"],a:0,w:"Left of 6 has more beach: 5 gets spots 1 to 5, 50%."},
 {h:"WHO FIGURED THIS OUT?",b:"The economist Harold Hotelling explained this in a 1929 paper called <i>Stability in Competition</i>. His example was two shops along one street, but the same idea works for trucks on a beach."},
 {h:"THE SLIDE TO THE MIDDLE",b:"If both trucks keep doing this, they slide to the middle: spots 5 and 6, 50% each. Neither can gain by moving alone. That's a <b>Nash equilibrium</b> again!"},
 {h:"WHO LOSES?",r:[["TAP TO SEE","The beachgoers. With trucks at 5 and 6, someone at spot 1 walks 4 spots. With trucks at 3 and 8, nobody walks more than 2."]]},
 {h:"POLITICS IN THE MIDDLE",b:"In 1957 the economist Anthony Downs used the same idea for elections. Line voters up from one side of an issue to the other. Two candidates who want the most votes both drift toward the <b>middle voter</b>, just like the trucks.<br><br>It doesn't always happen in real life, but it explains a lot."},
 {h:"WHEN TRUCKS SPREAD OUT",b:"The squeeze to the middle needs every beachgoer to buy. If people at the far ends think the walk is too long and skip ice cream, a truck in the middle loses them. Then trucks do better spreading out.<br><br>Change the rules, and the best move changes too."},
 {h:"LAST CHECK",q:"Which is the same idea?",o:["Two burger places opening right next to each other","A store closing early","A shop having a sale"],a:0,w:"Rivals crowd together to grab the middle of the customers. Politicians sometimes do it too, moving toward the middle of voters' views."}]},
6:{t:"KEEP 'EM GUESSING",s:"Lesson 6 · about 11 minutes",S:[
 {h:"ZERO-SUM",b:"In a penalty kick, every goal is the keeper's loss. When one side's gain is exactly the other's loss, the game is <b>zero-sum</b>.<br><br>Share or Grab was <b>not</b>: you could both do well."},
 {h:"QUICK CHECK",q:"Which game is zero-sum?",o:["Rock-paper-scissors","Meeting a friend at the mall","Share or Grab"],a:0,w:"In rock-paper-scissors your win is exactly the other player's loss."},
 {h:"BEAT A HABIT",b:"Lefty dives LEFT 80% of the time.<br><br>Kick LEFT: 0.8 × 55 + 0.2 × 90 = <b>62%</b><br>Kick RIGHT: 0.8 × 85 + 0.2 × 45 = <b>77%</b><br><br>Against a predictable keeper, kick the other way."},
 {h:"TRY IT",q:"If you ALWAYS kick RIGHT, what will a smart keeper do?",o:["Dive LEFT","Dive RIGHT"],a:1,w:"The keeper dives RIGHT every time, and you score only 45%. Being predictable gets punished."},
 {h:"ZERO-SUM EVERYWHERE",b:"Chess, tennis, a penalty kick, a card game with one winner: all zero-sum. Whatever one side gains, the other loses.<br><br>In these games, being <b>readable</b> is the biggest mistake you can make."},
 {h:"MIX IT UP",b:"So pick at random, with the right chances. The best mix makes the keeper's guess <b>not matter</b>: kick LEFT about <b>53%</b> of the time, and you score about <b>69%</b> whichever way the keeper dives."},
 {h:"A MIXED STRATEGY",b:"Choosing at random with set chances is called a <b>mixed strategy</b>. In 1928 John von Neumann proved that every two-player zero-sum game has a best mix, so each side can guarantee itself a certain score no matter what the other does."},
 {h:"CHECK THE MATH",r:[["KEEPER DIVES LEFT","0.53 × 55 + 0.47 × 85 ≈ 69%"],["KEEPER DIVES RIGHT","0.53 × 90 + 0.47 × 45 ≈ 69%"]]},
 {h:"THE PROS DO IT",b:"Economists who studied real penalty kicks in the French and Italian top leagues (Chiappori, Levitt and Groseclose, 2002) found that kickers and goalies mix close to what game theory predicts."},
 {h:"TENNIS PROS MIX TOO",b:"Researchers Mark Walker and John Wooders studied serves in Grand Slam finals, including Wimbledon. Top players' serves to the left and right won about equally often, just as game theory predicts.<br><br>One thing people find hard: real randomness. Humans tend to switch too often, which makes them readable."},
 {h:"LAST CHECK",q:"Why does being random help in a zero-sum game?",o:["It's more fun","An opponent can't punish a pattern that isn't there","Random always scores more"],a:1,w:"If there's no pattern, your opponent has nothing to aim at."}]},
7:{t:"PRICE WARS",s:"Lesson 7 · about 11 minutes",S:[
 {h:"PROFIT",b:"<b>Profit = (price − cost) × customers.</b><br><br>Each soda costs 2 to make."},
 {h:"QUICK CHECK",q:"You charge 5 and get 40 customers. What's your profit?",o:["120","200","80"],a:0,w:"(5 − 2) × 40 = 3 × 40 = 120."},
 {h:"SAME SODA",b:"When both stores sell the same soda, everyone buys from the cheaper one. If Penny charges 10, you charge 9 and get <b>every</b> customer. Then Penny charges 8...<br><br>The undercutting stops near cost. The mathematician Joseph Bertrand described this in 1883: just two sellers can be enough for a fierce price war."},
 {h:"TRY IT",q:"Same soda. Penny charges 6. What should you charge?",o:["5: all 100 customers, 300 profit","6: split them, 200 profit","7: nobody buys"],a:0,w:"Undercutting by 1 wins everyone: (5 − 2) × 100 = 300."},
 {h:"PRICE WARS IN REAL LIFE",b:"Two gas stations across the street from each other usually post almost the same price. If one is a few cents higher, drivers just cross the street.<br><br>Airlines on the same route often match each other's fares within hours."},
 {h:"FANS CHANGE EVERYTHING",b:"When stores are <b>different</b> (taste, brand, location), a lower price steals only <b>some</b> customers. In the game:<br><b>customers = 50 + 5 × (Penny's price − yours)</b>"},
 {h:"PENNY CHARGES 12",r:[["YOU CHARGE 12","50 customers × 10 = 500"],["YOU CHARGE 11","55 customers × 9 = 495"],["YOU CHARGE 13","45 customers × 11 = 495"],["SO...","12 is best. With fans, prices settle near 12, not 2."]]},
 {h:"THE PRICE-MATCH TRICK",b:"Some stores promise: \"We'll match any lower price.\" It sounds great for shoppers. But think like a rival: if you cut your price, the other store matches it at once, so you win no new customers.<br><br>So nobody bothers cutting, and prices can stay <b>higher</b>. A promise that looks friendly can calm a price war."},
 {h:"WAYS TO WIN FANS",b:"Companies work hard to be different so they don't have to win on price alone: a special taste, a famous logo, a handy location, reward points, great service.<br><br>Every fan a brand has is a customer a rival can't steal with a small discount."},
 {h:"LAST CHECK",q:"Why do brands want loyal fans?",o:["So they don't have to win every customer with the lowest price","Fans pay nothing","Fans make the soda cheaper to make"],a:0,w:"Fans stick around even when a rival is a little cheaper, so the price war cools down."}]},
8:{t:"YOUR STRATEGY PLAYBOOK",s:"Boss warm-up · about 5 minutes",S:[
 {h:"SEVEN BIG IDEAS",b:"Tap each card to review it. Then beat three quick checks before you face the Glitch."},
 {h:"YOUR CARDS",r:[["THE FOUR PARTS","Players, moves, payoffs, information."],["DOMINANT MOVE","Best for you no matter what the other player does."],["NASH LOCK","Nobody gains by switching alone."],["LEVEL UP","Guess one level deeper than the crowd."],["MEDIAN MAGNET","Rivals slide to the middle."],["KEEP 'EM GUESSING","In a zero-sum game, mix so the other side can't punish a pattern."],["PRICE WAR","Same products: prices fall toward cost. Fans soften the war."]]},
 {h:"CHECK 1",q:"A move that is best for you no matter what anyone else does is...",o:["A Nash equilibrium","A dominant move","A focal point"],a:1,w:"Dominant: it wins in every column."},
 {h:"CHECK 2",q:"Nobody can do better by switching alone. That's...",o:["A Nash equilibrium","Zero-sum","A dominated move"],a:0,w:"That's the test for a Nash equilibrium."},
 {h:"CHECK 3",q:"Your opponent always goes LEFT. In a zero-sum game you should...",o:["Mix 50/50","Punish the habit","Copy them"],a:1,w:"A habit is a pattern you can aim at. Mixing is for when the opponent is smart."}]},
9:{t:"GO DEEPER",s:"Bonus · explore whenever you like",S:[
 {h:"YOU DID IT!",b:"You just learned the big ideas from a real college course: payoffs, dominant moves, Nash equilibrium, levels of thinking, mixing, and price wars.<br><br>Want more? Here's where to go next."},
 {h:"THE REAL COURSE",b:"Game Night was built to make the ideas in <b>Yale's Game Theory course (ECON 159)</b>, taught by Professor Ben Polak, fun and bite-sized.<br><br>The whole course is free on Open Yale Courses: 24 recorded lectures from a real Yale class, about an hour each, with problem sets and exams. It's college-level, so it's a big step up, and a great challenge.<br><br><a href=\"https://oyc.yale.edu/economics/econ-159\" target=\"_blank\" rel=\"noopener\">Open Yale Courses: Game Theory</a>"},
 {h:"PLAY MORE",b:"<b>The Evolution of Trust</b> by Nicky Case is a free interactive game (about 30 minutes) about the repeated Prisoner's Dilemma. You'll watch Tit for Tat and other strategies battle it out.<br><br><a href=\"https://ncase.me/trust/\" target=\"_blank\" rel=\"noopener\">Play The Evolution of Trust</a>"},
 {h:"READ MORE",b:"<b>The Art of Strategy</b> by Avinash Dixit and Barry Nalebuff (2008): game theory told through stories from sports, business and movies. Great for strong readers.<br><br><b>Game Theory: A Very Short Introduction</b> by Ken Binmore (2007): short, but more mathematical.<br><br><b>Introduction to Game Theory: A Discovery Approach</b> by Jennifer Firkins Nordstrom: a free online textbook where you work out the ideas yourself.<br><a href=\"https://nordstrommath.com/IntroGameTheoryText\" target=\"_blank\" rel=\"noopener\">Read it free</a>"},
 {h:"NEXT: GAME NIGHT 2",b:"So far, everyone chose at the same time. In <b>Game Night 2: Think Ahead</b>, players <b>take turns</b>: race to 21, split pirate gold, bluff with threats, and bid at auction night. Then <b>Game Night 3: The Long Game</b> takes you into trust, evolution and voting."}]}

var K={"1": ["Game theory: what you get depends on what others choose too.", "Four parts: PLAYERS, MOVES, PAYOFFS, INFORMATION.", "Coordination game: you win together or lose together.", "Focal point: the choice that stands out when you can't talk."], "2": ["Payoff table: rows are your moves, columns are theirs.", "Dominant move: best for you no matter what they do (cover a column to check).", "Share or Grab: Grab is dominant, but Grab/Grab (1 each) is worse than Share/Share (3 each).", "That trap is the Prisoner's Dilemma. Repeating the game makes trust worth something."], "3": ["Best reply: your best move if you knew what others will do.", "Nash equilibrium: nobody gains by switching alone.", "Bank: all keep (15 each) and all withdraw (10 each) are both equilibria.", "An equilibrium is where things settle, not always where they should."], "4": ["Target = two-thirds of the average, so it can never be above about 67.", "Guesses above 67 are dominated: cross them out.", "Ladder: level 1 guesses 33, level 2 guesses 22, level 3 about 15.", "Win by being one level deeper than the crowd."], "5": ["Everyone walks to the nearer truck; count the spots on your side.", "Best reply: park right next to your rival, on the bigger side.", "Both trucks slide to the middle (5 and 6): a Nash equilibrium.", "Beachgoers lose: they walk farther."], "6": ["Zero-sum: your gain is exactly the other side's loss.", "Beat a habit: Lefty dives LEFT 80%, so kick RIGHT (77% vs 62%).", "If you're predictable, a smart keeper punishes you.", "Best mix: LEFT about 53% of the time scores about 69% either way."], "7": ["Profit = (price − cost) × customers.", "Same soda: undercut by 1 and win everyone, so prices fall toward cost.", "Fans: a lower price steals only some customers.", "With fans, prices settle near 12 instead of 2."], "8": ["Four parts · Dominant move · Nash lock · Level up", "Median magnet · Keep 'em guessing · Price war"]};
(function(){var ADD={"1": {"h": "SPOT GAMES EVERYWHERE", "b": "Game theory isn't only about board games or video games. Any time your result depends on someone else's choice, you're in a game: choosing a seat on the bus, picking a group-project partner, even deciding when to text back.<br><br>Next time you're waiting in line, try naming the players, moves, payoffs and information around you."}, "2": {"h": "HOW TO SPOT A DILEMMA", "b": "Ask two questions:<br><br>1. Does each player do better by grabbing, <b>no matter what</b> the other does?<br>2. Would <b>both</b> be better off if they both shared?<br><br>If both answers are yes, it's a Prisoner's Dilemma. Try it on two neighbors deciding whether to mow the strip of grass between their houses: each hopes the other will do it, so it often doesn't get done."}, "3": {"h": "A SHORTCUT FOR TABLES", "b": "In a two-player payoff table, there's a quick trick. In each column, mark the row player's best number. In each row, mark the column player's best number. Any box with <b>both</b> marks is a Nash equilibrium.<br><br>Try it on Share or Grab: only GRAB / GRAB gets both marks."}, "4": {"h": "DON'T OVERTHINK IT", "b": "Thinking more levels isn't always better. If you guess 1 because perfect logic says so, but the crowd averages around 33, the target is about 22 and you lose by a lot.<br><br>The real skill is matching your thinking to the people you're actually playing: friends, strangers, or experts."}, "5": {"h": "PRACTICE COUNTING", "b": "A tougher one: Fran parks at 3 and you park at 9. Spot 6 is exactly halfway (3 away from each truck), so those beachgoers split. You get spots 7 to 10 plus half of spot 6: <b>45%</b>.<br><br>Parking at 4 instead gets you 70%. Getting close to your rival grabs the whole stretch on your side."}, "6": {"h": "RANDOM IS HARDER THAN IT SOUNDS", "b": "Try writing 20 \"random\" coin flips without a coin. Most people switch between heads and tails too often and avoid long streaks, but real coins often land the same way 4 or 5 times in a row.<br><br>A sharp opponent can spot your pattern. Some players use a hidden cue, like the second hand on a watch, to keep their choices truly random."}, "7": {"h": "WHY NOT JUST AGREE?", "b": "If price wars hurt both stores, why don't they just agree to keep prices high? In many countries that's against the law. It's called <b>price fixing</b>, and it hurts shoppers.<br><br>So stores look for legal ways to avoid fighting on price, like building fans and offering something different."}, "8": {"h": "THE BIG PICTURE", "b": "Every idea in Game Night 1 starts with the same move: <b>put yourself in the other player's shoes</b>. What do they want? What do they know? What do they think you'll do? Answer those, and the rest follows."}};for(var k in ADD){var S=L[k]&&L[k].S;if(!S)continue;var i=S.length-1;if(k==='8'){for(var j=0;j<S.length;j++){if(S[j].q){i=j;break}}}S.splice(i,0,ADD[k]);}})();
