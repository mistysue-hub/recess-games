<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read &amp; Explore Launchpad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space: #15103D;
    --space-deep: #0C0828;
    --nebula: #E4508F;
    --star: #FFC94A;
    --aurora: #3ED6C4;
    --moon: #F2EEFF;
    --dim: #B9B1E6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 90% at 80% 10%, #2B1C6B 0%, var(--space) 45%, var(--space-deep) 100%);
    color: var(--moon);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  main {
    position: relative; z-index: 1;
    max-width: 1080px; margin: 0 auto;
    padding: 28px 24px 32px;
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.05fr);
    gap: 40px;
    align-items: center;
    min-height: 100vh;
  }
  .porthole-wrap { position: relative; width: 100%; max-width: 480px; justify-self: center; }
  .porthole {
    width: 100%; aspect-ratio: 1; display: block;
    border-radius: 50%;
    box-shadow: 0 0 0 10px #2E2470, 0 0 0 12px #5B4CB3, 0 0 60px 14px rgba(228, 80, 143, .35);
    animation: arrive 1.1s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes arrive { from { transform: scale(.82) rotate(-14deg); opacity: 0; } to { transform: none; opacity: 1; } }

  .track { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 6px; }
  .track span { width: 7px; height: 7px; border-radius: 50%; background: #4A3F8F; }
  .track span.done { background: #8A7FD1; }
  .track span.now { width: 14px; height: 14px; background: var(--star); box-shadow: 0 0 12px 3px rgba(255, 201, 74, .7); }
  .where { color: var(--dim); font-size: 16px; margin: 0 0 18px; }

  h1 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 5.4vw, 64px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
    color: #FFF;
    text-wrap: balance;
  }
  .teaser { font-size: 20px; color: #DCD6FA; margin: 0 0 30px; max-width: 34em; }

  .ask {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 500; font-size: 26px; margin: 0 0 14px; color: var(--star);
  }
  .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .choice {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border: 2px solid #4A3F8F;
    border-radius: 18px;
    background: rgba(21, 16, 61, .72);
    color: var(--moon);
    font: 700 18px "Atkinson Hyperlegible", system-ui, sans-serif;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .choice svg { width: 40px; height: 40px; flex: none; }
  .choice:hover { border-color: var(--aurora); }
  .choice:focus-visible { outline: 3px solid var(--star); outline-offset: 3px; }
  .choice[aria-pressed="true"] { border-color: var(--star); background: rgba(255, 201, 74, .14); transform: translateY(-2px); }
  .say { min-height: 1.6em; margin: 16px 0 0; font-size: 19px; color: var(--aurora); }
  .note { margin: 26px 0 0; font-size: 15px; color: var(--dim); max-width: 36em; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; gap: 24px; padding-top: 20px; align-items: start; }
    .porthole-wrap { max-width: 300px; }
    .track { gap: 4px; }
    .track span { width: 6px; height: 6px; }
    .teaser { margin-bottom: 22px; }
  }
  @media (max-width: 420px) { .choices { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .porthole { animation: none; }
    .spin, .pulse, .drift { animation: none !important; }
  }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.5s ease-in-out infinite; }
  .drift { animation: drift 6s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.08); opacity: .85; } }
  @keyframes drift { 50% { transform: translateY(-6px); } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <div class="porthole-wrap">
    <svg class="porthole" id="scene" viewBox="0 0 400 400" role="img" aria-label=""></svg>
  </div>
  <section>
    <div class="track" id="track" aria-hidden="true"></div>
    <p class="where" id="where"></p>
    <h1 id="title"></h1>
    <p class="teaser" id="teaser"></p>
    <p class="ask">How are you reading today?</p>
    <div class="choices" id="choices">
      <button class="choice" type="button" aria-pressed="false" data-say="I'm reading on a screen.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="9" y="4" width="22" height="32" rx="4" fill="#3ED6C4"/><rect x="12" y="8" width="16" height="22" rx="1.5" fill="#15103D"/><path d="M14 13h12M14 17h12M14 21h8" stroke="#3ED6C4" stroke-width="1.6"/><circle cx="20" cy="33" r="1.4" fill="#15103D"/></svg>
        On a screen
      </button>
      <button class="choice" type="button" aria-pressed="false" data-say="I'm reading a paper book.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 10c6-2 11-1 16 2v22c-5-3-10-4-16-2z" fill="#FFC94A"/><path d="M36 10c-6-2-11-1-16 2v22c5-3 10-4 16-2z" fill="#F5A623"/><path d="M8 15c3-.5 6 0 9 1.5M8 20c3-.5 6 0 9 1.5M23 16.5c3-1.5 6-2 9-1.5M23 21.5c3-1.5 6-2 9-1.5" stroke="#15103D" stroke-width="1.4" fill="none"/></svg>
        A paper book
      </button>
      <button class="choice" type="button" aria-pressed="false" data-say="I'm listening to the audiobook.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 24v-4a12 12 0 0 1 24 0v4" stroke="#E4508F" stroke-width="3.2" fill="none"/><rect x="5" y="22" width="8" height="12" rx="3" fill="#E4508F"/><rect x="27" y="22" width="8" height="12" rx="3" fill="#E4508F"/></svg>
        An audiobook
      </button>
      <button class="choice" type="button" aria-pressed="false" data-say="I already read this chapter.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4l4.6 9.6 10.4 1.4-7.6 7.2 1.9 10.4L20 27.6l-9.3 5 1.9-10.4L5 15l10.4-1.4z" fill="#FFC94A"/></svg>
        I already read it
      </button>
    </div>
    <p class="say" id="say" aria-live="polite"></p>
    <p class="note">Read from your own copy of <i>A Short History of Nearly Everything</i> by Bill Bryson. Nothing from the book appears here.</p>
  </section>
</main>
<script>
const CHAPTERS = [["How to Build a Universe", "How the universe began, and how scientists worked out its story from the faint glow it left behind."], ["Welcome to the Solar System", "Our own solar system, and just how spread out it really is."], ["The Reverend Evans's Universe", "An amateur astronomer who spots exploding stars by eye, and what supernovas tell us about where the atoms in us came from."], ["The Measure of Things", "How scientists in the 1700s measured the Earth's size, shape and weight without ever leaving it."], ["The Stone-Breakers", "The first geologists, and their discovery that Earth is far older than anyone had imagined."], ["Science Red in Tooth and Claw", "The first dinosaur discoveries and the bitter rivalries of the people who hunted fossils."], ["Elemental Matters", "How chemists found and sorted the elements, from alchemy to the periodic table and radioactivity."], ["Einstein's Universe", "Einstein's ideas about space, time and light, and the discovery that the universe is expanding."], ["The Mighty Atom", "How scientists discovered what's inside the atom, and how strange its rules turned out to be."], ["Getting the Lead Out", "How lead was used to work out the age of the Earth, and how leaded gasoline poisoned the world."], ["Muster Mark's Quarks", "Smashing particles together to find what matter is made of, down to quarks, and the mystery of dark matter."], ["The Earth Moves", "Continental drift: an idea that was laughed at for decades before plate tectonics proved it right."], ["Bang!", "Asteroid and comet impacts, from a crater buried under Iowa to the one that ended the dinosaurs."], ["The Fire Below", "What lies deep inside the Earth, and how earthquakes revealed it."], ["Dangerous Beauty", "Yellowstone's supervolcano and other volcanoes: how they work and how dangerous they can be."], ["Lonely Planet", "How narrow the conditions for life are, and why Earth turned out to be just right."], ["Into the Troposphere", "The atmosphere: its layers, its weather, and the daring early balloon flights that explored it."], ["The Bounding Main", "The oceans: how deep they go, how little of them we've explored, and how hard we fish them."], ["The Rise of Life", "How life might have begun from plain chemistry, and how tiny microbes filled the air with oxygen."], ["Small World", "Bacteria, viruses and the rest of the invisible living world, all around and inside us."], ["Life Goes On", "Why so few living things ever become fossils, and the strange early animals of the Burgess Shale."], ["Good-bye to All That", "Life moving from the sea onto land, and the great extinctions that wiped most of it out again."], ["The Richness of Being", "Naming and counting Earth's species, and how many we still haven't found."], ["Cells", "Cells: how many make up a body, and the busy machinery inside each one."], ["Darwin's Singular Notion", "Charles Darwin, his voyage, and the idea of evolution by natural selection."], ["The Stuff of Life", "Heredity, from Gregor Mendel's pea plants to the discovery of the shape of DNA."], ["Ice Time", "Ice ages: what causes them, and how scientists worked it out."], ["The Mysterious Biped", "The fossils of our early ancestors, and what they tell us about when we started walking upright."], ["The Restless Ape", "How early humans spread out of Africa and across the whole world."], ["Good-bye", "How humans have driven other species extinct, and a closing reflection on our responsibility for life on Earth."]]
;

const SCENE_FOR = {1:"bigbang",2:"solar",3:"supernova",4:"measure",5:"strata",6:"dino",7:"elements",8:"galaxy",9:"atom",10:"hourglass",
  11:"collider",12:"plates",13:"impact",14:"core",15:"volcano",16:"habitable",17:"sky",18:"ocean",19:"cells",20:"virus",
  21:"shale",22:"extinction",23:"tree",24:"bigcell",25:"ship",26:"dna",27:"ice",28:"footprints",29:"migration",30:"turtle"};
const ALT = {bigbang:"A bright burst of light with galaxies flying outward",solar:"The Sun and planets on their orbits",supernova:"An exploding star inside a glowing cloud",
  measure:"Earth with a grid of lines and a measuring triangle",strata:"Rock layers with fossils inside",dino:"A long-necked dinosaur at sunset",
  elements:"Floating tiles of chemical elements",galaxy:"A spiral galaxy with other galaxies moving away",atom:"An atom with electrons circling its nucleus",
  collider:"Particle tracks bursting out of a collision",plates:"Earth's continents drifting apart",impact:"A fiery asteroid heading toward Earth",
  core:"Earth cut open to show its layers",volcano:"An erupting volcano",habitable:"A star with a green zone where water could be liquid",
  sky:"A balloon rising through layers of sky",ocean:"A diving sphere sinking into the deep ocean",cells:"Cells and microbes under a microscope",
  tree:"A branching tree of life",dna:"A twisting strand of DNA",ice:"A woolly mammoth in an icy landscape",footprints:"A trail of ancient footprints",
  migration:"Paths spreading across the globe",turtle:"A sea turtle swimming in the ocean",hourglass:"An hourglass with rock layers instead of sand",virus:"A virus and bacteria seen up close",shale:"Dark rock layers holding strange spiky fossils",extinction:"A dinosaur watching a fireball streak across the sky",bigcell:"One cell opened up to show the parts inside",ship:"A sailing ship on the open ocean"};

// Small seeded random so every chapter's scene looks the same each time.
function rng(seed){ let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rng(42);
const r = (a,b) => a + R()*(b-a);

function starsInside(n, color="#fff"){ let o=""; for(let i=0;i<n;i++){ o+=`<circle cx="${r(10,390).toFixed(1)}" cy="${r(10,390).toFixed(1)}" r="${r(.4,1.6).toFixed(2)}" fill="${color}" opacity="${r(.3,1).toFixed(2)}"/>`; } return o; }
function globe(cx,cy,rad,id,ocean1="#4FA3E3",ocean2="#1B4C9A"){
  return `<defs><radialGradient id="${id}" cx="35%" cy="30%"><stop offset="0" stop-color="${ocean1}"/><stop offset="1" stop-color="${ocean2}"/></radialGradient></defs><circle cx="${cx}" cy="${cy}" r="${rad}" fill="url(#${id})"/>`;
}
const SPACE_BG = `<rect width="400" height="400" fill="#0E0A2B"/>`;

const SCENES = {
  bigbang(){
    let g = `<defs><radialGradient id="bb"><stop offset="0" stop-color="#FFF8DD"/><stop offset=".14" stop-color="#FFB547"/><stop offset=".38" stop-color="#D93A7E"/><stop offset=".72" stop-color="#2E1770"/><stop offset="1" stop-color="#0C0828"/></radialGradient></defs><rect width="400" height="400" fill="url(#bb)"/>`;
    g += `<g class="pulse">` + [70,115,160].map(x=>`<circle cx="200" cy="200" r="${x}" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>`).join("") + `</g>`;
    for(let i=0;i<22;i++){ const a=r(0,6.28), d=r(95,190); g+=`<ellipse cx="${(200+Math.cos(a)*d).toFixed(1)}" cy="${(200+Math.sin(a)*d).toFixed(1)}" rx="${r(3,8).toFixed(1)}" ry="${r(1.2,3).toFixed(1)}" transform="rotate(${r(0,180).toFixed(0)} ${(200+Math.cos(a)*d).toFixed(1)} ${(200+Math.sin(a)*d).toFixed(1)})" fill="${["#FFE7A8","#FFC1DD","#BDE9FF"][i%3]}" opacity=".85"/>`; }
    return g + `<circle cx="200" cy="200" r="20" fill="#fff"/>`;
  },
  solar(){
    let g = SPACE_BG + starsInside(70) + `<defs><radialGradient id="sun"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".6" stop-color="#FFB13B"/><stop offset="1" stop-color="#F0602E"/></radialGradient></defs>`;
    const c = [-60, 230];
    [190,230,270,320,380,440].forEach(rad=> g+=`<circle cx="${c[0]}" cy="${c[1]}" r="${rad}" fill="none" stroke="#fff" stroke-opacity=".14"/>`);
    g += `<circle cx="${c[0]}" cy="${c[1]}" r="160" fill="url(#sun)"/>`;
    const P = [[190,-.30,5,"#B9B3A8"],[230,-.12,8,"#F1C27D"],[270,-.38,9,"#3E8EDE"],[320,-.05,7,"#D9542E"],[380,-.30,26,"#E0B07A"],[440,-.10,19,"#EBD49A"]];
    P.forEach(([rad,a,s,col],i)=>{ const x=c[0]+Math.cos(a)*rad, y=c[1]+Math.sin(a)*rad;
      if(i===5) g+=`<ellipse cx="${x}" cy="${y}" rx="${s*2}" ry="${s*.55}" fill="none" stroke="#F6E2B3" stroke-width="3" transform="rotate(-18 ${x} ${y})"/>`;
      g+=`<circle cx="${x}" cy="${y}" r="${s}" fill="${col}"/>`;
      if(i===4) g+=`<path d="M${x-24} ${y-5}h48M${x-25} ${y+4}h50M${x-20} ${y+12}h40" stroke="#B5794A" stroke-width="3" opacity=".7"/>`;
    });
    return g;
  },
  supernova(){
    let g = SPACE_BG + starsInside(80) + `<defs><filter id="blur"><feGaussianBlur stdDeviation="7"/></filter><radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#BFF6FF"/><stop offset="1" stop-color="#3ED6C4" stop-opacity="0"/></radialGradient></defs>`;
    g += `<g filter="url(#blur)" class="pulse"><ellipse cx="200" cy="200" rx="140" ry="120" fill="none" stroke="#E4508F" stroke-width="22" opacity=".7"/><ellipse cx="205" cy="195" rx="110" ry="128" fill="none" stroke="#3ED6C4" stroke-width="14" opacity=".6"/><ellipse cx="195" cy="205" rx="90" ry="70" fill="none" stroke="#FFC94A" stroke-width="10" opacity=".55"/></g>`;
    g += `<circle cx="200" cy="200" r="70" fill="url(#core)"/><path d="M200 120 L210 190 L280 200 L210 210 L200 280 L190 210 L120 200 L190 190Z" fill="#fff"/>`;
    return g;
  },
  measure(){
    let g = SPACE_BG + starsInside(60) + globe(200,210,135,"m");
    for(let k=1;k<=4;k++) g+=`<ellipse cx="200" cy="210" rx="${135*k/4.4}" ry="135" fill="none" stroke="#fff" stroke-opacity=".28"/>`;
    [-90,-45,0,45,90].forEach(y=>{ const w=Math.sqrt(135*135-y*y); g+=`<line x1="${200-w}" y1="${210+y}" x2="${200+w}" y2="${210+y}" stroke="#fff" stroke-opacity=".28"/>`; });
    g += `<path d="M120 170 L250 120 L285 250 Z" fill="#FFC94A" fill-opacity=".14" stroke="#FFC94A" stroke-width="3" stroke-dasharray="7 6"/>`;
    [[120,170],[250,120],[285,250]].forEach(([x,y])=> g+=`<circle cx="${x}" cy="${y}" r="7" fill="#FFC94A"/>`);
    return g;
  },
  strata(){
    let g = `<defs><linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E1A6B"/><stop offset="1" stop-color="#E4508F"/></linearGradient></defs><rect width="400" height="400" fill="url(#dusk)"/>`;
    const cols = ["#C99A5B","#A86B3C","#E3B977","#7A4A2A","#B3794B","#5E3B2A"];
    cols.forEach((c,i)=>{ const y=150+i*42; g+=`<path d="M0 ${y} Q100 ${y-18} 200 ${y+4} T400 ${y-6} V400 H0Z" fill="${c}"/>`; });
    // ammonite
    let sp=""; for(let t=0;t<14;t+=.2){ const rad=2+t*1.9; sp+=(t?"L":"M")+(130+Math.cos(t)*rad).toFixed(1)+" "+(250+Math.sin(t)*rad).toFixed(1); }
    g += `<path d="${sp}" fill="none" stroke="#3D2516" stroke-width="3"/>`;
    // trilobite
    g += `<g transform="translate(270 325) rotate(-15)"><ellipse rx="26" ry="16" fill="#3D2516"/><ellipse cx="-24" rx="9" ry="12" fill="#3D2516"/>` + [-12,-4,4,12].map(x=>`<line x1="${x}" y1="-15" x2="${x}" y2="15" stroke="#B3794B" stroke-width="2"/>`).join("") + `</g>`;
    return g;
  },
  dino(){
    let g = `<defs><linearGradient id="set" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E1A6B"/><stop offset=".55" stop-color="#E4508F"/><stop offset=".85" stop-color="#FFB547"/></linearGradient></defs><rect width="400" height="400" fill="url(#set)"/>`;
    g += `<circle cx="270" cy="230" r="60" fill="#FFE08A" opacity=".9"/>`;
    g += `<path d="M0 330 L60 250 L95 285 L140 230 L200 330 Z" fill="#7A2E6B" opacity=".7"/>`;
    g += `<rect y="330" width="400" height="70" fill="#1A1036"/>`;
    const D="#1A1036";
    g += `<g fill="${D}" transform="translate(-10 -4)"><ellipse cx="200" cy="270" rx="70" ry="34"/><path d="M245 258 C285 230 300 170 310 120 L326 124 C320 175 300 245 262 282Z"/><ellipse cx="322" cy="118" rx="18" ry="9"/>`
       + `<path d="M135 268 C90 270 50 300 10 330 L14 336 C60 312 100 292 140 288Z"/>`
       + `<rect x="160" y="290" width="17" height="44" rx="6"/><rect x="185" y="292" width="17" height="42" rx="6"/><rect x="225" y="290" width="17" height="44" rx="6"/><rect x="248" y="288" width="17" height="46" rx="6"/></g>`;
    g += `<g fill="${D}" transform="translate(-6 0)"><path d="M70 334 C72 270 78 240 90 200 L95 201 C86 245 82 280 80 330Z"/><path d="M92 200 C70 190 55 200 45 215 C65 200 80 202 92 204Z M92 200 C110 182 130 186 140 196 C122 190 108 196 94 204Z M92 200 C85 178 92 165 104 158 C96 172 96 186 95 202Z"/></g>`;
    return g;
  },
  elements(){
    let g = `<defs><radialGradient id="lab" cx="50%" cy="40%"><stop offset="0" stop-color="#3B2A8C"/><stop offset="1" stop-color="#120C33"/></radialGradient></defs><rect width="400" height="400" fill="url(#lab)"/>` + starsInside(30,"#BDB3FF");
    const T=[["H",1,"#3ED6C4"],["He",2,"#E4508F"],["C",6,"#FFC94A"],["N",7,"#7FB2FF"],["O",8,"#3ED6C4"],["Fe",26,"#F08A5D"],["Au",79,"#FFC94A"],["Pb",82,"#A9A3D9"],["U",92,"#9BE564"]];
    T.forEach(([s,n,c],i)=>{ const col=i%3, row=Math.floor(i/3); const x=78+col*86+r(-6,6), y=78+row*86+r(-6,6), rot=r(-10,10).toFixed(1);
      g+=`<g transform="translate(${x} ${y}) rotate(${rot})" class="drift" style="animation-delay:${(i*.4).toFixed(1)}s"><rect width="72" height="72" rx="10" fill="${c}"/><text x="8" y="20" font-family="Atkinson Hyperlegible, sans-serif" font-size="14" font-weight="700" fill="#15103D">${n}</text><text x="36" y="56" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="32" font-weight="800" fill="#15103D">${s}</text></g>`; });
    return g;
  },
  galaxy(){
    let g = SPACE_BG + starsInside(60) + `<defs><radialGradient id="gc"><stop offset="0" stop-color="#FFF4D6"/><stop offset=".5" stop-color="#FFC94A" stop-opacity=".6"/><stop offset="1" stop-color="#E4508F" stop-opacity="0"/></radialGradient></defs>`;
    let arms=""; for(let arm=0;arm<2;arm++){ for(let t=0;t<5.2;t+=.04){ const rad=10+t*26+r(-6,6), a=t*1.15+arm*Math.PI+r(-.12,.12);
      arms+=`<circle cx="${(200+Math.cos(a)*rad).toFixed(1)}" cy="${(200+Math.sin(a)*rad*.62).toFixed(1)}" r="${r(.8,2.6).toFixed(1)}" fill="${R()>.5?"#BDE9FF":"#FFD1E6"}" opacity="${r(.5,1).toFixed(2)}"/>`; } }
    g += `<g transform="rotate(-20 200 200)"><g class="spin">${arms}</g></g><circle cx="200" cy="200" r="46" fill="url(#gc)"/>`;

    let g = `<defs><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FA9D6"/><stop offset="1" stop-color="#0E3C6E"/></linearGradient></defs><rect width="400" height="400" fill="url(#sea)"/>`;
    ["#5C6378","#474D61","#6B7288","#3B4052","#585E73"].forEach((c,i)=>{ const y=170+i*46; g+=`<path d="M0 ${y} Q120 ${y-14} 220 ${y+6} T400 ${y-4} V400 H0Z" fill="${c}"/>`; });
    g += `<g stroke="#D9E1F0" stroke-width="3" stroke-linecap="round" fill="none"><path d="M90 250 C130 240 170 245 210 255"/>` + [100,120,140,160,180,200].map(x=>`<path d="M${x} ${248-(x-90)*.05} l-6 -18"/><path d="M${x} ${250-(x-90)*.05} l3 14"/>`).join("") + `<circle cx="214" cy="256" r="5" fill="#D9E1F0"/></g>`;
    g += `<g transform="translate(270 330) rotate(10)" fill="#D9E1F0"><ellipse rx="38" ry="14"/>` + [-24,-12,0,12,24].map(x=>`<ellipse cx="${x}" cy="0" rx="5" ry="20" opacity=".6"/>`).join("") + `<path d="M-38 -4 C-55 -20 -62 -8 -52 2 M-38 4 C-55 20 -62 8 -52 -2" stroke="#D9E1F0" stroke-width="3" fill="none"/></g>`;
    for(let i=0;i<10;i++) g+=`<circle cx="${r(60,340).toFixed(0)}" cy="${r(20,140).toFixed(0)}" r="${r(2,4).toFixed(1)}" fill="none" stroke="#fff" stroke-opacity=".5"/>`;
    return g;
  },
  extinction(){
    let g = SCENES.dino();
    g += `<defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3B0" stop-opacity="0"/><stop offset="1" stop-color="#FFF3B0"/></linearGradient></defs><path d="M30 40 L150 120 L140 132Z" fill="url(#fb)"/><circle cx="148" cy="126" r="9" fill="#FFF3B0" class="pulse"/>`;
    return g;
  },
  bigcell(){
    let g = `<defs><radialGradient id="bc"><stop offset="0" stop-color="#FFE3EF"/><stop offset="1" stop-color="#F59AC1"/></radialGradient></defs><rect width="400" height="400" fill="#2A1A5E"/>`;
    g += `<circle cx="200" cy="200" r="175" fill="url(#bc)" stroke="#C93A7A" stroke-width="8"/>`;
    g += `<circle cx="200" cy="190" r="58" fill="#7A4FC9"/><circle cx="215" cy="180" r="18" fill="#3B1F80"/>`;
    [[110,130,30],[290,270,-20],[120,280,60]].forEach(([x,y,a])=> g+=`<g transform="rotate(${a} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="34" ry="16" fill="#FF8A3D" stroke="#C9531A" stroke-width="3"/><path d="M${x-24} ${y} q6 -10 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#C9531A" stroke-width="2.5"/></g>`);
    g += `<g fill="none" stroke="#3ED6C4" stroke-width="5" stroke-linecap="round"><path d="M270 120 q30 10 40 40"/><path d="M262 135 q24 8 32 32"/><path d="M254 150 q18 6 24 24"/></g>`;
    for(let i=0;i<26;i++) g+=`<circle cx="${r(60,340).toFixed(0)}" cy="${r(60,340).toFixed(0)}" r="3" fill="#C93A7A" opacity=".5"/>`;
    return g;
  },
  ship(){
    let g = `<defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset=".5" stop-color="#E4508F"/><stop offset="1" stop-color="#2E1A6B"/></linearGradient></defs><rect width="400" height="400" fill="url(#sh)"/>`;
    g += `<circle cx="300" cy="150" r="38" fill="#FFE08A"/>`;
    g += `<rect y="270" width="400" height="130" fill="#1B3C7A"/>` + [290,315,345,375].map((y,i)=>`<path d="M0 ${y} q25 -8 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#5FB3F0" stroke-opacity="${.6-i*.1}" stroke-width="3"/>`).join("");
    g += `<g class="drift"><path d="M90 268 H300 L280 300 H112Z" fill="#3D2516"/><g stroke="#3D2516" stroke-width="4"><line x1="140" y1="268" x2="140" y2="120"/><line x1="195" y1="268" x2="195" y2="95"/><line x1="250" y1="268" x2="250" y2="125"/><line x1="195" y1="95" x2="310" y2="262"/></g>`;
    g += [[140,130,46],[195,105,56],[250,135,44]].map(([x,y,w])=>`<path d="M${x-w/2} ${y} Q${x} ${y+10} ${x+w/2} ${y} L${x+w/2+4} ${y+48} Q${x} ${y+60} ${x-w/2-4} ${y+48}Z" fill="#FFF7E6"/><path d="M${x-w/2-2} ${y+64} Q${x} ${y+72} ${x+w/2+2} ${y+64} L${x+w/2+6} ${y+108} Q${x} ${y+120} ${x-w/2-6} ${y+108}Z" fill="#FFF7E6"/>`).join("") + `<path d="M195 92 l14 5 l-14 5z" fill="#E4508F"/></g>`;
    return g;
  },
  turtle(){
    let g = `<defs><radialGradient id="tw" cx="50%" cy="20%"><stop offset="0" stop-color="#5FD3EE"/><stop offset="1" stop-color="#0E4C8A"/></radialGradient></defs><rect width="400" height="400" fill="url(#tw)"/>`;
    g += `<g fill="#fff" opacity=".1"><path d="M120 0h40L110 400H80Z"/><path d="M260 0h30L260 400h-24Z"/></g>`;
    g += `<g class="drift"><g transform="translate(200 210) rotate(-25)">`
      + `<path d="M-40 -40 C-90 -80 -120 -60 -110 -40 C-95 -25 -70 -25 -45 -20Z" fill="#3E7A4E"/><path d="M40 -40 C90 -80 120 -60 110 -40 C95 -25 70 -25 45 -20Z" fill="#3E7A4E"/>`
      + `<path d="M-35 45 C-60 70 -70 80 -60 90 C-45 85 -35 70 -25 55Z" fill="#3E7A4E"/><path d="M35 45 C60 70 70 80 60 90 C45 85 35 70 25 55Z" fill="#3E7A4E"/>`
      + `<ellipse cx="0" cy="-88" rx="18" ry="22" fill="#4F8C5E"/><circle cx="-8" cy="-96" r="3" fill="#12301E"/><circle cx="8" cy="-96" r="3" fill="#12301E"/>`
      + `<ellipse rx="62" ry="78" fill="#7A5A32"/>`
      + `<path d="M0 -50 L22 -32 L22 -4 L0 12 L-22 -4 L-22 -32Z M0 12 L22 28 L18 52 L0 62 L-18 52 L-22 28Z M22 -32 L46 -38 L52 -10 L22 -4Z M-22 -32 L-46 -38 L-52 -10 L-22 -4Z M22 28 L50 20 L44 46 L18 52Z M-22 28 L-50 20 L-44 46 L-18 52Z" fill="#A57B45" stroke="#5A3F1F" stroke-width="2"/></g></g>`;
    [[70,90],[330,80],[90,330],[320,330]].forEach(([x,y],i)=> g+=`<path d="M${x} ${y} q10 -7 20 0 q-10 7 -20 0z M${x+20} ${y} l7 -5 v10z" fill="${i%2?"#FFC94A":"#E4508F"}"/>`);
    for(let i=0;i<10;i++) g+=`<circle cx="${r(150,260).toFixed(0)}" cy="${r(20,90).toFixed(0)}" r="${r(2,4).toFixed(1)}" fill="none" stroke="#fff" stroke-opacity=".6"/>`;
    return g;
  }
};

const params = new URLSearchParams(location.search);
let ch = parseInt(params.get("ch") || params.get("chapter") || "1", 10);
if (!(ch >= 1 && ch <= 30)) ch = 1;
const [title, teaser] = CHAPTERS[ch-1];
const sceneName = SCENE_FOR[ch];

document.title = `Chapter ${ch}: ${title}`;
document.getElementById("title").textContent = title;
document.getElementById("teaser").textContent = teaser;
document.getElementById("where").textContent = `Chapter ${ch} of 30`;
const track = document.getElementById("track");
for (let i = 1; i <= 30; i++) { const s = document.createElement("span"); if (i === ch) s.className = "now"; else if (i < ch) s.className = "done"; track.appendChild(s); }
const svg = document.getElementById("scene");
svg.innerHTML = `<defs><clipPath id="port"><circle cx="200" cy="200" r="200"/></clipPath></defs><g clip-path="url(#port)">${SCENES[sceneName]()}</g>`;
svg.setAttribute("aria-label", ALT[sceneName]);

const say = document.getElementById("say");
document.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".choice").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
  say.textContent = `Tell Rocky: “${btn.dataset.say}”`;
}));

// Twinkling starfield behind everything.
(function(){
  const c = document.getElementById("sky"), x = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [];
  function size(){ c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    const n = Math.round(innerWidth * innerHeight / 3500);
    stars = Array.from({length:n}, () => ({x:Math.random()*c.width, y:Math.random()*c.height, r:(Math.random()*1.3+.3)*devicePixelRatio, p:Math.random()*6.28, s:Math.random()*.02+.005})); }
  function draw(t){ x.clearRect(0,0,c.width,c.height);
    for (const s of stars){ const a = still ? .7 : .45 + .55*Math.abs(Math.sin(s.p + t*s.s*.06)); x.globalAlpha = a; x.fillStyle = "#fff"; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.28); x.fill(); }
    if (!still) requestAnimationFrame(draw); }
  addEventListener("resize", () => { size(); if (still) draw(0); });
  size(); requestAnimationFrame(draw);
})();
</script>
