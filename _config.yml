# GitHub Pages configuration.
#
# The `exclude` list keeps Rocky-only files out of the published site.
# Rocky reads these from the repository itself, not from Pages, so excluding
# them from the build has no effect on the course — it just stops a student's
# browser from rendering the raw file if a Notes URL ever leaks into chat.

exclude:
  - "**/*Notes.md"
  - "**/*NOTES.md"
  - "**/AGENTS.md"
  - "workspace/"
